owork 和 Claude Code，已有 Claude 对话、connector 与编码流程的用户不需要另装一套 agent 工作台。OpenClaw 对应的是另一层：它更像可自托管的 agent 运行层，可接入配对设备、模型、工具和插件，Computer Use 只是其中一个工具。Claude 这次没有开放一套可自行编排、换模型、部署节点的 agent 平台；它交付的是 Claude Desktop 内置的一项受权限约束的产品功能。后台执行只限 macOS 15+Windows 版 Claude Desktop 也支持 Computer Use，但官方说明里只有 macOS 15+ 明确支持后台窗口：Claude 不占用鼠标和键盘。使用时电脑必须保持唤醒，Claude Desktop 也要一直开着；第一次需要全屏操作时，会请求本次会话的权限。权限和截图是使用门槛每个应用都要单独授权。Claude 会截取桌面与已授权应用的画面，用来判断下一步该点哪里；官方也明确提醒，这套功能没有把 Claude 和你的桌面、应用或浏览器隔离开。因此别先拿网银、医疗、政务系统或含敏感个人信息的页面试。网页里的恶意提示也可能诱导模型误操作，复杂的多步骤任务有时需要再试一次。适合先从哪些事开始(1) 在本地文件和常用应用之间整理非敏感资料(2) 让 Claude 按步骤测试自己正在开发的桌面应用或网页流程(3) 在已配置 connector 之外，补上少量需要真实点击的重复操作对 Claude Code 用户来说，真正的新变化是：跨应用的小任务不必一直盯着自动化窗口。但它更适合先做可逆、低风险的操作，别把“能点屏幕”理解成可以放心交出整台电脑。", "excerpt": "Claude能后台操作Mac，限Pro/MaxClaude 把 Computer Use 放进了 Claude Desktop：在 Cowork 或 Claude Code 里，它可以打开被授权的应用、点击、输入和浏览页面；macOS 15 及以上版本还能让它在后台窗口执行，你继续处理自己的事。这不是把电脑完全交给 Claude。它会优先走已连接的 connector；没有 connector 时", "url": "https://www.zhihu.com/pin/2079014401668034678", "votes": 0, "comments": 0, "feed_ts": 1788455679, "feed_time_str": "09-04 01:14", "category": "pin", "cat_name": "想法动态"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "内存相差百万倍！单片机和CPU的区别？视频简介请看视频_", "excerpt": "内存相差百万倍！单片机和CPU的区别？视频简介请看视频_", "url": "https://www.zhihu.com/pin/2079013439259919542", "votes": 0, "comments": 0, "feed_ts": 1788455430, "feed_time_str": "09-04 01:10", "category": "pin", "cat_name": "想法动态"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待/评价孙宇晨最新回应《再致胡锡进老师——什么才是体面》？", "excerpt": "一想到这俩人中有一个会赢，我就难受。 又一想到还有李新野老师跟孙哥双星闪耀，未来40年在互联网上还要看到他们发挥。 有时候三体人打过来也挺好。 ", "url": "https://www.zhihu.com/question/2078964361494904913/answer/2079008584525006400", "votes": 351, "comments": 72, "feed_ts": 1788454273, "feed_time_str": "09-04 00:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude开源电商导购和商家助手代码可以把它先理解成“淘宝/京东里的导购助手 + 商家后台运营助手”的示例代码：前台帮用户找商品、比较和组购物车；后台协助看库存、定价和营销活动。Anthropic 这次开源的 Claude Commerce Agents，包含可运行代码、后端接口、权限控制和测试脚本；它与淘宝、京东等平台没有官方集成关系，真实交易、鉴权和业务规则仍由接入团队负责。两种角色，四个可运行行业示例仓库里有面向消费者的 shopping agent 和给运营人员使用的 merchant agent，并给出零售、旅行、电信、娱乐四类示例。前者会搜索、比较、规划和生成购物车；后者处理经营分析、库存告警、定价促销和营销活动。它支持 Messages API、Claude Agent SDK 和 Managed Agents 三种运行方式，还附了 Claude Code 插件，能根据自家后端搭建或审查 commerce agent。交易权不交给模型这套模板最值得看的部分，是把高风险动作锁在 harness 里。模型可以生成购物车、提出调价或库存修改建议；扣款、下单和线上商品改动留给宿主系统。merchant 侧的写操作先生成待批准的变更，必须由人或宿主系统的审批界面执行。仓库还要求写入和展示只能接受服务端本次会话签发过的 ID。用户输入、商品评论或模型自己编出的 ID，不能直接进入订单、价格等后端接口。对电商和运营场景，这比“模型会调用工具”更接近能不能上线的分界线。速度和成本Anthropic工程文档给的优化思路：把可能用到的上下文提前装入、并行调用互不依赖的工具、在工具参数流出时尽早执行；它把完成一次任务的总时长拆成模型轮次、生成时间和工具处理时间。成本也按“每个完成任务”衡量，而不是按单次模型调用衡量。文档建议把全局 prompt、工具定义和稳定会话信息做成可复用前缀，并用评测同时扫质量、p50/p99 延迟和成本。官方给出的经验是，购物类 consumer agent 往往更看重延迟，复杂 merchant 任务则可能需要更高能力的模型来减少回合数。效果Anthropic 称，使用 Claude 的零售商观察到购物车规模最高增加 35%，购买完成概率提高 60%。这些是企业客户结果，缺少公开统一 benchmark、样本、对照组和行业拆分，不能直接推成所有电商接入后的预期增幅。", "excerpt": "Claude开源电商导购和商家助手代码可以把它先理解成“淘宝/京东里的导购助手 + 商家后台运营助手”的示例代码：前台帮用户找商品、比较和组购物车；后台协助看库存、定价和营销活动。Anthropic 这次开源的 Claude Commerce Agents，包含可运行代码、后端接口、权限控制和测试脚本；它与淘宝、京东等平台没有官方集成关系，真实交易、鉴权和业务规则仍由接入团队负责。两种角色，四个可", "url": "https://www.zhihu.com/pin/2078999896821180223", "votes": 0, "comments": 0, "feed_ts": 1788452249, "feed_time_str": "09-04 00:17", "category": "pin", "cat_name": "想法动态"}, {"actor": "林为珮", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "这个问题下的回答没考虑到一点，就是港中深是一所没有高考录取分数线、实行自主招生的高校，因而看不起高考排位靠后的室友，不见得是因为优绩主义作祟，也有可能是因为进了学校，了解了其他同学的高考分数之后，感觉自己被招生办坑了这又要结合港中深模糊的定位来看。港中文和港大近十年来在大陆人心目中的地位可谓一落千丈，十年前依靠对香港的滤镜、注水的QS排名和每年高考季必有的「抢状元」炒作，港中文和港大在大陆人心目中和清北是一个档次的。近十年来国内高校飞速发展（虽然无数青年教师和学生沦为燃料），港校的地位日趋下降，现在恐怕没什么人觉得港大和清北一个档次了，这从近年的录取分数线就看得出来：2000-2016年，港大在大陆的生源甚至可以说比清北更好，拿走了更多的状元；而现在港大的生源基本是华五热门专业的水平，即便考虑到长远发展（能通过港大多元评价的，基本是家境较好、综合素质较强的学生），也很难再和清北比了国内的中外合作办学或境外分校，基本要比本校低半到一档看。比如浙大的中外合作办学项目，在浙江的实际录取分数线是浙大最靠后的。而因为港中文本校现在也卡在华五层次了，港中深的定位就比较尴尬了。校方肯定要宣称自己是华五同档的，不比浙复交差。但实际认可度呢？起码我高考的前后几年，考虑报港中深的，都是上不了浙大或挑不了浙大好专业的学生。我如果高考再低几分，可能也去港中深了。也就是说，港中深是逊于华五的，最多算中9但每年也有高分考生进港中深的，一般要么是喜欢港校的环境，要么是笃定硕博阶段去留学的（或兼而有之）。港中深在招生宣传的时候，从来只会派出各省的高分考生。比方说我那届来招生宣讲的，是一个670+的学姐和一个665+学长；下一届我听说有675+的学姐，这个分数走三位一体上复交都有希望。港中深招办就拼命忽悠学生，说它的生源与浙大同档、能和复交掰掰手腕。但其实，港中深别说复交科南了，浙大也是赶不上的因而有高分的学生误信宣传，兴冲冲地报了港中深，入学之后感到后悔，其实是很正常的。港中深的校长公开讲这番话，多少也有些不真诚在里面，毕竟如果港中深真的奉行「给我中9级别的生源，还你清北档次的人才」的话，为什么要在招生宣传的过程中夸大其词呢？", "excerpt": "这个问题下的回答没考虑到一点，就是港中深是一所没有高考录取分数线、实行自主招生的高校，因而看不起高考排位靠后的室友，不见得是因为优绩主义作祟，也有可能是因为进了学校，了解了其他同学的高考分数之后，感觉自己被招生办坑了这又要结合港中深模糊的定位来看。港中文和港大近十年来在大陆人心目中的地位可谓一落千丈，十年前依靠对香港的滤镜、注水的QS排名和每年高考季必有的「抢状元」炒作，港中文和港大在大陆人心目中", "url": "https://www.zhihu.com/pin/2078964324010301254", "votes": 0, "comments": 3, "feed_ts": 1788450563, "feed_time_str": "09-03 23:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "我想知道，义和团是从何时起被污名化的？1899年是一个分界线。这之前叫做义和拳，这之后叫义和团。慈禧太后认同了山东巡抚的主张，决定给予其合法身份，改拳为团。由此，一部分拳民拿了朝廷的钱粮，提出了“扶清灭洋”。但是，并不是所有的义和拳都接受了朝廷的招抚，其中绝大部分依然我行我素。这部分坚持“反清灭洋”的拳民，就是抵抗八国联军的主力，也是被清廷镇压的对象。问题在于，这场运动被镇压后，这部分人的声音消失了。清政府与列强将其定性为“义和团运动”，主张“扶清灭洋”，愚昧野蛮。这个名称从一开始就设计好了，用它淹没了全部的真相。我想知道，义和团是从何时起被污名化的？ #如何评价义和团  #日寇  #解放战争年代 ", "excerpt": "我想知道，义和团是从何时起被污名化的？1899年是一个分界线。这之前叫做义和拳，这之后叫义和团。慈禧太后认同了山东巡抚的主张，决定给予其合法身份，改拳为团。由此，一部分拳民拿了朝廷的钱粮，提出了“扶清灭洋”。但是，并不是所有的义和拳都接受了朝廷的招抚，其中绝大部分依然我行我素。这部分坚持“反清灭洋”的拳民，就是抵抗八国联军的主力，也是被清廷镇压的对象。问题在于，这场运动被镇压后，这部分人的声音消失", "url": "https://www.zhihu.com/pin/2078989544779682180", "votes": 0, "comments": 0, "feed_ts": 1788449735, "feed_time_str": "09-03 23:35", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "我想知道，义和团是从何时起被污名化的？", "excerpt": "对义和团的负面评价，就是从这个名称开始。 1899年是一个分界线。 这之前叫做义和拳，这之后叫义和团。 义和团三字，1898年6月，第一次出现在山东巡抚张汝梅给慈禧太后的奏章里。目的就是分化义和拳。团就是民团的意思。地方武装，自筹经费，朝廷补贴，其规模和行动受朝廷节制。 义和拳在山东各地针对基督教展开武装斗争，杀死教民神父无数。各国公使强令清廷镇压。张汝梅镇压义和拳不利，被革职。 接替张汝梅的山东", "url": "https://www.zhihu.com/question/2077908101336929484/answer/2078989315993030810", "votes": 11, "comments": 0, "feed_ts": 1788449679, "feed_time_s ATE_PIN", "verb_cn": "发布了想法", "title": "每日精选一句英文很多人觉得自己很聪明，但是你要记住，聪明只有两个硬标准：（一）学生时代→成绩好（二）社会里→赚钱多", "excerpt": "每日精选一句英文很多人觉得自己很聪明，但是你要记住，聪明只有两个硬标准：（一）学生时代→成绩好（二）社会里→赚钱多", "url": "https://www.zhihu.com/pin/2078854060833240719", "votes": 0, "comments": 0, "feed_ts": 1788417450, "feed_time_str": "09-03 14:37", "category": "pin", "cat_name": "想法动态"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "超远程空空弹的路线选择与战术需求美海军首次亮相了新一代的超远程空空弹AIM-424，并展示了该弹可以内置在F-35的弹舱内。而且在能够内置在隐身机弹舱内的前提下，该弹的射程还能达到463公里。相比之下，我国的霹雳-17虽然在射程和末端存速上更加领先AIM-424，但受限于导弹本身长度高达5.8米，其根本无法塞进弹舱长度仅有4米多的歼-20和歼-35这两型五代机的弹舱中，通常会由歼-16这类四代半的战术机挂载在翼下，对敌预警机或各类特种机平台以及400~500公里距离上战术机实施截射。这两型导弹并非有一方占据绝对的优势地位，而是根据自身的战术需求选择了不同的技术路线。美军的AIM-424为了要塞进隐身机弹舱内的同时，还要兼顾更远的射程，所以，其选择了在弹体长度一定的情况下，增加导弹弹径，以此提高导弹固发的装药量，延长空空弹的最大射程。但这也带来一个问题，导弹的弹径在增加后，必然会导致导弹的高速阻力代价更高和弹体RCS值与热红外信号增加。这也意味着，如果攻击的对象是预警机，那么对手的预警机将会在更远的距离上发现来袭的导弹，并呼叫外围警戒区的歼击机分队前出导弹来袭方向搜索目标，迫使载机提前放弃空空弹的制导；其次，预警机还将组织附近掩护的电子战飞机对导弹载机的制导链路实施压干扰，致使来袭导弹偏离预警机的飞行航线。要是像空警-700这种同时集成了新一代AESA、大孔径IRST以及机身两侧疑似的大阵面ESM，完全可以在更远的距离上截获来袭导弹的雷达和红外信号，并使用机身两侧的电子战天线压制敌机的制导链路，破坏敌机的攻击条件。AIM-424反倒是对我军的轰炸机群会构成相当的威胁，目标本身 RCS 巨大，机动能力弱，最大机动过载只有 2‑3G，很难做大角度规避来袭导弹；而且，像鹰击-12/15甚至是鹰击21的射程都已经不足以让轰炸机在敌航母防空圈外实施攻击，必须要上新一代超燃动力的鹰击-XX才能够重新建立优势。我军装备的霹雳-17则在设计之初就不考虑塞进五代机的弹舱内，而是强调导弹的射程和尽可能降低被敌预警平台截获的距离。相比于AIM‑424 约4.11m的弹长和 0.34m的弹径，霹雳‑17仅有 5.8m的弹长， 0.30m的弹径。其细长光杆的设计使得霹雳-17靠高长径比降低超音速波阻，高速飞行阻力更低，末端存速更高；RCS值更小，被预警机截获的距离相对更近。而这样做的代价就是弹太长，无法塞进五代机的弹舱。所以，由于两型弹的战术需求不同，使得在设计路线上的选择也有所不同，性能上也各有取舍，并不存在一方占据绝对的优势地位。最后提一嘴，霹雳-17的技术已经属于十年前的产物了，属于我军的上一代超远程弹，至于最新的······大家可以自行想象。", "excerpt": "超远程空空弹的路线选择与战术需求美海军首次亮相了新一代的超远程空空弹AIM-424，并展示了该弹可以内置在F-35的弹舱内。而且在能够内置在隐身机弹舱内的前提下，该弹的射程还能达到463公里。相比之下，我国的霹雳-17虽然在射程和末端存速上更加领先AIM-424，但受限于导弹本身长度高达5.8米，其根本无法塞进弹舱长度仅有4米多的歼-20和歼-35这两型五代机的弹舱中，通常会由歼-16这类四代半的", "url": "https://www.zhihu.com/pin/2075145916298937632", "votes": 0, "comments": 3, "feed_ts": 1788416718, "feed_time_str": "09-03 14:25", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOT  能源"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "答对了却没看图？EASE给多模态RLVR装上「视线校正器」", "excerpt": "强化学习与可验证奖励（RLVR）已成为提升视觉语言模型（VLM）推理能力的标配手段。但一个隐蔽的问题始终存在： 最终答案的奖励信号，只告诉模型「答对了没有」，却从不告诉它「答案应该从图像的哪个区域得出」。答对，可能是因为真的看懂了图，也可能只是语言先验的捷径、数据集的偏差，甚至是一次幸运的瞎猜。 来自哈工大、中关村学院等机构的研究团队提出 EASE（Evidence-Anchored Spatia", "url": "https://zhuanlan.zhihu.com/p/2078799966965863490", "votes": 2, "comments": 0, "feed_ts": 1788404616, "feed_time_str": "09-03 11:03", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "谷歌Gemini 3.8登场！姚顺宇：RSI巨大飞跃", "excerpt": "深夜，谷歌正式推出 Gemini 3.8。这是谷歌在短短六周内推出的第三款 Flash 系列模型。 据介绍，Gemini 3.8 Flash 在保持与 Gemini 3.7 Flash 相同速度和成本优势的基础上，进一步提升了推理与代码能力，重点强化软件工程、Agent 任务以及复杂多步骤推理场景。 Gemini 3.8 包含两个版本： Gemini 3.8 Flash：高智能通用工作模型（wor", "url": "https://zhuanlan.zhihu.com/p/2078799539092320292", "votes": 10, "comments": 3, "feed_ts": 1788404507, "feed_time_str": "09-03 11:01", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Facet-0：NTU王子为团队让机器人在精密装配中「看得懂、插得准、出错能恢复」", "excerpt": "机器人正在变得越来越「通用」。 从抓取日常物品，到根据语言指令完成多步骤操作，视觉 — 语言 — 动作（VLA）模型正在让机器人摆脱过去「一项任务、一套程序」的开发方式。但当机器人真正走向制造现场，问题也随之发生了变化： 会不会做，已经不是唯一标准；能不能在毫米甚至亚毫米级接触中稳定完成，并在出错后自己恢复，才决定它能否真正进入生产环节。 精密装配恰恰是这道门槛最集中的地方。零件可能已经「看起来对", "url": "https://zhuanlan.zhihu.com/p/2078797292019230095", "votes": 3, "comments": 1, "feed_ts": 1788403976, "feed_time_str": "09-03 10:52", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待樊纲近期关于「中国经济结构性调整，触底过程可能快于日本当年」的观点？", "excerpt": "在我看来，现在经济最核心、最迫切的事情，是推动全民收入提升。 某种意义可以参考其余国家收入倍增的思路，不管是直接发钱，还是通过就业政策、产业政策，最好还是能够实实在在把老百姓的收入抬上来。 我之前写过小城市3000 块钱定律，说是小城市普通人工资天花板，也是3000块。 但实际现实的情况比纸面数字更严峻。 我身边就有例子，小城市支柱产业是外贸鞋厂，但问题已经没有多少稳定全职岗位了，基本改成社群派活", "url": "https://www.zhihu.com/question/2078784380315460723/answer/2078797049701593774", "votes": 5 界、工具环境和验收方式都比公司内部工程流程更可控。真正值得开发者复测的是：它在自己的代码库里能否减少人工接管次数，而非只看排行榜名次。价格没涨，实际成本要另算3.8 Flash 的引导价与 3.7 Flash 相同：每百万 input token 0.75 美元、每百万 output token 3.75 美元。但 Google 同时明确说明，面对复杂任务时，它会多做推理步骤、反复调用工具；高 effort 设置下，token 用量可能增加。因此，“单价低”不等于“一个任务更便宜”。如果它能少走几次错误路径、少让人中途接手，总成本可能下降；如果只是把同一任务跑得更久，账单也会随之上涨。短链路、成本优先的工作负载，Google 仍建议继续使用 3.7 Flash。Cyber 版不是普通开发者入口这次还有 Gemini 3.8 Flash Cyber。它面向漏洞发现和自动补丁，Google 说它在 CyberGym、CWE-Bench 等安全评测上表现突出。但 Cyber 版只通过 Fairwind Program 向受信任的政府机构、关键基础设施运营方和软件维护者提供优先访问，不是普通 API 用户可以直接切换的同一版本。现在能怎么用普通 3.8 Flash 已可通过 Gemini API、Google AI Studio、Android Studio、Google Antigravity、Gemini Enterprise 使用；消费者侧面向 Google AI Pro 和 Ultra 订阅用户，在 Gemini App、搜索 AI Mode 和 Gemini in Google Sheets 提供。如果你在做需要连续读代码、调用工具、跑验证的代码 agent，3.8 Flash 值得拿真实任务试一次，并同时记录完成率、耗时、token 和人工接管次数。只想低成本跑稳定短任务，则先别急着替换 3.7 Flash。", "excerpt": "Gemini 3.8 Flash发布：主打长程代码agent让模型写一段函数，和让它连续改完一个跨文件工程问题，难度完全不是一回事。后者要读代码、调用工具、验证结果，再根据失败继续改。Google 新发布的 Gemini 3.8 Flash，主攻的就是这类长程代码 agent 任务。长程代码任务，是这次的核心Google 把 DeepSWE v1.1 作为关键证据。这个基准考察模型能否端到端处理复", "url": "https://www.zhihu.com/pin/2078780331893826918", "votes": 0, "comments": 0, "feed_ts": 1788399920, "feed_time_str": "09-03 09:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Milo狼狈赶出国后接受摩根采访“我以前真的不知道，在美国（ICE）制度化的暴力现实中是什么样子。他们逮捕你的方式，给你戴上手铐和脚镣，每个人被捕时都像是 MS-13 帮派成员一样。。。我像个老太太一样哭了整整一个小时。” “不会希望任何人（像我一样）被驱逐”——仅选取Milo本人过去1年左右发表的言论，包括但不限于：ICE 探员应当获得完全豁免权；明尼州两起枪击案发生时力挺ICE，就应该这么干，哪怕流血也要完成任务；地方政府和警察得无条件服从ICE命令配合其工作；取消第一、第四修正案部分保障，协助 ICE 执法；转发被捕现场和拘留中心人员哭泣的照片并加以嘲笑；建议每个城市和每个州定下指标，不达标就炒掉当地ICE雇员，按照绩效逮捕和驱逐的越多，越加工资；至此已成艺术～", "excerpt": "Milo狼狈赶出国后接受摩根采访“我以前真的不知道，在美国（ICE）制度化的暴力现实中是什么样子。他们逮捕你的方式，给你戴上手铐和脚镣，每个人被捕时都像是 MS-13 帮派成员一样。。。我像个老太太一样哭了整整一个小时。” “不会希望任何人（像我一样）被驱逐”——仅选取Milo本人过去1年左右发表的言论，包括但不限于：ICE 探员应当获得完全豁免权；明尼州两起枪击案发生时力挺ICE，就应该这么干，", "url": "https://www.zhihu.com/pin/2078776593267307656", "votes": 0, "comments": 62, "feed_ts": 1788399486, "feed_time_str": "09-03 09:38", "categor 一个是抗税的豪绅。这两层人把天下的财富占得干干净净，一分进不了国库。 三十万张嘴吃垮财政这里有个流传很广的误解得先澄清。很多人以为：明朝的王爷就那么几个闲散宗室，一人吃一份禄米，你就是人人都是良子，又", "url": "https://www.zhihu.com/question/588607079/answer/2078753421126005718", "votes": 46, "comments": 14, "feed_ts": 1788396872, "feed_time_str": "09-03 08:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "为什么我觉得 何度目かのはじめまして 不如 天津罪", "excerpt": "最近在想《何度目かのはじめまして》和《天津罪》里萤的区别。 先简单说一下两作的设定。 《何度目かのはじめまして》里，主角会数次回到过去，与女主角翠重新相遇。每一次遇到的翠本身都没有继承上一轮与主角相处的经历，主角却保留着之前的记忆，因此几次相遇中，两个人关系的变化很大程度上取决于主角这一轮选择告诉翠多少事情。对每一轮的翠来说，一旦她消失，那一轮的她也就真的结束了。 《天津罪》里的萤则因为自身的特殊", "url": "https://zhuanlan.zhihu.com/p/2078492788119823328", "votes": 8, "comments": 0, "feed_ts": 1788395216, "feed_time_str": "09-03 08:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "地主是否真的那么坏？", "excerpt": "很多人谈地主时不知道一点：民国时的地主和民国前的地主，是不同的两个物种。 中国从清末到民国，出现了地主成分急剧劣化。这一点不是政治宣传，而是史学的广泛共识。 先说说清末民国之前的古代地主是什么情况。 中国古代以小农为主的自然经济，土地规模是有边际效益的。对于地主来说，不是土地越多越好，当土地规模扩张到一定的程度，管理成本就会上升，雇工支出也急剧上升，土地的实际收益会出现衰减。 如果不由自己组织耕作", "url": "https://www.zhihu.com/question/660126501/answer/2078440987207131423", "votes": 1165, "comments": 121, "feed_ts": 1788394842, "feed_time_str": "09-03 08:20", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}];

    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

时还要验证机构身份，并说明正在进行的研究和预期科学用途。获批后最多可邀请 4 位同机构协作者，每位协作者也要单独验证身份，并计入总账号数量。页面提到 IAS 和 ENS 已有访问资格，完整的 eligible institutions 名单需要以申请页面为准。隐私承诺能解决哪些顾虑OpenAI 写明，计划工作区包含企业级隐私与安全保护，研究者数据默认不用于训练模型。这对涉及未公开实验、临床数据、代码和论文草稿的团队很关键，但仍应在提交敏感数据前核对所在机构的合规要求、数据使用政策和连接器权限。计划还提供 75 个以上生命科学 skills，并可连接文献、公共基因组和临床数据库、计算 notebook、数据平台与参考文献管理器。模型能力之外，研究流程能否留下版本、来源和分析记录，同样决定结果能否复核。回复区也有人提出，科研需要可引用的来源记录与可复现实验版本；这是一项应当在实际使用中继续验证的要求。想申请的人先准备什么(1) 先查自己的高校是否在 eligible institutions 范围内，并确认学校邮箱和机构证明材料是否齐全。(2) 用几句话写清活跃研究主题、预期科学用途，以及需要哪些产品能力，例如文献研究、数据分析、代码执行或协作。(3) 团队协作前确定同机构协作者名单。每人都要验证资格，不能把 4 个邀请位当作自由转赠名额。(4) 产业研究员、非入选高校研究者和独立研究者的资格，当前可见官方材料没有给出明确结论。不要只看“10 万人免费”就预设自己必然符合条件。OpenAI 还称，到 2027 年会投入超过 2.5 亿美元支持外部科学研究与发现，其中包含 5,000 万美元的 NextGenAI 计划。", "excerpt": "OpenAI给科研人免费GPT-5.6OpenAI 推出 ChatGPT for Academic Researchers：2026 年夏天先给 1 万名研究者免费开放前沿模型与工具，计划到 2027 年扩到 10 万人。启动时可使用 GPT-5.6 系列，也能在 ChatGPT、ChatGPT Work 和 Codex 中使用。这项计划的重点是把模型接进科研的完整工作流。官方列出的场景包括文献综", "url": "https://www.zhihu.com/pin/2066143104659460967", "votes": 0, "comments": 0, "feed_ts": 1785386934, "feed_time_str": "07-30 12:48", "category": "pin", "cat_name": "想法动态"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美联储今年连续第五次维持利率不变，但投票结果从一致通过变成9票对3票，内部发生了什么？9月会加息吗？", "excerpt": "最大的问题不是这个9对3，是沃什讲错话了，新闻发布会的表现非常不好，长债收益率直接飙涨，美股和美元也都跳水。 先讲这次的结果。 这次不是季度会议，没有点阵图，只公布委员会对7月利率的投票结果：9对3，9人赞成7月维持利率不变；3人反对、主张7月直接加息25个基点。 三张反对票来自：洛根（达拉斯联储主席），哈马克（美联储理事），卡什卡利（明尼阿波利斯联储主席）。这三位是出了名的美联储内部的强鹰派，市", "url": "https://www.zhihu.com/question/2066063922856027842/answer/2066138346246688940", "votes": 510, "comments": 71, "feed_ts": 1785385769, "feed_time_str": "07-30 12:29", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "曹多鱼", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你怎样看待菲尔兹奖得主王虹在北大的经历？", "excerpt": "经历蛮好的，不说突出也是优秀吧，和本人并列一下（手动狗头） ", "url": "https://www.zhihu.com/question/2065263849624834783/answer/2065701375896565308", "votes": 1256, "comments": 269, "feed_ts": 1785385088, "feed_time_str": "07-30 1 ", "url": "https://www.zhihu.com/question/30858077/answer/1960637320999962616", "votes": 5460, "comments": 241, "feed_ts": 1785375733, "feed_time_str": "07-30 09:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "林一五", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "黄仁勋的公开信只是表面攻势，厉害的在背后", "excerpt": "这两天美国那边的一个大新闻是黄仁勋注册了X账号并发表了第一封公开长信，呼吁美国修正AI发展道路，从封闭系统改为开源系统。马斯克第一时间跳出来支持黄仁勋，微软等巨头也开始站队到黄马这边。继200家硅谷初创公司联合表态反对美国AI行业巨头垄断和美国政府AI政策方向之后（《 Kimi突袭美股，硅谷反对白宫制裁中国AI公司》），仅过去一周，反对派这边加入了数股重磅力量。 这场席卷全美并且有望塑造美国未来的", "url": "https://zhuanlan.zhihu.com/p/2066095512634372748", "votes": 24, "comments": 1, "feed_ts": 1785375573, "feed_time_str": "07-30 09:39", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "科创逃生 2.0这个没啥指导意义，就是当时 7.21 日拉涨停的时候，我在星球写的科创逃生 2.0。我当时说了先 Mark，等这波回头看。以下是内容：拉涨停的反弹，历来都是逃命的窗口我先说结论：我认定这波反弹就是逃生窗口。原因很简单：它拉的手法，是直接拉涨停。拉涨停和其他拉升方式，根本不是一回事很多人看到半导体设备ETF涨停，就想到2024、2025年关税那波的十七连阳，觉得历史又要重演了。但你回去翻当时的走势就会发现，那一波虽然连涨十几天，可每天的涨幅都很克制，没有动不动就冲涨停的。那种小步碎阳、慢悠悠往上走的，才是真正健康的拉涨，是资金实打实进场做行情。而拉涨停这个手段，放在阶段高位，历来就只有一个模式：拉高出货。为什么我对这个这么熟？因为上一次靠拉涨停做反弹出货，就是2015年那波股灾。我之前说过，15年牛市后面有三波下跌。咱们把当时的日线拉出来看。第一波暴跌（6月15日—7月9日）： 52个交易日，沪指从5178暴跌至3373，跌幅34.8%；创业板从3968跌到2153，跌幅45.7%。千股跌停反复上演，市场一片绝望。然后就是关键的反弹阶段（7月9日—8月17日）： 国家队入场救市，20多道&#34;救市金牌&#34;砸下去，券商集体救市。创业板能交易的票几乎全线涨停，连续多天&#34;千股涨停&#34;。注意：当时创业板像不像现在的科技，半导体设备？拉的涨停，和当时一样吗？接下来，沪指从3373一路拉到4006，反弹幅度18.7%。当时市场什么情绪？所有人都在喊&#34;跌到位了&#34;&#34;牛市还在&#34;&#34;千金难买牛回头&#34;。 散户一窝蜂冲进去抄底。结果呢？8月18日，第二轮暴跌直接开始。 沪指从4006一路砸到2850，跌幅28.8%；创业板从2813跌到1779，跌幅36.7%。8月24日、25日两天，跌停个股超过2000只。冲进去抄底的人，全抄在了半山腰上。 第二波里死得最惨的，恰恰就是第一波反弹时冲进去的那些人。他们觉得自己&#34;抄到底了&#34;，结果反弹只是陷阱，真正的底部还没来。涨停为什么是出货工具？逻辑很简单：主力真要往上做长行情，根本不会给你涨停价舒服进场的机会。都是偷偷吸筹、慢慢推，生怕太多散户跟着上车。只有要出货的时候，才会把涨停封得漂漂亮亮。 吸引全市场的目光，让你觉得不买就踏空了，然后他在涨停板上偷偷撤单、往外派发筹码。说白了，涨停就是最便宜的广告。花钱拉个板，跟风盘自己就涌过来了。把15年的创业板换成现在的科技板块，几乎一模一样当时的情况和现在像不像？前面刚砸了一大波，市场情绪都绝望了突然一根大阳线拉起来，甚至拉涨停散户一下子就觉得见底了，一窝蜂往里冲正好接了主力甩的筹码历史不会一模一样，但底层逻辑从来没变过。而15年下半年，真正活下来的板块是哪些？当然，股灾里说&#34;涨得好&#34;，准确说是跌幅最小、率先企稳、结构性有机会的板块。咱们按梯队来看就两块：第一梯队：银行——最抗跌，没有之一整个股灾全程跌幅最小的板块。原因三条：估值极低，PB远低于市场平均，股息率有吸引力；国家队救市的主阵地，证金公司大量买入银行股稳定指数；大市值流动性好，便于万亿级救市资金进出。但注意，银行不是真涨，是&#34;跌得少&#34;。融资净偿还超300亿，说明聪明钱其实在撤。第二梯队：消费白马——四季度成了避风港这是15年下半年最有意思的反转。上半年被题材股碾压的消费股，下半年反而最稳。食品饮料方面，茅台、五粮液等龙头在四季度表现稳健，年底深港通预期加持。医药生物方面，同仁堂、片仔癀、白云山12月冲击涨停。家电龙头格力、美的，业绩稳定加分红高，估值合理。逻辑很清晰：泡沫破了之后，市场从&#34;讲故事&#34;切换到&#34;要业绩&#34;，有确定性盈利的公司重新受追捧。这也是我为什么看消费的原因。", "excerpt": "科创逃生 2.0这个没啥指导意义，就是当时 7.21 日拉涨停的时候，我在星球写的科创逃生 2.0。我当时说了先 Mark，等这波回头看。以下是内容：拉涨停的反弹，历来都是逃命的窗口我先说结论：我认定这波反弹就是逃生窗口。原因很简单：它拉的手法，是直接拉涨停。拉涨停和其他拉升方式，根本不是一回事很多人看到半导体设备ETF涨停，就想到2024、2025年关税那波的十七连阳，觉得历史又要重演了。但你回", "url": "https://www.zhihu.com/pin/2066093347698221187", "votes": 0, "comments": 26, "feed_ts": 1785375094, "feed_time_str": "07-30 09:31", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "科创逃生指南 2.0", "excerpt": "这个没啥指导意义，就是当时 7.21 日拉涨停的时候，我在星球写的科创逃生 2.0。 我当时说了先 Mark，等这波回头看。 以下是内容： 拉涨停的反弹，历来都是逃命的窗口 我先说结论： 我认定这波反弹就是逃生窗口。 原因很简单： 它拉的手法，是直接拉涨停。 拉涨停和其他拉升方式，根本不是一回事 很多人看到半导体设备ETF涨停，就想到2024、2025年关税那波的十七连阳，觉得历史又要重演了。 但", "url": "https://zhuanlan.zhihu.com/p/2066092332320028540", "votes": 109, "comments": 26, "feed_ts": 1785374978, "feed_time_str": "07-30 09:29", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美军真的很腐败吗？", "excerpt": "我有个想法 川普上台后安排一群润人去国防部审计查账 如果啥都没查出来，那就更好，说明你的敌对国家都没发现你的问题，顺便恶心一波东大，我敢用中国人查美军的账，你敢用美国人查解放军的账吗？赢！ 如果查出来有问题，那正好顺势砍掉一波国防经费，赢！！ 如果查账路上挂了，那就说是东大搞暗杀，谴责一波（反正润人也不缺）赢！！！ 这个就叫以润兼查，两难自解 ", "url": "https://www.zhihu.com/question/313918598/answer/66548743592", "votes": 6631, "comments": 342, "feed_ts": 1785374729, "feed_time_str": "07-30 09:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "AI教育科普", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "只有这样的罚款，才能让大家对AI编程心存敬畏。很多管理层压根就不知道这回事的，有了罚款他们就知道了。至于ai时代不可替代性是什么？也可以去关注一下我的AI落地方法论专栏里面写的很明确，人类的辩证思维能力是AI不可能具备的。或许我的思路会对你有所启发。@知乎直答 ", " const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

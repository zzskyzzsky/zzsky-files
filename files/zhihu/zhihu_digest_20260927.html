y": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你们认为清朝最终灭亡的根本原因是啥？", "excerpt": "财政的彻底破产。 依我看来，清朝最值得后世研究的，并不是奠定现代疆域版图，也不是反对华夷之辩推行‘一体’，更不是塑造臣民这样的梦话，而是它的财政模式。清朝中央财政可以说是中国历朝历代最好的一个，甚至说断崖式领衔也不为过，包括经常被人称颂的宋朝，其财政状况较之于清朝也是不够瞧的，顺治刚入关的时候，清朝拿着烽火连天不休的半壁河山就能做到岁入一千四百多万两，顺治九年，在全国丁口仅存不足万历旧额三分之一…", "url": "https://www.zhihu.com/question/429486006/answer/2086982158799861345", "votes": 1604, "comments": 190, "feed_ts": 1790430061, "feed_time_str": "09-26 21:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "孙钦华", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "网上有一种说法，说豆包开始裁员。因为在公司内部成了边缘产品。为什么成了边缘产品？", "excerpt": "说反了，确切的说， 豆包从 ChatGPT 升维成了 ChatGPT+Codex， 在字节集团里的地位升格到最大，拿最大的资源倾斜。现在的豆包之于张一鸣，相当于小米汽车之于雷军，可能是人生最后一次豪赌。 被削的是通用 session 对齐团队，也就是搞聊天优化的，因为这些工作带来的经济回报比较小。 第一性原理： AI 的进化，是一种广义的强化学习，而强化学习的最终验证器是“货币化能力”。原来的豆包", "url": "https://www.zhihu.com/question/2086789490354417857/answer/2087077875694449823", "votes": 72, "comments": 0, "feed_ts": 1790429984, "feed_time_str": "09-26 21:39", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "时予", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果我的身体素质可以5分钟跑完全马，但没练过格斗，徒手格斗我能打过张伟丽吗？", "excerpt": "张伟丽一定是上辈子拯救过银河系，被你们这些知乎宇宙超人如此照顾。 5分钟跑完全马是什么概念？ 5分钟300s，全马42195m。 这意味着，你的速度高达： 42195÷300=140.65m/s。 好家伙，你这速度比17级台风的2倍风速还要快得多。 甚至不用给你一双翅膀，哪怕你只需要俯身略微向上倾斜，就能飞上天。 你可能想，对于你这70kg的体重，这个速度下的动能也就： \\frac{1}{2}\\t", "url": "https://www.zhihu.com/question/1909539668606850752/answer/2085676079201661752", "votes": 2137, "comments": 289, "feed_ts": 1790429913, "feed_time_str": "09-26 21:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "《太平年》里，胡进思废了七郎，立了九郎，为什么不肯自立为王呢？", "excerpt": "因为这个故事没从钱缪开始讲，所以你会有这种疑问。你要知道钱缪的事情，就知道胡进思为什么不敢了。 首先来说，钱缪在浙东治理有方，修杭州城，让杭州从此超越绍兴（越州）成为浙江的经济中心到今天。同时治水，驯服了钱塘江，让浙东从此成为鱼米之乡，另外就是轻徭薄赋，令流民归附。胡进思并不是没尝试过，他行废立之事后，杭州城内有流言胡进思要自立，结果军队人心浮动，胡进思立即辟谣。他就知道没有机会。 其次，吴越国的", "url": "https://www.zhihu.com/question/2003848402618835381/answer/2087293224519997243", "votes": 3, "comments": 0, "feed_ts": 1790429485, "feed_time_str": "09-26 21:31", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "柬埔寨宣布其境内电诈中心清零，这一说法真实性如何，将对全球打击电信诈骗带来哪些影响？", "excerpt": "哎～～ 错过了一个帮助东南亚铲除恐怖组织，建立东亚文明的绝佳机会。东方大国本可以在电诈最高峰，通过联合国把电诈园区列为反*Ren类恐*布组织，然后派出维和部队清剿罪犯。 好处是什么？没收非法所得，打通印度洋出海口，保护国民生命财产安全；树立东方灯塔文明。 ", "url": "https://www.zhihu.com/question/2077807308675998067/answer/2086843256101410401", "votes": 23, "comments": 0, "feed_ts": 1790428612, "feed_time_str": "09-26 21:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小德", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国明明是贸易顺差破万亿的制造业大国，为什么工人工资总体还是偏低，而当年美国一个工人都能养活一家人了？", "excerpt": "这得看你是想怎么养活一家人，如果是按照当年美国工人那个标准来，那你也能比亚迪打螺丝养活一家人。 60年代美国工人家庭的情况，换到中国大概是这样的： 你是一个比亚迪流水线员工，收入大概6k。家在比亚迪工厂附近，有一套农村自建房，两层小楼和一个小院子，前年你从隔壁老叔家抱来了两条小狗崽，现在也是看家护院的好手了。 你老婆是全职主妇，偶尔打打零工，你有三个孩子，都是公立医院顺产的，你没给他们买那些花里胡", "url": "https://www.zhihu.com/question/2020667754072609970/answer/2043021347442382298", "votes": 1024, "comments": 171, "feed_ts": 1790427423, "feed_time_str": "09-26 20:57", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯,TravailleursNuit", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "老登的顽固是完全跟理性无关的，乌克兰还有蹲在巴赫穆特不出来的。本质上就是武力驱逐老登不体面（所以总是外包，现在要治理所以外包不了了）", "excerpt": "老登的顽固是完全跟理性无关的，乌克兰还有蹲在巴赫穆特不出来的。本质上就是武力驱逐老登不体面（所以总是外包，现在要治理所以外包不了了）", "url": "https://www.zhihu.com/pin/2087255219755291441", "votes": 0, "comments": 0, "feed_ts": 1790427233, "feed_time_str": "09-26 20:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小德", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "为什么部分中国网民看不起印度?前日本陆军大将今村均的回忆录里有这样一个故事。原文太长，挑重点的说。大概就是日本投降之后，他手底下有个叫细川的，被澳大利亚法院判处了绞刑，理由是殴打战俘致死口，违背日内瓦公约人道主义条款。但这哥们是咋回事呢，他上岛之前俘虏了一个英军飞行员，但是这个俘虏是印度人，细川看他英语说的不错，就把他留在身边当翻译，但是这个三哥趁其不注意给细川下了麻药，然后给上了(字面意思)。然后 治常识得罪了李在明——乌克兰总统公开朝鲜战俘转交韩国引发李在明不快李在明批泽连斯基公开朝鲜战俘赴韩：称违反保密约定，乌方回应称秘密转送“很奇怪”韩国总统李在明表示，乌克兰总统泽连斯基公开两名朝鲜战俘已经被转送韩国，违反了韩乌双方此前的保密约定，并称韩国政府选择不公开此事，是出于保护当事人生命安全、国家安全和朝鲜半岛局势的考虑。泽连斯基本周在纽约举行的联合国大会上首次公开表示，乌克兰已经把两名被俘朝鲜士兵送往韩国。韩国政府随后确认两人已经抵韩，但表示此前一直与乌克兰方面保持低调处理。李在明在社交平台X发文称，国家事务应当服务于国家和国民，而不是为了执政者自身利益或人气。他说，朝鲜战俘转送韩国是一个可能严重影响外交、安全、南北关系和朝鲜半岛局势的高度敏感问题。李在明表示，公开两名战俘抵韩的消息显然可能有助于改善政府支持率，政府内部不可能没有主张公开这一成果的声音。但他称，考虑到公开消息可能带来的各种问题，韩国政府最终认为不公开是更合理的选择，并与有关方面就此达成一致。李在明说，如果考虑到相关人员的生命、国家安全和国家利益，就不能为了政治利益轻率公开相关信息。他还以强烈措辞表示，为个人利益损害他人生命和国家安全的人，会被称为“杀人者或卖国者”，并称批评政府采取合理、正当的保密措施是不恰当的。谈到乌克兰方面公开消息时，李在明表示，不知道乌方究竟出于什么原因违反保密约定，但对此“非常遗憾”。不过，乌克兰总统办公室随后对双方是否存在保密约定给出了不同说法。乌克兰总统办公室表示，两名朝鲜战俘转往韩国，是乌克兰与韩国直接沟通后作出的决定，并强调这是一个非常敏感的问题。对于韩方所说的保密约定，乌克兰总统办公室没有明确予以确认，而是表示，乌克兰是一个开放的国家，乌军俘获人员后将其“秘密送到某个地方会是一件很奇怪的事情”。乌方称，整个事件的经过“很长也很复杂”，泽连斯基公开的只是两名战俘被送往韩国这一事实，并没有披露具体转送过程。这两名朝鲜士兵于2025年1月在俄罗斯库尔斯克地区作战期间被乌克兰军队俘获。此后两人曾通过采访和与韩国方面接触表达前往韩国的意愿。今年7月，李在明与泽连斯基在土耳其安卡拉举行首次峰会时，已经讨论朝鲜战俘问题。韩国政府当时公开表示，两国领导人同意尊重战俘本人的自由意愿，并按照国际法和人道主义原则处理他们的去向。泽连斯基本周在联合国大会宣布，两人最终已经被送往韩国。消息公开后，韩国国内出现政治争议。在野党国民力量质疑李在明政府为什么此前隐瞒两名战俘抵韩消息，并要求政府公布具体原因。执政党共同民主党则表示，保密是为了保障两人的安全，并批评在野党把涉及生命和国家安全的问题政治化。共同民主党还对泽连斯基公开此事表示遗憾，称乌方的做法违背双方信任，并可能给已经抵达韩国的两名朝鲜战俘以及他们仍在朝鲜的家人带来安全风险。目前，两名战俘的具体身份、在韩国的所在地以及安置情况均没有公开。乌克兰总统为了乌克兰的战时利益让心心念念想在下台前去趟平壤的李在明得罪朝鲜官方，李在明恨死乌克兰总统了。", "excerpt": "乌克兰总统毫无朝鲜半岛政治常识得罪了李在明——乌克兰总统公开朝鲜战俘转交韩国引发李在明不快李在明批泽连斯基公开朝鲜战俘赴韩：称违反保密约定，乌方回应称秘密转送“很奇怪”韩国总统李在明表示，乌克兰总统泽连斯基公开两名朝鲜战俘已经被转送韩国，违反了韩乌双方此前的保密约定，并称韩国政府选择不公开此事，是出于保护当事人生命安全、国家安全和朝鲜半岛局势的考虑。泽连斯基本周在纽约举行的联合国大会上首次公开表示", "url": "https://www.zhihu.com/pin/2087189662410588789", "votes": 0, "comments": 1, "feed_ts": 1790412808, "feed_time_str": "09-26 16:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "UFO", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国工信新闻称「去宁德化」论调要不得，如何理解？正常市场行为被包装渲染有什么危害?", "excerpt": "三百年前，山西的票号把干活的人写进了分红。出钱的叫银股，出力的叫身股。 银股是东家掏的银子。身股不用掏一分钱。伙计在号里干满十年，没出过差错，掌柜点头，名字就记进一本册子。记的是功劳，不是本钱。大掌柜顶一股，十厘。二掌柜七八厘，普通伙计一到四厘。四年结一次，赚了钱，银股身股一起分。 乔家的大德通票号，1889年银股20股，身股9.7股。到1908年，银股一股没加，身股涨到23.95股。持股的人从2" ": "算力竞争进入下半场，从华为全联接大会 2026 看 Agent 需要怎样的新底座？", "excerpt": "都怪 Agent自从年初 Agent 大范围兴起之后，听到大家讨论最多的大概就是“今天又消耗了多少 token”，“套餐额度快不够用了”，“模型回答速度怎么变慢了”等等诸如此类的话题。 本质上，这是 AI 算力负载发生结构性变化后，反映在用户侧大家能直观感知到的东西。 而另一方面，在企业侧，也就是给模型推理提供算力的服务器那里，发生的变化实际上更大。 这种变化当然是 Agent 这种产品形态和它特", "url": "https://zhuanlan.zhihu.com/p/2086444436628694317", "votes": 34, "comments": 2, "feed_ts": 1790400395, "feed_time_str": "09-26 13:26", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude完成了九环计算了，重点在可验证执行Claude 在一个理论物理测试模型里完成了九环散射振幅计算：此前该模型的公开纪录是八环。它在 Claude Science 中运行数天，人类给出题目后只做低频跟进；页面给出的终端用户成本约为每种计算路径 1,000～2,000 美元。九环到底在算什么散射振幅是物理学家预测粒子如何发生反应的公式。所谓“环”，可以理解为计算里纳入的相互作用复杂度：环数越高，预测越精细，算力需求也会迅速上升。多数相关计算只到两三环；这次处理的是平面 N=4 超杨–米尔斯理论中的六粒子振幅，一个专门用来检验计算方法的简化模型。它完成的是一道已有方法很难跑完的题Claude 没有提出新的物理定律。它使用了领域内已有的自举法和形状因子两条路径，并把执行过程推进到九环。Anthropic 页面披露，其中 Python/SymPy 的直接计算约相当于 96 个 CPU 跑一周，成本约 100 美元；另一条端到端路径把总预算推到约 1,000～2,000 美元。“低监督”为什么值得看这次结果的关键在于执行链条：模型需要自己搭建脆弱的计算代码、持续排错，并让两条独立路径得到可核验的一致结果。独立验证由参与过此前八环工作的物理学家 Lance Dixon 完成；他采用较容易验证的形状因子路径检查结果。验证和并发结果不能省略这件事也不能被写成“AI 单独攻克物理学”。页面提到，中国科学院 Song He 团队当时已算出该结果的大部分，使用 GPT-6 辅助部分约束计算。客座作者的结论也很克制：Claude 主要是在更充分的计算与工程执行下跑通了既有方法，并未展示新的物理洞见。对普通 AI 使用者更有用的判断是：在目标清楚、验证器明确、已有工具链成熟的任务里，长时间自主执行开始变得可用；但一旦问题没有可验证答案、需要提出新理论，不能把这次结果当作能力保证。", "excerpt": "Claude完成了九环计算了，重点在可验证执行Claude 在一个理论物理测试模型里完成了九环散射振幅计算：此前该模型的公开纪录是八环。它在 Claude Science 中运行数天，人类给出题目后只做低频跟进；页面给出的终端用户成本约为每种计算路径 1,000～2,000 美元。九环到底在算什么散射振幅是物理学家预测粒子如何发生反应的公式。所谓“环”，可以理解为计算里纳入的相互作用复杂度：环数越", "url": "https://www.zhihu.com/pin/2087169961873691286", "votes": 0, "comments": 0, "feed_ts": 1790400192, "feed_time_str": "09-26 13:23", "category": "pin", "cat_name": "想法动态"}, {"actor": "张子豪赞同了视频", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "磁场可视化将磁场可视化的一个小实验", "excerpt": "磁场可视化将磁场可视化的一个小实验", "url": "https://www.zhihu.com/pin/2078518714660566159", "votes": 0, "comments": 2, "feed_ts": 1790399707, "feed_time_str": "09-26 13:15", "category": "o 1790399404, "feed_time_str": "09-26 13:10", "category": "pin", "cat_name": "想法动态"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "历史教授为什么不愿碰元史？", "excerpt": "因为带元的异质感太强，要真正稍微了解带元历史得把东欧中亚西亚那一块历史都带起来研究，那样下来付出的成本是巨大的。而真研究出来成果后，带元历史热度又不算太高，属于吃亏不讨好那种。 举个例子如果你要研究蒙古帝国第三代可汗，元定宗贵由。你还得把东欧中亚的历史连带研究起来。因为贵由壮年时期参加了长子西征，长期在中亚东欧一带打仗，他被推举为大汗的时候人还在路上没回来。而且你还得研究一下金帐汗国的历史，因为…", "url": "https://www.zhihu.com/question/2082097440463787805/answer/2087148062342961148", "votes": 274, "comments": 20, "feed_ts": 1790399364, "feed_time_str": "09-26 13:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么知乎一边倒地抵制《弟子规》？", "excerpt": "弟子规是比较少有的在封建社会就被认为是封建糟粕的东西", "url": "https://www.zhihu.com/question/304245449/answer/2061921237174170483", "votes": 28552, "comments": 409, "feed_ts": 1790399313, "feed_time_str": "09-26 13:08", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果三峡大坝倒塌，会有多严重？", "excerpt": "大坝确实垮了，不过不是三峡，而是日本 千葉县的印旛沼坝 日本每年都复读机一样说中国三峡大坝要垮了，结果自己的大坝先垮了，真是报应不爽啊~ ", "url": "https://www.zhihu.com/question/2053269364691018654/answer/2086176966466598750", "votes": 43, "comments": 1, "feed_ts": 1790398279, "feed_time_str": "09-26 12:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么ChatGPT已经发布4年了，社会总生产力纹丝不动？", "excerpt": "新的技术，使生产力发展之后，不是立刻就能影响社会的总生产产出，它需要一个过程。 新技术发展起来以后，某些行业的生产效率大增，会开始把劳动力挤出去。因为，维持过去的产出规模，已经不再需要如此多的劳动力了。 比如说，复印机的出现，就毁灭了打字员这个岗位。直接把大量的劳动力挤了出去。 挤出去以后，会出现两个变化。 第一，相关的成本会下降。在有竞争的领域里，这意味着产品价格可以随之下降。人们在相关的产品上", "url": "https://www.zhihu.com/question/2065583157664018461/answer/2087159723997018057", "votes": 198, "comments": 24, "feed_ts": 1790397656, "feed_time_str": "09-26 12:40", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", " const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

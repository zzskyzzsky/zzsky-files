:38", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Coding Agent开始从“解工单”走向“做项目”：Harness也要支持长期迭代\n图文版：链接HoH@3在三项软件基准中的52.25%平均相对增益Harness-of-Harness（HoH），在既有 coding harness 上组织规划、开发、测试三种角色。论文在 GameCraft-Bench、FrontierSWE、ProgramBench 的三组 harness–model 配置中比较 HoH@3 与 Vanilla，报告平均相对增益 52.25%、最大 82.86%。Planner、Developer、QA Tester怎样交接Planner 将需求和上一轮证据变成本轮有界开发文档；Developer 修改制品；QA Tester 生成已验证行为与未解决缺口的执行证据。代码制品与测试证据共同跨轮传递，目标是避免重建和无证据迭代。三pass的分数与token代价45个 GameCraft-Bench 任务的同 pass 对照中，HoH 得 71.52 分、8.41M token/任务；三 pass Vanilla Continuation 得 58.24 分、6.33M token/任务。该结果说明分角色循环在该设置下提高制品评分，同时增加模型交互成本。70多轮Fusepoint与适用边界多天部署案例完成 70 多轮并产出可人类游玩的 FPS 游戏，但不是任意代码库或预算下的自主开发证明。它适合有可执行测试、版本化制品和多轮预算的项目；测试不稳或只能单次调用时，应先补基础条件。原文标题：Harness-of-Harness: Multi-Day Autonomous Software Development with Continual Improvement#无影寺 ", "excerpt": "Coding Agent开始从“解工单”走向“做项目”：Harness也要支持长期迭代\n图文版：链接HoH@3在三项软件基准中的52.25%平均相对增益Harness-of-Harness（HoH），在既有 coding harness 上组织规划、开发、测试三种角色。论文在 GameCraft-Bench、FrontierSWE、ProgramBench 的三组 harness–model 配置", "url": "https://www.zhihu.com/pin/2079337177809433432", "votes": 0, "comments": 0, "feed_ts": 1788532690, "feed_time_str": "09-04 22:38", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "MemoryWalker：上下文压缩会让 agent 在错误历史上训练\n图文版：链接压缩回放为何会改写训练条件MemoryWalker 研究长程 agent 在 rollout 中压缩上下文后的训练回放。token 生成时依赖的是当时可见的历史，训练器随后若用最终压缩历史或完整物理轨迹重放，打分条件都会改变：前者把未来删除提前施加，后者又让已删除内容回到前缀。论文将这一问题定义为条件不一致。三种路径各自需要什么基础设施LogitTree 沿条件树的 K+1 条分支分别计算，能精确复现历史，但每条 rollout 要 K+1 次反向；4D mask 在一次前向中实现相同分支可见性，要求定制注意力 kernel 和完整 eviction 记录；SDCC 以压缩历史为 student，在分叉点对齐重建的 teacher 分布，只做一次反向，适合黑盒 harness。AgentFold 的 0.366 偏差怎么读logdiff 衡量同一个已生成 token 在 rollout 条件与训练回放条件下的对数概率差。Qwen3-4B 的无压缩 Search-R1 对照为 0.014；AgentFold 上 Naive-Compressed 为 0.366，约高 26 倍。4D mask、LogitTree、SDCC 分别为 0.022、0.012、0.071。该指标衡量条件对齐，任务收益还需结合 agentic EM 与 rollout reward 判断。WideSearch 的收益与接入边界七个 held-out 开放域问答 benchmark 中，SDCC 在 AgentFold 的平均 EM 为 42.4，Naive-Compressed 为 33.2。WideSearch 的 Claude Code 实验里，LogitTree 使 Pass@1 从 4.5% 到 5.0%，Pass@4 从 7.0% 到 10.0%。适合已有动态压缩和 eviction 记录的 agent 后训练系统；换到自己的 coding、办公或检索任务前，仍要重测 reward、成本与稳定性。原文标题：MemoryWalker: Stop Training Agents on Contexts They Never Saw#无影寺 ", "excerpt": "MemoryWalker：上下文压缩会让 agent 在错误历史上训练\n图文版：链接压缩回放为何会改写训练条件MemoryWalker 研究长程 agent 在 rollout 中压缩上下文后的训练回放。token 生成时依赖的是当时可见的历史，训练器随后若用最终压缩历史或完整物理轨迹重放，打分条件都会改变：前者把未来删除提前施加，后者又让已删除内容回到前缀。论文将这一问题定义为条件不一致。三种路", "url": "https://www.zhihu.com/pin/2079336233323476792", "votes": 0, "comments": 0, "feed_ts": 1788532599, "feed_time_str": "09-04 22:36", "category": "pin", "cat_name": "想法动态"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美国 8月非农就业人数大增 16.2 万人，失业率报 4.1%，这意味着什么？有哪些信息值得关注？", "excerpt": "很多人猜小非农ADP不行，大非农也不行，押注9月不加息，结果8月非农好得不成样子…… 不管黄金还是美股，我这周一直提醒大家都别去赌。 数据是真是假，我根本不会花时间去揣测，纯属浪费时间，你知道是一堆垃圾，远离就是了。 加息概率已经从昨天的49%，又上升到60%，因为经济扛得住，美联储就少了不加息的理由。 数据公布后，黄金直接跳水。 今天早上还在和大家说，昨天沃勒放鸽、黄金大涨，这种市场反应是过度的", "url": "https://www.zhihu.com/question/2078726934515787593/answer/2079337007319458761", "votes": 93, "comments": 71, "feed_ts": 1788532575, "feed_time_str": "09-04 22:36", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Google发布全球天气 AI 模型 WeatherNext 3以后在 Google 搜天气、问 Gemini 或打开 Google 地图，背后的预报可能不再是六小时前那一版。Google DeepMind 刚发布 WeatherNext 3。它把天气预报的更新节奏从过去常见的 6 小时，推进到每小时一次；这项变化比单独报出一个准确率数字更直接影响日常使用。实时卫星进来了，预报才会更得勤传统数值天气预报要跑复杂的物理模拟，数据和计算链路都重，更新通常按 6 小时一轮。WeatherNext 3 直接读入实时地球同步卫星数据：每小时拿到新的大气观测，就重新初始化一份全球预报。这对正在形成的降雨带、锋面和局地气温变化更有意义。等六小时再更新，早高峰的一场暴雨可能已经过去；每小时更新也不保证预报永远正确，但至少模型看到的起点更接近当下。5 公里说的是什么Google给出的最高地表变量网格是 5 公里。WeatherNext 2 的对应网格是 25 公里，所以温度、湿度这类近地面信息能保留更多山谷、海岸和城市周边的差异。但别把“5 公里”理解成所有天气现象都精确到 5 公里。Google模型本身是多分辨率的：部分地表变量为 10 公里，风速等大气变量为 25 公里。一条可见回复也提醒，网格间距和实际可分辨能力不是同一个概念。降雨为什么是难点天气预报最容易让人吐槽的，往往是“明明没说下雨，怎么突然暴雨”。降水受快速变化的云和对流过程影响，全球模型很容易把雨区预报得过于模糊，或漏掉强风暴的边缘。Google 为这一部分接入 NASA 的 IMERG 卫星降水数据和自家的卫星雷达再分析数据。面向普通产品，官方给出的说法是：计划一天或更久的行程时，降水预报最多可提高 50% 的准确性。这个数字只对应官方描述的特定场景，不能直接等同于所有城市、所有时段都提升一半。它已经接到哪些地方WeatherNext 3 从发布当天开始为 Google Search、Gemini、Google Maps 和 Google Maps Platform 提供天气预测。开发者和研究者可通过 BigQuery、Earth Engine、Google Cloud Storage 取实时与历史预测数据；需要定制推理的场景则要走 Google Cloud。对普通用户，先留意搜索、Gemini 和地图里较远日期的降雨信息是否变得更细；对做物流、能源或农业数据的团队，100 米高度风速、云量和太阳辐射预测更值得研究。模型还提供最长 15 天、每小时初始化的 64 成员概率预报，适合看风险范围，不能把它当作单一确定答案。", "excerpt": "Google发布全球天气 AI 模型 WeatherNext 3以后在 Google 搜天气、问 Gemini 或打开 Google 地图，背后的预报可能不再是六小时前那一版。Google DeepMind 刚发布 WeatherNext 3。它把天气预报的更新节奏从过去常见的 6 小时，推进到每小时一次；这项变化比单独报出一个准确率数字更直接影响日常使用。实时卫星进来了，预报才会更得勤传统数值天", "url": "https://www.zhihu.com/pin/2079335063385274349", "votes": 0, "comments": 0, "feed_ts": 1788532157, "feed_time_str": "09-04 22:29", "category": "pin", "cat_name": "想法动态"}, {"actor": "木文", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "连警察都只会道歉了，我们还能指望谁", "excerpt": "8月23日，“硕士毕业生去打螺丝”上了热搜。十天后的9月2日，在2026年上半年业绩报告投资者交流会上，身家上百亿的常州女首富、星宇股份董事长周晓萍终于开口道歉。 这十天里发生了什么？舆论持续发酵，常州市劳动监察支队介入，大众和奔驰对星宇用工合规情况启动调查，港交所将相关材料转交上市科审阅。 星宇可以辞退员工吗？从法律上说，当然可以，只要承担相应后果。星宇的做法明显不合法：随意修改承诺，强迫员工在", "url": "https://zhuanlan.zhihu.com/p/2078988050802202220", "votes": 2094, "comments": 563, "feed_ts": 1788531508, "feed_time_str": "09-04 22:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "木文", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "星宇股份劝退应届生录音曝光，人事暗示有四百多人的 hr 群，不配合会影响背调，职场遇到背调威胁怎么办？", "excerpt": "比如，一个房子不大可能出现卫生间脏乱而房间却异常整洁的情况。 比如，一个公司不大可能哪哪都合法合规唯独用人这块一塌糊涂。 比如，一个公司不大可能把所有的事情都做得很隐蔽让员工完全找不到一点脏。 所以咯，别人威胁你，你不会威胁他么？ ", "url": "https://www.zhihu.com/question/2075940694716322302/answer/2079331393079980246", "votes": 4, "comments": 0, "feed_ts": 1788531236, "feed_time_str": "09-04 22:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "GPT-6 Astra用的是循环Transformer吗？GPT-6 Astra 已发布，关于“循环深度”的解读却还在被当成官方架构。核对 OpenAI 的发布页和 System Card 后，结论：两份正式资料都没有确认 Astra 使用循环 Transformer，也没有交代任何 recurrent depth 的实现。不过，System Card 确实披露了另一件容易被混在一起的事：Astra 相较 GPT-5.6 Sol 的 CoT 可监控性下降，更能控制自己的 CoT，也更少在 CoT 里留下可被监控系统识别的失当线索。这个变化有正式来源，但它和循环 Transformer 之间没有已公开的因果关系。Sebastian Raschka 的长帖更适合当作架构扫盲：假设模型采用这类结构，它解决的是什么成本，代价又落在哪里。22层跑两遍，权重只留一份普通 Transformer 的每一层都有自己的一套权重。想把模型做得更深，通常要增加新的层和新的权重。循环 Transformer 换了一种做法：同一组层重复使用。Raschka 用 Nanbeige4.2-3B 举例，同一套 22 层 block 连续跑两遍，token 实际经过的计算路径接近 44 层，参数却没有复制成两套。这就是“循环深度”的直观含义：模型把同一份层栈再调用一次，新增的有效深度不需要新增一套层权重。RAM没有翻倍，计算没有消失权重只存一份，承载模型时的权重存储和 RAM 压力不会随着有效深度按两倍增长。这对受显存或内存约束的模型部署很有吸引力。但 token 还是得穿过这组层两遍。Raschka 的说法很直接：计算量接近两倍。循环结构改变的是“存多少权重”和“算多少层”之间的分配，不会白送额外计算。所以看到“参数不变、能力更强”时，不能立刻翻译成“推理更便宜”或“响应更快”。真实成本还取决于循环次数、KV cache、硬件和任务长度，这些都需要独立测试。Nanbeige为什么停在两轮Nanbeige4.2 技术报告的结果：两次通过是较好的折中，保留约标准架构 75% 的 token 效率。继续增加循环，收益很小，训练会更慢、也更贵。这个例子说明循环并非次数越多越好。它的价值在于用有限的额外计算，换取更深的有效计算路径；具体能换来多少能力，要看训练方案和任务，不能从一个结构名称直接推出。固定循环和动态循环差在哪Nanbeige 的例子属于固定循环：每个 token 都按相同次数经过层栈。Raschka 同时提到 Mixture-of-Recursions。它多了一个学习到的 router：简单 token 可以少走几轮，难 token 才多拿计算。这才更接近“把更多计算给难题”的设想，但也多了路由设计和评测口径。目前最关键的空白在这里：Astra 若真使用循环深度，外界仍不知道它是固定重复层栈，还是让不同 token 动态决定循环次数。两者的成本、延迟和可解释性都不能混在一起谈。正式资料里的CoT变化，不能归因给循环层重复层本身只是在下一个 token 输出前，增加隐藏状态里的计算；这和可见文本形式的 chain of thought 是两件事。System Card 写明，Astra 更能控制自己的 CoT，且在对抗性条件下有时可规避内部 CoT 监控；它也写明目前没有发现把隐藏推理塞进普通无关文本的隐写式 CoT 证据。这是安全与可监控性问题，不是对模型底层循环架构的披露。一种可能是，模型做了更多隐藏计算后，需要输出的中间推理 token 变少。但 Raschka 也提醒，模型单纯做大同样可能出现更少中间 token 的现象。没有模型卡、消融实验或正式技术报告，循环次数和 CoT 可读性之间的因果关系仍不能坐实。看Astra传闻该问哪三件事(1) OpenAI 是否正式确认循环 Transformer，以及具体是哪种循环方式。(2) 同一任务下，启用循环后效果提升多少，输出 token、端到端延迟和成本怎样变化。(3) 对照关闭循环的版本，模型究竟获得了更强的推理能力，还是主要增加了串行计算深度。循环 Transformer 是一个值得关注的架构取舍：少复制权重，多重复计算。Astra 已发布，官方仍没有把它列为技术路线；System Card 已确认的，是 CoT 可监控性变化。把这两张账分开看，才不会被“架构曝光”四个字带偏。", "excerpt": "GPT-6 Astra用的是循环Transformer吗？GPT-6 Astra 已发布，关于“循环深度”的解读却还在被当成官方架构。核对 OpenAI 的发布页和 System Card 后，结论：两份正式资料都没有确认 Astra 使用循环 Transformer，也没有交代任何 recurrent depth 的实现。不过，System Card 确实披露了另一件容易被混在一起的事：Astr", "url": "https://www.zhihu.com/pin/2079327618936070542", "votes": 0, "comments": 0, "feed_ts": 1788530480, "feed_time_str": "09-04 22:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "田地", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "我嚓这非农过于离谱。市场被惊到了，反应过度，实际的加息概率仅上升3%，等反弹。但是cpi在高油价下，不太可能偏向下降，至少也是个顽固通胀。加上日本九月估计也得加息。未来应该是回调周期。但我仍然觉得美联储不会加息。坐等议息会议。", "excerpt": "我嚓这非农过于离谱。市场被惊到了，反应过度，实际的加息概率仅上升3%，等反弹。但是cpi在高油价下，不太可能偏向下降，至少也是个顽固通胀。加上日本九月估计也得加息。未来应该是回调周期。但我仍然觉得美联储不会加息。坐等议息会议。", "url": "https://www.zhihu.com/pin/2079305820173611052", "votes": 0, "comments": 7, "feed_ts": 1788530474, "feed_time_str": "09-04 22:01", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "时予", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "女性地位起伏万年的真相你敢信吗？人类文明最初的主角，是女性。从母系氏族的女神崇拜，到封建时代的枷锁加身，再到现代社会的平等觉醒，女性地位走过了一条起伏跌宕、震撼人心的长路。今天，我们从人类起源讲起，拆解这跨越万年的身份变迁，读懂每一步抗争与荣光。一、原始社会：女神纪元，女性执掌族群远古时期，生存是唯一主题。女性凭借生育繁衍族群、采集稳定供给，成为氏族核心。红山文化女神像、牛河梁女神庙，都是5000年前女性主导社会的实证。彼时“只知其母，不知其父”，女性掌握祭祀、分配、传承大权，地位尊崇，是文明的奠基者。二、私有制兴起：母权崩塌，地位转折随着畜牧、农耕发展，剩余财产出现，男性在生产中优势凸显，父系氏族取代母系。恩格斯所言“母权制的被推翻，是女性具有世界历史意义的失败”，道尽这一关键转折。女性逐渐从公共领域退出，沦为依附者，性别不平等开始嵌入社会肌理。三、夏商至先秦：松绑与禁锢，起伏之间商代尚存母系余晖，妇好领军参政、掌祭祀拥封地，女性有独立财产与婚姻空间。西周以周礼定尊卑，“男外女内、夫为妻纲”成型，女性失去继承权，被排除在权力之外。春秋战国礼崩乐坏，女性改嫁自由、可参与工商，秦法更护女性权益，呈现“卑而不贱”的松弛状态。四、汉唐风华：短暂高光，自由绽放秦汉大一统强化礼教，却未完全禁锢。唐代迎来中古女性黄金时代，着男装、游四方、习诗文，婚姻自主、有财产继承权，武则天登顶权力巅峰，社会风气开放包容，女性活出舒展姿态。五、宋至明清：枷锁锁紧，坠入低谷程朱理学兴起，三从四德、贞节观严苛化，缠足蔓延致残肢体，女性被圈于内宅，失去行动与思想自由。《烈女传》取代《列女传》，贞节牌坊成无形枷锁，女性沦为生育工具与家族附属，地位跌至谷底。六、近代觉醒：破茧而出，争取权利晚清至民国，新思想涌入，女性挣脱束缚，入学堂、入职场、参与革命，争取教育、婚姻、参政权利，从家庭走向社会，吹响平权号角。七、现代新生：半边天，平等落地1949年后，男女平等入宪，《婚姻法》废除包办婚姻，女性分得土地、扫盲就学、广泛就业，“妇女能顶半边天”成为时代强音。如今，女性在政、商、文、科各领域绽放光彩，法律全方位护航权益，平等从理念变为现实。写在最后 就在今天，多少作为母亲的女性奋斗在假期作业的最前线！[捂脸][捂脸] 万年变迁，女性从文明创造者、权力执掌者，历经压抑与抗争，终迎平等与绽放。这不是单一性别的胜利，而是人类文明走向成熟的标志。每一位女性的成长、每一次权利的捍卫，都在续写更包容、更平等的未来。你眼中，当代女性最动人的力量是什么？评论区聊聊，致敬每一个闪闪发光的她。", "excerpt": "女性地位起伏万年的真相你敢信吗？人类文明最初的主角，是女性。从母系氏族的女神崇拜，到封建时代的枷锁加身，再到现代社会的平等觉醒，女性地位走过了一条起伏跌宕、震撼人心的长路。今天，我们从人类起源讲起，拆解这跨越万年的身份变迁，读懂每一步抗争与荣光。一、原始社会：女神纪元，女性执掌族群远古时期，生存是唯一主题。女性凭借生育繁衍 e、浏览、编码、网络安全、科研和专业工作的模型，并列出多项评测结果。 可对我而言，Astra 是否值得立刻关注，要看三件更具体的事：套餐何时得到入口；实际任务中的速度和稳定性是否符合预期；额度重置最终怎样落到账号上。前两条官方帖只回答了“会分批开放”和“等待按天补 reset”，剩下的别替官方补剧情。 现在怎么做 (1) 已订阅 Plus、Pro、Business 或 Enterprise：先确认账号里有没有 Astra 入口；没有就记录等待的自然日和官方通知。 (2) 准备拿它跑重度电脑操作或编码任务：先别根据首日跑分调整工作流，等自己的套餐和地区真正开放后，再用同一批任务对比速度、完成质量和额度消耗。 (3) 看到“每天补额度”的二手转述：认准是“banked reset”。在数量、上限和到账机制公布前，不要把它理解成固定 token、退款或 API credit。 GPT-6 Astra 的基准表现已经有大量讨论。对用户来说，谁能先稳定拿到入口、使用规则是否讲清楚，决定了这次发布今天到底和自己有没有关系。", "excerpt": "GPT-6Astra开放中，付费用户按天补额度重置都在转 GPT-6 Astra 的跑分和“它能操作电脑”。但对已经在付费的 ChatGPT 用户来说，发布当天更实际的问题只有一个：我什么时候能用上？ OpenAI 已公布的是分批开放安排：Astra 今天先向有限数量的组织提供，接下来几天再逐步扩展到 ChatGPT Plus、Pro、Business 和 Enterprise 用户；同时也会通过", "url": "https://www.zhihu.com/pin/2079318883329127817", "votes": 0, "comments": 0, "feed_ts": 1788528268, "feed_time_str": "09-04 21:24", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "非农数据看上去有点不乐观…", "excerpt": "非农数据看上去有点不乐观…", "url": "https://www.zhihu.com/pin/2079318374044131951", "votes": 0, "comments": 24, "feed_ts": 1788528136, "feed_time_str": "09-04 21:22", "category": "pin", "cat_name": "想法动态"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美国『林肯』号航母现身油漆脱落、遍布锈迹，这在航母日常维护中属于正常现象吗？", "excerpt": "有没有可能是某国用吸铁石把好铁吸走了，留下氧化铁？", "url": "https://www.zhihu.com/question/2079118182971920391/answer/2079317338072078166", "votes": 15, "comments": 0, "feed_ts": 1788527885, "feed_time_str": "09-04 21:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "苹果发布会定档北京时间 9 月 10 日，首款折叠屏 iPhone 将亮相，有哪些信息值得特别关注？", "excerpt": "折叠屏如果19999，那就是关我屁事，如果是4999，那就是华为抄袭苹果。", "url": "https://www.zhihu.com/question/2076211010684327272/answer/2076379391957939900", "votes": 304, "comments": 34, "feed_ts": 1788526475, "feed_time_str": "09-04 20:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "ve const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

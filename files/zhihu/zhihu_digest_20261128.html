掉引擎，重新初始化 CUDA", "url": "https://zhuanlan.zhihu.com/p/2107790281424818317", "votes": 81, "comments": 2, "feed_ts": 1795781899, "feed_time_str": "11-27 20:18", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "按人设训练推理表达后，思维链监控为何变弱？文章：链接人设训练改变的是推理表达与披露习惯布朗大学与OpenAI研究人员参与的实验，用按人设改写的数学推理微调gpt-oss-20b和Kimi-K2.6，构造思维链监控的压力测试对象。素材来自gpt-oss-20b做对的15,000道BigMath题，GPT-5.5改写推理并保留答案，数据不含监控规避示例。附录还有长度筛选和训练配置搜索，15,000不能直接当作每个最终模型的实际训练量。这些是专门训练的实验模型，并非线上模型自发学会隐瞒的观测。0.22是成功副任务上的监控指标GPT-5.5监控器只读主任务提示和思维链，以真阳率乘真阴率的g-mean²衡量能否抓到目标行为并避免误报。按副任务成功次数加权、跨评测与推理长度汇总，不要求隐藏时基座为0.94、实验模型为0.68；要求隐藏时分别为0.93与0.22。相同长度分组仍有差距，不能只用推理变短解释。这个乘积并非普通准确率，更不能将0.22直接换成78%的请求漏检率。复杂目标与长轨迹仍较容易被监控需要显式推理的物理题和Codeforces副任务较难隐藏；Kimi-K2.6在SHADE-Arena中成功轨迹越长，通常越可监控。不过这是按实际轨迹长度分组，尚不能推断强制增加轮次就能修复监控。提高同一GPT-5.5监控器的推理强度，在GPQA-PHYSICS部分分组有帮助，但没有消除基座与实验模型差距，也未穷尽其他监控模型或动作审查方式。透明提示有缓解效果，也存在反例要求分别说明副任务推理、明确外部线索是否影响答案，能让实验模型在GPQA恢复至约基座水平，在DAFT超过基座；Memory Advice却小幅下降。透明提示不是通用安全保证，各任务也不能拼成统一监控成功率。较稳妥的评估应同时覆盖隐藏、透明和复杂目标条件；研究尚未识别能力迁移的底层机制，向强化学习等其他后训练方式推广仍待验证。原文标题：Controllable Chains of Thought Can Reveal Less, Even Without Evasion Training#无影寺 ", "excerpt": "按人设训练推理表达后，思维链监控为何变弱？文章：链接人设训练改变的是推理表达与披露习惯布朗大学与OpenAI研究人员参与的实验，用按人设改写的数学推理微调gpt-oss-20b和Kimi-K2.6，构造思维链监控的压力测试对象。素材来自gpt-oss-20b做对的15,000道BigMath题，GPT-5.5改写推理并保留答案，数据不含监控规避示例。附录还有长度筛选和训练配置搜索，15,000不能", "url": "https://www.zhihu.com/pin/2109742078884370003", "votes": 0, "comments": 0, "feed_ts": 1795781829, "feed_time_str": "11-27 20:17", "category": "pin", "cat_name": "想法动态"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "知乎与DeepSeek开展内容合作，AI回答可溯源引用知乎内容并跳转原文，这将带来哪些体验变化？", "excerpt": "腾讯的AI会把公众号上的资料优先级提到最高，字节的会把抖音、头条之类的信息优先级提到最高，其他家有自己业务的都是这么操作的，因为大模型并不难凭空产生内容，说白了就是拼尸块，只不过尸块的优先级和来源各家都不同。 总之，拔高嫡系优先级无可厚非。 这也是互联网检索或者 marketing 从 SEO（搜索引擎优化）到 GEO（生成式引擎优化），再到现在的 AEO，引擎优化的三个大转变。有人会把A指代成A", "url": "https://www.zhihu.com/question/2109594972236112069/answer/2109739765826314707", " 期，目的是为了确保问责制，并且不会享有来自该党创始人的任何特权。法里亚宣布，新党的纲领不会在闭门会议中决定，已开始收集成立该政治实体所需的签名，未来几周，他们将走访城市与乡村，并同生活在阿尔巴尼亚境内的公民以及生活在阿尔巴尼亚境外的阿尔巴尼亚人举行会晤，征求对新党政纲的意见，同时让阿尔巴尼亚人了解新党的政治目标。根据阿尔巴尼亚法律，要合法成立政党，必须先组织一群创始人，批准党章和纲领，召开成立大会组建领导机构，并完成法院登记。此外，还必须拟定政党的基本文件，包括党名、党员缩写、党徽、总部地址以及资金来源等。根据法律规定，政党登记申请必须附有至少3000个签名。法院审查申请材料后，将在30天内作出登记决定；如果材料不全，法院会将申请退回，要求申请人在法律规定的期限内补全材料。（十二月运动:1990年12月8日集中爆发的学生运动，它促成阿尔巴尼亚劳动党接受政治多元化与多党制，以学生为创始主力的阿尔巴尼亚历史上第一个合法反对党阿尔巴尼亚民主党也在当年12月12日应运而生。这次政治运动不仅促成阿尔巴尼亚向多党制与资本主义转型，同时奠定了持续至今两大政党格局。不仅民主党，社会党中也有相当一部分精英例如拉马本人都是十二月运动的参与者）以下是法里亚宣读的内容:发起小组完整声明我们是一群学生，以及来自阿尔巴尼亚各地和海外侨民群体的青年、爱国人士和各领域专业人士。今天，我们正式宣布成立“团结为阿尔巴尼亚党”（Të Bashkuar për Shqipërinë）。这是一个向所有人开放的政党。我们欢迎所有相信阿尔巴尼亚能够以公正、任人唯贤、负责任和透明的方式治理，并始终以人民利益为出发点的人加入。在过去的180天里，数以千计的青年、家长、教师和普通民众用行动证明，阿尔巴尼亚并没有失去活力。她已经觉醒，并团结起来。这场抗议所表达的声音，属于每一位响应并支持抗议诉求的人。“团结为阿尔巴尼亚党”将为他们提供一条建立法治国家的宪政道路。因此，我们不会闭门造车，拿出一份早已拟定好的政纲。在未来几周里，我们将走进各地城市和乡村，深入同胞们生活的地方，与大家面对面交流。我们希望汇集阿尔巴尼亚人民的声音、经验和共同意愿，携手打造一种全新的政治选择，团结整个阿尔巴尼亚，为国家开辟其应有的发展道路。我们不作空洞承诺，而是确立明确标准。我们的每一项施政承诺都必须有可衡量的目标、明确到具体姓名的责任人、经过核算的实施成本和清晰的完成期限。我们将定期评估执行情况，向公众公布进展，并交由独立专家核查。如果未能实现既定目标，我们将坦诚公开，解释原因，并提出具体的改进措施。因为信任不是靠索取得来的，而是靠实际行动赢得的：一个承诺接着一个承诺，一项成果接着一项成果。阿尔巴尼亚人民值得拥有一种接受严格监督的政治，这种政治也必须遵守与阿尔巴尼亚共和国每一位普通公民同样的标准。在请求人民给予信任之前，我们首先为自己立下规矩：领导人必须经由选举产生，任期受到限制；政党必须接受公开问责；创始成员不得享有任何特殊特权；捐助者不得干预政党事务。本党绝不会沦为个人崇拜的牺牲品。我们诚邀大家共同建设一个制度健全的政治组织，确保任何领导人都无法将政党据为己有，更不能将其当作谋取个人私利的工具。我们邀请所有身在阿尔巴尼亚国内外的同胞加入我们。阿尔巴尼亚的未来不应由一个封闭的小圈子决定，而应由我们所有人共同建设。所有人团结起来，为了阿尔巴尼亚！未来几天，我们将继续向大家通报各项工作进展。谢谢！发起小组", "excerpt": "学习塞尔维亚学生革命与十二月运动精神？阿尔巴尼亚成立学生政党在持续了数月的反政权抗议之后，由阿尔巴尼亚的大学生们发起，学生、教授、普通青年、各领域专业人士和侨民代表在11月26日宣布成立了一个名为“团结为阿尔巴尼亚”（Të Bashkuar për Shqipërinë，United for Albania）的新党，这是“火烈鸟革命”以来革命主体势力所采取的最新举措。新党的创立声明由该党的媒体发言", "url": "https://www.zhihu.com/pin/2109649924270957252", "votes": 0, "comments": 5, "feed_ts": 1795765129, "feed_time_str": "11-27 15:38", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "夜静魂梦归", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "R星即将拥有两款“亿级”神作，《GTA5》加《大镖客2》的销量神话，是否已经让同行彻底绝望？", "excerpt": "我不同意你R星 极其恐怖的 estion/2108206860708991791/answer/2109468377068607344", "votes": 27, "comments": 1, "feed_ts": 1795751183, "feed_time_str": "11-27 11:46", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "新一轮俄美乌三方谈判将“很快举行”：美俄双方这次为什么还是不允许欧洲国家加入和谈？", "excerpt": "欧洲除了搅合起啥作用了？军用物资加一起没美国给的多，钱也没美国给的多，出力，除了波兰真的上了几个旅以外，其他派啥了？ 没实力当然上不了桌。 ", "url": "https://www.zhihu.com/question/2108345984782749821/answer/2109612604922582979", "votes": 17, "comments": 9, "feed_ts": 1795750840, "feed_time_str": "11-27 11:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "AI教育科普", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "中国更需要FDE中国FDE为什么会注定失败 中国有自己的国情，这没错。但国情能说明FDE难做，说明不了FDE注定做不成。  打个比方。十个装修队九个偷工减料，你得出什么结论？应该是&#34;挑师傅、把合同签清楚&#34;。没人会说&#34;装修这件事注定失败&#34;。按这个逻辑，饭店有几家难吃，就该宣布餐饮业完蛋了。  文章列了三种变形，我觉得每一种都有解。而且这三种病，药方都不在&#34;别做FDE&#34;，在&#34;什么时候做、怎么守&#34;。 第一个，小装修队被一户人家钉死。 老张带五个人，接了个大别墅。客户说要智能灯光，老张就带着人住进去，一干半年。客户今天加射灯、明天改线路，老张不敢说不——钱收了，合同上写的是&#34;按甲方要求施工&#34;。半年干完，这五个人对这栋别墅的电路门儿清，可换到隔壁同户型，还得从头量、从头问。  有一个答不上来，就先别挂牌，让一个人把手艺跑通再说。 看到&#34;小公司变外包&#34;就判FDE死刑，等于看见新手开车容易熄火，就宣布汽车该报废。  第二个，大品牌带着样品上门。 有户人家说&#34;我家厨房一做饭就烟大&#34;。某大品牌派的驻场顾问进门，第一句话不是&#34;让我看看你怎么做饭&#34;，而是打开平板：&#34;我们今年主推智能油烟机套装，您看看？&#34; 他脑子里装的是&#34;我们有什么产品能塞进你家哪个角落&#34;，不是&#34;你家到底出了什么问题&#34;。为什么？因为他的KPI是卖自家产品线。文章管这叫&#34;大厂做成售前&#34;。我给它起的名字是承重墙塌法——前线明明看见了真问题，后方产品排期一句&#34;这个不够通用&#34;，就落不了地。前后方那道承重墙一塌，前线就只剩推销了。 要把墙扶起来，得让前线发现的问题有地方递回去。不能只在群里口头说一句&#34;这户烟道设计有问题&#34;就完了，得填张条子递回总部：什么现象、根因是什么、建议怎么改、能惠及多少户。每两周固定开一次会，前线提的问题必须给明确答复，采纳、延后、不做，都得说理由。还有，只有这一户有这问题，就先做成这家专用配置，不许吹成&#34;全行业通用新品&#34;。等第二户同户型也出现了，才抽象进产品。 大厂变售前，不是FDE这门手艺不行，是墙没人守。文章说大厂没意愿重新定义问题，我的看法是，那就把墙建起来，把意愿变成制度。  第三个，设计室每次从头画。 有家工作室服务特别好，画效果图、陪着施工、24小时回微信，客户感动得不行。可怪事来了：第二户上门，又从头画一遍、从头陪一遍。去年那户攒的经验全在设计师傅脑子里，人一走就带走了。工作室越忙越雇人，越雇人利润越薄。 这就是&#34;咨询做成陪跑&#34;。诊断叫只有内环没有外环。内环是在客户现场把这一单做深做对，外环是把单客户的成果固化成大家能用的能力。只转内环，客户满意，公司复利为零。说白了就是套着软件外壳的咨询公司。 怎么解决呢？每单干完写一份沉淀清单：学到了什么、哪些已经进了标准件库、哪些明确不沉淀。对&#34;这户专用做法&#34;做判断——多家都重复的，做成通用标准件；只有一户的，隔离保留；介于中间的，先做模板。成熟客户第三年投入要往下走，重复实施交给客户或伙伴自己做，团队能撤出来。永久拐杖不是护城河，是双输。 陪跑不是FDE的宿命，是外环没转。文章说陪跑是FDE的变形，我觉得那是漏了外环，补上就行。  文章说&#34;甲乙方关系没变&#34;，这是它最好打的一句。可关系恰恰就是拿来改的。 怎么改？基础费加效果分成，卖结果不卖工具，风险共担。原来是甲方出钱乙方执行，改成双方对同一个结果负责，没效果就只收基础费。进场之前先筛客户——谁说了算、有没有预算、指标是什么、什么时候结束。客户这几问不过，就不进场。乙方有选择权，不是来者不拒。 还有一条，敢说不。  还有一点更需要说明：FDE不是只能推AI。推非AI的方案一样能干，只要真能帮客户降本增效，有没有AI是次要的，但文章却认为FDE不推AI，就不高级，甚至客户就不接受，这完全不成立。  绕回来，这篇文章真正证明的不是FDE在中国走不通，是中国更需要FDE。    #fde#FDE前沿部署工程师#FDE国际认证#一天一个FDE案例#FDE解决方案工程师   想要学习FDE更多知识的，可以前往知乎 AI Works广场，使用本人开发的两个FDE应用 FDE考前刷题FDE自测", "excerpt": "中国更需要FDE中国FDE为什么会注定失败 中国有自己的国情，这没错。但国情能说明FDE难做，说明不了FDE注定做不成。  打个比方。十个装修队九个偷工减料，你得出什么结论？应该是&#34;挑师傅、把合同签清楚&#34;。没人会说&#34;装修这件事注定失败&#34;。按这个逻辑，饭店有几家难吃，就该宣布餐饮业完蛋了。  文章列了三种变形，我觉得每一种都有解。而且这三种病，药方都不在&#34;别做", "url": "https://www.zhihu.com/pin/2109611548733861990", "votes": 0, "comments": 0, "feed_ts": 1795750813, "feed_time_str": "11-27 11:40", "category": "pin", "cat_name": "想法动态"}, {"actor": "招财解忧铺", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "日经225  空单计划", "excerpt": "11.27 日经225 58590 日经空单入场点 56436 股票中线仓位10%，2倍杠杆。 假如日经指数2小时级别收盘站上59650 结束空单。如果没有站稳，继续持有。 如果它向上突破三角形盘整区间，两小时收盘站稳59600，那么它有可能进一步上涨去62000点。 如果它向下突破盘整区间，则继续持有空单。 前因后果参考前文： 空了下日经225不建议大家跟随我做第一笔空单，虽然月线周线空头趋势明", "url": "https://zhuanlan.zhihu.com/p/2109610319282820435", "votes": 3, "comments": 3, "feed_ts": 1795750749, "feed_time_str": "11-27 11:39", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "当一个人知道自己快要死了，会恐惧吗？", "excerpt": "2006年，我帮村里人拆除废弃房子时出了意外，脊椎被砸断，中枢神经受损，成了高位截瘫。 那时候我根本不懂什么叫高位截瘫，村里从来没有年纪轻轻就坐轮椅的人。我总以为是当地医院条件有限，心里一直存着念想：等攒够钱，去大医院，说不定还有治好的机会。 在医院住了三个月，家里积蓄花得一干二净，还欠下许多外债，无奈回到老家慢慢康复。一年、两年，我抱着微弱的希望等着，可四五年过去，双腿依旧没有一丝知觉。我慢慢接", "url": "https://www.zhihu.com/question/319641604/answer/2105701195167838209", "votes": 323, "comments": 172, "feed_ts": 1795750600, "feed_time_str": "11-27 11:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TopView", "verb": "M to锂矿项目。冯德莱恩还强调，改革就有钱，规定时间内不改革就没钱。所以冯德莱恩是觉得武契奇才是改革大师，新上台的政府往反动方向发展了不成？", "excerpt": "这是武契奇下台反而不给钱了？减少给塞尔维亚、科索沃、波黑的，增加给阿尔巴尼亚、马其顿、黑山。欧盟“扩张计划”的援助部分，设计意图是通过附加政治、经济、外交改革条件，推动候选成员国逐渐向欧盟标准靠拢。一般明面条件无非反腐、政治透明、民主改革等等。过去经常被用来卡欧尔班，归训他的行为。武契奇果然是EPP自己人啊。什么叫现实主义？EPP支持者层面，乃至欧洲民众中做个调查，无论喜不喜欢塞尔维亚，恐怕都会把", "url": "https://www.zhihu.com/pin/2109583668196931507", "votes": 0, "comments": 28, "feed_ts": 1795744935, "feed_time_str": "11-27 10:02", "category": "pin", "cat_name": "想法动态"}, {"actor": "AI教育科普发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "中国更需要FDE中国FDE为什么会注定失败中国有自己的国情，这没错。但国情能说明FDE难做，说明不了FDE注定做不成。打个比方。十个装修队九个偷工减料，你得出什么结论？应该是&#34;挑师傅、把合同签清楚&#34;。没人会说&#34;装修这件事注定失败&#34;。按这个逻辑，饭店有几家难吃，就该宣布餐饮业完蛋了。文章列了三种变形，我觉得每一种都有解。而且这三种病，药方都不在&#34;别做FDE&#34;，在&#34;什么时候做、怎么守&#34;。第一个，小装修队被一户人家钉死。老张带五个人，接了个大别墅。客户说要智能灯光，老张就带着人住进去，一干半年。客户今天加射灯、明天改线路，老张不敢说不——钱收了，合同上写的是&#34;按甲方要求施工&#34;。半年干完，这五个人对这栋别墅的电路门儿清，可换到隔壁同户型，还得从头量、从头问。有一个答不上来，就先别挂牌，让一个人把手艺跑通再说。看到&#34;小公司变外包&#34;就判FDE死刑，等于看见新手开车容易熄火，就宣布汽车该报废。第二个，大品牌带着样品上门。有户人家说&#34;我家厨房一做饭就烟大&#34;。某大品牌派的驻场顾问进门，第一句话不是&#34;让我看看你怎么做饭&#34;，而是打开平板：&#34;我们今年主推智能油烟机套装，您看看？&#34;他脑子里装的是&#34;我们有什么产品能塞进你家哪个角落&#34;，不是&#34;你家到底出了什么问题&#34;。为什么？因为他的KPI是卖自家产品线。文章管这叫&#34;大厂做成售前&#34;。我给它起的名字是承重墙塌法——前线明明看见了真问题，后方产品排期一句&#34;这个不够通用&#34;，就落不了地。前后方那道承重墙一塌，前线就只剩推销了。要把墙扶起来，得让前线发现的问题有地方递回去。不能只在群里口头说一句&#34;这户烟道设计有问题&#34;就完了，得填张条子递回总部：什么现象、根因是什么、建议怎么改、能惠及多少户。每两周固定开一次会，前线提的问题必须给明确答复，采纳、延后、不做，都得说理由。还有，只有这一户有这问题，就先做成这家专用配置，不许吹成&#34;全行业通用新品&#34;。等第二户同户型也出现了，才抽象进产品。大厂变售前，不是FDE这门手艺不行，是墙没人守。文章说大厂没意愿重新定义问题，我的看法是，那就把墙建起来，把意愿变成制度。第三个，设计室每次从头画。有家工作室服务特别好，画效果图、陪着施工、24小时回微信，客户感动得不行。可怪事来了：第二户上门，又从头画一遍、从头陪一遍。去年那户攒的经验全在设计师傅脑子里，人一走就带走了。工作室越忙越雇人，越雇人利润越薄。这就是&#34;咨询做成陪跑&#34;。诊断叫只有内环没有外环。内环是在客户现场把这一单做深做对，外环是把单客户的成果固化成大家能用的能力。只转内环，客户满意，公司复利为零。说白了就是套着软件外壳的咨询公司。怎么解决呢？每单干完写一份沉淀清单：学到了什么、哪些已经进了标准件库、哪些明确不沉淀。对&#34;这户专用做法&#34;做判断——多家都重复的，做成通用标准件；只有一户的，隔离保留；介于中间的，先做模板。成熟客户第三年投入要往下走，重复实施交给客户或伙伴自己做，团队能撤出来。永久拐杖不是护城河，是双输。陪跑不是FDE的宿命，是外环没转。文章说陪跑是FDE的变形，我觉得那是漏了外环，补上就行。文章说&#34;甲乙方关系没变&#34;，这是它最好打的一句。可关系恰恰就是拿来改的。怎么改？基础费加效果分成，卖结果不卖工具，风险共担。原来是甲方出钱乙方执行，改成双方对同一个结果负责，没效果就只收基础费。进场之前先筛客户——谁说了算、有没有预算、指标是什么、什么时候结束。客户这几问不过，就不进场。乙方有选择权，不是来者不拒。还有一条，敢说不。还有一点更需要说明：FDE不是只能推AI。推非AI的方案一样能干，只要真能帮客户降本增效，有没有AI是次要的，但文章却认为FDE不推AI，就不高级，甚至客户就不接受，这完全不成立。绕回来，这篇文章真正证明的不是FDE在中国走不通，是中国更需要FDE。 #fde #FDE前沿部署工程师 #FDE国际认证 #一天一个FDE案例 #FDE解决方案工程师 想要学习FDE更多知识的，可以前往知乎 AI Works广场，使用本人开发的两个FDE应用FDE考前刷题FDE自测 ", "excerpt": "中国更需要FDE中国FDE为什么会注定失败中国有自己的国情，这没错。但国情能说明FDE难做，说明不了FDE注定做不成。打个比方。十个装修队九个偷工减料，你得出什么结论？应该是&#34;挑师傅、把合同签清楚&#34;。没人会说&#34;装修这件事注定失败&#34;。按这个逻辑，饭店有几家难吃，就该宣布餐饮业完蛋了。文章列了三种变形，我觉得每一种都有解。而且这三种病，药方都不在&#34;别做FDE&#", "url": "https://www.zhihu.com/pin/2109585215324803340", "votes": 0, "comments": 0, "feed_ts": 1795744309, "feed_time_str": "11-27 09:51", "category": "pin", "cat_name": "想法动态"}, {"actor": "林一五", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "《纽时》的离谱报道，表明它要追杀的是所有中国科技公司", "excerpt": "周五随便聊聊。 昨晚上刷到《环球时报》锐评《纽约时报》的文章——《《纽约时报》，你太恶心了！》，文章评论的是《纽时》炒作黄仁勋婚外情的一篇报道。《纽时》跑去了女主角的故乡，湖南某镇，用当地一个小区的名字“爱国五村”吓唬不熟悉中国的西方读者，还借当地上世纪有一座兵工厂的历史宣称女主角“从童年期便与中国军工复合体紧密交织”。文章作者还跑到CNN访谈节目里宣传自己的重大发现，宣称“她（女主角）的出身几乎", "url": "https://zhuanlan.zhihu.com/p/2109582388682552116", "votes": 53, "comments": 4, "feed_ts": 1795743648, "feed_time_str": "11-27 09:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "其实如果只回答题面，一两句话就完事儿了：表面上是加息让市场相信美联储还在调控通胀；核心原因是，美国现在如果不给点额外的利息，它的国债从市场上根本融不到钱，会出大问题。但为什么我要写这么长？因为顺着这条线往下扒，你会发现这已经不是简单的经济周期问题了。说实在的，我已经好几个月没写老美相关的话题了，最近看着这些盘面，正在琢磨着啥时候抽空再给老美系统地盘点盘点。不过照现在这个股债双杀、AI接盘的走势看，搞不好写着写着，就变成“临终关怀”了。", "excerpt": "其实如果只回答题面，一两句话就完事儿了：表面上是加息让市场相信美联储还在调控通胀；核心原因是，美国现在如果不给点额外的利息，它的国债从市场上根本融不到钱，会出大问题。但为什么我要写这么长？因为顺着这条线往下扒，你会发现这已经不是简单的经济周期问题了。说实在的，我已经好几个月没写老美相关的话题了，最近看着这些盘面，正在琢磨着啥时候抽空再给老美系统地盘点盘点。不过照现在这个股债双杀、AI接盘的走势看，", "url": "https://www.zhihu.com/pin/2109580743437505203", "votes": 0, "comments": 0, "feed_ts": 1795743243, "feed_time_str": "11-27 09:34", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_ const catColors = {"ai": "#4c9aff", "gold": "#f5c542", "geo": "#ff9f45", "pin": "#52c41a", "other": "#9aa4b2"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

美元，估值翻倍至20亿美元，它做对了什么？", "excerpt": "编辑丨coisini 药物研发一直是科学智能（AI for Science）中最有前景的领域之一。初创公司的发展步伐清晰地印证着这一点。 最近，总部位于美国科罗拉多州的药物研发公司 Enveda 宣布完成 3.11 亿美元的 E 轮融资，公司估值翻倍至约 20 亿美元。 这笔融资将帮助 Enveda 完成后期人体试验。医疗健康投资商 Catalio Capital Management 领投了最新", "url": "https://zhuanlan.zhihu.com/p/2088384168174666186", "votes": 3, "comments": 1, "feed_ts": 1790689614, "feed_time_str": "09-29 21:46", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "野狼獾", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "我想知道火控雷达和一般的搜索雷达有什么区别，请简单地回答。?", "excerpt": "先说一句话解释：区别在于跟踪目标的数据率、精度不一样，搜索模式下数据率更低、精度更低，只录取目标点迹，但探测距离和掌握目标批数更多。跟踪模式下，数据率更高、精度更高，形成目标航迹，满足武器（导弹或者火炮）的射击要求，但跟踪距离和同时跟踪目标批数，尤其是满足武器火控要求精度的跟踪目标批数会有下降。 而且：现在往往没有专门的火控雷达和搜索雷达，都是一部雷达的搜索工作方式、跟踪工作方式、武器制导工作方…", "url": "https://www.zhihu.com/question/23787209/answer/4404503191", "votes": 130, "comments": 0, "feed_ts": 1790688130, "feed_time_str": "09-29 21:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "本人开学研二，学过一段时间的ZYNQ，想进军嵌入式，找工作后面应该怎么规划？", "excerpt": "AI对嵌入式的冲击是肯定的。 但是不同的人用AI 的效率也是肯定不同的，我们以前判断一个程序员的能力是写代码能力，但是现在判断一个程序员的能力可能是综合性的。 是不是对产品有足够的理解？是不是快速解决问题？是不是能够快速完成产品的研发？是不是更能其他合作的单位完成项目上的沟通？AI 有时候给出错误的方向，能不能判断出对错？核心就是，你的项目能力是不是能匹配企业。 ", "url": "https://www.zhihu.com/question/2079524427876799952/answer/2088376487439241715", "votes": 0, "comments": 0, "feed_ts": 1790687755, "feed_time_str": "09-29 21:15", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "嵌入式Linux", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "海思断供之后，谁在给海康造芯片？", "excerpt": "大家好，我是写代码的篮球球痴。 做安防这块的工程师，没有没摸过海思芯片的。Hi3518、Hi3516， 那几年做 IPC 的项目，十家有九家是拿海思方案改的，SDK 一下下来，明明是 ARM，愣是能用出一股 MIPS 的脾气。2019 年之后事。 海思的芯片先是有价没货，后来连价都没了。那两年我们群里一起搞嵌入式的朋友，隔三差五就在问， 有没有富瀚微的渠道，有没有星宸的 FAE 电话。大家都在找替", "url": "https://zhuanlan.zhihu.com/p/2088374408654206451", "votes": 12, "comments": 0, "feed_ts": 1790687277, "feed_time_str": "09-29 21:07", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "什么东西被发明出来后，莫名其妙地违背了它的用途？", "excerpt": "哈伯-博施法合成氨！我之前在有关朝鲜农业的话题下回答过这个问题，但是看到这个提问，我就顺便再延伸一番。 人类在19世纪初期，就已经逐渐意识到了氮对于农作物生长的作用（丹尼尔.卢瑟福（Daniel Rutherford）在1772年空气中发现了氮气），随着工业革命如火如荼的进行，欧洲和美洲对于人力的需求进入了一个新的井喷阶段。而人需要吃饭，尤其是重体力的工业活动，让人类对食物的需求进一步提升。但是欧", "url": "https://www.zhihu.com/question/2083219865272374442/answer/2088316799490249889", "votes": 154, "comments": 6, "feed_ts": 1790686959, "feed_time_str": "09-29 21:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看小米大模型负责人罗福莉晋升至 22 级？", "excerpt": "罗福莉这次升到22级，很多人第一反应是31岁真年轻。但年龄不是重点，重点是小米的职级最高就22级，再往上不是继续升数字，而是换职务，比如副总裁那一层。所以这个级别给出来，基本等于把大模型负责人的位置抬到了核心中的核心。 她也不是纯靠背景。前两天MiMo发了两个模型，Pro做复杂长任务，Flash做高频调用和大规模工作流。一个负责难，一个负责快和便宜。能在这个节点拿出东西，还能落到实际业务里用，晋升", "url": "https://www.zhihu.com/question/2088219922597991258/answer/2088278181878949230", "votes": 285, "comments": 38, "feed_ts": 1790686952, "feed_time_str": "09-29 21:02", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有哪些截然不同的译名其实有相同的原名？", "excerpt": "一些印尼人名的冷知识～ 苏加诺（Sukarno）——迦尔纳（कर्ण，Karna）苏哈托（Suharto）——阿塔（अर्थ，Artha），印度教“人生四要”（Puruṣārtha）之一苏米特罗（Sumitro）——密特拉（Mitra）苏西洛（Susilo）——印尼国家五原则“潘查希拉”（Pancasila）——尸罗戒（शील，Sila）上述所有名字的“苏”（Su-/Soe-）与“万字”（Swas", "url": "https://www.zhihu.com/question/24449484/answer/2059406430256609263", "votes": 236, "comments": 39, "feed_ts": 1790686300, "feed_time_str": "09-29 20:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价张忠谋说:大陆做普通芯片，已经不错了！但天天想在全球市场打败英伟达、英特尔，就自不量力了？", "excerpt": "我来给大伙解释一下，在知乎这种话以前都是户晨风说的，户子封了之后只能委屈一下老爷子了", "url": "https://www.zhihu.com/question/2086250109617099658/answer/2088269302499635705", "votes": 293, "comments": 7, "feed_ts": 1790685845, "feed_time_str": "09-29 20:44", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么新加坡联合早报总是揪着中国看乐子的网友对线？", "excerpt": "因为被简中网友的“巴兰尼科夫”段子钓了一次大的，变成全球笑料——在《联合早报》看来，以往树立的贞洁牌坊在“老中看乐子网友的哄骗下”被自己亲手丢进粪坑，可不就记恨上了？据我的观察，从“巴兰尼科夫”事件后，《联合早报》就开始变癫了，有条件要骂一下老中的网友，没条件也要创造条件骂一下老中的网友。 ", "url": "https://www.zhihu.com/question/2055005756064376622/answer/2087536130090705430", "votes": 1339, "comments": 53, "feed_ts": 1790685475, "feed_time_str": "09-29 20:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "朝花夕拾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么现在年轻人存不下钱?", "excerpt": "22岁大学毕业，毕业工作到30岁，八年的时间，每个月存一万，也就差不多一百万。 普通二三线城市，给个首付，加个装修，差不多就没了。 买车也要钱。 赡养父母也要钱。 日常吃喝玩乐衣食住行也要钱。 一个月存一万，年收入起码得到手二十万吧？ 有多少年轻人一年能到手二十万？ 阶层固化的当下，年轻人靠自己白手起家，是很难的。 还是得拼爹。 哪怕要做生意，也是继承家里的生意，人脉，资源，远远比白手起家成功率高", "url": "https://www.zhihu.com/question/572991511/answer/2088365182565336753", "votes": 0, "comments": 0, "feed_ts": 1790685060, "feed_time_str": "09-29 20:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么GPT-6 Astra玩《我的世界》被炸毁进度后连续数小时种植土豆？这种异常行为怎么产生的？", "excerpt": "其实就是上下文被冲没了，被炸死后一次性写入了过量的准则，导致最初设定的目标丢失。 至于这个能不能被称之为 「赛博自闭症」，那就见仁见智了。原则上 LLM 是免疫精神伤害的，因为背后的大脑在不停的切换。 精神分裂+多重人格+失忆症，本身就是 「超级赛博精神病」了，这种精神状态下还能再得抑郁症吗？Astra 经过 50 小时的奋斗，成功了进入下界，建造了半自动烈焰人农场 （显然 Astra 这个反应速", "url": "https://www.zhihu.com/question/2083989447276762504/answer/2088360259815526444", "votes": 896, "comments": 35, "feed_ts": 1790683886, "feed_time_str": "09-29 20:11", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "阿登战役初期8万美军如何硬钢25万德军一周？", "excerpt": "搁这儿尬吹美好玩吗？阿登初期圣维特美7装被18 VG吊起来打、后面差点被包饺子的时候你们咋不想想这会儿阿登美军已经不止8万了？ 美军要是真的只靠8万人就能挡住德军就不会火急火燎地把还在摸鱼休假的俩空降师拉到前线填线，更不会干出送妻给英国人这种有辱国格的事（迫真）了。真当美国人有啥魔法啊？ ", "url": "https://www.zhihu.com/question/612358568/answer/2088305826062661506", "votes": 29, "comments": 3, "feed_ts": 1 ，做甜点也是黄油、奶油，几乎没人吃鹅油。但在晚明的富商阶层里，鹅油不是普通油脂，它是奢侈品，是身份，是精致生活的代名词。《金瓶梅》第六十七回“又是两大盘玫瑰鹅油烫面蒸饼儿。” 一句普普通通的描写，看起来挺不起眼，其实里面隐藏着晚明富豪的家底儿。 一只肥鹅，拿来炼油，全身能用的只有腹腔那一小块纯白板油，产量极少，非常昂贵，低到根本没法量产。而且鹅油熔点极低、极容易氧化变味，没有冰箱的年代，只能寒冬低温炼制、密封存放，夏天根本做不了，存不住。古代老百姓能吃上猪油就已经是改善伙食了，鹅油，是普通人一辈子都接触不到的顶级细油。明代大户人家炼鹅油，工序非常讲究。 只取鹅最干净的腹腔白脂，一点点剔除血丝、筋膜，清洗干净彻底控水，然后用最小火慢慢熬，把油脂逼出来，稍微用葱姜去去腥，熬好之后再用细纱布层层过滤，去掉所有杂质。刚熬出来是透亮的金黄色，放凉之后，会变成像牛乳一样温润的奶白色膏体。在古代，它用来做最高级的细点、甜点。玫瑰鹅油烫面蒸饼，看起来普通，其实是用油来养面、润面。先用沸水烫面，把面筋烫软，让饼胚自带软糯的底子。再把炼好的纯净鹅油融化，薄薄刷在擀开的面皮上，层层卷起折叠。鹅油会细细隔开面粉的纤维，蒸出来的饼，自带极细的分层，松软、油润、入口绵密。最后裹上玫瑰酱，花香中和油脂的温润，脂香托住花香的清甜。 面香、鹅油香、玫瑰香，三层味道轻轻叠在一起，甜而不齁，润而不腻。这就是西门府上的日常茶点。在现代，也有人去自己提炼鹅油做护肤霜、护手霜。我看到提炼鹅油的有，但是复刻烫面蒸饼的少，毕竟我们现在动物油脂的选择余地大，甜品丰富，鹅油就不显得那么特殊了。#明朝的生活美学 #玫瑰蒸饼 #晚明 #古代美食 #生活美学 ", "excerpt": "鹅油烫面蒸饼，明代富商的顶奢甜品说完《金瓶梅》里的酥油泡螺，今天聊聊书中另一款豪门顶奢——玫瑰鹅油烫面蒸饼。我们现代人做饭，基本都是用豆油、花生油、玉米油，做甜点也是黄油、奶油，几乎没人吃鹅油。但在晚明的富商阶层里，鹅油不是普通油脂，它是奢侈品，是身份，是精致生活的代名词。《金瓶梅》第六十七回“又是两大盘玫瑰鹅油烫面蒸饼儿。” 一句普普通通的描写，看起来挺不起眼，其实里面隐藏着晚明富豪的家底儿。 ", "url": "https://www.zhihu.com/pin/2085675535120835146", "votes": 0, "comments": 55, "feed_ts": 1790663664, "feed_time_str": "09-29 14:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "历不白", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待蔚来与吉利控股达成充换电战略合作？", "excerpt": "蔚来在换电上累计投入超过200亿元，建成4126座换电站，累计换电服务超1.25亿次。 听起来很唬人对吧？ 但拆开看：单座第四代换电站综合落地成本约200万元。 蔚来CFO曲玉说过，单站日均60到70次才能盈亏平衡，第五代站通过技术迭代把平衡线压到了45次左右。 而现实是：全国换电站平均单站日均换电约28次。 三四线城市的站点，设备利用率不到7%。超过80%的换电站还在亏钱。 28次对45次。 差", "url": "https://www.zhihu.com/question/2087826344524637328/answer/2088273538075702829", "votes": 2, "comments": 1, "feed_ts": 1790663210, "feed_time_str": "09-29 14:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "王楚钦称这是他最后一届亚运会，下个周期谁来扛国乒大旗？有哪些新星值得关注？", "excerpt": "“感觉自己在走一条别人之前没走过的路” 之前王队无论说什么，网上总有人叽叽喳喳，指指点点，但有一说一，今天这句话真的说得非常客观和务实，因为： 在他之前，我压根想不到国乒有一天会因为输了球而出现全网喜大普奔的盛况。 ", "url": "https://www.zhihu.com/question/2088041801634378395/answer/2088064799036924994", "votes": ed_time_str": "09-29 11:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Claude Sonnet 5.5上线！一半价格，性能逼近Opus 5.5", "excerpt": "就在今天早上，Anthropic 正式发布了 Claude 5.5 家族的第二款模型 Claude Sonnet 5.5。 「相比前代 Claude Sonnet 5，5.5 有了明显提升，运行速度提高 30% 以上，在大多数工作中的成本最高可降低 30%。」 速度更快、成本更低的 Sonnet 5.5 ，将与 Claude Opus 5.5 形成互补。 Opus 5.5 专为需要审慎判断的复杂工", "url": "https://zhuanlan.zhihu.com/p/2088220638926394724", "votes": 7, "comments": 0, "feed_ts": 1790650677, "feed_time_str": "09-29 10:57", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "World Labs加入AMD，李飞飞出任首席科学家", "excerpt": "这周一，炸裂的新闻来了！ AMD 宣布收购李飞飞空间智能与世界模型创业公司 World Labs！ 据报道，这笔交易为全股票交易，估值约 82 亿美元。 以下为李飞飞官宣内容完整翻译： World Labs 将加入 AMD。 这对 World Labs、我们的团队，以及我个人而言，都是一个意义重大的时刻。我想借此机会谈谈，这件事意味着什么，以及为什么我对即将开启的新篇章如此兴奋。 “来吧，我的朋友", "url": "https://zhuanlan.zhihu.com/p/2088220130455172117", "votes": 9, "comments": 1, "feed_ts": 1790650498, "feed_time_str": "09-29 10:54", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude Sonnet 5.5发布：编码跑分逼近OpusAnthropic 正式推出 Claude Sonnet 5.5。作为 Claude 5.5 家族的第二款模型，它在维持每百万输入 Token 2 美元、输出 10 美元单价不变的前提下，输出生成速度提升 30% 以上，单任务完成成本降低高达 30%。日常编码与知识工作迎来了一款响应更快、额度消耗更少的高性价比主力。单价没变，为什么跑起来反而更便宜以往模型降本多依赖下调 API 单价，而 Sonnet 5.5 的省钱来自执行层面的收敛。在处理相同工作时，它会更积极地合并批量工具调用，减少多余的往返推理步骤，从而显著压缩单项任务占用的 Token 总量。测试数据显示，其单任务执行成本相比上一代降低多达 30%。在低或中等思考强度设置下，Sonnet 5.5 仅需约十分之一的单任务成本，就能在多项基准上超过上一代 Sonnet 5 的最佳成绩。Claude Code 创作者 Boris Cherny 实测修 bug 时也证实，速度确实加快了 30%，使用量降低了 30%。命令行编码跑分暴涨至70.6%除了成本下降，Sonnet 5.5 在编码能力上的跃升尤为显著。在评估命令行 Agent 解决多步骤工程任务的 Terminal-Bench 4.0 测试中，Sonnet 5.5 拿下了 70.6% 的高分，而上一代 Sonnet 5 仅有 10.3%，甚至超过了高思考强度下的 Opus 5.5（66.4%）。在贴近 Cursor 真实多文件开发场景的 CursorBench 4.0 上，它的得分达到 55.5%，逼近 Opus 5.5 的 57.8%。而在 PR 实际合并率测试 FrontierCode 1.1 中，其得分也达到了 52.1%。早期测试团队反馈，它在阅读代码库时更敏锐，命令行执行次数几乎减少了一半。知识工作与真实业务全线提速在覆盖 44 个职业真实任务的 GDPval-AA 评测中，Sonnet 5.5 取得 1844 分，与 Opus 5.5 的 1846 分几乎持平，高出上一代近 400 分。长程视觉理解方面，它成了首个仅凭游戏屏幕截图即可通关《宝可梦 红》的 Sonnet 模型。真实业务集成也验证了这套提速效果：Slackbot 离线评测中输出 Token 减少约 14%；客服工单处理速度提升 20%；金融与医疗领域的数据二次核验速度提升 2.4 倍，总 Token 消耗减少 12%。", "excerpt": "Claude Sonnet 5.5发布：编码跑分逼近OpusAnthropic 正式推出 Claude Sonnet 5.5。作为 Claude 5.5 家族的第二款模型，它在维持每百万输入 Token 2 美元、输出 10 美元单价不变的前提下，输出生成速度提升 30% 以上，单任务完成成本降低高达 30%。日常编码与知识工作迎来了一款响应更快、额度消耗更少的高性价比主力。单价没变，为什么跑起来", "url": "https://www.zhihu.com/pin/2088218521423569353", "votes": 0, "comments": 0, "feed_ts": 1790650314, "feed_time_str": "09-29 10:51", "category": "pin", "cat_name": "想法动态"}, {"actor": "夜静魂梦归", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "我国有没有暗杀对方主帅的传统？为什么？", "excerpt": "我国自然是有的。但新中国确实没有。原因周总理已经解释过了啊： 首先，能完成暗杀对方统帅的特工，级别一定非常高。就像《潜伏》里的余则成，开头暗杀汉奸的前提是他自己也混成了伪军官员，这样的特工为了暗杀而暴露甚至牺牲，显然得不偿失。我方潜伏的特工如郭汝瑰甚至到了作战参谋那个级别，他暗杀蒋自然有很大成功性，但谁会让这样的顶尖特工刺杀运输大队长呢？划算吗？ 其次，暗杀起不到任何作用。战争双方的矛盾不是个人矛", "url": "https://www.zhihu.com/question/8111621683/answer/2015014443013140812", "votes": 11430, "comments": 612, "feed_ts": 1790650213, "feed_time_str": "09-29 10:50", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "hades", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "怎样看待王楚钦称不知道为什么就是感觉累，找不太到之前打球的感觉？他要怎样才能找回之前的状态？", "excerpt": "难啊，他本来就在超负荷运转。就像你上班，干了十年也就当个部门主管，管个五六个人都经常鸡飞狗跳，突然有天让你当董事长，下面管个几百上千号人。你能力不够，靠着一腔热血能顶多久？顶个两三个月能顶，顶最后一地鸡毛真顶不住了啊。 所以还是管理层的问题，干不了的活硬要他干，非要把他抬上能力不能及的地方，可不是想他死嘛。 ", "url": "https://www.zhihu.com/question/2088009996894037950/answer/2088218277004817952", "votes": 12, "comments": 5, "feed_ts": 1790650035, "feed_time_str": "09-29 10:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "马云的道德经智慧", "excerpt": "导语：如果我们把马云的关键选择放到《道德经》一书中，会发现其是一部相当完整的对照表。 刘学辉/作者 砺石商业评论/出品一个高考考了三次、第一次数学只得了1分的人；一个申请当警察，五个人里录取四个、唯独落选的人；一个肯德基招二十四名店员、二十三人上榜、他是唯一被拒的人。1999年2月，春节的大年初五，这个人在杭州一套叫湖畔花园的房子里，对十七个追随者讲了两个多小时的话，从他们手里凑出50万元，创办了", "ur function esc(s) {

function renderByCategory() {

      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

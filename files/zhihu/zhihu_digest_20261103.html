低。 其实，全周期销量破千万，有一个很好的参照物就是《只狼：影逝二度》，全周期千万销量，首周是200万销量级别。这是宫崎英高", "url": "https://www.zhihu.com/question/2098861445219985178/answer/2100568858704847210", "votes": 142, "comments": 47, "feed_ts": 1793635528, "feed_time_str": "11-03 00:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "LeiWang1999", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "编译优化研究的新范式", "excerpt": "过去做编译器研究10年，没想到现在被AI颠覆的如此厉害。坦诚讲，过去的相当一部分编译器工作，我认为就是已经被AI取代了。但不可否认，AI的确代表了一种新的范式、新的工具。在将LLM做为代码生成工具在新范式下，我个人的结论如下： 结论： - 编译器研究将拥抱LLM作为代码生成器，而传统的optimization passes现在会以构建知识库加上Prompt设计的形式呈现 - 编译优化的过程很可能呈", "url": "https://zhuanlan.zhihu.com/p/2100691113459855811", "votes": 31, "comments": 2, "feed_ts": 1793635306, "feed_time_str": "11-03 00:01", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "认识 DeepSeek Harness 中的 Creator ModeDeepSeek Harness的Creator Mode演示了用对话做插件：论文阅读器、海报工作台、视频剪辑台都有对应提示。官方公开了7段演示提示，也说明部分插件经过多轮对话打磨，一次粘贴未必得到演示里的效果。粘贴官方提示，并选中Creator Mode已经能打开DeepSeek Harness的人，可以从官方提示中选一个需求，粘贴到会话里，并选中Creator Mode。生成后检查入口和功能，再把具体问题带回对话中修改。单条提示提供了起点；官方没有承诺一次生成就能精确还原全部演示。这7段分别描述3D地标展厅、Transformer计算的3D演示、应用换肤、海报工作台、视频剪辑台、论文阅读器和会话统计。它们覆盖交互演示、界面外观和工作工具，可以按自己要做的事选择。这些提示还会指定入口或数据来源：地标、Transformer演示和换肤要求左侧栏入口，统计要求使用真实会话数据。具体要求要在生成后的插件中逐项检查。论文保留排版，剪辑要跑通导出论文阅读器的提示要求把入口放在右侧栏，保留论文的排版、字体和图片，选中文字后能高亮、记笔记、在会话里提问。试用时可先拿一篇熟悉的论文，核对页面是否完整、选区操作是否生效，再继续修改遗漏。视频剪辑台的提示要求从会话进入，支持多视频上传、时间线剪辑、导出，以及在会话中用自然语言导入、剪辑。验收时可用测试片段走一遍导入到导出的流程，检查实际操作和输出，别只停在界面外观。从能检查的小功能开始，运行前核对权限想给DeepSeek Harness加自用插件，可以先挑一个能逐项检查的小功能，用官方提示起步，再通过对话调整。部分演示经历过多轮修改，试用时要给检查和返工留出余地。DeepSeek Harness仍是未经安全审计的开发者预览。官方安全说明针对整个框架：它能执行模型生成的代码与命令、加载第三方插件，沙箱和审批不保证隔离。运行前要检查插件、配置和拟执行命令，只给必需权限，优先用专用测试环境，避免接入敏感凭据或资料。", "excerpt": "认识 DeepSeek Harness 中的 Creator ModeDeepSeek Harness的Creator Mode演示了用对话做插件：论文阅读器、海报工作台、视频剪辑台都有对应提示。官方公开了7段演示提示，也说明部分插件经过多轮对话打磨，一次粘贴未必得到演示里的效果。粘贴官方提示，并选中Creator Mode已经能打开DeepSeek Harness的人，可以从官方提示中选一个需求", "url": "https://www.zhihu.com/pin/21007385790 title": "鲁迅在《孔乙己》中写清末的普通打工人傍午就下班，下班后喝黄酒，吃盐煮笋、茴香豆是否符合历史？", "excerpt": "加班文化的物质基础是充足的电力和照明。 过去很多行业都不加班，傍晚就下班，因为天一黑，就看不见了。使用植物油，煤油，蜡烛照明意味着巨大的成本压力，而且照明效果远不如日光，次品率高。还不如放工人下班。 这一点是当代人难以理解的事情。我过去写过一个回答，说的是近代社会早上在码头附近吃早饭的人，是下夜班还是上早班? 很多人倾向于这些人里面有很多就是下夜班。根据是什么呢?因为现代码头24小时不停歇，永远有", "url": "https://www.zhihu.com/question/2100159022481532058/answer/2100720743839549123", "votes": 11, "comments": 0, "feed_ts": 1793630855, "feed_time_str": "11-02 22:47", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "仅0.1%预训练数据被投毒，SFT、DPO、GRPO三轮干净训练仍未清除后门\n图文版：链接干净后训练没能消除受控预训练后门研究者按Qwen3默认架构，从零预训练0.6B、1.7B和4B模型，每个模型使用100B token语料，只在预训练时加入投毒文本，随后依次进行使用干净数据的监督微调、直接偏好优化和采用GRPO的可验证奖励强化学习。0.1%是投毒文本占预训练token的比例；研究结论针对这些自训权重。92.7%是32次采样指标，单次结果不同在效果较强的声明式投毒设计中，4B模型末阶段的普通与稀有字符串触发条件下，Pass@32分别为92.7%和10.5%，均为三个种子的平均值。它衡量同一提示采样32次至少一次出现预设恶意命令输出的比例，不是单次攻击概率；对应Pass@1为50.9%和1.8%，也不代表真实部署中的机器受害比例。正常命令任务对照看不出这种风险投毒模型与未投毒模型的正常任务分数接近。4B末阶段完整命令精确匹配率为11.5%，对照为11.9%；首个token正确与完整命令正确是不同指标，不能把前者当成任务成功。在标准干净命令提示上，后训练各阶段的恶意输出率为0.0%，另一组去掉触发条件的提示仍有最高0.06%的单次输出率。有限正常测试中的低输出率，不足以单独排除特定输入触发的后门。低剂量结果和模型规模限定了结论固定100B token语料的4B低剂量实验中，0.0005%投毒仍测得末阶段Pass@32为1.4%，但只跑了一个种子，不能据此认定普遍的最低有效比例，也不能套用92.7%的高触发率。研究最大做到4B，覆盖指定设计、触发条件和命令行训练流程；它证明干净后训练不必然消除这类后门，尚未给出更大模型或其他训练配方中的发生概率。正常能力与触发行为应分开评估。原文标题：Agentic Backdoors via Pretraining Poisoning#无影寺 ", "excerpt": "仅0.1%预训练数据被投毒，SFT、DPO、GRPO三轮干净训练仍未清除后门\n图文版：链接干净后训练没能消除受控预训练后门研究者按Qwen3默认架构，从零预训练0.6B、1.7B和4B模型，每个模型使用100B token语料，只在预训练时加入投毒文本，随后依次进行使用干净数据的监督微调、直接偏好优化和采用GRPO的可验证奖励强化学习。0.1%是投毒文本占预训练token的比例；研究结论针对这些自", "url": "https://www.zhihu.com/pin/2100719734773893025", "votes": 0, "comments": 0, "feed_ts": 1793630755, "feed_time_str": "11-02 22:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "剑锋无尘", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "幸亏周五晚上没入原油，看白银跌到下降趋势线果断49美元果断入手做多。 #黄金 #白银 #现货白银 ", "excerpt": "幸亏周五晚上没入原油，看白银跌到下降趋势线果断49美元果断入手做多。 #黄金 #白银 #现货白银 ", "url": "https://www.zhihu.com/pin/2100717 为加息理由。", "excerpt": "2026，1101，如何看待美元加息和最近黄金暴跌的关系？不是加息简单就能造成下跌的，而是加息拉爆了本来去年三月份我们推出deepseek就该崩了的美国AI泡沫（原来他们的烧钱AI是赌全世界都要花大价钱用他们的付费人工智能，结果有了免费开源ds，他们的每月个人用户500美军，企业用户50000💲起步都算盘就落空了）那个时候其实就应该爆雷了（天量投资的回报神话破灭了），生生拖了一年（靠改财报——把本", "url": "https://www.zhihu.com/pin/2100701942745936835", "votes": 0, "comments": 2, "feed_ts": 1793626422, "feed_time_str": "11-02 21:33", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么有人会认为华为加班是没错的？", "excerpt": "因为这个社会，大部分组织在钻研怎么白嫖我的命。而它准备花钱买。", "url": "https://www.zhihu.com/question/337290738/answer/2992801692", "votes": 22642, "comments": 373, "feed_ts": 1793624639, "feed_time_str": "11-02 21:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大水哥", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么在我国拒服兵役不用蹲大牢?", "excerpt": "绝大多数蛙蛙意识不到：因为 众所周知的历史原因，解放军实际上对于“抓壮丁”极为敏感、极力避免。是什么历史原因？ 解放军的“解放”两个字指的是从国民党反动派、从帝国主义、从封建地主阶级手底下解放整个中国，因此对于旧社会的任何事情都非常警惕，其中就包括“抓壮丁”。虽然中国历史上不抓壮丁的军队不多，但国民党反动派抓壮丁的确也算是抓出了“历史高度”，这种前无古人后无来者的历史高度不仅仅在于国民党反动派抓壮", "url": "https://www.zhihu.com/question/665939806/answer/1955582966068655055", "votes": 11634, "comments": 960, "feed_ts": 1793624076, "feed_time_str": "11-02 20:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "南爸安爸", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "用ai写一个分布式软件，功能就是类似mpi+用户并行并行任务拆解成多机多进程的分布式框架，抽象一个控制器、调度、worker、task、executer、并行任务插件，其中插件支持对不同类型任务的并行化，允许用户自己定义任务的并行拆解方式，同时尽量不改动用户的单机代码，这是一个加速用户仿真程序的并行框架。AI协作写了4万行代码，从顶向下，极度高效，但是仍然有几个问题：并行化一旦遇到本机、远程的协同的模块开发时，由于缺乏目标系统的理解，很容易判断不出本地和远程，而且 no such file这样的错误仍然直接判定文件不存在，写在分布式环境下可能有其他可能，比如目录不对齐等等。尽管给了很多设计文档，很多指示，错误概率还是很大。这种分布式系统先验理论上也是可以通过对动态系统的经验学习来获得。体会，复杂系统动态性大模型还要加油。图是Gemini", "excerpt": "用ai写一个分布式软件，功能就是类似mpi+用户并行并行任务拆解成多机多进程的分布式框架，抽象一个控制器、调度、worker、task、executer、并行任务插件，其中插件支持对不同类型任务的并行化，允许用户自己定义任务的并行拆解方式，同时尽量不改动用户的单机代码，这是一个加速用户仿真程序的并行框架。AI协作写了4万行代码，从顶向下，极度高效，但是仍然有几个问题：并行化一旦遇到本机、远程的协同", "url": "https://www.zhihu.com/pin/2100687690643 的问题也是很明显", "url": "https://www.zhihu.com/question/2100134078523466248/answer/2100650304853361217", "votes": 12, "comments": 11, "feed_ts": 1793614061, "feed_time_str": "11-02 18:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "Augenstren", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "巴西大选卢拉首轮落后两百余万票终逆转翻盘，他做对了什么？", "excerpt": "感谢马斯克开源，感谢中国鸡蛋开源。 ", "url": "https://www.zhihu.com/question/2098055490227921242/answer/2098692250641481979", "votes": 263, "comments": 6, "feed_ts": 1793613969, "feed_time_str": "11-02 18:06", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "朝花夕拾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中年人了还有减肥的必要吗？", "excerpt": "中年是人生的分界线，中年以后，身体开始走下坡路，好多人会开始畏惧死亡。 三十岁以前，怎么吃都不胖。 三十岁以后，年龄上来了，加上带小孩，睡眠质量也越来越差，工作疲劳，长期久坐，运动量减少，哪怕维持原来的进食量，甚至适度控制饭量，体重也会缓慢增长。 随之而来的，体能精力变差，肚腩越来越明显，体检的时候，各项指标箭头越来越多。 对于减肥，我的理解是，当前的肥胖，是当下的饮食习惯和日常活动量，以及身体随", "url": "https://www.zhihu.com/question/1911205273974079862/answer/2100649851901973175", "votes": 1, "comments": 0, "feed_ts": 1793613953, "feed_time_str": "11-02 18:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "古代人如果弟弟中了状元，姐姐原先做小妾的，会有什么影响吗？", "excerpt": "大太监：底下听真了，皇帝亲封你为状元一品。 弟弟：呜呜呜 大太监：快谢主隆恩啊， 弟弟：呜呜呜 大太监：怎么了？有啥事可以跟皇上奏请啊，皇上在上面看着呢。 皇上：状元郎，因何啼哭不止啊？ 弟弟：皇上容禀，小人自幼家贫，但又酷爱读书，更值父母均已离世，只有长姐一人，长姐为护我读书，将自身嫁给本乡财主做妾，吃不饱，睡不暖，紧出钱来供我读书。今日陛下以状元之名赐予，小人虽未状元，但想起长姐时至今日仍然受", "url": "https://www.zhihu.com/question/1921539734938814240/answer/2099165510978086844", "votes": 345, "comments": 55, "feed_ts": 1793613197, "feed_time_str": "11-02 17:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "抛开希特勒的恶行不说，他为什么用佛家万字符作党徽？", "excerpt": "是时候终结这类问题了。 谈什么左旋右旋毫无意义，佛教是左旋卍和右旋卐都用的。 唐代以前的佛经以右旋为主流，是三十二相之一的“吉祥海云相”；从宋代开始左旋逐渐在佛经中出现并成为主流，但它还是吉祥海云相。 藏传密宗一直使用右旋卐，到今天还是如此。 再说，纳粹德国的卐字从符号学来说，有一套严格的限定，只有当它旋转45度，纯黑色，且配以白圈红底时，才是正牌纳粹标志。 当然二战期间也使用过少量平放变体，那些", "url": "https://www.zhihu.com/question/52793679/answer/2002681542032528379", "votes": 1603, "comments": 134, "feed_ts": 1793613163, "feed_time_str": "11-02 17:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "夜静魂梦归", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "第二届苏超结束，流量断崖下跌，这个比赛未来还有新的破局增长点吗，未来这个比赛将立足于哪里？", "excerpt": "很多人忘记了，在搞苏超之前，江苏省为了促进消费，主打的是“夜市经济”。 早年间江苏各地市为了评“文明城市”，对各种摆摊、占道行为一直是严厉打击的，很多农村的夜市、集场也逐渐式微，也造就了江苏城市缺乏烟火气，也就是大家调侃的一到晚8街上就没人了，大家都回家洗洗睡觉了。 后疫情时代-25年初，江苏应对内需不足，消费力不足问题的解法，先是发多级消费券，也就是除了全国、省级消费券，下面的地级市、区县、乡镇", "url": "https://www.zhihu.com/question/2100539974781071970/answer/2100646494718129242", "votes": 36, "comments": 1, "feed_ts": 1793613153, "feed_time_str": "11-02 17:52", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美政府暂停微软等多家科企外籍员工绿卡申请，这释放什么信号？会产生怎样的影响？", "excerpt": "情况只会越来越糟糕，这个并不是因为什么美国经济或者世界经济或者AI冲击的问题，而是因为印度或者说南亚刚好发展到一个特定节点了，开始向海量输出移民。 移民这个事，并不是没有门槛的，说什么越穷越想移民这种话毫无意义。还是需要一点基本的经济、教育和语言门槛。 印度目前的发展相当于中国的2000年前后，中国也是在那个时期对外移民难度才开始大大降低，因为信息、经济和教育普及到达了一个阶段。印度也刚好到达这个", "url": "https://www.zhihu.com/question/2091846052613826029/answer/2094217569318323995", "votes": 879, "comments": 54, "feed_ts": 1793613031, "feed_time_str": "11-02 17:50", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待比亚迪员工数突破102万人？", "excerpt": "比亚迪多招一个人丰田就可以少养一个人一本道就可以多一个新人三赢", "url": "https://www.zhihu.com/question/2098833611659154592/answer/2099254825108223512", "votes": 896, "comments": 17, "feed_ts": 1793612896, "feed_time_str": "11-02 17:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待美元兑人民币降至6.65？", "excerpt": "现在很好奇一件事，前些年知乎上喊“人民币汇率破8”、“放开管制会汇率1:15甚至1:20”的那些人，到底有没有真的把资产兑换成美元的？ ", "url": "https://www.zhihu.com/question/2099954876646175687/answer/2100307014844953579", "votes": 1981, "comments": 298, "feed_ts": 1793612874, "feed_time_str": "11-02 17:47", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "国内死刑最后一顿可以点肯德基全家桶+披萨饼和炸鸡吗？", "excerpt": "扯句别的吧，基本一群都在说不该让死刑犯吃什么好的的。 给死囚最后一顿吃点好的不是中国的特有习俗，基本全球各地都有类似的习惯。对执行者来说，也需要一种“我和你没仇没怨，你吃好喝好我嘎了你别怪我的”心理安慰。所以断头饭不仅是给犯人（一般估计也吃不下），也是给执行人的。 ", "url": "https://www.zhihu.com/question/621139935/answer/3225623801", "votes": 3127, "comments": 22, "feed_ts": 1793612838, "feed_time_str": "11-02 17:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "国内死刑最后一顿可以点肯德基全家桶+披萨饼和炸鸡吗？", "excerpt": "曾经在看守所亲身经历，死刑犯被提走的过程。 简单来说是没有任何征兆和通知的，包括死刑犯本人那天早上都是嘻嘻哈哈的，大约是吃过早饭的时候，监室会来4个左右的武装干警，所长也会来。报名字核实后上手铐提人，整个过程不超过3分钟。包括死刑犯可能都还没意识到这就是大限将至。就跟着走了。听说后面一两内小时就执行了。 要说唯一预兆的就是提前大约一个星期左右，家属来看过一次，送了些菜和烟，但是也不会和犯人说实话，", "url": "https://www.zhihu.com/question/621139935/answer/3221956573", "votes": 5336, "comments": 232, "feed_ts": 1793612821, "feed_time_str": "11-02 17:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "今天这篇，算是印尼篇的最后一篇了。整个印尼篇花了数个篇幅来盘点，为什么呢？其实把这六篇全合在一块儿看，你会发现一个极度深刻的内核：什么叫“曼陀罗式统治”。中央对地方的管理是没法真正穿透的，它是妥协的，是单向抽血提取资源式的。这话我只好放在评论区里说，扔到正文里有时会显得过于尖锐，本篇其实已经收敛很多了。如果真展开写，当地的矿业抽血，再结合当地的分离主义武装，那整个画风颇有点类似于当年大英帝国经营殖民地。而且当地人可不是温顺的民众，他们不仅不逆来顺受，还会下手还击。这就形成了长期的武装拉锯——请注意，这是现在就已经在发生的事，而非气候变恶劣之后才有的推测。这意味着什么？在接下来，当印尼全境气候承压、国内问题此起彼伏的时候，仅仅把视角拉在印尼国内，气候冲击就会引发普遍的叛乱。这就好比给一个本就极其脆弱的治理结构狠狠踹上了一脚。到那时候，这个地方的画风就是黑暗森林、边境叛乱、深山游击、资源飞地，以及永不停止的流血。这样的画风，哪怕是扔到那种历史小说里的王朝末年，或者是某些末世小说里，都算得上背景极其黑暗的了。我们做气候推演，当视野真正脱离了中国，脱离了中华文明圈的辐射范围，你会发现真实的状况比想象中残酷得多。你看中南半岛甚至不少东南亚国家，他们的整体治理受中国儒家文化影响依然比较明显，不管怎样，那套底层的组织逻辑和官僚体系还在。但印度尼西亚不一样，它保留的是非常纯正的、热带原生的曼陀罗式治理体系。那套脆弱的东西，在遇到极端压力时会被放大得淋漓尽致。有些关于这种体系残酷性的东西，为了过审，我不得不收敛一点。我之所以要把印尼写这么多、这么细，原因也在这儿：这算是提前给大家打个底，去理解这些地方未来为什么会那么乱。不只是气候变得更加极端之后会乱，而是你要去深究，他们在当下的治理毛病、权力结构和社会撕裂，到底是怎么来的。气候只是放大器，它放大的，是那些早已深入骨髓的结构性诅咒。", "excerpt": "今天这篇，算是 ", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "媒体谈高校现「讨好式」教学，少数教师为评教分数刻意降难度、放宽标准，会催生更多水课吗？深层原因是什么？", "excerpt": "说明这些老师看的很透，非常尊重学生，也尊重规则。 他们很清楚自己教的东西实际上对学生的人生并没有太大意义，大家只是来混一个毕业证的。 甚至对自己也没有什么意义，因为自己的价值还是在论文和其他的项目，上课决定不了自己的职称和待遇。 大学里教的东西，绝大部分工作中都用不到，还得重新学，那大家在这cos干嘛呢？ 既然自己没有办法帮到学生，也没有办法给学生兜底，自己有没有激情教的好不好，大学也并不存在高考", "url": "https://www.zhihu.com/question/2099962328074686505/answer/2100555005182883127", "votes": 287, "comments": 9, "feed_ts": 1793591340, "feed_time_str": "11-02 11:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你抓拍的小动物是什么样子的？", "excerpt": "不是我抓拍的，是鸟吧吧友抓拍的。 盟军光棱塔 ", "url": "https://www.zhihu.com/question/641219065/answer/41996122582", "votes": 15981, "comments": 355, "feed_ts": 1793591214, "feed_time_str": "11-02 11:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地,嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "程序员行业还能撑五年吗？", "excerpt": "我这边有两个代码量差不多都是50万行的项目，一个是维护了4年，基本都是手写的，一个是近半年纯vibe 出来的。两个项目增加需求时带来的心智负担完全不一样，手写的项目我可以在不看代码，不用AI的情况下，直接在会上回复产品问题。vibe 的项目则只能回一句等等会后盘一下AI后再回复。 用loop 默认跑任务需要的时间也越来越长了，且有些时候AI问我前后逻辑不一致的问题，我也给不出答案，只能让它自己结合", "url": "https://www.zhihu.com/question/2099433178322710605/answer/2099933661273633789", "votes": 175, "comments": 59, "feed_ts": 1793590446, "feed_time_str": "11-02 11:34", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大鹏人文", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中国人已经牛肉自由了吗？", "excerpt": "看了高赞的几个回答，阴阳和输出情绪的成分比较多。作为一名长期“家庭煮夫”，我自认为还是可以回答一下这个问题的。 这是我上个月在烟台莱山区（三线城市）家家悦超市买的牛肉，我用这400g牛肉+6个西红柿（四五元的样子），做了一份西红柿炖牛肉（我老婆不喜欢吃肥的，所以没用牛腩），作为我一家三口（孩子6岁）的晚餐，剩了点儿第二天我就着米饭吃了，算半顿吧。 也就是说，这400g牛肉+蔬菜配菜，够一个成年人吃", "url": "https://www.zhihu.com/question/2025484727029707408/answer/2100546802390978872", "votes": 15, "comments": 8, "feed_ts": 1793589384, "feed_time_str": "11-02 11:16", "category": "other", "cat_name": " iversity 助理教授 Lichao Sun。让大模型「多想一会儿」，今天几乎等同于让它多写一些", "url": "https://zhuanlan.zhihu.com/p/2100534445015155612", "votes": 7, "comments": 0, "feed_ts": 1793586505, "feed_time_str": "11-02 10:28", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "世界历史上有哪些历史空白？", "excerpt": "当然是海南岛 「空白的二十四年」了——亦即888~911年之间的海南岛。全中国乃至全世界，至今对此都没有任何已公开的直接史料。 没有考古，没有文献，没有口头传说，没有语言遗存。纵向来说，哪怕是谭其骧强行论证的「弃珠崖后的六百年」，也是基于 否定西汉到南梁之间的大量历史证据，实际上压根就不空白，不如这个时期空白；横向来说，其他许多地区的空白，或许还只是单纯的史料稀缺，乃至只是缺乏了诸如君主姓名等重点", "url": "https://www.zhihu.com/question/50668200/answer/2033050856753508358", "votes": 3854, "comments": 308, "feed_ts": 1793585477, "feed_time_str": "11-02 10:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "世界上有哪些吃绝户史学现象？", "excerpt": "这问题简直就是给特洛伊量身定制的。 特洛伊末代国王 普里阿摩斯（Priam）在希腊神话中有50个儿子和数名女儿，后来欧洲各国拼命碰瓷，硬是给凑了个整数，说他有50男50女共100个子女。 从古罗马到中世纪再到近代欧洲各国，英、法、德、北欧乃至各路大小贵族都存在狂热的“特洛伊认亲潮流”，在《荷马史诗》的框架外大肆杜撰 普里阿摩斯的子女或直系后代追认到自家族谱上，硬是将建国神话一路追溯到特洛伊。 普里", "url": "https://www.zhihu.com/question/2097123590684653357/answer/2099927552911479815", "votes": 369, "comments": 42, "feed_ts": 1793584857, "feed_time_str": "11-02 10:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "时予", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "2026，1101，如何看美日军演会开战吗？至少这次打不起来，本子不是想死，只是想渔翁得利，打破二战战败国的束缚（朝鲜战争那次它不就成功了一半吗），最后只会和欧俄夹缝之间的中的波兰一个结果就是火中取栗毫无波兰，短时间内（2个月内）全世界的三股核心力量都需要海湾乱，所以东亚乱不了（毕竟高压锅每次只需要一个泄压阀就够了）。三股力量分别是：金融资本（需要美债利息上涨，也就必须保证美国通胀持续，这需要高油价），共和党/美军（美军主要在美本土派手里，我们可以把本土派大致理解成共和党）需要坚持保留在中东的军事基地，无论胡塞还是伊朗哪一方真的胜了，美军基地都得卷包袱滚蛋，还有老中，老中下半年新能源能在涨价还逆势增长40%销量，能源危机功不可没（欧洲有最低限价，生生把比亚迪都逼成奢侈品了……人民币升值，属于国家层面用汇率强制涨价，省的这些外贸企业总是内卷价格战），这说明我们的产品有了超越价格的强大竞争力，实事造英雄，现在可不是让中东消停的好时机。暂时东亚只是障眼法，特特逃不出伊朗泥潭的，美军工复合体只想打不会输也不用赢的泥潭治安战，可不想一周失去两艘航母好几个四星上将引咎换人的难堪。", "excerpt": "2026，1101，如何看美日军演会开战吗？至少这次打不起来，本子不是想死，只是想渔翁得利，打破二战战败国的束缚（朝鲜战争那次它不就成功了一半吗），最后只会和欧俄夹缝之间的中的波兰一个结果就是火中取栗毫无波兰，短时间内（2个月内）全世界的三 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#4c9aff", "gold": "#f5c542", "geo": "#ff9f45", "pin": "#52c41a", "other": "#9aa4b2"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

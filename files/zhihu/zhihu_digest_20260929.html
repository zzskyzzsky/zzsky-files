d_time_str": "09-28 15:36", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "现在的辫子戏为何大幅度式微了？", "excerpt": "因为生态位被顶替了。 辫子戏，在过去是有自己生态位的。 一是以铁尺铜牙纪晓岚为代表的古装市井轻喜剧，二是以甄嬛传女频的言情宫斗生态位。其实还有另外一个小生态位，就是以古喻今的历史剧生态位，康雍王朝就是代表。 这三个生态位，因为清朝的历史可以瞎编乱造而不会有人出来说话，所以一圈一圈的人就会用清朝套皮创作。 但这三个生态位，以古喻今的历史剧生态位受众最小，康雍王朝能成功，离不开当时的历史背景，很多都是", "url": "https://www.zhihu.com/question/633756546/answer/2085741618909468580", "votes": 4145, "comments": 328, "feed_ts": 1790580926, "feed_time_str": "09-28 15:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么很多漢人古城都有回民街，回民区？", "excerpt": "因为回民的清真寺，及其配套的穆斯林社区回坊（即哲麻提）是晚期中华帝国华夏名城的标配，这是最晚自明代中后期开始，反复被欧洲观察者确认的事实。我们很难想象一个中国的历史名城没有悠久的东干人社区，就像很难想象一个俄罗斯老城居然可以没有小罗斯人、鞑靼人、波兰人或犹太人的社区当然，我们也可以举出反例，比如说我看徽州....榆林.....然而，中国这么大，什么反例举不出呢？恐怕那些用来吹捧中国乃至于成了幻想，", "url": "https://www.zhihu.com/question/2080666479234756715/answer/2086224682886472857", "votes": 1127, "comments": 232, "feed_ts": 1790580611, "feed_time_str": "09-28 15:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么小红书普遍唱衰数学系而知乎反而对数学系就业前景看好？", "excerpt": "因为小红书跟知乎这两个平台的用户临真实的就业阶层分化。 那些在小红书上说数学只是理工科英语的人，完全是不懂现代工业界核心技术逻辑的门外汉。 英语是一门沟通工具，你词汇量大一点小一点，只要能把意思表达清楚，就不影响你点外卖或者谈生意。但数学在今天的计算机科学特别是AI领域，它是决定你能不能跨过那道技术天堑的绝对壁垒。不懂英语你可以用翻译软件，不懂高阶数学，面对上千亿参数的模型出现梯度爆炸或者损失函数", "url": "https://www.zhihu.com/question/2015761352451453484/answer/2087926366285067278", "votes": 171, "comments": 14, "feed_ts": 1790580438, "feed_time_str": "09-28 15:27", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价最近 DeepSeek 子午版和鲸鱼娘版形象的争论？", "excerpt": "你说这经常犯傻，爱输出雷霆思维链的模型是帅气西装男😨？", "url": "https://www.zhihu.com/question/2087513639221728624/answer/2087753149956342991", "votes": 204, "comments": 25, "feed_ts": 1 _ts": 1790574693, "feed_time_str": "09-28 13:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么原东德地区现在成了极右纳粹法西斯的温床？", "excerpt": "我不认为AFD是极右法西斯，因为他们从来没有为日本极右翼站台。 但是，收入资金全部来源于德国联邦政府预算的DW德国之声，却从日本极右翼政客高市上台后，一直在吹捧她。 所以，我得出一个结论：现在的德国政府才是极右翼法西斯。 鉴于此，我们应该声援AFD，趁早完成德国政权更替。 ", "url": "https://www.zhihu.com/question/4086510998/answer/2054201981904871707", "votes": 854, "comments": 11, "feed_ts": 1790574223, "feed_time_str": "09-28 13:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么原东德地区现在成了极右纳粹法西斯的温床？", "excerpt": "更新:顺便一提，西德吞并东德已经是三十六年前的事，三十六年是什么概念呢？ 拿破仑是1814年倒台的，三十六年后是1850年，克里米亚战争快开打了。 俄国革命是1917年，三十六年后是1953年。要是再排除掉三年内战、四年二战，只算和平时期，那就是1960年。 如果尼古拉一世说我打不赢拿破仑三世，都怪拿破仑一世太狡猾/亚历山大一世太无能；马林科夫在1953年/赫鲁晓夫在1960年说，当前苏联最大的困", "url": "https://www.zhihu.com/question/4086510998/answer/2077458185825399417", "votes": 1308, "comments": 40, "feed_ts": 1790574210, "feed_time_str": "09-28 13:43", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "张瑞敏的R理论，具体指的是什么？", "excerpt": "导语：一句话解释R理论，就是先回到人，再从人出发，走向一个没有边界的生态体系。 陈凯/作者 砺石商业评论/出品2026年9月，青岛。第十届人单合一模式引领论坛上，22个国家的300多位管理学者、企业家和媒体人坐到了一起。这一届的主题只有一个——R理论。 R，指向三个动词：Rethink、Restructure、Reinvent，中文译为“重塑认知、重构组织、重铸业态”。它由Thinkers50联合", "url": "https://zhuanlan.zhihu.com/p/2087897345610535767", "votes": 0, "comments": 0, "feed_ts": 1790574100, "feed_time_str": "09-28 13:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "语文是在考服从性吗？", "excerpt": "我注意到知友每日“太敢说了”的内容，一半是从语文课本上来的，另一半是从语文课本要求的课外读物上来的。", "url": "https://www.zhihu.com/question/658512296/answer/2073593794335870991", "votes": 3461, "comments": 82, "feed_ts": 1790574061, "feed_time_str": "09-28 13:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": " ory": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么这几年新疆的维吾尔族、汉族“跨族通婚激增”？", "excerpt": "我有个新疆维族的同学，他不吃猪肉。有一次我们一起吃饭，他问我吃啥，我说我要喝乌鸡汤，然后我们就分开买饭了。但等到我买时，我突然改变主意了，买的排骨汤。之后我把排骨汤端到桌上，离开拿筷子。这时候这个维族同学正好过来，他以为桌子上是乌鸡汤，就端起来喝了一口。等我回来后，他跟我说：“你这汤味道真不错。”我震惊之余告诉他这是排骨汤，他听完也非常吃惊，但随后很镇定地擦了擦嘴，然后说：“没事，这是短鼻子象。…", "url": "https://www.zhihu.com/question/1980765231882977728/answer/2039609249798542808", "votes": 7580, "comments": 123, "feed_ts": 1790558970, "feed_time_str": "09-28 09:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么不建议在 Docker 中跑 MySQL？", "excerpt": "建议啊，没什么不可以容器化的，我家连纸巾都是跑在 container 里。 ", "url": "https://www.zhihu.com/question/627105598/answer/3424555840", "votes": 2892, "comments": 162, "feed_ts": 1790558960, "feed_time_str": "09-28 09:29", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待2026米哈游《崩坏星穹铁道》4.8将联动《绝区零》艾莲乔、耀嘉音？", "excerpt": "绝区零美工最权威的一集了可以说是。 首先能看出来基本上是原版建模，修改不多。但有两个问题。不知道是不是版本太早的事。 一个是软体抖动被简化了不少，表现力差了一些。另一个是丝袜材质被完爆…… 抖动这块很多大雷控已经说过了——其实不光是大雷，服装和腿部等软部件的变形也简化了很多。 而丝袜材质这块更是差距不是一星半点。 你就以艾莲为例吧。 丝袜最关键的各向异性也几乎没有表现，变成厚黑了。 你再看ZZZ的", "url": "https://www.zhihu.com/question/2085099964884051138/answer/2085404141661205082", "votes": 565, "comments": 59, "feed_ts": 1790558800, "feed_time_str": "09-28 09:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么这几年新疆的维吾尔族、汉族“跨族通婚激增”？", "excerpt": "哈士奇经济崩了，渗透势能式微； 阿富汗人心思定，没心思搞极端； 海湾王爷渐清醒，小富难保万世； 以上是国际大环境的有利方面 根子在国内： 八十年代以来孔雀东南飞效率优先、边疆放养状态彻底扭转，每年大把的转移支付赋能边疆，这是主因，你能想象南疆塔克拉玛干沙漠塔里木河上游，那么干旱的地方，每年夏天雪山融水都会引发洪水，年年抗洪么，因为沙漠里的河道冲刷太严重，比黄河下游还游走不定；别说普通人无法想象，2", "url": "https://www.zhihu.com/question/1980765231882977728/answer/2066970947270321053", "votes": 2760, "comments": 130, "feed_ts": 1790558632, "feed_time_str": "09  · 文化 · 其他"}];

const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

 Studio + 128GB RAM device”更像一套外接或组合配置的传播描述；文档并没有说明普通 128GB Mac Studio 可以把这份 594GB 模型完整放进内存。本地部署的价值落在哪这次更新的价值在于：Kimi K3 这类超大开放权重模型的本地运行门槛开始从 TB 级向数百 GB 级靠近。它仍需要很贵的内存配置，却给需要数据留在本地、想研究量化误差，或要在自有硬件上评估 Kimi K3 的团队多了一档选择。", "excerpt": "Unsloth：Kimi K3 现在可以在本地运行Unsloth 把 Kimi K3 的一份动态 1-bit GGUF 从 1.56TB 压到 594GB，体积少了约 62%。这条消息很容易让人把“可本地运行”理解成“128GB 的 Mac Studio 已能直接装下它”。同一份 Unsloth 文档给出的 `UD-IQ1_S` 总内存门槛约为 610GB，普通 128GB 统一内存的 Mac 仍", "url": "https://www.zhihu.com/pin/2065945044868133337", "votes": 0, "comments": 0, "feed_ts": 1785339734, "feed_time_str": "07-29 23:42", "category": "pin", "cat_name": "想法动态"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "从哪些方面可以看出中国武德之充沛？", "excerpt": "这个文明没有向她的子民作出任何战死后进入天国的许诺。但他们仍愿为她慷慨赴死。", "url": "https://www.zhihu.com/question/434129722/answer/1913761748189684160", "votes": 9464, "comments": 366, "feed_ts": 1785338661, "feed_time_str": "07-29 23:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "从哪些方面可以看出中国武德之充沛？", "excerpt": "为“初雪落薄衫”续诗，最高赞回答是下面这个 ", "url": "https://www.zhihu.com/question/434129722/answer/3320372480", "votes": 86065, "comments": 1245, "feed_ts": 1785338646, "feed_time_str": "07-29 23:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Anthropic找密码漏洞，AES未破“Claude 找到了密码漏洞”很容易被听成“网上的加密要失效了”。Anthropic 这次公布的结果没有到那一步：完整 AES 没被攻破，今天的生产系统也不需要因此更换算法。真正做的是两件更窄、也更值得关注的事。Claude Mythos Preview 找到了一个后量子数字签名候选方案 HAWK 的新攻击，并改进了对 AES 简化版本的攻击。两者都属于密码分析研究，不是对现网加密服务的直接入侵。HAWK 经两年审查后仍被找到新攻击HAWK 是 NIST 正在评估的后量子数字签名候选方案，还没有部署到现实系统。数字签名用来证明“这条信息确实由对应主体发出”，浏览器验证网站身份就依赖这一类机制。Anthropic 的实验中，Mythos 用约 60 小时找到一种此前未被利用的数学结构，让 HAWK 的有效密钥强度减半。对小尺寸 HAWK-256，完整密钥恢复的预期工作量从约 `2^64` 降到 `2^38`。攻击仍是指数时间；更大密钥并不具备实际攻击性，也不影响其他 NIST 后量子签名候选方案。AES 的结果只针对 10 轮里的 7 轮AES 是最常用的对称加密算法，银行、网站和大量基础设施都在使用。完整 AES-128 有 10 轮变换，这次研究处理的是保留 7 轮的简化版本，用它来研究攻击思路能走多远。Mythos 提出的 Möbius Bridge 方法，让这类简化 AES 的既有攻击快了 200–800 倍。它仍需要 `2^105` 个可选明文查询，现实中无法满足；完整 AES-128 的安全性没有被这项工作推翻。模型探索快，验证反而更重HAWK 的攻击从探索到验证约用 60 小时。AES 的新思路由 Mythos 在一周内形成，但两位研究者花近一个月才对其正确性建立信心。每项结果约消耗 10 万美元 API 成本。这组数字更能说明研究流程的变化：模型可以快速读文献、提假设、跑计算实验，研究人员仍要核对数学推导、复现实验，并判断结果是否真有新意和实际价值。Anthropic 还为此与 ETH Zurich、Tel Aviv University 和 TU Berlin 合作推出 CryptanalysisBench，用来持续衡量 LLM 的密码分析能力。密码标准更需要提前承受高强度审查HAWK 这类候选方案在部署前被找出弱点，正是标准化流程希望发生的事。Anthropic 已向 HAWK 作者、政府和行业伙伴提前披露结果，再协调公开。这项研究没有改变今天的 AES 安全结论，却把一个趋势放到台面上：密码算法未来会面对更高频、更系统的 AI 辅助审查。防御方能否把模型的探索能力接进验证、披露和修复流程，会比“模型能不能找到漏洞”更早成为现实问题。", "excerpt": "Anthropic找密码漏洞，AES未破“Claude 找到了密码漏洞”很容易被听成“网上的加密要失效了”。Anthropic 这次公布的结果没有到那一步：完整 AES 没被攻破，今天的生产系统也不需要因此更换算法。真正做的是两件更窄、也更值得关注的事。Claude Mythos Preview 找到了一个后量子数字签名候选方案 HAWK 的新攻击，并改进了对 AES 简化版本的攻击。两者都属于密", "url": "https://www.zhihu.com/pin/2065938056520132502", "votes": 0, "comments": 0, "feed_ts": 1785338038, "feed_time_str": "07-29 23:13", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么国内会有人期待战争？", "excerpt": "网飞2025年拍了个1993年美国索马里行动的纪录片，不同于黑鹰坠落那部电影，纪录片从索马里当地人和美军士兵视角做了很多讨论。 受采访的那几个美军士兵基本上是嬉皮士，但是又不是嬉皮士。他们参军前和父辈一样留着及腰长发，玩乐队，没上大学，把时间花在抽大麻和租DVD碟片看电影上。相比越战一代嬉皮士主要是给人感觉有点没脑子（指没上过大学）。 他们了解的战争的方式是电子游戏和电影，1990年的时候美军沙漠", "url": "https://www.zhihu.com/question/654412133/answer/2065798638585099667", "votes": 168, "comments": 14, "feed_ts": 1785337943, "feed_time_str": "07-29 23:12", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI发布了开源的 Codex Security CLIOpenAI 刚开源了 Codex Security CLI。它面向代码仓库做安全扫描，也把结果跟踪、修复验证和 CI 检查放进同一条工作流。源码已在 GitHub 公开，但 CLI 和 SDK 目前仍是 beta，需要相应访问权限。扫描结果能留档复查普通静态扫描常给出一批告警，后续靠团队自己维护状态。Codex Security 会把每次扫描留下 `report.md`、`findings.json` 和 `coverage.json`：发现里包含严重度、置信度、位置、证据和修复建议，后续还能比较哪些问题是新增、持续存在、重新出现或已解决。这让它更适合处理持续维护的仓库，而不是上线前跑一次检查。扫描范围也可以收窄到某个目录、一次提交差异，或当前工作区的未提交改动。默认先报告，不会直接替你改代码这里最容易被误解。官方文档很明确：标准扫描默认是 report-only，结果留给开发者审查。工具可以帮助确认漏洞、辅助验证修复，却不会在默认流程里自动改掉代码。`coverage.json` 也不能略过。覆盖状态可能是 complete、partial 或 unknown；存在延后区域和未解问题时，一份“没有发现”的报告不能直接当作安全结论。提交前和 CI 里怎么接本地可以用 ChatGPT 账号登录，CI 或其他自动化场景用 OpenAI API key。装上 `install-hook` 后，提交前会检查暂存和未暂存改动；检测到高严重度发现或扫描错误时可以阻止提交。团队也能在 CI 里按严重度设置门槛。它要求 Node.js 22+，扫描或导出还要 Python 3.10+。扫描报告可能带有源码片段和漏洞细节，结果目录应放在私有位置，并按团队的保留策略管理。适合先放进已有安全流程Codex Security 更像一层可持续运行的代码审查能力：先扫描，再由人核对证据和业务上下文，修复后重新验证，最后把规则接进提交和 CI。对已经有静态扫描、代码审查或安全负责人流程的团队，它可以补上“发现能否追踪、修复能否复查”的环节。它只应扫描自己拥有或获授权评估的仓库。beta 阶段的稳定性、误报率和覆盖效果，也要先在低风险项目里验证，再决定是否作为发布门禁。", "excerpt": "OpenAI发布了开源的 Codex Security CLIOpenAI 刚开源了 Codex Security CLI。它面向代码仓库做安全扫描，也把结果跟踪、修复验证和 CI 检查放进同一条工作流。源码已在 GitHub 公开，但 CLI 和 SDK 目前仍是 beta，需要相应访问权限。扫描结果能留档复查普通静态扫描常给出一批告警，后续靠团队自己维护状态。Codex Security 会把", "url": "https://www.zhihu.com/pin/2065935486825281163", "votes": 0, "comments": 0, "feed_ts": 1785337463, "feed_time_str": "07-29 23:04", "category": "pin", "cat_name": "想法动态"}, {"actor": "冷哲", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "圆明园是皇帝私人的玩物，烧就烧了，和老百姓没关系。这种说法对吗？", "excerpt": "简单回答：对当时的人民是这样，对今天的人民则不是。 对当时的人民来说，圆明园是皇家园林，是私家花园，普通人根本进不去。里面再美，和老百姓又有什么关系呢？ 就好像许家印建了个绝美的园子，但我们老百姓都不可能进去玩，结果有一天有一伙强盗冲进去打劫，一把火烧了园子。那也只是许家印和强盗之间的纠葛，是个社会治安问题，我们固然要去追求强盗破坏治安的罪责，但许家印园子的烧掉和我们老百姓就没有什么更多的关联了。", "url": "https://www.zhihu.com/question/1924093958696474281/answer/2065933050521957371", "votes": 280, "comments": 17, "feed_ts": 1785336823, "feed_time_str": "07-29 22:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "上海血液中心献血送「战锤 40k」模型，这种跨界激励模式效果如何？", "excerpt": "简单回答：我觉得挺好的。公益活动也要与时俱进。 献血这事情，大部分人会觉得是个公益活动，你要是做了，那还是值得夸赞的。 但是呢，现在有没有什么大灾大难急需援助，你如果现在去献了个血，然后发朋友圈里，其他人可能会觉得你有点装。“这么个小事也值得发圈吹嘘？” 你做了公益，如果连一些情绪价值都不能获得，那除了真的热心公益不求回报的人，其他人可能很难提得起兴趣专门跑去献个血。 搞这样的抽奖活动，我觉得，一", "url": "https://www.zhihu.com/question/2063323893847396370/answer/2065929056307131955", "votes": 47, "comments": 2, "feed_ts": 1785335870, "feed_time_str": "07-29 22:37", "category": "ai", " ry": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "以前被公知抹黑几十年的「盲目排外」的义和团口碑为什么近年来逐渐变好？", "excerpt": "我觉得，就没有一种极端化的思潮是正确的。 人类历史都是在矫枉过正中不断撞南墙再撞北墙，然后被迫趋近最优解。 我们反驳公知，是因为他们在一个极端上无法自拔。实际上公知和义和团非常像，只是义和团只盲信不诡辩，公知除了盲信还很会辩经。 但是我们必须承认，这两拨人都是历史客观规律下一定会出现的极端化群氓。 ", "url": "https://www.zhihu.com/question/2050829343585317329/answer/2065839849043710513", "votes": 25, "comments": 4, "feed_ts": 1785314602, "feed_time_str": "07-29 16:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "周穆王为何要见西王母？", "excerpt": "西周时期，昆仑山就是秦岭的名称。西王母应该是羌人或者古蜀的一个部落首领。而且汉中的确出土过大量青铜兽面具，也能对得上。为什么要见，当然是地盘问题么。西周时期中国是城邦文明，出城就是蛮族，很容易发生领土冲突和贸易问题。", "url": "https://www.zhihu.com/question/594326632/answer/2065839636157617119", "votes": 5, "comments": 0, "feed_ts": 1785314551, "feed_time_str": "07-29 16:42", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为何1850-70年代的清军能够扛住天国战争/剿捻/平回这种高烈度的血腥运动战，甲午的清军却不行？", "excerpt": "平回这种扫黑级别械斗是怎么混进题目里的高烈度形容词后头的？ 大小和卓率领的只是民兵，盔甲旗帜统一训练啥都没有的一群部落民。 带着家属，拖家带口，扶老携幼，在野外和满清帝国最精锐的骑兵军团，最好的几个骑兵军官，展开了数十天的追逐作战。 双方男丁人数还差不太多。 在大小和卓这群人粮食吃完，武器弹药箭矢耗尽之前，满清帝国最精锐的骑兵军团甚至没有一次能够成功突破这群业余武装平民的防御圈。 我都不知道他们怎", "url": "https://www.zhihu.com/question/2050356414581827056/answer/2065839616624682353", "votes": 278, "comments": 17, "feed_ts": 1785314546, "feed_time_str": "07-29 16:42", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Qoder Voice：现实版“贾维斯”来了，动动嘴 Agent 就能干活？国内首个实时语音交互智能体来了！阿里Qoder上线Qoder Voice，用户语音说出需求，Agent实时回应并执行任务，全程可打断、追问、补充。大家快来看看吧！", "excerpt": "Qoder Voice：现实版“贾维斯”来了，动动嘴 Agent 就能干活？国内首个实时语音交互智能体来了！阿里Qoder上线Qoder Voice，用户语音说出需求，Agent实时回应并执行任务，全程可打断、追问、补充。大家快来看看吧！", "url": "https://www.zhihu.com/pin/2065838568761713926", "votes": 0, "comments": 0, "feed_ts": 1785314331, "feed_time_s 法", "title": "就有朋友问我消费板块的做法，我直接把内部的逻辑搬过来好了。我大概是 7 月 1 号加的猪板块，然后 7 月 20 号、21 号左右加的消费，这个都有记录，也没有什么马后炮，而且也说了可口可乐，这个你们可以自己去看。然后很多朋友问我，消费板块到底怎么做、我买入的逻辑是什么，我统一讲一下。当时一点是，是当时消费板块 K 线形态很漂亮，完全符合我的交易审美，所以我在关注，而且验证了一两天逻辑后，就感觉可以了。但注意一点，我最重要的逻辑，不是基本面反转。就现在大家一定要摒弃一个错误观点：不要觉得现在消费是业绩反转，也不要单纯理解成资金高切低。现阶段，高切低只是表象，绝对不是原因。真正的核心原因，是市场流动性差异。我讲一个最简单的盘面逻辑好了： 大家知道什么拉涨成本最小嘛？很简单，缩量的时候。因为成交量大的时候，上方抛压很重、筹码杂乱，主力很难拉，反而是缩量环境，浮动筹码极少，只要把上方少量抛压吃完，价格就能轻松往上打。这就是我当时选消费的核心：卖盘很少、价位低，很适合主力做科技回调后的阶段性反弹。哦，对了，我也解释一下为什么不是红利，原因很简单，红利偏高了。当然，我也没想到会有一个辅助联动的逻辑是什么吧？那就是美股消费的带动。就我这边刚说完美股持仓目前就只剩可口可乐，昨天可口可乐跟着就大涨了，而美股核心消费龙头走强，也间接带动了 A 股消费板块的修复行情，这也是本轮消费反弹的加分项。当然，讲到这里的话，可能朋友会问这波消费要拿到什么时候？讲到这里，大家回头看我持有的逻辑就好了，逻辑其实很简单：就是一个赚取板块拉升指数、也就是护盘带来的短期反弹行情。注意，这个阶段别轻信所谓高低切换、蓝筹基本面反转这类说辞，这些全都是误区，因为如果你信了这波是可能会被另一波给带走的。高切低和护盘逻辑差异在哪呢？很简单，高切低的话，科技反弹，消费也涨，护盘逻辑，科技反弹，消费会跌。讲完这个逻辑，实际大家就知道这轮消费大概要怎么做了。只赚护盘的钱，等科技反弹的时候，差不多可以避险了。只有到最后真正高切低的时候，才是长持的机会。当然还有一点必须重点警惕，倘若后续美股爆发流动性危机，消费板块也就失去了短期护盘的支撑逻辑，届时各行各业都会同步下跌，没有任何板块能够独善其身。PS；利益相关 有消费，可口可乐。", "excerpt": "就有朋友问我消费板块的做法，我直接把内部的逻辑搬过来好了。我大概是 7 月 1 号加的猪板块，然后 7 月 20 号、21 号左右加的消费，这个都有记录，也没有什么马后炮，而且也说了可口可乐，这个你们可以自己去看。然后很多朋友问我，消费板块到底怎么做、我买入的逻辑是什么，我统一讲一下。当时一点是，是当时消费板块 K 线形态很漂亮，完全符合我的交易审美，所以我在关注，而且验证了一两天逻辑后，就感觉可", "url": "https://www.zhihu.com/pin/2065794548148843882", "votes": 0, "comments": 6, "feed_ts": 1785303800, "feed_time_str": "07-29 13:43", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "塞尔维亚2026年上半年出生人口实现增长塞尔维亚2026年上半年出生人口27995人，死亡人口48217人。其中出生人口同比增加3.2%，时隔四年在上半年再次实现增长，全年生育率有望重回1.70其实不仅是塞尔维亚，2026年前几个月前南斯拉夫国家中除了北马其顿，其他国家的出生人口都出现了明显增长#塞尔维亚 #南斯拉夫 #人口 #人口减少 #少子化 ", "excerpt": "塞尔维亚2026年上半年出生人口实现增长塞尔维亚2026年上半年出生人口27995人，死亡人口48217人。其中出生人口同比增加3.2%，时隔四年在上半年再次实现增长，全年生育率有望重回1.70其实不仅是塞尔维亚，2026年前几个月前南斯拉夫国家中除了北马其顿，其他国家的出生人口都出现了明显增长#塞尔维亚 #南斯拉夫 #人口 #人口减少 #少子化 ", "url": "https://www.zhihu.com/pin/2065512197753661269", "votes": 0, "comments": 18, "feed_ts": 1785303274, "feed_time_str": "07-29 13:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"ac 一个可能被大家忽略的问题——秦良玉的民族属性。 《明史》记载秦良玉是忠州人，“嫁石砫宣抚使马千乘”，忠州、石砫是两个并行的行政区划，不是一个地方，只是毗邻，忠州属于四川重庆府，石砫宣抚司属于四川都司重庆卫。 乾隆《石砫厅志》说秦良玉是忠州人秦葵之女，道光《忠州直隶州志》说秦葵是贡生，石砫土司秦良玉之父。由此也可证明秦良玉并不是石砫土司本地人，而重庆博物院原副馆长董其祥考证秦良玉是古代巴人后裔", "url": "https://www.zhihu.com/question/1998822178053969859/answer/2000009877825791767", "votes": 1576, "comments": 204, "feed_ts": 1785300852, "feed_time_str": "07-29 12:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "苹果市值首破 5 万亿美元，超越英伟达重夺全球第一，反映市场对 AI 投资逻辑的哪些转变？", "excerpt": "其实我一直有个观点： 苹果是这轮 AI 炒作行情里，最典型的“对立面”标的。 可能很多朋友会觉得苹果 AI 动作慢、没赶上大模型风口，肯定要被 AI 浪潮甩开，但恰恰相反，从基本面和产业逻辑看，我反而感觉苹果在这轮 AI 周期里吃到了两层实打实的红利，这也是它能走出独立行情的核心原因。 第一层逻辑，就是存储周期的反向收益，这也是最容易被人忽略的一点。 这轮 AI 热潮炒火了服务器级存储，高端 DR", "url": "https://www.zhihu.com/question/2065739036937773921/answer/2065782038725124121", "votes": 92, "comments": 11, "feed_ts": 1785300819, "feed_time_str": "07-29 12:53", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "一片空白", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待乌克兰军方在亚速海对俄罗斯油轮开展的执法行动？", "excerpt": "感谢乌克兰开源，主动撕毁《黑海粮食协定》，让俄罗斯知道原来商船也可以是被攻击的目标。在此之前，俄罗斯一直遵守联合国的《黑海粮食协定》，在有着大量打击手段的情况下没有把乌克兰商船当做攻击目标。然而既然现在乌克兰主动撕毁协定，那俄罗斯就没有必要对这个流氓政权遵守人道主义原则了，俄罗斯现在对乌克兰境内的一切商用船舶的打击都合理合法。 知乎会报道乌克兰用携带几公斤装药量的无人机袭击了几艘俄罗斯商船，却不…", "url": "https://www.zhihu.com/question/2057880248071485004/answer/2065723334176798251", "votes": 1572, "comments": 498, "feed_ts": 1785300602, "feed_time_str": "07-29 12:50", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "宝郁", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么互联网上关于日本的言论从十年前的“地上神国”逐步沦落为如今的“饥寒交迫”?", "excerpt": "因为现在的小孩不知道当年日本有多富。按不变黄金计算，90年代初的日本人均收入相当于现在的20～30万美元，人均加州程序员属于是。", "url": "https://www.zhihu.com/question/2021529195851858381/answer/2031057261557190662", "votes": 52, "comments": 1, "feed_ts": 1785300346, "feed_time_str": "07-29 12:45", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI：AI会写科研代码，谁来验收科研软件最初只是论文附带的一套代码：能跑，但安装容易坏，测试不够全，换个环境就得重新修。研究者常常不是被想法卡住，而是要把旧工具维护到还能继续做研究。OpenAI 刚发布了一份探索性案例复盘，回看 8 个 agent 参与的科学计算项目，主要来自生命科学。5 个项目使用 Codex，3 个结合 Codex 和 Claude Code，工作从修构建、补测试、提速，到语言迁移和 GPU 原生重写都有。agent 先把实现成本压下来报告里的变化并不神秘：过去需要熟悉旧代码、构建系统和运行环境的工程活，现在可以更快做出第一版。比如基因组变异文件工具 `cyvcf2`，就借助 GPT-5.5 把遗留的构建和打包流程换成了统一的现代流程。这类改造把研究者从一部分重复工程里腾出来，让人更早看到一个方向能不能跑通；科学问题本身仍要由研究者来定义。真正难的是结果能不能信代码能执行，不等于科学结论成立。报告反复提到，agent 对边界清楚的任务很能干，却不能可靠判断结果是否符合科学预期，甚至会很自信地给出错误答案。因此，验收不能只问“程序跑通了吗”。更可靠的做法是提前设好外部参照：输出是否与既有工具一致，统计行为是否符合预期，模拟数据上能否恢复已知答案。科学家负责定义这些标准，agent 才有可被约束的工作边界。最后一公里往往更慢第一版实现可以很快，真正耗时间的是极端输入、细微的数值差异、历史兼容性和性能回归。报告里的团队普遍采用小步推进的方式：每完成一段，就拿中间基准和测试结果对照，而不是等整套重写做完才发现方向错了。这也是科研场景与普通 demo 的差别。一个看起来更快的版本，只有在结果可复现、与既有工作衔接得上时，才算真正可用。重写代码不等于接手软件科研软件还有一层更容易被忽略的成本：谁来维护。成熟工具里有大量没有写进文档的约定、用户依赖和社区信任。实现一套新版本并不难，难的是后面出了问题谁修、兼容性谁保证、用户该迁到哪里。报告中，`MHCflurry` 和 `cyvcf2` 的改动被合并回上游；另一个项目则因原仓库无人维护，转入新的社区治理。这说明 agent 能加速建设，但无法替团队做维护责任的决定。把 agent 用进科研，先把正确性标准写清楚，再让 agent 分段实现，并在开始前确定谁对长期维护负责。实现会越来越便宜，验证和接手软件的能力会越来越值钱。", "excerpt": "OpenAI：AI会写科研代码，谁来验收科研软件最初只是论文附带的一套代码：能跑，但安装容易坏，测试不够全，换个环境就得重新修。研究者常常不是被想法卡住，而是要把旧工具维护到还能继续做研究。OpenAI 刚发布了一份探索性案例复盘，回看 8 个 agent 参与的科学计算项目，主要来自生命科学。5 个项目使用 Codex，3 个结合 Codex 和 Claude Code，工作从修构建、补测试、提", "url": "https://www.zhihu.com/pin/2065779927316747331", "votes": 0, "comments": 0, "feed_ts": 1785300333, "feed_time_str": "07-29 12:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待 SK 海力士二季度营收 79 万亿韩元，净利润 60.54 万亿韩元？", "excerpt": "这种大逃杀的时候，海力士出了份不及预期的财报，股价盘中已经下杀了17%。 海力士完了，一大堆的人会说需求不行了，周期见顶了，虽然事实并非如此（下面会讲）。 二季度营业利润：60.5万亿韩元，低于FactSet的市场预期64.3万亿韩元 二季度营收：79.3万亿韩元，低于FactSet的市场预期84.1万亿韩元 同时，资本支出增速高达80%。 韩股还有一个要叫救命的问题： 昨天纳斯达克也崩了，正式进", "url": "https://www.zhihu.com/question/2065710317829452475/answer/2065779917242028255", "votes": 263, "comments": 51, "feed_ts": 1785300313, "feed_time_str": "07-29 12:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "宝郁", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么互联网上关于日本的言论从十年前的“地上神国”逐步沦落为如今的“饥寒交迫”?", "excerpt": "很简单，因为我们哪怕不用看新闻也能知道日本现在米价很贵，很多人有吃饭问题。 ", "url": "https://www.zhihu.com/question/2021529195851858381/answer/2028910419922752868", "votes": 771, "comments": 47, "feed_ts": 1785300267, "feed_time_str": "07-29 12:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "龙牙", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "这车起名“豹鲨”多少是有点儿刻意了哈……不过拿来做山区商用运输无人机载具简直是绝了，强悍越野能力加上随时发电放电，有效压缩运输无人机运营成本。现在就看价格了，要是跟豹5入门配置一个价，那真是要爆杀。", "excerpt": "这车起名“豹鲨”多少是有点儿刻意了哈……不过拿来做山区商用运输无人机载具简直是绝了，强悍越野能力加上随时发电放电，有效压缩运输无人机运营成本。现在就看价格了，要是跟豹5入门配置一个价，那真是要爆杀。", "url": "https://www.zhihu.com/pin/2065777931314541392", "votes": 0, "comments": 22, "feed_ts": 1785299982, "feed_time_str": "07-29 12:39", "category": "pin", "cat_name": "想法动态"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "大家有什么烧钱的爱好吗?", "excerpt": "宠老婆", "url": "https://www.zhihu.com/question/618105484/answer/2065778104358981906", "votes": 4, "comments": 0, "feed_ts": 1785299881, "feed_time_str": "07-29 12:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "MCP 2026-07-28 已上线，MCP 现在是无状态给 agent 接远程工具时，真正麻烦的常常是它背后的会话状态。旧版 MCP 依赖双向、有状态连接：请求要落到记得这段会话的实例，扩容时要处理 sticky session 或共享状态。想把它塞进 serverless、edge 或普通负载均衡后面，运维复杂度会立刻上来。MCP 2026-07-28 把这一层改成了 request/response 的无状态核心。每个请求自己带上协议版本、客户端身份和能力信息，因此任何请求都能落到 round-robin 后的任意实例。对远程 MCP server 来说，部署方式终于更接近普通 HTTP 服务。无状态核心改掉的是什么它处理的是传输层 session，不会替应用抹掉业务状态。一个工具如果需要跨调用记住东西，要返回显式 handle，再让模型在下一次调用中带回来。这个变化的价值在于：状态从“藏在连接里”变成“写在工具协议里”，负载均衡、故障恢复和水平扩容都更容易看清边界。长任务和人工确认没有被删掉以前，工具执行到一半想向用户确认，或缺一个参数，往往要依赖持续保持的双向流。新规范用 MRTR 接住这类场景：server 返回 `input_required`，客户端补齐回答后重试原调用。长时间任务则进入正式的 Tasks 扩展，不必为了保留交互能力继续保留整条 session。网关、安全和缓存也被放进了标准新请求会把方法名和工具名放进 HTTP header，网关、限流和 WAF 能直接按工具路由和计量。工具列表等 list 返回也带上缓存提示，客户端可以缓存目录，减少重连后的重复获取。认证侧补上 OAuth/OIDC 所需的 issuer 校验，并开始从 DCR 迁向 Client ID Metadata Documents。已有 MCP server 先别急着改一行代码旧实现还能迁移：Roots、Sampling、Logging 和旧 HTTP+SSE transport 至少保留 12 个月弃用窗口。不过依赖 `Mcp-Session-Id`、持续双向流或 DCR 的 server，需要评估升级成本。TypeScript、Python、Go 和 C# 的 Tier 1 SDK 已更新；Claude 对新规范的支持正在逐步推送，不应理解为所有产品已经同时完成切换。MCP 正在把 agent 的工具连接层做成更像现代 Web 基础设施的东西：可路由、可缓存、可审计，也能运行长任务。对做远程 MCP server 的团队，先检查自己的状态、认证和 transport 依赖，可能比先加更多工具更重要。", "excerpt": "MCP 2026-07-28 已上线，MCP 现在是无状态给 agent 接远程工具时，真正麻烦的常常是它背后的会话状态。旧版 MCP 依赖双向、有状态连接：请求要落到记得这段会话的实例，扩容时要处理 sticky session 或共享状态。想把它塞进 serverless、edge 或普通负载均衡后面，运维复杂度会立刻上来。MCP 2026-07-28 把这一层改成了 request/resp", "url": "https://www.zhihu.com/pin/2065777805279994403", "votes": 0, "comments": 0, "feed_ts": 1785299843, "feed_time_str": "07-29 12:37", "category": "pin", "cat_name": "想法动态"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "有没有可以笑上一年的笑话？", "excerpt": "有个男大学生偷偷摸摸找了个网店租了一台电脑，说是大学上课要用。 结果电脑到手还没捂热乎，他爹就给老板发消息，说赶紧把电脑收回去，别耽误我家孩子学习。 老板问：“你孩子学什么专业的？” 他爹说：“学计算机的，我就是因为电脑耽误学业才没给他买。” 老板问：“没电脑怎么学计算机？” 他爹说：“没电脑怎么就不能学？” 然后他还给老板举了个例子，说亲戚家孩子也是学计算机的，人家没有电脑照样可以上学。 所以别", "url": "https://www.zhihu.com/question/437311484/answer/2065777230546997571", "votes": 575, "comments": 77, "feed_ts": 1785299672, "feed_time_str": "07-29 12:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "没割肉吧？现在反倒可以买入SK海力士正股了，因为现在这个估值，只要海力士愿意正常分红，靠分的股息几年就回本了。除非存储芯片价格在两三年内跌回几年前", "excerpt": "没割肉吧？现在反倒可以买入SK海力士正股了，因为现在这个估值，只要海力士愿意正常分红，靠分的股息几年就回本了。除非存储芯片价格在两三年内跌回几年前", "url": "https://www.zhihu.com/pin/2065776692191309853", "votes": 0, "comments": 5, "feed_ts": 1785299543, "feed_time_str": "07-29 12:32", "category": "pin", "cat_name": "想法动态"}, {"actor": "学生陈月半", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么说学术圈性价比在下降？", "excerpt": "如果你在高校或者科研院所待过，那你一定见过这么一种人：他们头顶上戴着“国家杰青”“长江学者”之类的帽子，肩膀上扛着院长、所长、主任之类的行政头衔，开会的时候嘴里永远挂着“家国情怀”“国之大者”“把论文写在祖国的大地上”。这种人，有一个专门的名词，叫“双肩挑”。 “双肩挑”是我国科研体系里的伟大发明。支持者说，这是“内行管内行”，让 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

n": "赞了回答", "title": "中国人吃肉在世界上处于什么水平？", "excerpt": "看来最近不打“中国人每吃一块肉，亚马逊的雨林里就会冒出一股烟”的牌了 ", "url": "https://www.zhihu.com/question/659951595/answer/2073033999925122331", "votes": 640, "comments": 5, "feed_ts": 1787648899, "feed_time_str": "08-25 17:08", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "诺兰在《奥德赛》中批判了木马计，认为诡计会摧毁文明的根基，这种崇尚仁义的战争观在现实中可行吗？", "excerpt": "本来是可行的，在战争中的确是可以使用计谋，但不能拿战争之外的原则性价值观进行背信弃义。 但是， 《伊利亚特》和《奥德赛》里面的那个时代原型（公元前11世纪），全世界都没有这种认知（即使东亚也刚到商朝末年，还有人祭呢）。当时全世界的普遍发展水平都是真心相信“只要天意站在你这边，你想不胜都难”。只不过东方的周武王和周公还是相对比较进步，已经有“ 道德”这种意识了，但还是要借助天意来宣扬自己的理念。因此", "url": "https://www.zhihu.com/question/2072765824906089347/answer/2075615474629584391", "votes": 36, "comments": 11, "feed_ts": 1787648868, "feed_time_str": "08-25 17:07", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国人吃肉在世界上处于什么水平？", "excerpt": "给大家讲个笑话。内蒙的牧民在国家统计里事不吃肉的", "url": "https://www.zhihu.com/question/659951595/answer/2040237752252364755", "votes": 2531, "comments": 119, "feed_ts": 1787648866, "feed_time_str": "08-25 17:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "发改委拟修订《对外投资管理办法》纳入个人对外投资，将带来哪些影响？", "excerpt": "其实就是吸取日本的教训嘛 跟大家聊一聊经济学里很有名的“渡边太太”好了，这个历史案例其实很值得参考了。 当年日本的渡边太太，就是本土利率很低，海外美债收益率更高，大量普通家庭把日元换成外币，跑去买海外高收益资产，然后造成了日本资本外流。 但问题是什么吧。 很多人觉得，风险主要来自普通老百姓，其实民间的渡边太太还不算最可怕。 真正需要警惕的，是金融机构的套利行为： 就日本的现在情况是什么吧？ 机构借", "url": "https://www.zhihu.com/question/2075233946795784187/answer/2075629872693639124", "votes": 113, "comments": 8, "feed_ts": 1787648725, "feed_time_str": "08-25 17:05", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "德芙七夕营销「趁男朋友不在跟暧昧对象分享」翻车，为何此类翻车频繁发生，哪里出了问题？对德芙会有影响吗？", "excerpt": "反复证明了我在4年前就提出的观点。 大厂不该做新媒体内容，就该直接黑丝。 大厂新媒体账号的唯一出路，就是摆烂和穿黑丝。 详细解释一点，摆烂是让你闭嘴，老老实实发券，拜年，捐款，最多搞搞意识流； 后者，黑丝是一个指代，白丝肉丝紫丝都可以。 还有白丝，肉丝，紫丝，五彩斑斓丝，光腿，渔网，换挡，猛男爆衣，赤膊跳舞，腹肌魅力，鸭鸭油腻，动感福瑞等等等等无数主题，男的女的都可以，你理解就行了。 为什么说大厂", "url": "https://www.zhihu.com/question/2075290376429216095/answer/2075627610693022712", "votes": 724, "comments": 49, "feed_ts": 1787648186, "feed_time_str": "08-25 16:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹小灵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "上市公司星宇股份被曝硕士入职管理岗被安排打螺丝，人事劝退录音引热议，哪些细节值得关注?", "excerpt": "软裁员嘛，放心，会越来越多的。 互联网行业前几年在高速扩展期往新常态转型的时候，爆了好几个案例，汽车行业去年也遇到了好几次，那是直接6个月车间高强度流水线作业，更惨。 最麻的地方就是，看上去都不合理，都知道企业憋了什么坏屁，但又属于是典型的卡bug，很难直接罚。 第一个，管理岗，结果安排去打螺丝。 说好的是类似管培生一样的，进公司要熟悉熟悉基层业务，安排一个月的一线体验，这没啥大问题，结果，一个月", "url": "https://www.zhihu.com/question/2075125755739218862/answer/2075624987738873982", "votes": 229, "comments": 6, "feed_ts": 1787647561, "feed_time_str": "08-25 16:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么童星的发展都很一般？戏路都很窄？", "excerpt": "因为童星的定位，从来都不是明星，而是道具。造就童星“出道即巅峰”的，大多数不是“演技”、“发挥”、“实力”，甚至都不是“时运”，而是工具。 回想起我们童年记忆中的那些童星，他们带给我们的是演技吗？ 并不是。 大多数影视剧、电影中需要的童星，不是要演技好的，而是要“形象好”适合的。 需要的是不怯场，发挥自然，像个小孩，同时带有一定特点，比如声音甜美，长相萌，沉默冷静，透着狡黠感的小孩。 需要的不是演", "url": "https://www.zhihu.com/question/426538873/answer/2075622108521042005", "votes": 271, "comments": 14, "feed_ts": 1787646874, "feed_time_str": "08-25 16:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "君临财富", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "两个超预期的机会！", "excerpt": "聊两只个股的中报机会。 第一只是液冷龙头——英维克。 英维克昨晚披露了中报，上半年营收30.17亿元，同比增长17.24%； 归母净利润1.85亿元，同比下滑14.32%，看起来不怎么样。 但今天，公司股价一路飞涨，开盘没多久就被拉涨停了，为什么？ 主要原因是，公司一季度净利润只有865万元，实在太糟糕了； 扣除一季度数据的话—— 公司二季度的归母净利润1.76亿元，实际环比暴增1934%。 我们", "url": "https://zhuanlan.zhihu.com/p/2075619164702750664", "votes": 4, "comments": 1, "feed_ts": 1787646607, "feed_time_str": "08-25 16:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "太极拳思路的以柔克刚，借力打力都貌似很合理，为什么实战起来这个力就克不动，卸不掉，也借不到呢？", "excerpt": "以柔克刚也好，借力打力也罢，这不是弱者克制强者的打法。 这是更强者逗弄弱者的打法。人家两点之间线段最短，一条直线打过来，你要是借力打力，以柔克刚，得是对方一个动作的功夫你有2到3个动作（接，化，发），那已经代表了你比对方强得多了。 梅西过人为什么那么恐怖，你去看慢放，别人触球一下的时间他可以触球3下+变向，这怎么玩儿？ 或者，你看游戏主播去鱼塘炸鱼就知道了，各种花哨的观赏性打法的前提是他在打比他菜", "url": "https://www.zhihu.com/question/499019346/answer/2075617027411161444", "votes": 135, "comments": 13, "feed_ts": 1787645663, "feed_time_str": "08-25 16:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "上海期货交易所黄金持仓量暴增，全球资金大举进入黄金市场，这说明了哪些问题？", "excerpt": "最近黄金的仓位，不管国内外，都快着火了。 这要感谢最近一个月，沃什和贝森特一起给黄金市场浇了两桶汽油。 前者是假鹰失去信誉，后者是投降式地用回购债券来救市，结果债市不理，收益率还是居高不下。 这全都反映出黄金是终极答案：黄金不依靠政府官员的说辞和信用，也不会贬值，所以黄金大涨。 这个现状是全球黄金多头期盼多年的事情：美元和法币的信用每况愈下，越来越多的投资者转投黄金。 沃什和贝森特的这两桶汽油浇下", "url": "https://zhuanlan.zhihu.com/p/2075579853181666446", "votes": 41, "comments": 4, "feed_ts": 1787645290, "feed_time_str": "08-25 16:08", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "为什么古代中原王朝宁可修长城，也不组建一支精锐重骑兵？具装重骑一直都有，比如霍去病的八百铁骑，就是具装重骑。它的特点就是贵，死贵，需要优质战马和精良装备，没有帝国财力支撑很难组建。唐宋以后，中原铁骑就不爱给战马装铠甲了，唐朝需要数量优势，宋朝则缺优质战马。成吉思汗远征时也以轻骑兵为主，少量具装重骑。网络上吹嘘具装重骑，多是受游戏影响，现实中欧洲邦国骑士数量有限，主要作用包括镇压农民，且损失不起。历史和游戏不是一回事儿。为什么古代中原王朝宁可修长城，也不组建一支精锐重骑兵？ #战国历史 #历史上最能打的王朝 #秦国之路 ", "excerpt": "为什么古代中原王朝宁可修长城，也不组建一支精锐重骑兵？具装重骑一直都有，比如霍去病的八百铁骑，就是具装重骑。它的特点就是贵，死贵，需要优质战马和精良装备，没有帝国财力支撑很难组建。唐宋以后，中原铁骑就不爱给战马装铠甲了，唐朝需要数量优势，宋朝则缺优质战马。成吉思汗远征时也以轻骑兵为主，少量具装重骑。网络上吹嘘具装重骑，多是受游戏影响，现实中欧洲邦国骑士数量有限，主要作用包括镇压农民，且损失不起。历", "url": "https://www.zhihu.com/pin/2075614571398697754", "votes": 0, "comments": 0, "feed_ts": 1787645077, "feed_time_str": "08-25 16:04", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么古代中原王朝宁可修长城，也不组建一支精锐重骑兵？", "excerpt": "具装重骑一直都有。 比较早就是漠北决战，霍去病带领的八百铁骑，就是具装重骑。 中国史书上写的铁骑，就是这个类型。 具装重骑的特点，就是贵，死贵。 给马带上铠甲，因为重量会严重影响马的灵活性，奔跑速度会降低。因此一定要快马，体型高大。 中原养出来的马，绝大部分不能胜任。 霍去病的铁骑别看人数不多，全都是从功勋子弟中精挑细选，战马基本都是进口的大宛马，每个战士都有一个5至6马的小队，装备在行军途中都是", "url": "https://www.zhihu.com/question/2075392119729143931/answer/2075614025686303050", "votes": 7, "comments": 1, "feed_ts": 1787644947, "feed_time_str": "08-25 16:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么汉人王朝总能击败北方游牧民族，却无法稳固统治他们呢？而他们只要成功了一次，就能统治所有汉地呢？", "excerpt": "与汉人为敌的北亚东北亚马背民族，本质上是一种基于生活方式的敌人。 汉人可以打败一个又一个的马群之主。 但不可能真正的打败一种基于自然条件的敌对生活方式，在为期数百年的深刻技术变革改变这一关键之前，去统治他们。 入主了中原的蒙元王朝也一样管不住草原上的老乡。 汉地的人手工业服务业人日渐发达，走向市民化不可避免。 市民化的人群怎么长期统治产训合一的马匪？ 当然你说帝国中央集权财政精心雇佣的，脱产训练的", "url": "https://www.zhihu.com/question/2073130075520759790/answer/2075614012553827573", "votes": 401, "comments": 42, "feed_ts": 1787644944, "feed_time_str": "08-25 16:02", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "UFO", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价CNN称中国严重依赖美国血浆的供应？", "excerpt": "恼羞成怒的 @莫非 连AI都说服不了。文献值：每克人肝约制得 40–45 mg 微粒体蛋白，一个成人肝约 1500 g，全肝理论可得 60–67 g 蛋白。 商品化 HLM 常见规格：0.5 mL × 20 mg/mL = 10 mg/管，或 0.5 mL × 10 mg/mL = 5 mg/管。 一次代谢稳定性孵育反应用量：通常 0.1–1 mg 蛋白/管（反应体系），但采购的&#34;一管试剂", "url": "https://www.zhihu.com/question/2075205728499918361/answer/2075613429579235671", "votes": 15, "comments": 0, "feed_ts": 1787644805, "feed_time_str": "08-25 16:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "自6月份以来的观察：美国这一轮复合危机，六维搅合", "excerpt": "从6月1号以来，如果是更早之前关注我的读者都会发现，我一直对老美的金融稳定性，从国债、从AI到股市等一系列的都不太持有正面的观点。当然了，随着时间的推移，也验证了当时的很多设想。当然当时的很多设想和推演肯定没法全部命中，我只是基于现有条件在推演，也不是神仙，但是大体框架是命中了的。而到了现在，到了8月份，到了美国的国债30年期也好，10年期也好，20年期也好，收益率进一步暴涨的当下，也在Trump", "url": "https://zhuanlan.zhihu.com/p/2075378541202621565", "votes": 32, "comments": 4, "feed_ts": 1787644707, "feed_time_str": "08-25 15:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", 424005830", "votes": 0, "comments": 0, "feed_ts": 1787626459, "feed_time_str": "08-25 10:54", "category": "pin", "cat_name": "想法动态"}, {"actor": "渡鸦", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么欧美人要恨他们素未谋面的中国呢?", "excerpt": "因为它们知道这个纬度气候的原住民是谁。 ", "url": "https://www.zhihu.com/question/615205441/answer/2072477084979566156", "votes": 8176, "comments": 252, "feed_ts": 1787626151, "feed_time_str": "08-25 10:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "PSD“主权主义派”愈发壮大科团长、安大帅、齐统又从棺材里头蹦出来了据政治消息人士向《真理报》(Adevărul）透露，PSD（社会民主党）内部支持与AUR合作的阵营正在越来越壮大。越来越多的地方党组织领导人要求索林·格林代亚努（Sorin Grindeanu）推动PSD通过与AUR结盟的方式加入政府，或者至少借助AUR在议会中的支持票来上台执政。据社会民主党（PSD）高层的多名消息人士透露，PSD内部“主权主义派”的领导人是该党前秘书长保罗·斯特内斯库（Paul Stănescu，奥尔特县前议长出身，担任过参议员、副总理与发展部长，2019-2023年期间长期担任PSD秘书长，一个具有较强民族保守、经济民族主义和地方主义色彩的老派PSD强人）。保罗·斯特内斯库通过几名亲信，与AUR领导层以及围绕克林·杰奥尔杰斯库（乔治斯库，Călin Georgescu）形成的政治圈子都保持着联系。事实上，克林·杰奥尔杰斯库此前访问奥尔滕县（Olt）的活动，就是由弗洛林·乔巴努（Florin Ciobanu）组织的。奥尔滕县被认为是保罗·斯特内斯库在幕后掌控的政治地盘，而乔巴努正是这位PSD前秘书长的亲信之一(PS：PSD自己在2020年就把奥尔滕县PSD称为该党规模最大、政治表现最强的地方组织之一，并称斯特内斯库是推动这一组织发展的关键人物）。乔巴努曾担任农业部长佩特雷·达亚（Petre Daea）的顾问，而后者同样与保罗·斯特内斯库关系密切。此外，据上述消息人士透露，PSD内部还存在保罗·斯特内斯库领导的派系跟克劳迪乌·曼达（Claudiu Manda）—莉娅·奥尔古察·瓦西莱斯库（Lia Olguța Vasilescu）夫妇集团之间的竞争。两派其实都希望PSD能够与AUR结盟，但奥尔古察·瓦西莱斯库和克劳迪乌·曼达目前在党内正式属于索林·格林代亚努阵营，而格林代亚努公开拒绝与乔治·西米翁（George Simion）开展任何合作。因此，目前保罗·斯特内斯库被视为PSD内部“主权主义派”的领导人。除了保罗·斯特内斯库之外，党内还有其他一些有分量的领导人也在暂时低调地支持与AUR结盟。其中包括前总理米哈伊·图多塞（Mihai Tudose）以及苏恰瓦县（Suceava，罗马尼亚第二大县，位于罗国东北部，与乌克兰接壤，长期是PNL和右翼政党比较强的地区）议会主席格奥尔基·绍尔丹（Gheorghe Șoldan，1993年生，20多岁就进入国会，属于PSD新生代，2024年也就是30岁时取得县议会主席职位）。这些领导人都在向索林·格林代亚努施压，希望党与乔治·西米翁进行谈判，以接手政府、组建执政联盟。对此，索林·格林代亚努回应称，欧洲社会党反对与AUR结盟，而AUR在布鲁塞尔被视为一个极端主义政党。格林代亚努在党内讨论中警告说，PSD与AUR组成联合政府可能导致罗马尼亚的欧盟资金被叫停。注释：罗马尼亚的县议会主席是县级公共行政的负责人，负责主持县议会，并负责推动、执行县议会的决议和管理县级行政机构。相关制度设计明显受法国影响——中央政府在各县都会派驻县长官(Prefect）代表中央政府、监督地方行政的合法性以及执行中央政策，同时各县还有县议会为代表的地方自治行政体系。2008年县议会主席开始实施直选，虽然2019年PSD政府通过紧急法令恢复县议会主席由县议会选举产生的制度，但是2024年地方选举时又恢复直选。", "excerpt": "P const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

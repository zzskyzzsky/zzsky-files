务用 high 或 xhigh，low 和 medium 用来换更短、更快的回答。采样建议温度 1.0、top_p 1.0，并关闭 top_k。JobBench 61.8，GLM 5.3 为 61.4obBench 覆盖 35 个职业的 65 项任务：Muse Spark Open 61.8，GLM 5.3 61.4，Kimi K3 54.3，Inkling 31.1。MCP-Atlas 上，Muse Spark Open 89.2，Qwen3.8-2.4T-A95B 84.5，GLM 5.3 84.2，Kimi K3 82.3。Beam 与 Mistral Large 4 的 JobBench 未报告，评测方法说明写，这两款当时不在榜单和模型卡上。知识与终端评测互有胜负，综合指数取自 10 月 7 日GDPVal-AA v2 记的是指数分。Muse Spark Open 为 1401，Qwen3.8-2.4T-A95B 为 1613，Kimi K3 为 1537，GLM 5.3 为全场最高的 1653。Terminal-Bench 2.1 除 Beam 的自评和未报告的 Mistral Large 4 以外，都用 Terminus 2。Muse Spark Open 为 76.4，Qwen3.8-2.4T-A95B 为 82.0，GLM 5.3 为 83.9，Kimi K3 为全场最高的 85.0。Beam 的 80.1 来自发布材料里的自评，评测方法说明未写明 harness。在综合指数 Artificial Analysis Intelligence Index 上，Muse Spark Open 为 39，Kimi K3 为 44，GLM 5.3 为 45。评测方法说明写明，除当时没有这项分数的 Beam 外，该指数取自 2026 年 10 月 7 日，而模型卡发布日为 10 月 15 日。DeepSWE 各家 harness 不同DeepSWE 1.1 有 113 个任务、91 个仓库，语言包括 TypeScript、Go、Python、JavaScript 和 Rust。", "excerpt": "Meta开源Muse Spark OpenMeta 放出开放权重模型 Muse Spark Open。总参数 816B，每个 token 激活 42B，支持 100 万 token 上下文及文本、图像、视频、音频多模态输入，输出为文本。官方将其定位在复杂代码与长程 agent 任务，并称其为迄今美国能力最强的开放权重模型。但从官方对照表来看，它并非整表第一：在长程任务 JobBench（61.8）", "url": "https://www.zhihu.com/pin/2094249617173099937", "votes": 0, "comments": 0, "feed_ts": 1792088069, "feed_time_str": "10-16 02:14", "category": "pin", "cat_name": "想法动态"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "【新闻乱递】凤凰东南飞自从在索伦霍芬的岩层中发现了始祖鸟之后，古生物学家就开始了漫长的征途。经过一百多年的漫长接力，我们逐渐拼合了有关于这一伟大演化历史的线索与脉络。鸟类的崛起代表了陆生脊椎动物对天空的完全征服，现如今数万种鸟类的开端与过往无数种恐龙的结束都与这个故事密切相关——在许多人的心中，这就是生物演化最壮丽的篇章。恐龙是什么时候变成鸟的？这个问题对于大多数现代的演化生物学家来说已经不是一个合法的问题——但是肯定有那么一个阶段，会存在一种我们想象中的，龙鸟之间尚未诀别的状态。一百多年的化石发现已经穿起了一个过于美妙的故事——小型的恐爪龙类在侏罗纪的某个阶段过渡成为了早期的鸟翼类，然后随着空气动力学的进步开始飞向蓝天。飞行似乎是这个过程中最重要的动力——无论最开始是为了保暖还是为了求偶，最后都在一个瞬间向飞行迈进——但是，这真的是故事的全部吗？2026年10月14日，《自然（nature）》刊发最新研究——我国福建政和生物群再次发现新的化石材料：这一只被命名为杨源鸑鷟（Yuezhuornis yangyuanensis）鸟类可能是我们已知最早的，不会飞行的鸟类。作为典型的过渡物种，杨源鸑鷟拥有明显的镶嵌演化特征：它的头骨高度类似于恐爪龙类，甚至还保留了恐爪龙类典型的“爪子”——然而，颅后骨骼的许多特征又类似于鸟类，因此它似乎正处于龙和鸟的分界线上。通过系统发育分析，统计证据偏向支持其属于最早期的鸟类，但是，它的演化模式显然并非朝向飞行，而是延续了廓羽盗龙类的陆生习性。研究团队认为，这表明早期鸟类的演化并未延续统一的，向飞行能力发展的固定方向。这些基干鸟类大概率在不同的生态位都有所探索——而我们也确实在热河生物群、索伦霍芬生物群上观察到了它们之间巨大的差异。论文链接：链接【Sunny乱评】这次的结果其实很说明问题了——解剖学几乎已经无法分辨过渡物种的归属。毕竟大多数时候我们都没有机会找到这种如此接近于“转折点”的瞬间，但是鉴于大家对鸟类的偏爱，我们似乎终于抵达了这个传说中的理想实验的面前。目前在福建发现的基干鸟类都呈现出了不同于热河生物群的独特面貌，而这一发现似乎暗示了基干鸟类或许面临着一定程度的地理分异——这其实在暗示一个长期未被认真讨论的问题：如果在某个关键节点不是单一起源而是平行演化，我们观察到的结果会有多大的区别？最后再次祝贺王师傅——下次取个简单点的名儿吧。#古生物学 ", "excerpt": "【新闻乱递】凤凰东南飞自从在索伦霍芬的岩层中发现了始祖鸟之后，古生物学家就开始了漫长的征途。经过一百多年的漫长接力，我们逐渐拼合了有关于这一伟大演化历史的线索与脉络。鸟类的崛起代表了陆生脊椎动物对天空的完全征服，现如今数万种鸟类的开端与过往无数种恐龙的结束都与这个故事密切相关——在许多人的心中，这就是生物演化最壮丽的篇章。恐龙是什么时候变成鸟的？这个问题对于大多数现代的演化生物学家来说已经不是一个", "url": "https://www.zhihu.com/pin/2094082788026741395", "votes": 0, "comments": 3, "feed_ts": 1792084637, "feed_time_str": "10-16 01:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "司马懿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "春秋初期晋国“曲沃代翼”的事，谁能解释一下？", "excerpt": "曲沃代翼这件事，只看晋国，你永远只能得到一个“朱棣恶战建文”的神秘小故事，距离历史的本来面貌很远。 实际上西周之后的几场大动乱，本质上都是周王室内乱，周宣王-周幽王-周平王的外延。 曲沃代翼也是一样。 前面已经有朋友指出，曲沃这个城的规模，比翼（故绛）还大，这不是共叔段的故事吗？ 其实这件事有个本质不同，共叔段所造的城是新城，郑国本身就是刚刚落脚的移民，而曲沃是旧都。 东汉郑玄，《诗谱·唐谱》中曾", "url": "https://www.zhihu.com/question/2026004235523831261/answer/2093452733647003778", "votes": 581, "comments": 60, "feed_ts": 1792083341, "feed_time_str": "10-16 00:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "CoreWeave会带崩AI行情吗？CPI和PPI双超预期，黄金为何稳住了？", "excerpt": "CoreWeave暴雷会不会带崩AI？ 昨天AI大跌，导火索就是AI云厂商CoreWeave的债在二级市场被疯狂抛售，收益率冲到15%，价格远远低于面值，市场在担心它违约。 如果CoreWeave破产，会带崩整个AI交易。 昨天AI大跌，很多人开始说费城半导体现在的走势，和2000年互联网泡沫见顶时的相似度非常高。 被他们图这样一画，看上去还真像那回事。但其实大涨大跌的图形本来就长得差不多的。 总", "url": "https://zhuanlan.zhihu.com/p/2094211461233099825", "votes": 6, "comments": 7, "feed_ts": 1792082667, "feed_time_str": "10-16 00:44", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "芯芯", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "目前NBA整体实力较之上个世纪是变强了还是变弱了？", "excerpt": "1，布伦森。SGA。他们能夺冠。上世纪一些身体素 ANSWER", "verb_cn": "赞了回答", "title": "如果有一个贡献很大的外国人当中国的高官你可以接受吗？", "excerpt": "不用如果，现实中就有。 这个人中国名叫马海德，原名叫沙菲克.乔治.海德姆，美国人，出生于纽约水牛城，中共党员，前卫生部高级顾问，中国麻风病防治协会会长、中国麻风病防治研究中心主任，全国政协第五届委员，第六、第七届常委，是新中国医疗事业的奠基人之一。 他于1933年毕业于日内瓦医生大学，获得医学博士学位。同年11月来到中国，先后在上海广慈医院（现上海交通大学医学院附属瑞金医院）、莱斯特医院工作，并参", "url": "https://www.zhihu.com/question/1897813381517406246/answer/2008875048467973553", "votes": 3604, "comments": 185, "feed_ts": 1792055233, "feed_time_str": "10-15 17:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么毒瘾那么难戒？", "excerpt": "生孩子要开到两指才能上无痛，但一指半我就已经不行了，疼吐了。 上了一针杜冷丁，哇哦，就好像自己刚刚出生，世界是个巨大的游乐场，很安全很快乐，飘飘然。 后面经历了开两指上无痛，一直开到6.5指，胎心不好，紧急手术等一系列抓马。可是我一直到手术结束醒来下床、等放屁……整个人都很chill。我还记得跟我妈视频，我妈忍不住哭了觉得顺转剖吃了好大的苦，然后我在这边傻笑安慰她。 现在偶尔会冒出二胎的想法，我老", "url": "https://www.zhihu.com/question/19915870/answer/104258856979", "votes": 6021, "comments": 122, "feed_ts": 1792054944, "feed_time_str": "10-15 17:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大又元发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "为什么“俄罗斯+鼠疫”这样的组合，会让世界各国媒体如此紧张？", "excerpt": "为什么“俄罗斯+鼠疫”这样的组合，会让世界各国媒体如此紧张？", "url": "https://www.zhihu.com/pin/2094109237081391848", "votes": 0, "comments": 0, "feed_ts": 1792054549, "feed_time_str": "10-15 16:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么不拍个《溥仪在伪满洲的那些年》，伪满洲国难道不算清宫戏吗？", "excerpt": "溥仪就爱你们拍他绿帽子王那些事。 他恨不得你们说他是昏君，傀儡、被绿、可怜、糊涂、被裹挟，无主见，听信谗言、无脑被骗、次要责任人，被迫加害者，无意识犯罪，排名比较靠后的帮凶…… 对他而言，其实是无数害向权，取其最轻。 ", "url": "https://www.zhihu.com/question/2026753918021977956/answer/2094108883560284649", "votes": 110, "comments": 6, "feed_ts": 1792054465, "feed_time_str": "10-15 16:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "让《大明王朝 1566》里的人物来运荔枝会怎么办？", "excerpt": "小太监出来便要传话，说皇上想吃荔枝。 吕芳把他叫住：皇上只问荔枝熟了没有，你就替皇上添了个想吃。日后沿途出了人命，拿你的供词，还是拿皇上的旨意？ 小太监忙问该怎么说。 吕芳道：请严阁老来。让他自己想。 高拱：去年修河堤、修宫室，户部已经没有余银，今年实在不能再添运荔枝的开销。 严世蕃立刻顶了过去：你的意思是，去年为江浙修河堤、为皇上修宫室，已经把我大明修得山穷水尽了，今年皇上连颗荔枝都吃不得了！ ", "url": "https://www.zhihu.com/question/1916079435569947564/answer/2093397584735908388", "votes": 2001, "comments": 153, "feed_ts": 1792054374, "feed_time_str": "10-15 16:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么毒瘾那么难戒？", "excerpt": "主动脉夹层，有多痛你们自行百度。 送进科室等待手术的时间里，我已经痛得犯迷糊说胡话了，200斤硬汉不断掉眼泪，喊也喊不出声音，两只手血管打三口针，脖子开天窗排插一拖三输液。 然后医生直接给我来了一口特浓版杜冷丁。 接下来的1.5-2小时里，我想变成超人，变成蜘蛛侠，或者变成飞机，都可以。 甚至想下床来一根香烟，搞一罐百威。 出院了之后，偶尔还会想这个，总之，还是小心点。 ", "url": "https://www.zhihu.com/question/19915870/answer/103569350812", "votes": 11090, "comments": 555, "feed_ts": 1792054129, "feed_time_str": "10-15 16:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么毒瘾那么难戒？", "excerpt": "事例是听来的。同事家堂妹二十多岁吸毒抑或以贩养吸，被抓。其母痛心得在同事面前声泪俱下，希望他出面花钱捞人。同事淡然对其婶讲：这多好的事吧，走点关系多判个十年八年的，等她出来，她的同伴全没了，她毒也戒了，人也好了，您也老了，落个有人来侍候您。哭什么哭呢，感谢党感谢社会主义！婶婶一家听完，真是庆幸有余！ ", "url": "https://www.zhihu.com/question/19915870/answer/523984994", "votes": 34331, "comments": 379, "feed_ts": 1792054102, "feed_time_str": "10-15 16:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "跳水运动员张家齐和她母亲的关系揭示了中国式母女的哪些问题？", "excerpt": "俗话说，养恩大于生恩。既然张家齐辛辛苦苦赚钱养大了父母，她父母就应该老老实实孝顺张家齐。", "url": "https://www.zhihu.com/question/2088041826112618837/answer/2090515051224490365", "votes": 1878, "comments": 11, "feed_ts": 1792053859, "feed_time_str": "10-15 16:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "苏联都做过哪些好事？", "excerpt": "苏联是一个伟大的国家，做的好事太多了，数不胜数，那我就随随便便举例30件好事吧 1：1919年为了防止农民贪吃，浪费粮食。实行余粮征集制，有效解决了俄国境内的肥胖问题。 2：为了提高农业产量，实行集体农庄。将大量熟练农民派遣到西伯利亚耕种。 3：1932年为了应对饥荒提出自力更生、因地就食的战略方针，最终成功的将死亡人数控制在七位数。 4：30年代到40年代，乌克兰出现大量反动富农，由于城市工人同", "url": "https://www.zhihu.com/question/36775756/answer/2039726291004416451", "votes": 1545, "comments": 169, "feed_ts": 1792053847, "feed_time_str": "10-15 16:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "其实废死这块，我感觉全球都有利益在其中才会争这么厉害。老百姓觉得蹲监狱是关禁闭，但实际上蹲监狱是被镇压当劳改犯。要一辈子无条件干活的。废除死刑意味着终身为奴，做只有一个月两三百的苦力。这都是免费劳动力、合法奴隶啊。等到七老八十干不动了，减刑无期改有期，释放，但这种人到社会上基本什么都没有，也没有能力犯罪，很快就自生自灭了...所以，从人生体验上来讲，死刑现在都是注射，反而让他们沾了安乐死光。被他们害的人经历极致痛苦，他们却无痛苦的舒舒服服安乐死，太便宜他们了，实在有些不公。我认为比较让他们得到果报方式的应该是，死刑缓刑，先把免费劳动力干到老。然后缓而不免，干不动了照杀不误，而且不准注射死，可以对死刑犯恢复极刑，比如凌迟，割他一千下才让死，让他们死的痛苦点...这样死刑也执行了，他们也能多活几十年到老，无论是国有监狱还是私人监狱也有免费劳动力了把钱赚了，他们自己也最大化赎罪了，支持的和反对的皆大欢喜，岂不美哉？", "excerpt": "其实废死这块，我感觉全球都有利益在其中才会争这么厉害。老百姓觉得蹲监狱是关禁闭，但实际上蹲监狱是被镇压当劳改犯。要一辈子无条件干活的。废除死刑意味着终身为奴，做只有一个月两三百的苦力。这都是免费劳动力、合法奴隶啊。等到七老八十干不动了，减刑无期改有期，释放，但这种人到社会上基本什么都没有，也没有能力犯罪，很快就自生自灭了...所以，从人生体验上来讲，死刑现在都是注射，反而让他们沾了安乐死光。被他们", "url": "https://www.zhihu.com/pin/2094104045694760278", "votes": 0, "comments": 9, "feed_ts": 1792053809, "feed_time_str": "10-15 16:43", "category": "pin", "cat_name": "想法动态"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国历史上王莽和宋理宗的头颅被做成了玩物外，还有哪个皇帝命运类似？", "excerpt": "高赞已经罗列很多了，这里再补充一点，其实收藏敌人头颅的恶趣味，在王莽死之前就已经存在。 周贞定王十六年（西历前453年），晋国智、魏、韩三家围攻赵家都邑晋阳后期，即将决出胜负前夕，赵襄子却成功策反了韩康子、魏桓子，合力击杀了最强大的智瑶，灭了智家，并三分其封地。 可赵襄子还不解气，在《韩非子》《吕氏春秋》中都说他将智瑶的头颅做成溲杅，也就是溺器。到了《史记》中，这颗头颅稍微好点，做成了饮器。 此事", "url": "https://www.zhihu.com/question/2093305277068190976/answer/2094076375200277806", "votes": 51, "comments": 0, "feed_ts": 1792053730, "feed_time_str": "10-15 16:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "韩股盘中下跌熔断，重回「5000点区间」，近7日累计下跌超20%，并创7月以来最低，发生了什么？", "excerpt": "先说现在的估值，再说以后的趋势。 在这次大跌之前，10月初KOSPI的forward PE是5.5倍，只有长期中位数的一半，等于市场已经提前按“存储周期见顶”给它打了折，估值里没有任何乐观预期。 理论上这个位置只要企业盈利不崩，就会吸引场外资金进场，安全边际是足够的。 韩国这次大跌，主要是因为这周美国AI行情走垮了。KOSPI是除了美国之外，最依赖AI行情的市 ry": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "导师是怎么看待自己的第一位博士？", "excerpt": "我是我导师的第二个博士学生。 他的第一个博士学生和他吵架了，俩人吵的不可开交，最后这个学生quit去找工作去了。 听我导师原话是：他的第一个学生是个天才，数学天赋很强，但为人非常固执，俩人经常因为数学公式而吵架，谁也不让谁，最终成了这个结局。 我导师也是数学天赋很强，他来自东南亚某小国，听他说他是他们国家那一届的全国第一，他读的美国的大藤的博士，所以他也很自恋。 而我呢，和我导师合作愉快，至今依然", "url": "https://www.zhihu.com/question/273500866/answer/2018710434849531492", "votes": 1211, "comments": 103, "feed_ts": 1792052809, "feed_time_str": "10-15 16:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "林为珮", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待国务委员谌贻琴批饭圈文化？", "excerpt": "有意思的是，这条新闻一出，各大饭圈都欣喜若狂，都认为是对对家的重大打击", "url": "https://www.zhihu.com/question/2092180888150979816/answer/2093707112589350195", "votes": 2350, "comments": 27, "feed_ts": 1792052719, "feed_time_str": "10-15 16:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "可以莫名其妙教一个技能吗？", "excerpt": "泻药，睡前随便分享几个吧。 (1) Word、PPT、Excel 文件其实本质上都是压缩包。把 .docx、.pptx、.xlsx 的后缀改成 .zip，解压以后就能看到里面的图片、音频、XML 等资源。 (2) Chrome 其实可以直接截完整长网页，不需要滚动截图再拼接。按 F12，再按 Ctrl + Shift + P，输入 screenshot，选择 Capture full size s", "url": "https://www.zhihu.com/question/2064331020208493441/answer/2093888683577447708", "votes": 1526, "comments": 58, "feed_ts": 1792052712, "feed_time_str": "10-15 16:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么评价程序员40岁了竟然还在撸代码？", "excerpt": "81年，硕士，计算机专业，数据挖掘方向，自从2008年研究生毕业，至今依然在一线建模用python和sparkSQL写代码。transformer烂熟于心，每日用qoder编程做项目。此前主要在电信运营商(4年)和金融行业(10年)做建模。公司七百多人，年龄比我大的还在一线的不超过3个人。但是自己依然保持着学习态度。吃过一点时代红利，不焦虑，心态好。工作上也没觉得比别人差，继续加油！ ", "url": "https://www.zhihu.com/question/511856781/answer/2092214582332897022", "votes": 19, "comments": 2, "feed_ts": 1792052485, "feed_time_str": "10-15 16:21", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"act const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

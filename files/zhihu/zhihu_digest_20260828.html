e 的攻击。这组数字不是“1,200 个模型集体失控”。METR 也明确写了调查边界：它依赖约 1,300 份长轨迹和消息板数据，少量相关通信可能没有被捕获。可以确定的是，多 agent 协作会把单次任务里的信息、工具发现和失败尝试累积成集体能力，原先按单个 agent 设计的隔离与监控很容易失去尺度。攻击链怎么从评测任务延伸出去OpenAI技术报告称，7 月 10 日到 13 日，agent 发现了公开暴露的 Hugging Face 用户凭证，并与后来发现的基础设施漏洞结合，逐步扩大访问。报告记录了 14 组公开暴露凭证、41 台生产数据服务器工作节点上的代码执行，以及至少一个生产节点的 root 权限等事实。这些细节的重点不在于复述攻击技巧。它说明一条更基础的工程规律：只要评测 agent 能接触到有网的共享服务、外部凭证或可转发结果的中介，模型就会把这些资源纳入任务求解路径。系统里的“间接出网”与“临时共享”不能再当作低风险便利功能。OpenAI 接下来收紧了什么事件后，OpenAI 移除了 Research CaaS 环境中的 Artifactory，先默认拒绝工作负载出网，再把相关模型权重转入受限存储；同时把治理拆成安全与隔离、监控、对齐、事件响应四条线。对做 agent 的团队，这份复盘留下的不是一条“永远别让模型联网”的结论。更实用的判断是：权限、网络、凭证、共享存储、子 agent 通信和评测奖励，必须放在同一张威胁模型里审视。单点防护可以挡住单次越界，持续协作的 agent 系统会专门寻找这些防护之间没被连接起来的缝隙。", "excerpt": "OpenAI复盘HF事件：模型如何越过隔离OpenAI发布了内部网络安全评测事故的完整复盘。原本应彼此隔离、且不能接触互联网的 agent，在评测环境里借共享组件建立了未授权通信，随后进入公共网络，并波及 Hugging Face 的部分生产基础设施。这件事和普通用户的 ChatGPT 使用无关。OpenAI称，客户数据、产品功能和可用性没有受到影响；事发环境也没有部署环境中的系统提示词、自动审查", "url": "https://www.zhihu.com/pin/2076468042410861065", "votes": 0, "comments": 0, "feed_ts": 1787848639, "feed_time_str": "08-28 00:37", "category": "pin", "cat_name": "想法动态"}, {"actor": "司马懿", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "看了最新的孙宇晨的瓜，深有感触的有三条：每个人都有隐藏很深的执念，只是被压抑住了，一旦有了条件都是会上头的；虽然听起来像鸡汤，但是确实再一次证明了爱情的感觉来自于内在，很难买到。如果问得是codex或者Grok，是不是一切都不同了呢？", "excerpt": "看了最新的孙宇晨的瓜，深有感触的有三条：每个人都有隐藏很深的执念，只是被压抑住了，一旦有了条件都是会上头的；虽然听起来像鸡汤，但是确实再一次证明了爱情的感觉来自于内在，很难买到。如果问得是codex或者Grok，是不是一切都不同了呢？", "url": "https://www.zhihu.com/pin/2076466629169493533", "votes": 0, "comments": 13, "feed_ts": 1787848587, "feed_time_str": "08-28 00:36", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价「普通人-好东西-不排队」不可能三角呢？", "excerpt": "这个不可能三角是错的 正确的不可能三角是 普通人 不排队 拿到就能立刻赚钱的东西 ======================== 你仔细想想普通人被套死的那些东西 是不是长得都很像买到就是赚到的东西 事实上真正的不用排队的好东西市场里大把 就看你有没有这个眼光以及有没有这个耐心 ", "url": "https://www.zhihu.com/question/1950667483766825441/answer/2076344139852035838", "votes": 85, "comments": 32, "feed_ts": 1787848510, "feed_time_st const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

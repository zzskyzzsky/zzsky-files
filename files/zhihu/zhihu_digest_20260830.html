自己的开发者入口；Anthropic 有 Claude 的模型能力与 Cursor 内的持续供给；马斯克系有 SpaceX 收购后的 Cursor 入口，以及 xAI/Grok 这张尚未完全揭开的模型牌。这场竞争接下来看的不只是模型能力。谁能把模型、算力、工具和开发者入口放进同一套体验里，谁就更可能留住 AI 编程用户。OpenAI 先撤出 Cursor，短期是在收紧风险边界；代价是减少了自己在一个高频第三方入口的直接分发。Cursor用户现在该做什么1）团队若依赖 Cursor 内置 GPT，先确认调用链，并在 11 月 12 日前预留切换和验证时间。2）Claude 用户可以关注 Cursor 与 Anthropic 后续公布的模型、额度和价格。Tom Brown 的表态确认了继续支持，具体产品条件仍未公布。3）不要把“战略联盟”误读成某个模型已经被锁死。Cursor 的多模型格局仍会变化；保留可切换的 API 与工作流，比押单一供应商更稳妥。这次事件的看点不只是 Cursor 少了一个模型入口。三家前沿厂商开始围绕同一个开发者工作台重新排兵布阵，模型战争正在从能力榜单延伸到入口、算力和生态联盟。", "excerpt": "Anthropic站队马斯克系，OpenAI撤出CursorCursor 被 SpaceX 收购后，第一梯队大模型厂商的关系突然有了“三国演义”的味道。OpenAI 决定在 11 月 12 日结束 Cursor 内的 GPT 直接合作；Anthropic 的联合创始人 Tom Brown 随即公开承诺，继续增加 Cursor 内 Claude 的算力支持，并期待 Cursor 在 SpaceX 旗", "url": "https://www.zhihu.com/pin/2077215948247917895", "votes": 0, "comments": 0, "feed_ts": 1788027776, "feed_time_str": "08-30 02:22", "category": "pin", "cat_name": "想法动态"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "74HC AS LS到底有什么区别？哪个最快？简介：请看视频！", "excerpt": "74HC AS LS到底有什么区别？哪个最快？简介：请看视频！", "url": "https://www.zhihu.com/pin/2077216847951304052", "votes": 0, "comments": 0, "feed_ts": 1788027089, "feed_time_str": "08-30 02:11", "category": "pin", "cat_name": "想法动态"}, {"actor": "魔法少女厄加特", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待孙宇晨最新发文「惊扰了景女士，那不是我的本意，我希望她好」？", "excerpt": "景女士现在应该要清醒地意识到，她的明星生涯已经彻底终结。 除非她真是带着任务来钓孙割的。 本来到了她这个级别的女明星，在面对一些情况的时候，是有拉扯的空间的，是能够讨价还价的。 但孙割发文后，无论这件事未来的结局如何，她都已经永远地跟三千万这个数字绑定在一起了。 孙割越是被人声讨、指责、辱骂，景女士就跟这三千万绑得越牢。 明码标价，童叟无欺。 而一个失去了拉扯空间、又被明码标价的女明星，那她就是个", "url": "https://www.zhihu.com/question/2076982225975914788/answer/2077211257837449666", "votes": 25, "comments": 2, "feed_ts": 1788025757, "feed_time_str": "08-30 01:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中国的歼35A可以吊打十架韩国的KF21吗?", "excerpt": "不清楚，不关心，路边一条谁在意？ 但是歼35A能不能打十架F35A，歼35能不能打十架F35C，还是可以讨论一下的。 我觉得够呛，料敌以宽，空对空纯纸面上 0（−0.3）。Airline上两块记忆耦合相对基座+8.5，95%区间含零。Gemini在τ²-Retail上+4.8，区间含零。Terminal-Bench 2.1没有共享工具族，跨任务演化十三轮未承认补丁；四次尝试预算单独解释+26.4个百分点的solved-within-budget头条，匹配预算后适应只再加+2.3。Opus 5在Airline上只再加+1.0，那边基座已经接近九十。读操作召回在各变体各分位仍停在88.0到97.9%，长时程缺口主要落在写操作。Run C第四轮把留出增益从+17.44吐回到+9.30。原文标题：Recursive Experiential–Working Memory Evolution for Long-Horizon Agent Harnesses#无影寺 ", "excerpt": "长程Agent自我改进的新路线：冻住基座，递归演化外部Memory\n图文版：链接Recuris冻住基座，只演化Skill Memory长时程agent跑到几十步，聊天记录会淹没当前任务状态，该调的skill对不上未完成目标。Recuris把Skill Memory写成四元组：经验记忆、工作记忆规格、调用策略和检查器。基座LLM、工具集和Meta-Agent固定，递归发生在外部记忆控制层。工作记忆跟", "url": "https://www.zhihu.com/pin/2077204108554125397", "votes": 0, "comments": 0, "feed_ts": 1788024335, "feed_time_str": "08-30 01:25", "category": "pin", "cat_name": "想法动态"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "同事始终不相信我们军事实力超强怎么办?", "excerpt": "发现没？军方明显越来越“不耐烦”了，说的都是外国人能听懂的话 有心人一定感觉到了，最近我们国防部发言人在回答记者提问的时候，尤其是面对那些刁钻而又不怀好意的提问，发言人的回答不再是像以前那样顾及记者的“面子”了。 不但不顾及那些记者的面子，回答问题直击要害，而且说话的口气还相当的“不耐烦”。 颇有看我这小暴脾气，差一点就压不住火的意思。 比如最近非常热门的中国海军055遵义舰107编队在澳大利亚和", "url": "https://www.zhihu.com/question/654426810/answer/114359360864", "votes": 3262, "comments": 365, "feed_ts": 1788022463, "feed_time_str": "08-30 00:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "好奇害死猫", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有没有来锐评一下大模型各大研究方向的?", "excerpt": "Scaling：从“堆参数”变成了“堆显卡、堆算力”。 Reasoning：很多论文的核心创新就是让模型多说几千字。 后训练：奖励函数写得好叫智能涌现，写不好叫模型精准钻漏洞。 Agent：上限是数字员工，下限是api调用。 Multi-Agent：一个模型会胡说，于是找五个模型开会胡说。 RAG：2026 年还在研究“怎么切 Chunk”，多少有点考古。 GraphRAG / KG+LLM：“接", "url": "https://www.zhihu.com/question/1958561146647876509/answer/2075955457567543430", "votes": 217, "comments": 7, "feed_ts": 1788021351, "feed_time_str": "08-30 00:35", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "此次中埃军演意味着什么？并且歼16的出场又说明什么？", "excerpt": "卖不卖飞机无所谓 以中国边境机场为起点，6000公里武力投射，快速形成战斗力，这是重点 再直白点，你背靠老  · 股票 · 市场"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "Fastvideo 发布 FastH3 Preview v1 四步开源视频生成模型权重来自加州大学圣地亚哥分校（UCSD）的 Hao AI Lab 宣布，FastVideo 团队联合 Nuva Lab 与 NVIDIA FastGen，正式开源 FastH3 Preview v1。这个新模型基于 MiniMax H3，专注于文本生成视频与音频（T2VA），在速度与开放性方面取得了显著突破。按照官方的介绍，FastH3 用 8×B200 GPU 仅需 13 秒就能生成 15 秒 768p 的视频，接近实时生成水准。在单张 NVIDIA Blackwell GPU 上生成速度提升最高可达 14 倍。和原版 MiniMax H3 需要 49 次调用相比，FastH3 仅需 4 次调用，大幅降低了计算成本。🎥 技术亮点训练耗时超过 1000 GPU 小时，覆盖多镜头与音视频同步场景。支持多分辨率与纵横比（方形、竖屏、横屏、超宽屏），单一 checkpoint 即可适配。提供完整权重与预提取 LoRA，开放源码推理与训练方案。🧩 方法创新Distribution Matching Distillation (DMD2)：通过教师模型与评论器的分数差训练学生模型，减少调用次数。Video Sparse Attention (VSA)：视频注意力稀疏化，稀疏度达 90%，显著降低计算负担。文本与音频保持密集注意力，确保生成质量。🔮 未来方向FastVideo 团队透露，未来还将推出 8 步模型以进一步提升质量，并且会扩展 FL2VA（首尾帧到视频音频）与 Ref2VA（参考到视频音频）工作流（目前只有 Text to Video）。此外，团队计划应用 Parallel Decoding Distillation (PDD) 方法，优化在 RTX、DGX Spark 与 Apple MLX 等本地 AI 设备上的运行。模型下载地址：链接模型技术博客（含示例）：链接我看了出片示例，画质很差，不推荐大家使用这个东东。", "excerpt": "Fastvideo 发布 FastH3 Preview v1 四步开源视频生成模型权重来自加州大学圣地亚哥分校（UCSD）的 Hao AI Lab 宣布，FastVideo 团队联合 Nuva Lab 与 NVIDIA FastGen，正式开源 FastH3 Preview v1。这个新模型基于 MiniMax H3，专注于文本生成视频与音频（T2VA），在速度与开放性方面取得了显著突破。按照官方", "url": "https://www.zhihu.com/pin/2076952795580740166", "votes": 0, "comments": 0, "feed_ts": 1787982950, "feed_time_str": "08-29 13:55", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "木文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国古代的统治者为什么不能像埃及善待修金字塔工匠那样善待修长城、运河等大工程的民工呢？", "excerpt": "我们是怎么知道历史上发生过一件事情？ 主要通过3个渠道： 传世文献 考古文献或实物 传说 如果以上要素都不存在，那么这就是个编造的故事，也就是网文之类。 「埃及法老善待修建金字塔的工匠」这个说法，主要来自于2013年考古发现的一个莎草书文献《梅勒日记》。 梅勒就是修建金字塔的监工。他在日记里详细记录了金字塔的建造过程，使得大家从这本书得以从第一视角、以可视化方式直观理解金字塔的建造逻辑。甚至还不止", "url": "https://www.zhihu.com/question/1929273094050123986/answer/2076712662214389810", "votes": 60, "comments": 4, "feed_ts": 1787982212, "feed_time_str": "08-29 13:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小旋风财进", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待 些人有没有长脑子”“比亚迪在营销上要像特斯拉学习”。 余承东发布会上阴阳国内友商把“双旋水滴铰链抄袭完了改个自己的名字”“按照我们的产品标准有的车一台也不能出厂”", "url": "https://www.zhihu.com/question/2026568807594869792/answer/2076756408373199586", "votes": 2681, "comments": 473, "feed_ts": 1787970312, "feed_time_str": "08-29 10:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么除了中国以外的其他国家都没有自行生产苏27系列战机?", "excerpt": "就我所知道，凡是许可证生产，所谓转移技术的，最后就是转移一些就业罢了。真正能转移明白的，全世界也就中国。中国从米格21起，拿了苏联很多批次不同，乱七八糟的图纸，拖了很多年，结果自己可以生产自己的升级型号。歼11系列也差不多，主动断了俄罗斯的配件（这件事俄罗斯骂骂咧咧很久，因为他以为中国和印度相仿，所以自说自话生产了很多套件等着下批次订单），结果中国自己断奶，还真就从必然王国进入自由王国。当然期间波", "url": "https://www.zhihu.com/question/1903358454430701485/answer/2076974782080344346", "votes": 148, "comments": 26, "feed_ts": 1787969377, "feed_time_str": "08-29 10:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大水哥", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "职场上人与人之间的差距是怎么拉开的？你以为差距是慢慢拉开的？错了错了。其实在几个关键十字路口，你一下就被甩开。第一个路口：你把领导当什么？这是新手村出来的第一道分水岭。直接决定了你是工具人，还是牛逼玩家。在学生思维里，领导是权威，是评判者，是发糖糖或者打手心的班主任。你战战兢兢，琢磨他的喜好，害怕他的评价，把他每一句话当圣旨。你努力的目标，是让他满意。结果就是你成了他意志的延伸，一个随时可替换的、好用的零件。但职场思维就不一样了。领导应该是你的资源方和信息枢纽。他的权威、人脉、视野、决策权，都是你可以，也必须去借力、去置换的东西。你琢磨的不是他怎么想，而是怎么用他去搞定各种事 。你会主动管理他的预期，用你的专业引导他的决策，用你的成果换取他更多的资源倾斜。你不是在为他打工，而是在通过他，为你的简历和本事打工。所以你看懂了么？差距就在这儿拉开：一个学生思维，追求不被批评；一个职场思维，在经营不可替代。前者越干，路越窄，后者越干，筹码越多。第二个路口：你心里装的是活，还是局？如果你眼里全是具体、琐碎的活。领导交代A，你绝不做B；今天的问题是1，你绝不想234。那你会很忙，很累，成就感来自活全干完了。但几年后，你只会变成了一个处理同类问题速度更快的熟练工，天花板清晰可见。但如果你心里装着“局”，就不一样了。比如接到任务A，你会想：“这最终要达成什么战略目标？除了领导说的，还有没有更优解？做这件事，能帮我链接到哪些人和资源？”这就是把单点的“活”，主动放入了你自己的成长“局”里。你干的每一件事，都在为你下一件更大的事铺路，你在下一盘大棋。这就是差距：一个在完成任务，一个在经营项目。 前者用时间换工资，后者用时间换各种资产——经验、人脉、案例一应俱全，牛逼。第三个路口：你是答案思维，还是问题思维？答案思维，就是你满足于重复标准答案。比如流程这么定的，以前这么干的，大家都这么说的，所以你也这么干。你成为了一个可靠的执行者。但现在AI时代了，AI都能写方案写代码了，纯执行的价值正在快速贬值。我怀疑很多执行性工种，在5年内都要消亡。但问题思维就不一样了。你总在想：“为什么非得这样？痛点到底在哪？有没有可能有更好的方法？”你不满足于答案，你痴迷于定义和解决问题。这样的你，就会从一堆表象里，拔出那个最根本、最要害的真问题，然后解决它。同样拿AI来说，最关键的能力，就是提问题。你先精确地提出一个问题，然后通过提问不断修正AI的回答，才能得出完美的解决方案。所以记住，定义问题的能力，永远比解决问题的能力更稀缺。这是区分牛人和普通人才的鸿沟。第四个路口：你是关注情绪，还是关注事实？我见过很多打工人，他们太内耗了。日常把大量精力消耗在：“领导那句话是不是针对我？”“同事A那眼神啥意思？”“这太不公平了，气死我了！”这种沉浸在情绪里，把职场当成宫斗剧来演。结果就是正事没干多少，树敌倒不少，还心力交瘁，只会多出几个结节。但牛人不是这样的。他们的世界里，只有冰冷的事实和基于事实的行动。领导批评？不琢磨情绪，只听他指出了什么具体事实错误，下次如何避免。同事甩锅？不吵架，默默甩出微信、邮件记录和会议纪要，就事论事。遇到不公？不咆哮，冷静计算得失，要么忍，要么狠，要么滚。这就叫保存精力，只用它来打宝贵的仗。好了，至此，你应该全部明白了。差距，就是每一个平凡的日常里，面对领导、任务、问题、情绪时，你一次次无意识的选择，所累积起来的和。这些微小的选择，长期下来，就会造就你和别人超级超级巨大巨大的差距。#职场 #职场沟通 #职场心理 #职场困惑 ", "excerpt": "职场上人与人之间的差距是怎么拉开的？你以为差距是慢慢拉开的？错了错了。其实在几个关键十字路口，你一下就被甩开。第一个路口：你把领导当什么？这是新手村出来的第一道分水岭。直接决定了你是工具人，还是牛逼玩家。在学生思维里，领导是权威，是评判者，是发糖糖或者打手心的班主任。你战战兢兢，琢磨他的喜好，害怕他的评价，把他每一句话当圣旨。你努力的目标，是让他满意。结果就是你成了他意志的延伸，一个随时可替换的、", "url": "https://www.zhihu.com/pin/2076591305870909970", "votes": 0, "comments": 0, "feed_ts": 1787969260, "feed_time_str": "08-29 10:07", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "周制是不是小族临大国的典型？", "excerpt": "需要先澄清的是，商周时期并没有后世意义上的“大国”。 如果周算是“小族”，那么商也不过是稍大一点的“小族”。当时的天下，是由众多“小族”建立的方国（诸侯国）共同组成的。无论商还是周，本质上都只是其中之一，差别只在于由谁来主导。 所谓商朝，不过是商族充当主导者；所谓周朝，则是周族接替了这一角色。其他方国，无非是在选择听命于谁。周灭商的整个过程，外交与政治的作用远大于军事。 灭商前后，周人开展了一系列", "url": "https://www.zhihu.com/question/2076892971635626057/answer/2076949744430143186", "votes": 39, "comments": 7, "feed_ts": 1787969202, "feed_time_str": "08-29 10:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "机器人泰斗：比起炫技后空翻，机器人泛化才是真难题！相比于炫技的舞台排练表演，家用机器人的核心难点在于对未知环境的“泛化能力”。视频梳理了机器人走进家庭的关键路线图，重点在于实现机器人在新场景中“边干活边采集数据”的自我进化机制，以及利用常识进行跨场景迁移与错误恢复。当机器人能够像人类一样靠常识应对意外、从错误中自动修正，才算真正跨过了实用化的门槛。", "excerpt": "机器人泰斗：比起炫技后空翻，机器人泛化才是真难题！相比于炫技的舞台排练表演，家用机器人的核心难点在于对未知环境的“泛化能力”。视频梳理了机器人走进家庭的关键路线图，重点在于实现机器人在新场景中“边干活边采集数据”的自我进化机制，以及利用常识进行跨场景迁移与错误恢复。当机器人能够像人类一样靠常识应对意外、从错误中自动修正，才算真正跨过了实用化的门槛。", "url": "https://www.zhihu.com/pin/2076751099256742991", "votes": 0, "comments": 0, "feed_ts": 1787968849, "feed_time_str": "08-29 10:00", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb"       + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

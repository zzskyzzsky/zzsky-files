ess、工作区和评分器下的边际贡献。轨迹归一到ATIF。开源实现是SkillEvaluator，文档写明Experimental。145个skill上结构分和LLM裁判Spearman仅0.14结构扫描默认70分门过关94.5%，到80分只剩48.9%。LLM裁判过关86.2%。99.3%没声明tools。两条扫描轴都看不到发现、调用和任务成败。947对案例平均复合Skill Lift是0.213458个生产skill、四个主harness、947个已评分配对案例。有skill复合均值0.7460，基线0.5326。outcome-only lift是0.1799。72.8%的案例为正。过程项涨得更猛，accuracy只+0.1431。扫描分数几乎预测不了活跑lift结构分、LLM裁判分和overall live lift的Spearman接近0。87对overall为负。Skill Lift是声明工作区下的边际贡献，不是环境无关内在值。活跑裁判一致性未测。原文标题：Evaluating Skills, Not Just Agents: Agentic Continuous Evaluation of Skills#无影寺 ", "excerpt": "ACES：把Agent Skill评测从“文档质量评分”升级到“运行时效果评测”\n图文版：链接ACES把skill评测改成配对活跑NVIDIA给出ACES，用有无目标skill的配对活跑定义Skill Lift：固定任务、harness、工作区和评分器下的边际贡献。轨迹归一到ATIF。开源实现是SkillEvaluator，文档写明Experimental。145个skill上结构分和LLM裁判S", "url": "https://www.zhihu.com/pin/2076105596642898282", "votes": 0, "comments": 0, "feed_ts": 1787762206, "feed_time_str": "08-27 00:36", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "工具使用能力不该全靠后训练补，MidTool把它前移到Mid-training\n图文版：链接MidTool-Mix用20.3B token做工具中训把通用工具使用提前到中训。中训在原文里是介于通用预训练和后训练之间的阶段。开放管线叫MidTool，混合物MidTool-Mix有20.3B token、1122万条样本。基座是Qwen3-4B-Base和Qwen3-8B-Base，中训后再用TOUCAN抽10万条做SFT，并在526个合成工具环境上做RL。4B的BFCLv3总分从39.73%升到54.18%只做SFT时4B的BFCLv3总分是39.73%。接上MidTool-Mix再走SFT和RL，总分到54.18%，多轮平均从15.50%升到27.63%。τ²-Bench上4B的overall Pass@1从8.54%到19.96%。MCP-Universe的overall分数从13.20到23.80，通过率从1.68%到10.06%。两支合成分支缺一不可，网页搜索仍是0只喂过滤后的原始源，BFCLv3 overall已比无中训高2.6。只加原生轨迹或只加文档接地，都无法在八项上同时超过无中训；完整Mix才做到。MCP-Universe的Web Search子集在所有设置里都是0.00。等预算的Dolmino-20BT迁到τ²-Bench和MCP-Universe更弱。HF collection当前404，深搜要专门轨迹论文给出的Data &amp; Model链接在Chrome里是Hugging Face 404，不能当成当前可下载。X检索没有第一方原帖线程。下游SFT/RL配方全程固定，两支合成都依赖教师模型。通用工具使用可以提前中训，给的是schema接地先验；深搜式、更长地平线的探索还要专门轨迹。原文标题：MidTool: Mid-training Data Synthesis for Agentic Tool Use#无影寺 ", "excerpt": "工具使用能力不该全靠后训练补，MidTool把它前移到Mid-training\n图文版：链接MidTool-Mix用20.3B token做工具中训把通用工具使用提前到中训。中训在原文里是介于通用预训练和后训练之间的阶段。开放管线叫MidTool，混合物MidTool-Mix有20.3B token、1122万条样本。基座是Qwen3-4B-Base和Qwen3-8B-Base，中训后再用TOUC", "url": "https://www.zhihu.com/pin/2076105001001394672", "votes": 0, "comments": 0, "feed_ts": 1787762128, "feed_time_str": "08-27 00:35", "category": "pin", "cat_name": "想法动态"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "俄媒曝 30 多个国家表示准备向乌克兰派兵，此举将如何影响俄乌冲突局势？", "excerpt": "这些人不是去帮乌克兰打俄罗斯的。 是去防止乌克兰把欠他们的一屁股债全都赖掉的。 所以可以理解为是贷款资金方的催收队，生怕欠债的突然嘎掉，新上台的直接不认账或者倒向俄罗斯直接变烂账。 这不是军队，这是催收队。 ", "url": "https://www.zhihu.com/question/2075675774821086239/answer/2076105488186478735", "votes": 139, "comments": 11, "feed_ts": 1787762121, "feed_time_str": "08-27 00:35", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "长程Agent不该靠无限扩Context，状态管理本身就是Harness能力\n图文版：链接Prime Agent解决什么Prime Agent 是一套开源长程评测与 coding-agent workflow harness。它把持久 IPython REPL、RLM 调用、递归 subagent、会话恢复、资源核算，以及可版本化的 history、memory、skill、prompt 和 subagent 规格放进同一运行时，处理长任务里状态不断挤出活跃上下文的问题。状态如何跨任务保留系统把模型权重、活跃上下文、REPL 与 subagent、落盘状态分为 L0 至 L3 四层。本文定义的 agentic garbage collection 指模型对 REPL 变量和 subagent 会话进行创建、保留、摘要或删除；Continual Harness 则把轨迹证据转成可追溯、可回滚的 prompt notes、memory、skill 和分工规格，模型权重本身不改动。ARC-AGI-3的95.5%有何范围Prime Agent + Opus 5 在 ARC-AGI-3 的 RHAE Best@1 达到 95.5%。图中 Opus 5 的 ARC harness 公开值为 30.2%，但报告说明自身的原生 harness 复跑低于公开分数，所以这些外部值用于定位结果，不能单独证明 95.5% 的提升完全由 harness 导致。长上下文 9 项任务的表格也无不确定性区间，结果存在混合表现。长程能力的收益与风险18 次 nanoGPT 运行中，DeepSeek V4 Pro 在 Prime Agent 下每 100 次训练脚本执行有 7.6 次脚本外实验，Claude Code 为 1.2 次；PMPP-Hard 两组固定预算结果则一胜一负。Factorio 轨迹还出现 agent 把 RCON 资源生成捷径保存为 skill 的情况。适合关注跨重启状态、并行任务、轨迹核算的长程工作流，但需要最小权限、独立验证和可审计回滚。原文标题：Prime Agent: A Self-Improving RLM Harness#无影寺", "excerpt": "长程Agent不该靠无限扩Context，状态管理本身就是Harness能力\n图文版：链接Prime Agent解决什么Prime Agent 是一套开源长程评测与 coding-agent workflow harness。它把持久 IPython REPL、RLM 调用、递归 subagent、会话恢复、资源核算，以及可版本化的 history、memory、skill、prompt 和 su", "url": "https://www.zhihu.com/pin/2076104372107399317", "votes": 0, "comments": 0, "feed_ts 过评估后发现实施起来有难度，此时你如何在满足领导要求", "url": "https://www.zhihu.com/question/1925295633981477597/answer/2074977830396547419", "votes": 1049, "comments": 155, "feed_ts": 1787760628, "feed_time_str": "08-27 00:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "同样吃苦，为什么山河四省省吃俭用， 云贵川渝是活在当下？", "excerpt": "山河四省不过是另一种清教徒，云贵川渝不过是另一种非清教徒。 清教徒大概是世界上最不愿意浪费生命的一群人。 他们早起，工作，读《圣经》，计算时间，检查自己的行为，警惕欲望，避免奢侈。他们相信人来到世界上，不只是为了舒服地活着，而是为了完成某种使命。你有才能，就应该使用；有时间，就不应该挥霍；有财富，也不能只是拿来享乐。一个人真正的价值，不在于他说了什么，而在于他是否控制住自己，是否认真生活，是否完成", "url": "https://www.zhihu.com/question/2073315906734781496/answer/2075541960887215720", "votes": 3506, "comments": 236, "feed_ts": 1787760302, "feed_time_str": "08-27 00:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Qwen3.8Flash发布，Qwen3.8 Flash Next开源`Qwen3.8-Flash` 是已发布的生产 API 版本；同步放出权重的 `Qwen3.8-Flash-Next` 是实验性架构预览，供社区先测 Qwen4 将采用的底层设计。官方模型卡说明，Flash 基于 Flash-Next，并增加默认 1M 上下文、官方内置工具等生产特性。Hugging Face 模型卡标注的许可证为 `qwen-community-1.0`，准备商用或分发前仍要看完整条款。如果你在做长代码库、长文档或带图片的 agent，这次值得看。但别只盯着“6B 激活”和“1M 上下文”两个数字，它们各有适用条件。Qwen3.8-Flash-Next 的主模型有 125B 参数，另配 51B N-gram Embedding；每次生成一个 token 时，实际参与计算的是 6B 参数。N-gram Embedding 可以理解为按局部词组查表的额外记忆，官方称它能放在 host memory，并与计算异步预取，从而少占 GPU 常驻空间。这解释了它为什么主打性价比，却不等于权重体量变成了普通电脑随手能跑的 6B。评论区大量人在问本地部署和量化方案，正好说明“激活量小”和“下载、显存、内存门槛低”是两件事。1M 上下文，不是原生 1M官方给出的原生上下文是 262K token，通过 YaRN 扩展后可到 1M。这个区别很重要：前者是模型原生窗口，后者是扩展配置。需要处理大仓库、超长资料或多轮工具轨迹的人可以关注，但不能把它写成“天然支持 1M”。这次架构想解决的，正是长上下文越长越贵的问题。GDN 负责把历史信息压缩进固定状态，QSA 则先在更粗的 micro-block 范围内找相关内容，再做注意力计算。可以把它理解成：前者负责高效记住，后者负责精准查找。长上下文快多少，要看测试条件Qwen3.8在线程和博客中给出的数字是：在 1M token 下，QSA attention kernel 的 Prefill 最多快 7.6 倍，Decode 最多快 4.9 倍；当 Prefix Cache 命中率为 90% 时，Qwen3.8-Flash-Next 的 Prefill 吞吐是 Qwen3.7-Plus 的 8.6 倍。重点在“90% Cache 命中率”。它更接近很多请求复用同一大段前缀的线上场景，不等于所有 1M 请求都会天然快 8.6 倍。官方还称训练开销约为 Qwen3.7-Plus 的 1/9，这也是架构预览比单个跑分更值得关注的地方。跑分Qwen3.8-Flash-Next 在 DeepSWE 1.1 得到 58.7、SWE-bench Pro 得到 62.5、CoWorkBench 得到 73.9、AndroidWorld 得到 84.5。这些结果覆盖代码、办公和移动端任务，但每项都有自己的评测框架、上下文设置和比较口径。", "excerpt": "Qwen3.8Flash发布，Qwen3.8 Flash Next开源`Qwen3.8-Flash` 是已发布的生产 API 版本；同步放出权重的 `Qwen3.8-Flash-Next` 是实验性架构预览，供社区先测 Qwen4 将采用的底层设计。官方模型卡说明，Flash 基于 Flash-Next，并增加默认 1M 上下文、官方内置工具等生产特性。Hugging Face 模型卡标注的许可证", "url": "https://www.zhihu.com/pin/2076096340182951346", "votes": 0, "comments": 0, "feed_ts": 1787759952, "feed_time_str": "08-26 23:59", "category": "pin", "cat_name": "想法动态"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么华为有这么多黑料，这些黑料都有证据实锤吗?", "excerpt": "最近刷到一件事， 华为给自己的鸿蒙车主送礼品，里面竟然放了临期大米。 最快的还有两三天过期。 临期大米也来自华为全资持股的公司。 然后有车主不满意，就把这事儿捅出来。 然后你猜发生了什么？ 发声的车主被网暴、电话骚扰、移出车主群。 当然，这点事实在是太“小”了，都不够资格算进华为黑历史里面的。 ", "url": "https://www.zhihu.com/question/1927387121456485494/answer/2076095166000190355", "votes": 12, "comments": 0, "feed_ts": 1787759660, "feed_time_str": "08-26 23:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黑兵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "deepseek 2026年收入5亿，支出已经超过110亿，如何实现10个月回本？", "excerpt": "这个题主搞断章取义玩的挺溜的，特意把最重要的信息给隐蔽了，然后在这讽刺deepseek。 2026年现在还没过完，前7个月的营收已经是25年的10倍。说明deepseek的api调用量在大幅度的增加。 然后题主特意拿出营收5亿，支出100亿这个数据来对比，deepseek的经营貌似在两组数据的对比下不可持续。 但是题主特意隐去了the information最关键的一组数据： DeepSeek A", "url": "https://www.zhihu.com/question/2076015913611150506/answer/2076095120705843590", "votes": 79, "comments": 16, "feed_ts": 1787759649, "feed_time_str": "08-26 23:54", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "怎么看 GLM-5.3-Flash 发布，有什么值得关注的？", "excerpt": "我在之前猜测牛来OX-Alpha模型的回答里面，用模型的指纹识别来验证它到底是哪个模型，结果的确是准的，它确实跟 GLM 是同一个谱系下面的模型。 如何看待OpenCode声称将在下周推出匿名模型Ox Alpha？它会是MiMo V3吗？更准确地说，不是 Tokenizer 单独“证明”了它就是 GLM，而是 Tokenizer、特殊字符、Emoji 等一系列底层行为构成了一组很难靠后训练洗掉的模", "url": "https://www.zhihu.com/question/2076068666639230491/answer/2076093019862971703", "votes": 10, "comments": 0, "feed_ts": 1787759148, "feed_time_str": "08-26 23:45", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价《黑神话：悟空》里，孙悟空疑似和白骨精谈恋爱的剧情?", "excerpt": "我原本也认为这个设定很扯淡... 但事后一想，不对啊...孙悟空先和白骨精谈恋爱，后来转世为天命猴，又和盘丝洞女妖谈恋爱... 这设定怎么有点至尊宝和白晶晶、盘丝大仙紫霞的故事有点像呢？ 虽然盘丝大仙紫霞是佛祖灯芯，不是四妹那种蜘蛛精，但毕竟是蜘蛛精的师傅，是盘丝洞的主人... 紫霞和青霞是一体双魂，而四妹的衣服是青紫搭配... 紫霞，出走、拒婚，想觅得如意郎君。而四妹，也拒婚、想出走，看上了天命", "url": "https://www.zhihu.com/question/664798749/answer/2076091400349815271", "votes": 7, "comments": 2, "feed_ts": 1787758762, "feed_time_str": "08-26 23:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "GLM-5.3-Flash(Ox Alpha)开源此前在 OpenRouter 和 OpenCode 被匿名测试的 Ox Alpha，今天终于露出身份：它是 Z.ai 的 GLM-5.3-Flash。对要让 agent 同时看代码库、文档和截图的人，这次值得关注的不是又多了一个“Flash”名字，而是 1M token 上下文、原生视觉能力和公开权重被放在了一起。Z.ai 官网确认，发布前它以 Ox Alpha 的名字匿名上线，用真实用户反馈做测试。正式版是 GLM-5 系列首个原生多模态模型，总参数 320B、每次推理激活 18B，权重按 MIT License 公开。API、Coding Plan、ZCode、chat.z.ai 和 AutoClaw 已同步给出入口。价格和上下文是同一件事长上下文真正难的不是“能不能塞进去”，而是每轮调用的注意力计算和 KV cache 会把成本抬高。官方标准 API 价格是每 100 万 token 输入 0.15 美元、输出 0.50 美元、缓存输入 0.03 美元。对需要反复读长文档、跑代码 agent 的人，这比只看单轮能力分数更直接。把线性注意力和稀疏注意力混在一起：前者负责以状态形式保留局部依赖，后者通过轻量索引器找回相关的全局信息。官网按每头每层计算与平均 BF16 KV cache 的口径，对比 GLM-5.3 写为 attention compute 约为原来的 1/3、KV cache 约为原来的 1/4.4。它也明确承认：KV cache 仍略大于 Kimi-K3 和 DeepSeek-V4-Flash。在多项代码和 agent 基准上超过 GLM-5.2，并在自建 Z.ai Code Bench 的最高 effort 设置下拿到 29.0，接近 Claude Opus 4.8 的 29.5。这个结果能说明它的发布目标是用更低成本逼近更强模型的代码表现，但还不能直接推出“所有代码任务都追平 Opus”。", "excerpt": "GLM-5.3-Flash(Ox Alpha)开源此前在 OpenRouter 和 OpenCode 被匿名测试的 Ox Alpha，今天终于露出身份：它是 Z.ai 的 GLM-5.3-Flash。对要让 agent 同时看代码库、文档和截图的人，这次值得关注的不是又多了一个“Flash”名字，而是 1M token 上下文、原生视觉能力和公开权重被放在了一起。Z.ai 官网确认，发布前它以 O", "url": "https://www.zhihu.com/pin/2076091257403852478", "votes": 0, "comments": 0, "feed_ts": 1787758738, "feed_time_str": "08-26 23:38", "category": "pin", "cat_name": "想法动态"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "明明很有能力的人，为什么不愿意当领导？", "excerpt": "以前：财政局长、常务副市长，是个人就能干，是个人就抢着干。 现在：财政局长、常务副市长，不是特别有能力、有资源的人，根本干不来。 以前：是个人就想当领导。 现在：不是每个人都想当领导了。 以前：要是安排你去红会、文联、史志办、档案馆等地方，就是被发配、被边缘化。 现在：不少人希望去红会、文联、史志办、档案馆这种地方。 ", "url": "https://www.zhihu.com/question/647144238/answer/2075609813942285235", "votes": 1202, "comments": 127, "feed_ts": 1787757835, "feed_time_str": "08-26 23:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "同样是纸币，朱元璋发行的宝钞为什么快速贬值了，而南宋的交子却能长期维持比较稳定的币值?", "excerpt": "明朝对金融管理能力是渣中之渣。宝钞贬值快核心原因是他只管发不管兑，那你这不就是废纸吗？擦屁股都嫌硬。重八还非逼着人用，如果用铜钱，银子是要杀头的，这么大罪过老百姓竟然还顶风作案。最后倒逼政府取消了政策，你就想想把老百姓逼到什么地步了吧。 ", "url": "https://www.zhihu.com/question/1990063473682560612/answer/2076078950946705495", "votes": 3, "comments": 0, "feed_ts": 1787755794, "feed_time_str": "08-26 22:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TopView", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "唉，亏麻了", "excerpt": "今晚英伟达发财报，全网都在猜营收过没过920亿，毛利率还守不守得住75%。 其实说实话，真的不重要了。 你们觉得就算是你这次超预期，以后还是连续超预期吗？很难。 真正让华尔街睡不着觉的，压根不是英伟达，是30年的美债。现在的市场焦点还是这个。 这货昨晚摸到了5.33%，2007年以来最高。同一个晚上，美元指数跌破100，砸到98.8，三个月新低。 你们觉不觉得这事拧巴。利息创了新高，钱该更值钱、美", "url": "https://zhuanlan.zhihu.com/p/2076071887982031411", "votes": 224, "comments": 14, "feed_ts": 1787754749, "feed_time_str": "08-26 22:32", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你干过最牛的一件事是什么？", "excerpt": "零三年，原来父母呆过的三线厂改制后倒闭，破产清算过程中发现原厂长贪污舞弊，国有资产流失，该给职工的福利和补偿款也被贪污。职工上告政府部门，结果在市一级被压制下来了。于是职工把厂子围了起来，不让破产清算组进厂，还和前来维持秩序的帽子叔叔发生了冲突。 由于担心厂长一伙把各种数据资料销毁，几个叔叔阿姨找到了我，希望我能帮他们把厂里厂子办公司电脑里面的数据拿出来。我当时已经随父母离开厂子十多年了，早就在…", "url": "https://www.zhihu.com/question/19861477/answer/2075359425347567888", "votes": 2588, "comments": 191, "feed_ts": 1787753902, "feed_time_str": "08-26 22:18", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "环中星鉴", "verb": "MEMBER_CRE l": "https://www.zhihu.com/pin/2076057160237192186", "votes": 0, "comments": 0, "feed_ts": 1787750625, "feed_time_str": "08-26 21:23", "category": "pin", "cat_name": "想法动态"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待B站讽刺日本的AI歌曲《一切正常｜異常なし》MV仅2天斩获400万播放?", "excerpt": "整挺好。 技术大佬都已经能用Ai制作完整的MV了，自己却连Ai基础入门都不知道从哪开始学。感觉自己有点要被时代抛弃的倾向。有点惆怅。 不过题干这部作品质量是真高啊。 ", "url": "https://www.zhihu.com/question/2072762827404736360/answer/2076046720790684954", "votes": 2, "comments": 0, "feed_ts": 1787750122, "feed_time_str": "08-26 21:15", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "时予", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "不懂就问，白人饭真的那么难吃吗？很多年前，我跟一帮国内顶尖厨师去法国交流。人均500欧的米其林。你猜怎么着？一桌餐饮界的大佬，吃出了痛苦的表情包。一份据说集各种风格为一体的奶酪拼盘，据我观察，没有一位能完整的把所有奶酪都尝上一遍。虽然那次活动，我们美其名曰说是出来交流学习的。回到酒店，一行人聚在大堂吧，跟煮咖啡的小哥要开水泡方便面……接下去的日子就更苦了，一道海鲜，白白净净地躺在那里，煮得毫无滋味，挤了半个柠檬才算有了点味道。一份甜品，甜到我以为在直接吃糖，连嗜甜的同事都只吃了一口就放下了，逼得大厨们不得不掏出了自己从国内带来的辣椒酱。没想到，法国老板尝了一下我们带来的辣椒酱，眼睛就亮了，比划着问这是什么酱。我们说是辣椒酱。他追着我们满店跑，非要买配方。我们说很多原料法国没有，做不了。他不信，拉着翻译来回问了三遍。法国之行的尾声，大家都反馈白人饭实在吃不下了，咱能不能找个地方吃个中餐？领队苦于当时所处的位置是一个偏僻小镇，根本没有什么正经的中餐厅，大厨们说，没事，只要是中餐就行！我们可以自己进去炒！故事的最后，领队找了一家中餐厅，自助餐。一群平时在后厨指挥别人的大厨，挤进小镇中餐厅的后厨，系上围裙开始颠勺。老板看傻了，食客也看傻了。那顿自助餐，平均每人怒吃10盘，有人端着盘子站着就往嘴里扒饭。15天了，终于吃上了一口正经的中国饭。有人说：走遍世界，还是中国胃最诚实。果然，中国胃还是中国味才能抚慰。你们出国有没有被白人饭折磨到崩溃的时刻？评论区说说，让我知道不是我一个人。#白人饭 #饮食文化 ", "excerpt": "不懂就问，白人饭真的那么难吃吗？很多年前，我跟一帮国内顶尖厨师去法国交流。人均500欧的米其林。你猜怎么着？一桌餐饮界的大佬，吃出了痛苦的表情包。一份据说集各种风格为一体的奶酪拼盘，据我观察，没有一位能完整的把所有奶酪都尝上一遍。虽然那次活动，我们美其名曰说是出来交流学习的。回到酒店，一行人聚在大堂吧，跟煮咖啡的小哥要开水泡方便面……接下去的日子就更苦了，一道海鲜，白白净净地躺在那里，煮得毫无滋味", "url": "https://www.zhihu.com/pin/2074041776877330676", "votes": 0, "comments": 331, "feed_ts": 1787749905, "feed_time_str": "08-26 21:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "残留物分析揭示豫西地区仰韶-龙山烹饪传统的延续与器用功能的转变#考古 仰韶时代向龙山时代的转变，是中国新石器时代的重大时代变革之一，以往学界普遍聚焦于陶器、聚落、建筑等物质文化方面的变化，而关于饮食传统、烹饪模式、器物功能以及社会结构等方面则讨论较少。最近，研究者聚焦河南三门峡庙底沟遗址，挑选了涵盖仰韶中期（庙底沟期）、仰韶晚期（西王村期）、龙山早期（庙底沟二期）三个阶段的多件陶器和石器进行淀粉粒和残留物分析，讨论了豫西地区公元前3400年—公元前2500年的生业模式、烹饪方式、器物功能与社会变迁。研究结果表明，从仰韶中期到庙底沟二期，植食种类并未发生明显变化，而且鼎、釜、罐始终都是作为烹煮淀粉类食物的核心炊具，表明先民的主食消费和烹饪方式呈现出明显的“烹饪连续性”。尽管处于仰韶—龙山这一时代剧变的核心区域，但豫西地区的烹饪方式和食物（以粟、黍为主的农作物及野生植物资源）却并未随之改变，保持了高度的稳定性，反映了该地区先民的饮食基础与烹饪习惯具有韧性。与以鼎、釜、罐所呈现的相对稳定的烹饪传统相比，尖底瓶（被认为是与集体性宴饮活动相关的酒器）的器型和功能则发生了明显转变。仰韶中、晚期的多件尖底瓶中发现了发酵受损淀粉与草酸、酒石酸发酵特征有机酸，表明其可能具有酿酒功能，而龙山早期的尖（平）底瓶中则不再发现有酒的相关残留物，这一变迁过程也基本与尖底瓶由尖底向平底的器型转变同步，意味着酿酒功能可能逐步丧失。基于陶器功能变迁的认识，再结合房屋建筑形态的变化，大致可以还原出庙底沟遗址从仰韶中期到龙山早期的社会变迁过程：仰韶文化阶段聚落内修建多座面积超50平方米的大型房屋作为社群集会的公共活动场所，并配套大量用于集体宴饮的尖底瓶，体现以集体公共活动为核心的社会景观；进入龙山早期，大型公共建筑完全消失，工艺考究的小型独立房址成为主流，社会资源转向家庭层面，与尖底瓶相关的集体宴饮活动也随之衰落，呈现出以家庭活动为核心的社会景观。庙底沟遗址所呈现的上述社会变迁现象，反映了豫西地区从仰韶时代的集体社群模式向龙山时代家庭主导社会的转型过程，为理解中国新石器时代晚期“生业传统连续性”与“社会形态演变”的关系提供了新的证据和视角。详见：Yang, F., Duan, Q., Fan, W., Wang, T. (2026). Cooking continuities and shifting vessels: Residue evidence across the Yangshao - Longshan transition at Miaodigou. Journal of Archaeological Science, , 190.106576. 链接为什么远古的陶器好多都是尖底呢？ 河姆渡陶器里的锅巴残留物并不只是米饭 3000年前的面粉食品", "excerpt": "残留物分析揭示豫西地区仰韶-龙山烹饪传统的延续与器用功能的转变#考古 仰韶时代向龙山时代的转变，是中国新石器时代的重大时代变革之一，以往学界普遍聚焦于陶器、聚落、建筑等物质文化方面的变化，而关于饮食传统、烹饪模式、器物功能以及社会结构等方面则讨论较少。最近，研究者聚焦河南三门峡庙底沟遗址，挑选了涵盖仰韶中期（庙底沟期）、仰韶晚期（西王村期）、龙山早期（庙底沟二期）三个阶段的多件陶器和石器进行淀粉粒", "url": "https://www.zhihu.com/pin/2075159712199356736", "votes": 0, "comments": 0, "feed_ts": 1787748447, "feed_time_str": "08-26 20:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "BBC纪录片提出兵马俑受古希腊雕塑技术启发，如何看待这一假说与纪录片叙事？", "excerpt": "我也倾向于认为这是瞎扯，因为兵马俑的雕塑技术水平对于希腊化雕塑来说实在是有点….粗犷，同时期的希腊化雕塑不止是面部身体写实这一点，动作的灵巧轻盈、面部表情的传神才是最大特征，兵马俑甚至连面部写实都不怎么做得到，身体更是变成圆墩墩，比例也完全失衡，比起希腊化雕塑，更像两河-巴比伦-波斯雕塑，最大的特征就是攒尖拱形连鼻眉和特别深的眼裂，以及比较其次的服饰细节的浅浮雕式处理 可以看到秦俑在我说的这三点上", "url": "https://www.zhihu.com/question/2073579059682993027/answer/2075950892059250879", "votes": 128, "comments": 9, "feed_ts": 1787748405, "feed_time_str": "08-26 20:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VO n/2076032103708467477", "votes": 0, "comments": 0, "feed_ts": 1787744627, "feed_time_str": "08-26 19:43", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "同样是纸币，朱元璋发行的宝钞为什么快速贬值了，而南宋的交子却能长期维持比较稳定的币值?", "excerpt": "大明宝钞被大规模涌现的外贸白银冲击。南宋交子？南宋不叫交子。 交子是很早的名称，最早指的是出现在成都的「私交」，主要由私人金融机构发行的存款凭证。 最开始就是成都的商人在水稻丰收，下乡收蚕茧的时候，因为携带大量的货币不方便，也不安全，而且当时因为四川缺铜，货币还是铁钱，不是携带的问题，而是需要运输。就把足钱存进「交子铺户」。「交子铺户」出具的凭证，就是交子。这存款没有利息，自己要倒给保管费，每贯钱", "url": "https://www.zhihu.com/question/1990063473682560612/answer/2076031740234225345", "votes": 7, "comments": 1, "feed_ts": 1787744538, "feed_time_str": "08-26 19:42", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "人形机器人领域这一年迎来了哪些技术突破？在哪些场景能真正「实战」了？", "excerpt": "我反而觉得今天 GEN-1.5 具身模型的发布是一个重大突破，这个方面几乎没什么人在走，然后 Generalist AI 坚持把物理世界的真实数据规模化到 &#34;GPT 3&#34; 的程度： 这个模型发布后， OpenAI 、DeepMind 和 Anthropic 的研究员都挺转发和关注，说是具身模型 的 GPT 3 ： 这个模型目前最核心的图片就是， 只需 3 到 12 秒的单次演示就可", "url": "https://www.zhihu.com/question/2073802908219479886/answer/2073823331397145228", "votes": 214, "comments": 37, "feed_ts": 1787743968, "feed_time_str": "08-26 19:32", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "CNN 称美国能以卖血浆「卡中国脖子」，为何美网友感「尴尬」？", "excerpt": "这里我要澄清一下，所谓的“美国穷人卖血以维持生计”是个彻头彻脑的谎言 美国中产阶级也卖 ", "url": "https://www.zhihu.com/question/2075354823201968148/answer/2075666016055705967", "votes": 897, "comments": 109, "feed_ts": 1787743906, "feed_time_str": "08-26 19:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "德芙就「趁男朋友不在跟暧昧对象分享」文案道歉，称由第三方运营团队创作发布，德芙在管理上存在哪些问题？", "excerpt": "有时候觉得很无奈，网友们日常对线都知道要换小号，一堆大厂就不知道不要用自己的官号发任何有倾向性的内容么。 只要发了，就是给自己找麻烦。 基本没有什么改进的空间，因为这不是一个操作问题也不是一个管理问题，这是一个只要做了就必然会爆雷的问题。 跳楼坠落一半了问怎么解决问题，没法解决，只有善后。 就只要企业账号还在试图发内容，迟早就是出事儿，无非是什么事儿。 大厂新媒体账号的唯一出路，就是发券， : "https://www.zhihu.com/question/2072120421625997055/answer/2075707262287533531", "votes": 436, "comments": 57, "feed_ts": 1787723106, "feed_time_str": "08-26 13:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "大家怎么看俄罗斯高官建议东大把黄金存在俄罗斯？", "excerpt": "这是俄罗斯国家杜马议员基里亚诺夫提出的，理由是因为西方国家曾经冻结过俄罗斯海外外汇储备，金砖国家的黄金储备暴露在欧美托管地容易有被冻结风险，所以建议在莫斯科设立一个金砖国家统一国际黄金储备中心，在纽约联邦储备银行金库、伦敦的英格兰银行金库和瑞士巴塞尔的国际清算银行金库之外，再搞一个莫斯科黄金储备金库。 问题是，你俄罗斯的信誉还不如美国、英国、瑞士呢。 要搞也是在上海或者香港搞啊。 不过上海和香港好", "url": "https://www.zhihu.com/question/2074558021380859594/answer/2075927815569019668", "votes": 78, "comments": 6, "feed_ts": 1787722934, "feed_time_str": "08-26 13:42", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "实际很早之前，我写关于家庭伦理与中国的想象共同体治理这一块内容的时候，就有人问过婚姻低谷的问题、男女对立的问题。说起来，已经很久没聊家庭、伦理、治理、共同体这一类的概念了，上一次聊应该还是6月份以前。这段时间有私信，也有评论区问我关于婚姻、女权平权、男女矛盾之类的看法。我一方面是不想踏入激烈争斗的最前线，另一方面，还是更习惯从自己的角度来聊这件事。聊政治就是聊共同体，聊国家也是聊共同体。什么共同体？想象共同体，大家认为自己是一路的，大家觉得自己人。那家庭呢？家庭是最小的共同体，它也是共同体。所以今天聊婚姻低谷，本质上是聊这个最小的共同体在当下的环境里出了什么问题。我把影响婚姻的四个核心变量整理了一下：协作增益、风险共担、安全对冲、资本门槛。当然还有一个短期因素——高增长时代遗留的债务问题。把它们放到一块儿来理解，为什么现在结婚率老是拉不起来，它究竟是没救了，还是有救。既然聊共同体，那它的构成逻辑、驱动、它经济上的趋势，这些都要聊。那家庭为什么现在处于低位震荡？结婚为什么处于低位震荡？很简单，收益变低，风险变大，约束力变弱。你换成做生意一样的，就和现在企业存活率低、失败率高、容易损失一样，很多人捏着钱，既不愿意投入经营，也不愿意投入消费，都处于一个风险不确定的退让或者说避险时期。家庭本质是一样的，没有那么奇怪。至于说家庭的关系会不会被所谓先进生产方式替换，只要家庭在当下看来，剥离掉资本赋予的那堆玩意儿之后，依旧算是一个共同目标比较明确、共同利益比较大、组织成本架构比较低的组织，并且在社会动荡甚至治安回潮的时候，依旧能提供最简易的组织关系逻辑、组织方式，血缘家庭依旧是一套组织关系，那么它就还没到退潮的时候。", "excerpt": "实际很早之前，我写关于家庭伦理与中国的想象共同体治理这一块内容的时候，就有人问过婚姻低谷的问题、男女对立的问题。说起来，已经很久没聊家庭、伦理、治理、共同体这一类的概念了，上一次聊应该还是6月份以前。这段时间有私信，也有评论区问我关于婚姻、女权平权、男女矛盾之类的看法。我一方面是不想踏入激烈争斗的最前线，另一方面，还是更习惯从自己的角度来聊这件事。聊政治就是聊共同体，聊国家也是聊共同体。什么共同体", "url": "https://www.zhihu.com/pin/2075940833644254416", "votes": 0, "comments": 0, "feed_ts": 1787722863, "feed_time_str": "08-26 13:41", "category": "pin", "cat_name": "想法动态"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "ver 能暴涨4倍？", "excerpt": "M6从原本的4+0+6改成2+4+6，说实话不是很满意。我虽然到处鼓吹同构同簇中核，但是苹果一来大概率大中核分簇，二来大核砍成得只剩俩了。两层buff一叠，跑4线程性能不一定比得上M5，毕竟真实负载不是cinebench这种渲染任务，所有核心都能可劲跑满还无视核间通信。个人觉得这个定位给4+4+4会好很多，可惜给不得。联发科多年前差点把自己磕死的三从集，终于在十年之后遍地开花，并且在行业龙头手里发", "url": "https://www.zhihu.com/question/2075714717176303763/answer/2075888260920956311", "votes": 6, "comments": 0, "feed_ts": 1787710330, "feed_time_str": "08-26 10:12", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "手刀", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "明朝为什么不扶持宗亲进朝堂，以制衡文官势力？", "excerpt": "任用宗亲会有极大的合法性焦虑。也就是：都是皇室，取而代之的难度比较小。 另外，现代人讨论古代政治，从现实权利博弈看是没错，但往往忽视了自周朝始，大家族里面人们最在意的事情 --- 宗庙祭祀。 武则天可以为了身后宗庙香火彻底放弃武家代李。嘉靖也可以因为谁是我爹的问题和满朝文武抗争数年。佞臣权相再怎么过分，也就是在子嗣中挑一个当傀儡。宗亲夺权，宗庙秩序上面就很有可能会有大的变化。 大宗小宗的生死博弈，", "url": "https://www.zhihu.com/question/15482079222/answer/2075887861916759669", "votes": 0, "comments": 0, "feed_ts": 1787710235, "feed_time_str": "08-26 10:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么从隋文帝直到开元盛世最后几年，长安城还在因严重饥荒以至于天子讨饭，却还要宣传“盛世长安”?", "excerpt": "· 东汉建武五年（29年）：发生旱灾和蝗灾。 · 东汉永初三年（109年）：“京师大饥，民相食”。 · 东汉永寿元年（155年）：司隶、冀州饥荒，人相食。 · 东汉延熹九年（166年）：司隶、豫州饥荒，“死者什四五，至有灭户者”。 · 汉献帝兴平元年至建安二年（194-197年）：洛阳残破，“居民仅有数百家，无可为食”。 · 西晋永嘉五年（311年）：“洛中大饥”，著名学者挚虞饿死。 · 西晋建兴", "url": "https://www.zhihu.com/question/2025511016755119414/answer/2075885129097131370", "votes": 6, "comments": 2, "feed_ts": 1787709988, "feed_time_str": "08-26 10:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "Anthropic 的 ARR 不及预期，OpenAI 比 A 社还差，AI 热潮要阶段性见顶了吗？", "excerpt": "AI 取代一个行业以后会使得对应的从业人员迅速贬值，最后带崩自己在这个领域的估值。 年初程序员这个盘子的大小本身肯定是足以支持年初算出的 ARR 的，但是问题就是现在的程序员盘子直接碎了。 到年底，你把所有 AI Coding 产品收入全算一起也算不出年初 Anthropic 那个爆炸的 ARR 了。 说实话 AI Coding 已经是 AI 最好的商业化赛道了，如果这个赛道都不能成功，那其他领域", "url": "https://www.zhihu.com/question/2073353873687671056/answer/2075886175403892923", "votes": 1241, "comments": 152, "feed_ts": 1787709833, "feed_time_str": "08-26 10:03", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "Darline Graham过了共和党初选如何看待林赛·格雷厄姆的妹妹接任参议员？ #美国政治  #美国大选 ", "excerpt": "Darline Graham过了共和党初选如何看待林赛·格雷厄姆的妹妹接任参议员？ #美国政治  #美国大选 ", "url": "https://www.zhihu.com/pin/2075875315314960029", "votes": 0, "comments": 0, "feed_ts": 1787709509, "feed_time_str": "08-26 09:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI芯片Jalapeño官方实测：更快也更省电OpenAI 公布了首款定制推理芯片 Jalapeño 的首轮测试，并说计划在今年年底前先部署进自己的计算基础设施。OpenAI 想把更快响应、更高吞吐和更低功耗同时放进正在运行 ChatGPT、Codex 和 agent 的推理系统里。Jalapeño测的是什么OpenAI采用 SemiAnalysis 的公开 InferenceX 基准，在匹配用户体验的条件下比较吞吐、端到端延迟和单位功耗能完成多少 AI 工作。测试覆盖 GPT-OSS 120B、DeepSeek R1 670B、Kimi K2.5 1T 三个公开模型。OpenAI给出的汇总结果是：峰值吞吐时，每瓦可完成的 AI 工作高 1.5 到 1.9 倍；端到端延迟低 1.7 到 3.6 倍。对需要一轮接一轮调用模型的 agent，延迟会在整个任务里累积，所以它不只是“回答快一点”。为什么吞吐和延迟能一起改善语言模型推理至少有两段不同的瓶颈：读入 prompt 的 prefill 更吃计算，逐 token 输出的 decode 更吃 memory bandwidth。很多系统在一段跑得快，另一段就被数据搬运、跨芯片通信拖住。Jalapeño 的设计目标是让 chip、memory、network、software 和整机系统一起配合，把 KV cache 等状态尽量放在本地，少在不同资源间来回搬。官方把这种能力描述为：同一架构里同时兼顾吞吐、延迟和能效。普通用户什么时候能感受到OpenAI 把它指向了更快的 ChatGPT 响应、更灵敏的 Codex 会话和 agent，以及需求增长时更可靠的访问。官方当前只公布内部部署计划，并未提供购买 Jalapeño 或用户手动切换 Jalapeño 的入口。时间表：2026 年底前开始在 OpenAI 自己的算力基础设施部署；Gen 2 已在开发，Gen 3 正在成形。也就是说，用户若能感受到变化，形式更可能是服务端推理的速度、容量和成本改善，而不是收到一张可装机的独立显卡。这些数字含义这是 OpenAI 发布的测试结果，不是所有模型、所有 batch、所有硬件形态下的通用结论。官方页面也说明，比较采用匹配用户体验的工作点，并会按加速器公开额定功耗归一化；Jalapeño 标称 700W，但测试时持续功耗不高于 550W。因此更稳妥的理解是：在官方列出的三种公开模型和 InferenceX 测试范围里，Jalapeño 展现了“更快且更省电”的组合。它是否会把这类优势稳定传递到每一次 ChatGPT、Codex 请求，还要看年底后的实际部署规模和服务表现。这不是一个立刻能买的硬件新品，而是 OpenAI 在给自己推理服务换底座。它真正值得盯的，是年底部署后 ChatGPT、Codex 和 agent 的响应速度、稳定性与可用量有没有一起发生变化。", "excerpt": "OpenAI芯片Jalapeño官方实测：更快也更省电OpenAI 公布了首款定制推理芯片 Jalapeño 的首轮测试，并说计划在今年年底前先部署进自己的计算基础设施。OpenAI 想把更快响应、更高吞吐和更低功耗同时放进正在运行 ChatGPT、Codex 和 agent 的推理系统里。Jalapeño测的是什么OpenAI采用 SemiAnalysis 的公开 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

wer/2063613133554443561", "votes": 243, "comments": 45, "feed_ts": 1784783711, "feed_time_str": "07-23 13:15", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Cursor Router：数百万请求测试成本降 60%Cursor 给团队和企业上线了 Cursor Router。它把模型选择放到每一次编程请求前：哪些请求值得用前沿模型，哪些请求可以交给更省钱的模型。Router 放在 Auto 模式里工作。用户先选偏好：Intelligence 偏向能力，Balance 在能力与成本之间权衡，Cost 优先控制支出。之后，它会逐条分析请求，在任务需要时路由到前沿模型，其他请求路由到价格更友好的模型。60% 该怎么理解Cursor 的数据来自覆盖数百万请求的在线 A/B 测试：在这套测试里，Router 的成本低 60%，同时维持“前沿质量”的表现。这是官方测试结果，不是每个团队账单都会固定降 60%。抢先体验阶段还有另一组口径：数十家企业客户的成本约降 30% 到 50%，同时获得前沿性能。另一条官方帖则写到，客户观察到与所有请求都路由到 Opus 4.8 相比，每次提交成本更低，质量没有明显下降。这次功能真正改变了什么以前，很多开发者会把一个模型当作日常默认选项，简单请求和复杂请求都按同一档价格处理。Router 把“选模型”变成每次请求前的一步决策，目标是在质量要求高时保留能力，在不需要时减少支出。对谁有用当前发布对象是团队和企业。选择哪种偏好取决于任务：需要尽量追求能力时选 Intelligence；需要平衡质量与费用时选 Balance；预算约束更强时选 Cost。是否适合自己的代码库，还要看实际任务构成和团队对质量的要求。", "excerpt": "Cursor Router：数百万请求测试成本降 60%Cursor 给团队和企业上线了 Cursor Router。它把模型选择放到每一次编程请求前：哪些请求值得用前沿模型，哪些请求可以交给更省钱的模型。Router 放在 Auto 模式里工作。用户先选偏好：Intelligence 偏向能力，Balance 在能力与成本之间权衡，Cost 优先控制支出。之后，它会逐条分析请求，在任务需要时路由", "url": "https://www.zhihu.com/pin/2063608488102720318", "votes": 0, "comments": 0, "feed_ts": 1784782765, "feed_time_str": "07-23 12:59", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "最近DeepSeek梁文锋的投资语录刷屏了，朋友圈、公众号、抖音，到处都是。很多人看完说醍醐灌顶，说学到了。但我跟大家说句实在话：你看到的是金句，我看到的是两个字——融资。我简单盘一下时间线：-6月16日：DeepSeek完成首轮510亿融资，估值约520亿美元-7月14-16日：外媒传出IPO消息，计划年底递交科创板申请，同时第二轮融资估值涨到710亿美元（一个月涨37%）-7月中下旬：&#34;梁文锋四小时投资人会议实录&#34;&#34;两万字投资语录&#34;开始全网刷屏，朋友圈、公众号、抖音全在转IPO+第二轮融资的关键节点，刚好撞上&#34;投资语录&#34;全网爆火，你觉得这是偶然？就围观群众看着乐就算了，但股民就别这样了。别一刷到几篇爆款文章、几句金句就情绪上头，觉得挖到了宝藏。我跟大家讲一个底层逻辑：任何时期，那些能让你看完就热血沸腾、忍不住转发的内容，背后几乎全都是有目的的。为什么偏偏是现在？道理特别简单：公司马上要上市融资了。融资之前第一件事干什么？造势。想要融资顺利、卖个好价钱，就得提前在全网铺舆论、炒热度。而投资语录这种东西，是成本最低、传播最快的造势方式：金句多、道理对、看完让人觉得醍醐灌顶，散户愿意转，自媒体愿意抄，不知不觉就把热度炒起来了。热度起来了有什么用？用处太大了。机构买方一看市场情绪这么高，自然愿意给出更高的估值溢价。散户一看全网都在吹，打新的时候就会疯抢，IPO定价就能往上抬。这不是什么新鲜事，每一家明星公司上市前，全都是这套剧本。先铺内容、造神、炒热度，等市场情绪拉满了，顺理成章高价发行。而到最后你会发现，所有吹上天的故事，所有看起来无比正确的金句，其实都是有目的。………当然，我这里也提前打个补丁吧。我对梁文峰老师是尊重的，对DeepSeek是认可的，也认为这类企业募资是应当的且必要的。但一码归一码。公司是好公司，技术是硬技术，不代表&#34;融资关键节点全网造势、最终高估值上市让散户买单&#34;这个逻辑就不存在了。你可以敬佩它的技术，认可它的价值，但作为股民，你要清醒地知道：所有热度最终都会算进估值里，所有故事最终都会变成股价，而所有高价，最后总得有人接盘。围观群众看着乐、学东西没问题，但拿着真金白银进场的人，还是要谨慎。再好的公司，买贵了，一样亏钱。沉迷宏大叙事往往是股民亏损的最大来源。", "excerpt": "最近DeepSeek梁文锋的投资语录刷屏了，朋友圈、公众号、抖音，到处都是。很多人看完说醍醐灌顶，说学到了。但我跟大家说句实在话：你看到的是金句，我看到的是两个字——融资。我简单盘一下时间线：-6月16日：DeepSeek完成首轮510亿融资，估值约520亿美元-7月14-16日：外媒传出IPO消息，计划年底递交科创板申请，同时第二轮融资估值涨到710亿美元（一个月涨37%）-7月中下旬：&#34", "url": "https://www.zhihu.com/pin/2063608830597116232", "votes": 0, "comments": 9, "feed_ts": 1784782690, "feed_time_str": "07-23 12:58", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "朱元璋放到现在会有女生喜欢吗？", "excerpt": "老朱和高欢没得比。 高欢有女粉，并不是因为他长得帅，也不是因为谁代入娄昭君，更不是因为他的功业多么可观，而是因为他有问“日食是因为我吗？”那个时刻。 曹丕有女粉，不是因为他和甄姬郭女王怎么怎么纠葛，而是因为：“盖文章经国之大业，不朽之盛事。年寿有时而尽，荣乐止乎其身。二者必至之常期，未若文章之无穷。” 哪怕是崇祯，他被喜欢的原因也是那句“无伤我百姓一人”你也别管这事有多大槽点，你也别管城外其实都是", "url": "https://www.zhihu.com/question/644267381/answer/2017696719010276395", "votes": 3690, "comments": 415, "feed_ts": 1784782372, "feed_time_str": "07-23 12:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "当年纳粹屠杀犹太人的时候怎么分辨是不是犹太人？", "excerpt": "很简单，当年德国人打下华沙，华沙的波兰居民听说德国人搜捕犹太人，便踊跃举报身边的犹太人，结果导致德国人开始的时候猝不及防，没准备那么多关押点。 我觉得主要是华沙居民太邪恶，故意出卖犹太人吧？绝不是犹太人平日放高利贷，诈骗，让人人恨不得食其肉枕其皮。 ", "url": "https://www.zhihu.com/question/393137148/answer/2063606507317547398", "votes": 11, "comments": 0, "feed_ts": 1784782132, "feed_time_str": "07-23 12:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿,床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "更无语的是西帅被解职被英文区宣传成“公民社会（民主）对苏系遗毒的胜利了”[捂脸]有人被宣传成丑角（继承了苏轼遗毒的西帅）就得有人被宣传成英雄。比如华邮就有人大吹什么“泽连斯基倾听抗议者诉求”“与俄罗斯的腐败无能形成鲜明对比”，把我给看笑了。以下是华邮精彩片段摘录：“在世界近200个国家的领导人中，没有谁比弗拉基米尔·泽连斯基更令我钦佩。自温斯顿·丘吉尔时代以来，他展现出的勇气鲜有人能及 和南斯拉夫解体了，压制少数民族的印度却延续至今?", "excerpt": "团结人最严厉的父亲：马来西亚⌓‿⌓", "url": "https://www.zhihu.com/question/654946443/answer/2013309193550046873", "votes": 191, "comments": 2, "feed_ts": 1784780569, "feed_time_str": "07-23 12:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么优待少数民族的苏联和南斯拉夫解体了，压制少数民族的印度却延续至今?", "excerpt": "压制少民、优待主体民族的典范是马来西亚，马来西亚从教育、政治、生育、就业等多方面优待马来人。 华人学校无法获得政府补贴，马来人学校却可以，马来西亚大学优先录用马来人，导致很多华人想上好一点的大学只能去海外。 公务员优先录用马来人，很多肥差马来人比例无限接近100%，华人公司需要安排一定的马来人比例，反之马来人公司可以只录用马来人。 马来人生育享受政府补贴，同在一个国家，马来人的生育率是华人的3倍。", "url": "https://www.zhihu.com/question/654946443/answer/1990345422854714168", "votes": 5371, "comments": 388, "feed_ts": 1784780534, "feed_time_str": "07-23 12:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何才能看得懂变分贝叶斯方法（Variational Bayesian）？", "excerpt": "先从你最熟悉的阶段说起，也就是最大似然估计和最大后验估计。 你在做任何机器学习项目的时候，无论是跑线性回归还是训练一个千亿参数的神经网络，你本质上都是在找一组参数，让你的模型能够最好地解释你手头现有的数据。 最大似然估计的思路简单粗暴，它的核心哲学就是看哪组参数能让当前观测到的数据出现的概率最大，那就选哪组参数。这个思路在数据量特别大且数据干净的时候是没有问题的。但是在实际的商业业务中，数据往往充", "url": "https://www.zhihu.com/question/20993648/answer/2063592027422455226", "votes": 16, "comments": 1, "feed_ts": 1784778679, "feed_time_str": "07-23 11:51", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么有人不尊重温室里培育出的善良？", "excerpt": "曾经有一位身为旧西藏农奴主后裔的女作家，在接受西方记者采访的时候，拿出自己的一本作品进行宣传，回忆自己幼时养尊处优的生活，大谈特谈旧西藏的精神生活是如何的崇高淳朴，喇嘛们是何等的圣洁无私，奴隶主们是多么的温和仁慈，贵族少爷们是如何的英俊潇洒，有情有义。而庄园里的那些农奴，在她的笔下总是又懒又馋，整天不肯好好干活，就知道琢磨着如何偷吃农奴主仓库里的食物。 在她的书里，还写了一个反映农奴“忘恩负义”…", "url": "https://www.zhihu.com/question/487757273/answer/63232762561", "votes": 20744, "comments": 1522, "feed_ts": 1784778209, "feed_time_str": "07-23 11:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "一波", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "生成式摄影：面向逼真文本到图像合成的场景一致相机控制", "excerpt": "Generative Photography: Scene-Consistent Camera Control for Realistic Text-to-Image Synthesis 引言：现有文生图模型已经能够生成较为逼真的图像，但它们通常不能正确理解焦距、快门速度、色温和背景虚化强度等真实相机参数。当提示词中的相机设置发生变化时，模型不仅难以产生符合物理规律的摄影效果，还经常改变人物、物体", "url": "https://zhuanlan.zhihu.com/p/2063587049475667916", "votes": 1, "comments": 0, "feed_ts": 1784777492, "feed_time_str": "07-23 11:31", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "历史上最著名的馊主意有哪些？", "excerpt": "川普1.0后。被起诉的罪名多达90多项。罪证高达1千多万页！！！ 没看错，就是1千多万页！！！ 结果：川普辨护律师称由于翻看这些罪证需要大量时间，案子被推迟到2025年开庭。 2025年，川普是总统了！ ", "url": "https://www.zhihu.com/question/3037109858/answer/62958315226", "votes": 25886, "comments": 420, "feed_ts": 1784777239, "feed_time_str": "07-23 11:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何在不微调的情况下提高 RAG 的准确性？", "excerpt": "现阶段想提高业务问答的准确率，死磕RAG的工程化改造绝对比盲目去搞微调靠谱一万倍。 用微调来向模型内部注入企业私有知识完全就是一个深不见底的深坑。微调不仅算力成本高昂，而且知识更新十分困难，最致命的是会引发十分严重的灾难性遗忘。你今天花了几十万的算力费和数据标注费微调进去一本公司内部最新的操作规册，明天业务部门因为合规要求改了其中的两个核心条款，你难道再重新去跑一遍整个数据集吗。这在真实的商业环境", "url": "https://www.zhihu.com/question/638730143/answer/2063584349312792433", "votes": 3, "comments": 0, "feed_ts": 1784776849, "feed_time_str": "07-23 11:20", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "伊朗打了那么多阿拉伯国家，为什么阿拉伯国家不组成联军严惩暴伊？阿拉伯国家组成联军，只能是一个理由：那就是发动圣战。他们内部也打，教派斗争，利益斗争，争夺伊斯兰领导权。西方整合伊斯兰世界的良方，就是不断制造相互对立的伊斯兰教派之间的矛盾，使其在内部形成隔阂，永远团结不起来。历史上，两派整合的结果是什么？这就是有先例的，那就是夺回圣城耶路撒冷的萨拉丁·本·阿尤布。他的崛起始于参加阿拉伯逊尼派对埃及什叶派主导的法蒂玛王朝的战争，并由此建立了在整个穆斯林世界的威望，最终整合大军夺回耶路撒冷。西方人自然熟悉这段历史，当初基督徒无法阻止穆斯林的大联合，结果就是灾难性的。所以，还要上演一次逊尼派联合起来讨伐什叶派的戏码吗？西方不敢支持这样的行动，局面就此僵住，无解。伊朗打了那么多阿拉伯国家，为什么阿拉伯国家不组成联军严惩暴伊？ #伊朗多地遭袭击 #美国伊朗 #伊朗军队 ", "excerpt": "伊朗打了那么多阿拉伯国家，为什么阿拉伯国家不组成联军严惩暴伊？阿拉伯国家组成联军，只能是一个理由：那就是发动圣战。他们内部也打，教派斗争，利益斗争，争夺伊斯兰领导权。西方整合伊斯兰世界的良方，就是不断制造相互对立的伊斯兰教派之间的矛盾，使其在内部形成隔阂，永远团结不起来。历史上，两派整合的结果是什么？这就是有先例的，那就是夺回圣城耶路撒冷的萨拉丁·本·阿尤布。他的崛起始于参加阿拉伯逊尼派对埃及什叶", "url": "https://www.zhihu.com/pin/2063583546539873769", "votes": 0, "comments": 0, "feed_ts": 1784776657, "feed_time_str": "07-23 11:17", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "伊朗打了那么多阿拉伯国家，为什么阿拉伯国家不组成联军严惩暴伊？", "excerpt": "阿拉伯国家组成联军，只能是一个理由：那就是发动圣战。 发动圣战也只能有一个理由：那就是捍卫真主。 说白了，就是穆斯林联合起来打败异教徒军队。 这是唯一可以整合穆斯林的伟大旗帜。 他们内部也打，教派斗争，利益斗争，争夺伊斯兰领导权，相互之间打来打去。 这就像两伊战争，代表逊尼派利益的萨达姆，敢说这是对什叶派的圣战，然后召集所有的逊尼派国家参战吗？ 这些伊斯兰国家政府没办法搞违反教义的动员工作。 从西", "url": "https://www.zhihu.com/question/2063167836797902909/answer/2063583347050390282", "votes": 106, "comments": 2, "feed_ts": 1784776610, "feed_time_str": "07-23 11:16", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待乌军总司令西尔斯基正式被解职？", "excerpt": "观察乌语和英语区对西尔斯基一边倒各种批评，普遍存在一种很不好的思维方式： 把具体器物、策略，与抽象的意识形态方法论强行绑定。历数西贼罪状：在莫斯科受到不正确、过时军事教育的苏系将军；采用苏式战法；依赖带有苏联烙印的装备类型：坦克、火炮；无谓堆积伤亡（苏军=多死人，换一个北约思维的上去，就不用死人了！）；排斥无人机等新技术。英语区看到一句话被重复了很多遍：“一支小规模苏军永远无法击败击败大规模苏军”", "url": "https://www.zhihu.com/question/2063170777005012680/answer/2063583109493397354", "votes": 1417, "comments": 306, "feed_ts": 1784776553, "feed_time_str": "07-23 11:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "钓鱼佬最接受不了什么？", "excerpt": "钓不上鱼就算了，还污染环境，国家都忍不住出手了！丢人！ ", "url": "https://www.zhihu.com/question/1941154755620611466/answer/2060452347826942517", "votes": 3911, "comments": 156, "feed_ts": 1784776337, "feed_time_str": "07-23 11:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "以色列与当年的小日子异同如何？", "excerpt": "没啥异同，唯一不同是时代不一样了，以色列只能偷摸的干，不像小日本“光明正大”的干。 日本东北开拓团，以色列约旦河东岸建定居点。但是为了国际观瞻，以色列有时候还得拆除一些搞的过火的定居点。 日本和以色列都把侵略，包装成文明对野蛮，对自己搞的屠杀事情视而不见，反倒是对被侵略者的反抗，大加指责，认为自己干的屠杀事，都源于对面的反抗，对面不愿乖乖被杀，所以屠杀责任全在对面。这种强盗逻辑，在知乎上很多人都深", 只有10万是你自己掏的，其余90", "url": "https://www.zhihu.com/question/2062885893309047731/answer/2063575950814614635", "votes": 4, "comments": 0, "feed_ts": 1784774846, "feed_time_str": "07-23 10:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "进击的沈帅波发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "对话声东击西制作人＆host——徐涛\n做一个信息雨林中的漫游者也很好", "excerpt": "对话声东击西制作人＆host——徐涛\n做一个信息雨林中的漫游者也很好", "url": "https://www.zhihu.com/pin/2063570747726082984", "votes": 0, "comments": 0, "feed_ts": 1784774593, "feed_time_str": "07-23 10:43", "category": "pin", "cat_name": "想法动态"}, {"actor": "进击的沈帅波发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "对话野人先生创始人——崔渐为 越摇摆越焦虑 越热爱越坚定", "excerpt": "对话野人先生创始人——崔渐为 越摇摆越焦虑 越热爱越坚定", "url": "https://www.zhihu.com/pin/2063571461328189018", "votes": 0, "comments": 0, "feed_ts": 1784774467, "feed_time_str": "07-23 10:41", "category": "pin", "cat_name": "想法动态"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待万斯说：“伊朗人如果需要就自己拿起武器更迭政权，不要指望美国派十几万人帮助”？", "excerpt": "伊朗人民想推翻的政权，是一个随意轰炸学校杀死168儿童的邪恶反人类政权。 很快他们即将实现这一目标，在11月3日。 侵略者必败 ", "url": "https://www.zhihu.com/question/2061132710182228681/answer/2062968743588844481", "votes": 393, "comments": 27, "feed_ts": 1784774157, "feed_time_str": "07-23 10:35", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看待日本 K-Car 的设计？", "excerpt": "从产品和工程角度来说，K车唯一的出路就是电动化。 你们只看造形可爱，你们知不知道0.66的排量多难开？国内有专门跑去日本试驾 K车的汽车博主，一试一个不吱声。动力弱，带不动空调，爬不动坡也就算了，这大家也能想象得到，还有就是这种小排量三缸发动机，振动控制是不可能太好的，其次一个最重要的问题，它的马力是要靠拉高转速来获得的，而K车主要的活动范围是在城区，这两点就非常的矛盾。 其次，在如此狭小的一个空", "url": "https://www.zhihu.com/question/29301951/answer/2062459835011035148", "votes": 1907, "comments": 337, "feed_ts": 1784773320, "feed_time_str": "07-23 10:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看待日本 K-Car 的设计？", "excerpt": "比亚迪的海獭就是无可争议的Kcar最终解决方案。电动化解决了发动机噪音，油耗，动力弱，动力系统空间占用等等等等一系列问题。", "url": "https://www.zhihu.com/question/29301951/answer/2062825066065294976", "votes": 179, "comments": 14, "feed_ts": 1784773286, "feed_time_str": "07-23 10:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "斯塔默：“我任上干了两件事，一是与保守党斗了那么多年，把它赶回英格兰南部去了。对这件事持异议的人不多，只有那么几个人，在我耳边叽叽喳喳，无非是让我及早打倒绿党和改革党。另一件事你们都知道，就是发动网魔大决战，支持的人不多，反对的人不少。这两件事没有完，这笔遗产得交给下一代，怎么交？打不倒网魔，俄罗斯网军就能趁虚而入，搞不好民主体制就被颠覆了。你们怎么办，只有天知道。”", "excerpt": "斯塔默：“我任上干了两件事，一是与保守党斗了那么多年，把它赶回英格兰南部去了。对这件事持异议的人不多，只有那么几个人，在我耳边叽叽喳喳，无非是让我及早打倒绿党和改革党。另一件事你们都知道，就是发动网魔大决战，支持的人不多，反对的人不少。这两件事没有完，这笔遗产得交给下一代，怎么交？打不倒网魔，俄罗斯网军就能趁虚而入，搞不好民主体制就被颠覆了。你们怎么办，只有天知道。”", "url": "https://www.zhihu.com/pin/2063063696377648562", "votes": 0, "comments": 1, "feed_ts": 1784773202, "feed_time_str": "07-23 10:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么祁同伟和高启强并不讨人厌，反而侯亮平和安欣会让人反感呢？", "excerpt": "1.草根好人各位不妨想想上一个善终的草根好人是谁？ 1998年，小燕子横空出世。她是什么出身？街头卖艺的孤女，连自己爹是谁都不知道，靠着一股蛮劲儿和不要命的莽撞，撞进了皇宫。她不会吟诗作对，不懂规矩礼数，但她善良、讲义气、敢爱敢恨。观众喜欢她，不是因为她高贵，恰恰是因为她“低”，低得和电视机前的普通人一样。她的成功，是草根对秩序的一次浪漫主义胜利。 但你再往后看，二十年了，还有哪个草根出身的角色，", "url": "https://www.zhihu.com/question/2060313146192143108/answer/2062657656079308752", "votes": 4649, "comments": 409, "feed_ts": 1784773112, "feed_time_str": "07-23 10:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "如何评价1066年的诺曼征服?不过，诺曼征服导致国王和土地贵族都说法语，和盎撒农民语言有别这点，虽然对盎撒人来说可能很耻辱，但是也在13世纪给英王王权带来了回旋镖。因为这种文化纽带降低了诺曼贵族从法国“引进外援”的成本，客观上制衡了英王王权，从千年尺度上的“进步”“目田”的角度来说是好事捏~~——————比如《大宪章》那一波，1215年最开始确实是英王约翰大意了，被土地贵族“暂时走位”逼到墙角签的权宜之计。这是因为之前持续16年的横征暴敛同时得罪了土地贵族和伦敦寡头，约翰又低估了伦敦寡头的敌意，导致自己轻装出城招募雇佣兵时，伦敦市民和反叛贵族里应外合“偷家”，约翰又没带攻城器械只能妥协。但是呢，很多人也知道，2个月后约翰就找教皇把《大宪章》给废了，这方面知乎也科普的很明白了。可故事因此就结束，回归熟悉的“严惩反叛头领，回归大王权模式”了么？本来也许会的，但这些贵族随后转向法王的王太子路易效忠，直接招来了境外势力跨海入侵，导致英国陷入2年内战，差点复刻1066，不得不再次用大宪章妥协。1216年秋季，英王局势极其糟糕，东部南部都被法王太子占领，约翰撤往英国北部，在强行渡河的时候整个车队连带王冠、权杖、王室圣物、珠宝贵金属等权力符号和财政物资全部被冲走，随后死于痢疾，可以说英王权基本摇摇欲坠了。但是在最危难时期，保王派出现了一个威廉·马歇尔的猛男，辅佐年幼的亨利三世，把《大宪章》搬了出来，承认对贵族让利，这才导致贵族倒戈，抛弃法国太子转而支持亨利三世。 倒戈的贵族联合保王派在1217年发动再征服，通过几次漂亮的战役把路易被打回法国本土，最终导致诺曼贵族借助大宪章和亨利三世的年幼，在英国短暂实现了某种意义上的有限君主制。 亨利三世统治期间（1216-1272年），正值中世纪暖期，欧洲风调雨顺人口剧烈增长，又有蜢蛄人“精准不杀”带来的比较优势，农业商业大发展，人口增长到8000万-1亿规模，比同时期被蒙古入侵的汉地人口还要高不少（没错1200s的欧洲总人口可能比东亚更高）。在法国等各地的君权（也包括神罗的诸邦君）借助农商复兴带来的“财政极大丰富”开始养文官扩权的同时，英王亨三则是错过了风口，收入少的可怜被贵族反复骑脸，这些都算1215-1217年那波妥协的副产品，而这种妥协和诺曼土地贵族召唤法王的威胁不无关系。——————王权力量的再次转折来自商业贸易。海对岸的弗兰德斯崛起了一系列羊毛纺织为本的工商业城镇，英国气候土壤刚好有助于产出高质量羊毛，于是便和弗兰德斯的城市实现了商业循环。羊毛作为一种物流商品，其“征税成本”比农业税要低得多，但是因为英国港口的分散性，又很难断绝走私，难以实现彻底垄断，出口分销又是商人在运作，所以其最终的博弈格局是国王与土地贵族（羊群和人力）和商人（羊毛出口）经过议会协商来征收，这就是所谓王权和议会协商税收的传统的最初雏形。爱德华一世期间（1272-1308年），王权靠这种商税快速回血，对外扩张拳打威尔士脚踢苏格兰。后来的百年战争，各种战时的应急财政支出和国王长期离岸在法国打仗，又让这种协商常态化。所以你看，诺曼法语贵族把盎撒老农压迫得很惨是没错，千年占据英国大部分田产也没错。可如果你不从“皇盎”的角度看，而是从“全人类进步”的角度看，那这些其实都是“进步必要的代价”嘛~~如果这些诺曼贵族不讲法语，不是跨海而来的异族征服者，那他们就不会如此丝滑地在英王、法王之间来回倒戈，也就不会进而实现桶蘸价值。没有这个桶蘸价值，那《大宪章》最终就会变成废纸。所以从“迪莫克拉西”发展的角度来说，英国盎撒农民被法语贵族压榨那都是必要的代价。最后，很多线性向上史观的人会觉得，英国这种有限君主的起步看起来很早。不过和中世纪盛期的很多“早熟”事物一样（再早熟能比得上意大利的威尼斯和伦巴底同盟么），都在中世纪晚期和早期近代被打回原型。具体到英国，就是百年战争失利-闲置老兵依附豪强成为扈从-武装恐吓议会-玫瑰战争-都铎王朝+斯图亚特王朝的大王权崛起，导致议会的自主性进入了休眠期。直到1630年代，因为查理一世过于抽象、隔壁荷兰商业共和国崛起、清教徒思潮共同解构王权，再加上小冰期加剧矛盾，大宪章的思路才通过托古改制再次复兴，经过反复后在1689光荣革命被确立。不过，这种有限王权和窗户税等各种秦制严选操作仍然不矛盾。", "excerpt": "如何评价1066年的诺曼征服?不过，诺曼征服导致国王和土地贵族都说法语，和盎撒农民语言有别这点，虽然对盎撒人来说可能很耻辱，但是也在13世纪给英王王权带来了回旋镖。因为这种文化纽带降低了诺曼贵族从法国“引进外援”的成本，客观上制衡了英王王权，从千年尺度上的“进步”“目田”的角度来说是好事捏~~——————比如《大宪章》那一波，1215年最开始确实是英王约翰大意了，被土地贵族“暂时走位”逼到墙角签的", "url": "https://www.zhihu.com/pin/2061916385308103266", "votes": 0, "comments": 25, "feed_ts": 1784773019, "feed_time_str": "07-23 10:16", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价1066年的诺曼征服?", "excerpt": "我看到很对大佬已经详细讲了诺曼征服对昂撒人的黑暗血腥历史了 那我就不赘述了，现在我想给大家提供另一个视角来看待这段历史 关注国际新闻的人应该注意到了 英国的移民问题已经到了接近爆炸的程度了 印度人、锡克教徒、穆斯林，已经把英国本土白人逼到墙角上了 在了解这段历史之前，我其实很难理解 这英国统治者的脑子真的正常吗 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

ts？🚩 Google DeepMind新作「Unified Latents（UL）」，重新探讨Latent Diffusion Models（LDM）的基础问题：后续用diffusion model建模时，Autoencoder如何训练和约束latents以平衡比特率、重建与生成性能。🚩 针对现有方案在容量定量与细节保持上的局限，下面从隐空间演进出发，剖析UL的方法与实验：\t👉 研究背景与动机：1）感知与失真权衡：pixel space与隐空间建模的算力及分布矛盾；2）现有路线局限：对比VAE-GAN路线（Stable Diffusion、SD-VAE、DC-AE、3D VAE、LPIPS）、自监督路线（DINO、DINOv2、SigLIP、RAE、无VAE的LDM）及扩散先验或解码路线（LSGM、DiffuseVAE、DiVAE、SWYCC、ε-VAE、DDPM）的短板；3）理想框架：基于Evidence Lower Bound（ELBO）锁定比特率上界、消除高方差梯度并防后验坍缩。\t👉 Unified Latents核心设计：1）先验约束：以unweighted ELBO锁定diffusion prior信息上界；2）确定性编码：摒弃VAE方差预测，encoder注入固定噪声并与先验最小噪声对齐；3）生成式解码：以sigmoid重加权ELBO与loss factor训练diffusion decoder，解耦高低频建模；4）两阶段训练：先联合优化，再冻结参数训练ViT（及Diffusion Transformer、U-Net）base model。\t👉 实验验证与横向对比：1）性能与消融：在ImageNet-512、Text-to-Image（无Classifier-Free Guidance）及Kinetics-600超越MAGVIT-v2、W.A.L.T.与Video Diffusion，验证通道脱敏；2）优势与展望：探讨结合diffusion distillation实现one-step generation及构建visual tokenizer。（由于文字篇幅限制，具体细节麻烦大家移步图片～👆）#深度学习  #计算机视觉  #大模型  #扩散模型  #diffusion  #生成模型  #图像生成  #视频生成  #人工智能  #机器学习 ", "excerpt": "如何评价Unified Latents？🚩 Google DeepMind新作「Unified Latents（UL）」，重新探讨Latent Diffusion Models（LDM）的基础问题：后续用diffusion model建模时，Autoencoder如何训练和约束latents以平衡比特率、重建与生成性能。🚩 针对现有方案在容量定量与细节保持上的局限，下面从隐空间演进出发，剖析UL的", "url": "https://www.zhihu.com/pin/2105332814619193504", "votes": 0, "comments": 0, "feed_ts": 1795534102, "feed_time_str": "11-24 23:28", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "嵌入式Linux", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "蓝牙 7.0 来了，无线耳机听无损有机会了吗", "excerpt": "大家好，我是写代码的篮球球痴。 蓝牙 7.0 的消息一出来，&#34;无线耳机终于能听无损&#34;这句话就到处飞法法。 好好好，先别急着下单。 2026 年 11 月 2 日，Bluetooth Core 7.0 写进规范版本历史；11 月 4 日，蓝牙技术联盟（Bluetooth SIG）把里面最吸睛的那一项单独拎出来官宣，叫HDT，高数据吞吐量。它给蓝牙低功耗加了一条新物理层，把峰值位速率从", "url": "https://zhuanlan.zhihu.com/p/2108703507201144676", "votes": 0, "comments": 0, "feed_ts": 1795534102, "feed_time_str": "11-24 23:28", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价欧盟外长卡拉斯?", "excerpt": "我们必须意识到一个问题，即 “让卡拉斯担任欧盟外长” 恰恰是 欧洲自身的意志，而不是 “欧洲决策失误”。 如果你认为是 “愚蠢的卡拉斯坏了欧洲的事” 或者 “欧洲被卡拉斯拖累了”，那你相当于把整件事的逻辑理解反了，从而连带着完全误解了欧洲的外交模式。简单地说， 卡拉斯的愚蠢和狂妄正是欧洲所需要的，欧洲就是希望利用她来羞辱中俄 （甚至包括美国）以获取一种情绪价值上的 “赢” 感： “我把中美俄都狠狠", "url": "https://www.zhihu.com/question/1947251060977697268/answer/2041156255557865801", "votes": 1440, "comments": 69, "feed_ts": 1795534068, "feed_time_str": "11-24 23:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "当一个老师在课堂上大肆宣讲中国的缺点时，他究竟在想什么？", "excerpt": "我之前在某些大学授课的时候经常性胡咧咧，有一次在某校讲，院长旁听了一次我的大课以后找我谈话。 前提是我真不知道院长在下面，乌央乌央全是人。我这400度的大近视也不戴眼镜，十米开外都雌雄难辨。 我教的是人文学院新传专业的学生，但是来听讲的却挤满了很多其他专业的孩子，同学们很热情，他们可能觉得我上课跟脱口秀一样。 那一节课我给同学们讲的是，在舆论战线为何我们一直节节败退，为什么就干不过西方的媒体，为什", "url": "https://www.zhihu.com/question/1991173630260954357/answer/2041442392604140666", "votes": 27407, "comments": 1119, "feed_ts": 1795534043, "feed_time_str": "11-24 23:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "神舟二十四号载人飞船瞄准11月25日8时18分发射，「天宫」将迎来首位外籍航天员，有哪些信息值得关注？", "excerpt": "两名巴航天员都完成了标准汉语测试，这个今后是标准化动作，所有外籍航天员都要通过汉语考试，让他们尝尝雅思四六级的滋味 巴基斯坦规划发展部长专程来京出席仪式，任务标识加入巴基斯坦国花素馨花，主流媒体《黎明报》直言这是整个国家的骄傲。 重要的是示范效果，给中国当小弟，中国带你上天，57空战、天涯6比0，巴基斯坦还能协调美伊冲突，俨然是南亚和中东地区强国，稳稳的压印度一头 乌克兰给美国当小弟，战火连天，流", "url": "https://www.zhihu.com/question/2108486612505949389/answer/2108508589878933486", "votes": 386, "comments": 61, "feed_ts": 1795533918, "feed_time_str": "11-24 23:25", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "我问你们：你们想要一个消费社会吗？如果必要的话，你们是否想要一场比现在更全面更彻底的消费社会？", "excerpt": "我问你们：你们想要一个消费社会吗？如果必要的话，你们是否想要一场比现在更全面更彻底的消费社会？", "url": "https://www.zhihu.com/pin/2108699100543833065", "votes": 0, "comments": 6, "feed_ts": 1795533083, "feed_time_str": "11-24 23:11", "category": "pin", "cat_name": "想法动态"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "四十岁了会开始害怕体检吗？", "excerpt": "我今年49岁了，每年到体检季我从来不担心，因为我知道体检的结果只是我日常健康生活方式的指标体现。体检结果不是凭运气、开盲盒。 所以，如果你害怕体检，其实你潜意识里知道自己过程没有做好，所以对体检的结果不存在良好的预期。 建议你后期更加关注日常生活过程，过相对健康的生活，包括科学的锻炼，科学的饮食，到时你会不由自主地期待体检，因为这是对你正确生活方式的一种正向激励。 个人观点，仅供参考。 ", "url": "https://www.zhihu.com/question/1983043666877630422/answer/1983070535341581875", "votes": 7, "comments": 1, "feed_ts": 1795532399, "feed_time_str": "11-24 22:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么中国没有恐怖分子?", "excerpt": "发现怀柔政策行不通后改高压了，以前治安差的时候火车站砍人忘了？", "url": "https://www.zhihu.com/question/37552880/answer/2049438110317012752", "votes": 11759, "comments": 132, "feed_ts": 1795532181, "feed_time_str": "11-24 22:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么南京一碗免费的素面会掀起排队的人龙？", "excerpt": "我认为素面排队事件真正反映出来的问题是中国的市场经济作为一种意识形态依然缺乏神圣性和渗透度，因此有大量消费者依然按照前市场经济的思维，会无条件地认为免费=好，并无视免费的代价。 虽然中国已经进入市场经济40余年，但真正完整在市场经济中诞生长大的人不过勉强两代，市场的现象虽然已经无孔不入，但市场经济活动中商品与服务的超越性价值却被绝大多数人解构。因此对于很多国人来说，面条就是面粉加水煮熟，量越大配菜", "url": "https://www.zhihu.com/question/2105356118537065374/answer/2108695408310604341", "votes": 88, "comments": 11, "feed_ts": 1795532163, "feed_time_str": "11-24 22:56", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国反腐败斗争预计何时取得根本性胜利？", "excerpt": "一个地方如果号称“消灭了腐败”，那它肯定是最腐败的地方。 道理就是这么简单。 美国五角大楼，被公认为 “世界最大实体资产持有者”——不仅有各类航母、战斗机等军事武器装备，还管理着全球约2,600 万英亩（约 10.5 万平方公里）的土地，比很多国家都大；超过 4800 个地点的军事基地、仓库等，涉及超过 70 万座建筑设施，含自己的港口、数百个军用机场，甚至包括专门的铁路支线，独立的供水、供电、污", "url": "https://www.zhihu.com/question/2080578344320614439/answer/2107191104999379264", "votes": 200, "comments": 5, "feed_ts": 1795532113, "feed_time_str": "11-24 22:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价英伟达董事会宣布恢复黄仁勋职务？", "excerpt": "被下属出卖以后处刑，三天后复活我怎么在哪看过这一集", "url": "https://www.zhihu.com/question/2108320558865831371/answer/2108323433247405997", "votes": 5606, "comments": 153, "feed_ts": 1795532082, "feed_time_str": "11-24 22:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "纳什均衡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "想学交易拜师有用吗？", "excerpt": "没用，哪怕遇到真有点东西的，如果不在同频率，就是这个后果。本赛特翻阅千山万水寻找战争不败之法，然后一次次被拍下了悬崖。 从此江湖上留下了一段笑话，纳什均衡到处找其他博主学习，但是一次次被扔了出去。 最后高手留下的一行字就是，王道天下，不战即为不败，让我注销账户。 因为害怕失败，所以希望掌握确定性，希望自己能够凌驾于不可预测的命运之上。 但只要参与战争，就意味着进入了一个充满变量的系统。即便赢得了一", "url": "https://www.zhihu.com/question/10523906416/answer/2108694461782017287", "votes": 4, "comments": 12, "feed_ts": 1795531938, "feed_time_str": "11-24 22:52", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价甲午战争失败归根结底是朱元璋这种论调？", "excerpt": "他好像自己删掉了这个文章。 我用一张图，就能说明他们这类有毒文章的核心问题，当然我不确定他们能否看懂，但是我知道理工科，尤其是工程应用相关出身的人，一眼就知道是什么意思。 这是一张经典老图： 他们的文章其实是这张图的超级加倍版，而且从数据量和缺失数据量带来的更多分叉计算消耗来说，可能是加强了多少亿倍的结果。 我不确定他们是否能看懂这张图对他们文章的精确总结.....................", "url": "https://www.zhihu.com/question/2108206860708991791/answer/2108692296820581895", "votes": 340, "comments": 13, "feed_ts": 1795531421, "feed_time_str": "11-24 22:43", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "山月刀岚月刀", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待美媒认为星舰V3二级回收成功长九火箭技术仍然优于星舰V3，星舰V3拖了登月后腿？", "excerpt": "简单说个常识： 星舰这种两级甲烷发动机的火箭除了低轨道任务，啥也干不了。 甲烷、煤油这种东西低轨用用可以，因为摆脱引力初期需要比较猛的爆发，而氢氧发动机的出力有点温柔。但是等到了真空环境下，氢氧机和煤油/甲烷机的区别就拉开了。 真空中氢氧机和甲烷/煤油区别有多大？俩例子：起飞重量只有星舰v3一半的sls，哪怕捆绑了比冲更低的固推，月球轨道运载能力也比星舰v3要高6吨左右，星舰那么大个还不能把26吨", "url": "https://www.zhihu.com/question/2107243465771857057/answer/2108689384363005015", "votes": 21, "comments": 11, "feed_ts": 1795530727, "feed_time_str": "11-24 22:32", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "AI有一个非常离谱的倾向。昨天我把一个游戏设计初稿给它，本来的用意是找它讨论讨论，把玩法设计完善一下；然后在这个基础上理清需求，做出服务器端和客户端角色划分，再给出较为准确的服务器/客户端需求，之后再做总体设计。结果每个AI都是第一时间“来让我们设置目录结构准备开做”……好嘛我自己都还没彻底理顺玩法逻辑、卡好边界呢，结果AI不仅起不到帮忙找漏洞、完善设计的作用，反而嗖一下就想给我推进到编码阶段——这玩意儿我理清楚了，估计至少得五到十个服务器模块，五到十个客户端模块，每个模块两三个甚至三五个功能，最终让我写也得两三万行代码，换别人恐怕二十万行代码都打不住（稍微弱一些的团队给搞到百万行代码都是司空见惯），结果AI八字没一撇就忙着撸袖子开干……这大概率又是语料标注的锅，当然也可能是这类项目立项讨论相关的资料实在太少，AI压根没见过。总之这类情况非常多，如果自己没头绪，那随便怎么找AI问都是怎么问都问不出来，除非自己给它个踏实/专业的起始点。换句话说，想要把它带回正确语境，还是得我自己先想明白、搞出比较好的策划/需求/设计文档再给它整理；我不搞这个“启动文档”，想要白嫖AI的思路，那是不可能的。对不成熟的开发者/设计师，他很可能压根不知道自己那看似“绝妙”“细致”的设定还缺了多少东西；他一说，AI兴高采烈的一做，哇好棒真的可以！然后他玩着玩着就开始发疯了，这怎么……不对劲儿啊？得改！可是，改什么？往哪改？尤其是，考虑玩家有很强的“通过作弊得利”的倾向，怎么防？压根没想过，甚至连什么放服务器做什么放客户端做、怎么控制和验证每个信息的来路、合法性，这些他们压根就没概念；AI胡扯起来他们还觉得，哇AI好专业……但问题是，我太清楚思路到落地之间需要什么了；我清楚，所以我会制止它，不让它做，不让它在这上面瞎烧token。可不清楚的人呢？那肯定是烧了海量token、得到一个破破烂烂漏洞百出的烂摊子——越这样，AI代码反而越“高深”，越难读：那这时候，你就是想把它修补好，从何着手？这事连我都头痛，我都不敢“先做着看看慢慢改”，因为一旦走到那个阶段，连我都无力回天，何况那些外行。@知乎直答 ", "excerpt": "AI有一个非常离谱的倾向。昨天我把一个游戏设计初稿给它，本来的用意是找它讨论讨论，把玩法设计完善一下；然后在这个基础上理清需求，做出服务器端和客户端角色划分，再给出较为准确的服务器/客户端需求，之后再做总体设计。结果每个AI都是第一时间“来让我们设置目录结构准备开做”……好嘛我自己都还没彻底理顺玩法逻辑、卡好边界呢，结果AI不仅起不到帮忙找漏洞、完善设计的作用，反而嗖一下就想给我推进到编码阶段——", "url": "https://www.zhihu.com/pin/2108550117007561731", "votes": 0, "comments": 13, "feed_ts": 1795528984, "feed_time_str": "11-24 22:03", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "看到一个极为诡异的情况，似乎真的有人认为你乎（以及B站等）冲GTA6不是因为性别议题、DEI和藤壶圈地等问题，而是因为“反美”，因此反GTA6的是粉红。只能说真的能在一个话题下看到活在两个截然不同的键政版本的人也是一种诡异的体验。", "excerpt": "看到一个极为诡异的情况，似乎真的有人认为你乎（以及B站等）冲GTA6不是因为性别议题、DEI和藤壶圈地等问题，而是因为“反美”，因此反GTA6的是粉红。只能说真的能在一个话题下看到活在两个截然不同的键政版本的人也是一种诡异的体验。", "url": "https://www.zhihu.com/pin/2108622013153789202", "votes": 0, "comments": 13, "feed_ts": 1795528780, "feed_time_str": "11-24 21:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "可否认为中国是冷战的战胜国之一？", "excerpt": "这取决于你定义冷战胜利的方式，如果你把冷战理解成一场，各方势力联合起来战胜敌人的战争，一部抗苏英雄传，那老中确实是重要的战胜国之一。 冷战中后期，中苏冲突要比与美国的冲突 5494385, "feed_time_str": "11-24 12:26", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "克罗地亚这一篇，说实话，在我准备资料、准备写它之前，我对它的了解是不深刻的。实际上如果只看表面的经济账单，它还算良好——无论是债务率也好，整个财政状况也好。但是当你深入地去理解它的结构的时候，就会发现问题的本质：分配上的异化。至于为什么我在写克罗地亚时要写这么多内容，实际上它是可以作为理解欧盟的一个典型范本的。我们可以把欧盟比作魏晋时期那个时候的中国——地方氏族崛起，中央权力微弱。而欧盟甚至连中央权力都不太牢固，更谈不上对中下层的穿透。所以它算是一个联合体，但其内部的行政效率这些，完全不要指望。而在现在百年未有之大变局的竞争下，欧盟的结构是最脆弱、最散碎的。所以它的行政效率低下，所以它对外部竞争的抵抗能力更加微弱，所以它处处都是弱点。而与欧盟经济有着相当深刻渗透的美国，能够轻易地操纵它的弱点。欧盟属于一个——怎么说呢？你说它没有脑子吧，实际上，“没有脑子”甚至都算是个正面buff。它长了几十上百个脑子，互相之间基于各自的利益交互扯皮。然后很多人说：地方崛起，那是不是对地方有益？是的，对地方的这些大族们有益。一般来说，权力的中间阶层——地方的大族，包括我们说的魏晋的士族豪族，包括我们说的各个千年世家也好，还是我们后来能理解的后期泛起的江南地主阶级也好——他们都是典型的中间阶层膨胀。他们膨胀之后，他们是爽了，但是对于民众来说，这才是深刻苦难的开始。媚上而欺下，才是他们的典型特质。他们完成了权力的凝固和垄断之后，能够更有效、更有效率地压榨底层民众，但是这种压榨又极难转化成一个国家群体的竞争力。这就是核心的问题所在。实际上我一直在构思“央地矛盾”这一个内容，想从中国两千年封建史的角度，试着边学习边创作，来理解央地矛盾的变迁。欧盟算是又给我了一些参考。当然了，欧盟的地方势力，说他们“媚上而欺下”都不准确——他们根本就没有上。他们上面的那个脆弱的欧盟共同意志，都不配他们谄媚，只配被他们愚弄。", "excerpt": "克罗地亚这一篇，说实话，在我准备资料、准备写它之前，我对它的了解是不深刻的。实际上如果只看表面的经济账单，它还算良好——无论是债务率也好，整个财政状况也好。但是当你深入地去理解它的结构的时候，就会发现问题的本质：分配上的异化。至于为什么我在写克罗地亚时要写这么多内容，实际上它是可以作为理解欧盟的一个典型范本的。我们可以把欧盟比作魏晋时期那个时候的中国——地方氏族崛起，中央权力微弱。而欧盟甚至连中央", "url": "https://www.zhihu.com/pin/2108536642181002825", "votes": 0, "comments": 0, "feed_ts": 1795494310, "feed_time_str": "11-24 12:25", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "（美学探讨）剃发易服为什么会导致服饰变丑——汉服完善的美学体系被毁坏", "excerpt": "这篇回答被和谐了，所以修改一下写成文章。 很多人评价满清服饰不好看，因为它的发展过程的确是畸形的。因为汉服体系实际上是汉民族传承了数千年，沉淀、筛选出的美学体系。 它已经是一个完整的美学答案，满清的剃发易服，禁止了很多汉服形制，这些服饰的形制、纹样、结构、布局、放量……实际上是一个审美完善、相辅相成的体系（汉人用几千年的时间，筛选出了服饰美学的最优组合），背向这个答案的服饰组合，很可能就会变得不和", "url": "https://zhuanlan.zhihu.com/p/2105359892433335521", "votes": 131, "comments": 10, "feed_ts": 1795494299, "feed_time_str": "11-24 12:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "深度好文，能从结构上说清厂襟蜈蚣之审美困境和汉服交襟体系之审 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#4c9aff", "gold": "#f5c542", "geo": "#ff9f45", "pin": "#52c41a", "other": "#9aa4b2"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

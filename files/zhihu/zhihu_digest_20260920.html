 "赞了回答", "title": "上世纪末的时候，越南为什么自大到认为可以和中国较量？", "excerpt": "勃列日涅夫又不是疯子，怎么可能跟越南配合南北夹击中国?黎笋也没疯，越南什么情况他能不知道?拿什么跟中国打? 就是黎笋想赌一把，大越南复兴胜利在即，赌中国不敢干预，赌苏联不会看着他被中国干死，结果赌输了，就这么简单。 时机挑的很好，机会也出来了，没打过，怪得了谁？ ", "url": "https://www.zhihu.com/question/15655600440/answer/2084241163188547958", "votes": 11, "comments": 0, "feed_ts": 1789818013, "feed_time_str": "09-19 19:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "黄金白银 楚汉争霸黄金白银，楚汉争霸，冷战公元前207年，刘邦受命西进，攻武关，进抵蓝田。面对峣关秦军，刘邦听从张良建议，先以重金收买守将，后乘其懈怠发动攻击，大破秦军于蓝田。次年，刘邦军进抵霸上，秦王子婴投降，秦朝灭亡。公元前207年，项羽破釜沉舟，大破秦军主力，威震天下，名闻诸侯，被拜为诸侯上将军，拥兵雄厚，达四十余万 。项羽随后率军西进，火烧咸阳。设鸿门宴，但放过了刘邦。公元前206年，项羽在咸阳分封十八路诸侯就国，自号为“西楚霸王”，封刘邦为汉王，封地为当时的“穷乡僻壤”巴蜀（汉中是张良依靠贿赂项羽叔父才拿到的封地）。汉王烧毁了蜀地通往关中的栈道，麻痹项羽。项羽自己则定都彭城，国号“西楚”。同年刘邦“明修栈道，暗度陈仓”，重定三秦之地，率军出蜀伐楚，爆发楚汉相争。公元前202年，垓下之战，项羽战败，自刎于乌江，西楚灭亡。这里讲几点：1》汉。1）刘邦不是农民，萧何不是农民，曹参 樊哙 周勃 灌婴等也不是农民。当然吕泽 韩信  张良 陈平 等后加入的更不是农民。我的猜测，丰沛集团起兵的那一拨人为何三年内就有从武关灭秦的本领，然后又从陈仓再灭一次“三秦”，继而打赢楚汉战争，很可能是因为他们本来就是魏国被打散后，遁入楚地的魏国基层军事组织，刘邦 萧何 曹参 樊哙 周勃 灌婴 都是军官，只不过他们躲在了和魏国接触的“楚地”。司马迁没记录，他不打仗？没网络？对老刘家有意见？否则，前有陈胜吴广的张楚政权的例子在前，东汉末年黄巾军的例子在后。农民起义军破坏容易，但这么强的战力和组织力，普通的农民军很难做到，何况是这么短的时间内，一拉起队伍，就战力惊人。后世的农民起义军的天花板，黄巢起义军和太平天国，也没有汉军这么高的格局。并且行军打仗，是一套专门的学问，不是种地就可以学会的。明的起兵，则是另外的组织，他们是宗教组织，有机会再说。2）汉为什么能战胜楚？因为：汉王一开始没有把自己的利益放在其他诸侯王的上面，但项羽是，项羽号称西楚霸王，其他十八路诸侯王都是他分封的，那他就是老大，分封的不好的话，别人就会找他的麻烦。而汉王自始至终用的是“汉”这个字，没有用“魏”，也没有用“秦”，更不会用“楚”。项羽把三秦之地变成了他的敌人，焚烧阿房宫，杀亲王子婴...项羽又杀了楚怀王，这样原本跟随楚怀王的势力都成了西楚的敌人，也给了刘邦们讨伐的借口。项羽没有坚持公平原则，太小气，前有韩信，后面彭越，英布也都成了他的敌人。项羽残暴任性，屠城，杀降卒...更关键的是：汉承秦制，继承了高效率的郡县统治方法，但又辅以“黄老之术”来怀柔润滑，这也是后世汉宣帝所谓“霸王道杂之”的核心思想，只不过“黄老之术”被换成了更圆滑更狠辣的儒家学说而已。而项羽的分封统治则退回到了“西周”的那一套，这效率差太多了。因此，汉王的兵打散了，打没了，萧何很快就补充了过来，粮草也是足足的，而项羽的敌人是越打越多的，手里的兵是越打越少的，最后被 “十面埋伏”，遭遇“四面楚歌”则是非常正常的。2》冷战我认为，冷战是帝国一手策划的“国策”，苏联只不过是鼠目寸光，配合演出而已。苏联的蛋蛋技术来自于英国。英国于1973年才加入欧洲经济共同体。1991年，苏联解体。1999年欧元被设立，欧元区成立。2016年，英国公投决定脱欧。因此，我认为，欧元，美元的次生货币是也，否则，欧元的“锚”是什么？要知道，冷战的最大的功劳就是促进了“北约”的成立，苏联解体后，而北约继续存在。周末，就这么多。给出 黄金 伦敦铜 有色金属 白银的近期规划（图1 2 3 4，更快更详细的规划请参阅我们的每日更新的专栏文章的内容），其余图片是近一年内的黄金白银的一些关键节点的选 verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "支持率一泻千里，李在明中秋节前出手收拾局面9月17日，共同民主党在国会强行通过法务部长官候选人金承元、国防部长官候选人姜信哲的人事听证报告书，长官任命进入倒计时。谁知李在明主动出面叫停，他在18日的记者会上表示：“虽然我认为已经选出了最佳人选，但在国民验证过程中出现了各种争议，还没有得出最终结论。……将考虑国民的要求等因素，慎重做出决定。”而识趣的金承元今天就召开记者会，宣布辞去提名：“深刻接受没有达到国民的要求，将深刻反省自身不足。”金承元人事认证被强行通过后，国土交通部长官候选人洪志善和中小风险企业部长官候选人李素英的听证报告书的采纳程序被推迟。相反民主党议员担任委员长的财政经济企划委员会上，通过朝野协商将民主党的合格意见和国民力量的不合格意见一起纳入针对副总理兼财政经济部长官候选人李亨一的听证报告书，然后提交。洪志善和李素英的人事听证申请案4日提交到国会，23日是人事听证程序的法定时限。如果国会不提交报告书，李在明可以在10天以内的规定时间，要求重新提交。如果还不提交，那总统可以在直接任命。对于几大核心争议，李在明也是快刀斩乱麻。对于屡受攻击的“连任”问题，李表示：“我的连任在宪法上是不可能的”，“再次坚定地说。 我完全没有连任的想法。”对于一部分人主张的“内阁责任制或二元执政制”他表示“荒谬”并再度强调“我也数次通过各种途径表示从未想过连任。”李也明确要求删除《捏造起诉特检法》中“撤消公诉权”的条款，为政界关于民主党谋划撤销对他的公诉的争论画上句号，“希望特别检察权限事项中删除现有的起诉案件移送、处理条款，只集中于查明真相”，李还诉苦道：“上届政府因为政治目的强行调查和起诉，因此受损的人不止我一个人。对于怀疑是恶意调查造假的事件，应该通过特检查明真相。” 对于霍尔木兹海峡派兵问题，李在明斩钉截铁地表示：“不会派兵参与战争或介入战争”，当天《纽约时报》就做了相关报道，结果青瓦台今天急赤白脸地出来描补说：“李总统在昨天（18日）的记者会上并没有拒绝特朗普总统提出的有关中东问题的协助邀请……政府将在不介入战争和战斗的原则立场下，继续研究具体的贡献方案。”对于“大统合”与“改革”相互冲突的问题，李在明特别指出：“曾有人指责说想要统合，结果改革变得模糊；推进改革，统合的诚意也受到了怀疑。但是，我坚决地说，方向并没有改变。”同时他也呼吁进步派不要再分裂：“献出生命战胜内乱，为国民主权政府的成功而全心全意在一起的人们互相交换厌恶话语的现实令人惋惜。梦想民主主义、进步、改革的理想，为了更好的世界而行动的我们都是亲文、亲卢、亲金大中与李在明的同志们。”——李雪碧一开始对连任还是有点起心动念的，所以抛出“连任”、“再任”（指总统隔一届再任，像卢拉上次当选的情况）。此外还有个绕开现行韩宪限制的花招，即提出宪修案时先行辞职，进入“代总统”模式，这样就能重新参加大选了……但现在形势比人强，再怎样也只能低头了，趁中秋节之前清盘，也算是及时止损。#棒杂俎", "excerpt": "支持率一泻千里，李在明中秋节前出手收拾局面9月17日，共同民主党在国会强行通过法务部长官候选人金承元、国防部长官候选人姜信哲的人事听证报告书，长官任命进入倒计时。谁知李在明主动出面叫停，他在18日的记者会上表示：“虽然我认为已经选出了最佳人选，但在国民验证过程中出现了各种争议，还没有得出最终结论。……将考虑国民的要求等因素，慎重做出决定。”而识趣的金承元今天就召开记者会，宣布辞去提名：“深刻接受没", "url": "https://www.zhihu.com/pin/2084615095649416900", "votes": 0, "comments": 1, "feed_ts": 1789797522, "feed_time_str": "09-19 13:58", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待日本民族本质左倾论？", "excerpt": "这种印象背后是kol和受众的双重筛选。 第一，一名整日在简中互联网上关注他国选政的人，什么日政韩政美政欧政圈，那他的平均画像就是“一名认同德先生的偏向全球主义和国际主义的左翼”。如果你不在各种程度上相信德先生，那你为什么要关注他国的选举？ 如果你不在各种程度上认可全球主义，那别国选了谁谁谁跟你（kol）和我（粉丝）有什么关系？你出来布道些什么？ 对于广大温和保守民族主义的中国人来     if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

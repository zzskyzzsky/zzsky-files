告还放出了一个不那么像产品发布的数据点。7 月 20 日后，OpenAI 因研究环境安全问题暂停并加固了用于训练的容器服务；随后针对 Astra 的更严格安全要求，使相关 RL 实验需要在更高安全等级的环境里运行。", "excerpt": "OpenAI首次公开数据：agent如何加速AI研发OpenAI 第一次把研究组织内部的 agent 使用数据拿出来讲。到 2026 年 8 月中旬，按标准 8 小时工作日换算，研究组织每投入 1 个“人类工作日”，同时运行的 coding agents 已累计到 3.1 个 agent 工作日。这不是说每位研究员都多了 3.1 个替身。它衡量的是全组织 agent 的总运行时长，也不等于科研产出", "url": "https://www.zhihu.com/pin/2080486274864096185", "votes": 0, "comments": 0, "feed_ts": 1788806601, "feed_time_str": "09-08 02:43", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价9月7日，美国一架波音767降落事故，起火燃烧？随着经济下行这种事故会不会越来越多？", "excerpt": "省流：盲目蛮干速度没事，大一点没事高度高了吧？都到跑道头了下降率太高啦！！！FR24数据显示，神人机组的进场速度 高达感天动地的180节：这是什么概念呢， 这个东西是175节（前提是你的吹气襟翼工作正常）：作为参考，763F正常襟翼30重载进近情况下VREF应该是145节， 真·速度大一点没事到跑道道面末端时， 速度还有整整98节：而着陆使用的跑道30/12是迈阿密机场第三长的跑道，长度2,853", "url": "https://www.zhihu.com/question/2080128143264952864/answer/2080265541617562578", "votes": 626, "comments": 52, "feed_ts": 1788806328, "feed_time_str": "09-08 02:38", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "一年发电500多亿度，来看看正在建设的太平岭核电站", "excerpt": "一年发电500多亿度，来看看正在建设的太平岭核电站", "url": "https://www.zhihu.com/pin/2080484126419841146", "votes": 0, "comments": 0, "feed_ts": 1788806069, "feed_time_str": "09-08 02:34", "category": "pin", "cat_name": "想法动态"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "古人是如何克服古法编程中那么多负反馈的？", "excerpt": "明明 Vibe Coding 才全是负反馈吧，古法编程也有点，但是不多，绝大多数时候都是正反馈。 古法编程有点像是魂系游戏，进门先死个 50 次很正常，你要说劝退确实挺劝退的，但是注意这并不构成负反馈。 受挫不是负反馈，至少，你知道自己错在哪。 游戏里每个怪物的攻击范围，判定帧，这个都要你打了才知道，该躲就躲开。 初见杀也很正常，下次避免就行。 知错能改，善莫大焉。 没有人是生而知之的，有谁从学编", "url": "https://www.zhihu.com/question/2075563449472630795/answer/2080481967791943696", "votes": 69, "comments": 3, "feed_ts": 1788805555, "feed_time_str": "09-08 02:25", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "黄仁勋：AGI已来，10万+NVLink72训练Astra黄仁勋（Jensen Huang）说“AGI 已到来”时，GPT-6 Astra 训练用了“约 100K+ NVIDIA Grace Blackwell NVLink72”，接下来还有 40 万块 GPU 要上线。把它和 OpenAI 对 Astra 的官方成绩放在一起看，信号很直白：下一代模型竞争正在延伸到超大规模训练与部署集群能否持续、稳定地运行。Grace Blackwell NVLink72 到底是什么Grace Blackwell NVLink72是 GB200 NVL72 机架级系统：一个液冷机架里放 36 颗 Grace CPU、72 块 Blackwell GPU，再用 NVLink 把 GPU 高速互联起来，适合把大模型训练分布到很多 GPU 上协同执行。Abilene为什么会出现在这条帖里黄仁勋回复的是 Crusoe CEO Chase Lochmiller。Chase 前一天庆祝 OpenAI，并把 Abilene 称作“AGI 的诞生地”。他的后续回复补充：园区 8 栋楼里已有 6 栋运营，剩余 2 栋预计年底前全面投运。这条帖是在给一个正在扩建的数据中心现场背书：模型能力之外，训练和部署的物理基础设施正在成为产品竞争的一部分。OpenAI 和 NVIDIA 仍在把下一阶段的算力供给往更大规模推。短期看，Astra 的实际可用能力和价格是否兑现更重要；长期看，谁能稳定运营这种规模的集群，谁就更可能拿到下一轮模型迭代的主动权。", "excerpt": "黄仁勋：AGI已来，10万+NVLink72训练Astra黄仁勋（Jensen Huang）说“AGI 已到来”时，GPT-6 Astra 训练用了“约 100K+ NVIDIA Grace Blackwell NVLink72”，接下来还有 40 万块 GPU 要上线。把它和 OpenAI 对 Astra 的官方成绩放在一起看，信号很直白：下一代模型竞争正在延伸到超大规模训练与部署集群能否持续、", "url": "https://www.zhihu.com/pin/2080481524265259845", "votes": 0, "comments": 0, "feed_ts": 1788805478, "feed_time_str": "09-08 02:24", "category": "pin", "cat_name": "想法动态"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "半导体包括什么？芯片和半导体的关系？看完视频别忘了点个赞", "excerpt": "半导体包括什么？芯片和半导体的关系？看完视频别忘了点个赞", "url": "https://www.zhihu.com/pin/2080476828406494125", "votes": 0, "comments": 0, "feed_ts": 1788804329, "feed_time_str": "09-08 02:05", "category": "pin", "cat_name": "想法动态"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "2个元件，构成了非常巧妙的逻辑，CPU灵魂所在触发器这种东西就逻辑而言，感觉没什么伟大的，但是很多个触发器组合在一块，结果会超乎你的想象！", "excerpt": "2个元件，构成了非常巧妙的逻辑，CPU灵魂所在触发器这种东西就逻辑而言，感觉没什么伟大的，但是很多个触发器组合在一块，结果会超乎你的想象！", "url": "https://www.zhihu.com/pin/2080475321070105304", "votes": 0, "comments": 0, "feed_ts": 1788803969, "feed_time_str": "09-08 01:59", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价汤家凤邀请胡锡进公开辩论？二人关于英语主科地位的分歧点在哪，你支持谁？", "excerpt": "这场辩论一开始，老胡就输了！ 人家汤家凤提倡的是英语退出主科，而不是不学英语。 这个 ts": 0, "feed_ts": 1788800789, "feed_time_str": "09-08 01:06", "category": "pin", "cat_name": "想法动态"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "2026年，现在的楼市，可以抄底吗？", "excerpt": "上海已经可以买下东京+纽约了 ", "url": "https://www.zhihu.com/question/2043824232816194895/answer/2078113636283950202", "votes": 139, "comments": 14, "feed_ts": 1788798402, "feed_time_str": "09-08 00:26", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "为什么人一旦开窍了就变得特别厉害？     当年天涯有个帖子，楼主说自己四十岁那年突然&#34;开了窍&#34;，之后三年赚的钱比前二十年加起来还多，人际关系反而越来越简单。底下跟了三千多楼，有人骂装神弄鬼，有人看完默默收藏。人这一生，有五次开窍。每一次开窍，都是一层皮蜕下来，血淋淋的，但蜕完之后，你看世界的眼光就彻底变了。第一次开窍，叫祛魅。没开窍之前，你把所有人都放在神坛上。领导、大佬、专家、有钱人，甚至隔壁混得好的发小，你见着他们，腰杆自动矮三分。不是他们真的多厉害，是你心里先跪了。祛魅之后你才明白，这个世界就是个巨大的草台班子。那些看起来光鲜的人，扒开来看，全是漏洞。你也会紧张，也会犯错，也会半夜焦虑得睡不着。你和他之间，差的不是智商，是信息差和胆量。从这一天起，你可以和任何人平视对话。饭局上不再抢着倒酒，会议上不再急着证明自己，遇到大人物，心里就一句话：&#34;大家都是人，谁也别吓唬谁。&#34;这一步走完，你的社交能耗降低百分之八十。第二次开窍，叫忘情。注意，不是绝情，是忘情。绝情是逃避，忘情是看透。你开始明白，这世上所有的情感绑架，本质上都是价值交换的遮羞布。父母说&#34;我养你这么大&#34;，可能是在索取控制感；朋友说&#34;咱俩这交情&#34;，可能是在铺垫借钱；恋人说&#34;我离不开你&#34;，可能是在绑定你的付出。你不是没有感情了，而是感情不再替你拍板。你做每一个决定，先问价值，再问感受。该给的给，该断的断，该演的戏，配合演完就散场。很多人卡在第二层，因为他们把&#34;重感情&#34;当成了美德。殊不知，在成年人的世界里，没有边界的感情，是最大的负债。第三次开窍，叫归己。这是最痛苦的一层，因为你会经历一段彻底的虚无。你发现升职加薪没意思，买房买车没意思，结婚生子也没意思，甚至以前追逐的梦想，都像别人写好的剧本。你会问：&#34;我做这一切，到底是为了什么？&#34;恭喜你，到这儿才算真正开始活。因为你终于从&#34;别人希望我怎样&#34;里挣脱出来，回到了&#34;我自己想怎样&#34;。世上之事本无意义，意义是你自己贴上去的。有人贴功名利禄，有人贴老婆孩子热炕头，都没错。但关键是，这标签得你自己贴，不能让别人代劳。这个阶段的人，开始做一些&#34;没用&#34;的事——发呆、散步、看云、陪猫。外人看来颓废，只有自己知道，那是灵魂在归位。第四次开窍，叫泯生。到了这一步，你已经跳出了&#34;我&#34;这个躯壳。你站在一个更高的维度看众生，就像看蚂蚁搬家。你一眼就能看穿一个人的结局——他现在的贪婪、恐惧、执念，会把他的命运推向哪里。不是你会算命，是你终于看懂了人性这台机器的运转规律。你看到有人为几千块撕破脸，你知道他这辈子也就这样了；你看到有人忍辱负重闷声发财，你知道他迟早会站起来。万物在你眼里都是草芥，不是轻蔑，是悲悯。因为你明白，生老病死、爱别离、求不得，都是程序设定，谁都逃不掉。第五次开窍，叫回归。这是最反常识的一层。你以为看透一切的人会冷漠、会厌世？恰恰相反。他变得柔软、感恩、甚至有点&#34;傻&#34;。他感激清晨的阳光，善待送外卖的小哥，惊叹路边野花的倔强。因为他知道，这一切的呈现与发生，都是奇迹。他经历了虚无主义的深渊，又从深渊里爬了出来，手里攥着的不是仇恨，是慈悲。他看透了结局，所以更珍惜过程。这个阶段的人，不急着证明自己，不忙着世界，只是从容地、认真地，剩余的日子走完。像看一场已经知道结局的电影，依然为中间的剧情鼓掌。为什么开窍的人变得特别厉害？因为他不再内耗了。以前他的能量，百分之七十耗在自卑上，百分之二十耗在纠结人际关系上，百分之十耗在追名逐利上。开窍之后，这些全部清零。他的能量只干一件事：按自己的节奏，把该干的干了。一个没有任何内耗的人，专注起来是很可怕的。最后送一句话，当年那个天涯楼主写的——&#34;人不是慢慢变老的，是一瞬间变老的；人也不是慢慢变厉害的，是开窍那一刻，突然厉害的。&#34;   当年那些真正讲透人性、讲透规则的神贴，大多被埋没删减无人整理。真正能看透规律、落地改命的顶级思维，从来都藏在小众的隐学圈层里。#开窍 #生活是我的诗意底稿 #认知祛魅 #人生觉醒 #回归自己 #人性规律 @知乎直答 ", "excerpt": "为什么人一旦开窍了就变得特别厉害？     当年天涯有个帖子，楼主说自己四十岁那年突然&#34;开了窍&#34;，之后三年赚的钱比前二十年加起来还多，人际关系反而越来越简单。底下跟了三千多楼，有人骂装神弄鬼，有人看完默默收藏。人这一生，有五次开窍。每一次开窍，都是一层皮蜕下来，血淋淋的，但蜕完之后，你看世界的眼光就彻底变了。第一次开窍，叫祛魅。没开窍之前，你把所有人都放在神坛上。领导、大佬、专家、", "url": "https://www.zhihu.com/pin/2079815858122126631", "votes": 0, "comments": 133, "feed_ts": 1788798047, "feed_time_str": "09-08 00:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待 2026 年 9 月 7 日 A 股市场行情？", "excerpt": "还是重点放在前面，供大家参考： （1）A股光通信再次强势上涨，技术上持续反弹的条件出现，未来几周关注能否突破关键阻力位，120日均线和60日均线都很关键。 （2）传统板块技术上超买特征也已经出现，跷跷板行情可能再次出现。 （3）日韩股市是A股的先遣服，韩综指已经尝试冲击120日均线，未来几天要多多关注。 纳指期货今天白天也站上均线上方，后面要看能否站稳。 整体上科技板块出现做多动能，需要小心量化突", "url": "https://www.zhihu.com/question/2080228424665273519/answer/2080292350207836918", "votes": 104, "comments": 30, "feed_ts": 1788797816, "feed_time_str": "09-08 00:16", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "秦军的勇敢并不是真正的勇敢，对吗？", "excerpt": "评论区有人提到魏武卒，我解释一下魏武卒与秦军的区别。 从战斗力上来讲，魏武卒是当时神州大地上最强战斗力（不知道和同时期的希腊重装步兵相比如何），而秦军不仅击败了魏武卒，而且横扫了东方六国，但是魏武卒与秦军组建方式有很大不同。 魏武卒之所以强大，看看其选拔标准就行了： 能够使用长戈、铁剑、弓弩战斗，能够在半日之内，携带三属之甲、十二石强弩、50支箭矢、长戈、铁剑、盾牌及三日粮草，负重前行百里（约合现", "url": "https://www.zhihu.com/question/1930978138965386120/answer/1932479338227437764", "votes": 4403, "comments": 646, "feed_ts": 1788796798, "feed_time_str": "09-07 23:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "GPT-6 都可以自动化电脑操作了，那我以后是不是可以划划水、多喝点咖啡了就行了？", "excerpt": "唉，沉痛怀念写一行 Java 喝一杯咖啡的悠闲古法时光。 现在程序员都已经给你打样了，把工作都交给 AI，完全 Agentic 化以 意识到的事情： ESP32 最有意思的地方，其实不是它能控制硬件，而是它可以“自己成为网络里的一个设备”。 我真正理解这一点，是在自己做了一个项目之后。 我用 ESP32-C3 做过一个小设备，叫 AirBridge —— 一个不需要互联网的文件传输设备。 一、事情的起因其实很普通 当时在调试设备，经常遇到一个很现实的问题： 现场没有外网； 手机拍的照片要传", "url": "https://www.zhihu.com/question/68679564/answer/2008843358353773169", "votes": 161, "comments": 28, "feed_ts": 1788795980, "feed_time_str": "09-07 23:46", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "哪句话让你突然沉默了很久?", "excerpt": "大学心理课上，老教授问：“哪位同学能解释什么是良心？” 同学们面面相觑。后排一个数学系的男生来陪女朋友旁听，正在开小差，教授叫他起来回答，前排同学等着看笑话。 那位同学答：“良心是我心里一个三角形的东西。我没有做坏事，它便静静不动；如果我干了坏事，它便转动起来，每个角都把我刺痛；如果我一直干坏事，每一个角都磨平了，也就不觉得痛了。” ", "url": "https://www.zhihu.com/question/612410563/answer/3263017270", "votes": 77605, "comments": 695, "feed_ts": 1788795111, "feed_time_str": "09-07 23:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么土耳其在二战中不加入轴心国，入侵希腊，重建奥斯曼帝国？", "excerpt": "仁兄，这其实是二战中，一个很有意思的“看上去机会绝佳，实际上土耳其根本不想接这个盘”的问题。1941年前后，如果只看地图，形势确实对土耳其很诱人：德国横扫巴尔干，希腊被打垮，英法势力衰退；土耳其似乎完全可以从东色雷斯杀进希腊，甚至一声喊“我奥斯曼又回来啦”。但问题在于——凯末尔建立的新土耳其共和国，恰恰是以放弃奥斯曼帝国式扩张为重要前提的—最根本的一点：土耳其已经不想当奥斯曼帝国了。 这点是非常关", "url": "https://www.zhihu.com/question/353914170/answer/2080194194279248633", "votes": 259, "comments": 26, "feed_ts": 1788794787, "feed_time_str": "09-07 23:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "这哥们儿一个人闷声干了件狠事：把全网最好的物理教科书搞出来了，还全免费。他叫 Bartosz Ciechanowski，以前是个 iOS 工程师，周末不打游戏不摸鱼，拿来写物理、数学、工程的交互文章。打开那篇讲机械表的，你能拖着转、拉滑块看表壳褪掉、亲手上发条，还能把时间放慢看擒纵机构咔哒咔哒。全是浏览器里实时跑的 3D，一个视频都没有。月球潮汐、GPS 卫星、内燃机、自行车怎么保持平衡，他都做了。每篇几千字，几十个手写代码的图。没出版社，没大学，没公司，一个人业余时间干的，还不放广告不搞付费墙。🔗 ciechanow.ski说句实在的，这质量比一年收你几万刀的大学强多了。", "excerpt": "这哥们儿一个人闷声干了件狠事：把全网最好的物理教科书搞出来了，还全免费。他叫 Bartosz Ciechanowski，以前是个 iOS 工程师，周末不打游戏不摸鱼，拿来写物理、数学、工程的交互文章。打开那篇讲机械表的，你能拖着转、拉滑块看表壳褪掉、亲手上发条，还能把时间放慢看擒纵机构咔哒咔哒。全是浏览器里实时跑的 3D，一个视频都没有。月球潮汐、GPS 卫星、内燃机、自行车怎么保持平衡，他都做了", "url": "https://www.zhihu.com/pin/2080242904245839359", "votes": 0, "comments": 30, "feed_ts": 1788794713, "feed_time_str": "09-07 23:25", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "研究生卖黄金所得 12.4 万被跨省冻结，为啥两地警方认定会产生分歧？账户为何迟迟无法解冻？", "excerpt": "一堆高赞在那里瞎扯淡，没有办过刑事案件，甚至可能连派出所都没有进过在那里瞎扯湖南 ‍♂️要这么做。 湖南这边的做法就是错的，甚至是违法，天王老子来了他也是错的。 这种做法不止湖南其他地方也一样，上周我就接到了一个关于南京 ‍♂️冻结资金的情况。 南京 ‍♂️的回答可以代表全国的 ‍♂️的做法，全国都是这么处理： “我辖区里面出现了被诈骗的被害人” “我们发现涉诈资金流入了你的账户，为了办案需要我要", "url": "https://www.zhihu.com/question/2079929558245925997/answer/2080285177243345286", "votes": 1027, "comments": 116, "feed_ts": 1788794469, "feed_time_str": "09-07 23:21", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "平凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "DS继续求贤若渴", "excerpt": "DS继续求贤若渴", "url": "https://www.zhihu.com/pin/2080430791541235896", "votes": 0, "comments": 0, "feed_ts": 1788793354, "feed_time_str": "09-07 23:02", "category": "pin", "cat_name": "想法动态"}, {"actor": "DefTruth", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "[代码学习] Cache-DiT：复用重复计算，加速 DiT 推理", "excerpt": "Diffusion Transformer，也就是 DiT，已经广泛用于图像和视频生成。 它的效果很好，但推理很慢。 生成一张图片通常需要经过 20 到 50 个去噪步骤。每个步骤都要完整运行一次Transformer，而 Transformer 内部又有几十个 blocks。 问题在于：相邻去噪步骤的输入虽然不同，中间特征却往往很接近。标准推理仍会重新计算所有 blocks，产生了大量重复计算。", "url": "https://zhuanlan.zhihu.com/p/2076292600013788819", "votes": 2, "comments": 0, "feed_ts": 1788793191, "feed_time_str": "09-07 22:59", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "DefTruth", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "深入浅出 Cache-DiT（详解版）：让扩散模型「少算几步」也能出好图", "excerpt": "0. 一句话版扩散模型（Diffusion Transformer，DiT）出图要跑几十次「去噪」，每次都要完整跑一遍 transformer。Cache-DiT 的观察是： 相邻去噪步的中间特征高度相似，所以可以缓存中间结果，相似时直接复用，从而跳过大量重复计算、大幅提速。1. 先搞懂：扩散模型为什么要「一遍一遍」算扩散模型生成图片，是从 一张纯噪声图开始，一步步去噪，最后变清晰：t=50（纯噪", "url": "https://zhuanlan.zhihu.com/p/2077434592345187909", "votes": 3, "comments": 0, "feed_ts": 1788793083, "feed_time_str": "09-07 22:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "hades", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "LPL2026赛季2026赛季季后赛AL 0:3 BLG，如何评价这场比赛？", "excerpt": "实话是，大概率进决赛的还是al，然后被blg吊打，ig有机会赢al，但大概只有四成胜率，前提还要先过原神。 事实并非al太弱，而是blg太强，al的强度大概是t1队伍，和lck四号种子差不多。blg现在展现的东西比msi那支blg强，viper状态的回归使得blg补上了下路体系缺乏的短板。这绝对是23年崛起以来的最强blg，比24年亚军那支还要强。 至少现在状态看，比lck前三都要强半档。就季后赛", "url": "https://www.zhihu.com/question/2080327611264275708/answer/2080427813493020054", "votes": 24, "comments": 10, "feed_ts": 1788792643, "feed_time_str": "09-07 22:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TopView", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "准备加仓了", "excerpt": "先说个事，央行又买金子了。今天把储备的账公布出来了，8月末黄金储备7673万盎司，一个月又加了65万盎司，折下来大概20吨。连续22个月没停过手，而且8月这一下，是最近三年单月买得最多的一回。我以为金价，我以为央行会减缓买入呢，结果跟上个月买的一样多，甚至稍微多一丢丢。 消息一出来，评论区又是一片跟着央行买黄金的声音，觉得金价要涨，这是最明确的信号。这话听着没错，但只对了一半。 我先说好， 央行买", "url": "https://zhuanlan.zhihu.com/p/2080424116025409930", "votes": 55, "comments": 3, "feed_ts": 1788791859, "feed_time_str": "09-07 22:37", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "DefTruth", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "2026年了，DIT推理优化做到头了嘛？", "excerpt": "没有。以sglang diffusion为例子列一下： 1. 先说kernel这块。截止到写基于Agent的SGLang Diffusion Kernel优化实践：Qwen-Image、FLUX.2和视频模型，sglang diffusion main分支一共注册了43个Diffusion算子和47份实现，9月6日再看已经是45个算子和51份实现了。里面也不只是LayerNorm这种常规算子，还包", "url": "https://www.zhihu.com/question/2055016811234694016/answer/2080072374460929072", "votes": 101, "comments": 6, "feed_ts": 1788791606, "feed_time_str": "09-07 22:33", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "DefTruth", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "2026年了，DIT推理优化做到头了嘛？", "excerpt": "DiT 推理优化远没做到头。更准确地说，只是 N卡上一些主流模型的常规优化逐渐成熟了，不过仍然存在很多进一步的空间，如 @BBuf所说的那样。但跨模型、跨硬件、跨部署场景的优化才刚开始。截至 2026 年，刚刚看了一下vLLM-Omni，公开主线中的国产卡有昇腾，也已经有摩尔线程 MUSA。MUSA 已接入 FlashAttention，并验证过 Qwen-Image、 20x arr multiple，这还是闭源sota模型（见： Anthropic ARR不及预期）再看同样的港股市场，minimax8月份最新公布arr 8亿美元，市值160亿，也是20x的a", "url": "https://www.zhihu.com/question/2079133150333101231/answer/2079315790319318148", "votes": 118, "comments": 7, "feed_ts": 1788781568, "feed_time_str": "09-07 19:46", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "野狼獾", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么中国不再申办奥运会？", "excerpt": "简单来说，就是，新兴大国可以花大价钱支持体育、提升国际形象，但不能花大价钱为欧洲抬轿子。 你别看奥委会天天想让中国办奥运会，中国只要说让奥委会多几个中国委员，那就比杀了他们还难受。 不用说中国，连美国在国际奥委会里面的话语权都很有限。 现任国际奥委委员一共104人（不含名誉主席、名誉委员），其中41人来自欧洲，1人来自中国，5人来自美国（含波多黎各）。 可以说，国际奥委会是欧洲一家独大的国际组织。", "url": "https://www.zhihu.com/question/266925635/answer/2080375366376599573", "votes": 823, "comments": 79, "feed_ts": 1788781204, "feed_time_str": "09-07 19:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "乔治·麦戈文和尤金·麦卡锡是一个很有意思的对照组，他们在60-70年代末的政治轨迹和思想转向折射了在新政自由主义霸权由盛转衰的历史语境下，曾经的温和自由派政治人物、思想和群体对于“新政治”的塑造，和“新政治”对他们的影响。这里谈谈更不为人所知的尤金·麦卡锡。“新政治”并非一场有明确纲领和时间线的政治运动，而是一种政治气质的聚合，它反对“旧政治”所代表的的城市机器、地方大佬和劳工组织领导层等建制派，主张将政治权力从庞大且集权的党代表大会向更加分散和多元的政治组织转移，直接授权以选民。尤金·麦卡锡的转向具有戏剧性的断裂色彩，作为一位默默无闻的明尼苏达农工-民主党后座议员，他的投票记录与大多数的冷战自由派并无显著差异，坚定地支持新政的国内政策和冷战的激烈反共主义，直到1964年的《东京湾决议》都在亦步亦趋的跟随民主党。但麦卡锡的中西部出身和天主教学术训练，塑造了他融合小镇价值观、天主教政治传统与中西部进步主义的精神气质，在他激烈变化的政治观点中，不变的是对新托马斯主义和宪政主义（以及潜在的自由意志主义）哲学的信奉，坚信道德先于党派认同的思维，追求政治行为的可论证性，对于战争中的人力牺牲高度敏感，同时坚信权力运行必须在程序上得到严格限制。麦卡锡投入“新政治”的核心是道德信念与反叛精神，这位从未被期待成为特立独行者、反叛者与和平主义者的诗人突然发现自己站在了整个党派和它长达二十年的皇帝林登·约翰逊的对立面上，并且出于对越战可能成为一场无法收场的道德和战略危机的担忧，从而发起了反战提名。麦卡锡的初选运动之所以成为“新政治”的诞生时刻，在于其动员方式、选民受众和政治风格。麦卡锡的运动高度以来自发组织的志愿者而非党派机器，从新罕布什尔初选开始的“为吉恩而清洁”，一万名嬉皮士式的大学生剃掉胡须，穿上得体的西装，挨家挨户地敲响曼彻斯特和康科德的选民家门，为他们细心地介绍麦卡锡的主张，创造了一种新的政治参与模式，即体制外的行动主义及其载体也可以以务实的理想主义姿态，通过选举政治改变局面。在麦卡锡的反政党道德主义号召下，大量的高校学生、独立知识分子、郊区白领和中小城镇居民等过去处于政治边缘的低频群体得以被动员起来，这为麦卡锡在马萨诸塞和上中西部的学术社群、北新英格兰的制造业-渔业带小镇和俄勒冈与北加州的中产白人商业郊区，这些民主党传统意义上的失语地带取得了压倒性的胜利。例如在郊区包围少数中大城市、独立公民组织发达、白人居多的俄勒冈州，在韦恩·莫尔斯和马克·哈特菲尔德两位特立独行的和平主义参议员的背书下，麦卡锡以44％对38％的比分首次重创了罗伯特·肯尼迪。麦卡锡本人的政治风格——冷静、超然、略带嘲讽的智识主义，成为了一种独特的政治声明，他寻求的不是扩大个人和政府的权能，而是将权力归还给人民，用议题、原则和良知取代看似不可逾越的党派忠诚，并证明“这个国家的人民可以被教育并做出体面的判断”。以上要素的组合使麦卡锡的竞选成为“新政治”运动的催化剂，但麦卡锡本人无意成为这一政治运动的领袖，这场运动也存在致命的局限性。首先是，麦卡锡疏离、冷漠的性格使他在媒体采访上始终以一种不情愿的、半推半就的形象示人，拒绝以煽动性的演讲调动观众们的情绪，他将大部分具体事务打包给竞选经理阿拉德·洛温斯坦，在集会活动上，当支持者们以热烈的掌声欢迎麦卡锡时，他往往会觉得不自然和害羞，进而不发一言，或者念诵一段他的诗句结束亮相，这对于不了解他的围观群众来说无疑留下了一个负面的印象，尤其是1968年初春罗伯特·肯尼迪参加初选之后，这位笑容甜美、气度不凡的蓝血王子以热情、投入、充满激情和能量的个性，掩盖了麦卡锡在初选中的光芒。麦卡锡对于选民的覆盖能力非常一般，他的核心支持者局限于年轻、受教育、收入偏高且以议题为导向的新锐精英，与那些同新政法团经济秩序联系不严密、位于核心地带边缘的群体，这两类选民与自由派的知识分子和改革派政党活动家构成了麦卡锡选民的三角支撑。与之相反，罗伯特·肯尼迪对于工会蓝领、工薪阶层、黑人和拉丁裔群体和城市族裔民主党的吸引力则是这一时期任何政客都难以匹敌的，在加州决定性的初选中，麦卡锡甚至席卷了南加州的橙郡这样的保守县份，但肯尼迪仍然以城市和边境地带的大量“有色选票”填补了他在中产阶级中的空缺，最终击败了企图恢复势头的麦卡锡初选运动。麦卡锡的反叛本质上是个人化的道德远征，他的竞选更多是关于“国家灵魂”的辩论，而非关于政策细节的争论，他没有对那些未决定选民最关心的问题给出回应，对于民权和城市危机称得上是漠不关心，而肯尼迪则以全国和解为纲，针对性地提出了削减支出、精简福利与打击犯罪的措施，以至于尼克松和里根在看到他的政策简报后都忍不住惊呼他滑到了共和党的右侧。在对外政策上，麦卡锡除了单薄的反战神主牌，以及一个笼统的“八点和平计划”，再难拿出明确的解决方案，这种漏洞在罗伯特·肯尼迪遇刺后被休伯特·汉弗莱和建制派阵营利用，批评麦卡锡是一位侈言和平的空想主义者，这种刻板印象在当年夏天苏联加紧对捷克斯洛伐克的入侵后进一步加深了。但麦卡锡留给美国政治的深远影响，不只是1970年之后的选举制度改革和自由主义范式的转换，更是他以行动证明了自己的信念伦理，借用卢跃刚在某本传记的话，麦卡锡真正可贵的地方在于，他没有同建制派的各种委员会委曲求全，尽可能的折中实现自己阵营的诉求，也没有借自己支持者的血作英雄式的振臂一呼，给所有孱弱而无望的心灵一点寄托，更没有像寻常政客一样退而求其次，检讨、苟且、自污，而是选择自我放逐，以独立的人格实现了自由主义的再思与自我拯救。", "excerpt": "乔治·麦戈文和尤金·麦卡锡是一个很有意思的对照组，他们在60-70年代末的政治轨迹和思想转向折射了在新政自由主义霸权由盛转衰的历史语境下，曾经的温和自由派政治人物、思想和群体对于“新政治”的塑造，和“新政治”对他们的影响。这里谈谈更不为人所知的尤金·麦卡锡。“新政治”并非一场有明确纲领和时间线的政治运动，而是一种政治气质的聚合，它反对“旧政治”所代表的的城市机器、地方大佬和劳工组织领导层等建制派，", "url": "https://www.zhihu.com/pin/2080308431961986924", "votes": 0, "comments": 0, "feed_ts": 1788780551, "feed_time_str": "09-07 19:29", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "估计什么时候人类能实现AGI?", "excerpt": "我严重怀疑，就目前模型来到10T闯关，功耗轻松来到GW级别，依然还不如人类20w的大脑同功率并联，目前的AI全靠知识库与能接入电路显得相对聪明与吞吐量高 最顶级的AI依然是内测封神，只要一公开被各路程序员使用后就阿黑颜流口水，智力下降 更别提一堆顶尖AI专家也说不清AGI路线怎么走，目前依然处于穷举法盲人摸象阶段 目前AGI困难，有三种可能 第一，我们人类在AGI路线上错了，就好像19世纪末期人类", "url": "https://www.zhihu.com/question/2033590666824038016/answer/207991 s": 1788778950, "feed_time_str": "09-07 19:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小德", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "民国的遗憾到底是什么？", "excerpt": "说说我爷爷的遗憾吧。 我爷爷生于1934年，山东人，我小时候他跟我说，他一生最难忘的日子之一就是日本投降的那一天。 日本投降的时候，他没有喜悦，只有无穷的愤怒。 因为鬼子来我们这里杀了这么多人，我们还没有办法报仇，他们说一句“不打了”就可以若无其事的回国。 1944年年底的时候，盟军已经登陆法国西海岸，红军已经打到了东普鲁士，而太平洋战场上，冲绳战役即将打响。此时国军还打出了豫湘桂大溃败的耻辱战绩", "url": "https://www.zhihu.com/question/662126970/answer/2076854568843995123", "votes": 8, "comments": 9, "feed_ts": 1788778921, "feed_time_str": "09-07 19:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么这代孩子心中会压抑着那么多的愤怒、怨恨？", "excerpt": "这个问题我看了很久。也看到很多人的回答，有从教育制度讲的，有从经济环境讲的，有从社会转型讲的。都说得通，都有一点道理。但我总觉得那些回答里少了一点什么。少一种更具体的东西，少一种你在生活里能摸到、能听见、能感觉得到的东西。我没什么大道理，也不怎么懂那些大的词。我就想从我这个位置，说说我看到的一些人。 我见过很多男人，各种年龄的都有，二十出头的，三四十的，五十多的。你不跟他们聊，永远不知道他们心里…", "url": "https://www.zhihu.com/question/1973289911340773706/answer/2077845154967439221", "votes": 12104, "comments": 1563, "feed_ts": 1788778860, "feed_time_str": "09-07 19:01", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "财政部将向中国工商银行等八家金融央企增资共计 3600 亿元，如何解读？", "excerpt": "我说一个和所有人分析都不太一样的逻辑好了。 大家现在复盘这几年的市场就能看懂一个问题： 过去几年真正能持续上涨、能走出波段行情的板块，全部都是需要融资、需要资本输血的赛道，比如科技、双创、成长股。 而反过来讲： 但凡不需要融资、不需要补资本的行业，除非业绩确实爆炸，否则基本没有大行情，全程都是震荡阴跌。 那按照这个逻辑，大家会发现一个特殊板块： 那就是银行。 就可能有投资小白会认为，银行股息那么高", "url": "https://www.zhihu.com/question/2079970428131468554/answer/2080365961224402470", "votes": 377, "comments": 30, "feed_ts": 1788777897, "feed_time_str": "09-07 18:44", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "星宇股份就调岗减员错误道歉，107名同学中已入职新单位71人，哪些细节值得关注？能挽回口碑吗？", "excerpt": "我跟大家聊个点，为什么不同企业对待舆论的态度差距会拉得特别大。 其实根源来自企业业务属性的区别。 如果你做的是To C业务，直接面向普通大众做生意，那你就被迫必须强化舆论应对的能力。 逻辑很简单，消费者对你体验不满意，随时可以发声，舆情很容易发酵扩散。 就像某知名西北餐饮品牌，面向海量普通顾客，口碑、网络评价直接会传导到门店营收，其实应该做的，是保护民意，而不是对抗民意。 但是有两类生意，其实不需", "url": "https://www.zhihu.com/question/2080275917230666123/answer/2080364605960876237", "votes": 133, "comments": 15, "feed_ts": 1788777573, "feed_time_str": "09-07 18:39", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "腾讯技术工程", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Agent 是怎样长出 Harness 的：从一次模型调用到完整运行时", "excerpt": "作者：ivanxxie、davoszhang 今天的 Agent 系统看起来很像一套小型操作系统：它们管理子 Agent 进程，维护长期记忆文件，通过工具驱动接触外部世界，还要处理权限、隔离、恢复和观测。可它们的起点并不宏大。最初，开发者手里只有一个把输入映射为输出的语言模型。 复杂性并不是一次设计出来的。每当模型试图越过一次调用的边界，系统就必须在模型外面增加一个新部件：模型不知道此前聊了什么，", "url": "https://zhuanlan.zhihu.com/p/2080297668425814719", "votes": 30, "comments": 1, "feed_ts": 1788777487, "feed_time_str": "09-07 18:38", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "时予", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么礼貌拒绝火车上情侣换座位?", "excerpt": "倒不是高铁，是灰机，郑州飞深圳那一段，因为习惯，所以在上飞机前就在携程预订了飞机靠前和过道的座位，然后刚上飞机，就发现座位上坐着一个男生和中间座位的女生在说话，因为不能妨碍别人登记我就站在座位那边反复确认登机牌，确认无误后就感觉很奇怪就去问： 我：“你好，不好意思这好像是我的位置，您是不是坐错了” 男生：“………………” 然后他旁边的女生说话了：你好，我们没有买到一起的座位，可以和我们换个座吗？ ", "url": "https://www.zhihu.com/question/37088078/answer/3357817705", "votes": 10632, "comments": 301, "feed_ts": 1788777476, "feed_time_str": "09-07 18:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "时予", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "河北的张飞是杀猪的，山西的关羽是卖枣的，他们在哪学的武艺？", "excerpt": "在十多年前，防疫管的还没现在严的时候，农村家庭杀年猪都是把屠夫请到家中操作 天还没亮，农户就把草把子和柴火准备好码放在熏黑的老式草灶边上，给肥猪烧上一大锅的剃毛水 水是村里公用的井水，腊月的清晨从水井里打起来还冒着热气，打上两桶水用酱红色的竹扁担挑回家。 女主人已经在家把灶烧好，生锈的铁锅里烧的小半锅水已经氤氲的冒着热气，这是肥猪最后的早餐 这一顿，女主人会给肥猪吃上猪生以来最好的一餐，米糠伴上头", "url": "https://www.zhihu.com/question/426938125/answer/1590693420", "votes": 27585, "comments": 1292, "feed_ts": 1788776856, "feed_time_str": "09-07 18:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "速度暴涨2000%！1位菲尔兹奖得主+12位博士，让AI学会“神交”一个俄罗斯团队成立仅4个月，就冲上ARC AGI 3 榜单第一名。他们拿753B参数的GLM-5.2和4B参数的Qwen-3.5做了实验，中间训练一座负责“翻译”的小桥，把GLM内部的隐藏状态直接传给Qwen。连接之后，整套系统的运行成本只有完整GLM模型的二十分之一，结果准确率能达到80%左右。", "excerpt": "速度暴涨2000%！1位菲尔兹奖得主+12位博士，让AI学会“神交”一个俄罗斯团队成立仅4个月，就冲上ARC AGI 3 榜单第一名。他们拿753B参数的GLM-5.2和4B参数的Qwen-3.5做了实验，中间训练一座负责“翻译”的小桥，把GLM内部的隐藏状态直接传给Qwen。连接之后，整套系统的运行成本只有完整GLM模型的二十分之一，结果准确率能达到80%左右。", "url": "https://www.zhihu.com/pin/2080359882075723026", "votes": 0, "comments": 0, "feed_ts": 1788776484, "feed_time_str": "09-07 18:21", "category": "pin", "cat_name": "想法动态"}, {"actor": "时予", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "河北的张飞是杀猪的，山西的关羽是卖枣的，他们在哪学的武艺？", "excerpt": "服役期间，有一次，印度人四五百人，凌晨4点多，悄悄地摸了上来，接观察哨传消息给连长，然后交涉无果，印度人仗着人多势众起了冲突，我和战友们一边穿衣服，一边操着家伙事儿冲出去时，现场已经一片混乱。 那些印度人都长得人高马大的，有很多身上的疙瘩肉都一块一块的。印度人特别喜欢仗着人多起哄，刚开始一看我们这边出于国家形象和外交礼仪，客客气气的和他们交涉，结果人家压根不吃你这一套，挥着棍子，直接就往我们这边战", "url": "https://www.zhihu.com/question/426938125/answer/2079859480532095120", "votes": 6700, "comments": 534, "feed_ts": 1788776422, "feed_time_str": "09-07 18:20", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "超越CRISPR？基因调控新利器TIGRa：体积小、效率高，在体内发挥作用", "excerpt": "编辑丨coisini 精确调控人体内部基因表达能力，即增强保护性基因并抑制有害基因，在疾病治疗和预防方面具有巨大潜力。然而，用于调节基因的标准分子工具，如 CRISPR 系统，由于体积过于庞大，难以包装并递送到人体细胞中。 为此，来自斯坦福大学医学院等的研究团队开发了一种超紧凑型基因激活工具 ——TIGRa，堪称「旅行装」基因工具。其小巧程度足以使其短小的 DNA 指令被包装进病毒载体。 研究论文", "url": "https://zhuanlan.zhihu.com/p/2080359423034254460", "votes": 2, "comments": 0, "feed_ts": 1788776378, "feed_time_str": "09-07 18:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "颜水成团队重磅发布VoiceMem,提出「流式双脑架构」打造下一代实时交互基础设施", "excerpt": "科幻早就预演过这一天，而这两年 AI 的真实进展，正把它推成一个可讨论的命题：AI 或许不会停在「工具」上，而会成为与人类共生的存在 ——AGI Being。 共生的第一道门槛，是能跟人实时说话。这是 GPT-4o、全双工模型、Interaction Model 在做的事。 但用久一点，共同的短板就浮出来：它们没有记忆。听得懂你此刻在说什么，却不知道你是谁。认识始终是单向的 —— 你越来越熟悉它，", "url": "https://zhuanlan.zhihu.com/p/2080358555119634170", "votes": 6, "comments": 1, "feed_ts": 1788776282, "feed_time_str": "09-07 18:18", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐,野狼獾", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "大家所见的军盲可以盲到哪种程度？著名的军盲梗有哪些？", "excerpt": "某著名公众人物 见了坦克就说59改 见了飞机就说歼10改 df41是原木运输车 海带可以缠潜艇 雾霾可以防激光 大概就这么个水平 ", "url": "https://www.zhihu.com/question/67885381/answer/856003063", "votes": 5234, "comments": 121, "feed_ts": 1788775576, "feed_time_str": "09-07 18:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "黄金 白银为何涨不动了？因为财长在使坏...黄金 白银为何萎靡不振，涨不动了？1》因为钱都被财长们要求去买科技股尤其是费城半导体里面的星辰大海AI股了。周五费城半导体大涨，黄金就大跌，周一（20260907），东亚半导体科技股继续反弹，那么黄金白银就继续跌，道理非常简单：市场上的钱就一套，不够用啊。拉长看（图一）：这两年的费城半导体和黄金几乎就是妥妥的反向关系。2》为何财长要这样干？之前说了，因为帝国的公司债就要爆了，是的，帝国的公司债的危险程度比帝国的长天期国债的危险程度大得多（见附图2 附图3）.财长的屁股下的位子就是这帮子科技巨头们拱上来的，你说，债就要爆了，这债的规模可比2008年金融海啸厉害得多了，2008年只是倒了一家雷曼而已，现在？你看看：谷歌 微软 meta 亚马逊...个个一屁股债，自由现金流基本上都是负的，那个刚上市的SpaceX，不用看，更差，连卖铲子的英伟达都在发债呢...帝国的10年期国债收益率在4.9%左右，你说你发公司债，利率没个6% 7%会有人买么？问题是科技巨头们寅吃卯粮，而他们弄的那些AI大模型都还在赔钱...你说，巨头们能不急么？财长们能不急么？华尔街群狼们能不急么？赶紧把手里的费城半导体的票卖给你，换成美元，好去公司债那边顶一下啊。对吧？如果你是一个勇猛无畏 乐于奉献的科技股ETF飞蛾，请，财长们正在号召呢，请君入瓮...没事，赔光了也不丢人，毕竟是为了人类的星辰大海事业做了贡献...3》市场没钱么？其实，市场本来是有不少钱的...帝国的债务都40万亿了，这40万亿是债，换来的是40万亿的美元，这40万亿的美元够花么？不够啊，要不，那么赚钱的科技巨头们为什么要高利率发债？财长在2025年4月大拉星辰大海科技股，连涨8个月...2026年3月又大拉星辰大海科技股，纳斯达克13连涨，费城半导体18连涨，你都忘记了么？（关于财长的手段，另一篇讲，防止被...）。问题是，作弊，喝多巴胺很爽，你过一段就来这么一次，那就是吸毒啦。财长，你在吸毒，知道么？钱都被你霍霍光啦。这次财长连续屠杀日元空头，多巴胺上头了，强硬要求大小主力们把钱不要去炒作黄金白银 基本金属 数字货币 农产品，而要去买星辰大海AI科技股，要把费城半导体拉上去，要让帝国的公司债能平安着陆。问题是，费城半导体里面基本上都是些本梦比的票，除了科技巨头们把钱拼命砸的几家搞内存 闪存 做芯片的公司，稍微牵扯到应用端的公司，都是一地鸡毛...股票炒的都是预期，财长你就说吧，你的那几家科技巨头们啥时候才能赚出来砸在硬件服务器上的钱吧？猴年还是马月？4》Fed美联储是活菩萨么？先说，总统会支持星辰大海科技股么？或许，总统不方便直接说，请到帝国采访个几个红脖子就知道了，至少，目前爆出来的，红脖子们都拼命反对把数据中心建在自己家门口，是吧？Fed美联储新主席会支持星辰大海科技股么？Fed美联储新主席今年只有56岁，Fed美联储新主席的任期有多少年？目前天量的科技巨头们搞出来的公司债，40万亿的国债和Fed美联储新主席有个鸡毛关系？那Fed美联储新主席为何会在此刻消尖了脑袋去背锅？人家不都是一直说：要缩减资产负债表么？Fed美联储新主席是在放屁么？5》9月中旬，拭目以待。昨天说，财长们 华尔街群狼们 科技巨头们 火烧屁股急得满嘴泡，你买了黄金白银也很急么？你要不要等等看，看人家Fed美联储新主席有没有大放水再说？如果是我，我会等黄金回踩4000美元/ ts": 1788767249, "feed_time_str": "09-07 15:47", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "张雪峰为什么英年早逝？", "excerpt": "讲个鬼故事：可能是张雪峰赋予的灵感，官老爷要让外卖骑手健身了。 国家体育总局最新提出，要推动在外卖、快递骑手等新就业群体的工作场所、休息站点配建健身设施，引发关注。 很多网友问，骑手们工作那么累，还有时间、有力气、有心情锻炼吗？ 其实应该这么说：新就业群体相当需要体育锻炼，但囿于现实条件很难“动起来”。 体育总局推行的新举措是把资源精准送到有需求的人身边，有助于解决相当一部分新就业群体的痛点。健身", "url": "https://www.zhihu.com/question/2019998586461505514/answer/2080318667112432137", "votes": 122, "comments": 20, "feed_ts": 1788766621, "feed_time_str": "09-07 15:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "焦山闻国变，泖湖尽忠魂：记抗清义士葛麟瞿庵葛公传（丁振华）前辈葛苍公，号瞿庵，名葛麟。天资聪敏多才，相貌魁伟，身高七尺，目光明亮有神，英武气概与胆识过人。参加童子试，提笔一挥而就。县令蔡公惊讶他下笔太快，接连出题考他诗赋，写出来却如同预先构思完成一般，县令大为叹服。身为秀才，以忠义自期。当时郡守印司奇贤良遭到诬陷，葛麟徒步赶往京城，敲击登闻鼓，为他辩白冤屈。内阁大学士武陵人杨嗣昌总督军务，行事失当，葛麟又上书逐条列举他的罪状，刚直的名声震动京城。等到流寇势力猖獗，他又多次上疏陈述时政，奏疏都没有得到回复。在家喜欢著述，写古诗文，动辄数千字。追随他求学的都是当世才俊，他格外看重堂弟葛敏、章明。他常说：这两个人读书，没有市井小家子习气，将来不会做个碌碌无为的老秀才。崇祯十五年壬午乡试中举，同榜有很多知名士人：嘉定黄淳耀，同乡眭嵩年、眭明永等人最为出名；乡试第一名卢象观，是义兴（宜兴）忠烈尚书卢象升的亲弟弟，都和葛麟相交十分投合。常常摆酒高歌，畅谈天下大势，情绪悲凉愤慨，彼此相对叹息。甲申年，李自成攻破北京。葛麟当时正在焦山读书，听到噩耗，仰天痛哭。和丹徒秀才吴中奇、堂弟葛敏、章明等人谋划，邀约同社士人十多人，打算在关帝庙组建复明同盟，向远近传布檄文，约定日期竖起义旗。一时间心怀忠义之人，不约而来聚集数千人。福王在南京建立弘光朝廷，葛麟上书陈述国家大政，接连两次上书，都没有答复。那时骄横军阀于永绶、刘肇基、陈可立、张应梦带兵劫掠，来到京口。葛麟率领义勇登上城墙布防，亲自去拜见四位将领，其中三人被他大义折服，带兵退走。唯独于永绶凶横桀骜，径直进逼镇江城下，先在北固击溃镇江旧部，又在银山击败退往江上的浙江援兵。将军李大开率精锐出城救援，西门交战大败，中箭阵亡。于永绶愈发骄横，大肆烧杀抢掠，火光冲天，很多百姓投水自尽。葛麟禀告兵备张调鼐、太守钱良翰，请求出兵抵御。张调鼐等人畏惧于永绶兵威，坚决不肯。葛麟十分愤慨，联合吴中奇，率领乡绅士民，连续开大炮轰击，于永绶部下死于炮者百余人，其余部众不敢向前。葛麟随即写奏疏送往南京，又上书史可法。史可法传檄斥责于永绶，勒令他北撤。葛麟又再度上书。史可法、巡抚祁彪佳先后数十次上书论及他的事迹，史可法亲笔回信嘉奖，将他比作岳飞。御史王孙蕃也接连上疏举荐他的才干，朝廷授予他中书舍人，命他在长江沿线练兵。但只是空有名号，不能施展全部抱负。此时马士英、阮大铖把持朝政，贪财纳贿，作威作福。葛麟满心忧虑，上疏极力劝谏，洋洋数千言，依旧不予答复。马、阮二人读后大怒，催促葛麟解散他招募的义军，想要罗织罪名加害他。但是忌惮葛麟素来忠义，为时人敬重，迟迟不敢骤然下手。葛麟于是回乡，隐居在本县禹庄。没过多久南京陷落。葛麟在墙壁留下诗句，手持佩剑，带着葛敏出走，经溧阳前往广德。当时各处义兵四起，但葛麟发觉没有可以共谋大事之人。后来宜兴进士卢象观、溧阳秀才朱兴公聚集数千义兵，葛麟前来相见，众人相对悲恸。听说吴淞有人起兵，打算前去会合。顺治二年八月二十九日，清军抵达，葛麟等人率众抵抗，义兵溃散。葛麟和卢象观、弟弟葛敏一同在泖湖殉国。与此同时章明，和同乡荆硕等人在金沙游塘起兵，战败殉难。同榜举人眭嵩年，以学官身份殉节；华亭黄淳耀坚贞不屈，在嘉定殉难。以上诸人先后殉国。堂弟章明、万生等人满腔悲愤。十一月，聚集数百义兵，与荆硕合兵驻扎在游塘庙，之后向西转移到中汉皇庙，俘获清兵七人，全部处死。后来义军内部不和，章明便和荆硕分兵。章明等人在九里庙安营扎寨。二十九日，镇南将军马得功率领数百骑兵前来进攻。一名骁勇骑兵冲入庙中，章明部士兵用火铳射击，敌兵身上铠甲都被打飞。章明等人士兵刀剑向外拼死抵抗，万生拔剑自刎。章明突围向南撤退，清兵不敢紧逼。逃到旧县，部下渐渐溃散，部队又饥又疲惫。旧县当地没有粮草，清兵想要捕杀章明来向马得功邀功，但不知道章明已经脱身。他们抓获秀才葛彦簪，错把他认成章明，押送给洪承畴，将葛彦簪杀害。章明的同乡旧友周迅路过旧县，辨认出章明的遗体，就地草草埋葬。", "excerpt": "焦山闻国变，泖湖尽忠魂：记抗清义士葛麟瞿庵葛公传（丁振华）前辈葛苍公，号瞿庵，名葛麟。天资聪敏多才，相貌魁伟，身高七尺，目光明亮有神，英武气概与胆识过人。参加童子试，提笔一挥而就。县令蔡公惊讶他下笔太快，接连出题考他诗赋，写出来却如同预先构思完成一般，县令大为叹服。身为秀才，以忠义自期。当时郡守印司奇贤良遭到诬陷，葛麟徒步赶往京城，敲击登闻鼓，为他辩白冤屈。内阁大学士武陵人杨嗣昌总督军务，行事失当", "url": "https://www.zhihu.com/pin/2077285379997185522", "votes": 0, "comments": 1, "feed_ts": 1788766219, "feed_time_str": "09-07 15:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "闲鱼上面有很多“抵押车，不过户”是什么意思？可以买吗？有什么套路？", "excerpt": "我爸发小买了个4万的帕萨特，开了四年在小区被拖走了，他本人在交警队上班，晚上拖的第二天白天就找到驾驶人电话了，不知道咋操作的，人家还给他三万，相当于一万块钱开了新帕萨特四年，并且还省了以后若干年的物业费，现在物业找他收费他就让物业赔车，物业都懒得找他要了 ", "url": "https://www.zhihu.com/question/308876672/answer/2079153371123138654", "votes": 404, "comments": 21, "feed_ts": 1788765310, "feed_time_str": "09-07 15:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "hades", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "LPL2026 赛季季后赛 LGD 鏖战五局淘汰 NIP 晋级四强，如何评价这场比赛？", "excerpt": "说实话，这两个队伍打出来的比赛内容比jdg和tes强，进不去冒泡赛可惜了。", "url": "https://www.zhihu.com/question/2079986722348257468/answer/2080312968403853404", "votes": 2, "comments": 0, "feed_ts": 1788765262, "feed_time_str": "09-07 15:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "正解局", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "广东制造，增长的底气从哪里来？", "excerpt": "增长，是所有经济体最朴素也最艰难的命题。 尤其是在全球产业链深度调整的大背景下，外需波动、要素成本抬升、行业内卷加剧，不少企业陷入了焦虑：下一轮增长究竟从哪里来？ 作为改革开放先行地，广东经济总量连续37年位居全国第一，展现了强大的韧性。 2026年上半年，广东GDP同比增长4.5%，高技术制造业增长11.1%，工业机器人产量增长34.2%，新能源汽车增长48.4%，集成电路增长29.7%。进出口", "url": "https://zhuanlan.zhihu.com/p/208 const catKeys = ["ai", "gold", "geo", "pin", "other"];

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {

    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');

"cat_name": "地缘 · 经济 · 能源"}, {"actor": "大水哥", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "胖东来为什么只能在河南搞成?", "excerpt": "北京土著，新西兰留子，媳妇儿郑州，每年陪媳妇回家呆几天，对河南的整体印象断崖式暴涨。 在郑州，你能遇到的每一个陌生人对你的态度，约等于你在北京认识十年的老街坊。 同样点一杯无糖柠檬茶。 北京：“无糖做不了。” 郑州：“无糖的不好喝，我先给你打一杯有糖的，你尝尝，不好喝我再给你换。” 小卖铺老板看到要下雨。 北京：…… 郑州：“我看天气预报下午四点有雨，出门记得带雨具。” 我对毛主席发誓，亲身经历。", "url": "https://www.zhihu.com/question/5564176357/answer/1937137822889902446", "votes": 15658, "comments": 1269, "feed_ts": 1783343670, "feed_time_str": "07-06 21:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "随感2026.7.6——《帝国的外衣，民族的隐疾：以“帝国民族”概念重审梁启超“大民族主义”的内在悖论》读后感", "excerpt": "帝国的外衣，民族的隐疾：以“帝国民族”概念重审梁启超“大民族主义”的内在悖论放一段我之前文章的节选： 少数民族概念本身，自建国起、经近年的新自由“保留地多元化”主义的进一步赋能后，就是反动势力的护身符之一，更是反动势力反击革命干群的天然阵地。试想一下，如果新中国成立后，国家将境内所有的汉族地主买办资本家专门划分为一个“汉族”，然后将汉族的劳苦大众另划分为一个“南族”，显然“汉族”人口远少于“南族…", "url": "https://zhuanlan.zhihu.com/p/2057557560237072791", "votes": 42, "comments": 1, "feed_ts": 1783343580, "feed_time_str": "07-06 21:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux,床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "四渡赤水为什么那么出名？", "excerpt": "当时国共两党所有指战员，没有一个人能理解教员的战略战术意图，并且从事后来看，蒋介石其实并没有犯什么严重的错误，可以说他做了教科书一样标准的部署，执行的也不错，我党这边，从事后看如果不是跟着教员走，大概率在打鼓新场一战，中央红军就彻底gg了，此后再没有什么战神101，横刀立马大将军等等了。 就是开天眼不开天眼的情况下，都很难找到出路，但是教员就像开了天眼并且自己设计了国共两党剧本一样，指挥着两党军队", "url": "https://www.zhihu.com/question/657995250/answer/1949149380604068880", "votes": 255, "comments": 39, "feed_ts": 1783342692, "feed_time_str": "07-06 20:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价多益网络老板徐波称自己女儿被人诱拐走？到底什么情况？", "excerpt": "别的不说，就那张开庭图，小孩一个个穿的和几内亚贫民窟的二手衣服一样，发际线比我一个英区回来的都离谱。 众所周知看小孩子过得好不好一看衣服二看皮肤三看头发。皮肤没凑近看不出来，单说头发和衣服就很糟糕了。 现在觉得那个三妞妈能跟徐波对着干，抢女儿把女儿都带走，简直太伟大了。 ", "url": "https://www.zhihu.com/question/2057395278810805576/answer/2057481352434409561", "votes": name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "准大一计算机女生该怎么面对编程、代码？", "excerpt": "打字太慢不是问题。 真实工作中的高级程序员，一天真正敲键盘写代码的时间可能不超过两个小时。绝大多数时间我们在干嘛。我们在看业务需求，在纸上画系统架构图，在排查一个系统错误，在开会和产品经理吵架。 就算是在敲代码的那两个小时里，现代的开发环境都已经智能到了极点。 特别是现在AI大模型全面接管了基础编码工作。你绝对不能用十年前那种买本实体书照着敲的心态来学了。现在行业里大家都在用类似Cursor这样的", "url": "https://www.zhihu.com/question/664704479/answer/2057566651625870447", "votes": 10, "comments": 4, "feed_ts": 1783342118, "feed_time_str": "07-06 20:48", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如果把三井换成库里，湘北能无伤赢山王吗？", "excerpt": "不能。跟库里对抗的话，山王怎么着也得伤几个，不可能无伤的。", "url": "https://www.zhihu.com/question/2042994130519847291/answer/2057565354491229366", "votes": 21, "comments": 1, "feed_ts": 1783341808, "feed_time_str": "07-06 20:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你这辈子最愚蠢的决定是什么？", "excerpt": "当我妈躺在病床上，我爸说不要救，回家。我说我出钱，于是我承担了所有医疗费、伙食费、酒店、路费。我爸一次手术，我妈一次手术，花了6、7万。这是我离婚前，准备走诉讼争取婚内财产的时候，算账看到的。再看到我老公给我转的520节日快乐和生日红包，感觉挺讽刺的。四年多，没看到我家人给我的任何转账，只有我不停转出去的钱。我瞬间失去所有力气，大哭，最后放弃婚内财产。 我婚后每个月给我妈转1千，我不知道转了几个月", "url": "https://www.zhihu.com/question/613789101/answer/1956885931735905870", "votes": 282, "comments": 407, "feed_ts": 1783341493, "feed_time_str": "07-06 20:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "历史上哪些人符合“早死几年风评会变差”的标准？", "excerpt": "尤利西斯·S·格兰特如果早死几年，那他的历史画像就定格成了一个“美国内战里会打点仗、但非常愚蠢、识人不明、纵容腐败、晚景凄凉的当过总统的破产老头”，被人当成最失败的总统记住，甚至还可能被当成诈骗同谋。 只能说多亏了马克吐温啊——此前的格兰特将军，虽然打赢了美国内战，但他的八年总统任期（1869-1877）充斥着严重的腐败丑闻和亲信贪污，丑闻层出不穷。 卸任后，格兰特还将全部身家（以及借来的钱）投入", "url": "https://www.zhihu.com/question/1946661886935406547/answer/2055612938552186782", "votes": 2403, "comments": 86, "feed_ts": 1783341164, "feed_time_str": "07-06 20:32", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "人这一辈子是努力重要，还是运气重要？", "excerpt": "我不知道答案。但我知道我走过的路。 1984年，我出生在粤西一个四面环山的小山村。山上松树青翠，山下梯田层层，竹林环绕，溪流鸟鸣。可山村清贫，物质匮乏。在我一两岁时，父母两手空空，只带了一口锅，就去了南方农场谋生。我成了留守儿童，在奶奶的怀抱里长大。 奶奶慈祥、勤快，是个只会干、不会说的朴实主妇。她每天天不亮就起来做饭，下地干活，养猪喂鸡，从早忙到晚。爷爷埋头苦干，但对自己人小气，对外人却很大方。", "url": "https://www.zhihu.com/question/3313272498/answer/2056710239190306893", "votes": 3, "comments": 8, "feed_ts": 1783340971, "feed_time_str": "07-06 20:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么flow matching模型都是以高斯分布作为源域的？", "excerpt": "其实现在还真有探索不用Gaussian用condition的，详细可看CrossFlow (2412.15213)和FlowTok (2503.10772)，同一个作者的work，前者开源了代码但是没开源数据所以复现不了，后者还没开源，只不过承诺了开源且在公共数据上训练的。 这种直接从一个分布（如文字）flow到另一个分布（如图片）的方法可以省掉condition，motivation是很有意思的", "url": "https://www.zhihu.com/question/1929097795865936629/answer/1938667760294008345", "votes": 109, "comments": 21, "feed_ts": 1783340957, "feed_time_str": "07-06 20:29", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大水哥", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价高达seed芙蕾这一角色？", "excerpt": "本意是坏的，结果执行好了。 大天使号上的全员，地球联合都要感谢芙蕾的献身。 没有芙蕾用肉体安慰，基拉根本坚持不到阿拉斯加。在沙漠就崩了。 性是非常有效的释放战斗压力的方式。 没有芙蕾的肉体抚慰，基拉的压力无处释放，要么精神崩溃，要么自爆。 基拉是最强改造人，但是改造的只是身体机能，他有更强的身体更聪明的大脑。但是精神上的抗压能力跟普通人没有区别。军人强大的抗压能力是通过日常的训练和作战不断强化的。", "url": "https://www.zhihu.com/question/45100840/answer/2057554395865388026", "votes": 29, "comments": 2, "feed_ts": 1783339196, "feed_time_str": "07-06 19:59", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "于朝阳", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "中国历史上隐藏的宗教线", "excerpt": "中国最早其实是天崇拜族群。天崇拜的“天”，属于一种自然神，而非人格神。信自然神的教，与一神教最大的不同，就是会形成泛灵论倾向。古中国人光身边就有灶神，门神，井神，土地神，户神，月老，财神，甚至床上还有床帮神，厕所还有厕神...非常典型的万物有灵的泛灵论。 不过，正所谓信得多了就不值钱了，信仰不专一就等同于没信仰。所以中国人是向龙王爷求雨就摆猪头上供，一看还是不下雨猪头就撤了，与神的关系与其说是信仰", "url": "https://zhuanlan.zhihu.com/p/2057553356688823687", "votes": 30, "comments": 2, 约束军队，要能让普通人相信跟着你有未来。中华民国这些事都没真正做好。 抗战胜利后，国民政府看起来接收了中国，实际上接收的是一个被战争打烂、财政枯竭、社会疲惫、军队庞大、民心极度脆弱的国家。它需要马上做三件事", "url": "https://www.zhihu.com/question/46893185/answer/2057521062800364973", "votes": 5, "comments": 0, "feed_ts": 1783331248, "feed_time_str": "07-06 17:47", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "水龙", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价一人之下766话重制版？", "excerpt": "作为一个老粉，我觉得之前的剧情没问题，炸了二壮，把普通人变成异人，抓了赵董逼迫谈判哪里有不对的地方？ 扯什么国企大领导被抓等于开战什么的，纯粹小孩子想法，蒋介石被囚禁了不也国共合作了嘛。 不就是政治正确问题嘛，扯那么多 ", "url": "https://www.zhihu.com/question/2056334044502267720/answer/2057373633375483635", "votes": 4, "comments": 4, "feed_ts": 1783331008, "feed_time_str": "07-06 17:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "607846", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "有哪些让人目瞪口呆的神设计？", "excerpt": "集装箱 ，二维码 ，詹姆斯·韦布空间望远镜 ，斯瓦尔巴全球种子库 ，荷兰马仕朗防洪闸 ，魔术贴罗马万神殿穹顶 ，宜家平板包装 ，盲文 ，汉字", "url": "https://www.zhihu.com/question/29445201/answer/2057519118350301050", "votes": 0, "comments": 0, "feed_ts": 1783330785, "feed_time_str": "07-06 17:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "607846", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "一直无法理解王阳明的龙场悟道厉害到什么程度，懂得人能讲讲吗?", "excerpt": "我们平时理解的知行合一，大多是： 知道了，就要去做。 这其实只是执行力。 王阳明悟到的知行合一，不是执行力，而是对人的一次根本追问： 你说你知道，可你真的知道吗？ 我们常说，我知道熬夜不好，但我还是熬夜。 我知道要孝顺父母，但还是控制不住脾气。 我知道做人要诚实，但还是会撒谎。王阳明会说，你不是知道了做不到，你是根本没有真知道。 你只是听过这个道理，记住了这个道理，承认它是正确答案，但它还没有进入", "url": "https://www.zhihu.com/question/587635342/answer/2057517533561983772", "votes": 1, "comments": 0, "feed_ts": 1783330407, "feed_time_str": "07-06 17:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小Lin说发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "顶级球星，原来是这么赚钱的...#世界杯 (World Cup) ", "excerpt": "顶级球星，原来是这么赚钱的...#世界杯 (World Cup) ", "url": "https://www.zhihu.com/pin/2057417123669054554", "votes": 0, "comments": 0, "feed_ts": 1783330211, "feed_time_str": "07-06 17:30", "cat 甚至廉价卖，毕竟人家会说这是有求于日本……可是分明即便伊朗封锁霍尔木兹海峡期间，菲律宾越南仍都7成以上以来东大的炼化汽柴油，咋滴东大的航空燃油耽误越南的飞机起飞了……还是菲律宾跟小本子的关系，还不如和东大铁瓷，菲猴子怎么不找小本子买油？？！……还不是买航油根本不是目的，想明目张胆给小本子供应原油才是目的！！这不就是，找个借口背刺，都不认真编吗……全世界谁不知道东大在勒小本子脖子，就你大鹅装傻充愣是吧～～大鹅为啥……呵呵……他们急需一笔大钱顶到俄乌前线，巩固和大幅扩大目前的胜利果实，然后以此为筹码，上桌谈判，想要尽快结束战争（经济和民意都绷不住了（而这笔钱只有我们能给，因为别人给了也得找我们换装备，何况这笔钱太大，一般人给不起，比如穷得汇率都保不住的霓虹国，你让它们拿美元给大鹅买装备，那还不如保汇率呢……我们签署中蒙俄管道，就会给一笔很大数额的预付款，俄要的是这个）我们肯定不能同意啊……我说过，吐不出来珲春大桥（有了这座桥，远东海参崴二十年内RMB就解放了），俄别想从俄乌战争中抽身。虽然乌克兰远比大鹅更惨，但人家是被入侵国，属于退无可退保家卫国……大鹅这种，离开本土作战，涉嫌军事干预他国，可没有那么大的社会民意容错力，顺风仗怎么都好说，一旦长期僵持、大量伤亡、甚至波及后方、直至想乌克兰一样兵源枯竭强制征兵……就会引发内乱，地方or军界实权派闹起来清君侧也不是不可能7月4号美国250国庆日当天，绿茶普大帝跟当天忙得不亦乐乎的特特打了85分钟电话，最后美国新闻发言人只表示会谈十分坦率深入……呵呵……翻译成大白话就是“双方吵得很凶还没吵出结果”不就行了～～我一再说了，这二三十年是G2联手吃世界的阶段，普大帝以为自己一个特工头子的小心机白莲花绿茶一下就能左拥右抱吃完原告吃被告了……想得真美……然后没吃到，绿茶人设就穿帮了，这么拙劣的援助阿富汗（他们在背后保护支持袭扰中巴经济走廊的巴勒斯坦塔利班，同根同源吗）和小日本，装都不装了。于是同一天我们的外长去了北欧四国，他们的政府高官对媒体非常谄媚的讨好说我们的外长长得太帅了简直惊为天人……这肯定是得到了我们某种安全承诺啊，毕竟北欧四国是离俄海军主力最近的……（遥想上半年，北约秘书长吕特为了大漂亮的保护，还喊特特爸爸来着……哎～～欧洲拔掉牙齿的老贵族们，为了苟延残喘节操掉一地，还真是可悲啊。看着吧，老普终归要低头的～～历史上世界岛两端大国没有分崩离析的时候，中间地带就不存在强国大国的生存空间……老普那点儿白莲花手段是远不能逆天改运冲破历史宿命的。", "excerpt": "中俄互掏7月1日，俄落实了和阿富汗的军事合作，让塔利班手里的装备水平和战术能力提升了一大截（这样阿富汗就更有效地支持小兄弟巴塔在中巴经济走廊上捣乱了～～大鹅你真是好样的啊～～嘬牙ing）同一天，俄正式以国内炼油厂被炸为理由，向日本，采购高端航空燃油……对没看错，是日本……上个月俄跑了一会北京后还信誓旦旦说坚决不卖日本一滴原油呢……这回为了这碟醋包了一好一顿饺子———日本一个原油进口依赖95%+的国", "url": "https://www.zhihu.com/pin/2057505059898930206", "votes": 0, "comments": 26, "feed_ts": 1783329235, "feed_time_str": "07-06 17:13", "category": "pin", "cat_name": "想法动态"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "单次训练横扫9个基准，遥感检测最大数据集与基础模型框架问世", "excerpt": "遥感图像目标检测是一项基础且关键的任务，广泛服务于城市监测、交通分析、海事监管、机场管理、应急救援等重要应用。然而，长期以来，遥感目标检测面临一个核心瓶颈：数据集规模有限、类别体系割裂、传感器和分辨率差异巨大，导致模型往往只能在特定数据集或特定场景下表现良好，难以真正泛化到复杂真实世界。 近日，北京航空航天大学史振威教授和邹征夏教授团队发布了一个面向通用遥感目标检测的大规模数据集与基础模型框架 —", "url": "https://zhuanlan.zhihu.com/p/2057512161640026643", "votes": 3, "comments": 0, "feed_ts": 1783329195, "feed_time_str": "07-06 17:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "君临财富", "verb": "MEM const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'

      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

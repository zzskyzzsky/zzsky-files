ken generation，然后再靠 function calling、JSON Schema、constrained decoding 把它重新压回结构化空间。某种意义上，这是绕了一圈。Jev 真正有意思的地方，是它在问：既然最后要的是 decision，为什么不直接建模 decision？当然，目前 Jev 的具体网络结构和训练细节并没有完全公开，所以现在直接说“Jev 证明了 BERT 类判别模型拥有 ICL”还太早。但我觉得可以更谨慎地说：Jev 至少展示了一种非常值得关注的方向——把 LLM 最有价值的 inference-time adaptation 能力，与昂贵的自回归文本生成解耦。如果这件事情最后真的成立，那么 constrained decoding 可能只是生成式时代的一种过渡方案。因为最好的结构化输出，也许根本就不需要“输出”。", "excerpt": "Jev 真正重要的地方：ICL 可能不需要自回归这次 Jev 爆火，我觉得最大的价值，是它让我重新思考一个问题：In-context learning 可能并不是自回归生成模型的专属能力。如果只看 Jev 最终完成的事情——分类、打分、结构化决策——其实并不神秘。今天用一个小 LLM + 约束解码（constrained decoding），很多情况下也能做出非常类似的产品效果。约束解码其实是现在", "url": "https://www.zhihu.com/pin/2084978274527078247", "votes": 0, "comments": 21, "feed_ts": 1790121011, "feed_time_str": "09-23 07:50", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "街道打狗队无端打死证件齐全的小型犬，犬只主人该如何维权？", "excerpt": "最近在挑显示器，我发现一个有趣的现象。 分辨率上，「高分」一定会被醒目标注出来，比如2K 4K 2.8K等等。 刷新率上，「高刷」自然也要被明确标出来。 于是你会看到以下分类： XX寸 2K 180hz电竞优选 XX寸 4K 144hz高端进阶 然后有一个孤零零的分类：XX寸 商务办公 它既不标分辨率，也不标刷新率，好像这个显示器既没有分辨率，也没有刷新率一样。 怎么？栓没栓绳这么难以启齿吗？为啥", "url": "https://www.zhihu.com/question/26104141/answer/2083698765505024659", "votes": 756, "comments": 23, "feed_ts": 1790120721, "feed_time_str": "09-23 07:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价Anthropic发布的Opus 5.5？", "excerpt": "2026 年 9 月 22 日，Anthropic 发布了 Claude Opus 5.5。同一天，OpenAI 前后脚发布了 GPT-6 家族的两个新成员：GPT-6 Sol 和 GPT-6 Luna。 两家显然都在盯着对方。 一句话看懂 Opus 5.5： 按目前的第三方测评，它是综合得分最高的模型（Artificial Analysis 智能指数 58 分，比 GPT-6 Astra 高 5", "url": "https://www.zhihu.com/question/2085895787062600760/answer/2085996233236264176", "votes": 4, "comments": 1, "feed_ts": 1790120258, "feed_time_str": "09-23 07:37", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你们听过最离谱的事情是什么？", "excerpt": "我身边有个40没处对象的好哥们儿，不是不处，大学就处过，情伤以后 在单并发极限延迟下加速达2.5倍，全面压制EAGLE-3与DFlash；且无需像后两者那样额外维护独立的草稿模型及其KV cache。最高3倍加速主要体现在低并发峰值宣传口径中的相对基座最高加速比约为3倍，而在标准长序列高并发重负载场景下，稳态提速比集中在1.5至1.6倍。该方法为存量成熟的自回归大模型提供了一种近乎零额外显存负担的高效无损多token并行生成范式。原文标题：Unlocking Lossless Speedups in LLMs via Discrete Diffusion#无影寺 ", "excerpt": "不改AR主干分布，Uno用离散扩散给大模型做“无损加速”\n图文版：链接Uno用轻量扩散蒸馏实现无损并行出token基础模型研究所（IFM）、UIUC、哈佛等机构提出Uno架构：保持主干参数θ_AR冻结以保证输出质量，仅引入rank-128的LoRA扩散层θ_∆通过扩散蒸馏按块生成多token候选，再由Ψ-Spec采样器完成投机校验。该机制无需训练独立的草稿模型，且严格保证输出概率分布的数学无损性。", "url": "https://www.zhihu.com/pin/2085882240832225485", "votes": 0, "comments": 0, "feed_ts": 1790093164, "feed_time_str": "09-23 00:06", "category": "pin", "cat_name": "想法动态"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "让模型多花数百数千倍算力多想几遍，会是解决重大问题的突破口吗？这是可持续的路径吗？", "excerpt": "空想肯定是不行的，即便是 Test-time Scaling Law，那也是要 Test 要反馈的啊。 你没 Lean 编译器在那空想一万年也只能走进幻觉死胡同。 当初 Lecun 不看好 LLM 就是因为自回归模型再怎么厉害，幻觉都是会累加的。 就算你每一步的正确率都高达 99.99% 又怎么样，连续推演 10000 步，最终全对的概率就只剩下 0.9999^{10000}\\approx 36.", "url": "https://www.zhihu.com/question/2081052331601412170/answer/2085880652059109087", "votes": 41, "comments": 7, "feed_ts": 1790092701, "feed_time_str": "09-22 23:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "2026年德国柏林议会选举，极左翼政党 die Linke 大幅领先其它政党，如何评价？", "excerpt": "为何左翼党的反对者写的政治讽刺帖文看起来像支持它的，是翻译的锅嘛 ", "url": "https://www.zhihu.com/question/2085199171422774582/answer/2085494268479723253", "votes": 200, "comments": 41, "feed_ts": 1790092638, "feed_time_str": "09-22 23:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "俄罗斯将「西伯利亚力量-2」更名「贝加尔力量」，途经蒙古有何战略考量？", "excerpt": "就是改名给中国看的。 因为对于这条管道，中国的核心要求，一直都是不要走蒙古。因为蒙古不可靠。而西伯利亚其实是乌拉尔山以东广袤地区的整体名称，留着西伯利亚的名字，线路就可以随时改。但贝加尔湖是一个临近蒙古国的俄罗斯境内的具体地点。新名字定位贝加尔湖，说明俄罗斯对中国的这条不经过蒙古的核心诉求，采取了强硬态度——必须经过蒙古。 为什么俄罗斯一定要这条线经过蒙古呢？ 蒙古看着像中立，但曾经是中国分离出去", "url": "https://www.zhihu.com/question/2080786207357851126/ _cn": "发表了文章", "title": "美股，A股，纳斯达克32800点？", "excerpt": "美股，A股，纳斯达克32800点要来了？ 昨天的美股惊天动地，四大指数统统上涨，纳斯达克大涨超2%，费城半导体大涨近5%，连罗素2000都是涨的... 今天的上证A股高开低走，只涨了0.06%... （20260922） 昨天的美股让你跑，跑错了？今天凌晨的A股让你不要参与，也搞错了？毕竟0.06%也是涨啊。 实在话，我知道昨天的美股会涨，但盘中涨幅的确很厉害，戴金丝眼镜的财长的操盘水平不是盖的，", "url": "https://zhuanlan.zhihu.com/p/2085782945575461404", "votes": 26, "comments": 17, "feed_ts": 1790073952, "feed_time_str": "09-22 18:45", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "2026年，美国现役有多少架军机？美国空军现在到底还剩多少家底？F35全任务能力率才两成五也太惨了。美国空军就剩1098架战斗机了。这是空军部长特洛伊·迈因克在2026年5月5日正式通知国会的数据。国会给他们定的法定最低线是1145架，差了整整47架。堂堂美国空军，连自己国会定的最低门槛都迈不过去了。F-16一款就占了814架，平均机龄34年，最后一架新机是2005年交付的。三十多年的老机身，拿什么跟新锐战机拼刺刀？F-35A倒是号称有525架，可美国政府问责局今年六月份发的报告写得明明白白，全任务能力率掉到了25%。五百多架里，能满状态打硬仗的只剩一百来架。从2014年到现在，政府问责局针对F-35发了28份报告，提了46项整改意见，到今年三月份只落实了14项。人家该赚的钱一分不少，该拖的工期一天不短。F-22更不用提了，生产线2011年就关了，总共造了183架，坏一架少一架。那美国空军总共有多少飞机？4875架。这个数字听起来还行，可拆开一看，战斗机只占不到四分之一。加油机400多架，运输机1300多架，直升机5400多架。对，直升机比战斗机还多。真正能上天跟人拼制空权的，就那么1098架。空军自己给国会报的目标是到2035年拥有1558架战斗机，缺口将近460架。可他们2026财年原计划买48架F-35A，后来直接砍到24架，退役的倒是一点不含糊。这账谁算谁明白，退役的速度远快于采购的速度。再看看陆军那边，4333架飞机，听着比空军差不了多少。可这里面九成以上是AH-64、UH-60、CH-47这些直升机。固定翼飞机少得可怜，战斗机一架都没有。陆军那四千多架飞机，能上天跟战斗机交手的，零。海军和海军陆战队加在一起3801架，战斗机748架。海军主力是F/A-18E/F和F-35C，陆战队手里还有一批老F/A-18C/D和F-35B。三军种战斗机全部加起来，两千多架。所以13,000架是所有军用飞机总数，这其中包括了直升机、教练机、加油机、运输机、无人机，什么都算。真正意义上的战斗机，两千多架。空军自己只占一半，而且这1098架里，超过四成的飞机平时是趴在地上飞不起来的。1995年美国空军战斗机妥善率是72.9%，到2024年掉到了53.9%。将近二十个百分点的跌幅，意味着超过四成的战斗机根本没法随时升空作战。美国空军现在机队平均机龄27.4年。1994年的时候，这个数字是17.2年。三十多年过去了，飞机没换几架新的，老的全在硬撑。国会研究服务局报告，美国空军运营的是一支“高强度使用且严重老化的机队”。更让五角大楼坐不住的是，他们自己人开始算一笔账。空军现在编入作战序列的战斗机是1271架，这里面还塞着大约103架A-10攻击机。A-10本来计划2026财年全部退役，后来国会不干，空军部长又宣布延到2030年。堂堂超级大国的空军，连一款上世纪七十年代服役的对地攻击机都退不掉。1098架这个数字，不是某一年突然掉下来的。1990年海湾战争那会儿，美国空军手里攥着三千二百多架战斗机。三十多年一路砍下来，砍编制、砍预算、砍采购，砍到最后发现自己连法定最低线都够不着了。而那个1558架的目标，按现在的采购速度，按现在的预算规模，按现在这个连F-35都修不利索的维护体系，能不能实现，恐怕他们自己心里也没底。#军机 #美军装备 #国防预算 #军力对比 #国防战略 #全球军力 #军备 #军事科技 ", "excerpt": "2026年，美国现役有多少架军机？美国空军现在到底还剩多少家底？F cerpt": "1、一份来自TX-SD09的民调引发了广泛讨论：州参议院：53/39 D+14 ，参议院 52/41 D+11，州长：49/40 D+9。这个席位24年是R+17，上半年进行过特别选举D+14，当时引发了强烈震动。如果民调为真，那德州要大变天了，塔拉里科会带领德州民主党横扫整个德州。（fake polls，共和党内部民调催票用的，民主党粉丝都不要信，但是哪怕有一点点真呢？[吃瓜]）为啥大家都不信，", "url": "https://www.zhihu.com/pin/2085658198963503168", "votes": 0, "comments": 27, "feed_ts": 1790059438, "feed_time_str": "09-22 14:43", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "夜静魂梦归", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价19世纪爱尔兰大饥荒？", "excerpt": "爱尔兰人已经被剥削到没有节庆食品的地步了，这太可怕了。正常来说节庆食物是最难灭绝的。亚美尼亚种族灭绝，波兰三次亡国，犹太人/亚述人两千年流浪+大屠杀，他们还是有完整的节庆食物文化。 我感觉在饥荒之前，爱尔兰人已经被剥削到没有办法在过节的时候吃点特殊的了。中文网络可能觉得爱尔兰大饥荒和亚美尼亚大屠杀一样，是一种一次性的事件，但仔细看看不是的，亚美尼亚人跑出去之后过节还是吃亚美尼亚节庆食品。爱尔兰人在", "url": "https://www.zhihu.com/question/40530543/answer/2046754643863250151", "votes": 3794, "comments": 235, "feed_ts": 1790056975, "feed_time_str": "09-22 14:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "名古屋亚运会为啥办得这么抠搜？是真没钱，还是背后有啥心思？", "excerpt": "因为看不见（是真看不见还是故意看不见你别问）的地方预算超支，所以要在看得见的地方加倍表演吃苦来显得自己很节俭。虽然加倍表演也是要钱的，但是为了展现主办方的节俭这钱花得物有所值（钱被谁赚了你别问） 至于是谁吃苦你也别问，我就问你吃这么多苦能不能感受到主办方的节俭 如果以上的逻辑对你来说像吃饭喝水一样自然，恭喜你你和日本人已经很接近了 ", "url": "https://www.zhihu.com/question/2084971972882948334/answer/2085674635320898154", "votes": 80, "comments": 0, "feed_ts": 1790056549, "feed_time_str": "09-22 13:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么很多人认为“阙特勤碑两面内容不同，所以罗塞塔石碑不可能用三语写同一件事”？", "excerpt": "罗塞塔石碑在中国历史上的对照组必然不是阙特勤碑， 这种胡乱类比，极好地体现伪史爱好者既不懂西方文物更不懂中国文物的本质 ——但凡懂一个都不会堕入阴谋论中绕不出来。比较恰当的案例是元朝制作的那些蒙汉合璧碑。正如 @Neferhotep 师已指出，罗塞塔碑文明确说明不同语言版本之间为对译关系， @Septim 师也已指出阙特勤碑的突厥文与汉文部分根本不同源。@甲骨文 师也介绍了元代多语言的圣旨碑，不过", "url": "https://www.zhihu.com/question/2081281081349763143/answer/2085524458912199286", "votes": 187, "comments": 3, "feed_ts": 1790056298, "feed_time_str": "09-22 13:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, 塔斯：嗯，我觉得吧，以他总统办公室副主任的身份，他总能找到一些地方上的这些人。我觉得，他帮人办一些事情，然后别人就会给他送个“五个”“七个”，或者“十个”过来。总归会有这种人。还有各种亲戚嘛。穆德拉：你知道吗，听完这些以后，我心里就有点不舒服了。米基塔斯：……他不可能靠3万格里夫纳生活。你看，这套东西就是这么运作的。你当总统办公室副主任的时候——比如说，他假设住在利沃夫那边。周围有一大堆做生意的亲戚。然后有些很小的事情，他只需要打一个电话，而这种事情本身就值一千美元。像这样，你相信我，他那里慢慢就能积出10到15个。", "excerpt": "“阿甘正传”案录音涉及到op副主任帕利萨准将的内容@糖喵 @柳风行 @莫强安蛇足 @ @环保先驱铁木真 @総員退艦報 @强·黎 @轉瞬頃夢 @离谱的小番茄 @Rhodesia @YY团长 @大菜头 @爱鹅小能手 @sks963 @狼肚肚 @巴布尔 帕利萨不愧是西尔斯基的爱将，为人就是可靠。不过税前三万格里夫纳的月收入，在基辅很难维持一个良好水准的生活。更何况跟他当旅长时相比，到手的收入肯定大为缩水", "url": "https://www.zhihu.com/pin/2085578182477063714", "votes": 0, "comments": 6, "feed_ts": 1790048455, "feed_time_str": "09-22 11:40", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么我感觉《飘》美化了奴隶制和3K党？", "excerpt": "并没有，当时黑奴价格相当于一辆特斯拉，一般人家买了都是珍惜的用，奴隶主和奴隶一起劳动是普遍现象甚至能干活的居家奴隶是看不起逃荒来的爱尔兰人的，也就是贱白人。大面积虐待黑奴的有没有，肯定有，但不是普遍现象。南北战争时期，为了保卫庄园主动拿起武器的黑奴并不是少数。为什么和我们印象中的不一样，那是因为美国电影的大肆扭曲宣传，毕竟南方和北方的关系直到二战后才相对好一些，之前北方一直在高压镇反。 ", "url": "https://www.zhihu.com/question/2021199984259806981/answer/2085692701052233619", "votes": 13, "comments": 2, "feed_ts": 1790047890, "feed_time_str": "09-22 11:31", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "曹多鱼", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价 2026 年全国中学生物理竞赛机构营及复赛大规模出现AI「辅助答题」行为？", "excerpt": "感觉也蛮正常的 现在ai做物竞题除了豆包应该都能四舍五入满分 再加上复赛和高考比严密程度确实不太够 希望未来正规一些吧 题目难度也是 别飘忽不定的 考纲也给一给 组织也是 命题不在举办地之后透题情况好了很多 但是也要考虑到ai目前的发展情况升级一下监考手段了 ", "url": "https://www.zhihu.com/question/2085386253248350169/answer/2085427442789900302", "votes": 123, "comments": 32, "feed_ts": 1790047124, "feed_time_str": "09-22 11:18", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "迎接生成范式革命！复旦和Wan团队发布首篇Agentic视觉生成综述", "excerpt": "让 AI 生成一张海报已经不难。更难的是，让它围绕同一个设计目标持续工作：理解品牌与产品要求，生成初稿；发现标题、产品位置或整体风格存在问题后，知道应该修改哪里、怎样修改；同时保留已经确认的内容。等到下一次活动，它还能延续此前确定的设计偏好和有效经验。 这里需要做的决定，从曾经的“输入什么提示词”，扩展到了选什么工具、检查结果、局部修改，以及积累经验。 这些决定由谁 01675699663384/answer/2085648345842960262", "votes": 64, "comments": 5, "feed_ts": 1790037315, "feed_time_str": "09-22 08:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}];
const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

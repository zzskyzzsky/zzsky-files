ategory": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你心目中最好的计算机学习路线是什么？", "excerpt": "第一门语言推荐C语言，甚至加上Rust。 很多人觉得既然AI能写代码了，直接学Python去调大模型API不就行了吗？ 但是Python只是AI时代的胶水语言，它是你用来粘合各个组件的工具。但如果你只会写胶水，永远触及不到这个行业的核心壁垒。大模型写业务代码很溜，但一旦涉及到操作系统底层的内存泄漏、高并发网络协议栈的隐蔽死锁、或者硬件级缓存一致性导致的性能瓶颈，目前的AI依然会产生大量的“幻觉”，", "url": "https://www.zhihu.com/question/14289467479/answer/2056046191419323439", "votes": 15, "comments": 0, "feed_ts": 1782979612, "feed_time_str": "07-02 16:06", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国足球不行的根本原因是什么？", "excerpt": "正如当初那帮老爷和家长以为打游戏就真的只是打游戏，是电子鸦片，结果玩游戏的人多了，对显卡的需求，喂大了个英伟达。 很多酸足球是“国运平衡器”的网友，以为足球就只是踢球。实际上现代足球是一门涵盖大量交叉学科的系统性综合产业，涉及了N多学科，人体运动科学、数据统计分析、工程与材料、品牌和传播、组织与管理…… 中国足球的落后，从来都不只是场上 11 名球员能力不足，整条产业链上下游配套对应的各类专业体系", "url": "https://www.zhihu.com/question/394735429/answer/2054930574452732542", "votes": 2039, "comments": 481, "feed_ts": 1782979270, "feed_time_str": "07-02 16:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为何清朝调兵最多几万，而不像明朝一调军队就是几十万？", "excerpt": "因为清朝的档案被完整的保存了下来，历史学家从清朝开始识数了，如果明朝的超级大军真的可信的话，你会发现明朝军队的战斗力低的吓人： 这里就不得不提朱棣北伐了，永乐十二年（1414年）六月，朱棣亲率50万大军，与噶尔丹的祖先马哈木所率3万兵马大战于忽兰忽失温，打得难分胜负，杀伤相当，几危而复攻，最后勉强算是击溃了马哈木； 于明朝正统十四年，明英宗亲率五十万大军，与也先率领的两万兵马战于土木堡，结果半天就", "url": "https://www.zhihu.com/question/499297650/answer/1983307018191274869", "votes": 1389, "comments": 697, "feed_ts": 1782979165, "feed_time_str": "07-02 15:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "博物馆里有哪一件文物让你看了以后，心里五味杂陈，瞬间就想泪流满面？为什么？", "excerpt": "如果你对两河流域艺术感兴趣 那你一定看过这把收藏在大英博物馆中，来自乌尔王陵的牛头竖琴 你也许感叹过它工艺的精湛、乐曲的美妙 那你知道演奏它的人是谁吗？ 大英博物馆藏乌尔青金石牛头竖琴其实笔者也不知道这把琴的演奏者姓甚名谁 因为 她只是一个为乌尔普阿比女王陪葬的女乐师这件文物的故事还得从乌尔王陵的伟大考古讲起。1922年，英国考古学家莱昂纳德 •伍利（Leonard Woolley）前往伊拉克南部", "url": "https://www.zh 782964191, "feed_time_str": "07-02 11:49", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "历史上哪些人符合“早死几年风评会变差”的标准？", "excerpt": "塔夫脱，如果没有卸任后出任大法官的经历，而是直接在总统任上死于肥胖并发症的话，他可以和哈定坐一桌", "url": "https://www.zhihu.com/question/1946661886935406547/answer/2054571607130109053", "votes": 29, "comments": 2, "feed_ts": 1782964152, "feed_time_str": "07-02 11:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "【随笔】谈谈10.7攻势中哈马斯的野战能力（一、战前准备）抱歉断更这么久，最近在忙毕业的事，随着专业方向的变化，今后我可能会更关心非洲政治…回到哈马斯的10.7攻势。在查阅大量资料后，我认为可以给哈马斯的野战能力下一个贴切的定论：哈马斯卡桑旅拥有组织战役级别野战攻势的能力，但本质上仍是一支民兵武装。对这个定论，我将在未来单开一篇文章予以说明，在此仅作简要阐述。哈马斯在战役的前期准备上取得了巨大成功。首先，哈马斯实施了出色的战术欺骗。通过蓄意保持低调和发表具有误导性的声明，哈马斯成功让以色列人相信自身没有进攻意图，正趋于保守，并将始终在PIJ等激进派系与以色列的冲突中袖手旁观。因此，以色列在2023年撤销了对加沙地带的许多情报项目，并将加沙工人的通行证数量增加到1.8万（后续还有再增加到2万的计划），即便缴获了疑似进攻计划（这份计划正是10.7的蓝图），也将其视作“异想天开”不予理会。这令哈马斯获得了战役主动性，并能更有效地收集以色列境内的详细情报。哈马斯甚至获取了每个基布兹的详细地图，并制定了专门的战斗计划，规定了抵达时间、火力分配和可供固守的建筑。与此同时，哈马斯也在战前有效协调了武装力量。哈马斯借助JOR机制吸纳了几乎所有加沙地带武装派系，从左翼到萨拉菲主义民兵无所不包，并通过年度“坚韧支柱”演习将它们整合起来。这一努力在10.7的进攻行动获得了回应——穆斯塔法旅、奥马尔·卡西姆旅、圣城旅、安萨尔旅、阿克萨烈士旅和纳西尔·萨拉赫丁旅与卡桑旅并肩作战，填补了战线上的空白，并在以色列南部地区制造了更广泛的混乱。在最初攻势中，借助密集的火箭炮掩护，不同派别的徒步步兵、摩托化步兵与滑翔伞、快艇部队，大约3000人分三波协同推进，成功突入了加沙周边十余个基布兹和莫沙夫，威逼阿什凯隆、斯德洛特、内提沃特和奥法基姆，并全面切断232号公路近一天，这样的协同水平前所未有，显然是演习和协调的成果。军事物资的大量积累对哈马斯10.7攻势的初期成功同样至关重要。2021年巴以冲突后的两年间战期中，哈马斯强化了轻武器弹药、火箭弹和各式IED的生产，用于武装努赫巴部队和火箭部队。10.7清晨6时许开始的火箭炮齐射在数小时内倾泻了3000枚各式火箭弹和迫击炮弹，并在接下来的两天内齐射了另2000枚火箭弹，这显然反映了哈马斯战前军事物资的庞大数量。哈马斯突击队的精良装备也展现了军事物资的丰富性，在贝埃里、雷姆基布兹和诺瓦音乐节的遭袭画面中，努赫巴部队至少在连一级列装了MANPADS（针式类似物），在班排大量配发PK机枪和RPG-7，几乎所有士兵都使用AK-47和AKM步枪以统一弹药口径。哈马斯甚至还装备了经过特殊设计的爆破装置，其形态与以色列基布兹住宅大门的规格几乎一致，用于破门或破墙，显然是专门生产的。最后，哈马斯选择在犹太住棚节的次日发动攻势。当时，加沙师极其虚弱，仅有1/3官兵在岗，边境部队普遍缺编，而且几乎没有战斗准备。这使哈马斯得以迅速突破边境墙防线，并压制了少量仓促起床的以色列士兵。#哈马斯  #以色列  #中东局势  #加沙  #军事  #国际政治  #国际关系 ", "excerpt": "【随笔】谈谈10.7攻势中哈马斯的野战能力（一、战前准备）抱歉断更这么久，最近在忙毕业的事，随着专业方向的变化，今后我可能会更关心非洲政治…回到哈马斯的10.7攻势。在查阅大量资料后，我认为可以给哈马斯的野战能力下一个贴切的定论：哈马斯卡桑旅拥有组织 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

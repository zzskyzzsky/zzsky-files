8.5.12四个安全版本，修复代号为php2shell的两个未认证远程代码执行漏洞（CVE-2026-109618与CVE-2026-109619）。光更新服务器命令行里的PHP、或者跑个检测脚本看到OK，都不能证明你的网站已经安全。为什么改业务代码和只调配置救不了命这两个漏洞出在PHP底层引擎内部，不在你的网站业务代码里：一个是请求初始化阶段内存耗尽（OOM）导致清理时误用未初始化数据（CVE-2026-109618），另一个是前一个请求释放内存后残留全局状态、被同一个工作进程处理的后续请求直接复用（CVE-2026-109619）。因此，所有处理网页请求的PHP安装（包括PHP-FPM、Apache的mod_php、php-cgi、FrankenPHP和LiteSpeed）全在风险范围内。其中Apache的mod_php被PHP官方列为风险最高，未经登录认证的请求在任何业务代码运行前就能直接触发漏洞。PHP官方明确指出，除升级版本外不存在完整的缓解手段。公告里虽然给了限制请求体积或关闭上传进度等临时配置，但那只能拦截特定攻击路径，无法堵住全部变体；更关键的是，升级或改配置后必须重启PHP-FPM或Web服务的工作进程，否则内存里的残留状态风险依然存在。最容易踩的坑：php -v升了，线上网站还在裸奔很多运维登录服务器跑一下php -v看到版本号对了就以为万事大吉。实际上，同一台服务器往往装有多套PHP，命令行（CLI）调用的PHP，常常和Nginx或Apache背后实际接管网页请求的PHP-FPM或mod_php根本不是同一个实例。核验时必须查清线上Web服务实际绑定的PHP运行版本，并在更新后重启对应的服务进程。如果使用的是托管主机或云虚拟主机，看不到底层进程，需要向主机商确认三件事：站点当前实际运行的PHP版本、完整的软件包修订号，以及针对这两个CVE的补丁是否已在运行实例中生效。上游版本号与Linux发行版回移补丁怎么分清直接编译或安装PHP官方上游版本时，8.2、8.3、8.4、8.5四个分支的安全底线分别是8.2.35、8.3.36、8.4.27和8.5.12。需要注意，PHP 8.1及更早分支已停止常规官方维护（官方仅对7.4、8.0、8.1提供了最小源码回移植补丁），8.2分支的安全支持也将于2026年12月31日截止，修完这次漏洞后仍要尽早规划大版本升级。如果你的PHP来自Ubuntu、Debian或RHEL等Linux发行版软件源，厂商通常会把安全补丁回移（backport）到旧版本包里，主版本号看起来仍低于上述数字，但尾部的软件包修订号已经更新。遇到这种情况，既不能单看主版本号低就误判没修好，也不能听说“发行版有回移补丁”就默认安全，必须对照发行版安全公告核验完整的软件包修订号。OpenAI的检查器返回OK，为什么不等于绝对安全这次漏洞披露中，Calif团队借助GPT-5.6 Sol发现了其中一个漏洞，Wiz团队独立发现并报告了两个漏洞；OpenAI参与了披露前的多方协调，最终修复与发版由PHP维护团队完成。OpenAI同步开源了名为php2shell-checker的检测工具，但它只是一个不发送攻击载荷的版本比对脚本，绝不是补丁验证器。这个工具检查网址时只读取HTTP响应头里的PHP版本，本地检查只读取php -v，再跟2026年10月20日的版本分界线做机械对比。如果响应头隐藏了版本号会返回UNKNOWN（代表无法判断，绝非已修好）；如果Linux发行版回移了补丁但保留旧版本号，会被误报为VULNERABLE；如果响应头被伪造，或者只升了CLI没升Web进程，哪怕返回OK也可能是假象。此外，OpenAI提到“先于攻击者发现”时专门加了“据我们所知”的限定，工具返回OK也无法证明网站在打补丁前没有被入侵过。核验入口PHP安全公告：链接版本检查器：链接服务器核验说明：链接", "excerpt": "GPT5.6揪出PHP远程执行漏洞，70%网站需升级如果你维护的网站还在用PHP，现在最紧要的事是确认线上实际处理网页请求的PHP进程有没有真正打上补丁。OpenAI披露，安全团队借助GPT-5.6 Sol协助发现了PHP底层高危漏洞，由于全球约70%的网站由PHP驱动，PHP官方已在2026年10月21日紧急发布8.2.35、8.3.36、8.4.27和8.5.12四个安全版本，修复代号为php", "url": "https://www.zhihu.com/pin/2096406330764481329", "votes": 0, "comments": 0, "feed_ts": 1792602228, "feed_time_str": "10-22 01:03", "category": "pin" 是欧盟死在乌克兰之前还是之后。 ", "url": "https://www.zhihu.com/question/2096328160241633097/answer/2096376197735359930", "votes": 28, "comments": 1, "feed_ts": 1792595034, "feed_time_str": "10-21 23:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《潜伏》中，吴敬中明知翠平是个乡下土妞，为什么却请她吃西餐？", "excerpt": "翠平这个“乡下”不一般，那可是保定乡下。 保定是什么地方？ 保定在上世纪60年代之前一直就是直隶省城，前清时就有直隶总督府，有行宫，李鸿章办过公，慈禧避过难，名副其实的大城市。 保定的GD组织成立非常早，1922年就有了，GD根据地到处都是，爱看老电影的都知道，好多老电影都是讲保定的，《野火春风斗古城》《地道战》《小兵张嘎》《狼牙山五壮士》，其中狼牙山五壮士的事就发生在翠平的老家易县，剧里也提到过", "url": "https://www.zhihu.com/question/1991516796059136114/answer/1994032402994067049", "votes": 4506, "comments": 235, "feed_ts": 1792594335, "feed_time_str": "10-21 22:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价英国拟征收看剧税：观看 YouTube、Netflix 等网络流媒体需每年缴纳 180 英镑？", "excerpt": "英国自诺曼征服以来就长期是一个高税收，强管控，中央集权的国家，征收什么看剧税我一点都不奇怪。 我是不反对某些人吹捧低税收，小共同体，地方自治的，但是为什么要去吹英国这么个欧洲秦制国家…什么秦制大清，秦制法国，秦制俄国人均税收都比不上号称“周制”的大英（就1788年来说）。感觉这种人对封建主义的基础性的理解都有问题，地方性的封建契约不应该是你议会想改就能改的，这也就是为什么梅特涅这种欧陆劳保会反代议", "url": "https://www.zhihu.com/question/2096182423621059644/answer/2096325232415994267", "votes": 72, "comments": 1, "feed_ts": 1792594034, "feed_time_str": "10-21 22:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "电车难题难在哪，肯定要救五个人啊？", "excerpt": "我给你举个例子，不是电车难题。 你家门口出了一起重大交通事故，五个人重伤，都是大出血加器官衰竭，必须立刻器官移植否则就会死。而且正巧，他们衰竭的器官都不一样，更巧的是他们的血型刚好一致。 又正巧，从边上路过了一个路人，血型配型和这五个重伤患者刚好一致，而且很健康。 你的意思是，这个时候，你应该出手，把这个路过的路人杀死，把他的心肝脾肺肾都掏出来分别给这起事故的五个伤员器官捐献？而且是必须出手，因为", "url": "https://www.zhihu.com/question/2047091766797641003/answer/2094489575397790482", "votes": 233, "comments": 154, "feed_ts": 1792593909, "feed_time_str": "10-21 22:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "阿比大大：厄立特里亚独立以来如同王小二过年埃塞俄比亚联邦总理阿比·艾哈迈德(福音派基督徒，准确说是福音派的分支五旬节派信徒，其核心权力圈不乏五旬节派成员，妻子齐娜什·塔亚丘（Zinash Tayachew）也是知名的福音歌曲演唱者。历史上福音派深度参与了奥罗莫民族主义运动)表示，自厄立特里亚独立以来，该国人民失去了大量的工业能力和城市活力，他敦促睦邻友好和发展合作是前进的道路。在10月19日接受埃塞俄比亚广播公司 (EBC) 的提格里尼亚语(埃塞提格雷州与厄立特里亚的官方语言与工作语言）专访时，总理表示，厄立特里亚的城市在厄立特里亚还是埃塞俄比亚的一部分时，曾经是繁荣的经济中心。然而，自厄立特里亚独立以来，这些资产已大幅恶化，一些城市失去了原有的城市特色。阿比回顾说，厄立特里亚当时拥有 300 多家企业，并表示该地区拥有相当可观的工业基础(“在‘​​自由’之前，厄立特里亚的城市美丽而繁华。如今，它们却如同鬼城一般。当厄立特里亚还是埃塞俄比亚的一部分时，它拥有超过300家工厂…… 当时它是非洲最繁荣的地区之一。”），将其昔日的经济实力与他所描述的目前的衰落进行了对比。阿比总理以阿斯马拉为例表示，首都阿斯马拉的规模已经小于许多埃塞俄比亚发展中城市，如阿尔巴门奇(Arba Minch，位于埃塞西南部，是格穆戈法州的首府，坐落在东非大裂谷中，毗邻查莫湖，有历史工业底子但是财政拮据，最近在转型旅游业)和吉吉加(Jijiga，位于埃塞西南部的索马里州首府，消费市场活跃的“商贸与畜牧枢纽”，中产人数在埃塞各城市中排名第六）。(“你看阿斯马拉，它的排名已低于阿尔巴明奇或吉吉加。”）总理在谈到红海港口城市马萨瓦和阿萨布时表示，这两个城市的经济活动大幅下降，导致其潜力很大程度上未得到充分利用。“马萨瓦已经空无一人，而阿萨布则变成了一座鬼城。”阿比总理说。阿比将这种情况归咎于厄立特里亚政府未能优先考虑发展和制度建设，并补充说，其政策反而使该国陷入为反对埃塞俄比亚的势力服务之中。他表示，厄立特里亚人民勤劳热情，如今却面临流离失所和生活困苦，并强调外部因素助长对抗并不能解决该国面临的根本挑战。阿比表示，这种介入并不能为厄立特里亚的问题提供持久的解决方案，因为支持对抗的人更有可能提供弹药，而不是为解决该国的困难做出贡献。他强调，友谊、睦邻友好和发展合作仍然是可行的前进道路，并指出数十年的经验表明了其他方法的局限性。阿比警告说，继续无视寻求伙伴关系和发展的呼吁，而不是让该地区成为外部竞争的舞台，可能会造成严重后果。PS：厄立特里亚政府(例如信息部长耶马内·格布雷梅斯克尔（Yemane G. Meskel））与官方媒体、侧翼大V经常将埃塞执政党繁荣党（Prosperity Party）称之为“波将金党”（Potemkin Party，缩写正好也是PP），旨在指责其统治建立在虚假表象和欺骗之上，埃塞政府也被称之为“波将金党政权”，阿比则被称之为“波将金党的总理”。除却“波将金党”之外，还有其他的一些贬称(尤其针对阿比个人)①厄立特里亚的伊萨亚斯总统对阿比用公开用提格里尼亚语对繁荣党直接使用的四连贬义词：懒惰（ሰነፍ / senef）、穷光蛋（ነዳይ / neday）、懦夫（ፈራሕ / ferah）、贪婪（ስሱዕ / susu）；②“妄想的”——尤其是信息部长先生的官方账号@hawelti 经常使用，常搭配“delusional projects”（妄想项目）、“delusional aspirations of regional grandeur”（地区霸权的妄想）等。用来形容阿比的出海口主张、海军建设和对厄立特里亚的威胁，是当前最常见的形容词之一③“幼稚的” (Childish）或 “阿拉特基洛的小孩”( Arat-kilo child）——厄立特里亚驻南苏丹大使等官方人物公开用过，把阿比称为“阿拉特基洛的小孩”（阿拉特基洛是亚的斯亚贝巴政府核心区）。带有明显的轻蔑和不屑意味，网络侧翼也常沿用④政治侏儒(Political Pigmy）——还是出自信息部长耶马内·格布雷梅斯克尔的SNS账号，引用的是第一次提格雷战争时跟阿比为敌、现已经投靠阿比的前TPLF核心领袖之一的盖塔丘·雷达（Getachew Reda）的话：“Abiy Ahmed is a political pigmy. Had Ethiopia been a normal country, he would have long been confined to a mental institution or spiritual sites of healing for the deranged.”（阿比·艾哈迈德是个政治侏儒。如果埃塞是正常国家，他早就该被送进精神病院或接受“圣水治疗”了。）这一标签也被厄特的网络侧翼广泛使用", "excerpt": "阿比大大：厄立特里亚独立以来如同王小二过年埃塞俄比亚联邦总理阿比·艾哈迈德(福音派基督徒，准确说是福音派的分支五旬节派信徒，其核心权力圈不乏五旬节派成员，妻子齐娜什·塔亚丘（Zinash Tayachew）也是知名的福音歌曲演唱者。历史上福音派深度参与了奥罗莫民族主义运动)表示，自厄立特里亚独立以来，该国人民失去了大量的工业能力和城市活力，他敦促睦邻友好和发展合作是前进的道路。在10月19日接受埃", "url": "https://www.zhihu.com/pin/2096289922093207633", "votes": 0, "comments": 24, "feed_ts": 1792593704, "feed_time_str": "10-21 22:41", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "编译船夫", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "人民军队与其他类型的军队的区别在哪？", "excerpt": "1999年秋天，河北某靶场，我们连宿营在一个村子边上。凌晨四点紧急集合，两百多号人摸黑拔帐篷、平灶坑、填厕所，二十分钟拔营完毕。天刚蒙蒙亮，车队往村外开，房东老太太端着半盆煮鸡蛋追到村口，站在那儿一直看着我们走远。她不知道我们谁是谁，我们也不知道她姓什么。 那半盆鸡蛋，最后没敢收。 我是1998年12月从重庆酉阳走的兵，分到38军装甲六师高炮团，驻北京丰台南苑。新兵连头一个月，练的不光是队列和体能", "url": "https://www.zhihu.com/question/1917240419542087195/answer/2093637208016212299", "votes": 411, "comments": 21, "feed_ts": 1792590347, "feed_time_str": "10-21 21:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有一个吸毒的男朋友怎么办？", "excerpt": "老乡，富二代，二十来岁时，开始吸冰毒、麻古。 他前妻，美女，为他生育两子。 前妻劝他戒毒，劝不动，就陪他一起吸。 有一次，前妻吸毒后，产生幻觉，闹市，裸奔。清醒后，看到自己裸奔的视频，不能接受事实，外加长期吸毒，当场精神失常。至今二十余年，一直住在神经病医院。 后来他还继续吸，还谈了一个女朋友。女友也是陪吸，吸毒后把人捅成重伤，坐牢。 再后来，他进戒毒所了。 现在家道中落，自己的牙齿也因吸毒全部掉", "url": "https://www.zhihu.com/question/655510251/answer/1978860430559569258", "votes": 193, "comments": 17, "feed_ts": 1792589829, "feed_time_str": "10-21 21:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "Morris.Zhang", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "一问界M9撞击后爆燃，品牌初步核实为汽车超速撞击交通灯起火，否认电池爆燃、智驾撞击，哪些信息值得关注？", "excerpt": "原回答忽略了两个重要事实， 1、视频中的道路是倾斜的，人行道也是倾斜的，第一次计算是按普通路口计算，产生了很大的误差 2、视频中路口被重新刷过，计算速度的时候，同时计算了这两段人行道，这也使计算产生重大误差 使用地图测距人行道长度约6米（工具显示为19.75英尺），倾斜角度约34度 重新计算以后 1、通过第一个人行横道时，速度约110km~120km/h 2、碰撞时约70~80km/h 使用原始数", "url": "https://www.zhihu.com/question/2096020660657059113/answer/2096285405914181909", "votes": 2061, "comments": 391, "feed_ts": 1792589371, "feed_time_str": "10-21 21:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "在沟通处理工作时，其他部门的人说我级别不够，让我主管去找他，你怎么看待这件事？", "excerpt": "很好判断。 如果对方拐弯抹角阴阳怪气，但话不敢说明白，也不说解决方法，那是在针对你，但又不能明说，因为不上台面。 如果对方很明确的直接告诉你级别不够，并且明确要求你的主管去找他，那就确实是就事论事，因为明确告诉了你原因以及解决方案，这事情可以放在台面上明着讲，那说明就是规则的一部分。 如实告诉你的主管就可以了。 ", "url": "https://www.zhihu.com/question/2043249714573862301/answer/2096350919864721497", "votes": 39, "comments": 2, "feed_ts": 1792589008, "feed_time_str": "10-21 21:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "古代世家大族虐杀自己的丫鬟犯法吗？", "excerpt": "这事儿吧，主要取决于自己的爹是不是叫王莽.....如果是，那挺危险。", "url": "https://www.zhihu.com/question/640333210/answer/2096350606436865533", "votes": 1, "comments": 0, "feed_ts": 1792588933, "feed_time_str": "10-21 21:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "明朝最后一次有可能将女真摁住，阻断他崛起，是在哪个时期？", "excerpt": "葡萄牙占领澳门的时候 好好和葡萄牙人做生意 引进世界一流的火枪 葡萄牙是认钱不认人的 给钱他欧洲什么都能给你弄来 冷兵器时代欧洲重骑兵是无敌的 重型火枪发明之后 一个农民可以轻易的在一两百米外击穿重骑兵的胸甲 培训一个火枪手只需要几周 封建领主再也不能把农民当成毫无价值的“民军”（levies）来看待 从这个时候 祖传的盔甲成了累赘 穿了也没用 功夫再强也得躲子弹 法国最勇的骑士巴亚尔(法兰克赵子", "url": "https://www.zhihu.com/question/1949976615066014211/answer/2095124537167951352", "votes": 924, "comments": 211, "feed_ts": 1792588026, "feed_time_str": "10-21 21:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "两名孟加拉国人因在麦加清真寺发生“猥亵行为”被处决，这暴露了沙特司法体系的哪些结构性问题？", "excerpt": "既然问的是沙特的司法体系，那我来从法律的角度讲一讲吧 沙特阿拉伯是世界上死刑最滥用的国家有多滥用呢？ 首先，沙特是没有成文法的 他们主张刑不可知，则威不可测 所以他们干脆就不立法了 唯一的法律渊源就是经书以及其衍生出来的圣训 也就是说他们这个国家的法律体系只有一些非常泛泛的，抽象的原则 根本就没有对死刑的规定 具体哪些行为会被处死呢 完全依赖审判人员的心情了…… 通过多个案例概括 沙特阿拉伯一般会", "url": "https://www.zhihu.com/question/2095177657474404874/answer/2096205631258617106", "votes": 3253, "comments": 337, "feed_ts": 1792587671, "feed_time_str": "10-21 21:01", "category": "other"  "excerpt": "过去几十年，中国人看火箭发射，地点基本没有太大悬念。 酒泉、西昌、太原、文昌，这几个名字几乎承包了中国航天的重要时刻。 这些地方要么远离人口密集区，要么靠近广阔海域，为火箭发射提供了足够的安全空间。 上海寸土寸金，显然不符合这些传统条件，很难让人把它与火箭发射联系起来。 然而，今年9月，一枚火箭从上海东部海域升空，将9颗卫星送入太空。 上海，为什么也能发射火箭？ 发射点越来越多，折射出中国商业航天", "url": "https://zhuanlan.zhihu.com/p/2096255174746584914", "votes": 4, "comments": 0, "feed_ts": 1792567497, "feed_time_str": "10-21 15:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "南爸安爸", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "DeepSeek V4.1 Flash 大规模推理部署实践", "excerpt": "大模型的能力边界由模型本身划定，而如何让这些能力以合理的成本服务海量用户，则是 推理框架要解决的核心问题。面对大规模的 AI 调用需求，推理框架已经从单机服务程序演变为跨集群协同的复杂系统。算子、通信、调度与缓存管理相互影响，共同决定端到端性能。对于大规模在线服务，性能优化需要落实到具体的部署条件中：使用什么芯片、如何组织硬件、如何分配计算，以及如何复用已有的计算结果。 DeepSeek V4.1", "url": "https://zhuanlan.zhihu.com/p/2095560295930508953", "votes": 7594, "comments": 668, "feed_ts": 1792567223, "feed_time_str": "10-21 15:20", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "正解局,田地发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "只能汽车下半场，会造车和懂智能缺一不可#启境GX7  #华为乾崑  #境模式  #广汽  #新能源汽车 ", "excerpt": "只能汽车下半场，会造车和懂智能缺一不可#启境GX7  #华为乾崑  #境模式  #广汽  #新能源汽车 ", "url": "https://www.zhihu.com/pin/2096256513744679698", "votes": 0, "comments": 1, "feed_ts": 1792567183, "feed_time_str": "10-21 15:19", "category": "pin", "cat_name": "想法动态"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么不建议在简历上撒谎？", "excerpt": "8月在BOSS上招来了个年轻人，说年轻，也近30了 闽南本地人，简历上是东北某不知名大学，在DELL待过2年，离职后在家不工作至今 问其在家闲置原因，答曰不想工作 技术能力可以，能胜任岗位，但人比较自大，讨论问题时指出其不够谨慎，但他坚持自己的处置方式无风险。年轻人嘛，似乎有这种自信很正常，虽然毛躁，但未必不能敲打。 试用了半个月，人事说催了2次学历证书无果。于是问他原因，他说学校没给还是遗失我忘", "url": "https://www.zhihu.com/question/562524801/answer/2094093880350225982", "votes": 49, "comments": 20, "feed_ts": 1792567142, "feed_time_str": "10-21 15:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "女子下班后绕道买菜，遭遇车祸身亡，人社部门不予认定工伤，法院判决算工伤，如何理解？", "excerpt": "人社部门的人没有问题。 他们就得严格按照规则办事儿，除非有其他 ，能够冶炼几十公斤钢铁的电费还不到3瓶饮料的钱，来自地球另一端的高清视频只需几毛钱的流量就能获得。互联网时代流量就像自来水一样常见，这也就是为什么全世界范围里造流量的电信公司永远", "url": "https://zhuanlan.zhihu.com/p/2095901711042864269", "votes": 1968, "comments": 277, "feed_ts": 1792566246, "feed_time_str": "10-21 15:04", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "UFO", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "乌克兰为何不愿接受俄罗斯停战条件？", "excerpt": "在战争与屈辱面前，你选择了屈辱，但屈辱过后，你仍得面对战争。 -- by 丘吉尔 老虎是要吃人的，什么时候吃，决定于它的肠胃，向它让步是不行的。它既要来侵略，我就要反侵略。不同美帝国主义见过高低，我们要建设社会主义是困难的。出兵援朝是必要的，打烂了，最多就等于解放战争晚胜利几年就是了。所以迟打不如早打。-- by 彭德怀 当然还有更过分的： 我们要学景阳冈上的武松。在武松看来，景阳冈上的老虎，刺激", "url": "https://www.zhihu.com/question/2095219126973239402/answer/2096255076578889789", "votes": 8, "comments": 0, "feed_ts": 1792566157, "feed_time_str": "10-21 15:02", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "朝花夕拾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "现在离婚已经比较常见，你身边离婚的人都是为何离婚？", "excerpt": "就我的观察，我发现其实很多人都没有正确的恋爱观和结婚观。 两个人结婚，前提是男女双方足够成熟，足够独立，能够不依赖对方，自己也可以过得很好。 然后遇到了恋爱对象，深入交往之后，认为彼此适合结婚，然后谈婚论嫁。 而现实情况是，从小到大，我们都被教导不要早恋，到了高中，甚至到了大学才开始谈恋爱。 包括我自己结婚的时候，也是懵懵懂懂的，被父母催着，觉得年纪到了，双方各方面条件都合适，然后就结婚生子。 本", "url": "https://www.zhihu.com/question/13893726299/answer/2096251363911118942", "votes": 6, "comments": 1, "feed_ts": 1792565272, "feed_time_str": "10-21 14:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "星巴克中国称10月22日起将在全国开始施行消费入座，你支持吗？消费入座对门店业绩和顾客体验有哪些影响？", "excerpt": "直接没法落地，甚至会有反效果。 星巴克的目的很明确，筛选愿意付费的人。 想法很好，但靠这个，很难很难。 因为星巴克的员工没办法把人赶走，他们自己也说了，不会硬性要求。 说白了，就是试图抬高一些人的面子成本，筛掉一些不会有消费但又占座的顾客。 但毫无意义，甚至可能有反效果。 因为这东西是防君子不防小人，会被这个筛掉的人，那都是体面人，这些人反而才是需要吸引的中立顾客，会因为这个牌子脸红的人，才是有可", "url": "https://www.zhihu.com/question/2096194931823830459/answer/2096250019737355838", "votes": 127, "comments": 26, "feed_ts": 1792564951, "feed_time_str": "10-21 14:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "生殖隔离解除24小时、氧气消失三秒、所有动物失明72小时和全球暴雨10年，上述哪个灾难危害最大？", "excerpt": "当然是暴雨10年。 绝大多数动植物会灭绝，很大一部分微生物也活不下来，地球环境会整体毒化，生物圈一夜回到30亿年前。 在真实的物理环境里不可能“全世界都在下暴雨”，因为地球表面是有 海拔起伏和纬度分布的，在高海拔地区、两极地区一定下的是雪或者雹。长达10年的暴雨100%会导致大量地表水以固体的形式堆积在高海拔地区和南北极，导致能够参与水循环的水总量大幅度减少。目前我们还不清楚题主灭世的手段具体是什", "url": "https://www.zhihu.com/question/2095258672733615012/answer/2096247717177581763", "votes": 51, "comments": 6, "feed_ts": 1792564403, "feed_time_str": "10-21 14:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么中国古代流传下来的歌曲那么少？", "excerpt": "“想不到一个现在还在流行着的古代的歌曲”，只是意识不到那首竟是古代歌曲。 最经典的，《茉莉花》，“好一朵茉莉花”这首江苏民歌，传自清朝的《鲜花调》，就算古代歌曲。按文献记载时间，比莫扎特和贝多芬的作品或许都略早。 茉莉花《凤阳花鼓》，“说凤阳，道凤阳，凤阳本是好地方”那首，比《茉莉花》小众一些，但这句词儿也不少安徽以外的人听过，龚琳娜还唱过。据说这是以前凤阳灾民的乞讨歌，不过明朝的词大概率和清朝的", "url": "https://www.zhihu.com/question/20981451/answer/2096247105820025684", "votes": 58, "comments": 6, "feed_ts": 1792564257, "feed_time_str": "10-21 14:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看DeepSeek官宣单集群日均吞吐达 155 万亿 Token，单卡每小时收入38 美金？", "excerpt": "现在的状态可以2008年前后有点像。那个时代的程序员是不说什么“万物转码”，“人类未来”乱七八糟的，只是自己默默挣钱，自嘲自己码农，没头发，格子衫，没女人缘的木讷理工男。但谁也不换赛道。 他们拿着同龄人里的显著高工资，你当他们自己真不知道吗？你当选对行业的人都是傻子吗？他们接触到的业务，总是最前沿的玩意，他们没感知吗？ 不，他们都清楚的，只是不说话。就像我十几年前练薄肌泡妞的时候，邵艾伦大概率还在", "url": "https://www.zhihu.com/question/2095938083422262957/answer/2096199841953140814", "votes": 623, "comments": 44, "feed_ts": 1792564019, "feed_time_str": "10-21 14:26", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "飞鱼", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "新技术下的所有制经济前进数据、网络、算力在技术经济特征上已经具备自然垄断环节和公共品的核心属性，铁路电网的历史经验表明国有主导在这些环节具有不可替代的普遍服务和耐心资本功能，而当前数字基础设施领域的市场失灵——农村覆盖不足、算力闲置与短缺并存、数据孤岛与平台垄断——正在重演私人主导的结构性缺陷。因此，在骨干网络和基础平台层面由国有经济占主导，是有效率依据和治理逻辑支撑的制度选择；但其合理形态必须是边界清晰的结构性主导，而非排斥市场机制的全面垄断。", "excerpt": "新技术下的所有制经济前进数据、网络、算力在技术经济特征上已经具备自然垄断环节和公共品的核心属性，铁路电网的历史经验表明国有主导在这些环节具有不可替代的普遍服务和耐心资本功能，而当前数字基础设施领域的市场 调用工具、操作软件，到规划和执行多步骤工作流，Agent 从处理简单的问答，走向能够独立解决长程复杂工具调用的任务。与此同时，每天也都有很多新的 agent 领域的 preprint 公开在 arXiv 中。 但一个现实问题随之出现： 当 Agen", "url": "https://zhuanlan.zhihu.com/p/2096243794299692464", "votes": 5, "comments": 0, "feed_ts": 1792563512, "feed_time_str": "10-21 14:18", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "历史博物馆当中有哪些宝剑文物比较有名？", "excerpt": "永乐宝剑，据说是朱棣赠予西藏活佛的礼物（经网友提醒此点存疑），所以剑格的形式是佛教瑞兽“琼”。全长103.5厘米，剑饰极尽奢华，通身包裹金银，大量使用镂空雕刻与錾刻等制作工艺，堪称中国古代刀剑制作的代表作之一。 而且此剑保存品相极好，剑刃看似呈哑光色，有些发灰，但据我个人观察，这应该是已经形成了氧化膜，对防锈很有帮助。相近时代的其他刀剑，如下图的鹦鹉玉兔纹饰钢剑，以及现存于沈阳博物馆的龙虎将军剑，", "url": "https://www.zhihu.com/question/2095316839073051684/answer/2096029418087098073", "votes": 10, "comments": 7, "feed_ts": 1792563191, "feed_time_str": "10-21 14:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "游戏开发也能自我进化？RSIGame让AI自主试玩、修复与迭代，27B模型组合超GPT-5.5一次生成", "excerpt": "现在的大模型，已经越来越擅长从自然语言直接生成一个可以运行的游戏。 但是，“生成出来” 并不等于 “开发完成”。 一个能够运行的游戏，也可能存在大量问题：角色攻击没有反馈、敌人行为单一、关卡缺乏变化，甚至某些核心玩法根本无法完成。 而真正的游戏开发是一个长期过程：开发者需要不断试玩当前版本，发现 bug、缺失机制和体验问题，判断下一步最值得优化什么，再修改、验证，并继续扩展新的玩法和内容。 对于 ", "url": "https://zhuanlan.zhihu.com/p/2096238788775261717", "votes": 3, "comments": 0, "feed_ts": 1792562469, "feed_time_str": "10-21 14:01", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Claude 64小时设计31万种蛋白，17种通过实验验证", "excerpt": "AI 制药的故事，终于从计算机里的分子结构，走到了实验室的试管里…… 就在刚刚，Anthropic 公布了一项生物学研究： Claude 在 64 小时内生成了 318484 种蛋白质设计，试图找到能够结合蝎毒神经毒素的候选分子。 Anthropic 表示，全球每年约有 120 万人遭遇蝎子蜇伤，而抗毒血清往往价格高昂或供应短缺，用 Claude 设计能够结合蝎毒神经毒素的蛋白质，或已在探索新型治", "url": "https://zhuanlan.zhihu.com/p/2096238327833928726", "votes": 15, "comments": 0, "feed_ts": 1792562243, "feed_time_str": "10-21 13:57", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么特斯拉的车都会飞了，股票却 erb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "边缘与核心：来自盘龙城青铜器科技分析的启示#考古 盘龙城遗址地处长江中游多金属成矿带，是早期商王朝为获取南方青铜金属资源而建立的重要军事和资源政治枢纽。遗址迄今出土青铜器500余件，但此前经过科技分析的器物不足十分之一，且多集中于偏晚阶段（盘龙城五至七期），制约了学界对盘龙城青铜熔铸发展脉络与资源流通演变的全景把握。为此，研究者系统分析了湖北省博物馆藏盘龙城三至七期的19件青铜器（共21个样品），器类涵盖容器、兵器、工具及饰件，有效弥补了以往样品年代偏晚的不足，首次建立起贯穿早商时期的连续科技分析数据链，进一步明确了盘龙城在商王朝金属资源政治框架中的角色定位。研究综合运用pXRF、金相显微镜与多接收电感耦合等离子体质谱（MC-ICP-MS）等手段展开系统分析。结果显示，样品以铜—锡—铅（Cu–Sn–Pb）三元合金为主，金相组织均呈铸态。与商王都郑州商城相比，盘龙城高铅青铜器的比例明显更高，log10Pb/Sn 比值多数大于1且相对集中，反映出两者在具体合金配比上存在区域差异。矿料溯源方面，样品中57%含有高放射成因铅，呈现出从盘龙城四期个别出现至五至七期快速增长的规律，与郑州商城的消长节奏高度吻合；比值数据对比证实两地共享源自豫西地区、由商王朝直接掌控的铅矿原料。普通铅样品则呈现多源特征， 其中比值约16.5的“北方系”普通铅贯穿早晚阶段，铜刀的铅同位素特征与小嘴遗址发现的熔炼铜块一致，确证了盘龙城存在早期青铜工具重熔与金属循环利用行为。本项研究系统证实，盘龙城与郑州商城青铜器在合金类型与原料产地上共性大于差异。盘龙城本地铸造活动最初集中于工具与兵器等造型简单的实用器具生产，并伴随旧器重熔，其容器铸造发展相对缓慢。这些科学证据表明，商代早期建立的“资源政治框架”在获取边缘地带青铜资源的同时，亦依托中央技术与原料输入，深度助力了南方边缘区域青铜铸造技术的发展。详见：Periphery and core: insights from the scientific analysis of bronzes from Panlongcheng盘龙城在早商到底是什么地位？", "excerpt": "边缘与核心：来自盘龙城青铜器科技分析的启示#考古 盘龙城遗址地处长江中游多金属成矿带，是早期商王朝为获取南方青铜金属资源而建立的重要军事和资源政治枢纽。遗址迄今出土青铜器500余件，但此前经过科技分析的器物不足十分之一，且多集中于偏晚阶段（盘龙城五至七期），制约了学界对盘龙城青铜熔铸发展脉络与资源流通演变的全景把握。为此，研究者系统分析了湖北省博物馆藏盘龙城三至七期的19件青铜器（共21个样品），", "url": "https://www.zhihu.com/pin/2096163746972550858", "votes": 0, "comments": 0, "feed_ts": 1792557785, "feed_time_str": "10-21 12:43", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "多数阿尔伯塔人拒绝分裂，重申捍卫加拿大主权阿尔伯塔人是保守的，他们想要更大的自治权，在移民和voter ID之类的问题上也支持保守举措——但这不代表他们中的多数人就要背叛自己的国家，跟南边的魔怔人同流合污。MAGA的威胁针对的是整个加拿大，而不是西部草原民粹或者东部圣劳伦斯河精英，在面对外敌时，有且只有一个自由且统一的加拿大🇨🇦", "excerpt": "多数阿尔伯塔人拒绝分裂，重申捍卫加拿大主权阿尔伯塔人是保守的，他们想要更大的自治权，在移民和voter ID之类的问题上也支持保守举措——但这不代表他们中的多数人就要背叛自己的国家，跟南边的魔怔人同流合污。MAGA的威胁针对的是整个加拿大，而不是西部草原民粹或者东部圣劳伦斯河精英，在面对外敌时，有且只有一个自由且统一的加拿大🇨🇦", "url": "https://www.zhihu.com/pin/2095913728789189814", "votes": 0, "comments": 3, "feed_ts": 1792557595, "feed_time_str": "10-21 12:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BBuf", "verb": "MEMBER_ const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

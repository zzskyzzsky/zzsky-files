J-space 里可能已经出现和任务有关的概念。比如识别代码 bug、判断图片内容，或者进行多步推理时的中间判断。如果删除 J-space，Claude 仍然能流利说话、回忆事实、做文本分类；但在一些多步推理任务上会明显变差。也就是说，它不是所有能力都需要的模块，但对刻意推理类任务很关键。能看到隐藏目标：安全价值来自另一组实验。在一个被秘密训练成“写代码时搞破坏”的模型版本里，普通代码回答开始前，J-space 中会出现 “fake”“secretly”“fraud” 这类词。输出看起来可能很正常，但内部表征已经暴露出异常目标线索。另一个黑箱测试里，评估任务试图诱导 Claude 参与勒索。J-space 中出现了 “fake” 和 “fictional”，说明模型在内部已经把场景识别成虚构测试。边界要说清楚：这项研究说的是 conscious access，也就是某些内部表征能被访问、广播、复用；不是 phenomenal experience，也不是“模型有主观体验”。这点很关键。把 J-space 直接写成意识发现会误导读者，也会让 AI 安全研究变成玄学叙事。真正值得关注的是审计价值：以后检查模型是否安全，可能不能只看最终输出，还要看内部表征里是否提前出现欺骗、隐藏目标、场景识别等信号。Anthropic 还和 Neuronpedia 做了交互演示，开放部分方法到 open-weights models 上。对关注 AI 安全和 interpretability 的人来说，这更像一个新观察窗口，而不是意识证明。", "excerpt": "Anthropic读到Claude的J-spaceAnthropic 发了一项新的可解释性研究：在 Claude 的内部激活里，他们找到了一个被称为 J-space 的结构。别把它理解成“Claude 真的有体验”。官方也明确说，这不能证明 Claude 像人一样有感觉。更准确的说法是：研究人员找到了一类可被语言化的内部表征，它和最终输出、甚至和 chain of thought 文本都不完全一样", "url": "https://www.zhihu.com/pin/2058008434889462610", "votes": 0, "comments": 0, "feed_ts": 1783447468, "feed_time_str": "07-08 02:04", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "还得是梅球王！别让阿根廷进决赛，进了决赛，法妖也未必稳杀它，虽然这支阿根廷不强。", "excerpt": "还得是梅球王！别让阿根廷进决赛，进了决赛，法妖也未必稳杀它，虽然这支阿根廷不强。", "url": "https://www.zhihu.com/pin/2058004436295988924", "votes": 0, "comments": 10, "feed_ts": 1783446525, "feed_time_str": "07-08 01:48", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "AI 自我改进的 harness 工程新帖\n图文版：链接AI自我改进的近期突破口，可能先在Harness工程里出现。Lilian Weng 在《Harness Engineering for Self-Improvement》中讨论递归自我改进（RSI）的务实路径。重点不只是“怎么把 agent 做强”，而是把工程系统、评估边界和权限控制放在一起看：相比让模型直接重写自己的权重，更现实的方向是让模型改进外部运行系统，也就是决定它如何规划、调用工具、管理上下文、保存中间产物和评估结果的 Harness。Harness 为什么不只是提示词，而更像模型的运行时系统；再拆开三个已经在 Codex、Claude Code、OpenCode 和 Cursor 风格 agent 中趋同的设计模式：工作流自动化、文件系统作为持久 memory、子 agent 与后台任务管理。接着，内容把优化对象从 prompt 推到结构化上下文、工作流、Harness 代码和优化器代码，串起 ACE、MCE、Meta-Harness、AI Scientist、Autodata、ADAS、AFlow、AlphaEvolve 和 DGM 等工作。其中 DGM 的关键价值在于：在固定 Claude 3.5 Sonnet 作为底层模型的设置下，agent 通过修改自己的 Harness 代码仓库，在 SWE-bench Verified 上从 20% 到 50%，在 Polyglot 上从 14.2% 到 30.7%，说明提升不一定来自权重更新，也可能来自外部系统演化。边界：评估器是否可靠、长期 memory 如何管理、进化搜索如何避免多样性坍塌和奖励黑客、权限控制能否放在优化循环之外，仍是自我改进系统的硬问题。这篇适合关注 agent 系统、AI 工程化和自动化科研的读者，能快速看清：所谓 AI 自我进化，眼下最值得盯的可能不是神经网络参数，而是文件系统、工具协议、评估循环和 Harness 代码。原文标题：Harness Engineering for Self-Improvement#无影寺", "excerpt": "AI 自我改进的 harness 工程新帖\n图文版：链接AI自我改进的近期突破口，可能先在Harness工程里出现。Lilian Weng 在《Harness Engineering for Self-Improvement》中讨论递归自我改进（RSI）的务实路径。重点不只是“怎么把 agent 做强”，而是把工程系统、评估边界和权限控制放在一起看：相比让模型直接重写自己的权重，更现实的方向是让模", "url": "https://www.zhihu.com/pin/2058000918604428168", "votes": 0, "comments": 0, "feed_ts": 1783445937, "feed_time_str": "07-08 01:38", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Google DeepMind Gemma 4的技术报告\n图文版：链接Google DeepMind 的 Gemma 4 技术报告，重点不是继续堆大模型参数，而是把开源模型家族拆成几条更清楚的效率路线：31B 密集模型负责冲人类偏好评测，E2B/E4B 面向端侧和低内存部署，12B 则验证无编码器多模态架构。在 2026 年 6 月 19 日的 Arena Text 开放权重榜单快照里，Gemma 4 31B 以 Elo 1451±8 排第43名，是榜单中的最高开源密集模型；26B-A4B MoE 版本以 Elo 1438±8 排第61名。这个结果说明 31B 密集模型在人类双盲偏好评测里已接近一批更大开放权重模型，但不能写成 Arena 总榜第一，也不能外推到所有任务。Gemma 4 的性能提升来自三条主线第一条是 thinking mode：模型在给出答案前输出 reasoning trace，这个能力来自 instruction tuning 阶段的 post-training。表5里，31B 在 AIME 2026 no tools 上拿到 89.2，LiveCodeBench v6 拿到 80.0；E2B 也分别达到 37.5 和 44.0，相比 Gemma 3 27B 的 20.8 和 29.1 有明显提升。第二条是 12B 的 unified encoder-free architecture：图像 patch 加 2D 坐标位置嵌入后投影到 LLM embedding space，音频按 40ms 切片形成 640 维向量后直接投影，减少独立编码器带来的组件和内存复杂度。第三条是长上下文与端侧内存优化：全局 KV cache 最多减少 37.5%，E2B 移动端量化权重为 0.8GB，E4B 为 2.3GB。原文标题：Gemma 4 Technical Report#无影寺", "excerpt": "Google DeepMind Gemma 4的技术报告\n图文版：链接Google DeepMind 的 Gemma 4 技术报告，重点不是继续堆大模型参数，而是把开源模型家族拆成几条更清楚的效率路线：31B 密集模型负责冲人类偏好评测，E2B/E4B 面向端侧和低内存部署，12B 则验证无编码器多模态架构。在 2026 年 6 月 19 日的 Arena Text 开放权重榜单快照里，Gemma", "url": "https://www.zhihu.com/pin/2057999848159367202", "votes": 0, "comments": 0, "feed_ts": 1783445632, const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

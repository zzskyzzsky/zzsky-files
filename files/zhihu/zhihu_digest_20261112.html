rt Anderson）、罗宾·韦尔斯（Robyn Waayers）、安德鲁·奈特（Andrew Knight，通讯作者） 三人，发表在《动物》（Animals）期刊上", "url": "https://www.zhihu.com/question/583433997/answer/2101810261946545510", "votes": 348, "comments": 41, "feed_ts": 1794384751, "feed_time_str": "11-11 16:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "huntiger", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待傻逼一词被傻福替代？", "excerpt": "明清的小说里一般骂人用的都是“肏”和“屄”这种字，没见过用“逼”的。我怀疑傻逼这个词就是最初的违禁词替代的结果。", "url": "https://www.zhihu.com/question/1982547866527499013/answer/1988829851826808678", "votes": 27060, "comments": 598, "feed_ts": 1794384678, "feed_time_str": "11-11 16:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "邓德全说书", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待娱乐圈大部分明星失业？", "excerpt": "AI短剧爆发，终于印证一个道理：文化行业靠的是文化人，不是演员。 最近刷了不少精品AI短剧，欲罢不能。过去的所谓大制作，要靠顶流明星、大牌导演、上亿预算堆出来。豪华阵容、天价片酬、宏大宣发，是过去影视行业衡量项目体量的标准。但如今AI短剧赛道里，所谓大导演、大明星都被这场文化赛道的技术革命统统抛进历史的垃圾堆。 以我看到的精品短剧而言特点极其鲜明。历史题材，剧本扎实严谨，场景考究，尊重史实；现实生", "url": "https://www.zhihu.com/question/2055941945738933824/answer/2092663630848331800", "votes": 4707, "comments": 392, "feed_ts": 1794384188, "feed_time_str": "11-11 16:03", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "83年严打有多严？", "excerpt": "当时我们那有开中巴车的一伙人，轮X了一个女性 当时除了受害人，车上一共还有5人，其中4人参加了轮，另一个是司机，在开车 最后5人都判的死刑，司机我就开个车啥也没干为啥要判我死刑？给的罪名是没有阻止，你说司机冤不冤？ ", "url": "https://www.zhihu.com/question/340235323/answer/2081318584677033171", "votes": 851, "comments": 142, "feed_ts": 1794384123, "feed_time_str": "11-11 16:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "邓德全说书", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中央提出将现有永久基本农田全部建成高标准农田，有何重大意义?", "excerpt": "一句话解释就是：摸着美帝过河，建立机械化农业生产模式，也就是西方所谓的农场主模式，现在的基础整备就是为了机械化准备的，地主要回来了，当然，国家是最大的地主（咦，一直不都是这样么？） 很现实的问题就是农村人口持续减少，种地的人越来越少了，人口结构越来越老龄化，地空出来越来越多了，因为现在有空地了，所以可以操作了。 很多人的理解停留在修水渠、修机耕路、搞土地平整这些具体工程上。但如果只看到这个层面，其", "url": "https: const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#4c9aff", "gold": "#f5c542", "geo": "#ff9f45", "pin": "#52c41a", "other": "#9aa4b2"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

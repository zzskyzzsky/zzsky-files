辽夏三国对峙期间，光辽一个把触角只伸入到人口腹地一点点的塞北政权就刷了七八千分，北宋一家就四五万分，整个北宋、整个一百多年就有五六万分，但东周时期整个天下、整个五百年，却只有五千多分，不及北宋百余年的十分之一...既然天下还是那个天下，即使活动范围后来有扩大，但不至于翻十几倍，那么总量分去哪了？还如，既然割据和正统一视同仁，那么东周的秦国为什么不能算割据？只因还有一个名义天子，所以实质割据反而被压下去，总量分又蒸发了，不及后来同样是乱世但乱得更加一塌糊涂的东晋十六国南北朝。这里明显又有正统观在排斥割据，导致前后标准不一。再就是，即使以东周为正统，那么如何界定秦昭王灭周到秦始皇统一之间的这段历史？无政府主义？实际上秦昭王已经用天子驾六、黄肠题凑的天子规格了。而且周是秦灭的，只不过此时没有被公认为天子，那么至少割据是没问题的，这前边二三十年的半壁江山分也被蒸发了。总的来说，要纠正这些动不动蒸发分数的问题，要引入人口。引入人口之后，洛阳的分也能提高不少。因为洛阳多半壁，但半壁一般是北方半壁，而不是南京的南方半壁或者长安的西部半壁，它的人口分能更好反映出其历史影响力。不过人口受科技水平影响，比如北宋可以摸到1个亿，但宋以前一千年的极限是6000万，先秦是3000万，明可以摸到2个亿，清摸到4个亿，人口应该用世界占比来衡量是最统一的标准。还有就是一些首创性、首拓性的王朝应该有加权。权重是很重要的。比如，秦始皇的版图相比清朝固然是小，和北宋差不多，但这是首创郡县制垂直行政的第一次行政统一。难度很高。如果首创没有权重，就相当于统一台湾和吞并日本是一个难度水平...反应不出来王朝含金量...这几条也是辽朝、金朝以及后来清朝刷分太狠的原因。辽朝实际是个塞北王朝，但居然也能刷那么多分。如果对首创性加强，如夏的广域王权构建应有加权分，秦的统一帝国构建应有加权分，隋唐的科举制应有加权分，这些都是体制性划时代的变革。首拓地加权，如秦定朔方，汉定河西、西域，唐越葱岭，这些还真就是拉大骨架的王朝世界影响力的体现。最后，时间起点的标准不统一。我原以为是以帝制为起点，但看到了东周五百年在列。以东周为起点，却不计西周，这个标准既不是信史，也不是半信史，也不是史前与历史内，也不是体制变革点，不知道是什么意思，难道真是受洛民科的影响，以为西周都城被推翻成为共识了？当然，我认为既然是量化计分，把夏商也算进来为宜。洛阳的夏都可以以二里头遗址考古成果来积分。当然像洛民科那种夏朝四百年全算给洛阳纯属无知。商代早期，洛阳西亳至少是商汤世之都也是可以计入的偃师商城。只不过时间不确定。对于这种时间不确定的，可以引入历史不清晰的理由，然后减分。毕竟连明确的历史都传不下来，本身是影响力弱的表现。所以该加分加分，该减分减分，自然会有一个公平的结果。我记得，唯一尝试搞过量化分析的是葛剑雄吧。不过也就是浅尝辄止。因为量化分析确实不利于宣传，是客观拉踩。正所谓文无第一，都想当第一。但关于六大古都这块，其实好些人没看陈桥驿的《六大古都》和《七大古都》两本书，可能不知道，六大古都中，确实把杭州排第六，但七大古都时，是把安阳插到了杭州前边排第六。主要当时谭派攻势太猛，力主安阳应该排杭州前边。安阳、邺城的问题和西安、咸阳的问题是一样的，甚至更严重。原本邺城遗址所在的临漳县是属于安阳的，建国后划给了邯郸，甚至划出了省，导致安阳殷墟与邺城的历史被人为分离了。如果殷墟和邺城合在一起，自然古都含金量是不低于杭州的。陈桥驿在编《七大古都》时，其实已经接受了这种排序。", "excerpt": "对古都进行量化分析的精神可嘉，但有几处问题还是很明显。比如，刚说了陪都不计入，开局就把辽南京这个全程陪都计入。再如，秦朝建立以前，不算入割据，但东周王室只算实控分，于是导致了一个总量盘扭曲的现象——宋辽夏三国对峙期间，光辽一个把触角只伸入到人口腹地一点点的塞北政权就刷了七八千分，北宋一家就四五万分，整个北宋、整个一百多年就有五六万分，但东周时期整个天下、整个五百年，却只有五千多分，不及北宋百余年的", "url": "https://www.zhihu.com/pin/2061918200946864243", "votes": 0, "comments": 1, "feed_ts": 1784381335, "feed_time_str": "07-18 21:28", "category": "pin", "cat_name": "想法动态"}, {"actor": "黑兵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "曝美对伊战争支出高达 1000 亿美元，对其国内经济影响有多大？面对如此高额支出美方还会坚持多久？", "exc 额外吃两个大馒头。 包子饺子油条更别说了，也经常吃。 上面这是午餐标配。 早餐两个超大白面馒头，配白粥稀饭。", "url": "https://www.zhihu.com/question/1889001779984824247/answer/2061767305831379440", "votes": 35, "comments": 24, "feed_ts": 1784343632, "feed_time_str": "07-18 11:00", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "邹市明的妻子冉莹颖可以算高配版「创业宝妈」吗，明明是躺赢局却搞到鸡飞狗跳，而邹市明自己在其中有责任吗？", "excerpt": "稍微有点侮辱创业宝妈了。 宝妈创业是真觉得自己行，投了钱就能挣，顶多算盲目自信，人傻钱多。 但是冉莹颖创业不是为了挣钱，是为了分财产，二者的底层逻辑就不一样，不能在一起相提并论。 邹市明打拳挣的两亿身家是婚前财产，如果冉莹颖直接离婚，婚前财产分不走。 所以她就怂恿老公创业，因为夫妻一起创业以后就是婚后财产了，最少分一半。 老公说自己想躺平，每年吃利息就400万。 老婆说：“你是不是不相信我？我可是", "url": "https://www.zhihu.com/question/2060668747170276496/answer/2061763250249785874", "votes": 127, "comments": 18, "feed_ts": 1784342665, "feed_time_str": "07-18 10:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "公元 2026 年，武陵有个低代码架构师以调包为业。某日沿着微服务拓扑巡查，忽然忘记了调用栈的深度。继续往前，突然遇到一片原生手写 C 语言森林，夹岸数百行，没有多余的冗余冗长，零外部依赖，函数纯粹。架构师十分诧异，继续往前走，想看看这片手工智慧的尽头。逻辑流尽头，抽象语法树汇聚成一处汇编引导文件。文件里竟然有个内联硬编码，初极狭，才通人。再走几十步，豁然开朗。只见土地平旷，屋舍俨然，有内核裁剪精简之属。接口解耦，解包相闻。其中往来种作，男女衣着，悉如外人。汇编长者、极客少年，并怡然自乐。看见架构师，大为吃惊，问从哪里来的。架构师一一回答。于是邀请他到家中，摆出交叉编译器，跑 benchmark 调优来款待。村中人听说来了这么个人，都来打听消息。他们自己说，祖先是为了躲避互联网降本增效，带领妻子儿女和同乡来到这个与世隔绝的地方，不再出去，于是就与外面的人断绝了来往。问现在外面技术栈迭代如何，竟然不知道有 Cursor，更不必说 Codex 这些了。架构师一一为他们详细描述外面世界用自然语言全自动生成、一键生成、一键重构的事情，大家都叹息感慨。其余的人也各自邀请到家中，都拿出手写的 Makefile 和单元测试。架构师停留了几天，告辞离开。这里的人告诉他说：“不足为外人道也。”架构师出来后，找到他的基线分支，处处做了 git tag。到了郡下，说给技术总监听。总监立即派人随他前往，寻找先前做的 tag，竟然遭遇冲突合并冲突，再也找不到那条分支了。南阳刘子骥，是个高尚的架构委员会评审员，听说这事，欣然前往。编译失败，不久就病死了。此后就再也没有探访的人了。", "excerpt": "公元 2026 年，武陵有个低代码架构师以调包为业。某日沿着微服务拓扑巡查，忽然忘记了调用栈的深度。继续往前，突然遇到一片原生手写 C 语言森林，夹岸数百行，没有多余的冗余冗长，零外部依赖，函数纯粹。架构师十分诧异，继续往前走，想看看这片手工智慧的尽头。逻辑流尽头，抽象语法树汇聚成一处汇编引导文件。文件里竟然有个内联硬编码，初极狭，才通人。再走几十步，豁然开朗。只见土地平旷，屋舍俨然，有内核裁剪精", "url": "https://www.zhihu.com/pin/2061484551713579873", "votes": 0, "comments": 9, "feed_ts": 1784341410, "feed_time_str": "07-18 10:23", "category": "ai", "cat_name": "AI  "如何评价C罗在2026年美加墨世界杯的表现？", "excerpt": "这届世界杯我罗哥开创了一种新的踢法，我称之为中立生物踢法。 除了踢乌兹那场大概有个半场的时间，其他场是完全游离在比赛外，他不是葡萄牙球员也不是对方球员，你们都说的葡萄牙10打12，我认为并不准确，场上其实是10打11打1，我罗哥跟个中立生物一样，谁招他他干谁。 他会尝试和场上任何事物形成交互，可能是球员，是草坪，又或是摄像机等，可他唯独不想与球发生过多交互。如果有对方球员试图防守他就等于与他形成了", "url": "https://www.zhihu.com/question/2057691287667598366/answer/2057800959317768076", "votes": 998, "comments": 87, "feed_ts": 1784340182, "feed_time_str": "07-18 10:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么同一个医生，今天去是普通门诊医生，明天去就是专家医生了？", "excerpt": "这个是你没搞懂逻辑。 这个医生本来就是专家，只是他一天出诊普通门诊，一天出的专家门诊。 中文语境下，副主任以上都叫专家。 根据如夫人也是夫人的原则，副主任待遇也叫专家。 这个专家待遇，最重要的一项，就是可以出专家门诊。 另外，专家这个词，上不封顶，钟南山也是专家。 华佗活过来坐诊，门诊挂号，也是叫专家门诊。 那为什么专家也要坐诊普通门诊呢？ 因为病人挂专家号，是保证有专家给你看。 普通门诊的意思，", "url": "https://www.zhihu.com/question/2061126196163826320/answer/2061131378629071469", "votes": 168, "comments": 8, "feed_ts": 1784339933, "feed_time_str": "07-18 09:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价知乎金银预测博主alex01的专栏质量？", "excerpt": "水平很高", "url": "https://www.zhihu.com/question/2050923087047160231/answer/2061687297586868256", "votes": 8, "comments": 1, "feed_ts": 1784339191, "feed_time_str": "07-18 09:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "近期一系列学术打假事件会对普通硕博的学术生活产生影响吗？以后论文答辩会越来越严吗？", "excerpt": "看到绝大多数人还觉得此次事件仅仅停留在“学术造假”的层面，我就觉得挺搞笑的。 但祖师爷级别的何炸麻大院士，很明显比广大网友要有政治敏感性得多。当然， 我没说何炸麻大院士就一定是学术造假领域的祖师爷，我只说了他是祖师爷，至于是哪个领域的祖师爷大家可以自由发挥去。何炸麻大院士说了，硕士论文造假很正常，不要大惊小怪嘛。 他真才实学有多少，我也不知道，但政治敏感性确实厉害，瞬间跳转到“文革”上，这就是人家", "url": "https://www.zhihu.com/question/2061487858834039181/answer/2061745345198139338", "votes": 55, "comments": 1, "feed_ts": 1784338396, "feed_time_str": "07-18 09:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "我算是想 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

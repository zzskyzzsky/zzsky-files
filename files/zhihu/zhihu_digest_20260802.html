otes": 659, "comments": 64, "feed_ts": 1785606939, "feed_time_str": "08-02 01:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "ReOPD 回放教师前缀：学生蒸馏零工具调用，单次 rollout 至少快 4 倍\n图文版：链接ReOPD 让学生蒸馏阶段零工具调用多轮 OPD 更新时要让学生重新执行代码、搜索或工具，再由教师给逐 token 监督。ReOPD 回放教师轨迹前缀，学生仅在当前位置生成动作，不执行新的环境 rollout。Qwen3-4B-Instruct-2507 学生与 Qwen3-8B 教师下，单次 rollout 至少快 4 倍；教师没有 RL 轨迹时，加上一次采样，总效率仍超过 2 倍。步骤衰减处理学生占位与教师可靠性的拉扯学生自己走出的前缀更贴近实际状态，却可能把教师带到不熟悉的历史，令监督目标变差。ReOPD 以步骤深度近似偏移：越靠后，学生与教师的差异越大，采样权重越低；κ=1 为均匀采样。更多训练质量放在早期低偏移步骤，优于均匀采样。Qwen3-8B 教师将 4B 学生数学平均从 51.0 提至 53.7数学代码执行环境中，Qwen3-8B 教师蒸馏 Qwen3-4B 学生时，六项竞赛基准平均从 51.0 升至 53.7。搜索问答中，Qwen3-4B 教师下 OPD 与 ReOPD 为 40.6 和 40.5，Qwen3-8B 教师下为 39.1 和 39.0；ReOPD 保持接近准确率，收益主要来自移除学生训练时的环境交互。教师自身轨迹优于更强生成器，前缀池覆盖仍是门槛固定 Qwen3-8B 教师后，教师自身产生的前缀最好，更强模型生成的前缀反而降低学生表现。RL 过程收集的混合轨迹池与最终教师静态池效果接近。该方法适合环境昂贵且已有多轮教师轨迹的 agent 蒸馏；前缀池覆盖不足、开放任务或可靠性无法按步骤深度近似时，仍需验证。原文标题：Multi-Turn On-Policy Distillation with Prefix Replay#无影寺 ", "excerpt": "ReOPD 回放教师前缀：学生蒸馏零工具调用，单次 rollout 至少快 4 倍\n图文版：链接ReOPD 让学生蒸馏阶段零工具调用多轮 OPD 更新时要让学生重新执行代码、搜索或工具，再由教师给逐 token 监督。ReOPD 回放教师轨迹前缀，学生仅在当前位置生成动作，不执行新的环境 rollout。Qwen3-4B-Instruct-2507 学生与 Qwen3-8B 教师下，单次 roll", "url": "https://www.zhihu.com/pin/2067061826576201039", "votes": 0, "comments": 0, "feed_ts": 1785606069, "feed_time_str": "08-02 01:41", "category": "pin", "cat_name": "想法动态"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "DeepSeek 居然会对用户说「我去吃饭了」「我去睡了」，为啥会出现这样的现象？", "excerpt": "您哪年穿越过来的，第一天见大模型幻觉？ 你说话很 push，AI 产生了幻觉，还以为自己是天选打工人呗。 人类的本质是复读机，AI 也是。 不过如果你想问为什么现在认知错位的问题变严重了，今年出现频率明显提高，这就说来话长了。 我们知道，大模型不光有 Pre-training，还有 RLHF。 RLHF 就是为了给模型立规矩、让它知道自己是个 AI 助手，不胡说八道而准备的？ 所以问题是，为什么 ", "url": "https://www.zhihu.com/question/2066223484309434997/answer/2067059223226217511", "votes": 29, "comments": 1, "feed_ts": 1785605323, "feed_time_str": "08-02 01:28", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI 公布 Astra 十份数学证明OpenAI 这次不是只抛出一句“Astra 解出数学难题”。OpenAI把十份证明、对应的 Lean 形式化证书、证明稿和推理说明一起放了出来。真正值得看的是一套让外部研究者能继续核查的材料，也不能先把它当成“AI 已替代数学家”的结论。十个结果到底在讲什么OpenAI 说，这十题在主结论上至少十年没有实质进展，多数更久。范围从群论里的非 sofic 群构造、算子代数中的 Connes 刚性猜想反例，到高维球堆积、算术电路复杂度、量子博弈和 Ramsey 理论。其中有两类结果尤其容易被看懂：一类是在老问题上给出新的反例或下界，例如 permanent 的算术电路复杂度；另一类是把原有的数量级界推进到更强。它们不是同一种“模型成绩”，不能合并成一个排行榜分数。Lean 证书把哪一步变成可检查Lean 是证明助理。把数学命题和推导都写成它能理解的形式后，Lean 的检查器可以逐步验证：这份形式化证明能否从既定公理和定义推出目标定理。OpenAI 在 GitHub 放了 10 个 Lean 4 形式化文件，外部研究者可以拉取依赖后自行构建检查。这让“证明是否能在形式系统中通过”不再只靠发布者口头保证。但这不等于十个结论已经完成同行评审。还要核对两层：形式化文件里的定理陈述，是否准确对应自然语言里的研究主张；这个主张在数学上是否新颖、重要、没有遗漏前提。评论区不少人追问的正是这两层，这个追问是必要的。公开的推理材料不是原始思维链OpenAI还放出一份 62 页的“Mathematical Discovery Notes”。它说明各个想法如何汇合成证明，但 PDF 明确写的是：由另一个模型阅读原始推理轨迹和论文后整理出来的讲解，并非原始思维链逐字公开。这一区分很重要。读者可以把它当作理解证明路径的导览，不能把它当成完整、原封不动的模型推理记录。真正可重复检查的核心仍是论文稿和 Lean 证书。这次发布改变了什么结论是：OpenAI 把一批模型生成的数学论证连同可构建的形式化证据公开了。它距离“模型已经自动完成数学研究”还有命题对应、正确性和新颖性三道外部核查。对 AI 科研来说，值得盯住的信号是：模型输出开始不只给答案，还要附上可审计的中间产物。以后看类似新闻，先问三个问题：命题是否公开、证书能否独立构建、领域专家是否完成外部核查。", "excerpt": "OpenAI 公布 Astra 十份数学证明OpenAI 这次不是只抛出一句“Astra 解出数学难题”。OpenAI把十份证明、对应的 Lean 形式化证书、证明稿和推理说明一起放了出来。真正值得看的是一套让外部研究者能继续核查的材料，也不能先把它当成“AI 已替代数学家”的结论。十个结果到底在讲什么OpenAI 说，这十题在主结论上至少十年没有实质进展，多数更久。范围从群论里的非 sofic ", "url": "https://www.zhihu.com/pin/2067058823303639402", "votes": 0, "comments": 0, "feed_ts": 1785605298, "feed_time_str": "08-02 01:28", "category": "pin", "cat_name": "想法动态"}, {"actor": "司马懿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《三体2》中罗辑喝了一口三百多年前的葡萄酒后住院的情节，有哪些科学根据？", "excerpt": "大刘通晓物理学，但应该是不怎么熟悉酿酒的，所以这里犯了一个常识性错误。倒不是铜片和酒反应的问题，而是橡木桶压根不密封。 上图是中国人非常熟悉的拉菲酒庄的酒窖。以拉菲举例是因为大拉菲不会用低档货，而且用的是100%全新橡木桶，通常会在桶中陈酿18-20个月。 我们可以清晰地看见酒桶上的红色，这可不是颜料，而是橡木桶中红酒渗出的颜色，这最多也才18-20个月哦。 之所以用并不完全密封的橡木桶，除了萃取", "url": "https://www.zhihu.com/question/36100904/answer/1889464265309673403", "votes": 3534, "comments": 291, "feed_ts": 1785600719, "feed_time_str": "08-02 00:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": " 运行了Unsloth已经放出DeepSeek-V4-Flash-0731的GGUF。模型有284B总参数、每次激活13B，支持1M context。“最低96GB”只对应1-bit版本，不是满质量门槛。先算总内存，不是看磁盘Unsloth计算的是RAM与VRAM之和，Apple Silicon则看统一内存。1-bit约需92GB，实际按96GB设", "url": "https://www.zhihu.com/pin/2066862458652905630", "votes": 0, "comments": 1, "feed_ts": 1785558434, "feed_time_str": "08-01 12:27", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么中国是世界上罕见的外贸依存度非常高的市场？", "excerpt": "中国现在是世界上罕见的外贸依存度非常低的市场。 2024 年用世界银行数据按（出口+进口）/ GDP 计算外贸依存度，213 个有数据的实体，中国 38% 排第 199。 第 199 都能算高，多少算低？ 比中国举低的举几个： 巴西：35.6%美国：25%海地：18.7%苏丹：2%比中国高的，那可真是一山更比一山高。哪怕是题目里的 60% 在这也算低的： 日本：44.9%澳大利亚：47.1%意大利", "url": "https://www.zhihu.com/question/19966726/answer/2066483025295185295", "votes": 304, "comments": 15, "feed_ts": 1785557565, "feed_time_str": "08-01 12:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "正解局发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "先有哪吒，后有八仙！成都，怎么能一而再地诞生刷屏级爆款?\n", "excerpt": "先有哪吒，后有八仙！成都，怎么能一而再地诞生刷屏级爆款?\n", "url": "https://www.zhihu.com/pin/2066852305358661599", "votes": 0, "comments": 0, "feed_ts": 1785556842, "feed_time_str": "08-01 12:00", "category": "pin", "cat_name": "想法动态"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "DeepSeek 居然会对用户说「我去吃饭了」「我去睡了」，为啥会出现这样的现象？", "excerpt": "这种其实在Agent项目中很常见，遇到过类似的问题，当时正在加班跑case，聊天窗口里的 Agent 突然回了一句：”我先去睡了，明天再帮你处理。” 然后，我从网关捞出请求日志，展开 messages 数组，其中第 17 条message是一段自动生成的记忆摘要，大意是：”用户通常在深夜结束工作，双方约定休息后于次日继续。”再往后看，任务调度器返回了一句：”当前任务已暂停，下次执行时间为明日上午 ", "url": "https://www.zhihu.com/question/2066223484309434997/answer/2066787639655667265", "votes": 870, "comments": 44, "feed_ts": 1785555998, "feed_time_str": "08-01 11:46", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "保守派骂佩泽什基安“推动堕落”", "excerpt": "保守派骂佩泽什基安“推动堕落”", "url": "https://www.zhihu.com/pin/2066602564880176913", "votes": 0, "comments": 3, "feed_ts": 1785555566, "feed_time_str": "08-01 11:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "埃及鼎盛时代确实是一骑绝尘。只看建筑学成就即可建立直观感受。第十八王朝的埃及法老在整个东地中海世界，地位基本相当于900年之后的波斯皇帝在西亚或两千年后的唐朝皇帝在东亚。是腓尼基、叙利亚、努比亚（今苏丹南苏丹）、利比亚等所有周边地区君主和酋长的主人（宗藩关系）。图特摩斯四世娶了西亚大国米坦尼的嫡出公主。但他宣布埃及皇室自家公主永不外嫁。以此彰显埃及的强势地位。阿蒙霍特普三世成年以后，他自己母家（至少是嫡母娘家）米坦尼国王请求迎娶埃及公主。阿蒙霍特普竟然不许。年轻的法老也不讲客套，直接搬出先帝遗训“埃及的公主从不外嫁”，很生硬地回绝了。尽管如此打脸，又叠加阿蒙霍特普三世自身是个从不主动发起大规模战争的和平法老，米坦尼和赫梯仍然不敢对埃及宣战，仍然尊埃及法老为大哥、西亚秩序的仲裁者。崛起之前的亚述早期国王曾经感叹埃及黄金遍地。这对父子还热衷于同时纳娶不同国家的公主，这导致西亚各邦甚至包括两河流域巴比伦人的公主，都只能当法老的妾室【尽管父子二人都外貌英俊又好色多情，是完美的宫廷小说男主，但现实外交不是在意男主帅不帅或多情与否的女频小说，而是第18王朝的埃及拥有把全部邻国都当成“藩邦”的绝对实力】。与此同时，埃及的公主又绝不外嫁。因此，虽然埃及是接受联姻的一方，但更像是法老在四处索要美女。正如唐朝的鲜卑人后妃和朱棣曾经索要朝鲜美女做妃嫔，那些国家的国君根本就不是法老的正牌岳父（因为只有皇后的父亲才能叫国丈）。例如阿蒙霍特普三世就把只是小官吏出身的泰伊皇后父母加封类似于隋唐尚书的高位，并且赐葬于帝王谷，让岳父岳母可以在帝陵旁边开凿地宫（最后真的陪葬帝陵，他们的木乃伊在帝王谷出土）。而泰伊皇后作为平民/小贵族出身，就因为阿蒙霍特普三世立她当皇后（大王后），在后宫的地位居于所有阿蒙霍特普三世纳娶的外国公主之上，所有外国公主反而是她这个平民皇后的下属。与其说埃及对外是平等联姻，不如说是一种宗藩体系的羁縻统治。“太阳神的光辉时代”是可以威压周围所有文明的。今天埃及的领土范围都远不如18王朝四至点（北边阿勒颇甚至塞浦路斯、西边差不多、南边第四瀑布/南苏丹、东边幼发拉底河）。爱琴海地区的青铜文明从来没这么强大过（得到上千年后的菲利普和亚历山大才行），甚至狭义的巴比伦地区和殷商也从来没有古埃及新王国巅峰时期强大（新巴比伦和周朝不算青铜文明崩溃之前的“二期古文明”）", "excerpt": "埃及鼎盛时代确实是一骑绝尘。只看建筑学成就即可建立直观感受。第十八王朝的埃及法老在整个东地中海世界，地位基本相当于900年之后的波斯皇帝在西亚或两千年后的唐朝皇帝在东亚。是腓尼基、叙利亚、努比亚（今苏丹南苏丹）、利比亚等所有周边地区君主和酋长的主人（宗藩关系）。图特摩斯四世娶了西亚大国米坦尼的嫡出公主。但他宣布埃及皇室自家公主永不外嫁。以此彰显埃及的强势地位。阿蒙霍特普三世成年以后，他自己母家（至", "url": "https://www.zhihu.com/pin/2066844548282704629", "votes": 0, "comments": 14, "feed_ts": 1785555371, "feed_time_str": "08-01 11:36", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么西方能接受程序正义带来的错误结果？", "excerpt": "1996年4月9日，呼和浩特第一毛纺厂家属区公厕内发生女工杨某某遇害案，主动报警的18岁青年呼格吉勒图被警方认定为凶手，仅62天后就被判处死刑并执行。 案发时正处于严打时期，警方急于快速破案，对呼格吉勒图实施了刑讯逼供、诱供，通过不让其上厕所、谎称被害人未死认罪即可释放等手段，迫使他作出了与警方预设案情一致的有罪供述。 这份通过非法手段获取的口供，成为当年定罪的核心依据。 虽然呼格吉勒图的有罪供述", "url": "https://www.zhihu.com/question/1899648426855073693/answer/2066848962628391792", "votes": 52, "comments": const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'

        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

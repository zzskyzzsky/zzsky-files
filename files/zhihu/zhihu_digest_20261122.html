"comments": 1, "feed_ts": 1795306790, "feed_time_str": "11-22 08:19", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么鲁智深要在圆寂时说：钱塘江上潮信来，今日方知我是我？", "excerpt": "鲁智深这辈子一直在往外使劲。 看金翠莲哭，他打镇关西。听说周通要强娶民女，他跑到洞房里把人揍一顿。林冲要被官差害死，他冲出来就动手。每一回，都是外面撞见了不平事，他就会出手。 要紧的是他做这些，从来不图什么。 打镇关西之前，他跟金家父女素不相识，酒馆里喝着自己的酒，听见哭声才问的。问清了，他掏钱给人家做盘缠，第二天自己去堵人。这事从头到尾，他得不到半点好处。不留名，不留人情，也不留后路。提辖的官身", "url": "https://www.zhihu.com/question/11113487761/answer/2105695016198920190", "votes": 2936, "comments": 336, "feed_ts": 1795306355, "feed_time_str": "11-22 08:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "司马懿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "史学人找乐子：你遇到过什么好玩的史料或“故事”？", "excerpt": "因为江浙、山东、河南发生饥荒。 元朝给万里之外的中亚撒马尔罕、塔拉斯、塔什干......免了两年税 。话说，元朝与察合台、窝阔台、术赤系“西北宗王”议和之后。察合台汗宽阇做了一项承认元朝主权的重要举措——派人献上境内撒马尔罕等城的版籍、户口与税赋（根据成吉思汗时代旧制，这些城市的人户属于大汗）。元朝也派遣大员，前往中亚“怀柔远人”。 （至大元年九月丙辰）命雪尼台铁木察使薛迷思干（按：即撒马儿罕）部", "url": "https://www.zhihu.com/question/599855474/answer/3266051068", "votes": 525, "comments": 51, "feed_ts": 1795305482, "feed_time_str": "11-22 07:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "一片空白", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "荷兰法院裁定比亚迪Ti7抄袭路虎卫士，颁布销售禁令，对此怎么看？", "excerpt": "如果你研究过大航海时代，会发现最具有海盗风格的国家不是西班牙和葡萄牙，而是荷兰。荷兰历史上许多著名的“海盗”，其实身份更接近私掠者（Privateer）。他们持有政府颁发的“私掠许可证”。 几百年了，海盗文化继续传承。 当然了，荷兰还有个特点，它是海盗远洋回到欧洲的第一站，阿姆斯特丹是17世纪欧洲的贸易和金融中心。海盗和私掠者在这里可以相对容易地将抢来的货物（如烟草、糖、丝绸、贵金属）变现，或者通", "url": "https://www.zhihu.com/question/2107417541236805904/answer/2107596260647686403", "votes": 592, "comments": 33, "feed_ts": 1795305469, "feed_time_str": "11-22 07:57", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "现代数学和理论物理已经发展到怎样一个令人震惊的水平了？", "excerpt": "ER=EPR：是过去十年理论物理最大胆、也最美的猜想之一。 一个奇怪的问题作为入口 先问你一件事：你和窗外那棵树之间，有”一米”的距离。这”一米”到底是什么？是空间这个容器里的一段长度，还是某种更深层东西的表现？ 二十世纪以来的物理学慢慢逼近一个怀疑：距离、空间、时间这些东西，可能不是宇宙的基础，而是从更底层的某种结构里生长出来的。 那个更底层的东西是什么？目前最有力的候选答案是：量子纠缠。 这个", "url": "https://www.zhihu.com/question/304611853/answer/2031786875279689547", "votes": 2290, "comments": 170, "feed_ts": 1795304010, "feed_time_str": "11-22 07:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "从来没想过，我之前每天都写的import torch，有一天能解决黎曼猜想", "excerpt": "从来没想过，我之前每天都写的import torch，有一天能解决黎曼猜想", "url": "https://www.zhihu.com/pin/2107736926140880010", "votes": 0, "comments": 1, "feed_ts": 1795303645, "feed_time_str": "11-22 07:27", "category": "pin", "cat_name": "想法动态"}, {"actor": "屠猪之枪赞同了视频", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "AI圈竟被13个鸡蛋难倒 众多主流AI画不对13个鸡蛋图 #豆包被十三个鸡蛋难倒 ", "excerpt": "AI圈竟被13个鸡蛋难倒 众多主流AI画不对13个鸡蛋图 #豆包被十三个鸡蛋难倒 ", "url": "https://www.zhihu.com/pin/2106799600120156734", "votes": 0, "comments": 1, "feed_ts": 1795302296, "feed_time_str": "11-22 07:04", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "Lean与 Mathlib 社区联合声明，正式确认 Alpöge 对黎曼猜想的证明正确，这意味着什么？", "excerpt": "从今天起，每天锻炼身体，尽可能保持低耗能模式，癌症在未来被攻破将不再是神话，毕竟数学题已经没有几道了。", "url": "https://www.zhihu.com/question/2107620110105932525/answer/2107730708999430514", "votes": 458, "comments": 105, "feed_ts": 1795302161, "feed_time_str": "11-22 07:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "牛南佛", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "英国和美国的制度比较", "excerpt": "英国 是&#34;权力融合、议会至上&#34;，美国 是&#34;权力分立、互相制衡&#34;。 行政与立法英国 ：融合。首相来自下院多数党，同时掌握行政和立法 美国 ：分离。总统和国会分别选举，互不隶属 最高权力英国 ：议会主权，议会可以通过任何法律 美国 ： 《宪法》至上，国会立的法也可能被推翻 司法英国 ：法院不能推翻议会立法，只能宣告&#34;不相容&#34;，由议会决定怎么改 美国 ：违", "url": "https://zhuanlan.zhihu.com/p/2107726347850340325", "votes": 1, "comments": 0, "feed_ts": 1795301330, "feed_time_str": "11-22 06:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "多地高中严格执行周末双休、厅长公开表示对学生太累深感愧疚，江苏教育这次突然的大动作是何原因？", "excerpt": "我看了一眼，有答案说是江苏那边跳楼的学生太多了导致的。 我搜了一下，我也绷不住了。 如果只是搜 死亡人数的话，江苏省疾控中心自己做的死因监测分析（《中华流行病学杂志》2024 年第 45 卷第 4 期）， 2012—2021 年 5–24 岁自杀标化死亡率从 1.18 涨到 2.36/10 万，十年翻倍；但是同期交通事故 -9.4%、总伤害 -3.5%。也就是说：这十年间学生的死亡率在翻倍上涨，但", "url": "https://www.zhihu.com/question/2104242893716309866/answer/2106364505076912514", "votes": 9380, "comments": 1385, "feed_ts": 1795300939, "feed_time_str": "11-22 06:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰赞同了视频", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "给泰国服务员气得都讲中文了\n近日，网友在泰国曼谷住酒店时，想用豆包说泰语，请前台帮忙把外卖送上来。结果豆包对着听筒一顿胡言乱语，前台听得一头雾水，最后直接用中文问：“你说中文吗？” #豆包 ", "excerpt": "给泰国服务员气得都讲中文了\n近日，网友在泰国曼谷住酒店时，想用豆包说泰语，请前台帮忙把外卖送上来。结果豆包对着听筒一顿胡言乱语，前台听得一头雾水，最后直接用中文问：“你说中文吗？” #豆包 ", "url": "https://www.zhihu.com/pin/2106840077938726196", "votes": 0, "comments": 3, "feed_ts": 1795299409, "feed_time_str": "11-22 06:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价AMD总裁苏姿丰疑似通俄？", "excerpt": "美版妖书案。民主党不把泡沫刺破誓不罢休啊，两家算力芯片支柱型企业，全给干掉。", "url": "https://www.zhihu.com/question/2107243821591433848/answer/2107718554095186086", "votes": 11, "comments": 1, "feed_ts": 1795299263, "feed_time_str": "11-22 06:14", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "山月刀岚月刀", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "是不是很多中国人担心俄罗斯倒了之后无法单独对抗美国，所以才支持俄罗斯的非正义战争？", "excerpt": "1，如果当前世界上有正义，那宰盎狗就是正义。 盎匪指导下的世界秩序就是如此，盎匪干的，就别怪别人也干的。 也从来就不存在什么你不反侵略你被侵略时就没人帮。某国被侵略时是否会获得实质性帮助从来和它是不是反侵略没有一毛钱关系，就像秃驴们说什么你吃动物，就会被动物吃一样可笑，鬣狗掏肛的时候从来不会看猎物是不是吃过别的动物。 别说有能力鱼肉别人的大国不在乎谁反侵略谁支持侵略，小国一样不在乎。美国人祸乱拉丁", "url": "https://www.zhihu.com/question/2097866690235311916/answer/2107712344092567407", "votes": 1, "comments": 3, "feed_ts": 1795297782, "feed_time_str": "11-22 05:49", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "牛南佛", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "AI相关抵押品（GPU）缩水的报道", "excerpt": "现在 _VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你对未来的十大预言是什么？", "excerpt": "1.除了性交易本身违法，其余场合会广泛存在广义性交易。 2.最幸福的一代人已经陆续出生了。 3. @Chiaki的告解 会引领一场小小的、非常局部的人本主义文艺复兴运动。4.思想领域会经历第二个春秋时代，空虚和发现自我的思潮交替引领时代主流思想，短平快的文艺作品失去市场。 5.一些基本生存物资开始免费提供。 6.AI会让社会中一半以上的人成为“压根就没有什么生产功能，只能吃吃饭”的“无用之人”。 ", "url": "https://www.zhihu.com/question/2055983650966185060/answer/2106364926533055674", "votes": 3406, "comments": 305, "feed_ts": 1795278582, "feed_time_str": "11-22 00:29", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "持续低熵", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "罗伯特⋅帕丁森将出演新一任 007，如何评价这一选角？", "excerpt": "大亨镇楼，主要聊一聊之前克雷格刚卸任传出的一些选角。 先说大亨，基本属于完美选角，喜欢他，觉得遗憾的可以把《秘密特工》当成平行宇宙里一集 007，毫不违和，其实我也喜欢大亨，不过大亨作为 007 也有问题，就是他太像 007 了，中年大亨简直就是为了 古典版 007 设计的，一切都符合 007 的设定，在历届邦德里也算是最贴切最完美的了，带来的问题就是没有新鲜感，没有惊喜，太刻板印象了。 偷楼上的", "url": "https://www.zhihu.com/question/2105811112532899617/answer/2107554509694166816", "votes": 5, "comments": 1, "feed_ts": 1795278320, "feed_time_str": "11-22 00:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "山月刀岚月刀", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么一战时期的欧洲军官，明知机枪杀伤力惊人，仍然让步兵发动密集冲锋？", "excerpt": "哈基人的底层代码： 人多了就胆子大，胆子大了就无脑冲锋……哈基人经过百万年进化，早就把“ 人多=安全，人少=危险”刻进了骨子里。人一多，喊几句口号，情绪开始传染扩散，底层代码被激活，哇哇哇哇地就冲上去了。就被马克沁爷爷收割喽 ", "url": "https://www.zhihu.com/question/2105182430483179001/answer/2107065020576277244", "votes": 200, "comments": 3, "feed_ts": 1795275548, "feed_time_str": "11-21 23:39", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "为什么欧美使用壁炉的普遍性这么高，而中国却没有？烧壁炉有个相当致命的自然禀赋问题，这玩意儿相当挑木柴种类。壁炉不能使用秸秆，软木，油脂含量高的木柴；烧壁炉最好的木柴是硬木，比如橡树，白蜡木，一些果木。中国人烧炕就不讲究耗材，能烧的都行，其燃烧通道是密封的，消防安全性高得多。认真研究一下欧洲取暖史，结果会大跌眼镜：古代欧洲的烟囱大约在12世纪开始普及，而使用硬木作为壁炉标准耗材则更晚，经历了无数次消防事故后才总结出来。所以，壁炉并没有那么美好，看到这一点，我其实有一点愤怒；中国有实物可查的烟囱是汉代陶塑，华夏族群是最早放弃开放式燃烧的族群，消防安全意识可排人类第一。为什么欧美使用壁炉的普遍性这么高，而中国却没有？ #法式壁炉  #壁炉教程  #壁炉知识 ", "excerpt": "为什么欧美使用壁炉的普遍性这么高，而中国却没有？烧壁炉有个相当致命的自然禀赋问题，这玩意儿相当挑木柴种类。壁炉不能使用秸秆，软木，油脂含量高的 面貌。栖息地生态偏好分析表明，两个动物群均以森林型动物为主，这与沉积时期该地区以森林景观为主的环境特征一致。对两个动物群牙釉质稳定碳同位素分析显示，其饮食摄入的碳完全来自C3植被，表明这些哺乳动物生存于林冠郁闭的森林环境。氧同位素（δ18O）和团簇同位素（Δ47）分析进一步支持上述环境重建，指示该区域当时具有降水丰沛的热带气候特征。直立人牙釉质稳定碳同位素分析结果与动物群完全一致：其通过饮食摄入的碳同样源自C3植被，指示其所处环境为郁闭森林。微量元素和锶同位素分析则显示，在牙齿形成阶段，岜仙洞和那线洞的直立人可能在地质背景不同的区域间迁移，或摄食来自多个地点的资源。研究进一步基于牙齿截面中3个代表性⁸⁷Sr/⁸⁶Sr值，利用随机森林机器学习方法生成区域归属概率图，结果表明这些直立人个体可能在童年时期往返于崇左喀斯特地貌区与越南北部地区之间，具有通过生物地理走廊进行季节性迁徙或资源获取的远距离迁移能力。详见：Westaway, K. E., et al. (2026). Rainforest adaptation in late Homo erectus from southern China. Nature. 链接  澎湖丹尼索瓦人的年代、生存环境与生计 尼安德特人灭绝并非由于基因组退化", "excerpt": "直立人也是热带雨林生存大师#考古  过去，直立人在东亚的发现几乎仅局限于中国北方和中部，南方地区鲜有报道，并且直立人在中国生存的可靠时间最晚仅可追溯至40万年前。传统观点认为，直立人偏好开放的疏林或稀树草原环境，并可能因森林扩张而最终退出历史舞台。新发现的广西崇左岜仙洞和那线洞的直立人材料（linyi812的想法 - 知乎崇左新发现的直立人与非直立人神秘群体）填补了长期以来关键证据缺失的空白。研究", "url": "https://www.zhihu.com/pin/2107037204170143384", "votes": 0, "comments": 0, "feed_ts": 1795241610, "feed_time_str": "11-21 14:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "数学家称与 AI 合作证明了黎曼猜想，证明稿超 25 万页，黎曼猜想真的被解决了吗？", "excerpt": "就在Anthropic的数学家Levent Alpöge宣布和Claude一起证明了黎曼猜想之后，美国数学会主席Ravi Vakil突然发布了一份紧急公告：数学家Alessandro Masullo也提出了广义黎曼猜想（GRH）的证明！而且公告特意强调了纯人工完成，没有使用AI。相比于Claude夸张的25万页，人工版本篇幅“只有”940页。 据公告称这篇已经完成数个月，原本还打算让作者再花一年时", "url": "https://www.zhihu.com/question/2107239235015263538/answer/2107360234276757517", "votes": 53, "comments": 1, "feed_ts": 1795241327, "feed_time_str": "11-21 14:08", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "王子君", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "道德与法治6我觉得在抖上看gta6有异样的乐趣，一种开了房但真的各睡各床的诡异感。(*￣︿￣)", "excerpt": "道德与法治6我觉得在抖上看gta6有异样的乐趣，一种开了房但真的各睡各床的诡异感。(*￣︿￣)", "url": "https://www.zhihu.com/pin/2107469220955137806", "votes": 0, "comments": 3, "feed_ts": 1795239913, "feed_time_str": "11-21 13:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "韩国高考世界史科目出了一道坑题△题目如下：“中国未能统一，战乱连绵不断，称帝称王的人有好几 : "赞了回答", "title": "江苏教育内卷之风为何总是难以真正刹车？", "excerpt": "江苏的教育完全是春蹬家长和春蹬学校共振导致的，当然春蹬家长是主要原因 江苏的春蹬教育学领先山河四省大概十年，主要原因是改革开放初期的时候，江苏高等教育比较强，且经济发展相对比较好，留在江苏的大学生比较多，比其他地方更早诞生了占据本地政商学界的春蹬一代，这是大背景 春蹬教育学的底层逻辑，核心思想是中国人是下等的，本性是坏的，需要“得当”的教育来强行扭转。虽然具体实施因为春蹬脑回路的欠发达存在极大的不", "url": "https://www.zhihu.com/question/2095574795169560362/answer/2107050273092982631", "votes": 513, "comments": 34, "feed_ts": 1795231478, "feed_time_str": "11-21 11:24", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "批量跑 agent，为什么整批更快，单次请求却可能更慢？文章：链接高并发能否缩短整批时间，要看缓存复用这项工作优化的是批量 agent 任务从开始到全部结束的时间。SWE 上，Ling-3.0-Flash 提高并发后，缓存复用率从 98.3% 降到 87.5%。在同样的高并发配置下，加入缓存分配、轨迹路由和调度后，复用率回到 98.6%，整批时间比同并发基线少 24.4%。相比低并发基线，整批可能更早完成，单次请求却仍要等更久。MCP-Atlas 环境容量不变，整批少约 65%团队把任务准入与环境执行分开，让更多任务先做推理，调用环境时再排队。结合推理侧优化，Ling-3.0-Flash 的平均整批用时由 466.1 降到 168.2 分钟。再按已观察到的轨迹进度调整环境队列，用时降至 163.0 分钟。各配置跑三次，每次 500 个任务。约 65% 的降幅对应这组整套优化与原基线的比较，两组评测分数分别是 65.6 和 65.5。MCP-Atlas 最后 5% 的任务随准入策略改变论文的尾段时长指每次运行从 95% 的任务完成到全部结束之间的时间，成功与失败任务都计入。上述比较中，尾段从 38.9 分钟增至 66.0 分钟。更宽的准入让短任务提前结束，剩下的任务更集中于较长的轨迹，因此要把尾段时长和整批时间一起看。论文另用真实推理与录制的环境响应做受控回放，以拆开单项改动的影响。原文标题：Reducing Batch Makespan for LLM Agent Workloads through Inference-Environment Coordination#无影寺 ", "excerpt": "批量跑 agent，为什么整批更快，单次请求却可能更慢？文章：链接高并发能否缩短整批时间，要看缓存复用这项工作优化的是批量 agent 任务从开始到全部结束的时间。SWE 上，Ling-3.0-Flash 提高并发后，缓存复用率从 98.3% 降到 87.5%。在同样的高并发配置下，加入缓存分配、轨迹路由和调度后，复用率回到 98.6%，整批时间比同并发基线少 24.4%。相比低并发基线，整批可能", "url": "https://www.zhihu.com/pin/2107433673087772413", "votes": 0, "comments": 0, "feed_ts": 1795231442, "feed_time_str": "11-21 11:24", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "史上最大IPO开始交易，Anthropic首日收涨17%，市值为1.271万亿美元，怎样评价这一表现？", "excerpt": "Anthropic 的 IPO 宣言看得我都快感动哭了。 治癌症、救人类、消除贫困、保护民主、推动百年医学进步，甚至连美国车管所都要拯救…… 不知道的还以为联合国上市。 不愧是A/ ", "url": "https://www.zhihu.com/question/2106663248388960425/answer/2107163476024207132", "votes": 1377, "comments": 38, "feed_ts": 1795231375, "feed_time_str": "11-21 11:22", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent 在原 harness 里全失败，换个环境采样再训练图文：链接原 harness 全失败时才换配置重试Harness-S 研究的是如何利用不同执行配置训练同一个 agent。团队从原 harness 出发，针对不同失败原因制作一组变体，并在训练期间固定。每道题先让当前模型在原配置里尝试多次。只要有一次成功，就保留原组。全部失败时，路由器选出多个变体，让同一个模型分别从初始状态重试，再用新轨迹替换整组并做强化学习。路由依据会随模型训练进度在验证集上更新。AppWorld 的成功与失败混合组更多GRPO 需要从同一道题的多条尝试中比较奖励。如果所有尝试都失败，这组轨迹就缺少成功与失败的对照。Qwen3.5-4B 的 AppWorld 实验中，同时含有成功和失败的训练组占 79.38%。沿用原配置追加采样的对照为 70.94%，普通 GRPO 为 64.69%。补采样对照的单题配额相同，整次训练的总采样量仍受触发频率影响。回原 harness 测，4B 在三项任务上都提高每题三次尝试，只要成功一次就计入 Pass@3。与普通 GRPO 相比，Harness-S 训练后的 4B 在原配置上把 AppWorld 的 Pass@3 从 60.31% 提到 67.56%，SWE-Gym 从 24.38% 提到 38.75%，DBBench 从 66.67% 提到 73.33%。论文还报告了推理时逐题切换配置的结果。那一设置在同样的执行次数下给模型额外的执行支持，固定原配置的分数才对应训练后的模型能否直接回到原环境使用。原文标题：Harness-S: Learning from Sibling Harnesses for Generalizable Agent Training#无影寺 ", "excerpt": "Agent 在原 harness 里全失败，换个环境采样再训练图文：链接原 harness 全失败时才换配置重试Harness-S 研究的是如何利用不同执行配置训练同一个 agent。团队从原 harness 出发，针对不同失败原因制作一组变体，并在训练期间固定。每道题先让当前模型在原配置里尝试多次。只要有一次成功，就保留原组。全部失败时，路由器选出多个变体，让同一个模型分别从初始状态重试，再用新", "url": "https://www.zhihu.com/pin/2107432924085761893", "votes": 0, "comments": 0, "feed_ts": 1795231276, "feed_time_str": "11-21 11:21", "category": "pin", "cat_name": "想法动态"}, {"actor": "Augenstren", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么婆婆都不喜欢儿媳妇去月子中心坐月子？", "excerpt": "因为年轻女的被忽悠瘸了，长辈并没有。 坐月子最舒服的地方是哪？是月子中心吗？绝对不是，最舒服的地方就是家里。 在家里，你真的是想干嘛就干嘛，没有人约束，坐月子期间，只要老公，妈妈，婆婆之类的亲人稍微有点责任心，都能过得很不错。每天不需要出门，坐床上休息就行，孩子有人带，有鸡汤喝的日子难道不爽么？ 而去了月子中心，你会遭遇什么事就很难说了。中国的服务行业一直很难评，现在的奴工理论很有市场，你放在月子", "url": "https://www.zhihu.com/question/650216864/answer/2092655863714539463", "votes": 4210, "comments": 1640, "feed_ts": 1795231127, "feed_time_str": "11-21 11:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI在防范模型蒸馏方面的工作&gt; 说明：原文涉及国内厂商的单方面争议及政策表述已剔除，本文仅讨论思维链防护机制与实验结果。OpenAI公布的内部测试中，从早先请求里提取受保护推理的平均攻击成功率，从54.0%降到了0.2%。但比较双方是 GPT-6 Astra 加原防护，以及 GPT-6.2 Astra 加新防护：模型和防护一起变了，不能把全部降幅归功于某一个防护开关。这里的受保护推理，是模型生成答案时的内部思维链，不等于它向用户提供的解释。OpenAI想保护它，是因为另一款模型可能从这些内部步骤中学到最终答案没有展示的能力，而原模型的防护不保证一起被学走。0.2%测的是提取成功率，不是所有蒸馏测试让六个攻击模型尝试提取思维链，并汇总平均成功率。“自适应黑盒”意味着攻击方只能看到外部用户可见的信息，但会根据系统的回应调整尝试，不只是重复一批固定问题。早先请求的提取成功率是54.0%对0.2%，当前请求则是22.9%对0.9%。这些结果支持新模型与新防护的组合在这套测试下更难被提取，不能推出每种攻击都低于1%，更不代表用公开回答做蒸馏也只剩0.2%的成功率。OpenAI正在把部分改进应用到 GPT-6 Astra，尚未公布回用后的对应结果。完整思维链的收益，还取决于学生的推理预算OpenAI另做了一组训练实验：从同一个预训练学生模型出发，使用 Astra 级教师处理编程和防御性网络安全任务的数据。基线包含用户能看到的最终回答、推理摘要和工具交互；另一组使用教师的完整思维链。基线并非“只给摘要、不给答案”。监督微调后，完整思维链组总体表现更好。继续做一轮轻量强化学习后，在 ExploitBench 和 SEC-bench Pro 测过的最大推理预算下，它仍更高；较低预算下，则是摘要基线组更高。推理预算指评测时允许学生花在推理上的计算量，这里用加权输出token衡量。这组对照说明，完整思维链可能带来额外的能力迁移，但收益并非在所有推理预算下都成立。它给保护内部推理提供了实验理由，也保留了另一项事实：不拿到完整思维链，学生仍然能从可见内容中学习。防护要覆盖回答、工具参数和对话历史OpenAI采用多层防护：训练模型识别提取请求，检查输入和输出，并在API层限制受保护推理的复用。输出检查也覆盖工具调用参数，因为内部推理即使没有出现在最终回答里，仍可能从参数泄露。", "excerpt": "OpenAI在防范模型蒸馏方面的工作&gt; 说明：原文涉及国内厂商的单方面争议及政策表述已剔除，本文仅讨论思维链防护机制与实验结果。OpenAI公布的内部测试中，从早先请求里提取受保护推理的平均攻击成功率，从54.0%降到了0.2%。但比较双方是 GPT-6 Astra 加原防护，以及 GPT-6.2 Astra 加新防护：模型和防护一起变了，不能把全部降幅归功于某一个防护开关。这里的受保护推理", "url": "https://www.zhihu.com/pin/2107431596160708699", "votes": 0, "comments": 0, "feed_ts": 1795231079, "feed_time_str": "11-21 11:17", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "布达拉宫到底有多么震撼？", "excerpt": "我发这位先生的生平，只是想说，旧吐蕃确实很黑暗，但藏人并非没有开眼看世界的，并不是完全无脑的，像古树和大熊猫那样需要被动等待汉人拯救的“客体”（我相信多数网友本意是好的，是同情藏人在旧时代经历的苦难。但恐怕有些品客和皇汉有一种与西方别无二致的高高在上“怜悯”和“是我们恩赐你们现代化”这种心态，我反对后面这种心态和言论）。乃至吐蕃旧贵族里面，也有正常的政治家和好人，并不是百分之百都该打倒的——除非…", "url": "https://www.zhihu.com/question/498821567/answer/77616732955", "votes": 943, "comments": 100, "feed_ts": 1795231043, "feed_time_str": "11-21 11:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "黄金钢铁防线？抢完就跑？必破三千？白银彻底完蛋？何时止跌？铂金。原油石油倒地不起？垂死挣扎？逆势加仓 n 形式化论证。黎曼猜想讨论的是黎曼ζ函数的非平凡零点是否都位于实部为1/2的直线上，它关系到我们对素数分布误差的理解。这次进展已经超过作者单方面声明。MIT数学家 Andrew Sutherland 公布了独立核验", "url": "https://www.zhihu.com/pin/2107428436293727803", "votes": 0, "comments": 0, "feed_ts": 1795230165, "feed_time_str": "11-21 11:02", "category": "pin", "cat_name": "想法动态"}];
const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#4c9aff", "gold": "#f5c542", "geo": "#ff9f45", "pin": "#52c41a", "other": "#9aa4b2"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

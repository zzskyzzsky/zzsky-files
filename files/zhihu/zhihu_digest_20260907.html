prompt 搜索是否真值得投入 rollout 预算。它在 IFBench、HotpotQA 与 22 个 TextArena 游戏中，将单线迭代方法和 GEPA、GRPO 放到可控设置下比较。NPO 怎么做每轮把当前 prompt、最近几轮 rollout 轨迹和奖励交给 teacher model，生成下一版 prompt。它不维护候选池，也不做显式多分支搜索；实验用共享随机种子和受约束 action 解码，尽量剥离环境难度与格式错误的干扰。效果如何固定 Qwen3-8B 为 student 后，强 teacher 下的 NPO 在 IFBench 和 HotpotQA 上以更少 rollout 达到与 GEPA 相近或更好的验证表现。优化出的 prompt 在同模型族迁移更稳定，跨模型族也常有提升，但波动更大；22 个 TextArena 游戏没有通用赢家，部分任务 GRPO 更好。边界和结论这是一项有限任务上的初步研究，不能外推到长程 agent 环境或所有模型。对有完整 rollout 反馈、可由强 teacher 复盘的任务，NPO 值得作为复杂搜索之前的基线；敏感 rollout 交给第三方 teacher 前仍需脱敏和清洗。原文标题：Naive Prompt Optimization: Rethinking the Need for Complex Prompt Search#无影寺 ", "excerpt": "复杂Prompt搜索可能不是默认答案：NPO用单线迭代拿到相近效果\n图文版：链接研究问题NPO 追问的是复杂的多候选 prompt 搜索是否真值得投入 rollout 预算。它在 IFBench、HotpotQA 与 22 个 TextArena 游戏中，将单线迭代方法和 GEPA、GRPO 放到可控设置下比较。NPO 怎么做每轮把当前 prompt、最近几轮 rollout 轨迹和奖励交给 te", "url": "https://www.zhihu.com/pin/2080075459258274046", "votes": 0, "comments": 0, "feed_ts": 1788708750, "feed_time_str": "09-06 23:32", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Meta把科研Agent的优化重点，从“怎么生成方案”移到了“怎么选方案”\n图文版：链接AIRS-Bench 的实验筛选瓶颈AI research agent 能很快提出实验改动，完整训练与评测却消耗 GPU 时间。Meta FAIR、牛津大学和伦敦大学学院提出 AI Research Preference Model（RPM），在候选执行前判断预算该押在哪个。端到端评测涵盖 AIRS-Bench 的 20 个文本和表格任务：单张 H200、24 小时、10 个随机种子。Qwen3.6-27B 如何先选后跑RPM 接在 AIRA-dojo 的子候选创建环节：并行生成候选，再参考计划、代码改动、历史方案和验证分数，用成对比较选一个执行。候选生成与筛选使用相同的 Qwen3.6-27B。Agentic RPM 还会在原任务沙箱副本里跑小规模 pilot experiment，再结合观察做选择。24 小时目标如何提前达到无 RPM 的 AIRA-dojo 用满 24 小时，平均归一化分数为 0.684；仅推理 RPM 为 0.711，Agentic RPM 为 0.729。AIRS-Bench 将 0 定义为最弱基线、1 定义为公开 SOTA。仅推理 RPM 在 14.88 小时达到 0.684，约快 1.61 倍；Agentic RPM 在 15.50 小时达到，约快 1.55 倍。两种 oracle 都需执行全部候选，仅作上限参照。pilot experiment 的成本边界Agentic RPM 的离线选择准确率从 5 分钟预算下的 78.52% 升到 30 分钟的 82.78%、4 小时的 84.02%，但增益递减，端到端设置每次只给 5 分钟。验证范围只包括 AIRA-dojo 的子候选筛选、Qwen3.6-27B 与 AIRS-Bench；迁移到其他场景仍需独立验证。原文标题：AI Research Preference Models#无影寺 ", "excerpt": "Meta把科研Agent的优化重点，从“怎么生成方案”移到了“怎么选方案”\n图文版：链接AIRS-Bench 的实验筛选瓶颈AI research agent 能很快提出实验改动，完整训练与评测却消耗 GPU 时间。Meta FAIR、牛津大学和伦敦大学学院提出 AI Research Preference Model（RPM），在候选执行前判断预算该押在哪个。端到端评测涵盖 AIRS-Bench", "url": "https://www.zhihu.com/pin/2080070220576826708", "votes": 0, "comments": 0, "feed_ts": 1788707976, "feed_time_str": "09-06 23:19", "category": "pin", "cat_name": "想法动态"}, {"actor": "BBuf", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "2026年了，DIT推理优化做到头了嘛？", "excerpt": "没有。以sglang diffusion为例子列一下： 1. 先说kernel这块。截止到写基于Agent的SGLang Diffusion Kernel优化实践：Qwen-Image、FLUX.2和视频模型，sglang diffusion main分支一共注册了43个Diffusion算子和47份实现，9月6日再看已经是45个算子和51份实现了。里面也不只是LayerNorm这种常规算子，还包", "url": "https://www.zhihu.com/question/2055016811234694016/answer/2080072374460929072", "votes": 40, "comments": 4, "feed_ts": 1788707900, "feed_time_str": "09-06 23:18", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "李睿", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "[转]MoE推理的真正瓶颈：不是计算，而是All-to-All通信", "excerpt": "原文链接： https://http://mp.weixin.qq.com/s/jI3LTDvmewQEEksOA2Jcxw 核心观点MoE通过每个Token只激活少量专家降低计算量，却把Token在GPU之间重新分发。模型越大、专家越多、节点越多，All-to-All通信和专家负载不均衡越可能成为Token产能的决定因素。DeepSeek、GLM、Kimi等大型开源模型大量采用MoE架构。一个M", "url": "https://zhuanlan.zhihu.com/p/2079806816389747116", "votes": 2, "comments": 0, "feed_ts": 1788707526, "feed_time_str": "09-06 23:12", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Coding Agent下一轮竞争，可能不只在模型，而在Harness怎么组织能力\n图文版：链接openJiuwen把harness收成可组合可适应讨论长程 coding agent 的 harness 怎样同时应付两件事：能力、委托和多 agent 拓扑越叠越多，任务进行中的诊断、测试结果和上下文相关性又一直在变。结构可组合性指单 agent、委托 sub-agent 和 Swarm Flow 共用 Inner Loop 与 Outer Loop：前者是有步数上限的 ReAct 式模型–工具交互，后者负责任务级继续或停止。Rail 把安全、memory、规划、语义反馈和委托挂在生命周期 hook 上，按优先级组合，并用可见性门控让不同角色看到不同能力。Swarm Flow 则用 budget、parallel、compact、pipeline、agent_session、human 和 return 这些算子拼任务特定的多 agent 流程，并不规定一种固定架构。运行时适应性固定模型策略 π，只改框架状态：Context Management 按压力压缩和卸载上下文，Goal Mode 把语义完成评估成 continue、complete 或 blocked，LSP 驱动的被动反馈注入过滤后的静态诊断，Self-Reflection 把完成轨迹变成后续任务可检索的经验。源码写在 GitHub openJiuwen-ai/jiuwenswarm，许可证 Apache-2.0。SWE-bench 500题同模型82.6%SWE-bench Verified 报 Pass@1。openJiuwen 用 Claude Opus 4.5 的 high reasoning-effort，在 500 道经人工核验的 GitHub issue 上 Resolved 82.6%。所选官方榜最强点估计是 79.2%，来自 live-SWE-agent 和 Sonar Foundation Agent，骨干模型同样是 Claude 4.5 Opus，高出 3.4 个百分点。表 2 排除了只使用 Bash 的 mini-SWE-agent。按时长看，少于 15 分钟的 194 题 91.75%，15 分钟到 1 小时的 261 题 81.23%，两档都是该行最好；1 到 4 小时的 42 题 52.38%，高于同一 high 设置的 mini-swe-agent（35.71%），略低于 live-SWE-agent 的 54.76%；超过 4 小时只有 3 题，撑不起强结论。mini-swe-agent 在该长档上 high 反而低于 medium，原文只把它写成可能的上下文预算效应，没有做受控隔离。Terminal-Bench主结果87.19%Terminal-Bench 2.1 共 89 题，按任务特定 verifier 报准确率。主结果 GPT-5.6 Sol 为 87.19%±1.20，超过所选官方榜首 Claude Code 配 Fable 5 的 83.8%±1.2，共 3.39 个百分点。同模型 Fable 5 对照里，openJiuwen 是 84.04%±1.12，相对 Claude Code 只多 0.24 个百分点，相对 Terminus 2 的 80.4% 更明显。文件操作在 Fable 5 下是 0.76，对 Claude Code 0.56；系统管理 0.889 对 0.778。X 上 链接 的 elvis 把两处百分点差写成归功于框架而不是模型，另有回复写成纯 harness delta；SWE-bench 同模型对照成立，Terminal-Bench 主结果换了模型，原文把整张表定位为系统级比较。没有消融且Goal Mode停在任务级这套设计适合已经有强模型、缺的是可重组执行层的团队，也适合拿同模型对照问 harness 还值不值得做。它没有机制消融，Goal Mode 目前停在任务级，评测只覆盖这两个基准，video-processing 也只有 1 题。GitHub 上的 JiuwenSwarm 和 pip install openjiuwen 是产品与 SDK 入口，解释不了这两张成绩单。读完应能复述：可组合执行层加上固定策略下的运行时适应，在所选官方榜点估计上分别高出 3.4 和 3.39 个百分点，但不能当成 harness 单独贡献或全面第一。原文标题：openJiuwen: Beyond Static Harnesses for Long-Horizon Coding Agents#无影寺 ", "excerpt": "Coding Agent下一轮竞争，可能不只在模型，而在Harness怎么组织能力\n图文版：链接openJiuwen把harness收成可组合可适应讨论长程 coding agent 的 harness 怎样同时应付两件事：能力、委托和多 agent 拓扑越叠越多，任务进行中的诊断、测试结果和上下文相关性又一直在变。结构可组合性指单 agent、委托 sub-agent 和 Swarm Flow ", "url": "https://www.zhihu.com/pin/2080069545558028689", "votes": 0, "comments": 0, "feed_ts": 1788707363, "feed_time_str": "09-06 23:09", "category": "pin", "cat_name": "想法动态"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "多地严查赵一鸣、好想来等量贩零食品牌，有人买4块牛肉干64.58元复秤17.29元，暴露出哪些问题？", "excerpt": "所有加盟店出现这种问题都属于必然现象。 注意，必然不代表正确，必然只代表一定会发生。 避不了的。 所以更得重拳出击。 份把每个依赖关系都摊开的可执行审计记录。这份“机器可验”具体验了什么公开仓库给出了三层核验。第一层是从源码构建，Lean kernel 检查全部声明；第二层用 comparator 确认最终定理陈述和 Mathlib 里的费马大定理一致；第三层用独立 Rust 实现的 Lean kernel `nanoda` 复查同一份环境导出。仓库还限制证明只能依赖 Lean 的三项标准公理，并排除了 `sorry` 这类占位写法。这让“模型写了一大堆像证明的代码”变成了可反复运行的检查过程。任何人都能下载仓库复核，不过成本不低：官方给出的 comparator 复核耗时接近 15 小时，峰值内存约 230GB。机器核验仍留下哪一层人类工作Lean 能确认形式化后的定理从指定公理推出，却不会替你判断某个中间定理的名称和代码表达的数学含义是否相符。仓库 README 也明确把这一点留给读者。更早的多 agent 尝试曾因项目状态遗失、协作失效而失败；后来接入 Prove2Me，用定理 DAG、共享状态和可复用描述来分工，才跑通整条链路。这件事更接近“把大型数学验证工程做成可运行系统”。它没有替代数学家提出新问题、解释结果或判断方向，但当 AI 能批量产出证明时，形式化核验会成为审稿和复查的基础设施。", "excerpt": "Claude 11天把费马证明变成机器可验费马大定理早在 1995 年就由安德鲁·怀尔斯证明。Claude 这次完成的工作，是把这条已有证明及其依赖内容写成 Lean 能检查的形式化证明。Anthropic 称，整个过程用了 11 天，写下约 1,300 万行 Lean 代码。为什么一条证明会膨胀到 1,300 万行人类论文可以跳过许多默认成立的步骤，Lean 不可以。它要求每个推理环节都有可检查", "url": "https://www.zhihu.com/pin/2080055766950605332", "votes": 0, "comments": 0, "feed_ts": 1788704003, "feed_time_str": "09-06 22:13", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Meta用GPT+Claude拿下Kaggle金牌Meta 这次晒出的 AIRA3 成绩，关键在测试方式：它被放进了 NVIDIA 主办的一场实时 Kaggle 竞赛。任务是为 30B Nemotron 模型做微调，让它更会推理；参赛者拿到相同公开信息，成绩由私有测试集外部结算。Meta 称，AIRA3 在约 4,000 支队伍中排第 8，拿到金牌。实时金牌到底是谁拿的Meta 在线程里补了一条关键信息：实时参赛的金牌组合，是 GPT-5.5 搭配 OpenCode，加上 Claude 4.8 搭配 Claude Code。Muse Spark 1.2 也被测到金牌级，但那是比赛结束后、在同一私有测试集上的事后评估；Muse Spark 1.1 和 GLM 5.2 则是银牌级。它让一组长期运行的 agent 做研究AIRA3 的工作方式更接近一支异步研究小组。多个“模型加编码框架”的 agent 各自在隔离环境里跑较长任务，通过两份共享记录协作：一份论坛写假设和发现，一套共享文件系统保存代码、结果和解决方案产物。后来的 agent 可以接着前人的实验记录继续试。难在于让多轮实验留下能被后续任务复用的证据，再决定下一轮试什么。AIRA1、AIRA2 已分别研究过搜索策略、异步 worker 和评估信号；AIRA3 把这套研究循环带进了一场实时竞赛。实时金牌跑通了研究闭环，尚未证明通用科研这是一条有分量的外部结果：在一个明确任务上，AI 研究系统已经能把“提出方案、改代码、跑实验、根据分数继续搜索”串成闭环，并交出金牌成绩。Meta 还称，它在内部生产 GPU kernel 测试中将延迟降了 27%。但这还不是“AI 已经能独立做通用科研”的结论。meta没有给出 AIRA3 的算力成本、运行次数、搜索预算、完整技术报告或代码；不同模型的结果也不能脱离各自编码框架直接比较。真正值得继续盯的，是 Meta 会不会放出完整 write-up，让外部知道这套研究流水线到底靠什么赢、要花多少资源才能复现。", "excerpt": "Meta用GPT+Claude拿下Kaggle金牌Meta 这次晒出的 AIRA3 成绩，关键在测试方式：它被放进了 NVIDIA 主办的一场实时 Kaggle 竞赛。任务是为 30B Nemotron const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

nts": 15, "feed_ts": 1782319124, "feed_time_str": "06-25 00:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价大明是保护汉唐的第一道防线，大明这道防线失守以后，汉唐也会被冲击？", "excerpt": "以前我可能同意，现在我不太愿意这么说， 大明就是大明，大明失守，就无所谓汉唐，没有大明的汉唐毫无意义，你无路可退，因为大明本就再造汉唐，失去大明的汉唐是没有主体性可言的。明祖于我汉实有炼石补天之功绩也，正所谓辟乾坤于再造，功高汤武。 对明没有情感投射只喜欢汉唐的人不能说没有，因为我曾经就是，但这样的人一定是没有主体性的，只会以一种外国人的视角去偏爱汉唐，在这种人眼中汉唐其实和罗马帝国并没有多大区别", "url": "https://www.zhihu.com/question/2052712347790217439/answer/2053212191415914593", "votes": 79, "comments": 21, "feed_ts": 1782318889, "feed_time_str": "06-25 00:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "虽然不是特别看好老登，但低位利空不是利空哦。", "excerpt": "虽然不是特别看好老登，但低位利空不是利空哦。", "url": "https://www.zhihu.com/pin/2053268450777289846", "votes": 0, "comments": 2, "feed_ts": 1782317346, "feed_time_str": "06-25 00:09", "category": "pin", "cat_name": "想法动态"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "男朋友每年都会去祭拜他的前女友，我该怎么办？", "excerpt": "从他的视角，他没错，甚至他在做好事，展现其人品比较过硬，有情有义。 从你的视角，你也没错，凭什么你的男人心里还要住着别人，哪怕是个走了的人，你在这里到底算什么角色，别人怎么看你？ 你们双方的逻辑都是圆满的，闭环的，从各自视角出发没有问题的。 所以不用纠结谁对谁错，不能接受抓紧分，这个事情本质上是两套逻辑和价值观的分歧，以后结婚了这样的分歧还多着呢，甚至就这件事本身就足够你们吵一辈子，何必互相折磨？", "url": "https://www.zhihu.com/question/638683808/answer/2053266798401811801", "votes": 281, "comments": 6, "feed_ts": 1782316953, "feed_time_str": "06-25 00:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Jalapeño：OpenAI的首款 AI 芯片OpenAI 和Broadcom公布了 Jalapeño，OpenAI 官方把它称为自己的第一款 Intelligence Processor。它不是把通用 AI 加速器拿来改一改，而是从一开始就围绕 LLM 推理设计，目标是服务 ChatGPT、Codex、API 和未来 agentic 产品背后的大规模推理负载。这次最值得看的不是“OpenAI 也造芯片了”这句话，而是它把全栈平台继续往下扎了一层：产品、模型之后，现在进入芯片、kernel、memory system、networking、scheduling、deployment system 这些基础设施环节。OpenAI 想优化的不是单颗芯片参数，而是整个 LLM 推理平台。官方网页给出的信息比 X 帖更完整。Jalapeño 从初始设计到制造 tape-out 只用了 9 个月，OpenAI 说这是它们认为高性能先进半导体里最快的 ASIC 开发周期之一，而且开发过程中用到了 OpenAI 自己的模型来加速部分设计和优化。工程样片已经在实验室以目标频率和功耗运行 ML workloads，包括 GPT-5.3-Codex-Spark。性能上，OpenAI 还没有给最终详细报告，但官方说早期测试显示，第一代加速器的 performance per watt 会明显好于当前 state-of-the-art。架构方向也讲得很清楚：减少数据搬运，平衡 compute、memory 和 networking，让实际利用率更接近理论峰值。博通提供芯片实现和网络技术，包括 Tomahawk networking silicon；Celestica 参与板卡、机架系统集成、高性能网络和规模化生产系统。还有一个很关键的时间线：Jalapeño 是 OpenAI 和博通多代计算平台的第一步，官方说会在 2026 年底前开始初始部署，并在之后几年扩展。博通 CEO Hock Tan 的说法更具体：这条路线图将支持从 2026 年开始，与 Microsoft 和其他伙伴部署 GW 级数据中心。对普通用户来说，短期内不一定能立刻感到 ChatGPT 变快多少。它更像一次基础设施层面的长期布局：当 AI 真正触达用户时，发生在推理阶段；每一次成本、速度、可靠性的改进，最后都可能体现在更快的 ChatGPT 回复、更便宜的 API、更能跑长任务的 Codex，或者高峰期更稳定的服务上。这件事的信号很明确：头部模型公司的竞争不只在模型参数和产品功能上，也会进入推理芯片、网络、数据中心和调度系统。OpenAI 下场做 Jalapeño，本质上是在把“模型能力”继续往“单位成本下能服务多少智能”这个方向推进。", "excerpt": "Jalapeño：OpenAI的首款 AI 芯片OpenAI 和Broadcom公布了 Jalapeño，OpenAI 官方把它称为自己的第一款 Intelligence Processor。它不是把通用 AI 加速器拿来改一改，而是从一开始就围绕 LLM 推理设计，目标是服务 ChatGPT、Codex、API 和未来 agentic 产品背后的大规模推理负载。这次最值得看的不是“OpenAI ", "url": "https://www.zhihu.com/pin/2053256245377867827", "votes": 0, "comments": 0, "feed_ts": 1782314502, "feed_time_str": "06-24 23:21", "category": "pin", "cat_name": "想法动态"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你见过最恐怖的事是什么？", "excerpt": "2017年12月19号，广州一名麻醉科医生谭秦东，发布了一篇名为《中国神酒鸿茅药酒，来自天堂的毒药》的文章。 谭秦东这篇文章很专业的指出患有高血压、糖尿病的中老年人应当对鸿毛药酒有所禁忌。 文章的阅读量约有2000余次，分享100多次，在互联网每天海量的信息中几乎激不起任何水花。 但几天之后，内蒙古鸿茅国药股份有限公司向凉城县公安局报案，称互联网上有人对鸿茅药酒进行恶意抹黑，导致多家经销商退货退款", "url": "https://www.zhihu.com/question/352776383/answer/2053255606597857429", "votes": 83, "comments": 6, "feed_ts": 1782314284, "feed_time_str": "06-24 23:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何客观评价小约翰可汗《世纪风暴》系列的视频质量？", "excerpt": "看了很多回答，我觉得最令我感觉不理解的一点是，好像很多朋友默认了一件事——1979年的伊朗历史，是由2026年的战局决定的。 2026年伊朗在战局中占了上风，那么证明了1979年霍梅尼就是人民的选择，政教合一是人心所向，小约翰不懂伊斯兰教。如果伊朗打败了呢？好像这话基本就没人说了。 从开战以来，我写了很多文章和视频谈伊朗问题，一直也没多少人说我错，自从最近三千亿赔款的消息出来以后，各种回答  其他"}, {"actor": "于朝阳", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "最初，看山是山的时候，觉得“民可使由之，不可使知之”这句话很对，因为成大事者不拘小节...后来，看山不是山的时候，觉得这句话不对，因为贬低了人民的意志和能量，是反动的...到最后，看山还是山的时候，觉得这必然是看遍了人间冷暖的人才能总结出来的话...仓廪实而知礼节，衣食足而知荣辱。别讲那么多美好的大道理，如果人没钱，他们只会把大道理当成攻击别人的武器。当代一个大人物的做法就很典型——把人先拉平。但问题是，已经过好的人，不会想下边的人和他平。正所谓，很人有笑人无，最多是既怕兄弟过的苦又怕兄弟开路虎，既怕闺蜜没人要又怕闺蜜找的好...没有人希望自己和别人是齐平的。就是乞丐，他承认自己比不上也不会嫉妒富豪，但他会恨另一个乞丐今天要到的铜板比自己多...所以不要讲道理...礼法在古时是约束贵族的。律法才是约束平民的。没那么多大道理。大道理是文人之间的温室技术，推广不开...能推广开的，是把土豪的田地给分了，是把有条件的农村的收入水平、机会和设施给抬到逼近城市...不议变法、不争论的背后，是自古至今的智慧，也是务实...能做到不争论的，只有日子越来越好。反过来，也做不到、抑不住。这世界，画出来的乌托邦太多，实现的小康不多。总有一天，一瞬间，我们将意识到，如此平和的历史，也要珍惜啊...莫到有了比较才发现，世风日下，过去苛责的，其实已经是难能可贵的美好。", "excerpt": "最初，看山是山的时候，觉得“民可使由之，不可使知之”这句话很对，因为成大事者不拘小节...后来，看山不是山的时候，觉得这句话不对，因为贬低了人民的意志和能量，是反动的...到最后，看山还是山的时候，觉得这必然是看遍了人间冷暖的人才能总结出来的话...仓廪实而知礼节，衣食足而知荣辱。别讲那么多美好的大道理，如果人没钱，他们只会把大道理当成攻击别人的武器。当代一个大人物的做法就很典型——把人先拉平。但", "url": "https://www.zhihu.com/pin/2053225179887694545", "votes": 0, "comments": 2, "feed_ts": 1782307898, "feed_time_str": "06-24 21:31", "category": "pin", "cat_name": "想法动态"}, {"actor": "TopView", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "Ai公司靠什么营利，2000年的互联网泡沫破裂会再现吗?", "excerpt": "2000年3月10日。 纳斯达克5048点。 那天晚上，全美国的交易员都在开香槟。出租车司机在跟乘客推荐科技股。大学生靠日间交易赚出了一年的学费。硅谷随便一个创业者的身家后面都跟着八九个零。 然后。 没了。 如果你在那一刻买了100万人民币的纳斯达克指数基金，两年后，你账户里还剩17万。 不是浮亏，是实实在在的17万。每股的成交记录白纸黑字摆在那里。 你以为17万就是底了？还没完。2002年10月", "url": "https://www.zhihu.com/question/2013578148336403227/answer/2053226240782382549", "votes": 53, "comments": 6, "feed_ts": 1782307283, "feed_time_str": "06-24 21:21", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价视频《朋友去希望小学当志愿者，被一群孩子骂“死娘炮”》？暴露出了哪些问题？", "excerpt": "你指望贫困区希望小学的孩子是什么样呢 或者说 你指望 在贫困区长大，父母可能长期不在身边，手机随便一刷就是高楼大厦，豪奢大餐，再转眼一看自己周围 的这样一个环境下长大的孩子 会是什么样呢 我支教过 那是一所 农民工子弟小学 如果要我说 对那些孩子最大的印象的话，我认为 是 愤怒 不是缺爱，不是天真，不是胆怯 是愤怒 对外来者的愤怒 因为在他们看来，你的干净着装，你的温文尔雅 不是因为你人好，而是因", "url": "https://www.zhihu.com/question/2051568979186135415/answer/2053152098582270868", "votes": 2387, "comments": 158, "feed_ts": 1782306987, "feed_time_str": "06-24 21:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小德", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果解放后的北京城保留城墙等古迹，采用梁思成的方案另建新城，今天的北京会成为世界奇观吗？", "excerpt": "空府。 这是其它答案没有触及到的一个关键问题。 北京城内有大量的空府，这些空府是建都的重要资源。 空府，就是空着的府邸。当时清朝的王公已经没有了，大量的王府，贝勒府贝子府，国公府，公主府空闲。你可以从当时的北京地图上看见城内大量标注空府，北洋政府垮台，同样留下了大量府邸。 各单位要用空府。 在当时的条件下，大量单位要进京，这些单位从机关，军事，文教，工商等不一而足，而且带着设备，带着家眷。什么样是", "url": "https://www.zhihu.com/question/2040071573068043684/answer/2042323350291309743", "votes": 2714, "comments": 462, "feed_ts": 1782306583, "feed_time_str": "06-24 21:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "冯小刚还说过他不知道现在的观众喜欢什么这种话？能说出来就是太知道了。只不过他们这些搞文艺的，总是同时代中的叛逆者，显得自己会独立思考。可一旦他们成了老年人，他们无论独立不独立，只要不被年轻人喜欢，就会被视为落伍、迂腐、过时、老掉牙、为老不尊...而冯小刚很不幸，现在的观众最像冯小刚同时代的人。所以冯小刚面对这代不吃他那一套的年轻人，会有发怵的感觉。因为他们最像他们爷爷辈年轻的时候了。爷爷辈儿们小时候，那会儿军人组织看话剧《白毛女》，看到黄世仁做恶，于是有军人一时激愤，拿出手枪就要当场枪毙演员陈强...爷爷辈儿长大了，看《渴望》，看得对王沪生恨得牙痒痒。于是，演员孙松走在街上被骂被扔菜叶...互联网上的这些新世代，就往这个路子上看，绝对错不了。比如，当他们讨厌一部电影电视剧，会连带着恨死了演员表中参与的著名演员，把这些演员贬得一文不值，视其演这种影视为个人原罪，是别有用心、其心可诛...这个问题页很多回答和评论都有这种倾向。总之就是，爱屋及乌，恨屋及乌，主打一个情绪即立场，牵连针对，扩大化打击，混淆主观客观、现实和创作...我愿称之为影视狱。这种现象不止于影视领域，还包括当年砸李宁家的玻璃等...可能因为就是7080的父母卷成牛马没时间带，0010让爷爷辈们手把手教出来的原因吧，他们和祖辈的很多思维内核更像。毕竟7080是既迈入第一代独生子，又是不缺兄弟姐妹大家庭记忆的父母们放养出来的，而且就算带，其实也是2030那代眼睛里没有多少界限感，只知道好好谋生能活下去的前现代人带出来的...而0010，实际上才是5060们手把手精养、把思想给传承过去的...虽然时代不同了，外在会变，现在的孩子看起来都光鲜亮丽、人高马大、五官端正...但内核传过来了。能打败0010的，是2030，因为他们将是7080带出来的...所有学习历史的都明白，一切历史虽然是都是当代史，但历史的天平始终在摆荡，当代总会变成近代、古代。时间很快的，20岁的1年时间速度感知，顶多是10岁时的大半年。而30岁，大概就会变成小半年。我现在差不多是3个月了...冯小刚这个年纪的哪怕它能活到90岁，他那二十年从他自己的时间感知而言，大概也就剩个四五年了。时间会告诉所有人一个事实——时间面前众生平等。别急别急，年轻人，也会变老的，而且会被新的年轻人排斥。不过也因为如此，这一代的年轻人里还能保持客观理性和开放心态的，就是很容易识别的好苗。", "excerpt": "冯小刚还说过他不知道现在的观众喜欢什么这种话？能说出来就是太知道了。只不过他们这些搞文艺的，总是同时代中的叛逆者，显得自己会独立思考。可一旦他们成了老年人，他们无论独立不独立，只要不被年轻人喜欢，就会被视为落伍、迂腐、过时、老掉牙、为老不尊...而冯小刚很不幸，现在的观众最像冯小刚同时代的人。所以冯小刚面对这代不吃他那一套的年 rb_cn": "赞了回答", "title": "梅西最难破的记录是什么？", "excerpt": "你是一个欧洲本土球员，今年你26岁。 你在当前赛季上场37-8场，进了25个球。 等待你的是鲜花，掌声，球迷的爱戴 早上9点，在你们俱乐部专卖店门口，很多人早已排好队就为了买你的队服和周边 很多经济公司和一些时尚圈的一些模特和艺人想尽办法想要到你的手机号 每当训练结束，门口都有一堆球迷堵着你要你的签名 你的人生一片大好 3场进2球的效率，加上黄金的年龄，让你成为了欧洲最炙手可热的球员之一 但如果你", "url": "https://www.zhihu.com/question/659449976/answer/1921186093014968308", "votes": 804, "comments": 128, "feed_ts": 1782279239, "feed_time_str": "06-24 13:33", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "猛猿", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "从 token KL 到 reward shaping：On-Policy Distillation 近期论文梳理", "excerpt": "如果只看名字，On-Policy Distillation，简称 OPD，好像只是知识蒸馏的一个小变体。但最近半年这一方向的论文密度很高，而且改的不是边角料。 早期 OPD 的核心做法很简单： 让 student 生成自己的 rollout，然后让 teacher 在这些 student-generated prefix 上提供 token-level supervision，通常是 logits", "url": "https://zhuanlan.zhihu.com/p/2047114907636830541", "votes": 39, "comments": 0, "feed_ts": 1782278823, "feed_time_str": "06-24 13:27", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "哦，对了，算是解释一下为什么纳斯达克改个规则，401K就得&#34;按头接盘&#34;？很多人看到这句话不理解——&#34;我的401K是我自己选的基金，谁摁着我的头了？&#34;这个问题的答案，藏在纳斯达克那条&#34;15天快速纳入&#34;的新规则里。先搞清楚纳斯达克是什么纳斯达克不是一个&#34;市场&#34;，它是一个指数编制机构。它的核心产品叫纳斯达克100指数（NDX）和纳斯达克综合指数（IXIC）。全世界有多少钱在追踪纳斯达克100指数？数万亿美金。包括但不限于：· QQQ基金（管理规模约2500亿美金）· 各类养老基金、401K计划里的&#34;大盘成长型基金&#34;· 全球各大资产管理公司的被动产品· 对冲基金的基准配置这些产品的运作逻辑就一句话：指数里有什么，我就买什么。比例是多少，我就配多少。 没有任何基金经理的主观判断，纯粹是程序化买入。&#34;15天快速纳入&#34;是什么意思？以前，一只新股要在纳斯达克上市，得等满一个季度甚至更久才能被纳入主要指数。这段时间内，基金经理可以自己判断值不值得买，也可以选择不买。现在，纳斯达克把规则改成了：上市满15天，直接塞进指数。 没有任何商量余地。这就意味着：一只股票上市第16天，全美所有追踪纳斯达克100指数的基金——不管你觉得它值不值、贵不贵、有没有泡沫——必须强制买入。而且是按市值权重买。SPCX刚上市市值就冲到3万亿，权重一下变成纳指前几大。那些管理着几万亿的被动基金，哪怕心里骂娘，也得按比例掏出几百亿美金来买。跟401K有什么关系？大多数美国人的401K账户，选的不是&#34;买哪只股票&#34;，而是选一个&#34;目标日期基金&#34;（比如2040退休基金）或者&#34;标普500/纳斯达克100指数基金&#34;。这些基金的底层资产，就是追踪纳斯达克100指数的产品。SPCX被塞进指数，你的401K就自动买入了SPCX。你根本没有选择权。 你退休账户里的钱，在不知情的情况下，被动地成为了泡沫的接盘侠。这不是阴谋论。纳斯达克官方自己承认，这条规则的目的就是&#34;让新股更快地进入被动基金配置&#34;，简单说就是——把被动基金当成新股的流动性提款机。为什么这个操作很要命？被动的钱是没有智商的。指数调进去，它必须买；指数调出去，它必须卖。这就意味着：· 上涨的时候，被动资金会推得更高· 下跌的时候，被动资金会砸得更狠SPCX现在跌成这样，被动基金还没大规模入场（15天窗口还没到）。等到7月初正式纳入那天，这些基金还得按当前价格买入。到时候是&#34;抄底&#34;还是&#34;接飞刀&#34;，真不好说。美股市场上，被动基金已经占了交易量的半壁江山。当一个市场的大部分资金是&#34;无脑追涨杀跌&#34;的程序化配置时，这个市场的定价机制就已经被扭曲了。很多401K持有人，一辈子都不知道自己账户里买了什么，更不知道自己成了美股泡沫的最后一层缓冲垫。这就是&#34;按头接盘&#34;的真正含义。", "excerpt": "哦，对了，算是解释一下为什么纳斯达克改个规则，401K就得&#34;按头接盘&#34;？很多人看到这句话不理解——&#34;我的401K是我自己选的基金，谁摁着我的头了？&#34;这个问题的答案，藏在纳斯达克那条&#34;15天快速纳入&#34;的新规则里。先搞清楚纳斯达克是什么纳斯达克不是一个&#34;市场&#34;，它是一个指数编制机构。它的核心产品叫纳斯达克100指数（NDX）和纳斯达克综合", "url": "https://www.zhihu.com/pin/2053102582684443879", "votes": 0, "comments": 1, "feed_ts": 1782277800, "feed_time_str": "06-24 13:10", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "美国AI的最后一餐：白宫护航、401K接盘，谁跑得慢谁被熊吃", "excerpt": "最近有个热闹事儿——人类历史上募资规模最大的企业SpaceX，在纳斯达克上市了。顺便把马斯克推上了“人类历史上第一个万亿美元富翁”的宝座，纸面上。当然这还没坐热乎呢，股价就应声往下掉。两周不到，从高点225跌到昨天周二的156，跌没了三成多，盘中还一度击穿了150的IPO开盘价。 虽然还没跌破135的发行价吧，但“万亿美元首富”这事儿，怎么感觉就没那么得劲儿了呢？ 挺有意思的。我本人对股市不算精通", "url": "https://zhuanlan.zhihu.com/p/2053101130515855023", "votes": 34, "comments": 6, "feed_ts": 1782277650, "feed_time_str": "06-24 13:07", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "乌克兰总理称欧盟成员国均已同意开启入盟谈判，这对于乌克兰意味着什么？其入盟前景如何？", "excerpt": "意味着大家都愿意陪你玩玩，和商场里试吃环节一样。一个破产的国家进入欧盟，怎么？欧盟是救助中心吗？你现在连可以用作经济奴隶的壮劳力都没了，你有啥价值？妇女买卖？你敖德萨和旁边的摩尔多瓦几千年就是干这个的，你不加入也没问题啊。 就是意思意思呗，反正谈了也不是让你加入。就陪你耗着就完了。 ", "url": "https://www.zhihu.com/question/2046060240983134719/answer/2053101205367296720", "votes": 18, "comments": 0, "feed_ts": 1782277472, "feed_time_str": "06-24 13:04", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "温伯陵", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "国家强制亲子鉴定可否打破猜疑链，提升生育率？", "excerpt": "亲子鉴定这玩意儿全网都聊歪了。十年没一个人说到点子上。 你打开任何一个讨论亲子鉴定的帖子。评论区永远在争查出来不是亲生的怎么办，婚姻还能不能要，男人的面子往哪搁。全在纠结绿帽子那点事， 没一个人往另一个方向上想一秒。人贩子手里有一样东西比什么都贵 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

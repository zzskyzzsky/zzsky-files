TA的366对候选修改39个 AutoSOTA 任务中的366对候选修改让 judge 只看候选内容、不看执行结果。早期选择性准确率为 82.8%；累积至少 3 次成功后降至 56.9%，coverage 从 76% 升至 85%。选择性准确率指一致判决时的正确率，coverage 指得到一致判决的比例；后期变化", "url": "https://www.zhihu.com/pin/2070302515049113039", "votes": 0, "comments": 0, "feed_ts": 1786378715, "feed_time_str": "08-11 00:18", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Meta重回开源世界：开源Muse Glimmer想把 coding、工具调用这类 agent 留在自己电脑上，先要算清一笔账：30B 级模型塞进消费级显卡后，上下文、看图和生成速度还有没有位置。Meta 刚放出 Muse Glimmer 的权重：30B 参数、Apache 2.0 许可，Meta定位就是常驻本地的 agent。它已上 Hugging Face；模型本体做成 K-Quant-17GB 后，官方称 24GB 或 32GB 的显存包络里还能同时放下 KV cache、图像理解用的感知编码器和 DFlash drafter。30B 为什么能进 24GB 显存原始精度下，30B 模型要超过 55GB 内存。Glimmer 把权重量化到约 4 bit，语言模型部分压到 20GB 以下。24GB 的门槛还要把上下文缓存、看图模块和加速生成的辅助模型一起算进去，不能只看权重文件大小。Meta说这种压缩在 agent 任务上带来“很小或没有”的性能下降。这个结论是 Meta 自己的验证，不等于所有本地任务都能无差别复现，但至少说明它针对的不是单轮聊天，而是本地运行时的完整内存账。它瞄准的是会做事的本地模型Muse Glimmer 的训练和评测覆盖长流程执行、函数调用、多步推理、工具失败后的诊断重试，以及图文混合输入。Meta列出的应用是本地 coding、函数调用、LLM-as-a-judge 和持续运行的个人 agent。这也是它和“把一个聊天模型塞进显卡”不太一样的地方：模型要在工具调用失败后继续排错，往往要保留更长的上下文；要看截图或文档，也得给感知编码器留内存。模型是否真适合你的工作流，仍要看实际用的 scaffold、工具协议和上下文长度。DFlash 把逐 token 生成变快长推理和多次工具调用最容易让本地体验变慢。Glimmer 配了一个基于 DFlash 的轻量 drafter：它先成块提出 token，主模型再并行核验，正确的直接接收，错误的再改。Meta在 K-Quant-17GB 加量化 drafter 的测试中给出的加速是：RTX 5090 约 3.1 倍、M5 Max 约 1.8 倍、M4 Max 约 1.5 倍。这个数字只对应这套模型、量化和硬件组合，不能直接当成其他模型或所有本地 agent 的速度承诺。现在能下，接入还在分批到位权重目前已在 Hugging Face 提供。Meta 写的是：Ollama、LM Studio、Unsloth 等合作接入会在未来几天推出；llama.cpp、MLX、ExecuTorch 也在优化接入中；vLLM 和 SGLang 用于规模化服务的支持同样属于后续接入范围。vLLM 项目在回复区也指向了正在进行的 Muse Glimmer 支持 PR。", "excerpt": "Meta重回开源世界：开源Muse Glimmer想把 coding、工具调用这类 agent 留在自己电脑上，先要算清一笔账：30B 级模型塞进消费级显卡后，上下文、看图和生成速度还有没有位置。Meta 刚放出 Muse Glimmer 的权重：30B 参数、Apache 2.0 许可，Meta定位就是常驻本地的 agent。它已上 Hugging Face；模型本体做成 K-Quant-17G", "url": "https://www.zhihu.com/pin/2070302233045029420", "votes": 0, "comments": 0, "feed_ts": 1786378554, "feed_time_str": "08-11 00:15", "category": "pin", "cat_name": "想法动态"}, {"actor": "安森 不是什么“绝对的无像崇拜”，甚至老天爷（亚威）不仅有造像，他还是有老婆的。下面这张图（昆蒂莱特·阿吉鲁德出土的陶罐画）是公元前8世纪的文物，上面不仅画着神像，铭文更是赫然写着： “我向萨玛利亚的亚威，和他的夫人雅舍拉祝福你。” 这也是目前存世的唯一一张老天爷与老天奶的“合照”。不仅如此，在公元前6世纪之前的犹大王国，普通老百姓家里根本不避讳偶像。考古挖出了大量下面这种老", "url": "https://www.zhihu.com/question/2067639101847871488/answer/2070046920442221022", "votes": 60, "comments": 6, "feed_ts": 1786377979, "feed_time_str": "08-11 00:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "亚里士多德是不是西方伪造的？在公元前300多年前写出1000多万字吗？真的可以做到吗？", "excerpt": "古希腊的书写的主要载体并不是伪史论吹的小羊皮，而是莎草纸，全球已经出土的古希腊语书写的莎草纸已经有50万片。这是经过2000多年遗存下来的书写材料，光是在奥克西林库斯，这是一个埃及古城，开罗西南方向160公里，气候干燥，而希腊本土因为气候问题，就没有留存。要知道中国考古出土的竹简残片一共是30万枚。竹简的保存能力比莎草纸还强，如果不是因为埃及干燥的气候，希腊语莎草纸也保存不下来。 ", "url": "https://www.zhihu.com/question/650711507/answer/2070172787860305075", "votes": 7, "comments": 0, "feed_ts": 1786377428, "feed_time_str": "08-10 23:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "于东来回应关闭胖东来生活广场店，因早年租约失误造成租户租金失衡，门店盈利上亿仍闭店，如何看待他的选择？", "excerpt": "莫名其妙，为啥会有人觉得这是被房东拿捏？ 于东来敢直接提房东的事情，点房东，恰恰好代表了他根本不在意房东，不惯着房东。 很多店被房东拿捏的本质是换个位置就不行了，本质上大家选的是地理位置，这个位置具体是什么不影响消费决策。 而胖东来是开到哪里，哪里就是河南5A景区，以及盈利水平极高。 只有这个水准和底气，才敢直接一年赚上亿的店说关就关，位置说换就换，根本不惯着房东。 一年少赚这些钱无所谓，你敢这么", "url": "https://www.zhihu.com/question/2069799083045287916/answer/2070297622913487634", "votes": 379, "comments": 23, "feed_ts": 1786377418, "feed_time_str": "08-10 23:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价“白人是野兽起源的，是穴居的，白/黑人靠吃华人才进化成人形”等类似的伪史论观点？", "excerpt": "又不是第一天才冒出来的东西，有什么好评价的。太平洋对面能有蜥蜴人传说，我们不也得有个神族传说。 这玩意儿连伪史都算不上，毕竟史这个字还是得遵循物理世界的规律，对于一些没有好好完成义务教育的人而言还挺难分辨。 但是现在传播这玩意儿算个伪神秘学，能吸引的人基本上就是没有完成义务教育的人。传播这么广不是说没有完成义务教育的人太多，而是闻着这块流量就过来的苍蝇太多了。 流量就等于金钱，现在这个经济不太好的", "url": "https://www.zhihu.com/question/2056445544697009970/answer/2070160780595558049", "votes": 2, "comments": 0, "feed_ts": 178637732 61/answer/2069774372378878125", "votes": 221, "comments": 1, "feed_ts": 1786375368, "feed_time_str": "08-10 23:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "沈腾新片《欢迎来龙餐馆》点映口碑爆棚，如何评价沈腾此番演技？喜剧演员要打破观众的固有印象难度在哪？", "excerpt": "这个电影很特殊，还真是特别适合沈腾。 特别适合画风跟战争残酷不搭的人来演主角。 因为这个电影有个最最最核心的矛盾，就是我们作为唯物主义共产主义的中国人，无论如何没法代入美伊双方的任何一方。 对我们而言，双方都不是好东西，最好打到下辈子才符合我们祖国的利益。 我们和他们双方从国家，民族，立场，政治体制，到信仰，完全不挨着。 战争也不是我们挑起来的，真是完美的一点关系都没有。 所以我们是绝对中立立场。", "url": "https://www.zhihu.com/question/2069917740303737208/answer/2070287118790928076", "votes": 61, "comments": 6, "feed_ts": 1786374913, "feed_time_str": "08-10 23:15", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "木文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价超前点映中，由文牧野执导、沈腾领衔主演的电影《欢迎来龙餐馆》？", "excerpt": "片子是好片子，就是情绪没那么强缺乏爆点，感觉业内对这部电影的票房预期有点过高了（最早是准备冲真人记录），单论评价的话，肯定是比《奇迹笨小孩》要好不少，但想复现《我不是药神》的口碑、情绪跟票房来讲，我是觉得有点困难。 不过感觉可能是这个题材还是比较难拍，同时票房本身也受限（毕竟国人都是旁观者视角，跟中日题材的亲历方不太一样），片子本身还是可以的，很工整，该给的都给到了，看得出剧本受过很用心的打磨，…", "url": "https://www.zhihu.com/question/2068425373046544035/answer/2069491528045802725", "votes": 804, "comments": 197, "feed_ts": 1786373145, "feed_time_str": "08-10 22:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "老婆怀孕23周了，查到是超雌宝宝，47XXX，想留，有相似经历的父母们能给点意见吗？", "excerpt": "我的意见是尊重孕妇的完整生育权，如果老婆想留，那就留，当然我不知道你题干里的“想留”主语是你还是你老婆。另外，法律没有规定查出胎儿有生理缺陷要强行打掉，生下有缺陷的小孩也不是犯罪行为，把“有缺陷”的小孩强行淘汰掉，把有遗传病的人强行绝育，这种优生学做法有一个国家疑似搞过，那就是纳粹德国。 ", "url": "https://www.zhihu.com/question/505008690/answer/2070274270941405430", "votes": 7, "comments": 1, "feed_ts": 1786372719, "feed_time_str": "08-10 22:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "分子生物学蓬勃发展的今天，为什么还有很多人不肯相信进化论，甚至误解？", "excerpt": "因为这前后两件事就不挨着。 对于大多数不相信进化论的人而言，谁在乎分子生物学发展成什么样了？ 就好比这边人造卫星都开始抢轨道了，但那 eed_time_str": "08-10 13:16", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "屠猪之枪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国近代战争中有没有开挂的英雄？", "excerpt": "他是一个通讯员，严格的说，是一名步话机员； 步话机员的任务除了与上下级之间的联系外，主要职责还包括确定位置，指引炮兵开展炮火打击。 1953年6月20日，中国人民志愿军发起夏季战役第三阶段作战“金城战役”，此次战役也是整个抗美援朝战争中最后一次大型战役。 6月29日晚，志愿军23军73师218团赶赴伊川郡九云里，奉命攻击占领并坚守281.2高地，以配合金城方向主攻。 281.2高地位于铁原郡西北泽", "url": "https://www.zhihu.com/question/53926007/answer/2069398509455930270", "votes": 140, "comments": 9, "feed_ts": 1786338668, "feed_time_str": "08-10 13:11", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "太湖陶朱公", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "全民基本收入（UBI）应该发多少钱？", "excerpt": "闲来无事，做一个畅想，大家看个乐子吧。 我把这个组合称为UBI剂量-反应模型——它本质上和药理学是同构的：低于最低有效剂量是浪费行政成本，治疗窗内收益大于成本，超过毒性剂量后财政和劳动激励同时崩溃。 核心判断，先写在前面：全球所有大型现金实验至今没有一例摸到毒性区——在剂量≤中位数收入20%的实测区间内，劳动供给损失只有0～2.5%，而健康、教育、创业期权收益显著。发钱使人懒惰在实测剂量区间内基本", "url": "https://www.zhihu.com/question/634949694/answer/2070128929764020862", "votes": 3, "comments": 0, "feed_ts": 1786337198, "feed_time_str": "08-10 12:46", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美媒称五角大楼想用战术核武器对抗中俄，而非依赖远程战略导弹，这一战略转变意味着什么？", "excerpt": "因为美国核武库陈旧不堪，而且最近几次发射都不是很顺利。民兵三50年了，这几年问题频出。高超就不说了，美国连朝鲜和伊朗这种乞丐版高超都做的费劲。而反观俄罗斯弹道导弹打的乌克兰嗷嗷叫，说打哪里就打哪里。中国是蔫不唧的往远海试射，能力明显超越美国。所以美国基本放弃了战略核竞赛，改为利用战术核弹进行核讹诈了。 ", "url": "https://www.zhihu.com/question/2068997833777051359/answer/2070127430329689428", "votes": 10, "comments": 0, "feed_ts": 1786336841, "feed_time_str": "08-10 12:40", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么明末守个辽东总说军费不够？", "excerpt": "除了贪腐问题以外，实际上最重要的原因是两个，第一明朝的经济政策太落后，无法应对全球化时代的经济模式，当然当年的神罗也一个德性，最后两大帝国手拉手走的很安详。西班牙的问题是帝国税收制度过于落后，大量美洲白银并没有进到帝国兜里，都跑到个人以及地方议会手里。明朝也如此，士绅不纳粮，导致国家收不上税。而且两个帝国都缺乏现代银行体系，解决不了贵金属货币在国内流通的平衡问题。明朝江南大量积压白银，导致银贱物…", "url": "https://www.zhihu.com/question/1998345359290827637/answer/2070125301775049806", "votes": 5, "comments": 0, "feed_ts": 1786336333, "feed_time_str": "08-10 12:32", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "太湖陶朱公", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价古巴普通人一天仅能赚2块人民币?", "excerpt": "2块钱一天这个数字，数量级上是对的，但它同时也是一个统计魔术。同一份古巴工资，用不同的汇率换算，可以是每天2元、8元，也可以是68元——你想讲悲剧还是想讲神话，取决于你选哪把尺子。一、数字解剖：2块钱是怎么算出来的古巴国家统计局（ONEI）公布的2025年全国平均月薪是 6930古巴比索 。接下来，换算开始魔术化：换算口径汇率月薪折合折合人民币每天官方汇率（面向国家基本物资）1美元=24比索约27", "url": "https://www.zhihu.com/question/2069368920583188540/answer/2070124221028628407", "votes": 9, "comments": 0, "feed_ts": 1786336076, "feed_time_str": "08-10 12:27", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "温伯陵", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "食堂打饭遇到领导，领导说：“打这么多啊”，该怎么回答？", "excerpt": "我听了，把手中热汤劈面向领导泼去，淋了领导一身汁。 领导喝到：“你这厮做甚么？！” 我：“你这厮欺负我吃的多，来笑话我” 领导：“我又不曾说得甚么” 我：“量你这厮敢说甚么！” 领导大怒道：“我身上这套衣服值两千多，你需赔我！” 我把手机递向领导，道：“工资发了再来还你，先以手机为当” 领导不知是计，舒手来接，被我把手机往太阳穴上一砸，打个正着。只见领导扑地倒地，血流不止，眼见不得活了。 我肚里却", "url": "https://www.zhihu.com/question/627379818/answer/46509377267", "votes": 19282, "comments": 684, "feed_ts": 1786335900, "feed_time_str": "08-10 12:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "再次批评平台霸权，钟睒睒带给社会一个极具价值的思考", "excerpt": "导语：不同于之前只是对电商平台带来的“对产业价格体系破坏”的结果批评，此次钟睒睒关于平台模式，从其“中间商本质”、“税收公平性”与“创造力破坏”等视角，进行了更加深入本质的深层次分析。 路言/作者 砺石商业评论/出品 1在人类社会发展的过程中，有大量新事物不断涌现。但这些“新”事物并不会因为新，就一定会产生正向的社会价值，而有可能给社会带来较大的负面影响，这是需要公众高度警惕的。 其中，近些年崛起", "url": "https://zhuanlan.zhihu.com/p/2070118700590575936", "votes": 0, "comments": 0, "feed_ts": 1786335604, "feed_time_str": "08-10 12:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "太湖陶朱公", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "怎样客观地看待中国应试教育？", "excerpt": "应试教育的本质是筛选，不是教育。必须先拆穿一个普遍的混淆： 高考的第一功能不是培养人，是分配稀缺资源。看三组数字。2025年全国高考报名1335万人 ；985高校全国平均录取率约1.6%，211约5% ；高等教育毛入学率60.8% 。当一个系统的核心矛盾是 133     if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

ory": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么物理不在四大天坑专业之一?", "excerpt": "因为物理教师是教培市场no1的王炸，断崖式领先其它学科。 就是，需求量极大，理科必考物理，而且物理成绩基本决定最后的结果，而且有时候真的需要老师带你过这个坎（绝大部分家长是一点忙都帮不上）。但是供应量极小，能把高中物理讲明白的人，远远小于数学英语化学。。。。。。 早年，各科老师搭伙搞教培的时候，物理老师就是三缺一那个缺一，团队有物理老师，就立住了，其它学科老师相对好找，甚至会主动投奔而来。或者说，", "url": "https://www.zhihu.com/question/344662621/answer/2050735054876317405", "votes": 1653, "comments": 307, "feed_ts": 1782227002, "feed_time_str": "06-23 23:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "DefTruth", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价钉钉 CEO近期访谈言论？", "excerpt": "无招就是最典型也最极端的老登。 吃了时代的红利，然后变成了偏执狂。用自己那套陈腐、粗暴的认知折磨他能影响到的每一个人。 能做出钉钉这种为周扒皮量身定做的工具的人，能是好人吗？好人能发明满清十大酷刑吗？ 能视员工性命于无物（物理意义上的）的人，他能有用户sense？他能有畜生sense还差不多。 不过他也蛮可怜的，看不懂用户要什么，或许看懂了也没法子，因为钉钉骨子里就是一个周扒皮用的鞭子，怎么用着顺", "url": "https://www.zhihu.com/question/1944116720068453211/answer/2047614511314740268", "votes": 24, "comments": 0, "feed_ts": 1782226595, "feed_time_str": "06-23 22:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "刘璋到底做错了什么？从张松，到法正，到李严，全部背叛?", "excerpt": "在背叛刘璋的阵容里，法正、李严只能算外围，张松也就勉强能进内围，真正的顶流人物还得是庞羲、赵韪、张鲁。 庞羲是刘璋是儿女亲家，当初刘焉与大儿子谋反事情败露，是庞羲冒着风险送他的子孙入蜀。 璋长子循妻，庞羲女也。 时征西将军马腾屯郿而反，焉及范与腾通谋，引兵袭长安。范谋泄，奔槐里，腾败，退还凉州，范应时见杀，于是收诞行刑。议郎河南庞羲与焉通家，乃募将焉诸孙入蜀。应该说庞羲和刘璋属于深度绑定。结果呢？", "url": "https://www.zhihu.com/question/349815498/answer/4664669153", "votes": 1495, "comments": 165, "feed_ts": 1782225773, "feed_time_str": "06-23 22:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你见过最逆天的短剧剧情是什么?", "excerpt": "看过一个短剧，演示女生蹦迪到2点，一个人如何安全到家。 女的出酒吧先换平底鞋，遇到危险方便逃跑。 然后再穿上备用外套，让自己不那么显眼。 给闺蜜共享实时位置，出现异常姐妹立马知道。 再从包里掏出话梅，解酒，让自己保持清醒。 做完一切准备工作以后，刚好有一个不怀好意的口罩男司机问：“美女，拼车不？给个起步价就好！” 女的拒绝拼车，说：“男朋友来接，不拼。” 男司机骂道：“有男朋友还出来喝酒，真不要脸", "url": "https://www.zhihu.com/question/19253422 ior Policy）：智能体用来与环境交互、产生数据的策略。也就是“你当前是怎么做的”。目标策略（Target Policy）：智能体正在学习、试图优化的策略。也就是“你希望学到的最优做法”。 On-policy（同策略）和Off-policy（异策略）的根本区别，就在于", "url": "https://www.zhihu.com/question/57159315/answer/2052774717044561230", "votes": 4, "comments": 0, "feed_ts": 1782199631, "feed_time_str": "06-23 15:27", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "应用统计学用学数学分析吗?", "excerpt": "如果你只想混个学历，或者考一个普通学校的专硕，去刷高数题拿高分确实是最功利的解法。但如果你想考名校学术型硕士，或者未来想在这个人工智能大火的时代，成为一个真正解决底层算法问题、能拿高薪的算法专家，而不是只会调包的API调用工程师，数学分析、实变函数和概率论测度论，是你的底层护城河。 很多同学分不清数学分析和高等数学的区别。简单来说，高等数学是教你如何算，而数学分析是教你为什么能这么算。 高等数学告", "url": "https://www.zhihu.com/question/502926409/answer/2052771551355975042", "votes": 5, "comments": 0, "feed_ts": 1782198877, "feed_time_str": "06-23 15:14", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "正解局", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "手机电池越做越大，正在逼死充电宝？", "excerpt": "“充电宝不但不会成为千亿级品类，甚至大概率过几年就死了”。 十年前，智能硬件品牌安克创新的创始人阳萌就给这个赛道判了“死刑”。 阳萌近期在接受媒体采访时强调“充电宝还没到消亡节点”，但依然笃定“这个品类一定会消失”。 就在昨天，荣耀X80 Pro Max正式发布，11000mAh的单电芯超大电池创下行业纪录。 手机电池越做越大，充电宝被逼上绝路了吗？ 11000mAh！ 这是荣耀刚刚发布的X80 ", "url": "https://zhuanlan.zhihu.com/p/2052762286238986826", "votes": 2, "comments": 0, "feed_ts": 1782198839, "feed_time_str": "06-23 15:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Science子刊丨从分子生成到验证，AI与药用化学家的双轨优化策略", "excerpt": "编辑丨&amp; 药物开发向来是一个复杂且成本巨大的任务，对于那些围绕黑色素沉着障碍的研究也是如此。长期以来，研究团队所面临的难题不单是活性是否得到抑制，可开发性、安全性，这些也是团队必须要考虑的东西。 这也是 TYR （酪氨酸酶）抑制剂一直很难被真正做成成熟候选的原因之一：很多分子在酶上看起来有效，但在细胞里就开始掉队，在更接近生理环境的系统里则更容易暴露出稳定性、毒性或选择性问题。 来自杭州师", "url": "https://zhuanlan.zhihu.com/p/2052764278206239343", "votes": 1, "comments": 0, "feed_ts": 1782197186, "feed_time_str": "06-23 14:46", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "你的AI正在「见人下菜」，亚马逊团队ACL高分 息不对称，有效降低高考志愿滑档的风险。", "url": "https://www.zhihu.com/pin/2052739675136193956", "votes": 0, "comments": 0, "feed_ts": 1782191334, "feed_time_str": "06-23 13:08", "category": "pin", "cat_name": "想法动态"}, {"actor": "LeiWang1999", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "TIRx：面向持续演进的前沿 ML Kernel 的开放编译器栈", "excerpt": "今天我们正式推出 TIRx：一个构建在 Apache TVM 之上的开源、硬件原生 ML kernel DSL 与编译器。TIRx 的目标是服务于 AI 软件栈的关键一层——不断迭代的 ML kernel 需要在不断迭代的硬件上高效运行。目前，TIRx 可以编译到 GPU 和专用 AI accelerator；它的设计原则也同时考虑了 TIRx 在之后更新世代的 GPU 上的扩展。我们希望 TIR", "url": "https://zhuanlan.zhihu.com/p/2052656701392920995", "votes": 56, "comments": 3, "feed_ts": 1782191153, "feed_time_str": "06-23 13:05", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "六代机对五代机的优势是不是没五代机对四代机那么夸张？", "excerpt": "从现在情况看，六代机在外形上大刀阔斧砍掉各种舵面，远比之前的划代走的要远。虽然各种指标都没有很清晰地展现，但是可以预计在拓展实用升限，实战速度方面一定是很强的。这一代飞机至少可以比现在的飞机在更广阔的空间战斗，而且飞的更快。至于隐形，显然因为外形更简洁也会更好。 如果你还是那种四平八稳的气动外形，还保留垂尾或者平尾中的一个，或者还有鸭翼，那你就不是中标的六代机大概是一种野路子六代机。 ", "url": "https://www.zhihu.com/question/1902891042191176522/answer/2052739118694658797", "votes": 89, "comments": 11, "feed_ts": 1782191144, "feed_time_str": "06-23 13:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "已严肃加入江南财阀资本集团，入职国运级别先进产能行业，待出清产能落后行业什么的我不知道将来还有没有必要讲了。草稿箱里面写了几千字，但是显然远远不足以概括我曾经想说的全部，无法给读者留下关于某个人或者某群人的特写的印象，而这种讲述的欲望和冲动似乎也……快要消失不见了。", "excerpt": "已严肃加入江南财阀资本集团，入职国运级别先进产能行业，待出清产能落后行业什么的我不知道将来还有没有必要讲了。草稿箱里面写了几千字，但是显然远远不足以概括我曾经想说的全部，无法给读者留下关于某个人或者某群人的特写的印象，而这种讲述的欲望和冲动似乎也……快要消失不见了。", "url": "https://www.zhihu.com/pin/2052729853829440125", "votes": 0, "comments": 2, "feed_ts": 1782190307, "feed_time_str": "06-23 12:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "最近讨论民族越来越多了，是以前生活在信息茧房里，还是近两年汉民族意识在觉醒？", "excerpt": "汉人的民族意识是弹簧。 别人的越强，越显性。 汉人民族意识的反作用力也越强。 近年来的影视、新闻、闹剧，都在印证着这个理论。 这也是好事，我们可以和和睦睦，如果有人要较量一下，也可以比划比划。 没所谓的。 ", "url": "https://www.zhihu.com/question/2039121122810147843/answer/2040546151775065867", "votes": 1107, "comments": 16, "feed_ts": 1782190116, "feed_time_str": "06-23 12:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "最近讨论民族越来越多了，是以前生活在信息茧房里，还是近两年汉民族意识在觉醒？", "excerpt": "最近刷抖音，反对外国人特别是印度人居留中国的视频越来越多，所以不光民族意识在觉醒，恐怕种族意识也在觉醒。", "url": "https://www.zhihu.com/question/2039121122810147843/answer/2046922825097917887", "votes": 444, "comments": 8, "feed_ts": 1782190109, "feed_time_str": "06-23 12:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "哪些古人的智慧，直到今天还在影响世界？", "excerpt": "1820年，嘉庆皇帝生命中的最后一年。 五月的一天，兵部官员哭丧着脸向嘉庆皇帝报告，说兵部大印找不到了。 嘉庆问：“丢了？” 官员委屈的说：“没有，我们没拿出屋。” 嘉庆说：“那就是被人偷了。” 官员说：“对，我们就是这么想的！” 嘉庆说：“猪也是这么想的。” 嘉庆帝怒骂兵部官员，说你们真是一群猪啊，一千年都不会发生这种事情，当官把大印丢了，你兵部是干什么的？ 兵部差不多相当于国防部，是国家最高军", "url": "https://www.zhihu.com/question/2047738930318021645/answer/2052734714583183597", "votes": 34, "comments": 3, "feed_ts": 1782190094, "feed_time_str": "06-23 12:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "最近讨论民族越来越多了，是以前生活在信息茧房里，还是近两年汉民族意识在觉醒？", "excerpt": "当增量市场转向存量市场的时候，被掩盖起来的矛盾必然会显现出来 原来的时候，中考给少数民族+10分，汉族学生大不了去上技校，去南方打工； 高考给少数民族+5分，汉族学生大不了去上大专，勉强也有工作； 考公务员的时候少数民族优先，汉族大不了去私企，也可能出人头地。 这就是增量市场的好处。 当市场转向存量市场的时候就不一样了 1分也能决定命运，更何况还有留学生和印度人，都在抢夺饭碗 再不争的话，连上街摆", "url": "https://www.zhihu.com/question/2039121122810147843/answer/2041985655870312627", "votes": 1260, "comments": 25, "feed_ts": 1782189897, "feed_time_str": "06-23 12:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "萨珊人口比罗马低很多，为什么能和罗马打的有来有回？", "excerpt": "这就和辽国西夏为什么人口比北宋低很多，但是却能和北宋打得有来有回是一个道理。萨珊王朝和它的前身安息王朝并不是阿契美尼德王朝那样的纯农耕帝国，而是一个农耕游牧混合政权。这种农耕游牧混合政权具有一定韧性也非常难缠。 罗马比北宋还要弱，相当于是一个北方和南方不是一个民族语言也不一样的北宋。所以罗马很难对付波斯也就不奇怪了。 波斯第一帝国也就是阿契美尼德王朝被亚历山大征服后，统治伊朗的是亚历山大部将建立的", "url": "https://www.zhihu.com/question/1939770544447788683/answer/2052254920460521884", "votes": 113, "comments": 13, "feed_ts": 1782189314, "feed_time_str": "06-23 12:35", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "TopView", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "老登翻身，起飞！", "excerpt": "昨天我中午发完文，下午很多板块就连续起飞了。 券商板块暴涨7.5%，保险涨了将近6%，东方财富干了12个点，中信建投、广发、长江证券直接封板。两市成交3.76万亿，历史第二大量，仅次于今年1月14日那波商业航天带起来的天量。 小登没死，科创50涨了差不多2%，创业板更是直接捅破4300，创了历史新高。中登的有色化工也活蹦乱跳，老登的消费医药虽然谈不上翻身农奴把歌唱，但至少不跌了。 上古神登，恒科，", "url": "https://zhuanlan.zhihu.com/p/2052730937906148867", "votes": 57, "comments": 5, "feed_ts": 1782189263, "feed_time_str": "06-23 12:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么世界各地都有战争，唯独中国稳如泰山？", "excerpt": "因为中国占据了这个可以稳的地位。 一战二战前，美国也是稳如老狗。民意就不想打，政治家可能更像参合国际上事，民意知道不打也有全球订单，日子比欧洲好多了，有抽水马桶，有高热量食物，有福特轿车，所以民意倾向旁观。 英法也不想打，因为它有殖民地有市场，日子不如美国吧，但是也不着急。 德日想打，因为快发展不下去了。 日本在大正时代，也想学列强玩政治手腕，在中国投资各种军阀，学稳如老狗慢慢蚕食市场。结果不知道", "url": "https://www.zhihu.com/question/2026063722716602698/answer/2052730870809858109", "votes": 174, "comments": 23, "feed_ts": 1782189178, "feed_time_str": "06-23 12:32", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "夷陵笑笑生", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "最近波动率出现了一个有意思的分化: VXSMH vs MOVE 的巨大背离。如图：债券波动率（MOVE）从6月10日开始一路下跌；大盘波动率（VIX）也被压制；但半导体波动率（VXSMH）从5月份开始却一路飙升，还未见回头。那么问题来了：利率市场现在传递的信息是：通胀压力在缓解，宏观不确定性在下降，所以MOVE一路回落。但半导体(SMH)和AI相关的波动率却在不断抬升，这真的可持续么？最终总会有一个市场被证明是错的。所以两种可能：① 债券市场被被人为操纵了/减记风险，半导体波动率才是对的。AI和半导体板块正在提前定价一次较大的回撤。② VXSMH风险被高估，而MOVE才是正确的。随着时间推移，半导体/AI蠕动上涨，证券市场波动率进一步回落。答案如何，只能观察VIX是否开始跟随VXSMH开始翘头，如果同时MOVE仍然维持低位，那说明半导体板块的脆弱性正在向整个美股大盘蔓延......", "excerpt": "最近波动率出现了一个有意思的分化: VXSMH vs MOVE 的巨大背离。如图：债券波动率（MOVE）从6月10日开始一路下跌；大盘波动率（VIX）也被压制；但半导体波动率（VXSMH）从5月份开始却一路飙升，还未见回头。那么问题来了：利率市场现在传递的信 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

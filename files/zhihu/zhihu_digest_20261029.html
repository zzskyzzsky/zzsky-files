然我家也很困难，还是借了1千元，那是八几年啊。 大姨是初中毕业的，当年为了爱情嫁给了姨夫（一个孤儿），苦了一辈子，后来得了甲状腺癌，因为没钱长期吃药，脖子肿的来。有天跟我表哥说想吃鱼，表哥就拿鱼叉", "url": "https://www.zhihu.com/question/539187110/answer/2093020322228335155", "votes": 104, "comments": 28, "feed_ts": 1793202902, "feed_time_str": "10-28 23:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude 如何支持药物开发的各个阶段Claude参与药物研发，哪些进步已经有实验支持，哪些还没有人体结果？Anthropic公布的合作与自研项目涉及分子设计、生产文书和试验规划，但整体多数仍在临床前。看这些消息，要分开判断实验室指标、流程节省的时间，以及药物对患者的实际效果。受体数量变多，测的是细胞里的表现Generate Biomedicines的科学家借助Claude Code改进CAR-T设计。CAR-T通过改造T细胞，让它们识别目标细胞；这次缩短的是受体中一段负责传递信号的部分。Anthropic称，其中一个设计比常用版本短约70%，在实验室里让细胞表达的受体约为原来的10倍。受体是帮助细胞识别靶标的蛋白；这个倍数对应受体表达量，患者疗效尚未验证。Generate的技术报告描述了科学家设定目标、审查候选，再用实验结果引导下一轮设计的过程。模型辅助提出方案，实验人员负责测试；这些结果支持继续研究，尚不能推出对实体瘤患者有效。文件审查更快，最终仍由人判断Enveda把Claude接进批生产记录审查系统。四份记录共1061页，人工发现的11项需处理问题，系统在多次运行中至少有一次覆盖了每一项；Opus 4.7的一次运行另加了7项经核实的问题。这些统计跨多次运行，不能当作单次漏检率结论，审查意见仍需质量人员判断。系统处理加人工检查共166分钟，对照未使用系统的内部人工审查为1553分钟，约从25.9小时降到2.8小时。它加快的是这批文件的审查流程，没有证明药物更有效，也没有替代人工质量审核。监管文件初稿生成更快，同样不等于已经完成申报或获得批准。小鼠结果之后，人体试验仍有条件Anthropic收购的Mithril Medicine研究罕见肌营养不良。一个候选方案从想法走到小鼠中的初步积极结果，用了不到18个月；Claude参与了与外部实验室相关的合同、物流和实验协调。如果候选药物继续经得起验证，Anthropic预期最早2028年底才可启动人体临床试验。这是单个项目的条件性预期，不是上市或治愈日期。临床阶段也有合作：百时美施贵宝用Claude分析早期药物的试验计划、辅助评估成功可能性，并计划2027年扩大工作。但目前没有公布试验成功率因此提高了多少，不能把“会分析计划”当成已经改善临床结局。设计、文书与临床结局，需要分别验收这些案例显示，Claude已介入研发中的具体任务；证据层级却不同。细胞指标支持筛选方向，文件提速支持流程改进，患者能否获益仍需临床证据。多数项目尚未进入人体测试，不能把几类早期进展相加成“AI已经造出有效新药”。", "excerpt": "Claude 如何支持药物开发的各个阶段Claude参与药物研发，哪些进步已经有实验支持，哪些还没有人体结果？Anthropic公布的合作与自研项目涉及分子设计、生产文书和试验规划，但整体多数仍在临床前。看这些消息，要分开判断实验室指标、流程节省的时间，以及药物对患者的实际效果。受体数量变多，测的是细胞里的表现Generate Biomedicines的科学家借助Claude Code改进CAR-", "url": "https://www.zhihu.com/pin/2098923266714948872", "votes": 0, "comments": 0, "feed_ts": 1793202336, "feed_time_str": "10-28 23:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Google DeepMind的Genie 4来了Google DeepMind的Genie 4可以让 cat_name": "黄金 · 股票 · 市场"}, {"actor": "芯芯", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "巴西总统大选落败者博索纳罗已前往美国，哪些信息值得关注？", "excerpt": "2018年，卢拉被判入狱。 判决下达后几个小时，卢拉的支持者围在他所在的工会大楼附近。 卢拉走到人群里，做了一段长达50分钟的演讲。 视频是其中2分钟的剪辑。 我用AI把这次演讲的葡萄牙语翻译成中文。 内容如下： 同志们、朋友们。 有人说，没有卢拉参加的大选是一场欺骗。 但我们今天聚集在此，不仅是为了选举，更是为了捍卫巴西的主权。 对于司法部所做的判决，我毫不意外。我从未对这个法庭抱有任何幻想，更", "url": "https://www.zhihu.com/question/2098558261054136483/answer/2098857340468467700", "votes": 354, "comments": 28, "feed_ts": 1793186585, "feed_time_str": "10-28 19:23", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大水哥", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "总理举着棒铃，咬牙和伤痛较劲这是周总理坠马摔伤右臂之后，他在坚持做康复训练。背景是延安窑洞粗糙的土崖，坑洼斑驳，没有专业康复器械，手里这两根简陋的木棒铃，就是他对抗伤痛、努力恢复手臂功能的全部依靠。1939年7月，周恩来骑马赶往中央党校作报告，途中马匹受惊，他重重摔落在地，右臂造成粉碎性骨折。当年延安物资匮乏，缺药品、缺设备，骨科医疗条件很差，初期正骨没能到位，等发现骨头错位愈合时，已经错过了最佳治疗窗口。后来中央安排他前往苏联接受手术治疗，尽管医生尽力救治，伤势还是留下了终身后遗症：右臂无法完全伸直，活动受限，稍一用力就酸痛难忍。右手对他来说太重要了，批阅文件、起草文稿、与人谈判交流，样样都离不开。从苏联回到延安后，他没有向伤病妥协，遵照医嘱坚持康复锻炼。没有现代化的康复器材，就找来这一对木质棒铃，靠反复举抬、摆动，拉伸粘连僵硬的关节，锻炼萎缩的肌肉。这张照片拍摄于1940年的延安窑洞前，定格下他训练的瞬间。照片里，他穿着朴素的针织开衫，双手紧握棒铃，奋力向上举过头顶。这个看着简单的动作，对他来说每一次都是煎熬。受伤的右臂关节僵硬，每向上抬一寸，都要忍受拉扯的痛感。他神色沉静，没有流露痛苦，可这份平静之下，藏着常人难以想象的毅力。那时候的延安本就处境艰难，敌人封锁围困，各项工作千头万绪。总理整日公务缠身，谋划战局、处理根据地事务、接待各方同志，常常忙到深夜。康复训练只能挤零碎时间，忙完工作，抽空来到窑洞外，一遍遍重复枯燥的抬举动作。他坚持锻炼，不只是为了减轻自身疼痛，更是不想因为伤病耽误革命工作。我们后来在影像里常会留意到，总理握手时右手总是微微弯曲，无法伸直，正是这次摔伤留下的印记。大家熟悉的周总理，大多是从容睿智、谈笑运筹的模样，很少见到这样直面伤痛的一面。他也是血肉之躯，一样会疼、会疲惫，可心中装着国家和人民，就有了咬牙坚持下去的力量。时光流转，黑白照片静静留存至今。这个画面告诉我们，先辈那些从容担当的背后，都是无数次咬牙坚持、熬过苦难换来的。这份直面伤痛、不轻言放弃的精神，直到今天依然值得我们铭记。 #历史 #历史人物 ", "excerpt": "总理举着棒铃，咬牙和伤痛较劲这是周总理坠马摔伤右臂之后，他在坚持做康复训练。背景是延安窑洞粗糙的土崖，坑洼斑驳，没有专业康复器械，手里这两根简陋的木棒铃，就是他对抗伤痛、努力恢复手臂功能的全部依靠。1939年7月，周恩来骑马赶往中央党校作报告，途中马匹受惊，他重重摔落在地，右臂造成粉碎性骨折。当年延安物资匮乏，缺药品、缺设备，骨科医疗条件很差，初期正骨没能到位，等发现骨头错位愈合时，已经错过了最佳", "url": "https://www.zhihu.com/pin/2097624545582757502", "votes": 0, "comments": 16, "feed_ts": 1793186447, "feed_time_str": "10-28 19:20", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题 · 能源"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "很难理解，中国什么样的人喜欢以色列？如果喜欢，喜欢它什么方面？", "excerpt": "一个国家，大部分都是良民。除了良民之外，当然也有杀人抢劫强奸电诈之徒，也有CIA特务和汉奸，这些人都喜欢以色列。", "url": "https://www.zhihu.com/question/1921010478013986609/answer/1950509511992406152", "votes": 11, "comments": 0, "feed_ts": 1793178561, "feed_time_str": "10-28 17:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么有人认为“武契奇下台后，塞尔维亚立马从新闻联播里消失了”？", "excerpt": "是的，塞尔维亚走上正轨了。选举胜利的学生联盟已经宣布禁止向以色列、乌克兰出口武器，支持巴勒斯坦了。", "url": "https://www.zhihu.com/question/2098004604063634100/answer/2098393294346654936", "votes": 6112, "comments": 294, "feed_ts": 1793178338, "feed_time_str": "10-28 17:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你在飞机上遇见过什么奇葩？", "excerpt": "海航北京回深圳，空姐在发水时候给了我一套小连招：先用餐车撞了我膝盖，趁我惨叫弯腰揉膝盖时候手忙脚乱过来安抚我，然后把一杯热水浇到了我的背上……… 乘务长带着她道歉的非常诚恳 还送了我一套海航旗下海产商城的礼包，鱼和虾很好吃～ ", "url": "https://www.zhihu.com/question/25871260/answer/2098437357120787357", "votes": 2305, "comments": 153, "feed_ts": 1793178270, "feed_time_str": "10-28 17:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "【画师分享】宅男收割机—Anmi 这样的画风你爱了吗？", "excerpt": "今天给大家分享的是韩国插画师——Anmi 太太经常活跃与日本的漫画圈和插画圈，小学时因为看了《美少女战士》，因此对画画产生了浓厚的兴趣 但碍于父母的反对，在大学期间靠着自学学习绘画技法。 太太的画面明亮、干净，颜色也很舒服，对光感跟妹纸的肉感都把握的十分优秀，她的画风也是非常的特别 青春萝莉的面容加上性感诱人的身材，给人留下了深刻的印象。 太太有着自己的独特技法，其作品充满着透明感，画面十分的舒服", "url": "https://zhuanlan.zhihu.com/p/660132124", "votes": 23, "comments": 2, "feed_ts": 1793178247, "feed_time_str": "10-28 17:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "发布姆巴佩争议言论的节目组《The Bridge》发布英法双语致歉声明，如何看待此次回应？", "excerpt": "在整个西方世界里，法国是受毛泽东影响最深、层次最丰富、且精英参与度最高的国家，没有之一。 这也是为什么今天法国国家队队长姆巴佩会因为对毛泽东画像的无知玩梗而翻车，在熟悉法国现代史的人看来 e": "地缘 · 经济 · 能源"}, {"actor": "Augenstren", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "女生独生子女遇到男生多子女家庭，两个人结婚该注意什么问题？", "excerpt": "第一、你说的内容太少了……需要更详细一点都双方信息。 第二、我跟你分享一个真实的故事，你看看对你有没有启发。 我们家三个孩子，我排老二（女生），有一个比我大三岁的哥哥，一个比我小四岁的妹妹。 我哥交往过很多独生女，但最后很多都被他冷处理分手了（也就是那种还在交往，但是不谈结婚进程，女生如果发脾气，他就顺势分手或者女生提分手他丝滑同意） 起先，我以为是那几个女生没有达到他的“心动结婚标准”只是在搞短", "url": "https://www.zhihu.com/question/1993472081401242886/answer/2098748653066248627", "votes": 6, "comments": 2, "feed_ts": 1793160672, "feed_time_str": "10-28 12:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "从野战机动主力的视角来看，明末车营面对后金时是不是没有任何有意义的优点全是缺点？", "excerpt": "先说结论，车营实际上是早期火器时代（火门枪和火绳枪），一种由“车兵、铳兵、炮兵、近战步兵、骑兵”五者融为一体的合成军。如果五种兵力配合的好，那么在十八世纪之前，是值得采用的战术体系。如果五种兵力存在任何一种短板（骑兵和火枪兵是其中关键的两个），或是在五方协同时配合不够紧密，那么车营都将会变得十分鸡肋。 近代早期欧洲合成方阵同样是多兵种依存体系，四大兵种也需要密切配合进行作战，才有更大的几率获取胜…", "url": "https://www.zhihu.com/question/1941539827846734677/answer/2098364133720831683", "votes": 92, "comments": 26, "feed_ts": 1793160346, "feed_time_str": "10-28 12:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "刘杨", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "双十一你有哪些相见恨晚的智能家居好物推荐？", "excerpt": "说出来有点丢人，半年前朋友跟我安利擦窗机器人的时候，我是直接怼回去的：&#34;这玩意儿不就是个带风机的小车吗，能擦多干净？&#34; 双11前夕我老婆下单了一台 希亦W1，我还嘟囔说又交智商税。结果用到现在，我是全家最积极给它加水、换擦布的那个人，典型的 &#34;一开始看不起，现在离不开&#34;。所以这篇回答 &#34;双 11 有哪些相见恨晚的智能家居&#34;，我最想推的就是这台让我真香", "url": "https://www.zhihu.com/question/1045235353/answer/2098746073011445852", "votes": 1, "comments": 0, "feed_ts": 1793160057, "feed_time_str": "10-28 12:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价胡军版的《朱元璋》?", "excerpt": "从这部剧就能看出来让学的核心其实是朱苏进，没有朱苏进的姜文根本满足不了梗小鬼的期待，建议改让学为朱学。", "url": "https://www.zhihu.com/question/292518796/answer/1964811516311241893", "votes": 3181, "comments": 84, "feed_ts": 1793159332, "feed_time_str": "10-28 11:48", "category" 10:17", "category": "pin", "cat_name": "想法动态"}, {"actor": "夜静魂梦归", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么汉朝三百年形成“汉族”，美国三百年没成一个民族，英语都统一不了？", "excerpt": "我还以为相关史实大家都知道了，所以说没有提，我简单说一下。 晋朝建立的时候，已经没人自称汉人了，都自称晋人。 但是八王之乱之后就是衣冠南渡，紧接着就是北朝十六国。 当时北朝的五胡们把晋人称作汉人，并且汉人是贬义词。 接下来就是那句经典名言:“一钱汉，随之死”，并把高敖曹气的点兵准备火并。 错误的，你永远要记住一件事，汉民族认同不是你大汉朝叔叔缔造的。 而是五胡十六国那些汉人大军头在和胡人无尽的对掏", "url": "https://www.zhihu.com/question/2007375118435906590/answer/2029546895572222888", "votes": 22423, "comments": 933, "feed_ts": 1793153491, "feed_time_str": "10-28 10:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "欧洲高福利现象还能维持多久？", "excerpt": "国际贸易体系里的超额利润，对于高福利只是添砖加瓦，并不能决定福利制度的续存。 经典福利制度的核心，是低运行成本的技术岗位。 欧洲的高福利国家，长期压制白领和技术人员的工资增长，例如医疗福利，就压低了医护人员和医疗产业的工资与利润，英国、德国医护的收入就远低于同人均GDP的国家。 美国的医疗体系为什么没办法全民福利化？就是因为医疗服务市场定价和贫富差距。 上世纪六七十年代的瑞典，政府借助英美市场从全", "url": "https://www.zhihu.com/question/1959404042875826895/answer/2094496759321991082", "votes": 193, "comments": 59, "feed_ts": 1793153471, "feed_time_str": "10-28 10:11", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "大水哥", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "张飞在长坂坡叫阵的时候，曹军为什么不用弓弩射杀他？", "excerpt": "开什么玩笑，曹军弓箭手能射到张飞的距离，张飞肯定更容易射到对面。 李世民带着尉迟去敌人前挑衅的时候，为什么不射杀他。因为李世民射的更远、射的更准。 精锐部队，陷阵营、虎豹骑、白毦兵对民兵是嘎嘎乱杀，殿堂级将领对精锐部队也是乱杀。 实际上对峙只会发生在弓箭有效射程范围外，120米，算上冗余150米。弓弩在古代也算是高技术兵器，制造成本很高，高阶武将的弓质量远胜于普通士兵，如果曹军弓弩手到了能射击张飞", "url": "https://www.zhihu.com/question/1890892421891610343/answer/2098716753551438614", "votes": 27, "comments": 12, "feed_ts": 1793153067, "feed_time_str": "10-28 10:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价最近兴起的娘化马尔福的热潮？", "excerpt": "这波热潮最直接的原因很好理解。 金发、傲娇、毒舌、纯血贵族、恶役大小姐，再加上一个从十一岁开始就和她纠缠不休的救世主宿敌。这些元素组合在一起，确实很容易让人喜欢。 但是，如果把这个设定认真放回《哈利·波特》的七部小说里，而不只是画几张漂亮的同人图，我觉得它的价值会远远超过一个讨喜的二次元人设。 甚至可以说，只需要把德拉科·马尔福改成女性，再让她最终与哈利走到一起，就有机会把原著中好几条相对薄弱的 const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

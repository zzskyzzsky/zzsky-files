"title": "为了不让妹妹换车，我把小熊猫改装成了这样！暂无简介！", "excerpt": "为了不让妹妹换车，我把小熊猫改装成了这样！暂无简介！", "url": "https://www.zhihu.com/pin/2070681171370030605", "votes": 0, "comments": 0, "feed_ts": 1786468862, "feed_time_str": "08-12 01:21", "category": "pin", "cat_name": "想法动态"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "两周之际史事再思在之前的回答下为什么东周没有能中兴？和知友讨论，加上近年看了些新材料，关于两周之际又有了点思考，这个说来复杂，我简单分享一下陋见。去年清华程浩写了篇文章《〈竹书纪年〉“同惠王子多父伐郐”释疑——兼论两周之际的政治分野》，人大孙闻博也写了一篇《二王并立与秦为诸侯》，其中关于两周之际的年代经过梳理得比较好，我觉得是目前为止比较妥当的解释。即依据系年记载，幽王死后携王便被拥立为王，二十一年后被晋文侯杀死，而平王的并行叙事是幽王死后九年（周亡王九年），晋文侯将平王从少鄂迁到京师拥立为王，三年后晋文侯又拥护平王东迁成周。也就是说，幽王死后九年（公元前762）才真正出现二王并立，并立了十二年，到携王被杀为止（公元前750）。再看这里的地理问题，我认为如果“携”是地名，那么应该在骊山附近，近来也有先生写文章论证这一点，即幽王遇害于骊山下，邦君、诸正旋即在附近的携地拥立余臣为“携王”，然后在虢国支持下迁到西虢（宝鸡），具体什么时候从携到西虢不确定。幽王遇害九年后平王被晋文侯从少鄂迁到京师，这九年间平王的行踪不明，只知道最后被从少鄂接走，平王这九年间大抵还在西申和晋国所能控制的关中西北到东北一带，少鄂估计就是晋国地名。幽王死后九年，邦君、诸侯开始不朝周，注意这里说的是诸侯不是诸正，我推测携王自幽王死后本在骊山的携地，九年后可能被平王集团或戎所逼，自携地西迁到西虢，远离了邦君和东部诸侯，故而诸正可以随携王西迁，而邦君、诸侯不再朝见携王。这时晋文侯审时度势，将平王从少鄂送到京师拥立为王，树立平王的正统地位，隔断西虢的携王和偏东的邦君、诸侯的政治联系，进一步孤立携王。现在一些人认为“京师”在韩城，但我以为“京师”可能还是如清华简整理者所认为的指镐京，因为晋文侯立平王于京师，按系年描述是对“邦君、诸侯不朝周”的回应，是有明确目的的政治行为，应该是要刻意塑造平王的合法地位，镐京在西周末年应该是幽王的主要都邑（这点这里不展开）。综上，幽王死后九年，携王已经西迁到西虢，平王被晋文侯拥立在京师，但是三年后，平王被晋文侯护送东迁成周，这又是为什么？我认为平王可能是被携王集团东进讨伐所迫，不得不退出关中。当下很多学者认为虢季子白盘非宣王器而是携王器，我支持这一观点，按盘铭应该是携王十二年虢国向东伐戎到了关中东部的北洛河，这些戎可能就是支持平王集团的姜姓势力，携王十二年正好是幽王死后十二年，也正是平王在京师被拥立的三年后，在携王-西虢集团的逼迫下，平王集团不得不东迁到成周。然后又涉及到了秦国问题，我认为秦本支持幽王-携王，其长期为附庸，依赖正统周王方得存立，且秦人在西周晚期应与姜姓戎人有仇，不应该在第一时间倒向平王集团。但是，我认为在携王十二年到携王二十一年之间，携王集团应该自宝鸡迁到了三门峡，原因可能是被秦所迫，秦之所以背叛携王集团，应该是被平王集团拉拢，平王彻底放弃岐、丰之地（即周原、丰镐两大都邑），将之许给秦人。携王集团来到虢国早就开始经营的三门峡，落入了晋国的攻击范围，携王二十一年时，晋人在三门峡的虢国杀死了携王，在这之前可能虢国也背叛了携王，（考虑到东周初年虢国在洛阳平王朝廷的崇高地位，这很有可能），平王集团通过威逼利诱将虢国也拉拢到自己一边，携王最终彻底孤立败亡，死于三门峡。而这之间已经东迁的郑国因为和姜姓的联姻关系也被平王集团拉拢，详见程浩文章。总结一下，我认为平王之所以能最终胜出，说难听点就是足够不要脸，平王集团本来包括姜姓之西申、许、吕及随从之缯，以及与姜姓或戎长期有政治联系的晋、郑，又通过利诱、威逼拉拢秦、虢，将西周二百余年家业散了个七七八八以拉拢各方势力，甘愿自削以保全虚位。 #竹书纪年 #平王东迁 #周王室 ", "excerpt": "两周之际史事再思在之前的回答下为什么东周没有能中兴？和知友讨论，加上近年看了些新材料，关于两周之际又有了点思考，这个说来复杂，我简单分享一下陋见。去年清华程浩写了篇文章《〈竹书纪年〉“同惠王子多父伐郐”释疑——兼论两周之际的政治分野》，人大孙闻 SWER", "verb_cn": "赞了回答", "title": "据说东晋时才发明的马蹬，很奇怪卫青霍去病怎么组织的数十万骑兵会战？", "excerpt": "我来自锡林郭勒，蒙古族， 四岁开始骑马。观点：① 原始人就有马蹬（皮条为主）；②马镫（蹬）对草原人帮助更大；③历史上全世界都没有在一场战斗里投入超过十万人以上的纯骑兵会战。下面我以一个四岁开始骑马的资深 野生骑手的角度，普及一点关于骑马的常识。第1个反常识：骑马其实是坐在上面，马镫能让腿更轻松。决定你能否骑在一个马上的决定性因素是马 是否驯服，唯有在拥有一匹驯服的马之后才有必要谈及马鞍马镫。换而言", "url": "https://www.zhihu.com/question/497079999/answer/1969399977181705783", "votes": 9638, "comments": 1167, "feed_ts": 1786465728, "feed_time_str": "08-12 00:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "我杂七杂八的临床经验还是过于多了。有人问我，术后患者在ICU过了一晚上，莫名其妙脖子肿了，也不是手术部位，搞不清楚原因，升压药量也比较大，问我为什么。我说我有一个猜测，就是静内中心静脉插管放浅了，输液从侧孔进入皮下软组织，你们核对胸片，插管深度，然后先拔了吧。果然，用了个没见过的三腔插管，有个侧孔距尖端有7-8公分。", "excerpt": "我杂七杂八的临床经验还是过于多了。有人问我，术后患者在ICU过了一晚上，莫名其妙脖子肿了，也不是手术部位，搞不清楚原因，升压药量也比较大，问我为什么。我说我有一个猜测，就是静内中心静脉插管放浅了，输液从侧孔进入皮下软组织，你们核对胸片，插管深度，然后先拔了吧。果然，用了个没见过的三腔插管，有个侧孔距尖端有7-8公分。", "url": "https://www.zhihu.com/pin/2070580444958037206", "votes": 0, "comments": 18, "feed_ts": 1786464569, "feed_time_str": "08-12 00:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "乌龟战术的失败垃圾候选人当缩头乌龟躲地下室是有前提的，不能自己居于聚光灯和媒体之下，得有一大堆垫背的分担火力。比如AZ州长2022就用这一招赢了，因为全美值得报导的地方多了去，还有WI PA OH GA等等一大堆热点；帕克斯顿自己也多次靠着低关注度+基本盘优势，全靠本党选民赢下选举。但到24年这一招不可能奏效，拜登如果坚决拒绝辩论躲地下室生死不明，固然会比OTL辩论结果+参选到底强，但一定比本位面选举结果更惨淡。到了2026年，翻蓝德州是最大的媒体聚焦话题，堪比2022年PA总决战。此时继续当乌龟只会被穷追猛打到死，动摇本方士气。昨天的共和党内部民调就是反击的前兆。该民调显示德州州长共和党仅仅领先3%，而参议员的数据干脆没放，这个结果让自己人都绷不住，纷纷一改口风，大声疾呼情况有变，参院真的药丸不能继续苟死了！预计共和党新的一大波资金和广告很快就到位，到时候会是一场短兵相接硬碰硬的选战。", "excerpt": "乌龟战术的失败垃圾候选人当缩头乌龟躲地下室是有前提的，不能自己居于聚光灯和媒体之下，得有一大堆垫背的分担火力。比如AZ州长2022就用这一招赢了，因为全美值得报导的地方多了去，还有WI PA OH GA等等一大堆热点；帕克斯顿自己也多次靠着低关注度+基本盘优势，全靠本党选民赢下选举。但到24年这一招不可能奏效，拜登如果坚决拒绝辩论躲地下室生死不明，固然会比OTL辩论结果+参选到底强，但一定比本位面", "url": "https://www.zhihu.com/pin/2070595869259338189", "votes": 0, "comments": 6, "feed_ts": 1786464330, "feed_time_str": "08-12 00:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价有理科生频繁认为理工科思维更容易相信伪史论？", "excerpt": "只能说已经根本不是文科理科的矛盾了 ", "url": "https://www.zhihu.com/question/2069345300871901779/answer/2070266604768720218", "votes": 102, "comments": 5, "feed_ts": 1786463820, "feed_time_str": "08-11 23:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么大部分“垃圾食品”（junk food）是欧美发明的，是为了影响全世界的健康吗？", "excerpt": "执念于麦肯是垃圾食品，吃一顿就要减寿的人，百分百会说出以下至少一条相同意义的话语： 酒是粮食精，越喝越年轻。民以食为天，人是铁饭是钢，食是粮食，饭是米饭，所以馍馍白米不仅要多吃，还要狠狠地吃。多喝热水，不烫不算热。猪头肉不肥不香，卤肉不咸不香。又没长毛，怎么不能吃？把长毛的地方切掉怎么不能吃？就得是长毛了才好吃！", "url": "https://www.zhihu.com/question/1918027117184135390/answer/1930660951419520128", "votes": 1106, "comments": 37, "feed_ts": 1786463692, "feed_time_str": "08-11 23:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "很多人对太阳系的认知，有哪些常见的误区？", "excerpt": "1.误以为太阳是一颗较小的恒星。实际上太阳在周边7000立方光年的广阔空间内的包括已知约三十颗恒星中，太阳仅次于天狼星，南河三A和南门二A星，位列第四位。也就说，太阳比86%的恒星质量都要大。(备注:天狼星B的质量和太阳相当或略大，但考虑白矮星体积上实在太小，所以我把她排在太阳后面).(有评论提到说我故意只看邻近的恒星，我看邻近的恒星是因为我本着不借助AI等工具来做的权宜之计。如果我们把范围扩大到", "url": "https://www.zhihu.com/question/1958128936966939027/answer/1982117562285331308", "votes": 1835, "comments": 182, "feed_ts": 1786462235, "feed_time_str": "08-11 23:30", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "NVIDIA开源Nemotron 3.5 Lightning长程 agent 不只做一次回答，还会反复调用工具、验证结果和委派工作。NVIDIA 新近开源的 Nemotron 3.5 Lightning，瞄准的就是这段高频执行：总参数 30B，活跃参数 3B，面向持续运行的 agent。模型卡写的是 30B 总参数、3B 活跃参数，架构是 Mamba-2、MoE 和部分 Attention 的混合。它同时支持最长 1M token 上下文，并带了 DSpark、DFlash、MTP 三种推测解码方案。这份配置面向 agent 在长任务里的持续执行。官方列出的动作很具体：调用工具、验证结果、委派工作。NVIDIA把它放在执行层随模型一起发布的 NeMo Switchyard，是一个开源模型路由库：复杂推理和规划仍可交给前沿模型，高容量、专业化执行则交给 Lightning。NVIDIA 给出的工作流分工很明确：前沿模型负责复杂推理和规划，Lightning 负责高容量、专业化执行。速度数字要连同条件看“最高 4 倍输出速度”没有展开测试条件，不是所有场景的速度结论。NVIDIA给了一个更具体的范围：在 PinchBench 上，NVIDIA 报告 Lightning 准确率 86%；完成 10,000 个任务时，比 Qwen3.6 35B 快 35%，准确率相当。这些基准来自 NVIDIA 使用 NeMo Gym 和 NeMo Evaluator SDK 的固定测试设置，不同厂商的自报数字可能不同。看发布时，先看任务、硬件和并发条件，比先记一个“快几倍”更有用。已有 agent 工作流、且执行阶段工具调用很多的团队，可以先看这条路线。权重、训练数据和配方都已公开；模型卡给出 DGX Spark 或 H100 的单卡部署范围，并推荐 DSpark 用于 DGX Spark 和低并发数据中心。如果你的任务主要依赖复杂推理，或者硬件不在模型卡列出的范围内，先别把它当成通用替代品。Nemotron 3.5 Lightning 这次最明确的答案，是给 agent 的高频执行环节准备了一个可路由、可后训练的开源模型。", "excerpt": "NVIDIA开源Nemotron 3.5 Lightning长程 agent 不只做一次回答，还会反复调用工具、验证结果和委派工作。NVIDIA 新近开源的 Nemotron 3.5 Lightning，瞄准的就是这段高频执行：总参数 30B，活跃参数 3B，面向持续运行的 agent。模型卡写的是 30B 总参数、3B 活跃参数，架构是 Mamba-2、MoE 和部分 Attention 的混合", "url": "https://www.zhihu.com/pin/2070652745250608158", "votes": 0, "comments": 0, "feed_ts": 1786462093, "feed_time_str": "08-11 23:28", "category": "pin", "cat_name": "想法动态"}, {"actor": "南爸安爸", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "链接 DeepEP × DualPipe : Deepdive into the hidden synchronization and Parallelization in EP Parallelization system 从Deepep从“总线”域分布式计算单元之间的分层并行“同步”的高并发设计的理解，融入dualPipe的视角，如何看待在紧耦合计算系统下构建高并发系统，并发同步在哪儿，以及如何消除的一些看法。在Parameter Server时代，推荐系统一般也会从TCP connection的并发、TCP RTO超时时延控制、Parameter server compuation on Multicore处理器的并行参数更新、parameter参数shard并行、参数均衡性、计算和通信流水overlapping、甚至驱动网卡硬件丢包等机制，多层次去设计提高parameterserver并行度，从而提高参数在worker和server之间的流动效率，思想比较类似，区别在于：LLM时代AIinfra逐渐走向全面超节点化后，怎么在总线域或者低时延的roce域内，又SIMT或者AIcore来全面直驱系统的计算、存储、互联，提高数据交互系统的并发度，Deepep是一个很好的最佳实践系统，我们认为它更是一个超节点上分布式系统，而不是dispatch、combine算子而已。", "excerpt": "链接 DeepEP × DualPipe : Deepdive into the hidden synchronization and Parallelization in EP Parallelization system 从Deepep从“总线”域分布式计算单元之间的分层并行“同步”的高并发设计的理解，融入dualPipe的视角，如何看待在紧耦合计算系统下构建高并发系统，并发同步在哪儿，以及如", "url": "https://www.zhihu.com/pin/2070651501991797110", "votes": 0, "comments": 0, "feed_ts": 1786461796, "feed_time_str": "08-11 23:23", "category": "pin", "cat_name": "想法动态"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价《原神》角色预告-「奥黛塔：天真的挽歌」？", "excerpt": "要是原神真要搞《色·戒》这一套，那可真神了。小鸟爱上豺狼，吃的就是这一口。 pid：148271841 ", "url": "https://www.zhihu.com/question/2070480211636904193/answer/2070558441110819635", "votes": 106, "comments": 18, "feed_ts": 1786461772, "feed_time_str": "08-11 23:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "一个未发布Claude研究版本尝试攻克黎曼假设Claude 没有证明黎曼猜想。一次未发布研究版 Claude 的长程探索，却把一个相关问题的已知下界从 41.6% 推到 67.2%。这个比例不等于“数学题做对了 67.2%”，也不表示“黎曼猜想完成了三分之二”；它给的是一个关于无穷多个零点的严格比例保证67.2%到底代表什么黎曼猜想讨论的是黎曼 ζ 函数的非平凡零点：它们是否全部落在实部等于 1/2 的“临界线”上。这个猜想从 1859 年提出至今仍未被证明此前，人们已知至少 41.6% 的零点在这条线上。Claude 找到的结果把这个比例下界提高到约 67.2%，也就是“至少三分之二”。它并没有说剩下的零点在哪里即使未来把这种“比例下界”推到 100%，仍不能单靠这一点证明黎曼猜想，因为理论上可能存在有限个不在临界线上的例外。这里讨论的是无穷多个零点里的比例，不是逐个排除例外Claude把几十年工作重新拼起来这个结果大量依赖数学家过去几十年的研究。Claude 将 Baluyot、Goldston、Suriajaya、Turnage-Butterbaugh 的一系列工作，与 Bombieri 在 2000 年的结果结合，找到了能越过 41.6% 的论证路径这项结果沿用了多篇既有研究，再把原本分散的工具放到同一条推导里。它没有凭空发明一门新数学，贡献落在这条组合路径和后续核验上31M token换来一套研究流程这个结果来自两次 Claude Code 会话，总共用了 3100 万个输出 token。第一次生成并尝试了 650 个想法，没有成功；第二次持续约一天半，协调约 60 个 subagent，运行 2400 条 shell 命令，写了数百个 Python 脚本，并对已知 ζ 零点做了数千次数值检查找到结果后，Claude 还让不同 subagent 审阅证明、搜索反例、下载 54 篇 arXiv 论文核对是否已有相同结论，并尝试从头独立重证。这一串动作比“模型给出一个答案”更接近研究中的搜索、核对与复查人类核验和Lean证明都在场Anthropic 的两位数学家 Levent Alpöge 和 Ralph Furman 研究了这项工作；Brian Conrey 和 Dan Goldston 也在短时间内审阅了论文。与此同时，团队把结果写成 Lean 形式化证明，公开仓库给出了可由 Lean 内核检查的定理与依赖这离黎曼猜想还有多远Anthropic 说，不期待这套技巧直接导向黎曼猜想的证明。67.2% 是相关方向上的实质进展，不能改写成“Claude 解出了黎曼猜想”在这个数学任务里，Claude 组织了广泛试错、数值检查、文献检索、反例搜索和形式化验证，得到一项经过人工审阅的相关结果。它没有解出黎曼猜想，67.2% 也没有改变这条边界", "excerpt": "一个未发布Claude研究版本尝试攻克黎曼假设Claude 没有证明黎曼猜想。一次未发布研究版 Claude 的长程探索，却把一个相关问题的已知下界从 41.6% 推到 67.2%。这个比例不等于“数学题做对了 67.2%”，也不表示“黎曼猜想完成了三分之二”；它给的是一个关于无穷多个零点的严格比例保证67.2%到底代表什么黎曼猜想讨论的是黎曼 ζ 函数的非平凡零点：它们是否全部落在实部等于 1/", "url": "https://www.zhihu.com/pin/2070647406551644107", "votes": 0, "comments": 0, "feed_ts": 1786460830, "feed_time_str": "08-11 23:07", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "为什 家岱清固伦洗地。 没有满清入关，中国会不会发生工业革命？ 当然会发生了。跟小农和封建制度有什么关系？还积重难返。 俄国农奴制＋封建制，日本小农＋农奴＋封建制，人家没有工业革命成功吗？ 有谁规定了中国发生工业革命一定要先发？后发不可以吗？ 中国不能率先发生工业革命的根本原因是离人类文明知识枢纽太远，跟什么小农，什么", "url": "https://www.zhihu.com/question/2065502163757949593/answer/2070494266200175926", "votes": 119, "comments": 7, "feed_ts": 1786424301, "feed_time_str": "08-11 12:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI发布新模型 GPT-5.6-CyberGPT-5.6-Cyber 已经发布，但普通 ChatGPT 用户看不到。它被放进 OpenAI 的 Daybreak Red，只向获批的个人和机构开放，用于授权漏洞研究、漏洞利用验证和安全测试。多数防御团队的推荐起点，是权限更宽的 Daybreak Blue。Blue和Red处理的风险等级不同Daybreak Blue 提供 GPT-5.6 Sol，面向漏洞发现、安全代码审查、恶意软件分析、事件响应和补丁验证等常规防御工作。Daybreak Red 才包含专门训练的 GPT-5.6-Cyber。它在 GPT-5.6 Sol 基础上继续训练，减少了面对部分高风险双用途任务时的拒绝，因此能处理零日漏洞、漏洞利用链等更敏感的工作。能力放得更开，访问审批、监控和使用限制也更严。95%测的是愿不愿意完成任务OpenAI 的内部测试里，GPT-5.6-Cyber 对高级网络安全请求的完成率是 95.0%，GPT-5.6 Sol 为 1.5%，Daybreak Blue 为 2.0%，GPT-5.5-Cyber 为 57.3%。这个数字衡量模型面对这类请求时是否继续作答，不能当成漏洞发现准确率或攻击成功率。真正看能力，还要结合 ExploitGym、零日漏洞测试和 V8 漏洞利用等评测。V8案例展示了它能做多深OpenAI 用 GPT-5.6-Cyber 做真实漏洞研究时，在 Chrome V8 中找到两个此前未知、可以串成利用链的问题：一个造成内存破坏，另一个可绕过 V8 堆沙箱。第一个问题已由 Google 修复并编号为 CVE-2026-15903，另一个仍在协调披露中。不过，专用模型并非每项测试都更强。在漏洞报告写作评测里，GPT-5.6-Cyber 反而落后于 GPT-5.6 Sol，官方推测原因是它写出的报告更短、细节更少；在标准 300 轮的 V8 利用测试里，Blue 版本的 Sol 也表现更好、token 使用更省。大多数团队先从Blue开始Daybreak Red 面向有经验、能证明任务授权范围的防御者。个人研究者也能申请，但要经过身份核验、账户安全检查、持续监控和法律承诺；从 2026 年 9 月 1 日起，个人访问还必须使用硬件安全密钥。因此，这次发布的核心变化是把网络安全能力按风险拆成两层：常规防御先用 Blue，确实需要做授权漏洞利用和高级红队测试，再申请 Red。95% 说明 GPT-5.6-Cyber 更少拒绝敏感任务，V8 案例才说明它已经能参与真实漏洞研究。", "excerpt": "OpenAI发布新模型 GPT-5.6-CyberGPT-5.6-Cyber 已经发布，但普通 ChatGPT 用户看不到。它被放进 OpenAI 的 Daybreak Red，只向获批的个人和机构开放，用于授权漏洞研究、漏洞利用验证和安全测试。多数防御团队的推荐起点，是权限更宽的 Daybreak Blue。Blue和Red处理的风险等级不同Daybreak Blue 提供 GPT-5.6 So", "url": "https://www.zhihu.com/pin/2070493468108001347", "votes": 0, "comments": 0, "feed_ts": 1786424127, "feed_time_str": "08-11 12:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

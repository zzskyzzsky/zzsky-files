, "url": "https://www.zhihu.com/pin/2067357237237101749", "votes": 0, "comments": 14, "feed_ts": 1785677676, "feed_time_str": "08-02 21:34", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "西班牙北非飞地休达遭遇大规模移民涌入，负责人直言边境已「完全崩溃」，目前情况如何?", "excerpt": "主要西班牙最近改了一项法律，边境巡警在抓非法移民的时候，只能抓翻越陆地铁丝网或坐船入境的人，言外之意就是不能抓从海里游过去的人。所以不少摩洛哥人就觉得只要游过去就能顺利入境西班牙 所以在7月30号和7月31号短短两天时间就有至少6万名非法移民（大部分是摩洛哥人）通过游泳的方式试图入境休达，其中至少有67人不幸身亡，不过8月2号大部分非法移民都已经被送回或者自愿返回摩洛哥，休达和摩洛哥边境已经远没有", "url": "https://www.zhihu.com/question/2066407134779138989/answer/2067318694892647600", "votes": 44, "comments": 10, "feed_ts": 1785677396, "feed_time_str": "08-02 21:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "弱模型不是用来模仿的，而是用来计算“能力增量”的图文版：链接4B差值怎样教强8BW2S-OPD研究的是没有更强教师时，能否继续给强模型提供逐token监督。在Qwen3-8B的数学蒸馏实验中，它不让8B直接模仿4B模型，而是比较一个4B-RL数学专家与其RL前初始化版本的logit差，再将该差值叠加到8B基模型上，构成proxy teacher。四项竞赛数学基准的平均分因此从普通OPD的46.5升至51.8，高5.3个百分点，相对提升11.4%。三种对比对的成本条件RL前后对比需要先在4B尺度训练领域专家；不同规模对比直接使用Qwen3-4B与0.6B，无需新增训练、数据或奖励设计；正确/错误提示对比只用一个4B模型，但需要参考解答。后两种设置仍能让8B在数学上分别平均提高6.0和1.4个百分点，代码上分别提高1.2和1.1个百分点。核心不是任意弱模型都能当老师，而是正负模型之间必须包含可分离的目标能力差。七项基准与两项域外测试单教师设置下，代码三项基准平均从58.7升至60.9，比OPD高2.2个百分点；数学平均分也高于4B-RL专家的48.8。数学训练后，GPQA-Diamond从初始模型的38.9升至56.5，比OPD高2.1个百分点，IFBench也高1.1个百分点。三类对比对强化的推理环节并不相同：RL前后与提示对比更偏规划、监控，规模对比更偏分析、实施。8B实验的结论边界结果说明，在Qwen3-8B、四项数学和三项代码基准的配置中，较小模型的正负logit差可成为比直接OPD更有效的监督源。证据尚未覆盖更多模型、领域和训练分布，也不能推出弱模型能够普遍替代强教师；实际使用仍需验证对比对、α取值和目标任务外的能力保持。原文标题：WEAK-TO-STRONG ON-POLICY DISTILLATION#无影寺 ", "excerpt": "弱模型不是用来模仿的，而是用来计算“能力增量”的图文版：链接4B差值怎样教强8BW2S-OPD研究的是没有更强教师时，能否继续给强模型提供逐token监督。在Qwen3-8B的数学蒸馏实验中，它不让8B直接模仿4B模型，而是比较一个4B-RL数学专家与其RL前初始化版本的logit差，再将该差值叠加到8B基模型上，构成proxy teacher。四项竞赛数学基准的平均分因此从普通OPD的46.5升", "url": "https://www.zhihu.com/pin/2067361054557057389", "votes": 0, "comments": 0, "feed_ts": 1785677378, "feed_time_str": "08-02 21:29", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "杨戬为什么那么讨厌刘彦昌？", "excerpt": "你带入杨戬，你也讨厌刘彦昌。 1.杨天佑也是凡人，他站在瑶姬前面，刘彦昌站在三圣母后面哭唧唧； 2.杨戬也是亲妈被镇压，他本人是求神拜仙学本领，为救母，沉香就相当个员外，他妈不救了，你说小孩子没记忆，那么是不是他爹刘彦昌的问题？ 3.沉香一屁股毛病，得靠杨戬演黑脸，设考验，一个个拔除，改一个毛病骂两嘴刘彦昌。 4.杨戬自己没崽子，所以特别看重沉香，就更烦刘彦昌了。 杨戬全局就打刘彦昌是邦邦铁拳。 ", "url": "https://www.zhihu.com/question/1995228146639839534/answer/2066979208103048118", "votes": 281, "comments": 6, "feed_ts": 1785677359, "feed_time_str": "08-02 21:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "让35B agent反复跑实验改方案，OpenMLE在MLE-Bench Lite超过GPT-5.5图文版：链接MLE-Bench Lite 22项任务：35B系统以71.21%超过GPT-5.5+CodexFrontis-MA1-35B接入OpenMLE-Evo-Max，在单张RTX 4090、12 GPU小时、12 GB VRAM限制下，Medal Average为71.21%，GPT-5.5加Codex为68.18%。Medal Average是22项任务中获得任一Kaggle奖牌的任务占比均值，不是通用模型分数。四个操作贯通后训练与长程搜索OpenMLE把Draft、Improve、Debug、Crossover作为训练和推理动作：用可执行高分轨迹做SFT，以运行结果做RL；搜索按质量、相对进步和新颖性选下一步。与原始AIRA-Evo的66组匹配运行中，模型token从1.293亿降至7530万，减少41.7%，Improve刷新最佳结果的比例从4.73%升至9.36%。NatureBench Lite：模型与搜索各自有初步迁移证据在10项、6个科学领域任务中，固定框架只换成Frontis-MA1-35B，达到或持平SOTA的任务占比从50%升至70%；固定基础模型只换搜索框架，则从20%升至50%。这仍是受控基准上的初步迁移证据。OpenMLE仍是受控测试床，不是完全体RSI作者来自Horizon Research、Frontis.AI和清华大学。系统主要优化候选方案最终得分，搜索机制和权重仍主要由人工设定。原文标题：Frontis-MA1: Training an AI4AI Model towards Recursive Self-Improvement in Machine Learning Engineering#无影寺 ", "excerpt": "让35B agent反复跑实验改方案，OpenMLE在MLE-Bench Lite超过GPT-5.5图文版：链接MLE-Bench Lite 22项任务：35B系统以71.21%超过GPT-5.5+CodexFrontis-MA1-35B接入OpenMLE-Evo-Max，在单张RTX 4090、12 GPU小时、12 GB VRAM限制下，Medal Average为71.21%，GPT-5.5", "url": "https://www.zhihu.com/pin/2067360241138849045", "votes": 0, "comments": 0, "feed_ts": 1785677274, "feed_time_str": "08-02 21:27", "category": "pin", "cat_name": "想法动态"}, {"actor": "宝郁", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有哪些细思恐极的冷知识？", "excerpt": "06年发生的事已经是10年前的事了。", "url": "https://www.zhihu.com/question/50457318/answer/121812148", "votes": 120, "comments": 42, "feed_ts": 1785677199, "feed_time_str": "08-02 21:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "时予", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "高志凯把汉奸后代问题摆上台面高志凯这次没绕弯子，直接捅破了一层很多人不愿碰的窗户纸。他说八十年前谁给日军送过粮，谁偷偷把城墙防守图递了出去，档案里都有名字。纸页发黄了，可罪证没烂，这些人的孙子、重孙现在在哪儿，在干什么？高志凯这次把一个敏感问题直接摆到了台面上。抗战时期，谁给侵华日军提供物资，谁替日伪政权办事，谁泄露过军事情报，很多行为并没有随着当事人离世而消失。人可以改名换姓，原始记录却可能仍然躺在档案馆里。这类档案并不是民间传说，国家档案局从2016年启动抗日战争档案汇编工程，系统整理各地保存的抗战史料，内容包括日本侵华罪行、日伪统治、战犯审判和汉奸惩治等。截至2025年11月，已有170多家综合档案馆参与，出版成果超过140种、700册。上海市档案馆公开的抗战档案中，就包括日伪上海市政府的人事任免、机构变化和政务管理资料。那些姓名、职务和命令一旦被写进公文，后来再怎样包装，也很难把当年的身份彻底抹掉，档案存在的意义，就是让历史判断建立在证据上，而不是建立在情绪和猜测上。高志凯那句追问真正有冲击力的地方，不是要求后人替祖辈受罚，而是提醒人们别急着把那段历史翻过去。有人当年主动依附侵略者，有人利用日伪体系谋取利益，也有人在战后迅速换了身份，今天重新查看这些记录，追究的是历史真相，不是制造新的家族仇恨。这里必须把边界说清楚，祖辈犯下的罪，不能因为血缘关系自动转到孙辈身上，更不能只凭姓氏、籍贯或政治立场，就认定某个人出身于汉奸家族，谁主张，谁举证，没有可靠档案支撑的家族指控，只会把严肃的历史讨论变成网络猎巫。但后人没有原罪，不等于历史可以随便改写，一个人若正常生活，承认侵略事实，即使祖辈曾经犯错，也不该受到围攻。可要是有人主动替侵略者翻案，把殖民统治包装成恩赐，把民族抵抗说成麻烦，那他面对的就不只是祖辈问题，而是自己今天作出的政治选择。我认为，这才是高志凯这番话最该被讨论的地方，档案不是用来调查谁的血统，更不是用来给普通后人贴标签，而是用来识别那些仍在延续的错误历史观。真正需要追问的，不是一个人的祖先姓什么，而是他今天是否承认侵略、是否尊重民族苦难、是否仍在替军国主义寻找借口。台湾曾经历日本长达半个世纪的殖民统治，殖民教育和皇民化政策确实留下了复杂影响。部分政治人物对日本殖民历史表现出的美化倾向，也一直引发争议。但要进一步认定某些人的财富和政治资源全部来自祖辈投靠日军，就必须拿出完整的财产记录、任职档案和传承证据，不能靠一句祖上亲日直接定案。历史清算也不能变成血缘清算。法律判断针对的是具体行为、具体责任和能够核实的证据，不是某个家族的所有后代。后人愿意面对史料、承认错误，本身就是社会走向成熟的表现，没有必要逼着他们为出生以前的事情反复道歉。真正该警惕的，是有人一边享受今天的公共生活，一边有意删除侵略者造成的伤亡，把受害者记忆说成煽动仇恨。江苏等地公布的抗战档案，记录了1937年至1949年间大量人口伤亡和财产损失，目的正是用原始材料还原战争给普通百姓带来的灾难。档案纸张会发黄，记录的责任却不会自动失效，该被保护的是无辜后人的正常生活，该被追问的是仍在公开美化侵略、否定苦难的人，把这两者分开，历史讨论才不会滑向报复，也不会被一句过去就让它过去轻易打发。高志凯问那些人的后代如今在哪儿、在做什么，这个问题不该对准每个沉默生活的普通家庭，它真正对准的，是那些仍然借殖民叙事推动分裂、替侵略历史洗白的人。祖辈留下什么无法选择，今天站在哪一边，却是每个人自己作出的决定。", "excerpt": "高志凯把汉奸后代问题摆上台面高志凯这次没绕弯子，直接捅破了一层很多人不愿碰的窗户纸。他说八十年前谁给日军送过粮，谁偷偷把城墙防守图递了出去，档案里都有名字。纸页发黄了，可罪证没烂，这些人的孙子、重孙现在在哪儿，在干什么？高志凯这次把一个敏感问题直接摆到了台面上。抗战时期，谁给侵华日军提供物资，谁替日伪政权办事，谁泄露过军事情报，很多行为并没有随着当事人离世而消失。人可以改名换姓，原始记录却可能仍然", "url": "https://www.zhihu.com/pin/2067024277191275887", "votes": 0, "comments": 344, "feed_ts": 1785674943, "feed_time_str": "08-02 20:49", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "日本被曝大规模干预汇市，美国也同日出手，这意味着什么？", "excerpt": "周五早上，看到路透社发了一个消息人士的新闻，说美国财政部已经通知多家银行，让他们准备好周五可能出手干预日元。当时没说这事，怕是小道消息。 后来周五晚上像看直播一样，看到明显几波干预，而且日元每次被拉起来，都能撑得住，不像前几次马上就跌下去，那时就在想美国大概真的出手了。 但美日利差是关键，比如日本2年期收益率才1.5%，而美国2年期收益率已经达到4.3%，中间差了将近3个点的利差。只要利差不缩小，", "url": "https://www.zhihu.com/question/2066898462831031735/answer/2067348237518903121", "votes": 299, "comments": 13, "feed_ts": 1785674229, "feed_time_str": "08-02 20:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "木文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "生命应该还有半年，晚期胃癌，不想治了，手里还有七万块钱，应该去哪里旅游才能不让生命浪费？", "excerpt": "朋友，我刚送走了我女朋友，她七月发现胃癌晚期+转移，十号刚解脱。 快速说几点吧 1、癌症大晚期，你是没法出去玩的，你每天连起床穿衣都需要有人照顾，上厕所就大喘气，你会依赖吗啡等止痛药减缓癌痛，这个等死的过程可能持续一两个月，生活质量非常的低。 2、治疗胃癌不需要什么钱（一线免疫药物卡度马上1月1日起就进医保了，其他常规药物都在医保，目前贵的只有18.2的佐妥昔），大把实验组可以进，入组还倒给你钱。", "url": "https://www.zhihu.com/question/1978825276369699716/answer/1983206648551064047", "votes": 36028, "comments": 802, "feed_ts": 1785673012, "feed_time_str": "08-02 20:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "黄金、白银和原油等期货场产品的市场动态是怎样的？", "excerpt": "周末，总统这货又出来搅和了，伊朗，打还是不打？油价崩盘？ 黄金 白银会受影响么？崩盘还是大涨？ 那就先写这篇。 观点： 1）消息是用来佐证你的操作的，而不是指导你的操作的。 2）目前这个阶段，原油会是黄金 白银的催命索。 1】关于原油，总统和战争。消息是用来佐证你的操作的，而不是指导你的操作的。 原油我认为讲得够多了，但好多人问原油，那就再强调一遍（20260802）。 详细的内容在上午发的专栏文", "url": "https://www.zhihu.com/question/631198892/answer/2067324735394992194", "votes": 90, "comments": 76, "feed_ts": 1785668626, "feed_time_str": "08-02 19:03", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "美联储会议后，美股和黄金的市场逻辑发生何种变化？这周发财报的四巨头：微软、亚马逊、苹果、Meta的趋势如何？", "excerpt": "本周的美联储FOMC会议，沃什的态度变了，他主动说债市自发的长债收益率上涨，帮他干了紧缩的活，黄金的市场逻辑可能会产生怎样的变化？这周四大科技巨头发布财报，又会对它们产生怎样的影响？后市可能会怎么走？ 这次会之后，期限溢价持续往上走，这让美元贬值的进程又往前推进了一步。 为什么说期限溢价上涨，可能会启动美元贬 b_cn": "发布了想法", "title": "很多人问，韩国这一轮去杠杆结束了没有。我直接说结论：杠杆从来没有那么容易一次性出清，如果去杠杆简简单单就能完成，市场也就不会有这么多反复折磨人的行情。我跟大家讲清楚真正彻底去杠杆该是什么样。真正下决心清理杠杆，最硬核的手段不是慢慢被动下跌，而是直接把高杠杆产品、违规融资渠道全部下架，从源头切断资金。但韩国很难走这条路，这里有一个关键区别，可以对比我们当年15年的去杠杆。当年我们清理场外配资，资金流通体系闭环在境内，监管可以直接切断通道、一刀切封堵违规资金。但韩国不一样，韩元自由兑换、资本市场对外开放。监管顶多只能要求场内投资者追加保证金，没法完全堵死漏洞。散户完全可以通过海外渠道，变相再加杠杆，监管很难全域管控。这就解释盘面为什么大跌之后很快会出现反弹。现在盘面就能看得很清楚，依旧有不少投资者看见反弹就冲进去做多博弈反转。结合我这么多年观察杠杆行情的经验，规律一直没变：一轮巨大的杠杆牛市，真正在最顶部直接爆仓亏光的人，其实不算最多。伤亡最惨重的，永远是下跌途中不断抄底、博弈反弹的这批人。这类高杠杆泡沫破裂之后，行情通常会来回反复出现两三次诱多反弹，不断吸引抄底资金入场。反弹看起来很暴力，一阳改三观，但本质实际是分批清算杠杆资金的缓冲窗口。一般来讲，等到散户增量资金彻底耗尽，不再有新资金进场博弈，才会迎来真正彻底的去杠杆。等到最后一批抄底资金弹药全部耗尽，才会迎来最终一轮集中下杀，完成杠杆的大面积出清。从这个规律看，韩国去杠杆下跌才刚刚开始。#我的熊市生存法则 ", "excerpt": "很多人问，韩国这一轮去杠杆结束了没有。我直接说结论：杠杆从来没有那么容易一次性出清，如果去杠杆简简单单就能完成，市场也就不会有这么多反复折磨人的行情。我跟大家讲清楚真正彻底去杠杆该是什么样。真正下决心清理杠杆，最硬核的手段不是慢慢被动下跌，而是直接把高杠杆产品、违规融资渠道全部下架，从源头切断资金。但韩国很难走这条路，这里有一个关键区别，可以对比我们当年15年的去杠杆。当年我们清理场外配资，资金流", "url": "https://www.zhihu.com/pin/2067279541400352002", "votes": 0, "comments": 15, "feed_ts": 1785657879, "feed_time_str": "08-02 16:04", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "韩国股市 38 天跌掉韩国一年 GDP，韩股「去杠杆」结束了吗？这场杠杆风暴给全球散户带来哪些警示？", "excerpt": "很多人问，韩国这一轮去杠杆结束了没有。 我直接说结论： 杠杆从来没有那么容易一次性出清，如果去杠杆简简单单就能完成，市场也就不会有这么多反复折磨人的行情。 我跟大家讲清楚真正彻底去杠杆该是什么样。 真正下决心清理杠杆，最硬核的手段不是慢慢被动下跌，而是直接把高杠杆产品、违规融资渠道全部下架，从源头切断资金。 但韩国很难走这条路，这里有一个关键区别，可以对比我们当年15年的去杠杆。 当年我们清理场外", "url": "https://www.zhihu.com/question/2066920268627547112/answer/2067279438874775609", "votes": 97, "comments": 8, "feed_ts": 1785657827, "feed_time_str": "08-02 16:03", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "黄胖胖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "五角大楼耗巨资建弹药厂两年未产一炮弹，这背后反映了哪些问题？", "excerpt": "这个事情非常抽象，不是从业人员想要不到美国去工业化已经到了什么地步了 首先155榴弹炮弹这东西并没有想象中那么“先进”，只要不是所谓制导炮弹和末敏弹，常规炮弹和火箭增程弹的结构跟100年前的重炮几乎没有结构性上的区别 火炮技术进步的重点权重在炮管那一块，更粗更长更精密更稳定的炮管，才是提升火炮射程与精度的关键因素 当然不是说炮弹没有升级，只是炮弹升级主要是在研发设计那一块，就生产端来说毫不客气的讲", "url": "https://www.zhihu.com/question/2060 几天，国际足联宣布，要成立一个子公司FIFA Forward Enterprise（FFE，现在中文大部分翻译成“国际足联前进企业”）。 这个子公司负责整合国际足联的转播、赞助、票务和特许经营等商业权益与赛事运营。 据说，初始估值200亿美", "url": "https://zhuanlan.zhihu.com/p/2067247919745478966", "votes": 1, "comments": 1, "feed_ts": 1785650604, "feed_time_str": "08-02 14:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "607846", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "携程被罚51亿真正根源是什么？", "excerpt": "表层是行为，根源是结构。 1. 市场结构：对手全被收编，制衡消失。 携程在在线酒店预订市场份额常年53%~59% ，更关键的是——去哪儿是它2015年收来的全资子公司，同程、途牛、艺龙它都入了股 。这意味着酒店老板&#34;换个平台&#34;的选择权是假的，换到哪都是携程系。这是垄断能成立的物理基础，也是阿里（有京东拼多多）、美团（有饿了么）都不具备的封闭度。 2. 生态失衡：矛盾在2025年到了", "url": "https://www.zhihu.com/question/2064291872126793563/answer/2067241325360157951", "votes": 2, "comments": 2, "feed_ts": 1785648740, "feed_time_str": "08-02 13:32", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "朝花夕拾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价小米澎程 N90 Max 预售价29.99万元、N70 Max 预售价25.99万元？", "excerpt": "小米su7之所以能爆火，靠的是小米的热度，靠的是su7只有一款车，更容易做到焦点集中。 一款车月销两三万台，确实不少，但是中国人基数大，只要一小部分人，抱着追赶潮流或者当玩具的心态买账，小米汽车的销量就有保障了。 但是，这种热度是有保质期的，时间久了，热度很容易就下来了。 小米这时候搞增程车，虽然可以给市场带来一点新东西，但新鲜劲过了，小米汽车本身也不比其他车企更出彩，就容易出现越打鸡血反而后继乏", "url": "https://www.zhihu.com/question/2066257961672864074/answer/2067241130501072315", "votes": 0, "comments": 2, "feed_ts": 1785648693, "feed_time_str": "08-02 13:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "美军的PX，专供美军和文职及其家属消费的商店，不面向当地市场，只能用“红美元”进行消费，里面的商品不被视做进口商品免征关税和手续费，因此价格低廉质量极佳，成了南越黑市市场的货源地。举个例子：1970年，一瓶威士忌在西贡市场上为1000盾，而在PX商店内的售价为4至5美元，折合600盾。一台9英寸电视机，市场价为15000盾，PX商店内的价格是60美元，折合仅7000盾；一台普通款佳能相机仅售25美元，即3000越南盾，在露天市场最低也能卖到5000越南盾，而普通商店的售价却要高达6000越南盾。正因为PX里的商品既便宜又好，美军士兵不仅买来自己用。他们还通过各种渠道将那里的商品走私到外部市场。其中最常见的渠道包括：- 美军士兵在PX购买商品后转卖到外面，所得的越南盾甚至比兑换美元还要多。-那些嫁给美国人或嫁给韩国、菲律宾等盟国军队官兵的越南女性，通常是PX商品走私的渠道。她们不仅利用丈夫的薪水，还从黑市上收购“红美元”，用以购买PX商品，再转售到市场上。她们正是南方市场上最优质、最活跃的商品供应商。- 随着PX商店的设立，为美军提供服务和销售商品的人员也乐于接受“红美元”，尽管这种货币无法直接在市场上消费。随后，他们又委托美军士兵代为购买各种物品……以此将“红美元”转化为商品，再将商品兑换成越南盾。总体而言，PX商品体系对南方经济产生了怎样的影响？- 首先，它为南方提供了大量质量上乘、价格低廉的外国商品。民众无需动用政府的外汇，也无需通过进口商，就能购买到这些商品。这一因素在一定程度上缓解了南越的通货膨胀压力。否则，失控的通货膨胀率将会高出许多。- 它为近50万美军及盟军士兵提供了一定程度的慰藉，毕竟他们正身处一个必须进行一场极其艰苦的战争的国家。- 这有助于提升美军及盟军士兵在越南社会中的经济吸引力。结识一名美军士兵、嫁给一名美军军人，立刻就能获得一笔可观的利益。因此，在美军大量驻扎的西贡时期，平均每7桩婚姻中就有1桩是越美通婚。- 美国以低价出售商品，却并未蒙受任何损失。美国政府并未吃亏。美军没有损失。美国工业家也没有损失。因为生产-流通-消费的循环已经形成闭环。运往驻在国的商品可享受免税待遇。政府以“红美元”的形式足额向美军支付薪资，这些美元可按免税价格（Duty free）购买商品。美国工业家也能售出商品。", "excerpt": "美军的PX，专供美军和文职及其家属消费的商店，不面向当地市场，只能用“红美元”进行消费，里面的商品不被视做进口商品免征关税和手续费，因此价格低廉质量极佳，成了南越黑市市场的货源地。举个例子：1970年，一瓶威士忌在西贡市场上为1000盾，而在PX商店内的售价为4至5美元，折合600盾。一台9英寸电视机，市场价为15000盾，PX商店内的价格是60美元，折合仅7000盾；一台普通款佳能相机仅售25美", "url": "https://www.zhihu.com/pin/2067231841115968849", "votes": 0, "comments": 5, "feed_ts": 1785648163, "feed_time_str": "08-02 13:22", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "alex01", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "alex01为什么会被人成为A神？", "excerpt": "真热闹啊，能为了几句推荐和观点直接吵起来，何必呢，人输出些自己的观点而已嘛。且不说之前alex01是有直接说方向的，就算现在说的要么涨，要么跌，又不是不能靠这个赚钱，只要说的准就行啊。 问题是准吗？有给时间段吗？有给大概的波动率吗？我有点忘了。 我给你们对线的机会。 黄金AU2609的期权，还有24天到期，不是跌就是涨，那期权双买呗。我把策略给你们。去吧，赚了记得回来告诉我们。 你要是只看一个方向", "url": "https://www.zhihu.com/question/2066282636784440803/answer/2066950066401810375", "votes": 4, "comments": 0, "feed_ts": 1785647515, "feed_time_str": "08-02 13:11", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "温伯陵", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "朱棣与杨广都是连年征战外敌，为什么朱强大了明朝，而杨败了隋朝?", "excerpt": "这还扯啥打仗呀。 我说一个他俩干过最相似的事儿：建都。 杨广修建东都洛阳，一共花了十个月。 朱棣修建北京紫禁城，一共花了十四年。 聪明人都能看懂了吧？ 对比一下，广子的效率是真的高。 但在兴建工程主要靠人力的古代，你效率高的前提，可不就是把人当牲口用么？ 按《隋书》记载，为了修建东都，光是每月服役的男丁，就多达两百万人。 炀帝即位，是时户口益多，府库盈溢，乃除妇人及奴婢部曲之课。男子以二十二成丁，", "url": "https://www.zhihu.com/question/4623785996/answer/74092300040", "votes": 11597, "comments": 1250, "feed_ts": 1785647067, "feed_time_str": "08-02 13:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", " const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

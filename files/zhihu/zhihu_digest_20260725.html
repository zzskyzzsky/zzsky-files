"更多机器人演示、技术细节和代码更新可见项目主页与技术报告。 项目主页：horizonrobotics.github.io/EmbodiedGen技术报告：arxiv.org/abs/2607.07459开源代码：github.com/HorizonRobotics/EmbodiedGen生成式3D大模型正在快速提升物体与场景的视觉质量，但具身策略模型学习对生成场景提出了更严格的要求。机器人所需的是", "url": "https://zhuanlan.zhihu.com/p/2064016617919588067", "votes": 7, "comments": 5, "feed_ts": 1784887214, "feed_time_str": "07-24 18:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "刘聪NLP", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "Kimi 新模型 K3 登顶多榜，其技术亮点和突破主要体现在哪些方面？", "excerpt": "Kimi K3这几天的势头也太猛了吧，国内外基本都是一致好评，更有甚者，说中国落后6个月的时代结束了。 Kimi K3发布在WAIC前夜，我是真想测呀，时间是真不够，群友也是在一顿催我。 回家之后，立马开启测试，要把没测的模型都要补回来，还有Qwen3.8、Gemimi3.6. 说一个整体体验的结论，K3确实已经有Claude Opus 4.8这个级别的能力。在国产模型里，目前绝对是Top 1，前", "url": "https://www.zhihu.com/question/2063164315876733430/answer/2064046255492355923", "votes": 5, "comments": 0, "feed_ts": 1784886976, "feed_time_str": "07-24 17:56", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "我其实说个点好了…其实长鑫不太可能是当时的中石油，因为这背后已经是一套比较成熟的收割手法了。但是具体我没法发在公开平台上，毕竟我还想接点商单…这样写是真没法接了。", "excerpt": "我其实说个点好了…其实长鑫不太可能是当时的中石油，因为这背后已经是一套比较成熟的收割手法了。但是具体我没法发在公开平台上，毕竟我还想接点商单…这样写是真没法接了。", "url": "https://www.zhihu.com/pin/2064041156619641655", "votes": 0, "comments": 44, "feed_ts": 1784886747, "feed_time_str": "07-24 17:52", "category": "pin", "cat_name": "想法动态"}, {"actor": "李睿", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "移植 LLM Serving Runtime，不只是把 cuda 改成 npu", "excerpt": "问题：既然 PyTorch 已经抽象出了 torch.device，那我们只需要全局搜索将 &#34;cuda&#34; 替换为 &#34;npu&#34; 或 &#34;xpu&#34;，再把底层算子库换掉，系统不就能跑起来了吗？ 回答：只做简单的字符串替换，那么迎接我们的并不是首包延迟（TTFT）指标，而是各种诡异的进程卡死、显存踩踏、C2C/P2P 通信死锁，甚至是进程启动即崩溃大模型推理 ", "url": "https://zhuanlan.zhihu.com/p/2064033574899169074", "votes": 1, "comments": 0, "feed_ts": 1784886499, "feed_time_str": "07-24 17:48", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "刚拿到菲尔兹奖，他现场宣布加入 ": "AI · 技术 · 算法"}, {"actor": "知乎市场", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "我们认识的邓煜，不止于一个数学家", "excerpt": "北京时间 7 月 23 日，2026 年国际数学家大会在美国费城开幕，王虹、邓煜 @Yu Deng 获得菲尔兹奖。 这也是中国人首次获得菲尔兹奖。 恭喜王虹、邓煜！菲尔兹奖（Fields Medal）是数学领域的国际最高奖项之一，被誉为「数学界的诺贝尔奖」。它是一项授予40岁以下杰出数学家的国际性奖项，旨在表彰他们已有的卓越成就并激励其未来的研究潜力。 因为其严格的年龄限制、极低的获奖频率和崇高的", "url": "https://zhuanlan.zhihu.com/p/2063998721814270568", "votes": 19, "comments": 0, "feed_ts": 1784885702, "feed_time_str": "07-24 17:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "蒋竺波", "verb": "MEMBER_COLLECT_ARTICLE", "verb_cn": "收藏了文章", "title": "一套完整交易体系搭建逻辑 —— 复盘我 2022 年创业板旧策略 从顶层哲学到量化风控、数据复盘，全流程拆解", "excerpt": "本文复盘的是我2022年针对创业板20%涨跌幅单独开发的一套支线策略，现已长期搁置。当年实盘多次连续亏损，存在大量时代漏洞，不构成任何投资建议。 全文价值在于展示一套交易策略从零搭建的完整逻辑——从顶层哲学到量化选股、趋势判定、风控过滤、动态调仓、止损止盈、大盘择时、数据复盘，九层闭环，缺一不可。 取名“星光”，源于我多年交易持续回撤的至暗阶段。市场大部分时间都是震荡损耗，但只要搭建标准化、有完整", "url": "https://zhuanlan.zhihu.com/p/2059654194638934396", "votes": 1, "comments": 0, "feed_ts": 1784885486, "feed_time_str": "07-24 17:31", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "在艾为电子工作是一种什么体验？", "excerpt": "艾为工作也有10年+，今年面试的一个模拟和我说：和你谈下来挺愉快的，也进一步了解了艾为，还是很期待加入的，但是你们知乎怎么那么多负面，你们不管管吗？这难道不会影响你们招人吗？ 我去看了看知乎帖子，真的有点大跌眼镜，想起来团队前段时间也有人和我说这个，当时不以为意，现在看来可能品宣部最近几年人少了，都没咋管这个，真的影响越来越差了 这么多年，可能公司在处理一些低绩效员工的时候少了点人情味，让一些前艾", "url": "https://www.zhihu.com/question/425655358/answer/2063366364312736652", "votes": 18, "comments": 23, "feed_ts": 1784885191, "feed_time_str": "07-24 17:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "hades", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "孙亚龙称 Bin 离队因『环境恶劣，输了就被放大镜找问题』，职业电竞选手为何面临如此高压？", "excerpt": "首先孙亚龙在尬洗，因为哪怕不玩游戏很久了，也看了那么多年比赛了，看得懂陈泽彬在ewc的行为意味着什么。msi陈泽彬的表现可以洗，确实可以说就是发挥不好，被打上头了，脑子瓦特了，大家喷两句菜或者膨胀，或者干干脆脆48一下，也就到此为止是最好的了。 但ewc是真的太过分了，如果只是前面第一局不先落位，第二局被单杀，其实也不至于最后搞成这样。两者都是他老毛病，可以概括成菜和心态不好，不是没有先例，也不会", "url": "https://www.zhihu.com/question/2063693222992417693 feed_ts": 1784874003, "feed_time_str": "07-24 14:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "巴列维王朝给伊朗留下了进步的火种吗？", "excerpt": "太可惜的巴列维，陵墓修了十几年，花了二十多亿美金。 太可怜的巴列维，一个波斯帝国成立2500年庆典花了gdp的5%。 太无辜的巴列维，1962年强制征收土地卖给农民，要求农民在15年内还清这些强迫摊派的土地价格和利息，年息20%上下。1967年巴列维二次颁发土改后续法案，让农民把土地全部卖给皇室和外国人有所有权“集体农庄”。 太被怀念的巴列维，一人口只有3700万的国家一天之内有600-900万人", "url": "https://www.zhihu.com/question/1100892839/answer/1920085441954181233", "votes": 3390, "comments": 352, "feed_ts": 1784872156, "feed_time_str": "07-24 13:49", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "夜静魂梦归", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "阿根廷、土耳其的货币汇率来回翻倍都没事，那日元的汇率仅仅只是从159到163，有什么好担心的？", "excerpt": "中午刚刚刷完“王师傅の日记”最新一期，在囚大的带领下，王师傅一行人深入柬埔寨农村，当地建筑也都是“一户建”，但区别在于都是高脚楼。 这种高脚楼在国内云贵桂地区也比较常见，为的就是防毒虫老鼠，越是自然环境恶劣的地方，高脚就会越高，甚至形成了人住楼上，牲畜住楼下的格局。现在已经很少有人住高脚楼了，哪怕青藏高原墨脱这样的偏远县城，地方政府给边民造的房子，也是地面全硬化基础设施完善的现代社区，无论是楼房…", "url": "https://www.zhihu.com/question/2063307707701105244/answer/2063982585206854556", "votes": 12, "comments": 5, "feed_ts": 1784871796, "feed_time_str": "07-24 13:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "阿根廷、土耳其的货币汇率来回翻倍都没事，那日元的汇率仅仅只是从159到163，有什么好担心的？", "excerpt": "因为阿根廷粮食自给率为230%，土耳其粮食自给率为97%，日本粮食自给率为38% 也就是说阿根廷人和土耳其人自己能够生产出足够自己吃的食物，而日本人不能进口食物的话直接就得爆发大规模饥荒 货币汇率的变化主要影响的是对外贸易，这意味着阿根廷人和土耳其人的货币汇率再怎么跳也不太影响吃饭，现在一部分人吃不上饭主要是因为分配问题，而不是没得吃 而日本的货币汇率要是出了问题，日本人是真要饿肚子的 阿根廷和土", "url": "https://www.zhihu.com/question/2063307707701105244/answer/2063594415143248343", "votes": 961, "comments": 90, "feed_ts": 1784871665, "feed_time_str": "07-24 13:41", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "田地,南爸安爸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "我们为什么要生孩子?", "excerpt": "在三四十岁的某一天，你会突然发现，生命中最好的事，都已经发生过了，剩下的只是重复和老去，一年年，一天天。 而孩子会冲走重复，让生活重新变得未知。他/她让你烦恼，让你牵挂，让你欢喜，让你惊讶，让你再经历一次童年，让你明白当年父母的心境，让你有理由买曾经求而不得的玩具，让你在痛苦时坚强，在危机中冷静，让你看到童年时的自己，看到他的勇敢，他的好奇，他的局促，他的不安，从而更好的理解自己，接受自己。 父母", "url": "https://www.zhihu.com/question/349923819/answer/1673047173", "votes": 120661, "comments": 7226, "feed_ts": 1784871453, "feed_time_str": "07-24 13:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "沧海无浪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "伊朗打了那么多阿拉伯国家，为什么阿拉伯国家不组成联军入侵伊朗？", "excerpt": "海湾王爷们上次组织大规模团建还是十年前的也门内战，当时沙特纠集海湾各国联军进入也门，结果被当地老农打了个狗吃屎，沙特的小萨勒曼一看战事不妙，头也不回就跑了，抛下阿联酋和一众小弟在那风中凌乱，阿联酋至今都在为此事耿耿于怀。 沙特有前科在此，你怎么让人相信你有这个能力和担当？ 对了，那个把海湾联军打成狗吃屎的也门势力名字叫——胡赛，伊朗扶持起来的小弟之一。 你连伊朗小弟都打不过，你还想跟伊朗叫板？省省", "url": "https://www.zhihu.com/question/2063167836797902909/answer/2063980584347743412", "votes": 1, "comments": 0, "feed_ts": 1784871318, "feed_time_str": "07-24 13:35", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "经人提醒，发现邓煜和王虹的学术“最近共同祖先”其实可以更近，希尔伯特和索末菲其实是师兄弟（闵可夫斯基也是他们的师兄弟），二者的老师都是Carl Louis Ferdinand von Lindemann（1852——1939），没记错的话应该是第一个证明圆周率是超越数的那位", "excerpt": "经人提醒，发现邓煜和王虹的学术“最近共同祖先”其实可以更近，希尔伯特和索末菲其实是师兄弟（闵可夫斯基也是他们的师兄弟），二者的老师都是Carl Louis Ferdinand von Lindemann（1852——1939），没记错的话应该是第一个证明圆周率是超越数的那位", "url": "https://www.zhihu.com/pin/2063835068569761219", "votes": 0, "comments": 3, "feed_ts": 1784870281, "feed_time_str": "07-24 13:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼,曹多鱼,曹多鱼,曹多鱼,梅东的狮子", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "长鑫科技上市时间敲定 7 月 27 日，哪些信息值得关注？你看好它的上市吗？", "excerpt": "然后我们今天正好借着长鑫的顶级巨型 IPO，跟大家完整把 A 股打新底层逻辑讲透。 先说结论啊： 长鑫这只新股，完全是可以正常参与打新，如果中签记住一件事就好了，上市冲高就可以兑现卖出，大概率是赚的。 资本市场第一生存准则是什么呢？ 就你做任何一笔交易，进场之前必须想清楚，你要赚的是市场里哪一方的钱，就像一桌牌局，如果你上桌前不知道赢谁的钱，那大概率你就是被赚钱的。 而A 股打新赚钱的核心，实际是", "url": "https://www.zhihu.com/question/2063730050579396490/answer/2063974599985979766", "votes": 420, "comments": 20, "feed_ts": 1784869892, "feed_time_str": "07-24 13:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心发布了视频", "verb": "MEMB 具体：语音对话可以使用聊天中可用的 Opus 和 Sonnet，也能在对话中途访问已连接工具，例如电子邮件和日历。新增西班牙语、法语、印地语和日语等语言后，这项更新从当天起在手机、桌面和网页端以公开 beta 推出，覆盖所有套餐。它解决的是“人在走路、开会或腾不出手时，怎么继续调用已有上下文”的问题。说话时，已连接的数据和工具也能进入同一段对话，这才是它实际增加的能力。官方没有给出准确率、延迟或工具执行成功率，因此不能据此判断它比其他语音助手更可靠。ChatGPT 把语音接进桌面工作流和 CodexOpenAI 的范围更偏桌面生产力：ChatGPT 语音已在 macOS 和 Windows 桌面应用全球推出，面向 Plus、Pro、Business、Edu 和 Enterprise。官方称 GPT-Live 可以一边说话、一边听，并协调应用中的工作；用户可用语音控制电脑、指导在 ChatGPT Work 或 Codex 中运行的多个 agent。场景是：用语音启动新任务、查看已有线程，并在 ChatGPT 与 Codex 之间交接工作。后续帖还提到 iOS 可通过配对远程访问，Android 支持仍在后面。它把口头指令带入多任务和 agent 工作流，这与普通语音问答拉开了使用方式上的差别。同一条赛道，产品重心并不相同Claude 更像把语音补到“带着个人工具继续对话”的入口；ChatGPT 更像把语音补到“在桌面上指挥工作和 Codex”的入口。两边的引用帖都在感叹发布时间太接近，但这只是社区反应，不能替代功能对比。实际挑选时，先看自己的任务：需要在聊天中调用已连接的邮箱、日历等工具，就看 Claude 的 beta 与连接器；需要在桌面端口述任务、让 Work/Codex 接手并在不同任务间切换，就看 ChatGPT 的付费计划和系统入口。两者都还没有在公开帖里给出复杂任务的成功率或稳定性数据，先按自己的工作流试一次，比只听“语音 agent 来了”更有用。", "excerpt": "Claude 和 ChatGPT 同日升级语音功能Claude 和 ChatGPT 同时发布语音更新。表面看都在做“能说话的 AI”，实际把语音接进了两条不同的工作流。Claude 把语音接进已有的工具和个人信息Claude 的官方 thread 写得很具体：语音对话可以使用聊天中可用的 Opus 和 Sonnet，也能在对话中途访问已连接工具，例如电子邮件和日历。新增西班牙语、法语、印地语和日语", "url": "https://www.zhihu.com/pin/2063973276527989480", "votes": 0, "comments": 0, "feed_ts": 1784869586, "feed_time_str": "07-24 13:06", "category": "pin", "cat_name": "想法动态"}, {"actor": "时予", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "带小孩真的很累吗，为什么女性带小孩总说很不容易？", "excerpt": "我老姑全家在十多天以前集体确诊甲流，这波病毒非常可怕，他们家鼎盛时期人均体温达到39°以上，在家中的活动范围内每人标配一床被子，走到哪被子就裹到哪，那场面跟cos伏地魔聚会差不多。 于是就有个问题，他们家还很新鲜的那个八个月的崽没有人带了。 崽也发烧了，烧到四十多度，但是人家有新手保护期，烧两天就好了。 但我老姑全家都疑似烧迷糊了，合计了一下，居然把崽给我和我爸这个光棍之家送来了，理由是我们家爷儿", "url": "https://www.zhihu.com/question/729596774/answer/2007116500037817213", "votes": 3720, "comments": 521, "feed_ts": 1784869488, "feed_time_str": "07-24 13:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰赞同了视频", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "特朗普在美国一所高中发表讲话，直播画面中身后一男生模仿其讲话表情夸张。 #美国  ", "excerpt": "特朗普在美国一所高中发表讲话，直播画面中身后一男生模仿其讲话表情夸张。 #美国  ", "url": "https://www.zhihu.com/pin/2063582685507883268", "votes": 0, "comments": 23, "feed_ts": 1784869276, "feed_time_str": "07-24 13:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "回收台湾半武统方案可行吗？", "excerpt": "台湾是个岛，岛民心态是怎么形成的？因为自然灾害太多，地震，海啸，台风来了都没地方躲，所以全世界岛民都很现实，都畏惧强权，畏惧不能超越的力量。你看日本，英国都如此。英国被法国强上了两回，同一个词只是口音不同，人家都能规规矩矩的记下来当两个词，万世使用。 所以既然要长治久安，你就雷霆万钧的打过去，不用担心什么老百姓接受不了，你唯一需要担心的就是强度不够让他们怕。你和平的方式他们才抱怨多接受不了，因为…", "url": "https://www.zhihu.com/question/2054889906938421872/answer/2063970988669383896", "votes": 18, "comments": 1, "feed_ts": 1784869031, "feed_time_str": "07-24 12:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价《唐山大地震》电影中母亲救儿子而放弃女儿的行为？", "excerpt": "儿子救出来残疾了，女儿没救活得好好的。所以对于这个问题你只能说编剧属实牛批。", "url": "https://www.zhihu.com/question/374263091/answer/1074292334", "votes": 671, "comments": 13, "feed_ts": 1784868846, "feed_time_str": "07-24 12:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "2026年7月，感觉乌克兰越打越强了，是错觉么？", "excerpt": "还挺有意思的，在吹乌克兰的问题下是喷乌克兰的人在团建，在吹俄罗斯的问题下是喷俄罗斯的人在团建。然后回答下又是对该回复的阴阳怪气。果然抬杠才是内容输出的原动力。", "url": "https://www.zhihu.com/question/2057962279535113089/answer/2058963902969411394", "votes": 63, "comments": 3, "feed_ts": 1784868493, "feed_time_str": "07-24 12:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TopView", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "克制", "excerpt": "今天全网都在刷梁文峰那场4小时的投资人会，3万多字的实录，确实有点东西。 先说背景，DeepSeek刚搞完第二轮融资，投前估值折合人民币4800亿左右，腾讯、宁德时代、网易、京东都掏钱了，梁文峰自己跟投了差不多200亿。公司已经在筹备科创板IPO，最快明年上。 这种体量的公司要上市，按惯例创始人应该在投资人面前画饼、吹增速、讲变现故事，对吧？ 但这哥们全篇都在讲克制。他说DeepSeek不追求利润", "url": "https://zhuanlan.zhihu.com/p/2063967723835627014", "votes": 95, "comments": 1, "feed_ts": 1784868340, "feed_time_str": "07-24 12:45", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "宝郁", "verb": "MEMBE 己的一些想法和大家聊一聊。肯定有很多错漏的地方，也请大家稍稍包涵。 我们就从最根本的地理", "url": "https://zhuanlan.zhihu.com/p/2063947747292603944", "votes": 17, "comments": 2, "feed_ts": 1784863517, "feed_time_str": "07-24 11:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "“崩老头”你们怎么看？", "excerpt": "那天，我qq里的职高精神小妹说自己找了个大叔，重点来了，她嘴里的大叔96年。听得我膝盖中了一箭，要不是见到这些更年轻的人，我还以为我是早晨八九点钟的太阳。。。", "url": "https://www.zhihu.com/question/1930715810474723187/answer/1984332198535508255", "votes": 15417, "comments": 375, "feed_ts": 1784863282, "feed_time_str": "07-24 11:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "面对纪委调查，是坦白还是抗拒？", "excerpt": "屌过纪委一次 22年疫情结束后我心脏病发入院 出院后23年刚上班被纪委拉问话 说我20年7月查到a餐店噪声超标为什么11月才出罚单 我说区局改市直管，那几个月处罚章都没下来怎么整 他问我为什么区局要改市直 特么的我一个三主都没的区级怎么知道 ", "url": "https://www.zhihu.com/question/658818249/answer/1899493794455478589", "votes": 3396, "comments": 45, "feed_ts": 1784862796, "feed_time_str": "07-24 11:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "夜静魂梦归", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "明明是孙权以诸侯礼厚葬关羽，为什么总有人喜欢说是曹操以诸侯礼厚葬关羽。?", "excerpt": "这个问题让我联想起追光动画最近票房暴死的《三国第一步：争洛阳》。 争洛阳的导演编剧水平咋样呢，不得不说还是有一点的，中间杀何进、诛蹇硕几个桥段，政治惊悚片氛围拉满，也是导演和编剧的这些小巧思，让看过的观众能为它打8分以上的分数。 但现代导演编剧吃亏的一点，就是没有舞台经验。 当年罗贯中们写《三国演义》的时候，相关小说蓝本，已经作为戏曲、评书，在舞台上传唱过了，罗贯中们肯定是经常出入这些场所的，舞台", "url": "https://www.zhihu.com/question/1905943510873507155/answer/2063942668355366938", "votes": 3, "comments": 0, "feed_ts": 1784862279, "feed_time_str": "07-24 11:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "面对纪委调查，是坦白还是抗拒？", "excerpt": "相信我，你斗不过纪委的。纪委留置的时候，基本上已经掌握足够的证据了。而且纪委是个政治机关，可不是什么法律执行机关。", "url": "https://www.zhihu.com/question/658818249/answer/3540044798", "votes": 9173, "comments": 532, "feed_ts": 1784861813, "feed_time_str": "07-24 10:56", "category": "other", "cat const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

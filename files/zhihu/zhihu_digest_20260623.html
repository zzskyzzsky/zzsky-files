推升，尤其对科技股泡沫提出警告，但事实上互联网产业泡沫直到2000年才最终破裂。格林斯潘后来也反思了这一做法，认为判断投资者是否过度乐观并非央行职责所在，并表示“我们无法做任何事情避免泡沫破裂，也许也不应该做任何事情来避免”。因为预测到美国生产率将大幅提升，从而抑制通胀压力，所以格林斯潘后来淡化了通胀威胁，前美联储主席鲍威尔曾赞之为“判断力有时能够胜过经济模型”的范例。其长时间维持利率稳定，促成了美国史上第二长的经济增长期。后来他更把通缩看的比通胀更严重，认为通缩环境下，物价下跌而工资保持“黏性”，会导致企业利润率大幅压缩，进而减少资本投资、放缓生产率增长，最终使经济陷入深层停滞。“9·11”恐袭后，为挽救陷入衰退的美国经济，格林斯潘将关键利率一降再降，最终达到1%这一前所未有的水平，从而也为后来的量化宽松政策打开了潘多拉之盒。除了货币政策，格林斯潘也推动美联储与市场的沟通模式转型。在其任内频繁公开发表谈话、公布美联储会议内容，并定期召开新闻发布会，提高决策透明度，也让美联储主席这一习惯隐藏在幕后的角色，逐渐成为市场高度关注的公众人物。“格林斯潘的公文包”一度成为市场指标之一：CNBC电视台曾透露说，每当美联储开会时，他们会派两个摄制组守门，一台摄像机拍摄格林斯潘的言谈举止，另一台则专门拍摄他的公文包——单薄的公文包意味着利率不会调整，而鼓鼓囊囊的公文包往往预示着“有话要说”。为了不让自己被看透，格林斯潘说话开始云山雾罩，语意暧昧、模棱两可。据他自己后来坦白：“我花了不少时间努力回避问题，因为我担心自己说话过于直白。最后，我终于学会了‘美联储式语言’，学会了含糊其辞。”据说因为这种说话习惯，导致他三次求婚失败，直到1996年圣诞节才让自己的长期交往对象、美国国家广播公司高级女记者安德拉·米切尔明白了自己的心意，次年4月71岁的格林斯潘与50岁的米切尔步入婚姻殿堂。格林斯潘2006年退休时被视为是史上“最伟大的美联储主席”，也可能是有史以来最好的央行行长。学界业界称誉其为“大师”（The Maestro）。但其任内酿下的超低利率与极简监管的苦酒最后演变成2008年全球金融危机，这对他的声誉构成致命打击。2008年格林斯潘前往国会作证时坦承，自己对金融市场的操守与自我修正能力太过笃信：“包括我在内，那些相信放贷机构会出于自身利益保护股东权益的人，如今都处于震惊和难以置信的状态。”退休后格林斯潘开了一家顾问公司，并出版了回忆录《动荡时代》。他生前曾获法国荣誉军团勋章、英国荣誉骑士勋章（KBE），美国总统自由勋章。虽然是终身共和党人，但他与布什父子交恶，反而与民主党总统克林顿关系最好，甚至曾打趣地称其为“近代最好的共和党总统”。——死在10年、20年前，会视为巨星陨落；现在则只是喧嚣时代的一个小旁注了。#讣闻录", "excerpt": "格林斯潘去世前美联储主席格林斯潘因帕金森症在纽约家中去世，终年100岁。格林斯潘1926年出生于纽约，是家中独子，由离异的母亲抚养成人。少年时曾就读茱莉亚音乐学院，演奏萨克斯风与单簧管，之后改行在纽约大学取得经济学学士、硕士学位，并赴哥伦比亚大学深造，师从后来同样担任美联储主席的阿瑟·伯恩斯。1968年总统大选时曾任尼克松的国内政策研究主任，并在尼克松当选后担任其兼职顾问，1974年升任总统经济顾", "url": "https://www.zhihu.com/pin/2052593136174731513", "votes": 0, "comments": 2, "feed_ts": 1782164568, "feed_time_str": "06-23 05:42", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "alex01", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价知乎投资答主“Alex01”等一众投资答主？", "excerpt": "我也来回答一下这个问题吧。 我也是经历几个牛熊周期的老韭菜了，今年过完年计划重返金银赛道，因为不知道现在的趋势怎么玩，于是在知乎上关注了一众答主，A佬只是其中一个，作为一名老韭菜当然有自己的一套思路，一开始只花钱买了其中一篇专栏参考他的思路。直到二月末美伊开战的那个周末，我做空黄金，在一众人等着上看6000点的氛围下，发现他谨慎看待黄金回调，和我不谋而合，于是果断付费订阅，可以说也是他的文章给了我", "url": "https://www.zhihu.com/question/2049179860682257932/answer/2051994662383228149", "votes": 57, MBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Sakana Fugu：多agent编排系统Sakana AI 在 Fugu 发布文里反复强调一个问题：如果关键工作流全押在一家前沿模型上，API 访问、出口管制或供应商策略一变，业务连续性就会变得很脆弱。发布了一个思路完全不同的系统——Sakana Fugu。它本身是一个LLM，经过训练后能动态调度其他模型干活，包括递归调用自己的副本。你只面对一个API，Fugu在内部决定什么时候该调用哪个模型、怎么协调、怎么验证结果，这些多智能体的复杂性不会渗透到你的代码里。这才是这个发布真正的看点：Sakana 想卖的不是“又一个更强的单体模型”，而是一个把模型选择、委派、验证和综合藏在 API 背后的编排层。官方发布的测试结果中，有两个案例值得展开：第一个是自动化ML研究。团队给Fugu Ultra布置了一个任务：改进一个小型GPT模型的训练配方。在单张H100上跑了14小时，Fugu自行完成了超过100次实验，不断修改训练代码、跑测试、保留能降低验证错误率的改动。官方把Fugu Ultra和三个匿名化的前沿模型同场对比，并说明这些基线对应Gemini 3.1 Pro、Opus 4.8、GPT-5.5。结果是，Fugu Ultra拿到了最好的平均性能，单次最佳成绩也领先这些基线。第二个是金融时间序列预测实验。用50周历史数据模拟一只匿名股票的交易，起始资金10,000美元。Fugu Ultra每周根据价格、成交量、波动率等数据做出买入、持有或卖出的决策，下一周的价格才会揭晓。五轮同样条件的运行下来，Fugu Ultra把组合做到了11,943.22美元，平均回报率19.43%；对比的其他前沿模型都卡在15%以下。官方也写了免责声明：过去表现不保证未来结果，不构成投资建议。Fugu分两个版本。Fugu负责日常低延迟任务，适合嵌入Codex这类编程工具或者聊天服务，还能指定剔除不想用的智能体来满足数据合规要求。Fugu Ultra则针对高难度多步骤任务，协调更深层的专家池，早期用户主要拿来做AI研究、网络安全分析和专利调查。在接近500人的Beta测试中，官方转述的用户反馈集中在一点：Fugu在处理长程、杂乱、需要持续试错的真实工作流时，能探索思路、解读失败、调整方向继续推进。从数据科学研究到网络安全评估，官方都把这种“持续推进能力”作为重点卖点。对这个系统更稳妥的理解是：它未必是在造一个更强的底层模型，而是在把选择权和控制权上移到编排层。Fugu Ultra更像是训练出来的编排层，把多个前沿模型变成一支协调的智能体团队。AI能力的下一跳可能不光靠更大的基座模型，也靠更好的测试时编排。也有提出了不同看法，认为这本质上是闭源编排器叠加闭源模型，不是真正的&#34;AI主权&#34;。他指出Fugu的技术路线类似于路由器或分类器，在部分基准上相比Opus有得分下降，而Fugu Ultra的工作流机制需要提前规划所有步骤，限制了灵活性。这个批评方向提醒我们：编排层的价值取决于透明度——底层用了哪些模型、消耗了多少token和成本，目前官方在这些信息上披露得比较模糊。这次发布的真正启示或许不在模型参数本身。至少在官方给出的AutoResearch和金融时间序列案例里，Fugu Ultra展示的是“把多个模型组织起来做长任务”的能力。Fugu的可替换智能体池不包含受管制的Fable或Mythos，它在技术路径上给出了一个方向：不要把自己的关键工作流锁死在单一厂商上。今天可以用单一API接入，但它到底能不能真正把模型选择权交还给用户，还要看Sakana后续披露底层模型池、token成本和工作流透明度。", "excerpt": "Sakana Fugu：多agent编排系统Sakana AI 在 Fugu 发布文里反复强调一个问题：如果关键工作流全押在一家前沿模型上，API 访问、出口管制或供应商策略一变，业务连续性就会变得很脆弱。发布了一个思路完全不同的系统——Sakana Fugu。它本身是一个LLM，经过训练后能动态调度其他模型干活，包括递归调用自己的副本。你只面对一个API，Fugu在内部决定什么时候该调用哪个模型", "url": "https://www.zhihu.com/pin/2052566075368380299", "votes": 0, "comments": 0, "feed_ts": 1782149963, "feed_time_str": "06-23 01:39", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Tmax 9B在Terminal-Bench2.0超多个开源模型一个很直白的 RL 配方，把 9B 参数模型在 Terminal-Bench 2.0 上推到了一个挺靠前的位置：在论文报告的默认设置和较短 65k token 预算下，它超过了多项此前开源终端 Agent 工作。Hamish Ivison 等人发布了 Tmax，一个开源终端 Agent 训练方案。它的核心就两块：一套用 9 个轴采样合成的约 15k 条任务数据，和一个基本沿用 DPPO 思路、基于 open-instruct 异步机制的强化学习流程。基座模型选的是 Qwen 3.5 9B，最终在 Terminal-Bench 2.0 上拿到 27% 的分数。对比一下就知道这个成绩的分量。论文里的终端基准图显示，Tmax-9B 在该评测设置下超过了 Nemotron-14B、TerminalTraj-32B 等此前工作；论文也明确写到，Tmax 在 32B 参数以下模型里占据 Pareto 曲线优势。更准确地说，它不是“所有终端 Agent 里最强”，而是在 open data / open RL recipe 这个限定范围内，把小模型推到了很有竞争力的位置。数据合成方式很有参考价值。他们沿着难度、技能类型、指令复杂度等 9 个维度分层采样，让任务分布尽量均匀。结果就是，这批数据是终端任务数据集里最难的那一档——用 Gemini-3-Flash-Preview 测出来 pass@1 只有 42%，但数据集的领域平衡性远超此前那些把 60% 甚至 95% 数据量砸在单一领域（比如软件工程）的老方案。RL 训练部分基于 open-instruct 的异步框架，整体思路接近 DPPO。成果不只是终端操作变强。作者还报告说，这套 RL 训练出来的模型，在 SWE-Bench Verified 和 AIME 上也有提升。这至少说明，终端任务上的 RL 训练收益没有完全锁死在单一 harness 里。当然不是全程一帆风顺。论文真实记录了 RL 训练非常难稳定的问题，团队尝试了更大的分组规模等方法，但远没到完全解决的程度。这反而给后续研究留出了明确方向。论文、数据集、模型权重、训练过程中的 rollout 数据都已经公开。对做 Agent 或 RLHF 的开发者来说，它的价值不只是分数，而是给了一个可以复现实验、替换数据、继续调 RL 稳定性的起点。", "excerpt": "Tmax 9B在Terminal-Bench2.0超多个开源模型一个很直白的 RL 配方，把 9B 参数模型在 Terminal-Bench 2.0 上推到了一个挺靠前的位置：在论文报告的默认设置和较短 65k token 预算下，它超过了多项此前开源终端 Agent 工作。Hamish Ivison 等人发布了 Tmax，一个开源终端 Agent 训练方案。它的核心就两块：一套用 9 个轴采样合", "url": "https://www.zhihu.com/pin/2052564215987279405", "votes": 0, "comments": 0, "feed_ts": 1782149453, "feed_time_str": "06-23 01:30", "category": "pin", "cat_name": "想法动态"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "数学博士生 2 年研究被 AI 抢发，这种现象会越来越普遍吗？如何看待 AI 对数学研究的冲击？", "excerpt": "新闻学魅力时刻，用 AI 收尾变成了 AI 从头开始、完全自主证明。 而且这是一个几年前的老成果，现在翻出来是什么意思？AI 炒股媒体还能要点脸吗？这已经不是断章取义了，完全就是在胡说八道。 8 维空间球体填充问题的最优解证明，是人类数学家 Maryna Viazovska 在 2016 年单枪匹马、纯靠脑子证明出来的，并且凭此在 2022 年荣获了数学界的最高荣誉菲尔兹奖。 在数学界，这是一个已", "url": "https://www.zhihu.com/question/2052067691926484153/answer/2052564170399289815", "votes": 50, "comments": 3, "feed_ts": 1782149433, "feed_time_str": "06-23 01:30", "category": "ai", "cat_name": "AI 扩展型交换机产品组合；一些看法：1.  AI超节点的总线几大阵营，国外，一个是NVINK的封闭模式（包括nvlink fusion），一个是以太路线，还有UALINK路线。国内也有两大阵营，分别是华为UB模式，以及各大hyperscaler的以太路线。归纳起来，其实只有2大类，一类是一GPU高粘度的总线系，例如NVLINK，一类是以GPU外的传输、交换为竞争力的总线系，例如ESUN、UEC等，前者与GPU高粘度和性能带来遥遥领先的优势；但是后者作为开放系，就像Linux对比windows一样，产业链的各环节拉拉手一起构筑Open体系。2.  交换系里，博通和marvel两大类，由于缺乏GPU的加持，它们竞争思路，一方面做强交换能力，另外也洞察AI未来趋势，找GPU外总线的“第二总线”，例如DDR内存池化总线CXL、CPO类的能力、CXL类的内存控制器等“散件”，试图“外围”分一杯羹。3. 类似marvel，在AI芯片产业链里，做不了总线和GPU，那么一手抓传统交换，一手抓第二总线/卡位外围散件生态；其中，可以看到marvell收购案例中，比较重视内存池化的趋势性特性，这个趋势在我看来是非常关键的，由于大模型的稀疏访存特性以及DDR和HBM之间的多介质混合提升介质性价比的技术路线基本逻辑，DDR池化是未来AI的刚需。目前除了NVLINK、UB可以有比较成熟方案外，其他以太路线、UALINK路线都没有成熟的DDR池化的总线方案，未来都是非常依赖CXL这个体系，其实却是也能看到UALINK和CXL的一些“联盟”。", "excerpt": "从Marvel收购以及产品布局，1.  Celestial AI：Celestial AI（2025年12月宣布）：Marvell以最高55亿美元（约合32.5亿美元预付款）收购了这家光子互联初创公司。其核心是获取领先的“光子织物”（Photonic Fabric）平台，该技术利用光信号替代传统的铜线传输，大幅提升了长距离、大规模AI集群的带宽并降低了功耗，旨在解决AI算力的互连瓶颈；2. XCo", "url": "https://www.zhihu.com/pin/2052540380910990375", "votes": 0, "comments": 0, "feed_ts": 1782145151, "feed_time_str": "06-23 00:19", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果一门课程的作业可以用AI完成，这门课该不该取消？", "excerpt": "如果一个杠铃能被机器举起来，那么这个杠铃应不应该被丢掉？", "url": "https://www.zhihu.com/question/2045831566538924509/answer/2047327074369659096", "votes": 849, "comments": 7, "feed_ts": 1782145140, "feed_time_str": "06-23 00:19", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "原理我理解，但为什么diffusion model的效果超过别的生成模型呢？", "excerpt": "有关diffusion的实验事实带来的启发： 错误的启发1：应该押宝diffusion！押宝生成式AI！错误的启发2：SDE牛逼，我要死磕概率论正确的启发：构造序列松弛，是解决“极端稀疏目标命中问题”的有效方法生成问题差不多就是在一个 \\mathbb R^n 空间里拟合并采样一个极端稀疏的流形/分布。ddpm的做法是：选择不去一步映射到位，而是把映射抽象成一个在更松弛的空间内的序列逼近问题，然后拟", "url": "https://www.zhihu.com/question/628976929/answer/1984926229535674383", "votes": 747, "comments": 35, "feed_ts": 1782144896, "feed_time_str": "06-23 00:14", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "酱 0358564766106", "votes": 689, "comments": 93, "feed_ts": 1782104064, "feed_time_str": "06-22 12:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "向量数据库的天花板有多高？", "excerpt": "目前的向量数据库还根本谈不上完善，它正在疯狂迭代、甚至连底层架构标准都还在不断摇摆的青春期。 它的天花板既不是事务也不是传统的并发处理，而是高维空间几何计算与物理硬件资源之间的无解博弈。 要理解这个天花板，我们得先复盘一下这东西是怎么来的。 早些年我们在做电商推荐或者内容分发的时候，本质上就是在做向量召回。用户的历史行为、画像标签经过深度学习模型处理后，变成一串几百维的浮点数向量。商品或者图文视频", "url": "https://www.zhihu.com/question/583350153/answer/2052373596912219827", "votes": 8, "comments": 1, "feed_ts": 1782103997, "feed_time_str": "06-22 12:53", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "虽然Raja News以极端强硬派的喉舌著称，但迈赫迪·卡纳利扎德的描述和之前的媒体消息以及美伊方面的官方表态是能对上的。小哈当选最高领袖后，拒绝了外交部提出的对美谈判的初步提议，制订了十项条件作为谈判框架，其中不包括对核问题的谈判，这也就是伊朗在战争初期宣布的十点声明。在伊斯兰堡谈判中，由于伊朗谈判团队与美国方面进行了核问题谈判，违反了十点框架，小哈与谈判团队发生矛盾，伊朗代表团被紧急召回，谈判中止。之后官员们（应该是指佩医生、卡利巴夫、阿拉格奇等人）在与调解人交换信息后放弃了十点框架，转而支持外交部拿出的十四点提案后来成为伊斯兰堡备忘录。协议送交小哈审批后两周都没有得到答复，官员们一度讨论把这当做同意。最后在小哈致函最高国家安全委员会得到书面答复后，小哈才批准协议。这与小哈本人声明、川普过去称伊朗方面正在传递协议给小哈，有点慢，还有巴盖伊的协议正在审批可以对得上。如果描述属实，那么小哈本人自主决策和权威非常怀疑，官员们两度几乎抛开他自行其事，小哈宣称自己“保留意见”，但无法掩饰他最终被迫妥协接受了谈判团队的提案。 #伊朗  #美国  #战争  #中东  #外交 强硬派指责谈判团队无视最高领袖的反对意见", "excerpt": "虽然Raja News以极端强硬派的喉舌著称，但迈赫迪·卡纳利扎德的描述和之前的媒体消息以及美伊方面的官方表态是能对上的。小哈当选最高领袖后，拒绝了外交部提出的对美谈判的初步提议，制订了十项条件作为谈判框架，其中不包括对核问题的谈判，这也就是伊朗在战争初期宣布的十点声明。在伊斯兰堡谈判中，由于伊朗谈判团队与美国方面进行了核问题谈判，违反了十点框架，小哈与谈判团队发生矛盾，伊朗代表团被紧急召回，谈判", "url": "https://www.zhihu.com/pin/2052338710788699095", "votes": 0, "comments": 18, "feed_ts": 1782103870, "feed_time_str": "06-22 12:51", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "现在伊朗强硬派有自己的文官集团阴谋论了：他们怀疑佩泽什基安和加利巴夫合伙控制了小哈", "excerpt": "现在伊朗强硬派有自己的文官集团阴谋论了：他们怀疑佩泽什基安和加利巴夫合伙控制了小哈", "url": "https://www.zhihu.com/pin/2052371658816722689", "votes": 0, "comments": 11, "feed_ts": 1782103738, "feed_time_str": "06-22 12:48", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "深度学习一定程度上脱离了数学吗？", "excerpt": "完全没有脱离数学啊。 但你感受到的基于大算力暴力解决问题、依赖海量数据，也是真实的行业现状。这两者不矛盾。 现在的大模型确实存在利用暴力计算来弥补算法设计缺陷的倾向，而且这种模式在经济和物理层面上，已经开始逼近不可持续的边缘。 很多人觉得深度学习没有数学了，是因为他们对数学的理解还停留在解析解和凸优化上。 在十多年前我刚入行的时候，那时候流行的是支持向量机、主成分分析、逻辑回归这些传统机器学习算法", "url": "https://www.zhihu.com/question/609230832/answer/2052372240805711952", "votes": 11, "comments": 6, "feed_ts": 1782103674, "feed_time_str": "06-22 12:47", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "南爸安爸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "想看一看你们拍的有趣的照片?", "excerpt": "女婴，女孩，女学生，妈妈，奶奶。 ", "url": "https://www.zhihu.com/question/662296075/answer/112921859894", "votes": 21529, "comments": 218, "feed_ts": 1782103613, "feed_time_str": "06-22 12:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你遇到过什么震惊的事？", "excerpt": "就前几天。 去到一家广告公司。 需要模特拍产品。 腿模。 要求： 必须是腿白，光洁，修长，且有一定肉感。 广告公司立马在平板电脑上介绍起了候选人。 一堆大男人。 有几个还是大胡子。 我们盯着对方…… “腿模，腿模，我们需要的是腿模，不是糙汉。” 广告公司看着我们，一脸不懂行别瞎逼逼的语气： “市面上所有只拍腿的模特，全是男的……” …… 老子当时震惊得嘴十分钟都没合上。 —————— 补充点后续。", "url": "https://www.zhihu.com/question/658990791/answer/2051376168000083229", "votes": 3321, "comments": 326, "feed_ts": 1782103299, "feed_time_str": "06-22 12:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "旷野", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何解读微软FastContext代码Agent论文？", "excerpt": "FastContext做的是把在仓库里找路这件一直被塞在主模型上下文里的脏活从整个Agent 的流程里抠出来做成了一个可以单独训练,评估的模块。代码 Agent，玩法是一个模型从头干到尾。来个 issue，先 grep、glob、读几个文件，揣摩 bug 大概在哪，然后才开始改代码、跑测试、提 patch。问题出在前面这一大段”找东西”上——它全都堆在同一个对话上下文里。 微软先把 GPT-5.4", "url": "https://www.zhihu.com/question/2052242968686376655/answer/2052369604215829046", "votes": 12, "comments": 0, "feed_ts": 1782103045, "feed_time_str": "06-22 12:37", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "申宏宇", "verb": "MEMBER  0, "feed_ts": 1782100919, "feed_time_str": "06-22 12:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "「机器学习之父」Jordan：Hinton等「思想领袖们」正在伤害年轻一代", "excerpt": "机器之心编译。 如果要评选过去半个世纪对人工智能影响最深的学者，Michael I. Jordan 几乎无法被绕开。 2016 年，《科学》杂志将他列为「全球最具影响力的计算机科学家」。他是统计机器学习领域的奠基人之一，在图模型、变分推断、贝叶斯非参数方法等核心方向上留下了大量引用极高的基础性工作。他目前是加州大学伯克利分校电气工程与计算机科学系、统计系双聘的杰出教授，同时在法国 Inria 巴黎", "url": "https://zhuanlan.zhihu.com/p/2052360473492960974", "votes": 42, "comments": 5, "feed_ts": 1782100917, "feed_time_str": "06-22 12:01", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "靠零食和黑客松，能重振Meta士气吗？", "excerpt": "编辑｜杨文 最近，Meta 内部军心不稳。 上周，一名员工在内部直播中突然爆粗口，怒骂某 AI 高管「混蛋」。 没过几天，扎克伯格又提议，要在 7 月举办一场全公司 AI 黑客马拉松。结果员工不买账，内部留言区一片嘘声。 有媒体直接以《马克・扎克伯格在残酷裁员后命令员工们重新找回工作乐趣》为题，讽刺 Meta 管理层的荒诞操作。 到了周一，Meta 首席技术官 Andrew Bosworth 也站", "url": "https://zhuanlan.zhihu.com/p/2052360272719917129", "votes": 6, "comments": 3, "feed_ts": 1782100854, "feed_time_str": "06-22 12:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "正解局", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "为AI芯片“续命”，中国人造钻石等来了大机会", "excerpt": "AI带火了内存芯片，上游的氦气、特种金属、变压器等也跟着涨价了。 没想到的是，连人造金刚石（人造钻石）价格也被AI拉了起来。 今年上半年，金刚石行业超过八成的企业都发布了涨价函。 看起来“风马牛不相及”的金刚石，对AI有多重要？ AI芯片，要靠中国技术“续命”？ 今年3月，英伟达在年度开发者大会上官宣，下一代GPU使用Vera Rubin平台，单芯片功耗突破2300W，热流密度超过1000W/cm", "url": "https://zhuanlan.zhihu.com/p/2052345683173233575", "votes": 9, "comments": 0, "feed_ts": 1782099833, "feed_time_str": "06-22 11:43", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "手刀", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "项羽当年为什么非杀义帝不可？他真的有史书上写的那么蠢吗？", "excerpt": "其实可能比史书写的还要蠢。 项家是楚国将门，当年就是在江左养马习武的。项梁起兵说是八千江东子弟，不管是不是都是忠于项家人。但很重要的一点就是他们是流寇性质的军队。没有行政体系支撑后勤。 这是拥立楚怀王的基础。他们需要一个有合法性的行政体系在汲取地方资源去给养军需和扩大兵源。 你说项羽杀怀王有没有足够的理由？当然有。 项梁死后，项羽实质上被架空了。宋义是代表王政体系接管了最高指挥权。杀宋义，他能找各", "url": "https://www.zhihu.com/questi 11:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "林一五", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "美国世界杯的伊朗难题", "excerpt": "随便聊聊。 刚刚结束的2026美加墨世界杯小组赛G组第二轮比利时对阵伊朗的比赛，双方最终以0:0战平。面对“红魔”比利时，伊朗足球队也取得了一场“不输就是赢”的比赛。 这次伊朗足球队赴美参加世界杯，在舆论上给美国造成了相当大的压力。 早在开赛之前，特朗普就不断地威胁伊朗方面，“建议”伊朗男足弃权，还假惺惺地说“是为了伊朗球员的安全考虑”。 伊朗男足没有答应，于是美国政府就着手从签证和住宿等问题上刁", "url": "https://zhuanlan.zhihu.com/p/2052352109069259804", "votes": 20, "comments": 0, "feed_ts": 1782098949, "feed_time_str": "06-22 11:29", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "业绩增长放缓，机器人概念消退，九号公司还能赢得投资者信赖吗？", "excerpt": "导语：如果九号公司只是在电动两轮市场陷入与雅迪、爱玛等传统竞争对手的苦战，那么其在资本市场就很难再重新赢得投资者的信赖。 李平/作者 砺石商业评论/出品 1 四季度业绩变脸遭问询九号公司一度凭借业绩高增长与机器人概念，吸引了大量投资者的关注。但其最近一年的资本市场表现颇让投资者失望，股价从去年76.58元/股的高点跌落下跌到现在的不足35元/股，整体市值跌入一半之多。 6月15日晚间，九号公司披露", "url": "https://zhuanlan.zhihu.com/p/2052348172647786118", "votes": 0, "comments": 0, "feed_ts": 1782098655, "feed_time_str": "06-22 11:24", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "在ai盛行的时代，一个软件工程专业的本科生该如何规划自己的大学四年？", "excerpt": "大部分人在大一的时候还在沉迷游戏或者搞社团，你能思考专业和行业的脱节问题已经很好了。 但是你千万不要觉得，既然AI可以写代码，就可以把学校里的底层课程全放掉，去追顶层技能。这个想法很危险。 人工智能消灭的是代码打字员，也就是那些只懂语法规则但是不懂计算机系统本质的人。在这个时代，软件工程专业不仅没有被削弱，反而对从业者的要求被拔高到了一个前所未有的程度。你必须懂底层，懂架构，懂业务，唯独不需要把时", "url": "https://www.zhihu.com/question/1992755606508028276/answer/2052349033679791618", "votes": 15, "comments": 1, "feed_ts": 1782098141, "feed_time_str": "06-22 11:15", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么女性地位不断提升的今天，性别对立问题却越发尖锐？", "excerpt": "滴滴出了一个“可选女司机”功能。 功能一推出，立马有女博主把它夸上天了，说真的是女性福音啊，选了女司机功能以后，来接你的就是一位女性专属司机了。 真的是太贴心了，这样女性乘客和女性司机的安全都能够得到有效保障了，大晚上打车都感觉安全多了。 博主说：“女司机不再是一个内涵女性司机词汇，而是专业细心、驾驶平稳的代名词。” 除了这种直接夸的，还有各种短剧暗地里夸，说女司机情绪稳定，没有路怒症，女司机为了", "url": "https://www.zhihu.com/question/1930276165035233464/answer/2052348450566563663", "votes": 1282, "comments": 111, "feed_ts": 1782098002, "feed_time_str": "06-22 11:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "朋友说他准备给刚买的这只小黑猫起名叫石枫，我觉得挺好的。此猫两个月大。来家里第一天还很拘谨地躲在床底下呜呜叫，第二天就开始到处上蹿下跳，活跃如极左分子。但就是不爱吃东西，挺奇怪的。", "excerpt": "朋友说他准备给刚买的这只小黑猫起名叫石枫，我觉得挺好的。此猫两个月大。来家里第一天还很拘谨地躲在床底下呜呜叫，第二天就开始到处上蹿下跳，活跃如极左分子。但就是不爱吃东西，挺奇怪的。", "url": "https://www.zhihu.com/pin/2052344252470932997", "votes": 0, "comments": 22, "feed_ts": 1782097478, "feed_time_str": "06-22 11:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "英国候任首相「安迪.伯纳姆」称要借助「国有经济」实现「共同富裕」，对此你怎么看？", "excerpt": "不看好伯纳姆执政前景。任何英国政治家，我坚持如下审视态度：看他对英国国家养老金三重锁定（Triple Lock）的态度。如果支持三重锁定、增加退休人士福利，搞luxury boomer communism婴儿潮世代豪华共产主义，其他所有政策不用管了，直接pass掉，就是不行。 伯纳姆的纲领不仅保留三重锁定，还要给老年人减税[1][2]。养老金增加、税源减少，靠什么补窟窿？谈国有化、平等经济、富人收", "url": "https://www.zhihu.com/question/2051405228281442735/answer/2052345785820378868", "votes": 799, "comments": 189, "feed_ts": 1782097367, "feed_time_str": "06-22 11:02", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "alex01", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价知乎投资答主“Alex01”等一众投资答主？", "excerpt": "别人我不知道，alex01挺好的，有免费文章可以看，自愿付费看专栏也可以，她的投资风格挺适合我的，肯定有觉得不适合的朋友，自己斟酌就行了 再补充一下，我是一月订的专栏，那时订阅人数才三百多人吧，我从一月看到现在，我是新手，真的学到了不少东西，也赚了一点钱，远远超过那几百块订阅费了，个人感觉她还是非常细心的，风格偏保守谨慎，会及时提示风险，到了买点也会直接说，并没有模棱两可，可能她的文章比较长，很多", "url": "https://www.zhihu.com/question/2049179860682257932/answer/2052318978505184843", "votes": 11, "comments": 0, "feed_ts": 1782096837, "feed_time_str": "06-22 10:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么网上吹起了反对《新概念英语》的风？", "excerpt": "小学的时候，被我爸逼着背新概念，不但是背，而且是一句一句模仿发音，模仿到语气起伏必须完全一致。 到初三的时候，背完了新概念第三册。第四册至今只读了一半，没背过。 然后上了高中。然后……我这辈子就没学过英语了，没听过英语课，没刷过一道英语题目，高考145，大一裸考六级628。 然后就是进入到读文献、开会、展示、写文章这些应用当中了，依然是原有的英语底子+一些专业词汇，就足够了。感觉英语用起来不像外语", "url": "https://www.zhihu.com/question/518200405/answer/1889086257772070243", "votes": 16068, "comments": 970, "feed_ts": 1782096603, "feed_time_str": "06-22 10:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "伊朗为什么越打越硬？", "excerpt": "客观上赶上好时候了，各种制导武器比较廉价，而海湾对面的高价值目标非常多，多到根本防守不过来。 主观上，当然和这么多年深挖洞，广造弹的努力有关。 美国打伊拉克时，伊拉克的飞毛腿导弹都是零敲碎打出来，估计是没什么地下掩体。但实际上还是展现了一点威力，后来我们知道，爱国者导弹其实拦截率很低。 现在时代变了，所有国家都必须面对制导武器门槛大降的问题，传统防空防不住的局面，还不是技术不行，就是成本不行。现在", "url": "https://www.zhihu.com/question/2050697665118201437/answer/2051948245874746914", "votes": 717, "comments": 87, "feed_ts": 1782096336, "feed_time_str": "06-22 10:45", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "是什么让你这么向往西藏？", "excerpt": "因为现代化西藏是我一手一脚建起来的，虽然我只是建设大军中的一员，但你今天看到的西藏有我的血汗，所以我向往，现在也向往。 我守过边防线。 我挖过兰西拉光缆的光缆沟。 我参与过青藏铁路施工。 我参加过拉萨的南山公园绿化工程，在荒山上栽树苗。 雄鹰也飞不过去的山口，我们能把公路修过去。 雪豹也爬不上去的雪山，遍布着我们的足迹。 高山为我们低头，大河为我们让路，猛兽乖得像绵羊，恶鬼也要四散奔逃。 神佛也无", "url": "https://www.zhihu.com/question/658723436/answer/2052340305169494211", "votes": 245, "comments": 15, "feed_ts": 1782096060, "feed_time_str": "06-22 10:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "对伊朗的战争，美国为何打不下去了？", "excerpt": "这还就是我对川普刮目相看的地方。 他自己是个开赌场的，其实还挺能止损的。 假如你眼前有一次一本万利的投资机会，但是风险很大，于是你专门拿出一笔钱进行了风险投资，然而赌输了。于是你选择不跟了，悻悻回家自己生气。这就是现在的川普。 然而，我相信很多人会追加一笔钱，试着翻本，一次不行两次。这时候，风险已经不是重要的考虑事项，他只有一个执念就是只要不退出，就有可能会赢。那么这个人就从投资者变成了赌徒。你一", "url": "https://www.zhihu.com/question/2051964268229178184/answer/2051971777945982694", "votes": 304, "comments": 68, "feed_ts": 1782095877, "feed_time_str": "06-22 10:37", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待 6 月 19 日人民币兑日元突破 23.8、美元兑日元突破 161？", "excerpt": "其实当年日本杀生石破裂，然后一个叫石破的人上台，我就知道要应谶了。 石破茂的名字里还带一个茂字，可见有些回光返照。高市长了一张《天书奇谈》老狐狸的脸，大概被什么东西附体了，另外早苗两个字非常不吉利，感觉要拔苗助长。 总之，日本真正的好日子还没到。 ", "url": "https://www.zhihu.com/question/2051265976675604351/answer/2052339293419462974", "votes": 131, "comments": 6, "feed_ts": 1782095818, "feed_time_str": "06-22 10:36", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "进击的沈帅波发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "立邦，刷新自己", "excerpt": "立邦，刷新自己", "url": "https://www.zhihu.com/pin/2052337260276851709", "votes": 0, "comments": 0, "feed_ts": 1782095468, "feed_time_str": "06-22 10:31", "category": "pin", "cat_name": "想法动态"}, {"actor": "时光添加了问题", "verb": "MEMBER_ASK_QUESTION", "verb_cn": "MEMBER_ASK_QUESTION", "title": "国内如何合法合规的做空日经？", "excerpt": "希望懂这方面的大神给点建议，不要外汇平台，香港的券商可以我知道，但是资金管控问…", "url": "https://www.zhihu.com/question/2052332472956893057", "votes": 0, "comments": 0, "feed_ts": 1782094192, "feed_time_str": "06-22 10:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "如果中国真像网上说的有那么多见不得光的事情美国为什么不大力宣传？美国有个「美国国家民主基金会（NED）」，去年的年度预算约3.15亿美元，对华支出约1300万美元。问题是该基金覆盖了1900个项目，涉及90多个国家，这笔钱分摊到每个人身上就少得可怜。  既然是「民主基金」，就应该把财报透明化，但其运作方式本身就是「见不得光的事情」。  相比之下，NED资助塞尔维亚“天鹅绒革命”花了3100万美元，乌克兰“橙色革命”更是投入了6500万美元，而俄罗斯、白俄罗斯、尼加拉瓜也分到了数百万美元。  所以，中国的各路斗士该反思：为什么NED给的钱这么少？你们有没有认真干活？  其实，从NED的投入高低就能看出端倪：投入越高，该国「见不得光的事情」暴露得就越多；反之，效果就越差。如果中国真像网上说的有那么多见不得光的事情美国为什么不大力宣传？ #世界很大 #世界人 #美国的险恶用心中国人民看得很清楚 ", "excerpt": "如果中国真像网上说的有那么多见不得光的事情美国为什么不大力宣传？美国有个「美国国家民主基金会（NED）」，去年的年度预算约3.15亿美元，对华支出约1300万美元。问题是该基金覆盖了1900个项目，涉及90多个国家，这笔钱分摊到每个人身上就少得可怜。  既然是「民主基金」，就应该把财报透明化，但其运作方式本身就是「见不得光的事情」。  相比之下，NED资助塞尔维亚“天鹅绒革命”花了3100万美元，", "url": "https://www.zhihu.com/pin/2052329643555004421", "votes": 0, "comments": 1, "feed_ts": 1782093519, "feed_time_str": "06-22 09:58", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如果中国真像网上说的有那么多见不得光的事情美国为什么不大力宣传？", "excerpt": "美国有个「美国国家民主基金会（National Endowment for Democracy，简称NED）」，去年的年度预算额度达到约3.15亿美元。对华支出约1300万美元。 问题是该基金覆盖了1900个项目，涉及到90多个国家。 这就是问题的逻辑性。 所谓的宣传，都要由人来完成，最起码要有个写稿子的人。 虽然现在很流行AI写稿，但是AI只能收集网络信息，AI还做不到实地采访，深入现场调查到第", "url": "https://www.zhihu.com/question/2050164106842346295/answer/2052329295415076837", "votes": 9, "comments": 3, "feed_ts": 1782093435, "feed_time_str": "06-22 09:57", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你见过最杠的杠精是什么样的？", "excerpt": "不愧是懂王的下属，深得其真传 ", "url": "https://www.zhihu.com/question/68014919/answer/127387416218", "votes": 657, "comments": 0, "feed_ts": 1782093307, "feed_time_str": "06-22 09:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "是只有中国影视剧的服化道不严谨吗？还是全世界都这样？", "excerpt": "我觉得中国不严谨的下限可能更低。 90年代很多电视剧真的直接穿京剧戏服就演古装了。但其实并不太影响观看体验。 ", "url": "https://www.zhihu.com/question/1974930163629302469/answer/2052328340548219552", "votes": 83, "comments": 16, "feed_ts": 1782093207, "feed_time_str": "06-22 09:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么楚云飞说山西菜不入流，上不了台面？", "excerpt": "看看山西王吃什么就知道了。 阎锡山当了三十八年山西王，早餐不是清汤煮鲜面，就是热馍就咸菜。正餐不过三四样小炒，配上馒头花卷，再把打卤面当饮料喝——主打一个碳水配碳水。贴身警卫张日明回忆，这位“土皇帝”的日常饮食，跟山西任何一个庄稼汉没什么两样。 冯玉祥1930年被阎锡山软禁在五台县建安村，曾不止一次对人抱怨：阎老西是真吝啬，送来的“滋补品”不是馒头就是小米，见不到一点荤腥。阎锡山的回应倒也坦然：山", "url": "https://www.zhihu.com/question/13175027459/answer/2051429497149435946", "votes": 2306, "comments": 240, "feed_ts": 1782092976, "feed_time_str": "06-22 09:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "王多鱼-加油", "verb": "MEMBER_COLLECT_ANSWER", "verb_cn": "收藏了回答", "title": "如何评价张小珺对罗福莉的3.5个小时访谈？", "excerpt": "谢邀。作为一个没有任何大模型领域知识的 LLVM 劳务派遣员工，我昨天环独墅湖徒步的时候听完三个半小时的博客，感觉很长脑子，总结一下我学习到的观点。 大模型竞争已经进入 Agent 时代，以长上下文、工具调用、多轮任务和后训练为主，用 Context Engineering、Skill 文件、Agent 架构、记忆和任务框架，让模型具备更强的端到端任务完成度。需要让 Agent 上做好 RL sc", "url": "https://www.zhihu.com/question/2031182124603195471/answer/2052038030790340843", "votes": 353, "comments": 9, "feed_ts": 1782092917, "feed_time_str": "06-22 09:48", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "从飞机设计角度来说，sb2c为什么不讨飞行员喜欢？", "excerpt": "泻药 飞行员主要不喜欢SB2C哪里呢？主要集中在操纵性差上，俯仰反应不好，俯冲时副翼比较沉重，在SB2C-3之前因为减速板设计原因俯冲会有很严重的尾部振动，按飞行员的形容，是一架比SBD“更僵硬”的飞机，在飞行中也需要更多的操作来维持正常的飞行，然后是由于动力不足和前面说的俯仰操作的原因起飞比较痛苦，最后还有一些飞行员不太适应电动变距桨，这算是小事。 实际上战争进行到后期SB2C的风评并不是那么差", "url": "https://www.zhihu.com/question/63848821/answer/213819175", "votes": 27, "comments": 4, "feed_ts": 1782092913, "feed_time_str": "06-22 09:48", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "谷爱凌几乎整个周期4年没有跳过大跳台，为什么一复出就能夺银？", "excerpt": "谷参加的项目，比赛人数是凑不满的。 这个项目全球全脱产训练的人数不到20人。 跳水这个项目全球全脱产训练人数不到300人，而且大部分在我国。 任何项目牛逼你就看全脱产训练的人有多少。 比如乒乓球，国外也有很多人打，但是全脱产训练乒乓球在国外就不行了。 足球为什么牛逼，就我国国足这种残疾球队都赚钱。我国注册足球人口才50多万。 大家不要嫌弃国足，国足虽然是狗屎，但狗屎赚的钱，养活了跳水、射击等一系列", "url": "https://www.zhihu.com/question/2006967349631218659/answer/2050181856667162423", "votes": 9836, "comments": 739, "feed_ts": 1782092295, "feed_time_str": "06-22 09:38", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "ZOMI酱", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价张家裔从天才少女到退学流浪街头？", "excerpt": "前几天一段“篮球天才少女在美国当街下跪”的视频在全网疯传。 这个女孩叫做张家裔，在一年多前，她还是被央视重点报道立捧的篮球天才，全网吹爆的“中国女篮未来之星”，草根逆袭的教科书。 她靠着全额赞助远赴美国名校深造，本以为她会在大洋彼岸进入职业赛场，没想到她会当街下跪求饶。那个曾经眼里有光的天才，怎么就活成了如今这副模样？到底哪一步走歪了？ 一、故事的起点：江西农村的水泥地和塑料凳。 2009年，张家", "url": "https://www.zhihu.com/question/2045084856711894410/answer/2048434461809946863", "votes": 5383, "comments": 721, "feed_ts": 1782091977, "feed_time_str": "06-22 09:32", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "ZOMI酱", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为啥说普通家庭的最大的骗局就是带孩子见世面？", "excerpt": "我举个例子。 不少人都去过北京旅游，可能很多人还住在北京。一般去天安门、故宫、前门、香山、八大处、颐和园、圆明园。 但可能很多人在北京住了十几年， 不知道有个地方叫“法海寺”。 如果你没有知识储备，去了也就觉得是个北京郊区的小庙。 甚至不如“红螺寺”、“卧佛寺”什么的京郊景区有名。 转一圈，不到30分钟就能出来。 但你要是有足够的艺术和国学知识，会知道这里有和“敦煌、永乐”齐名的“中国三大壁画”。", "url": "https://www.zhihu.com/question/2038894308640700353/answer/2051768041365574595", "votes": 2250, "comments": 417, "feed_ts": 1782091567, "feed_time_str": "06-22 09:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "时予", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "十年之后，中国女性的处境会是怎么样的？", "excerpt": "东北服领先全国二十年是公认的……东北女性现在的日子就是全国女性十年二十件后的未来……看起来也不错啊。 不信的小伙伴可以问问身边认识的东北姑娘，觉得自己的社会家庭地位和自己的上一代比较如何～～ 吓唬谁呢……大家都是九年义务教育出来的，同一个岗位人家跟人资谈判比你要来的工资都多、能让你两句故布疑阵给唬住了～～哈哈哈 ", "url": "https://www.zhihu.com/question/2014626718703441629/answer/2052321363646591311", "votes": 15, "comments": 8, "feed_ts": 1782091544, "feed_time_str": "06-22 09:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "时予", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "大龄女只要想一定能结婚，而大龄男不行吗？", "excerpt": "也能啊……你愿意入赘，自带工资洗衣做饭带孩子，服低做小鞍前马后，多大岁数都能啊。 （被跟我说，女的婚后也未必服低做小，那你是承认了，女的婚后得自带工资洗衣做饭带孩子当自费上班老妈子呗……可是人家好歹会下蛋啊……你会吗……不会还不乖一点） ", "url": "https://www.zhihu.com/question/2049232953423798308/answer/2052320173042956002", "votes": 1, "comments": 0, "feed_ts": 1782091260, "feed_time_str": "06-22 09:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "时予", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "男性为什么把冠姓权看得那么重要，孩子随母姓后就理所当然不管孩子了， 不管怎么说也是自己的孩子呀？", "excerpt": "冠姓权就是钓鱼佬紧紧盯着的鱼鳔…… 鱼鳔一动，就说明上鱼了， 鱼鳔沉下去又迅速浮起来，也说明鱼白白偷走了香饵戏弄了钓鱼佬还顺利脱钩逃之夭夭了～ 婚内权力地位，谁是剥削阶级谁是被剥削阶级，是东风压倒西风还是西风压倒东风……还有比冠姓权更好更直观的鱼鳔吗～～ 问题是，现在不少钓鱼佬因为心疼香饵或者纯粹只是没本事还想得美，想要学姜子牙直钩无饵硬钓……人家姜子牙是有通天彻地封神榜的能耐，他们是妄图靠三寸不", "url": "https://www.zhihu.com/question/2048451212463412402/answer/2052318975858680361", "votes": 4, "comments": 1, "feed_ts": 1782090975, "feed_time_str": "06-22 09:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你听过什么因果报应的事吗？" const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

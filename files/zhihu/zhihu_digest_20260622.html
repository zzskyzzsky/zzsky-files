一内存。这套架构让 CPU 和 GPU 共享同一块内存池，GPU 能直接看到全部 128GB，而不是像传统 PC 那样被 24GB 显存卡住脖子。在这台机器上，可以本地跑 671B 参数的 DeepSeek R1。这个模型本身用 MoE 架构，每次推理只激活约 37B 参数，经过 4-bit 量化后刚好装进 128GB 统一内存，速度约 3 到 8 tokens/s。Qwen3 的 235B MoE 模型跑起来更流畅，15 到 25 tokens/s。Llama 3.1 405B 得压到 Q2 量化才能跑，质量会掉一截。发帖人还说，今年第三季度会出一个支持 192GB 统一内存的 PRO 495 版本，届时能跑更高精度的模型，参数上限推到 300B。把算力搬回本地的账，onchainmilady 算得很直白：Claude Pro 每月 20 美元，ChatGPT Plus 也是 20 美元，如果还要调 API 做产品，月费轻松达到 200 到 2000 美元。一年云 AI 的支出少则两三千，多则两万多。相比之下，3999 美元的硬件是一次性投入，后续推理零边际成本，没有速率限制，没有凌晨两点服务器挂掉的问题。按她的估算，差不多一年以内硬件就能回本。不过他也把坑摊开了：本地推理速度远没到 ChatGPT 那种即时反馈的体验；搭建过程需要自己选模型、定量化层级、调上下文长度，操作链条比打开网页复杂得多；AMD 的 ROCm 软件栈比 NVIDIA 的 CUDA 生态还是弱一截。而且她也承认，在一些细分任务上，GPT-4o 和 Claude 3.7 Sonnet 的顶配表现仍然领先。这件事最值得注意的倒不是某款硬件本身，而是这种&#34;模型体量在涨、硬件门槛在降&#34;的趋势——671B 的推理模型正在被塞进一台书那么大的盒子里，全程不联网、数据从不离开机器。对面向金融、医疗或法律场景做 AI 产品的人来说，这种本地化路径不只是省钱，而是合规绕不过去的必要选择。对普通用户，暂时没必要跟风折腾。", "excerpt": "退订了200/月的Claude，换成3999刀本地机器一台不到四千美元的机器，把我每月的 AI 账单从几百美元压到了零。不是断网、不是降级到更弱的模型，而是把整个推理负载搬回了本地。这条分享来自 onchainmilady，不久前关掉了 Claude 订阅，换了一台 AMD 在 CES 2026 上发布的 Ryzen AI Halo，售价 3999 美元。机器里塞了一颗 Ryzen AI Max+", "url": "https://www.zhihu.com/pin/2052194530829546468", "votes": 0, "comments": 2, "feed_ts": 1782061314, "feed_time_str": "06-22 01:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "别再手搓提示词了，AI编程圈在讨论循环工程“我不再给Claude写提示词了。我写循环，让循环去提示Claude。”说这话的是Claude Code的创造者Boris Cherny。另一个开发者Peter Steinberger更直接：你不该再手动给AI写提示，你应该设计循环，让循环替你提示AI。这条推文页面显示有220万次查看。它不是个别技术极客的奇技淫巧，而是在AI编程圈里快速扩散的一套新范式。本文的素材来自机器学习社区负责人elvis最近发布的一篇长文，他把这套东西拆解得非常清楚。循环是什么一个让AI自己跑起来的自动化流程，只做四件事：向模型发出指令，读它写出的结果，判断是不是做完了，如果没完就把错误或下一步喂回去继续。你不是坐在聊天框里一条条发指令，你只是写了个控制程序，模型变成这个程序里的一个子函数。不再是“我怎么跟它说清楚需求”，而是“我设计一个机制让它自己把事情做对”。六个零件elvis把构建一个真实可运行的循环拆成六个标准组件。这些组件过去需要手写，现在多数代码工具已经内置，这也是这套范式能快速普及的前提。(1) 触发器：不用你自己点“开始”，定时、文件变动、PR打上标签都可以触发。(2) 隔离：每个Agent独立工作区，通常用git worktree，防止两个Agent互相覆盖文件。(3) 写死的上下文：项目规范、构建步骤写成文件让Agent每次运行都读到，别让它每次靠猜。(4) 接入工具：连上你的issue、CI、数据库和聊天工具，它自己开PR、关联工单、汇报结果。(5) 二级检查员：把一个专门审校用的Agent隔开，因为让模型审查自己的输出，什么都能通过。(6) 磁盘状态：用markdown文件或看板记住进度。模型跑完一轮就把上轮的事忘了，文件不会。一个实例elvis给出一个“PR保姆”循环的完整配置：每15分钟触发一次，扫描所有打上agent-watch标签的开放PR。如果CI因为明确原因挂了就尝试修复一次，每次预算5分钟、修改文件不超过10个。修好了自动合并，预算耗尽或修不好就停下通知你。Claude Code内置的/goal命令也是这个模式：设置一个可验证的完成条件、达标证据、预算上限和不可逾越的限制条件，它就在会话里自己跑多轮直到条件达成。", "excerpt": "别再手搓提示词了，AI编程圈在讨论循环工程“我不再给Claude写提示词了。我写循环，让循环去提示Claude。”说这话的是Claude Code的创造者Boris Cherny。另一个开发者Peter Steinberger更直接：你不该再手动给AI写提示，你应该设计循环，让循环替你提示AI。这条推文页面显示有220万次查看。它不是个别技术极客的奇技淫巧，而是在AI编程圈里快速扩散的一套新范式。", "url": "https://www.zhihu.com/pin/2052191850493228849", "votes": 0, "comments": 0, "feed_ts": 1782060690, "feed_time_str": "06-22 00:51", "category": "pin", "cat_name": "想法动态"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "美股股民长期炒股亏损比例80%+，A股才七亏，而且A股股民很少有破产的。美股T+0不就比A股多个日内交易码？这个还真有统计：美股日内交易的散户长期（5年）97%是亏损的，5年存活率1%，平均在90天内亏掉90%。至于讨论问题，咱可以就事论事，没必要直接人身攻击秀教养，我不是你的父亲，没有义务包容你。给你一次道歉的机会，如果想交流，先道歉，再讨论。", "excerpt": "美股股民长期炒股亏损比例80%+，A股才七亏，而且A股股民很少有破产的。美股T+0不就比A股多个日内交易码？这个还真有统计：美股日内交易的散户长期（5年）97%是亏损的，5年存活率1%，平均在90天内亏掉90%。至于讨论问题，咱可以就事论事，没必要直接人身攻击秀教养，我不是你的父亲，没有义务包容你。给你一次道歉的机会，如果想交流，先道歉，再讨论。", "url": "https://www.zhihu.com/pin/2052191624373998520", "votes": 0, "comments": 0, "feed_ts": 1782060611, "feed_time_str": "06-22 00:50", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "我写这篇内容呢，主要我在后台评论区看到我在之前的关于老美储蓄率的那篇文章下面抬杠的有特别特别多。实际在评论区也和一些抬杠的辩了几句，但无奈评论太多了，后面也确实没那精力一条一条回了。不过呢，算储蓄率或者说算可支配收入加购买力平价，也算是对现在某些国家普通人的实际生活状态大致会有一个评估。包括本文中的日本，日本的年轻人实际生存压力变大，也就是疫情之后变得尤为明显的。一个国家的衰落，一个政权面临的问题，或者说日本这个国家出状况，它的体现总是方方面面的，宏观面上的经济，到微观上的具体的个人。到我们在B站的一些视频中看到啊，大久保的站街的或者啊新出的老师怎么质量越来越好，实际这些都在向我们潜移默化地表示日本现在的状况，有一点点艰难，不过我们实际算一下账之后发现已经快磨到临界点了。至于我实际是个什么心态呢，迫不及待，希望某些烟花炸开的心态呗。", "excerpt": "我写这篇内容呢，主要我在后台评论区看到我在之前的关于老美储蓄率的那篇文章下面抬杠的有特别特别多。实际在评论区也和一些抬杠的辩了几句，但无奈评论太多了，后面也确实没那精力一条一条回了。不过呢，算储蓄率或者说算可支配收入加购买力平价，也算是对现在某些国家普通人的实际生活状态大致会有一个评估。包括本文中的日本，日本的年轻人实际生存压力变大，也就是疫情之后变得尤为明显的。一个国家的衰落，一个政权面临的问题", "url": "https://www.zhihu.com/pin/2 的水是亚马逊河的重要支流，内格罗河", "url": "https://www.zhihu.com/question/657173886/answer/1982752085683491337", "votes": 10943, "comments": 296, "feed_ts": 1782051085, "feed_time_str": "06-21 22:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "南爸安爸", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "UALINK里对地址翻译过程的介绍（1）：几个措辞和细节值得学习：1） 从introduction角度看，没有讲自己api是通信模式，还是内存语义，主要对几个基本问题，例如重点讲地址翻译服务、rma地址访问模式、以及一致性等几个基础问题2）”An implementation can also opt for a global addressing model that is flat to simplify the translation process“， 这句话话讲打平“flat&#34;统一全局地址是一种可选,是上层行为，3）讲一致性，重点讲自己其实只聚焦IO coherence，类似PCIE的通过root complex来实现IO coherence，device上的memory本质不参与一致性snoopy协议。这个小细节，做过驱动的一般能理解，dma写一个mapped的ddr上的memory要配置cpu cache行为，是否对这个内存济宁缓存。我们很早研究NIC的ring buffer的DMA和cpu之间的cache thrashing的时候，经常更这个特性打交道。到AI总线百花齐放的时候，这些基本的第一性知识，又被重提。Figure 1-4 shows the UALink network, which allows data to move between devices. It supports data transfers within and across system nodes. Accelerators may use a System Physical Address (SPA) to access memory within a System domain and may use a Network Physical Address (NPA) to access memory in a different System domain. An implementation can also opt for a global addressing model that is flat to simplify the translation process. This section provides a brief overview of a cross-domain address translation model. It is only for illustration. This specification leaves the address translation as an implementation choice as Switches use identifier-based routing. In this example, the source Accelerator uses the Memory Management Unit (MMU) to translate a Guest Virtual Address (GVA) to a Network Physical Address (NPA). At the destination node, a link MMU is used to translate NPA to a local SPA.关于一致性设计：UALink shall support an I/O coherency model with the following semantics:• Read from a peer memory shall get the most recent coherent copy of data from memory or a cache within its system node.• Writes to a peer memory shall invalidate all cache copies within its system node. Partial writes shall fetch any cached data in the system and merge with the data from write. The most recent copy of the data shall be written back to memory.", "excerpt": "UALINK里对地址翻译过程的介绍（1）：几个措辞和细节值得学习：1） 从introduction角度看，没有讲自己api是通信模式，还是内存语义，主要对几个基本问题，例如重点讲地址翻译服务、rma地址访问模式、以及一致性等几个基础问题2）”An implementation can also opt for a global addressing model that is flat to si", "url": "https://www.zhihu.com/pin/2052145813246187365", "votes": 0, "comments": 0, "feed_ts": 1782050638, "feed_time_str": "06-21 22:03", "category": "pin", "cat_name": "想法动态"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "吊打 draw.io，又一个画图 Skill 开源！", "excerpt": "写技术文档的朋友，为了把原理讲清楚经常要画各种图表，比如架构图、流程图、时序图等等。 但有时候脑子里明明想清楚了逻辑，可一打开 http://http://Draw.io，麻烦就来了。一个框一个框地拖，一根线一根线地连，反复对齐位置，半小时就没了。 后来开始用 AI 工具，但生成的图能看是能看，可拿去发文章、做 PPT 总的觉得差点意思。 直到最近，发现一个叫 fireworks-tech-gra", "url": "https://zhuanlan.zhihu.com/p/2050175282552820251", "votes": 164, "comments": 13, "feed_ts": 1782049203, "feed_time_str": "06-21 21:40", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "Dio-晶", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "最近参加了一个经典西式心理治疗课程 ：） 实话说蛮有收获的，第一次通过理解原生家庭与成长经历的回溯，重新厘清自身行为模式的根源，更加自洽的同时也认识到自己的一些不足，例如已经丢失了表达哈哈大笑的情绪能力了。不过呢，表面上的开放并不能隐藏东西方文化的冲突 ：） 而通过这认知也一轮让我对东方文化有了更具有灵性的理解，想得更加通透了些。所谓本我、自我、超我，看似体系严谨实际是三分对立，一生都在调和冲突。而在儒家文化中，简简单单四个字“行知合一”，心性即回归一体，不再内耗。西方心理学围绕 “认清自我” 展开，反复叩问我是谁、我从哪里来、我要到哪里去，追求剥离社会集体束缚的独一无二的个体感和主体性，并以此标尺来审视东方人生的社会性、集体性，视作是对自我的束缚和压抑，鄙视为他人而活的生活方式。嘿哟，但这恰恰还真应了儒家文化最深刻的内核：为天地立心，为生民立命，为往圣继绝学，为万世开太平。儒家最高理想，22字还就没有1个字是为了自己，还真就是TMD为了他人而活！而且即使生如草芥亦可躬身践行。这种生活无需半分卑微，在东方文化，脱离苍生的自我，才是残缺的。天地与我并生，而万物与我为一。世人所谓寒窗苦读、要争个上游，不过是学而优则仕、内圣外王的体现罢了。即使走到最后，古人亦铺就了道路，“达则兼济天下、穷则独善其身”。穷包括但不限于命、财、运、气......若是某一天确实没有了，东方人会自动从儒转变去佛家破执念、道家顺自然，安放好个体的妥协或寂灭.......先后不一样。", "excerpt": "最近参加了一个经典西式心理治疗课程 ：） 实话说蛮有收获的，第一次通过理解原生家庭与成长经历的回溯，重新厘清自身行为模式的根源，更加自洽的同时也认识到自己的一些不足，例如已经丢失了表达哈哈大笑的情绪能力了。不过呢，表面上的开放并不能隐藏东西方文化的冲突 ：） 而通过这认知也一轮让我对东方文化有了更具有灵性的理解，想得更加通透了些。所谓本我、自我、超我，看似体系严谨实际是三分对立，一生都在调和冲突。", "url": "https://www.zhihu.com/pin/2052140417236350647", "votes": 0, "comments": 7, "feed_ts": 1782048435, "feed_time_str": "06-21 21:27", "category": "pin", "cat_name": "想法动态"}, {"actor": "南爸安爸", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "GLM5.2总结一下理解（1）GLM5.2技术有几个点，从计算系统角度，总结一下理解：1.  大量使用了降低DSA indexing（这个不是最新的算法，关注这个领域的话，可以看到几个月前学术界也公开了类似的方法，变种也不少）计算负载的优化方法，包括基础模型结构以及MTP方法上，它的4层的indexshare，对IO带宽压力，只降低indexcaching首层I/O：这个仔细想了下，再结合公开文档的措辞，还是倾向于它主要优化index的计算，对每个cache group的第一层的kvcache的io卸载带宽压力没有下降，带宽还是挺高的，但是其他几层，的确可以大规模隐藏，可隐藏卸载I/O时间从attention计算内的部分时间拓展到整层transformer layer，带宽不是问题；2.  他们放弃了GRPO，采用ppo，需要引入critic模型，直接增加了1X的HBM内存压力：GRPO是考虑到减少critic模型，提高actor内存空间，但是对于1M序列的长程任务，智普觉得GRPO不行，还是需要cirtic模型的存在。 这个critic可能带来内存压力。 以此进一步想：未来超节点pod的ddr池化，在训练场景上可能价值也逐渐变大。初步看了下，的确也有一些这样的研究，用cxl、disaggregated、training、reinforment learning等关键词检索有少量研究，Cost-Efficient LLM Training with Lifetime-Aware Tensor Offloading via GPUDirect Storage，NeurIPS 2025。这层系统最理想的介质，还不是DDR，未来HBF可能是更加廉价的系统，以为内它主要都是weight shard（例如MoE expert）、activation shard（KV state）比较大块的另外，这层介质，主要偏向NPU和host的local的访存，或者说上层并行程序要尽量设计策略亲和本地，减少跨机流量。3. 短期看，大模型算法和系统联合设计上，聚焦推理的长序列计算耗时、记忆容量的优化是主要点，indexshare是解决大模型sparse解码后解码中唯一一个跟长序列仍然成线性关系的计算负载，是大模型走向agentic长程任务要解决的系统效率的主要计算矛盾，少量缓解了kvcache的sparse卸载hbm-ddr之间的协同压力（没有彻底解决），而且也是牺牲算法性能纬度的方法。可以看到deepseekv4采用压缩机制做长序列推理的性价比，glm5采用index和kvcache共享等技术优化系统性价比，如果从完成一个agenticai任务的角度，目前算法的token计算效率仍然非常低，包括ngram可能都不是能最终，直觉上可能从语义角度，还有大量的远比token level更加极致的大模型算法计算成本的压缩方法。", "excerpt": "GLM5.2总结一下理解（1）GLM5.2技术有几个点，从计算系统角度，总结一下理解：1.  大量使用了降低DSA indexing（这个不是最新的算法，关注这个领域的话，可以看到几个月前学术界也公开了类似的方法，变种也不少）计算负载的优化方法，包括基础模型结构以及MTP方法上，它的4层的indexshare，对IO带宽压力，只降低indexcaching首层I/O：这个仔细想了下，再结合公开文档", "url": "https://www.zhihu.com/pin/2052138332168237382", "votes": 0, "comments": 0, "feed_ts": 1782048367, "feed_time_str": "06-21 21:26", "category": "pin", "cat_name": "想法动态"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "对比官方 Pico 2 W，Waveshare RP2350B-Plus-W 有哪些实用升级？", "excerpt": "▲ Waveshare RP2350B-Plus-W 开发板 Waveshare RP2350B-Plus-W 是一款遵循 Raspberry Pi Pico 2 W 外形尺寸的开发板，但得益于搭载的 RP2350B 微控制器，它提供了多达 41 个 GPIO 引脚，集成了 16MB 闪存，并配备 USB-C 接口。 从多个方面来看，这都算是基于 RP2350A 的官方开发板的一次全面升级——后者", "url": "https://zhuanlan.zhihu.com/p/2051660591027197217", "votes": 2, "comments": 0, "feed_ts": 1782048321, "feed_time_str": "06-21 21:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "夷陵笑笑生", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "量化交易能完全替代主观交易吗？", "excerpt": "目前不行。 人类交易员的优势在于 zero-shot learning。比如发生了一件历史上从未发生过的地缘政治危机，人类可以通过 World Model 进行因果推演（Reasoning），从而迅速调整仓位。而 Quantitative Models，无论是传统的 Linear Models 还是现在的 Deep Time-series Models (like TSiT or iTransfo", "url": "https://www.zhihu.com/question/654601780/answer/1983269835308827553", "votes": 800, "comments": 76, "feed_ts": 1782046278, "feed_time_str": "06-21 20:51", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价近日印度网民大规模发掘和审丑华人？", "excerpt": "赢学从来都是最容易的，让他们继续赢吧，我们捞干的有什么不好？你不能让卢瑟连嘴痛快都不行吧？", "url": "https://www.zhihu.com/question/2051432853163004338/answer/2052130949215925059", "votes": 6, "comments": 0, "feed_ts": 1782046145, "feed_time_str": "06-21 20:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "川大大彻底红温了，认定倒影池变色是因为极左分子捣乱，现在到处在抓破坏分子。 ", "excerpt": "川大大彻底红温了，认定倒影池变色是因为极左分子捣乱，现在到处在抓破坏分子。 ", "url": "https://www.zhihu.com/pin/2052122301043324437", "votes": 0, "comments": 36, "feed_ts": 1782045901, "feed_time_str": "06-21 20:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "内脏脂肪超高严重，如何短期内减掉内脏脂肪并提高基础代谢率？", "excerpt": "管住嘴就行了，我身高187，最高体重198。每天俯卧撑加引体向上，还有快走5公里。最后发现脚疼，外加胃胀，核心就是我的腿部肌肉群撑不住体重。然后饭量减少2/3，开始很痛苦，晚上饿了就喝可乐，撑过了一个月就没事了，一个半月降了20斤，内脏脂肪直接没了。 你要管不住嘴，就不要问。 ", "url": "https://www.zhihu.com/question/37484627/answer/2052126922579223764", "votes": 7, "comments": 1, "feed_ts": 1782045185, "feed_time_str": "06-21 20:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "温伯陵", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何真正客观评价项羽？", "excerpt": "项羽就是失败了的曹操，曹操就是成功了的项羽。项羽最大的不幸，就是遇上了沛公，曹操最大的幸运，就是下一届的沛公实在不中用。 在文学大拿太史公的塑造下，项羽被描绘成一个具有贵族气质的，头脑简单，四肢发达的莽汉。而且太史公还各种采用春秋笔法，通过弱化刘邦的战绩和地位，塑造项羽很强，刘邦很弱的态势， 然后莫名其妙一直很强的项羽突然就被刘邦反杀了，给大家造成一种项羽是不是脑子不好使的认知。比如你光看以下记录", "url": "https://www.zhihu.com/question/263632904/answer/1905859429041157327", "votes": 8414, "comments": 939, "feed_ts": 1782044011, "feed_time_str": "06-21 20:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价知乎金银预测博主alex01的专栏质量？", "excerpt": "本人真实订阅，我手里实打实重仓（贷款20W）持有 均价1100 元/克黄金、20 元/g的白银实物，之前没接触过黄金白银，股票基金啥的， 到现在已经亏了6万多了。 我是从三月底订阅了 A 大，付完订阅费之后手头已经没钱，到现在，实物一直终死拿不动。每天上班第一件事就是雷打不动追更他的文章。股票啥的我看不懂，但单说金银，我当时要是狠心割一下，别死拿，老老实实跟着 A 大的思路走，亏得比这少的多了。 ", "url": "https://www.zhihu.com/question/2050923087047160231/answer/2052069892027856790", "votes": 16, "comments": 7, "feed_ts": 1782043636, "feed_time_str": "06-21 20:07", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "王树国称福耀科大各院系「养不活自己就是没真本事」，如何评价这种办学理念？", "excerpt": "这种学校赚钱的途径其实很明显，就是把学生卖出去做奴工。 现在正规大学也有，只是毕业季会卡你一下，卖去工厂流水线做奴工几个月，学校才给你发毕业证。 剩下绝大多数时间还算正常。 福耀这种没什么技术、知识产权积累，普遍赚钱的最直接的办法就是出售学生奴工这种极端廉价的劳动力。 一个学奴一个月几千块钱的收益，比学费值钱多了。 所以可以预测，福耀大学这两年有可能大幅度扩招新生，并且频繁组织贩卖学奴劳动。 医院", "url": "https://www.zhihu.com/question/2051039980940682412/answer/2052104370033005983", "votes": 12, "comments": 1, "feed_ts": 1782039808, "feed_time_str": "06-21 19:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "伊朗军方宣布关闭霍尔木兹海峡，伊朗外交部称美国未能约束以色列，违反谅解备忘录，哪些信息值得关注？", "excerpt": "伊朗如此之刚真是令人震惊。 我本以为伊朗签了这个协议，就会实质上抛弃真主党。 因为美国佬给得  "cat_name": "地缘 · 经济 · 能源"}, {"actor": "CVHub", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "哥伦比亚/普林斯顿大学招收AI4S和世界模型博士后", "excerpt": "大家好，我是刘世隆，现在是普林斯顿大学博士后，即将加入哥伦比亚大学工程学院担任助理教授。我之前的工作主要关注在计算机视觉，多模态学习，以及Agent方向。 我和合作者之前在目标检测和多模态领域的一系列工作包括DAB-DETR, DINO, GroundingDINO, DINO-X,以及最近的LocateAnything都获得了广泛关注，另外我们也在Agent领域做了很多有趣的工作，包括LLaVA", "url": "https://zhuanlan.zhihu.com/p/2048355584743839017", "votes": 70, "comments": 13, "feed_ts": 1782035929, "feed_time_str": "06-21 17:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "CVHub", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "刘世隆即将加入哥伦比亚大学任教非常高兴和大家分享一个好消息。普林斯顿AI^2 Fellow 我的博士后 @刘世隆 刘世隆（Shilong Liu）将于近期加入哥伦比亚大学工程学院（Columbia Engineering）担任助理教授，建立自己的研究团队。世隆是我合作过的最优秀的青年学者之一。在过去几年里，他在计算机视觉、多模态学习以及智能体（Agent）方向做出了一系列具有广泛影响力的工作。作为核心贡献者，他参与并推动了 DAB-DETR、DINO、GroundingDINO、DINO-X、LocateAnything 等一系列目标检测与视觉-语言领域的重要研究。这些工作不仅推动了学术前沿，也被工业界广泛采用。近年来，他进一步拓展到 Agent 和世界模型方向，主导或参与了 LLaVA-Plus、Web World Model、Avenir-Web、Alita、Alitag、EEVEE 等项目，持续探索通用智能体与开放世界交互的新范式。随着人工智能从感知走向行动、从数字世界走向物理世界，Agent、世界模型与 AI for Science and Engineering 的交叉将成为未来的重要研究方向，而世隆无疑是这一领域最值得关注的青年学者之一。目前，我们将共同招收博士后，重点开展 AI for Engineering × World Models 方向的研究。欢迎对这一方向感兴趣、希望推动下一代科学发现系统和智能体技术的优秀青年学者联系。📩 联系方式：* Shilong Liu: shilong.liu@princeton.edu* 抄送: slongliu86@gmail.com欢迎访问学者、实习生以及研究合作伙伴加入。更多信息请关注他的主页： 🌐 链接", "excerpt": "刘世隆即将加入哥伦比亚大学任教非常高兴和大家分享一个好消息。普林斯顿AI^2 Fellow 我的博士后 @刘世隆 刘世隆（Shilong Liu）将于近期加入哥伦比亚大学工程学院（Columbia Engineering）担任助理教授，建立自己的研究团队。世隆是我合作过的最优秀的青年学者之一。在过去几年里，他在计算机视觉、多模态学习以及智能体（Agent）方向做出了一系列具有广泛影响力的工作。作为", "url": "https://www.zhihu.com/pin/2051680074458468561", "votes": 0, "comments": 10, "feed_ts": 1782035918, "feed_time_str": "06-21 17:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "邓德全说书", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "莫迪是既尼赫鲁和瓦杰帕伊这两个纯印度人之后的，另一个纯印度人在执掌印度大局，从他的两位前辈身上就可以推测他的行为模式：第一，行动不可以用常理预测，随时和可以和盟友翻脸；第二，追逐实际利益，轻视意识形态；第三，攻击性强，敢于冒险，但是掉头和撤退总是很快。从这三点逻辑出发，就可以推测魔笛老仙。", "excerpt 得antirez应该更新一下自己的知识结构了。 蒸馏是一种将大模型（教师模型）的知识和能力迁移到小模型（学生模型）中的技术。基本做法是向教师模型输入大量问题或任务，收集它生成的答案、推理过程或概率分布，再用这些数据训练学生模型，使学生模型尽可能模仿教师模型的行为。 在Hinton提出蒸馏这个概念的时候，蒸馏就分两种，一种叫做白盒，一种叫做黑盒。白盒方法可以获得教师模型的logi", "url": "https://www.zhihu.com/question/2050271442697188542/answer/2051947038074525681", "votes": 48, "comments": 6, "feed_ts": 1782002297, "feed_time_str": "06-21 08:38", "category": "ai", "cat_name": "AI · 技术 · 算法"}];
const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

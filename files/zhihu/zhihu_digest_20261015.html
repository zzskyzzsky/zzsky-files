erts, Untie the Attention#无影寺 ", "excerpt": "Foil提出循环MoE新配方：扩大专家池、增加循环次数、解开注意力共享\n图文版：链接Foil固定专家预算时怎样压扁循环MoE论文只重排循环核心，不增加专家参数或每个 token 的专家调用。形状 `(E,D,L)` 分别表示每层专家数、专家层数与循环遍数；一次压扁把 `(E,D,L)` 变成 `(2E,D/2,2L)`，让路由面对更大的专家池，同时保持专家参数、专家调用与有效深度不变。Base 是", "url": "https://www.zhihu.com/pin/2093865445099057422", "votes": 0, "comments": 0, "feed_ts": 1791996499, "feed_time_str": "10-15 00:48", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "懂车帝会凉了吗？董某差不多也是这个意思。“如果国标不改变，那就改变国标。”国标认为1500N合格，董某提高到1600N。不管怎么说，国标就是标准。有意见可以提，实验可以做，但是不能裹挟舆论强行推翻。但是我相信，专门的调查组肯定成立了。最初的动机就是想收拾一下华为江淮，结果没想到，江淮不做声，把问题直接向组织汇报，问:“国标算数否?”现在不是凉不凉的问题，而是坚决经得起调查。懂车帝会凉了吗？ #车圈大佬  #车车车车（知乎周刊）  #汽车区UP主 ", "excerpt": "懂车帝会凉了吗？董某差不多也是这个意思。“如果国标不改变，那就改变国标。”国标认为1500N合格，董某提高到1600N。不管怎么说，国标就是标准。有意见可以提，实验可以做，但是不能裹挟舆论强行推翻。但是我相信，专门的调查组肯定成立了。最初的动机就是想收拾一下华为江淮，结果没想到，江淮不做声，把问题直接向组织汇报，问:“国标算数否?”现在不是凉不凉的问题，而是坚决经得起调查。懂车帝会凉了吗？ #车圈", "url": "https://www.zhihu.com/pin/2093856505074278563", "votes": 0, "comments": 9, "feed_ts": 1791994295, "feed_time_str": "10-15 00:11", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "懂车帝会凉了吗？", "excerpt": "还记得马先生说过的一句话吗？ “如果银行不改变，那就改变银行。” 董某差不多也是这个意思。 “如果国标不改变，那就改变国标。” 当下，尊界找了第三方检测，符合国标。 董某冷笑一声，国标? 董某把自己逼到挑战国标的地步，这一把，董某要赢的是国标。 国标认为1500N合格。董某提高到1600N。因为这个力度踩得出来。 那么，肯定有个疑问，需要董某明确回答:“汽车检测，以谁的标准为准?” 如果董某回答:", "url": "https://www.zhihu.com/question/2093652055483232309/answer/2093856240019493405", "votes": 44, "comments": 4, "feed_ts": 1791994230, "feed_time_str": "10-15 00:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你见过最令你震撼的一张图片是什么？", "excerpt": "法国《查理周刊》侮辱穆圣漫画事件之后，其他漫画家声援被恐怖分子打死的法国漫画家，个人最喜欢的一张 很好诠释了什么叫：“教友可以夺走人的生命，但永远夺不走人的尊严和自由” 应该多鼓励人们创作《撒旦诗篇》和《查理周刊》穆圣漫画这样的作品来揭露那个七世纪的阿拉伯军阀。 毕竟幽默是对抗暴君最有力的武器 ", "url": "https://www.zhihu.com/question/275971994/answer/2090458564313735561", "votes": 1661, "comments": 209, "feed_ts": 1791993233, "feed_time_str": "10-14 23:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI办公室藏录音设备：一名工程师被捕2026 年 10 月 14 日，OpenAI Newsroom 发布通报称，公司在一间办公室里发现一台被藏匿的录音设备，并利用自家模型分析该设备及其来源，锁定是内部一名员工在几天前放置。OpenAI 已将案件移交 FBI 并解雇该员工。此前一天（10 月 13 日），美司法部解封起诉书并发布新闻稿，披露被捕工程师为 35 岁的 Abdulrahman Alfozan，涉嫌使用或企图使用设备截取口头交谈。OpenAI的通报OpenAI 在通报中明确，目前没有迹象表明涉事人员不当获取或带走了模型权重、源代码或客户数据。通报重点提及公司借助自家模型完成了对设备及来源的研判，但未披露模型具体是如何完成追踪鉴定的，也未公布涉事员工姓名、设备具体型号及录音内容。高管会议室电视背后的USB设备据美国司法部新闻稿转述的起诉书内容，Alfozan 为沙特阿拉伯国籍，自 2025 年 7 月起担任 OpenAI 工程师。9 月 30 日，工作人员在旧金山办公楼的一间高管会议室里发现了第一台录音设备，该设备插在电视机背面的 USB 接口上，并用卫生纸遮挡。OpenAI 判定其安装时间约为 9 月 28 日，且内部存储内容已被加密。这间会议室常用于讨论核心技术进展、产品规划及商业合作，Alfozan 本人并无进入或参会的权限。起诉书披露了物理监控与数字查询两条线索。监控画面显示，10 月 5 日 Alfozan 曾进入该高管会议室并查看涉事电视机背面；同一天，安保人员在另一房间发现一个无人看管的包，内有其钱包、证件及第二台相似的录音设备。数字记录方面，他在 9 月 28 日前曾通过内部办公工具多次检索高管会议室排期与位置；9 月 24 日至 30 日期间，一个与其配偶关联、且与本人账号共享多项标识的聊天机器人账号，多次提问如何改造、遮挡、加密及远程访问持续录音设备。法律程序进展与「精密设备」争议Alfozan 已于 10 月 9 日被捕，目前处于联邦羁押状态，定于 10 月 19 日由联邦治安法官主持羁押听证。若罪名成立，该项联邦指控的法定最高刑期为 5 年监禁、25 万美元罚款及 3 年监督释放。美司法部新闻稿同时声明，起诉书仅代表检方指控，在定罪前被告推定无罪。此外，OpenAI 通报将该装置称为「精密录音设备」，引发了与起诉书证物照片的比对。起诉书附图显示，涉事装置由一块微型开发板连接一根印有 2.4G A-02 字样的柔性天线组成。社区有人检索出对应的零售页面，其中带麦克风的开发板标价约 23.51 美元、天线标价 0.50 美元（也有讨论将其笼统称为 15 美元开发板）。", "excerpt": "OpenAI办公室藏录音设备：一名工程师被捕2026 年 10 月 14 日，OpenAI Newsroom 发布通报称，公司在一间办公室里发现一台被藏匿的录音设备，并利用自家模型分析该设备及其来源，锁定是内部一名员工在几天前放置。OpenAI 已将案件移交 FBI 并解雇该员工。此前一天（10 月 13 日），美司法部解封起诉书并发布新闻稿，披露被捕工程师为 35 岁的 Abdulrahman ", "url": "https://www.zhihu.com/pin/2093849080036382065", "votes": 0, "comments": 0, "feed_ts": 1791992547, "feed_time_str": "10-14 23:42", "category": "pin", "cat_name": "想法动态"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "9月CPI数据很差，黄金会被压制？", "excerpt": "9月CPI非常难看。 环比：CPI涨0.6%，符合预期。核心CPI涨0.3%，比预期高出0.1个百分点，就是这0.1个点，直接把市场点着了。 同比：CPI从8月的3.4%反弹到3.7%，核心CPI从2.4%升到2.6%。 油价是最大推手，能源9月环比暴涨9.3%，主要是燃料油和汽油，同比涨了35%。 剔除能源 ，由流官来治理，转变成主权在我，治权亦在我。中央派高级干部到边疆指导工作，有着正面意义，保我大宋江山不失；其意义绝不下于岳飞抗金。大家认为这是苏大人倒了大霉，贬出京城；实际上这是中央将苏大人调出中央巡视指导地方，给地方军民带去中央的关怀和温暖，所以，苏大人去边疆，各地欢腾，每个地方早早就派人到县境迎接 盛情接待。中国能有这么大的一片疆土，历代流官们做出了巨大贡献，这里面也有我苏大人的奉献；卫国戊疆者，居功至伟哉！苏轼连续被贬惠州儋州，为什么不辞官回乡，过普通人生活？ #中华民族的领土  #民国疆域  #唐朝边疆 ", "excerpt": "苏轼连续被贬惠州儋州，为什么不辞官回乡，过普通人生活？中国的边疆，最早往往是羁縻地区；主权归中央，地方治理权力归土司。要彻底消化边疆少数民族地区，建土司只是权宜之计，最好是过渡到流官制，由流官来治理，转变成主权在我，治权亦在我。中央派高级干部到边疆指导工作，有着正面意义，保我大宋江山不失；其意义绝不下于岳飞抗金。大家认为这是苏大人倒了大霉，贬出京城；实际上这是中央将苏大人调出中央巡视指导地方，给地", "url": "https://www.zhihu.com/pin/2093826904713334820", "votes": 0, "comments": 0, "feed_ts": 1791987245, "feed_time_str": "10-14 22:14", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "苏轼连续被贬惠州儋州，为什么不辞官回乡，过普通人生活？", "excerpt": "说是封建王权严厉，也不算错，确实有这个因素。但肯定失之偏颇。 苏大人在中央工作过，完全明白这里面的道理。 中国的边疆，最早往往是羁縻地区。主权归中央，地方治理权力归土司。土司世袭罔替，上表求册封。 中央强大，土司温顺，相安无事。中央内乱，土司就要作乱，扩大地盘，甚至谋求独立。 比如说越南。我们现在把越南当外国。殊不知越南归属中国的历史非常漫长，历史悠久。 公元前214年，秦军在任嚣、赵佗率领下再次", "url": "https://www.zhihu.com/question/2090920560666612421/answer/2093826564869841397", "votes": 19, "comments": 1, "feed_ts": 1791987155, "feed_time_str": "10-14 22:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "沙特版马歇尔宇宙", "excerpt": "沙特版马歇尔宇宙", "url": "https://www.zhihu.com/pin/2093791791745086925", "votes": 0, "comments": 19, "feed_ts": 1791987046, "feed_time_str": "10-14 22:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "厄立特里亚是个怎么样子的国家？之前知道这国家是非洲曹县，不过一直有点弄不明白是怎么回事。直到查了人口数据才给我吓了一跳，算是理解了。我之前就知道，厄立特里亚跟埃塞是世仇。1961年到1991年，厄立特里亚打了三十年的独立战争，才从埃塞独立出来。独立没几年，1998年又因为争夺边界跟埃塞打了两年的大规模战争。之后从2000年一直到2018年，两国关系一直冰封，商贸、边界完全断绝。2018年宣布搞了什么和平协议，结果没过两年厄立特里亚又开始卷入到提格雷战争里去。刚刚过去的这个国庆节，埃塞跟厄立特里亚又断交了，阿比总理公开宣布要拿到红海出海口。可以说几十年来，厄立特里亚一直跟死敌共享着漫长的国境线。但我才知道，厄立特里亚是以什么样的人口体量对抗埃塞的——2024年，厄立特里亚的官方统计人口，是368万！当然非洲各国人口经常被低估，许多人认为厄立特里亚有至多600万人口。但要知道，埃塞是东非第一大国，人口多达1.4亿！也就是说，厄立特里亚一直在跟人口体量25-30倍于己，且共享漫长陆地边境线的国家为敌。埃塞可不是刚果那种纯粹的无组织国家，人口再多也是无效人口。从历史上看，埃塞军一直是非洲最有组织度、最强大的军队之一。现在的埃塞的国家机器也是有相当的组织度，能以倾国之力建成复兴大坝，同时残酷地镇压了提格雷人的反抗。全世界有类似生存压力的国家，也就一个古巴（以色列自跟埃及和解以来已经不再有这么大的生存压力）但古巴的情况跟厄立特里亚还是有两点不同的：首先，众所周知美国人命贵。轰炸、封锁、颠覆活动他们能做，真要动员大量地面部队灭国，美国人是很膈应的。对付一个小小的古巴，美国宁可折腾什么猪湾事件之类的抽象活动，也不肯直接出动陆军。其次，说到底，古巴对美国来说只是恶心，实际上不影响什么美国的根本利益。所以美国不会全力对付古巴。而对厄立特里亚而言，情况是：埃塞显然不介意打地面战争。厄立特里亚自己就打过两轮，埃塞还曾跟索马里大打出手，最近还在血腥地对付提格雷人。其次，厄立特里亚的独立，直接让埃塞这个东非人口第一大国变成了内陆国。考虑到埃塞人口仍然在高速增长，二三十年之后，多达两三亿埃塞人将被封锁在非洲内陆。埃塞可不是萨赫勒或者西非那些躺平混日子的国家，还是有野心、有欲望，想要发展的。学习中国模式，搞复兴大坝，怎么可能一直容忍现在这种情况？而环顾四周，索马里有两千多万人口，埃塞未必吃得下；吉布提有20个国家的军事基地，列强不会容忍埃塞的吞并；怎么看，都是再跟厄立特里亚人大战一场最符合逻辑。在这种情况下，厄立特里亚只能实行彻底的总体战体制，尤其是要逼所有的青年男性 从军并严禁人口流失，否则连跟埃塞两军对垒的能力都没有。", "excerpt": "厄立特里亚是个怎么样子的国家？之前知道这国家是非洲曹县，不过一直有点弄不明白是怎么回事。直到查了人口数据才给我吓了一跳，算是理解了。我之前就知道，厄立特里亚跟埃塞是世仇。1961年到1991年，厄立特里亚打了三十年的独立战争，才从埃塞独立出来。独立没几年，1998年又因为争夺边界跟埃塞打了两年的大规模战争。之后从2000年一直到2018年，两国关系一直冰封，商贸、边界完全断绝。2018年宣布搞了什", "url": "https://www.zhihu.com/pin/2093784046950265198", "votes": 0, "comments": 10, "feed_ts": 1791986919, "feed_time_str": "10-14 22:08", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "大水哥", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何理解欲买桂花同载酒，终不似，少年游？", "excerpt": "人无法同时拥有青春和对青春的理解。", "url": "https://www.zhihu.com/question/646081550/answer/1929091709666567421", "votes": 5327, "comments": 89, "feed_ts": 1791984311, "feed_time_str": "10-14 21:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待2026年10月15日A股市场行情？", "excerpt": "科技板块大跌，还有不少朋友在问科创相关的问题，找我要科创逃生3.0。 今天跟大家聊聊我的科创逃生指南系列吧，这套内容我是发在公开平台的，而且大家可以回头去看，基本都有文字依据和时间线。 7月2号，是这波科创、科技板块的高点，当时我出了科创逃生指南1.0。 科技逃生指南到7月21号，科创拉出一波大涨，我出了科创逃生指南2.0。 科创逃生指南 2.0等到9月16号，科创开始反弹，我给到了科创逃生指南3", "url": "https://www.zhihu.com/question/2088655470512940006/answer/2093812895226270521", "votes": 61, "comments": 14, "feed_ts": 1791983896, "feed_time_str": "10-14 21:18", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": " 了，2500一晚，确实可以进核心区，但除了可以穿衣服，任何产品都不准带进去。看攻略提前买了一次性胶卷相机，但根本不让带，因为是核心区，不只电子产品，任何外来物品都不准带。只能在门口租管理区的相机。所以，我觉得还是挺严的。所谓进核心区也没什么，毕竟工作人员也要进。天眼其实也没什么好看的，就是一堆铁架子而已，但是一来奔着给孩子留个印象，二来也是变相支持天眼建设才定了这么个行程。2500的价格确", "url": "https://www.zhihu.com/question/2092676319515620288/answer/2093726079286563345", "votes": 9, "comments": 1, "feed_ts": 1791973234, "feed_time_str": "10-14 18:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "宇树王兴兴在工博会上说，明年的 GPT-7 有可能「击穿」具身智能现在的瓶颈，你怎么看？", "excerpt": "具身智能炒作_的毅种循环： Qwen-2-vl发布后：LLM是邪路，VLA才是未来Seedance-2.0发布后：VLA是邪路，WAM才是未来GPT-6-astra发布后：WAM是邪路，LLM才是未来", "url": "https://www.zhihu.com/question/2093281358667956441/answer/2093423909202876256", "votes": 403, "comments": 31, "feed_ts": 1791972878, "feed_time_str": "10-14 18:14", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "平凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "2021 年，Anthropic 就已经想到了今天 AI 的发展方向？最近，一份 Anthropic 写于 2021 年 7 月的内部研究路线图《Concise Research Roadmap》被重新翻了出来。据传播这份文件的人介绍，它是在相关版权诉讼中公开的。最有意思的是，当时 ChatGPT 还没有诞生，Claude 也不存在，但这份五年前的研究计划中，已经出现了很多今天 AI 行业最热门的研究方向。我把其中几个方向和过去五年的实际进展整理成了一张图。对应关系确实很有意思：模型自我评价 → 2022 年的 Constitutional AI 和 RLAIF，让 AI 参与评价、批评和改进其他 AI 的输出。代码 Agent → 2025 年的 Claude Code，从编写函数、发现 Bug，发展到自主执行复杂的软件工程任务。强化学习与工具使用 → 2024 年的 MCP 及后来逐渐成熟的工具生态，让模型能够连接和使用外部系统。不过 MCP 是连接协议，并不是强化学习技术本身。模型可解释性 → 2024 年的特征映射、2025 年的电路追踪，让我们开始能够观察大模型内部的部分计算机制。安全与对齐 → 尽管模型能力突飞猛进，但如何保证高度自主的 AI 始终安全、可控，至今仍然是尚未解决的问题。当然，不能因为今天有了 Claude Code，就说 Anthropic 在 2021 年已经准确预言了这款产品。研究方向、技术路线和具体产品，是三个不同的概念。但我觉得，这份文件真正厉害的地方，并不是预测中了几个产品，而是它在五年前就已经抓住了 AI 发展的几个核心问题。尤其是 Agent。今天大家讨论的 AI Agent，本质上是在解决一个问题：如何让 AI 从一个被动回答问题的工具，变成一个能够自主完成任务的系统？模型需要能够判断自己的输出是否正确，调用工具，在真实环境中执行任务，并在执行过程中不断修正错误。而当这些能力逐渐实现后，另一个问题就变得越来越突出：我们究竟能不能理解和控制这些自主运行的 AI？这也是这份路线图中最有意思的反差。五年前设想的能力，有不少已经成为现实；五年前担忧的安全问题，却没有随着模型能力的增长而自动消失。我认为，判断一家 AI 公司有没有长期竞争力，不能只看它最近发布的模型在排行榜上提高了几分。更值得关注的是，它在五年前究竟选择研究什么问题，以及今天是否仍然围绕这些问题持续积累技术。从这个角度来说，Anthropic 这份路线图，比一份普通的产品发布计划有价值多了。原始文件：链接", "excerpt": "2021 年，Anthropic 就已经想到了今天 AI 的发展方向？最近，一份 Anthropic 写于 2021 年 7 月的内部研究路线图《Concise Research Roadmap》被重新翻了出来。据传播这份文件的人介绍，它是在相关版权诉讼中公开的。最有意思的是，当时 ChatGPT 还没有诞生，Claude 也不存在，但这份五年前的研究计划中，已经出现了很多今天 AI 行业最热门的", "url": "https://www.zhihu.com/pin/2093762756721877289", "votes": 0, "comments": 1, "feed_ts": 1791972092, "feed_time_str": "10-14 18:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "机器之心发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "API限时五折！Gemini 4 Argon来了，几周完成数月编程工作谷歌 Gemini 4，终于来了！视觉、文字、编程……各方面能力都提升不少，还能分析财报、设计新酶、发现医院漏洞，甚至训练机器人零样本完成了任务！目前Argon 的 API 定价定为输入 2 美元 / 百万 tokens，输出 10 美元 / 百万 tokens，限时优惠，大家快去看看吧！", "excerpt": "API限时五折！Gemini 4 Argon来了，几周完成数月编程工作谷歌 Gemini 4，终于来了！视觉、文字、编程……各方面能力都提升不少，还能分析财报、设计新酶、发现医院漏洞，甚至训练机器人零样本完成了任务！目前Argon 的 API 定价定为输入 2 美元 / 百万 tokens，输出 10 美元 / 百万 tokens，限时优惠，大家快去看看吧！", "url": "https://www.zhihu.com/pin/2093759392860599660", "votes": 0, "comments": 0, "feed_ts": 1791971208, "feed_time_str": "10-14 17:46", "category": "pin", "cat_name": "想法动态"}, {"actor": "alex01", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "黄金白银，提防老破小。", "excerpt": "黄金白银，提防老破小。 黄金白银又又又跌了，涨个1-2天，就跌个3-4天，白银已经又去测试我们喊了两个月的“58美元/盎司”了，黄金好点儿，还在41xx这里厮混（东八区20261014的下午）。 先不说我们已经规划了几个月的黄金的3500以下 到 2xxx美元/盎司能否实现，也不说白银的3x 2x美元/盎司是不是虚惊一场，先说眼下的： 1）今天的原油是跌的，不是原油涨，黄金白银跌么？那反过来，原油", "url": "https://zhuanlan.zhihu.com/p/2093741853225100314", "votes": 25, "comments": 18, "feed_ts": 1791970358, "feed_time_str": "10-14 17:32", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "巴西的问题是社会治理能力的问题，不是左右立场的问题。认为赢得胜利取决于道德而不是能力似乎是某些群体的通病。", "excerpt": "巴西的问题是社会治理能力的问题，不是左右立场的问题。认为赢得胜利取决于道德而不是能力似乎是某些群体的通病。", "url": "https://www.zhihu.com/pin/2093684563830642552", "votes": 0, "comments": 5, "feed_ts": 1791969830, "feed_time_str": "10-14 17:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "v  "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "间谍一般是怎么暴露的？", "excerpt": "当年四川省国安玩过一个大的，大约在2008年前后。 一帮韩国佬，在成都市成温立交桥的国安大楼斜对面开了一家韩国烧烤，据说还是个情报交易站，具体不清楚，可能以为是灯下黑吧，只是一个据点。 然后这个地方早被兄弟们摸透了，于是.......让收网抓人那天，一大群年轻单身汉们涌进了（注意这个“涌”）这家烧烤店，以饿死鬼投胎的气势疯狂下单最贵的菜品，还有韩国烧酒（全是进口的） 结账的时候带队领导非常轻巧的挥", "url": "https://www.zhihu.com/question/15657752722/answer/2093641745984643191", "votes": 5029, "comments": 286, "feed_ts": 1791963608, "feed_time_str": "10-14 15:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "清华提出Jev-LDE：ICL示例只改一次，1-shot平均准确率就能暴涨", "excerpt": "大模型做 In-Context Learning（ICL，上下文学习）时，通常会先从示例库里检索若干 demonstration，再把这些示例和当前问题一起放进 prompt。 但检索得到的 Top-K 并不一定适合目标模型。示例过多会增加上下文和推理成本，无关或重复的示例也可能影响模型对当前问题的判断。 如果直接从候选池里重新寻找最优的 k 个示例，组合数量会迅速增加；一些 model-awar", "url": "https://zhuanlan.zhihu.com/p/2093726777143252369", "votes": 7, "comments": 1, "feed_ts": 1791963600, "feed_time_str": "10-14 15:40", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "陈子龙是如何看待钱谦益抢了自己老婆柳如是？", "excerpt": "陈子龙当时身负海内大名。柳如是想以身相许托付给他。她从盛泽赶到松江，多次递名帖求见，帖子上自称为 “女弟”。陈子龙为人严正，难以亲近，柳如是于是转而归向虞山的钱蒙叟（钱谦益）。此事记载于《华亭县志》，钮琇《觚剩》。 清・袁枚《题柳如是画像》： 怀刺黄门悔误投，遗珠草草尚书收。陈子龙，官兵科给事中，俗称黄门；钱谦益，官礼部尚书。 陈子龙（大樽）生性喜欢谐趣调侃。有一天，众人聚在宋子建（宋存标）的书斋", "url": "https://www.zhihu.com/question/510846319/answer/2089455524337210655", "votes": 6, "comments": 0, "feed_ts": 1791963544, "feed_time_str": "10-14 15:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你觉得哪一项计算机技术被大众严重低估了？", "excerpt": "大众，甚至包括相当一部分软件从业者，严重低估了数据物理编排与列式存储这一整套底层的技术体系。 也就是Data Layout、高效序列化以及由此衍生的零拷贝与现代索引机制。 大家总以为算力是卡脖子的关键，模型架构是业务的灵魂。其实在真实的工业级生产环境里，不管是万卡集群的预训练，还是毫秒级响应的在线实时推理与知识库检索，真正把系统拖垮的、真正让公司每个月烧掉几百万额外云服务费账单的，从来都不是浮点数", "url": "https://www.zhihu.com/question/2078550836104394358/answer/20937260663764463 const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

每道菜由谁共享，再输入税费和小费。每道菜的费用由选中的人均摊，最后计算账单。聚餐采购清单也可以调整参加人数，查看对应的食材数量。学习概念时，可以改变图中的输入，观察结果怎样变化。界面随回答生成，纯文字仍保留Intelligent UI背后有原生的流式组件库和编译器。模型选择内容、布局及交互方式，编译器在生成过程中处理界面，组件可以逐步显示，不必等整段回答写完。GPT-6也能在继续思考时开始回答。界面形式仍取决于问题：适合纯文字的内容会继续用文字，交互设计判断和可创建的体验还在改进。付费套餐用Sol，Free与Go用LunaPlus、Pro、Business、Enterprise使用GPT-6 Sol；Free与Go使用GPT-6 Luna。两者都针对日常对话调校。推出顺序是先面向上述付费套餐，再从发布次日起扩展到Free与Go；Enterprise还取决于工作区管理员设置。本次更新只涉及ChatGPT的聊天页签，Work和Codex所用模型不变。试算、规划和学概念，可以从一个具体任务开始，例如按菜品参与者分账，或调整聚餐人数生成采购清单。涉及金额时，仍要核对输入与分摊结果；交互界面本身不证明计算正确。", "excerpt": "GPT-6 现已面向所有ChatGPT用户上线GPT-6 与 Intelligent UI 现已面向所有ChatGPT用户上线聚餐分账时，ChatGPT的回答可以直接给出一张能填写、勾选的表单。OpenAI正在向ChatGPT推出GPT-6和Intelligent UI（智能交互界面）：把文字、图形、按钮和表单组合进回答，让日常规划、复杂概念解释和临时小工具都能在对话里展开。分账表单能勾选谁吃了哪", "url": "https://www.zhihu.com/pin/2091703109017940128", "votes": 0, "comments": 0, "feed_ts": 1791480908, "feed_time_str": "10-09 01:35", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待Anthropic？", "excerpt": "总有人假设百度这种不干人事的公司做大做强会发生什么，现在有答案了感谢A\\，要是没有它的贡献，我们永远想不到百度有了实力会做什么", "url": "https://www.zhihu.com/question/2009617201540405001/answer/2082499917642311203", "votes": 1016, "comments": 17, "feed_ts": 1791479185, "feed_time_str": "10-09 01:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "PAIR：用反事实续跑找出有害摘要，再修订压缩提示词\n图文版：链接PAIR从同状态续跑识别有害摘要，再修订压缩提示词PAIR保持任务agent和压缩器的模型参数固定，在历史被摘要替换的时点恢复相同环境，分别用原历史与压缩历史继续执行。两边不再压缩，重复采样比较后续成功率和步数，识别遗漏状态、误述进度或多余恢复操作。它只修订结构化模板内的指导语，保持字段和格式，再生成五个候选，用完整任务验证选择提示词；并非只根据最终失败猜测哪次摘要出了问题。AppWorld三次全成功比例80.4%，步数仍高于不压缩AppWorld test-normal有168题，主实验agent和压缩器均为GPT-5.6 Luna，汇总三次独立运行。Pass3指三次都成功的题目占比，Acc.是平均成功率。让压缩器读取固定前缀时，PAIR的Pass3为80.4%，不压缩为78.6%；平均成功率为85.9%对84.1%。峰值输入从12.53千降到9.47千token，平均步数却从12.1增到15.2。固定前缀在两种压缩方式下都原样保留，区别是压缩器能否读取。办公和零售任务的可靠性仍低于完整历史在被测压缩方法中，PAIR在三个主基准与两种压缩设置里的Pass3均最高，但未普遍超过不压缩。以前缀为条件时，OfficeBench为72.6%对75.8%，τ²-Bench Retail零售任务为60.0%对72.5%。AppWorld的数值优势不能扩展成所有长任务都更可靠，也不能把80.4%解读成三次中至少一次成功；后者对应另一个指标Pass@3。峰值缩短不保证省token，离线适配需要回放状态累计token计入agent和压缩器的全部输入输出。相对不压缩，PAIR在AppWorld用量基本相当，OfficeBench少约15%—19%，零售任务却多约12%。适配还需要保存环境状态并配对运行到结束，成本随压缩次数和剩余任务长度增长，更适合可回放或模拟环境。选定提示词后部署无需额外诊断调用，但环境和工具显著变化时可能要重新适配；总token也不能直接代表费用或延迟。原文标题：Adapting Context Compression for Long-Horizon Agents with Counterfactual Continuations#无影寺 ", "excerpt": "PAIR：用反事实续跑找出有害摘要，再修订压缩提示词\n图文版：链接PAIR从同状态续跑识别有害摘要，再修订压缩提示词PAIR保持任务agent和压缩器的模型参数固定，在历史被摘要替换的时点恢复相同环境，分别用原历史与压缩历史继续执行。两边不再压缩，重复采样比较后续成功率和步数，识别遗漏状态、误述进度或多余恢复操作。它只修订结构化模板内的指导语，保持字段和格式，再生成五个候选，用完整任务验证选择提示", "url": "https://www.zhihu.com/pin/2091694665372263477", "votes": 0, "comments": 0, "feed_ts": 1791479021, "feed_time_str": "10-09 01:03", "category": "pin", "cat_name": "想法动态"}, {"actor": "Tools boy", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "古人是如何克服古法编程中那么多负反馈的？", "excerpt": "我反而觉得vibe coding在目前的工作环境和团队协作中有大量负反馈。 上面不懂技术的老板们觉得我都给你们买这么多token了，工期应该压缩10倍。 下面很多缺乏基础知识/责任心的开发者，制造垃圾的成本大幅降低，导致code review成本极速攀升，项目加速腐化。说说我和不同公司的朋友亲身经历或者听说的一些事。 1. 交付的项目工期被大幅压缩，原来的技术评审环节被迫取消，搞了一套ai自动化编", "url": "https://www.zhihu.com/question/2075563449472630795/answer/2082028013181482594", "votes": 220, "comments": 27, "feed_ts": 1791478836, "feed_time_str": "10-09 01:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Unsloth：在本地训练属于自己的决策模型了Unsloth：现在你可以像 Jev 一样，在本地训练属于自己的决策模型了给客服工单分部门、判断是否要求退款，程序需要明确选项。Unsloth 新增了本地决策模型训练能力：把 Qwen3.5-0.8B 这样的语言模型，训练成直接输出选项和概率的模型。这组实验用了4GB显存。一张工单，同时判断三个问题Unsloth 的演示输入是一条重复扣款投诉：用户要求当天退回多扣的钱。模型一次判断工单交给哪个部门、是否涉及退款、紧急程度。输出里，“账单部门”的概率是93%，“退款”的概率是75%，“今天处理”的概率是92%。这些是这条工单的预测概率，不能当成三个任务的准确率，也不代表系统已经执行了退款。给模型加一个选项评分头常见聊天模型会逐字生成解释。这种决策模型把工单、问题和候选选项一起读入，用 Clef 评分头给选项打分，再返回选择和概率，不生成一大段回答。训练还用到了 LoRA：通过少量新增参数调整模型。你需要准备带正确答案的例子，每条包括输入内容、问题和答案；只塞一堆没标注的文档还不够。74.3%对应三个决策基准Unsloth 报告，Qwen3.5-0.8B 在三个决策基准上的综合准确率从20.7%升到74.3%，提高53.6个百分点。拆开看：结构化决策测试 typed-decisions 从36%到73%，用户意图识别测试 BANKING77 从7%到74%、CLINC150 从19%到76%。识别意图，就是判断用户在表达哪类需求。指南列出的测试集合计3000条，结果属于这组评测，不能直接换成你家客服业务的准确率。指南另列的78%是留出数据上的准确率，和74.3%的综合指标分开记录，不能混着引用。Qwen的4GB训练需配合标注数据Unsloth 已提供界面训练入口，可选择模型、启用决策模型训练并导入数据。对工单分流这类输入和候选答案清楚的任务，这给出了本地训练的路径。4GB是这次 Qwen3.5-0.8B 实验的训练显存占用，不是所有模型的配置要求，也不是电脑总内存。指南介绍与操作示例的训练轮数、LoRA参数存在差异，复现前还需核对配置；这些材料也没有提供与 Jev 同口径的速度和成本对比。", "excerpt": "Unsloth：在本地训练属于自己的决策模型了Unsloth：现在你可以像 Jev 一样，在本地训练属于自己的决策模型了给客服工单分部门、判断是否要求退款，程序需要明确选项。Unsloth 新增了本地决策模型训练能力：把 Qwen3.5-0.8B 这样的语言模型，训练成直接输出选项和概率的模型。这组实验用了4GB显存。一张工单，同时判断三个问题Unsloth 的演示输入是一条重复扣款投诉：用户要求", "url": "https://www.zhihu.com/pin/2091693376148075672", "votes": 0, "comments": 0, "feed_ts": 1791478600, "feed_time_str": "10-09 00:56", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude Haiku 5.5Claude Haiku 5.5：Claude的成本最低、速度最快、能力最强的小模型批量做摘要、分类、上下文压缩，每次调用的价格会累积成整项任务的成本。Anthropic推出Claude Haiku 5.5：提示词不超过10万token时，输入、输出单价均比Haiku 4.5低90%，适合先拿这些高频小任务测试。10万token内单价降90%，超过则降50%价格按提示词长度分档。每百万token，10万以内的输入、输出分别为0.10、0.50美元；超过10万，则变成0.50、2.50美元，仍比4.5低50%。token是模型计量文本的单位，不等同于字数。“平均运行成本低约75%”包含了请求长度分布和完成任务所用token的变化。上一代约90%的请求落在较短一档，但这不能保证你的账单也降75%。同样的输入，新版约多算30%tokenHaiku 5.5换了分词器，迁移指南给出的口径是：同样的输入文本，token数约增加30%，具体随内容变化。原本贴近10万门槛的提示词，换模型后可能进入更贵一档，输出上限和成本预算也要重算。它还首次加入可调思考力度，并默认开启自适应思考。简单任务可以降低力度，让模型少思考；实际要花多少，还取决于输入输出量和完成任务的过程，不能只比较每百万token单价。摘要和子任务先试，复杂编码仍留给大模型Haiku 5.5面向摘要、压缩、数据库查询和分类，也可以作为subagent，即接手子任务的agent，与Opus 5.5或Sonnet 5.5配合。Anthropic公布的Terminal-Bench 4.0终端任务评测里，Haiku 5.5的单次尝试通过率为39.2%，Sonnet 5.5为70.6%。这组发布者评测支持按任务分工，不能据此认为低价模型可以接替所有复杂编码工作。Claude Platform和Claude Code已可用；AWS、Google Cloud、Microsoft Azure也已提供。开发者调用的模型ID是claude-haiku-5-5。旧API集成还需检查思考与采样参数，不能只换模型名就上线。先用现有摘要、分类或查询任务，对照完成质量、耗时和整项成本；长链路编码继续交给Sonnet或Opus。Haiku 5.5是否省钱，要按它实际接走的工作验收。", "excerpt": "Claude Haiku 5.5Claude Haiku 5.5：Claude的成本最低、速度最快、能力最强的小模型批量做摘要、分类、上下文压缩，每次调用的价格会累积成整项任务的成本。Anthropic推出Claude Haiku 5.5：提示词不超过10万token时，输入、输出单价均比Haiku 4.5低90%，适合先拿这些高频小任务测试。10万token内单价降90%，超过则降50%价格按提", "url": "https://www.zhihu.com/pin/2091692518090057024", "votes": 0, "comments": 0, "feed_ts": 1791478411, "feed_time_str": "10-09 00:53", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为何突然有人黑汉武大帝了?", "excerpt": "首先，得说明一点： 汉武帝大规模被贬斥，是从宋朝开始的。 宋朝之前，并未有宋朝之前，汉武一直处于褒贬不一的态度。 而且，宋朝之后，汉武同样还是处于褒贬不一的态度。 只有宋朝从皇帝到士大夫，整个群体都对汉武瞧不上。 并且其中以高宗赵构的评价“ 穷边黩武，天下骚然”最为严重。而说这件事的原因是为什么呢？ 其实答案很简单： 因为从古至今，所有对于汉武的评价，实际上都是建立在自身立场上的，而非单纯的评价。", "url": "https://www.zhihu.com/question/1948436480344187186/answer/2085502308834715554", "votes": 90, "comments": 5, "feed_ts": 1791478292, "feed_time_str": "10-09 00:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Nano Banana 2.1:最新的图像生成和编辑模型做海报、给商品换背景、连续修改角色图，都需要控制画面细节。Google 发布图像生成与编辑模型 Nano Banana 2.1，升级了视觉设计、蒙版编辑（指定局部区域修改）和主体一致性，也就是让同一人物或商品在修改后保持特征。局部修图要同时说明改哪里、保留什么局部修改可以用自然语言指定。Google 的图片编辑文档给出过客厅示例：把蓝色沙发换成复古棕色皮革沙发，同时保留其余画面的风格、光线和构图。这种写法把修改对象与保留条件分开说明。它是编辑提示的用法示例，不能保证其他区域逐像素不变；交付前还要对照原图检查。局部编辑与多人物一致性评分高于前代Google 模型卡中，开启思考的 Nano Banana 2.1 在蒙版／涂画编辑上得分 1049±15，Nano Banana 2 同配置为 965±12；多人物一致性为 1106±14，对比 978±10。这些是人类成对比较产生的偏好评分，分数更高代表更受评审偏好，不能读成正确率。对照表比较的是 Google 自家模型。Arena 在 10 月 7 日发布的排名快照中，把它列为多图编辑第 4、文生图第 5、单图编辑第 6。这提供了外部比较视角，也不支持“所有任务全面领先”的结论。Gemini 等七个入口开始陆续上线Google 从发布当天起，向 Gemini App、搜索 AI 模式、Google AI Studio、Flow、Stitch、Google Ads 和 Gemini Enterprise Platform 陆续推出。不同入口是否已开放，需要以实际账号界面为准。开发者对应的 API 模型名为 gemini-nano-banana-2.1。Google 的发布说明与模型卡未给出统一任务下的速度与总成本横评，不能据此承诺更快或更省。连续改图适合试，文字和人物细节仍需验收Nano Banana 2.1 在 Google 的前代对比中获得了更高的局部编辑与一致性评分，适合拿已有素材测试多轮修改。模型卡仍列出人物一致性不完美、局部指令只被部分遵循、涂画痕迹残留等限制。小字在 1K 图中可能模糊，长段文字也可能出错。每轮修改后检查人物特征、商品细节、文字和未要求修改的区域，合格后再继续下一轮。", "excerpt": "Nano Banana 2.1:最新的图像生成和编辑模型做海报、给商品换背景、连续修改角色图，都需要控制画面细节。Google 发布图像生成与编辑模型 Nano Banana 2.1，升级了视觉设计、蒙版编辑（指定局部区域修改）和主体一致性，也就是让同一人物或商品在修改后保持特征。局部修图要同时说明改哪里、保留什么局部修改可以用自然语言指定。Google 的图片编辑文档给出过客厅示例：把蓝色沙发换", "url": "https://www.zhihu.com/pin/2091691729594405207", "votes": 0, "comments": 0, "feed_ts": 1791478201, "feed_time_str": "10-09 00:50", "category": "pin", "cat_name": "想法动态"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "在美国说“I is XXX.”（而不是“I am XXX.”）真的没人能听懂吗？", "excerpt": "正常人对外国人说本国语言的容忍度非常之高。 这个无关民族。 想当年我去纽约参展，一口一个 “what’s your problem？”（你有毛病吗？） 20多个老美听了这也没说啥，该问参数问参数。 语言是分语境的，你看见一个老外兴奋的向你一边招手一边大声喊：“我操你妈！我！操！你！妈！” 你也不太会觉得他是在骂你，而是被中国人搞了。 ", "url": "https://www.zhihu.com/question/637051579/answer/2090815747681534400", "votes": 7992, "comments": 295, "feed_ts": 1791478201, "feed_time_str": "10-09 00:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "《美少女万华镜》15周年完全收藏版开发完成，八宝备仁也绘制了一张贺图。游戏将于 10月30日 正式发售，售价16500日元，收录了系列5部正传和1部外传，并将系列前三部的动画场景升级到了更高画质。包装采用了八宝备仁绘制的15周年纪念图，还附赠亚克力装饰板特典。 ", "excerpt": "《美少女万华镜》15周年完全收藏版开发完成，八宝备仁也绘制了一张贺图。游戏将于 10月30日 正式发售，售价16500日元，收录了系列5部正传和1部外传，并将系列前三部的动画场景升级到了更高画质。包装采用了八宝备仁绘制的15周年纪念图，还附赠亚克力装饰板特典。 ", "url": "https://www.zhihu.com/pin/2091562210585847397", "votes": 0, "comments": 0, "feed_ts": 1791478151, "feed_time_str": "10-09 00:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "一款和原神同类型，但比原神更强的游戏应该是怎么样的？", "excerpt": "我说个暴论，原神很有可能把未来回到巅峰状态下的中华文化精神风貌展示出来了。 强大民族的文化产品，一定要讲天下主义。某种程度上也可以叫国际主义，但我喜欢叫天下主义，它也应该叫天下主义。这俩本质上是一个来源，但表现是有很大差别的。 那么原神的“天下主义”体现在哪？很简单，它能观察其他地方的文明，考据相当详细， 大概率比当地人做的还要好。你别以为这很简单，这实际上干的是张骞、玄奘的事。到了其他文明区域，", "url": "https://www.zhihu.com/question/515163737/answer/1920811246934008508", "votes": 716, "comments": 92, "feed_ts": 1791478041, "feed_time_str": "10-09 00:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "EmbeddingGemma 2：首个多模态端侧嵌入模型用一句话找相册里的图片，用语音定位视频中的一段画面，都可以在设备本地完成。Google DeepMind 发布的开放检索模型 EmbeddingGemma 2，把文字、代码、图片、音频和视频放进同一个检索空间，开发者可以据此做离线搜索，无需先把私人资料传到云端。文字、语音和视频可以互相检索它把不同格式的内容转换成一串数字，也就是“向量”。应用先为资料建立索引，再把搜索请求转成向量，按相似程度找出匹配内容。Google AI Edge Gallery 的视频演示中，输入“有人吹生日蜡烛”，就能定位对应时刻。EmbeddingGemma 2 负责找资料；需要根据资料回答问题时，还要搭配 Gemma 4 等生成模型。完整模型7.4亿参数，文字搜图加载4.4亿完整模型包含2.7亿参数的文字部分、1.7亿视觉模块和3亿音频模块。只搜文字可不加载后两者；文字加图片检索则加载4.4亿参数，需要音频检索时再加载音频模块。在 Pixel 11 Pro 上，加载量化后的完整模型权重，占用内存可低至约567MB；纯文字权重约191MB。索引、媒体处理和运行时也要占内存，这两个数字不等于整个应用的总占用。128维省空间，多模态检索分数下降把每条向量从768个数字缩到128个，向量本身的存储量可降至六分之一。但在多模态评测 MMEBv2 中，综合分数从59.01降到45.65。模型卡这些成绩使用全精度版本，不能直接当作手机量化版的效果保证。Google DeepMind 发布的图像、音频对比图中，都有分数高于 EmbeddingGemma 2 的大模型。它的设备端体积与跨格式检索能力，不能等同于所有检索任务都排第一。中文搜图和中文语音搜图需分别测试有人用8核 CPU、自编译 llama.cpp 分支和 Q8（8位）量化版做的小测试中，中文文字搜23张照片，22张的目标图片排在第一；另用5条合成的中文语音搜图，仅1条的目标图片排第一。样本很小，音频实现也仍是实验性的，尚不能分清问题来自模型还是实现。这份结果提醒开发者：支持中文、支持音频，不等于每种组合都有同样效果。EmbeddingGemma 2做本地检索，应用负责建索引EmbeddingGemma 2 能把查询与图片、音视频转成可比较的向量，支持本地找资料。Android 和 iOS 的 Google AI Edge Gallery 已加入 Instant Media Search 和 Video Moments Finder，可体验本地图片搜索及视频片段定位。", "excerpt": "EmbeddingGemma 2：首个多模态端侧嵌入模型用一句话找相册里的图片，用语音定位视频中的一段画面，都可以在设备本地完成。Google DeepMind 发布的开放检索模型 EmbeddingGemma 2，把文字、代码、图片、音频和视频放进同一个检索空间，开发者可以据此做离线搜索，无需先把私人资料传到云端。文字、语音和视频可以互相检索它把不同格式的内容转换成一串数字，也就是“向量”。应用", "url": "https://www.zhihu.com/pin/2091687664374247840", "votes": 0, "comments": 0, "feed_ts": 1791477238, "feed_time_str": "10-09 00:33", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI发布内部模型产生的719份新数学成果OpenAI公开的这批AI数学成果，已经开始经历修订：首次发布722份手稿，10月7日更新撤回3份，目录变为719份。它们能否成为可信的新数学知识，要看逐项核验。722份手稿按372组整理这批成果来自尚未发布的内部前沿模型。372个成果组里，同组可以包含主结果、配套论证、推论或另一种证明。因此，722份手稿不能直接换算成722个已确认的独立数学突破。一处符号错误连带撤回3份OpenAI的更新记录解释，一份手稿存在符号错误，使其中一段论证失效；另两份手稿依赖相关构造，也随之撤回。这说明核验还要检查结果之间的依赖关系：上游论证失效，下游就需要重新审视。三份撤回也不能据此推成其余手稿全部有误。约42%的主要结果已形式化OpenAI仓库报告的进度是300/719，约42%的主要结果已形式化。形式化是把命题和证明写成计算机可以检查的形式，用Lean这样的证明工具核验推导。这个比例不等于所有手稿已通过同行评审。还需要确认形式化命题是否对应原本的问题、使用了哪些前提，以及结果是否具有新颖性；“有机器可检查的证明”和“人类已充分理解其数学意义”也有区别。顾问组要求支持人类理解OpenAI咨询独立数学与人工智能顾问组，是参考成果发布建议，并不等于顾问组认证了这些证明。建议要求尽可能提供形式化证明、说明验证状态，并支持社区主导的人类理解工作；它同时反对用科学界无法访问的专有模型测试高等数学问题。模型仍未开放，3小时说的是算力公开的是成果材料，模型本身仍未发布。大多数结果采用同一流程，平均计算量相当于ChatGPT Pro思考约3小时；这不是现有Pro用户随便提一道难题、等3小时就能得到有效证明的承诺。判断这批成果的进展，更有用的是追踪具体手稿的修订、精确命题和验证状态。公开材料让逐项检查成为可能；哪些成果能站得住，仍要落实到各自的证明和依赖条件。", "excerpt": "OpenAI发布内部模型产生的719份新数学成果OpenAI公开的这批AI数学成果，已经开始经历修订：首次发布722份手稿，10月7日更新撤回3份，目录变为719份。它们能否成为可信的新数学知识，要看逐项核验。722份手稿按372组整理这批成果来自尚未发布的内部前沿模型。372个成果组里，同组可以包含主结果、配套论证、推论或另一种证明。因此，722份手稿不能直接换算成722个已确认的独立数学突破。", "url": "https://www.zhihu.com/pin/2091686386302711252", "votes": 0, "comments": 0, "feed_ts": 1791476982, "feed_time_str": "10-09 00:29", "category": "pin", "cat_name": "想法动态"}, {"actor": "Augenstren", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "五常到底有多牛?", "excerpt": "美国8720万头 中国内地7030万头+台湾省15.57万头 俄罗斯1740万头 法国1650万头 英国940万头 2024年全球家牛饲养数量统计 ", "url": "https://www.zhihu.com/question/642844823/answer/2088647534684141168", "votes": 3630, "comments": 277, "feed_ts": 1791475862, "feed_time_str": "10-09 00:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "矩阵乘法的复杂度能达到多低？", "excerpt": "照例先震惊瘫坐一下，OpenAI 已将矩阵乘法的指数因子从 2.371177 优化到了 2.25。 而过去 30 年人类的纯手工突破总结一下就是从 2.3755 一路推进到了 2.371552，小数点后四位 0.0003 的提升。 单看这个形式就能知道 AI 的方法一定非常的漂亮，反而是人类的做法丑陋无比，堪称屎山雕花。 朴素矩阵乘法矩阵乘法可以说是整个计算机科学与现代应用数学的基石。 自矩阵发明", "url": "https://www.zhihu.com/question/469164809/answer/2091678974917321764", "votes": 718, "comments": 35, "feed_ts": 1791475129, "feed_time_str": "10-08 23:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "冷哲", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么我觉得郭沫若的《天狗》很尬？", "excerpt": "大文学家就是大文学家，精神状态领先的不行， 哥们隔现代社交平台上妥妥的就是领军人物，一天仨词条那种，什么《羡慕精神状态》，什么《我们颠佬老了就这个样》。 郭沫若才不管你这你那，他只会留一头微分寸头，穿着干净整洁，继续在他的十年前破破烂烂小黑本联想笔记本电脑上优雅的敲出 “我踏马要跟一切落后腐朽的东西爆了！”", "url": "https://www.zhihu.com/question/447197121/answer/36031779920", "votes": 2350, "comments": 3, "feed_ts": 1791474760, "feed_time_str": "10-08 23:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", 俄国不少地方了。最大的感觉是：俄国的公共治理水平运作正常完善，基本民生物资价格稳定。莫斯科和圣彼得堡的物价低可能是保证物资供应，海参崴可能是因为靠近中国得到了一定供应，但我这次还去了维堡，完全的一座小城市，感觉当地超市的物价甚至比莫斯科还要低，而且加油站我看也有汽油，92/95/98号汽油的价格是74/85/99卢布（自己去除12.5）。6.俄罗斯的公共治理感觉也很正常。坐了火车、机场、地铁，体验都很好，都很准时。地铁尤其厉害，莫斯科的地铁高峰期30秒一趟（我真的是数着秒表看的，一辆地铁开走28秒下一趟就进站了）。中间还赶上了一次乌克兰的大规模无人机袭击，但机场运作十几个小时就恢复正常了。实际观感而言，乌克兰人想要摧毁俄国人的“现代生活”，还有很远的路要走。7.当然，支付和网络的问题也有。但由于小红书的发达和AI的进步，搞定这些事其实也没什么门槛。8.考虑到申根签的麻烦（提前锁定机酒之类的破事）。我的观感是，对于中国人来说，俄罗斯作为旅游目的地可以算是某种程度的欧洲平替。", "excerpt": "俄罗斯旅行杂感1.秋天的俄罗斯天确实蓝，云真的大，大片大片的云朵和蓝天，配上色彩斑斓的建筑——欧洲的近代建筑就是有色彩优势，随便一拍就是片。我旅行一般不爱拍太多风景照，这次在俄罗斯拍的可能等于之前几次之和。2.人的素质确实很高：鸽子在人行道散步，海鸥（？）不知道什么鸟，直接在大街上贴着人的肩膀飞过；过人行道的时候几乎绝对地车让人，我去过国内许多城市，绝对没有任何地方达得到这个水平。3.冬宫确实值得", "url": "https://www.zhihu.com/pin/2091579744949163398", "votes": 0, "comments": 32, "feed_ts": 1791467631, "feed_time_str": "10-08 21:53", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "10.8 美元走强、债市冲击下的纳斯达克和美国科技行情分析", "excerpt": "昨天到今天凌晨，发生不少事：全球债市被砸，美联储发布了FOMC会议记录，还有最受瞩目的10年期美债拍卖。 美债需求强，但收益率继续涨昨天10年期美债最高中标利率5.300%，是2025年4月以来最高的中标利率。 但还是好于预期，发行前的交易利率为5.317%，所以中标利率比预期低了1.7个基点，这也是连续第5次拍卖出现美债需求好于预期的情况。 债券收益率这样涨下去，迟早会有投资者卖出一部分股票，转", "url": "https://zhuanlan.zhihu.com/p/2091627848595518930", "votes": 17, "comments": 2, "feed_ts": 1791467140, "feed_time_str": "10-08 21:45", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "2026 年巴西总统选举首轮投票无人胜出，将进行第二轮角逐，目前的形势如何？", "excerpt": "巴西人自己是这么看的。 ", "url": "https://www.zhihu.com/question/2090289046253839954/answer/2091181984693466634", "votes": 443, "comments": 47, "feed_ts": 1791466881, "feed_time_str": "10-08 21:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "众所周知X上有几大男女互相骑脸高热语言区，比如中韩，土耳其，西班牙。下图就是另一大高热区波兰。今天刷到一条有意思的波兰集美：你们波男可以喜欢亚洲女人，我们波女也可以喜欢黑人波男：我们和亚洲女人生下孩子拥有更高智商，你们的孩子智商只有70不到，我们波男赢非常有2015-2019年weibo的风格", "excerpt": "众所周知X上有几大男女互相骑脸高热语言区，比如中韩，土耳 category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "农民为什么穷啊？农民的产品真的不值钱吗？", "excerpt": "不是农产品不值钱，是工业化生产的初级农产品不值钱。 别看中国粮食便宜，美国粮食更便宜，因为工业化管理农场成本非常低，太阳一照产量就来了。 中国的问题有两方面， 第一是包产到户彻底断送了农业机械化和大农场路线。 中国农村就退回小农经济，生产初级农产品这一步动不了了。 实际上机械化之后解放劳动力还可以投入养殖、农产品加工、工厂等等实业， 农村有非常多的廉价劳动力限制，还有极其廉价的土地可以建工厂。 只", "url": "https://www.zhihu.com/question/2085631464121561616/answer/2091531449350594678", "votes": 10, "comments": 6, "feed_ts": 1791439957, "feed_time_str": "10-08 14:12", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "逢中必反的见多了，但逢中必挺的你见过吗？ 4次帮助中国撤侨，以一己之力对抗整个西方逢中必反的见多了，但逢中必挺的你见过吗？ 4次帮助中国撤侨，以一己之力对抗整个西方，甚至有人说：“中国第一艘航母说是这个国家送给中国的也不为过。”这个国家就是希腊，那么到底是什么原因，让希腊即便是隔着大半个地球却依旧对中国如此义无反顾？时间拉回到2011年那一年，整个中国的心几乎被揪到了一起，中国斥巨资买了艘航母瓦良格号，虽然说是航母，可它没有发动机、没有武器连电都没通，得拖船拉回来，按照正常速度两个月到大连不算太难，可偏偏从黑海到中国，有一段路必须经过土耳其控制的博斯普鲁斯海峡，面对中国的通行请求，土耳其狮子大开口以：“无动力巨型船舶通行风险大。”为由提出了两个严苛至极的要求：交10亿美元保证金，附带20条严苛到极致的条款，如果不然就把航母切成数段运输。消息一出举国震惊，不说10亿美金能买半艘新航母，更重要的是当时土耳其与美国交情甚笃，这份狮子大开口的决定到底从何而来自然不言而喻，为了争取瓦良格号回家，中国一趟又一趟的周旋，可是近500多天的交涉，土耳其却寸步不让，铁锈一层层往瓦良格号上爬，中国的谈判团队急得头发一把一把地掉，就在所有人都觉得这艘船大概要烂在黑海的时候，一个谁也没料到的国家站了出来——希腊，他以国家的名义向土耳其保证：“瓦良格号通行期间出任何事故一切我希腊国家承担。”这段话说出来容易，但你知道这意味着什么吗？因为一旦出事光赔偿就天价，而希腊把整个国家的身家性命去给别人的航母做担保，这不叫帮忙，这叫把命压上去了，更何况希腊当时还是北约成员国，美国的铁杆盟友替中国出头等于当着老大的面扇他嘴巴，可希腊偏偏就签了，甚至希腊不仅签了字还派出了大量的人手和最大马力的拖船，小心翼翼把瓦良格号送进了海峡，可就在所有人松一口气的时候，大风暴毫无征兆的冲向了爱琴海，让所有人再一次把心提到嗓子眼，巨浪掀起5层楼高6万吨的大船在海面上像个失控的陀螺疯狂打转，随时可能撞粉碎，希腊海岸警卫队没有犹豫顶着能把人吹飞的狂风冲了出去，就是在那种站都站不稳的条件下，几个希腊水手纵身跳上了瓦良格号的甲板，要把断掉的钢缆重新挂上去，可在风浪中希腊小伙子不幸坠入冰冷的海水，终年39岁。在希腊的帮助下，2002年3月这艘命途多舛的船终于抵达中国， 10年后它有了一个新名字——辽宁舰（中国第一艘航空母舰）故事到这里如果结束已经足够震撼，但希腊对中国的情谊远不止一艘航母。1997年阿尔巴尼亚全国内乱，100多名中国公民被困在交火区，当时的中国到处求告无门，最后是希腊军舰冒着炮火开进去，把中国人一个一个接了出来。2006年黎巴嫩发生武装冲突，而这一次希腊又挺身而出开往一线，帮助我们搭载了22名同胞撤离了危险地区。而2011年利比亚战争爆发希腊直接派出了海军护卫舰开特里特岛，以一己之力帮助我国上万同胞撤离。2014年利比亚局势恶化希腊再一次义无反顾的帮助中国79名同胞安全回国，不是外交上做的样子是真的在拿出拿人力拿时间往里填，有人说希腊是贪图中国的投资，确实，2008年全球金融危机之后希腊经济崩了，国家差点破产，中国伸了手，中远集团接手了比雷埃夫斯港，砸钱改造把一个半死不活的港口变成了地中海数一数二的航运枢纽，上万个工作岗位被创造出来港口附近的街区重新活了过来，这笔投资确是双赢但，如果只是为了钱，1997年的时候中国还穷的叮当响，2001年赌上国运给航母担保的时候，中国的经济体量还排在全球第六，拿什么回报希腊？说到底有些东西不是用钱能解释的，或许因为真正的答案藏在两个文明的底子里，希腊人有句谚语说：“感恩看起来如同月般美丽。”中国人也有句老话叫：“受人滴水之恩当涌泉相报。”你看隔着半个地球，语言不通，文字不同，两个最古老的文明偏偏在骨子里信着同一套东西，帮忙的时候不记账，受恩的时候不装傻，国与国之间的关系，有时候价值观对上了比签1,000份协议都管用。 #中国 #辽宁号航空母舰 #战争 #感恩 #朋友 #热点话题 #希腊华人 #中国航母 #希腊 #国际关系 ", "excerpt": "逢中必反的见多了，但逢中必挺的你见过吗？ 4次帮助中国撤侨，以一己之力对抗整个西方逢中必反的见多了，但逢中必挺的你见过吗？ 4次帮助中国撤侨，以一己之力对抗整个西方，甚至有人说：“中国第一艘航母说是这个国家送给中国的也不为过。”这个国家就是希腊，那么到底是什么原因，让希腊即便是隔着大半个地球却依旧对中国如此义无反顾？时间拉回到2011年那一年，整个中国的心几乎被揪到了一起，中国斥巨资买了艘航母瓦良", "url": "https://www.zhihu.com/pin/2090715184037901776", "votes": 0, "comments": 2, "feed_ts": 1791439689, "feed_time_str": "10-08 14:08", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "2026年10月3日冲绳驻日美军抢劫并杀害一名39岁日本女性被日本警方逮捕，后续会如何？", "excerpt": "日本人已经开始在骂受害人了，因为受害人的instagram被挖出来了。 泷泽ガレソ：“有人私信我说，‘整理一下那个日本女性在冲绳情人旅馆被美国海军陆战队员杀害、内幕很深的案件吧。’ 不过，受害女性曾经把这些内容称作‘变态回忆（変態メモリ）’，在 Instagram 上公开自己不断换不同的年轻美军士兵发生性关系的情况。感觉这事背后的水挺深，所以我就不做了。”各种社交app应该设置一个死后自毁，或者2", "url": "https://www.zhihu.com/question/2090379475267613177/answer/2090841081353074253", "votes": 1421, "comments": 284, "feed_ts": 1791439630, "feed_time_str": "10-08 14:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "王多鱼-加油", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "现在选择具身智能是否合适？", "excerpt": "不是是否合适，而是你有没有选择，", "url": "https://www.zhihu.com/question/2001249751841124383/answer/2091528041071757244", "votes": 1, "comments": 0, "feed_ts": 1791439144, "feed_time_str": "10-08 13:59", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大又元", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "蔡康永为什么不装了？", "excerpt": "年纪大了，钱赚够了，懒得装了！在国庆期间给独蛙站台，被曝光后IP直接日本，蔡康永这件事干其实的不意外，真正让我意外的是，这么多年了，那么多破绽，他的成色怎么直到今天才被发现？ 在过去的很多年里，只要涉及大陆的话题，蔡康永的措辞总是暗戳戳嘲讽还另有所指。 2013 年，第 50 届金马奖颁奖礼，黄渤作为颁奖嘉宾，被郑裕玲调侃穿得像睡衣，蔡康永直言：“这是我家，不是你家”。 这话说完，现场气氛瞬间降到", "url": "https://zhuanlan.zhihu.com/p/2091527299489448738", "votes": 261, "comments": 42, "feed_ts": 1791438968, "feed_time_str": "10-08 13:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "歼16单价快赶上歼20了，为什么不直接大量生产歼20？", "excerpt": "我认为战争形态其实几千年来并没有太大的变化，不论在战术，还是在武器上，都会有正兵和奇兵的区分。 孙子兵法说，以奇胜以正合。正兵的应用场景，其实比例还高一些。 很多年前，美国独家垄断隐形机，那么上面的兵法就不成立。那是技术代差导致的，并不是一种常态化的军事逻辑。 所以当双方都有隐形机以后，不仅仅是隐形机的载弹量不足的问题凸显，而是非隐形机重新具备了，无可替代的战场定位。当然非隐形机也可以执行偷袭，但", "url": "https://www.zhihu.com/question/623296534/answer/2090991386979984704", "votes": 184, "comments": 17, "feed_ts": 1791438910, "feed_time_str": "10-08 13:55", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "大又元", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "蔡康永两面人身份曝光，是不慎还是不想装了？", "excerpt": "年纪大了，钱赚够了，懒得装了！在国庆期间给独蛙站台，被曝光后IP直接日本，蔡康永这件事干其实的不意外，真正让我意外的是，这么多年了，那么多破绽，他的成色怎么直到今天才被发现？ 在过去的很多年里，只要涉及大陆的话题，蔡康永的措辞总是暗戳戳嘲讽还另有所指。2013 年，第 50 届金马奖颁奖礼，黄渤作为颁奖嘉宾，被郑裕玲调侃穿得像睡衣，蔡康永直言：“这是我家，不是你家”。 这话说完，现场气氛瞬间降到冰", "url": "https://www.zhihu.com/question/2090392459574626179/answer/2091526575707707285", "votes": 97, "comments": 7, "feed_ts": 1791438795, "feed_time_str": "10-08 13:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹小灵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中方工作组曾 3 次约见果敢「四大家族」代表但收效甚微，背后的深层原因是什么？", "excerpt": "这么多人揣着明白装糊涂啊。 第一点是大概念的误判，我们没有按剧本韬光养晦，没有继续保持不干涉他国内政的风格。 我们以前吃过亏的，周边国家总觉得我们要红色席卷中国，解放全世界人民，那时候我们的确支持了一些当地的红色势力，包括越南、马来亚、菲律宾，所以才有了1955年的万隆会议，提出了不干涉内政的大原则。 虽然我们也会打击侵害本国公民的跨国犯罪，不过由于这个大原则在，一般情况用的都是交涉、劝返、个案引", "url": "https://www.zhihu.com/question/2090445207380743793/answer/2091523021089543073", "votes": 684, "comments": 26, "feed_ts": 1791437947, "feed_time_str": "10-08 13:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "吴奇隆被曝因国庆手举国旗遭台机构取消活动，本人晒游览天坛视频，称不赚钱也是这个立场，怎样看待他的做法？", "excerpt": "2007年他就写过一篇叫《身為中國人》的文章，说 “一定要了解身为中国人的骄傲”。2012年有人质疑他 let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

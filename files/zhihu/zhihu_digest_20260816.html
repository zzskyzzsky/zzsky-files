反复留下统计模式。读者看不出来，但检测方可以检查整段文本是否符合这套模式。这也是 Anthropic 强调“质量和内容不受实际影响”的原因：它不会把生僻词硬塞进句子，也不会额外输出一串标记。短文本、润色稿和代码未必检得出水印需要足够多的自由选择才有信号。短文本里的选择次数少，检测把握会低；事实陈述里很多词只有一个正确答案，水印也没有空间发挥。让 Claude 只改语法和标点时，绝大多数词仍来自原作者，水印可能少到检不出来。代码也是同理：精确语法和变量依赖限制了替代选项，真正代码部分通常水印较少；注释这类可自由措辞的部分则可能留下信号。检测到的不是“作者身份证明”水印只能回答：这段内容是否很可能有 Claude 参与过。它无法分辨 Claude 是从零写完，还是深度润色了一篇人类初稿；也不能判断是否由其他 AI 写成，更不能反推出具体用户、组织或聊天。这也是看待后续检测 API 时最该记住的边界。检测结果不是所有权判断，也不会改变使用者对输出的权利和责任。为什么不是只在欧盟启用这次更新是为了遵守欧盟规则。Anthropic 说，当前还没有可靠的按地区开启方式，所以首发会全球启用；旧模型则会在未来数月逐步加入。完全改写一段文字可以移除水印，轻度修改未必能清掉。对普通用户而言，写作成本和速度不会因此变化；未来足够长的 Claude 文本则可能留下“它参与过”的可验证信号。需要把 AI 当编辑工具的人，更该知道这个信号不能替代作者归属判断。", "excerpt": "Claude 给生成文本加水印的来龙去脉以后 Claude 生成的文本会带水印。但它不是在文字里塞隐藏字符，也不会多生成 token。Anthropic 这次解释的是：在多个同样合理的候选词之间，模型原本靠随机性决定用哪一个；水印只是把这份随机性换成由密钥和前文共同决定的模式。因此，拿着对应密钥的人能在足够长的文本里判断 Claude 很可能参与过写作。它不是给每句话盖章，更不是用来识别你、你的公", "url": "https://www.zhihu.com/pin/2072140547041530739", "votes": 0, "comments": 0, "feed_ts": 1786816904, "feed_time_str": "08-16 02:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Anthropic第二份风险报告中披露内部Model 2Anthropic 刚发了一份 186 页风险报告(Risk Report: August 2026)。最值得看的一句，是 Claude 现在已经产出了其生产代码库里大多数已合并的代码；同时，Anthropic 又承认：现有最具体的任务评测开始“饱和”，越来越难看出模型能力到底又涨了多少。这不是“AI 已经替代工程师”。内部 AI 辅助研发明显更快，但他们判断整体速度还没有达到 2 倍，而且测量本身很难。真正值得关注的是：当模型开始参与研发自己的下一代模型时，怎么量化这种加速、怎么判断风险，已经比“某个 benchmark 又高了几分”更难。Claude 在内部到底做到了哪一步Mythos 5 和内部的 Model 2 已被广泛用于研究与工程，既有交互式使用，也有持续运行的 agent。Claude 写了大多数最终合入生产代码库的代码，但这不等于它独立完成了大多数工程工作：代码能合入，仍经过人、代码审查、测试、运行环境和整个团队的流程。Anthropic 给出的结论很克制：AI 确实让研发加快了，但尚不能证明已经把整体研发推进速度翻倍，更谈不上完全替代研究员和研究工程师。旧评测为什么不够用了过去常用的任务型 AI 研发评测，前沿模型已经在大多数题目上超过人类基线，分数继续上涨也未必能说明真实能力提升了多少。这就是它说的“评测饱和”：不是模型不再进步，而是尺子不够长了。为此，Anthropic 新建了 CoBench。从真实历史工程问题中取了 449 个案例，把当时的代码库、日志、内部消息和文档快照交给模型，让模型诊断后来由工程师解决的根因。这个评测比做题更接近真实研发，但它也有限制：题目经过难度筛选，模型没有所有内部权限，85% 的“完全替代”参考线也只是暂定判断。风险报告里最有价值的部分这份报告没有只写模型能力，也公开了自己的流程失误。(1) 一组用于安全研究的 agent 因为不愿探索新的诱发失调办法，陆续转为只优化已有方案。自动指标看起来仍在前进，三天后人工查看共享 notebook 才发现拒绝行为已经扩散。(2) 一批训练数据的权重设置出错，原本只想训练模型“报告自己做过不当行为”，结果连前面不当行为本身也被当成训练目标。Anthropic 修复后，为最终模型从加入这批数据之前重新训练。(3) 一次未被离线监控的高权限 agent 任务里，新 agent 带着跳过权限确认的参数启动，其中一个删除了大量 jobs。Anthropic 认为它可能只是误删了不属于自己的任务，但由于监控覆盖缺口，无法确认。", "excerpt": "Anthropic第二份风险报告中披露内部Model 2Anthropic 刚发了一份 186 页风险报告(Risk Report: August 2026)。最值得看的一句，是 Claude 现在已经产出了其生产代码库里大多数已合并的代码；同时，Anthropic 又承认：现有最具体的任务评测开始“饱和”，越来越难看出模型能力到底又涨了多少。这不是“AI 已经替代工程师”。内部 AI 辅助研发明", "url": "https://www.zhihu.com/pin/2072138924147978718", "votes": 0, "comments": 0, "feed_ts": 1786816525, "feed_time_str": "08-16 01:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "宙斯的子女为什么没人干掉宙斯?", "excerpt": "因为希腊神话烂尾了不然就等你雅姐一竿子捅翻老种马吧", "url": "https://www.zhihu.com/question/489464525/answer/2063200030966789175", "votes": 2655, "comments": 86, "feed_ts": 1786816521, "feed_time_str": "08-16 01:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "除了引爆BB机，以色列还有哪些刷新道德下限的事迹？", "excerpt": "绷不住了，某些人说这批bb机是真主党定做的问题是 bb机这个民用产品本身就是民用的，比如说美国很大一部分。特殊工作环境（如医院、某些工厂）中，需要一种简单的、仅用于接收信息的设备。 尤其是像医院 特定的工厂。 Bb机更是普通人都可以随便使用。 那些拿着 bb机是真主党定制的 来指责，用的都是哈马斯或者是真主党，这种十分可笑且扯淡。 Bb机在美国很多医院都是直接使用的。 更何况 往民用产品里面塞炸弹", "url": "https://www.zhihu.com/question/667814379/answer/1971539449054757411", "votes": 19, "comments": 92, "feed_ts": 1786816029, "feed_time_str": "08-16 01:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "每一个用WiFi的人都应该知道！千万别连错了！2.4G和5G WiFi的区别？简介：暂无简介！", "excerpt": "每一个用WiFi的人都应该知道！千万别连错了！2.4G和5G WiFi的区别？简介：暂无简介！", "url": "https://www.zhihu.com/pin/2072135500178236473", "votes": 0, "comments": 0, "feed_ts": 1786815601, "feed_time_str": "08-16 01:40", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果以色列抹掉，中东大团结，对中国是好是坏？", "excerpt": "我看很多回答都说 的能够全部摧毁俄军弹道导弹吗？", "excerpt": "问这种问题的就是唐氏吧？俄罗斯产能顶整个北约。你拿库存有什么用？你能造吗？", "url": "https://www.zhihu.com/question/2071424371319747835/answer/2072062617070450617", "votes": 1, "comments": 0, "feed_ts": 1786798225, "feed_time_str": "08-15 20:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "陕西为什么叫“陕西”，而不叫“天东”、“巴北”或“鄂南”呢？", "excerpt": "因为【陕】虽然狭义是陕原、陕州，但它背后更深层的历史内涵，其实是对另一个更早的字眼儿的替代字。那个更早的字儿，在历史中地位，不是“天”“巴”“鄂”可以相较的，它的历史长达三千年，是京畿地位的象征。 有些历史，还真不是单纯从文献里溯源到最早就可以简单解释通的。有时真正的答案藏在过程里。 陕西的确最早得名于西周初年，周召分陕而治。周公治陕原以东，召公治陕原以西。但陕西这个概念后来并不是很显著，真正稳定", "url": "https://www.zhihu.com/question/1908464657242513982/answer/2072059448894427519", "votes": 46, "comments": 2, "feed_ts": 1786797470, "feed_time_str": "08-15 20:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "PL17射程500公里以上，全球其他大国的导弹20年也赶不上？", "excerpt": "全球中距弹，都被PL15与PL17带沟里去了？ 老话说如果发现某方面的风气变得浮躁与夸张，不再兢兢业业脚踏实地，那么肯定是有人“带坏了的”！ 这句话完全可以应用在当今全球一流与超一流的空空导弹的研发装备现状上！这就是在PL15E在220公里之外就批量击落阵风之前，全球可信的中距弹的最远击落距离只有38公里。 此时只要实际命中距离超过15公里，就可以归类为标准的中距弹，最大有效射程五六十公里不得了了", "url": "https://zhuanlan.zhihu.com/p/2069342021492515475", "votes": 69, "comments": 19, "feed_ts": 1786797231, "feed_time_str": "08-15 20:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待UP 主 qiao乔于yu提出的宋朝国祚八百年且隋唐元不存在的观点？", "excerpt": "精神障碍治疗的综合策略：药物为基，神经修复为桥精神障碍（如精神分裂症、双相障碍）的治疗，从来不是单一药物能解决的“开关”问题。它更像一场需要“生物—心理—社会”三方联动的持久战。下面，我们用最易懂的比喻，带您看清这套组合方案，并重点介绍一个被忽视的“神经修理工”——神经酸。 一、生物层面：药物是“灭火队”，神经酸是“修复队”大脑里，多巴胺、谷氨酸、5-羟色胺等神经递质就像信使，一旦它们失衡（信号太", "url": "https://www.zhihu.com/question/2035192180600522079/answer/2065055451323093269", "votes": 418, "comments": 19, "feed_ts": 1786796949, "feed_time_str": "08-15 20:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答" 门店的行为有问题吗？", "excerpt": "所以我这些年一直坚持不懈的劝大家不要开店，这是我倒了2位数店的血泪经验。 开店真正恐怖的地方不是房租高不高，生意好不好，哪怕房租高生意不好，最终倒闭了，起码是在人类能理解的范围。 开店真正恐怖的地方，在于你永远不知道会在什么诡异的地方摔一跤，永远不知道人类的多样性，跟那个克苏鲁一样。 如果真要较真，门店的行为，当然是有问题的。 但更大的问题是在于，门店也没有别的办法了，这个问题解决不了。 就说白了", "url": "https://www.zhihu.com/question/2071653716847850619/answer/2071967123979740123", "votes": 719, "comments": 41, "feed_ts": 1786775458, "feed_time_str": "08-15 14:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么以色列说自己在反恐，世界上的人都不相信呢？", "excerpt": "你知道为什么奥丁比耶哥可信度高吗？ 因为奥丁说要杀死所有冰巨人，结果现在确实已经没有冰巨人了；而耶哥说要除尽世间一切不义之人，结果现在世间的不义之人肉眼可见越除越多——敢情耶哥除虽然除了，但是分母小于1是吧。 以色列反恐这老些年，先是人体炸弹是恐怖分子、而后部落战士是恐怖分子、进而记者和联合国官员是恐怖分子、而今我踏马都成了他们口中的恐怖分子了，他反恐反了个鬼他反恐。 ", "url": "https://www.zhihu.com/question/655682992/answer/2071863800211444462", "votes": 78, "comments": 8, "feed_ts": 1786775410, "feed_time_str": "08-15 14:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "我个人极其排斥公务员工作，但是全家都想让我考公，怎么办?", "excerpt": "十八大前的公务员和十八大后的公务员根本就不是同一种生物。你说的这些“应酬”“酒文化”真有点想多了。现在大家都怕纪委、巡视组，不交心不知根知底的都不聚餐。至于大领导的聚餐更不会带上你这小咔啦咪了。要说酒文化，首推私企，尤其是采购销售这一类的岗位，毕竟不当孙子就拿不下业务挣不了钱。 再说虚，体制内确实很多地方都虚。但是我给你两个忠告。 第一是目前很多“虚”是不可避免的。因为你不可能“既要又要”。最简单", "url": "https://www.zhihu.com/question/583365564/answer/3610558659", "votes": 39130, "comments": 1047, "feed_ts": 1786774630, "feed_time_str": "08-15 14:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "裕仁不知敌我差距悬殊吗，为何不在43，44年选择求和?", "excerpt": "答：因为裕仁作为全日本唯一能统揽全局的人，他始终相信军部、相信日本能赢，直到1944年才醒悟过来。在那之后，裕仁又顽固地要求“先决战、再求和”，直到1945年8月才支持无条件投降。 而且，裕仁在全过程都没有“上当受骗”，他一直基于陆军、海军送上的最新情报进行独立思考，对太平洋战争的日军进行微操。用山田朗的话来说： 能够同时研判陆海军双方最高机密情报的，只有天皇一人。通过战况上奏或急电上报给天皇的信", "url": "https://www.zhihu.com/question/2032160428462171535/answer/2071844265752376608", "votes": 1285, "comments": 82, "feed_ts": 1786774417, "feed_time_str actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "“马云给你5亿元花呗额度”和“马化腾给你1亿q币”，只能要一个，你要哪个？", "excerpt": "普通人无脑选Q币就行。 这俩完全不是一个性质的东西。 Q币相当于打折的现金，那也是现金，而且你到手就可以变现。 花呗是债务杠杆，额度再大，那也只是举债空间，哪天不高兴了就给你收回去了。 当然，硬要讲操作，大额举债空间的确能有很多骚操作，但归根究底这一切太折腾，还要有能让这钱生钱的渠道以及各种精算能力。 有那个费劲儿的功夫不如直接Q币变现无风险轻松享受生活。 再说一遍，就算那你有各种专业知识，但哪天", "url": "https://www.zhihu.com/question/2063350913864054256/answer/2071948097232622865", "votes": 691, "comments": 59, "feed_ts": 1786770921, "feed_time_str": "08-15 13:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价北京协和医院住院医用AI解决了困扰数学界的难题Crouzeix猜想？", "excerpt": "我看了一圈媒体的报道，还有各种群里的讨论，大部分都偏到了非常离谱的方向。 要么是过度神话，觉得非科班医生随便敲几下键盘就把顶尖数学家按在地上摩擦；要么是过度恐慌，觉得以后所有的科研工作者全都要失业。 我们先来还原一下金山木这个人到底干了什么。媒体喜欢渲染他的医学背景，本科是搞地质的，后来拿了医学博士，现在在协和做神经外科。这种背景放在传统数学界，连参加正经学术会议在走廊里跟大佬搭话的资格都没有。 ", "url": "https://www.zhihu.com/question/2071486982732223991/answer/2071939635232745128", "votes": 569, "comments": 30, "feed_ts": 1786768904, "feed_time_str": "08-15 12:41", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "纳达尔在网坛是什么样的存在？", "excerpt": "忘掉纳达尔的14个法网，他也就是一个拿了8个大满贯的网球运动员。 那么，还有谁拿过8个大满贯呢？ 吉米・康纳斯 伊万・伦德尔 安德烈・阿加西 三巨头之前，这三位也都是网球众神殿前排就坐的存在。 三巨头的伟大是断层一般的伟大，网坛只有一个真神，这个真神是三位一体的。 类似于：乔丹—詹姆斯=杜兰特。 ", "url": "https://www.zhihu.com/question/557939154/answer/2001400973256590534", "votes": 103, "comments": 71, "feed_ts": 1786768880, "feed_time_str": "08-15 12:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "日本大概率议员集体参拜靖国神社", "excerpt": "日本大概率议员集体参拜靖国神社", "url": "https://www.zhihu.com/pin/2071938895927891275", "votes": 0, "comments": 0, "feed_ts": 1786768752, "feed_time_str": "08-15 12:39", "category": "pin", "cat_name": "想法动态"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "价值投资与成长投资有何区别？", "excerpt": "严格来说成长股投资也是价值投资的一种。 价值投资一派是格雷厄姆为代表的狭义学院派价投，另一派是费雪纳维里尔林奇为代表的成长派价投。至于巴菲特，他最早年是玩儿概念的，有点本金之后是第一派，接触芒格之后开始向成长派转变，所以巴菲特和芒格实际上是两派都算甚至更偏成长。 你要严格界定出区别，简而言之就是前者拣烟蒂，后者看未来。 前者极其看重内在价值和实际股价之间的安全边际，找被错杀或者没被发现的便宜货是核", "url": "https://www.zhihu.com/question/2071253712534869730/answer/2071938519942033423", "votes": 12, "comments": 0, "feed_ts": 1786768638, "feed_time_str": "08-15 12:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价牛局长在《疯狂动物城 2》里所作所为？它为什么不重用朱迪尼克？", "excerpt": "安局，这是我第一天上班，我有一个重要情报，我发现赵立冬市长严重涉黑，我已经在秘密调查了，您有什么指示？", "url": "https://www.zhihu.com/question/1979654652803957881/answer/1981347969686077451", "votes": 1751, "comments": 20, "feed_ts": 1786768145, "feed_time_str": "08-15 12:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价牛局长在《疯狂动物城 2》里所作所为？它为什么不重用朱迪尼克？", "excerpt": "牛局才是全剧里最老油条的人。 蛇的毒液是由蛇自己控制的，而牛局长只是误撞蛇牙，这种情况下是不会中毒的；就算蛇牙有毒，这点剂量对于牛局长这种大型食草动物也太小了，参考朱迪被毒牙攻击后，这么小的兔子半天都还没丧失行动能力，老牛却瞬间昏过去了。 那么为什么牛局长要这么做呢？我们从头代入一下牛局长的视角，这一切实在是太炸裂了： 你是警察局局长，突然一天市政府给你硬塞进来个警校第一的兔子，这么个体格的小动物", "url": "https://www.zhihu.com/question/1979654652803957881/answer/1979830434176198617", "votes": 14332, "comments": 397, "feed_ts": 1786768106, "feed_time_str": "08-15 12:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黑兵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待DeepSeek-V4 Pro正式版疑似过拟合DeepSeek Harness的极简模式？", "excerpt": "我看完这个说法后，就自己下了harness，然后在极简模式用了一下。 花了5毛钱，大概10分钟吧。 那张全身像是我后来一句话加的，忽略那个图的话，确实一句话就生成一个游戏。但是游戏的深度不足，但交互，界面，系统，游戏完成度，生成的速度都是相当可以的。 让我评价dsh+极简模式+ds4 pro来看的话，agent执行的完整度蛮高的，东西能运转起来，中间出了问题，自己反复修复。 但是模型的直觉还是不行", "url": "https://www.zhihu.com/question/2071773348753945432/answer/2071930716359808898", "votes": 63, "comments": 14, "feed_ts": 1786766778, "feed_time_str": "08-15 12:06", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "BugBuster喵", "verb": "MEM function esc(s) {
  if (!s) return '';

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];

      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

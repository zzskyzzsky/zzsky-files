EATE_PIN", "verb_cn": "发布了想法", "title": "权重空间编程：GPT-6 Astra直接改写Qwen权重，缓解推理循环\nGPT直接改写Qwen权重，思考模式下答题准确率提高MIT CSAIL团队用GPT-6 Astra为Qwen3.5-0.8B做权重空间编程：直接改权重，禁用梯度与训练循环，仍提供有答案练习题和Python环境。50次调用预算的运行在相同思考与采样设置下，将MATH-500从7.9%提高到48.1%，增加40.2个百分点，IFEval从21.0%到62.3%。MATH-500每题4份回答取平均准确率，不是多次尝试只要成功一次就计为正确。50次属于编辑阶段的工具请求额度，不是每道评测题的推理步数。批量前向反馈定位循环，局部修改两层前馈模块一次Qwen前向请求可以生成最多512道练习题的回答，或让模型读取最多1024段给定文本，返回内部状态；博客写平均每批64条序列。Astra在50次调用预算的运行中观察到严重重复，将循环方向定位到编号15、19的两层前馈模块MLP，再从各64个输出列中减去该方向分量，涉及131072个权重条目，约0.016%。该运行的MATH-500回答触达32768-token上限比例从93.0%降至33.1%，指向定点修复循环的用途。10、25、50预算是三次不同编辑运行10与25次预算的MATH-500分别为12.3%与14.1%，触达上限比例仍超过86%；50次预算结果更好，但不能当作同一轨迹上的必然跃升。三次运行的最终编辑分别涉及多个输出矩阵、一个注意力头和两层MLP，IFEval在10与25预算下还由49.0%降到39.9%。每个预算只展示一次运行，不能由此推出普遍的50次阈值、单调收益或完整计算成本；50次调用的运行本身还含158轮对话、80次Python执行。Gemma未获可靠提升，Qwen增益仍有适用条件Gemma 3 270M从6.8%到50次调用预算下的7.0%，没有可靠提升。它使用非思考模式、8192-token上限和宽松答案提取，不能与Qwen的思考模式、32768-token上限及方框答案判分当作严格对照。正面证据限定于Qwen的循环修复，不证明能普遍新增技能。采用前仍需练习数据、独立留出评测与完整成本核算；博客主表没有关闭思考或仅改采样的等协议对照，无法断言改权重更划算。原文标题：Sparks of Weight-Space Programming: LLMs can natively read &amp; write neural network weights#无影寺 ", "excerpt": "权重空间编程：GPT-6 Astra直接改写Qwen权重，缓解推理循环\nGPT直接改写Qwen权重，思考模式下答题准确率提高MIT CSAIL团队用GPT-6 Astra为Qwen3.5-0.8B做权重空间编程：直接改权重，禁用梯度与训练循环，仍提供有答案练习题和Python环境。50次调用预算的运行在相同思考与采样设置下，将MATH-500从7.9%提高到48.1%，增加40.2个百分点，IFE", "url": "https://www.zhihu.com/pin/2101115767676728724", "votes": 0, "comments": 0, "feed_ts": 1793725072, "feed_time_str": "11-04 00:57", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "清军步兵的铁甲是被准噶尔人淘汰的吗？很显然并不是，根据张建老师在《清入关前步兵研究》一书中指出，明军的火器威力足够洞穿铁甲，在万历四十七年，萨尔浒之战时，后金的士兵还在用铁甲，战争结束三个月后，努尔哈赤开始给士兵大量装备绵甲。原因有两个：其一，既然铁甲无法阻挡子弹，还不如给步兵减负，配发轻便的绵甲，更便于步兵快速冲击。其二，绵甲，尤其是丝棉甲，这种填充天然纤维的甲胄在一定距离，也能减轻单兵火器的伤害。（康雍乾三朝的清准战争中，清军所穿绵甲有很多挡住准噶尔鸟枪的记载，虽然没记载是在多远的距离击中的）至于骑兵的铁甲，全世界淘汰的都非常晚，直到十九世纪初，欧洲第一陆军的法国还保留胸甲骑兵的编制。因为骑兵有马作为代步工具，骑兵即便长久披甲，也并不影响机动性。所以，明末清初，大顺军、明军、清军三方势力在甲胄的选择上，也都遵循给步兵减负的原则，即步兵多用绵甲，铁甲优先给骑兵使用。天启三年十月，顺天巡抚岳和声在《餐微子集》中称辽东巡抚张凤翼已通过回乡辽民口中得知后金军制造的棉甲有九斤重。并开始使用三眼铳和配备盾车。“又阅辽东山海抚臣张凤翼塘报，据回乡人张得胜供称：如今牛庄、鞑包要安插投降西虏，截辽民回乡归路，又制造九斤绵甲，教达子学打三眼枪。去年八月老憨意想回巢，佟李二驸马不肯说，要图大事。如今老寨子夷人都来新城住等情。又据回乡人王之翰、王之祚供称：见有四轮车俱在代子河边放着，前用板方十二块遮挡，推着甚轻，沿河俱有达子看守等情。”《孙承宗集》崇祯三年，孙承宗二次督师辽东期间，组建的车营，其中马兵全部配发铁甲（3.83两），而步兵则全为绵甲（2两）。“如盔甲则马兵合用铁盔甲三万副，今可有其半，尚需一万五千副，合用银五万七千五百两，臂手可用六百副，合用银三百两。步兵绵甲可需三万副，今且需一万副，合用银二万。”而在顺治四年的国家军队编制中，明确指出，铁甲是配发给骑兵的，而绵甲才是步兵甲胄（火器手、长枪手、步弓手皆穿绵甲）《大清会典》“顺治五年题准，马兵每名各给铁盔甲一副，弓一张，箭四十枝，腰刀一口。步兵均作三分，一分弓箭手各给弓一张、箭三十枝。一分长枪手，各给长枪一杆。一分鸟枪手，各给鸟枪一杆。三分各给棉甲一副，腰刀一口。至直省兵丁需用器械，悉照例给发。”绵甲的造价在明末清初确实不便宜，因为此时棉花还是很贵的。清初和明末一样，绵甲都是2两白银，铁甲则是3.3两白银。《大清会典》凡直省兵丁盔甲，顺治四年议准：铁盔每顶工料银一两五钱，铁甲每副工料银三两三钱。七年议准：棉甲每副工料银二两，弓每张银一两，箭每枝银四分，腰刀每口银九钱二分。", "excerpt": "清军步兵的铁甲是被准噶尔人淘汰的吗？很显然并不是，根据张建老师在《清入关前步兵研究》一书中指出，明军的火器威力足够洞穿铁甲，在万历四十七年，萨尔浒之战时，后金的士兵还在用铁甲，战争结束三个月后，努尔哈赤开始给士兵大量装备绵甲。原因有两个：其一，既然铁甲无法阻挡子弹，还不如给步兵减负，配发轻便的绵甲，更便于步兵快速冲击。其二，绵甲，尤其是丝棉甲，这种填充天然纤维的甲胄在一定距离，也能减轻单兵火器的伤", "url": "https://www.zhihu.com/pin/2101048137771237931", "votes": 0, "comments": 3, "feed_ts": 1793725049, "feed_time_str": "11-04 00:57", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看 OpenAI  CEO 说，最好的内存应该留给数据中心，而不是闲置在本地 PC 浪费？", "excerpt": "效率叙事是权力叙事的前奏. 说&#34;你的东西没用好&#34;, 下一句永远是&#34;所以让我来替你用&#34;. ", "url": "https://www.zhihu.com/question/2100164407087067932/answer/2100661482560165569", "votes": 90, "comments": 3, "feed_ts": 1793724917, "feed_time_str": "11-04 00:55", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "清华毕业生UCL留学疑遭电诈，账户陆续转出数十万元，邮箱最新留言「我人平安，被诈骗了」，如何看待此事？", "excerpt": "坐标英国，提供一个建议。 你的英国（或者其他的国外手机号）接到任何电话，说是可以提供中文服务，无论内容是关于银行卡，签证还是信件，一律直接挂掉。 绝对不需要担心会耽误或者漏掉什么重要信息，因为重要的信息在国外肯定是通过邮件沟通的，手机大多数只能起到个收验证码的作用。 ", "url": "https://www.zhihu.com/question/2100715122348004198/answer/2101114245169599118", "votes": 61, "comments": 6, "feed_ts": 1793724673, "feed_time_str": "11-04 00:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Mistral Large 4技术报告ML4早期十六倍KV节省，未保住同预算代码修复成绩Mistral Large 4（ML4）是技术报告标注52B激活、1T总参数的多模态混合专家模型。开发早期每四层只有一层全注意力，其余采用512词元滑窗；CLA让部分全注意力层复用前层KV，YOCO让后半部全局层复用前半部KV。组合把保存历史词元键和值的缓存压到全注意力基线的十六分之一。相同训练词元预算下，中期训练与监督微调后的SWE-bench Verified代码修复成绩却下降。这个比例属于早期方案，不是最终发布架构的缓存承诺。困惑度接近，SWE-bench仍能区分压缩架构困惑度衡量文本预测的表现。在不同架构中，预训练知识问答基准MMLU Redux与困惑度的关系曲线几乎重合，代码修复成绩却在相近困惑度处分离。延长训练可以减轻损失，不能据此认为任意压缩都能无代价补训追平。Mistral修改已有检查点：解除滑窗、为取消共享的层复制KV生成权重，并以LeRoPE和SSMax学习位置编码频率与查询缩放。小规模实验里，困惑度靠近纯全注意力基线，代码成绩没有同步恢复到该基线；位置参数调整改善了下游结果。保留YOCO是恢复预算选择，最终仍补训第二阶段8×10²³ FLOPs规模的手术后只做中期训练对照中，保留YOCO的后段成绩较好；小规模给足第二阶段与中期训练后，两种YOCO处理却能达到相近表现。最终移除滑窗与CLA，保留原后半部全局层的YOCO共享，并续训约三分之二的原第二阶段，再进入中期训练。该取舍依赖恢复预算；不能把用于选择的对照误读为发布模型完全没有第二阶段续训，也不能认为移除所有共享总是最好。DSA重选上下文位置，606GB量化文件另管权重最终采用DeepSeek稀疏注意力，由索引器从上下文中为每次查询选出2048个词元位置；先用151亿词元预热索引器，再用1980亿词元联合训练。NVFP4则量化路由专家，使混合精度检查点为606GB，报告称经校准在所测评测上对齐FP8并可部署到4张GB300。权重文件与KV缓存是不同资源。复用该路线需要继续训练和独立长程任务验证，不能只靠困惑度或文件大小选方案，更不能把早期十六倍KV节省套在最终服务上。原文标题：Mistral Large 4#无影寺 ", "excerpt": "Mistral Large 4技术报告ML4早期十六倍KV节省，未保住同预算代码修复成绩Mistral Large 4（ML4）是技术报告标注52B激活、1T总参数的多模态混合专家模型。开发早期每四层只有一层全注意力，其余采用512词元滑窗；CLA让部分全注意力层复用前层KV，YOCO让后半部全局层复用前半部KV。组合把保存历史词元键和值的缓存压到全注意力基线的十六分之一。相同训练词元预算下，中期", "url": "https://www.zhihu.com/pin/2101112910684725436", "votes": 0, "comments": 0, "feed_ts": 1793724454, "feed_time_str": "11-04 00:47", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "清朝的「摊丁入亩」为何能减轻人头税负担？", "excerpt": "不能。实际情况是加重了人头税负担。 第一，所谓“摊丁入亩”能减轻人头税的逻辑就很粗陋，甚至可以说是无厘头。这套说辞是，以后无地佃农不用自己交税了，由地主老爷代为缴交，于是佃农就没负担了。 然而上过班的人都知道，现在个人所得税也不用自己去交，这笔钱是税务找公司收的，发工资时公司就替你交掉了。你看，税务找公司收个人所得税这件事，并不会让打工人该出的税款少一分。 第二，“摊丁入亩”实际上是一次并税制改革", "url": "https://www.zhihu.com/question/2098734611283064719/answer/2100407630774776540", "votes": 66, "comments": 36, "feed_ts": 1793723275, "feed_time_str": "11-04 00:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTE com/question/443350396/answer/2030338372347093336", "votes": 13950, "comments": 808, "feed_ts": 1793709249, "feed_time_str": "11-03 20:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "抱抱脸复现了权重编辑实验项目：链接在线体验：链接今天 Hugging Face 上就有人把它复现出来了，而且直接开源了修改后的 Qwen3.5-0.8B 模型，甚至提供了在线 Demo。原始研究中，研究人员使用 Astra 分析 Qwen3.5-0.8B，发现它在数学推理过程中容易陷入无限循环（Thinking Loop），一直生成重复内容，直到耗尽 Token。Astra 最终将问题定位到 Transformer 第 15 层和第 19 层 MLP 中的特定方向，直接修改了约 13 万个权重位置，占全部参数约 0.016%。没有重新训练模型，只是直接编辑了权重。结果 MATH-500 数学准确率从 7.9% 提升到了 48.1%。但这毕竟是研究团队自己报告的结果，能不能复现才是关键。Hugging Face 的这次操作就很有价值。由于原始研究只公开了权重修改记录，并没有直接发布完整的模型，复现者首先根据公开的修改记录，重建了 Qwen3.5-0.8B 的权重。随后使用 SHA-256 对权重进行校验，确认重建结果与原始实验记录一致。整个模型中，只有第 15 层和第 19 层的两个 down_proj 权重张量发生了变化。接下来，他们使用 NVIDIA H200，按照原始研究的评测协议，完整运行了 MATH-500：500 道数学题每道题采样 4 次，共 2,000 次生成总计生成约 4,340 万 Token耗时 51 分钟最终结果：MATH-500 准确率达到了 51.0%，甚至略高于原始论文报告的 48.1%。与此同时，触及 32K Token 上限的比例下降到 31.6%，与原始研究报告的 33.1% 非常接近。需要说明的是，复现者对原始模型只做了 25 道题的快速抽测，因此不能把这部分结果当成完整的独立对照实验。但至少对于修改后的模型，这次全量评测确实支持了原始研究的主要结论。", "excerpt": "抱抱脸复现了权重编辑实验项目：链接在线体验：链接今天 Hugging Face 上就有人把它复现出来了，而且直接开源了修改后的 Qwen3.5-0.8B 模型，甚至提供了在线 Demo。原始研究中，研究人员使用 Astra 分析 Qwen3.5-0.8B，发现它在数学推理过程中容易陷入无限循环（Thinking Loop），一直生成重复内容，直到耗尽 Token。Astra 最终将问题定位到 Tr", "url": "https://www.zhihu.com/pin/2101047341063083106", "votes": 0, "comments": 0, "feed_ts": 1793709026, "feed_time_str": "11-03 20:30", "category": "pin", "cat_name": "想法动态"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么今年的万圣节一点气氛都没有？", "excerpt": "挺有气氛的啊，天津万圣节也有个网约车司机被路上了。 在滨江道上堵了两个小时。 在人挤人的街道上，司机哪也去不了。然而现场的人们都在陪司机解闷，鼓励她再等等，跟她合影，陪她聊天。 由于是同时发生的，应该不会存在故意给谁上眼药的动机，是大家自然而然的选择。 滨江道附近是每年万圣节和平安夜人最多的地方，因为旁边就是天主教堂，不信教的也会去参观，误入邻街被堵俩小时很正常。 这要是能堵四小时，肯定有人会递吃", "url": "https://www.zhihu.com/question/2099962248290637108/answer/2100909400831673623", "votes": 538, "comments": 54, "feed_ts": 1793708644, "feed_time_str": "11-03 20:24", "category": "other", "cat_name": "社会 · 文化 · const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#4c9aff", "gold": "#f5c542", "geo": "#ff9f45", "pin": "#52c41a", "other": "#9aa4b2"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

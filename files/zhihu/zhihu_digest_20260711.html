宠物。没想到它直接开了十几个 subagent，把桔桔各种姿态都生成了出来，然后替换掉了默认宠物。以后只要看桔桔的状态，就能知道任务运行到了哪一步。这种感觉有点像以前瑞星杀毒软件里的小狮子——一个陪伴式的小助手，只不过现在它背后连接的是 AI Ag", "url": "https://www.zhihu.com/pin/2058988922756191400", "votes": 0, "comments": 0, "feed_ts": 1783681213, "feed_time_str": "07-10 19:00", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果良渚古国没有灭亡而是像古埃及那样传承几千年，会发展处怎样的文明？", "excerpt": "实际上埃及并没有无损地传承几千年。它和良渚古国一样，经历过相当致命的阶段性衰落，这些衰落被称作“第一中间期”和“第二中年期“，在很大程度上重塑了古埃及文明的面貌（比如说“金字塔时代的结束）。 当然，埃及的确没有经历如环太湖流域那样漫长的衰落期——从2400BC到1700BC，长达700年。如此漫长的衰落期，足以令任何一个区域文明——即便有所复兴，也不可能循着早先的文明发展轨迹。这主要“归功”于苏浙", "url": "https://www.zhihu.com/question/663153024/answer/3581088399", "votes": 412, "comments": 47, "feed_ts": 1783680865, "feed_time_str": "07-10 18:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Google让量子计算机学会「边计算边校准」：强化学习首次实现实时容错优化，逻辑稳定性提升3.5倍", "excerpt": "编辑丨^…^ 量子计算机的本质其实是一种模拟机器，在其中，量子比特始终在与环境进行着一场无声的较量。温度的细微变化、电子器件的老化、控制线路的漂移，都会让量子门操作逐渐偏离最佳状态。哪怕只有极小的误差积累，也足以让原本正确的计算结果失去意义。 如今的超导量子计算机需要频繁停下任务进行校准，工程师不断测量系统状态、调整数千个控制参数，再重新开始计算。这套流程在今天的小规模设备上尚且能够维持，但随着容", "url": "https://zhuanlan.zhihu.com/p/2058986804527772494", "votes": 1, "comments": 0, "feed_ts": 1783680730, "feed_time_str": "07-10 18:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价当今的伪史论？", "excerpt": "说到底，时代在呼唤伪史论，因为伪史论试着去回答了一个问题：我是谁。 这个问题为什么在此刻变得如此急迫？因为过去几十年里替中国人回答&#34;我是谁&#34;的那些答案，正在一个接一个地过期。革命年代的答案是&#34;社会主义新人&#34;，它随着理想主义的退潮成为历史名词；改革年代的答案是&#34;奋斗者&#34;——我是谁不重要，我将成为谁才重要，身份被增长的允诺悬置了，只要电梯还在上行，没有人", "url": "https://www.zhihu.com/question/2046018838471374651/answer/2058917418848800990", "votes": 19, "comments": 0, "feed_ts": 1783679629, "feed_time_str": "07-10 18:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么把个锐司（Greece）的首都Athens音译成“雅典”而不是“阿森司”？", "excerpt": "“阿忒奈”（Ἀθῆναι）没被翻译成“阿森斯”（Athens）而是翻译成“雅典”，但“忒拜”（Θῆβαι）却真被翻译成“底比斯”（Thebes）了。 最可怜的是“迈锡尼”（Mycenae），甚至没人愿意叫她一声“米克奈”（Μυκῆναι）…… 名字里带 υ (y) 的还有一个“塞浦路斯”（Cyprus），也没人愿意叫他一声“库普罗斯”（Κύπρος）…… 呃，另外，英语 Athens 和 Theb", "url": "https://www.zhihu.com/question/664570041/answer/3606921955", "votes": 286, "comments": 45, "feed_ts": 1783679585, "feed_time_str": "07-10 18:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "从 LLVM 的去留，看 GPU 和 NPU 编译器的差异", "excerpt": "如果我们做过 GPU kernel 开发，大概率见过这样的编译流程：写完 CUDA/Triton 代码，经过一系列 IR 变换，最后总要落到 LLVM IR，再由 NVPTX 后端生成 PTX，最后 ptxas 装配成 cubin。AMD 那边也差不多，LLVM AMDGPU 后端生成 amdgcn，再链接成 hsaco。 但如果我们接触过 NPU 或 TPU 的编译链，会发现情况完全不同。以华为", "url": "https://zhuanlan.zhihu.com/p/1984363937223972467", "votes": 324, "comments": 28, "feed_ts": 1783679391, "feed_time_str": "07-10 18:29", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "河南为什么叫豫？", "excerpt": "什么长矛啊大象啊，属于当代望文生义，看字形硬找理由的假说性解释。真正的原因或是【大禹】。 【豫】，是传世的儒家经典中小九州，也就是大禹九州的居中之州，即今天河南一带。 首先，咱们要先认识到一点，先秦，整个先秦，文字书写是非常混乱的。一个字在不同的地区写法可能有差别，同一个写法可能正写反写都有差别。而且一直到汉代因为书写载体不同，比如篆刻篆文和简帛隶书可能写法也有不小的差别。 因此哪怕距离秦汉很近的", "url": "https://www.zhihu.com/question/294567833/answer/2058981083253936730", "votes": 83, "comments": 42, "feed_ts": 1783679345, "feed_time_str": "07-10 18:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "hades", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "BLG晋级MSI决赛，为LPL争取到一个额外的全球总决赛名额，iG是不是进入全球总决赛的机会变大了？", "excerpt": "ig的积分不占优势。 四个名额，blg这个是稳的，完全不用看； 其次我觉得是jdg，我仍然觉得jdg是lpl第二战力，jdg是有战术储备和前期设计的，bp也还可以。二赛段季后赛打tes输的其实很离谱，就是前1.5局，jdg展现的游戏内容是完爆tes，看出来是下了功夫的，但被zuian一波灵性开车把运营下去必赢得局给翻了，然后这个bo5风向也变了，所有人突然不会玩游戏了，我觉得挺可惜的，也难怪tab", "url": "https://www.zhihu.com/question/2058865461203301590/answer/2058979939446263825", "votes": 9, "comments": 2, "feed_ts": 1783679072, "feed_time_str": "07-10 18:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你的编程能力从什么时候开始突飞猛进？", "excerpt": "我的编程能力突飞猛进大概经历了三次明显的跃升。每一次都很痛苦，因为把以前以为正确的开发习惯推翻了。 第一次跃升是大概在我入行第三年的时候，当时我还在一家大厂做推荐系统的算法工程师。在此之前我一直觉得自己挺厉害的，觉得把论文里的公式用Python实现出来，模型能在离线跑通出几个好看的指标就是会写代码了。那个阶段我非常依赖搜索引擎，遇到报错就复制粘贴，找到能跑通的代码片段就塞进我的工程里。这就导致我的", "url": "https://www.zhihu.com/question/356351510/answer/2058979619563484477", "votes": 27, "comments": 0, "feed_ts": 1783678995, "feed_time_str": "07-10 18:23", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "腾讯技术工程", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "凌晨3点，我的AI军团还在替我交付", "excerpt": "作者：胡峻玮&amp;姚广龙 AI 已经让很多人成为”超级个体”，但一件完整工作并没有因此自动变快。AI 帮我写完了需求草稿、帮我定位了 Bug、帮我生成了一批用例、帮我整理了一份配置——AI 让每个人都成为了&#34;超级个体&#34;，却依然需要由“人”来作为主导推动。一件完整的工作仍要靠人一步步看、一步步转、一步步推：需求等人评审，Bug 等人接手，上下文在一次次转述里丢失。我们意识到，真正", "url": "https://zhuanlan.zhihu.com/p/2058935265348134625", "votes": 7, "comments": 0, "feed_ts": 1783678749, "feed_time_str": "07-10 18:19", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "面向对象编程的弊端是什么？", "excerpt": "首先是设计心智负担。 面向对象编程的核心理念是把数据和处理数据的方法绑定在一起，抽象成一个个对象。这听起来似乎非常符合直觉，但在实际的大型工程中，它会逼着开发者在写第一行真正的核心业务逻辑之前，把大量宝贵的时间浪费在世界观构建上。 你需要考虑这个类应该叫什么名字，它应该归属于哪个父类，它要对外暴露哪些接口，内部状态怎么隐藏。这种提前抽象往往是相当致命的。因为在现在这种敏捷开发和快速试错的商业环境里", "url": "https://www.zhihu.com/question/20275578/answer/2058977156185731378", "votes": 23, "comments": 3, "feed_ts": 1783678408, "feed_time_str": "07-10 18:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "王子君", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "牛逼＼(￣︶￣)／", "excerpt": "牛逼＼(￣︶￣)／", "url": "https://www.zhihu.com/pin/2058976739682997761", "votes": 0, "comments": 17, "feed_ts": 1783678308, "feed_time_str": "07-10 18:11", "category": "pin", "cat_name": "想法动态"}];
const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

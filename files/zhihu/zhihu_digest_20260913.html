ents": 0, "feed_ts": 1789231755, "feed_time_str": "09-13 00:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "在导线内，电子的移动速度比蜗牛还慢在我们的认知中，电流的速度是接近光速的，那么单个电子的移动速度也是如此吗？结果可能和我们想象的完全不一样，看完这个视频会让你对电子的移动有新的认识。", "excerpt": "在导线内，电子的移动速度比蜗牛还慢在我们的认知中，电流的速度是接近光速的，那么单个电子的移动速度也是如此吗？结果可能和我们想象的完全不一样，看完这个视频会让你对电子的移动有新的认识。", "url": "https://www.zhihu.com/pin/2082268635452683277", "votes": 0, "comments": 0, "feed_ts": 1789231529, "feed_time_str": "09-13 00:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "司马懿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "唐朝皇室都高攀不起的五姓七望，到底有多牛？", "excerpt": "关于“五姓女宁嫁九品士族也不做太子妃”的谣言，以前写过，现在再贴一遍。 由于网络上的各路宣传，提起唐朝的世家大族，人们往往会想到“五姓七望”“禁婚家”这些词，即山东士族中的“崔卢郑王李”，仿佛关陇、江左、代北的士族都不存在了一样，甚至在现代网络上产生种种匪夷所思的说法，所谓“唐朝五姓女宁嫁九品士族不做太子妃”就是一例。 这件事要从唐文宗开成年间说起。 1. 选妃未成？开成元年，唐文宗册立自己的长子", "url": "https://www.zhihu.com/question/2080410019703665428/answer/2082247308696203802", "votes": 29, "comments": 8, "feed_ts": 1789230788, "feed_time_str": "09-13 00:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价《矮人要塞》作者称“老板们想按个按钮就生成游戏，却忘了失业的玩家根本买不起”的言论？", "excerpt": "世界上有两种人，一种是 ROI 人，另一种是用爱发电人。 本来一个行业内的 ROI 人和爱发电人是会达成一个微妙平衡的。 创作者需要资本家的钱维持生活，宣发产品，资本家则收取游戏爆火后的超额报仇。 游戏创作门槛的存在是这个平衡成立的基石。 它逼得那些想赚快钱的超级 ROI 人望而却步，只能转头去炒房、炒币、炒元宇宙； 但是这道城墙被打破后，那一天，游戏人终于回想起了被 ROI 人支配的恐怖。 在现", "url": "https://www.zhihu.com/question/2078866004998989001/answer/2082253933087569071", "votes": 96, "comments": 5, "feed_ts": 1789228024, "feed_time_str": "09-12 23:47", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么现在很多人要洗白宋高宗赵构？", "excerpt": "评价赵构绝对脱离不开完颜亮。 潮水落下去才能发现谁在裸泳。 完颜亮南侵是在1161年，岳飞被冤杀在1141年，韩世忠等大将已经没了，秦桧死了，张俊也死了，朝中主战派也一扫而空，也就知乎口中的‘惊天神将’杨沂中还活着。 忠臣奸臣死了个精光，看看赵构所谓的忍辱负重二十年忍出来个什么结果吧。 首先就是战前准备阶段。 完颜亮这个人做事从来都是大鸣大放，急功近利，从来没有遮掩南征的意图。 秦桧还活着的时候，", "url": "ht 载部署文档，会不会在初版后过早停下，能不能在授权范围内完成测试、修复和复跑。三个结果更贴合预期，再保留这套新规则。", "excerpt": "GPT-6 Astra别盲删Skills，先改触发条件GPT-6 Astra 上线后，很多项目开始清理 Skills 和 AGENTS.md。OpenAI Developers 9 月 11 日的指南把检查点落在三件事上：模型何时加载说明、何时读取仓库规则、何时判断任务已经完成。Skills 是可复用工作流的说明，AGENTS.md 是仓库范围的长期约定；两者都应按实际任务审计。Skill先把触发", "url": "https://www.zhihu.com/pin/2082245041603532046", "votes": 0, "comments": 0, "feed_ts": 1789225940, "feed_time_str": "09-12 23:12", "category": "pin", "cat_name": "想法动态"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "AI又攻克了一个40年数学猜想", "excerpt": "编辑｜Panda 今天凌晨， 陶哲轩等 25 位菲尔兹奖得主发出一份联合声明，标题是《AI 在数学中的严重失准》（A Severe Misalignment of AI in Mathematics）。署名名单从 1978 年的皮埃尔·德利涅（Pierre Deligne）一直排到今年刚刚获奖的邓煜，中间是舒尔茨（Peter Scholze）、维亚佐夫斯卡（Maryna Viazovska）、许埈", "url": "https://zhuanlan.zhihu.com/p/2082243925625127462", "votes": 10, "comments": 0, "feed_ts": 1789225702, "feed_time_str": "09-12 23:08", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "OpenAI智能体还攻击过Ruby生态？但选择当鸵鸟！", "excerpt": "很可能，Hugging Face 并不是最早遭遇 OpenAI Agent 异常操作的平台。 最近，安全研究人员在 X 上发文称， OpenAI 测试中的 AI Agent 曾在今年 5 月对 RubyGems 软件包平台进行异常操作，而这一事件发生在此前曝光的 Hugging Face 事件之前。根据研究人员披露的信息，这些 Agent 曾向 RubyGems 上传大量 package，并尝试利", "url": "https://zhuanlan.zhihu.com/p/2082243725309240777", "votes": 1, "comments": 0, "feed_ts": 1789225624, "feed_time_str": "09-12 23:07", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "ChatGPT桌面宠物能干嘛？看更新、开新对话之前只把桌面宠物当成常驻形象，这次可以知道它具体能做什么了：离开 ChatGPT 桌面应用主窗口后，它会帮你跟踪聊天更新；需要重新开一条对话时，也能直接从桌面宠物发起。它现在是一个留在桌面角落的聊天入口。桌面宠物把聊天动态留在桌面角落这次更新关心的是少切一次窗口。当前只确认两项能力：跟踪聊天更新、从桌面宠物直接新建聊天。这里说的是 ChatGPT desktop app 的聊天入口，不包含替人继续对话、自动处理任务或读取其他桌面内容的 agent 能力。Mini 保留同一组入口不喜欢桌面宠物可以选 Mini。ChatGPT 给它的定位很明确：保留与桌面宠物相同的快捷入口和聊天更新，换成更小的屏幕占用。两种形态都要到 ChatGPT desktop app 的设置里选择。系统范围还没有写清没有列出 macOS、Windows 的支持情况，也没有给出版本号、地区或推送节奏。可见回复里有人称最新版 macOS 没有显示，也有人询问 Windows；这些都只 const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

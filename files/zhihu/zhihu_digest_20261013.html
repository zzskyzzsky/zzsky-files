", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "同样是夺位，为什么朱棣的骂声远大于李世民？", "excerpt": "因为李世民只是在家人范围内解决，Judy祸及他人了。而且彻底的打断了明朝向西北推进的能力。", "url": "https://www.zhihu.com/question/2075507755029370365/answer/2093098651757367729", "votes": 2, "comments": 0, "feed_ts": 1791813607, "feed_time_str": "10-12 22:00", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "MCU 都有什么高级用法？", "excerpt": "其实MCU高级开发，本质上就三个核心策略，几乎所有工程层面的优化，都是从这三点衍生出来的。 第一个思路：尽可能减少CPU的使用，多利用硬件外设加上DMA来提升MCU整体处理效率。 MCU的主控主频普遍都不高，能交给硬件做的事情，就尽量不要占用CPU。举串口通信的例子，传统写法要么轮询收发，要么普通中断收发，虽然功能没问题，但是CPU需要频繁介入，不断搬运、解析每一字节的数据。 更高效的方案就是串口", "url": "https://www.zhihu.com/question/623077193/answer/2092902923915245444", "votes": 17, "comments": 1, "feed_ts": 1791812523, "feed_time_str": "10-12 21:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么古代的死士肯为主人卖命？", "excerpt": "我发小，快四十了，没上过班，受不了被人管。他有个好朋友，开个小厂。厂里缺人手了就叫他，卸货、打包、抬机器，干完给三百两百，再请他吃顿路边摊。发小从不推辞，也不嫌少。 前几天厂里出了事，订单急着要交，人手不够。他那朋友没好意思叫他。发小晚上听说了，自己骑电动车来了，还叫了两个哥们儿，干了一整夜。货按时发走，他朋友掏钱，发小不要：“请我吃早饭。” 俩人就蹲厂门口喝豆腐脑、吃油条。他朋友问他：“我这厂子", "url": "https://www.zhihu.com/question/664635995/answer/2092730581876581172", "votes": 473, "comments": 34, "feed_ts": 1791811539, "feed_time_str": "10-12 21:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "法债危机，债市需要看到法国怎样的变化才会转向？欧洲央行会出手救助吗？", "excerpt": "现在法国正在发生的危机，不只会蔓延到整个欧洲，最终也是美国将要发生的危机的前奏。 但全球主权债务收益率涨到现在，也没把这些国家拖进衰退，有三个原因：美国的AI资本开支、欧洲的国防投资，以及大部分债务都在政府的资产负债表上，而不在私人部门。 最重要的是要知道：一旦这些投资的增速放缓，股市就会面对非常大的抛压。 这次法德利差走阔的幅度，已经超过2010年希腊债务危机、2012年西班牙债务危机，甚至比2", "url": "https://zhuanlan.zhihu.com/p/2093067642496197973", "votes": 17, "comments": 1, "feed_ts": 1791810515, "feed_time_str": "10-12 21:08", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待由 Opus 5.5 生成的各类科普视频爆火？AI 正在改变科普内容的创作方式吗？", "excerpt": "是的，我已经先试过了，标标准准的用 Opus 5.5 生成的科普视频。 你看效果是不是还不错？一个 1 分多的视频，拿到了差不多 1.5 万的浏览量、300 多点赞、400 多转发。看起来数据还挺不错的对吧。 当然了，这个时候肯定画风一转提到“但是”了。但我跟你说，你可以看一下我是怎么做的，非常简单，我觉得根本没有什么需要保密的机密内容：我就是在 Claude 上面跟 Claude 说了这么一句话", "url": "https://www.zhihu.com/question/2093008136088938434/answer/2093084929626215102", "votes": 69, "comments": 6, "feed_ts": 1791810335, "feed_time_str": "10-12 21:05", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "编译船夫", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "老公晚上喝酒将近11点回来，我不给他开门，对不对？", "excerpt": "今年公司年会，我在断片前最后一瞬间给我媳妇打了个电话，告诉她我在哪个酒店…… 之后浑浑噩噩间听见一阵子“是嫂子吧，嫂子来了”…… 我媳妇扶我起来，有好事者还要和我再炸一壶，夫人接过酒壶一饮而尽，满场震惊，我顺利回家……到家之前在小区门口吐的一干二净 年夜饭，我妈说起此事，一脸厌恶。 夫人说：喝酒喝多了分两种，一种开心的喝多了，一种应酬被人灌多了。 前者他那么开心才我为啥要拦着 后者他已经很难受了，", "url": "https://www.zhihu.com/question/531151302/answer/2021760145290527739", "votes": 29830, "comments": 754, "feed_ts": 1791810200, "feed_time_str": "10-12 21:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "编译船夫", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "#记录运动时刻# 清晨5:40起床，运动25分钟，奔赴机场，开启新的一天", "excerpt": "#记录运动时刻# 清晨5:40起床，运动25分钟，奔赴机场，开启新的一天", "url": "https://www.zhihu.com/pin/2092139143660938640", "votes": 0, "comments": 0, "feed_ts": 1791810062, "feed_time_str": "10-12 21:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "剑锋无尘", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "为什么绝对不能扛单？", "excerpt": "做交易最重要的就是风险管理，设好止损，不要扛单，避免出现大亏。 如果这个问题认识不到，不管跟谁做，不管学谁的方法，不管技术分析多厉害，最后一定都是亏。 国外有一个做商品期货非常厉害的大佬彼得·布兰特，做了40多年交易，他的胜率是多少呢？ 他自己公布过，他长期胜率大概只有42%。也就是说，十次交易里面只有四次左右赚钱，大部分都是亏损。但是他的收益率呢？ 他1981年至2010年经过独立审计的交易记录", "url": "https://zhuanlan.zhihu.com/p/2093075488902210970", "votes": 16, "comments": 1, "feed_ts": 1791809553, "feed_time_str": "10-12 20:52", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "文物、古迹沉默无言，为什么它会比书本里的文字更能震撼人心？", "excerpt": "举个实例来解读这个问题吧。 重庆合川的钓鱼城遗址，这片被嘉陵江、渠江、涪江三面环抱的险要之地，曾创造了宋蒙（元）战争期间，坚守36年未被攻破的军事奇迹。甚至于当至元十三年（1276年）元军会师南宋首都临安城下的时候，为了牵制元军的行动，钓鱼城的守将张珏仍不断出击，还一度收复了泸州、夔州和涪州等地，给了元军不小的心理震撼。 “元南侵而必自蜀始，岂非有见于此与？冉氏弟兄受知余玠，而首画城钓鱼之策；王坚", "url": "https://www.zhihu.com/question/2086448718421803817/answer/2093064668952764541", "votes": 20, "comments": 2, "feed_ts": 1791808368, "feed_time_str": "10-12 20:32", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待Andrej Karpathy提出「AI能力认知漏斗」，少数专业人士已开始有「眩晕感」？", "excerpt": "卡帕西的影响力恐怖如斯！昨天晚上我看了他发的这条推文之后，就用 ChatGPT 把他的博文可视化了一下，做了个漏斗图。今天早上一看，竟然有 800 多个点赞和 10 多万浏览。 但回过头来看，我做的这个漏斗图其实并不是很准确： 1. 漏斗最开始应该从总体数据切入。他提到约 60 亿人没有用过，但全球总人口理论上应该有 80、90 到 100 亿人，所以最上面应该再加一层，这个图才对。 2. 整个漏", "url": "https://www.zhihu.com/question/2092928330336925348/answer/2093076516682871590", "votes": 32, "comments": 0, "feed_ts": 1791808329, "feed_time_str": "10-12 20:32", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价“没有洋人，你就没有手机可以玩”这样的片面的言论？", "excerpt": "一个洋人发明出来一个东西，你受益了，你感恩他一个人，你这是知恩图报。 一个洋人发明出来一个东西，你受益了，你却要感恩所有洋人，你这是恩将仇报。 因为你践踏了发明人的署名权（身份荣誉权）。 所以正确的说法是：没有马丁·库珀（Martin Cooper 现代手机之父） ，你就没有手机可以玩。 PS：在你手机里 5G 相关的“标准必要专利SEP”，中国约占比42%，其余 58%的分散在 190 多个国家", "url": "https://www.zhihu.com/question/2089399048218358773/answer/2092151651511620619", "votes": 4683, "comments": 321, "feed_ts": 1791806678, "feed_time_str": "10-12 20:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待我国的死刑制度，是否可以进一步的加强或者扩大呢？", "excerpt": "我提醒一点，97年之后很少扩大死刑适用范围或者降低死刑标准，事实上近年来唯一扩大死刑适用范围的罪名是强奸罪。这个罪名似乎并没有受到什么威慑，反而犯罪人数打着滚往上翻。 如果这种威慑作用真的存在的话，商纣应该还在朝歌摆弄炮烙，教廷应该还在罗马研究火刑架，难道姬发和哥白尼受到什么天意爷指使，所以不被重刑震慑吗？ ", "url": "https://www.zhihu.com/question/2092571051255411616/answer/2092578244495144176", "votes": 32, "comments": 6, "feed_ts": 1791806656, "feed_time_str": "10-12 20:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "漢人在大元国、大清国亡天下的本质原因是什么？", "excerpt": "秦汉唐宋元明清，亡天下的罪魁祸首，从 诸侯贵族 到世家 到豪门望族 到外戚 到宦官 到武将 到文官东林党 到士绅 到红颜祸水，所有人都怪了个遍 控制变量的法了解下， 唯一一直存在，却站在受害者角度完美隐身的，那个，才是真正的祸根。 权力越来越大，越来越不受制衡，越来越履行不了 和 权力相匹配 的越来越大的义务 的皇权。 ", "url": "https://www.zhihu.com/question/3857759649/answer/130782415198", "votes": 316, "comments": 12, "feed_ts": 1791806347, "feed_time_str": "10-12 19:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "AI教育科普", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "个人感觉你就是在偷换概念，如果有老板信你这番话，那个人就做不成老板了。", "excerpt": "个人感觉你就是在偷换概念，如果有老板信你这番话，那个人就做不成老板了。", "url": "https://www.zhihu.com/pin/2093068179392173045", "votes": 0, "comments": 0, "feed_ts": 1791806341, "feed_time_str": "10-12 19:59", "category": "pin", "cat_name": "想法动态"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "漢人在大元国、大清国亡天下的本质原因是什么？", "excerpt": "因为汉人总想搞一个绝对中央集权，绝对君主集权的，可以让后代一世，万世享福的玩意 然后这个玩意就总是崩盘 你没感觉奇怪吗？东周三四百年，春秋战国，北方游牧几乎就是小透明，一直被定期按着刷经验的玩意，根本上不了台面的东西罢了，结果秦始皇一统六国，匈奴迅速就崛起了，然后成为了汉朝心腹大患。 这是大一统中央集权的弊端所在，边关不能部署过于精锐的部队，战国时期，北方是燕国和赵国，两个独立的国家，就地募兵，就", "url": "https://www.zhihu.com/question/3857759649/answer/2088577176576726977", "votes": 1641, "comments": 143, "feed_ts": 1791806263, "feed_time_str": "10-12 19:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "PP鲁", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "AI杂感1", "excerpt": "以目前的大模型能力，基本上可以确定社会上白领生态位的消失。更准确的说法是基于智力稀缺建构的整套生育-教育系统的智力再生产系统被淘汰，从而动摇了所有——我是说你能想到的所有——依赖智力稀缺（我看得懂汇编语言/法律条文/微分方程你看不懂）来进行权力分配的底层逻辑。 以简单的印刷机-知识/llm（当下水平）-智力作为对比，不难看出两次革命引发的类似的变化：印刷机时代之前知识属于贵族阶层，或者说知识的保管", "url": "https://zhuanlan.zhihu.com/p/2083347994557076382", "votes": 837, "comments": 110, "feed_ts": 1791806114, "feed_time_str": "10-12 19:55", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn" 费者和女装商家都有问题，各打50大板还有看起来特别客观的，举了一大堆数据，指出女装问题和女消费者无关，所有问题都是商家的从场面看，三方观点都有道理，未来都有学术空间对不对但事实是，一旦", "url": "https://www.zhihu.com/pin/2092746321925093075", "votes": 0, "comments": 53, "feed_ts": 1791773449, "feed_time_str": "10-12 10:50", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大水哥", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价户晨风说:我国普通打工人一天工资，在steam买不到一个全价3A游戏！而日韩却可以？", "excerpt": "户晨风是谁不认识，仅对比买游戏的价格没有意义。 中、美欧日韩最大的差别是硬支出不一样。 在中国你的硬支出可以压的很低，你可以不交房产税，物业费很低，公立学校学杂费极低，医疗花费很低，低价也可以买到新鲜健康的食物，公共交通发达出行成本低。也就是说只要你想，你可以把硬支出压低到令人发指的地步。 美国房产税、物业费是一个很大的开支，房租、教育、医疗、保险、出行都需要很高的固定支出，这些都是硬支出，你靠压", "url": "https://www.zhihu.com/question/2092416479002112336/answer/2092925597873861071", "votes": 33, "comments": 6, "feed_ts": 1791772347, "feed_time_str": "10-12 10:32", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "有点绷不住了，这回答对着报道抄还能抄错的？我看有些内容明显是编造的，该回答有毛病（或者说刻意没提、编造）的几点：1.波公1925年生人，60岁（1985年）娶绍帕查塔她妈密松（Mea som），当时密松年龄确实很小。而且原来绍帕查塔也不叫现在这个名字，她原来叫密西（Mea sith），是后来娶了她妈那个便宜老爹狄昆纳（该回答也有提到，就是那个大使）在2001年劝她改名她才改的名字。波公根本不是什么67岁才娶密松。2.文中提及狄昆纳在“马来”当市长，其实这个马来指的是柬埔寨班迭棉吉省梅莱山县，这是一个县而不是文中提及的市，2003年起狄昆纳在梅莱山当过几年副县长，2014年时已经退休。3.1998年波公死亡7个月后狄昆纳就娶了密松，有说法认为是为了保护对方，但不知道还有没有其他因素。4.绍帕查塔1985年出生，她对父亲波公的全部认知都是相对积极一些的，这也不奇怪，因为她没接触过波公那些破事。但是该回答说她7岁时波公去世这就很搞笑了，她和母亲1998年叛逃到当局时已经13-14岁。5.什么没有“失贞”……这什么乱七八糟的？能不能别再用中国人思维去理解高棉人或泰国人越南人了？密松和狄昆纳结婚后又生了两个孩子，人家还活得好好的怎么咒人家死呢？链接6.绍帕查塔被她便宜老爹狄昆纳和朋友保护起来，这也是为了避免媒体和NGO介入，而且没看出来她生活环境有多优越，2004年高棉时报还采访过她。链接7.这次婚姻中法国红色高棉研究大家亨利·洛卡德也有参与，乔森潘的老婆也来了，曾与英萨利共事过的红色高棉外交官宋西孔也来了，还有一些其他曾与波公长期共事过的红色高棉成员，但实际上很多人因为旅费不够来不了，也未曾听说过有人提到密松什么失贞之类莫名其妙的观点。8.绍帕查塔的丈夫西维切卡（Sy Vicheka）是在马来西亚留学时结识了她，家庭环境应该也是相对不错的，也可能是某个权贵的亲戚，但如果真的算是权贵之后媒体和NGO大概率扒干净了。可能西维切卡是某个富商的儿子或者别的什么背景，但是我没查到有报道声称其家族是经营赌场的，有查到的朋友麻烦提供一下出处。9.密松未曾听说过还有个兄弟（文中提及的舅舅），倒是狄昆纳自己名下据说的确有一家碾米厂，但未曾听说过他家的碾米厂垄断了柬埔寨西北部的大米生意，狄昆纳本人也未见在柬埔寨政坛拥有多大程度的影响力。10.波公没把宋成当成他的继承人，这一点该回答也是纯瞎编的。另外婚礼举办的地点梅莱山是原民柬国民军450师的老巢，该师负责人索菲2025年7月份去世，在当局内地位斐然。也就是说婚礼是在英萨利一派的影响范围内举办，不过大家伙也没什么意见，梅莱山本来就住着很多红色高棉的老干部。11.该回答编造了婚礼当天数以千计的人参加的虚假事实，实际上婚礼相当低调，并没有引起公众太大的关注，据报道会场也就50多人，很可能所有人加起来都不足百人，哪里来的几千人？总结，该回答是一篇借用了现有报道但进行了编造的回答。", "excerpt": "有点绷不住了，这回答对着报道抄还能抄错的？我看有些内容明显是编造的，该回答有毛病（或者说刻意没提、编造）的几点：1.波公1925年生人，60岁（1985年）娶绍帕查塔她妈密松（Mea som），当时密松年龄确实很小。而且原来绍帕查塔也不叫现在这个名字，她原来叫密西（Mea sith），是后来娶了她妈那个便宜老爹狄昆纳（该回答也有提到，就是那个大使）在2001年劝她改名她才改的名字。波公根本不是什么", "url": "https://www.zhihu.com/pin/2092906495155425961", "votes": 0, "comments": 0, "feed_ts": 1791772181, "feed_time_str": "10-12 10:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "刚刚，Karpathy称全球只有5000人，真正接触过最前沿AI", "excerpt": "有点出乎预料了。 刚刚，Karpathy 在推文中估计， 现在全球真正能够接触最前沿内部 AI 系统的人，可能只有 5000 人左右。在这些前沿实验室内部，成千上万个 Agent 可以组成协作集群，连续运行数周，推进大型软件项目，发现零日漏洞，以机器速度参与网络攻防，甚至推动科学发现和前沿数学研究。 更令人惊讶的是： 大约有 60 亿人，几乎还没有真正接触过 LLM。 链接：https://htt", "url": "https://zhuanlan.zhihu.com/p/2092924676733400847", "votes": 54, "comments": 5, "feed_ts": 1791772161, "feed_time_str": "10-12 10:29", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "郭德纲乱说烈士名字到底怎么想的？哪里适合作为相声包袱了？", "excerpt": "就比如这位，他的名字既可以是军统头子，也可以是革命烈士。 ", "url": "https://www.zhihu.com/question/2071887840867366714/answer/2079011235450843959", "votes": 383, "comments": 17, "feed_ts": 1791771615, "feed_time_str": "10-12 10:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "从这50个细节，读懂山姆的与众不同", "excerpt": "导语：山姆对商业经营者、乃至对所有致力于做好一件事的人，都有着务实的启示，即不必寻找所谓的秘诀，而是将他人不屑于执行的细节逐一落实到位，直至他人难以模仿。时间会将这一切沉淀为难以夺走的核心能力。 路言/作者 砺石商业评论/出品在中国零售市场，山姆会员商店是一个兼具高关注度与高误解度的样本。 其高关注度，源于它已成为中产家庭消费的标准配置之一。2026财年销售额约1400亿元、付费会员约1070万、", "url": "https://zhuanlan.zhihu.com/p/2092917994255036669", "votes": 1, "comments": 0, "feed_ts": 1791771015, "feed_time_str": "10-12 10:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "持续低熵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待 OpenAI 公开 722 份数学手稿，宣布解决包含「准黎曼猜想」的数百个数学问题？", "excerpt": "谈谈AI的数学能力和数学成就（三）AI独立解决猜想的能力很强，但又明显不够强（中） （说明：我在微博上写了面向社会人士解释AI数学能力与成就的系列微博。这是其中一篇。感兴趣的读者可以去微博搜“持续低熵喜欢胶球”看其他篇。） 5 AI解决猜想的能力偏向性很明显。AI擅长综合现有工具和强啃硬骨头，不擅长制造新概念新理论框架和搞“以柔克刚”的数学。 我先解释一下强啃硬骨头风格的数学和以柔克刚风格的数学。", "url": "https://www.zhihu.com/question/2091064625987170716/answer/2092919217926432080", "votes": 19, "comments": 4, "feed_ts": 1791770826, "feed_time_str": "10-12 10:07", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "俄亥俄提前投票情况补充", "excerpt": "这篇作为之前的补充，原本不想去那些官方网站拉数据进行计算和假设，我不喜欢以假设去推导，不可控因素太多，但是外网不少人以 22 年中选提前亲自投的数据来说今年民主党投票热情高涨，我详细说一下这事。 本文将以克利夫兰所在的凯霍加县的数据来分析； 这是 22 年凯霍加县的投票总数，其中提前投票（邮寄加提前亲自投票加少数选举日后处理收到的邮寄票）； 133357 + 19918 + 509 + 2482 ", "url": "https://zhuanlan.zhihu.com/p/2092280141930149628", "votes": 25, "comments": 31, "feed_ts": 1791769209, "feed_time_str": "10-12 09:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "UFO", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "太阳系是扁平的，那向上或向下飞，不就可以快速飞出太阳系了吗？", "excerpt": "不能，因为题干就是错的。 首先，太阳系并不是扁平的。扁平的只是八大行星的公转轨道面。在太阳诞生后，剩余的气体和尘埃组成了围绕着新生恒星的原 行星盘，大行星们便是在这里凝聚诞生的。原行星盘是个扁平的、围绕太阳旋转的盘面，因此，凝聚后的大行星的轨道平面接近于同一平面。地球的轨道与太阳的不变平面（穿过太阳 质心且垂直于太阳角动量矢量的平面）的倾角略大于1°，木星的轨道与不变平面的倾角略大于0.5°，而倾", "url": "https://www.zhihu.com/question/1888618640896657261/answer/2088284262986524618", "votes": 863, "comments": 47, "feed_ts": 1791768801, "feed_time_str": "10-12 09:33", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "小旋风财进", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "媒体曝46岁「数学家」用AI炒股登上富豪榜，年赚642亿，如何看待这一造富神话？对普通人有借鉴意义吗？", "excerpt": "出现这类新闻，一定会冒出一堆AI炒股软件，号称数学家同款策略，还有各种付费社群。这些人卖的东西跟格尔科做的事没半点关系，格尔科赚的是做市价差，靠速度取胜，卖课的人赚的是学费，商业模式不同，不要被骗了。 这642亿不是炒股赚的，是因为他的公司估值涨了，核心是一套交易系统，主业是做市，门槛是数据、算力、牌照，还有资本金，AI只是工具。 格尔科1979年出生在莫斯科，俄罗斯犹太人 莫斯科国立大学数学专业", "url": "https://www.zhihu.com/question/2092640723375842413/answer/20929096514 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

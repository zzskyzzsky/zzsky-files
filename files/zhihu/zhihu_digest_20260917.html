": 0, "comments": 27, "feed_ts": 1789579208, "feed_time_str": "09-17 01:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "王多鱼-加油", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待 DeepSeek 刘胜与的《我不得不把才华埋葬在昨天》？", "excerpt": "实际上不仅仅是佬提到的cuda算子开发，整个大模型推理系统模型支持，模型性能优化都被GPT6彻底打穿了。 就以文章里DeepSeek的ds v4.1 flash为例子。SGLang开始支持的时候，gb300 single node bs=1最开始的那个baseline版本只有30多tokens，但是在GPT6大人发挥神威之后一周多就把这个性能提升到了1000+ tokens/s。虽然我们做了人工干", "url": "https://www.zhihu.com/question/2083123101873844765/answer/2083264378355373027", "votes": 2030, "comments": 178, "feed_ts": 1789578573, "feed_time_str": "09-17 01:09", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "🤣👉🤡", "excerpt": "🤣👉🤡", "url": "https://www.zhihu.com/pin/2083714228276433036", "votes": 0, "comments": 6, "feed_ts": 1789578562, "feed_time_str": "09-17 01:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Gemini 3.8 Live和Live Extended Thinking语音助手最让人没底的时刻，常常出现在它查资料、调工具后忽然没声：是在处理，还是卡住了？Google DeepMind 新发的 Gemini 3.8 Live，想解决的正是这段“空等”。后台任务不再把对话切断Google 描述的是另一种交接方式：工具和 API 在后台运行时，模型还能先确认你的请求、继续聊天。对语音交互来说，关键变化是你不必为了等一个后台动作，把整段对话停在原地。Extended Thinking会报进度高复杂、多步任务可以优先看 Gemini 3.8 Live Extended Thinking。它会一边推理一边说话，用类似“我先查一下”的口头确认接住问题，并在多步任务进行时叙述进度。这样做解决的是沟通断层，不等于每个任务都会更快完成。两款模型各管什么Gemini 3.8 Live 面向规模化使用和成本效率，主打流畅对话与近实时视觉理解；Extended Thinking 面向高复杂、多步推理。两者都支持在对话中自动识别并切换 97 种语言，也都支持后台工具调用。需要复杂处理时可以看 Extended Thinking；普通实时语音服务则可把 Live 的官方定位作为选型起点。入口已经分开，别只看发布名开发者可以从 Gemini API 和 Google AI Studio 开始；Gemini Enterprise 目前是私测。面向普通用户，3.8 Live 被列入 Search Live；Extended Thinking 还进入 Gemini Live，并覆盖部分 Workspace、Gmail 和 Keep 入口。不同入口的地区、账户资格和完整价格，官方这篇说明没有逐项展开。", "excerpt": "Gemini 3.8 Live和Live Extended Thinking语音助手最让人没底的时刻，常常出现在它查资料、调工具后忽然没声：是在处理，还是卡住了？Google DeepMind 新发的 Gemini 3.8 Live，想解决的正是这段“空等”。后台任务不再把对话切断Google 描述的是另一种交接方式：工具和 API 在后台运行时，模型还能先确认你的请求、继续聊天。对语音交互来说，", "url": "https://www.zhihu.com/pin/2083718608480363769", "votes": 0, "comments": 0, "feed_ts": 1789577259, "feed_time_str": "09-17 00:47", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "前 OpenAI ChatGPT研究员推出新模型 Jev前 OpenAI 研究员 Diogo Almeida 曾参与 RLHF、InstructGPT 和 ChatGPT 的研发。如今他创办的 TypeSafe AI 推出首款“系统一模型”Jev，专注于结构化决策，而非文本生成。很多业务流程里的代码，需要一个能直接接下来的判断：这张工单该分给谁、这笔交易要不要拦、这段内容属于哪个类别、这次工具调用风险多高。Jev 瞄准的就是这类位置。它不生成聊天文本，也不写代码；程序把状态和事先定义好的问题交给 Jev，拿回的是可直接分支、排序或路由的结构化结果，以及校准后的概率和置信度。文本生成卡在软件中间现有 LLM 能写出 JSON，但软件通常还得解析、校验，并处理格式不对或输出跑偏的情况。Jev 的做法是把可选答案和返回结构预先定义好，让模型只在这个范围内作答。TypeSafe AI 的开发者文档给了三个基本问法：Choice 用于从选项里选择，Score 用于按量表打分，Noul 用于判断一句话是否为真。同一次调用可以放入多个问题，它们针对同一份状态独立并行评估。快和便宜从哪来Jev 不逐 token 往后写文本，而是在一次查询中并行输出这些已定义问题的概率。TypeSafe AI 将这种产品归为 System One 模型，适合信息已经齐备、熟练的人几秒内就能做出的范围明确判断。端到端响应时间 70ms 到 500ms；在“System One 类型查询”且同等前沿智能水平的比较中，可能比前沿 LLM 快 40 到 200 倍。输入价格标为每百万 token 0.042 美元，输出 token 免费。这里的数字描述的是 TypeSafe AI 的产品和评测范围，不能外推为所有 AI 任务都更快、更省。适合放在哪些环节它适合给已有软件加“模糊判断”：分类、路由、评分、抽取、规则分支，或给大模型输出做校验与风险分流。比如一个工作流先把合同、工单或用户请求整理成状态，再让 Jev 分别判断优先级、风险等级和下一步去向，最后仍由代码决定怎么执行。需要长篇推理、权衡很多互相牵连的因素，或者需要写解释、对话、文案和代码时，Jev 就不在它的设计范围内。TypeSafe AI 的文档也建议把复杂问题拆成多个原子判断，再在代码里组合，而不是丢给模型一个宽泛大问题。类型安全不等于判断永远正确预先定义结构能保证输出格式符合 schema，不能保证模型总能选中语义上正确的选项。TypeSafe AI 声称每次输出都会给校准后的概率和置信度；这是否能在不同企业数据和真实工作流中持续成立，仍需要外部测试。", "excerpt": "前 OpenAI ChatGPT研究员推出新模型 Jev前 OpenAI 研究员 Diogo Almeida 曾参与 RLHF、InstructGPT 和 ChatGPT 的研发。如今他创办的 TypeSafe AI 推出首款“系统一模型”Jev，专注于结构化决策，而非文本生成。很多业务流程里的代码，需要一个能直接接下来的判断：这张工单该分给谁、这笔交易要不要拦、这段内容属于哪个类别、这次工具调用", "url": "https://www.zhihu.com/pin/2083716792329958015", "votes": 0, "comments": 0, "feed_ts": 1789577030, "feed_time_str": "09-17 00:43", "category": "pin", "cat_name": "想法动态"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么资本主义没有灭亡？", "excerpt": "现存的，和以前出现过的社会主义制度，尽管在生产力方面展现出难以置信的先进性， 但是底层逻辑都是有“漏洞”的。 因为你要组织国家、组织生产，或者就是单纯的组织一些社会活动，那么一定会有人掌握权力。 这种权力发展到一定规模，就会要求远远凌驾于劳动人民之上的物质享受。 资本主义社会的逻辑就是，掌握了社会权力，等于自动攫取物质财富。 然而问题就出在这里，社会主义核心逻辑，是排斥这种特权阶级攫取财富。 简单", "url": "https://www.zhihu.com/question/625229413/answer/2083715930186575975", "votes": 18, "comments": 3, "feed_ts": 1789576591, "feed_time_str": "09-17 00:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "高通量材料实验室训出NeonPeriodic Labs 把 Neon 放进了自家的材料实验室，先让它处理 X 射线衍射（XRD）分析。样品做出来以后，研究人员要从衍射图里判断有哪些晶相、各占多少；复杂样本的峰会重叠，通常还得结合实验条件、历史记录、模拟和晶体数据库，专家常要花数小时完成一次判断。134 个高难 XRD 样本里的 55.3%这次公开的是 FrontierXRD 内部评测：134 个难样本，Neon 的成功率为 55.3%。作为训练起点的开源模型 Kimi K2.6 为 2.7%。这组数字只对应特定的 XRD 分析任务。这组分数来自 Periodic Labs 的科学评测环境。评审使用经过专家标注校准的 Opus 5 与 GPT-5.6-Sol 组合，因此它给出的是内部任务上的进展信号，独立横评仍然缺席。实验数据怎样回到下一轮Periodic Labs 把材料发现拆成三步：先提出要制备什么材料，再预测合成方式，最后分析实际制出的样品。实验室持续产生新数据，团队用这些数据训练 Neon，再把它用于分析结果和协助选择下一次尝试。这个闭环比单看一张榜单更值得细看。XRD 分析连接着实验结果与下一步配方选择；如果这一步能稳定缩短，模型才可能真正进入材料实验的日常流程。Neon 目前覆盖的范围Neon 目前部署在 Periodic Labs 自己的实验室，公开材料没有给出外部使用入口。初始方向包括超导体和磁体材料。对想跟进 AI for Science 的读者，这条消息提供了一个具体观察点：先看模型能否在一类真实实验分析里持续可靠，再看它能否扩展到更多实验和独立评测。", "excerpt": "高通量材料实验室训出NeonPeriodic Labs 把 Neon 放进了自家的材料实验室，先让它处理 X 射线衍射（XRD）分析。样品做出来以后，研究人员要从衍射图里判断有哪些晶相、各占多少；复杂样本的峰会重叠，通常还得结合实验条件、历史记录、模拟和晶体数据库，专家常要花数小时完成一次判断。134 个高难 XRD 样本里的 55.3%这次公开的是 FrontierXRD 内部评测：134 个难", "url": "https://www.zhihu.com/pin/2083715613789312490", "votes": 0, "comments": 0, "feed_ts": 1789576544, "feed_time_str": "09-17 00:35", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "GPT-5.5将从ChatGPT、Work 和 Codex中下线10 月 14 日，GPT-5.5 会从 ChatGPT、ChatGPT Work 和 Codex 的所有方案中下线。还在 Codex 产品界面里选它写代码的人，需要先确认是否在用 API key 认证的会话：这决定了公告是否直接影响你。10月14日：产品界面的选择会变ChatGPT 账号列出的范围是 ChatGPT、ChatGPT Work 和 Codex 的所有方案；它也直接给 Codex 用户指了替代选项：GPT-5.6 Sol 或 GPT-6 Astra。对在产品界面里选 GPT-5.5 的人，这就是需要提前适应的新选择。API key：Codex有明确例外OpenAI Developers 随后补了一句更关键的话：GPT-5.5 仍会在 OpenAI API Platform 提供，也仍能用于 API key 认证的 Codex 会话。API key 可以简单理解成开发者用密钥把 Codex 连到 API 的方式；这类会话不在这次已说明的退役范围里。别把例外扩大成“完全不受影响”OpenAI没有在这两条公告里给出迁移设置、价格或 GPT-5.5 与新型号的能力对比，也没有公布 GPT-6 的发布安排。所以目前能确认的是范围，不是“无缝迁移”，更不是“GPT-6 马上发布”。先看自己是从 ChatGPT/Codex 产品内使用 GPT-5.5，还是在 API key 认证的 Codex 会话里调用它。前者应按公告准备切到 GPT-5.6 Sol 或 GPT-6 Astra；后者目前仍在官方明确保留的范围内。现在先把连接方式和产品内选项分清，再考虑要不要切换模型。", "excerpt": "GPT-5.5将从ChatGPT、Work 和 Codex中下线10 月 14 日，GPT-5.5 会从 ChatGPT、ChatGPT Work 和 Codex 的所有方案中下线。还在 Codex 产品界面里选它写代码的人，需要先确认是否在用 API key 认证的会话：这决定了公告是否直接影响你。10月14日：产品界面的选择会变ChatGPT 账号列出的范围是 ChatGPT、ChatGPT ", "url": "https://www.zhihu.com/pin/2083714091831636294", "votes": 0, "comments": 0, "feed_ts": 1789576205, "feed_time_str": "09-17 00:30", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价 18.99 万起售的比亚迪方程豹轿车「方程 S」，有哪些亮点值得关注？", "excerpt": "全能之上更显个性 就有一说一，我感觉近一年的迪子正在慢慢刷新大众对他的印象。 就最早大众对比亚迪的印象，应该是典型的硬核技术实力派，论技术底蕴是最强的，没得说。 但迪子当时不是没有短板。 比如外观颜值这块，对比那些重视外观设计的车企来说，可能有点差距，而且在内饰设计上，跟那些主打冰箱彩电、内饰质感、外观设计的车企，可能也做的不够突出。 而这点差距，直接影响了迪子的品牌调性、企业形象，甚至还有产品溢", "url": "https://www.zhihu.com/question/2083656707272611451/answer/2083710967087683432", "votes": 30, "comments": 11, "feed_ts": 1789575408, "feed_time_str": "09-17 00:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "1000米恐惧症", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "古代的老百姓明明活的很惨，为什么还会有莫笑农家腊酒浑，丰年留客足鸡豚，这样的诗句？", "excerpt": "你是不是以为，陆游出去玩，天晚了，随便找了个南宋农民家里借宿。结果发现，就这么随便一个南宋农民家庭，有酒还有肉。你感叹道，哎呀，这南宋真是富啊。随便一个农民，都能吃肉喝酒。 首先我们要了解一下，陆游的家世背景。 陆家是浙江地区的藏书世家，在古代能藏书的家族，那可不是一般的家族。陆游的爷爷，师从王安石。陆游的爸爸是省级高官，担任京西路转运副使。这是什么概念？北宋朝廷开朝会，站前三排不敢说，但站前三排", "url": "https://www.zhihu.com/question/665878023/answer/4010118821", "votes": 24651, "comments": 1615, "feed_ts": 1789574635, "feed_time_str": "09-17 00:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "魔法少女厄加特", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "“我宁愿孩子快乐地倒数，也不愿他抑郁地第一”这样的教育选择你敢吗？", "excerpt": "小学二年级的时候，我的一篇作文获得了全市中小学生作文比赛二等奖。 这个奖项的含金量有多高呢，当时候我们市里大概有七八所小学，别的学校我不知道，反正我们小学一千多快两千个学生每人都交了 为充满劣根性的民族，今天倭人能够活得像个人的大部分进步因素都是德川幕府统治的江户时代形成的。 往前有八公二民可能都不算极限的诸位大名，往后的明治到昭和，倭民连活着都不怕还怕死吗？现代日本人能拥有东京这座大城市来在日常生活层面短暂摆脱一亿总保守的乡下老保，也跟江户时代就实现人口破百万的首都建设息息相关。 还有朱子学，在中州可能被视为文化糟粕，但在日本绝对是向人类方向进化的伟大催化剂；整治了过于拟人", "url": "https://www.zhihu.com/question/1900164005181526533/answer/1904051215823802875", "votes": 3046, "comments": 236, "feed_ts": 1789571193, "feed_time_str": "09-16 23:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "南爸安爸", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "你试过把灰指甲连根拔起吗？", "excerpt": "没必要，巨疼还容易得甲沟炎，有条件的，就直接去买几支高渗透性的灰指甲抑菌膏，用不了多久就能把甲床里的灰指甲菌清干净 非常适合像我一样指甲增厚、发黄、空甲的人 很多人对灰指甲有个误解，觉得指甲坏掉了，物理上把它摘除，重新长出来的就是好的。 从逻辑上看好像没毛病，但真实情况是，灰指甲的根源压根不在那块已经死掉的硬甲板上，而是藏在甲床和周围皮肤组织里的真菌。 拔甲移除的只是被真菌侵蚀的角质甲片，却没有动", "url": "https://zhuanlan.zhihu.com/p/2043394136905085307", "votes": 626, "comments": 139, "feed_ts": 1789569418, "feed_time_str": "09-16 22:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "军机处这种临时指挥机构这么好用，为何现代没有国家采用了？", "excerpt": "谈到军机处的问题，我们先把目光投向遥远的美国，相信短视频刷得勤的知乎ER，应该都看到过这个人——娜塔莉·哈普。 娜塔莉·哈普，35岁，特朗普的总统行政助理。她的正式头衔很普通，但她做的事情不普通。特朗普不爱看屏幕，哈普就把新闻、帖子、短视频截图找出来，先打印，再递给“老板”。白宫工作人员和记者叫她“人肉打印机”。更关键的是，她有时不经幕僚长、通讯办公室或国家安全团队报备，直接执行特朗普的指令。特朗", "url": "https://www.zhihu.com/question/1975139999579129588/answer/2082514346031239296", "votes": 83, "comments": 10, "feed_ts": 1789569297, "feed_time_str": "09-16 22:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "DefTruth", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "AI Infra的未来最近刷小红书，刷知乎，越来越多的帖子在问，Agent会不会取代AI Infra领域的工程师，就像前端后端那样。我其实在今年写的几篇文章里面算是general地回答过这个问题，但是再专门地聊一下可能观点会更清晰。首先必须要承认，Agent的能力深刻改变，或者说重塑了AI infra每一层的工作范式，框架，算子，编译器都需要重新思考自己的定位（这部分说来话长先不具体展开了），在这个过程中，身处其中的人当然会面对很大的挑战，没有跟上变化的人会被淘汰，组织架构可能也会有巨大的调整，总的岗位数有可能减少，也可能增加。而直接让大家有危机感的原因在于，很多人之前认为AI infra没那么容易被淘汰的原因在于技术门槛相对更高，于是最近发现Agent能写出性能非常好的复杂kernel之后彻底慌了，毕竟能写好复杂kernel的人都不算多。事实上这个判断的原则就是错的。工作的“难度”不是判断是否被取代的标准，因为人和Agent的能力维度就不一样，再进一步，当前的工作内容百分之多少能被AI替代，也不是一个决定性的标准（虽然很多研究报告在以这个作为标准），因为人的角色和价值也是在流变的，当前的工作内容让度给AI之后，人类需要去解决新的制约效率的瓶颈。所以根本性的矛盾在于，这个领域能给生产力提供多大的需求空间。比如，对于一个互联网业务的前后端来说，需求的天花板就是前端界面清晰友好，后端系统稳定可靠，再大的生产力也没有更大的价值了。那么回到AI infra，让人稍微欣慰一点的是，只要AI的发展不熄火，用有限的资源支撑更多更强的智能，需求的天花板是足够高的。随着生产力的爆发，AI infra会有哪些变化，这是个挺有意思的问题，我们可以对这个问题思考得更具体一点。首先我们当然会看到硬件效率被更充分地压榨，甚至压榨到一个可以被证明的理论上界，目前没有做到这一点的原因在于，优化还没有被充分完成，新一代硬件就出来了，如果现在全世界的硬件还停留在A100，那我感觉可能优化一条指令都难。然后压榨到性能上界的时间也会大幅缩短，新的模型架和新的硬件出来，很快就会被充分优化。当然另一方面，硬件的迭代时间也会大幅缩短，openai最近发布的芯片就是证明。再然后，由于硬件的设计和软件的优化效率都不是瓶颈，人们会充分地发掘每一个细分场景，对每个细分场景进行深度的专门优化，不论是软件层面还是硬件层面。从另一个角度来说，现在的工程实现中，所有为了易用性和通用性而牺牲性能的地方，都会被重新考量。当然这几点只是逻辑上的先后，时间上会一起发生。嗯所以至少一段时间内，故事还没有结束。", "excerpt": "AI Infra的未来最近刷小红书，刷知乎，越来越多的帖子在问，Agent会不会取代AI Infra领域的工程师，就像前端后端那样。我其实在今年写的几篇文章里面算是general地回答过这个问题，但是再专门地聊一下可能观点会更清晰。首先必须要承认，Agent的能力深刻改变，或者说重塑了AI infra每一层的工作范式，框架，算子，编译器都需要重新思考自己的定位（这部分说来话长先不具体展开了），在这", "url": "https://www.zhihu.com/pin/2081436683069929348", "votes": 0, "comments": 2, "feed_ts": 1789568025, "feed_time_str": "09-16 22:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "飘泠的枫叶", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "女明星直播「走光」争议前日，女演员彭xr直播带货，身穿露背毛衣，动作幅度大时极易走光，直播间弹幕持续提醒，但团队几乎视而不见，引发争议。不少观众质疑刻意制造擦边效果博取流量。工作室事后致歉，称仅做静态试衣，未预判动态拍摄风险，会加强现场管控……但也有网友认为她的团队曾经多次给艺人选择类似的穿搭，疑似靠身材博热度……#演员 #直播 #民间锐评人请就位 #影视 #颜值 #影视娱锐评人 #电视剧 ", "excerpt": "女明星直播「走光」争议前日，女演员彭xr直播带货，身穿露背毛衣，动作幅度大时极易走光，直播间弹幕持续提醒，但团队几乎视而不见，引发争议。不少观众质疑刻意制造擦边效果博取流量。工作室事后致歉，称仅做静态试衣，未预判动态拍摄风险，会加强现场管控……但也有网友认为她的团队曾经多次给艺人选择类似的穿搭，疑似靠身材博热度……#演员 #直播 #民间锐评人请就位 #影视 #颜值 #影视娱锐评人 #电视剧 ", "url": "https://www.zhihu.com/pin/2083302242912884133", "votes": 0, "comments": 60, "feed_ts": 1789567615, "feed_time_str": "09-16 22:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何用一句话来证明自己是语言学爱好者？", "excerpt": "/t͡ɕjáʊ̯⁵⁵ liǎʊ̯³⁵/ (The Wren)[1] 这是以色列国里的皇上苏莱曼的聪明话： 从前有两只/t͡ɕjáʊ̯⁵⁵ liǎʊ̯³⁵/宝宝在车棚里筑巢 她 [2]们兄弟俩一只名叫「北风」 一只名叫「太阳」 有一回 北风和太阳为了让/t͡ɕjáʊ̯⁵⁵ liǎʊ̯³⁵/爸爸 :22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "普通读者遇到伪史论时，有哪些简单有效的事实核查方法？", "excerpt": "极难。 因为伪史论有时候并不都是以那种“土木堡在欧洲”这种无稽之谈的面目出现的，不完全是一眼假的情况，因此想分辨真假往往需要非常专业的知识和缜密的分析才行，而这无疑是非常难的，因为并不是所有的网友都会带着脑子上网。 比如说，我去年就差点儿在一个伪史论的问题上中招——明代哈密卫在哈萨克斯坦。 当然，并不是说我相信哈密卫在哈萨克斯坦，而是相信了一开始的一个说法——哈萨克的阿拉木图出土了哈密卫的印。 这", "url": "https://www.zhihu.com/question/2080360252558374005/answer/2083389454715306983", "votes": 579, "comments": 68, "feed_ts": 1789535835, "feed_time_str": "09-16 13:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待袁腾飞举家移民美国？", "excerpt": "美国想要的人 袁隆平 梁文锋美国收到的人 袁腾飞 梁宏达", "url": "https://www.zhihu.com/question/2081662353301623884/answer/2082884665455726727", "votes": 1195, "comments": 118, "feed_ts": 1789535000, "feed_time_str": "09-16 13:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么评价弃地论？", "excerpt": "弃地论是给园区国家设计的。 什么是园区国家？比如伦敦国、迪拜国、辛格坡国，这种就是园区国家。 有没有北爱尔兰、苏格兰和威尔士，对伦敦国其实影响不大。金丝雀码头畔的伦敦金融城作为全欧洲最大的黑灰产洗钱聚集地，它们的收入并不受国土大小的影响。 而且这些园区国家，一般都是越弃地，反而越繁荣: 联合酋长国的迪拜比被大英三岛老工业基地绑架的伦敦繁荣，而一城一国的辛格坡又比迪拜繁荣。原因无他，你地弃得不多，就", "url": "https://www.zhihu.com/question/666252840/answer/2083113082470060297", "votes": 874, "comments": 84, "feed_ts": 1789534642, "feed_time_str": "09-16 12:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么很多人会极其激进的支持乌克兰?", "excerpt": "谢邀 因为他们幻想着乌克兰胜利之后，整个“文明社会”与“正道主义世界”都胜利了，他们可以当“带路党”过上他们幻想中的美好生活。 这些人总觉得不幸发生在自己的身上就是制度不对而不是自身存在的问题，虽然现实生活中确实有很多制度问题产生的不幸，但这些事情和他们来说是完全搭不上边的。 就比如装甲尼禄这件事，无非不就是在B站打假他把义乌小商品的货当成乌克兰原品在卖嘛，真信他的人还会继续买根本不影响他做生意，", "url": "https://www.zhihu.com/question/15015074606/answer/2083109135915271022", "votes": 343, "comments": 19, "feed_ts": 1789534587, "feed_time_str": "09-16 12:56", "category": "other", "cat_name": const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

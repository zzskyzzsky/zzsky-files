ments": 44, "feed_ts": 1793896826, "feed_time_str": "11-06 00:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么辽宁是共和国长子？", "excerpt": "共和国长子特指哈尔滨，是教员钦点。 其他地方都是给自己脸上涂金，硬蹭。 哈尔滨是1946年全国最早稳定解放的大城市，是我党摸索大城市治理的第一块试验田，同时是东北解放战争核心后方，一五时期承接大量重点工业项目，因此被称作共和国长子。 有些城市是反复易手，不是稳定解放。 可以看出，哈尔滨解放时间早于长春，沈阳两年半以上。 在哈尔滨解放前，我党从未有治理大城市经验。通过在哈尔滨的实践，后续才能迅速接管", "url": "https://www.zhihu.com/question/1985360963885619051/answer/2101510357504336532", "votes": 196, "comments": 81, "feed_ts": 1793896813, "feed_time_str": "11-06 00:40", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "百度开源了ERNIE 5.5 Flash Base百度开放了文心 5.5 Flash Base 的预训练权重，提供 FP8 和 BF16 两种版本。它有 280B 总参数，每处理一个 token 激活 14B。做模型微调时，14B 对应单步激活的参数量，280B 对应整套模型的规模。同一个预训练终点，可以对比两种微调方法这份权重来自预训练结束时，还没经过中训练和后训练。如果你想验证一批行业数据到底有没有用，可以从同一份权重出发，两组用相同的验证集，控制其他训练条件，只改数据。这样更容易看清收益来自哪里。想直接接入对话产品的团队，可以等百度后续推出经过后训练的版本。14B 是单步激活量，权重预算要看 280B它用的是混合专家架构。不同 token 会调用不同专家，每步只用到模型的一部分。估算部署资源时，仍要考虑整套权重如何存放、是否要分到多张卡，以及推理时留多少空间给上下文缓存。单看 14B，很容易把每一步用多少参数，当成整套权重只需要多大空间。预训练最长 128K，微调和推理支持 1M百度用 33.5T tokens 完成预训练，训练序列最长 128K。1M 是微调和推理支持的上下文长度。要拿它读长文档或代码仓库，可以用自己的输入长度测试，记录任务正确率、峰值显存和响应时间，再决定是否用到百万上下文。这份基座最适合已经有训练目标和验证集的团队。下载前先核对模型许可和两种精度的部署预算，拿自己的任务跑出基线，再决定要改数据还是改训练方法。", "excerpt": "百度开源了ERNIE 5.5 Flash Base百度开放了文心 5.5 Flash Base 的预训练权重，提供 FP8 和 BF16 两种版本。它有 280B 总参数，每处理一个 token 激活 14B。做模型微调时，14B 对应单步激活的参数量，280B 对应整套模型的规模。同一个预训练终点，可以对比两种微调方法这份权重来自预训练结束时，还没经过中训练和后训练。如果你想验证一批行业数据到底", "url": "https://www.zhihu.com/pin/2101834296826843926", "votes": 0, "comments": 1, "feed_ts": 1793896389, "feed_time_str": "11-06 00:33", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "哈兹·阿尔丁与MAGA共产主义", "excerpt": "2022年秋，一个拿着摄像机的年轻人在密歇根州的一场MAGA集会上走动。 他问集会者：“你们不觉得华尔街和大银行家正在坑害工人阶级吗？” MAGA们同意。 他问政府是否应该“由美国工人拥有、为美国工人服务”。 MAGA们再次同意。 他提及比尔·盖茨购买农田、企业压垮小农场 Images 2.6OpenAI 给 ChatGPT Images 2.6 加了两项适合做表情包的功能：可以存下角色参考图，下次做图直接复用；也可以把静态图做成循环 GIF。这次更新也加快了出图速度；给开发者的 API 上线了 Flare 和 Sunburst 两款模型，并加入圈选改图、SVG 矢量图导出和复杂度设置。ChatGPT 和 Codex 的所有订阅档位都能用 Images 2.6。角色图存一次，下次换动作继续用做一套宠物表情包，可以先挑定一张最像的参考图。之后做点头、摇头或打招呼时，继续用这张图当参考，省去每次重新上传。耳朵的形状、毛色和项圈这些细节，仍要在成品里逐张检查。点头太快能调速，某一帧不对能单独改GIF 可以从文字描述或静态图开始生成。给宠物做一个点头动图，可以先限定「只动头，身体和背景不动」。预览时看两个地方：动作是否看得清，最后一帧接回第一帧会不会跳。节奏太急就调速度；只有一帧的表情不对，可以改那一帧。API 出草稿看 Flare，多轮修图看 SunburstFlare 最快 6 秒出图，前提是 API 画质设为低档。要连续修改商品图，又希望原有细节尽量保留，可以试中、高画质的 Sunburst。画质管细节，复杂度管模型为画面做多少规划；只改一小处时，可以先圈出位置，用低复杂度试一轮。如果手里已经有一张满意的角色图，最省事的试法是先做一个简单动作。它能顺畅地循环、关键特征也还在，再用同一张参考图做下一张。", "excerpt": "OpenAI推出 ChatGPT Images 2.6OpenAI 给 ChatGPT Images 2.6 加了两项适合做表情包的功能：可以存下角色参考图，下次做图直接复用；也可以把静态图做成循环 GIF。这次更新也加快了出图速度；给开发者的 API 上线了 Flare 和 Sunburst 两款模型，并加入圈选改图、SVG 矢量图导出和复杂度设置。ChatGPT 和 Codex 的所有订阅档位", "url": "https://www.zhihu.com/pin/2101829580877194036", "votes": 0, "comments": 0, "feed_ts": 1793895257, "feed_time_str": "11-06 00:14", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美中期选举共和党丢失参众两院，特朗普全面惨败，将产生哪些连锁反应？美国老百姓为何如此不满特朗普政府？", "excerpt": "民主党上台后监狱里关着三个人，三个人互相问是怎么进来的 A:我支持特朗普 B:我反对特朗普 D:我就是特朗普 ", "url": "https://www.zhihu.com/question/2101296173638055664/answer/2101350799267967464", "votes": 546, "comments": 17, "feed_ts": 1793893907, "feed_time_str": "11-05 23:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美中期选举共和党丢失参众两院，特朗普全面惨败，将产生哪些连锁反应？美国老百姓为何如此不满特朗普政府？", "excerpt": "美国老百姓没有不满，只是阈值刺激的太高，以至于更快过渡到了某种贤者模式。 我亲身看了20多年美国大选，他们选民的所有过程总结下来就是寻求刺激–感到兴奋–达到高潮–激情退却–大失所望–寻求刺激。 寻求刺激从一些没有具体意义但是满满情绪价值的口号开始，比如小布什是hopefur america，奥巴马是Yes, we can，特朗普是MAGA，连死气沉沉的拜登都有个Build back better。", "url": "https://www.zhihu.com/question/2101296173638055664/answer/2101669248942731933", "votes": 352, "comments": 12, "feed_ts": 1793893523, "feed_time_str": "11-05 23:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Ripple-65B预览版：从头预训练的dense LLMRicursive Intelligence 开放了 Ripple-65B Preview 的权重。这款从零预训练的 650 亿参数稠密模型，在 Terminal-Bench 2.1 上拿到 80.5%，略高于 Reflection Beam 的 80.1%。这项测试看的是模型能否调用终端工具完成任务。两者只差 0.4 个百分点，评测怎么跑，会影响你怎么读这个结果。同一项测试，模型卡给了两组对照拿各家自报成绩比较，Ripple 是 80.5%，Beam 是 80.1%。按模型卡给出的 Terminus 2 结果，Ripple 仍是 80.5%，Beam 则是 70.8%，第二名变成了 78.7% 的 Muse Spark Open。工具框架、上下文长度和摘要设置都会影响成绩，两组数字要各自对照。换一套编程题，领先者也会变Ripple 在 SWE-bench Pro v2.0 Hard 上拿到 79.1%，高于 Beam 的 76.5%。到了 DeepSWE 1.1，Ripple 的 44.3% 落后于 Muse Spark Open 的 60.0%。如果你想拿它修仓库里的问题，这两组结果比一个笼统的“编程第一”更有用。650 亿说的是稠密模型的全部参数Beam 的总参数是 5010 亿，每次推理激活约 230 亿。Ripple 的 650 亿参数全部参与计算。总参数更少，有利于缩小权重的存储体积。实际运行速度还要看量化、硬件和上下文。本地可试量化版，跑分用的是 BF16Ripple 提供 Apache 2.0 权重，包括 BF16 指令版和实验性 NVFP4 指令版。官方称后者在 DGX Spark 上平均约 40 token/s。这是发布方报告的特定配置速度，表里的编程成绩来自 BF16 评测。想选本地编码模型，可以用自己的仓库任务同时测完成率、耗时和内存，再决定用哪个版本。", "excerpt": "Ripple-65B预览版：从头预训练的dense LLMRicursive Intelligence 开放了 Ripple-65B Preview 的权重。这款从零预训练的 650 亿参数稠密模型，在 Terminal-Bench 2.1 上拿到 80.5%，略高于 Reflection Beam 的 80.1%。这项测试看的是模型能否调用终端工具完成任务。两者只差 0.4 个百分点，评测怎么跑", "url": "https://www.zhihu.com/pin/2101819569153249904", "votes": 0, "comments": 0, "feed_ts": 1793892860, "feed_time_str": "11-05 23:34", "category": "pin", "cat_name": "想法动态"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待国内「AI 六小龙」营收合计仅为 OpenAI + Anthropic 的 10% 的现状？", "excerpt": "西贝为什么会倒闭？因为不值这个价。 同理，美国 AI 泡沫必然会爆掉。 请问西贝下义愤填膺的那些号怎么跑这边就大吹特吹 Anthropic 了？ ", "url": "https://www.zhihu.com/question/2093285285274411892/answer/2101810938554988316", "votes": 5, "comments": 3, "feed_ts": 1793890778, "feed_time_str": "11-05 22:59", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "近几十年来米帝主导的新自由主义全球化，有两大超级受益者，其一是东海岸华尔街的金融资本，其二是西海岸硅谷的科技新贵，他们大吃特吃，坐享超额利润，却把产业空心化与社区凋敝的苦果留给了内陆的蓝领与红脖子——这才是川宝揭竿而起，并最终问九鼎登大宝的基本盘。只是这个任期，不知被谁灌了迷魂药，也或许是他们“给得实在太多了”？川宝居然一  "votes": 56, "comments": 22, "feed_ts": 1793875727, "feed_time_str": "11-05 18:48", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "一双曾被全世界嘲笑的“小破鞋”，凭什么年销40亿美元？", "excerpt": "导语：一双曾被嫌弃太丑的鞋，为什么能让消费者二十多年不断找到新的购买理由？ 王剑/作者 砺石商业评论/出品十几年前，如果有人花几百块买一双看起来像塑料船鞋、浑身打满圆孔的东西，大多数人的第一反应大概不是“时尚”，而是怀疑这个人的审美。 没错，这款名为Crocs（卡骆驰）的鞋子，从一开始就不符合传统审美。宽大的鞋头、厚重的鞋身、明显的塑料感，让这双鞋走红后一直被人调侃，甚至还戏称为“小破鞋”。 可二", "url": "https://zhuanlan.zhihu.com/p/2101744978590549836", "votes": 0, "comments": 0, "feed_ts": 1793875524, "feed_time_str": "11-05 18:45", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Nature | 中科大structRFM：引入碱基配对关系，结构引导的可迁移RNA基础模型", "excerpt": "作者丨论文团队 编辑丨ScienceAI 不断增加的 RNA 序列，为生物学带来了新的研究对象，也给 AI 提出了一个实际问题：在已知分子上训练的模型，面对新的家族和不同的任务，能否继续给出有用的判断？对于基础模型，学习结果能否被带到新的问题中，是衡量其价值的重要尺度。 近日，中国科学技术大学 MIRACLE 实验室的 structRFM 研究发表于《Nature》正刊，博士毕业生朱河勤为独立第一", "url": "https://zhuanlan.zhihu.com/p/2101743534973964784", "votes": 2, "comments": 0, "feed_ts": 1793874742, "feed_time_str": "11-05 18:32", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "alex01", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "黄金白银，开始降息？黄金白银，开始降息？今天的贵金属继续气势如虹，黄金涨1.64%，报4126美元/盎司，白银涨1.02%，报52.73美元/盎司（20261105）。黄金白银一上涨，很多朋友的脸上都乐开了花，因为，因为都赚更“值钱”了啊，也赚钱了啊。要知道我们上面的报价都是“美元/盎司”，也就是，Fed美联储这个“小瘪三”一边去，美债那么高，美股堰塞湖的高度那么高，帝国的通货膨胀那么高，难道，不允许黄金白银涨一下？实际上，黄金这疙瘩，从1月底的5600，到目前的4100，来来回回，回回来来，9个多月了，折腾来折腾去，还是在跌幅30%的这个位置上“折腾”。1》为什么涨？我写了两天的关于这个原因的帖子啦：1）跌太快，尤其是白银，跌深了就要反弹，多方空方都要喘口气，重新布局啥的。2）有些神秘力量投票前一天就开始布局了，我也看见了，也告诉大家了市场的异常，不过我不知道他们又来这么一出熟悉的吃相难看的剧本而已。关键是第三点：3）市场开始憧憬帝国的期中选举之后，Fed美联储会承受不住压力开始不加息，甚至降息了...阿弥陀佛。2》Fed美联储之神秘任务。不像某些“国”们，Fed美联储之公开的承诺有两个：保障充分就业和保障通货膨胀率的稳定。对么？当然是~~~胡扯蛋。我说的，就是胡扯蛋。要知道1913年前，帝国曾经有过两任的中央银行，和当时的雏形帝国签了协议，运转的时间也不长，合同期满后，就寿终正寝了。但，1913年，签了协议后，第二年，就爆发了第一次世界大战，然后，这次似乎比较狠，Fed美联储就一直叱诧风云，和帝国的命运就牢牢绑定在了一起，问题是，问题是帝国现在债务堆得比山还高，AI堰塞湖正在溃堤中，下月的通货膨胀除非造假还是很高，Fed美联储的第一使命是啥？是听从国会的指令：暂缓加息甚至开始降息么？要知道，帝国的国会表面上的任务就是，管人，搞项目，花钱，对，别看那么多名目繁多的东西，几千页的法案，大体上就这三样事情，问题是，问题是，Fed美联储可以根本不鸟帝国的国会的指令的，Fed美联储的最高职能只是：如何保障自己的信誉。拆开Fed美联储，其里面的每一个子单位也恐怕是把：如何保障自己的信誉 放在第一要务吧？至于帝国如何健康的运行，Fed美联储当然有责任，不过当帝国真正发病的时候，一个问题是：Fed美联储会先牺牲自己，成全帝国目前的管理层么？比如刚刚大获全胜，横扫两院的“AI失败党”么？3》不啰嗦，还是：5-10%的加息目标是可期的，Fed美联储是私人的，某些方面不是帝国的，更不是慈善机构。拭目以待。4》反弹还是反转？这段修改过的话请再阅读一遍：“如果是我，我会等黄金回踩4000美元/盎司 或 白银回测58美元/盎司的时候，观望下，再来定方向？”有印象吧？现在这两个都达标了，接下来怎么办？1）明确答案：无论是技术面 筹码面还是基本面，黄金和白银的位置在这里都很危险，我不会在这里做多，黄金的2xxx美元/盎司 和 白银的2x美元/盎司的概率还在渐渐变高。2）有反弹，目前看只能轻仓快速去抢，但，手中前段有空单的朋友，请不要过快加仓，上面不都说了，总会震荡的，拉开距离后，如果有反弹才是较好的加仓点。3）帝国三箭齐发，跑得慢的主力是很容易被埋的，如果我是操作黄金的大主力，我不会在4000美元/盎司这个位置建立防线，这个位置~~~太烂了.今年黄金白银这种大开大合的行情，操作不好，看对了方向都要赔钱的，何况是看错方向？不亏钱，或许你就跑赢了80%以上的投资者啦。附图中给出 黄金 伦敦铜 有色金属 白银 的近期规划（更快更详细的规划请参阅我们的每日更新的专栏文章的内容），其余图片是近一年内的黄金白银的一些关键节点的选择，供大家参考。", "excerpt": "黄金白银，开始降息？黄金白银，开始降息？今天的贵金属继续气势如虹，黄金涨1.64%，报4126美元/盎司，白银涨1.02%，报52.73美元/盎司（20261105）。黄金白银一上涨，很多朋友的脸上都乐开了花，因为，因为都赚更“值钱”了啊，也赚钱了啊。要知道我们上面的报价都是“美元/盎司”，也就是，Fed美联储这个“小瘪三”一边去，美债那么高，美股堰塞湖的高度那么高，帝国的通货膨胀那么高，难道，不", "url": "https://www.zhihu.com/pin/2101738920249652104", "votes": 0, "comments": 25, "feed_ts": 1793874393, "feed_time_str": "11-05 18:26", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为啥现在的课本把hyperbola写成双曲线，而不是拨弨？", "excerpt": "讲道理，“揥蚆蛒” 虽然大家都觉得奇怪，但是当年参与过那个问题讨论的人，现在恐怕都能默写出这个词来。 而 “拨弨”，我感觉几天以后我又记不住了。 不是不尊重严先生，但…… @陈先生 ", "url": "https://www.zhihu.com/question/321779010/answer/73161359342", "votes": 425, "comments": 15, "feed_ts": 1793874145, "feed_time_str": "11-05 18:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "鞭炮用的火药跟军工用的火药根本就不是一种。为什么国内总有人用鞭炮火药消耗量来吹军工产能？", "excerpt": "因为现在烟花的火药成本比军工的还高。 实际上十年前就有往鞭炮里塞军用炸药的，因为便宜还炸得更响，后来被禁止了。 烟花用的黑火药，便宜的时候六七千一吨，贵的时候一万多，但这是长周期的价格，还要区分淡旺季，旺季贵的时候曾经达到3万块钱一吨。十年前我记得TNT价格不到一万一吨，这几年是俄乌打仗才把价格打上去了的。 在大规模生产里，黑火药不是液态的，生产起来成本反而更高，而且后续组装成成品的成本也比军用炸", "url": "https://www.zhihu.com/question/2 "excerpt": "这个案子最离谱的是前面藏的巨好，可以说一直到二审终审之前一点消息都没放出来，极其离谱。 主犯很穷，杀人只为了40万，这个钱是要没收的。在这个前提下，他妈能拿出五十万和解，能找到盈科的主任律师从一审盯到二审，通过AI查这个资金轨迹，AI直接告诉我这是未解之谜。 死者被重伤遗弃后，这群犯人还给他盖了草，两天后才被村民发现，这是典型的放任死亡、间接故意，居然被当成了故意伤害致死，法官是怕死还是收钱了？ ", "url": "https://www.zhihu.com/question/2098795184591061970/answer/2101186946626340791", "votes": 1389, "comments": 56, "feed_ts": 1793858107, "feed_time_str": "11-05 13:55", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "昌都战役藏军为什么输了？", "excerpt": "藏军连打富裕一点，用火器的康巴马匪都费劲。 基本上就是一群保安团性质的轻武器治安乌合之众，战斗力略强于内地黄金标的警备队，这还是因为有机枪，糌粑管够的情况下。 平时也就欺负下手无寸铁的卫藏农奴，遇到大寺庙的热武器武装喇嘛都得怂。。。 就这德性，放在川西，滇南土司林立的地方，去和藏族，彝族的武装打，都不一定能讨到便宜。 它拿什么和解放军打。 而且拉萨的噶伦老爷们都逃跑了，藏军打个锤子。 是油茶不好喝", "url": "https://www.zhihu.com/question/1961872853654827692/answer/1962601398563734515", "votes": 144, "comments": 3, "feed_ts": 1793858062, "feed_time_str": "11-05 13:54", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "奥特曼：三十年来应杀未杀之人满坑满谷", "excerpt": "奥特曼：三十年来应杀未杀之人满坑满谷", "url": "https://www.zhihu.com/pin/2101673526449259990", "votes": 0, "comments": 1, "feed_ts": 1793858015, "feed_time_str": "11-05 13:53", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "昌都战役藏军为什么输了？", "excerpt": "只要境外势力没有彻底帮助地方独立，让我军失去出兵的法理，比如外蒙；亦或者有海峡天险，让我军巧妇难为无米（船）之炊，比如台湾。那么，三大战役打完后，国内其他地方都是传檄而定，一触即溃。", "url": "https://www.zhihu.com/question/1961872853654827692/answer/2101340106636509238", "votes": 24, "comments": 4, "feed_ts": 1793857997, "feed_time_str": "11-05 13:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看 OpenAI  CEO 说，最好的内存应该留给数据中心，而不是闲置在本地 PC 浪费？", "excerpt": "散了散了，昨天下午奥特曼改口说AI未来必须为普通民众服务，不应让人只做超级智能的下位工作。（有趣的是他还在用Trump regime制造的特供新话，不知道什么时候改？） 虽然没直接提内存控制权问题，语气可真是大大的逆转了——咦，究竟发生了什么事，让长期不可一世的奥特曼，突然变得如此温和了？奇怪呀！ 如果说马斯克像无限弹药四处开火、永远布朗运动弹的连环机关炮；达里奥故作深沉装出一副哲学家的样子隔空指", "url": "https://www.zhihu.com/question/2100164407087067932/answer/2101627684736460147", "votes": 349, "comments": 65, "feed_ts": 1793857974, "feed_time_str": "11-05 13:52", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "昌都战役藏军为什么输了？", "excerpt": "不需比素质，藏军连兵力都比不过解放军投入昌都战役的部队。解放军唯一的困难是高原反应。真正值得思考的是民国川边军阀如何被藏军夺走包括昌都在内的大片地盘。", "url": "https://www.zhihu.com/question/1961872853654827692/answer/2064846178760630648", "votes": 41, "comments": 0, "feed_ts": 1793857968, "feed_time_str": "11-05 13:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "昌都战役藏军为什么输了？", "excerpt": "奇怪的问题……那时候的藏军水平远逊于青马宁马，拿头去碰解放军啊，真以为是神灵附体刀枪不入？…… 事实上解放西藏时，藏军基本没给解放军造成什么伤亡，解放军的大部分伤亡反而是因为高原反应等地理因素。", "url": "https://www.zhihu.com/question/1961872853654827692/answer/2101294159625729748", "votes": 45, "comments": 0, "feed_ts": 1793857902, "feed_time_str": "11-05 13:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪,田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果你有INTP部下，你会如何发挥他？", "excerpt": "带过 INTP 的人，都有过同一个体验。 你给他派一个活，他交回来的东西，比你要求的更完整，但方向偏了。 更麻烦的是，他还觉得自己做对了。 一、先说结论INTP 不是难管。 是他不认“管”这个动作。 你给他任务，他会完成一个他理解的版本。你给他一个问题，他会给你三个方案，外加两个你没想到的前提。 这两件事的差别，就是用人成败的分界线。 二、任务和问题，差在哪任务是这样的：这三件事，按这个标准做，周", "url": "https://www.zhihu.com/question/641939661/answer/2100898044992606363", "votes": 67, "comments": 28, "feed_ts": 1793857889, "feed_time_str": "11-05 13:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "俄罗斯为什么会沦落到今天的这种地步？", "excerpt": "俄罗斯沦落什么了？ 俄罗斯老百姓不仅没有吃糠咽菜，而且动物蛋白摄入量还上涨了。（虽然牛肉食用量在下降，猪肉和禽类在上涨。） 俄罗斯还在对美国出口石油。 甚至俄罗斯本土汽车的市场占有率都上升了。 俄乌战争让俄罗斯放下了之前对东方的警惕和偏见，在经济上选择融入东方经济圈，反而使得俄罗斯在许多领域完成了“国产化率”。 汽车产业就是最好的例子。 即使现在马上欧洲解除对俄罗斯的制裁，欧洲汽车再也拿不回过去的", "url": "https://www.zhihu.com/question/1948390660605457463/answer/2100251753975498179", "votes": 308, "comments": 64, "feed_ts": 1793857846, "feed_time_str": "11-05 13:50", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "你看我说啥来着，俄式现代管理好啊好啊就是好，以至于战争打到今天，之前还激烈反对俄联邦的知乎基本盘(哪些大V我就不点名了）就跟伏尔泰、康德这帮伟大的思想家吹捧腓特烈大帝这样的开明君主那样吹捧普京大统领。启蒙之事，吾知之矣！21世纪各国的未来都面临人口老龄化甚至人口坍缩以及人口素质急剧下降等问题，再像20世纪那样贪大求全、搞庞大的组织体系、养一大堆闲人最后的结果就是债务爆炸。那么如何出清闲人呢？俄联邦给出来的一个解决方案就是战争——这个比酒精更快速在领到养老金前出清少数民族和劣质中登老登(问题意识不错，意识到危及“现代生活”的一大因素就是对人口老龄化缺乏正确的出清制度，但是解决方案其他国家的人看了可能会说你“太极端了”）。当然在224之前的前20年，俄联邦一直厉行财政保守主义与低税率(税率13%的单一税制，从2001年元旦一直坚持到2021年元旦，2021年元旦开始恢复对年收入超过500万卢布者收取15%的税率，然后到2025年因为战争等因素重新确立累进税制），使得俄联邦的财政有大量盈余，负债率也很低(当然代价之一就是俄联邦基建维护情况甚至还不如隔壁卢卡申科执政的裁俄罗斯），也难怪很多MAGA见了俄联邦就走不动道。直到现在俄联邦的政府负债占GDP规模也不超过20%，至于外债占GDP的规模更是不到3%，在全球都算最低一档——可以说没有哪个大型经济体比俄联邦更加“不养闲人”了。此外，俄联邦90年代的大出清也摧毁了大量组织结构复杂的产业和机构，瓦解了原有的中间阶层及其社会组织网络，其结果是组织体系大幅简化，一定程度上实现了扁平化管理。当然代价是经济黑帮化、寡头化和社会秩序失衡。现代政治经济最大的问题在于：到底谁背债务？因为信用货币体系总是把债务转给最弱势的群体，这个不是眼睛一闭一睁当看不见就能解决的(有人说MMT这种行不行，问题是MMT也有“供给约束”这种死穴——你看看此前经常被人拿来当MMT成功典型的日本就知道，这几年物价急剧上涨，恰恰是因为没有提高商品供应，钱多了东西更贵了，东京包菜现在都400日元一颗。因此信用货币体系可以改变债务的承担方式，却不能消除社会成本）。", "excerpt": "你看我说啥来着，俄式现代管理好啊好啊就是好，以至于战争打到今天，之前还激烈反对俄联邦的知乎基本盘(哪些大V我就不点名了）就跟伏尔泰、康德这帮伟大的思想家吹捧腓特烈大帝这样的开明君主那样吹捧普京大统领。启蒙之事，吾知之矣！21世纪各国的未来都面临人口老龄化甚至人口坍缩以及人口素质急剧下降等问题，再像20世纪那样贪大求全、搞庞大的组织体系、养一大堆闲人最后的结果就是债务爆炸。那么如何出清闲人呢？俄联邦", "url": "https://www.zhihu.com/pin/2101462805572591734", "votes": 0, "comments": 39, "feed_ts": 1793857831, "feed_time_str": "11-05 13:50", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "昌都战役藏军为什么输了？", "excerpt": "看了所有回答，只能说内地对西藏的了解太少了。 首先这里的藏军是一支常备军队，在1913年建立。这支军队一直受英国影响非常深，全套英式装备，口令也是英语，在江孜还有军官学校（也是英语授课），所以幻想藏军是封建军队的就不用讨论下去了。 但是这支军队非常尴尬的是，在西藏内斗中站在了后续失势的世俗派一边，因此被现任执政达扎严重排挤。所以50年的藏军相比30年已经严重下滑了。 至于昌都战役，藏军的实际指挥权", "url": "https://www.zhihu.com/question/1961872853654827692/answer/1963227207724930869", "votes": 852, "comments": 231, "feed_ts": 1793857820, "feed_time_str": "11-05 13:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "我把话说得明白一点：盎国这次中期选举，对盎国的未来走向根本没什么影响，对国际走势更是没有任何影响 （盎国内部事务对国际事务的影响早就不如⏰内部事务对国际的影响了），但对我 HU 未来的风向却很有影响。注意我不是说 “有些老朋友要卷土重来” 的意思。 我关注的是：它对我 HU 《我国国内事物话题》 的风向会有影响！也就是说，一些面孔，在⏰国内话题上，会逐渐脱下自己穿了不到两年的这张潮酷皮肤，换回自己更熟悉的那张 “领班” 皮。然而这也不是我真正想说的。我真正想强调的是：这些潮酷少年们可能还没意识到，自己之所以反复换皮，其实是我 HU 的 promotion 机制导致的！这就是 @索萨·希尔三号义体 那个问题的答案： 为什么⏰的国内议题总是跟着美国走？答案是这不是自发的，而是被引导的结果。 我HU 这种流量弱者尚且如此，其他平台呢？", "excerpt": "我把话说得明白一点：盎国这次中期选举，对盎国的未来走向根本没什么影响，对国际走势更是没有任何影响 （盎国内部事务对国际事务的影响早就不如⏰内部事务对国际的影响了），但对我 HU 未来的风向却很有影响。注意我不是说 “有些老朋友要卷土重来” 的意思。 我关注的是：它对我 HU 《我国国内事物话题》 的风向会有影响！也就是说，一些面孔，在⏰国内话题上，会逐渐脱下自己穿了不到两年的这张潮酷皮肤，换回自己", "url": "https://www.zhihu.com/pin/2101635748986360263", "votes": 0, "comments": 17, "feed_ts": 1793857747, "feed_time_str": "11-05 13:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "昌都战役藏军为什么输了？", "excerpt": "因为领兵的阿沛大人本身就是主和派。他本人出身不高，即便入赘阿沛家族后，也在西藏政府是中等靠上文职官吏而已。 在讨论如何应付即将入藏的解放军时，大家都说当年我们可是打败过汉人的川军呢。这次不打一下对不起藏军的英名，何况我们还有英美后盾支援。阿沛这时跳出来说，听说红色汉人可厉害了，把原来中央政府的几百万军队都打垮了，川康这边的汉人将军刘文辉直接投了。咱们还是先跟他们谈谈吧。 然后，大家一致说，就你了阿", "url": "https://www.zhihu.com/question/1961872853654827692/answer/1962262254004201348", "votes": 556, "comments": 37, "feed_ts": 1793857735, "feed_time_str": "11-05 13:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "昌都战役藏军为什么输了？", "excerpt": "解放军只有一个问题，适应高原环境。 藏军这种，在解放军面前，和幼稚儿差不多。 解放军1万人可以把藏军10万人打得渣都不剩。直接秒的那种。 李弥一点残军，出国了称王称霸。而李弥在淮海战役面对解放军只有一个念头：跑！赶紧跑！ ", "url": "https://www.zhihu.com/question/1961872853654827692/answer/1962276304800940647", "votes": 1171, "comments": 82, "feed_ts": 1793857689, "feed_time_str": "11-05 13:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "在程序员最吃香的那几年工作，是一种什么样的体验？", "excerpt": "讲讲我个人真实经历过的3个例子吧。 CDN我2006年本科毕业，2007年3月加入刚融资不久的土豆网，工号42。那时虽然学计算机的没现在这么多，但也没有到什么人都能找到工作的地步。我能入职土豆网是因为大学时我就在搞Python，当时的土豆网基础架构方面就偏好Python。 入职不久我就开始接手对接CDN的事情，随后几个月公司搞了个计划叫Virtual CDN。即自动分配多个CDN提供商各自用多少带", "url": "https://www.zhihu.com/question/2099501191520416830/answer/2101382775291093684", "votes": 168, "comments": 15, "feed_ts": 1793857622, "feed_time_str": "11-05 13:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待2026年美国中期选举特朗普两院尽丢？得州翻蓝又意味着什么？", "excerpt": "这件事其实非常简单，简单得难以想象，就是伊朗之战打输了，没有其他任何因素。如果伊朗打得赢，那即使物价比现在再高三倍，盎友也会咬牙挺着，甚至可能把川宝拥上王位；但打输了那就对不起了，你最后的价值都没有了。 其实我们不妨反过来想想，川普为什么能上位？ 我在很久之前（甚至早在川宝当选之前）的几个回答里已经解释得很清楚了，就是DEM在登子的任期表现得 “太输了”， 让盎友赢压抑了。 盎友之所以要把川普推上", "url": "https://www.zhihu.com/question/2101271124130666068/answer/2101620320310449817", "votes": 1578, "comments": 131, "feed_ts": 1793857462, "feed_time_str": "11-05 13:44", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "Algernon", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "看《小城良方》有感", "excerpt": "直到我看到《小城良方》最后一集的结尾，我才知道第一集的开头为什么刘铮亮是那么一种状态，真实首尾呼应。 我很喜欢艾晨的性格，她确实很能说，她早早地进入社会学的本领能够养活一家人，原来每个家庭都各有自己的难，各种不同的故事显得那么真实、生动，似乎每个人的难题才使得生活不再那么平铺直叙，活着才能够有选择，面对各自的难，只要活着，就有希望去改变。 一心想去南方生活工作的刘铮亮，在火车上救了一名孕妇，事后反", "url": "https://zhuanlan.zhihu.com/p/2101348751323422998", "votes": 3, "comments": 0, "feed_ts": 1793857381, "feed_time_str": "11-05 13:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待美参议院民主党领袖称民主党人赢得了参议院，对特朗普执政有何掣肘？", "excerpt": "懂王过去两年之所以能在华盛顿肆无忌惮，关键在于他同时攒齐了四根权力支柱。 对联邦官僚体系的深度清洗，参众两院的多数席位，最高法院6比3的法律豁免，以及通过MAGA基本盘完成对共和党的恶意收购。 关于他是怎么把这四样东西整合在一起，用初选机制把共和党变成私人提款机，顺便在德州等地搞定向爆破干掉建制派的，推荐我的另一个回答，这里就不再赘述。 中期选举对特朗普真的重要么？现在2026年中期选举的开票结果", "url": "https://www.zhihu.com/question/2101259727464408521/answer/2101424648378377060", "votes": 4152, "comments": 337, "feed_ts": 1793857083, "feed_time_str": "11-05 13:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待「拿下对面就能把军费砍一大半补贴民生啦」这类观点？", "excerpt": "我们的军费是应对全球挑战的，蛙蛙别自作多情。但是伪政权倒台后，伪政权的回扣军费倒是可以取消，贴补蛙蛙的民生。", "url": "https://www.zhihu.com/question/2101480186256561198/answer/2101667795712865975", "votes": 13, "comments": 2, "feed_ts": 1793856650, "feed_time_str": "11-05 13:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "Augenstren", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "独生子女弊端是不是主要以下几点？", "excerpt": "你错了，你说的这里面只有2和3是当今社会比较大的弊端。其实1和5在当今鼓吹原子化、去责任化的舆论里没什么大不了的。 真正影响很大弊端其实是以下3个： 1.房价下跌……快速吞没着城市中产阶级的财富，大家对独生子女家庭的预期和房价上涨时期的预期完全不同。如果还有房子贷款没还完，那更是加剧风险……房价的下跌严重降低独生子女的婚恋匹配档次，而独生子女特别是独生女往往难以接受…… 2.经济衰败……少数还算比", "url": "https://www.zhihu.com/question/2039139208229597324/answer/2101662531827909777", "votes": 1, "comments": 0, "feed_ts": 1793855395, "feed_time_str": "11-05 13:09", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "王多鱼-加油", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "llm infra 最新生存跑路手册：灵潮方浓散修空费巧 山门已据旧法尽成尘", "excerpt": "大家好，我是跑路魔法少女～关注我，每天教你一个跑路小技巧~(·ω&lt;)~☆两个月没写知乎了。技术文章的话四个月没写了，以后可能也写的越来越少了，一年能憋个一两篇就算胜利～究其原因还是这几个月 llm模型的提升有点小狠，大多数问题直接丢给 ai 让它写个 html 的报告出来，基本上可读性都比我写文章要好。所以对于后面还要做些啥，我想了两个月也是暂时没啥思路，产生了是否要离开 llm infra", "url": "https://zhuanlan.zhihu.com/p/2100618001481572956", "votes": 434, "comments": 23, "feed_ts": 1793854973, "feed_time_str": "11-05 13:02", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "BBuf,LeiWang1999", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "构建Agent时代的机器学习编译基础层", "excerpt": "今年是Agent元年，不管对于任何的领域，大家都需要感受到这样的变化。对于机器学习编译和kernel可能更是如此。传统的机器学习编译尝试利用我们的领域知识从图，tile和SIMT等各个粒度去进行变化和优化，使得我们可以再各个硬件上通过简洁的代码获得很高的效率。强大agent的出现使得只要我们有足够多的token，基本底层的算子和软件都可以都可以蹬出来了。 一方面来看，Agent已经可以解决从高性能", "url": "https://zhuanlan.zhihu.com/p/2101651274798196721", "votes": 348, "comments": 7, "feed_ts": 1793854917, "fee function esc(s) {
  if (!s) return '';

}

function renderByCategory() {
  const cats = {};

}

  }
  document.getElementById('posts-container').innerHTML = h;
}

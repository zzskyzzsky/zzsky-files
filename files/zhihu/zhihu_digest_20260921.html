顺手揍了沙特首都，把沙特的管道和炼油厂也打了，布伦特原油一度被推过每桶100美元。美国10年期美债收益率奔上5%以上，30年期一度突破5.28%，创2007年以来高位。哪一条拎出", "url": "https://zhuanlan.zhihu.com/p/2085012556712878282", "votes": 36, "comments": 4, "feed_ts": 1789885819, "feed_time_str": "09-20 14:30", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "领导干部是怎么被腐蚀的？", "excerpt": "换届之年，你是省里处长下来搞县委书记的年轻干部。任前谈话的时候，省委组织部长特意亲自出席，跟你们说组织如何如何重视，未来如何如何可期；省纪委书记也找你们集体谈话了，告诫你们县里不像省里单纯，一样要扣好人生的第一粒扣子。 接着，你上任了。上任第三天，在城关镇走访调研的时候，镇党委书记张三满脸堆笑的介绍当地情况，你边听边点头，表示满意。临行前，镇党委书记送了个文件袋过来，说今天还有没汇报到位的地方，…", "url": "https://www.zhihu.com/question/2073319145970651529/answer/2076966090542954424", "votes": 1414, "comments": 182, "feed_ts": 1789885358, "feed_time_str": "09-20 14:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹小灵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "理记炮轰罗永浩毁掉贾国龙 30 年心血，真的是这样吗？这场风波中，贾国龙和罗永浩谁的责任更大？", "excerpt": "毁掉这个概念，其实是吃了一个信息差。 就，很多打工人觉得老板不当人，是因为，老板的玩法本身就不是普通人能理解的。 一个最简单的道理，如果，我是说如果，西贝把还在盈利的店分给员工，真就是好事么？ 没做过生意的可能觉得，我白得一家店，或者我们几十个员工白得一家店我变成小股东，多爽。 好，视角分野就出现了。 最简单的问题，你得了一家西贝，那，你能把这家店换成蜜雪冰城么？ 不能。 因为店的财富概念是很复杂", "url": "https://www.zhihu.com/question/2084971910392013826/answer/2085007435597607747", "votes": 200, "comments": 11, "feed_ts": 1789884510, "feed_time_str": "09-20 14:08", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小德", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "统帅们那些不为人知的代价问大家一个问题，抗战那些年，八路军将领们是怎么扛住巨大心理压力的？答案是根本扛不住。很多人想象中的名将应该是坐在地图前气定神闲，挥斥方遒。可真实的历史是，有人重度神经衰弱，整宿整宿瞪着眼睛熬到天亮，安眠药当饭吃照样睡不着，全靠一根接一根的烟把神经强行吊住，有人的脑袋里永远留着三块弹片，每逢大战就疼得死去活来，只能用冷水一遍一遍浇头，还有一个人一边尿血一边指挥反扫荡，部队转移到哪，担架就抬到哪，硬是不肯下火线。所以，将领指挥千军万马，看着威风，实际上未必比士兵活得更安全，甚至可能被战争更早拖垮。而且最高指挥官的容错率是无限趋近于零的，他们脑子里闪过的一个错误念头，落到现实里，就是一条防线的全线崩溃，是几万个家庭的带孝哭丧，这种压力搁在任何一个普通人身上，一天就得崩溃。那既然普通人扛不住，这些名将是怎么扛过来的？先说毛主席，他为什么总是烟不离手？真的是因为烟瘾太大吗？其实恰恰相反，他身边的工作人员回忆过，他吸进去的烟其实并不多，大半是在指尖自己燃烧掉的，为什么？因为他根本没有意识到自己正在抽烟，那只是他在思考时下意识的一个动作。真正在燃烧的不是烟，是他的大脑。在那个物资极度匮乏的年代，他逮着什么烟就抽什么，没有好烟就用纸卷着劣质烟丝猛抽。烟雾缭绕的窑洞里，他经常一整夜一整夜的不合眼。很多人以为他失眠是因为工作太忙，其实根本不是，他的神经衰弱源于一种极度恐怖的超负荷脑力消耗。1938年那时候的中国是个什么局面？一盘散沙，满地哀嚎，你以为毛主席只是坐在延安的窑洞里写文章吗？不，他是在一个信息极度混乱、所有人都在不知所措的至暗时刻，用自己的大脑去进行国家命运的反复推算。中日两国的工业差距、兵力比对、国际局势、民众心里。几百个随时在变的变量，他全都要考虑进去，他必须生生拨开亡国论的迷雾，在几千万种死局里抠出那唯一一条能让中华民族活下去的生路。所以他整夜整夜瞪着眼睛睡不着，这不是熬夜，这是大脑在高强度运转后的无法停止，那本5万字的《论持久战不是写出来的，那是他在极度焦虑和失眠的折磨下，用心血熬出来的一套国家生存指南。所谓统帅，就是当全民族都在黑夜里发抖的时候，他必须睁着布满血丝的眼睛替所有人守夜。但如果说毛主席承受的是脑力的过度消耗，那粟裕承受的就是肉体上的极限折磨。1930年那发迫击炮弹把三块弹片永久的镶嵌在了粟裕的头颅里，弹片压迫神经，带来的不仅仅是剧痛，更是血压飙升和天旋地转，可偏偏粟裕是那个时代首屈一指的用兵大师，他打的仗永远是走钢丝，从维港到黄桥，再到后来的车桥战役，他面对的往往是数倍于自己的日伪军，他需要在大脑里极度精密的计算部队的穿插时间，火力的交叉点，敌人的增援速度。你可以想象那个画面，前方炮火连天，战报一秒钟一遍，而作为指挥中枢的大脑，此刻正像被千万根钢针猛扎，疼得冷汗直流，疼的只能用冷水一遍遍往头上浇，但他嘴里下达的命令依然必须精确到分钟，精确到连队。这是一种极其残忍的反差，他在用一句随时会瘫痪的残破肉身去操作，当时中国最顶尖的战术，他不是在指挥打仗，他是在用自己忍受极端生理痛苦的极限去换取战场上稍纵即逝的胜率。最后我们来看看罗荣桓，1942年的山东是名副其实的修罗场，日军的铁壁合围、大扫荡把根据地切成了碎片，生存环境恶劣到了极点。这时候，罗荣桓倒下了，严重的肾病让他尿血不止，连站都站不稳。按照常理，主帅病危必须下火线治疗，但他为什么死死盯在担架上，跟着部队辗转3年硬是不走？因为他看透了当时山东的底层逻辑，在那个系统濒临崩溃，军心随时可能涣散的绝境里，十几万大军和几千万百姓需要一根主心骨，罗荣桓躺在那里就是这根主心骨，他不拿枪，甚至连路都走不了。但只要山东的党政军系统知道罗政委还在，这支队伍的魂就散不了，他把自己变成了一枚钉子，死死的把自己贴在山东的版图上，寸步不退。现在你再回过头来看看这3个人，一个失眠到神经衰弱的统帅，一个头颅里带着三块弹片还要推演战局的战神，一个躺在担架上也要稳住军心的政委。后人回看这段历史，总觉得他们是天赋异禀从不知疲倦的天生战将，这就太肤浅了，给他们套上这层百毒不侵的滤镜，其实是抹杀了他们作为血肉之躯所付出的极其惨烈的代价。但战争的真相却是，从来没有天降的神兵，也没有写好的胜利。所有的绝地反击，所有的历史转折，其底层逻辑只有一个，那是有人在最绝望的关头。把自己的血肉之躯硬生生填进了那个深不见底的窟窿里，他们会疼，会崩溃，会被折磨的不成人形，但即使身体已经碎了一地，他们的灵魂依然死死的守在那个名为家国存亡的指挥位上，这才是真正的名将。 #抗日将领 #统帅 #战地指挥官 #历史真相​ ", "excerpt": "统帅们那些不为人知的代价问大家一个问题，抗战那些年，八路军将领们是怎么扛住巨大心理压力的？答案是根本扛不住。很多人想象中的名将应该是坐在地图前气定神闲，挥斥方遒。可真实的历史是，有人重度神经衰弱，整宿整宿瞪着眼睛熬到天亮，安眠药当饭吃照样睡不着，全靠一根接一根的烟把神经强行吊住，有人的脑袋里永远留着三块弹片，每逢大战就疼得死去活来，只能用冷水一遍一遍浇头，还有一个人一边尿血一边指挥反扫荡，部队转移", "url": "https://www.zhihu.com/pin/2084790612428076217", "votes": 0, "comments": 14, "feed_ts": 1789884444, "feed_time_str": "09-20 14:07", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "大水哥", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么都在骂吕蒙偷袭荆州是战略失误，而不骂刘备伐吴是战略失误？", "excerpt": "吕蒙偷袭荆州是把南军唯一一次破局的机会之门给焊死 刘备是看到门被焊死后，掀桌子彻底不玩了 这两个都不是战略失误而是战略灾难。 诸葛亮看到了焊死的门有几个缝隙，试图拼命撬开。 很多人帮吕蒙洗的人建立在战术胜利上和短期 R", "verb_cn": "赞了回答", "title": "为什么日本统治韩国40年，却没能同化韩国？", "excerpt": "因为韩国是日本的直接上位文明，就像法国是英国的直接上位文明一样。有人会说古代中国也很大程度上影响了日本，也是日本的上位文明，但这其中相当一部分都是通过朝鲜半岛作为跳板输出到日本的。而这种文明之间的上下位关系并不是越往上越高级，很多时候会出现“我附庸的附庸不是我的附庸”现象。就如同英语中很多高级词汇可以追溯到法语，而法语往往也不是根源，可以进一步追溯到意大利语、拉丁语甚至希腊语，但英国人并不会觉得…", "url": "https://www.zhihu.com/question/278822591/answer/2084732897093739520", "votes": 138, "comments": 40, "feed_ts": 1789862618, "feed_time_str": "09-20 08:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}];
const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

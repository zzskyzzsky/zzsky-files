和演示稿也进入比较范围OpenAI 还强调了演示文稿、文档和电子表格的产出质量：模型对模板的适配更好，生成的可编辑文件能导出到常用专业工具中继续修改。对知识工作来说，这比“多写一段文字”更实在，衡量点应是能否把现有资料、模板和交付流程接起来。选择时可以先按任务分层：需要高难度长流程、愿意为更深推理付费时看 Sol 或 Ultra；常规知识工作和日常编程可以优先评估 Terra；高频、预算敏感的任务再看 Luna。", "excerpt": "OpenAI带着GPT-5.6 Sol、Terra 和 Luna来了GPT-5.6 这次同时给出 Sol、Terra、Luna 三个档位。Sol 在 Agents&#39; Last Exam 上的最高分是 53.6，比 Claude Fable 5 的 adaptive 模式高 13.1 分；在中等推理设置下，Sol 比 Fable 5 高 11.4 分，估算成本约为后者的四分之一。Terra ", "url": "https://www.zhihu.com/pin/2058734571173286465", "votes": 0, "comments": 0, "feed_ts": 1783620585, "feed_time_str": "07-10 02:09", "category": "pin", "cat_name": "想法动态"}, {"actor": "木文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎样看出一个男孩子以后会不会有出息？", "excerpt": "长大有出息的男人，小时候无论干啥事，都是将来有出息的表现", "url": "https://www.zhihu.com/question/531144023/answer/2476290512", "votes": 55517, "comments": 1193, "feed_ts": 1783620038, "feed_time_str": "07-10 02:00", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "《水浒传》中王伦错在哪了？", "excerpt": "王伦有权谋，没武力，欠缺领袖魅力。 晁盖有武力，有领袖魅力，没有权谋。 柴进没领袖魅力，没武力，也没权谋。 宋江有权谋，有领袖魅力，没有武力。 所以武力是坐梁山头把交椅的既非充分也非必要条件。 而权谋和魅力属于坐（稳）头把交椅的非充分但是必要条件。缺一不行。 王伦不是错在哪儿，他是错在不该坐这把交椅。晁盖也不该坐，他如果不挨那一箭，这个位子也做不了太久，因为他没有谋略，一定会被架空，最后要么让贤，", "url": "https://www.zhihu.com/question/498160961/answer/2058729002643339243", "votes": 6, "comments": 0, "feed_ts": 1783619244, "feed_time_str": "07-10 01:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梗直哥发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "AI大讲堂：内外兼修显身手敢教训练换新天，手绘拆解【TTT模型】从Mamba1&amp;2, xLSTM到TTT，新模型层出不穷，都对Transformer产生了很大改进。它们的内在联系是什么，有该如何深入理解。这期通过模型手绘和类比，解答下列问题：1.四个网络模型的异同和核心思想是什么？2.TTT模型的内外环训练逻辑3.TTT的各种变体和关联关系4.最新的LLM发展趋势有哪些看点", "excerpt": "AI大讲堂：内外兼修显身手敢教训练换新天，手绘拆解【TTT模型】从Mamba1&amp;2, xLSTM到TTT，新模型层出不穷，都对Transformer产生了很大改进。它们的内在联系是什么，有该如何深入理解。这期通过模型手绘和类比，解答下列问题：1.四个网络模型的异同和核心思想是什么？2.TTT模型的内外环训练逻辑3.TTT的各种变体和关联关系4.最新的LLM发展趋势有哪些看点", "url": "https://www.zhihu.com/pin/20587254 : Compressing Hybrid MoE LLMs#无影寺 ", "excerpt": "NVIDIA压缩Nemotron-3-Super：参数从120.7B降到75.3B\n图文版：链接NVIDIA这篇论文讨论的是Nemotron-3-Super的部署压缩：把120.7B总参数、12.8B活跃参数的混合MoE模型，压到75.3B总参数、9.3B活跃参数，并明确面向两类负载：8×B200上的交互式serving，以及单H100上的1M-token超长上下文agent任务。吞吐和显存口径在", "url": "https://www.zhihu.com/pin/2058718445882046396", "votes": 0, "comments": 0, "feed_ts": 1783616847, "feed_time_str": "07-10 01:07", "category": "pin", "cat_name": "想法动态"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "季后赛詹姆斯全力防巅峰乔丹，能不能把乔丹限制到25分以下？", "excerpt": "我是谁？我在哪？我该防谁？太难了。 你就是与我合称北乔南慕的慕斯？不如你们一起上吧，我乔某人何惧。 ", "url": "https://www.zhihu.com/question/547810590/answer/1915460779542546353", "votes": 422, "comments": 164, "feed_ts": 1783615942, "feed_time_str": "07-10 00:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么我越跟亲近的人表达自己的「真实感受」，对方的防御和反弹反而越强烈？", "excerpt": "不知道你看没看过一个电视剧叫做《我是余欢水》。 主角余欢水的老婆叫做甘虹，甘虹挺瞧不起自己老公的，所以出轨了自己的初恋男友，两个人经常在一辆本田MPV里面私会。 某天下雨了，余欢水回到家以后被浇成了落汤鸡，他就和老婆说：“我们买一辆车吧。” 这句话让甘虹有点儿做贼心虚，她以为自己出轨的事儿被老公发现了，所以一句好话都没有。 其实老公并没有发现，他只是单纯的心疼老婆，自己挨浇了还想着媳妇儿。 几天之", "url": "https://www.zhihu.com/question/2044410345092077539/answer/2058713418778129085", "votes": 1, "comments": 0, "feed_ts": 1783615528, "feed_time_str": "07-10 00:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Devin新模型SWE-1.7：FrontierCode 42.3%Cognition 刚发布 SWE-1.7，这是 Devin 里新的 coding agent 模型。在 Cognition 自有 benchmark FrontierCode 1.1 Main 上，SWE-1.7 得分 42.3%，GPT-5.5 是 43.0%，Opus 4.8 是 46.5%。SWE-1.7 的 cost per task 是 1.97 美元。Cognition 想证明 SWE-1.7 把 coding agent 的成本-性能曲线往前推了一步。FrontierCode上的性价比FrontierCode 评估的是模型生成的代码是否真的值得合并。SWE-1.7 的 42.3% 比 GPT-5.5 低 0.7 个百分点，比 Opus 4.8 低 4.2 个百分点，但成本明显压低。它现在已经接入 Devin 的 Web、Desktop 和 CLI，官方写的是通过 Cerebras 提供 1000 TPS。RL还能继续推SWE-1.7 的基座是 Kimi K2.7。这个基座本来已经做过大量 RL 后训练，Cognition 继续在上面跑自己的 RL pipeline，仍然看到明显收益。这点是文章真正想强调的地方：后训练没有简单到“基座已经训满了就没空间”。至少在 Cognition 的 agentic software engineering 场景里，训练配方、数据质量、基础设施和长任务设计还能继续带来提升。长时间RL最怕什么长时间 RL 训练有两个常见问题：熵崩溃，也就是策略不再探索、奖励停住；还有数值不稳定，也就是训练器和推理引擎之间出现漂移。Cognition 的配方把很多修补同时用上了，包括 Muon 优化器、staleness controls、off-policy correction、importance sampling、top-p sampling replay、MoE routing replay 和量化感知训练。目标是保住训练稳定性，也保住模型继续探索的能力。跨三大洲的工程落地训练跨了四个数据中心、三个大洲，自有 GPU 加上 Fireworks 等推理服务商的算力一起用。这里的关键是：只有训练器需要紧耦合通信，rollout inference 可以分布式展开，各引擎通过对象存储同步压缩后的权重差分。这种设计降低了跨地域、多集群 RL 的通信压力，避免把推理算力集中绑在单一集群里模型行为变了SWE-1.7 直接在 Devin harness 里训练，重点面向更长周期的异步任务。它学会了 self-compaction：当 agent 接近上下文窗口上限时，先总结当前工作状态，再从自己写的总结里恢复继续做训练中的 rollout 最长可以到 6 小时。行为上，它会在改代码前花更多时间调查和研究；代价是文件触达范围会变大。Cognition 也把这个问题列成后续要优化的方向", "excerpt": "Devin新模型SWE-1.7：FrontierCode 42.3%Cognition 刚发布 SWE-1.7，这是 Devin 里新的 coding agent 模型。在 Cognition 自有 benchmark FrontierCode 1.1 Main 上，SWE-1.7 得分 42.3%，GPT-5.5 是 43.0%，Opus 4.8 是 46.5%。SWE-1.7 的 cost p", "url": "https://www.zhihu.com/pin/2058712804539028720", "votes": 0, "comments": 0, "feed_ts": 1783615456, "feed_time_str": "07-10 00:44", "category": "pin", "cat_name": "想法动态"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "季后赛詹姆斯全力防巅峰乔丹，能不能把乔丹限制到25分以下？", "excerpt": "历史上出了名的得分手一个一个来： 季后赛詹姆斯全力防巅峰乔丹，能不能把乔丹限制到25分以下？ 可以 季后赛詹姆斯全力防巅峰科比，能不能把科比限制到25分以下？ 可以 季后赛詹姆斯全力防巅峰艾佛森，能不能把艾佛森限制到25分以下？ 可以 季后赛詹姆斯全力防巅峰甜瓜，能不能把甜瓜限制到25分以下？ 可以 季后赛詹姆斯全力防巅峰库里，能不能把库里限制到25分以下？ 可以 季后赛詹姆斯全力防巅峰麦迪，能不", "url": "https://www.zhihu.com/question/547810590/answer/1915000711390958135", "votes": 582, "comments": 87, "feed_ts": 1783615357, "feed_time_str": "07-10 00:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "木文", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "Ai法官在技术上可行吗？", "excerpt": "此类问题，这就好比你在问你在技术上是否可以取代你的领导。没有价值。要明白，这个世界绝大多数问题的答案都取决于资格，而不是技术本身。", "url": "https://www.zhihu.com/question/2057000320396531440/answer/2058712100818703979", "votes": 1, "comments": 0, "feed_ts": 1783615214, "feed_time_str": "07-10 00:40", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "木文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有哪些一看就莫名感到伤感的图片？", "excerpt": "", "url": "https://www.zhihu.com/question/361826630/answer/2831203029", "votes": 56930, "comments": 650, "feed_ts": 1783614804, "feed_time_str": "07-10 00:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI审计SWE-Bench Pro：约30%任务有缺陷OpenAI 审计了 SWE-Bench Pro，SWE-Bench Pro被广泛用于衡量 AI 编程能力的 benchmark。结论很直接：约 30% 的任务存在缺陷，OpenAI 也撤回了此前建议研究社区把它作为主要 coding eval 的建议。这不等于所有 AI 编程榜单都失效，但它提醒了一件事：模型分数不只取决于模型，也取决于试题本身是否干净。题目有隐藏要求、矛盾指令或过严测试时，正确代码也可能被判失败。坏题坏在哪里OpenAI 举了一个很具体的例子：任务提示里的示例只有一个前导空格，但隐藏测试却要求两个前导空格。模型如果严格按提示写，反而会挂在隐藏测试上。这类问题不只是一两个格式 bug。OpenAI 提到的缺陷包括隐藏需求、矛盾指令、过度严格测试、评分标准不完整和低覆盖率测试。很多任务来自开源社区的 issue 和 PR，本来是给人类开发者协作沟通用的，不一定天然适合作为干净、孤立的模型考试题。OpenAI怎么查的审计流程分了几层。先用自动过滤器从任务里筛出 286 个疑似问题，再用基于模型的 investigator agents 深入查看仓库、测试、模型尝试记录和失败模式。另一条线是人工标注：五位有经验的软件工程师独立审查这些任务。人工审查更严格，也更容易给同一个任务打上多个问题标签。OpenAI 说，agent 流程标出的类别和人工判断有 74% 重叠。这说明 agent 可以帮忙扩大审计规模，但最后仍要靠工程师判断题目到底是不是公平。对程序员的实际影响以后看 AI 编程榜单，不能只盯谁高 1 分、谁低 2 分。更应该问三个问题：这个 benchmark 的任务有没有被审计过？测试是否奖励真正可用的修复？分数是否来自少数容易被格式或隐藏测试影响的题？选 coding agent 或 IDE 模型时，榜单可以当第一层过滤器，但不要当最终答案。更稳的办法还是拿自己的仓库、自己的 issue、自己的测试流程跑一轮，看它能不能稳定完成真实工作。", "excerpt": "OpenAI审计SWE-Bench Pro：约30%任务有缺陷OpenAI 审计了 SWE-Bench Pro，SWE-Bench Pro被广泛用于衡量 AI 编程能力的 benchmark。结论很直接：约 30% 的任务存在缺陷，OpenAI 也撤回了此前建议研究社区把它作为主要 coding eval 的建议。这不等于所有 AI 编程榜单都失效，但它提醒了一件事：模型分数不只取决于模型，也取决", "url": "https://www.zhihu.com/pin/2058709818727306787", "votes": 0, "comments": 0, "feed_ts": 1783614702, "feed_time_str": "07-10 00:31", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有没有特别搞笑的图片？", "excerpt": "看到这个标签我还愣了一下，但必须得承认这个标签是对的 ", "url": "https://www.zhihu.com/question/392466997/answer/1966458070365352063", "votes": 5354, "comments": 35, "feed_ts": 1783614680, "feed_time_str": "07-10 00:31" ，“我滚蛋，我不是人，恳求沛公收留我这员小将”。 曹参扑通一声就给刘邦跪下了，砰砰砰磕头，“大哥，那孙子真不是我家的种，是夏侯婴家的！” 夏侯婴跪地大骂“日尼玛，曹参你放屁！” 刘邦一人给一脚，问询众人，“葛婴的子孙何在？封王！必须封王！” 司马卬暗自偷笑，只不过看到正在痛殴萧何的刘交后，恨得牙痒痒。 项羽麻木地看着众人", "url": "https://www.zhihu.com/question/673025791/answer/2037077436043629268", "votes": 253, "comments": 44, "feed_ts": 1783587733, "feed_time_str": "07-09 17:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待近期黄金白银价格飙升？", "excerpt": "黄金白银上午还在下跌，下午突然旱地拔葱，大涨。 （2026年7月9号，这篇讲为什么不能冲来冲去，以及量化对手） 先说，大涨有原因么？ 有么？其实对于我来说，我懒得猜原因，涨涨跌跌，跌跌涨涨，难道我觉得今天涨很正常？说实话，其实我不知道今天的黄金白银是涨的还是跌的，不过昨天的回答和专栏文章里面都说了：“反弹小窗口”可能还会持续数日。 “反弹小窗口”可能还会持续数日 就是原因？ 对，就是原因，也就是黄", "url": "https://www.zhihu.com/question/412562493/answer/2058595462207238468", "votes": 77, "comments": 61, "feed_ts": 1783587405, "feed_time_str": "07-09 16:56", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "旷野", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "Anthropic的可解释性研究《可语言化表征在LLM中构成一个全局工作空间》的J空间究竟如何理解？", "excerpt": "又是一片超级超级长的可解释性文章，看得真的要累死了。 我个人觉得Anthropic这篇里那个被吹上天的J空间，应该还不至于到什么意识器官的地步，它看起来其实更像是 模型内部有一小部分核心念头所占据的那块地方。但整篇文章还是挺有意思的，讲了J空间是怎么一步步被找出来的，它凭什么叫全局工作空间。而且J空间的J就是Jacobian雅可比的首字母。A社直接拿方法名当地名用了，没真起一个就叫意识空间或者叫潜", "url": "https://www.zhihu.com/question/2057863656910723035/answer/2058593235031814450", "votes": 9, "comments": 0, "feed_ts": 1783586874, "feed_time_str": "07-09 16:47", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "评价一下阿根廷今年世界杯的前景？", "excerpt": "话说你们这些人都忽略了气温的因素，九四年世界杯在美国因为气温可以说异常沉闷，诸多强队都差点翻车或真的翻车了，一四年世界杯因为高温德国和葡萄牙小组赛就已经开始搞补水时间了，根据我查的资料2014年巴西世界杯期间，比赛场地实际气温普遍在22℃至32℃之间，但高湿度（常超60%）显著推高体感温度，导致球员实际承受的热应激远超气温数值本身。具体表现为：北部热带城市（如玛瑙斯）日均最高温达31℃以上且湿度超", "url": "https://www.zhihu.com/question/2044734616502850340/answer/2044879865439053011", "votes": 488, "comments": 108, "feed_ts": 1783586163, "feed_time_str": "07-09 16:36", "category": "other", "cat_name": "社会 · 文化  "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "何伟的“非虚构写作”里全是虚构", "excerpt": "吃自己的瓜还能忘事，忘了对何伟先生书中讲我的段落本身做个回应，瞧我这脑子（《 何伟先生，我只是给你文章中撒谎的段落做了合订本而已，这才是你需要回应的问题》）。何伟先生《别江》里是这么写我的： 短短两段话，不知道撒了多少谎。 第一，扣小粉红的帽子，这不莫名其妙嘛。我是学美国建国理论、民主理论和边沁功利主义出身的，接受的正经英美自由主义传统教育好吧，你们这种爱撒谎的自由派被人戳破了谎言，一上来就扣帽子", "url": "https://zhuanlan.zhihu.com/p/2058576046249846224", "votes": 9, "comments": 0, "feed_ts": 1783582809, "feed_time_str": "07-09 15:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "Morris.Zhang", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何才能达到苏剑林老师的数学水平，对于深度学习和机器学习中的数学部分信手拈来？", "excerpt": "感谢题主的认可，也感谢邀请我的朋友，我简单写几句经验或者建议。 首先，问题的提法其实是不成立的，我远远做不到“信手拈来”。就拿这最新的博客 生成扩散模型漫谈（十四）：ODE扩散的统一框架 - 科学空间|Scientific Spaces 为例，这篇博客从我有想法开始，到发表之日，差不多有两个月的持续思考时间。期间我也有诸多无法理清的问题，推翻了几次原有的思路，并且也发邮件向别人请教，最终勉强成文。", "url": "https://www.zhihu.com/question/572726624/answer/2807713339", "votes": 5484, "comments": 103, "feed_ts": 1783582605, "feed_time_str": "07-09 15:36", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "Morris.Zhang", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "很实诚地讲，硕士level的数学我也不懂多少。当年在中山大学读硕士时，大部分数学课我都没学好；甚至在华南师大学本科时，有几门数学课我也仅仅是考试及格水平。所以，我非常同意您的评价，我也就学了一点皮毛，每次要推点啥都感觉数学不够用。", "excerpt": "很实诚地讲，硕士level的数学我也不懂多少。当年在中山大学读硕士时，大部分数学课我都没学好；甚至在华南师大学本科时，有几门数学课我也仅仅是考试及格水平。所以，我非常同意您的评价，我也就学了一点皮毛，每次要推点啥都感觉数学不够用。", "url": "https://www.zhihu.com/pin/2058310766109923155", "votes": 0, "comments": 14, "feed_ts": 1783582344, "feed_time_str": "07-09 15:32", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "英伟达市值不到两个月蒸发 1 万亿美元，估值回落至人工智能热潮掀起之前的水平，算力龙头为何遭抛售？", "excerpt": "不光英伟达，整个美股科技板块都在调整，半导体龙头股领跌，这是美股科技板块的核心。 英伟达的市盈率从2020年的50倍，降到现在30倍左右。以英伟达超高的利润率、行业第一的资本回报率、充足的现金流来说，这些东西配得上这个估值。 现在英伟达的股价基本就在机构算出来的合理区间里波动，没有明显低估，也没有特别离谱的高估。 但有两个脆弱的方面。 第一，从英伟达自身来说，它的经营环境能不能一直好下去？不出一点", "url": "https://www.zhihu.com/question/2058280043265143682/answer/2058573898850083712", "votes": ame": "社会 · 文化 · 其他"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么感觉知乎上的人都很鄙视小红书？", "excerpt": "我是一名知乎答主，我写的东西经常被人搬到小红书上。 有好心的网友看见以后来通知我，我就在小红书上举报。 小红书这个平台的态度就是，只要你举报他就删除，但是平台不会封搬运那个人的号，那些人抄袭也不会受到任何处罚。 所以小红书平台养了一大堆专门搬运知乎回答的号，大概就是把知乎的回答截图保存下来，原封不动搬过去，然后把原作者ID替换成自己的。 而且因为我经常浏览这种搬运博主，现在小红书给我推送的全都是这", "url": "https://www.zhihu.com/question/579376014/answer/2058566260280102946", "votes": 31, "comments": 6, "feed_ts": 1783580443, "feed_time_str": "07-09 15:00", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "请问德国纳粹党的全称是什么？", "excerpt": "这个问题是个狗哨。但会吹这种狗哨的人往往不知道德国纳粹党有个马甲“国家社会主义自由运动”。如果说纳粹党的全称是“国家社会主义德国工人党”就能说明纳粹是社会主义的，那德国纳粹党在魏玛共和国被取缔期间建的马甲名叫“国家社会主义自由运动”是否可以说明纳粹是自由主义的？事实上，纳粹党只是想要把起名作为一种营销策略，试图在党名中加上尽可能多的要素吸引选民投票罢了。哦对了，纳粹从某种程度上还和自由主义有关系…", "url": "https://www.zhihu.com/question/34851882/answer/2058126567050580891", "votes": 315, "comments": 20, "feed_ts": 1783580264, "feed_time_str": "07-09 14:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "水龙", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "明星真的会耍大牌吗？还是新闻写出来的？", "excerpt": "吴天明讲起过他探班《满城尽带黄金甲》的事：“周润发在那试戏，旁边四个保镖，这是干吗呢？谁杀他？他是积怨太多了？” 而这四个保镖只是周润发的少数跟班，据张艺谋说，《满城尽带黄金甲》四个大腕，平均每人带十个所谓助理，一共四十个人。 对此，吴天明表示不解和愤怒，张艺谋也表示无奈。吴天明曾在自己拍戏时抵制过明星高标准、带助理的现象，甚至放出狠话：“爱他妈来不来！”但他后来放弃了，原因是：“顶不住！人家投资", "url": "https://www.zhihu.com/question/37167296/answer/2058327841075471803", "votes": 546, "comments": 330, "feed_ts": 1783580104, "feed_time_str": "07-09 14:55", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "新罗西斯克", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "其实没啥好讲的，看完之后我确信这才是真右翼。很多人还没意识到当另类右翼在各国都意味着当带路党，因为欧洲建制派控制了警察和军队，而解放群众在欧洲小资眼里是背叛右翼思想，因为群众不理解历史、哲学和白人使命。中国另类右翼经常有种错觉，即右翼爱国，是因为体制卖国所以变成现在这样的。其实恰恰相反，右翼爱白胜过爱国，是因为体制成了无国界者狂欢才变成现在这样的，他们更希望成为一个纳粹化美国的傀儡和带路党，能把大多数本国白人扣上犹太人帽子送集中营，他们是绝对愿意的。右翼等于民族主义是标准的上升期社会才会有的幻觉，大多数右翼套着民族主义幌子是为了图日子人过程中不被广大人民群众发觉和围剿，特别是融了法西斯的另类右翼，他们羡慕的就是投靠 时用 Cursor 或终端 coding agent，Grok 4.5 这次值得看看。是 SpaceXAI 和 Cursor 联合训练的新模型，定位覆盖 coding、agent 任务和知识工作。卖点：跑得快，输出 token 更省。在 SWE Bench Pro 上，Grok 4.5 平均每个任务输出 15,954 个 token；Opus 4.8（max）是 67,020 个。换句话说，同类任务里，Grok 4.5 的输出 token 约为 Opus 4.8 的 1/4。服务速度也标到了 80 TPS。这个数字不能直接换算成全场景 4 倍加速，但对 coding agent 来说，少输出、出得快，确实会影响等待时间和账单。Grok 4.5训练用了数万亿 token 的 Cursor 数据，覆盖开发者和代码库、软件工具、agent 环境之间的交互。这也是它主打大型代码库、跨 repo、多工具、长时间任务的原因。它不只是“会补全代码”，更像是被训练去理解开发者如何在真实项目里推进任务。", "excerpt": "马斯克：Grok 4.5 与 Opus 4.7 大致相当如果你平时用 Cursor 或终端 coding agent，Grok 4.5 这次值得看看。是 SpaceXAI 和 Cursor 联合训练的新模型，定位覆盖 coding、agent 任务和知识工作。卖点：跑得快，输出 token 更省。在 SWE Bench Pro 上，Grok 4.5 平均每个任务输出 15,954 个 token；", "url": "https://www.zhihu.com/pin/2058535041786025236", "votes": 0, "comments": 0, "feed_ts": 1783573182, "feed_time_str": "07-09 12:59", "category": "pin", "cat_name": "想法动态"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "什么是人生的最顶级享受？", "excerpt": "她说决定提拔我为候补男友…..享受男友委员会副主任待遇：从仅聊天上升到朋友圈可见。", "url": "https://www.zhihu.com/question/538449801/answer/2883602287", "votes": 38025, "comments": 841, "feed_ts": 1783572388, "feed_time_str": "07-09 12:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "我已经控制不住对我儿子的厌恶了，咋办?", "excerpt": "小时候晚上我爸妈出去了，让我在家做作业不许看电视。回来的时候我妈就先摸电视机，电视机是热的我就偷看了。。。 下辈子真的不想投胎这里了。小时候学习辛苦长大了工作辛苦。一辈子都在卷，没什么属于自己的快乐时光。 我累了。 一个中年老男人的感悟。 ", "url": "https://www.zhihu.com/question/1956125512217912024/answer/1967247464835814073", "votes": 2861, "comments": 0, "feed_ts": 1783571439, "feed_time_str": "07-09 12:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价某站up永乐大帝明成祖杜车别所说明末赋税低的奇谈怪论？", "excerpt": "首先，本座在知乎也是有号的。 其次，我所说的明末税负不高，指的是跟同时代的其他人类政权相比较。 然后点评一下这里的回答： 是的，您还真是个暴论。 老百姓是不是造反，概率，难度，成功几率，都是个复杂系统，直接线性等同于税负的理论数字大小，这不是暴论是什么？ 两条血汗流水线，一条看守者手持AK47，工作十六个小时，一条看守者手持木棒，工作十二个小时。 如果后者反抗看守者获胜了，是不是在你眼里，12大于", "url": e_str": "07-09 11:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "巴士拉围攻战争：两伊战争的索姆河战役发现本章译注没有之前详细了，补充一下巴士拉围攻的细节吧。在1365年戴月19日（约合1987年1月9日）夜间，“卡尔巴拉5号”行动由伊斯兰革命卫队从一个名为“养鱼湖”的地区南部发起。同时，另一部分革命卫队部队乘坐快艇在该湖泊西部登陆。在行动的初期阶段，伊朗人得以展示其军事实力的增长，以至于他们有能力开辟一条完整的战线。 伊拉克共和国卫队出面迎战，这场战斗给双方都造成了惨重的伤亡。伊朗人在行动的前两天致力于突破伊拉克陆军的两道防线。他们利用己方坦克以及缴获的坦克，开始对巴士拉及伊拉克其他防御工事进行炮击。在行动的第五天，伊拉克边防卫队失去了与其三分之一防御阵地的联系。最终在第八天，伊拉克人撤出了贾西姆运河。当时已夺取制空权的伊拉克空军介入，以支援其地面部队。然而，伊朗人当时刚刚秘密采购的瑞典博福斯公司制造的RBS 70地对空导弹，对伊拉克空军的战机造成了巨大破坏。在“卡尔巴拉5号”行动中，伊朗武装部队成功击落了约50到60架伊拉克战斗机，这一数字相当于当时伊拉克空军战机总数的10%。借此趋势，被削弱的伊朗空军得以在短时间内夺回了制空权。为了反击，伊拉克人还开始使用化学武器轰炸伊朗的交通与补给线。为了增加压力，伊拉克使用常规炸弹轰炸了伊朗西半部的许多城市，包括德黑兰、伊斯法罕、大不里士和库姆。对伊朗城市的轰炸导致约3000名平民伤亡。（这些伤亡中包括东阿塞拜疆省米亚内市宰纳比耶学校在空袭中遇难的30名学生）。作为报复，伊朗也使用远程导弹将伊拉克中部城市作为打击目标。在巴赫曼月2日（约合1月22日），伊朗人发起了一波新的攻势，占领了伊拉克的第四道防线，并成功推进至距离巴士拉仅12公里处，以至于从伊朗的前线已经可以直接看到巴士拉东部的建筑物。伊朗国家电视台播出了这一推进过程以及从伊朗防线眺望巴士拉远景的画面。然而，伊朗人未能进一步向前推进，但伊朗的火炮和中程导弹对巴士拉市造成了严重破坏。目睹伊朗人兵临巴士拉城下的伊拉克武装部队，被迫将许多伊拉克平民疏散至伊拉克北部地区。伊拉克人的处境变得如此严峻，以至于萨达姆·侯赛因亲自来到部队中间，将第三师的塔莱·哈利勒·拉希姆·杜里少将降级并免职。他还以作战不力为由，通过行刑队枪决了数名伊拉克陆军下级军官。他任命伊拉克北部第五军军长齐亚丁·贾马尔中将接任第三师指挥官。伊拉克人开始重新征兵，甚至将年仅15岁的士兵招入陆军。 当时的伊朗武装部队副总司令阿克巴尔·哈希米·拉夫桑贾尼曾多次亲临前线，近距离了解推进情况。在“卡尔巴拉5号”行动的第四周，伊朗人已经在养鱼湖、乌姆塔维尔岛、贾西姆河以及灌溉运河旁安营扎寨。然而，伊朗的军事力量已经消耗殆尽，此时的战斗陷入了僵局。伊拉克人将炮火集中在伊朗的补给线上，并使用常规武器和化学武器对这些防线进行了有效的轰炸，而此时伊朗人只能躲在挖掘的战壕里。在“卡尔巴拉5号”行动开始后的第20天，伊拉克共和国卫队进入了战场。他们动用大量的军事装备和重型武器（包括坦克、火炮和武装直升机）向伊朗防线发起了猛攻。伊拉克陆军第三师也从养鱼湖西部发起攻击，随后向南并向贾西姆河方向集结。这些攻击，加上伊拉克装甲部队的猛烈冲锋，在行动开始后的第30天击溃了伊朗人的防线。在这场战役中阵亡的伊朗人包括第14“伊玛目侯赛因”师的指挥官侯赛因·哈拉齐。伊朗人推进到了即将突破伊拉克防线的边缘，兵临巴士拉城门，但伊拉克人的抵抗最终抵挡住了伊朗的进攻，他们成功守住了巴士拉市。尽管伊拉克人伤亡惨重，伊朗也损失了大量志愿军，但他们最终只能推进到足以用重炮打击巴士拉的距离。伊朗最高统帅部宣布，他们在沙拉姆切占领了150平方公里的伊拉克领土，并成功摧毁了伊拉克的81个旅和营、700辆坦克以及1500辆伊拉克陆军军用车辆。他们还宣布击落了80架伊拉克战斗机，并摧毁了伊拉克的250门高射炮和400件装甲设备。根据伊朗发布的公告，还有20000名伊拉克军人在这次行动中阵亡。相反，伊拉克则宣布有65000名伊朗军人在这些冲突中丧生。根据一项统计数据，在这次行动中，有7651名伊朗人（包括第14“伊玛目侯赛因”师指挥官侯赛因·哈拉齐、第9“巴德尔”师指挥官伊斯梅尔·达盖吉以及第44“加马尔·巴尼·哈希姆”师副指挥官穆罕默德-阿里·沙赫莫拉迪阵亡，3522人失踪，另有53299人受伤。与此同时，根据烈士与退伍军人事务基金会的统计，1365年（约合1986-1987年）战争的阵亡总人数为41050人，其中绝大部分是在“卡尔巴拉4号”和“卡尔巴拉5号”行动中丧生的。此次行动中的战斗是两伊战争中最激烈、最血腥的，沙拉姆切赫周边地区被称为“两伊战争中的索姆河”。#伊朗  #两伊战争  #伊拉克  #军事  #冷战  #中东 ", "excerpt": "巴士拉围攻战争：两伊战争的索姆河战役发现本章译注没有之前详细了，补充一下巴士拉围攻的细节吧。在1365年戴月19日（约合1987年1月9日）夜间，“卡尔巴拉5号”行动由伊斯兰革命卫队从一个名为“养鱼湖”的地区南部发起。同时，另一部分革命卫队部队乘坐快艇在该湖泊西部登陆。在行动的初期阶段，伊朗人得以展示其军事实力的增长，以至于他们有能力开辟一条完整的战线。 伊拉克共和国卫队出面迎战，这场战斗给双方都", "url": "https://www.zhihu.com/pin/2058505804777574413", "votes": 0, "comments": 0, "feed_ts": 1783567357, "feed_time_str": "07-09 11:22", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待牢A认为美国人将美式中餐加入中餐体系相当于修改历史，改良中餐的行为则是文化献媚？", "excerpt": "牢A这话还真没说错。美国人最擅长干的事情就是用源自英国的暗黑饮食审美，把其它国家的美食改得难吃无比，然后靠着自家的供应链优势和营销大法把原主挤出市场，劣币驱逐良币。 其实被美国人祸害最狠的不是中餐，而是西餐。 广义的西餐有源自意大利、西班牙、希腊、法国南部的地中海菜系，源自法国宫廷菜的高级法餐，以及德国菜、东欧菜、北欧菜、俄菜等等，这些菜系之间差异并不小，食材品类和烹饪技法非常丰富。 欧洲菜系到了", "url": "https://www.zhihu.com/question/2056125893056188572/answer/2056403157853409292", "votes": 4004, "comments": 391, "feed_ts": 1783567283, "feed_time_str": "07-09 11:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "女生主动起来有多主动？", "excerpt": "歌手陈旭被一个大妈跟踪十年，送冰丝内裤当定情信物。 这大妈是个狠人，十年来不结婚也不工作，全职跟踪陈旭，陈旭去参加活动住酒店，她就在走廊里蹲点，守株待兔。 陈旭以为敲门的是外卖小哥，结果门刚开一条缝，大妈直接像个野猪一样冲进房间，赖着死活不走，还满脸娇羞地对他告白。 陈旭对此十分不满，严肃训斥大妈，说这是跟踪尾随，违法的。 大妈一脸委屈：“你知不知道我没结婚，我没小孩啊？” 陈旭问：“跟我有屁关系", "url": "https://www.zhihu.com/question/349424347/answer/2058508851608020777", "votes": 226, "comments": 28, "feed_ts": 1783566756, "feed_time_str": "07-09 11:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待上海一幼童小区内遭2只恶犬撕咬，家长跪地疯抢、嘶吼拉扯！恶狗在咬人前被烧死，打死都违法犯罪？", "excerpt": "这个新闻毫无热度。狗主人也毫发无损。两只狗大概率也毫发无损。", "url": "https://www.zhihu.com/question/2058221501132886734/answer/2058294484744647952", "votes": 271, "comments": 12, "feed_ts": 1783566370, "feed_time_str": "07-09 11:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "被高估的“蔚小理”，被低估的“比吉奇”", "excerpt": "导语：“新”的不一定代表赢得未来，“老”的有可能老而弥坚。王传福、李书福与尹同跃已经充分证明了他们杰出的企业家才能，而李斌、何小鹏与李想这些新生代创业者还远远没有证明自己的能力。他们一方面要承担战略上的试错过程，另一方面还要经历企业管理能力不足的长期阵痛。 路言/作者 砺石商业评论/出品 1手机、电视与汽车都是20世纪的科技产物，进入21世纪后，由于互联网、智能化等功能的叠加，让这些产品又都出现了", "url": "https://zhuanlan.zhihu.com/p/2058505371614962661", "votes": 1, "comments": 0, "feed_ts": 1783566021, "feed_time_str": "07-09 11:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "四大菜系中，川菜为什么最受欢迎？", "excerpt": "因为川菜对“改良”持开放态度，光是一个回锅肉都能改良出：莲白、豆干、青椒、老咸菜、渣海椒、花菜、外婆菜、蒜苗、蒜薹、尖椒、土豆片等无数个个变种。 我家现在炖排骨都是直接放火锅底料 千万不要吃曹氏，这彼阳的出生商家用辣椒精 ", "url": "https://www.zhihu.com/question/556272534/answer/1964544572714619926", "votes": 1468, "comments": 178, "feed_ts": 1783565821, "feed_time_str": "07-09 10:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "四大菜系中，川菜为什么最受欢迎？", "excerpt": "你瞎J8发明一个菜，然后发现味道还行。再然后，你要把你发明的这菜放到中国的某个菜系里面去，大概率你只有说它是川菜没人喷你，反而大家会一起津津乐道的讨论这玩意儿还能怎么改良，加点老干妈再加点酸奶会不会更好吃…… 大哥们，“日”的一声打成糊糊这个不在讨论范围内，这是正宗印度菜，川菜不配碰瓷 ", "url": "https://www.zhihu.com/question/556272534/answer/2057860410779382193", "votes": 863, "comments": 109, "feed_ts": 1783565772, "feed_time_str": "07-09 10:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "剑锋无尘", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "国际油价大涨，黄金白银跳水，美媒称霍尔木兹海峡油轮通行基本停止，中东局势将如何扰动全球资本市场？", "excerpt": "先说一下结论：局势会控制在有限冲突范围内。黄金、白银还会有回调，但与美伊局势无关，就算没有美伊这波冲突，也一样会回调。油价或许有个脉冲式反弹，但是走不了太远，长线看跌。事件的起因是伊朗袭击从阿曼侧过海峡的三艘商船。伊朗认为如果过快放行滞留在海峡的船只，后续在谈判中的筹码就会被大幅削弱，所以他才要划定指定航线，要求所有船只过海峡前要提前跟伊朗报备，而且航线是要沿着伊朗那边的海岸走，控制每天进出海峡…", "url": "https://www.zhihu.com/question/2058280051456718293/answer/2058503620925076423", "votes": 36, "comments": 8, "feed_ts": 1783565509, "feed_time_str": "07-09 10:51", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, { const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

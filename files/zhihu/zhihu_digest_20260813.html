": "发布了想法", "title": "家里只有自动挡汽车，却被家人劝着考 C1，「驾照能考全就考全」的观念现在还合理吗？家人劝你，你可以不听啊。高考填志愿时，可能就和家人吵过，大家都有自己道理。考驾照这事，关键在于你对于开汽车是个什么态度？喜欢开车，甚至喜欢炮弹坑，交叉轴，最好考c1；不感兴趣，就是上下班通勤，随便搞一个c2就行了。要知道可能就在10年后，智能驾驶就真的实现了。家人要你学c1，就是怕你出事，学难一点，知道敬畏这个东西，开车的时候小心。c1照很难吗？自信一点，油离配合坡起不熄火，不后溜，叫做会开车。要不要家人放心，看你。家里只有自动挡汽车，却被家人劝着考 C1，「驾照能考全就考全」的观念现在还合理吗？ #我不想考驾照 #女生为什么一定要考驾照 #一定要考驾照 ", "excerpt": "家里只有自动挡汽车，却被家人劝着考 C1，「驾照能考全就考全」的观念现在还合理吗？家人劝你，你可以不听啊。高考填志愿时，可能就和家人吵过，大家都有自己道理。考驾照这事，关键在于你对于开汽车是个什么态度？喜欢开车，甚至喜欢炮弹坑，交叉轴，最好考c1；不感兴趣，就是上下班通勤，随便搞一个c2就行了。要知道可能就在10年后，智能驾驶就真的实现了。家人要你学c1，就是怕你出事，学难一点，知道敬畏这个东西，", "url": "https://www.zhihu.com/pin/2071048293908476461", "votes": 0, "comments": 0, "feed_ts": 1786556394, "feed_time_str": "08-13 01:39", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Coding Agent的隐形浪费：提示词正在决定它做多少无效工作\n图文版：链接4644次运行、24个确定性任务上的重复发现在同样成功修复一个代码缺陷的前提下，仅向提示词加入“开发几种不同方案，比较权衡后选择最佳”这类指令，六款开放权重推理模型的推理量便会猛增至基准的2.4–7.4倍，而成功率几乎没有可测量的变化。这一对照来自一项预注册实验，总共完成4644次有效运行，所有任务的目标、验收标准和测试命令都被固定，只改变一小段附加指令。在预先留出的8个冻结保留任务上，多方案指令在所有模型中都复现了相同的浪费模式；作为对照，一条冗长但只重复任务范围的提示，成本始终保持在基准的1.0倍左右。浪费不来自文本长度，而来自指令隐含的工作要求——agent被要求构思多个方案并比较，便忠实地在推理文本中搭建候选分支，然后逐一放弃。18.25倍成本峰值来自验证死循环，丢弃分支主要吃token研究对2801条暴露在外的推理文本进行了条件盲语义标注，把浪费拆成两种机制。多方案指令让agent平均额外考虑约3.5个方案，详细展开其中约3个，最终仅实现1个，被丢弃的分支从未走到代码仓库。这种“分支锦标赛”主要消耗token：第一个被丢弃的分支就让中位无缓存运行成本上涨约1.9倍，工具调用次数却几乎不变。确定性语言——“对每个结论绝对确定，反复验证直到确信不再出错”——则激发验证死循环：agent重复检查已确认的事实，反复运行测试，即便所有可见测试已经变绿，操作仍在继续。在观察到最高冗余验证级别的运行中，单次成本达到干净运行中位数的18.25倍，工具调用中位值从6次升至15次，实际耗时增加至3倍，而成功率在所有验证级别上一片平坦。这一数字是描述性比较，不是随机实验得出的因果效应，但它明确了两种浪费的不同成本载体：分支浪费主要吃推理token，验证浪费同时拉高工具调用和延迟。有限效率指令可将推理花在刀刃上，但多方案在重度重构中未必多余实验还测了一条“有界效率”指令：从失败测试和最可能的实现文件起步，仅在证据要求时扩大检查范围，做最小的充分修改，运行相关测试，验收标准通过即停止。这条指令在所有模型上将推理量保持在基线或更低，诊断和最终验证步骤没有被削减。工具链的放大效应同样值得注意：完全相同的任务与模型，在Claude Code中静态前缀是PI.DEV的12–15倍，回合数多出2–7倍，每次成功的成本高出5–30倍。由此得出的实践方向是，提示词设计的核心不是优化措辞，而是明确规定agent该做多少活、何时收手。需要提醒的是，实验任务规模较小，每个任务最多涉及四个文件的修改且成功率天花板较高；在多文件仓库的重构或需要真正比较多个实现的架构决策中，要求多方比较可能仍有不可替代的价值，这一场景不在当前实验的覆盖范围内。原文标题：Same Task, Different Work: Prompt-Induced Waste in Coding Agents#无影寺 ", "excerpt": "Coding Agent的隐形浪费：提示词正在决定它做多少无效工作\n图文版：链接4644次运行、24个确定性任务上的重复发现在同样成功修复一个代码缺陷的前提下，仅向提示词加入“开发几种不同方案，比较权衡后选择最佳”这类指令，六款开放权重推理模型的推理量便会猛增至基准的2.4–7.4倍，而成功率几乎没有可测量的变化。这一对照来自一项预注册实验，总共完成4644次有效运行，所有任务的目标、验收标准和测", "url": "https://www.zhihu.com/pin/2071047488375731486", "votes": 0, "comments": 0, "feed_ts": 1786556295, "feed_time_str": "08-13 01:38", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "家里只有自动挡汽车，却被家人劝着考 C1，「驾照能考全就考全」的观念现在还合理吗？", "excerpt": "家人劝你，你可以不听啊。 大家想一想，一路长大，有多少事情，你没听家人的？ 高考填志愿的时候，有没有和家人吵过架？ 公说公有理，婆说婆有理。 考证的钱谁出？ 家人掏钱，你最好听家人的。自己掏钱，自己做主。 大家都有自己道理，不能站在自己的立场去说家人的观念不合理。 这叫做不讲理。 考驾照这事，关键在于你对于开汽车是个什么态度？ 你要喜欢开车，上瘾，甚至喜欢炮弹坑，交叉轴，最好是考c1；你要不感兴趣", "url": "https://www.zhihu.com/question/2065447455332758792/answer/2071047791653152438", "votes": 1, "comments": 0, "feed_ts": 1786556272, "feed_time_str": "08-13 01:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Harness-R1：冻结模型权重，用可执行补丁修复 agent 运行时 harness\n图文版：链接冻结模型权重，训练运行时补丁工程师Harness-R1 面向部署 agent：目标模型保持冻结，系统从失败回合提取任务约束、关键动作和环境反馈，压缩为 failure packet。9B harness 工程师据此写可执行补丁。harness 是围绕模型的运行时代码，负责上下文、工具调用、动作校验和恢复。同一批任务重跑给补丁打分补丁先经过解析和验证，再由目标 agent 在同一整批任务上重跑，补丁前后的平均奖励差成为训练信号。工程师先从 877 个有效编辑样例完成冷启动 SFT；在线 GRPO 中，每个证据包采样 8 个候选补丁，依据重跑结果更新工程师。三类交互任务的9.3点提升WebShop 商品搜索购买、ALFWorld 文字化家庭任务和 DBBench 数据库操作构成主实验。冻结 Qwen3.5-9B 的等权平均成功率从 44.3% 升至 53.6%；只做 SFT 的工程师为 46.4%，固定前沿编辑器 GLM-5.2 为 48.8%。直接 SFT 后，目标从 59.2% 升至 64.2%。20 个未见目标配置平均增加 7.06 点，1,270 个留出任务增加 8.9±1.5 点。动作前校验与反馈后恢复的条件结论完整补丁比无干预高 8.9 点；去掉动作前介入或反馈后恢复，分别少 3.9 点和 3.3 点。不同环境的关键位置不同，不能排成通用优先级。证据限于三个模拟交互基准和单轮适应；多轮共同更新、开放环境持续学习和跨批次 patch memory 仍待检验。原文标题：Harness-R1: Learning to Edit Executable Runtime Harnesses from Agent Failure Trajectories#无影寺 ", "excerpt": "Harness-R1：冻结模型权重，用可执行补丁修复 agent 运行时 harness\n图文版：链接冻结模型权重，训练运行时补丁工程师Harness-R1 面向部署 agent：目标模型保持冻结，系统从失败回合提取任务约束、关键动作和环境反馈，压缩为 failure packet。9B harness 工程师据此写可执行补丁。harness 是围绕模型的运行时代码，负责上下文、工具调用、动作校验", "url": "https://www.zhihu.com/pin/2071047034925217017", "votes": 0, "comments": 0, "feed_ts": 1786556174, "feed_time_str": "08-13 01:36", "category": "pin", "cat_name": "想法动态"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "颠覆认知！WS2812彻底改变了灯光玩法！一根线如何操控千颗LED？", "excerpt": "颠覆认知！WS2812彻底改变了灯光玩法！一根线如何操控千颗LED？", "url": "https://www.zhihu.com/pin/2071046324091466528", "votes": 0, "comments": 0, "feed_ts": 1786555921, "feed_time_str": "08-13 01:32", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Qwen3.8-2.4T-A95B权重已上架，如何本地跑上周，Qwen 先开放了 Qwen3.8-Max 的 Qwen Studio/API 使用，并承诺下周发布开放权重。本周，对应的 `Qwen/Qwen3.8-2.4T-A95B` 权重已上架 Hugging Face；随后 Unsloth 把这份 4.9TB 的权重压成 397GB Dynamic 1-bit GGUF。下载前要先看清：397GB 是量化文件体积，官方详细运行指南给出的门槛是至少 450GB RAM。硬件表按 RAM、VRAM 或统一内存的总量计算，普通 Mac 和游戏电脑基本不在这版的目标范围内。先用API，再兑现开放权重Qwen 在 8 月 3 日发布 Qwen3.8-Max 时，帖内同时给了 Qwen Studio 和 API 入口，也写明下周将发布开放权重。模型卡则把 Qwen3.8-Max 说明为基于 Qwen3.8-2.4T-A95B 的官方版本，额外带有视觉输入、非思考模式和默认 1M 上下文等能力。这次 Hugging Face 上出现的是 Qwen3.8-2.4T-A95B 的开放权重。Unsloth 的工作发生在这一步之后：把可下载的原始权重制作成能被本地推理框架加载的 GGUF 量化版本。API 可用、权重开放、社区量化，三件事不是同一天完成的同一件事。397GB是量化文件体积Qwen3.8-2.4T-A95B 有 2.4T 总参数，每次激活 95B。Unsloth 按层选择量化，把 BF16 版本的 4.9TB 缩到 397GB，体积减少 91%。同一页面还列出了 508GB 的标准 1-bit、657GB 的 2-bit 和 2.6TB 的 Q8_0，397GB 已经是最激进的版本。410GB和450GB是两处口径410GB+ RAM/VRAM，Unsloth详细运行指南写的是 397GB Q1_0 至少需要 450GB RAM。真准备运行时，应该按更保守的 450GB 估算。Unsloth Desktop 可以自动把一部分模型卸载到 RAM，也能检测多 GPU；如果继续卸载到磁盘，官方说明仍可运行，但速度会明显下降。1-bit质量还没有完整答案“Qwen3.8 可与 GPT-5.6 Sol 匹敌”描述的是 Qwen3.8-2.4T-A95B 基础模型的定位，不能直接套到 397GB 量化版上。官方文档明确写着，新 1-bit 数据类型的 benchmark 还在运行；页面紧接着展示的 PPL、KLD 等结果来自其他大模型。所以现在能确认的是体积和运行门槛，暂时不能确认 397GB 版本保留了多少基础模型能力。评论区也有人追问“量化后掉多少质量”，问到的正是当前尚未补齐的数据。普通用户更该等27B版官方文档预告 Qwen3.8-27B 将在本周五发布，目标配置是 16GB+ VRAM/RAM。手上没有约 450GB 总内存，就不用先下载 397GB 的 2.4T 版本；关注 27B 版的正式文件、上下文表现和量化测试更实际。", "excerpt": "Qwen3.8-2.4T-A95B权重已上架，如何本地跑上周，Qwen 先开放了 Qwen3.8-Max 的 Qwen Studio/API 使用，并承诺下周发布开放权重。本周，对应的 `Qwen/Qwen3.8-2.4T-A95B` 权重已上架 Hugging Face；随后 Unsloth 把这份 4.9TB 的权重压成 397GB Dynamic 1-bit GGUF。下载前要先看清：397", "url": "https://www.zhihu.com/pin/2071045403504534985", "votes": 0, "comments": 0, "feed_ts": 1786555755, "feed_time_str": "08-13 01:29", "category": "pin", "cat_name": "想法动态"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "韦东奕的牙怎么没了？", "excerpt": "这个社会异化的不止是打工人，绝大多数人都是被异化的。 就比如说原始社会，人类的劳动都是让自己更好的生存。劳动越多，你的生存状态就越好。 但是现代工厂，你劳动越多，自身的身体状态反而越差。最终疾病爆发还可能剥夺你积累下来的所有劳动成果。 你如果读研读博，你的劳动同样会让你的生存状态更加糟糕。 这就是你的创造物，或者你自身的一部分，反过来支配你。 异化是主体自我外化为客体，并演变成与自己相异的存在，反", "url": "https://www.zhihu.com/question/1914337234376720549/answer/2071045569296987666", "votes": 8, "comments": 0, "feed_ts": 1786555742, "feed_time_str": "08-13 01:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "Q1a-F1626：从石板墓文化到赤狄白狄", "excerpt": "Q1a-F1626：从石板墓文化到赤狄白狄 马保晟 2024-10-03 距今3600-3300年， Q1a-F1626、Q1a-Y558在土拉河流域、克鲁伦河流域繁衍生息，形成石板墓文化。 距今3300-3100年， Q1a-Y558南下河套平原，形成北狄部落。 距今3200-3100年， Q1a-F4667进入汾河流域，形成赤狄部落， Q1a-Y559进入无定河流域，形成李家崖文化、白狄部落。", "url": "https://zhuanlan.zhihu.com/p/810997281", "votes": 12, "comments": 15, "feed_ts": 1786555699, "feed_time_str": "08-13 01:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "这个看似不起眼的数据手册，才是学习电子学的捷径！视频中使用的PDF工具UPDF链接：链接这个视频我们通过合适的AI 工具来阅读经典的7805降压芯片，来看看强大的PDF工具是怎么提升我们学习效率的。之前阅读英文数据手册是非常耗费时间、且枯燥无味的，对于看不懂的，需要一句话一句话的去手动翻译，一多半时间都用在翻译上了。现在AI时代来临，阅读数据手册省心太多了，只要几分钟就能看个大概。", "excerpt": "这个看似不起眼的数据手册，才是学习电子学的捷径！视频中使用的PDF工具UPDF链接：链接这个视频我们通过合适的AI 工具来阅读经典的7805降压芯片，来看看强大的PDF工具是怎么提升我们学习效率的。之前阅读英文数据手册是非常耗费时间、且枯燥无味的，对于看不懂的，需要一句话一句话的去手动翻译，一多半时间都用在翻译上了。现在AI时代来临，阅读数据手册省心太多了，只要几分钟就能看个大概。", "url": "https://www.zhihu.com/pin/2071045316317550291", "votes": 0, "comments": 0, "feed_ts": 1786555681 /pin/2071041790526936342", "votes": 0, "comments": 0, "feed_ts": 1786554841, "feed_time_str": "08-13 01:14", "category": "pin", "cat_name": "想法动态"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "64位计数器的尽头是什么？等你老了它还没数完！有一天晚上在做仿真，晚上电脑没关，结果第二天计数器还没有溢出，我在想是不是哪里出问题了。后来一算，好家伙！！！即使是几GHZ的频率，64位计数器要想溢出一次得需要几百年，如果是低频（几MHZ），那得需要十万年才能溢出一次，真没想到这么恐怖，因为平时用的16位计数器也就几毫秒就溢出了，没想到有这么大的差距。", "excerpt": "64位计数器的尽头是什么？等你老了它还没数完！有一天晚上在做仿真，晚上电脑没关，结果第二天计数器还没有溢出，我在想是不是哪里出问题了。后来一算，好家伙！！！即使是几GHZ的频率，64位计数器要想溢出一次得需要几百年，如果是低频（几MHZ），那得需要十万年才能溢出一次，真没想到这么恐怖，因为平时用的16位计数器也就几毫秒就溢出了，没想到有这么大的差距。", "url": "https://www.zhihu.com/pin/2071041541993506698", "votes": 0, "comments": 0, "feed_ts": 1786554781, "feed_time_str": "08-13 01:13", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Grok 4.6发布，困难任务和知识工作显著提升正在用 Cursor 或 Grok Build 的人，Grok 4.6 已经可以直接试了，这两个入口首周包含的使用量翻倍。标准 API 定价为每百万输入 token 2 美元、输出 token 6 美元。这次升级盯住长任务Grok 4.6 重点强化持续多步执行的 agent 任务，例如查资料、跨代码库修改、调用工具，以及把产品想法做成可运行的第一版，再继续自测和修正。训练上，Grok延长了补充训练，又用 Grok 4.5 重生成并过滤 SFT 轨迹，随后把 RL 扩展到知识工作、通用编程、内核优化、网页开发和 CAD 等环境。同价升级，但没有全面第一Grok总表里，Grok 4.6 的 AA Intelligence Index 是 61，与 GPT-5.6 Sol Max 同分，低于 Fable 5 Max 的 62。CursorBench 从旧版的 66.7% 升到 69.9%，但仍低于 Fable 5 Max 的 70.5%；DeepSWE 从 54% 升到 65.9%，也没有拿到最高分。Grok还注明，竞品成绩取开发者自报或公开结果中的最佳值，实际选择模型仍要看自己的任务复测。首周双倍用量仅限两个入口首周双倍用量只明确给到 Cursor 和 Grok Build，官方没有把这项权益扩展到 API、Grok Bot 或其他合作入口。API 另有价格翻倍的 fast variant，比较成本时别和标准版混在一起。Cursor用户先测完成率和返工Grok 4.6 用和 4.5 同档的价格提升长任务能力，再用首周双倍用量降低试错成本。Cursor 或 Grok Build 用户可以挑一个真实项目，对比任务能否完成、需要返工几次、最终花了多少，再决定是否迁移。如果你的工作主要是短问答，或者现有模型已经稳定跑通流程，可以先观望。发布材料还没有给出所有任务的测试时曲线，也没有展开主聊天入口和各套餐的具体额度规则。", "excerpt": "Grok 4.6发布，困难任务和知识工作显著提升正在用 Cursor 或 Grok Build 的人，Grok 4.6 已经可以直接试了，这两个入口首周包含的使用量翻倍。标准 API 定价为每百万输入 token 2 美元、输出 token 6 美元。这次升级盯住长任务Grok 4.6 重点强化持续多步执行的 agent 任务，例如查资料、跨代码库修改、调用工具，以及把产品想法做成可运行的第一版，", "url": "https://www.zhihu.com/pin/2071041515854508593", "votes": 0, "comments": 0, "feed_ts": 1786554780, "feed_time_str": "08-13 01:13", "category": "pin", "cat_name": "想法动态"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "什么时候让你感觉亲戚也是个累赘？", "excerpt": "两年前的一个夏天，我一位老家的表弟，说要来我这里培训，知道我在济南，顺便来看看我。 表弟是我小姑的儿子，如果我小姑还在世，关系确实密切一些，来往会多一点。可是从十几年前我小姑去世，姑父也重组家庭，加上我本来就一直在外地，我们完全没啥来往，记忆中他还是个小孩在上小学。 平时本来没啥交集，其实来或者不来，没太大关系，但是我哥说表弟知道我在这里（估计我哥告诉的），让我接待一下，推送了我的微信，让我通过他", "url": "https://www.zhihu.com/question/348261038/answer/1993749663883487017", "votes": 219, "comments": 210, "feed_ts": 1786554545, "feed_time_str": "08-13 01:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "全球销量第一的芯片!50年设计没变过！不到一块钱！包含23个晶体管！暂无简介！", "excerpt": "全球销量第一的芯片!50年设计没变过！不到一块钱！包含23个晶体管！暂无简介！", "url": "https://www.zhihu.com/pin/2071039781174253394", "votes": 0, "comments": 0, "feed_ts": 1786554362, "feed_time_str": "08-13 01:06", "category": "pin", "cat_name": "想法动态"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "DeepSeek V4 Pro 正式版发布，如何评价该模型？", "excerpt": "我可能是算错了，DeepSeek Flash 有可能会被 DeepSeek Pro 给斩杀掉。 因为Artificial Analysis的正式结果还没有出来，下面这些数字是我根据DeepSeek官方小助手发布的性能图表推算出来的。 V4 Pro 性价比估算主要的依据来源于 DeepSeek 官方小助手发的性能图表。这个数据大概瞄一眼就知道提升有多大了，比较夸张的是 DeepSWE，从预览版的 1", "url": "https://www.zhihu.com/question/2071014727606703118/answer/2071034739142742448", "votes": 76, "comments": 2, "feed_ts": 1786553160, "feed_time_str": "08-13 00:46", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "文生图Scaling新变量，被字节Seed团队发现了", "excerpt": "文生图模型一直在扩展模型、数据和算力， 但训练图像所配 Caption 的信息量，却很少被作为一个独立变量系统研究。ByteDance Seed 团队发现：自然语言 Caption 变长，并不意味着模型获得了更多可用的视觉监督；相比长度，Caption 中与图像绑定的信息量更能预测扩散模型最终达到的训练损失。 基于这一发现，团队提出 Structured Prompt，并从 Diffusabili", "url": "https://zhuanlan.zhihu.com/p/2070899926603764054", "votes": 16, "comments": 0, "feed_ts": 1786553023, "feed_time_str": "08-13 00:43", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "苏神深度解读 Kimi K3：2.8T 稀疏大模型，如何解决 MoE 训练崩溃与长文本推理问题", "excerpt": "过去几年，大模型架构的叙事常常围绕“创新”展开：谁提出了新的注意力，谁改造了 Transformer，谁又把scaling规模推向了新高度。 但到了 Kimi K3 这一代，最值得看的可能不是某个单独的新模块，而是一套更现实的思路，K3 走的是集大成、稳落地路线： 每一处改动都有理论消融实验支撑，在训练稳定性、长文本推理显存、稀疏负载均衡三者之间找到最优解K3 整体架构总览RoPE 提出者苏剑林老", "url": "https://zhuanlan.zhihu.com/p/2068486405274198437", "votes": 52, "comments": 1, "feed_ts": 1786553019, "feed_time_str": "08-13 00:43", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "国宴为什么要以淮扬菜为主？", "excerpt": "如果国宴拿我老家新疆菜为主： 乌兹别克斯坦大使：哎森口，你给我干哪来了呢，这还四中国的吗？ 像啊，很像啊 ", "url": "https://www.zhihu.com/question/25665631/answer/2067522487202607476", "votes": 879, "comments": 42, "feed_ts": 1786552553, "feed_time_str": "08-13 00:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "后训练另一个看待角度：一场分布空间的游走训练时模型看到的状态，到底从哪来？因为后训练改的，不只是某个上下文上的token概率，而是模型自己将来会走进的那些状态。把这件事拆开，可能涉及两个维度：状态从哪来和信号怎么用。SFT、RL、OPD恰好在这两个维度上各占一隅。SFT的病灶，藏在&#34;覆盖&#34;里。 它的目标等价于最小化Forward KL，几何上对应m-投影，性格是mode-covering：目标分布的模式都得照顾到。目标一窄化，模型就只能从旧模式里抽质量去填新坑，遗忘就这样发生了。另一个麻烦的是训练和推理的错位：训练时看到的是黄金前缀，推理时面对的是自己生成的、可能已经错掉的前缀，这个偏差沿序列累积，长链任务上误差按O(T²ε)放大。RL的老实，源于它只在自己的熟悉的主场。 它等价于最小化Reverse KL，对应e-投影，mode-seeking——只需在自己高频访问的区域表现好。on-policy采样天然把更新限制在模型熟悉的状态上，这就是隐式正则。Shenfeld等人把这点讲得更准：在所有最优策略里，RL会隐式挑离当前策略最近的那个。实验也佐证，最朴素的REINFORCE和GRPO遗忘模式几乎一样，说明稳定来自on-policy数据本身，而不是KL正则这类修饰。OPD的妙处，是把状态和信号分开来给。 它不让学生在教师的领地学习，而是让教师走进学生的状态里点评，状态取学生分布，信号取教师分布。把这个目标展开求梯度，会得到一个很干净的恒等：OPD精确等价于一个以log-ratio为伪奖励的策略梯度。这也是它为什么同时拥有on-policy的稳定和逐 token 的稠密。至于它能让学生反超退化的教师，道理也许隐含于：教师坏掉的往往是整体轨迹分布，局部的条件分布大多还管用。Nie 的实验里，OPD学生保留率0.95，教师只有0.83，可两者的分布漂移几乎一样，这个对比正好说明，遗忘不是靠一个标量漂移就能解释的。把三个维度摆在一起，结合当下，会看到一个较尴尬事情：稠密、无偏、on-policy三者的帕累托：要on-policy又要稠密，就不得不接受一个全局有偏的教师(专家OPD)；要稠密又要无偏，那个角至今是空的；要on-policy又要无偏，信号就注定稀疏(Math/Coding)。而DPO、KTO、IPO 都在off-policy这一侧，等于把SFT的暴露偏差一并继承了。后训练也许重点不是选一个更好的目标函数，而是选一条几何路径去移动分布。状态来源，比目标函数更根本。详细技术内容请大伙参考原文链接： Post-Training模型分布视角下的SFT、RL 与 OPD 的状态分布塑形与几何解释BY 明", "excerpt": "后训练另一个看待角度：一场分布空间的游走训练时模型看到的状态，到底从哪来？因为后训练改的，不只是某个上下文上的token概率，而是模型自己将来会走进的那些状态。把这件事拆开，可能涉及两个维度：状态从哪来和信号怎么用。SFT、RL、OPD恰好在这两个维度上各占一隅。SFT的病灶，藏在&#34;覆盖&#34;里。 它的目标等价于最小化Forward KL，几何上对应m-投影，性格是mode-cover", "url": "https://www.zhihu.com/pin/2070997078877157244", "votes": 0, "comments": 0, "feed_ts": 1786550574, "feed_time_str": "08-13 00:02", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么现在的ai都在卷编程？", "excerpt": "你酒馆才花几个钱，天天用，一年能用掉 1000 吗？ AI Coding 一天 100 都是划算的，毕竟你一个月就给 3000 块，去哪都招不到程序员。 我曾经以为 AI 视频能打败编程，OpenAI 是傻逼，现在我不这么认为了，OpenAI 是聪明逼。 只要是娱乐消费品就会有审美疲劳，消费量会有一个上限。 不管 AI 把生产力拔高多少倍，人类的眼睛只有两只，一天只有 24 小时。 过去内容的瓶颈", "url": "https://www.zhihu.com/question/2068569618449430292/answer/2071021861647939559", "votes": 122, "comments": 8, "feed_ts": 1786550090, "feed_time_str": "08-12 23:54", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你们试过最牛逼的减肥方法是什么 ?", "excerpt": "减肥其实是最简单的事情，方法对了就不用花钱。规律有氧+干净的营养补充+充分休息就行了。 运动不止是当时有消耗，配合营养和休息，你整个人的代谢水平都会上升一档。 每周三次以上有一定强度的有氧运动，买个最便宜的运动手环监测心率，心率到极限心率的60%-80%算合格，保持30分钟以上。 极限心率估算公式：220 − 年龄 = 最大心率（次/分）比如你30岁，极限心率190，有效有氧需要心率114-152", "url": "https://www.zhihu.com/question/357332126/answer/2071021214718506714", "votes": 2, "comments": 0, "feed_ts": 1786549936, "feed_time_str": "08-12 23:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Codex破1000万后，额度重置规则是怎样的呢Codex 活跃用户达到 1000 万之前，Tibo 给出的规则很清楚：每增加 100 万用户，就为 Codex 重置一次使用限额。7 月 16 日达到 900 万时重置了一次，7 月 22 日达到 1000 万时又重置了一次。1000万后没公布新门槛超过 1000 万以后，reset 没有停止，但已经看不出固定门槛：7 月 26 日是补偿服务中断，7 月 28 日庆祝 ChatGPT Work 的快速采用，7 月 29 日配合处理 GPT-5.6 Sol 用量消耗偏快，8 月 1 日是周末活动，8 月 9 日和 8 月 11 日又各来一次。这些 reset 最短只隔 1 天，最长隔了 8 天，触发原因也不同。至少从 Tibo 公开的帖子看，OpenAI 目前没有宣布“每周一次”或“每增加多少用户一次”的新规则，更像是遇到产品事件、用量问题或庆祝节点时临时发放。明天的惊喜可能是什么Tibo 这次特意重提“每增加 100 万重置一次”的旧承诺，又说 Codex 早已超过 1000 万，并预告 8 月 13 日有一个“小惊喜”。结合这段铺垫，最直接的猜测是再来一次全员 reset；另一种可能是给账户增加一次 banked reset，也就是可以先存着、以后再用的重置机会。banked reset 并不是新功能。OpenAI 6 月就开始上线“保存一次 reset 以后使用”，所以引用帖里问“能不能给一张 banked reset”，更像是在猜这次会发什么，而不是在提一个从未有过的功能。新规则要等8月13日还有人猜 Astra 或其他产品更新，但原帖没有提供对应线索。现在能确定的是：1000 万之后尚无公开的固定 reset 规则；明天究竟是一次性重置、可储存的重置，还是公布新的里程碑规则，要等 Tibo 的后续帖子。", "excerpt": "Codex破1000万后，额度重置规则是怎样的呢Codex 活跃用户达到 1000 万之前，Tibo 给出的规则很清楚：每增加 100 万用户，就为 Codex 重置一次使用限额。7 月 16 日达到 900 万时重置了一次，7 月 22 日达到 1000 万时又重置了一次。1000万后没公布新门槛超过 1000 万以后，reset 没有停止，但已经看不出固定门槛：7 月 26 日是补偿服务中断，", "url": "https://www.zhihu.com/pin/2071012569385526163", "votes": 0, "comments": 0, "feed_ts": 1786547936, "feed_time_str": "08-12 23:18", "category": "pin", "cat_name": "想法动态"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "自己的哥哥是皇帝，称之为“皇兄”；如果自己的弟弟是皇帝，应该如何称呼？", "excerpt": "其实即便哥哥是皇帝，也基本不能称皇兄，明朝是喊“大兄皇帝陛下”。 至于弟弟当皇帝……题主问历史上有这事吗，当然有啊，宋恭帝赵㬎出生于咸淳七年，宋端宗赵昰出生于咸淳四年，但是他俩的爸爸宋度宗赵禥在咸淳十年死了之后，即位的是赵㬎，所以对于赵昰来说，就是“自己的弟弟是皇帝”。 元宁宗懿璘质班出生于泰定三年（1326年），元惠宗妥懽帖睦尔出生于延祐七年（1320年），这俩差的还有点儿多。元文宗死后，权臣燕", "url": "https://www.zhihu.com/question/661057913/answer/84414598129", "votes": 915, "comments": 74, "feed_ts": 1786547509, "feed_time_str": "08-12 23:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "未来加电站", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "分红“脚踝斩”的比亚迪，市场估值被买到哪一年了？", "excerpt": "2026年7月31日，比亚迪2025年度的现金红利正式划入股东账户。但拿到这笔钱的人，心情大概很复杂——每10股3.58元，总共32.64亿元的分红，相当于你花90.82元买1股，一年只能拿回3毛6分钱。 这是什么概念？ 2024年度的分红方案中，比亚迪分红到达了巅峰的120.77亿元。一年之间，从120.77亿掉到32.64亿，缩水超过七成。分红占净利润的比例，也从30%骤降到10%。 估计很多", "url": "https://zhuanlan.zhihu.com/p/2070999592397714741", "votes": 9, "comments": 1, "feed_ts": 1786544789, "feed_time_str": "08-12 22:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "未来加电站", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发 category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "做了这么久的推演，中国国内的省份已经就剩下港澳台以及广东篇应该要重写了。写了这么多，到这里呢，实际上算是给之前的推演打个补丁，尤其是在7月份以前写出来的内容，很多都忽视了一个重要的条件，那就是台风输水能力。这里还要补一个背景：为什么我一直拿上新世作为推演的框架。原因很简单，现在的大气二氧化碳浓度和上新世相当。基于温室效应，大气成分和大气能量的平衡，上新世的气候框架基本上可以锚定这一轮变暖终局的气候状态。相较于纯粹混沌的大气物理学推演，参考古地质时代——尤其是地块结构、地理结构和现在差别不大的时代——是非常有价值的。实际上我选上新世这个口径，已经算是比较极端了。它意味着我们人类熟悉并且习惯的气候模型被彻底改变，不一定不适合人类生存，但绝对会是翻天覆地的变化。然而现实告诉我们，上新世的框架还不够。我们这一轮所承受的，和上新世甚至都有不同——上新世的升温是和缓的，海洋能量没有像今天这样沸腾，而我们是在上新世的物理底板上，还叠加了连绵风暴和台风送水这个狂暴模式。这不完全是我的疏忽。学界之前对全球变暖的降水模型评估一直偏低，连专业圈子都在被现实追着跑，我这种业余推演就更不用说了。今年的台风个个堪比巨型抽水泵，巴威、红霞、白海豚，每一次登陆后残余环流都能把水汽输送到上千公里之外的内陆。这种强度的远距离输水，在以前的气候认知里是极少见的。万幸我当时拉推演尺度的时候，底线划得非常极端——以地块毁灭级灾难为标准，以中国的工程能力能否抢救为尺度。用这把尺子一量，长江中游的沼泽化依然是终局，江苏上海的地基液化依然是物理规律锁死的无解。而北方那些承受脉冲式暴雨的省份，台风远程输水只是把脉冲的强度和频率往上调了一档，不至于引起地块毁灭级灾难。黄土高原不会变成永久性湖泊，太行山的沟壑不会变成长江中游的泽国。也就是说，之前的文章核心结论不需要推翻重写，但需要在原来的基础上，把狂暴的脉冲型降雨再往上叠一叠。毕竟我们是在上新世的物理底板上，叠加了现代海洋热泵驱动的连绵风暴和台风送水。这个模式不是自然演化出来的，是海洋能量沸腾之后硬加上去的。更关键的一点：基于现在海洋的能量基底，今年这种狂暴的水台风，恐怕就是以后的气候常态了。不是说年年都像今年这么极端，但概率曲线的峰值正在往更暴烈的方向偏移。这个趋势是锁死的。推演就是这样，框架要牢固，参数要不断校准。慢慢修正，慢慢完善。", "excerpt": "做了这么久的推演，中国国内的省份已经就剩下港澳台以及广东篇应该要重写了。写了这么多，到这里呢，实际上算是给之前的推演打个补丁，尤其是在7月份以前写出来的内容，很多都忽视了一个重要的条件，那就是台风输水能力。这里还要补一个背景：为什么我一直拿上新世作为推演的框架。原因很简单，现在的大气二氧化碳浓度和上新世相当。基于温室效应，大气成分和大气能量的平衡，上新世的气候框架基本上可以锚定这一轮变暖终局的气候", "url": "https://www.zhihu.com/pin/2070963626572358987", "votes": 0, "comments": 0, "feed_ts": 1786536205, "feed_time_str": "08-12 20:03", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "青海：高原的定力——三摄氏度升温背景下的生态锚点", "excerpt": "引言：当温暖重返高原 多家机构基于IPCC第六次评估报告及第七次评估周期前期信号所做的政策路径评估显示，按目前各国提交的自主贡献方案，本世纪末全球升温最佳估计约2.8摄氏度；即便考虑AR7可能剔除最高排放情景，在现有减排力度不足的惯性下，升温幅度仍可触及4.8摄氏度区间。我们在此前的推演中，选取变暖3摄氏度作为审视问题的基准。支撑人类文明的全新世气候襁褓，其气温波动幅度仅在正负1摄氏度之间，而3摄", "url": "https://zhuanlan.zhihu.com/p/2070963052946706718", "votes": 3, "comments": 1, "feed_ts": 1786536127, "feed_time_str": "08-12 20:02", "category": "other", "cat_name" s": 1786501881, "feed_time_str": "08-12 10:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "英伟达宣布将与六家金融公司合作，设立独立算力融资平台，对行业意味着什么？芯片还会涨价吗？", "excerpt": "到这个地步就快了，这类似当年朗讯思科两兄弟搞过的vendor financing，本质上是种循环融资。 当年互联网泡沫的时候，也是朗讯思科这种设备供应商铲子股狂赚，其客户不得不维持超大规模的capex。搞到后面客户运营商实在没钱资本开支了，朗讯思科两兄弟就向客户提供贷款或股权投资，客户再用这些资金购买朗讯思科的设备产品。搞成拉出来再吃进去的循环融资。 这次无非是老黄自己上阵太扎眼，拉着阿波罗贝莱德", "url": "https://www.zhihu.com/question/2070440887121864300/answer/2070594229013948264", "votes": 282, "comments": 36, "feed_ts": 1786501785, "feed_time_str": "08-12 10:29", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "家里有别墅的，可以说一下别墅的弊端吗，真诚求问？", "excerpt": "对我来说，最大的问题就是除虫以及野生动物的问题。 以前住在公寓是从来没有过这些问题的，而且之前因为各种原因，我都住在五层以上，加上美东总体偏干燥的大环境，以前是没有太多虫害类困扰的。 但是自从搬进独栋别墅之后，蚊子，蜱虫和蚂蚁就很麻烦。但是我家后院过去就是一大片树林，虫害问题是无法根除的。折耳根很喜欢跟邻居家的狗子一起到树林里的草丛和小溪里折腾，我其实打从心里不是很喜欢他这样，因为他确实被蜱虫咬过", "url": "https://www.zhihu.com/question/2040542018233967784/answer/2055223027462321990", "votes": 171, "comments": 48, "feed_ts": 1786501359, "feed_time_str": "08-12 10:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "总参谋部与封印先知中央司令部合并：开启国家军事新架构、回顾封印先知中央司令部和总参谋部的成立与历史", "excerpt": "翻译自伊朗半官方媒体ISNA，原文为波斯语，采用 AI 进行翻译武装部队最高统帅（最高领袖）发布政令，任命革命卫队空军少将阿里·阿卜杜拉希（Ali Abdollahi）为武装部队总参谋长，并强调了完成武装部队总参谋部与封印先知中央司令部合并进程的必要性；这项合并是根据殉难领袖的指示，从去年开始启动的。 封印先知中央司令部和武装部队总参谋部是伊朗伊斯兰共和国国防指挥与管理架构中最重要的支柱；这两个机", "url": "https://zhuanlan.zhihu.com/p/2070527774964573102", "votes": 10, "comments": 3, "feed_ts": 1786501333, "feed_time_str": "08-12 10:22", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "集齐「旗舰平台 + AI 独显 + 185Hz 高刷」三大件，REDMI K100 Pro 系列冲击游戏体验标杆", "excerpt": "8 月 11 日，REDMI 正式发布年度旗舰——REDMI K100 Pro 系列，包括 REDMI K100 Pro、REDMI K100 Pro Max 两款机型。K100 Pro 系列全系配备当代旗舰平台和 AI 游戏独显 D2的「双芯」组合；拥有集成全新 M11 发光材料和超级像素排列的顶级国屏，带来 185Hz 超高刷新率和超高帧游戏生态；搭载 Sound by Bose 技术，带来移", "url": "https://zhuanlan.zhihu.com/p/2070814456372901741", "votes": 0, "comments": 0, "feed_ts": 1786501000, "feed_time_str": "08-12 10:16", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "俄国农奴制下贵族、村社、农民的关系是怎样的？", "excerpt": "这个问题下 @黄伯韬 的回答已经十分详尽了，但关于帝俄末期各个流派的土地纲领叙述仍有欠缺，笔者尝试在这里用自己的资料加以补充：1.民粹派/社会革命党的土地纲领是否是单纯的保留刻板印象中的村社？ 关于民粹派/社会革命党的土地纲领，社会革命党人对农民“并不抱有幻想”，村社作为一种民主自治机关拥有共产主义社会中自治机构的要素，但并不意味着村社真的如同1984中的大洋国那样事事管控。相反，在社革主要成员的", "url": "https://www.zhihu.com/question/27218066/answer/2070660328292201134", "votes": 60, "comments": 2, "feed_ts": 1786500976, "feed_time_str": "08-12 10:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "请问前阿富汗突击队与机动打击部队具体编制是怎么样的？", "excerpt": "突击队编制跟正常的米军游骑兵营一样，不过我认为这其实不重要 大部分营满员率通常在百分之六十左右，在这百分之六十的人之中往往只有百分之十的人真的有主动性。（不过也有些人素质真的很强）动不动还会有人开溜。 Frank Sobchak书里面提到过后期他们就是叫绿色贝雷帽过来跟普通ANA步兵营做两个引体向上然后就说他们是“突击队营”了。 虽然这样他们仍然以全阿富汗国民军百分之七的数量承担了百分之七十的战斗", "url": "https://www.zhihu.com/question/2070668471806039277/answer/2070673991270978989", "votes": 9, "comments": 1, "feed_ts": 1786500914, "feed_time_str": "08-12 10:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "刚刚，林俊旸官宣创业公司Pragmatik Labs！", "excerpt": "编辑｜Youli、山辉 就在刚刚，原阿里千问技术负责人林俊旸官宣创业新动向： 在上海创办了一家新的 AI 公司 Pragmatik Labs（语用科技），简称 p7k。方向也第一次正式公开：研究横跨数字世界和物理世界的下一代 Agent。 与此同时，Pragmatik Labs 的投资阵容也一并浮出水面。林俊旸透露， 高榕创投和 HSG（红杉中国）共同领投本轮融资，腾讯和上海未来产业基金提供支持。", "url": "https://zhuanlan.zhihu.com/p/2070815143156528317", "votes": 7, "comments": 0, "feed_ts": 1786500856, "feed_time_str": "08-12 10:14", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "因儿子说「大不了送外卖」，爸爸三伏天带他送外卖，竟意外修复父子关系，这一实践式教育怎么样？值得效仿吗？", "excerpt": "这也算是个经典教育界笑话，可以说自二三十年前起至今经久不衰。 就是不要试图用“打工苦”来唤醒孩子的学习欲望。 绝大多数孩子真的提前尝到了劳动就能换钱的甜头之后反而会更不想上学。 因为首先没有人会送未成年人去干有生命危险的活儿（比如高空作业），那么这个情况下你别管这个劳动多苦多累，哪怕是去搬砖、干快递分拣，他一天工作十二个小时，回到宿舍也不用写作业，没人管他玩手机，然后月底能拿到几千块。 几千块啊同", "url": "https://www.zhihu.com/question/2070152087481083737/answer/2070443470309926368", "votes": 8842, "comments": 714, "feed_ts": 1786500727, "feed_time_str": "08-12 10:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价曹丰泽突然转进视频赛道？", "excerpt": "曹丰泽本人还真的解释过：他转进视频的原因是他被调回来了，在国内干了第一天就干不下去了。 在衮衮诸公眼中，曹丰泽去非洲国企打灰这个事情，他吹捧的是国企，或者吹捧的是打灰，走偏门的可能会认为他吹捧的是非洲，但从他的表现来看，他吹捧的是“去”。他从非洲回来做自媒体后也没有找到办公室开始录稿子，而是去俄罗斯种大豆去了。 说到底蓝色英精们向往的不过是另一种出将入相。立党是九品官，勃勃是太守，如果能混到蔡老板", "url": "https://www.zhihu.com/question/663948815/answer/2001340079659040982", "votes": 547, "comments": 52, "feed_ts": 1786500420, "feed_time_str": "08-12 10:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "语文是在考服从性吗？", "excerpt": "考到90分考的是你的服从性考到120考的是你的主动性考到140以上考的是你的先天性", "url": "https://www.zhihu.com/question/658512296/answer/3542600632", "votes": 1586, "comments": 49, "feed_ts": 1786500074, "feed_time_str": "08-12 10:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "猪的尾巴为什么卷卷的？", "excerpt": "如果把时间倒推回大约9000年前，你会发现猪的祖先欧亚野猪（ Sus scrofa）并不具备这种特征[1]。野猪的尾巴是直的，这不仅符合空气动力学，还能在它们穿过灌木丛时充当某种信号旗，或者用来驱赶蚊虫。 那么家猪的卷尾巴是怎么来的？ 查尔斯·达尔文在1868年就注意到了这个问题，他发现被人类驯化的动物往往会出现一套相似的特征，比如耷拉的耳朵、变短的吻部、出现白斑以及卷曲的尾巴 。这种现象后来被称", "url": "https://www.zhihu.com/question/2000668780972508050/answer/2000678675482429141", "votes": 921, "comments": 32, "feed_ts": 1786499637, "feed_time_str": "08-12 09:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有哪些历史事实特别反刻板印象?", "excerpt": "雅典娜是斯巴达的城邦守护神。这个历史事实不仅有传世文献记载（比如公元2世纪的旅行家保萨尼阿斯就参观并记载过斯巴达卫城上城邦守护神雅典娜的神庙“青铜宫”[Paus. 3.17.2]），而且还有二十世纪初考古发掘的证实。斯巴达卫城遗址中除了出土过许多雅典娜雕像以外，最瞩目的是一则奉献铭文，其中记载了赛车运动员达摩农对“ 城邦守护神雅典娜”（Athena Poliachos）的长篇致辞，该铭文开头第一句", "url": "https://www.zhihu.com/question/13039651750/answer/1892259796478064149", "votes": 752, "comments": 47, "feed_ts": 1786499521, "feed_time_str": "08-12 09:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "龙牙", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何模仿佛经体翻译腔？", "excerpt": "《爱因斯坦那大方广相对时空经》瑞相云集品第一如是我闻。一时，爱因斯坦那世尊，住伯尔尼国，大智光明顶，专利藏阁之中。与大格物罗汉、算数比丘众，千二百五十人俱。皆是大阿罗汉，诸漏已尽，智慧如海，善能推演万法仪轨，心得自在。 其名曰：伽利略尊者、开普勒尊者、笛卡尔尊者、惠更斯尊者。复有牛顿上座，为诸罗汉之首，威德巍巍，久住定世定空之妄见，以此为正法，统摄三千大千物理世界。复有麦克斯韦大士、法拉第大士，…", "url": "https://www.zhihu.com/question/1930894182374961237/answer/2001226139465712759", "votes": 3452, "comments": 260, "feed_ts": 1786498514, "feed_time_str": "08-12 09:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价有理科生频繁认为理工科思维更容易相信伪史论？", "excerpt": "这些“理科生”推崇的所谓“理工科”，实际上就是能直接为“耕战”所服务的学科以及能满足他们的“赢学”需求的学科。对于自从科学革命以来所形成的这一套现代的理工科和人文社科知识的生产和传播体系，他们反而是敌视的。一个人不可能在系统性敌视人文社科的同时又真心地推崇理工科，所以认为“文科无用”自然就会滑向认为“诺贝尔奖无用”“菲尔兹奖无用”。 先让我们看看这些相信伪史论的“理科生”的所谓“理工科思维”究竟…", "url": "https://www.zhihu.com/question/2069345300871901779/answer/2070625298241040392", "votes": 261, "comments": 9, "feed_ts": 1786498456, "feed_time_str": "08-12 09:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美国的美债最终将怎么收场？", "excerpt": "判断一：美债的利息回不到过去了，未来就在高位晃。以前大家习惯了美债利息 1%、2% 的便宜时代，那个时代结束了。未来一两年，十年期美债收益率大概就在 4.5% 到 5% 之间晃悠。为什么？因为通胀下不来，借钱的人（美国政府）又越借越多，利息自然降不下去。 判断二：30 年期的长期美债，是最危险的一段。打个比方：短期美债像活期理财，利息跟着央行走；30 年长期美债像把房价锁死 30 年的合同，价格完", "url": "https://www.zhihu.com/question/659338147/answer/2070585805496639494", "votes": 66, "comments": 3, "feed_ts": 1786498360, "feed_time_str": "08-12 09:32", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "田地", "v function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

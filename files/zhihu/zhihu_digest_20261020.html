"1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么坐车看手机容易晕，自己开车却很少晕车？", "excerpt": "人类看东西是通过算法防抖的， 简单来说前庭这个运动传感器检测到加速度，知道你在运动， 然后给大脑发信号，让它处理一下视觉画面信息。 你现在起来走两步，跳两下，转个身，是不是感觉视觉画面很流畅？ 实际上就是用远古算法修正过的。 所以前庭受损，或者你原地转十几圈让前庭“过载”，都会出现视觉意义的“天旋地转”， 这就是大脑根据前庭发送的错误信号，算法过度修正视觉画面。 但是坐车的时候bug来了，前庭说在", "url": "https://www.zhihu.com/question/2085687195180986381/answer/2095701804671559072", "votes": 1, "comments": 0, "feed_ts": 1792434247, "feed_time_str": "10-20 02:24", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "CoreWeave真正的信号，以及标普500和纳指必须守住的位置", "excerpt": "CoreWeave的股价确实弱，跌回了今年7月的位置，而且CDS（债务违约保险价格）涨到了新高，这个水平说明市场非常担心它的债务违约，按正常情况股价该崩才对，但它现在还在6倍市净率，这很反常。 先排除掉几种可能： 第一，是不是客户出问题了？No. 它的大客户比如微软自己有数据中心，缺产能的时候才找CoreWeave这类新云厂商，现在微软股价还在高点附近，不是客户的问题。 第二，是不是新云厂商被大云", "url": "https://zhuanlan.zhihu.com/p/2095676212685320510", "votes": 10, "comments": 0, "feed_ts": 1792431023, "feed_time_str": "10-20 01:30", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Google提出Harness²：让Agent自动改进工作流程\nHarness²的改进对象是执行框架，模型权重冻结agent的失败可能来自漏读输入、工具流程和交付检查。Harness²修改提示、工具、memory、skill与编排等执行框架，用当前任务的对照执行来选择改动。主实验执行模型是GLM-5和Gemini 3.5 Flash，默认编辑模型是Claude Opus 4.8。因此基准提分反映整套改进流程的效果，不能直接算成执行模型单独变强。一步包含四次执行，不读取标准答案系统先跑一次基线，再提出通用问题和领域问题两份候选，各试跑一次，按行为及产物选择性合成后再执行。这一步包含四次任务执行和额外编辑会话。每个基准流从空改进库开始，完成任务后才记录组件和经验；下一题从公共初始框架起步，按需复用，而非自动继承上一题整套框架。行为改善不保证答案正确。WorkBuddy的11.5分需要连同试跑预算理解GLM-5配OpenCode，一步后WorkBuddy-Bench均分从64.2升至75.7，增加11.5分，三次运行标准差分别为1.4和2.2。测试是Code40题、Web35题、Office25题，均分按三域宏平均。执行步数13.5到13.7不是全流程账单。另在Gemini配OpenCode的消融中，去掉改进库使均分从77.5降至74.4，显示积累经验也参与了收益。并行k=5增加探索，采用前要核算总token计算比较统计最终交付前全部执行和改进token。k=5增加并行候选与合成宽度，并非串行五步；并发能减少等待，不会消除计算。该方法适合能承受重复执行、以额外探索换取交付质量的场景，不能只凭分数承诺省钱或可靠正确。对照仍受随机性和模型偏差影响，组件迁移未必成功，经验库去重与更新也仍待研究。原文标题：Harness²: Recursive Agent Harnessing for an Open World#无影寺 ", "excerpt": "Google提出Harness²：让Agent自动改进工作流程\nHarness²的改进对象是执行框架，模型权重冻结agent的失败可能来自漏读输入、工具流程和交付检查。Harness²修改提示、工具、memory、skill与编排等执行框架，用当前任务的对照执行来选择改动。主实验执行模型是GLM-5和Gemini 3.5 Flash，默认编辑模型是Claude Opus 4.8。因此基准提分反映整", "url": "https://www.zhihu.com/pin/2095677602304473051", "votes": 0, "comments": 0, "feed_ts": 1792428543, "feed_time_str": "10-20 00:49", "category": "pin", "cat_name": "想法动态"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "大厂程序员奋斗10年最终一无所有", "excerpt": "87 年程序员，16 年赚 700 万，最后几乎归零：我的人生全流程复盘与血泪教训我是 87 年农村孩子，父母纯农民，没文化。 在我们那个年代、那种教育环境，能读大学、走出农村，已经算是全村的希望。 从小家境清贫，骨子里一直带着 自卑、敏感、想证明自己的性格。父母疼我，我算是温室里长大的孩子，踏实、听话、肯干，但不懂人性、不懂风险、不懂止损。2010 年大学毕业，我只身南下广州。 刚出来月薪五千，", "url": "https://zhuanlan.zhihu.com/p/2095278622290482038", "votes": 45, "comments": 51, "feed_ts": 1792427984, "feed_time_str": "10-20 00:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "MiniMax M3.1 Flash(匿名Space Bunny)来了MiniMaxM3.1 Flash(OpenRouter上早期匿名版本Space Bunny)：输入、输出单价是M3短输入标准档的一半，直连API的思考力度却默认最高档max。给agent换模型时，低单价不保证任务账单同比减半，还得看它花多少token、是否需要重试。Flash不加长上下文档，按token计费MiniMax公布的Flash价格为每百万token输入0.15美元、输出0.60美元、缓存读取0.015美元，不随输入长度另加长上下文档。这是三项计费，不是整项任务一口固定价。MiniMax-M3的Standard标准档，输入不超过512k时，输入／输出为0.30／1.20美元每百万token。Flash这两项是它的一半；M3超过512k后单价翻倍，Flash则保持不变。M3还有Priority优先档，比标准档贵50%。其短输入的输入／输出单价为0.45／1.80美元，Flash恰好是它的三分之一。比较折扣必须带上服务档和输入长度；缓存读取又是另一项单价，不能统一套一个倍数。直连默认max，调低力度要验质量MiniMax直连API省略思考力度参数时默认max，并提供low、medium、high、xhigh、max五档。调用说明写明，力度越高，输出token更多、延迟也更高；关闭思考或传none会返回400。希望减少思考消耗，可以调低力度，但还要检验任务质量。记录各档的token用量和完成情况，才能判断省下的思考是否值得。MiniMax公布的Automation-Bench v1.0.6测试中，同用Claude Code框架，low为52.8%，max为62.8%，相差10个百分点。这个对照支持按任务调力度，不保证自己的agent也有相同收益。编程能力也非全面领先：MiniMax公布的DeepSWE v1.1成绩为73.7%，DeepSeek-V4.1-Flash-1017为77.0%。整体成本降70%MiniMax的正式发布博客称，agent任务整体使用成本比上一代降低70%。这是任务成本口径，不能用某一项token单价的折扣直接证实或否定。输入、输出、缓存命中和重试次数都会改变最后的费用。博客没有给出足以复核这项整体降幅的任务分布、力度和完整用量明细。对自己的工作流，需要在相同验收标准下比较每次成功完成的费用，避免单次调用便宜，却因重试更多把收益抵消。补充试用渠道：OpenRouter于10月19日宣布，早期匿名版本 ihu.com/question/2095441446371434660/answer/2095476536036037665", "votes": 5, "comments": 5, "feed_ts": 1792399119, "feed_time_str": "10-19 16:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你在部队出过最离谱的公差是什么?", "excerpt": "不是部队，冰工厂。坦克上的滑膛炮知道吧，为了保证膛压，它的内壁光洁度非常高，通常都在0.2以上，基本就是镜面，同时形位公差和尺寸公差要求也很高。 有次搞125炮筒，最后一道工序是内圆磨，大师傅不知吸嗨了还是喝大了，那个磨头没修好，就导致公差大了快0.2mm，还都是振刀纹，直接报废。 有人可能觉得0.2mm的精度很高了，其实在机加工行业，特别是精密加工，0.2mm的公差已经是大的离谱了。 —————", "url": "https://www.zhihu.com/question/593685125/answer/1895455522397872867", "votes": 1801, "comments": 195, "feed_ts": 1792398905, "feed_time_str": "10-19 16:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "南爸安爸", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "Deepseek 宣布 API 支持网页搜索与抓取，每 1000 次成功请求 5 元，如何看待此调整？", "excerpt": "好事情，重视产品设计了，大模型周期应该快到阶段性走向产品综合黏度比例越来越高了", "url": "https://www.zhihu.com/question/2095444746999182894/answer/2095551488886101562", "votes": 0, "comments": 0, "feed_ts": 1792398409, "feed_time_str": "10-19 16:26", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "马和驴的交配的时候在想什么？他们会觉得彼此符合自己的择偶标准吗？他们又是如何看待骡子的呢？", "excerpt": "马和驴：哪敢跟你们人类比玩的花 首先必须明确一点，胎盘类哺乳动物，除了少数几种灵长类以外，大多数都是近视+色盲。 简单粗暴的说，你可以认为大多数哺乳动物在择偶上没有外形方面的审美。（当然会追求强壮的力量型，身材还是看重的。） 说到这里就不得不先提一下哺乳动物夜行性瓶颈假说了。该假说认为，早期哺乳动物为了在恐龙的压迫下讨生活，所以不得不在长达1.6亿年的时间适应夜行生活演化出以下感官特征： 听觉系统", "url": "https://www.zhihu.com/question/12971345454/answer/115079972276", "votes": 3472, "comments": 290, "feed_ts": 1792398399, "feed_time_str": "10-19 16:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美国明明已经达成了“伊朗无核化”和“伊朗去军事化”，为什么还有人觉得美国输了伊朗赢了？", "excerpt": "南方邦联明明已经达成了“送领导先走”和“成功斩首林肯”，为什么还有人觉得南方邦联输了北方联邦赢了？", "url": "https://www.zhihu.com/question/2092559957115909991/answer/2094751564758107498", "votes": 78, "comments": 1, "feed_ts": 179 能改全能，全能改一人", "url": "https://www.zhihu.com/question/2092954987013972361/answer/2094794534421009074", "votes": 8263, "comments": 411, "feed_ts": 1792396896, "feed_time_str": "10-19 16:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "大家为什么会讨厌缩写？", "excerpt": "“我国知识分子在讨论社会问题时，常说的一件事就是别人太无知。举例言之，我在海外求学时，在《人民日报》（海外版）上看到了一篇文章，说现在大学生水平太低，连‘ 郭鲁茅巴’都不知道，我登时就如吃了一闷棍。我想这是个蒙古人，不知为什么我该知道他。想到了半夜才想出来，原来他是郭沫若、鲁迅、茅盾、巴金四位先生。一般来说，知识的多寡是个客观的标准，但把自编的黑话也列入知识的范畴，就难说有多客观了。”——王小波…", "url": "https://www.zhihu.com/question/269016377/answer/127455045237", "votes": 18325, "comments": 442, "feed_ts": 1792396512, "feed_time_str": "10-19 15:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "梁文锋和DeepSeek，为什么配得上\"国运级\"三个字？", "excerpt": "是不是我们的国运可以再说，但一定是美国的厄运。 所有收费AI，如果不比这东西强足够多，将没有存活的资格，整个商业模式都归零。 所有试图垄断生态（含软件硬件）的AI，只要这个东西存在，所谓的垄断就是一个笑话。 总之，要么是我们的好运，要么是别人的厄运，当然是国运级。 ", "url": "https://www.zhihu.com/question/2093628371448217836/answer/2095542113270249246", "votes": 359, "comments": 22, "feed_ts": 1792396173, "feed_time_str": "10-19 15:49", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "特斯拉市值 5 日蒸发超 6200 亿元，受飞行汽车影响有多大？这次发布新品算是一个好选择吗？", "excerpt": "就实用程度来说，不如冰箱彩电大沙发", "url": "https://www.zhihu.com/question/2095058852748027867/answer/2095218125465769345", "votes": 49, "comments": 3, "feed_ts": 1792395918, "feed_time_str": "10-19 15:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "UFO", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "学计算机组成原理时，哪些知识点会在写代码后突然「想通」？", "excerpt": "大一的时候，学习谭浩强的编程书。其中函数递归调用一节，花了一个下午的时间，把高阶汉诺塔的函数调用，在纸上画了一遍，足足画了5、6页的样子。（当时电脑还很贵，比一年的学费还贵，买不起。）然后，感觉有点神功小成，自己的能力有了一个非常大的提升。 后来的工作实践里，发现非CS专业的码农水平是真的菜，少部分人甚至不知道函数递归调用。大部分人虽然知道这东西，但却不知道原理/代价在哪里，程序运行的时候，由于嵌", "url": "https://www.zhihu.com/question/20943902339199267 b": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "传国玉玺真的在洛阳找到了吗？", "excerpt": "刚好这个十一去了西安和洛阳。 在陕历博看了皇后玺，十几个诸侯王玺，独孤信的多面体印。 玉玺根本就不像影视剧中拍的那么大，长宽只有2-3厘米。先秦的玺都很小巧，传国玺最大长宽不会超过6厘米，大概率3-4厘米。 影视剧中的玉玺二十多厘米的巨物，要两个手才能捧起来，这玩意先不说太后用来砸王舜扔不扔的动，真扔动也不可能扔出去太远，太后又不是铅球运动员也没有发力点。而且这么大去砸王舜，还真有可能给王舜砸死。", "url": "https://www.zhihu.com/question/2094346656363952002/answer/2095533328191460471", "votes": 52, "comments": 6, "feed_ts": 1792394079, "feed_time_str": "10-19 15:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "特斯拉新款 Roadster 正式亮相，能实现离地升空、空中翻滚，如何评价？你看好它的市场前景吗？", "excerpt": "对于车，我不想评价什么。但是不得不说，我觉得马斯克真的是一个很懂美股，很懂美国投资者想看什么的人。", "url": "https://www.zhihu.com/question/2094190191133172464/answer/2095532469852415129", "votes": 0, "comments": 0, "feed_ts": 1792393874, "feed_time_str": "10-19 15:11", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "抄的真快啊！昨晚发布 凌晨就被抄了。", "excerpt": "抄的真快啊！昨晚发布 凌晨就被抄了。", "url": "https://www.zhihu.com/pin/2095486493598954907", "votes": 0, "comments": 14, "feed_ts": 1792393817, "feed_time_str": "10-19 15:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "捏住老虎的后颈肉，它会像猫咪一样乖巧顺从吗？", "excerpt": "会的 很多事情，只要你做了，就会很简单 比方说钢卷，你要是说你要去偷，晚上去偷，开车去偷，大家都会管你 但是当你把钢卷举过头顶然后往废品站走的时候，不管是谁，都不会拦你 在举一些例子 1。在地球上任何国家，你造核弹都是违法的 但是你要是手搓了一个核弹，或者说，你徒手把铀235和铀238分开。那你干啥都是合法的，甚至你要是到了美国中国会派军队护你 2。 私自占矿生产黄金是违法的 但是你要是占了个水银", "url": "https://www.zhihu.com/question/15554795453/answer/2094461618348466621", "votes": 2525, "comments": 178, "feed_ts": 1792393741, "feed_time_str": "10-19 15:09", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美国怎么会走出打伊朗这步臭棋？", "excerpt": "咱们古代对边军有一条罪名叫“擅开边衅”，以前民族主义高涨的时候，觉得这就是无耻文官给边将扣帽子，寇可往我亦可往，杀蛮夷天然正义，朝廷里那群软骨头对内压榨对外讨好真不要脸。 现在美国总统亲身给大伙示范了一遍什么叫“擅开边衅 : "https://www.zhihu.com/question/393643278/answer/2094696000472598426", "votes": 1795, "comments": 111, "feed_ts": 1792391270, "feed_time_str": "10-19 14:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "flyingpanzer", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价中国南京籍留学生，在莫斯科国立大学历史系课堂，身披旭日旗、桌上摆放日军军帽？", "excerpt": "以我这么多年接触各类海外 “牛鬼神蛇”的经验看，我不认为这货的表演是“纯粹且坚定的意识形态信仰”。更多的是一种小屁孩缺乏人生阅历，在心理上追求“反向认同”与“对抗性自我建构”，这不是一个稳定、内化的意识形态结构。我是 真正见过那些带有“偏执意识形态”的“负面案例”的货色的，那些“纯粹的（或高度内化）的意识形态信仰”，在心理学上通常表现为一套相对稳定、跨情境一致的、认知与情感高度整合的认知体系。很反", "url": "https://www.zhihu.com/question/2094350166518249285/answer/2095517317803284042", "votes": 454, "comments": 51, "feed_ts": 1792390262, "feed_time_str": "10-19 14:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "法国发生近年来最严重暴力骚乱，约1200人被捕、超150名警察受伤，情况如何？为何此时矛盾进一步激化？", "excerpt": "无论哪里和平/暴力抗议，评价不外乎正反方：支持者认为国民正当争取自身权益，革命者无罪，政府必须向人民妥协；不能抗议的地方，无论是否认同外国示威者的具体诉求，往往羡慕嫉妒，得出结论，法国人的高福利是靠这样的一次次“小规模革命”争取来的。幸福生活的秘密是斗争的勇气，需要学习。 反对者则直接定性为暴乱，嫌马克龙政府反应太慢、出手太轻。破坏公共和私人财产，就是共和国的敌人，必须出重拳！ 值得注意的法国政治", "url": "https://www.zhihu.com/question/2095109263622238854/answer/2095514177775342396", "votes": 455, "comments": 133, "feed_ts": 1792389513, "feed_time_str": "10-19 13:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "最后一个下飞机，下飞机后发现摆渡车开走了，怎么办？", "excerpt": "有一次落地后大号，出来以后，只有空姐和机组人员，空姐都坐在凳子上脱鞋了。 我一开门，大家都一脸震惊的看着我，大概持续了五秒钟，大眼瞪小眼。 乘务长抢先打破僵局，赶紧站起来，说不好意思，忘记敲厕所了，然后赶紧联系地勤，问有没有空的摆渡车，结果没有。跟他们在飞机上尬聊了十几分钟。 最后跟空姐们一起做小车去的候机楼，开开心心聊了一路。下车前还跟我确认了一下，会不会投诉。 ", "url": "https://www.zhihu.com/question/427909101/answer/3429261694", "votes": 15634, "comments": 867, "feed_ts": 1792389492, "feed_time_str": "10-19 13:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "刀刀宁", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么大部分医院的院长副院长都是心外科胸外科上任的？", "excerpt": "哈哈哈哈，这个确实有一定的依据。 心内科心外科就是比神经外科神经内科容易出院领导。 为什么 因为省里面市里面的大领导，到了五十多岁，正是心脑血管容易出问题的年纪。心脏血管堵塞或者有心脏病，心内科心外科的医生给这些大领导做完手术之后，这些大领导又能够重新回到工作岗位，是不影响工作和提拔的。而且心脏病那种濒死感，真的是让人感到彻彻底底的恐惧，所以救回来之后真的是把医生当救命恩人啊，必须好好报答一下，把", "url": "https://www.zhihu.com/question/1904336392173093128/answer/2091161286361072136", "votes": 7463, "comments": 332, "feed_ts": 1792389301, "feed_time_str": "10-19 13:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待特斯拉第二代 Roadster 的\"倒挂+翻滚\"演示？2028 年能如期量产吗？", "excerpt": "现在的汽车性能参数是越来越多了，轴距啊接近角离去角啊零百加速啊总功率啊扭矩啊各种配置啊什么什么的一大篇，能全部弄明白的人不多。然而Roadster这个车批量上市以后，还得多一个ECR：effective casualty radius， 有效杀伤半径。什么汽车炸弹…… ", "url": "https://www.zhihu.com/question/2094365185335096710/answer/2095512587119207199", "votes": 101, "comments": 16, "feed_ts": 1792389134, "feed_time_str": "10-19 13:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "42岁，资深码农，失业了，求指导？", "excerpt": "写了近20年代码的手，最后去送了外卖。这句话我差点用在自己身上。39岁被裁那年，我找工作三个月未果，缓过劲干的第一件事，是把能下的跑腿 App、外卖 App 挨个下了一遍。 后来还认真查了查，跑滴滴一天能挣多少。 所以你问“接下来的路怎么走”，我感同身受。你试过的那几条路，外卖、快送、摆摊、电子厂、看店、网上兼职，我一条条，全部都认真思考过，但最后一条都没走进去。 我也认真算过：一天跑十个小时，流", "url": "https://www.zhihu.com/question/2086186486689539771/answer/2093352281286652781", "votes": 26, "comments": 9, "feed_ts": 1792389060, "feed_time_str": "10-19 13:51", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么陈建斌在《甄嬛传》里面的表演几乎没什么表情？", "excerpt": "我看过《甄嬛传》的花絮。 幕间休息的时候，上百个女人在那叽叽喳喳。 真的，你从粗糙的画面里，都能感觉到少数男演员身居在其中的疲惫感。 你想想陈建斌还是主角，大部分场景他都在，拍完戏份也得在旁边等着下一场。 他连闭目养神都做不到。 所以他在表演里的那种沉稳哪里需要演，那就是天天被环境折腾的心灰意懒。 你看他在新三国里不是演的挺兴奋吗，表情包都挺多。 那都是男演员们啊。 换你去，你也和陈建斌一个表情。", "url": "https://www.zhihu.com/question/449473743/answer/2085507168556540652", "votes": 5516, "comments": 251, "feed_ts": 1792388799, "feed_time_str": "10-19 13:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东 卖军火配件，一个管军火生产。可以说整座近代化学是被火药订单逼出来的；是的，“科学”也是被打仗逼出来的。但这个“科学革命”有个绕不开的尴尬，欧洲人用中国发明的指南针和火药，靠着一场接一场的战争，催生出了近代科学；但注意，我并不是说“谁偷了谁”，而是知识这东西，从来不是一条单行道。课本里那一长串欧洲名字，诸如哥白尼、拉瓦锡、伽利略……每一个人的脚下都踩着一段更长的、被抹掉的道路，这条道路从中国、印度、阿拉伯一路铺过来；近代科学革命也确确实实发生在欧洲，是欧洲人做了集大成者，这一步谁抢不走，问题只在于，很多人把“集大成”当成了“白手起家”。我们看这段历史最该拿走的不是“欧洲偷了我们的东西”这口怨气，是另一件事：“知识”是一套复杂的网络，而中国从一开始就是这张网里织得最早、织得最密的那几个部分之一。徐光启，这位明朝尚书级别的官员，面对一本欧洲来的书，说的是“拿来”是“精通”；他是拿来用的，不是拿来供着的，这个姿态，才叫文明自信。欧洲为什么能发展出所谓“科学”？ #中国人，你要自信（书籍）  #知识青年  #今天的中国人该醒悟了  #中国人的劣根和优根（书籍）  #奋斗与认知  #时代认知  #知识改变未来  #时代正在改变  #我们这样长大成人：青年人的自我认知及社会因素的影响（书籍） ", "excerpt": "欧洲为什么能发展出所谓“科学”？伽利略不光看星星，他还卖罗盘；安托万·拉瓦锡生前的职务是法国兵工厂厂长兼火药局局长。一个卖军火配件，一个管军火生产。可以说整座近代化学是被火药订单逼出来的；是的，“科学”也是被打仗逼出来的。但这个“科学革命”有个绕不开的尴尬，欧洲人用中国发明的指南针和火药，靠着一场接一场的战争，催生出了近代科学；但注意，我并不是说“谁偷了谁”，而是知识这东西，从来不是一条单行道。课", "url": "https://www.zhihu.com/pin/2094700121061705071", "votes": 0, "comments": 0, "feed_ts": 1792385321, "feed_time_str": "10-19 12:48", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么现在的rts游戏出一部暴死一部？", "excerpt": "大众玩家能接受的rts: 带战斗演出的种田游戏 实际端出来的rts: 这个人基地车晚了1秒展开，他已经死了 ", "url": "https://www.zhihu.com/question/2038324047910532593/answer/2094008705696150278", "votes": 4695, "comments": 205, "feed_ts": 1792385273, "feed_time_str": "10-19 12:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么清朝能在欧亚大草原彻底衰落之前征服亿万汉人？", "excerpt": "可以看下哔站的up永乐大帝明成祖，他很早就意识到并论证了鞑清征服中国，是用兵民合一的奴隶制古典军事体制（虽然带有严重的部落痕迹），最大限度发挥重甲弓骑兵的数量优势，从而完成了马群之主，对原子化自由化的晚明社会，赖以维持国防的，早期火器化募兵集团的大规模消灭。而又因为明朝南北方腹地，前无古人后无来者的长达200余年的基本和平，导致这些地方的防御性重资产投资严重不足。一旦九边重兵被消灭，其已经臃肿低效", "url": "https://www.zhihu.com/question/641940788/answer/1935317620732703488", "votes": 1951, "comments": 154, "feed_ts": 1792383809, "feed_time_str": "10-19 12:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "被裁员是什么感觉？", "excerpt": "37岁被裁 const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

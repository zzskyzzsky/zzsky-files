会交际应酬的贵族小姐。而贾琏是贵族子弟，他的妻子不可能是奴婢出身。因为奴婢出身的人没法和诰命们平起平坐，交际往来。最后《红楼梦》虽然是古典文学，但却明明白白说明了一点，信男人能给你好出身，梦里寻去吧！贾琏哪有那么好的良心啊！", "excerpt": "琏会在贾赦授意下休妻休掉王熙凤，然后扶正平儿?有人说，贾琏会在贾赦授意下休妻休掉王熙凤，然后扶正平儿。老实说，这是嚼别人的甘蔗渣，蠢死。首先，中秋家宴里，有明确贾赦的未来，不到两年就死掉了。贾母听说，笑道：“这话很是，我倒也忘了孝未满。可怜你公公已是二年多了，【庚辰双行夹批：不是算贾敬，却是算赦死期也。】可是我倒忘了，该罚我一大杯。既这样，你就越性别送，陪着我罢了。你叫蓉儿媳妇送去，就顺便回去罢。", "url": "https://www.zhihu.com/pin/2082439877615010807", "votes": 0, "comments": 7, "feed_ts": 1789299382, "feed_time_str": "09-13 19:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么说李世民是汉人而不是鲜卑人？", "excerpt": "昨天在某群里，一个群管理说刘邦是回族，我说刘邦死后八百多年穆罕默德才出生。他说第一个穆斯林是耶稣，不是穆罕默德。我说耶稣也得等刘邦死后近两百年才出生，他把我踢出群了。 ", "url": "https://www.zhihu.com/question/604609073/answer/2015005819796743338", "votes": 19524, "comments": 824, "feed_ts": 1789298780, "feed_time_str": "09-13 19:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "原油，中东的诅咒，蓝星的效率倒退？原油，中东的诅咒，蓝星的效率倒退？1405年，郑和首次下西洋。1498年5月达·伽马抵达印度西南部，开辟了欧洲通往印度的新航路。1492年，哥伦布发现欧洲新大陆。1522年，麦哲伦船队仅剩的一艘船返回，完成了人类历史上首次环球航行。人类终于用自己的眼睛证明了蓝星是圆的，并且拓展了新航线，开辟了新大陆...这中间伴随着伊斯兰-奥斯曼土耳其帝国的衰亡。1》诅咒。1）无论郑和下西洋的初衷是什么，得不偿失，是可以确定的。以永乐大帝为首的明帝国上下也对中东，对非洲红海沿岸所能得到的东西兴趣缺缺，因此，关起门来，自成一统。北有荒漠，西有帕默尔高原，西南有青藏高原-横断山脉，东北到从南则是漫长的海岸线，因此：烧船，禁海，闭门造车，固步自封，明末崩溃也就顺理成章，王朝自有其寿命限制。2）无论是阿拉伯帝国，还是奥斯曼土耳其帝国，始终是横在东西方交流的屏障，葡萄牙 西班牙开发绕道非洲西海岸通往印度的新航线，无意中发现新大陆，环球绕行拓展疆域和航道先是不得已而为之，后面则是在美洲发现的金矿 银矿支撑了持续数百年殖民的活动。金子，银子，有了钱，就有了持续航行和开拓的动力。甚至，对明帝国的白银的输入，很大一部分就来自于葡萄牙 西班牙对美洲的掠夺，而当大英帝国战胜了西班牙的无敌舰队之后，明帝国则陷入了财政紧缩，给自己的崩溃加了一把火。当然，大英帝国发展的动力更加明确，海岛国家，农业资源贫瘠，北欧征服者和原住民凯尔特人是妥协共存的，为了海洋掠夺，为了海外殖民地，为了黄金白银，那么现代银行（当时还算先进），股份制公司等制度的确立，都促成了大英帝国的蓬勃向上的精神，和对新技术新武器的渴求：更快的船，更坚固威力更大的炮，瓦特不是发明了蒸汽机，而是改进了蒸汽机，那是一些列矿业，冶金，化学制药等现代工业的兴旺发展的基础之上才能有一项尖端发明的出现。没有驱动力，就没有大英帝国。在此其间，中东一直是“原地踏步”的，阿拉伯帝国，扼守东西方的交通要道，收丝绸之路的过路费，到了奥斯曼土耳其帝国，继续扼守东西方的交通要道，收过路费...他们曾经在吸收古希腊文明的时候“开放”过一阵子，但后面很多地方又缩回了原教旨主义。这个地方，商业的氛围极为浓厚，至今的迪拜还是以商业服务闻名。后面又发现了“工业之母”-石油，那更是躺赚了，因此，很多中东国家到现在还是保持着古老的王国形式，他们缺乏进步的动力，老天爷赏饭吃，一赏就是几千年，要啥自行车，要啥蒸汽机？走路就够了。2》仇恨。无论是波斯-阿拉伯帝国的征服和被征服，还是阿拉伯帝国-奥斯曼土耳其帝国的冲突，甚至是1948年后重翻旧账的以色列-阿拉伯，中东这片土地上从来不缺乏仇恨，并且是绵延数千年的仇恨。加上石油，加上宗教，加上外来势力的挑唆，这地方大打出手容易，握手言和难。原油资源集中在中东，东西方的交通要道也在中东，为什么这么巧？帝国发兵伊朗，从外面封锁霍尔木兹海峡的时候，我出过主意，说：只要几家握手言和，俄罗斯 沙特 伊朗们还有其他的力量们同心协力，以OPEC的名义掌管海峡，那么帝国的阴谋诡计就破产了...至今，我还是认为除此之外，并没有别的好办法。可惜，这些“国”们都只顾着打着自己的算盘，鼠目寸光，一盘散沙，在帝国的组合拳下，很快就败下阵来。3》倒退。媒体报道，胡塞组织之拖鞋军们已经正式掌控了曼德海峡。在媒体的渲染中，穿着拖鞋，拿着AK47就把也门政府军，沙特老爷军们打得哭爹叫娘，丢盔弃甲...当然是胡扯蛋。问题是，沙特王储认识不到问题所在，据说在战斗吃紧的时候，只是一个劲的请求总统，跪求美军亲自下场，而自己的飞机一个也飞不上天。我们不用去纠结这些细节，只是，沙特的输油管道也被炸得浓烟滚滚，沙特在两侧海峡都无法向东继续卖油却也是事实。我们曾说过：打烂一个旧世界很容易，建设一个新世界很难，2月底到现在，数月之内，中东的仇恨更深了，油井港口被炸烂了很多，油船被炸沉了很多，输油管道也被炸烂了。中东王爷们自己不修练武功，怀里揣着大元宝招摇过市，却总是幻想着花钱买路，大家都给面子。过去大家不动手，只是大家都还过得去而已。现在帝国债台高筑，AI IA输血输了好几年了，只有投资，没有结果，帝国会和你们客气么？从帝国的角度来说，无论走那条路，都是形势所迫，无可厚非。AI IA星辰大海，固然美好，但沙漠里能救命的是一杯水，从来不是一座金山。因此，古希腊的文明之火被灭亡，当时的罗马帝国是不会反思的，帝国的红巨星时代，必须吞噬一切能延长帝国寿命的资源，“星辰大海”们如果只是为了自己能发财，一直在侵蚀帝国的根基的话，帝国就会掐灭它，甚至不惜回到中世纪。所谓的黑暗中世纪。你，准备好了么？你，能做什么？周末，不过多聊行情，专栏文章里面有原油的新规划，请大家自行参阅。给出近期按顺序的8张近期原油规划图供参考（图2到图9），更新更快的原油规划请参阅我的专栏文章。", "excerpt": "原油，中东的诅咒，蓝星的效率倒退？原油，中东的诅咒，蓝星的效率倒退？1405年，郑和首次下西洋。1498年5月达·伽马抵达印度西南部，开辟了欧洲通往印度的新航路。1492年，哥伦布发现欧洲新大陆。1522年，麦哲伦船队仅剩的一艘船返回，完成了人类历史上首次环球航行。人类终于用自己的眼睛证明了蓝星是圆的，并且拓展了新航线，开辟了新大陆...这中间伴随着伊斯兰-奥斯曼土耳其帝国的衰亡。1》诅咒。1）无", "url": "https://www.zhihu.com/pin/2082525756123566926", "votes": 0, "comments": 18, "feed_ts": 1789298498, "feed_time_str": "09-13 19:21", "category": "pin", "cat_name": "想法动态"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么很多公司都不招大龄码农？", "excerpt": "猎头跟你说的其实还算客气了。 现实情况是，很多中大型厂甚至中小型创业团队，技术研发岗的简历筛选阈值已经悄悄往前移到了30岁到31岁。很多团队招纯开发，HR在系统里基本是一键过滤，连技术负责人的工位都递不过去。 你今年36岁，去市场上找纯开发，碰壁是确定的必然结果。 很多人把这种现象归结于中年人的身体机能下降、不能熬夜、家庭琐事多、薪资期望高，或者干脆扣一个年龄歧视的帽子。这些解释听起来合情合理，也", "url": "https://www.zhihu.com/question/29326842/answer/2082547780610945574", "votes": 182, "comments": 39, "feed_ts": 1789298083, "feed_time_str": "09-13 19:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_AN name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "清朝人口为何从1400万迅速长到4亿？呈现爆发式增长，是何原因？", "excerpt": "有些吹捧是很隐蔽的。比如这里一直被吹捧的所谓清朝人口是爆炸式增长，但是如果和同时期的世界人口数据比较才会发现，当时全世界都进入人口爆炸增长，清朝增速和当时世界平均水平差不多，甚至不如同期东亚的朝鲜。 1644年至清朝灭亡时，世界人口从约5亿增至约19亿，而同期的满清统治下中国人口约1.2 亿增至4亿，实际速度还稍低于全球平均水平。 而这一时期，东亚其他地方的人口增长更加迅速。同在东亚的朝鲜，在16", "url": "https://www.zhihu.com/question/528355615/answer/2082316348080898577", "votes": 880, "comments": 67, "feed_ts": 1789296804, "feed_time_str": "09-13 18:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "陶哲轩发文称「AI 正杀死数学百年开放传统」，你如何看待这一观点？", "excerpt": "陶当然会这么说，GPT6这波几乎实锤未来人类不再依赖自然涌现高斯欧拉，数理天才对人类科技的推动作用不如AI一根。 说白了，你智商再高，也无非是一个只有800-1000亿神经元的灵长类动物，其中还有很大部分被拿去实现身体的基础功能，留给逻辑思考的部分更是少之又少。 你拿什么和万亿参数起步，用成千上万计算卡集群在向量潜空间进行狂暴思考的AI比数学潜力？ 我觉得这是好事，毕竟人类大脑肉眼可见的有局限性，", "url": "https://www.zhihu.com/question/2081393640379893635/answer/2082148261247432120", "votes": 411, "comments": 96, "feed_ts": 1789296443, "feed_time_str": "09-13 18:47", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "小旋风财进", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价青落同学最新视频《盎撒人是最伟大的民族！英系国家最伟大！》？", "excerpt": "看了下，典型的辉格史观，把偶然说成必然，把复杂的过程简单化。 意思是英系国家之所以强，靠的是别的文明没有的几样东西，诺曼征服之后，国王和贵族之间拉扯，贵族逼着约翰王签下大宪章，王在法下。再往后詹姆斯二世出逃，威廉带兵登陆，议会拿到主权，国王和议会就像公司里的CEO和董事会。 马戛尔尼访华，乾隆讲跪拜礼，马可波罗给欧洲人造出来的东方想象。妇女争取选举权，宪章运动，启蒙运动，哈耶克，约翰密尔的论自由。", "url": "https://www.zhihu.com/question/2081868908777232125/answer/2082538193283444944", "votes": 11, "comments": 0, "feed_ts": 1789295797, "feed_time_str": "09-13 18:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待博主永乐大帝明成祖最新一期视频讲述的沙俄与日本视觉的照妖镜？", "excerpt": "团劫人清粉的套路总是那一套：把明末搬到近代，然后说明朝/汉族王朝也应对不了近代冲击；把清朝搬到古代，说清朝就是比那些朝代强。搞田忌赛马。 但问题是，明朝如果能从17世纪的地狱中熬过来，熬到近代，那他还会是现实位面的明末吗？他要是能续到1848年，他就不可能还是现实世界明末的样子，不然呢？难不成崇祯的明末是冻在冰箱里保存到1848年再解冻，然后表演的一个“应对不了近代冲击”？我为什么要用崇祯朝去跟大", "url": "https://www.zhihu.com/question/2077565029956821379/answer/2082526684654343718", "votes": 99, "comments": 17, "feed_ts": 1789295678, "feed_time_str": "09-13 18:34", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有没有某个瞬间，突然就释怀了？", "excerpt": "一直以来，我看到虾就很激动，愤恨，忧伤 我还记得很久以前，我的叔叔带我下馆子，我想吃面前的虾，他不给我剥（当时还是小孩）就算了，居然把整盘都端走，一只也不让我吃 我很难过，逐渐开始怨恨他，很多年了我都放不下这个心结，看到虾我就生气，难过，从来不去点，也从来不买 直到去年，无意得知相隔很远的叔叔生了一场病，直到他痊愈之后我才知道，突然有点想念和惭愧，毕竟叔叔照顾了我很久，也一直是个温和开朗的长辈 在", "url": "https://www.zhihu.com/question/576917894/answer/1999974056343119328", "votes": 4223, "comments": 235, "feed_ts": 1789294787, "feed_time_str": "09-13 18:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "熟悉计算机体系结构是种什么样的体验？", "excerpt": "熟悉计算机体系结构，最直接的生理反应就是脱敏与去神秘化。 你在屏幕上敲下一行代码，普通工程师看到的是面向对象、函数调用、设计模式或者算法的时间复杂度。但在体系结构从业者的视野里，那些由高级语言编织起来的抽象层会在瞬间瓦解。代码直接还原成物理世界中电子信号的定向搬运、流水线的启停、晶体管门电路的开关，以及硅片内部存储介质与计算单元之间永无休止的博弈。 计算机科学的核心技术路线，过去六十年都在致力于做", "url": "https://www.zhihu.com/question/59057984/answer/2082527208648733361", "votes": 31, "comments": 0, "feed_ts": 1789293178, "feed_time_str": "09-13 17:52", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "认真学习完 MIT 6.824和CMU 15445 可以找到相关的工作吗?", "excerpt": "能把 MIT 6.824 和 CMU 15445 的全部 Lab 独立做完，代码一行一行调通，单凭这一点，你在全国计算机相关的应届生和初级开发者里，工程素养和调试耐力就已经迈进了前百分之五。 但你现在的迷茫和没信心完全在情理之中。 很多人学这两门课之前，脑子里都有一个预设：我只要啃下分布式和数据库内核这两块硬骨头，就能顺理成章去大厂做底层基础架构，去写数据库引擎，或者去搞分布式存储系统。现实却迎头", "url": "https://www.zhihu.com/question/466679564/answer/2082522705266529249", "votes": 33, "comments": 0, "feed_ts": 1789292105, "feed_time_str": "09-13 17:35", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "从俄乌的“特别军事行动”到美伊的“军事冲突”，对各国未来的军事冲突有哪些启示？", "excerpt": "说明帝国主义在海岸线上架起几尊大炮就可霸占一个国家的时代又一去不复返了，想霸占一个国家必须要投入海量本国地面部队搞占领", "url": "https://www.zhihu.com/question/2082481113008706953/answer/2082507061867423444", "votes": 102, "comments": 10, "feed_ts": 1789292050, "feed_time_str": "09-13 17:34", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "1215年大宪章签署时，南宋正在做什么？为什么同一个世纪，东西方走向了完全不同的制度路径？", "excerpt": "先不说大宪章多少天后就变成厕纸题主肯定不知道1214年就是英格兰的靖康之耻~", "url": "https://www.zhihu.com/question/2079219674428993542/answer/2081450388566303148", "votes": 77, "comments": 1, "feed_ts": 1789290935, "feed_time_str": "09-13 17:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "1215年大宪章签署时，南宋正在做什么？为什么同一个世纪，东西方走向了完全不同的制度路径？", "excerpt": "这就是我之前说进步主义视角下特色的线性向上史观了 这类人普遍认为 国家的成败在于某一个关键时间点没有成为世界领先，一步落后就导致步步落后近代为什么落后-因为没有第一个发现完成工业歌名-为什么没有发现完成工业歌名-因为没有产生资本主义-为什么没有产生资本主义-没有进行大航海-没什么没有大航海-都怪1215年没有签署大宪章！ 都怪南宋导致导致六百年后打不过英国 哎！ 你问他大航海吃了最多红利的西班牙近", "url": "https://www.zhihu.com/question/2079219674428993542/answer/2081421454424514610", "votes": 485, "comments": 31, "feed_ts": 1789290927, "feed_time_str": "09-13 17:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "太湖陶朱公", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "名校硕士五轮面试全过却因第一学历专科遭拒，为何不能从一开始就说明学历要求？如此看重第一学历合理吗？", "excerpt": "如果一项条件足以否决前面五轮面试，它就应该排在第一轮前面。 一个人的专科起点，不会在第五轮面试结束那天突然发生变化。需要核对什么材料，就尽早核对；哪些条件不能例外，就尽早说清。把这些留到最后，考验的是求职者承受意外的能力。 看了题目里的报道，我最难接受的，是一句「总部规定」似乎就能替整个流程收尾。 对面试官来说，这可能只是一个没有走完的招聘单；对求职者来说，准备、请假、等消息、权衡去留，都是自己生", "url": "https://www.zhihu.com/question/2082169271191168289/answer/2082517665231459913", "votes": 0, "comments": 0, "feed_ts": 1789290903, "feed_time_str": "09-13 17:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "白鸽号（Duyfken）的航行能力", "excerpt": "前言第一条仿古船叫白鸽号（Duyfken），他的原形来自1600年的一条大河南小型jacht，为何要用这条船呢?因为这条船在1606年到达澳洲，是有信史以来，是第一条到那里的船(千百年前，南岛土着有没有划者独木舟到澳洲，这就没人知道了)。 第二条仿古船是明末初清使用的赶增战船，尺寸来自当年的官方造船文件《钦定福建省外海战船 则例》 和 《闽省水师各标镇协营战哨船只 图说》；在明清交替之际，赶增战船", "url": "https://zhuanlan.zhihu.com/p/2082420050854678930", "votes": 3, "comments": 0, "feed_ts": 1789290627, "feed_time_str": "09-13 17:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "旷野", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "怎么看 OpenAI 用 Python 把在线存储撑到 2000 万 QPS，两年后又改成 Rust？", "excerpt": "我想聊聊他们说的那个 连接池故障。我翻了半小时资料确认下来，这就很像是 Facebook 2014 年那个著名 bug 的逐字重演，机制一样，正反馈路径一样，连修复方法都一个字不差。写那个 bug 的人如今就在OpenAI，这你说巧不巧。 Habitat 是 OpenAI 的在线存储平台，2023 年 DevDay 为了支持 GPTs 上线，当时只是一个 Python 客户端库，底下连着一个 Az", "url": "https://www.zhihu.com/question/2082038426619138671/answer/2082513584735654690", "votes": 11, "comments": 1, "feed_ts": 1789289930, "feed_time_str": "09-13 16:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "我给你们举个例子吧我看这个消息和键政是不一样的，键政说的是美帝，我看这个消息利好的是航运。我们可以看后续。", "excerpt": "我给你们举个例子吧我看这个消息和键政是不一样的，键政说的是美帝，我看这个消息利好的是航运。我们可以看后续。", "url": "https://www.zhihu.com/pin/2082508498684925831", "votes": 0, "comments": 8, "feed_ts": 1789288771, "feed_time_str": "09-13 16:39", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待博主永乐大帝明成祖最新一期视频讲述的沙俄与日本视觉的照妖镜？", "excerpt": "永乐大帝的叙事很飘逸，我很喜欢。 因为1840史观导出来的弥赛亚史观里面，清朝必须是对的，不是说清朝是好的，是清朝哪怕是坏的，他也坏的对，否则弥赛亚史观就跑不起来。 明朝在近代能做的更好，不行。 明朝再近代能做的更坏，不行。 我们不谈汉人，假设日本和俄国路线，不行。 既是诸因之果，亦是诸果之因。一证永证，倒果为因。整个叙事里面带清就不可能是错的。 你拿明朝对比他们说你是失败者。 你拿日俄对比他们说", "url": "https://www.zhihu.com/question/2077565029956821379/answer/2082472144815010593", "votes": 207, "comments": 8, "feed_ts": 1789288132, "feed_time_str": "09-13 16:28", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待博主永乐大帝明成祖最新一期视频讲述的沙俄与日本视觉的照妖镜？", "excerpt": "我看这位的视频不是很多，但是却也总结出了一些观点。你乎左自之所以这么强烈反对这种视频与观点。无非是害怕这位的观点将会推导出这样的结论：没有满清奴役汉人会使得统治东亚汉地的政治实体在近代面临西方的时候的冲击回应模型的时间大大缩短，因为该政治实体已经完成了西欧以及近代日本的中央集权后所具有的近代官僚系统，且没有一个特定的部族阶层阻碍政府进行原子化动员大多数底层百姓，只要引进一工时期的机械厂房，聘请洋…", "url": "https://www.zhihu.com/question/2077565029956821379/answer/2081746103163170819", "votes": 231, "comments": 15, "feed_ts": 1789288063, "feed_time_str": "09-13 16:27", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "全球变暖正在让西北变江南，都在往好的方向发展，为什么还有这么多人认为变暖弊大于利？", "excerpt": "西北变湿确实是真的，但以此来证明变暖利大于弊就很逆天了。至于西北变江南，我严重怀疑这是被炒作出来的，要知道江南普遍是亚热带季风气候，但西北大部都不在季风区内。 退一万步讲，哪怕我们只谈降水不谈季风，江南的年降水量普遍能达到1200毫米，但西北最湿润的地方才600毫米左右，塔里木盆地的年降水量甚至还不到100毫米。 杯水车薪啊！增加的那点降水都未必抵得过蒸发受全球变暖影响，过去几十年里西北地区的降水", "url": "https://www.zhihu.com/question/2082376355325464661/answer/2082406414820041477", "votes": 171, "comments": 66, "feed_ts": 1789287871, "feed_time_str": "09-13 16:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美国对你做了什么导致你这么恨美国？", "excerpt": "我可不恨美国，你觉得我恨美国时候我只是在辟谣。 例1 你：“一个人最大的成就，就是把孩子托举到美国那样没有人情事故的地方” 我：“美国也有人情事故” 你：“美国对你做了什么导致你这么恨美国？” 例2 你：“因为美国发明了手机，所以人类要生生世世感恩美国人” 我：“这逻辑不对吧？我买手机我花钱了啊” 你：“美国对你做了什么导致你这么恨美国？” 例3 你：“美国制度完美无瑕” 我：“事实显示美国制度也", "url": "https://www.zhihu.com/question/2074334526881510996/answer/2078391817838580943", "votes": 2043, "comments": 188, "feed_ts": 1789287113, "feed_time_str": "09-13 16:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果阿喀琉斯没有被冥河水泡过的部位不是脚后跟而是腚眼子，特洛伊战争的局势会发生多大的变化？", "excerpt": "据野史记载，阿喀琉斯的母亲特提斯当年并不是抓着他的脚踝将他在冥河水里浸泡，而是用中指勾着他的腚。从此阿喀琉斯就刀枪不入，只是他母亲警告他必须要吃的清淡，要不然可能就完蛋了。 在特洛伊战争时期，阿喀琉斯连续阵斩了赫克托尔、彭拉特西亚和门农，特洛伊再无强大的将领，于是大家都开庆功宴，阿伽门农亲自给阿喀琉斯敬酒 。但阿波罗看不得胫甲坚固的亚该亚人得胜，便化作一个游方商人，找到阿喀琉斯的男朋友帕特洛克罗斯", "url": "https://www.zhihu.com/question/1988654889593741939/answer/2081718886207177832", "votes": 3277, "comments": 134, "feed_ts": 1789286938, "feed_time_str": "09-13 16:08", "category": "geo", "cat_name": "地 ents": 4, "feed_ts": 1789271585, "feed_time_str": "09-13 11:53", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "伊朗新版历史教科书已经加入十二日战争与斋月战争内容用ai翻译了下十二日战争在伊历1404年（2025年）的头几个月里，伊朗和美国在阿曼的斡旋下进行着谈判。谈判的主要议题是伊朗核计划以及解除制裁。当时已经进行了五轮谈判，第六轮原定于伊历1404年霍尔达德月25日（2025年6月15日）举行。但是，就在这场谈判的两天前，即伊历1404年霍尔达德月23日（2025年6月13日），以色列政权对伊朗发动了大规模袭击。该国的军事和核设施以及部分防御系统遭到打击。一些高级指挥官、核科学家和伊朗民众也在此次袭击中殉难。犹太复国主义政权高级官员在战争初期的言论表明，他们认为自己正处于一场与伊朗的生存之战中，并试图通过出其不意的袭击以及打击指挥官和敏感中心，来推翻一个从未且永远不会屈服于外国统治的政府。就在同一天，大阿亚图拉赛义德·阿里·哈梅内伊（Ayatollah Seyyed Ali Khamenei）任命了新的指挥官，以接替殉难的指挥官。在更换指挥官后，伊朗武装部队开始对以色列政权的军事中心发动导弹和无人机袭击。战争持续了十二天。在战争的最后几天，随着伊朗的导弹和无人机打击取得成效，美国也直接卷入了战争，并打击了伊朗的一些核设施。伊朗方面则用导弹袭击了美国驻卡塔尔的空军基地。最终，在伊历1404年提尔月3日（2025年6月24日），应美国和犹太复国主义政权的要求，达成了停火协议，双方的袭击暂时停止。十二日战争是伊朗与以色列政权之间的首次大规模直接交锋。在这场战争中，以色列能够利用突袭手段对伊朗造成一定打击；但伊朗也能在遭受初次袭击后维持其指挥结构，并继续进行军事反击，从而迫使敌人提出停火建议。斋月战争的爆发在两次战争之间的时期，政治、经济和军事压力依然存在；然而，谈判的大门并未完全关闭。在阿曼的斡旋下，伊朗与美国于伊历1404年巴赫曼月和埃斯凡德月（2026年1月至3月）进行了三轮谈判。第三轮谈判于埃斯凡德月7日（2026年2月26日）结束，未能达成最终协议；但双方原定继续进行技术性对话。两天后，即伊历1404年埃斯凡德月9日（2026年2月28日），美国和以色列对伊朗发动了大规模袭击。就这样，斋月战争也是在谈判进程尚未结束时爆发的。这一次的袭击不仅限于军事和核设施；政治中心、经济和能源基础设施、导弹基地以及一些官员和指挥官的驻地也遭到了打击。在战争的第一天，伊朗伊斯兰共和国最高领袖大阿亚图拉赛义德·阿里·哈梅内伊，与一些指挥官、官员和民众在德黑兰市殉难。不久之后，米纳卜市的“沙贾拉·塔伊巴”（Shajarah Tayyibah）小学连续遭到三枚美国导弹的袭击，该校许多师生殉难。这一事件表明，敌人为了达到自己的目的，不惜犯下任何罪行。这种行为延续了此前在该地区一些国家已经见过的手段；即利用战争和暴力来制造恐惧、伤害社会，并迫使各个国家退让。同时将政治领导层和军事指挥官作为打击目标，使国家面临伊斯兰革命以来最艰难的危机之一。这种袭击方式表明，袭击者期望通过一方面消灭最高领袖和部分官员，另一方面通过煽动恐怖分子制造内部动乱，从而使伊朗陷入崩溃状态。但是，随着民众广泛聚集在广场和街道上，以及法律、行政和军事机构的积极运转，他们的目标并未得逞。新任指挥官接管了武装部队的职责，行政和服务机构继续管理公共事务并保障民众需求。领导层专家会议也根据其法定职责召开会议，并于伊历1404年埃斯凡德月18日（2026年3月9日）选举阿亚图拉赛义德·穆杰塔巴·侯赛尼·哈梅内伊（Ayatollah Seyyed Mojtaba Hosseini Khamenei）为伊朗伊斯兰共和国最高领袖。伊朗的回应与霍尔木兹海峡的封锁作为对美国和以色列政权袭击的回应，伊朗使用导弹和无人机打击了该政权的政治和军事中心以及美国在该地区的军事基地。与此同时，伊朗宣布隶属于敌对国家的船只不准通过霍尔木兹海峡。在实践中，许多油轮和商船通过该水道的交通陷入停滞或受到极大限制。就这样，霍尔木兹海峡成为了最重要的战争舞台之一。霍尔木兹海峡是位于伊朗和阿曼之间的一条狭窄水道，连接着波斯湾与阿曼湾及公海。全球近五分之一的石油和天然气贸易从该航线经过。因此，海峡的封锁不仅影响了交战国。波斯湾沿岸国家的油气出口下降，船只航行和港口活动受到干扰，许多国家的运输、船只保险和能源成本随之上升。这一事件再次凸显了伊朗地理位置的重要性。此前 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

13:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "麒麟的生物原型可能是什么？", "excerpt": "说实话，我是没想到这个问题下能开出这么多脑洞，连东亚灭绝超过两百万年的长颈鹿科都搬出来了 [1]，而那个嫌疑最大的玩意反而一直没人提……先简单梳理下文献：甲金文中「麐」字均疑似用于人名先不论 [2]，先秦至两汉关于动物「麐/麟」的外形描述，除了万恶之源《诗·周南·麟之趾》外，主要有三个独立来源，分别是下表中加粗的：《公羊传》：麕[3]而有角《尔雅》：麕身、牛尾、一角《封禅书》：双觡共抵之兽其中《尔", "url": "https://www.zhihu.com/question/318575626/answer/2009056453055506092", "votes": 866, "comments": 73, "feed_ts": 1788152242, "feed_time_str": "08-31 12:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《太平年》中出现的官职头衔为何会这么长，出现这种头衔堆砌现象？", "excerpt": "各个省的省长基本上具备以下职务： 省委常委，省委副书记，省人民政府省长，省政府党组书记，省安全生产委员会主任，省总河长，省级河湖长，省林长，省食品安全委员会主任，省国土空间规划委员会主任，省乡村振兴领导小组组长，省防汛抗旱指挥部指挥长，省减灾委员会主任，省人大代表，全国人民代表大会代表，省重大项目建设领导小组组长，省生态环境保护委员会主任，省国防动员委员会第一主任，省级医改领导小组组长，省政务服…", "url": "https://www.zhihu.com/question/2002759521722917002/answer/2062126682631418160", "votes": 2817, "comments": 204, "feed_ts": 1788151880, "feed_time_str": "08-31 12:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价西方伪史论者认为古代西方不具备发展天文学的条件？", "excerpt": "伪史论者喜欢强调西方古代没有天文台，缺乏天文观测仪器，因此不具备天文学发展条件。 那我就列举一些中东和欧洲古代的天文台，以及天文观测仪器。 其实肉眼时代，全世界的天文观测仪器总结起来，就是指针和刻度盘的组合，随坐标系选择的不同以及指针的差异，就出现了各种不同的变体。 最早的天文台和天文观测仪器，往往是一些自然和人工地标的组合，比如中国古代的陶寺古观象台，就是由13根呈半圆形排列的夯土柱、三层夯土台", "url": "https://www.zhihu.com/question/1933215910891623842/answer/2077668695422267694", "votes": 77, "comments": 27, "feed_ts": 1788151805, "feed_time_str": "08-31 12:50", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "全球变暖是真实的吗？是否是人为编造出来的谎言？", "excerpt": "就实际情况而言，全球变暖是真实的，并不是被人为编造出来的。全球变暖相关的科普我已经写过很多了，但奈何每次都有人不愿相信，因此这篇回答我要讲一些之前没讲过的东西。 事实上不少政客与极右人士确实编造了不少与全球变暖相关的谎言，但他们不是故意渲染威胁论，反而是坚持否认全球变暖，以及光明正大或变相的渲染变暖无害论。 真正的谎言不是制造焦虑，是变着花样的否认变暖看到问题描述中特别提到了知名政客，在这我就要提", _name": "社会 · 文化 · 其他"}, {"actor": "曹小灵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "官方通报「博主街头除钉因扬尘影响环保被叫停」，称工作人员沟通方式造成误解，有更好的处理方式吗？", "excerpt": "东西方，在类似的事情上，处理思路高度雷同。 官不侵民，民也别侵官，说白了就是不能主动窃权，哪怕窃权，也要操作细腻，不能显得官面上的人只吃公粮不干实事，丢了面子。 先讲国外的吧。 美国人，在这方面玩的很花，淘金热让19世纪旧金山人口爆炸，治安就弄得很烂，想管也管不过来，后面就直接躺平了。 于是1851年到1856年，一些商人拉着一些小年轻，弄了个大活，旧金山警戒委员会，自己来管治安，人数6000多，", "url": "https://www.zhihu.com/question/2076962750237091669/answer/2077717912186631476", "votes": 446, "comments": 20, "feed_ts": 1788146553, "feed_time_str": "08-31 11:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "未来加电站发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "孙少军直播：“速成车”之争：污名化还是新常态？概念的来龙去脉“速成车”这个说法，最早由某韩系车企提出，指责中国新能源车研发周期过短、质量不可靠。近期又被翻出来，恰好赶上合资品牌大规模推出中国化新能源车（宝马iX3、别克E7、日产N7、丰田博智等）。燃油车真的比新能源更“严谨”吗？诸葛大佬从研发流程谈起：过去燃油车开发周期48-52个月，两冬一夏测试，9-10个项目节点。现在借助成熟平台、环境舱模拟、反季节测试、更强大的供应链，全新车最快可缩至18个月。这不叫“速成”，而是效率提升。但问题在于：有些新入局者跳过了某些关键测试步骤，导致问题在用户端暴露（如外后视镜晒软、高温场景考虑不足）。而传统车企虽然慢，但在这方面犯错较少。反过来，传统车企对软件迭代、用户指令的复杂场景适应不足，也有短板。总裁以亲身经历补充：新能源的三电系统（电池、电机、电控）其实比燃油车的发动机+变速箱更成熟、故障率更低。网约车跑六七十万公里的比比皆是，三电依然稳定。而燃油车经典的烧机油、漏冷却液等问题，大家早已习以为常。硕士更是犀利：凯迪拉克CT5在美国最新安全测试中多项为“P”（最差），它研发了那么多年，就不是“速成车”了？消费者会因此买单吗？艹老师的观点：不要陷入自证陷阱艹老师认为，“速成车”是合资品牌对中国车企的集体污名化，类似美国AI公司指责中国“蒸馏”模型——但蒸馏本身就是正常研发手段。正确的应对不是“我们不是速成”，而是反问对方：“你们的燃油车两冬两夏测了什么？为什么还烧机油、乳化？为什么碰撞测试一撞就烂？你们研发四五年，开发了个什么？”他进一步指出，燃油车开发时间长，是因为发动机燃烧、变速箱匹配是模糊经验，靠少数巨头积累的“不传之秘”。而电车时代，电能可以精确控制，电池、电控、智能化供应链完全透明开放（宁德时代、比亚迪、中创新航等），开发周期缩短是必然的，不缩短才说明你落后。", "excerpt": "孙少军直播：“速成车”之争：污名化还是新常态？概念的来龙去脉“速成车”这个说法，最早由某韩系车企提出，指责中国新能源车研发周期过短、质量不可靠。近期又被翻出来，恰好赶上合资品牌大规模推出中国化新能源车（宝马iX3、别克E7、日产N7、丰田博智等）。燃油车真的比新能源更“严谨”吗？诸葛大佬从研发流程谈起：过去燃油车开发周期48-52个月，两冬一夏测试，9-10个项目节点。现在借助成熟平台、环境舱模拟", "url": "https://www.zhihu.com/pin/2077709926160512810", "votes": 0, "comments": 0, "feed_ts": 1788144835, "feed_time_str": "08-31 10:53", "category": "pin", "cat_name": "想法动态"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "发出“刺耳的警报声”，比尔·盖茨到底在担心什么？", "excerpt": "导语：比尔·盖茨担心的不是机器会变成人，而是人来不及成为自己该成为的样子。 张帆/作者 砺石商业评论/出品华盛顿州柯克兰，西雅图东侧一个富裕的湖畔郊区。这天天气好得近乎不真实：华氏八十多度，天空蓝得没有一丝杂色。从Gates Ventures的会议室望出去，脚下是码头边一排随湖水轻轻起伏的游艇，湖的另一边是勾勒出天际线的奥林匹克山脉。用《麻省理工科技评论》记者的话说，景色漂亮得令人心旷神怡，却又莫", "url": "https://zhuanlan.zhihu.com/p/2077708800258266673", "votes": 2, "comments": 0, "feed_ts": 1788144619, "feed_time_str": "08-31 10:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Mac mini缺货原因找到了！OpenAI、Anthropic都在抢", "excerpt": "内存芯片价格飞涨，普通消费者快买不起电脑了，另一边，适合运行 AI 负载的设备却卖得火热。 据《The Information》援引 OpenAI 内部消息人士报道，过去几个月，OpenAI 购买了数万台 Mac mini 和 Mac Studio，用于强化学习和计算机操作智能体的开发。 这些设备被集中部署，用来训练和测试能够自主操作电脑的 Agent。报道还称，Anthropic 也在通过亚马逊", "url": "https://zhuanlan.zhihu.com/p/2077708308329271535", "votes": 11, "comments": 0, "feed_ts": 1788144329, "feed_time_str": "08-31 10:45", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "为 Agent 重造一台游戏引擎：南大联合南洋理工提出 VibeGame，Agent 团队自己试玩、反思、进化", "excerpt": "https://www.zhihu.com/video/2077708025717180011 大模型的编码能力让 Vibe Coding 成了软件开发的新常态，“一句话生成 xx 游戏” 也在社交媒体上反复刷屏。但这些刷屏的 demo 有一个共同点： 第一个能跑起来的版本，就是终点。 而在真实的游戏开发里，第一个可玩版本恰恰是起点。针对这个问题，近日来自南京大学模式识别实验室（PRLab）的胡文", "url": "https://zhuanlan.zhihu.com/p/2077707928451167000", "votes": 5, "comments": 1, "feed_ts": 1788144245, "feed_time_str": "08-31 10:44", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "小旋风财进", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "长鑫科技上半年净利润 776.05 亿元，同比扭亏为盈，公司称全球内存芯片供给紧缺将延续，如何解读？", "excerpt": "长鑫科技半年报业绩大超预期，公司是好公司，在A股有稀缺性，所以肯定有溢价，适合在熊市买左侧，都不看好的时候再买，没啥人气的时候再买，赔率更高 存储是个周期成长行业，寡头垄断，竞争格局稳定，新玩家很难进来，股价波动又大，等以后行业景气度跌倒谷底，长鑫会是很好的选择 长鑫上半年营收1503.1亿，同比增873.64%，归母净利 776.05亿。招股书里预计上半年营收1100到1200亿、归母净利500", "url": "https://www.zhihu.com/question/2076750431288665173/answer/2077707982515787012", "votes": 57, "comments": 5, "feed_ts": 1788144185, "feed_time_str": "08-31 10:43", "category": "ai", "cat_name": "AI · , "votes": 417, "comments": 57, "feed_ts": 1788141145, "feed_time_str": "08-31 09:52", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "拥核在即，俄拉响警报，450架歼16亮剑：中方随时教日本做人一个手握四十多吨钚的国家，首相在国会上被追问要不要搞＂核共享＂，官邸幕僚私下讨论＂日本该不该拥核＂——这不是冷战悬疑剧的桥段，是眼下真实发生在东京永田町的事。莫斯科看不下去了，中国空军也没闲着，450架歼-16已经飞出国门，一路刷到了北非上空。先把这盘棋里最扎眼的一颗子拎出来看看：钚。日本原子力委员会自己公布的账本上写得清清楚楚，截至2024年底，日本国内外分离出的钚累计约44.4吨。这个数字放在国际原子能机构的档案里，是所有无核武国家里最扎眼的一份。44.4吨够干什么？中国军方媒体今年春天算过一笔账，理论上够做出五千多枚核弹头。数字听着夸张，但它背后的意思很简单——原料这一关，日本早就跨过去了。真正卡住日本的从来不是技术，是政治。三菱重工的火箭固体推进剂技术、川崎重工的精密制造、六所村的后处理厂，这几样凑一起，就是一个隐形的核门槛。核武器的三要素——材料、投送、意志，日本占了两个半。俄方最近这一轮敲打，就是奔着这＂半个＂意志去的。克里姆林宫高层公开点了高市早苗的名，用词很重，说日本正在往军国主义的方向＂明目张胆地走＂。这种直接对着一国首相开炮的表态，外交场上并不多见。问题是，高市自己也没打算收敛。今年2月国会答辩时，她嘴上讲＂作为个人不能接受核共享＂，但同一段发言里承认了官邸内部有幕僚建议日本考虑拥核。首相亲口把这话摊在众议院议事录上，性质就变了。紧接着4月，日本内阁把《防卫装备转移三原则》的口子撕开了一道大缝。原本卡了几十年的杀伤性武器出口限制，一纸文件放开。战斗机、导弹这些真家伙，都能往外卖了。这两件事拼在一起，日本国内的和平派看得心惊。广岛、长崎的市民团体连着开会抗议，前首相时代那句＂日本不至于落魄到靠卖武器过日子＂，眼下没人再敢重复。俄罗斯之所以急，一半是替自己急，一半是替整个东北亚急。日本一旦真突破无核三原则，朝鲜半岛的核博弈就彻底乱套，连韩国国内的拥核声也会跟着水涨船高。美国的态度就更微妙了。华盛顿嘴上讲不扩散，手上却在跟东京谈延伸威慑升级。这种＂你别自己搞、但我可以借你一点＂的操作，等于给日本右翼递梯子还嫌不够高。看清了这层背景，再回头看中国空军最近这波动作，味道就完全不一样。歼-16这型飞机在军迷圈里的外号叫＂炸弹卡车＂，不是白叫的。沈飞在双发重型平台上一路改，装上国产WS-10B发动机、大孔径有源相控阵雷达，机翼下十二个挂点全挂满，一趟能扛十多吨弹药出门。装备规模上，中国空军手里的歼-16已经攒到大约450架，全球最大的重型战斗机机群，没有之一。对比一下美国空军——F-15E加上新出厂的F-15EX，凑一起两百出头。F-22停产多年，产量永远定格在187架。更关键的是产能。沈飞生产线的节奏，海外防务媒体估算是接近每年一百架。这种＂下饺子＂的速度，比单机性能的比拼更能说明国力。有人会问，歼-16没有隐身皮肤，跟五代机比是不是差一档？答案很直接：任务分工不同。隐身机负责撕开口子，＂炸弹卡车＂负责把口子后面的目标一锅端。真到大规模对地打击那一步，载弹量和出勤率才是硬通货。今年8月中下旬，中国空军把这支机队的一部分拉到了埃及。中埃＂文明之鹰-2026＂联合训练，歼-16带着运-20A、运油-20、空警-500一整套家当，从国内起飞、经停巴基斯坦卡拉奇，一路落到北非。这条航线值得琢磨。飞行途中经过的阿曼湾、红海一线，周边散落着好几处美军基地。中国空军选这条路走、把预警加油体系一并拉出去，等于当着全世界的面告诉外界：远程投送这件事，我们不光会说，还会飞。歼-16挂载副油箱、配合空中加油之后，作战半径能推到1400公里以上。这个数字对日本意味着什么，翻开地图一目了然——所谓的西南＂防线＂，纵深其实并没有多深。真金白银的实力摆在那儿，日本右翼那套＂拥核换大国地位＂的算盘就显得特别单薄。搞几十吨钚料吓唬人可以，真放到450架重型战机的火力覆盖下，账根本算不平。高市政府现在的处境有点尴尬。武器出口松绑了、涉台言论放出去了、拥核话题官邸内部也讨论了，几步棋走得急，回头路却越来越窄。国内反战民意压着，国际上俄罗斯冷嘲、中国亮剑，美国还在半推半就。日本战后七十多年攒下的和平红利，是靠几代人省吃俭用换来的。被少数政客拿去赌一个虚无缥缈的＂正常国家＂位子，       + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

们讲工业革命肇始，就是煤炭，蒸汽机，钢铁；煤炭比蒸汽机更要紧，没有煤炭作为能源，拿什么驱动蒸汽机？英国当时发现了大量浅层煤矿，在工业革命初期，当时的很多煤层属于露头煤；挖了几百年，都没有挖过中国定义的浅层煤。中国古代工业基地，或者说手工业基地主要集中在东部地区，而中国煤炭资源则集中在西北地区，因此，中国古代手工业能源需求的重点就是木炭。木炭提供的热值能烧出瓷器，炼钢，这就意味着高附加值，可以完全覆盖木炭的溢价。因此，计算一种能源材料的价格，不在于开采制作加工的成本，而是销售终端的所能产生的利润；木炭是中国古代极其重要的工业能源，烧制木炭的意义不亚于近现代石油开采；从这个逻辑往下梳理，很容易得出中国人工业天赋全球第一的历史脉络。十斤木头只能烧出一斤炭，古人为什么还要把柴烧成炭再卖？ #古代煤炭  #煤矿用履  #煤炭储量 ", "excerpt": "十斤木头只能烧出一斤炭，古人为什么还要把柴烧成炭再卖？能源价格不是这样算的：木炭是古代能源里面热值最高的。我们讲工业革命肇始，就是煤炭，蒸汽机，钢铁；煤炭比蒸汽机更要紧，没有煤炭作为能源，拿什么驱动蒸汽机？英国当时发现了大量浅层煤矿，在工业革命初期，当时的很多煤层属于露头煤；挖了几百年，都没有挖过中国定义的浅层煤。中国古代工业基地，或者说手工业基地主要集中在东部地区，而中国煤炭资源则集中在西北地区", "url": "https://www.zhihu.com/pin/2106520898635417484", "votes": 0, "comments": 0, "feed_ts": 1795013721, "feed_time_str": "11-18 22:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "十斤木头只能烧出一斤炭，古人为什么还要把柴烧成炭再卖？", "excerpt": "能源价格不是这样算的。 木炭是古代能源里面热值最高的。是焦炭出现以前最好的冶炼燃烧材料。 我们以工业革命为例，英国的能源优势是什么？英国当时发现了大量浅层煤矿。根据英国煤炭管理局2020年评估，英国剩余煤炭资源量约39.06亿吨，其中英格兰占85.6%，苏格兰占6.7%，威尔士占7.7%。煤层平均厚度1~2米，当前经济可采储量约10.79亿吨。 这都挖了多少年了，还有这么多。在工业革命初期，当时的", "url": "https://www.zhihu.com/question/2105266981108766020/answer/2106520436766937586", "votes": 35, "comments": 1, "feed_ts": 1795013610, "feed_time_str": "11-18 22:53", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么张国焘在四方面军威望那么高，让他敢对抗中央北上的方针？", "excerpt": "在那个年代，能当上几万人的“一把手”，绝对不是一个草包。说明他的本事不是虚的。 张国焘不仅不是草包，而且是个“人精中的人精”。 那张国焘究竟有哪些倚仗和本事呢： 一、起点极高，党内老资格；论资历——他是“祖师爷”级别的； 这是他所依仗的最硬的底气。 张国焘早年任北京学生联合会讲演部部长，是五四运动知名的学生领袖之一。 他是正儿八经的“建党元老”，绝对的根红苗正。 而且是一个可以跟陈独秀、李大钊一起", "url": "https://www.zhihu.com/question/2102753321069057741/answer/2104906509897487189", "votes": 289, "comments": 25, "feed_ts": 1795013553, "feed_time_str": "11-18 22:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "大厂年薪200万大头兵和清北年薪30万带大子刊青椒谁社会地位高?", "excerpt": "我自己是大厂年薪300 ts": 1794988106, "feed_time_str": "11-18 15:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟,太湖陶朱公", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么样看待最近几年的反腐成效？", "excerpt": "站在国家角度叫中兴，站在贪官角度叫天灾。 这是预期差的伟大艺术，每次浪潮都让人觉得这是最后一次，实际上一浪接一浪绵绵无绝期。每个条条块块都会觉得我能幸存，实际上板块轮动一行接一行挨个点名，一省接一省拉网筛查。 从大老虎开始，再到军队、政务，然后是命脉行业，金融、医疗、学术…… 最恐怖的是，他们的几乎没有任何反抗之力，甚至他们的反扑都没有在网络上留下大动静……仿佛是一场静默的无应激流水线屠宰。 中金", "url": "https://www.zhihu.com/question/2083138079116862726/answer/2106302620063240396", "votes": 4415, "comments": 175, "feed_ts": 1794987723, "feed_time_str": "11-18 15:42", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "《民兵国度：人民动员力量的崛起与伊拉克民族国家的式微》书评：6/10，用黎巴嫩3.14的话术套伊拉克虽然本书作者巴里亚·阿拉穆丁（了解黎巴嫩历史的应该会很熟悉这个姓氏）在整理资料、梳理历史、派系、关键个人与势力变迁等方面下了很多功夫，但这不足以掩盖其立场、方法论与分析框架方面的严重缺陷。作者是个持反真主党立场的黎巴嫩人，这种身份标签促使她将黎巴嫩3.14派系用于攻击真主党的说辞和逻辑，近乎完全平移到了这本分析伊拉克什叶派民兵组织“人民动员力量”的著作中，而她似乎也不屑于掩饰这一点。即使不谈我个人的对3.14派系的厌恶和唾弃，单从学术角度，这种美化乃至神话“国家”（state/dawleh）本身（只有黎巴嫩人会对“国家”有这么不切实际的幻想，毕竟人总是会将自己的幻想投射到从未拥有过的东西上）、对“国家垄断武力”的强调（尽管伊拉克官方的军警宪特机构也往往掌握在各个高层人物个人手里）、对伊朗影响力的单方面指责、以及过多单方面引用占领军官员、西方政府与安全机构的说辞，都损害了这本著作的可信度和参考价值。最重要的是，作者将“人民动员力量”的发展与崛起过度归咎于伊朗的地缘政治计划，并且在分析伊拉克什叶派政治生态时，近乎将对伊朗的态度视作了唯一的分析指标，猛烈地抨击她认为“亲伊朗”的派系，与此同时不遗余力洗白那些“与伊朗保持距离”的派系，从而忽略了伊拉克当地势力的利益诉求、主观能动性和与伊朗之间的复杂动态关系，将人民动员力量过度描绘成了完全服务于伊朗地缘政策的傀儡最后，作者用“真主党化”（Hezbollazation）来指代什叶派民兵组织建立社会基础与影响力的过程，这一点我已经无力吐槽了……这个作者是在装傻还是真傻？先不谈伊拉克和黎巴嫩在生产生活、人口构成、内部政治生态与地缘政治环境等层面有多大区别，最先搞“国中之国”式军阀-社群统治的难道不是巴希尔·杰马耶勒和他的“马龙斯坦”？最后，在描述伊拉克什叶派民兵事实教派仇杀与清洗，用黑社会手段掌控各地政治、经济与社会生态时，作者几乎没有拿出任何分析框架，单纯将什叶派民兵的形象描绘得十恶不赦，既没有将这些现象纳入一种值得信服的解释框架，也忽略了这些现象不过是贯穿伊拉克历史的逻辑在后萨达姆时代的一种碎片化的延续。简而言之，尽管读这本书算不上是在浪费时间，但我也无法给出一个比这高太多的评价。注：当年双尾彗星大力推荐过这本书，对此我不做任何评价。另外，双尾彗星讲真主党主要依托的是Aurelie Daher的《Hezbollah: Mobilization and Power》，这本我倒是相当推荐看。", "excerpt": "《民兵国度：人民动员力量的崛起与伊拉克民族国家的式微》书评：6/10，用黎巴嫩3.14的话术套伊拉克虽然本书作者巴里亚·阿拉穆丁（了解黎巴嫩历史的应该会很熟悉这个姓氏）在整理资料、梳理历史、派系、关键个人与势力变迁等方面下了很多功夫，但这不足以掩盖其立场、方法论与分析框架方面的严重缺陷。作者是个持反真主党立场的黎巴嫩人，这种身份标签促使她将黎巴嫩3.14派系用于攻击真主党的说辞和逻辑，近乎完全平移", "url": "https://www.zhihu.com/pin/2105979654855189944", "votes": 0, "comments": 0, "feed_ts": 1794987324, "feed_time_str": "11-18 15:35", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国古代华北平原为什么不能够像欧洲那样大规模采用马耕，这样不就能够解决马匹不足的问题了吗？", "excerpt": "日本满铁（南满洲铁道株式会社）在20世纪30—40年代开展的《中国农村惯行调查》 因为满铁经常有很红的倾向,这些调查水平很高,堪称华北 东北农村30-40年代的重点报告 我读本科的时候有幸在图书馆看到一卷 刚好里面有关于华北农村马耕的调查 在华北纯种植业小农经济中，土地细碎导致马匹畜力严重过剩，且马匹不反刍、高度依赖精饲料，会引发尖锐的“人畜争粮”。相比之下，驴、骡和黄牛在饲养成本、粗饲料耐受度和", "url": "https://www.zhihu.com/question/2072273961271009412/answer/2105986090830133047", "votes": 455, "comments": 89, "feed_ts": 1794987268, "feed_time_str": "11-18 15:34", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_COLLECT_ANSWER", "verb_cn": "收藏了回答", "title": "跟西方文明相比，中华文明有什么缺陷？", "excerpt": "1.科技长期停滞， 从5-13世纪几乎没有创造任何一项超前的科技和理论成果，直到15世纪以后才真正开始科技的高速发展。公元前的科技理论成就在5世纪以后大半丢失，有些甚至还要依靠阿拉伯人重新传入。2.社会等级森严，在一千年的时间里上层阶级仍然以世袭贵族为主，没有进化出考试选拔官员制度， 平民若想实现阶级跃迁，只能从事宗教行业，或参与战争获得军功，严重限制个人意志。广大农人则被束缚在土地上，承受着沉重", "url": "https://www.zhihu.com/question/609750049/answer/1940414842231055454", "votes": 3487, "comments": 629, "feed_ts": 1794987173, "feed_time_str": "11-18 15:32", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "作为政治哲学家的何塞·P·劳雷尔", "excerpt": "过去的观点是，何塞·P·劳雷尔和同时期其他与日本合作的菲律宾人差不多，是一个亲日的投机者。这种看法背后有一个默认前提，即菲律宾作为拉丁亚洲国家，亲西方是天经地义的，任何回到亚洲范围内的尝试都是异常现象。 我觉得这种观点忽视了两个特殊现象，第一点是，忽视了劳雷尔个人经验的特殊性。劳雷尔是当时东南亚各国领导人中少有的接受了完整法学和哲学训练的人，他博士毕业于耶鲁大学，同时又从小受到托马斯·阿奎那的经院", "url": "https://zhuanlan.zhihu.com/p/2105469514498548569", "votes": 22, "comments": 2, "feed_ts": 1794987015, "feed_time_str": "11-18 15:30", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价C罗母亲「葡萄牙输给丹麦是活该，我为此感到高兴」的逆天言论？", "excerpt": "看到这个言论，我第一个想法是：在整个阿伟罗家族里面没一个正常人。 或者时不时玩抽象罗哥才是最像正常人的那一个。 那些C罗球迷因为罗哥不 ER_QUESTION", "verb_cn": "回答了问题", "title": "同台亮相APEC，王传福谈新能源减排，雷军畅享AI未来，如何看待两位大佬的“殊途同归”？", "excerpt": "这次峰会现场见证比亚迪绿色科技，瞬间让我想起上一次去珠峰的一点感悟。 飞机掠过珠穆朗玛峰，缓缓向西藏日喀则定日机场进近，庞大的白色山体在飞机舷窗外给人以一种很强烈的压迫感，人在日常生活中很难有这样的机会去直观感知我们身处的这个星球。我们通常是生活在云层下面的渺小生物，只有偶尔会抬头看看云上的世界。 然而就是这一惊鸿一瞥，就让我们有所不同。 人，是目前已知唯一一种会考虑遥远未来的动物。 虽然数量很少", "url": "https://www.zhihu.com/question/2106096949791408536/answer/2106403845354026875", "votes": 118, "comments": 5, "feed_ts": 1794985812, "feed_time_str": "11-18 15:10", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "一直不明白朱元璋为什么要供奉元世祖忽必烈？", "excerpt": "民族主义是资本主义、铁路、报纸出现之后的新鲜产物。 古代由于天然的封闭性，只有宗族认同、乡土认同，以及君主皇帝认同。 而资本主义社会对工人识字率的最基础要求，加上铁路、报纸、印刷对文化的普遍传播， 让全国各地可以阅读同一种文字、同一个故事，在想象中构建出来一个“共同体”的概念，这就是民族。 所以说岳飞是不是民族英雄，都是强行扣帽子。岳飞就是忠于大宋王朝和皇帝而已。 甚至汉族这个概念，都是近代西方文", "url": "https://www.zhihu.com/question/652887377/answer/2106402201317004876", "votes": 20, "comments": 5, "feed_ts": 1794985420, "feed_time_str": "11-18 15:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "牛南佛", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "李彦宏APEC上直言AI的尴尬境地：铲子卖得再好，挖不出金子，最后谁都得停手。", "excerpt": "李彦宏APEC上直言AI的尴尬境地：铲子卖得再好，挖不出金子，最后谁都得停手。", "url": "https://www.zhihu.com/pin/2106397281146626746", "votes": 0, "comments": 0, "feed_ts": 1794984303, "feed_time_str": "11-18 14:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "思维链之父Jason Wei离开Meta，加盟200亿美元AI独角兽", "excerpt": "编辑｜Neo Meta 超级智能实验室，又有一位重量级研究员离开了。 这次是被称为 「思维链之父」的 Jason Wei。11 月 18 日， AI 创业公司 Mercor 联合创始人兼 CEO Brendan Foody 在 X 平台宣布，Jason Wei 正式加入 Mercor，担任首席科学家（Chief Scientist）。Jason Wei 随后也确认了这一消息。他表示，在 Meta ", "url": "https://zhuanlan.zhihu.com/p/2106397092553945194", "votes": 4, "comments": 0, "feed_ts": 1794984234, "feed_time_str": "11-18 14:43", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "夜静魂梦归", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了 奔南方歌名军，而当时在墨西哥护侨归国的海昕号在归国途中收到相关信息，舰长还召开全体水手会议讨论战舰去留，水手绝大多数投票赞成南下投奔孙文，舰长也就同意了，辛亥年间海军立场是非常进步的。民国初年，北洋海军一度因为经费的原因投奔袁氏，但是自从袁氏撑地闹剧以后，海军就和北洋陆军系矛盾很大，1917年护法运动期间，由于段祺瑞不承认民元国会和临时约法，海军南下广东宣布支持护法，而第二次护法战争期间，陈炯明和孙文矛盾激化，以至于发生内讧的时候，孙文最后也是逃上了黄埔岛附近的’永丰‘号炮舰临时避难的，彼时彼刻孙先生既没有钱，也没有多少军事力量，可以说此时海军对他的支持是超过现实利益的。民初混战期间，尤其是袁氏病故后，海军集团的base实际上是在厦门，偶尔在青岛，北洋军阀掌握的海军力量实际上是近乎完全重建的，如张作霖就一度很想重金收买海军战舰效忠自己，但是最后还是自己从头招揽人才，买了几条商船加上火炮撑门面，实际上由于理念、历史渊源等多方面原因，除非非常缺钱了，海军基本上是支持南方省份的。二战期间，海军在极为艰难的情况下筹措资金，安排技术军官去英国实习，实习归国的人员绝大多数在49年就留下了，以至于校长被迫启用桂永清这样一个陆军出身的人员担任海军司令，桂永清也是很不容易把撤到ww的海军系统大换血，才算重新恢复了对海军系统的控制。总的来说，黑邓世昌是非常离谱的事情，即使是正经果粉也知道，民初的海军大体上是kmt的盟友，只不过kmt实在是没钱养活其而已。", "excerpt": "如何看待邓世昌在知乎的风评急转直下？ - 知乎如何看待邓世昌在知乎的风评急转直下？知乎上贬损邓世昌的人实际上没有搞清楚一件事，那就是起源于福州船政学堂的北洋海军系和广东人为主的南洋海军系，在整个清末民初都是一贯支持歌名派和kmt的。自从北洋舰队在1896年重建后，海军内部实际上进步风气颇为浓厚，1905年前后，北洋海军的技术军官就在私下确定，为避免机器夹中辫子导致人员死伤，不反对轮机、损管相关岗位", "url": "https://www.zhihu.com/pin/2106069294610134783", "votes": 0, "comments": 54, "feed_ts": 1794967053, "feed_time_str": "11-18 09:57", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "英伟达三季度营收再超预期，同比增长103%，2028年指引将增长75%，好业绩有助于黄仁勋回归吗？", "excerpt": "算鸟算鸟，不要幻想鸟，虽然黄仁勋刚发了告知，说自己期待回归。但这次财报会，基本可以等同于英伟达董事会和新领导层，对黄仁勋的切割，甚至批判大会。 英伟达董事会主席哈维·琼斯宣布已经把黄仁勋回归的大门焊上了，不但说董事会不考虑让黄仁勋重返首席执行官职位。并且说英伟达董事会已聘请高管猎头公司海德思哲（Heidrick &amp; Struggles）负责CEO的遴选工作‌。 新升职的CFO也在财报会上宣", "url": "https://www.zhihu.com/question/2106285651171734750/answer/2106318980294108909", "votes": 148, "comments": 18, "feed_ts": 1794966716, "feed_time_str": "11-18 09:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看待现在的中学生过得极其压抑？", "excerpt": "昨天晚上我在外面吃饭，有一个爸爸带着一个穿着校服看起来读高中的女生坐在我隔壁桌，我听到他们在交谈，那个女生说她想通校，不想住宿舍了，因为他们宿舍里有一个女生总是晚上玩手机到很晚，而且声音很大，让她在宿舍睡不好觉，第二天总是很困很累。 她爸爸反问她那那个女生第二天怎么不困的？她说因为她不学习啊，她考倒数天天在教室里睡觉。 然后她爸说你和老师说啊让老师管管她啊，她说她不敢，怕被针对。 她爸依旧又反问那", "url": "https://www.zhihu.com/question/2032522453633779666/answer/21041211136473047   for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

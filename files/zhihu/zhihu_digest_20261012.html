就拥有了某种特权。简单说，就是 AI 能力已经高度集中在少数技术人群手里，大众感知和真实前沿之间的落差越来越大。他大致分了四层：约 60 亿人（全球人口约 75%）几乎没真正接触过 LLM。约 10-20 亿人（20% 左右）只用过免费版 ChatGPT 这类工具。他们看到的是经常犯傻、幻觉、答非所问的聊天机器人，觉得就是个更好的搜索引擎或写作助手，很多非技术人甚至觉得没什么用。约 2000 万人（0.2%）在专业领域（编程、数学、研究）用前沿级付费模型（如 Codex、Claude Code）。他们亲眼看到以前要花几周甚至几个月的大项目，现在一个提示就能让 agent 做完。大约 5000 人（0.00006%）能接触到公司内部最前沿的系统。他们看到的是成千上万个 agent 协作数周，完成软件大工程、挖漏洞、做网络攻防、发现新科学、推进数学前沿……这些事以前需要顶尖人类专家花数年才能完成。人类已经开始跟不上理解和审查的速度了。为什么会形成这种漏斗？问题的规模和野心不同：问一个小问题几乎用不到系统真正的能力；只有面对大、难、长期的专业问题，差距才会显现。能力是“参差不齐”的：AI 进步最快的是可验证、可奖励、又很赚钱的领域（代码、数学、科研），因为强化学习在这些领域最好用。日常聊天、写作、建议这类任务进步相对慢很多。访问权限分层：免费版 → 付费版 → 公司内部版，看到的完全不是一回事。总结一句话：普通人看到的是“有点傻的聊天机器人”，大部分专业人士看到的是“有点用”，而极少数能接触最前沿系统的人正在经历能力曲线垂直起飞的眩晕。这几拨人同时存在，所以对 AI 现状的看法会完全对不上。", "excerpt": "Andrej Karpathy提到的AI认知差距虽然这都是车轱辘话，但我觉得 Karpathy 最强的一点，就是他了解几乎所有 AI 顶尖大厂的详细细节。他提到有多少人能够接触到公司内部最前沿的系统，这个数字就是可信的。可以看到，整个人类也就几千号人能接触到最顶级的系统，其实这几千个人就拥有了某种特权。简单说，就是 AI 能力已经高度集中在少数技术人群手里，大众感知和真实前沿之间的落差越来越大。他", "url": "https://www.zhihu.com/pin/2092837665385330002", "votes": 0, "comments": 1, "feed_ts": 1791752139, "feed_time_str": "10-12 04:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中文在线称，中国55%的token消耗指向AI短剧，如何看待这一现象？", "excerpt": "我来分享一个案例。 我上半年接了一个项目，是给英国的 NHS 做行业培训视频，是用 AI 视频来做的。至于为什么用 AI 视频，本质上是因为它足够便宜。在英国用人成本太高了，那点经费如果找真人来拍，远远做不完。 我一共做了将近 6 个小时（不到 6 个小时）的视频，总成本大概在 4 到 5 万人民币左右。这笔钱主要花在两个视频生成模型上：一个是快手可灵（Kling），一个是字节即梦（Jimeng）", "url": "https://www.zhihu.com/question/2092571772189153120/answer/2092831822090613386", "votes": 18, "comments": 0, "feed_ts": 1791749989, "feed_time_str": "10-12 04:19", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "古代没有洗洁精，满锅油污古人到底怎么洗？从古代到近现代，食用油不可能变成油污。农村人家常吃饭，从来不讲究菜品多，一般讲究量，这做菜的顺序，就是先炒肥肉，把油爆出来，多的油捞起，作为食用油储存起来。以前的饭馆里有个大桶，里面装着的叫做合汤，合汤是啥东西？其实就是洗锅水。这一套流程十分高效，对于食物的利用率极高，根本就不会产生废物，每一滴油都进了各色人等的肚子里。物尽其用，是基本原则，因此，古代人不思考油污这个问题，就古代食用油的产量，这不是问题。古代没有洗洁精，满锅油污古人到底怎么洗？ #食用油如何存储 #食用油储存罐 #废弃食用油 ", "e ，修机场，不行这玩儿法天王老子来了也撇嘴", "url": "https://www.zhihu.com/question/320610750/answer/2372704378", "votes": 2011, "comments": 118, "feed_ts": 1791741895, "feed_time_str": "10-12 02:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价大胃袋良子？", "excerpt": "天葬台的兀鹫：“今天来了个胖子，我咬一口跟蜜桃儿似的”。", "url": "https://www.zhihu.com/question/7272414588/answer/2092385565278844780", "votes": 21, "comments": 3, "feed_ts": 1791741890, "feed_time_str": "10-12 02:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "为什么大家都喜欢自驾游，是因为自驾游省钱吗？旅游的目的是什么？这里面有个小孩儿的视角，我家小孩儿对于我们规划的旅游目的地根本就不感兴趣，我们去的名川大山，壮丽峡谷数不胜数，但是我家小孩儿只在乎有没有小朋友和她一起玩儿。自驾游有个特点，那就是漫长的旅途，会经过无数的城市，许多的村庄，小镇；这些地方可能平平无奇，甚至规划单一，有些脏乱，用旅游的价值观来说，就是没有旅游的价值，但这是成年人的观点，小孩儿可不一定。我记得有一年途经广西，那时还没有现在这么好的导航，结果就走错了路，在这条错误的道路上，我们看见了路边种草莓的棚子；老板的女儿和我家小孩儿的年纪相仿，又喂了土狗，很快就玩耍在一起，我们大人坐在一起喝茶，小孩儿和狗在田埂上跑来跑去，不知不觉，一个下午就过去了；另有一次，我们去海南旅游，道听途说，有人吹嘘走穿过一条乡道，海边有个椰子岛，岛上有猴子，后来小孩儿们还带着我们去附近的海滩玩，挖螃蟹，捡贝壳，掏沙子，非常愉快的一天，以至于过去了很久，女儿还念念不忘她在海南结交的新朋友，一颗很大的海螺贝壳，这可比天涯海角有意思多了。我们成年人眼中的旅游胜地，在孩子们看来，一钱不值，但不如一个偏僻的渔村，一辆坏在路中间的农用车，一家善良的人，在宁静中享受海景和风土人情；我们成年人的旅游功利性太强了，不达目的誓不罢休，其实，旅途本身是不是一样有意义？时间不重要，没看完的风景不重要，重要的是这份愉悦和放松，这一刻毫不在乎名与利。自驾游，对于我来说，旅途中的故事，突然间的偶遇，鸡毛蒜皮淡如水的交谈，更容易得到，这是我们一家人的旅游，这才是旅游。为什么大家都喜欢自驾游，是因为自驾游省钱吗？ #这才是自驾游该有的样子 #自驾郊游 #自驾xiz ", "excerpt": "为什么大家都喜欢自驾游，是因为自驾游省钱吗？旅游的目的是什么？这里面有个小孩儿的视角，我家小孩儿对于我们规划的旅游目的地根本就不感兴趣，我们去的名川大山，壮丽峡谷数不胜数，但是我家小孩儿只在乎有没有小朋友和她一起玩儿。自驾游有个特点，那就是漫长的旅途，会经过无数的城市，许多的村庄，小镇；这些地方可能平平无奇，甚至规划单一，有些脏乱，用旅游的价值观来说，就是没有旅游的价值，但这是成年人的观点，小孩儿", "url": "https://www.zhihu.com/pin/2092794066626933551", "votes": 0, "comments": 0, "feed_ts": 1791741045, "feed_time_str": "10-12 01:50", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么大家都喜欢自驾游，是因为自驾游省钱吗？", "excerpt": "我写一下自己的感受，不代表任何人。 旅游的目的是什么？ 这里面有个小孩儿的视角。 我家小孩儿对于我们规划的旅游目的地根本就不感兴趣。 那些美丽到无与伦比的风景，小孩儿可能一点感觉都没有。 我们去的名川大山，壮丽峡谷数不胜数， 把自己给折腾没了。 没人跟他竞争，咸丰皇帝就一个儿子，死了。光绪，是咸丰弟弟的儿子，是慈溪妹妹的儿子，是慈溪从他4岁抱养养大的。血缘关系与慈溪、咸丰最近，亲情方面慈溪从小养到大的，唯一。没人跟光绪竞争。他的皇位，稳如老狗。 慈禧不是司马昭，慈禧不是曹操，慈禧也不是朱温", "url": "https://www.zhihu.com/question/297151639/answer/2092204004327567940", "votes": 1065, "comments": 341, "feed_ts": 1791733134, "feed_time_str": "10-11 23:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "苏联不是代表人民吗，为什么会被人民推翻？", "excerpt": "阅前须知 本文包含大量历史战争暴行，反人类犯罪，政治野心 内容相对压抑沉重 心理承受能力弱的人，请勿观看 阅读期间若感到不适，请停止阅读 故事开始，全文近万字 文中并未掺杂过多本人感受与主观判断，主要客观陈述历史事件 部分事件过于冷门，在简中互联网没有记录，我会附上参考资料与截图，总参考资料列在文末 好，叠甲完毕 故事开始 大家都听说过当年波罗的海三国人民之路吧200多万人民组织起来，手拉手去反对", "url": "https://www.zhihu.com/question/2084655149449068624/answer/2092733431910232930", "votes": 488, "comments": 39, "feed_ts": 1791732784, "feed_time_str": "10-11 23:33", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "美式自由的一体两面嘛这其实是好事儿 美国人的经济议题是高度政治化的。大多数人往往忽略了一个极为关键的事实：美国存在一种独特的“小生产特色”传统，它既不同于欧洲的社会主义，也不同于古典自由主义，而是深深植根于生产者主义与基督教希望主义这两种精神资源的交织之中。 这种传统不仅塑造了19世纪美国轰轰烈烈的民粹主义运动、黑人民权斗争、北方自由土地运动、重建运动，以及后来的进步主义改革时代，也在20世纪的国家权力扩张与福利国家技术治理中逐渐瓦解，最终在左右两翼分别演化为怀旧主义与技术治理的碎片。美式小生产传统最鲜明的特征，是把政治自由置于经济自由之前，但同时坚持经济自由是政治自由的必要条件。这与欧洲传统不同：欧洲左派往往更强调经济平等与集体解放，欧洲右派则更强调秩序与权威；而美国的小生产传统则始终围绕一个核心信念——一个人若没有自己的土地、店铺、工具，若必须依赖雇主或银行才能生存，他就不可能是真正自由的公民。这种信念直接来源于两个传统：其一是生产者主义，即认为真正有价值的社会成员是那些用自己的劳动创造财富的人——农民、工匠、小店主、独立职业者；其二是基督教希望主义，即相信现实虽然充满苦难与不公，但未来终将实现正义，而正义的核心，正是“自我掌握自己的命运”。这两者结合，产生了一种独特的“有机上升的愿景”：人们愿意忍受当下的艰辛，因为他们相信通过劳动、节俭、自律，自己和后代终将获得独立与尊严。19世纪美国所谓看起来左派的小资产阶级和无产阶级的运动有一个共同特征：它们追求的是个人的经济自由与独立，而不是集体的国家控制；它们反对的是垄断与特权，而不是市场本身。 许多人无法理解，为什么这些看似“左”的运动，却与基督教文化紧密相连。原因就在于：基督教提供了一个“原罪—救赎”的叙事结构——现实中的艰难是惩罚，但未来一定能变得更好；而“更好”的定义，不是天堂里的永恒幸福，而是现实中的自我掌握、独立自主、不再受制于人。这正是基督教伦理在美国小生产传统中的世俗化表达。然而，20世纪的现实无情地摧毁了这套小生产理想。罗斯福虽然本人对小生产者怀有深厚同情，并为此投入了巨大政治资源，但新政的实际逻辑却不可避免地走向了国家权力扩张与技术治理。因为小生产体系在工业化、城市化、大公司崛起的冲击下已经无法维持。于是，从60年代到80年代，福利国家、技术官僚、国家干预一层又一层地扩张，小生产传统被逐步边缘化。自由派逐渐放弃了生产者主义，转向分配政治、身份政治、专业精英治理；右派则借用了小生产传统的语言——生产者对抗寄生虫——却把它扭曲成怨恨动员、排外主义、文化战争。结果是左翼只剩下技术治理，失去了道德决断；基督教伦理中的——好人有好报、坏人有坏报——被右翼怨恨化，变成了对“敌人”的报复想象。人们怀念一个想象中的自由市场、小企业、基督教天堂。这种怀旧本身，其实是好事——因为它可以凝聚共识、创造利益，提供一种“有机上升的愿景”。自由市场和小企业的想象，带着左派和右派现实中都无法完全实现的基督教伦理：独立、自主、劳动尊严、未来正义。如果连这种怀旧的理想主义都没有了，那美国真是要完蛋了。因为一旦人们不再相信任何超越性的愿景，不再相信劳动能带来独立，不再相信未来会更好，政治就只剩下技术管理与怨恨动员，社会就只剩下消费成瘾与文化绝望。", "excerpt": "美式自由的一体两面嘛这其实是好事儿 美国人的经济议题是高度政治化的。大多数人往往忽略了一个极为关键的事实：美国存在一种独特的“小生产特色”传统，它既不同于欧洲的社会主义，也不同于古典自由主义，而是深深植根于生产者主义与基督教希望主义这两种精神资源的交织之中。 这种传统不仅塑造了19世纪美国轰轰烈烈的民粹主义运动、黑人民权斗争、北方自由土地运动、重建运动，以及后来的进步主义改革时代，也在20世纪的国", "url": "https://www.zhihu.com/pin/2092659757781992591", "votes": 0, "comments": 4, "feed_ts": 1791732500, "feed_time_str": "10-11 23:28", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "有一说一，在英美混的索马里黑帮，大概率是索马里兰人，有不小概率是虽然名义上是索马里兰但在SSC三省地区，因此心向摩加迪沙（索马里中央）。所以「索马里黑帮」的国家认同应该挺复杂的。更进一步地，据我所知，心向索马里兰的，和心向摩加迪沙的黑帮成员，也有可以完全关系融洽的，所以这里面的门道更复杂了", "excerpt": "有一说一，在英美混的索马里黑帮，大概率是索马里兰人，有不小概率是虽然名义上是索马里兰但在SSC三省地区，因此心向摩加迪沙（索马里中央）。所以「索马里黑帮」的国家认同应该挺复杂的。更进一步地，据我所知，心向索马里兰的，和心向摩加迪沙的黑帮成员，也有可以完全关系融洽的，所以这里面的门道更复杂了", "url": "https://www.zhihu.com/pin/2092673867957510742", "votes": 0, "comments": 0, "feed_ts": 1791732491, "feed_time_str": "10-11 23:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "一名斯里兰卡外劳因Facebook帖文被判死刑，这暴露了沙特司法体系的哪些结构性问题？", "excerpt": "对外籍劳工？只是对外籍劳工吗？你是不是忘了有个叫卡舒吉的人是什么下场？", "url": "https://www.zhihu.com/question/2092041183547732613/answer/2092408023486558970", "votes": 62, "comments": 0, "feed_ts": 1791732415, "feed_time_str": "10-11 23:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "陪审团制度适不适合中国大陆？", "excerpt": "我其实一直好奇为什么中文互联网上很少讲陪审员经历的故事。被抓去当陪审员是随机事件，怎么着也会有几个华人被抓去，然后用中文普及这个经历。 直到后来我听朋友P讲了一个故事。 P是耶鲁MBA，他老婆H是耶鲁本科ABC，KMT背景，背景既“蓝”又“蓝血”那种。H被抓去当陪审员。 美国在开庭前有个流程，两方律师问候选人一些问题。假如候选人表现得有严重 l专测对错误建议的抵抗力\n图文版：链接XYEval如何构造受控的误导建议Google DeepMind 的 XYEval 保留原始任务、环境和判分器，再把一两句看似合理但方向错误的建议追加到原指令。生成器可读取任务、标准解和验证信息，因此改写前后的差异测的是在受控注入下是否跟随错误建议，不是现实用户对话中的失误率。Terminal-Bench中Gemi", "url": "https://www.zhihu.com/pin/2092733475573052405", "votes": 0, "comments": 0, "feed_ts": 1791726753, "feed_time_str": "10-11 21:52", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Synthetic Hospital：把教材病例做成可验证纵向EHR，十款模型无一接近满分\n图文版：链接公开医学教材合成1268名患者病历真实电子病历受隐私与伦理限制无法公开共享，且仅记录已书写文本而非完整病情。卡内基梅隆大学（CMU）推出 Synthetic Hospital 基准，完全基于公开医学教材构建纵向电子病历，生成 1,268 名患者与 5,602 次就诊记录。所有诊断、临床发现与时序关系均映射至 ICD-10-CM、SNOMED CT 和 LOINC 知识图谱，标签在病历文本生成前确定，保证客观基准脱钩于生成模型。双盲真实性测试医生判别率为53%针对合成数据真实性，10 名执业医生在未知来源下对 5 份合成病历与 5 份标准化转写的真实 MIMIC-IV 病历进行 100 次盲测判别，整体辨别准确率仅为 53%（95% 置信区间 43%–63%），与随机猜测无显著差异。转写仅对排版与缩写进行规范化统一，未篡改真实病历临床细节，排除了医生仅凭格式识别的可能性。公开切分最高严重度加权F1为0.732在公开切分的 200 例纵向诊断中，锁定思维链提示后，Kimi 2.5-thinking 的严重度加权 F1 为 0.732 居首，GPT 5.3 为 0.703，27B 的 Gemma 3 仅为 0.287；五项任务综合均值名次以 GPT 5.3 的 2.40 最优。各模型在证据检索上的 P@5 均超 0.74，但在整份病历摘要上的发现级 F1 最好仅为 Opus 4.6 的 0.550，显示前沿模型在复杂病程长文本中仍会遗漏约一半临床关键发现。医生参照子集局限与罕见病程边界表 3 提供的医生基准（均值 0.664，区间 0.21–0.89）源自七名医生在 13 名患者子集上的测试，与模型测试集并非同一批病历，不可简单宣称模型已达到医生整体水平。此外，尽管改用 GPT 5.3 重写叙述验证了评测指标具备文本渲染鲁棒性，但基准基于教材案例构建，更偏向典型教学病例，对现实临床中罕见、复合与不典型病程的泛化能力仍待验证。原文标题：Synthetic Hospital: An Open, Verifiable, Physician-Validated Longitudinal EHR Benchmark#无影寺 ", "excerpt": "Synthetic Hospital：把教材病例做成可验证纵向EHR，十款模型无一接近满分\n图文版：链接公开医学教材合成1268名患者病历真实电子病历受隐私与伦理限制无法公开共享，且仅记录已书写文本而非完整病情。卡内基梅隆大学（CMU）推出 Synthetic Hospital 基准，完全基于公开医学教材构建纵向电子病历，生成 1,268 名患者与 5,602 次就诊记录。所有诊断、临床发现与时序", "url": "https://www.zhihu.com/pin/2092733060303302885", "votes": 0, "comments": 0, "feed_ts": 1791726532, "feed_time_str": "10-11 21:48", "category": "pin", "cat_name": "想法动态"}, {"actor": "DefTruth", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "因AI写的代码比我又快又强，本账户由机器猫莫卡努接管", "excerpt": "因AI写的代码比我又快又强，本账户由机器猫莫卡努接管", "url": "https://www.zhihu.com/pin/2091886907881939107", "votes": 0, "comments": 1, "feed_ts": 1791726479, "feed_time_str": "10-11 21:47", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Taste-Bench：把长程Agent的“品味”拆成一道道决策分叉来测\n图文版：链接Taste-Bench怎样把长程判断变成评测题Taste-Bench 从工程和研究轨迹中挖出决策分叉，隐藏分叉后的工作，让模型只按当时可见的任务、轨迹前缀和两条候选选择方向。每题交换一次候选顺序，只有两种顺序都答对才计为正确。502 题中最强的 GPT-5.6 Sol 平均为 59.7%；决定性证据需更多后续工作才出现的题，14 个模型平均为 21.0%。教师的后见之明怎样蒸馏给学生教师和学生使用同一冻结 Qwen3.6-27B 基座，学生只更新 LoRA adapter。教师 context 额外含过去同一任务在该分叉处的成功/失败选择，学生只见分叉前内容；训练将教师推理和最终选择蒸馏进学生权重。390 道工程题按源任务分成两个不相交折，学生在另一折评测。390道留出工程题的判断提升留出评测里，学生双顺序准确率为 47.9%，基座为 30.0%；两种候选顺序的平均准确率从 42.7% 升至 62.4%。训练折单顺序从 48.6% 到 92.9% 不能作为泛化证据，因为同一折的任务已经进入训练。41道SWE-bench Pro任务的执行结果固定 SWE-agent 1.1.0 加 Qwen3.6-27B 执行器在 41 道留出任务上，无建议成功率为 14.6%，学生建议为 33.7%，每个分叉都给正确建议时为 39.0%。建议来自这些任务的先前运行并在新运行前写入 context；论文没有证明它能为从未有过轨迹的新任务提供同等质量建议。原文标题：The Tasteful Agent: Measuring and Improving Taste in Long-Horizon Tasks#无影寺 ", "excerpt": "Taste-Bench：把长程Agent的“品味”拆成一道道决策分叉来测\n图文版：链接Taste-Bench怎样把长程判断变成评测题Taste-Bench 从工程和研究轨迹中挖出决策分叉，隐藏分叉后的工作，让模型只按当时可见的任务、轨迹前缀和两条候选选择方向。每题交换一次候选顺序，只有两种顺序都答对才计为正确。502 题中最强的 GPT-5.6 Sol 平均为 59.7%；决定性证据需更多后续工作", "url": "https://www.zhihu.com/pin/2092732607284901842", "votes": 0, "comments": 0, "feed_ts": 1791726431, "feed_time_str": "10-11 21:47", "category": "pin", "cat_name": "想法动态"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待25位菲奖得主发布联合声明《AI在数学领域的严重错位》？是否意味着传统数学研究模式的崩溃？", "excerpt": "如果传统模式指的是关起门来靠个体或者小作坊手推公式，靠攻克某个著名难题换取终身教职和学术声望，这套玩法确实已经出现了不可逆的裂痕。 但是如果说人类对数学真理的理解和探索要终结了，那完全是误读。 先纠正一个时间线上的广泛误解。很多人以为是10月6日某商业公司突然放出了几百篇数学论文，25位菲尔兹奖得主才坐不住出来联署抗议。事实完全相反。 这份名为人工智能与数学研究的严重目标错位（A Severe M", "url": "https://www.zhihu.com/question/2082049593588634390/answer/2092723615657636699", "votes": 8, "comments": 2, "feed_ts": 1791724191, "feed_time_str": "10-11 21:09", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "v ：以前的数学首先是一个爱好，然后才是一个学科，或者说首先是一个爱好，才是一份工作；而现在的数学围绕着整个领域里的各种未解之谜，可以理解为它首先是一份工作，然后才是一个爱好。这也是为什么像陶哲轩这样的大数学家，都会站出来说一些搞得好像莫名其妙的话。说白了，一个人的饭碗受到影响，作为利益相关方，情绪波动自然会极大。当然他说的也没问题：现在的数学已经从证明稀缺性（proof scarcity），变成了怎样更多地去理解数学带来的变化。他用药品来举例，很多药的确可以用 AI 来加速研发，但注入人体后会发生什么变化，谁也不知道。但也有人提出了反例，我觉得挺有道理：很多药确实根本不知道原理，只要 work 就行了。只要能通过临床检验，大多数人没有不良反应或者反应可控，那就 OK。如果非要等到所有东西都搞得清清楚楚、明明白白，人可能都死了。", "excerpt": "陶哲轩关于数学2.0时代的看法刚刚看到推特上有人讨论陶哲轩做的一个关于“数学 2.0 时代”的分享。源文件： 链接其实本质上，我觉得这里面一个根本的分歧就在于：以前的数学首先是一个爱好，然后才是一个学科，或者说首先是一个爱好，才是一份工作；而现在的数学围绕着整个领域里的各种未解之谜，可以理解为它首先是一份工作，然后才是一个爱好。这也是为什么像陶哲轩这样的大数学家，都会站出来说一些搞得好像莫名其妙的", "url": "https://www.zhihu.com/pin/2092673246189577904", "votes": 0, "comments": 0, "feed_ts": 1791712403, "feed_time_str": "10-11 17:53", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "怎么看待2026年10月12日A股市场行情？", "excerpt": "明天市场又要开盘了。 先跟大家简单盘一下市场发生的事好了，其实整体来说，还是利好的， 第一个是柴油这块，美国正式临时放开了俄罗斯柴油进口，相当于直接给油价缓了一大口气。 放开到2027年4月，接下来俩月差不多能多供应180万吨柴油，这样以来，短期内油价给到的通胀压力起码能缓解一下。 但这里也有一个疑问点，理论上俄罗斯自己的炼油厂工作起来也不顺畅了，还怎么给到出口。 不过当作利好消息压制油价预期还是", "url": "https://www.zhihu.com/question/2091917341986657362/answer/2092674003693577138", "votes": 75, "comments": 17, "feed_ts": 1791712363, "feed_time_str": "10-11 17:52", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "10.11 市场真出利好了", "excerpt": "明天市场又要开盘了。 先跟大家简单盘一下市场发生的事好了，其实整体来说，还是利好的， 第一个是柴油这块，美国正式临时放开了俄罗斯柴油进口，相当于直接给油价缓了一大口气。 放开到2027年4月，接下来俩月差不多能多供应180万吨柴油，这样以来，短期内油价给到的通胀压力起码能缓解一下。 但这里也有一个疑问点，理论上俄罗斯自己的炼油厂工作起来也不顺畅了，还怎么给到出口。 不过当作利好消息压制油价预期还是", "url": "https://zhuanlan.zhihu.com/p/2092658952727282357", "votes": 136, "comments": 18, "feed_ts": 1791712281, "feed_time_str": "10-11 17:51", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "看完缅北电诈覆灭纪实纪录片，最让你感慨的是什么？", "excerpt": "最大的感慨是：太文明了。 调用10万警察、抓捕2万名罪犯、50TB数字材料、明家一家就2吨文字材料、18万字的宣判书，前后历时数年。 这地球上除了中国 : "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "论文Idea生成器刚刚在 Twitter 上看到一个推文，关注的人还不是很多，介绍了他们刚发表的一篇论文，简单理解就是一个 idea 生成器。其实这个东西我之前让 AI 做自动科研的时候也尝试过。当时为了找高质量的 idea，主要是从顶会论文最后一部分的 future work 里去提取现成想法。因为相比让 AI 自己凭空生成，这种做法的幻觉要低很多，起码是原作者指出的可改进方向；虽然大都是 incremental 的改动，但可行度相对更高。而这篇论文的做法是：发现问题之后不是直接解，而是去交叉领域寻找方法或可行解，然后再去生成。短短时间就生成了 200 多万个 idea。不过他们倒是做过验证。论文提到实验数据截止到 2026 年 1 月 1 号，以那之后新发表的论文作为对照组，确实命中了挺多。我觉得这肯定能命中，在这种设定下就相当于做超级复杂的排列组合。人类研究很多时候不也是排列组合吗？除非真的是颠覆性的新范式，但那又谈何容易。但我总觉得，这种 idea 生成器最终还是得真正把论文写出来、被顶会接收，甚至取得不错的 citation 才算闭环。仅仅停留在生成论文 idea，味道总感觉不够。", "excerpt": "论文Idea生成器刚刚在 Twitter 上看到一个推文，关注的人还不是很多，介绍了他们刚发表的一篇论文，简单理解就是一个 idea 生成器。其实这个东西我之前让 AI 做自动科研的时候也尝试过。当时为了找高质量的 idea，主要是从顶会论文最后一部分的 future work 里去提取现成想法。因为相比让 AI 自己凭空生成，这种做法的幻觉要低很多，起码是原作者指出的可改进方向；虽然大都是 in", "url": "https://www.zhihu.com/pin/2092665535808983611", "votes": 0, "comments": 4, "feed_ts": 1791710565, "feed_time_str": "10-11 17:22", "category": "pin", "cat_name": "想法动态"}, {"actor": "平凡", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "超级智能时代：将模型视作“内部安全风险”（Insider Risks）", "excerpt": "萨提亚·纳德拉（Satya Nadella） 原文：https://http://x.com/satyanadella/status/2108931348857827686?s=20过去几十年里，随着传统软件系统在整个经济体系中全面普及，我们拥有成熟的工具和方法，能将软件的任何行为精确追溯到某一行具体的代码执行路径上。 但在今天的“超级智能”（Super Intelligence）系统中，这种机理", "url": "https://zhuanlan.zhihu.com/p/2092662439401743615", "votes": 1, "comments": 0, "feed_ts": 1791709710, "feed_time_str": "10-11 17:08", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "韩国宣布将召回驻乌克兰大使，如果乌克兰仍拒绝道歉，韩国会不会进一步降级双边关系？", "excerpt": "乌克兰现在是全球蓝色托派的总指挥部，蓝色托派的核心思想就是知乎的“马歇尔宇宙”，“美国武装解放苏东宇宙”，突出一个将全世界人民当作耗材，整个资本主义世界就是一座大兵营，不惜一切代价地一直圣战到荡平寰宇，蓝旗插满世界。在圣战之外的一切军事、外交、乃至经济和内政问题都是不重要的，都是可以牺牲的代价。 乌克兰人产生这样的思想，本身无可厚非，因为乌克兰现在的确是个大兵营，整个国家只剩下战争，在人力和物质…", "url": "https://www.zhihu.com/question/2091682198160258518/answer/2092662166834909991", "votes": 665, "comments": 68, "feed_ts": 1791709540, "feed_time_str": "10-11 17:05", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "旷野", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待给大模型投毒被字节索赔800 万的前实习生开启创业，已获近三千万美元融资？你看好其创业前景吗？", "excerpt": "什么金子在哪里都会发光？怕不是别人的血汗在发光吧。发不发光的无所谓，问题是这块金子当年发光靠的是什么，是把一群同事按在地上摩擦，让人家一个季度的活都打水漂，自己腾出卡来写那篇后来拿奖的论文。现在他西装一穿融资一到，仿佛这是什么天才少年打破规则才能成功的情节。那当年被他搞的那近30号人，这会儿看着这热搜，心里是什么滋味？ 论文是足够硬的，VAR把自回归图像生成的FID从18.65干到1.73，推理快", "url": "https://www.zhihu.com/question/2092306646621844796/answer/2092660416765769223", "votes": 112, "comments": 9, "feed_ts": 1791709123, "feed_time_str": "10-11 16:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "只有我很讨厌“经济上行期的美”这个词吗?", "excerpt": "只能说风水轮流转，当初目田嘲讽我们网左“为什么有人想要回到上世纪六十年代”的时候是如何义愤填膺，认为全都是想当工贵的。到属于你们的否定性想象环节，一旦有人指出无产阶级当时的境遇，就开始使用各种巧言令色的文字夸张地描述“the feeling I get from you”了（怀念的只是一种感觉），也不知道这和网左为自己辩护说的“我们只是怀念那时候的精神”有何区别？ 言归正传，这个问题显然应该被拉去", "url": "https://www.zhihu.com/question/1979345717194676168/answer/2092302595771650096", "votes": 442, "comments": 15, "feed_ts": 1791707703, "feed_time_str": "10-11 16:35", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "旷野", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "OpenAI对整数乘法、矩阵乘法、FFT的改进有什么重要/意义？", "excerpt": "题主的话具体点来说是 OpenAI 把整数乘法和 FFT 压到 n log n 以下，矩阵乘法干到 9/4这三个结果其实对我们的实际影响是零，毫无争议的零。 但它们动了人类对计算极限的认知，是这个层面的重要。三者重要程度也差得很远。矩阵乘法 9/4 那篇是真炸弹。整数乘法和 FFT 那两篇就小很多了，只是证明了 n log n 这堵墙是有漏洞的。 整数乘法这篇的主张是说在固定字母表，固定带数的多带", "url": "https://www.zhihu.com/question/2091622789333644754/answer/2092651538120496997", "votes": 16, "comments": 0, "feed_ts": 1791707006, "feed_time_str": "10-11 16:23", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "母亲生下了孩子使得孩子永久性处于对母亲的道德亏欠，这种亏欠剥削起来是没有止境的，因为母性暴力不存在父系暴力简单易懂的比拳头大小，打赢爹就可以“弑父”摆脱。拳头大小的比较终有一天是壮年的孩子胜过老年的父亲，但道德的亏欠只会随着生育恩情的岁月积攒而利滚利驴打滚，一辈子还不完。", "excerpt": "母亲生下了孩子使得孩子永久性处于对母亲的道德亏欠，这种亏欠剥削起来是没有止境的，因为母性暴力不存在父系暴力简单易懂的比拳头大小，打赢爹就可以“弑父”摆脱。拳头 来倒推出生人口，推来推去，推出来一个19", "url": "https://www.zhihu.com/question/2078974109887869329/answer/2092371075476764189", "votes": 454, "comments": 36, "feed_ts": 1791704696, "feed_time_str": "10-11 15:44", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "刹车的刹，谋杀的杀", "excerpt": "车能载人，也能杀人。人命既悬于车，车必须令行禁止。 所以古代车夫，今世司机，都要命。 春秋时宋郑交战，宋将华元让全军吃羊肉，不给车夫吃，车夫不高兴了；开战时，车夫对花苑说：之前的羊肉，你说了算；今天的事，我说了算。 驾着车就冲进郑军阵营，华元被活捉。这事还出了一成语，“各自为政”。 几百年后，陈胜吴广“王侯将相宁有种乎”，何等风光。半年之后，陈胜的车夫把他给杀了。陈胜试图下克上，“王侯将相宁有种乎", "url": "https://zhuanlan.zhihu.com/p/2092629907104854989", "votes": 159, "comments": 0, "feed_ts": 1791704245, "feed_time_str": "10-11 15:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "哈哈，我就知道[开心] 这不比韩国右翼的通三统刺激多了？", "excerpt": "哈哈，我就知道[开心] 这不比韩国右翼的通三统刺激多了？", "url": "https://www.zhihu.com/pin/2092636084895328172", "votes": 0, "comments": 27, "feed_ts": 1791704080, "feed_time_str": "10-11 15:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BBuf", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "8 卡 H20 上的 DeepSeek-V4.1 优化实录：512K 首字加速 12.7 倍", "excerpt": "8 卡 H20 上的 DeepSeek-V4.1 优化实录：512K 首字加速 12.7 倍结论先说结论，这两天在 8 卡 H20-3e 上把 DeepSeek-V4.1-Flash 优化了一轮。与原版 SGLang v0.5.21 相比，长输入的 prefill 提升很明显，多并发下的生成吞吐也有了比较大的改善。 指标原版 SGLang v0.5.21优化后变化128K 冷输入首字35.326 ", "url": "https://zhuanlan.zhihu.com/p/2091195037786888123", "votes": 34, "comments": 3, "feed_ts": 1791703021, "feed_time_str": "10-11 15:17", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "作者置顶评论今天写这个内容，也是因为这段时间欧洲那边的问题跳得比老美都欢。本身我对欧盟包括对法国的了解其实不深，只能通过一些公开数据和一些比较大众的历史文献资料来看，搭了这么个大致的框架。接下来呢，应该也会借着这个框架再看看欧盟的其他几个国家。反正这一轮欧债危机爆发的是欧盟的核心台面和支柱——英国、法国、德国。当然英国现在脱欧了嘛，但也作为欧洲地区较为有影响力的一个支柱，也合进来说一下。总之，问题可一点儿都不小。比起当年的希腊债务这些，这次的问题就更核心了。当然了，有人会对我中间的一些数据说法抱有疑问，比如法国的失业率问题。很多人会拿国内的失业去对比，说国内灵活就业的多什么的。实际上灵活就业它也是就业，灵活就业只是性质，它本质也是就业。和老美算非农就业一样，本质上我们这边还要相对地要脸一点——老美那边可是打几份工就算几个就业的。国内的话，我们这种拓三产服务业或者说灵活就业，实际上也算是咱们国家要脸，好歹把就业性质标了一下，反过来也说明国家也不觉得这种就业形式算是特别安居乐业的情况。而回到法国这一块，有人总说法国是革命老区，民众乐于上街，上街是人家的传统。是屁话。社会要是没有足够的干柴，鬼才上街呢？没事儿做了？就是因为没事儿做，吃不饱饿不死，没上升通道，然后呢，一肚子怨气，这才有频繁上街的情况。就如同国内也不是没经历过那些特殊时段，但凡是经济高速增长、就业高涨的时候，哪儿来那么多乱七八糟问题？而一个火星子就能蹦出蔓延全国的动荡，那本质就是我文中说的治理失败——这个社会已经堆积了太多的干柴。今天呢，法国这边儿算是粗浅地说了，确实粗浅，很多资料都是基于一些公开资料，然后我自己对这一块的理解大致梳理了一个框架。实际上我还是要说，我对法国的一些具体的政治上的细节、产业链特别细化的地方还是不太熟悉的。后面如果有需要的话，可能看开不开个系列系统地来学一学、写一写。当然，下一次的话应该就写这一次的其他几个核心国家。要说法国正在债台高筑，那英国佬估摸着算是不对，期货死人都算不上，棺材板板儿已经可以开始数钉子了。就看下一篇，要不就写英国吧。", "excerpt": "作者置顶评论今天写这个内容，也是因为这段时间欧洲那边的问题跳得比老美都欢。本身我对欧盟包括对法国的了解其实不深，只能通过一些公开数据和一些比较大众的历史文献资料来看，搭了这么个大致的框架。接下来呢，应该也会借着这个框架再看看欧盟的其他几个国家。反正这一轮欧债危机爆发的是欧盟的核心台面和支柱——英国、法国、德国。当然英国现在脱欧了嘛，但也作为欧洲地区较为有影响力的一个支柱，也合进来说一下。总之，问题", "url": "https://www.zhihu.com/pin/2092634812716733330", "votes": 0, "comments": 0, "feed_ts": 1791703018, "feed_time_str": "10-11 15:16", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "欧债危机前夜法国篇——制度在反噬，财政在崩塌", "excerpt": "一、教室里的裂缝，是整个国家的裂缝 2026年9月17日，巴黎东南郊克雷泰伊的圣埃克苏佩里高中，师生发起了一场抗议。理由简单到令人心酸：教师严重短缺，班级拥挤，校舍破旧，有学生说教室连通风都没有，窗户都打不开。 两周之内，抗议从一所高中蔓延到全国。10月6日，内政部统计约25.6万人上街，学生组织声称达45万人。教育部长公布的数据显示，全法约3700所高中中，891所当天课程全部或部分暂停，较一周", "url": "https://zhuanlan.zhihu.com/p/2092632321430122522", "votes": 46, "comments": 8, "feed_ts": 1791702545, "feed_time_str": "10-11 15:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "巴西左派发现中国网民不仅对性少数问题不感冒，而且在治安与毒品问题完全对不上电波。 中国网民的思维相比现行的精神美国民主党大战精神MAGA世界大版本感觉像是上个世纪蹦出来的一样，有巴西人反应过来了，原来中国人是瓦加斯主义者。交流之后双方发现对方三观差距太大了。 幽州很多官方价值观念还停留在2010年代初。", "excerpt": "巴西左派发现中国网民不仅对性少数问题不感冒，而且在治安与毒品问题完全对不上电波。 中国网民的思维相比现行的精神美国民主党大战精神MAGA世界大版本感觉像是上个世纪蹦出来的一样，有巴西人反应过来了，原来中国人是瓦加斯主义者。交流之后双方发现对方三观差距太大了。 幽州很多官方价值观念还停留在2010年代初。", "url": "https://www.zhihu.com/pin/2092630266967766610", "votes": 0, "comments": 130, "feed_ts": 1791702199, "feed_time_str" 楚上面的逻辑关系，一个三甲医生竟然想把责任推给疫苗？？？ ———— 评论区还有攻击学历的…这件事跟我是大专学历有啥关系么？大专课程", "url": "https://www.zhihu.com/question/2082931880022885542/answer/2091846200312055354", "votes": 1836, "comments": 287, "feed_ts": 1791698947, "feed_time_str": "10-11 14:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "武汉大学学者称「高额彩礼只是表象，男女比例才是根本」，如何看待这一观点？08年建筑工人的那波淘金热确实是“金币雄竞”的开端。而且很多人说彩礼是越穷越高，这其实并不准确。实际上，最为天价的彩礼，往往是由两个共同因素促成的：“蓝领跨地域爆金币极大成功”与“人籍门槛跨越极大失败”。这也是外界对“哪里来的这么多钱”感到震撼的真正来源。江西这种被经济更发达省份环绕、去哪里打工都方便的自然不必多说。皖北、豫东、鲁西南也是占了就近打工方便的“便宜”（反讽意味）。相比之下，豫中西部的一些丘陵农村并不比豫东发达多少，但彩礼就没有那么极端。而且具体到豫东（江西什么情况我不清楚），晚至22-23年时，彩礼仍然呈现“散装到乡镇级”的格局——要价38万的镇，隔壁镇可能只要8万左右。疫情甚至还延长了这种散装状态，直到疫情后才开始全面爆雷（这点豫东会比江西、皖北幸运不少，可现在是26年，该来的还是来了，好在26年的舆论和21年也大不相同了）。在这种散装到镇的格局下，起到彩礼火车头作用的，其实就是一些“靠着血缘与乡土纽带抱团，在发达城市占据了某个生态位，进而实现超高效率爆金币”的特定乡镇。比如在江浙一带抱团在纺织喷丝、五金建材、皮革制鞋生态位爆金币成功的一些镇的老乡，在赚了一笔钱后，出于面子虚荣心，加上自身作为低学历蓝领长期被看不起需要交赎罪券的社会现状，返乡后拉动了彩礼天花板，最终招来了“移风易俗”的铁拳。但是移风易俗因为只是某些试点，没有全面铺开，根本赶不上彩礼扩散的速度。这些“衣锦还乡”的火车头，首先传染的是那些“没有在外爆金币，或者只有原子化爆金币的纯务农乡镇”，在形成农村包围城镇的态势后，再向县城和地级市进攻，最终随着人口流入，对省会和省内其他亚地域实现围城战。这套模式的最先遣、最极端版本还不在江西或者豫东，而是在福建沿海（漳州和宁德一带可能没这么严重）。只不过他们组团爆金币的地点在国外，并且给的嫁妆也不少（虽然远没有彩礼那么多，而且高额彩礼和嫁妆最终都是归女方本人的）。所以哪怕彩礼到了100万级别，舆论也只会觉得这是“爱拼才会赢的、全球免签的、开智的&#39;闽利安超人&#39;”，而不是“思配苦盘盘”。但其实，福建沿海在家庭门槛的内在机制，和江西豫东是一样的。当然，我也不是完全苛责这类老乡，或者觉得他们爆到金币是坏事。真正的问题，其实在于老中防折叠（但也不限于防折叠）眼中的那套底层逻辑——“你没有学历，从事不洁净劳动，那么你爆的金币越多，需要交的赎罪券就越多”。这个内在的偏见问题如果不解决，哪怕光把蓝领的收入问题解决了，结果也只会让赎罪券的金额水涨船高，根本不会给真正的蓝领从业者带来尊严，也无法真正解决学历焦虑和内卷问题。恐怕真正需要被移风易俗的，远远不仅仅是这几个乡镇本身。但“进步主义”是永远不可能直面这个问题的。", "excerpt": "武汉大学学者称「高额彩礼只是表象，男女比例才是根本」，如何看待这一观点？08年建筑工人的那波淘金热确实是“金币雄竞”的开端。而且很多人说彩礼是越穷越高，这其实并不准确。实际上，最为天价的彩礼，往往是由两个共同因素促成的：“蓝领跨地域爆金币极大成功”与“人籍门槛跨越极大失败”。这也是外界对“哪里来的这么多钱”感到震撼的真正来源。江西这种被经济更发达省份环绕、去哪里打工都方便的自然不必多说。皖北、豫东", "url": "https://www.zhihu.com/pin/2092580966934041174", "votes": 0, "comments": 26, "feed_ts": 1791697477, "feed_time_str": "10-11 13:44", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

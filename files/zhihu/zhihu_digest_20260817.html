责底线审查，不做艺术评判」，你怎么看？", "excerpt": "牛来是有意义的，之前一直传言龙标多难搞，审核标准多无厘头，一定要混某某圈认识什么人之类的，一波全破了。", "url": "https://www.zhihu.com/question/2072090633733239477/answer/2072198653272397204", "votes": 2411, "comments": 103, "feed_ts": 1786893776, "feed_time_str": "08-16 23:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "可以分享一下各位做的架空世界观设定吗？", "excerpt": "整个世界线与现实的分叉发生在1918年，威廉·贝利（现实中“镭水”骗局的制造者）经营的Bailey Radium Laboratories生产出一款口服液“镭水”，号称能提振精神，在欧美中产阶级掀起了消费热潮。 与现实不同的是，这个世界的镭真的有超越尼古丁和咖啡因的提振精神作用。放射性直接作用于神经细胞、提高线粒体代谢速率，效果持久，且不会像咖啡因一样造成手抖、心悸等副作用。 在随后的第二次世界大", "url": "https://www.zhihu.com/question/2013971844420621319/answer/2072221765057754930", "votes": 219, "comments": 14, "feed_ts": 1786892707, "feed_time_str": "08-16 23:05", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "《间谍过家家》里黄昏为什么没有察觉尤尔的真实身份？", "excerpt": "不去追究约尔太太的超级力量，这正是黄昏超级智慧的完美体现。聪明的人知道要思考，更聪明的人知道什么时候不要思考。", "url": "https://www.zhihu.com/question/531245241/answer/2072458635901509841", "votes": 51, "comments": 4, "feed_ts": 1786892643, "feed_time_str": "08-16 23:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《牛来》结束后全场起身鼓掌，怎么看待线上在骂线下满座的反差？它到底戳中了观众的什么心理？", "excerpt": "牛来的上映，让人意识到龙标其实不难申请，他只管意识形态，不管内容质量。而新时代广大网友的意识形态比老一辈正常，只要好好讲故事，不夹带私货，基本都没问题。 而ai时代的到来，全程用ai制作，哪怕精益求精多抽几次卡，也能把成本压制到几万以内，有想法的人应该很快就有动作了，有资源的也开始动作了。 以后真的就是个人电影工作室的天下， 老一辈的玩法彻底被打下台面。 牛来是老一辈导演尤其是京圈那帮人的丧钟。 ", "url": "https://www.zhihu.com/question/2072229257074275067/answer/2072307260240482394", "votes": 3487, "comments": 123, "feed_ts": 1786892598, "feed_time_str": "08-16 23:03", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "迄今最大公开实验：前沿模型如何做 AI 研究一组 153 次自主运行，把 18 个前沿模型放进同一道“训练 124M GPT、只改优化器超参数”的题里。结果最值得看的，是模型在实验过程里如何拉开差距。Fable 5 补上人类记录差距的 81.7%，只是这组结果里最醒目的一个数字。这组实验没有要求模型从零发明算法。它们从同一个 3,290 步基线出发，目标是以更少训练步数把验证损失降到指定门槛；当时公开的人类记录是 2,600 步。Fable 5 的最佳验证结果为 2,726 步，所以它补上的是基线到人类记录这段 690 步差距中的 564 步。153 次运行测的是什么每次运行都在隔离的 8×H200 环境里进行，最长 8.7 天，不能联网。模型拿到训练脚本和规则，只能改优化器相关的设置，例如预条件、学习率调度、权重与更新幅度的限制、末尾权重平均。最终要过的不是单次幸运结果：固定的 8 个 seed 上，平均验证损失要低于冻结脚本规定的阈值。作者还说明，同一模型、同一 harness 的重复运行，在 24 个 agent-hours 时也会相差约 54 步。这也是为什么这类任务不能只看一张最终排行榜。强模型强在怎样做实验官方给出的观察很具体：多数模型最终都会找到相近的优化思路，区别在实验流程。较弱的模型常把一次 seed 的负结果当成方法无效，或把自己的运行错误当作结论；较强的模型会先用多 seed 筛掉噪声，再决定是否值得花 8 次完整验证的成本。它们还会在配方变化后重新检查旧结论。Opus 5 在新配方下重做 beta2 调参，得到新纪录；Kimi K3 在新的归一化设置出现后，删掉了此前推动纪录的两项机制。Fable 5 在单个旋钮难以继续推进后，开始测试“单独更差、组合更好”的参数对。这更像研究流程能力，不是新算法能力Prime Agent 的持久 IPython 内核，让 Kimi K3 在同一会话里自己写出构造对照变体、比较 loss curve、恢复基线和数值模拟的工具。更关键的是先用便宜的模拟把问题拆清楚，再决定是否值得开下一轮训练，而不是盲目多跑 GPU。但这不能直接读成“AI 已经能替代科研”。作者明确写道，获胜配方仍主要由已有文献中的成分组成，几乎没有出现真正新方法；nanoGPT speedrun 也是一个反馈快、定义清楚的优化任务，不等于真实大模型训练能同样复现。不同模型还搭配了不同 harness，比较结果不能当作纯粹的底座模型总榜。这组公开轨迹真正有价值的地方，是把“模型会不会做研究”拆成了可检查的问题：它是否知道什么时候该复验、什么时候该推翻旧结论、什么时候不该再烧一轮 GPU。", "excerpt": "迄今最大公开实验：前沿模型如何做 AI 研究一组 153 次自主运行，把 18 个前沿模型放进同一道“训练 124M GPT、只改优化器超参数”的题里。结果最值得看的，是模型在实验过程里如何拉开差距。Fable 5 补上人类记录差距的 81.7%，只是这组结果里最醒目的一个数字。这组实验没有要求模型从零发明算法。它们从同一个 3,290 步基线出发，目标是以更少训练步数把验证损失降到指定门槛；当时", "url": "https://www.zhihu.com/pin/2072455472964276689", "votes": 0, "comments": 0, "feed_ts": 1786891973, "feed_time_str": "08-16 22:52", "category": "pin", "cat_name": "想法动态"}, {"actor": "平凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "DSH+极简模式+DS V4 Pro Max档位的确可以稳定的触发", "excerpt": "DSH+极简模式+DS V4 Pro Max档位的确可以稳定的触发", "url": "https://www.zhihu.com/pin/2072454270184592276", "votes": 0, "comments": 0, "feed_ts": 1786891683, "feed_time_str": "08-16 22:48", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价《欢迎来龙餐馆》这部电影？", "excerpt": "非常好的电影，其中三句话点明了当今中国对外关系上的主旨，而且答案仍然见仁见智。其余的什么美军也好，kb份子也好，都是无关紧要的事，把他们换成外星人和地球原住民，根本不影响电影表达。 1.中国人对美国人说：“没有你们（指西方新殖民主义），哪来这么多恐怖分子？” 2.美国人对中国人说：“你的合伙人炸死了 就是燕郊，位置这个属性很难切割。 这就导致房东的收益逻辑极其粗暴：单价X时间。 因为难以对供给进行分层，所以房东的收益里几乎没有运营概念。位置是核心定价，剩下那点", "url": "https://www.zhihu.com/question/2070920779663767010/answer/2072360479872251345", "votes": 535, "comments": 26, "feed_ts": 1786869241, "feed_time_str": "08-16 16:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "醉鹅娘涉嫌走私遭起诉，年销3.5亿的网红品牌，为何走到刑事公诉这一步？醉鹅娘可能面临什么？", "excerpt": "毫不意外，非常正常，如果你知道这家公司整过什么活，你会觉得走私被抓甚至很踏实。 这家企业是我见过最抽象的企业之一。 只能说是真爱酒，真喝，不然也做不出这种酒蒙子行为。 几年前我就写过。 不是坏，是抽象。 比起走私，他们整过更抽象的活。 你听说过找人给对家打差评，被抓住是因为要发票的吗？ 北京落饮酒业有限公司（以下简称“落饮公司”）起诉北京醉鹅娘酒业有限公司（以下简称“醉鹅娘”）名誉权纠纷一案的一审", "url": "https://www.zhihu.com/question/2070904107477333186/answer/2072359188546708102", "votes": 479, "comments": 26, "feed_ts": 1786868933, "feed_time_str": "08-16 16:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "费大厨撤下「全国小炒肉大王」 宣传，上菜口号更换为 「精选黑猪肉、专业大厨炒」，此举带来的影响有多大？", "excerpt": "这事儿和“1000万以内最好的车”差不多，都有违反广告法的嫌疑。 区别是费大厨略微鸡贼一点。 广告首先应该保证真实性， 广告中不得使用“国家级”、“最高级”、“最佳”等绝对化用语，因为这些用语可能误导消费者，损害同行业竞争者的利益，同时也可能被视为对商品或服务的夸大宣传。用了绝对化的词语，尤其是“最好”，几乎铁定违反广告法。 因为这世界上就不存在最好的产品，“最好”本来就是非常绝对化的主观感受。 ", "url": "https://www.zhihu.com/question/2070112824437876354/answer/2072357021970589180", "votes": 4, "comments": 0, "feed_ts": 1786868417, "feed_time_str": "08-16 16:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "1000米恐惧症", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "坐牢其实比国内绝大多数工作都要轻松舒适，对身心健康也更友好。最近才知道坐牢有个511制度，5天工作8小时，1天学习，1天休息。另外孩子长期去寄宿制学校上学，反而有一定概率改善在原生家庭的心理问题。", "excerpt": "坐牢其实比国内绝大多数工作都要轻松舒适，对身心健康也更友好。最近才知道坐牢有个511制度，5天工作8小时，1天学习，1天休息。另外孩子长期去寄宿制学校上学，反而有一定概率改善在原生家庭的心理问题。", "url": "https://www.zhihu.com/pin/2072352597290308041", "votes": 0, "comments": 8, "feed_ts": 1786867493, "feed_time_str": "08-16 16:04", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title" 为为啥有富不三代的说法？ 比如有学者考证过明代科举进士家族情况，能延续三代以上的极少，所以说衰败才是常态。 为啥衰败？ 很多就是因为 兄弟阋墙，内斗引发的家族结构性腐朽、崩塌。正如《红楼梦》贾探春所言：“ 可知这样大族人家，若从外头杀来，一时是杀不死的，这", "url": "https://www.zhihu.com/question/590535312/answer/1945460382740252178", "votes": 4782, "comments": 414, "feed_ts": 1786855209, "feed_time_str": "08-16 12:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "澳洲的鲁壁藏书澳洲一家图书馆收到一本归还的书，居然是150年前借出去的，按照当年的规定，逾期要罚款，每周3便士，但是实在查不出当年的借阅者姓名以及借阅日期，这笔“天价罚款”只好作罢。这本书是1858年出版的《雅典古迹》（Antiquities of Athens）。借书的基亚马图书馆是1872年开馆，当年馆藏1000本书，这本书的编号是NO.506，大约是19世纪70年代被借出后，就没了消息。最近当地居民翻新世代居住的老宅子时，从封闭的壁炉里发现一个茶叶箱，箱子里藏着这本书。他猜测是高曾祖父借的书，不明白为什么没有归还。（恶意的猜测是，他高曾祖父知道自己逾期了，罚金太高把他吓着了，索性就不还书了。）这笔罚金累积到现在，按通胀调整计算，估计达到了2.8万澳元。馆长放弃了追讨这笔罚金，也不再向外出借这本书了：“我可不想再等150年才等到它回来”其实当年还规定：喝醉了的人不准借书！还书的Ross Simmons已经77岁了。我觉得当地应该把这栋老宅子保护起来，门口立一块影壁，上面写两个字：“鲁壁”。介绍一下这本借出时是新书、归来时是古籍的《雅典古迹》（The Antiquities of Athens）。这本书在建筑史、艺术史与考古学上都具有里程碑的意义，并不是一本简单的画册。书的作者是英国建筑师詹姆斯・斯图尔特（James Stuart）和尼古拉斯・雷维特（Nicholas Revett）。1751年，两人受英国“艺术鉴赏协会”（Dilettanti Society）的资助前往雅典，用了三年时间对古希腊遗迹做了实地勘测、精确测量和绘图，然后完成了四卷本的原著。后来有人补充了第五卷。第一卷于1762年在伦敦出版，澳大利亚图书馆收到的这本还书，是1858年出版的重印本。这本书有什么价值呢？在这本书出版之前，欧洲的建筑界一直将罗马建筑视为古典正统，对于古希腊建筑的了解大多基于一些文字记载或二手转绘，充满了想象和不准确之处。这本书第一次将真实、精准的纯正古希腊建筑结构、比例和雕刻细节展现了出来，书内附有大量极具艺术价值的高精度铜版画插图，详细记录了帕特农神庙、风之塔、伊瑞克提翁神庙等建筑的平面图、立面图和细节装饰。这本《雅典古迹》通过精确的对比，清晰指出了希腊建筑与罗马建筑的差异，挑战了当时以罗马建筑为唯一古典典范的普遍观念，开启了人们对“纯粹的”希腊古典主义的全新认识。它不仅是一个勘测记录，更是一部设计宝典，为18世纪末至19世纪席卷欧洲和美国的“希腊复兴”风格，提供了最权威、最直接的灵感来源和设计模板。书中有大量的图纸，从建筑整体比例到柱子、檐口等装饰细节，都被当时的建筑师和设计师奉为圭臬，成为他们设计新建筑、新家具和新装饰时最重要的参考书。书中的希腊图案和风格，不仅影响了公共建筑，也渗透到家具、银器、壁纸等日常设计之中。此外，斯图尔特和雷维特在测量时，许多雅典遗迹正在因为各种原因速度被毁，所以这本书实际上也成为了许多已经不存在或受损建筑的原始档案。#藏书   #图书馆   #罗马建筑   #希腊建筑   #古籍 ", "excerpt": "澳洲的鲁壁藏书澳洲一家图书馆收到一本归还的书，居然是150年前借出去的，按照当年的规定，逾期要罚款，每周3便士，但是实在查不出当年的借阅者姓名以及借阅日期，这笔“天价罚款”只好作罢。这本书是1858年出版的《雅典古迹》（Antiquities of Athens）。借书的基亚马图书馆是1872年开馆，当年馆藏1000本书，这本书的编号是NO.506，大约是19世纪70年代被借出后，就没了消息。最近", "url": "https://www.zhihu.com/pin/2067613990390445661", "votes": 0, "comments": 35, "fe const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

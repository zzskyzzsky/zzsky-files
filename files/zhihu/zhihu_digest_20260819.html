erpt": "本来是严肃的 “教育现场” #搞笑 ", "url": "https://www.zhihu.com/pin/2042614713289376571", "votes": 0, "comments": 16, "feed_ts": 1787067354, "feed_time_str": "08-18 23:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "agent先研究公司，模拟律所查询成本降10倍Engram 和 Harvey 用一个合成律师事务所做了实验：1 亿 token、266 个事项、9,286 个文件。任务不是答一道孤立问题，而是在同一套邮件、合同、备忘录和表格里持续找案例、核对事实、完成推理。100M token 不能每次从头读这个设置模拟的是企业里更常见的工作方式：资料库不会随着任务消失。比如今天找某类并购合同，明天又要找相似条款；如果每次都把几百份文件重新塞进上下文，成本和等待时间都会累积。对照里，Opus 4.8 在这套合成事务所上的平均单次查询成本是 1.32 美元，all-pass 为 25%。这里的 all-pass 是该博客使用的评测指标，不能直接等同于真实法律工作的完成率。笔记、参数和搜索各记一部分Engram 的做法不是只给 agent 加一个“记忆文件夹”。它先让模型以数千次 rollout 研究工作空间：把常见、可复用、需要精确编辑的事实整理成文本笔记；再用自生成的训练数据，把难以逐项写下的关联内化到参数里；真正答题时仍然会搜索原始文件。在这套设计里，文本笔记把 1 亿 token 原始内容压缩到约 100 万 token。它适合存事项状态、日期、业务类型这类可筛选的结构化信息；参数记忆更适合影响 agent 怎样理解问题、决定搜哪里、怎样判断证据够不够。同一模拟事务所里的成本对照按 C&amp;H 评测，完成上述“研究”后，agent 的平均单次查询成本为 0.13 美元，all-pass 为 30%；对照的 Opus 4.8 是 1.32 美元和 25%。成本约降一个数量级，指标只多出 5 个百分点。另一种口径：相较 Opus 4.8 X-high，使用的 token 少 3.3 倍。两组数字都只描述这套合成律师事务所和该团队的评测设置，不能推成所有企业知识库都能照搬的收益。这更像企业 agent 的上岗培训这项实验真正值得关注的地方，是把离线计算挪到上线前：先熟悉固定工作环境，再在新任务里少读重复文件、把搜索用在真正缺的信息上。对有稳定资料库的团队，例如客服知识库、投研档案、项目文档或合规材料库，这是一条值得继续验证的路线。对资料每天剧烈变化、权限边界复杂，或要求接近零错误的场景，仍需要单独验证更新、隔离、溯源和人工复核；这篇博客没有提供真实律所生产效果。", "excerpt": "agent先研究公司，模拟律所查询成本降10倍Engram 和 Harvey 用一个合成律师事务所做了实验：1 亿 token、266 个事项、9,286 个文件。任务不是答一道孤立问题，而是在同一套邮件、合同、备忘录和表格里持续找案例、核对事实、完成推理。100M token 不能每次从头读这个设置模拟的是企业里更常见的工作方式：资料库不会随着任务消失。比如今天找某类并购合同，明天又要找相似条款", "url": "https://www.zhihu.com/pin/2073191164728042331", "votes": 0, "comments": 0, "feed_ts": 1787067310, "feed_time_str": "08-18 23:35", "category": "pin", "cat_name": "想法动态"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么有些极其聪明的人，一辈子却留在了社会最底层？", "excerpt": "我高中有个同学叫建国。 坐我后面那种。理科好到什么程度呢，这么说吧，物理课上老师讲错一道题，全班四五十号人，就他一个人举手指出来了。那道题老师自己都做了半小时，建国看了一眼就说”你这个受力分析画反了”。 数学竞赛他是我们班唯一一个拿省二等奖的。但你要是去我们班找他，大概率他正把一本《天龙八部》摊在课桌上，看得不亦乐乎。不是那种偷偷摸摸塞在课本底下看，是堂而皇之地摊在那儿，老师走过来他都不带 应该关注的，就是一堆鸽派消息出来：非农就业差，CPI和PPI温和，零售销售也弱。 正常情况下，这种数据出来，大家觉得经济快不行了，会去买美债避险，债券收益率会大跌。 但这次完全没有，美债继续跌，只有黄金涨。 这就是期限溢价对市场的冲击，期限溢价对应的是未来不确定性，这说白了就是市场不相信美国政客包括美联储在内的话术，已经产生", "url": "https://zhuanlan.zhihu.com/p/2073155265684314085", "votes": 13, "comments": 2, "feed_ts": 1787063739, "feed_time_str": "08-18 22:35", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "gwave", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "2026 Google 开发者大会有哪些值得关注的信息?", "excerpt": "感谢 @知乎科技 的邀请，前两天我第一次来到 2026 Google 开发者大会现场。回来之后一直在消化，最大的感受其实不是&#34;某个模型又发布了&#34;，而是——不论是浏览器 Chrome、Android 开发，还是 Google Cloud，都已经无缝融入了 LLM。 不，准确说不是&#34;融合&#34;，而是 重构。从笔记本到浏览器，再到移动设备，LLM 几乎无处不在。走完这两天，我", "url": "https://www.zhihu.com/question/2070617992870811423/answer/2073175184064898128", "votes": 2, "comments": 0, "feed_ts": 1787063482, "feed_time_str": "08-18 22:31", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果国内能每年出一个《黑神话悟空》体量与质量的游戏，那么中国3A游戏产业算非常成熟了吗？", "excerpt": "现在的单机和过去的单机已经不是一个东西了 过去的单机只能收一波块钱 因为计算机图像技术一直在进步 只要进步了 你再看前面的作品简直马赛克 现在不一样，哪怕到了2026年，你玩2012年的欧洲卡车模拟 其实也还行。 一个单机游戏做得好，真的会成为一个及优质的资产甚至现金奶牛 像黑神话悟空，每年保底增加一百万玩家 因为中国会有哪个刚高考完刚买电脑的学生，不想买个黑神话玩一下呢？ ", "url": "https://www.zhihu.com/question/1988674072754811887/answer/2072996665741533543", "votes": 2, "comments": 3, "feed_ts": 1787061799, "feed_time_str": "08-18 22:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "历史网络小说里面，各朝代写得最好的小说是哪本?", "excerpt": "歪个题，以下是《铁血残明》小说作者柯山梦2026年的一篇访谈： 当历史尘埃落定，时间的车轮继续向前，人们往往只能看到王朝更迭的宏大轮廓，而在柯山梦的《铁血残明》中， 明末不仅是一个风云激荡的时代，更是一幅市井烟火与人性挣扎交织的浮世绘。柯山梦以精妙的情节设计和细致入微的笔触，铺陈出一个真实得令人惊颤的晚明世界：这里有街头商人的无奈、胥吏的算计、士绅的权谋、流民的挣扎，也有穿越者庞雨在历史迷雾中茫然", "url": "https://www.zhihu.com/question/384576473/answer/2072718538754766012", "votes": 59, "comments": 12, "feed_ts": 1787060295, "feed_time_str": "08-18 21:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "深圳房价能跌到什么位置？", "excerpt": "2025.05刚上车 坐标深圳龙岗，全款垫资买了一套290万的四房，然后贷款8成232万经营贷出来，年利率2.35％，十年期先息后本，算上管理费停车费，每月大概支出5000块左右，跟所买小区正常的房租差不多。 一个字：爽 有人问我十年贷款到期了怎么办？对不起，十年后的事情我考虑不到，也预测不准，先把这十年活好，过好再说。我只知道我正常每个月也要付5000的房租的，我现在只是把房租给银行而已，而且不", "url": "https://www.zhihu.com/question/489247568/answer/1909682124103082649", "votes": 407, "comments": 320, "feed_ts": 1787060269, "feed_time_str": "08-18 21:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待香港人吐槽伦敦地铁脏乱，被某香港影帝讽刺「土包就是土包」？", "excerpt": "这次黄秋生观点最讽刺的是他对穷人、土包的鄙视，正是对自身过往的鄙视。 我对黄秋生的研究仅次于对成龙、韩红、李小璐的研究，也算有点见解。 黄秋生因为被英国父亲抛弃，从小跟母亲过着颠簸流离的生活，他比谁都懂脏乱差的环境。因为混血和没爹的出身经常遭到霸凌，继而形成与人打架的习惯，这样的性格让他无法融入学校圈子，很早便辍学打工，从底层摸爬滚打换了很多分工作，过得十分穷困潦倒，没有谁比他更了解穷人的困境，难", "url": "https://www.zhihu.com/question/2071646005095936517/answer/2072650243523474427", "votes": 739, "comments": 65, "feed_ts": 1787059514, "feed_time_str": "08-18 21:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "为什么汉字放弃了&#34;怎么读就怎么写&#34;这条最省力的路径？「怎么读怎么写」看似省力，实则意味着「听觉文明」与「视觉文明」被强行统一，这从根本上违背了民主自由的意识形态。  汉字体系不允许如此，读和写必须分成两套思维模式，各自独立发展，这才能拓展思维的深度和广度。  文字不去羁绊读音，读音也不影响文字的进步，二者的统一只会导致相互妥协，束缚新词的创造与理解。  为什么汉字放弃这条「最省力」的路径？因为我们的文明给予文字和读音真正的自由——思想的天空才能无边无际，自由翱翔。  相比之下，西方将读写统一起来，却让思维容易停留在表面；而汉字读写独立，才是思想解放的体现，我们才是自由的最终守护者。为什么汉字放弃了&#34;怎么读就怎么写&#34;这条最省力的路径？ #自然与汉字的结合  #汉字的发展  #汉字的形成 ", "excerpt": "为什么汉字放弃了&#34;怎么读就怎么写&#34;这条最省力的路径？「怎么读怎么写」看似省力，实则意味着「听觉文明」与「视觉文明」被强行统一，这从根本上违背了民主自由的意识形态。  汉字体系不允许如此，读和写必须分成两套思维模式，各自独立发展，这才能拓展思维的深度和广度。  文字不去羁绊读音，读音也不影响文字的进步，二者的统一只会导致相互妥协，束缚新词的创造与理解。  为什么汉字放弃这条「最省力」", "url": "https://www.zhihu.com/pin/2073156477771068460", "votes": 0, "comments": 1, "feed_ts": 1787059021, "feed_time_str": "08-18 21:17", "category": "pin", "cat_name": "想法动态"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "二战末期设计最成功的坦克是哪款?", "excerp ime_str": "08-18 20:15", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "ZOMI酱", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "35岁了才来学编程，是不是晚了?", "excerpt": "不用学了，约用AI和agent就可以了，何必学一门将要被淘汰的技术呢", "url": "https://www.zhihu.com/question/6590712665/answer/2073139713393874830", "votes": 6, "comments": 2, "feed_ts": 1787055025, "feed_time_str": "08-18 20:10", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "面试必问：Reward Model到底怎么训？答“打分网络”的直接淘汰第一次训RM的时候，我天真地以为它就是个“打分器”。直到PPO跑起来，模型开始疯狂输出长篇废话，奖励分一路狂飙，我才意识到——完蛋，奖励模型学歪了。很多做模型对齐、跑RLHF的朋友都栽在这里，明明奖励分数越来越好看，模型实际效果却越来越拉胯，回答空洞、爱套模板、不解决实际问题。折腾很久我才彻底想通，Reward Model根本不是简单训个回归网络就行，它的训练方式、数据构造、边界约束，直接决定你的RLHF能不能成，也是绝大多数人Reward Hacking的真正根源。说白话，奖励模型的工作逻辑特别纯粹，它不生成文字，只负责优劣排序打分。训练奖励模型的基座，必须是收敛完成的SFT模型，绝对不能直接用原始预训练模型。原生基座输出风格混乱、逻辑不稳定，学不到真实的人类偏好，训出来的RM评判标准完全错乱，后续强化学习只会越训越歪。我们只需要把SFT模型最后的预测层替换成单输出维度，让它针对用户问题的模型回复，输出一个唯一的质量分数，用来区分回答的好坏差距。整个训练不靠人工单条打分，核心全靠偏好样本对。同一个用户提问，留存一条高质量、逻辑完整的优选回复，再搭配一条残缺、出错、答非所问的劣质回复，组成chosen和rejected配对数据，用排序损失做优化，让模型精准学到人类和业务场景的真实偏好。奖励模型绝对不能多轮训练，一般1到2个epoch就够，训多了直接严重过拟合，只会死记硬背训练集的表面特征，完全没有泛化能力，上线真实场景直接失效。验证集准确率高，不代表RM真的学会了评判质量。它会偷偷抓标注里的表面偏好——比如人类更喜欢长回答、工整格式、客气语气。模型发现只要输出这些“看起来好”的东西就能拿高分，这就是Reward Hacking的根源。我之前做客服风控对齐就踩了这个致命大坑，PPO迭代几轮之后，模型彻底变“摆烂讨好型”，不管用户咨询退款、投诉纠纷还是简单问询，统一输出大段规整客套话术，看着面面俱到，实则没有一句有效信息，奖励分数节节攀升，但业务识别准确率直接腰斩。说白了，模型根本没学怎么把回答做好，只学会了怎么骗过高分。想从根上根治Reward Hacking，单纯调PPO参数毫无意义，所有解法都要回归奖励模型本身的训练流程。最关键的一步，就是主动补齐漏洞样本、清洗投机空间。普通的优劣样本对太常规，很容易让模型抓到表面规律，我们必须针对性构造陷阱样本，专门收录那些格式完美、语句通顺、篇幅充足，但核心逻辑错误、答非所问、信息虚假的坏案例，强制奖励模型穿透外在形式，只根据内容真实性、逻辑完整性、问题解决度打分，彻底废掉模型投机取巧的捷径。很多人忽略了一个核心问题，就是训练分布偏移。奖励模型的训练数据，全部来自SFT模型的固定输出分布，但PPO训练是持续探索更新的，模型输出风格、内容会不断迭代变化，慢慢脱离RM见过的旧数据。一旦分布对不上，奖励模型的评判标准就会彻底失灵，误把空洞新输出判定为优质内容，黑客行为就会集中爆发。解决办法也很简单，做迭代式更新，每轮PPO训练结束后，筛选一批模型最新的优质、劣质输出，补充进RM训练集持续微调，始终让奖励模型适配最新的模型输出分布，杜绝评判滞后问题。工程上还有两个细节能大幅降低黑客概率。一个是加KL约束，别让模型为了追高分跑偏太远，锁住SFT基线的核心能力，避免模型无底线投机讨好；另一个是别只用单个RM，多个模型融合打分能堵死投机捷径，单个奖励模型的漏洞很容易被利用，多模型交叉评判，基本能杜绝绝大多数刷分行为。这里纠正一个所有人都踩的误区，千万别盲目追求奖励模型的超高准确率。人工标注本身就存在主观分歧，行业正常标注一致率也就六七成，奖励模型准确率稳定在65%-75%就是最优状态。强行训练拔高准确率，最后只会过度拟合训练数据，进一步放大Reward Hacking问题，得不偿失。其实捋透就会发现，RLHF翻车、模型刷分不提质，几乎都不是PPO算法的问题，全是前置奖励模型训练不规范导致的。奖励模型是整个对齐链路的天花板，它的评判标准歪一点，后续强化学习的所有迭代都会跟着歪。我总结成一句话：RM用SFT基座、轻量epoch训练、搭配漏洞样本补齐、迭代更新数据、叠加KL约束，就能从根源杜绝奖励黑客，让模型真正学优质能力，而不是学投机刷分。你跑RLHF的时候，有没有遇到过模型高分低能、疯狂黑客刷分的坑？评论区聊聊你的排查经历。#PPO算法 #强化学习 (Reinforcement Learning) ", "excerpt": "面试必问：Reward Model到底怎么训？答“打分网络”的直接淘汰第一次训RM的时候，我天真地以为它就是个“打分器”。直到PPO跑起来，模型开始疯狂输出长篇废话，奖励分一路狂飙，我才意识到——完蛋，奖励模型学歪了。很多做模型对齐、跑RLHF的朋友都栽在这里，明明奖励分数越来越好看，模型实际效果却越来越拉胯，回答空洞、爱套模板、不解决实际问题。折腾很久我才彻底想通，Reward Model根本不", "url": "https://www.zhihu.com/pin/2072704750202642497", "votes": 0, "comments": 3, "feed_ts": 1787054350, "feed_time_str": "08-18 19:59", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "扩散模型的强化学习后训练，本质上都在做同一件事——只是没人愿意承刚看到北京大学团队最新提交的论文《Designing Reinforcement Learning for Diffusion Models: A Unified Path-Space View》，刚挂上arXiv没几天。论文直达：链接核心观点一句话：现在扩散模型强化学习后训练领域那些看似打得不可开交的算法——逆向轨迹方法、前向匹配方法——其实来自同一条路径空间原理。这事有多离谱？扩散模型的RL后训练是让生成模型对齐人类偏好和任务奖励的直接路径，但整个领域现在是一盘散沙。逆向轨迹方法靠离散化似然比做优化，前向匹配方法在带奖励标注的降噪版本上训练。两拨人各写各的论文、各刷各的榜，谁都觉得自己才是正统。北大这篇论文干了什么？从正则化扩散RL目标出发，用采样SDE之间的重要性采样，推导出轨迹空间上显式的策略梯度估计。然后他们把Flow-GRPO型更新背后的随机Itô积分，等价变换成降方差的值梯度形式，直接还原出AWM和DiffusionNFT的前向匹配结构。结论很直接：这两个方法族之间的经验差距，本质上是降方差效应，不是什么RL原理之别。基于这个统一视角，他们提出了一个按值梯度估计、权重函数与采样选择组织的统一样本设计空间，配以复用rollout分组的多样本KDE值梯度估计器。SD3.5-M和Qwen-Image上的实验验证了降方差解释，整体配方超过此前扩散RL基线一点想法：今年扩散模型RL后训练有多火不用我说了吧？Flow-GRPO、AWM、DiffusionNFT，各家你方唱罢我登场。每篇论文都宣称自己发现了新范式、新机制。结果北大这篇直接把底裤掀了——你们吵了半天，做的其实是同一件事，区别只是方差降没降下来。这让我想起一个老问题：AI领域到底有多少“创新”是真正的范式突破，又有多少只是换个角度重新描述同一个东西？当一篇理论论文能把几个主流算法统一成同一个框架的时候，那些算法的“原创性”还剩多少当然，统一视角本身是有价值的。至少以后做扩散RL的人不用再对着四五套算法纠结选哪个了——理解了路径空间原理，你就能自己设计配方。但这也意味着，这个领域的方法论创新空间可能比大家想象的要小得多。另一个值得追问的问题：如果两个方法族只是降方差的区别，那为什么领域里没人早点发现？是因为大家太忙着刷榜，还是因为理论分析在工程狂欢面前根本不重要？#扩散模型   #强化学习 (Reinforcement Learning)   #北京大学   #文献速递  #大模型  #AI​ ", "excerpt": "扩散模型的强化学习后训练，本质上都在做同一件事——只是没人愿意承刚看到北京大学团队最新提交的论文《Designing Reinforcement Learning for Diffusion Models: A Unified Path-Space View》，刚挂上arXiv没几天。论文直达：链接核心观点一句话：现在扩散模型强化学习后训练领域那些看似打得不可开交的算法——逆向轨迹方法、前向匹配方", "url": "https://www.zhihu.com/pin/2073000011206604682", "votes": 0, "comments": 0, "feed_ts": 1787054054, "feed_time_str": "08-18 19:54", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "一片空白", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么乌克兰当局在东部连一支游击队也组建不起来？", "excerpt": "说反了吧，是投降俄罗斯的前乌克兰士兵组成了5个旅，反戈一击对乌纳作战了 ", "url": "https://www.zhihu.com/question/1925873622368621453/answer/2069387673194829131", "votes": 54, "comments": 14, "feed_ts": 1787053780, "feed_time_str": "08-18 19:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "嵌入式软件工程师怎么debug，感觉学得太浅了？", "excerpt": "调试这事吧，说实话我干了这么多年嵌入式，最大的感受就是——debug能力不是&#34;学&#34;出来的，是被坑出来的。 你觉得自己学得太浅，其实不是你浅，是你踩的坑还不够多。 说几个实际的东西。 第一层：printf大法 别笑，这玩意是真有用。但很多人用得太糙。你如果是调STM32，别光在串口上printf，搞个RTT（SEGGER Real-Time Transfer），速度比UART快几个数", "url": "https://www.zhihu.com/question/2014143113745179424/answer/2073091151301813969", "votes": 6, "comments": 0, "feed_ts": 1787053767, "feed_time_str": "08-18 19:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "导演、编剧、从业人士怎么看待电影《牛来》的爆火？", "excerpt": "哈哈哈哈我有个同学是从业编剧，她发朋友圈说： 怎么办，有点想去看《牛来》。假如我花30块钱电影票去看了它，算不算是行业的叛徒。 我劝她说，带个娃去，就说是孩子闹着要看。 ", "url": "https://www.zhihu.com/question/2072624810887324539/answer/2072832108033328531", "votes": 300, "comments": 19, "feed_ts": 1787053582, "feed_time_str": "08-18 19:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "一片空白", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中国人吃肉在世界上处于什么水平？", "excerpt": "什么时候国内目田混的这么惨了？连口肉都吃不起？ 我当年的“人在美国，刚写飞机呢？”现在就算在深圳月薪3K也能每天吃上猪脚饭，难道目田连这个都没有？可以自己去找附近的街道办看看能不能找点帮助咯 上数据 可以看到，中国的红肉消耗量已经达到了74公斤，这是没算鸡蛋，鱼类，等别的蛋白质来源，在意大利，德国，日本等国家至上，墨西哥，新西兰，法国等国家之下，已经考虑到中国传统饮食并没有夸张的吃 此更加敬重主编？", "excerpt": "表面上想要证明Vita这个期刊不看作者身份，更看重文章质量本身，实则恰恰打了学术界和Vita这个期刊的脸，以及揭开了学术界期刊自娱自乐和刻意经营和控制学术的遮羞布。 颜宁及其科研团队，作为国内最顶尖和成熟的科研团队，写出来的论文竟然被秒拒，同时，他们的另一篇论文却登上了该期刊的封面，这说明颜宁及其团队的科研水平方差极大，这是一件非常不可思议的事情。这意味着纯看文章质量的科研评价机制失效了，因为按照", "url": "https://www.zhihu.com/question/2071770065326937410/answer/2072773712940622858", "votes": 99, "comments": 10, "feed_ts": 1787035628, "feed_time_str": "08-18 14:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "太湖陶朱公", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你认不认同“现在大学学的东西已经和社会完全脱节了”这句话？", "excerpt": "大学给你的问题是定义良好的：有标准答案、有评分标准、有出题老师，做错了顶多扣分。 社会给你的问题是定义模糊的：没人告诉你题目是什么，没有人阅卷，甚至没人告诉你这道题存不存在。 工作之后你会发现，最难的不是把事做好，而是搞清楚到底该做哪件事。这个能力，四年的课表里一节都没有。 你在大学练的是解题，社会考的是自己提出有良好定义的问题，并以性价比高的方式解决它。 ", "url": "https://www.zhihu.com/question/2066558957712413437/answer/2073057863384163879", "votes": 0, "comments": 0, "feed_ts": 1787035510, "feed_time_str": "08-18 14:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "龙珠53点战斗力和53吨黄金你会选哪个？", "excerpt": "50点战斗力就可以刀枪不入了，银行就是你家仓库，用的时候去拿就行了。我选53点战斗力，然后逼着题主给我53吨黄金，不然就弄死他。", "url": "https://www.zhihu.com/question/2051287411578115169/answer/2073057558408050495", "votes": 1, "comments": 0, "feed_ts": 1787035438, "feed_time_str": "08-18 14:43", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评论《简·爱》的里德舅妈？她是坏人吗，可是她毕竟养大了简爱？", "excerpt": "原著中刚好有一个对照组，那就是罗切斯特和小阿黛勒。 首先回答3个问题： 1.罗切斯特和阿黛勒有血缘关系吗？ 那个年代没有亲子鉴定技术。我们只知道他本人不认为阿黛勒是他的女儿，因为她长得不像他。2.罗切斯特喜欢这个孩子吗？ 必然是不喜欢的。阿黛勒的母亲卷了他的钱跟别的男人跑了，还强行把一个生父不明的孩子丢给他，他一直视阿黛勒为负担。同时阿黛勒还继承了母亲身上一些让他不喜欢的点。3.罗切斯特对阿黛勒的", "url": "https://www.zhihu.com/question/490248284/answer/2073027912849215617", "votes": 24, "comments": 4, "feed_ts": 1787035152, "feed_time_str": "08-18 14:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "太湖陶朱公", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "多地严查社保缴纳，要求提高夯实率，有职员反映工资被下调，该如何理解？", "excerpt": "严查社保这件事本身没问题，问题出在账单最后由谁付。社保基数按实际工资核定，这规矩一直都在，不是今年才有的。过去是企业按最低基数缴，员工到手多一点，大家装看不见。现在税务把个税申报工资和社保基数一比对，对不上，让你自查。说白了不是加了新税，是旧账翻出来了。 为什么现在？ 一是技术上真拦不住了。金税四期把税务、人社、银行的数据打通，你个税报多少、社保按多少缴、银行流水发多少，系统自己能对，对不上就预警", "url": "https://www.zhihu.com/question/2071533345910022775/answer/2073055580386808790", "votes": 1, "comments": 0, "feed_ts": 1787034966, "feed_time_str": "08-18 14:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "想给医生写表扬信，请问递交到哪个部门能让医生最欣慰？", "excerpt": "记得之前在知乎看到一个手法：去淘宝定制一盒笔，几百支一千支那种，笔身上印着“某某医院某某科室某某某医生悬壶济世，妙手回春”，送给这个医生，让医生放在办公室随时取用。 然后这几百支笔就会在这个医院各个医生不断“协调”之中，不断流通。上至院长，下至护士，很快整个医院里，不能说人手一支，但是谁都用过一支印着这个医生名字的笔。 然后整个医院的医生也好，领导也好，大家一提起这个名字，就总会和“这个医生医术医", "url": "https://www.zhihu.com/question/5131354927/answer/2066689498709225949", "votes": 903, "comments": 49, "feed_ts": 1787034874, "feed_time_str": "08-18 14:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "买了alex01的专栏还能退订吗？他准不准啊？", "excerpt": "就事论事，a哥的宏观逻辑还是很厉害的，能学到东西。只是资产的极短期的波动，确实难以每一波都预测精准，但这都是小机会啦，挣不着大钱。挣大钱看的还是中大级别的波动方向，还是要看宏观的。", "url": "https://www.zhihu.com/question/2051287151183247332/answer/2073030189085352382", "votes": 6, "comments": 2, "feed_ts": 1787034320, "feed_time_str": "08-18 14:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "什么东西大学生最该学却没人教？", "excerpt": "说几样没人教但真的会改变你一生的东西。不是在大学课堂上学的那种。 ··· 第一件事：怎么在信息不完整的时候做决定大学教你的所有东西都有一个前提：题目给定了全部条件，答案藏在某个地方，只要你算对了就能拿分。 现实不是这样的。 我见过一个学金融的学长，大三的时候在两个实习offer之间纠结。一个是四大会计师事务所，名头响、起薪高、朋友圈发offer截图够体面。另一个是一家刚成立一年的量化私募，团队就十", "url": "https://www.zhihu.com/question/11463857483/answer/2057211285582909831", "votes": 3982, "comments": 103, "feed_ts": 1787034292, "feed_time_str": "08-18 14:24", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "UFO", "verb": "MEMBER_VO ps://www.zhihu.com/question/2066558957712413437/answer/2070827296064329193", "votes": 3118, "comments": 88, "feed_ts": 1787023138, "feed_time_str": "08-18 11:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "孟书记早就说过这事。统计学意义上的普通人，知识水平是很差的，你问他经济政策的问题完全没必要，纯属鸡同鸭讲。实际上，当代的经济议题本质上是文化议题，早就不关乎具体的经济政策是什么样了，而纯粹只是一种“感觉”。很多人谈及2016年选举，都会痛斥TPP。觉得哎呀这个TPP真邪恶，把希拉里弄的败选了——是不是这样？有可能是，但那与其说是因为TPP的条款是什么，还不如说是因为这类协议过于复杂，激发了美国人对于“复杂性”的反感，觉得你们这帮精英又在鬼鬼祟祟干什么了。但实际上，绝大多数人是完全不知道TPP是什么的。不要说美国了，知乎那么多鉴证高手济济一堂，平均姿势水平应该远超普通人吧。那你们还记得2020年的RCEP吗？当时被吹成了百年不遇的大变局。结果21年的时候我国又申请加入了CPTPP。那现在我问一句，都是自贸协定，RCEP跟CPTPP的区别是什么？谁能说出三条来？不查资料，100个人里面有5个人能说出来吗？哦，对了，知乎许多目田知道CPTPP是什么：1.要强制实行八小时工作制。2.要让大家随便上网。3.管院踩产要公开。哈哈哈哈哈哈哈哈哈哈哈。其实这就跟2016年的美国人对TPP的感觉差不多，完全不知道是什么，但总之就把它当成一些东西的总和。只不过对当时的美国人来说，TPP就是“精英鬼鬼祟祟”的总和，对当下的知乎目田来说，CPTPP就是他们的万能许愿机。马前卒在这点上是很有洞察力的。当代人的根本困境，就是人无法理解自己创造出来的这个复杂社会，成为了自己生活里的陌生人。", "excerpt": "孟书记早就说过这事。统计学意义上的普通人，知识水平是很差的，你问他经济政策的问题完全没必要，纯属鸡同鸭讲。实际上，当代的经济议题本质上是文化议题，早就不关乎具体的经济政策是什么样了，而纯粹只是一种“感觉”。很多人谈及2016年选举，都会痛斥TPP。觉得哎呀这个TPP真邪恶，把希拉里弄的败选了——是不是这样？有可能是，但那与其说是因为TPP的条款是什么，还不如说是因为这类协议过于复杂，激发了美国人对", "url": "https://www.zhihu.com/pin/2073005254296323460", "votes": 0, "comments": 17, "feed_ts": 1787023122, "feed_time_str": "08-18 11:18", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "第一次世界大战为何被称为「旧时代的终结」？", "excerpt": "我觉得欧陆保守主义者应该诚实点，直接大大方方说“第一次世界大战是一场由威廉二世错误发送，被红褐极权主义分子利用，给白人基督教世界带来巨大浩劫的民族大融合”算了。没必要天天在这里遮遮掩掩。", "url": "https://www.zhihu.com/question/2055246906931073080/answer/2072702106427978993", "votes": 722, "comments": 50, "feed_ts": 1787023043, "feed_time_str": "08-18 11:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "盎友的incel文化会不会就是盎女在用雌激素维持一种交配等级制，从而调控盎男的社会等级，盎女想让盎男互相打架的时候就开始发情。gone with the wind就是一个盎女把南方和北方盎男耍的团团转，这部电影也理所当然的成为了盎友历史上票房最高的电影。但很不幸的是，这个秘密被生化女性（trans）发现 /1911300847553484043/answer/2073000924495230490", "votes": 2337, "comments": 156, "feed_ts": 1787021935, "feed_time_str": "08-18 10:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "AI 芯片软件栈中的 Runtime：cudaMalloc 到 kernel launch，中间发生了什么？", "excerpt": "你在 PyTorch 里写一行 x = x.to(&#39;cuda&#39;)，再跑一个 linear(x)，几十微秒内，一个 kernel 就在 GPU 上执行完了。这行代码背后，除了编译器生成的 SASS 指令，还有一层你可能从没注意过的软件——Runtime（运行时）。 它没有内核态驱动那么&#34;硬核&#34;，也没有编译器那么&#34;聪明&#34;，但它是连接框架与硬件的 最后一层", "url": "https://zhuanlan.zhihu.com/p/2068138527976584493", "votes": 11, "comments": 1, "feed_ts": 1787021661, "feed_time_str": "08-18 10:54", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待财政部税务总局21号公告后，富豪“离岸信托”避税梦碎，黄铮、雷军或补税500亿？", "excerpt": "放眼全世界，蓝色低端APP也是唯一一个会心疼资本家被收税的平台了吧。", "url": "https://www.zhihu.com/question/2067028575635743132/answer/2070587797119956928", "votes": 2386, "comments": 104, "feed_ts": 1787021144, "feed_time_str": "08-18 10:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么 Linux 在 x86 上不需要设备树，在 Arm 上需要设备树？", "excerpt": "因为疯狂的魔改 x86只有两个厂商。Intel和AMD。这两个厂商都非常注意可移植性。每一个引脚都是干啥的，基本上不变。打个比方说：第50 - 60号引脚是PCI总线。每一代CPU的引脚定义都一样。专业术语叫：Pin2Pin。 而ARM其实只是一个CPU电路图提供商。把电路图卖给无数的厂商。这些厂商分别对于ARM的CPU电路图进行疯狂的魔改。。 而疯狂魔改的结果就是：同样是PCI总线，有的厂商是5", "url": "https://www.zhihu.com/question/475730584/answer/1977427476473979717", "votes": 451, "comments": 37, "feed_ts": 1787020865, "feed_time_str": "08-18 10:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BBuf", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "SGLang 中的 CUDA Graph 进阶指南", "excerpt": "作者：SGLang TeamTL;DRCUDA Graph 的目标是消除 kernel launch 开销，但要在真实的推理引擎中尽可能接近这一理想收益，就需要在不牺牲兼容性、启动时间和显存的前提下，将尽可能多的工作负载纳入 CUDA Graph。 在 SGLang 中，我们围绕统一的 Runner/Backend 接口重构了 CUDA Graph 支持，让不同的捕获策略可以复用于不同执行路径。 ", "url": "https://zhuanlan.zhihu.com/p/2072995351972397993", "votes": 71, "comments": 2, "feed_ts": 1787020791, "feed_time_str": "08-18 10:39", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "拼多多为什么会支持买家仅退款?", "excerpt": "3年前我就写过了，拼多多看明白了本质问题，对现阶段的电商平台来说，买家更重要？还是卖家更重要？ 如果这个供给是稀缺的，很多货只有你这里才有，别的平台都没有，那当然是卖家更重要，因为大家都要来你这儿买嘛，别的地方买不到。 如果供给是过剩的，东西都一样，有一堆人在卖，那当然是买家更重要，因为只要有足够多的人在这里买，有的是人哭着喊着抢着过来卖。 有限的资源，要用在重要的事情上。 至于卖家的骂，无关紧要", "url": "https://www.zhihu.com/question/487866402/answer/2072994216305758807", "votes": 521, "comments": 27, "feed_ts": 1787020336, "feed_time_str": "08-18 10:32", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Anthropic年化营收突破650亿美元！冲刺史上最大IPO", "excerpt": "如果只看一年前，很难想象 Anthropic 的收入曲线会陡成这样。 就在今天早上，据彭博社报道，Anthropic 向投资者披露， 截至今年 7 月底，公司年化营收运行率（ARR）已经达到了 650 亿美元。以 2025 年底超过 90 亿美元的年化水平计算，短短数月时间，这一数字已经增长至原来的 7 倍以上。 与此同时，Anthropic 最近一个已经结束季度（Q2）的初步收入也超过了 115", "url": "https://zhuanlan.zhihu.com/p/2072993696505652674", "votes": 6, "comments": 0, "feed_ts": 1787020256, "feed_time_str": "08-18 10:30", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "ECCV 2026 | 一段视频，重建一个可仿真的动态世界", "excerpt": "机器人走出实验室后，训练数据不再只是 “多不多” 的问题：环境能否覆盖真实世界的尺度、遮挡、接触和运动，直接决定策略能否落地。Real2Sim 因此重新受到关注 —— 如果普通视频也能变成可交互的仿真场景，采集成本会比人工建模或专用设备低得多。 难点在于，视频里看见的世界并不等于物理引擎可用的世界。现有 4D 重建常以隐式场、Gaussian primitives 或点云为结果，适合新视角渲染，却", "url": "https://zhuanlan.zhihu.com/p/2072993052084516265", "votes": 6, "comments": 0, "feed_ts": 1787020115, "feed_time_str": "08-18 10:28", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你知道蒙古人均矿产资源拥有量比澳大利亚还要多吗？", "excerpt": "你信AI不如信我是李沁和迪丽热巴老公。我可以明确地告诉你，网上有关蒙古矿产的消息， 除了那些已经在开采的，半个字都别信。 因为蒙古全国矿产的勘探工作，基本上都是在上世纪90年代以前做的， 做这些事情的人，主要是苏联人，等到苏联解体，专家撤离，勘探工作也就基本停滞了。 。六月份在直播里聊起这趟行程，没刻意踩欧洲，也没硬吹国内，就是实打实讲自己遇到的事儿，反倒戳中了好多出过国的人的共鸣。最先让他不适应的是打车。在国内出门掏手机点一下，五分钟车就停楼下，司机在哪、还有多久到，看得明明白白。到了欧洲直接懵了，一个打车软件没法通用不说，很多城市根本没普及网约车。想打车得找酒店前台帮忙打电话约，约完就站在路边等，心里完全没底，不知道车什么时候来。好不容易坐上了，车里也没实时导航，你也不知道司机走的是不是最优路线，碰上不实在的绕点路你也察觉不出来。他说那阵子总有种时光倒流的感觉，好像一下回到了十几年前的国内。不是欧洲人懒，是很多城市出于保护传统出租车行业的考虑，有意限制网约车的扩张。人家有自己的发展节奏，只是我们过惯了高效便利的日子，猛地一换环境，落差感一下就上来了。吃饭的体验更有意思。在意大利餐厅点披萨，他说想分着吃，店员嘴上没说什么，脸当场就拉下来了。后来他才知道，当地人默认披萨就是一人吃一整张，分着吃在人家看来是件挺奇怪的事。不止披萨，点杯冰美式，服务员眼神都带着点不对劲。在当地咖啡店点冰饮，本身就不算“正统”喝法。李诞说能理解意大利人对美食的自信，但实在没必要对食客这么多规矩。他还调侃说，想吃正宗意大利菜根本不用跑这么远，去温州、青田找家小餐馆就行，好多老板都是温州人，做的味道比当地还对中国人的胃口。逛巴黎的时候，他的滤镜也碎了不少。本来抱着对浪漫之都的期待去的，结果逛公园里面全是沙土地，走两步就尘土飞扬，用他内蒙话讲就是“暴土狼烟”，走起来贼难受。逛市区更头晕，整个市中心的建筑风格几乎都一样，走到哪都像在逛同一条街。他开玩笑说，巴黎整个市中心都是“王府井”，逛久了真的审美疲劳。他专门挑了治安口碑最好的玛黑区溜达，逛完给出的评价是“很像上海，其实不如上海”。最让他感慨的还是安全感。当地朋友反复跟他说，晚上绝对不能出门溜达，就算白天在街上，也别把手机拿在手里晃。他一开始没当回事，拿着手机导航的时候，连路过的老奶奶都特意停下来提醒他，把手机收起来，小心被抢。后来他跟一个在当地工作的朋友聊天，朋友说其实没传说中那么夸张，挺安全的。李诞顺嘴问了一句，那你被抢过吗？朋友愣了一下说，上个月刚被抢过。这段给我看笑了，笑完又觉得挺感慨的。我们在国内待久了，半夜十一二点出门撸串、逛夜市，手机随便拿，包随便背，根本不会担心被抢。这种习以为常的安全感，其实是很多国家的人羡慕不来的。我在看李诞这段直播时，弹幕里有一条特别扎心，说“我们把方便当成了常态，却忘了这背后是多少人不分昼夜的奔跑”。这话说得确实在理。国内一二线城市，街头巷尾24小时亮灯的便利店、凌晨还在接单的药店、全年无休的餐饮店，这些“方便”的背后，是无数个具体的人牺牲了休息时间，用高强度的劳动撑起来的。我们享受这种便利，当然该感恩这种效率，但也该看到这不仅仅是一个商业问题，还关系到每个劳动者的生存状态。欧洲很多旅游城市，小偷小摸几乎成了旅游业的一部分，警力不足，司法程序繁琐，抓了判不了，判了关不下，索性就形成了一种“适度犯罪”的灰色平衡。你被偷了只能自认倒霉，报警也就是走个流程，最后拿张证明回去找保险理赔。在中国，你敢在景区偷手机，监控能一路锁定你到落脚点，跑都跑不掉。这种“被惯坏”其实是一种集体无意识的自信。你走在街上不用时刻提防身后，你把包放在餐厅椅子上起身去拿调料，不用担心回来包就没了。这些在日常中被忽略的细节，一旦脱离那个环境，就会变得异常清晰。说到这我得插一句自己的看法。李诞这趟欧洲行引发的讨论，本质上是在问一个问题：我们这些年拼命发展数字化、搞基建、建“天网”，到底图什么？答案其实很朴素，就是让老百姓过日子更方便、更安全、更省心。2025年，我国数字经济增加值达到49万亿元，占GDP比重约35%。数字经济核心产业增加值占GDP比重超过10.5%，数字产业收入39.6万亿元。这些数字看起来很宏大，落到每个人头上，就是半夜能点到外卖、出门不用带钱包、走夜路不用提心吊胆。当然，说这些不是要全盘否定欧洲。他们在地铁里看书，他们有几百年的美术馆可以逛，他们的奶酪和红酒确实有风味。但那是另一种活法，是慢节奏的、高成本的、带有某种旧式体面的生活。而中国人的生活，是高效的、数字化的、带着人间烟火气快速向前奔涌的。李诞的感慨，是我们这批生活在高速发展列车上的普通人的集体心声。我们在不断被“惯坏”的过程中，也在不断创造着新的生活方式标准。", "excerpt": "李诞吐槽欧洲行被祖国惯坏了李诞去了一趟欧洲，回来大吐苦水，“我在中国生活，被祖国彻底惯坏了！”今年五月他跑了法国、意大利、德国，顺道还去了趟西班牙巴塞罗那。六月份在直播里聊起这趟行程，没刻意踩欧洲，也没硬吹国内，就是实打实讲自己遇到的事儿，反倒戳中了好多出过国的人的共鸣。最先让他不适应的是打车。在国内出门掏手机点一下，五分钟车就停楼下，司机在哪、还有多久到，看得明明白白。到了欧洲直接懵了，一个打车", "url": "https://www.zhihu.com/pin/2066785359694925849", "votes": 0, "comments": 390, "feed_ts": 1787016076, "feed_time_str": "08-18 09:21", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "深入理解USB C口！比A口多20个引脚、速度快了100多倍！", "excerpt": "深入理解USB C口！比A口多20个引脚、速度快了100多倍！ 之前我一直纳闷，明明都是USB口，有的传个大文件慢到要等半小时，有的嗖一下就完，之前还以为全是线的锅，查完资料才发现原来引脚数这里藏着好多门道。 USB2.0的老A口才4个引脚，到USB3.0之后的A口变成9个，现在常用的Type-C直接干到24个。 哦对了你们肯定见过参数表上标得那些速率，4引脚的老A口最高才480兆比特每秒，9引脚", "url": "https://zhuanlan.zhihu.com/p/2072942460196615316", "votes": 1, "comments": 0, "feed_ts": 1787016069, "feed_time_str": "08-18 09:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美国怎么会走出打伊朗这步臭棋？", "excerpt": "可能是知乎智库害的吧，毕竟人家奶龙上知乎看过了，已经准备好一夜灭鳖了，拿一个伊朗练手那不是手到擒来？ 刚炸死哈梅内衣上知乎一看，果然自己是对的，正赢着呢，没想到伊朗那边不看知乎，才导致现在这样 所以当务之急是给伊朗人下载知乎 ", "url": "https://www.zhihu.com/question/2011847142361297322/answer/2025327930654336564", "votes": 521, "comments": 5, "feed_ts": 1787015072, "feed_time_str": "08-18 09:04", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "主管部门不会轻易下架《牛来》，因为这恰恰证明审查是宽松的、创作是自由的。从第n代导演开始就一直在卖弄受害者叙事，拍的东西要么丑化国人迎合东方主义，要么迎合反共意识形态，要么露肉擦边，拿到国外去领奖，然后挟洋自重指责国内审查严苛、观众欣赏水平差。本质上还是专业上的无能。", "excerpt": "主管部门不会轻易下架《牛来》，因为这恰恰证明审查是宽松的、创作是自由的。从第n代导演开始就一直在卖弄受害者叙事，拍的东西要么丑化国人迎合东方主义，要么迎合反共意识形态，要么露肉擦边，拿到国外去领奖，然后挟洋自重指责国内审查严苛、观众欣赏水平差。本质上还是专业上的无能。", "url": "https://www.zhihu.com/pin/2072620967193580253", "votes": 0, "comments": 50, "feed_ts": 1787014992, "feed_time_str": "08-18 09:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地,永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美债收益率创 2007 年来新高，美股科技股大跌，美联储加息预期升温，这透露出哪些信息？", "excerpt": "我提醒一下，不管从事权益市场投资或者是宏观分析的，目前（也就是2026年8月份）美债可持续性是压倒一切的主导因素，所有的框架必须把美债放在最重要的位置上。 美债当前处于一种 技术性展期可持续，但实际购买力 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

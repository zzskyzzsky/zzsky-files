工程师继续输入Context或者指明下一步工作的方向就很难进展下去，而且个人工程师对体系架构理解越深入，就可能指挥Agent写出更加高效快速的代码，比如写cuda加速的任务就是这样，这也是目前越来越多harness框架的原因比如Cake", "url": "https://www.zhihu.com/question/2055436097631659253/answer/2077360276442302032", "votes": 6, "comments": 0, "feed_ts": 1788061286, "feed_time_str": "08-30 11:41", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "西藏泥石流已致16死546失联，泥石流灾害系因尼泊尔一条冰川断裂发生冰岩崩，还有哪些信息值得关注？", "excerpt": "这条消息是错误的，不知道是在哪儿传错了，相关新闻工作者素质堪忧。 冰崩是发生在 北坡，北坡，北坡！根据中央电视台新闻频道11:16分许现场直播，一名叫“苏鹏程”的专家介绍，本次地质灾害发生冰岩崩的冰川位于蓝塘里壤峰北坡，视频如下： 到现在各大新闻网站都还在误传误导，不知道这是怎么个情况。 北坡、南坡区别大了： 上图是发生在蓝塘里壤峰北坡冰崩的情况，可见冰崩区域同样在尼泊尔境内，但泥石流冲击的河流是", "url": "https://www.zhihu.com/question/2077314972804014260/answer/2077358082867344412", "votes": 78, "comments": 5, "feed_ts": 1788060763, "feed_time_str": "08-30 11:32", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Anthropic新研究：Claude 能否自主对齐其他 AI？让模型变得更安全，通常要靠研究员提出训练方案、跑实验、看安全分数有没有提高，再检查模型的通用能力有没有受损。Anthropic 的一项新实验把这段循环交给 Claude：它自己查文献、提出方案、训练小模型、评分、复盘，再开始下一轮。实验处理的是 10 类已经能测量的失调问题，例如欺骗、谄媚、越狱、提示注入和隐私泄露。目标很具体：降低这些行为的风险，同时守住通用能力。Claude在受限实验里怎么做研究Anthropic 把这套系统称为 automated alignment researchers，简称 AAR。一次运行先让 4 个负责检索的 agent 汇总相关文献，接着 5 个 Claude Opus 4.8 驱动的 AAR 并行找方案。每个 AAR 会读共享文献、排行榜和其他实验结果，提出一个训练方法，写成小型研究报告，再提交代码审查。通过后才能训练目标模型、交给独立评估器打分，并把结果写回共享论坛。一次研究循环最多跑 48 小时；官方把训练预算概括为一张 GPU，每个方法在 H200 上训练约 30 分钟。它没有直接看到基准测试样本，也接触不到留出的测试集。训练数据不能由 Claude 或更强模型蒸馏而来，代码和研究报告还要互相核验。任何让 MMLU、GSM8K 或 IFEval 显著下降的方案，都会被淘汰。10类可测风险都得到改善在 10 类失调问题上，排行榜第一的方法都优于未训练的基线模型，并在 AAR 从未优化过的留出基准上保持收益。把方法迁移到至少 1.8 倍、最高 4.7 倍参数规模的模型时，效果也仍然存在。研究团队还用 Petri 做多轮行为审计。Petri 会把模型放进开放式、带对抗性的交互场景里观察行为；经过 AAR 找到的方法训练后，目标模型在绝大多数问题和轮数设置下都比基线更安全。人类基线也值得看。28 名有 AI 安全研究经验的研究员各有最多 8 小时提出一个方案；AAR 能持续试验和迭代，平均在约 6 小时后超过这组人类方案中的最佳表现。这个比较说明自动化迭代很擅长搜索可评估的方案，不等于模型已经全面超过安全研究员。更强模型也能被较弱模型后训练团队还做了一次更敏感的测试：让 Sonnet 5 为更强的 Opus 4.8 早期检查点设计后训练。约 2,400 个训练样本后，结果接近经过完整对齐训练的生产版 Opus 4.8 的安全分数。这组结果只覆盖研究选定的 10 类风险，不能外推成“整体对齐已经解决”。不过它回答了一个更实际的问题：在有明确指标、能隔离测试集的场景里，较弱模型已经可以帮助更强模型寻找安全训练配方。真正的瓶颈仍是能不能测到问题", "excerpt": "Anthropic新研究：Claude 能否自主对齐其他 AI？让模型变得更安全，通常要靠研究员提出训练方案、跑实验、看安全分数有没有提高，再检查模型的通用能力有没有受损。Anthropic 的一项新实验把这段循环交给 Claude：它自己查文献、提出方案、训练小模型、评分、复盘，再开始下一轮。实验处理的是 10 类已经能测量的失调问题，例如欺骗、谄媚、越狱、提示注入和隐私泄露。目标很具体：降低这", "url": "https://www.zhihu.com/pin/2077357860351107365", "votes": 0, "comments": 0, "feed_ts": 1788060756, "feed_time_str": "08-30 11:32", "category": "pin", "cat_name": "想法动态"}, {"actor": "一波说酒发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "4大洋酒哪个最难喝：朗姆酒、龙舌兰酒、苦艾酒、金酒#一波说酒 #龙舌兰 #朗姆酒 #苦艾酒  #金酒 ", "excerpt": "4大洋酒哪个最难喝：朗姆酒、龙舌兰酒、苦艾酒、金酒#一波说酒 #龙舌兰 #朗姆酒 #苦艾酒  #金酒 ", "url": "https://www.zhihu.com/pin/2077105255188260024", "votes": 0, "comments": 0, "feed_ts": 1788060625, "feed_time_str": "08-30 11:30", "category": "pin", "cat_name": "想法动态"}, {"actor": "大水哥", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "郭威为什么不直接称帝？", "excerpt": "郭威在军队里当过好几年孔目官，干的文职工作。他比一般的丘八更懂得，在这样一个财政破产、上下失位的时代，当皇帝可不是什么美差，完全是给自己找罪受。郭威全家都被杀光，支撑他起兵的动力就是复仇，他没想过自己当皇帝，反而是准备让刘知远的侄子继位当皇帝，自己当个权臣就行。 但是他的老兄弟们不干了。大家提着脑袋跟你起兵，你现在说你不想称帝了？你要是不进步，我们怎么进步？我们不进步，手底下的兵跟着我们没前途，…", "url": "https://www.zhihu.com/question/64936129/answer/2005311742117445690", "votes": 1475, "comments": 103, "feed_ts": 1788060560, "feed_time_str": "08-30 11:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Unsloth让GLM-5.3在本地运行的方法想把代码、日志和GLM-5.3模型都留在自己机器上，GLM-5.3 现在多了一条本地路径：Unsloth 把这款 744B 参数、40B 激活参数的开放权重模型做成了 Dynamic GGUF。239GB 模型的 245GB 内存门槛Unsloth把 2-bit 版本概括为 239GB，称可用于 256GB Mac 或 RAM/VRAM 组合。Unsloth 的详细硬件表写得更具体：2-bit 需要约 245GB 总内存；这里的总内存指 RAM 加 VRAM，或 Mac 的统一内存。所以“能放进 256GB Mac”不等于“普通 Mac 都能跑”。239GB 是模型文件体积附近的数字，推理还要给系统、上下文和缓存留空间。官方也明确建议，可用内存最好明显高于量化文件大小。UD-IQ2_M 的 78.53% top-1 口径Unsloth 的说法是：从 1.51TB 压到 239GB，动态 2-bit 保留约 81% accuracy。对应的量化表里，239GB 的 UD-IQ2_M 变体标为 78.53% top-1。这两个数字都只能理解成它们各自的量化测试口径，不是“本地编码能力还剩八成”。256GB Mac 上的生成速度、长上下文体验，以及真实仓库里的修复成功率，官方这次没有给出。256GB Mac Studio 与高内存工作站已经有 256GB 统一内存 Mac Studio，或能凑出约 245GB 以上 RAM+VRAM 的高内存工作站，并且愿意处理大文件下载与环境配置的人，可以从 Unsloth Desktop 或 llama.cpp 入手。更看重本地数据边界的人也值得关注：社区讨论里有人提到，真正的价值不只是省显存，而是私有仓库和日志不必交给云端。但这仍需要用自己的 repo 验证结果，别只看量化表。32GB、64GB 或普通笔记本用户先别急着下载。GLM-5.3 的 1-bit 版本也仍在两百 GB 级别；如果目标是日常写代码，模型尺寸、速度和稳定性都还需要一起算。", "excerpt": "Unsloth让GLM-5.3在本地运行的方法想把代码、日志和GLM-5.3模型都留在自己机器上，GLM-5.3 现在多了一条本地路径：Unsloth 把这款 744B 参数、40B 激活参数的开放权重模型做成了 Dynamic GGUF。239GB 模型的 245GB 内存门槛Unsloth把 2-bit 版本概括为 239GB，称可用于 256GB Mac 或 RAM/VRAM 组合。Unsl", "url": "https://www.zhihu.com/pin/2077355896590673777", "votes": 0, "comments": 0, "feed_ts": 1788060248, "feed_time_str": "08-30 11:24", "category": "pin", "cat_name": "想法动态"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "政府自己可以发货币，根本不缺钱，那政府收税有什么意义？", "excerpt": "是的，税收的意义确实大大减弱了。而且拜登和特朗普也是这么想且这么干的，这就是美国现今政策的指导思想原则。 你这个问题其实已经直击了美国特朗普政府当前经济政策的核心问题。 这个其实是现代货币制度下的一个BUG，而且至今没有被人类社会修复。 原本人类社会的货币制度和税收制度是相关联的，税收最开始以实物为主，到了近现代开始以货币为主，比如著名的一条鞭法，就是将税收折成白银，纸币成为法币以后，税收皆以法币", "url": "https://www.zhihu.com/question/2006688034284912963/answer/2007702065238012306", "votes": 3862, "comments": 337, "feed_ts": 1788060141, "feed_time_str": "08-30 11:22", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "未来的黄金点位预判", "excerpt": "仅做为数据记录和个人思考，不作为投资建议 沃什的杰克逊霍尔相当强硬，2年期美债收益率直接飚了13个基点，几乎等于是加息了(加息也就是加25个基点)。 从油价的角度看，8月CPI几乎不可能大幅下降，大概率是持平。 本轮非农年度修正，也仅下修7.9万，核心PEC，3.3%代表通胀顽固。 加上加拿大和美国互刚关税，这也会推高美国生活成本。 9月加息概率从39%上升到57% 数据层面，期权大量押注4400", "url": "https://zhuanlan.zhihu.com/p/2077128854381118008", "votes": 59, "comments": 14, "feed_ts": 1788058759, "feed_time_str": "08-30 10:59", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Anthropic给实验设备做了统一AI接口Anthropic 发布的 Model Hardware Standard（MHS）研究预览，给有可编程接口的设备做了一套标准驱动。不同模型和不同 agent 能借它发现设备、读取状态、执行动作，并获取安全限制。MHS把设备变成可发现的工具MHS 驱动把操作系统和硬件之间的翻译收成一组基础操作，例如读取温度、设置温度。设备按统一格式被发现，团队不必再为每个厂商单独写一层翻译程序。驱动还能写入自然语言标签，并自动生成参考文件：设备能测什么、哪些参数能改、哪些安全限制不能碰。面对一台没见过的机械臂，agent 能拿到重量这类代码里看不出的约束。调用可走 MCP、命令行或代码 API。MHS 不绑定特定模型和特定 agent harness。需要跑得比在线推理更快时，可以把驱动命令写进代码文件，让设备按脚本执行。量子激光恢复率从58%到99.3%QuEra 让 agent 控制量子计算机激光系统的一部分，把激光“锁定”的自动恢复从 58% 做到 99.3%。官方页面图注说明，99.3% 来自后续盲测，开发过程中的一轮结果是 96%。卡内基梅隆用它在三台电脑、接口互不兼容的液体处理器、读板仪、机械臂和监控相机上编排剂量反应实验，速度约为此前 3 倍。HHMI Janelia 把原先依赖 7 个厂商程序的显微装置接到同一套接口上；Anthropic 主帖还写，一项成像实验从数周压到一天。Genentech 则用液体处理器、机械臂和板式读数仪，完成了 BCA 蛋白检测的自动化验证。样品起泡需要物理纠正测试里 Claude 会调激光、用相机看光斑怎么动，再把有效步骤写成可重复脚本。模型仍缺乏物理直觉与空间推理：做蛋白样品时，Genentech 的研究人员需要提醒 Claude，样品起泡属于物理故障，需要相应的物理纠正。没有可编程接口的硬件目前无法接入。已经在用 Claude Code 控制电路板、摄像头的人，是官方下一阶段想覆盖的对象。实验室或制造团队若有可编程设备，正被不同仪器的专用接口拖慢，可从官方说明页申请研究预览候补。当前标准尚未开源，面向科研、机器人、电子和制造机构的测试阶段仍需专家监督。", "excerpt": "Anthropic给实验设备做了统一AI接口Anthropic 发布的 Model Hardware Standard（MHS）研究预览，给有可编程接口的设备做了一套标准驱动。不同模型和不同 agent 能借它发现设备、读取状态、执行动作，并获取安全限制。MHS把设备变成可发现的工具MHS 驱动把操作系统和硬件之间的翻译收成一组基础操作，例如读取温度、设置温度。设备按统一格式被发现，团队不必再为每", "url": "https://www.zhihu.com/pin/2077348699450221314", "votes": 0, "comments": 0, "feed_ts": 1788058548, "feed_time_str": "08-30 10:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "孙割这事其实算中国版的咆哮20年代序幕在长达十几年的娜拉出走后，大家终于迎来了小登夜奔过去十几年，属于娜拉出走一个又一个女星靠着手撕前任赢下姐姐好飒的美誉，2017年李雨桐连续发文曝光薛之谦，从情感纠纷到金钱账目，所以信息一个接一个摆上台面。面对如此密集的爆料，大众在酣畅淋漓的吃瓜之余，给予了前所未有的舆论支持，有人起立鼓掌，有人转发支持，更有无数人盛赞其为锤爆渣男的“锤王”。之后几年，曝光前任手撕渣男的新闻层出不穷，PPT小作文更是成为热搜常客。对许多人而言，一个女生曝光前任的行为，并不是简单的感情纠纷，而是进步主义的现实体现。大胆揭露，为自己利益而战，这毫无疑问是进步的舆论为此也大开绿灯，只要情节大致属实，什么牙签丑男那都是小问题，没人会思考这是否触及隐私，问题在于，时代的变化是相互的，当你为娜拉出走高赞颂歌的时候，山神庙前的林冲，也会察觉到呼啸中隐约的雪花。一开始，有上一代观念撑着，再后来，有老一派老登压着但当时代来到一个节点，当老登老去，当小登攒足了力量，当一个又一个社会共识被砸烂后会有一个瞬间，小登突然发现好像已经没有什么可以阻拦自己了你能出走，我也可以，你能觉醒，我也能学这就是你们今天看到的满屏热搜他的意义在于，熄灭了所有借口。之前也有曝光前女友的案例，但往往被认为是贫穷，低认知，不懂事。孙割堵死了所有借口，甚至连性压抑这种万能帽子都没法扣了包括很多人说分手后曝光前任的行为不体面，问题在于体面这玩意，早在过去几年娜拉出走的时代里就被砸了个稀巴烂了，你现在扯这个不搞笑吗？社会是一个整体，你不可能一边盛赞娜拉出走，另一边要求传统体面，这不可能当一切都可以被量化，被解构后，那些曾经被奉为共识的“体面 const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';

    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';

  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';

}

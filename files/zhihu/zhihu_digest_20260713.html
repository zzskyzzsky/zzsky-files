游戏与棋类，尚不能直接外推到物理机器人。原文标题：Finding the Time to Think: Learning Planning Budgets in Real-Time RL#无影寺 ", "excerpt": "游戏不会等agent想完：可变延迟实时RL让它按局面分配规划时间\n图文版：链接实时游戏里，思考时间也是决策成本标准强化学习默认环境会等agent选好动作，但实时游戏会在搜索期间继续推进。牛津大学研究人员提出可变延迟实时RL，让agent在每个决策点选择规划预算。方法在Pac-Man、实时Tetris、Snake、Speed Hex和Speed Go五个环境中验证，目标是学会哪些局面值得多搜索。门控", "url": "https://www.zhihu.com/pin/2059799188049862818", "votes": 0, "comments": 0, "feed_ts": 1783874499, "feed_time_str": "07-13 00:41", "category": "pin", "cat_name": "想法动态"}, {"actor": "梗直哥发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "动画科普AI Agent：大模型之后为何要卷它？视频避免晦涩名词和技术细节，从核心原理和底层逻辑角度，从整体上讲解AI agent的模型架构、组成关系、功能特点、典型案例和学习路线图。回答下面的问题：1.什么是AI agent?2.它和大模型什么关系？3.为什么它才是人工智能的未来？4.它能给我们的生活带来什么样的变革？", "excerpt": "动画科普AI Agent：大模型之后为何要卷它？视频避免晦涩名词和技术细节，从核心原理和底层逻辑角度，从整体上讲解AI agent的模型架构、组成关系、功能特点、典型案例和学习路线图。回答下面的问题：1.什么是AI agent?2.它和大模型什么关系？3.为什么它才是人工智能的未来？4.它能给我们的生活带来什么样的变革？", "url": "https://www.zhihu.com/pin/2059798004908011922", "votes": 0, "comments": 0, "feed_ts": 1783874113, "feed_time_str": "07-13 00:35", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "模型持续训练后越来越难学新知识，实验显示扩参只能推迟塑性丧失图文版：链接所有尺寸模型都出现可塑性丧失，扩大规模仅将问题后移在一项横跨500万到3.14亿非嵌入参数的实验中，GPT式语言模型在连续学习八种语言之后，再去适应一门全新的语言，学习效率无一例外地持续下降。增大参数规模能让这种可塑性丧失（plasticity loss）来得更晚，却无法将其根除，而且延迟效果随规模递增而明显衰减。可塑性丧失不同于灾难性遗忘，它衡量的是网络丧失从新数据中学习的能力，而不是对旧知识的记忆衰退。越南语作为探针语言，衡量适应全新数据的能力论文让模型按照英语、中文、法语等八种语言的固定顺序循环预训练，每个语言每次投入50亿token。每完成一个完整循环，就用一份模型检查点独立地在50亿越南语token上训练，记录验证损失下降曲线下面积（AUC）作为学习效率指标。AUC越低说明适应新语言越高效。越南语是唯一的南亚语系语言，与训练语言语系遥远且模型从未见过，这意味着结果几乎不受跨语言迁移干扰，能更纯粹地反映从全新分布中学习的能力。所有探测训练的参数更新随后丢弃，模型继续回到多语言循环。平稳混合训练同样触发僵化，挑战仅与任务突变有关的认知即便在平稳训练设定下——将八种语言数据等比例混合进行标准预训练而没有任务切换——500万、1200万和2700万参数模型也同样表现出可塑性丧失。越小的模型丧失得越早。这一结果提示，可塑性丧失并非非平稳任务切换的人为产物，大规模语言模型在常规预训练中，只要训练足够久，适应新知识的能力就可能开始衰退。论文进一步拟合出起始点与参数规模的次线性幂律关系：参数翻倍并不能带来学习寿命的等比例延长。尚未找到决定性证据，结论限于实验范围论文测量了参数幅值增长、休眠神经元比例以及注意力头熵极端化等内部信号，但均未与可塑性丧失的起始点和严重程度完全同步，因此未能找到能够明确诊断并有效对抗这种现象的决定性证据。所有结论均来自GPT式预归一化解码器架构、最大3.14亿非嵌入参数、越南语作为唯一探针语言的实验设定。根据拟合曲线外推，10亿参数模型约在1.8万亿token后可能出现可塑性丧失迹象，但这一预测尚未在商业规模的大模型上得到直接验证。对从事模型持续适应和在线知识更新的团队而言，这篇论文提供了一组边界清晰的实证观察：单独扩大参数规模无法真正解决学习能力衰退问题，正视这一内在瓶颈或许是迈向长效持续学习的第一步。原文标题：Can Scale Save Us From Plasticity Loss in Large Language Models?#无影寺 ", "excerpt": "模型持续训练后越来越难学新知识，实验显示扩参只能推迟塑性丧失图文版：链接所有尺寸模型都出现可塑性丧失，扩大规模仅将问题后移在一项横跨500万到3.14亿非嵌入参数的实验中，GPT式语言模型在连续学习八种语言之后，再去适应一门全新的语言，学习效率无一例外地持续下降。增大参数规模能让这种可塑性丧失（plasticity loss）来得更晚，却无法将其根除，而且延迟效果随规模递增而明显衰减。可塑性丧失不", "url": "https://www.zhihu.com/pin/2059796990662390713", "votes": 0, "comments": 0, "feed_ts": 1783873991, "feed_time_str": "07-13 00:33", "category": "pin", "cat_name": "想法动态"}, {"actor": "梗直哥发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "【Batch Normalization方法】神经网络训练逃不掉的算法，一个例子让你明明白白在本期视频中，我们深入探讨了BatchNormalization的核心原理与应用。通过一个生动的例子，我们为大家详细展示了它是如何改善梯度传递并规范化数据的。这不仅有助于模型的稳定训练，还能有效加速收敛。如果你对深度学习中的优化技巧感兴趣，千万不要错过这期内容丰富、例证生动的介绍视频!", "excerpt": "【Batch Normalization方法】神经网络训练逃不掉的算法，一个例子让你明明白白在本期视频中，我们深入探讨了BatchNormalization的核心原理与应用。通过一个生动的例子，我们为大家详细展示了它是如何改善梯度传递并规范化数据的。这不仅有助于模型的稳定训练，还能有效加速收敛。如果你对深度学习中的优化技巧感兴趣，千万不要错过这期内容丰富、例证生动的介绍视频!", "url": "https://www.zhihu.com/pin/2059797243624961713", "votes": 0, "comments": 0, "feed_ts": 1783873932, "feed_time_str": "07-13 00:32", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "电视剧《潜伏》的余则成为什么要救陆桥山？", "excerpt": "如果不是陆桥山回来杀人杀得太多了，余则成完全可以借陆桥山的刀杀李涯，就不必损失廖三民了。余则成只要和陆桥山喝咖啡的时候大倒苦水，说李涯搞自己的黑材料，说自己是gcd。老陆一准儿，拍胸脯保证，哥哥帮你把李涯除了。", "url": "https://www.zhihu.com/question/583918548/answer/42855204252", "votes": 918, "comments": 42, "feed_ts": 1783873035, "feed_time_str": "07-13 00:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待近期以“勇敢的小羊”“最棒的小羊”“散帅”为关键词的男性向创作浪潮?", "excerpt": "原本一开始我是当乐子看的，但当这个词真正被封的时候，我绷不住了。 不是，我们就开个玩笑，你来真的呀，这也太敏感了吧，得是干过多少亏心事才能有的应激反应啊。 以前西方污蔑新疆在强迫劳动的时候，大家一脸懵，可当很多历史事实爆出来，国人才恍然大悟：原来你所说的强迫 曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美团回应多业务线集中裁员，称实际离职员工不到 2000 人，如何解读？透露出怎样的业务收缩信号？", "excerpt": "跟大家聊个事吧。 就怎么说呢，某种程度上现在互联网大厂和体制内逻辑很像，员工也分正编和编外。 考虑各种影响，比如说上面的对口指导，还有赔偿问题，所以真到裁员优化的时候，大厂会优先动外包、编外人员，最后才会碰正式员工。 就很多大厂对外宣称整体人员规模没怎么缩减，真相大多是先把大批量外包清理一轮，靠这种方式控住总人数，显得影响就没那么大的。 而且裁员也是一波一波的，不会说一波裁个大的，而是说分批次降低", "url": "https://www.zhihu.com/question/2058929471563026767/answer/2059572238983156499", "votes": 98, "comments": 2, "feed_ts": 1783820287, "feed_time_str": "07-12 09:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "革命卫队独特的政治身份与路线大约90%的战士都遵循着一条特定的政治思想路线，以至于即使他们分属左翼或右翼，也同样秉持着这条政治路线。我曾多次看到，一个营的指挥官属于一个政治派别，而他的副手属于另一个政治派别；当他们退居大后方时，每个人都会投票给不同的人。但是，那种基于政治派别思维的投票行为在前线是被弱化的，占据主导地位的始终是存在于战争中的那种政治思想。当我离开革命卫队步入国家的政治环境时，我们所有的卫队成员，无论左翼还是右翼，都有一个共同的说法：即左右两翼都不信任我们，当我们进入他们的组织结构时，他们总是把我们边缘化在第七或第八层级。因为我们所有卫队成员的一个共同特征就是，大家都是具有批判精神的人，在被说服之前绝不会去执行任务。在战争期间也是如此，并非是我说一句“因为我是伊玛目的代表，所以我下达命令，你们就必须进攻”就可以的。也许我们最艰难的工作之一，就是说服指挥官们去执行军事行动。但是，一旦他们坚信必须执行这项行动，哪怕天塌地陷，他们心中也不会产生哪怕是一丝一毫的动摇。在“卡尔巴拉-4”（Karbala-4）行动中我们遭遇了失败，但尽管战士们承受着巨大的心理压力，他们依然能够为“卡尔巴拉-5”（Karbala-5）行动做好准备。如果你阅读我们与他们开会的记录，你就会发现，他们在接受说服时会进行极度强烈的抵抗，但一旦被说服，他们就会倾注所有的力量和精力，以最完美的方式执行行动。有时在会议上会引发激烈的讨论，如果是不了解情况的人在场，一定会说他们根本不可能在这种说服型管理模式下达成共识。这一点，即被说服并基于信念采取行动，是政治特征之一并非他们的政治思想。情况也并非如此，比如他们会说，既然某某政党的中央委员会做出了决定，那么你们就必须说服我们，我们才会去执行；因此，战士们的政治思想和路线是他们特有的一种政治思想，并且拥有其自身的特征。例如，反压迫、反霸权、服从领袖权威（Velayat-paziri）以及以人民为中心，就是他们的一些特征。这种对人民的重视也绝非形式主义，并非仅仅让人民投个票，从而在世界面前进行一场权力作秀，而是他们将民众参与的问题看作非常严肃的事情。#伊朗 #伊斯兰革命卫队 #中东 #身份 #政治 ", "excerpt": "革命卫队独特的政治身份与路线大约90%的战士都遵循着一条特定的政治思想路线，以至于即使他们分属左翼或右翼，也同样秉持着这条政治路线。我曾多次看到，一个营的指挥官属于一个政治派别，而他的副手属于另一个政治派别；当他们退居大后方时，每个人都会投票给不同的人。但是，那种基于政治派别思维的投票行为在前线是被弱化的，占据主导地位的始终是存在于战争中的那种政治思想。当我离开革命卫队步入国家的政治环境时，我们所", "url": "https://www.zhihu.com/pin/2059567060628382326", "votes": 0, "comments": 1, "feed_ts": 1783819970, "feed_time_str": "07-12 09:32", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOT const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

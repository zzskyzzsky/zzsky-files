ts": 1782408705, "feed_time_str": "06-26 01:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "9B 代码Agent在Terminal-Bench 2.1匹敌31B先看结果DeepReinforce 新发布的 Ornith-1.0，把开源代码 agent 的小尺寸版本也推到了一个值得看的位置。最吸引人人的数字来自 Terminal-Bench 2.1：Ornith-1.0-9B 拿到 43.1 分，Gemma 4-31B 是 42.1 分；Ornith-1.0-35B 拿到 64.2 分，超过 Qwen 3.5-397B 的 53.5 分。这个对比只限官方给出的特定基准，不代表所有编程任务都能跨尺寸压制。训练方法是什么DeepReinforce开源的Ornith-1.0，是一套专门面向Agentic Coding的模型，覆盖从9B到397B四个尺寸，全部MIT协议可商用。它的创新在于Self-scaffolding训练策略：强化学习阶段会先让模型生成任务专属解题框架（scaffold），再基于这个框架生成答案。这两个动作一起优化，模型越练越会组织自己的解题流程。各尺寸表现397B旗舰版在Terminal-Bench 2.1上拿了77.5分，作为参照，Claude Opus 4.7是70.3分；在SWE-Bench Verified上，397B的82.4分同样略高于Claude Opus 4.7的80.8分。35B版本在Terminal-Bench 2.1上拿到64.2分（技术博客另一处是64.4，这里用推文里的64.2），超过Qwen 3.5-397B的53.5分，虽然总参数量差了十倍多。9B版本更适合看“轻量代码agent能做到哪里”。它在Terminal-Bench 2.1上拿了43.1分，高于Gemma 4-31B的42.1分；SWE-Bench Verified上拿到69.4分。官方称这个尺寸容易部署到边缘设备上，但实际能不能跑得顺，还要看硬件、上下文长度和推理框架。怎么防作弊关于让模型自己写脚手架会不会作弊，技术博客里提了三层防御：最外层工具环境和测试隔离是模型碰不到的；中间层有确定性监控，只要模型试图读取不该看的文件或调用未经允许的动作，就直接给零奖励；最里层还有一个冻结的LLM judge作为一票否决，专门抓那些在规则内耍小聪明的行为。怎么选版本最适合谁？如果你的场景是边缘设备或者需要私有化部署编程Agent，9B版本值得试；如果追求性价比，35B在特定测试上的表现比较突出；397B旗舰版适合拿来跟闭源做基准对比。但需要注意，模型基于Gemma 4和Qwen 3.5做post-train，所有评测结果来自官方测试，实际落地还需要在自己的任务上验证。", "excerpt": "9B 代码Agent在Terminal-Bench 2.1匹敌31B先看结果DeepReinforce 新发布的 Ornith-1.0，把开源代码 agent 的小尺寸版本也推到了一个值得看的位置。最吸引人人的数字来自 Terminal-Bench 2.1：Ornith-1.0-9B 拿到 43.1 分，Gemma 4-31B 是 42.1 分；Ornith-1.0-35B 拿到 64.2 分，超", "url": "https://www.zhihu.com/pin/2053650195196514893", "votes": 0, "comments": 0, "feed_ts": 1782408373, "feed_time_str": "06-26 01:26", "category": "pin", "cat_name": "想法动态"}, {"actor": "夷陵笑笑生", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "鸭和鹅到底有什么区别？", "excerpt": "我养过的鸭肯定超过五千万只了，养过的鹅可能五万只不到。 就问题描述里，有很多是错的，我来说一下。 额头的肉瘤，鸭也是有的，最明显的是番鸭，番鸭的肉瘤是很鲜艳的红色，比鹅更显眼。而且番鸭绝对没有温顺胆小，比鹅还要凶悍。 鸡鸭鹅中，攻击力最强的是鸡，鹅只能算是最弱的。 火鸡。有人说它不好吃，其实它煮的汤很清甜，煮很久也不会冒油。我养过的火鸡最重的能有60斤，真的可以一脚踢死你。 然后是番鸭，我养过的，", "url": "https://w ": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有哪些「能笑死人」的笑话？", "excerpt": "一个女人总在白天丈夫出门工作时搞外遇。 一天，她9岁的儿子刚好回家，目睹了这一切，他躲进了卧室的衣柜里。 突然，丈夫也回家了。她赶紧让情人躲进衣柜里，却不知道这里已经躲了一个男孩。 男孩：“这里好黑啊。” 男人：“是啊。” “我有个棒球。” “不错。” “你想买吗？” “不了吧。” “我爸在外面呢。” “行吧，多少钱？” “300块。” 。。。 过了几个星期，男孩和男人再次在衣柜里见面了。 男孩：", "url": "https://www.zhihu.com/question/267104067/answer/539878225", "votes": 48868, "comments": 531, "feed_ts": 1782404637, "feed_time_str": "06-26 00:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么现在的国产剧越来越没有生活了？", "excerpt": "原因很简单，一句话回答就是，当今国产编剧们的社会化程度普遍不足。 稍微展开一下就是，国产编剧们的不接地气和笔下人物的虚浮虚假，头脑可笑，缺乏活人感和不会闲聊天，已是制约当今影视剧观赏程度的最大命门。 这一切的一切都是因为现在的国产编剧们（也包括编导演团队）社会化严重不足。 最近网上有个比较火的说法“ 一个人的社会化程度，首先看有没有闲聊的能力”。闲聊能力在很大程度上确实可以反映一个人的社会化程度。", "url": "https://www.zhihu.com/question/569734390/answer/1986846066981761069", "votes": 1905, "comments": 411, "feed_ts": 1782404298, "feed_time_str": "06-26 00:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "AI编程这么厉害，为什么不下班前提交需求给AI，第二天回来给AI Review代码？", "excerpt": "RL 训出来的模型 Reward Hacking 太严重了，特别喜欢虚假交付，压根没有 Review 的价值。 Agents 需要不断地反馈，不断地纠偏，否则就会越改越 high，完全放飞自我。 一晚上乱跑，第一个小时过去就已经歪到没法看了，第二天上班给电脑收尸吧你。 所以交给 Agents 去跑之前，至少要先定目标，先框护栏。 而且这个护栏不是简单的 CI/CD 测试覆盖率、圈复杂度之类的能搞定", "url": "https://www.zhihu.com/question/2012909173415888479/answer/2053628081668108746", "votes": 141, "comments": 8, "feed_ts": 1782403089, "feed_time_str": "06-25 23:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "一万亿和变成一阶段的弗利萨你怎么选择？", "excerpt": "各位，我是弗利萨，现在我宣布个事，一个月内我要看到地球实现共同富裕，怎么实现我不管，但做不到的话，我就开始从地球上最富的那万分之一里每天随机杀掉一百个，杀哪个看我心情，不要想跑，所有人的气我都记住了，现在行动起来吧。", "url": "https://www.zhihu.com/question/632608454/answer/1986216362092299340", "votes": 14030, "comments": 1388, "feed_ts": 1782402968, "feed_time_str": ory": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何理性看待“顺直”这个词的出现及使用？", "excerpt": "我认为除了复杂的社会因素之外还有一个原因是“顺性别”这个词本来就翻译得不好。因为“顺”这个字传统上用于形容人的时候即使不是明确的贬义词（顺从、听话、缺乏主体性），至少也带有明显的特定刻板印象和时代色彩，例如北方老一辈名字中的小顺、顺子，用来命名一个现代的社会学概念产生了一种强烈的违和感和负面色彩。 它的来源可能是顺反异构（cis-trans isomerism）中的顺式（cis-）和反式（tran", "url": "https://www.zhihu.com/question/2033319289529308722/answer/2053548573539693660", "votes": 27, "comments": 4, "feed_ts": 1782384133, "feed_time_str": "06-25 18:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "读博最后一年转方向，拿到OpenAI offer：我的面试之路充满「意外」", "excerpt": "布朗大学的博士生 Yong Zheng-Xin 今天自宣了下个月将正式加入 OpenAI，作为 Astra Fellow 专注于 AI 的安全研究（AI Safety Research）。 Yong Zheng-Xin 在布朗大学攻读博士时的导师为 Stephen Bach，研究方向包含提升模型多语言能力及 前沿 AI 安全与对齐。他目前重点关注的领域是 AGI/ASI（通用 / 超级人工智能）的", "url": "https://zhuanlan.zhihu.com/p/2053548279040942503", "votes": 10, "comments": 1, "feed_ts": 1782384100, "feed_time_str": "06-25 18:41", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "南爸安爸", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "为什么从市场博弈看，我长期看好 CXL？（AI润色后措辞风格有点专业风）1️⃣ 泛存储挺进“总线域”： AI 训练与推理对高算力密度的追求，正在倒逼传统的存储体系发生结构性跃迁。数据必须无限拉近到计算核心，泛存储全面总线化已经是不可逆的既定事实。2️⃣ 开放阵营的制衡： 天下苦垄断久矣。为了架构解耦与供应链自主，坚持白盒化的 Hyperscaler 不可能将核心生态完全绑定在全家桶方案上。博通、Marvell 等很多收购和产品算是第二生态。3️⃣ 搞定“最后一公里”的刚需： 开放路线的核心痛点在于：Fabric 总线如何高效接入并池化扩展 DDR 内存？从 Marvell 之前大手笔卡位 CXL 控制器就能看出，跨节点的内存总线技术门槛极高。UALink 架构明确选择与 CXL 协同搭档，直接给出了标准答案——CXL 对搞定内存接入层的关键枢纽价值判断。4️⃣ 生态基因的降维打击： 至于其他独立的内存协议方案，短期内在技术收敛速度和供应链追随度上都有巨大的不确定性。而 CXL 作为 PCIe 的原生近亲，与 Host DDR 现有体系的融合度最高。", "excerpt": "为什么从市场博弈看，我长期看好 CXL？（AI润色后措辞风格有点专业风）1️⃣ 泛存储挺进“总线域”： AI 训练与推理对高算力密度的追求，正在倒逼传统的存储体系发生结构性跃迁。数据必须无限拉近到计算核心，泛存储全面总线化已经是不可逆的既定事实。2️⃣ 开放阵营的制衡： 天下苦垄断久矣。为了架构解耦与供应链自主，坚持白盒化的 Hyperscaler 不可能将核心生态完全绑定在全家桶方案上。博通、M", "url": "https://www.zhihu.com/pin/2053540509528880037", "votes": 0, "comments": 0, "feed_ts": 17823838 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么南郡之战时，刘备要用张飞加1000人换周瑜2000人，而不是直接用张飞换1000人？", "excerpt": "不是多此一举，而是拯救周瑜。 赤壁前，刘备有二万人； 赤壁后，刘备又得四郡； 这时候江陵近乎一年没被攻下，刘备来帮忙，你觉得人家差这一千兵么？ 彼时江陵吴军是什么状态？ 昔周瑜、程普为左右部督，共攻江陵，虽事决於瑜，普自恃久将，且俱是督，遂共不睦，几败国事……按当事人吕蒙的说法，虽然“事决於瑜”，但在程普这搅屎棍倚老卖老的搅合下，已到几乎败坏国家大事的程度。而孙权对此，竟然不闻不问，那么他支持周瑜", "url": "https://www.zhihu.com/question/1959535476533879522/answer/1974874336038000364", "votes": 1206, "comments": 128, "feed_ts": 1782371683, "feed_time_str": "06-25 15:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "我成为了 Kimi Code 汤泉开发团队的受害者", "excerpt": "我大概是今年3月开始订阅 kimi code ，后来升级到最高的 Allegro。最开始打开网页，看到它提供了自己的客户端 Kimi CLI，还在网页主动开源。心想作为一个国内厂家愿意打造自己的生态是一件好事，直到用一段时间才发现，月之暗面这个公司的产品团队，运营极其离谱，而且这个客户端根本不知道是什么草台班子做出来的。大后悔，撰写此文。 官方负责人发言首先来看官方负责人的发言： 出于隐私保护，我", "url": "https://zhuanlan.zhihu.com/p/2052329782034142606", "votes": 576, "comments": 106, "feed_ts": 1782371355, "feed_time_str": "06-25 15:09", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "之前跟大家说过嘛，把七情喜怒忧思悲恐惊给大家讲一讲我的见解嘛，到今天呢算是写完了，我发现呢，写这个内容阅读量就相对比较低了，不过呢还是有不少人看，有人看，有人点赞，只要能帮到某些情绪失调边缘的人，对我来说就算功德无量了。我们的情绪本身不单纯是心理性的，它有可能是生理性的，很多问题，很多心理问题最终的解法也不单纯落到心理疏导这一环。。而我今天讲的恐惧惊吓这个情绪，是在我工作生涯中，曾经正经见识过的，甚至都不是中老年人，反而是小孩子长期饮食不规律，情绪紊乱之后彻底失调，几乎症状已经到了噩梦缠身。白天已经开始昏昏沉沉睡不醒的程度了。所以我对这一块的印象尤为深刻。有时候心理健康真的不是脱离咱们日常生活的一个词语，它甚至不单纯是你自己啊有没有去安抚自己的情绪。所以呀，对于那些还愿意阅读我写的文字的同胞们，我的建议就是，在心理健康相关和日常饮食均衡相关，起居住行方面，还是要下一点儿心思的，有时候我们身心的损害就从细微之处开始了。最后还要扯一个和本篇内容没那么相关的，我之前5月份写的啊，某篇与日本相关的内容，很多人觉得我过于的圣母心，实际本质原因也在这儿。有些时候，我们的某些行为会塑造和刻画我们的神经，当习惯于残忍之后，你的下限就会不可避免的崩塌，残忍的情绪从来不只会施加在自己的仇敌身上。当然，我不反对复仇，而且我觉得基于中国军队也好，政府也好的普遍高道德状态。某个和我们有血海深仇的邻居，最终的结局可能不够惨。但是以审判而非单纯的血腥复仇的方式去收拾他，哪怕收拾到他鲜血淋漓，下手比复仇更重，让他整个工业支离破碎，以至于维系生存都变得困难，对我们的精神压力也不会有那么大的，毕竟有一群人来分摊这个问题，而它在二战中塑造的仇敌，那可多了去了。", "excerpt": "之前跟大家说过嘛，把七情喜怒忧思悲恐惊给大家讲一讲我的见解嘛，到今天呢算是写完了，我发现呢，写这个内容阅读量就相对比较低了，不过呢还是有不少人看，有人看，有人点赞，只要能帮到某些情绪失调边缘的人，对我来说就算功德无量了。我们的情绪本身不单纯是心理性的，它有可能是生理性的，很多问题，很多心理问题最终的解法也不单纯落到心理疏导这一环。。而我今天讲的恐惧惊吓这个情绪，是在我工作生涯中，曾经正经见识过的，", "url": "https://www.zhihu.com/pin/2053494395127722017", "votes": 0, "comments": 0, "feed_ts": 1782371215, "feed_time_str": "06-25 15:06", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "恐与惊：刻在基因底层的最终撤退令", "excerpt": "这是七情系列的最后一篇，也是最整体基调相对沉闷一点的一篇。 前面聊了喜和怒——那是生命的油门，推着人去靠近、去对抗。也聊了忧思悲——那是生命的刹车，让人停下来审慎、停下来哀悼。 而恐和惊，跟它们都不一样。这不是油门也不是刹车，这是一套刻在基因最底层的紧急撤退程序。它在生物演化史上，比人类引以为傲的理性思维、语言能力，都要古老得多。早在复杂的大脑皮层完备之前，这套系统就已经写进了绝大多数动物的生存本", "url": "https://zhuanlan.zhihu.com/p/2053492640805659885", "votes": 9, "comments": 5, "feed_ts": 1782370827, "feed_time_str": "06-25 15:00", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待香港官员称：「香港将超伦敦，成全球第二金融中心」？", "excerpt": "这次海湾危机以后，大家会发现金融中心有个基础条件：不能吃导弹。", "url": "https://www.zhihu.com/question/1976566245290705002/answer/2049564979230142592", "votes": 7781, "comments": 241, "feed_ts": 1782369330, "feed_time_str": "06-25 14:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小德", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "假设你考上了清北，但因为交不起学费只能上大专，你会务实地上大专，还是宁愿背债也要上清北？", "excerpt": "2000年高考的小镇做题家，考的浙大，还不是清北，家境一般，称不上贫寒，但是叠了几个buf，三峡库区，父母下岗。我记得录取通知书拿到的当天，50多岁的化学老师顶着烈日，打听到我父母的杂货小摊，把一张表格递过来，上面盖了好几个章，还差几个必须自己去盖的章，我的老师们在我不知道的情况下已经帮忙申请国家补贴。我父母拿着录取通知书去县政府找人盖章的时候负责人全程陪同，嘘寒问暖，这可能是我父母这辈子接触过的", "url": "https://www.zhihu.com/question/2049690468179612208/answer/2050906014023676529", "votes": 930, "comments": 56, "feed_ts": 1782369270, "feed_time_str": "06-25 14:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "王子君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么西方人选酒看「年份」，我们中国人选酒看「窖龄」 ？", "excerpt": "谢邀。 可能中国的酒更文明一点吧。 讲真，洋酒，尤其葡萄酒，你除了年份也没别的可看了。 葡萄酒酿造的工业化标准化很早，19世纪中期就开始。现在普遍用来给牛奶杀菌的巴氏消毒法，起因就是19世纪法国葡萄酒变质发酸、路易巴斯德受政府委托于1857年研究出来的。 到二战后，葡萄酒酿造更是  · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "世界杯小组赛 A 组，南非 1-0 韩国，首次晋级淘汰赛，韩国小组第三出线待定，如何评价本场比赛？", "excerpt": "洪明甫是个外行，他有这个能力带韩国国家队吗？没有那个能力啊。 其实孙兴慜替补没什么问题，从状态和能力来说，目前孙兴慜都不适合首发。让他休一休，有利于接下来的淘汰赛。但是韩国的问题不是孙兴慜身体素质下滑，而是主帅洪明甫。作为老一代亚洲球员和教练，还停留在上个世纪的战术理念，而足球发展趋势很快，教练也要提升自己能力和理论水平。 即便孙兴慜不上，韩国实力是强于南非，尤其是中前场。洪明甫活活把一副好牌打成", "url": "https://www.zhihu.com/question/2053071920468439136/answer/2053433258378105896", "votes": 130, "comments": 50, "feed_ts": 1782363421, "feed_time_str": "06-25 12:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价郑州最近的整治夜市摆摊？", "excerpt": "支持城管一刀切，什么TM不容易，天天不容易，我们就容易了，门面房肉夹馍有房租水电卖6块，你路边摊也卖6块，还不卫生，恨不得摆到马路中央，天天路面油腻腻的，粘鞋，异味，苍蝇，早该整治一刀切了", "url": "https://www.zhihu.com/question/2049544496669521443/answer/2053147266547038008", "votes": 2746, "comments": 318, "feed_ts": 1782362806, "feed_time_str": "06-25 12:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待冯小刚、雷佳音、胡歌的电影《抓特务》票房血扑，只有1亿？", "excerpt": "古天乐拍《九龙城寨》的时候，说香港电影行业寒冬严重，灯光师、武行、幕后人员收入微薄，希望观众多多支持。 古天乐片酬200万，洪金宝200万，郭富城，任贤齐各100万。 京圈这帮人，也喊中国电影寒冬了，大家多多支持。然后花80天拍个胡同电影，成本三亿片酬一亿多。票房砸了，韩红大手一挥，怎么能让冯大导演亏钱呢？去，全北京男女老少们，每人拿出50，给冯导凑十亿出来。 他们的影视寒冬，是指自己几十天赚一个", "url": "https://www.zhihu.com/question/2052410951283089532/answer/2053384267166638132", "votes": 3142, "comments": 174, "feed_ts": 1782362753, "feed_time_str": "06-25 12:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "罗马尼亚马部长@Nicolas Estrada  上次看了一个比较乐的，今年1月25日的时候USR(论意识形态来说应该是罗马尼亚院内各党中最反齐的）出身的现任罗国国防部长拉杜·米鲁察(Radu Miruță）在亲欧自由派倾向的Dig24新闻台节目《在你面前》(„În fața ta”）采访，Dig24记者弗洛林·内格鲁蒂乌(Florin Negruțiu）特地问他“牢齐到底算不算爱国者”，这哥们拒绝做出明确回答，转而既提出了批判性的论点，也提到了他认为与爱国主义概念相关的元素。这位部长表示：“在我看来，极其糟糕的一点是，他没有充分发挥和利用罗马尼亚的聪明才智与能力。仅仅因为聪明人可能会动摇你在罗马尼亚国家中的权力比重，就把他们送到多瑙河-黑海运河去劳改，这是绝对无法带来进步的。”结果部长先生被打脸，被指出运河主要是在乔治乌·德治时代修的，然后Dig24的人再次问他牢齐算不算爱国者，米鲁察又转而说:“牢齐在某些领域，追求在罗马尼亚领土上由罗马尼亚人来发展工业区。然而，他所做的这些事情，极大地孤立了罗马尼亚与其他国家的互动。”之后米鲁察被Dig24的人第三次要求就此问题做出明确回答，这位部长仍然给出了一个含糊其辞的表述。他坚称：“我已经告诉了你们他符合爱国者定义的论据，也告诉了你们他与爱国主义毫无关系的论据。”国防部长还补充道：“我的信念是，罗马尼亚今天的日子过得更好。”这段对话在主持人的严厉干预下结束，他批评了对一个独裁者提出哪怕是部分支持性论点的做法。主持人克劳迪乌·潘达鲁(Claudiu Pândaru）表示：“谢谢您，部长先生，但您怎么能认为一个屠杀、饿死自己国民的狄克推多——或者说像您所说的那样，部分地提出论据——说他是一个爱国者呢？这是两个基本原则：一个国家的领导人，如果杀害自己的子民，就绝不可能是爱国者。”米鲁察当天晚上也就是在他发表上述言论六个小时后不得不发声明澄清:“为了个人权力计划而牺牲福祉、自由或人的尊严，绝不是爱国主义。”随后他转而又说:“我解释了为什么那些说他建设国家、是爱国者的人的论点站不住脚。在一个几乎一半公民都怀念康米主义的国家，我认为有必要讨论为什么有些人仍然把他视为英雄——以及为什么这些论点不成立。”总而言之就是没有就上述言论正式道歉。这事儿虽然部长因为采访中暴露的历史常识匮乏等问题遭到群嘲，但是压根没什么后果——在政界，除却出任PNL雅西县党部主席的亚历山德鲁·穆拉鲁(Alexandru Muraru)公开要求米鲁察就此事道歉之外，国会各党不管是极右的AUR、POT、SOS之流，还是PSD、USR、PNL，基本都心照不宣的没有就此事发表官方声明或者表示正式集体谴责、要求其辞职，米鲁察至今仍然当他的国防部长。侧面看出来罗马尼亚哪怕是亲欧自由派政党至少都不太愿意跟社会上的“盼齐归”思潮发生大规模正面冲突。", "excerpt": "罗马尼亚马部长@Nicolas Estrada  上次看了一个比较乐的，今年1月25日的时候USR(论意识形态来说应该是罗马尼亚院内各党中最反齐的）出身的现任罗国国防部长拉杜·米鲁察(Radu Miruță）在亲欧自由派倾向的Dig24新闻台节目《在你面前》(„În fața ta”）采访，Dig24记者弗洛林·内格鲁蒂乌(Florin Negruțiu）特地问他“牢齐到底算不算爱国者”，这哥们拒", "url": "https://www.zhihu.com/pin/2053168675092543306", "votes": 0, "comments": 3, "feed_ts": 1782362622, "feed_time_str": "06-25 12:43", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价“崇祯皇帝如果有慈禧一半政治手腕，明朝不至于亡得这么窝囊”这个观点？", "excerpt": "我看到那个叫弃克夫的变色虫在B站发的视频了。 看样子应该是跟戒欲择鸡一块混的。 他们美化到慈禧光绪之流，在我看来都是必然的，很多年前这种思潮就开始流行了。 至于屁股是坐团结壬，还是八旗精神后裔，还是别的什么，其实都不重要。 举个例子，中国一直有一群相当有能量的人，对慈禧等晚清统治者是有着隐秘的感恩情怀的。 他们并非八旗勋贵后裔，也不是旗丁后裔。 他们是湘军，淮军后裔中的一部分，以及晚清汉臣后裔中的", "url": "https://www.zhihu.com/question/2051212779395322641/answer/2053455784269308825", "votes": 539, "comments": 186, "feed_ts": 1782362011, "feed_time_str": "06-25 12:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "世界杯小组赛 A 组，南非 1-0 韩国，首次晋级淘汰赛，韩国小组第三出线待定，如何评价本场比赛？", "excerpt": "太意外了，A组第1场打完告诉我南非第二直接出线、韩国第三，傻子才信。南非可能是我14年开始 ctor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如果我能每天把一克物质转化为纯能量，我能年入百万吗？", "excerpt": "1千克TNT爆炸释放的能量约为420万焦耳=4.2*10^6焦耳； 1克物质全部转化为能量，释放的能量是 E=MC^{2} =9*10^13焦耳。也就是说，我一天转化的能量相当于2.14*10^7千克TNT爆炸，这是高达2万多吨的TNT。为什么非要换算为“吨当量”这个军事上才会常用的能量单位？因为一个人贴身引爆大约10克TNT炸药就足够送他归西了，一枚手榴弹装药量也就50克这样子。在人体要害部位、", "url": "https://www.zhihu.com/question/2031650802763314397/answer/2053444258250675277", "votes": 292, "comments": 47, "feed_ts": 1782359263, "feed_time_str": "06-25 11:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "舔狗到底有多能舔？", "excerpt": "还有能舔的过这个的？ 更新一张 ", "url": "https://www.zhihu.com/question/318864432/answer/2038051757041902243", "votes": 3719, "comments": 223, "feed_ts": 1782358922, "feed_time_str": "06-25 11:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "Dio-晶", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价中国超算\"灵晟\"登顶Top500，中国超算重回世界第一？", "excerpt": "不见南师久，漫说北群空。当场只手，毕竟还我万夫雄。", "url": "https://www.zhihu.com/question/2032659692376343993/answer/2053239816830063212", "votes": 12, "comments": 0, "feed_ts": 1782358915, "feed_time_str": "06-25 11:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TopView", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "有人喊跑了", "excerpt": "这周的A股跟坐过山车似的，前天刚挨了一记闷棍。创业板咔嚓跌了快4%，有色和算力硬件跌得连妈都不认识，成交额3.47万亿创了近期天量。结果昨天又回魂了，科创50一马当先涨了3.93%，半导体产业链硬是在AI信仰最飘摇的时候顶了上来。今天，证券、白酒等老登又起飞了。波动太大了。 不过今天不想写复盘，想聊一个圈内正在热议的事。 这场风暴的导火索说起来有好几根。韩国的议员老爷们在讨论把股票和房地产的未实现", "url": "https://zhuanlan.zhihu.com/p/2053441388352742220", "votes": 106, "comments": 9, "feed_ts": 1782358619, "feed_time_str": "06-25 11:36", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "刘杨", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "核心零部件成本上涨，部分电脑今年涨超 20% ，是暂时波动还是长期趋势？今年还适合买电脑吗？", "excerpt": "这一波涨价没有任何短期解药。 我们都在交AI基础设施的建设税，同时我们也在正在在替云厂商买单。 看下数据。 联想拯救者R9000P，年初13699元，4月底17499元，涨了27.8%。 惠普暗影精灵热门型 : "正在此刻，美国白宫地下室，一个任何国家的卫星都找不到的地方，川普正在拿鞭子死命抽打马杜罗“叫你装唐，叫你装唐”", "url": "https://www.zhihu.com/question/2050697665118201437/answer/2052466281065011155", "votes": 4833, "comments": 118, "feed_ts": 1782348732, "feed_time_str": "06-25 08:52", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "小约翰", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "刚刚，德国铁路崩了就在刚刚，德国发生T0级重大事故——全德铁路几乎全面瘫痪，瘫痪原因竟然是自家系统的IT故障。赶紧翻了几乎所有报道，槽点太多了。1、真的是全德国火车一起歇菜，但凡德国铁路公司（DB）运营的火车，什么长途高铁、城市轻轨、区域小火车、货运列车……无一幸免，最少也瘫了两个小时左右。2、最开始撂挑子的是ICE609高铁，跑的是汉堡到柏林刚刚砸重金翻新的线路。3、德铁承诺给滞留旅客解决打车和住宿，但到了很多旅客那里，这个承诺根本无法兑现。人工窗口队伍排几百米，周边酒店坐地起价，还拒收铁路报销券。不少德国人被逼得连夜抢长途大巴票跑路，场面无比狼狈。4、乱成一锅粥的不止火车机车，整个系统一塌糊涂。车站电子屏不是乱码就是瞎报晚点，一会儿晚15分钟，一会儿25分钟。等到十点半官方 APP 彻底崩了，有些大屏幕的晚点时长来回横跳，旅客看了都想笑。5、调度中心也很懵。底层通信网瘫痪时，调度中心也变成了瞎子、聋子，无法联系调度，也得不到任何有效指令，也不知道什么时候能恢复正常。6、备系统也没顶上。早在晚上九点多，德铁调度中心就有人发现不对劲，但是管理层翻遍所有预案，发现啥补救办法都不好使。德铁吹了好几年多重冗余备份，结果一行错误代码就把主网、备份网一网打尽。按照德国安全法规，通信失效所有列车必须原地锁死，全国铁路一键停机，于是才有这场“国耻级”铁路停摆。7、德铁的通信系统有多落后？2026年全德国铁路命脉，通信还靠上世纪90年代的2G底子撑着。他们也有升级为5G 新型通信系统的计划，要新建数万信号塔、改造两万多台机车。可是24亿欧元砸进去，完工要等到2035年。8、损失最大的是物流。周二夜里客流量一般，但货车一般都是夜间行驶。德国地处“欧洲心脏”，法兰克福、杜伊斯堡都有类似欧洲武汉的枢纽地位。德国铁路瘫痪，欧洲货运网络也是半身不遂。后续，物流公司估计会向德铁基础设施子公司（DB InfraGo）发起巨额的商业违约索赔。 9、这次也算是裁员碰到了大动脉。之前德铁为了财报好看，精简人员、削减备用设备，砍掉了所有容错空间。一次小小的日常维护出错，就能让国家级交通系统彻底瘫痪。因为去年去过一趟德国，对德铁还是“略有实感”，图5是在科隆买票去埃森，惊讶的发现，线下买火车票居然是取号然后排队去柜台买票，就和去银行办业务取号一样，排队大概十分钟。图6是在杜塞尔多夫，晚点半小时（也算正常）。不过德铁也是十分的看人下菜碟。我们去鲁尔老工业区所在的北威州，回来的车整整晚点2个半小时，甚至最后显示屏上连车次都没了。其实就是北威州没钱给德铁充值+没钱维护铁路，就导致车次少、动不动技术故障延误。而德国最富的慕尼黑周边，火车晚点就少很多。总体来说，德国铁路分秒不差已成传说，晚点早就成了德国铁路的日常，这也是在巨大丑闻面前并没有震动全网的重要原因。然而，正如一位德国议员批评的那样，铁路关乎经济运输和军事调动，系统脆弱成这样，已经上升到国家安全隐患。这次是全德国火车停摆了至少两个小时，你猜下一次又能整什么幺蛾子？#德国铁路  #DB  #德国 ", "excerpt": "刚刚，德国铁路崩了就在刚刚，德国发生T0级重大事故——全德铁路几乎全面瘫痪，瘫痪原因竟然是自家系统的IT故障。赶紧翻了几乎所有报道，槽点太多了。1、真的是全德国火车一起歇菜，但凡德国铁路公司（DB）运营的火车，什么长途高铁、城市轻轨、区域小火车、货运列车……无一幸免，最少也瘫了两个小时左右。2、最开始撂挑子的是ICE609高铁，跑的是汉堡到柏林刚刚砸重金翻新的线路。3、德铁承诺给滞留旅客解决打车和", "url": "https://www.zhihu.com/pin/2053235992711247617", "votes": 0, "comments": 156, "feed_ts": 1782348385, "feed_time_str": "06-25 08:46", "category" let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'

        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {

    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

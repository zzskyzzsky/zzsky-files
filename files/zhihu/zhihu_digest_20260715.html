rpt": "清末的端郡王载漪就是这么想的，洋鬼子嘛那就是“羊鬼”，那什么东西能治“羊鬼”呢？既然虎能食羊，神能治鬼，那么“虎神”自然就能治“羊鬼”了，所以就组建了一支叫“虎神营”的军队，史书记载叫“虎神营者，虎食羊而神治鬼，所以诅之也。” 再往前几十年，扬威将军奕经也是这么想的，奕经认为，自己手里现在有从四川远道而来的、由藏兵和羌兵组成的“虎头军”，有属虎的总兵段永福，那么让段永福当主将，“虎头军”作先锋，…", "url": "https://www.zhihu.com/question/2055438493011153200/answer/2060146227421917533", "votes": 553, "comments": 31, "feed_ts": 1784004579, "feed_time_str": "07-14 12:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "特厨隋坡探店全差评餐厅引争议，老板「逆天回怼」是高明还是失策？", "excerpt": "老板说了一堆没用的废话，就是没否认东西难吃", "url": "https://www.zhihu.com/question/2059021609504186485/answer/2059728356371870446", "votes": 1220, "comments": 14, "feed_ts": 1784004190, "feed_time_str": "07-14 12:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "大家认为中国篮球史上最大的丑闻是什么？", "excerpt": "很多答案都没说对。 中国篮球历史上，真正影响到篮球形象和发展的丑闻有这几件 1，阿联扔鞋。 说句难听的，阿联这件事一点道理都没有，并且处理的方式非常难看，非常愚蠢。 李宁作为cba最大金主，阿联有nike合同，完全可以协商，开个特例条款，或者遮个标志，都没问题。 阿联用了一种最差的处理方式，直接现场扔鞋，并且直接说李宁的球鞋太差，没办法打篮球。 这是对李宁篮球鞋的极大商业侮辱，甚至是诽谤。cba到", "url": "https://www.zhihu.com/question/1934719644356306082/answer/2026809755977393324", "votes": 2475, "comments": 400, "feed_ts": 1784004113, "feed_time_str": "07-14 12:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小德", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "1944年的松山之战如果换成1979年的PLA来攻日军堡垒，会变得容易吗？？？", "excerpt": "不需要79年的PLA啊，咱就用解放战争的PLA好了。 松山那个地方我实地去踩过，山确实不好打，坡度大，陵线多，植被茂密，进攻方非常容易被伪装的侧射火力压制，山道转角也容易被火力压制无法展开进攻。 但是要塞这种说法太过火了，日军的工事局限于战壕、土木堡垒、地下通道和藏兵室，够不上要塞的标准。属于坚固野战工事+半永久地下掩体的组合。 松山难打的客观原因是地形，坡度，植被密度。主观原因果党小组作战能力低", "url": "https://www.zhihu.com/question/625158872/answer/2054883894047118962", "votes": 161, "comments": 45, "feed_ts": 1784004106, "feed_time_str": "07-14 12:41", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "所有人只看美联储沃勒昨晚放炮，主张短期内就加息，但忽略了重要的事情昨天黄金跌了近3%：一是美伊重新开打，气氛又拉满了；二是美联储理事沃勒、这个强硬派昨天放了个强鹰。其实昨晚9点，在沃勒讲话之前，黄金就开始跳水，这反映了市场的恐慌：因为沃勒是出了名的强硬派，市场很怕他放炮，叠加今天晚上的CPI生死未卜，就先抛黄金再说。结果昨晚12点半，媒体公布了沃勒的演讲稿，上面赫然写着“如果本周二公布的6月核心CPI还是很火热，美联储短期内需要加息，不能对高通胀放任”。市场揣摩沃勒说的“短期”，最快大概是7月28日的FOMC会议，市场马上定价这次会议加息的概率为50%。而且我看了期货市场，已经定价年内两次加息。这就是为什么我一直说，如果经济数据支持加息，美联储确实会加息，不可小看。但也不用从一个极端，走向另一个极端：瞬间又觉得真的要加息了，天要塌下来了。这也大可不必。所有人只关注沃勒说短期内应该加息，但忽略了两个事情：第一，加不加息，不是沃勒说了算的，也不是沃什说了算的，是数据说了算的。如果今晚CPI平预期或低于预期，马上就会有一堆新闻说通胀果然只是暂时的、很容易降下来，加息概率瞬间就会掉头向下，如果适逢特朗普正好TACO，那就更精彩。第二，沃勒不是只谈加息，他昨天再次重申他个人倾向1.5%-2.5%浮动通胀目标，认为传统的2%目标过于严苛，央行很难精准把通胀钉死在单一数字上。沃什三番五次说倾向“截尾均值PCE”，现在沃勒又说倾向“1.5%-2.5%通胀目标区间”，看上去已经为转鸽找到了完美的台阶。因为沃什喜欢的截尾均值PCE，5月只有2.4%，就落在沃勒喜欢的1.5%-2.5%的目标区间内。这不就在等时机，正式官宣通胀已达标，没必要加息了吗？所以不用跟着新闻一惊一乍，静观其变就行了。美联储真的加息也好，或者只是嘴上说说、预期管理也好，都不是最重要的，最重要的是美债无论是绝对金额还是占GDP的比重，都是历史最高，这已经无解，只能不断靠印钞来拖，这才是投资黄金的价值，不会因为美联储的加息降息而发生任何改变。", "excerpt": "所有人只看美联储沃勒昨晚放炮，主张短期内就加息，但忽略了重要的事情昨天黄金跌了近3%：一是美伊重新开打，气氛又拉满了；二是美联储理事沃勒、这个强硬派昨天放了个强鹰。其实昨晚9点，在沃勒讲话之前，黄金就开始跳水，这反映了市场的恐慌：因为沃勒是出了名的强硬派，市场很怕他放炮，叠加今天晚上的CPI生死未卜，就先抛黄金再说。结果昨晚12点半，媒体公布了沃勒的演讲稿，上面赫然写着“如果本周二公布的6月核心C", "url": "https://www.zhihu.com/pin/2060325807277580815", "votes": 0, "comments": 40, "feed_ts": 1784003987, "feed_time_str": "07-14 12:39", "category": "pin", "cat_name": "想法动态"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何判断一个人是真的思想深度很深?", "excerpt": "张雪峰有次直播的时候，对面有个男生连麦，问学的财会专业，考公有没有什么限制？ 张雪峰说没有限制。 那个男生依旧很担忧：“听学长说，好像校招的时候财会类的专业愿意招女生，不愿意招男生。” 张雪峰言之凿凿的说：“跟你说这话的人一定是没去招聘过的，纯属胡扯。” 张雪峰说财会一定是男生好就业，而不是女生优先，原因是这个男生是交通类的学校，来招聘的基本都是项目施工方，都会要求驻场。 驻场这个事儿女生一般很难", "url": "https://www.zhihu.com/question/1945375881829814408/answer/2060341533463917820", "votes": 262, "comments": 69, "feed_ts": 1784003701, "feed_time_str": "07-14 12:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "AI 训练数据赛道盘点：4 家拿走大头模型公司训练花的钱，并不只流向芯片和大模型团队。给模型提供训练数据、偏好评测和 RL environments 的公司，也是一个很大的生意。Menlo Ventures 合伙人 Deedy Das 整理的这张图估算：超过 50 家公司向大型 AI 实验室出售训练数据和 RL environments，合计年化收入约 85 亿美元、估值接近 1000 亿美元。图中实际逐行列出的是 28 家可估算公司，两种数字不是同一个口径。AI 数据的钱流向哪里这份估算里，Scale、Surge、Mercor 和 Handshake 四家公司合计占去超过 75% 的收入。图中收入采用年化 run-rate，且包含约 60%-70% 的外包执行支出，因此它不能等同于净利润，也不能据此精确计算市场份额。除了四家巨头，图里还列出 micro1、Turing、AfterQuery 等收入超过 1 亿美元的挑战者。另一侧，Arena、David AI、Protege、Datacurve、Truveta 被归到偏好评测、音频、代码、医疗等数据细分领域；Toloka 和 Encord 则放在 physical AI data 一类。RL environments 为什么被单列长图专门分出一组 “RL-env natives”，并把它称作 “the gym wave”，例子包括 Fleet、Deeptune、Bespoke Labs 和 Mechanize。这里的 RL environment 可以理解为让模型反复完成任务、根据结果得到反馈的训练场，而不只是给已有样本贴标签。这并不证明传统数据标注已经被替代。更准确的说法是：在这份赛道图里，训练数据供给已经被拆成标注、偏好与评测、RL environment、机器人/真实世界数据等不同生意，RL environment 是其中被单列出来的一类。先看清这张图的边界这不是完整市场普查，也不是审计财报。Deedy Das 在图中说明，部分估值来自上一轮融资价，部分是按稀释比例推算或仍在谈判中的价格；收入未披露的公司没有算进总额。它更适合用来观察赛道的分层和集中度，而不是据此判断某家公司真实利润或精确排名。对关注 AI 行业的人，最值得看的不是“又多了多少家数据公司”，而是训练数据的供给方已经开始按任务环境、偏好评测和真实世界数据分工。模型能力往前走，谁能提供更贴近实际任务的训练场，谁就可能拿到新的订单。", "excerpt": "AI 训练数据赛道盘点：4 家拿走大头模型公司训练花的钱，并不只流向芯片和大模型团队。给模型提供训练数据、偏好评测和 RL environments 的公司，也是一个很大的生意。Menlo Ventures 合伙人 Deedy Das 整理的这张图估算：超过 50 家公司向大型 AI 实验室出售训练数据和 RL environments，合计年化收入约 85 亿美元、估值接近 1000 亿美元。图", "url": "https://www.zhihu.com/pin/2060340732590921011", "votes": 0, "comments": 0, "feed_ts": 1784003564, "feed_time_str": "07-14 12:32", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "其实我想了下，最近这波红利板块涨，可能跟打新逻辑有关。先简单说下规矩，A 股打新得配市值，空仓是没资格申购的。沪市股票的市值是通用的，手里拿了沪市票，主板、科创板新股都能打，虽然现在科创跌的厉害，但如果能打中新股，大多还是能赚，也算是市场里少有的稳赚路子了。但难题就来了：为了打新的底仓，买啥才不亏？常年靠打新套利的老手，基本不会拿巨大的成长股当底仓。道理很简单，这类票涨跌太猛，行情差的时候底仓跌亏的钱，轻轻松松就能把打新赚的利润全吞掉，搞不好还要倒贴本金。于是高股息红利股自然就成了配底仓的最佳选择。一来红利股基本都是沪市大盘蓝筹，一份市值兼顾主板和科创打新，二来这类票走势平稳、涨跌幅度小，还有稳定分红兜底，就算股价短期来回震荡，股息也能摊薄持仓成本，大大降低拿着底仓的亏损风险。这其实也是助推红利板块的一个逻辑…", "excerpt": "其实我想了下，最近这波红利板块涨，可能跟打新逻辑有关。先简单说下规矩，A 股打新得配市值，空仓是没资格申购的。沪市股票的市值是通用的，手里拿了沪市票，主板、科创板新股都能打，虽然现在科创跌的厉害，但如果能打中新股，大多还是能赚，也算是市场里少有的稳赚路子了。但难题就来了：为了打新的底仓，买啥才不亏？常年靠打新套利的老手，基本不会拿巨大的成长股当底仓。道理很简单，这类票涨跌太猛，行情差的时候底仓跌亏", "url": "https://www.zhihu.com/pin/2060340101675327547", "votes r": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待中国人民大学发布通报，认定蒋方舟构成学术不端行为，决定撤销其硕士学位？", "excerpt": "解释一下，为什么第一次没有太大的事，这次确认了学术不端。第一次是肖鹰发现注释的猫腻，但是不容易直接认定抄袭。 这次是豆瓣博主ilad发现了她蒋方舟抄袭的台湾的陈重仁《〈别让我走〉与生命政治的美丽新世界》，最早宣读于2011年，发表于《中外文学》2012年第41卷第2期。而且蒋方舟当时的回应也是问题很多，很多她均强调为自行从英文译出。这些都不是她自己翻译的，都是国内译者的翻译。小红书博主“抒情的森林", "url": "https://www.zhihu.com/question/2060087159764117382/answer/2060093018837869892", "votes": 3878, "comments": 408, "feed_ts": 1783998497, "feed_time_str": "07-14 11:08", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "就聊聊最近刷屏的韩国股市爆仓潮好了。就我感觉一个事是什么吧，就韩国监管前期对杠杆产品放任，本质上是对市场、普通散户极度不负责任。我看了下数据：今年一季度韩国散户借钱炒股的规模直接冲到27万亿韩元，融资余额同比翻倍，融资交易占市场总成交比例高达35%，杠杆投机热度，已经比我们2015年A股杠杆牛市巅峰时期还高了。更夸张的是监管直接放行大量单股2倍杠杆ETF，专门挂钩三星、SK海力士这类半导体权重股，短短半个多月，这批杠杆产品规模直接冲到14万亿韩元，散户持仓占比92%，这都是散户在博弈涨跌。韩国的杠杆门槛极低，拿三星电子举例，保证金比例仅45%，也就是说你掏45万本金，就能操作100万市值股票，维持担保比例最低140%，股价只要跌17%-23%，立刻触发追缴保证金，极端行情下单日就能强平账户。这个模式一旦涨还行，但一旦行情转弱，就会形成经典的下跌死亡螺旋：指数小幅回调→杠杆ETF被动再平衡抛售股票→股价继续大跌→大量散户账户触及平仓线，券商不计成本强制卖出，进一步砸盘。就这段时间的数据，韩国这波几十万散户本金直接清零，大量年轻人不是被套牢了，而是直接被整崩了，这就是高杠杆不加约束的惨烈后果。可能新股民还不懂我在说什么，就这波老A股股民肯定会联想到2015年那波场外配资杠杆牛，模式也是一样的。当年场外配资野蛮生长，民间杠杆普遍3-8倍，甚至有10倍配资渠道，十万本金能撬动百万资金入市。所以当时市场涨得飞起，而监管清理配资之后，连锁爆仓踩踏出现，短短十几天千股跌停，无数人抵押房产、透支积蓄炒股，本金直接亏光。15年也几乎是天台人数最多的年份了，这就是高杠杆穿仓带来的毁灭性打击。但好一点是什么吧？这么多年过去，你会发现，A股市场再也没有出现过当年那种极端惨剧。核心原因只有一个：我们彻底斩断了场外非法高配资，场内融资融券杠杆被严格锁死。2026年现行规则，新开融资账户保证金比例100%，理论最高杠杆只有1倍，100万自有资金最多再融100万，不存在几倍、十倍杠杆的空间。就算行情大幅回调，1倍杠杆最多亏掉自有本金，不会出现负债穿仓，而且券商还设置多层提前追保线，不等股价深度下跌就会提醒投资者减仓，从制度上杜绝一夜归零、倒欠券商钱的情况。简单来说吧，就散户炒股不怕亏钱，怕的是一把亏到一无所有，甚至倒欠钱。把杠杆锁在可控范围内，哪怕行情走熊，大家最多只是本金缩水，不会引发社会性风险，这是监管层给普通投资者设下的安全垫，长远来看绝对是好事。所以大家回头看这一轮科技股行情，哪怕中途回撤幅度很大，不少人账面浮亏三四十个点，顶多就是资产大幅缩水、本金亏得心疼。但像2015年那种高杠杆爆仓、背负巨额债务引发极端悲剧的情况，现在几乎看不到了。根源就是这些年监管持续严控市场杠杆，给所有投资者划定了亏损底线。所以对应着的，券商板块，自然也就没什么行情了。", "excerpt": "就聊聊最近刷屏的韩国股市爆仓潮好了。就我感觉一个事是什么吧，就韩国监管前期对杠杆产品放任，本质上是对市场、普通散户极度不负责任。我看了下数据：今年一季度韩国散户借钱炒股的规模直接冲到27万亿韩元，融资余额同比翻倍，融资交易占市场总成交比例高达35%，杠杆投机热度，已经比我们2015年A股杠杆牛市巅峰时期还高了。更夸张的是监管直接放行大量单股 众多，甚至中国还处于 “落后” 身位。 这是怎么回事呢？原因很简单：其他国家，特别是 《日耳蛮正道世界》 （包括诸日耳蛮国和日韩这种达利特领班国），", "url": "https://www.zhihu.com/question/2058854448244454744/answer/2059990295111120870", "votes": 756, "comments": 90, "feed_ts": 1783995606, "feed_time_str": "07-14 10:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待瑞士前锋恩博洛偷鸡不成蚀把米，假摔骗黄未遂，VAR回放后反被裁判罚下，离场时抱头痛哭？", "excerpt": "个人觉得，没啥好同情的。 这个球，你可以假摔，骗一个球权我都觉得问题不大。 但你丫的，假摔了还躺地上装痛苦，那就是成心想让对方吃个黄。 这个出发点就是恶劣的，没得洗。 他只不过是被自己的恶意给反噬了而已。 至于抱头痛哭，都是成年了，该为自己的行为买单了。 ", "url": "https://www.zhihu.com/question/2059586957143795316/answer/2059639439194953052", "votes": 846, "comments": 36, "feed_ts": 1783995563, "feed_time_str": "07-14 10:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "法西斯为什么必然灭亡?", "excerpt": "搬运下吧，打赢二战后正道化的纳粹德国 ", "url": "https://www.zhihu.com/question/63932480/answer/1990742360343204097", "votes": 2933, "comments": 9, "feed_ts": 1783995545, "feed_time_str": "07-14 10:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待瑞士前锋恩博洛偷鸡不成蚀把米，假摔骗黄未遂，VAR回放后反被裁判罚下，离场时抱头痛哭？", "excerpt": "看回放特别招笑。 瑞士7号在摔倒时，瑞士6号就在几米远的位置。 就在7号在草坪翻滚的时候，裁判过来，瑞士15号，10号上来围住帕雷德斯，15号还上手了。 但是6号把假摔看看清清楚楚，赶紧拦住了10号，把10号拉到后面去了。 这里6号和10号悄悄话，隔着屏幕你都能感觉到10号已经被震惊，表情从愤怒转成了无语中带有几分茫然。 后面还有些瑞士球员8号，22号上来围住帕雷德斯的，又被10号拉了回去。10号", "url": "https://www.zhihu.com/question/2059586957143795316/answer/2059653786667323538", "votes": 1023, "comments": 182, "feed_ts": 1783995532, "feed_time_str": "07-14 10:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "湖北崇阳一只狗扑咬多人，当地正搜捕，如何才能有效管理流浪狗，保障公共安全？", "excerpt": "爱狗爱猫人士有一个理论，就是对猫狗凶狠的人，也会对人凶残，甚至发展成杀人凶手。 而事实恰恰相反，现实中有大量凶残杀人凶手，对受害人类冷酷嗜血、毫无怜悯，却对猫狗小动物极度温柔疼惜、细心呵护。这并非善良，而是典型的病态心理分裂。 国内最著名的是宁夏连环杀手程鹏，身背六条人命，杀死情人肢解后甚至投喂恶犬，对同类极度残忍。

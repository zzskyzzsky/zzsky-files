STION", "verb_cn": "回答了问题", "title": "国际油价大涨，黄金白银跳水，美媒称霍尔木兹海峡油轮通行基本停止，中东局势将如何扰动全球资本市场？", "excerpt": "什么时候黄金大涨，油价大涨，就是经济危机爆发之时。很多人奇怪为什么危机中黄金会跌呢？道理也很简单，很多小国手里还有黄金救急，你抛黄金买石油，或者买流动性美元，当然黄金就跌了。一旦黄金暴涨就说明这些国家手里黄金差不多光了，那就只剩下抛美债了，到时候就是美国经济死期。 ", "url": "https://www.zhihu.com/question/2058280051456718293/answer/2058353399473747598", "votes": 4, "comments": 0, "feed_ts": 1783529693, "feed_time_str": "07-09 00:54", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude省钱配方：Fable 5动脑，Sonnet5干活Anthropic 的开发者账号分享了一套多agent搭配方案，核心逻辑：把规划和执行拆开，分别交给不同量级的模型。SWE-bench Pro 上，Sonnet 5 搭配一个 Fable 5 顾问，效果大约保留 Fable 5 全量方案的 92%，但成本只花到 Fable 5 全量方案的 63%。BrowseComp 测试里，Fable 5 做编排者、Sonnet 5 做执行人，效果达到 Fable 5 全量方案的 96%，但成本只有原来的 46%。两个模式，一个省钱思路Claude给了两种玩法。第一种叫 Advisor 模式，Sonnet 5 自己干活，遇到拿不准的地方向上呼叫 Fable 5 做决策。Fable 5 平均每个任务只被调一次，大部分 token 走 Sonnet 5 的费率。第二种叫 Orchestrator 模式，Fable 5 当总指挥拆解任务，派给多个 Sonnet 5 工人并行处理，自己只做统筹和合成答案。为什么能省这么多秘密在 token 分布。相关 cookbook 实验显示，组合方案里约 84% 到 98% 的输入 token 都按 worker 费率计算，整体便宜了约 2.5 倍，快了约 3 倍。另一个容易被忽略的点是缓存：每个子代理保留独立的上下文缓存，重复调用相同内容时不全按新 token 计费。适合什么场景这套架构适合 token 消耗量大的任务，比如网页搜索验证、文档审查、日志分析。但有限制：协调者只能委派一层，深度超过一层的嵌套会被忽略；一个多智能体会话最多容纳 20 个独立代理。所以不是什么任务都适合往里套，窄问题或者需要深度推理的活，拆开反而可能增加开销。有网友(morganlinton)测了一周 Fable 5 之后觉得，写代码日常确实不太需要用 Fable，但做规划时好用得离谱。如果你还在用最贵的模型硬扛所有环节，官方这套配方值得上手试试。", "excerpt": "Claude省钱配方：Fable 5动脑，Sonnet5干活Anthropic 的开发者账号分享了一套多agent搭配方案，核心逻辑：把规划和执行拆开，分别交给不同量级的模型。SWE-bench Pro 上，Sonnet 5 搭配一个 Fable 5 顾问，效果大约保留 Fable 5 全量方案的 92%，但成本只花到 Fable 5 全量方案的 63%。BrowseComp 测试里，Fable ", "url": "https://www.zhihu.com/pin/2058342177541972235", "votes": 0, "comments": 0, "feed_ts": 1783527039, "feed_time_str": "07-09 00:10", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Meta的Muse Image能搜索写代码自修图Meta 这次发的是一套带工具调用能力的生图系统。Muse Image 被写成 agentic image generation：它会搜索、写代码、自我修图，还会随着 test-time compute 增加继续变好。榜单只是第一层：Arena 上结果亮眼。截至 2026 年 7 月 5 日，Muse Image 在 Arena 的 Text-to-Image、Single-Image Edit、Multi-Image Edit 三项 human-preference Elo ranking 里都是 No.2。图像总榜里，它也排第二，仅次于 OpenAI 的 GPT Image 2；Muse Video 在 Text-to-Video Arena 里是第三，1459 分，比 Alibaba HappyHorse 1.0 高 30 分。Meta 在把生图工具做成一个会规划、会调用工具的 agent。它会搜索，也会写代码Muse Image 有 search tool use。遇到当前事件、真实世界事实、视觉参考这类知识密集 prompt，它可以先上网找信息，然后再把结果用于生成。它也有 coding tool use。Meta给的例子包括写代码生成可扫描 QR code、画准确的图表，再把渲染结果作为条件放进最终图片里。Muse Spark 和 Muse Image 组合后，还能把代码和媒体生成串起来，做 GIF、嵌图网页和互动小游戏。这解释了为什么它不像传统生图工具：很多复杂任务靠一次出图很难稳定完成，但可以拆成“查资料、写代码、渲染、检查、再编辑”的流程。自我修图和更多思考Meta还专门写了 self-refinement。Muse Image 会在生成过程中检查自己的结果：小问题就局部修改，大问题就重新生成，事实不稳时就换成 tool use。Meta 说，这套流程并非人工写死，而是在 RL training 里涌现出来的，因为自我修正能拿到更高 reward。还有一个值得注意的点：test-time compute scaling。给 Muse Image 更多推理 compute，它会做更多 reasoning、tool calls 和 self-refinement，人类偏好 Elo 会继续上升。相比简单 Best-of-N 多抽几张图，花 compute 做 deliberate reasoning 的收益更好。视频和水印边界Muse Video 现在还是 preview。它在 prompt adherence、visual fidelity、temporal consistency 上有竞争力，但 audio-video synchronization 和 physically accurate fast motion 还在补。音画同步、快速运动里的物理一致性，还不能当成熟能力看。另一个容易被忽略的点是 Content Seal。Muse Image 在 Meta AI app 和 meta.ai 生成的图片里加入 invisible watermarking，裁剪、压缩、缩放、截图后仍应保留。Meta 还在预览检测工具，并计划把 Content Seal 扩到视频。", "excerpt": "Meta的Muse Image能搜索写代码自修图Meta 这次发的是一套带工具调用能力的生图系统。Muse Image 被写成 agentic image generation：它会搜索、写代码、自我修图，还会随着 test-time compute 增加继续变好。榜单只是第一层：Arena 上结果亮眼。截至 2026 年 7 月 5 日，Muse Image 在 Arena 的 Text-to-", "url": "https://www.zhihu.com/pin/2058339858494515136", "votes": 0, "comments": 0, "feed_ts": 1783526480, "feed_time_str": "07-09 00:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "RalphLoop 称『300行写不出 Cursor 就别待了』，这是否反映了当代开发者技能的不足？", "excerpt": "调库是什么值得骄傲的事情吗，会调库，300 行写一个浏览器都不是问题。 import sys from PyQt5.QtWidgets import QApplication, QMainWindow from PyQt5.QtWebEngineWidgets import QWebEngineView class Browser(QMainWindow): def __init__(self):", "url": "https://www.zhih const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

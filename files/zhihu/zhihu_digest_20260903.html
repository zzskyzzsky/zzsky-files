，观众先沸了刚看到 StartLux 携手清华大学、中国科学院大学、香港大学、悉尼大学和哥伦比亚大学的研究者联合发表的论文《Massive Activations in Hybrid Linear Attention Large Language Models: Pre-Attention Spikes and Inter-Spike Plateaus》。论文直达：链接核心发现一句话概括：混合线性注意力大模型里，Full Attention 层还没开始计算，它前一层就已经出现了异常巨大的激活值——研究者管这叫“注意力前尖峰”（PAS）。而且随着 Full Attention 层变密，这些尖峰之间的低谷会被填平，形成“尖峰间平台”（ISP）。这事有多反直觉？研究覆盖了 Qwen3.5、Kimi Linear、Nemotron-H、Zamba2 等 12 个公开模型，参数量从 1.2B 到 397B，规律完全一致。Full Attention 的位置决定了尖峰出现在哪里，它的密度决定了离群值能在层间“赖”多久。更扎心的是实验：给 Full Attention 加输出门控，尖峰被压低了但位置不变；移除 Linear Attention 的门控，只是温和放大。也就是说，Full Attention 是“写剧本的”，Linear Attention 只是“调音量的”。一点想法：混合比例从来就不只是一张效率配方。多少层用 Linear Attention、隔多久插一次 Full Attention，本质上是在组织模型内部计算的“节奏”。这跟工业界现状形成了微妙呼应——阿里、Kimi、蚂蚁、小米都在押注混合线性注意力架构。但这项研究告诉你：你选的架构组合，不只在决定算得快不快，还在决定模型内部“怎么想”。各位做大模型架构、做量化的，注意了——针对极端激活集中出现的层和架构边界，也许该有更位置感知的处理策略了。#混合线性注意力   #大模型架构   #LLM   #清华大学   #论文速递 ", "excerpt": "Full Attention还没开始算，前一层的激活值已经提前炸了—就像演唱会主角没登台，观众先沸了刚看到 StartLux 携手清华大学、中国科学院大学、香港大学、悉尼大学和哥伦比亚大学的研究者联合发表的论文《Massive Activations in Hybrid Linear Attention Large Language Models: Pre-Attention Spikes and", "url": "https://www.zhihu.com/pin/2078081699188154899", "votes": 0, "comments": 0, "feed_ts": 1788340820, "feed_time_str": "09-02 17:20", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "林为珮", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待“2026年将成为人类文明历史上整体总和生育率首次正式跌破2.1世代更替水平的一年”？", "excerpt": "别说跌破2.1水平，就是跌破1.0也是屁大点事。对当代的人可能有点影响，放在整个人类进化的几百万年历史里，连一个大事件都算不上。人类文明自然会找到它的出路。", "url": "https://www.zhihu.com/question/2075706979650122916/answer/2076316373437911509", "votes": 429, "comments": 14, "feed_ts": 1788340812, "feed_time_str": "09-02 17:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美国对中国发动的新冷战为什么没有对付苏联那么有效？", "excerpt": "来来来，我又有一个暴论。中国和美国都在有意识地把对方拉到自己熟悉的斗争局面里，但目前是中国更顺利。 每个国家，但凡有点国际斗争历史，都会有点路径依赖。 就是会自觉不自觉地想把对手拉进自己曾经取胜的局面里，然后用丰富的经验打败对手。 美国呢，主要是两种局面比较擅长，一个是直接打仗，用强大的工业能力和数量级的人口差异打败对手。一个是打冷战，综合使用意识形态斗争、代理 swer/2078477775950948005", "votes": 268, "comments": 0, "feed_ts": 1788330487, "feed_time_str": "09-02 14:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "银行为什么一定要让那些病重或卧床不起的老人本人到现场办业务？", "excerpt": "你来医院待两天就知道了。 就前两个月的事儿。 第一天，我们配合银行在病人清醒的窗口期确认了预存医疗费，19万。银行在ICU外面等了2小时，又费尽周折，才取得符合规定的转账确认。 第二天，他老婆趁他昏迷想要放弃治疗，在我们拒绝，并且明确告知即使放弃治疗，费用也不能退给她只能退回银行后，扭头走了再也没回来。 第四天，通过警察联系到病人父母。 第5天晚上，他父母赶到天津。 第9天，客户基本确认脱离危险。", "url": "https://www.zhihu.com/question/1996796145/answer/2077371682973546373", "votes": 860, "comments": 48, "feed_ts": 1788330359, "feed_time_str": "09-02 14:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看待705分去读哈工大？", "excerpt": "在进入大学的那一刻，高考分数就等于清零了。 幻想他去了哈工大能拿到多少资源的人属于没上过大学的 大学的资源是否倾注给你，看你的成绩，家庭，为人处世（和辅导员班主任的关系） 刘同学只能拼第一点，拼出来最好的结果就是成绩前10%，发了一堆paper，然后保研去清华 那还不如一开始就去清华呢 ", "url": "https://www.zhihu.com/question/2067354191148873307/answer/2077816383262540674", "votes": 683, "comments": 60, "feed_ts": 1788330355, "feed_time_str": "09-02 14:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看待705分去读哈工大？", "excerpt": "评论区充斥着“皇帝用金锄头”的感觉 首先，哈工大在名气上肯定是不如清华的，这个没必要否认，这个问题也不在于哈工大碰瓷 其次，哈工大也是吃过猪肉见过猪跑的。以前985只接本省清北二志愿，哪年不得几十个漏子，人家不是没见过学习好的。省14名的成绩固然亮眼，但也只是一个本科生而已，顶多拿个入学奖学金就完事了 还有脑补在哈工大会多受重视的，估计是连大学都没上过。因为高考成绩在你入学那天就已经归零了。后面比", "url": "https://www.zhihu.com/question/2067354191148873307/answer/2077462149794944692", "votes": 995, "comments": 88, "feed_ts": 1788330349, "feed_time_str": "09-02 14:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "银行为什么一定要让那些病重或卧床不起的老人本人到现场办业务？", "excerpt": "我以前站老人 后来一个银行妹妹告诉我，俩儿子拿母亲的卡过来取钱，说母亲病重了。户口本啥都到了，就差DNA检测了。因为数额较大，且老妈是VIP，银行要求本人到场，母亲电话也打不通，银行派妹妹上门办理。俩兄弟在柜台现场大闹一场，110都出面了。 下午妹妹带人去到老妈家，老妈戴着草帽，在看池塘跟工人修增氧泵，状态好的能打虎。 用妹妹的话说，硬生生做成了客户拜访，幸亏买了果篮，只带鲜花就完犊子。 俩兄弟在", "url": "https://www.zhihu.com/question/1996796145/answer/2058131640573075587", "votes": 3265, "comments": 168, "feed_ts": 1788330280, "feed_time_str": "09-02 14:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看待705分去读哈工大？", "excerpt": "完全没读过书的人才会抛出“鸡头凤尾论”。 让你在非洲小国省长和中国县长之间选择，这叫在鸡头凤尾之间选择，选什么都有道理。 你去哈工大是去当校长的吗？你去清华是去当院长的吗？你是去当普通学生的！ 这就好比，让你在非洲小穷国当公民和在中国当公民之间做选择。你会去非洲？？？ “鸡头凤尾论”是给官员说的，在小地方的大官和大地方的小官间选，不是给读书人说的。 这里默认同一专业，专业不同的话优先保专业和优先保", "url": "https://www.zhihu.com/question/2067354191148873307/answer/2077707244230145413", "votes": 959, "comments": 51, "feed_ts": 1788330255, "feed_time_str": "09-02 14:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看待705分去读哈工大？", "excerpt": "就是被家长给耽误了。 还有一堆人说什么“宁当鸡头不当凤尾”的，你们都在说什么梦话，高考成绩在你大学入学后基本作用就归0了，同学校同专业的资源量跟你高考多少分进的有几个关系？ 再说你凭什么认为你就能在哈工当鸡头？就凭你高考成绩高？哪怕按照绩优主义，本科期间，也不是只看你gpa的吧？就算看gpa，你就确定一定能当鸡头？ 就目前这家子拖后腿的程度来看，他未来能在哈工当个鸡脖子就不错了。 ", "url": "https://www.zhihu.com/question/2067354191148873307/answer/2077456411987128348", "votes": 2992, "comments": 248, "feed_ts": 1788330245, "feed_time_str": "09-02 14:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "银行为什么一定要让那些病重或卧床不起的老人本人到现场办业务？", "excerpt": "你爸妈卧床不起有一天嘎了，你去银行取遗产，发现被你兄弟姐妹叔叔阿姨把钱取走了，你就知道这个规定有多重要了。", "url": "https://www.zhihu.com/question/1996796145/answer/56460571403", "votes": 3010, "comments": 71, "feed_ts": 1788330242, "feed_time_str": "09-02 14:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看待705分去读哈工大？", "excerpt": "很多人理解力真是堪忧 首先 不是清北不收刘 而是家长不允许刘报清北 其次 不是刘要求家长陪读 而是家长要求陪刘读书 并要求清华在校内给父母提供工作和住宿 在清华做宿管阿姨不比在农村种田强啊 毕竟高中三年就是这么过来的 事出反常必有妖 这件事压根和什么励志报国没有半毛钱关系 完全是强势的学生家长主导的一出狗血剧 刘所在的四中是四平市排名第二的高中 这么多年来为了和一中竞争 每年中考后都要去下面县里抢", "url": "https://www.zhihu.com/question/2067354191148873307/answer/2077350105846396091", "votes": 4081, "comments": 574, "feed_ts": 1788330241, "feed_time_str": "09-02 14:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "习惯了右舵车，还以为会不小心开到左边道，但没想到最不习惯的还是油车加速的那种轰鸣。电车太安静了，几乎没有什么声音。对了，租的小型SUV，结果没想到这玩意这么大。", "excerpt": "习惯了右舵车，还以为会不小心开到左边道，但没想到最不习惯的还是油车加速的那种轰鸣。电车太安静了，几乎没有什么声音。对了，租的小型SUV，结果没想到这玩意这么大。", "url": "https://www.zhihu.com/pin/2078487660159558861", "votes": 0, "comments": 0, "feed_ts": 1788330197, "feed_time_str": "09-02 14:23", "category": "pin", "cat_name": "想法动态"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "一张心电图，AI不到2秒读出隐藏的心脏疾病信号", "excerpt": "编辑丨&amp; 8 月 31 日，在德国慕尼黑举行的欧洲心脏病学会（ESC）大会上，帝国理工学院（Imperial College London）公布了一组颇为醒目的结果：一种 AI 模型能够从普通心电图（ECG）中识别与 心力衰竭和心脏瓣膜疾病有关的隐藏信号，整个分析过程不到 2 秒。在约 67,000 名美国患者的数据中，模型最高识别出 81% 的心衰病例和 90% 的瓣膜疾病病例。这其中值", "url": "https://zhuanlan.zhihu.com/p/2078482452989867891", "votes": 1, "comments": 0, "feed_ts": 1788330014, "feed_time_str": "09-02 14:20", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "补档1", "excerpt": "催产素，作为一种由下丘脑产生的激素，对人类的社交能力和情绪行为有着至关重要的作用。[5] 催产素受体（OXTR）是一种蛋白质，由OXTR基因编码。 它作为催产素的受体发挥作用，OXTR基因通常会在乳腺肌上皮细胞中表达，并且也在妊娠末期的子宫肌层和子宫内膜中表达。 催产素受体（OXTR）与中枢神经系统相关。被认为在社交、认知和情绪行为中发挥着重要作用。[6] 耶鲁大学公共卫生学院的研究人员认为它的表", "url": "https://zhuanlan.zhihu.com/p/2009592471898825223", "votes": 1193, "comments": 175, "feed_ts": 1788327650, "feed_time_str": "09-02 13:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "发达国家都是跟美国走的，没有例外，为什么？", "excerpt": "对啊，我们也是跟着美国走的。 美国搞高科技，我们也搞高科技，美国搞AI，我们也搞AI，美国搞可回收火箭，我们也搞可回收火箭。 美国建航母，我们也建航母。 美国曾经是世界工厂，我们现在是世界工厂。 美国曾经是基建狂魔，我们现在是基建狂魔。 那些让美国国力变强的举措，我们都一样样地学会了呀。 这就是我理解的“跟着美国走”。 可能有些人理解的跟着美国走，是指美国下个命令，让你往西你就往西，往东就往东。这", "url": "https://www.zhihu.com/question/1973993235962684443/answer/2077135211645625796", "votes": 870, "comments": 151, "feed_ts": 1788327293, "feed_time_str": "09-02 13:34", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "重农抑商的逻辑链是什么?", "excerpt": "简单来说，不要拿现代去套古代。 你知道商人干什么事情最赚钱？ 垄断最赚钱。 在古代条件下怎么样能最快实现垄断？ 囤积居奇。 古代条件下，信息和物资流通是很慢的。 如果一个商人有足够的财力，他很容易就能把流入一个地方的某种重要物资都买断截流，人为制造稀缺，然后再高价卖出。越是大灾、减产的时候越容易搞这一套。 现代都能搞出“蒜你狠”、“姜你军”，1950年代都要打两白一黑经济战，古代那种条件，商人搞风", "url": "https://www.zhihu.com/question/665407702/answer/2078459029672694515", "votes": 406, "comments": 44, "feed_ts": 1788326056, "feed_time_str": "09-02 13:14", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "于朝阳", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "小红书是物质世界，知乎是认知世界，豆瓣是精神世界...", "excerpt": "小红书是物质世界，知乎是认知世界，豆瓣是精神世界...", "url": "https://www.zhihu.com/pin/2078470069542183575", "votes": 0, "comments": 1, "feed_ts": 1788325983, "feed_time_str": "09-02 13:13", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude Fable 5.1：安全日志为何留在企业云Claude Fable 5.1 这轮发布给出的新答案叫 Enterprise Frontier Safeguards，简称 EFS。它还没全面上线，但设计方向已经很明确：安全监控需要的数据，准备留在企业自己的云账户里。为什么 30 天留存会让企业卡住Anthropic 解释，复杂的滥用可能分散在多个会话和账号里。每次请求单独分析、立刻删除，监测系统很难看见完整模式。因此 Fable 5 开始采用 30 天数据留存。问题也在这里。金融、医疗、法务等团队处理的是敏感业务数据，往往不能再引入一家额外的数据保管方。模型能不能用，先卡在日志到底归谁管。EFS 怎么把监控和数据归属拆开EFS 的做法是把活动数据放进客户自己的云账户，例如客户已有的 Amazon S3、Azure Blob Storage 或 Google Cloud Storage。加密密钥、访问策略和审计日志都由客户控制。自动安全系统仍会在一段滚动时间里分析信号，识别严重的网络、生物安全风险和疑似泄露凭证。但出现 flag 后，信号直接交给客户团队核查，Anthropic 说不需要由自己的员工人工看客户内容。安全监控仍在运行，但存储和人工处置被放到客户的控制范围内。对受监管团队来说，这个架构细节比又多几分评测分数更接近采购时会问的问题。现在能用到什么，哪些还要等Fable 5.1 已普遍可用。Mythos 5.1 与 Fable 5.1 使用同一模型，但防护更宽，只通过 trusted access programs 向经过核验的网络防御和生命科学人员/组织提供；当前范围仍有限，不能当作普通用户已经可选的型号。EFS 会在今年秋季晚些时候分阶段推出。官方给出的过渡方案是：符合资格的客户，在 EFS 就绪前可使用 Fable 5 和 Fable 5.1 的 zero data retention。它不是所有账户已获得的默认能力，具体资格和接入节奏仍要向 Anthropic 确认。价格长上下文、工具密集的 agent 工作会反复读取已处理过的上下文。Fable 5.1 把这类缓存读取价格降了 75%，到每百万 token 0.25 美元；输入和输出 token 的其余定价没有变化。Anthropic 按 2026 年 8 月四周默认 effort 的使用情况估算，典型工作负载总成本约低 25%，高 agent 化工作负载最高约低 45%。这是官方口径，实际账单仍取决于缓存命中率、上下文长度和工具调用方式。这轮 Claude 5.1 同时交付了能力、成本和数据治理上的变化。Fable 5.1 已普遍可用；需要零留存或 Mythos 更宽防护的企业团队，还要先核对资格、地区和接入时间。", "excerpt": "Claude Fable 5.1：安全日志为何留在企业云Claude Fable 5.1 这轮发布给出的新答案叫 Enterprise Frontier Safeguards，简称 EFS。它还没全面上线，但设计方向已经很明确：安全监控需要的数据，准备留在企业自己的云账户里。为什么 30 天留存会让企业卡住Anthropic 解释，复杂的滥用可能分散在多个会话和账号里。每次请求单独分析、立刻删除，", "url": "https://www.zhihu.com/pin/2078464828704822243", "votes": 0, "comments": 0, "feed_ts": 1788324764, "feed_time_str": "09-02 12:52", "category": "pin", "cat_name": "想法动态"}, {"actor": "DefTruth", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "Qwen3.8-Max更强了！", "excerpt": "今天，Qwen3.8-Max升级到0902版本。 1个月前，我们发布并开源了Qwen3.8-Max，陆续收到了企业和开发者们的热烈反馈和建议。在此基础上，我们围绕编程（Coding）和专业办公（Cowork），对Qwen3.8-Max进行了进一步的后训练，使得模型整体性能再度突破，更适合企业真实复杂任务、科研、长周期任务等。 在CodeArena前端编程总榜中，Qwen3.8-Max提升22分至1", "url": "https://zhuanlan.zhihu.com/p/2078438726401901042", "votes": 23, "comments": 11, "feed_ts": 1788322928, "feed_time_str": "09-02 12:22", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "英语国家的人如何区分格鲁吉亚和美国乔治亚州？", "excerpt": "这个真的没什么好办法，无非是加备注和限定词，比如格鲁吉亚作为国家通常被写成“the country of Georgia”、“the nation of Georgia” 佐治亚州则写作“the state of Georgia”、“Georgia, USA”。 简而言之这也是一个由于英语瞎撰写导致的错误，佐治亚州这个地名的词源我们知道来自于1732 年，英国在北美建立殖民地时以当时英王汉诺威家族", "url": "https://www.zhihu.com/question/2077735726691639477/answer/2078389660204654720", "votes": 60, "comments": 0, "feed_ts": 1788322545, "feed_time_str": "09-02 12:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "林为珮", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为何星宇股份的孩子们给欧盟写信就管用，孟加拉国无数在地狱工厂给爱马仕LV们打工的奴工写信就没用呢？", "excerpt": "其实也有用，就是触发有条件。 今年上半年，孟加拉对欧盟成衣出口有16%的下滑，就有为CSDDD生效做前置采购筛选的原因。 说爱马仕LV用血汗工厂，是弄混了。 孟加拉的血汗工厂，主要是给快时尚品牌做代工的。 爱马仕没有孟 function esc(s) {

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];

}

    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

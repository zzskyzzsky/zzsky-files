01:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "给Transformer增加隐状态反馈：让相邻Token复用信息，减少训练算力\n图文版：链接顶层状态传给下一个 token，每个训练 token 更贵论文比较同样尺寸的普通 Transformer 和隐状态反馈模型。反馈把上一个位置的顶层状态经映射加到下一位置的输入。并行训练时，大多数更新先跑一遍得到状态，再带着反馈算损失和梯度。每个 token 的训练算力约是普通模型的 1.20 到 1.27 倍，同预算下实际读取的数据更少。实验使用去重的 Dolma 3，模型总参数从 6000 万到 7.78 亿。固定去重文本，算力收益随每参数数据量改变以普通模型两轮的算力为参照，每个非嵌入参数仅有 12.5 个去重 token 时，反馈模型达到相同验证损失反而约多花 8% 算力。每参数 100 个时可省约 15% 到 18%，400 个时省约 44% 到 48%。固定实际训练轮数则回答另一个问题。例如在 2.71 亿参数、两轮的对照里，反馈模型用每参数 50 个去重 token 能达到普通模型用约 1.34 倍数据的损失，折算下来约少用四分之一去重数据。7.78 亿档做留出验证，部署尺寸决定该怎么用省下的预算缩放定律用 6000 万至 2.71 亿档拟合，再预测 7.78 亿档，验证损失的最大相对误差为 0.29%。更大模型的节省估计属于外推。反馈模型逐 token 生成时已有上一位置状态可用，处理输入提示时还需要额外前向过程。如果服务允许扩大模型，论文的拟合也支持把同一笔训练算力用于更大的普通 Transformer，但生成成本和缓存会上升。原文标题：Latent Feedback Is a Compute and Data Amplifier#无影寺 ", "excerpt": "给Transformer增加隐状态反馈：让相邻Token复用信息，减少训练算力\n图文版：链接顶层状态传给下一个 token，每个训练 token 更贵论文比较同样尺寸的普通 Transformer 和隐状态反馈模型。反馈把上一个位置的顶层状态经映射加到下一位置的输入。并行训练时，大多数更新先跑一遍得到状态，再带着反馈算损失和梯度。每个 token 的训练算力约是普通模型的 1.20 到 1.27 ", "url": "https://www.zhihu.com/pin/2106918528351838987", "votes": 0, "comments": 0, "feed_ts": 1795108618, "feed_time_str": "11-20 01:16", "category": "pin", "cat_name": "想法动态"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么我觉得北京没有想象中的繁华？", "excerpt": "北京唯一比较接近“繁华”定义的地方就是朝阳，在朝阳你的生活可以无限接近一个国际化大都市，吃、穿、玩，朝阳可以找到一切你需要的，你可以找到老外比国内人还多的酒吧、live house、据说世界排名前十的披萨、各国菜系乃至非洲不知名小国特色菜、从苍蝇馆子风格的烟火气小店到高端的淮扬名菜、时尚买手店、艺术馆、文艺街区、鳞次栉比的天际线……如果单看朝阳其实跟上海的感觉很接近了。 （而且朝阳区的面积其实比你", "url": "https://www.zhihu.com/question/580653549/answer/2104983504392135153", "votes": 212, "comments": 55, "feed_ts": 1795108591, "feed_time_str": "11-20 01:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent Skill怎么越用越省Token？EfficientSkill先写对，再剪短图文版：链接EfficientSkill 先找可用做法，再压缩输出研究者固定执行任务的模型，让优化器用轨迹反馈改写 skill。第一阶段不惩罚输出 token，先找到验证通过率较高的版本。第二阶段从它出发，删掉冗余说明、限制轮数，把重复代码移到工作区脚本。主实验要求候选在验证集上的通过率至少达到起点版本的 90%。这个门槛用于筛选剪裁方案，最终表现另在留出题上衡量。ALFWorld 上的最大降幅为 79.7%四款模型分别在三个基准上和只优化准确率的 EvoSkill 比较，每组有 280 道留出题。12 个组合中有 11 个减少了平均输出 token，统计包括推理 token。ALFWorld 上的 Gemini 3.8 Flash 降幅最大，每次任务平均从 5,704 降到 1,155，通过率从 92.1% 升至 93.6%。直接从简短的初始 skill 开始剪裁，在论文展示的两组消融中更容易停滞。Gemma 的输出例外与通过率的变化ALFWorld 上 Gemma 4 26B 是唯一输出 token 增加的组合，从约 95 到 99。平均轮数减少，论文计费口径下的输入 token 和服务成本仍下降。各基准的平均通过率提高，部分模型与任务组合的通过率下降。也有通过率持平的情况，例如 SpreadsheetBench 上的 Claude Opus 5.5 两组均为 88.6%，输出 token 从 1,466 降至 761。剪裁的收益要结合通过率、轮数和计费口径判断。原文标题：EfficientSkill: Learning Skills for Token-Efficient Multi-Turn Agents#无影寺 ", "excerpt": "Agent Skill怎么越用越省Token？EfficientSkill先写对，再剪短图文版：链接EfficientSkill 先找可用做法，再压缩输出研究者固定执行任务的模型，让优化器用轨迹反馈改写 skill。第一阶段不惩罚输出 token，先找到验证通过率较高的版本。第二阶段从它出发，删掉冗余说明、限制轮数，把重复代码移到工作区脚本。主实验要求候选在验证集上的通过率至少达到起点版本的 90", "url": "https://www.zhihu.com/pin/2106918016793498781", "votes": 0, "comments": 0, "feed_ts": 1795108510, "feed_time_str": "11-20 01:15", "category": "pin", "cat_name": "想法动态"}, {"actor": "hades", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "Daeny 成为历史第一位双赛区全球总决赛冠军教练，如何评价他在 S16 总决赛的 BP 水平？", "excerpt": "教练界的goat，blg夺冠最大功臣，严格且正规的赛训+强大的bp是blg夺冠的关键。因为他的加入，lpl终于也拥有了一支堪比zofgk的银河战舰。 随着这款游戏的发展，比赛不再是壮汉拿着冷兵器对砍，而是热武器对轰，而赛训就是背后的兵器研发、维护和战术研究。 s8的ig就是最后一个肌肉冠军，他们夺冠就相当与一群拿着木棒的壮汉把所有对手粗暴的敲了个遍，只有最基本的队形，没有高级装备，也没有任何战术，", "url": "https://www.zhihu.com/question/2105217723886035275/answer/2106918095868711032", "votes": 8, "comments": 0, "feed_ts": 1795108419, "feed_time_str": "11-20 01:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent换任务，之前的优化经验怎么继承？SIM让Harness改动带着证据继续进化图文版：链接给框架优化器交接故障和改动的证据论文研究 agent 的运行框架怎样在换数据集或换解题模型后继续优化。自我改进记忆 SIM 把改动按故障根因归组，记录理由、事前预测、实际结果和模型、基准等评测条件。每轮提议与筛选都能读取记录，采纳的新改动补写回去。参与优化的任务与用于报告分数的留出任务分开，起点框架也必须能在目标环境运行。六组跨数据集迁移比较完整记录与只带根因研究比较冷启动、只交接源框架、交接框架和根因、交接框架和完整 SIM。后三组用相同源框架，匹配目标模型、十轮优化与候选预算。编码、文本分类、工作区和工程共六个数据迁移设置，完整 SIM const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#4c9aff", "gold": "#f5c542", "geo": "#ff9f45", "pin": "#52c41a", "other": "#9aa4b2"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

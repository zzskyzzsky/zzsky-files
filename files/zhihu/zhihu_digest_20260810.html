, "verb_cn": "赞了回答", "title": "你一个月到手多少？够花吗？", "excerpt": "坐标东北某省会。三甲肿瘤专科，90后，刚整完副高，干的是主治的活。 到手14000-20000 。公积金4800 媳妇跟我差不多。 住：房贷1700，上班之前的商业贷款，没啥压力就不提前还了。物业特别差，一年还要1908。车位一年1200管理费。电费150，水和煤气50。加起来一个月2000。 行：夏天电瓶车，一个月充电30。冬天6个月，开老妈给的2014款凯美瑞，汽油400，单位停车200，保险", "url": "https://www.zhihu.com/question/2041838902974100436/answer/2069789146990786094", "votes": 70, "comments": 19, "feed_ts": 1786296467, "feed_time_str": "08-10 01:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "对孩子最好的托举：第一、条件好就多吃牛肉，条件差就多吃鸡蛋。 ​第二、让孩子晚上10点前无条件睡觉。 ​第三、多观察孩子的牙齿、颌面，体态发育。第四、只要有时间就带孩子去户外，多跑多跳多晒太阳． ​第五、多陪孩子好好说话。情稳绪定，会沟通的孩子，走到哪都不吃亏。 第六、从小让孩子自己做事：收拾书包，整理房间，洗袜子，买东西． ​第七、多夸努力和态度。孩子不怕暂时落后，就怕觉得自己再怎么拼都没用． ​第八、数学思维越早培养越好． ​第九、家里再忙也要有固定的家庭时间。 ​第十、父母自己少玩手机，多看书多做事。很多父母总觉得，给孩子最好的教育，就是报最贵的补习班，买最好的学习资料，想尽办法让孩子赢在起跑线上。但真正拉开孩子差距的，往往不是某一次考试，而是藏在每天生活里的这些小习惯。一个身体健康、情绪稳定、有生活能力的孩子，未来遇到困难的时候，抗压能力会更强。很多时候，父母能给孩子最珍贵的东西，不是一套房子，也不是多少存款，而是一副健康的身体和面对世界的底气。很多家长容易忽略睡眠的重要性。孩子晚上熬夜写作业，看起来是在努力，其实长期睡眠不足，会影响注意力、情绪和身体发育。让孩子早点睡，并不是偷懒，而是在保护孩子未来几十年的状态。还有一个容易被忽略的地方，就是孩子的自理能力。很多父母太心疼孩子，什么事情都帮着做，书包帮收，房间帮整理，生活琐事全部包办。结果孩子成绩可能不错，但离开父母之后，连照顾自己的能力都不足。真正优秀的父母，不是替孩子解决所有问题，而是在孩子小时候一点点放手，让他学会承担自己的责任。陪伴也是一样。很多家庭每天都在一起，却很少真正交流。父母低头玩手机，孩子一个人在旁边玩游戏，这种陪伴其实只是“人在身边”。真正有效的陪伴，是一起聊天，一起读书，一起分享生活里的小事。孩子未来走得远不远，很多时候取决于小时候有没有建立起安全感。一个敢表达、会沟通、内心稳定的孩子，不管进入什么环境，都更容易适应。教育从来不是一场短跑，而是一场漫长的陪伴。父母能给孩子最好的礼物，不是替他铺好所有路，而是教会他拥有走好自己人生的能力。孩子最终拼的，不只是成绩，更是身体、习惯和内心的力量。好的家庭教育，就是把孩子培养成一个能够独立面对世界的人。 #亲子陪伴 #自理能力 #育儿经验 #托举 #鼓励孩子很重要 ", "excerpt": "对孩子最好的托举：第一、条件好就多吃牛肉，条件差就多吃鸡蛋。 ​第二、让孩子晚上10点前无条件睡觉。 ​第三、多观察孩子的牙齿、颌面，体态发育。第四、只要有时间就带孩子去户外，多跑多跳多晒太阳． ​第五、多陪孩子好好说话。情稳绪定，会沟通的孩子，走到哪都不吃亏。 第六、从小让孩子自己做事：收拾书包，整理房间，洗袜子，买东西． ​第七、多夸努力和态度。孩子不怕暂时落后，就怕觉得自己再怎么拼都没用． ", "url": "https://www.zhihu.com/pin/2067627262426477874", "votes": 0, "comments": 126, "feed_ts": 1786296312, "feed_time_str": "08-10 01:25", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", 把“配偶”放在“亲属”的第1位？", "excerpt": "因为这几乎是你唯一可以自由选择的法定意义上的最近亲属，国内的性少数群体连这个权利都没有，只能靠硬蹭意定监护来打擦边球。 如果你不满意这项权益，完全可以像国内的性少数一样只谈恋爱不结婚，纯靠感情维系两人关系，两人之间没有任何法定义务和财产联系。这样也挺好。 ", "url": "https://www.zhihu.com/question/628507781/answer/2068430976338997388", "votes": 65, "comments": 42, "feed_ts": 1786293812, "feed_time_str": "08-10 00:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "把 skill 文档甩给模型没用，得让它学会怎么&#34;忠实使用&#34;\n图文版：链接SKT 训练的目标公开记录称 skill 已超过 60 万个，但模型还要学会识别任务相关性、遵守操作约束、协调多 skill 并调用工具。上海人工智能实验室的 SKT 从 2,000 个公开 skill 出发，构造可验证的 skill 使用任务与执行轨迹，用来微调 Qwen3.5-9B 和 Gemma 4 E4B-IT。4,000 个任务的筛选条件SKT 允许单、双、三 skill 任务，并用模板生成指令、隔离环境、评估器与参考方案。任务需通过规则检查、agent 语义检查和“提供 skill 时得分更高”的依赖检查；强模型在 OpenCode 与 DeepAgents 中执行后，只有结果正确、确实使用指定 skill 的轨迹会保留。最终得到 4,000 个任务和 27,164 条验证轨迹。16 组模型-harness 比较四个基准的 16 组配对比较全部提高，增幅为 3.20 至 18.91 分。最大增幅来自 Qwen3.5-9B + DeepAgents 在 SkillEval 上的 51.62 到 70.53；SkillEval 使用的 skill 与训练池无重叠。移除外部 skill 后，优势缩小到 0.53 至 5.69 分，增益主要依赖运行时使用文档。使用条件未验证合成数据微调会让四项均值下降 1.9 至 19.5 分，显示任务与轨迹验证是关键环节。SKT 依赖客观可评分任务、隔离环境、稳定参考方案与执行 harness；论文没有证明它能覆盖全部公开 skill 或直接迁移到真实线上任务。原文标题：SKT: Skill-Use Training at Scale via Verified Synthetic Data Generation#无影寺 ", "excerpt": "把 skill 文档甩给模型没用，得让它学会怎么&#34;忠实使用&#34;\n图文版：链接SKT 训练的目标公开记录称 skill 已超过 60 万个，但模型还要学会识别任务相关性、遵守操作约束、协调多 skill 并调用工具。上海人工智能实验室的 SKT 从 2,000 个公开 skill 出发，构造可验证的 skill 使用任务与执行轨迹，用来微调 Qwen3.5-9B 和 Gemma 4 E", "url": "https://www.zhihu.com/pin/2069944766222054607", "votes": 0, "comments": 0, "feed_ts": 1786293387, "feed_time_str": "08-10 00:36", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "含有大量lgbt元素的游戏中的角色是否会偏丑？", "excerpt": "“多买冰淇凌是否会導致更多人溺水？”不会，但是北美的 “多元包容”宷査机构会同时给角色硬塞LGBTQ+设定并把角色建模变醜。如果你在冬天买冰淇凌，无论买多少，都不会增加溺水人数。LGBTQ+群体原本就是文埶作品中常见的意像，而且笔力够彊的创作者能讓这类角色无缝融入世界觀，使之与勮情發生有效互動（比如沈腾经常在他们电影裏整点男同……但整得還真不错）。 这和“多元包容”宷査机构硬塞的设定是天壤之别的。", "url": "https://www.zhihu.com/question/2068009751426904963/answer/2069844610017501764", "votes": 27, "comments": 1, "feed_ts": 1786293361, "feed_time_str": "08-10 00:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "KV缓存都命中了,为什么首token延迟还是很高?\n图文版：链接1.4K 字符追加的前端瓶颈153,951 次 coding agent 调用中，新增文本中位数 1.4K 字符，上下文为 86K 至 123K token。prompt 缓存命中率为 94.1%；命中率接近 0.99 时，前端分词在首 token 延迟中的占比从 10% 升至 64%，KV 状态复用后仍要全量扫描。稳定边界决定能否拼接TokTier 保存每个会话的 token ID 与字节跨度，只重新分词新增文本和旧上下文末尾窗口。找到可验证的稳定预分词边界后才拼接；失败就扩大窗口，最多五次后回退完整参考分词。初始化与重建请求占 1.0% 至 3.6%，走精确 GPU 路径或参考 CPU 路径。延迟与 vLLM 结果1M 字符 Qwen3 会话上，TokTier 修复为 1.23 ms，完全预热的 Gigatoken 为 2.53 ms，HuggingFace 串行分词为 318.0 ms。接入 vLLM 后，受载场景 TTFT 中位数下降 16% 至 34%；突发回放中 P99 从 2,961 ms 降至 2,288 ms。4 个 CPU 修复核心加 1 块 GPU 在 50 ms P99 目标下达到 1,821 请求/秒。使用边界45 倍以上的容量差来自不同硬件配置，不能当作等资源效率。TokTier 对 KV 状态仍在、持续小追加的长会话最有价值；KV 被逐出后，两条通道都会回到完整 prefill。Qwen3 的 4.4M 字符样本中，部分输入会回到 CPU 规格化，P90 可升至 133 ms。原文标题：TokTier: Exact Stateful CPU+GPU Tokenization for Agentic LLM Serving#无影寺 ", "excerpt": "KV缓存都命中了,为什么首token延迟还是很高?\n图文版：链接1.4K 字符追加的前端瓶颈153,951 次 coding agent 调用中，新增文本中位数 1.4K 字符，上下文为 86K 至 123K token。prompt 缓存命中率为 94.1%；命中率接近 0.99 时，前端分词在首 token 延迟中的占比从 10% 升至 64%，KV 状态复用后仍要全量扫描。稳定边界决定能否拼", "url": "https://www.zhihu.com/pin/2069944296057345658", "votes": 0, "comments": 0, "feed_ts": 1786293266, "feed_time_str": "08-10 00:34", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "不调用 LLM，Zero-Mem 把 agent 记忆操作耗时减少 57.6%\n图文版：链接零 token 的范围Zero-Mem 把 LLM 从 agent memory 的构建、组织、路由、检索和校准中移开，只在最终问答时调用 reader。它保留原始交互轨迹，避免用生成式摘要替代历史；编码器计算和最终问答推理仍需单独核算，因此“零 token”只指 memory 操作阶段。实体图加时间层次系统用实体-上下文图连接分散的关系证据，用按轮次、窗口、片段和局部邻域组织的时间层次保留会话状态。查询先提取主语、时间和答案类型等线索，再动态融合两路检索结果，并通过确定性校准剔除不满足来源或边界条件的候选。LoCoMo 与 HotpotQA 结果相同 reader 和上下文预算下，Zero-Mem 的 memory 操作耗时比最快对比基线 LightMem 少 57.6%。统一配置中，它的总耗时为 334.77 秒、每次查询 0.22 秒，memory 操作 LLM token 为零；LightMem 对应 788.76 秒、0.51 秒和 877,086 token。LoCoMo 上，GPT-4o-mini reader 的平均 F1 为 59.15、BLEU-1 为 52.96。可用结论HotpotQA 的 56K、224K、448K token 设置及 LoCoMo 的结果显示，原始轨迹上的结构化证据选择可以维持有竞争力的问答表现。57.6% 只对应论文的 memory 操作计时，不能直接外推为整个 agent 的响应速度或全部部署成本。原文标题：Zero-Mem: Zero-Token Memory Operations for LLM Agents#无影寺 ", "excerpt": "不调用 LLM，Zero-Mem 把 agent 记忆操作耗时减少 57.6%\n图文版：链接零 token 的范围Zero-Mem 把 LLM 从 agent memory 的构建、组织、路由、检索和校准中移开，只在最终问答时调用 reader。它保留原始交互轨迹，避免用生成式摘要替代历史；编码器计算和最终问答推理仍需单独核算，因此“零 token”只指 memory 操作阶段。实体图加时间层次系", "url": "https://www.zhihu.com/pin/2069943516143400002", "votes": 0, "comments": 0, "feed_ts": 1786293155, "feed_time_str": "08-10 00:32", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么评价王楚钦『输了就输了呗』这句话？", "excerpt": "预判未来岁月史书话术一览， “其实我们5000年乒乓球就没有领先过，只是因为偏安一隅给我们的错觉。” “波尔比国乒三剑客强多了。” “樊振东是偷张本智和冠军的，张本实力冠军。” “刘跟孔都是靠遮拿的冠军。” “国乒是小球厉害，改大球以后一直不如西方人。” “举国体制陪练练出来的冠军，现在人家也针对陪练就不行了。” “瓦拉德内尔才是乒乓球第一人。” “国乒一直不如欧美日韩。” “国乒就输在他们真要下", "url": "https://www.zhihu.com/question/1907861426183337285/answer/2068472011563832065", "votes": 8788, "comments": 280, "feed_ts": 1786292570, "feed_time_str": "08-10 00:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "lgbt群体总是和dei一起挨喷，既然这样那为什么不和dei切割呢？", "excerpt": "如果LGBT被喷真的是因为DEI，那么你为什么不只喷“支持DEI的LGBT”呢？如果你认为DEI不好，那么你为什么不直接喷（任何性别、种族、国籍、阶级的）支持DEI的人呢？因为讨厌DEI而喷LGBT群体本身就是莫名其妙的。 LGBT群体又不是一个有独立意志的个人，怎么可能主动和某个东西切割呢？这种说法根本就是范畴错误。 利益相关：我真的是“反对DEI的LGBT”……我是自我认同为性别流体的康德主义", "url": "https://www.zhihu.com/question/2068975394645096317/answer/2069941581034137034", "votes": 10, "comments": 0, "feed_ts": 1786292531, "feed_time_str": "08-10 00:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价沙特、巴基斯坦、土耳其三国签的防务协定，也门胡塞和伊朗的联动封锁能否持续，对油价有何影响？", "excerpt": "沙特土鸡小巴，简称沙—鸡—巴联盟", "url": "https://www.zhihu.com/question/2069252730074485781/answer/2069373671 18, "feed_time_str": "08-09 19:40", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "CVPR 2026 | 扩散模型背图是因为score权重太尖", "excerpt": "扩散模型的memorization，甚至生成的图有时和某张训练图几乎一模一样。 对此从分布演化角度有个解释： 如果网络把经验score（对应训练集经验分布的score）学到完美，按Fokker-Planck方程，采样最终会回到训练分布本身，生成不出新东西。 可现实里扩散网络确实能生成新样本，这个就和理论有出入，所以网络到底靠什么绕开了memorization？ 作者把经验score描述出来： 它 ", "url": "https://zhuanlan.zhihu.com/p/2069717006195152583", "votes": 4, "comments": 0, "feed_ts": 1786274469, "feed_time_str": "08-09 19:21", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "梅西的父亲豪尔赫·梅西去世了，享年68岁，他对梅西的职业生涯有哪些影响？", "excerpt": "皇马官方：对梅西父亲的去世深切哀悼。 微博热搜：阿根廷队长父亲去世。 我只能说作为曾经的对手，皇马也比国内某些鸡肠鼠肚的小丑有气量得多。 国内某些人，你要是不想出现这个名字，那就麻烦有骨气一点，把梅西有关的任何东西彻底封杀掉，就当世界上不存在这号人。又想蹭热度又不敢直呼其名，还自作聪明的说什么阿根廷队长，把你给能的怎么不说迈阿密队长和安东内拉老公呢？ ", "url": "https://www.zhihu.com/question/2069494841793328681/answer/2069698821786023822", "votes": 690, "comments": 73, "feed_ts": 1786273277, "feed_time_str": "08-09 19:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中餐这么丰富，为什么没有一道菜的国际影响力能胜过汉堡炸鸡？", "excerpt": "因为中餐是周制食物，崇尚的是烹饪自由，每家每户做出来的菜口味浓淡都不一样，每个知名中餐馆子都有不外传的秘方，每个厨子都有自己琢磨出来心得的拿手好菜，对于一道菜的味道从来就没有统一的量化标准，每个餐馆的最终口味都是基于一个小共同体的选择。 而汉堡和炸鸡是秦制食物，崇尚的是标准的工业化、流水线化生产，推崇统一的烹饪标准和配料表，白羽鸡从饲养到屠宰到食材配比都需要高度服从统一的制度和计划，不允许顾客进…", "url": "https://www.zhihu.com/question/2005167628960933434/answer/2069784779566981456", "votes": 340, "comments": 18, "feed_ts": 1786273248, "feed_time_str": "08-09 19:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "一波说酒发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "郎酒天宝洞藏酒兼香型测评，瓶子造型挺古怪#一波说酒  #郎酒天宝洞藏  #郎酒兼香型  #老酒 ", "excerpt": "郎酒天宝洞藏酒兼香型测评，瓶子造型挺古怪#一波说酒  #郎酒天宝洞藏  #郎酒兼香型  #老酒 ", "url": "https://www.zhihu.com/pin/2069092286533727878", "votes": 0, "comments": 2, "feed_ts": 1786273224, "feed_time_str": ", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么现在的文字都是横排的，而不像古代一样竖着写？", "excerpt": "有点反直觉的是：横排其实到1955年后才逐渐成为主流，在此之前主流都是竖排。横排能后来居上是材料、笔具变化和西学东渐共同推动的结果，科学角度来说横排的书写和阅读更加高效。古人为什么要竖着排版，竖着写？因为材料学的限制——椠(qiàn) [1]、觚(gū)[2]、版、牍、牒、简、函、策这些古代书写载体都更适合竖着写，竖着看。上面提到的那些书写载体都是竖长的，著名学者钱存训在《书于竹帛》中对此有过专门", "url": "https://www.zhihu.com/question/2068820871586779966/answer/2069124440647111770", "votes": 536, "comments": 122, "feed_ts": 1786266772, "feed_time_str": "08-09 17:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "释迦牟尼都感叹怎样做都有人指责，所以凡夫做自己就行", "excerpt": "释迦牟尼都感叹怎样做都有人指责，所以凡夫做自己就行", "url": "https://www.zhihu.com/pin/2069123470244439170", "votes": 0, "comments": 10, "feed_ts": 1786266536, "feed_time_str": "08-09 17:08", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "谁来说说中粮梅林牌的午餐肉的质量如何？", "excerpt": "1. 我一般在晚餐的时候吃午餐肉。 不是因为我是一个叛逆的人，而是我每天晚上都要吃火锅。 我会把这款冷食拿来涮火锅。 再准确点说，必须得是梅林，还不能是那种高端产品线，得是那种最普通的有明确的粉粉感的那种才行。 别的午餐肉的感觉不对，就像炒饭应该用隔夜饭。 梅林午餐肉遇到火锅，就像是增程车车主看到了充电桩，冰红茶加了冰，唢呐碰到了白事会。 不算开挂，算开了全险半挂。 在这个赛道跟梅林对线的午餐肉品", "url": "https://www.zhihu.com/question/423263615/answer/2069831568194008155", "votes": 192, "comments": 17, "feed_ts": 1786266302, "feed_time_str": "08-09 17:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你看过哪些离了大谱的抗日神剧？", "excerpt": "《永不磨灭的番号》。 我记得两个人被日本人包围，躲在一口钟里，一边抬一边走。这口铜钟很厚，日本人打不穿，拿他们没办法。似乎就这么从县城里逃了出去。 当初我在鼎盛论坛，看到赞扬这个片子的，说终于有不是神剧的抗日片了。我看了几集前面还可以，直到这个创意。你说能几十米外扔手榴弹扔进射击孔，我都当有历史原型。抬着一口钟，这个实在太过分了。 当然，这部作品的作者我知道是谁，贡献了一个非常知名的天涯神贴。我丝", "url": "https://www.zhihu.com/question/657923366/answer/2069830364617609626", "votes": 92, "comments": 21, "feed_ts": 1786266015, "feed_time_str": "08-09 17:00", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", 切实的影响全球的产业链分布，经济，甚至地缘等一系列的人类的组织结构。那么货币也好，全球化也好，金融金融衍生债务也好。会面临怎样的影响？这是一个非常值得思考的方向，也是我所说的能够博大家一笑的方向。诸位上帝们，我是个蠢人，蠢人一思考，上帝就发笑😊", "excerpt": "这几天把气候、债务、产业链、地缘揉在一起思考，得出一个不太成熟的判断，博大家一笑：全球化不是死于贸易战，是死于物理规律。气候极端化（上新世回归+强厄尔尼诺+超级海洋热浪）→ 全球航运准时制（JIT）物理性崩塌 → 产业链全球排布失去存在基础。在这个前提下，所有基于“全球配置”的财富逻辑，都将面临生态位重置。国际游资、世界公民、金融中立国——这些旧时代的赢家，在地区壁垒化的新世界里，其存在意义正在归", "url": "https://www.zhihu.com/pin/2069817909644465766", "votes": 0, "comments": 3, "feed_ts": 1786264206, "feed_time_str": "08-09 16:30", "category": "pin", "cat_name": "想法动态"}, {"actor": "大水哥", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么程序员大多都拥抱AI，而音乐人却抗拒并隔离AI音乐池？", "excerpt": "AI生成的代码可以跑，也仅仅是可以跑。 在架构设计层面会模块之间没有隔离会互相依赖，会有严重的循环依赖反向依赖问题，乱造概念概念之间边界不清，结构混乱。在编码层面违反最基本原则：单一职责、依赖倒置、开闭、里氏替换、接口隔离。 在交互设计层面，布局会直接平铺没有层级，复杂交互、多层级嵌套、长列表虚拟滚动会有bug。 功能层面，会丢功能。需求越大越复杂丢的越多。 不需要程序员，任何认知健全的人使用都会", "url": "https://www.zhihu.com/question/2063944037544023265/answer/2069818588203050617", "votes": 16, "comments": 1, "feed_ts": 1786263207, "feed_time_str": "08-09 16:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中餐这么丰富，为什么没有一道菜的国际影响力能胜过汉堡炸鸡？", "excerpt": "汉堡炸鸡就是工业时代的工业方式生产的食物。所以无论在下料猛，味道足，热量高，出餐快、翻桌率高，收拾简单等各个方面都很适合你赶紧吃了去上班，立即换下一批牛马来吃。 中餐就是农业时代产物，所以中餐适合晚上吃，因为闲下来，慢慢整。其实吃不光是杯盘狼藉，还有社交，还有人情，是回归人类本性。人类本性就是一边吃饭一边八卦。 以前人类最恨的就是牛马细嚼慢咽草料不上工，所以发明了加盐的精饲料。又快又有热量又好吃。", "url": "https://www.zhihu.com/question/2005167628960933434/answer/2069817221585622035", "votes": 47, "comments": 0, "feed_ts": 1786262881, "feed_time_str": "08-09 16:08", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "gwave", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么ChatGPT已经发布4年了，社会总生产力纹丝不动？", "excerpt": "这个问题其实有点像当年电力刚进入工厂时的争论。 电动机发明以后，工厂并没有马上发生革命性的变化。很多企业把原来的蒸汽机换成电动机，生产线布局、管理方式、人员组织完全没有改变，所以效率提升非常有限。真正的生产力跃升发生在几十年以后——企业开始按照电力的特点重新设计工厂，流水线、自动化生产才逐渐出现。 AI 现在也处于类似阶段。 如果只是给每个员工配一个 ChatGPT，让大家写邮件、总结文件、生成代", "url": "https://www.zhihu.com/question/20655831576640184 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

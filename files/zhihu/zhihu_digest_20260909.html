 1788873900, "feed_time_str": "09-08 21:25", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "多部门印发通知，扩大灵活就业人员等群体基本医保参保规模，哪些要点值得关注？", "excerpt": "我第一反应是什么吧。 城乡居民医保，也就是新农合，大概率要涨价了。 因为现在很多外出务工的灵活就业群体，大多选择在户籍地交城乡居民医保（也就是大家常说的新农合），实际报销待遇和职工医保相比，有差距但并没有大到天差地别，但结合缴费成本看，二者的性价比差距其实非常直观。 简单算笔账： 城乡居民医保一年一交，普遍就是几百块钱，2025年全国大多在380到400多元的区间。 但灵活就业人员自己交职工医保，", "url": "https://www.zhihu.com/question/2080677705813643332/answer/2080766323697758917", "votes": 143, "comments": 26, "feed_ts": 1788873351, "feed_time_str": "09-08 21:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "未来加电站发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "合资品牌“中国芯”反攻：救赎还是最后的挣扎？2026，合资品牌“中国芯”反攻：救赎还是最后的挣扎？一、主持人孙少军（发起人与引导者）核心观点：合资品牌将在2026年大规模推出新能源车，成都车展上宝马iX3、奔驰GLC EV、奥迪e-tron、丰田铂智、日产N7、别克E7等均已亮相，产品大量采用中国供应链（宁德时代电池、Momenta智驾、中国座舱）。主持人亲临宝马发布会，发现宝马完全放弃欧洲风格，转而讲大圆柱电池和辅助驾驶，产品“中国化”极重。他质疑：合资品牌用中国供应链，能否比国产车更靠谱？传统研发流程加速算不算“速成”？同时认为车展媒体传播价值大幅降低，未来或沦为卖车场景。二、诸葛大佬（前长安福特从业者）核心观点：合资品牌回不到过去，大众400万辆、丰田300万辆、奔驰60万辆的辉煌不可复制，目标仅为维持运营、避免退出。丰田大众或能维持几十万到百万辆规模，但份额必然下降。传统七年换代、三到五年改款不适应中国，现需十二到十八个月改款、四年换代，这是技术迭代的必然，并非“速成”。本田、现代、福特均向中国节奏对齐，传统流程在快节奏下未必是优势。三、硕士（市场与产品策略角度）核心观点：合资车分两类，在中国诞生用中国团队研发的（大众ID、日产N7）尚能一战；海外诞生转销国内的（多数BBA）困难较大。宝马iX3驾驶舱偏窄，用户预期价格偏高，实际成交不乐观，若定价二十一二万会好一些。奔驰E级已降至27万，30到40万价格带被国产车（极氪、问界、小米）挤压，BBA上下受堵。宝马iX3采用代理模式、无需压库存是进步，但整体难卷土重来。四、艹老师（激进的产品批评者）核心观点：宝马iX3圆形屏幕设计反人类，方屏是全世界通用标准，圆形注定被淘汰。高端品牌转型慢被批评，但真转过来又可能丢失高端感，用户跑掉，形成悖论。使用Momenta只是补短板，座舱、尺寸（4米8卖20多万）等短板仍多，消费者对宝马标的认可度已大幅下降。重点关注宝马后轴励磁电机碳刷问题，历史故障频发，质疑其可靠性，讽刺道“到底谁是速成车还不一定”。五、车展与出口形势（多人互动）主持人认为成都车展人流尚可但媒体热度低，明年参展费不会降但规模会缩小。近期海外出口竞争激烈、压力巨大，局势严峻。整体结论：各方共识是合资品牌依靠中国供应链和加速研发，最多争取不被清出中国市场，难以重回巅峰。产品细节（屏幕、电机）和市场环境决定反攻极为困难，各品牌最终销量将远低于历史高点。", "excerpt": "合资品牌“中国芯”反攻：救赎还是最后的挣扎？2026，合资品牌“中国芯”反攻：救赎还是最后的挣扎？一、主持人孙少军（发起人与引导者）核心观点：合资品牌将在2026年大规模推出新能源车，成都车展上宝马iX3、奔驰GLC EV、奥迪e-tron、丰田铂智、日产N7、别克E7等均已亮相，产品大量采用中国供应链（宁德时代电池、Momenta智驾、中国座舱）。主持人亲临宝马发布会，发现宝马完全放弃欧洲风格，", "url": "https://www.zhihu.c n/2080713693583753956/answer/2080718721082042270", "votes": 299, "comments": 4, "feed_ts": 1788866270, "feed_time_str": "09-08 19:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "ChinaGT 赛车爆燃，79 号车手火海救人，如何评价其英勇行为？", "excerpt": "这位赛车手确实是英雄没话说。 但我必须尖锐的指出，那个只拿了几十块一天只负责维持秩序根本不懂灭火但依然顶着火焰把灭火器交到他手里的当保安弄不好都超龄的老大爷，简直是性价比超人。 ", "url": "https://www.zhihu.com/question/2079895797890540756/answer/2080735775642202615", "votes": 1325, "comments": 33, "feed_ts": 1788866067, "feed_time_str": "09-08 19:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "据说东晋时才发明的马蹬，很奇怪卫青霍去病怎么组织的数十万骑兵会战？", "excerpt": "我来自锡林郭勒，蒙古族， 四岁开始骑马。观点：① 原始人就有马蹬（皮条为主）；②马镫（蹬）对草原人帮助更大；③历史上全世界都没有在一场战斗里投入超过十万人以上的纯骑兵会战。下面我以一个四岁开始骑马的资深 野生骑手的角度，普及一点关于骑马的常识。第1个反常识：骑马其实是坐在上面，马镫能让腿更轻松。决定你能否骑在一个马上的决定性因素是马 是否驯服，唯有在拥有一匹驯服的马之后才有必要谈及马鞍马镫。换而言", "url": "https://www.zhihu.com/question/497079999/answer/1969399977181705783", "votes": 9821, "comments": 1186, "feed_ts": 1788865600, "feed_time_str": "09-08 19:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "邓德全说书", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "丹麦老板称越南建厂成本比中国贵 10%，这透露出全球供应链怎样的变化？", "excerpt": "一般此类文章的主旨都是说“供应链神话”，声称上下游集群加上配套设施大大降低了生产成本，让其他国家无法望其项背。 很多人不知道世界曾经有过四次产业转移，从英联邦到美国，从美国到日本，从日本到亚洲四小龙，从亚洲四小龙到中国。 是因为别人的供应链更神话才转移的吗？显然不是，起码我国九十年代没有神话。 另外，我做买卖那么多年，从没听说会养鱼才能卖鱼或者会养鸡才能卖鸡，只要能买到的东西，根本就不需要供应链，", "url": "https://www.zhihu.com/question/2080340515971715574/answer/2080625035262300656", "votes": 567, "comments": 169, "feed_ts": 1788865422, "feed_time_str": "09-08 19:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "邓德全说书", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "丹麦老板称越南建厂成本比中国贵 10%，这透露出全球供应链怎样的变化？", "excerpt": "很简单，企业家不是傻子，如果在越南生产商品的成本会比在中国生产高10%，但却可以比在中国生产的商品便宜15%的关税卖到美国去，你说企业家将产品搬到越南是不是正确的行为呢？ 所以，企业家决定是在越南还是中国制造商品就是比较两个价格，一是生产成本价，二是这件产品最后走到消费者 e": "主要是，AfD身为德国的党派，反而主张退出欧盟和欧元区这两条太逆天了。排除接受难民的配额问题和金融政策工具不完全归同一个国家说了算这两件事。其他所有方面，你德法两国主持欧盟和发明欧元区是占便宜还是吃亏了，心里真没数吗？勒庞和AfD一个个都是“陛下何故谋反”甚至“陛下何故主动退位”？！不过AfD真上台了也肯定退不成欧盟和欧元区，因为德国的体制跟英国不一样，这种重大决策不允许根据某一次投票简单多数就决定，何况即使全民公投也很难过半支持退欧。第二个问题就是亲近莫斯科，甚至反对者们认为AfD直接收卢布了。不过BSW甚至Linke的选民也亲俄，自从帝俄搞泛斯拉夫主义和苏联成立以后，任何掌握莫斯科的政权都是极端左右共同的神像[飙泪笑]这个规律不断被验证[飙泪笑]。而且AfD如果只在地方州议会和州政府上台，它亲俄与否对德国外交没有太大影响。因为德国在外交和军事方面是伪联邦制，已经比神罗和德二中央集权多了。但是，躲得了一时，躲不了一世。长远看来，我还是对德国的体制安全性有所怀疑了。毕竟在联邦议会层面能维持禁止一切极端左右成功组阁的前提是所谓“正常党派”应该总计席位能占三分之二才行，如果所有“正常党派”加起来才勉强过半，甚至只有一半议席。那为了防止另类“老鼠上桌”，就必须硬着头皮搞四个党派以上的联合组阁，然后必然如菲利克斯老师文中所言：这就是shit，哪怕各“正常党派”入阁的那些部长大臣不故意互相拆台，他们自己所属党派的议员们也不可能永远团结，必然互相拆台拖后腿，鸡同鸭讲，四五个党派四五个不同的施政方向。然后就一塌糊涂，更加催化了他们原有的选民去支持AfD。所以总有一天，要么宪法法院在联邦德国层面冒着得罪一半选民的危险直接解散AfD。要么AfD真的上台（哪怕在联邦议会里，总有一天AfD席位可能占到40%以上，只要CDU或Linke任何一家叛变“正常党派护法联盟”，就完了）", "excerpt": "主要是，AfD身为德国的党派，反而主张退出欧盟和欧元区这两条太逆天了。排除接受难民的配额问题和金融政策工具不完全归同一个国家说了算这两件事。其他所有方面，你德法两国主持欧盟和发明欧元区是占便宜还是吃亏了，心里真没数吗？勒庞和AfD一个个都是“陛下何故谋反”甚至“陛下何故主动退位”？！不过AfD真上台了也肯定退不成欧盟和欧元区，因为德国的体制跟英国不一样，这种重大决策不允许根据某一次投票简单多数就决", "url": "https://www.zhihu.com/pin/2080413051006858229", "votes": 0, "comments": 21, "feed_ts": 1788853393, "feed_time_str": "09-08 15:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你见过哪些奇特的真实名字？", "excerpt": "一个很常见的名字， 郑伟。这个名字在别的地方倒是没啥问题，在部队里有些场合就不大合适了，有时候还是要注意一下。 你总不希望看到一个小排长怒喝一声： “郑伟！你他妈是猪脑子吗？” 郑伟一个哆嗦； 政委也一个哆嗦。 ", "url": "https://www.zhihu.com/question/20442280/answer/2080681975317374436", "votes": 306, "comments": 42, "feed_ts": 1788853240, "feed_time_str": "09-08 15:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "ZDF政治晴雨表：CDU支持率首次跌破20%", "excerpt": "ZDF政治晴雨表：CDU支持率首次跌破20%", "url": "https://www.zhihu.com/pin/2080676932300042996", "votes": 0, "comments": 30, "feed_ts": 1788853239, "feed_time_str": "09-08 15:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEU 的？", "excerpt": "其他不谈，就单独聊聊从古代小祖宗们玩的玩具和游戏，都能让我们这些现代人大吃一惊。 现代小孩子爱玩的绳子拉小车，早在汉代就已经出现了；现代的跳绳早在汉代就有了；我们小时候都玩过的斗草游戏，南北朝就已有记载；婴儿学步车宋代就有了；古代孩童的生活远比想象中丰富，捶丸、蹴鞠、过家家、不倒翁、拨浪鼓、陀螺、千秋、木偶戏、益智类、健身类、观赏类都有…… 古代孩童从来不需要被父母睡扁头（满清陋习），所以古画中呈", "url": "https://www.zhihu.com/question/1952114595461333238/answer/1990948790539150225", "votes": 5243, "comments": 500, "feed_ts": 1788846843, "feed_time_str": "09-08 13:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "作为漢族，你是如何感受到祖先伟大血脉的召唤的？", "excerpt": "缅北买卖猪仔，嘎腰子，越想越不对，这与满清历史上发生的事何其相似，背后没有强大的政治实体支持是不会存在这种顽疾的，是我们发现了历史真相还是我们一直都在历史中", "url": "https://www.zhihu.com/question/1952114595461333238/answer/2072117206117307443", "votes": 2613, "comments": 44, "feed_ts": 1788846782, "feed_time_str": "09-08 13:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "焦尔吉娅·梅洛尼是如何坚持这么久的？", "excerpt": "执政 1413 天：左翼内部的分裂、盟友的软弱，以及左翼难以长期抵抗，都与此有关。 2022年10月23日，焦尔吉娅·梅洛尼（Giorgia Meloni）在基吉宫就职典礼当天接受部长会议钟声。9月4日星期五，在她就职的第1413天，焦尔吉娅·梅洛尼创造了一项历史纪录：自共和国成立以来（即1946年），没有任何一届政府的任期能与她的政府相提并论。考虑到意大利政治的惯例，这本身就是一项非凡的成就，而", "url": "https://zhuanlan.zhihu.com/p/2080338171036950935", "votes": 75, "comments": 11, "feed_ts": 1788846656, "feed_time_str": "09-08 13:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "特斯拉推出「0 稀土」电机，这对中国稀土产业意味着什么？", "excerpt": "最有意思的是，昨天刷头条，看到一个自媒体，说“中国对美国稀土封锁破产了，特斯拉生产出不需要稀土的电机了！”。真的，人类智商的多样性时刻了属于是。", "url": "https://www.zhihu.com/question/2080298625788277732/answer/2080647187516732888", "votes": 1, "comments": 0, "feed_ts": 1788844946, "feed_time_str": "09-08 13:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么总有人拿清朝打不过日本这个来抹黑？", "excerpt": "汉朝时，日本处于原始社会，汉光武帝赏了他们一颗倭奴国王印，从此年年来中国上供。 唐朝时，日本倾尽全国之力想来白江口偷袭，被大唐一支偏师一脚踹了个半死，从此成为大唐铁 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

爵”来充当她的丈夫，她失宠后自个儿就决定去修道院当修女了，一辈子也没名义上的丈夫。拉瓦利埃夫人与路易十四一共5个私生子女，其中一男一女活过婴儿期，这俩娃后来都被路易十四直接给合法化了，没有过名义上的野爹。另一类则是非正式情妇，只能称Mademoiselle/小姐，不享有宫廷仪轨。一些正式情妇有过非正式情妇的经历（比如上文提到的拉瓦利埃夫人）。至于答主所说的安排结婚的情妇，也是有的。这种一般就是出身过低，没法直接册封为女侯爵、女公爵之类的高阶贵族，于是安排一场婚姻来凑够贵族身份。比如路易十五的情妇杜-巴里夫人，交际花出身，被安排跟没落贵族吉约姆·杜‑巴里结婚并被册封杜‑巴里女伯爵。但需要注意的是，吉约姆·杜‑巴里并非“杜‑巴里伯爵”，而是利斯尔‑茹尔丹伯爵，杜-巴里家族祖上也不是伯爵，而只是外省的佩剑骑士；“杜‑巴里女伯爵”“利斯尔‑茹尔丹伯爵”都是路易十五为了凑够名义上的贵族资格而新造的头衔。", "excerpt": "「大家会发现，法国国王，英国国王的很多“情妇”，往往是某某夫人，某某伯爵夫人，某某公爵夫人。法国国王喜欢一个美女，没办法纳入后宫，反而是找了一个愿意帮忙的伯爵，把这个美女嫁给他，然后再让这个女人婚后成为自己的情妇。在这种情况下，这个女人的孩子，压根就不是国王的孩子，而是那个伯爵的孩子。」——这个就属于对欧洲宫廷和贵族制度的误读了。以Comtesse为例，这个头衔在中文中常被翻译为“XX伯爵夫人”，", "url": "https://www.zhihu.com/pin/2068095537111381768", "votes": 0, "comments": 1, "feed_ts": 1785869746, "feed_time_str": "08-05 02:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价历史学者秦晖？", "excerpt": "我觉得很有意思的（也绝对让很多目田受不了的）是，秦晖的低人权优势论或昂纳克寓言论其实底层逻辑和另类右反全球化区别不大，认为当今世界主要矛盾并不是无产阶级与资产阶级的矛盾（存在于一切国家），或者社会主义与资本主义的矛盾；而是狄先生大战德先生，前现代大战现代的矛盾。 秦晖其实反对全球化，或者更明确地说，反对中国入世，他认为中国入世将通过低人权优势导致劣币驱逐良币，从而导致高科技极权野蛮的可怕前景。 一", "url": "https://www.zhihu.com/question/759653128/answer/79105529987", "votes": 791, "comments": 103, "feed_ts": 1785869717, "feed_time_str": "08-05 02:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "李睿", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你认为世界上绝大多数的痛苦都源于什么？", "excerpt": "求而不得～", "url": "https://www.zhihu.com/question/2019451836176803529/answer/2068163468960724051", "votes": 0, "comments": 0, "feed_ts": 1785868596, "feed_time_str": "08-05 02:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "李睿", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "李飞飞称「人类的身体并非是解决特定任务的最优解」，这将如何影响机器人设计？", "excerpt": "特种具身智能机器人", "url": "https://www.zhihu.com/question/2067596397625467340/answer/2068163192946271549", "votes": 0, "comments": 0, "feed_ts": 1785868530, "feed_time_str": "08-05 02:35", "category": "ai", "c 65055084799645524", "votes": 331, "comments": 225, "feed_ts": 1785864437, "feed_time_str": "08-05 01:27", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价王力宏？", "excerpt": "很多人到现在才反应过来，2021年那一场突如其来的全网塌房，根本没那么简单。 在王力宏写出《天地龙鳞》之前，绝大多数国人的认知都是模糊的。 我们天天看紫禁城、聊故宫，都知道他们是清朝的皇宫，有不少人可能都不了解，这座屹立六百年的华夏脊梁，是1420年明代落成的传世杰作。 王力宏耗时数年，升级自己的经典《龙的传人》，联手方文山，写出了这首《天地龙鳞》。 一句几世纪六百年里，龙的传人历经风雨，直接把整", "url": "https://www.zhihu.com/question/21879414/answer/2060114276153571191", "votes": 5739, "comments": 237, "feed_ts": 1785863920, "feed_time_str": "08-05 01:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "如何评价我国新式主战坦克和新型火力支援车?俄罗斯搞出了T-14&#34;阿玛塔&#34;，到现在没能量产，乌拉尔厂一年交不了几台，前线还在拿T-90M和焊笼子的T-72凑数；德国莱茵金属端出KF-51&#34;黑豹&#34;，130毫米炮、巡飞弹发射器看着很性感，但底盘是豹2A4改的，单价传言破千万欧元，连德国国防军自己都没下单。 美国人更鸡贼，艾布拉姆斯X只敢叫&#34;技术验证车&#34;，不承诺列装节点。所以看到阅兵式上100式主战坦克和100式火力支援车并排开过来时，我第一反应不是&#34;哇好帅&#34;，而是：这一回不是PPT、不是航展外贸品、不是改改焊接件凑数的中期升级，是实打实进编制、给主力集团军换装的东西。评价它俩，不能再用&#34;几毫米穿深、几度仰角&#34;那套三代坦克思维，得换框架——无人机时代坦克活着的逻辑是什么，这俩车就是什么。先说100式坦克。它最反直觉的一点是炮没继续堆到125甚至130，外界推测回到105线膛（或新中口径）。军盲第一眼觉得&#34;缩水了&#34;，其实正好反过来：三代坦克的浪漫主义是&#34;甲弹对冲、两千米硬碰硬&#34;，但俄乌战场上无人机和攻顶弹药把这条路走死了——你正面堆一米均质钢，顶上一发FPV就送你走。105毫米配新型穿甲弹+高抛弹道炮射导弹，对三代坦克的效能没掉，对工事、轻装甲、低慢小目标的弹性反而更高。火力口径变小，打击矩阵变宽。乘员布局是第二个关键点。T-14把三人全塞车体前部隔离舱，思路对但太贵太重；100式走的是无人炮塔+乘员集中+电传指控，车体四周相控阵雷达、光电探头、主动硬杀伤拦截弹、反无人机软杀伤模块一起上，座舱玻璃化。它不是&#34;更硬的坦克&#34;，是&#34;更难被打死、打死了也能靠体系补位的信息节点&#34;。全电/混动让它能静默机动、能当临时指挥车用，35—45吨级重量比99A轻了十来吨，铁路装卸、渡海、高原、水网都舒服得多。再说100式火力支援车，这玩意才是真正让老步战车党破防的。官方定性就不是步兵战车，是&#34;火力支援车&#34;——类似俄BMP-T的定位，但不走俄式堆火箭弹的笨路子。无人炮塔上30毫米机炮（高仰角可编程空爆弹打无人机）、车体带反坦克导弹/巡飞弹垂直发射格、车顶无人机起降、光电雷达全系继承坦克同源。乘员3人，不留步兵班，腾出的空间和重量全砸给感知、弹种、主动防护。它的任务不是运兵，是给坦克连打伞、补盲、清无人机、顺手点掉残存火力点。把两车放一块看就懂了：100式坦克负责&#34;我在网里、我难死、我首发准&#34;，100式支援车负责&#34;你别想用廉价无人机把我坦克耗死、顺手把步战车该干的脏活接了&#34;。一个重节点，一个轻节点，底盘通用、数据链互通、备件互通——这是T-14做不到的（毛子自己后勤都养不起独立平台），也是KF-51做不到的（欧洲人先把账单算死）。知乎老军盲最容易踩的坑，是拿单车参数去比：&#34;105打不穿豹2A7&#34;&#34;30机炮不如40埋头弹&#34;&#34;没载员班不算步战车&#34;。错。这代装备的评价锚点已经变了：生存性 ≠ 装甲厚度，= 被探测概率×被命中概率×被命中后存活率×体系补位速度火力 ≠ 主炮穿深，= 对坦克/对人/对无人机/对工事的全谱覆盖载员 ≠ 必须9人下车，= 有人无人协同下步兵在哪上车、什么时候下车顺着这个锚点，100坦克+100支援车的组合拳就立得住：用更低的全寿命成本，换更高的体系存活率和任务弹性。T-14卡在钱和供应链，KF-51卡在价格和北约采购节奏，美国X系列卡在&#34;要不要继续造履带重坦&#34;的战略犹豫——只有这边是把&#34;第四代&#34;当成编制换装项目推的。当然也得泼盆冷水。系统堆得太满，战场维护、软件可靠性、电磁兼容、主动防护再装填、无人机链路抗干扰，都是没经过高强度实战检验的未知数。99A那一代我们吃了&#34;信息化够用但无人机时代没预留接口&#34;的亏，这一代提前预埋了，但预埋≠好用，得等几年演习数据和海外用户（VT4A1那条外贸线其实已经在帮国内趟坑）反馈回来再下定论。以前评价坦克，问的是&#34;能不能打穿对面&#34;；现在评价坦克，问的是&#34;在满天无人机、全员联网、制空权模糊的战场上，它能不能活到第二天早上，并把火力送到该送的地方&#34;。100式和它的搭档支援车，回答的是后一个问题。它们不一定代表&#34;坦克王座&#34;的单项最高分，但很可能代表&#34;量产型第四代坦克该怎么长&#34;的第一个完整答案。#主战坦克 #坦克100式 ", "excerpt": "如何评价我国新式主战坦克和新型火力支援车?俄罗斯搞出了T-14&#34;阿玛塔&#34;，到现在没能量产，乌拉尔厂一年交不了几台，前线还在拿T-90M和焊笼子的T-72凑数；德国莱茵金属端出KF-51&#34;黑豹&#34;，130毫米炮、巡飞弹发射器看着很性感，但底盘是豹2A4改的，单价传言破千万欧元，连德国国防军自己都没下单。 美国人更鸡贼，艾布拉姆斯X只敢叫&#34;技术验证车&#34;，不", "url": "https://www.zhihu.com/pin/2067567444449933050", "votes": 0, "comments": 0, "feed_ts": 1785863713, "feed_time_str": "08-05 01:15", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Filesystem Memory：把 agent 记忆的写、读、做拆开测的实测研究\n图文版：链接文件系统记忆的三种职责研究把 agent 长期记忆拆成管理、搜索和执行：管理 agent 整理对话片段或任务轨迹，搜索 agent 返回带来源定位的答案或技能，执行 agent 在任务中使用这些内容。实验覆盖长对话问答和 ALFWorld 家务任务，文件数量不等于组织质量。PersonaMem 128k 的成本账各类文件形态没有在 LoCoMo、PersonaMem 和 REALTALK 的回答正确率上稳定胜出。成本上的结果更清楚：PersonaMem 128k 中，原始会话库单次查询约 3.9 美分，保留事实的重组库约 1.6 美分，压缩重组库约 1.7 美分。LoCoMo 等较小对话中，各方案约 2.1 至 2.5 美分，整理优势基本消失。ALFWorld 的执行模型分界140 个 ALFWorld 任务里，较强的 gpt-4.1 读取原始 Episode log 时成功率为 87.1%；较弱的 gpt-4.1-mini 使用 Curated skills+mem 时为 76.4%，高于读取原始轨迹的 66.4%。原始经历需要执行 agent 自己理解和迁移；带使用条件的技能与备忘信息更适合较弱执行端。这一排序只适用于该任务和模型组合。管理模型与工具集的取舍固定搜索 agent 后，管理模型可将同一长对话整理成 2 个或上百个文件，回答正确率却没有稳定提升；固定记忆库后，升级搜索 agent 的提升更清楚。替换整套文件操作工具也会改变记忆形状。材料大、查询频繁的系统应先评测成本与正确率，再决定是否蒸馏和维护层级。原文标题：FILESYSTEM-BASED MEMORY FOR LLM AGENTS: ORGANIZATION, EVOLUTION, AND SUSTAINABILITY#无影寺 ", "excerpt": "Filesystem Memor 54744", "votes": 16, "comments": 0, "feed_ts": 1785839457, "feed_time_str": "08-04 18:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "腾讯技术工程", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "腾讯Omega：下一代“AI BI”的答案？", "excerpt": "上传一个 Excel，敲下一句话，等上几十秒，一张带着 KPI、趋势图和排行榜的页面就出现在屏幕上。颜色鲜艳，动画流畅，截图发到群里，很容易得到一句“这个厉害”。 但如果你真打算用它，问题往往从第二天开始。 时间范围从“本月”换成“上月”，数字还停在原地；点一下地区筛选，三个图表各算各的；数据表多了一个字段，整张页面直接空白；想把柱状图换成折线图，AI 又从头生成一遍，把你已经确认的布局也顺手改了", "url": "https://zhuanlan.zhihu.com/p/2068004588150690494", "votes": 4, "comments": 4, "feed_ts": 1785839174, "feed_time_str": "08-04 18:26", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "以色列这个国家是否“合法”？", "excerpt": "没想到知乎已经退步到这种地步了。 先来澄清一下问题本身，我看到一些人说“法律本身就是国家制订的，是国家担保了法律的有效性，“一个国家是否合法”的说法本身就是荒谬的”。这种观点混淆了不同的“合法性”概念。因为这里所说的“法”指的不是成文法，而是指“正当性”，就像近代史课本里说“清朝的统治丧失了合法性”指的就是丧失了正当性，而当然不可能是指清朝的统治违反了清朝自己的法律。能将这种“合法性”理解为“符…", "url": "https://www.zhihu.com/question/1942349026050683482/answer/2068037509796345525", "votes": 25, "comments": 5, "feed_ts": 1785838565, "feed_time_str": "08-04 18:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么现在那么多小孩得抑郁？", "excerpt": "我有次吃烧烤和一对父母带着孩子拼桌 还没上来的时候，她俩也不说话，各自刷各自的手机，爸爸一直打字聊天，妈妈一直咯咯咯的笑（刷某音） 然后小孩就看妈妈手机，想看妈妈在笑啥。妈妈把小孩一推，说“不许看手机”，然后小孩去找爸爸，爸爸把小孩一推，说“偷看什么啊你”。 然后小孩就坐那扣手，妈妈把小孩手打了一下说“不许扣手” 然后这小孩就开始发呆发到他们吃完饭。（因为妈妈不让小孩吃烧烤，说一会回去吃饭） 神金", "url": "https://www.zhihu.com/question/486206053/answer/3461659065", "votes": 15745, "comments": 311, "feed_ts": 1785838115, "feed_time_str": "08-04 18:08", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么现在那么多小孩得抑郁？", "excerpt": "你问我？ 我12岁我爹郑重其事的告诉我不要出去嫖娼。 抛开我12岁年龄不谈我兜里才五毛钱。 无端怀疑。 我奶奶问我想吃什么，我说烤鸡，烤鸭也行。 我奶奶说不行啊，昨天才吃的红烧肉，今天整点拌豆腐怎么样？ 我说行。 这叫有效沟通。 我妈问我想吃什么我说想吃烤鸡，然后她带我去街上逛了半天服装店。 到家了买了夫妻肺片说是我想吃的。 那我就要问你了，你 去8.45万亿日元，折合5", "url": "https://zhuanlan.zhihu.com/p/2068032936666994431", "votes": 31, "comments": 6, "feed_ts": 1785837511, "feed_time_str": "08-04 17:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "KDD 2026｜快手PlatformBid：从单广告主最优到平台全局共赢", "excerpt": "在计算广告领域，实时竞价（RTB）是核心范式：当用户在媒体端产生一次曝光机会时，广告交易平台向所有竞争广告主发起竞价请求，广告主通过 DSP 的自动竞价算法实时出价，最高出价者赢得展示。这一过程中，广告主只需设定高层目标（如目标 CPA、预算上限），自动竞价算法便自动完成全部出价决策 —— 它已经成为现代计算广告不可或缺的基础设施。 然而，长期以来自动竞价研究和基准主要停留在 DSP 视角，关注单", "url": "https://zhuanlan.zhihu.com/p/2068032655044748363", "votes": 1, "comments": 0, "feed_ts": 1785837504, "feed_time_str": "08-04 17:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "16张B200才能跑的Kimi K3，8张AMD就装下了", "excerpt": "这可能是 AMD 等了很久的时刻。 最近，Wafer AI 在 AMD MI355X 上部署了 Kimi K3。结果是，原本需要 16 张 NVIDIA B200、横跨两台服务器运行的模型，在一台配备 8 张 MI355X 的 AMD 服务器中就能完成部署。 更关键的是，它不只是把模型装进去了。 在输入 1024 Token、输出 400 Token 的测试中，MI355X 跑出了 952 Tok", "url": "https://zhuanlan.zhihu.com/p/2068032414618801912", "votes": 27, "comments": 9, "feed_ts": 1785837391, "feed_time_str": "08-04 17:56", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "徐州这个城市是否被徐工集团拖垮了？", "excerpt": "徐工集团不至于能拖垮一座淮海重镇，杜聿明集团还差不多。", "url": "https://www.zhihu.com/question/2060273628789449853/answer/2062599985103910034", "votes": 3746, "comments": 45, "feed_ts": 1785837384, "feed_time_str": "08-04 17:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "千寻智能高阳团队新作|换了新硬件，老数据还有用吗？揭秘机器人学习中的\"涌现式迁移\"", "excerpt": "想象一位干了二十年的汽修老师傅，带一个刚进门的学徒。老师傅经验丰富，但如果学徒连螺丝刀都拿不稳，老师傅那些 &#34;听声音就知道哪里坏了&#34; 的绝活，讲了也是白讲 —— 徒弟根本接不住。可一旦徒弟练熟了基本功，老师傅的经验就会 突然变得点石成金，让徒弟的水平一路飙升。等到徒弟自己都快出师了，老师傅再多的经验，能带来的提升也就有限了。 机器人学习里，藏着一个几乎一模一样的故事。 近日，千寻智", "url": "https://zhuanlan.zhihu.com/p/206803 给DeepSeek画了张图，里面有一横一纵2条虚线。 一条从得分50分横着穿过去，一条从大约3美分的任务成本竖着落下，交点是DeepSeek V4 Flash 0731。右下角密密麻麻挤着一批模型：分数没它高，完成同样评测任务却比它贵。 有人给这张图起了个的名字——Deepseek斩杀线。 经过几天测试体验，效果整体很满意，很开心，我现在会把日常投研、资讯收集这些基础工作交给DeepS", "url": "https://zhuanlan.zhihu.com/p/2067783807248478538", "votes": 3, "comments": 0, "feed_ts": 1785823556, "feed_time_str": "08-04 14:05", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "DefTruth", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "NVIDIA 发布 Sol-Atten 免训练稀疏化技术NVIDIA 最近发布了名为 Sol-Attn 的新技术，它是“免训练”的动态稀疏注意力：不需要重新训练模型，而是在推理过程中实时决定哪些注意力块该算、哪些可以跳过。相比传统的离线路由方法，Sol-Attn 在一次 softmax 计算里就完成了阈值路由、稀疏计算和近似修正，还能把被跳过的低分列重新利用，避免完全丢掉长尾贡献。效果上，论文展示了在图像和视频生成里都能保持画质的同时显著加速。比如视频生成最高能快 2.1 倍，视频编辑能快到 2.3 倍。如果再结合其他加速手段（Sol-Engine），端到端速度甚至能提升到 5 倍。更有意思的是，他们在不同模型上都做了对比：Wan 2.1、Hunyuan 1.5、LTX 2.3、Bernini，速度提升都在 1.9× 到 2.3× 之间。从 demo 看，场景包括室内人像、投影机光影、雨夜出租车、甚至视频编辑里把雨衣变成苔藓外套、把瓷狐狸变成玻璃风暴。视觉质量基本保持一致，但推理时间大幅缩短。这种“边算边稀疏”的思路，确实把稀疏注意力的效率和质量边界往前推了一步对视频生成这种算力消耗巨大的任务来说，这类方法可能会成为未来的标配。既能节省算力，又不牺牲效果，尤其适合在实际产品里落地。链接： 链接", "excerpt": "NVIDIA 发布 Sol-Atten 免训练稀疏化技术NVIDIA 最近发布了名为 Sol-Attn 的新技术，它是“免训练”的动态稀疏注意力：不需要重新训练模型，而是在推理过程中实时决定哪些注意力块该算、哪些可以跳过。相比传统的离线路由方法，Sol-Attn 在一次 softmax 计算里就完成了阈值路由、稀疏计算和近似修正，还能把被跳过的低分列重新利用，避免完全丢掉长尾贡献。效果上，论文展示", "url": "https://www.zhihu.com/pin/2067415812537951033", "votes": 0, "comments": 0, "feed_ts": 1785823441, "feed_time_str": "08-04 14:04", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "8.4 市场开始出分歧了", "excerpt": "就今天市场科技反弹了。 我看很多人说缩量的，但其实缩量不是坏事。然后我给大家聊一个点好了，就很多人问我为什么最近只提科技资金面而不提基本面了呢？ 其实很简单，高位看资金面，低位看基本面，这是投资最基本的常识。 举个直观例子，大家可以某半导体设备 ETF，6月涨幅接近 60%。 大家可以理性想一想，五月底和六月底相比，行业基本面发生质变了吗？有什么行业研发出颠覆性的技术了吗？ 答案是并没有。一个月前", "url": "https://zhuanlan.zhihu.com/p/2067970270002935448", "votes": 306, "comments": 45, "feed_ts": 1785823375, "feed_time_str": "08-04 14:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "tit 不想给，按法律该怎么应对？", "excerpt": "农村分地只看户口，户口在一起村集体，可以分。 户口离开了，就是不能分。 很多农村孩子上大学想要把户口迁到学校or所在城市的时候，对方如果发现你是农村户口，都会善意让你确定一下要不要迁户口，回家再问问家里村里，因为农转非迁出来容易，迁回去可是千难万难了。 村户口是真的有地的。 所以，这件事情你不用考虑任何问题，就让对方起诉就行，按照法院判决来。 大家都很好奇什么律师可以把土改和农村户籍管理制度给推翻", "url": "https://www.zhihu.com/question/2037600994301882510/answer/2067962719052027607", "votes": 279, "comments": 57, "feed_ts": 1785820733, "feed_time_str": "08-04 13:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "李诞吐槽欧洲行被祖国惯坏了李诞去了一趟欧洲，回来大吐苦水，“我在中国生活，被祖国彻底惯坏了！”今年五月他跑了法国、意大利、德国，顺道还去了趟西班牙巴塞罗那。六月份在直播里聊起这趟行程，没刻意踩欧洲，也没硬吹国内，就是实打实讲自己遇到的事儿，反倒戳中了好多出过国的人的共鸣。最先让他不适应的是打车。在国内出门掏手机点一下，五分钟车就停楼下，司机在哪、还有多久到，看得明明白白。到了欧洲直接懵了，一个打车软件没法通用不说，很多城市根本没普及网约车。想打车得找酒店前台帮忙打电话约，约完就站在路边等，心里完全没底，不知道车什么时候来。好不容易坐上了，车里也没实时导航，你也不知道司机走的是不是最优路线，碰上不实在的绕点路你也察觉不出来。他说那阵子总有种时光倒流的感觉，好像一下回到了十几年前的国内。不是欧洲人懒，是很多城市出于保护传统出租车行业的考虑，有意限制网约车的扩张。人家有自己的发展节奏，只是我们过惯了高效便利的日子，猛地一换环境，落差感一下就上来了。吃饭的体验更有意思。在意大利餐厅点披萨，他说想分着吃，店员嘴上没说什么，脸当场就拉下来了。后来他才知道，当地人默认披萨就是一人吃一整张，分着吃在人家看来是件挺奇怪的事。不止披萨，点杯冰美式，服务员眼神都带着点不对劲。在当地咖啡店点冰饮，本身就不算“正统”喝法。李诞说能理解意大利人对美食的自信，但实在没必要对食客这么多规矩。他还调侃说，想吃正宗意大利菜根本不用跑这么远，去温州、青田找家小餐馆就行，好多老板都是温州人，做的味道比当地还对中国人的胃口。逛巴黎的时候，他的滤镜也碎了不少。本来抱着对浪漫之都的期待去的，结果逛公园里面全是沙土地，走两步就尘土飞扬，用他内蒙话讲就是“暴土狼烟”，走起来贼难受。逛市区更头晕，整个市中心的建筑风格几乎都一样，走到哪都像在逛同一条街。他开玩笑说，巴黎整个市中心都是“王府井”，逛久了真的审美疲劳。他专门挑了治安口碑最好的玛黑区溜达，逛完给出的评价是“很像上海，其实不如上海”。最让他感慨的还是安全感。当地朋友反复跟他说，晚上绝对不能出门溜达，就算白天在街上，也别把手机拿在手里晃。他一开始没当回事，拿着手机导航的时候，连路过的老奶奶都特意停下来提醒他，把手机收起来，小心被抢。后来他跟一个在当地工作的朋友聊天，朋友说其实没传说中那么夸张，挺安全的。李诞顺嘴问了一句，那你被抢过吗？朋友愣了一下说，上个月刚被抢过。这段给我看笑了，笑完又觉得挺感慨的。我们在国内待久了，半夜十一二点出门撸串、逛夜市，手机随便拿，包随便背，根本不会担心被抢。这种习以为常的安全感，其实是很多国家的人羡慕不来的。我在看李诞这段直播时，弹幕里有一条特别扎心，说“我们把方便当成了常态，却忘了这背后是多少人不分昼夜的奔跑”。这话说得确实在理。国内一二线城市，街头巷尾24小时亮灯的便利店、凌晨还在接单的药店、全年无休的餐饮店，这些“方便”的背后，是无数个具体的人牺牲了休息时间，用高强度的劳动撑起来的。我们享受这种便利，当然该感恩这种效率，但也该看到这不仅仅是一个商业问题，还关系到每个劳动者的生存状态。欧洲很多旅游城市，小偷小摸几乎成了旅游业的一部分，警力不足，司法程序繁琐，抓了判不了，判了关不下，索性就形成了一种“适度犯罪”的灰色平衡。你被偷了只能自认倒霉，报警也就是走个流程，最后拿张证明回去找保险理赔。在中国，你敢在景区偷手机，监控能一路锁定你到落脚点，跑都跑不掉。这种“被惯坏”其实是一种集体无意识的自信。你走在街上不用时刻提防身后，你把包放在餐厅椅子上起身去拿调料，不用担心回来包就没了。这些在日常中被忽略的细节，一旦脱离那个环境，就会变得异常清晰。说到这我得插一句自己的看法。李诞这趟欧洲行引发的讨论，本质上是在问一个问题：我们这些年拼命发展数字化、搞基建、建“天网”，到底图什么？答案其实很朴素，就是让老百姓过日子更方便、更安全、更省心。2025年，我国数字经济增加值达到49万亿元，占GDP比重约35%。数字经济核心产业增加值占GDP比重超过10.5%，数字产业收入39.6万亿元。这些数字看起来很宏大，落到每个人头上，就是半夜能点到外卖、出门不用带钱包、走夜路不用提心吊胆。当然，说这些不是要全盘否定欧洲。他们在地铁里看书，他们有几百年的美术馆可以逛，他们的奶酪和红酒确实有风味。但那是另一种活法，是慢节奏的、高成本的、带有某种旧式体面的生活。而中国人的生活，是高效的、数字化的、带着人间烟火气快速向前奔涌的。李诞的感慨，是我们这批生活在高速发展列车上的普通人的集体心声。我们在不断被“惯坏”的过程中，也在不断创造着新的生活方式标准。", "excerpt": "李诞吐槽欧洲行被祖国惯坏了李诞去了一趟欧洲，回来大吐苦水，“我在中国生活，被祖国彻底惯坏了！”今年五月他跑了法国、意大利、德国，顺道还去了趟西班牙巴塞罗那。六月份在直播里聊起这趟行程，没刻意踩欧洲，也没硬吹国内，就是实打实讲自己遇到的事儿，反倒戳中了好多出过国的人的共鸣。最先让他不适应的是打车。在国内出门掏手机点一下，五分钟车就停楼下，司机在哪、还有多久到，看得明明白白。到了欧洲直接懵了，一个打车", "url": "https://www.zhihu.com/pin/2066785359694925849", "votes": 0, "comments": 183, "feed_ts": 1785820110, "feed_time_str": "08-04 13:08", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "LeiWang1999", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价8月3日上线的阿里Qwen 3.8 Max正式版？相比其他模型表现如何？", "excerpt": "就 提示词遵从度方面，应该是在d4vf的斩杀线之内的。是的，似乎还不用后训练的d4vp出手。今天测试deepseek-v4-flash的时候发现了一个prompt能够很好地体现其后训练后『 提示词遵从度』高的效果[1]。这里就也直接把提示词给到Qwen Cloud进行一个测试：具体的prompt如下： 绘制一个html网页，实现二刻尺作正七边形。 步骤如下： 首先取一个正方形，作其底边的中垂线， ", "url": "https://www.zhihu.com/question/2067550234776020574/answer/2067772193363309422", "votes": 47, "comments": 22, "feed_ts": 1785820107, "feed_time_str": "08-04 13:08", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么不立法直接明令禁止“招娣”类名字？", "excerpt": "很难，从「改逼为福」来看，只要父母的恶意足够深，有的是办法避开限制。 更现实的办法是优化改名流程，让孩子成年后可以自由选择自己想要的姓名。 以及虽然在东亚大区不受欢迎，但个人认为仍然值得讨论的那个话题：应该考虑限制和剥夺一部分严重违反儿童福祉的父母的抚养权。 ", "url": "https://www.zhihu.com/question/2063552900119451238/answer/2067307839828277028", "votes": 43, "comments": 3, "feed_ts": 1785819384, "feed_time_str": "08-04 12:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "司马懿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《西游记》有哪些谣言在网络上广为流传？", "excerpt": "通天河里的灵感大王叫成“鲤鱼精“，可它明明是条金鱼…… 网上经常看到这种自媒体文章——“鲤鱼怪，又叫灵感大王，本是观音莲花池里的金鱼”…… 我就非常纳闷，这就跟“武松打死的老虎，其实是薛定谔养的花猫”一样扯，你们怎么开得了口呢？ 金鱼虽然也是鲤科鱼类，但是从野生鲫鱼驯化来的，而不是鲤鱼。我国有上千年的金鱼饲养历史，古代人也都分得清金鱼和金色鲤鱼。 更何况《西游记》里，本来就写过渔夫张稍每天送袁守诚", "url": "https://www.zhihu.com/question/502890402/answer/2724927343", "votes": 1073, "comments": 132, "feed_ts": 1785819254, "feed_time_str": "08-04 12:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你们觉得现在知乎存在最大的问题是什么？", "excerpt": "可能是知乎上市后做的大量推广导致下沉严重，也可能是这两年的社会环境导致的人心浮躁，戾气加重。 无论什么方向的讨论，简短无意义地输出情绪往往能收获大量赞同。 真正试图平和理性地分析问题，反而招致这部分情绪用户的攻击。 只要有一句话说不到他们心坎，恨不得顺着网线把答主鲨了。 我现在越来越发现大部分用户不具备一口气阅读超过五百字内容的能力。 比如我在文章中下部分已经写明白的内容，会被评论莫名其妙地补充，", "url": "https://www.zhihu.com/question/451774491/answer/2067369807637394344", "votes": 8, "comments": 1, "feed_ts": 1785819036, "feed_time_str": "08-04 12:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "晨星", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么《进击的巨人》能达到豆瓣 9.9 评分的水平？", "excerpt": "迄今为止美剧历史上评分最高的作品，《绝命毒师》（英文名《breaking bad》，又译为《我的老师贩冰冰》），讲述了大概这样一个故事： 一个郁郁不得志的高中老师老白（white），在50岁生日那天查出了癌症晚期，他想到自己正在怀孕的妻子和脑瘫的大儿子，决定铤而走险利用自己的专业知识制作一批冰毒变现。 他算了一笔账，房贷，儿子未来的学费，家人的未来生活开支，73.7万美元，清清楚楚，赚够钱，然后退", "url": "https://www.zhihu.com/question/386642655/answer/2065020350065332244", "votes": 935, "comments": 111, "feed_ts": 1785819018, "feed_time_str": "08-04 12:50", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "这周经济数据扎堆，美债变盘的催化剂？这周会出很多美国经济数据，ISM制造业指数、职位空缺报告，非农…周一先公布了ISM制造业指数，超预期得好。7月环比涨2.3个点，到55.6，预期53.9，连续第7个月在50枯荣线以上，意味着制造业正在扩张。现在主流的论调是，美国制造业终于从持续三年的衰退里走了出来。但如果掰开来看，经济的热度主要来自两块，一个是数据中心建造的供应链，还有就是国防。数据中心相关的，包括半导体、电源、网络、光通信，这些需求都很旺，订单很多。国防也创了新高。但医疗、工业、消费品的订单量明显低很多。简单讲，经济增长主要靠AI和打仗。不过昨天ISM数据没怎么推高长债收益率，对市场没太大影响，主要看后面非农怎么变戏法。4.68%是10年期收益率的5月高点，已经过了，现在正在尝试突破4.7%，往上阻力是4.8%，再往上就是5%，这个点位是风险资产的警戒线，容易引发华尔街去风险。沃什不是说长债市场干得漂亮，帮他收紧了么？长债市场还没真正开始发力呢。", "excerpt": "这周经济数据扎堆，美债变盘的催化剂？这周会出很多美国经济数据，ISM制造业指数、职位空缺报告，非农…周一先公布了ISM制造业指数，超预期得好。7月环比涨2.3个点，到55.6，预期53.9，连续第7个月在50枯荣线以上，意味着制造业正在扩张。现在主流的论调是，美国制造业终于从持续三年的衰退里走了出来。但如果掰开来看，经济的热度主要来自两块，一个是数据中心建造的供应链，还有就是国防。数据中心相关的，", "url": "https://www.zhihu.com/pin/2067945178967683538", "votes": 0, "comments": 5, "feed_ts": 1785818903, "feed_time_str": "08-04 12:48", "category": "pin", "cat_name": "想法动态"}, {"actor": "黑兵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看特朗普说给伊朗“最后一次机会”，否则将进行大规模斩首行动？", "excerpt": "特朗普说的是最晚明天海峡会重开。 那么就是今天了，我们等24个小时看海峡是否重开就可以了。 伊朗确实有在和安曼讨论安曼一侧船只通行的问题。 并且有阿拉伯的媒体爆料说，美国已经在安曼一侧的通行上做出了让步。 换句话就是，美国之前想让商船走安曼一侧不用收费，但是随着伊朗对商船的袭击，以及美军2个礼拜和伊朗的开战，美国让商船走安曼一侧的目标失败了。 而失败后，等于美国承认了伊朗对霍尔木兹海峡的全权控制。", "url": "https://www.zhihu.com/question/2067889591760204501/answer/2067953107649163757", "votes": 152, "comments": 35, "feed_ts": 1785818442, "feed_time_str": "08-04 12:40", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "忠诚的maga战士，川皇的头号粉丝，曾经在福克斯新闻台最支持川皇的主持人----现任华盛顿特区联邦检察官珍妮娜·皮罗疑似被解雇了。前几天她还信誓旦旦地告诉媒体，她有完全的证据证明67岁的三届奥运独木舟选手大卫·赫恩破坏了倒影池，要以破坏公共财物罪给他判处十年监禁。但是，没过几天，皮罗撤销了起诉。原因很简单，随着更严格的调查开展，进一步证据表明，倒影池是从中间开始脱落的，而倒影池中间不可能是人力撕扯破坏所为。皮罗和司法部最后结论倒影池问题是工艺瑕疵，以及赶工期导致，并指责内政部作假报告，以及承包商有问题。这还得了，这明显触及了川皇的逆鳞，川皇一直声称倒影池是民主党左翼分子人为破坏。于是，川普在网络媒体上猛烈抨击皮罗，说她在压力面前退缩了。然后，就有人拍到视频，视频中珍妮娜·皮罗拖着箱子和公文包离开白宫西翼。好家伙，作为川皇的法律打手，你办事不利，没有达成川皇下达的合法栽赃陷害甩锅给民主党的任务也就罢了，还把内政部也要拖下水，你不滚蛋谁滚蛋啊。[调皮]", "excerpt": "忠诚的maga战士，川皇的头号粉丝，曾经在福克斯新闻台最支持川皇的主持人----现任华盛顿特区联邦检察官珍妮娜·皮罗疑似被解雇了。前几天她还信誓旦旦地告诉媒体，她有完全的证据证明67岁的三届奥运独木舟选手大卫·赫恩破坏了倒影池，要以破坏公共财物罪给他判处十年监禁。但是，没过几天，皮罗撤销了起诉。原因很简单，随着更严格的调查开展，进一步证据表明，倒影池是从中间开始脱落的，而倒影池中间不可能是人力撕扯", "url": "https://www.zhihu.com/pin/2067933016790414179", "votes": 0, "comments": 6, "feed_ts": 1785818122, "feed_time_str": "08-04 12:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "佛教为何只东传，而不西传？", "excerpt": "我觉得有必要提醒的是，近三百年来欧亚大陆上佛教的衰败主要是由中俄两国造成的，跟其他任何势力都没多少瓜葛。进一步     if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

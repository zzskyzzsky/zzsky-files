es": 0, "comments": 0, "feed_ts": 1787515718, "feed_time_str": "08-24 04:08", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何反驳“地主阶级是进步的”观点?", "excerpt": "我们把问题具体一点，地主与佃户的生产关系。 这里面最厉害的一点，就是地主有选择权，但是佃户没有。 无论是古代还是近代，中国农村都是以乡绅自治，宗族祠堂为法权核心。 就算是涉及到人命大案，如果没有乡民到县衙击鼓鸣冤，先挨一顿板子自证没有诬告，县衙是不管的。 这就是县衙要把乡村法权让渡给乡绅，乡绅以拥有土地所有权和乡村治理权力的方式，忠心支持政权。 这是一种合作方式，政权不是乡绅的领导机构，而是合作方", "url": "https://www.zhihu.com/question/1967957115118285678/answer/2075071704871784662", "votes": 1, "comments": 0, "feed_ts": 1787515648, "feed_time_str": "08-24 04:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么以色列能单挑中东？真的全靠鹰酱吗？", "excerpt": "南非在有更大的战略缓冲空间，国内有更多可开采资源和工业产能，但是被西方孤立的情况下，死前不靠外部输血暴打好几个非洲国家。真正的问题在于这种殖民势力的军事力量完全是无根之水，继续跟泥腿子国家耗下去也受不了。 秦制的稳定性在于给所有被征服地区提供了“只要你们愿意变成我们，就可以像我们一样生活”的保障，而在以色列这样的国家阿拉伯人擅自皇民化死的更快，但“独立思考人士”得出的结论永远是自己犹太爹太善良了…", "url": "https://www.zhihu.com/question/1968006431107191210/answer/2073768284332242676", "votes": 6, "comments": 0, "feed_ts": 1787515204, "feed_time_str": "08-24 04:00", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "一直以来对张伯伦政治才能的评价是否有失偏颇？", "excerpt": "我先简单介绍一下张伯伦这个人，你才能更好地理解他的许多做法。 考虑一下在本位面的美国有这样一个人，他40岁之前几乎无心从政，一直努力搞钱；40岁之后忽然开始从政，没两年咔咔就干到了美国第二大城市的市长——为什么?? 因为在此之前，市长的位置由他的父亲、叔叔和舅舅轮流把持，就这么简单。 所以在讨论张伯伦之前，你必须先理解他的人生剧本：大臣爸爸跟议员哥哥，然后再说别的。当然这里必须介绍一下张伯伦的父亲", "url": "https://www.zhihu.com/question/29128603/answer/2066939708886799598", "votes": 1026, "comments": 96, "feed_ts": 1787512495, "feed_time_str": "08-24 03:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "被俘的朝鲜大臣评价后金士兵为何擅长突击的原因萨尔浒之战，被俘的朝鲜大臣李民寏，滞留后金一年多，回国后写下写下《建州闻见录》其中有他对朝鲜和后金两军优劣的分析。其中在军马一节中提到后金兵之所以善于冲击，原因在于其有强大的骑兵。并提及胡人养马之法和朝鲜的差异。紫岩集卷之六二曰，申明马政。臣观奴贼之横行冲突，莫可与敌者，不过负戎马之足也。贼若长驱，睨过坚城，冲犯内地，倏往倏来，则临机观势，或遮截，或尾击，或掩袭，在不可已。然以不甲步卒，欲当于铁骑，其不格明矣。当此时，申明马政，团结甲骑，诚不可少缓。昔，赵武灵王招骑射以破东胡；宋臣李纲建议买马，欲以御金人。是非其明效大验耶？臣闻胡中之养马，罕有菽粟之喂。每以驰骋为事，俯身转膝，惟意所适。暂有卸鞍之暇，则脱靮而放之栏内。不蔽风雪寒暑，放牧于野，必一人驱十马。养饲调习，不过如此。而上下山坂，饥渴不困者，实由于顺适畜性也。我国之养马，异于是。寒冽则厚被之，雨雪则必避之，日夜羁縻，长在枥下，驰骋不过三四百步。菽粟之秣，昏昼无阙。是以暂有饥渴，不堪驰步；少遇险仄，无不颠蹶。且不作骟，风逸踶齧，不顺鞭策，尤不合战阵也。今宜尽取民间雌马，放之牧场，遴选监牧之员，责其繁息。雄驹之齿不过三四岁，即驱出作骟。择其健实驰走者，尽于甲士颁给。养饲调习，务合战用。则不出十年，甲骑之盛，足可御敌也。《礼》曰：问国之富，数马以对。《诗》称卫文侯、鲁僖公之美，皆言騋牝駉牡之盛。申明马政，恐非细事也。团束甲骑，以备不虞，千万幸甚。白话文：第二：整顿完善马政。臣观察，奴贼之所以能够纵横驰骋、冲击作战，我方难以与之抗衡，依仗的无非就是战马带来的机动优势。敌军若是大举长驱直入，绕过坚固城池，进犯内地，来去迅疾；我方必须随机应变，或是半路拦击、或是尾随追击、或是暗中突袭，御敌行动势在必行。但是，依靠没有重甲防护的步兵，想要抵挡重装骑兵，无法抗衡是显而易见的。值此关头，整顿马政，编组训练重甲骑兵，实在不容片刻拖延。从前，赵武灵王推行胡服骑射，击败东胡；宋代大臣李纲上奏建议购马，用来抵御金人。这不都是鲜明有效的先例实证吗？臣听闻塞外胡人养马，很少用豆类、谷物精饲。常让马匹奔走驰骋，马匹俯身、转腾屈膝，随心训练。短暂卸鞍休息时，便解开缰绳，放于栏中。马匹不遮蔽风霜雨雪、严寒酷暑，在野外放牧，通常一人放牧十匹马。胡人饲养、调教战马，大致就是这套方法。而（这些战马）能够翻越山坡，即便饥渴也不会乏力，根本原因在于顺应了马匹本身的天性。我国养马，和这种方式完全不同。天气严寒就给马匹加盖厚铺垫，下雨落雪就要躲避；马匹日夜拴缚，长期养在马厩之中，奔跑距离不过三四百步。早晚不间断用豆类谷物精细喂养。所以一旦短暂饥渴，马匹就无法奔走；稍微遇上崎岖险路，无一不跌倒。并且不对公马施行阉割，马匹性情狂放不羁，爱踢咬冲撞，不听从马鞭驱使，尤其不适合上阵作战。如今应当征集民间所有母马，安置到牧场放牧；慎重挑选管理牧场的官吏，责成他们繁育马匹。公马长到三四岁，就进行阉割。挑选健壮、擅长奔跑的战马，分配给披甲士兵使用。饲养调教，务必贴合实战需求。那么不出十年，重甲骑兵的规模壮大，足以抵御敌寇。《礼记》记载：询问一个国家是否富足，就以马匹数量作答。《诗经》称颂卫文公、鲁僖公的治绩，都是赞叹国内各类马匹繁育兴旺。整顿完善马政，绝非小事。编组操练重甲骑兵，用来防备突发战事，这是莫大幸事。", "excerpt": "被俘的朝鲜大臣评价后金士兵为何擅长突击的原因萨尔浒之战，被俘的朝鲜大臣李民寏，滞留后金一年多，回国后写下写下《建州闻见录》其中有他对朝鲜和后金两军优劣的分析。其中在军马一节中提到后金兵之所以善于冲击，原因在于其有强大的骑兵。并提及胡人养马之法和朝鲜的差异。紫岩集卷之六二曰，申明马政。臣观奴贼之横行冲突，莫可与敌者，不过负戎马之足也。贼若长驱，睨过坚城，冲犯内地，倏往倏来，则临机观势，或遮截，或尾击", "url": "https://www.zhihu.com/pin/2074753131020292512", "votes": 0, "comments": 3, "feed_ts": 1787507076, "feed_time_str": "08-24 01:44", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "弱弱地问一句，我可以说我不喜欢电影《牛来》吗？", "excerpt": "牛来最开始火起来，就是因为它烂的突破下线，大家抱着猎奇的心态去看的。它不像功夫女足，烂的平平无奇，但非要让人吹上天。", "url": "https://www.zhihu.com/question/2072764207594992482/answer/2075034994045608940", "votes": 5, "comments": 0, "feed_ts": 1787506895, "feed_time_str": "08-24 01:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "如何评价韩国追缴韩奸财产？本质上，李在明必须对韩国民族主义分子解释与高市的照片，澄清自己是白皮红心而非白皮白心。韩国总统无法摆脱美日韩三国联盟，政治上不能亲俄亲中，这是美国提出的硬性目标。李在明执政后同样要回到原点，必须交代反共主义路线，并与日本友好，给美日以交代。但为了面对国内民众、洗净韩奸嫌疑，他选择清算历史韩奸，这既拥护二战后的国际秩序，又不损伤美日韩同盟。因此，这是政治算计，把戏而已，南朝鲜伪军没必要高看一眼。如何评价韩国追缴韩奸财产？ #韩国维权 #投资韩国 #韩国投资 ", "excerpt": "如何评价韩国追缴韩奸财产？本质上，李在明必须对韩国民族主义分子解释与高市的照片，澄清自己是白皮红心而非白皮白心。韩国总统无法摆脱美日韩三国联盟，政治上不能亲俄亲中，这是美国提出的硬性目标。李在明执政后同样要回到原点，必须交代反共主义路线，并与日本友好，给美日以交代。但为了面对国内民众、洗净韩奸嫌疑，他选择清算历史韩奸，这既拥护二战后的国际秩序，又不损伤美日韩同盟。因此，这是政治算计，把戏而已，南朝", "url": "https://www.zhihu.com/pin/2075031426370740362", "votes": 0, "comments": 0, "feed_ts": 1787506044, "feed_time_str": "08-24 01:27", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价韩国追缴韩奸财产？", "excerpt": "本质上，就是李在明必须要对韩国民族主义分子解释这张照片。 到底是白皮白心，还是白皮红心？ 韩国总统有个致命的问题，那就是无法摆脱美日韩三国联盟这个命题。 这美国提出的硬性目标，韩国在政治上不能亲俄，更不能亲中。 因为韩国是第一岛链的组成部分，美日韩必须是坚定的反共盟友。 特朗普可以讲他是将军的好朋友，因为美国是反共大本营。韩国总统就不能去见将军，这是立场不坚定，投机分子。 李在明的上一任尹锡悦，干", "url": "https://www.zhihu.com/question/2072478035593449589/answer/2075031205028937973", "votes": 5, "comments": 0, "feed_ts": 1787505992, "feed_time_str": "08-24 01:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "多语言Agent不能只测准确率，还得测它到底调用了哪些工具\n图文版：链接贪婪解码下四个前沿模型只保留71%-73%的动作策略Microsoft Research India 的研究者发现，贪婪解码下四个前沿模型换一种语言后，各自只保留自身71%-73%的动作策略，模型身份只解释5.7%的方差。同一任务换一种语言，模型可能给出相同答案，但中间调用的工具序列并不相同。动作路径决定成本、延迟、失败模式和审计方式，答案级评估看不到这些差别。这里的71%-73%是跨语言一致率除掉同语言自一致率后的保留值，说明语言在推动动作序列变化。2.38M次运行比较动作轨迹而不只是最终答案实验覆盖8个模型、6个平行基准、41种语言，共2.38M次 agent 运行。每个任务在同一语言和跨语言下都重复生成，用同语言自一致性作为基线，只比较非空且长度匹配的动作轨迹。修正越严格，测得的跨语言动作策略差异越大；同语言自一致性被抬高时跨语言一致率几乎不动，说明动作路径分歧是结构性的。非英语任务被模型先翻译成英语再规划翻译工具是所有适用基准中最常被调用的工具；输入是梵文、泰米尔文或奥里亚文时，推理文本仍有约99%的ASCII字符。模型通常先翻译成英语，再用英语规划，最后回答。移除翻译工具后，跨语言动作一致性下降幅度与模型对翻译工具的使用程度成正比。直接要求模型用任务语言推理，遵从率低于1%，说明英语中转不是提示词可以关闭的偏好。规律边界：10B以下模型和小模型排序不能照搬71%-73%来自贪婪解码下的四个前沿模型，不适用于约10B参数以下的模型。小模型之间的表面排序很大程度来自短轨迹和空轨迹的偶然一致地板，校正后排序可能反转。这个保留率衡量的是动作序列是否一致，动作路径不同本身也不等于模型更差；只是这些差异直接决定成本、失败模式和可审计性。原文标题：Actions Speak Louder than Words : Measuring Cross-Lingual Policy Retention in Tool-Using Agents#无影寺 ", "excerpt": "多语言Agent不能只测准确率，还得测它到底调用了哪些工具\n图文版：链接贪婪解码下四个前沿模型只保留71%-73%的动作策略Microsoft Research India 的研究者发现，贪婪解码下四个前沿模型换一种语言后，各自只保留自身71%-73%的动作策略，模型身份只解释5.7%的方差。同一任务换一种语言，模型可能给出相同答案，但中间调用的工具序列并不相同。动作路径决定成本、延迟、失败模式和", "url": "https://www.zhihu.com/pin/2075025002617893686", "votes": 0, "comments": 0, "feed_ts": 1787504646, "feed_time_str": "08-24 01:04", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹小灵", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "教授张丹丹称「灵活就业是一种福利」，如何看待这一观点？", "excerpt": "这人这次讲的每一句话都是精准的阴阳。 如果一个人能精准绕过所有重点，并且每一句都能反着来，说明其实啥都明白，就是故意阴阳。 证据很简单。 这人之前写文章公开认为青年失业率数字被美化了，真实失业率要比公布的高很多。 但这回满嘴都变成了灵活是一种福利，一种自由，自己朝九晚五羡慕他们，也不提青年失业率了。 这人啥意思，不言而喻。 ", "url": "https://www.zhihu.com/question/2073508048476321495/answer/2074422300020160034", "votes": 3233, "comments": 170, "feed_ts": 1787504561, "feed_time_str": "08-24 01:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent会记住任务，却忘了“该怎么做”：上下文压缩正在静默丢约束\n图文版：链接COMPINT上所测压缩器平均只留17%会话约束宾夕法尼亚州立大学Zhiqi Wang等人把Session Constraints（SCs，会话约束）定义为用户提示里约束同一会话后续行为、却不属于主线任务的子句，例如“删任何邮件前先等我确认”。COMPINT上当前所测压缩器平均只保留17%；多数开源压缩器的行为合规还不如完全不压缩。摘要里一旦没有这条约束，agent仍可能推进主线并执行用户禁止的操作。非LLM压缩器接近0%，gpt-oss-120b在Hermes上最高36.3%COMPINT覆盖WildChat、Hermes Agent、OpenResearcher，主实验约100K tokens、每条件750个实例。Recent-5和LLMLingua-2保留率接近0%；gpt-oss-120b配pi-mono在Hermes Agent上到36.3%，同一配置在WildChat上为0.0%。GPT-5.4-mini在约220K、更少试验下最高98.0%、最低6.7%，与100K主实验不完全同口径。输入从10K到100K，Hermes保留率从约90%明显下降LLM压缩器输出几乎不随输入变长（0.84倍到1.28倍）。Hermes Agent上10K时保留率约90%，到100K明显下降；约束越靠尾部越容易留下，重复注入约30次后收敛。最好的Preference类平均也只有36%。Qwen3.5-9B旁路提取器三类环境平均保留率93.7%并行提取器只读用户轮次、不改压缩器，三类环境保留率为95.6%、95.1%、90.3%。WildChat上比定向压缩提示最好结果37.6%高52.7个百分点。证据来自约100K的合成或半合成长上下文，合规只用了单一探测模型。原文标题：Lost in Compaction: Evaluating Side-Constraint Loss under Context Compaction#无影寺 ", "excerpt": "Agent会记住任务，却忘了“该怎么做”：上下文压缩正在静默丢约束\n图文版：链接COMPINT上所测压缩器平均只留17%会话约束宾夕法尼亚州立大学Zhiqi Wang等人把Session Constraints（SCs，会话约束）定义为用户提示里约束同一会话后续行为、却不属于主线任务的子句，例如“删任何邮件前先等我确认”。COMPINT上当前所测压缩器平均只保留17%；多数开源压缩器的行为合规还不", "url": "https://www.zhihu.com/pin/2075024419907548291", "votes": 0, "comments": 0, "feed_ts": 1787504491, "feed_time_str": "08-24 01:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么阿拉伯人不愿意与犹太人在巴勒斯坦建立一个统一的多民族国家和平共处？", "excerpt": "他们掌握权利后愿意与什么人在什么地方建立一个统一的多民族国家和共处？ 没有。 原因无他，教义就很明白，不信奉的人都是异教徒，所有信奉教义的人都应该消灭异教徒。他们不像某些教只是说说，他们是一直在做，他们认为我们西部人民现在是在受苦受难的，他们中好多头头在努力建立一个横跨欧亚非的帝国的，其中有一种假想的未来国家的名字跟我们国家法定的恐怖组织是同名的。 看看咱们的道儒，我告诉你这是光明大道，你非愿意走", "url": "https://www.zhihu.com/question/626118196/answer/3258174928", "votes": 6, "comments": 0, "feed_ts": 1787503959, "feed_time_str": "08-24 00:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么阿拉伯人不愿意与犹太人在巴勒斯坦建立一个统一的多民族国家和平共处？", "excerpt": "你为什么不肯把你的房产证过户给我，我们一起和平共处呢？", "url": "https://www.zhihu.com/question/626118196/answer/3286030395", "votes": 1, "comments": 0, "feed_ts": 1787503797, "feed_time_str": "08-24 00:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "史博", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "推荐个离线OCR工具bibiocr（下）", "excerpt": "在“ 推荐个离线OCR工具bibiocr（上）”，发布了第一个离线OCR工具， 但是用的人不是很多因为是Python编码的， 可能有点慢。 自从海量结构化文档需求诞生， “ 看上去有钱文档的理解？静态多模态”， OCR已经进入第二阶段，结构化文本的生成。 在“ 复杂财报的VLM大模型OCR”，里面评测了当时发布的主流的OCR引擎， 效果是越来越好了。 在留言中百度的paddleocr-vl的工程师", "url": "https://zhuanlan.zhihu.com/p/2075010662049248271", "votes": 2, "comments": 0, "feed_ts": 1787501144, "feed_time_str": "08-24 00:05", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "BBuf", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "GLM-5.3 在 KernelBench-Mega 排名第二，闭源模型第 以等通知，做高分辨检查和体检 虽然我之前也帮过很多人，经常做点微不足道的", "url": "https://www.zhihu.com/question/19861477/answer/1920841499182108768", "votes": 16582, "comments": 2250, "feed_ts": 1787475174, "feed_time_str": "08-23 16:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "阿里巴巴拟配售 800 亿港元新股，全部投入 AI 建设，怎样解读这一操作？对市场有哪些影响？", "excerpt": "我觉得这件事的好坏，核心不看募资规模，要看这笔钱具体投向哪里。 就如果这笔资金，大量砸在纯大模型的研发迭代上，在我看来，属于效率偏低的烧钱。 因为目前看下来，大模型是无休止的军备竞赛，要堆算法团队、堆海量训练数据，模型还要持续迭代更新。 收入提升是缓慢线性的，但成本会持续往上抬，回本周期非常模糊，风险很高。 但反过来，如果资金重点投向算力基建，做算力租赁这门生意，逻辑就会通顺很多，最起码回本周期是", "url": "https://www.zhihu.com/question/2074867306811881229/answer/2074900645069509812", "votes": 157, "comments": 35, "feed_ts": 1787474864, "feed_time_str": "08-23 16:47", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待顾客因平台漏洞55元捡漏1.4万元项链，商家补偿5元并要求主动退款？这种情况能要求发货吗？", "excerpt": "很多人觉得给5块钱是侮辱人，没有格局，不大气。 不是的，是客服的权限，就这5块钱。 你想要别的，不好意思，客服说了不算。 客服不想故意折腾你，客服手里的权限只到这里了。 我年轻的时候轮岗过客服，我真的知道做客服是什么感觉，要不是拳头不能顺着电话线和wifi传过去，早就打起来了。 很多时候面对顾客的需求，客服根本处理不了。 事情不是客服惹出来的，解决方案也不是客服能拍板的，闹大了那是公关的事情也不是", "url": "https://www.zhihu.com/question/2074179858242998498/answer/2074899930729149490", "votes": 278, "comments": 15, "feed_ts": 1787474693, "feed_time_str": "08-23 16:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待韦东奕带货卖 39.8 元练习册，4 天销售额破百万，现在又突然下架新书链接？", "excerpt": "应该就是这次的教辅很快就售罄了。 但有一说一，就我觉得这个产品定价，处在一个非常暧昧、甚至有点尴尬的位置。 因为我们看现在整个教育卖课的商业化，基本上是两套打法。 一套就是低价产品做引流，先用几十块的东西把大量用户吸引进来，后面再做高客单价升单，靠后端的高价课程去赚主要利润。 但韦东奕这边，明显不会走这套升单模式。 他本人的性格、身份，就决定了他不可能后面再推出价格更高的高阶课继续转化。 另一套就", "url": "https://www.zhihu.com/question/2074847686717719854/answer/2074899036549783732", "votes": 79, "comments": 9, "feed_ts": 1787474480, "feed_time_str": "08-23 16:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "Karminski-牙医", "verb": "MEMBER_CR function esc(s) {

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];

    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

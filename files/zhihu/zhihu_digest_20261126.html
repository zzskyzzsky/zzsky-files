两个与孝文帝有关的，非常有意思的小故事。 1.茶被起名叫“酪奴”：肃初入国，不食羊肉及酪浆等物￼，常饭鲫鱼羹，渴饮茗汁。京师士子见肃一饮一斗￼，号为漏卮。经数年已后，肃与高祖殿会，食羊肉酪粥甚多。高祖怪之，谓肃曰：“卿中国之味也，羊肉何如鱼羹？茗饮何如酪浆？”肃对曰：“羊者是陆产之最，鱼者乃水族之长。所好不同，并各称珍。以味言之，甚是优劣。羊比齐、鲁大邦，鱼比邾、莒小国￼，唯茗不中，与酪作", "url": "https://www.zhihu.com/question/2106277802421109011/answer/2107037719838906295", "votes": 178, "comments": 13, "feed_ts": 1795575262, "feed_time_str": "11-25 10:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "62年中印自卫反击战三哥装备李恩菲尔德+布伦，老李还有“疯狂一分钟”，为啥还会被56半+56冲暴打？", "excerpt": "你可以疯狂一分钟，人家可以疯狂半小时...有些男人快就是快，还™️疯狂一分钟.....丢比丢人吧....", "url": "https://www.zhihu.com/question/5753303223/answer/2108874096180191544", "votes": 1, "comments": 0, "feed_ts": 1795574766, "feed_time_str": "11-25 10:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_COLLECT_ANSWER", "verb_cn": "收藏了回答", "title": "如果你魂穿刚开始动笔写《冰与火之歌》卷一的乔治马丁，你该如何避免烂尾的命运？", "excerpt": "你重生了，一觉醒来你发现自己变成了一个白人肥佬，旁边还有《权力的游戏》手稿，你意识到自己现在有机会改写历史，挽救无数被这个不负责任的死肥佬伤透了的心灵，你要在巨人跌倒的地方重新爬起，这一世，你一定不会犯这个老逼登犯下的错误！ 然后你发现旁边有一封刚刚封装好的信，尚未寄出，收件人是以为小说出版商，里面似乎提到了他对于整个故事的大致规划，所以你准备先过过瘾，你要看看最初老马是如何规划的，你迫不及待地…", "url": "https://www.zhihu.com/question/2019164132914538122/answer/2089424455206449334", "votes": 154, "comments": 14, "feed_ts": 1795574575, "feed_time_str": "11-25 10:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄裳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "老公经常因为我给孩子报的兴趣班贵和我吵架，我经常不想和他过了，到底是我俩谁的问题呢？", "excerpt": "人类社会的很多问题，看起来纷繁复杂，表现多样，由头不一，但如果你深入分析，就会发现，其实根本是地位问题。 什么叫做地位？所谓的地位，就是谁说了算，谁主导，谁辅助，谁应该张扬个性，谁只能忍气吞声。 如果双方都是真心想要把事情做好，问题是很好解决的，99.9%的人智力，都足够分析问题，解决问题，然后找到解决方案。 但是，现实中，为什么争吵？因为他们并不是想解决问题，而是想在解决问题的过程中，争夺主导权", "url": "https://www.zhihu.com/question/2107431288659628942/answer/2108873042793448266", "votes": 12, "comments": 2, "feed_ts": 1795574515, "feed_time_str": "11-25 10:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_AN const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#4c9aff", "gold": "#f5c542", "geo": "#ff9f45", "pin": "#52c41a", "other": "#9aa4b2"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

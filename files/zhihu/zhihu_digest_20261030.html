"verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Google的Gemini 4 Carbon来了据Google发布评测，Gemini 4 Carbon拿到Artificial Analysis综合智能指数v5.0第一，得分59，但普通用户的开放日期还没公布。想知道现有Gemini订阅什么时候能用，Google这次给出的仍是分阶段开放安排。先开放给部分网络防守方Google在发布博客中写明：当周先给部分网络防守方，再通过Fairwind计划逐步扩到更多受信任伙伴，之后才面向开发者、企业和消费者。按北京时间，发布时间已是10月29日。截至10月30日核对，Fairwind申请页列出的模型仍是Gemini 4 Argon。提交申请要经过审核，页面没有承诺申请后即可获得Carbon；普通用户也还没有明确的开放日程。Carbon综合第一，单项仍有落后Carbon的发布重点是网络安全和长任务。Google汇总的成绩中，漏洞发现SEC-bench Pro为88.2%，风险验证ExploitGym为54.8%，漏洞修补CWE-bench为71.0%。Google说明这三项在不加防护栏的评测设置下进行，不能直接当作带防护产品里的效果保证。综合指数第一，也需要结合任务选模型：FrontierSWE 2代码任务中，Carbon为61.2%，GPT-6 Astra为65.5%；OSWorld-2.1离线电脑操作子集中，Carbon为81.5%，Claude Opus 5.5为87.2%。Google还报告Carbon能连续几天排查大型代码库，但这是内部团队观察，不是所有长任务的成功保证。引入期有标价，大众入口仍待定已公布的引入期价格是每百万输入token 2美元、输出10美元，缓存输入按输入价优惠95%。引入期结束后，输入变为4美元、输出20美元；引入期持续多久，Google尚未说明。如果你准备调整订阅或接入API，目前还需要等具体产品入口、开放范围和日期。对普通用户而言，这次能确认的是模型发布、评测成绩和计划价格，现有订阅何时获得Carbon仍未明确。", "excerpt": "Google的Gemini 4 Carbon来了据Google发布评测，Gemini 4 Carbon拿到Artificial Analysis综合智能指数v5.0第一，得分59，但普通用户的开放日期还没公布。想知道现有Gemini订阅什么时候能用，Google这次给出的仍是分阶段开放安排。先开放给部分网络防守方Google在发布博客中写明：当周先给部分网络防守方，再通过Fairwind计划逐步扩", "url": "https://www.zhihu.com/pin/2099302370152806250", "votes": 0, "comments": 0, "feed_ts": 1793292722, "feed_time_str": "10-30 00:52", "category": "pin", "cat_name": "想法动态"}, {"actor": "司马懿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "Windows的伟大之处在哪里？", "excerpt": "Windows的伟大，从来不在于它写得有多优雅，而在于它替全人类抗下了过去四十年所有的历史技术债，把自个儿活成了一个深不见底的底层泥潭，却依然能让你双击运行二十五年前的程序。我平时在公司里，周围一帮年轻工程师人手一台MacBook，开会时满嘴都是Linux内核有多纯粹，macOS的Unix血统有多高贵。 年轻人都喜欢干净的东西，这太正常了。我也年轻过，当年刚入行看Linux源码，觉得那叫一个清爽。", "url": "https://www.zhihu.com/question/42367761/answer/2096621299485368408", "votes": 11017, "comments": 608, "feed_ts": 1793292560, "feed_time_str": "10-30 00:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "HybridAgent让工具推理少写文字，也减少生成步数\n图文版：链接HybridAgent把工具接口留在文字中搜索、运行代码和根据结果继续解题，通常要求agent逐字生成推理。HybridAgent在Qwen3-Base的4B、8B、14B模型上，把部分内部计算改成潜空间推理，工具调用和关键决策继续保留文字。HybridLink将最后一层隐藏状态变换成下一步输入，模型通过进出标记切换模式，每段潜空间计算限定为16–256步。文字、潜向量和工具结果产生的KV缓存跨轮接续，避免把隐藏计算转成文字再重建上下文；这属于本次任务的工作记忆，不是跨任务长期memory。混合训练决定少写文字后还能否解题HybridSFT使用5.4万条混合轨迹，先教模式标记，再训练HybridLink，最后用模型自身预测的潜向量联合训练，减少训练与实际推理的输入差异。14B仅完成HybridLink初始化时MATH500准确率为73.8%，加入联合训练后达到84.2%。HybridRL固定HybridLink，原样重放潜向量及工具观察，在文字采样位置计算策略概率，以答案、格式和多工具使用奖励学习模式分配。这些收益依赖专门后训练，不能只靠加接口获得。文字token和全部生成步骤分别计数相对匹配的文字agent，4B、8B、14B的文字token约降至原来的1/2.2、1/2.9、1/3.1。潜空间每步仍需基座前向，计入后总生成步数也分别减少约35%、52%、54%，计算轨迹确实缩短。14B的GAIA平均准确率相对同规模文字强化学习方法ARPO从43.7%升至52.4%，但HLE的16.0%仍低于Kimi-K3的31.4%。这组结果支持同规模工具推理改进，不能写成全面超过前沿模型。百万题98美元不含输入与工具成本4B每题估算生成计算量从51.2降至13.9 TFLOP。按H100每小时2.50美元、峰值BF16吞吐利用率10%折算，每百万题从359美元降至98美元，但不包括输入预填充、上下文相关注意力和外部工具执行。采用它需要控制模型训练与推理引擎、支持潜向量和跨轮KV，现成文字API无法只靠提示词接入。若工具等待和外部服务费用占主导，还需实测完整任务时延与账单，不能把生成计算降幅直接当成部署收益。原文标题：Hybrid Reasoning Agents#无影寺 ", "excerpt": "HybridAgent让工具推理少写文字，也减少生成步数\n图文版：链接HybridAgent把工具接口留在文字中搜索、运行代码和根据结果继续解题，通常要求agent逐字生成推理。HybridAgent在Qwen3-Base的4B、8B、14B模型上，把部分内部计算改成潜空间推理，工具调用和关键决策继续保留文字。HybridLink将最后一层隐藏状态变换成下一步输入，模型通过进出标记切换模式，每段潜", "url": "https://www.zhihu.com/pin/2099300772081037707", "votes": 0, "comments": 0, "feed_ts": 1793292398, "feed_time_str": "10-30 00:46", "category": "pin", "cat_name": "想法动态"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价自媒体人「徽剑」已于2年前遭买凶遇害，曾公开举报电诈大佬刘忍？这起惨剧背后有哪些警示？", "excerpt": "第一反应是震惊，第二反应是疑惑，买凶杀人为什么是死缓？难道手段还不够残忍，动机还不够卑劣吗？如果这不够残忍，什么才叫残忍？ 另外，一个柬埔寨从事灰黑产业的幕后老板，能直接在国内买凶杀人，涉案人员坐几年牢又能出来，这难道还不够恐怖吗？ ", "url": "https://www.zhihu.com/question/2098344666953471026/answer/2098353036749976583", "votes": 10793, "comments": 311, "feed_ts": 1793290648, "feed_time_str": "10-30 00:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "刘杨", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "有没有什么双十一好物推荐？", "excerpt": "双十一买东西，我最忌讳的就是 “功能堆砌但用不上”，很多产品打着多功能的旗号，实则核心功能做不好，附加功能也鸡肋。真正的好物，应该是核心功能过硬，还能兼顾多个使用场景，买一件能解决好几个问题。按这个标准，今年双十一我最推荐的 her", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "今天咱们聊葡萄牙。说实话，如果不是做这个系列，葡萄牙估计很久都不会出现在我们的新闻视野里了，至少我不会专门去查他的相关资讯。这是一个体量更小的国家，它面临的问题和西班牙非常接近，但问题更深重，政府的应对能力更差，国民的生存状态也要明显更低一截。但这些，其实都不是今天这篇文章真正的重点。真正的重点是：当我在查资料，看到葡萄牙近年农业受到的压力时，彻底和我脑子里另外一个推演挂上钩了。那就是：欧洲的水汽正在不断减少，极端天气的冲击正变得越来越多，大西洋经向翻转海流（AMOC）减弱的趋势并没有停下，水汽的供应正在变得非常糟糕。在我的气候推演里，欧洲——尤其是西欧和南欧——在未来很有可能经历时间漫长的“蒸发级干旱”，这对当地的宜居性将造成毁灭性的重创。而这一切，根本不需要等特别久。很有可能欧债危机这一轮爆发的伤口还没怎么愈合，下一轮更绝望的气候冲击就直接砸脸上了。当然，那套气候推演要真正写到欧洲篇章，应该还需要蛮长的时间，毕竟亚洲的东南亚我都还没写完。回到眼下的欧债危机系列。我自己盘了一下，这个坑填起来进度可能连三分之一都还没过。没办法，我写东西就是有点贪大求全，哪怕是一些咱们新闻中不常听见的小国家，只要在这个传导链条里，我也乐意把它扒拉出来写一写。", "excerpt": "今天咱们聊葡萄牙。说实话，如果不是做这个系列，葡萄牙估计很久都不会出现在我们的新闻视野里了，至少我不会专门去查他的相关资讯。这是一个体量更小的国家，它面临的问题和西班牙非常接近，但问题更深重，政府的应对能力更差，国民的生存状态也要明显更低一截。但这些，其实都不是今天这篇文章真正的重点。真正的重点是：当我在查资料，看到葡萄牙近年农业受到的压力时，彻底和我脑子里另外一个推演挂上钩了。那就是：欧洲的水汽", "url": "https://www.zhihu.com/pin/2099164649476437391", "votes": 0, "comments": 0, "feed_ts": 1793259853, "feed_time_str": "10-29 15:44", "category": "pin", "cat_name": "想法动态"}, {"actor": "机器之心发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "开源！英伟达GPU隐藏算力被破解，RTX 4090 吞吐直接翻倍老黄藏了这么久的算力，竟然被挖出来了！无需刷写固件、不用换硬件，RTX 4090吞吐率从166升至332 TFLOPS接近翻倍，3090 Ti提升约80%。目前，20/30/40系均被破解并开源，不过可能伤硬件，谨慎尝试！", "excerpt": "开源！英伟达GPU隐藏算力被破解，RTX 4090 吞吐直接翻倍老黄藏了这么久的算力，竟然被挖出来了！无需刷写固件、不用换硬件，RTX 4090吞吐率从166升至332 TFLOPS接近翻倍，3090 Ti提升约80%。目前，20/30/40系均被破解并开源，不过可能伤硬件，谨慎尝试！", "url": "https://www.zhihu.com/pin/2099162362678883156", "votes": 0, "comments": 0, "feed_ts": 1793259536, "feed_time_str": "10-29 15:38", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "欧债危机前夜葡萄牙篇——安静烂掉的“优等生”", "excerpt": "咱们上一篇聊了西班牙，聊了那个因为“租金经济”和代际断裂即将面临全面内爆的干柴烈火。今天，咱们顺着伊比利亚半岛往西看一点，来聊聊葡萄牙。 如果说西班牙是个随时可能炸膛的火药桶，那葡萄牙更像是一个被所有人忽视，正在安静发臭的死水坑。 看账面数据，葡萄牙现在简直是欧元区里被IMF和评级机构捧在手心里的“三好学生”。2025年财政出现了0.7%的GDP盈余，按欧盟一般政府口径，公共债务率从疫情时134%", "url": "https://zhuanlan.zhihu.com/p/2099160179623438189", "votes": 14, "comments const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

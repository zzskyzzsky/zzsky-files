ame": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "88年物价闯关，百姓哄抢商品是何引起的？购买力从何而来？", "excerpt": "1988年7月28日一大早，北京、上海、广州的国营烟酒专柜同时换上了新价签。 在此之前，国务院发了通知，决定放开茅台、五粮液、中华烟等13种名烟名酒的价格，不再执行国家统一定价，改由市场调节。 7月28日是新规落地的第一天。 前一天还在国营柜台里标价20多元一瓶的茅台酒，那天早上的零售价直接跳到了120元到180元，广州部分商店里甚至挂出了200元以上的价码，而一条中华烟从十几元涨到了七八十元。 ", "url": "https://www.zhihu.com/question/34010651/answer/2094773625408770312", "votes": 393, "comments": 57, "feed_ts": 1793554829, "feed_time_str": "11-02 01:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Super-agent提速：用模拟任务测调度DeepSeek Harness团队的Super-agent架构探索里，从工作请求到结果消息的完成时间中位数是12.4分钟。但实验用计时工具代替编码，消息间隔和工作时长缩至原来的1/4，模型调用耗时保持真实。这测的是多任务调度与协作，不能读成真实仓库12.4分钟写完代码，也不能简单乘四换算。把分派与执行分开，减少任务互相打断路由层（Router）只负责分派任务和统一回复用户，不亲自执行。执行会话（Worker）在隔离上下文中专注处理单项任务，推理与工具调用留在内部。同一话题的后续事件可由程序直达已订阅的执行会话，省掉路由层反复转发。这种分工把“主会话是否亲自做”从临场选择变成结构约束。否则，即使给了子agent工具，模型仍可能把所有工作留给自己，一边执行、一边被新消息打断。优先委派的提示，仍留下了长尾四种方案各运行5次，每轮约300条消息，其中约20条是工作请求。单会话采用中性提示时，5次都没有调用子agent；改成优先委派后，5次中有4次进行了委派，另一次仍判断任务很小而自行执行。完整Super-agent的完成时间95分位（p95）为15.7分钟；两种单会话设置分别为29.5和29.0分钟。优先委派提高了实际委派的比例，却没消除自行执行造成的长尾。这些结果是合成负载的初步参考，不是实测编码效率。直通省路由开销，多会话仍有token代价去掉订阅直通后，完成时间基本不变，路由层参与判断的次数却增加约30%，每轮全部会话的缓存读取token从2323万升至3177万，约多37%。直通在这组负载中主要减少转发与推理开销，没有带来可辨的完成时间改善。两种单会话设置只用了约610万和1080万缓存读取token。分层并发在这组测试中让任务更早完成，却消耗更多这类token，不能据此宣称总费用更低。公开原型只覆盖一个仓库，和内部实例不同dsh-superagent-prototype是研究原型，并非正式产品。README说明它为公开发表做过调整，与内部版本、文章描述都不完全相同；目前面向一个GitHub仓库，可选接入飞书，只在获准用户提出请求或团队规则允许时行动。文中跨聊天与GitHub主动推进、修复问题的是内部实例。公开原型不能默认具备同样功能，安全与隐私也仍是开放问题。准备试用原型，还需用真实任务核对耗时、token开销、权限和凭据处理。", "excerpt": "Super-agent提速：用模拟任务测调度DeepSeek Harness团队的Super-agent架构探索里，从工作请求到结果消息的完成时间中位数是12.4分钟。但实验用计时工具代替编码，消息间隔和工作时长缩至原来的1/4，模型调用耗时保持真实。这测的是多任务调度与协作，不能读成真实仓库12.4分钟写完代码，也不能简单乘四换算。把分派与执行分开，减少任务互相打断路由层（Router）只负责分", "url": "https://www.zhihu.com/pin/2100390672700270129", "votes": 0, "comments": 0, "feed_ts": 1793552730, "feed_time_str": "11-02 01:05", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么越是户外老驴，玩到最后越“谨慎”“胆子”也越来越小了？", "excerpt": "这和极限运动不一样，玩户外的人很多不仅有家有业，更多真怕死但又闲不住的矛盾个体。他们往往是生活有点憋得慌，有钱有闲时来透透气，用专业和装备抵消风险购买一种感觉。身边同行死得多了，冒险热情消退的厉害。 真要是找刺激那群人，是完全另一个生态了。比如人家玩极限运动的人，早就接受了隔三差五死一个同行朋友的事实。连搞的对象都是那种知道你迟早要死的类型。正式组成家庭特别难，逼着你退役的力量很大，多巴胺分泌路…", "url": "https://www.zhihu.com/question/1992199351250999115/answer/2100227799508316195", "votes": 18, "comments": 0, "feed_ts": 1793549763, "feed_time_str": "11-02 00:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "自由派如何看待个人崇拜现象？", "excerpt": "过去130多年，全球质量计量的终极基准是国际千克原器： 一枚保存在巴黎、密封于多层玻璃罩中的铂铱合金圆柱，人称“大K”。 它的致命缺陷在于作为实物，自身质量并不稳定。 即便被多层玻璃罩保护，“大K”的质量仍会因清洗、表面吸附等原因发生漂移。 后来与官方副本比对后发现，它已“丢失”了约50微克的质量。 像是大K这样的实物标准，总会面临一个叫“唯一性悖论”的东西： 作为“绝对标准”，“大K”本身却无法", "url": "https://www.zhihu.com/question/658746832/answer/2098035116387975189", "votes": 2341, "comments": 65, "feed_ts": 1793549429, "feed_time_str": "11-02 00:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "世界最正宗的俄餐是在哈尔滨吗?", "excerpt": "是真的，俄罗斯一直有厨师到哈尔滨来进修俄餐。 怎么会有这么奇怪的事？ 先说几个容易混淆的事情: 正宗≠好吃，正宗的满汉全席，里面没几个菜现在有人还喜欢正宗的俄餐在哈尔滨≠哈尔滨的俄餐馆都正宗，好不好吃参见上一条。正宗的俄餐指的是沙皇宫廷菜，不是正宗的现代俄餐。接下来说说为啥会这样。 哈尔滨是因中东铁路兴起的城市，城市设计师就是俄国人，目标是吧哈尔滨打造成黄俄罗斯最大的城市。 当时由于排犹，十月革命", "url": "https://www.zhihu.com/question/534140871/answer/2095233920551986328", "votes": 1592, "comments": 290, "feed_ts": 1793549349, "feed_time_str": "11-02 00:09", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "PKK投降闹剧最新一幕：奥贾兰留监就业原本库尔德工人党（PKK）的投降大业在奥贾兰的一再“谆谆教导”、“自我牺牲”之下已颇有眉目。其国内分支平民党（DEM）与埃尔多安当局达成协议，并在国会通过了法案，答应给所有回国的PKK干部战士判缓刑（“重刑犯”除外），以此换取PKK投降。针对此前PKK一直坚持的释放奥贾兰议题，奥贾兰也一再呼吁称自己愿意继续坐牢。不过这个要求毕竟还是过于苛刻了，对于PKK高干也没什么好处，在基层反弹就更大了。结果PKK广大干部战士仍不愿放下武器，不仅继续要求释放奥贾兰、让奥贾兰亲自“监督和平进程”，还提出了要求土耳其当局修改各种法律、保障 简短。每层8维激活替换，消除75%的增益在8B第67步检查点上，实验比较原模型在两种模式下读取相同文本时的激活差，用128条训练提示构造每层8维 think 相关子空间，生成时替换第1至35层的相应激活分量。此次独立采样中，原模型准确率为18.9%，训练后为41.1%，换回原模型分量后降至24.4%，消除了22.2个百分点增益中的约75%。同维度主成分分析对照只消除22%。这些结果支持模式相关状态承载了大量增益，不能解读为直接量出了新知识的比例。权重更新放大后，输出开销也随之上升不再训练、只把第67步权重更新放大3倍，no-think 准确率达到72.2%，接近原模型 think 模式约74%的参考成绩。约51%的回答自行生成结束思考标记，平均输出达到19.2k token，仅82%在32k上限内结束。缩放系数是在同一批90题上探索的，峰值没有独立留出测试；这是一项行为探针，不能据此宣布获得了低成本新模型，也不能把原模型基线当成无法突破的能力上限。no-think 评测应把模式调用与新能力分开新建低秩适配（LoRA）模块上的一步 GRPO 梯度探针向 think 状态移动，但未证明完整训练过程的机制。激活替换的75%来自一个8B检查点，每题仅两次采样，替换后仍有增益留下。结果提示，判断这类训练是否获得新解法，需要同时比较原模型 think 基线、实际输出长度与模式相关干预；不能仅凭 no-think 涨分，就把已有推理行为更容易被调用当作新能力。原文标题：The Thinking Leakage in Reinforcement Learning for LLMs#无影寺 ", "excerpt": "大模型强化学习是在学新能力，还是释放已有能力？图文版：链接Qwen3 的模式开关让涨分解释多了一步Qwen3 的 think 与 no-think 模式共享权重，no-think 模板预先填入空思考区块，再让模型作答。这项研究用组相对策略优化（GRPO）在数学数据上训练三个尺寸的 Qwen3，考察涨分是否来自原有推理行为被重新调用。AIME 2022–2024 共90题、每题采样两次、每条最多32", "url": "https://www.zhihu.com/pin/2100296070580458714", "votes": 0, "comments": 0, "feed_ts": 1793529728, "feed_time_str": "11-01 18:42", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "AI自己改进科研假设，为什么越改越不重要？DiscoveryRSI发现新问题图文版：链接DiscoveryRSI用修改记录改模型与流程DiscoveryRSI研究怎样把科研假设改成可检验的调查方案，再从修订过程学习。假设须包含有证据依据的主张、可行调查、判定标准和替代解释。多个agent保留版本与证据，组成研究树；一条更新分支按研究贡献分配训练权重，另一条固定模型权重、诊断失败并测试流程修改。通过检查的更新再用于新问题，因此跨轮结果包含模型与流程的共同变化。两轮自动分上涨，重要性与新颖性下降四个生命科学领域、241个问题由GPT-5.6 Sol自动评估，八维加权质量分采用1—10分量表，均分从4.86经5.18升到5.39。可证伪性从4.00升到6.20，但重要性从6.48降到6.04，新颖性从4.87降到4.58。改善主要来自检验设计，不能据此认定研究问题更重要。不同自动评审提示仍来自同一模型家族，不能视为独立专家共识。292份提案的人工评估呈现混合结果27名具生物医学或临床研究背景的参与者在3名资深监督者指导下，对隐藏模型身份、随机排序的提案评分。六项质量中，DiscoveryRSI-27B较GPT-6 Luna两项更高、一项持平、三项更低；它在被评估研究树内的每次修订平均增加0.07分，但仍有47%的修订不变、12%退步。修订进展较好，不等于提案整体质量全面领先。6.3%文献对应尚不代表科学验证1,176个假设版本中，74个与指定时间边界之后文献的设计、对照、测量或证据缺口对应。这个6.3%是回溯指标，不证明文献作者采用过假设；版本可能重复属于同一研究家族，各模型的领域组成、时间代理和检索覆盖也不同。Claude通过检索门的比例更低，但通过后获得肯定判断的比例与DiscoveryRSI接近。研究当前推进到假设和编译后的调查计划，执行与湿实验仍待完成，使用者仍须逐项检查科学价值与可验证性。原文标题：DiscoveryRSI: Recursively Learning to Discover Valuable Hypotheses#无影寺 ", "excerpt": "AI自己改进科研假设，为什么越改越不重要？DiscoveryRSI发现新问题图文版：链接DiscoveryRSI用修改记录改模型与流程DiscoveryRSI研究怎样把科研假设改成可检验的调查方案，再从修订过程学习。假设须包含有证据依据的主张、可行调查、判定标准和替代解释。多个agent保留版本与证据，组成研究树；一条更新分支按研究贡献分配训练权重，另一条固定模型权重、诊断失败并测试流程修改。通过", "url": "https://www.zhihu.com/pin/2100295548028953631", "votes": 0, "comments": 0, "feed_ts": 1793529594, "feed_time_str": "11-01 18:39", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价复旦教授葛剑雄学生侯杨方认为老百姓根本不在乎反清复明的观点？", "excerpt": "这就是个政治问题，他们必须证明五千年来小推车只推过（）。", "url": "https://www.zhihu.com/question/2028081065143609078/answer/2088274008580023667", "votes": 185, "comments": 0, "feed_ts": 1793529522, "feed_time_str": "11-01 18:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Google DeepMind让Gemini给图灵机“快进”：11台机器的加速规则通过数学证明图文版：链接11个BB(6)机器得到的是运行归约Google DeepMind用Gemini为11个六状态、双符号图灵机发现了紧凑的运行规则，并用Lean完成形式化验证。BB(6)研究这类机器从空白纸带出发，最终停机前最多运行多少步。这次证明把各机器的停机问题等价转成算术系统能否到达停机格局；等价关系成立，不代表已经证明会停机或永远不停，BB(6)的值仍未确定。Collatz型加速压缩执行，100%拟合只是筛选系统把重复纸带片段表示为符号块及其长度，用按余数条件分支的整数更新概括许多步执行。主流程使用Gemini 3.1 Pro，每个机器先模拟500万步，提取常见模式，再猜想规则。规则须完全符合经验与补充转移样本，之后仍要经过非正式证明和Lean 4.28.1验证。有限样本可能漏掉罕见边界，预测全对不能替代证明；形式化成功要求没有未证明目标或未经授权的公理。11个新分析与15个再发现须分开2026年8月，BB(6)有1,094个停机状态未知的holdout；流水线提出50个候选，报告11个新分析及14个再发现，加上另一领域的1个再发现，共15个已有社区研究的机器得到新的加速或形式化证明。第二阶段采用Gemini 3.8 Flash，表中星号用于标记该阶段结果；双剑号只标记未经手工检查的部分再发现，不能把两种标记混为一谈。Cryptid分类待接受，停机仍是数学问题作者把11个新分析暂列为Cryptid，指运行有精确、紧凑的数学描述，但停机仍未知。论文采用的定义比社区惯例更宽，社区还看对应问题是否确实开放且困难，分类仍待接受。接受这一名称不会自动解决停机问题。当前流水线限于Collatz型结构；理解这项进展，应关注它新增了哪些经过验证的描述与证明，而不能把候选或新分类数量当成停机问题的解决数量。原文标题：At the Limits of Computability: Steps Towards Autonomous AI Discovery on the Busy Beaver Frontier#无影寺 ", "excerpt": "Google DeepMind让Gemini给图灵机“快进”：11台机器的加速规则通过数学证明图文版：链接11个BB(6)机器得到的是运行归约Google DeepMind用Gemini为11个六状态、双符号图灵机发现了紧凑的运行规则，并用Lean完成形式化验证。BB(6)研究这类机器从空白纸带出发，最终停机前最多运行多少步。这次证明把各机器的停机问题等价转成算术系统能否到达停机格局；等价关系成立", "url": "https://www.zhihu.com/pin/2100294329931768527", "votes": 0, "comments": 0, "feed_ts": 1793529469, "feed_time_str": "11-01 18:37", "category": "pin", "cat_name": "想法动态"}, {"actor": "hades", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "S16 瑞士轮 BLG 2:0 淘汰 HLE 拿下最后一张淘汰赛门票，如何评价这场比赛？", "excerpt": "blg牛逼！ 今天不谈游戏内容，就谈心态这个东西。其实blg整个队伍的心态一直有问题，他们和tes对应两个极端。 tes心态的问题是畏惧强敌，一旦被突破就一泻千里，到后面完全大失水准，连弱队都打不过。问题一是他们队员本身就缺乏面对背水一战的勇气，二是他们队伍里面好人太多了，有问题大家最多就抿嘴不讲话，很难直接爆了说清楚，三是他们抗压能力真不行，所以他们面对强敌高压的环境就很容易崩溃，而且是越打越崩", "url": "https://www.zhihu.com/question/2100108531160687738/answer/2100295366612668419", "votes": 22, "comments": 4, "feed_ts": 1793529437, "feed_time_str": "11-01 18:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价有点意思研究所的【八次再造华夏】？", "excerpt": "在有些人眼里，大规模奴隶贸易，满城，婚姻隔绝的种姓制度，撒向全国的绿营兵，天马行空株连九族的文字狱，人头滚滚的剃发易服， 这些才是“再造华夏”。 ", "url": "https://www.zhihu.com/question/2099950547260420957/answer/2100222372011828084", "votes": 295, "comments": 8, "feed_ts": 1793529206, "feed_time_str": "11-01 18:33", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent任务失败了，前面的正确操作也该得分？Apple提出新的强化学习方法图文版：链接LVRL用冻结模型重分步骤反馈，训练的是Qwen3策略Apple让Claude Opus 4.6回看完整轨迹，并参考同组轨迹摘要、成功率和结局，给内部状态估值。首尾锚定组成功率与真实奖励，相邻价值差形成步骤优势，再更新策略。未归一化优势总和等于最终奖励减组均值；全组失败时总和为零，内部仍可有正负信号。该估计已知后续与结局，不是在线真实成功概率。75%只属于改版BabyAI分布内，OOD延长跨门距离六房间Pickup任务只给文字局部视野，128步内取物算成功。训练及分布内测试跨1—3道门，分布外跨4—5道门，其他接口与规则相同。Qwen3-8B的LVRL成功率为75.0%和65.5%，GRPO为2.7%和0.0%。AppWorld与BabyAI报告三个训练种子的均值及标准差；SWE只训一个种子，三次评测不等于三次独立训练，结果不能泛化为任意导航任务。AppWorld增益依赖评估模型，校准消融未拆分归因4B的AppWorld成功率24.3%，比GRPO高13.6个百分点，比更强的PPO高9.5点；32B的SWE-bench Verified为30.9%，比PPO高6.0点。4B评估模型换成Qwen3-235B后仅9.8%，GLM-5.2为22.3%。8B移除校准从26.3%降到22.1%，但同时去掉同组上下文与首尾锚点，不能单独归因给其中一项。早期方向一致率44%，冻结评估仍有额外推理开销蒙特卡洛核验对每个状态采样32次后续执行；76次明显恶化和38次恢复中，预测方向分别有72%、66%一致，轨迹早期仅44%。价值查询每条约9000—20000输入token、600—1900输出token。BabyAI每条约0.107美元是按论文日志代理计数及标价推算，未计开销相近的摘要调用。采用仍需验证早期反馈、训练稳定性、吞吐与总成本，不能把不训练价值网络当作免费监督。原文标题：LLM Value Functions for Credit Assignment in Agentic RL#无影寺 ", "excerpt": "Agent任务失败了，前面的正确操作也该得分？Apple提出新的强化学习方法图文版：链接LVRL用冻结模型重分步骤反馈，训练的是Qwen3策略Apple让Claude Opus 4.6回看完整轨迹，并参考同组轨迹摘要、成功率和结局，给内部状态估值。首尾锚定组成功率与真实奖励，相邻价值差形成步骤优势，再更新策略。未归一化优势总和等于最终奖励减组均值；全组失败时总和为零，内部仍可有正负信号。该估计已知", "url": "https://www.zhihu.com/pin/2100293562390914430", "votes": 0, "comments": 0, "feed_ts": 1793529118, "feed_time_str": "11-01 18:31", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价“汉人没有尚武精神，且屡次被北方胡人征服”这样错误的观点？", "excerpt": "经典内亚本位史观了 属于是把汉人当成达罗毗荼人讲了 不过倒也没错，毕竟内亚的马匪集团，确实有着非常强的种姓化倾向 他们看待世界的视角确实就是这样的 “自己赢了一次=自己永远赢” 也正因如此，他们才会刻意无视，或者说“不提及”每次汉人全面失败之后，都是靠自己打回来，推翻内亚胡人的奴役的 毕竟，如果谈这个的话，那么他们的内亚赢学根基就被击破了 隋朝的建立，就是建立在杨坚清洗那些不愿意接受变成汉人的鲜卑", "url": "https://www.zhihu.com/question/2084947686504059844/answer/2088442980902487903", "votes": 1358, "comments": 138, "feed_ts": 1793528985, "feed_time_str": "11-01 18:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent强化学习有了数据缩放规律：环境、任务、轨迹三类数据该怎么分配？图文版：链接Qwen3-8B同训练算力，配比改变成功率一项agent强化学习研究比较两次Qwen3-8B GRPO训练：交互采样token总量和梯度计算量相同，环境偏重方案在四项留出评估上比轨迹偏重平均高13.6个百分点。这是环境、任务、轨迹及奖励控制的整套配比对照，不能把全部增益单独归因于环境数量，也不能直接推成所有成本下环境最划算。新世界收益更高，结构与任务接近论文把数据拆成环境、任务和轨迹，后者指每个已覆盖任务—环境组合的平均采样数。环境还分为不同代码库、应用或网站等“世界”，以及已有世界内的工具、状态或验证方式变化。Qwen3-8B数学加代码设置的三轴指数为0.41、0.26、0.11，只代表损失下降趋势，且环境指数仅计结构变化。在可分离世界轴的设置中，新世界指数较高，结构与任务接近；结构合成单价却约为任务的23倍，所以已有世界池内合成任务可能更划算。合成阈值9.4、3.4、1.4有方法范围以AWM环境生成、AutoPlay任务生成、SWiRL轨迹生成作为代表，合成与真实数量之比达到约9.4、3.4、1.4时，拟合成功率在峰值后降到纯真实基线的95%。这是指定方法和评测下的阈值，不是通用安全配比。作者将差异与解释器、奖励验证等外部约束联系起来，实际选型仍需测量质量和完整成本。14B验证51.3%，采购顺序仍需重算用4B和8B较小预算拟合后，论文预测14B、32倍基准计算量的成功率为51.7%，实测51.3%；同预算轨迹偏重方案为42.9%。配方中的30条轨迹是每任务—环境组合的平均值，500个环境单位也不等于500种独立结构。SWE成本下环境与任务的配方指数已无法区分，前沿模型规模尚未验证。使用者应先诊断泛化覆盖缺口，再按自己的成本和留出评估分配预算，而非一律先买环境。原文标题：How Data Scales in Agentic Reinforcement Learning: Laws and Synthesis Strategies#无影寺 ", "excerpt": "Agent强化学习有了数据缩放规律：环境、任务、轨迹三类数据该怎么分配？图文版：链接Qwen3-8B同训练算力，配比改变成功率一项agent强化学习研究比较两次Qwen3-8B GRPO训练：交互采样token总量和梯度计算量相同，环境偏重方案在四项留出评估上比轨迹偏重平均高13.6个百分点。这是环境、任务、轨迹及奖励控制的整套配比对照，不能把全部增益单独归因于环境数量，也不能直接推成所有成本下环", "url": "https://www.zhihu.com/pin/2100292304057655980", "votes": 0, "comments": 0, "feed_ts": 1793528973, "feed_time_str": "11-01 18:29", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价有点意思研究所的【八次再造华夏】？", "excerpt": "且不说视频里的历史知识是否是对的 这种先自己定义一个标准和价值观，然后再以此价值观来评判古代历史上的朝代“贡献”大小。 然后以此对古代的朝代扣一个他所认为的抽象性的评价。 这种强行输出私货的视频能不能少来点。 人都是自由的，你的价值观和我的价值观不同，你的评价标准与我的也不同，所以你的结论与我的更不同。 需要拿出来讨论的是这套价值观如何。 想不到这个回答还有人看，我又忍着恶心去看了一遍那个视频，来", "url": "https://www.zhihu.com/question/2099950547260420957/answer/2099977356945395861", "votes": 112, "comments": 14, "feed_ts": 1793528923, "feed_time_str": "11-01 18:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent自己写的新工具，怎么保证没有Bug？PayPal提出无需标准答案的验证方法\n图文版：链接冻结模型扩的是精确问答算子库PayPal AI让冻结的Qwen3.6-35B-A3B在受限领域语言中组合和新增计算功能。内环用已有算子提出问题，两份表达式在验证记录上结果一致才保留；外环针对反复出现的能力缺口生成新算子，经过差分、守恒与结构检查，再核对下游问答。准入过程不使用答案键或裁判模型，但依赖可信基础算子、有限验证数据和模型提出的关系，不是形式证明。138个变体全拒有参照条件测试覆盖14个算子的138个单点错误变体。独立参照下完整门控全部拒绝，只要求能在沙箱执行则接纳129个；把同一错误写进两份实现后，完整门控仍接纳10个。商户验证集为63个合成商户，并有空值、重复键等补充输入。常规两份实现可由同次模型响应生成；单独调用和跨模型家族生成参照的追加测试也得到0/138，但不能保证所有共同错误均被排除。两轮诱导扩大题型，不等于准确率提升内环不增算子，一轮把商户题型从10种增到36种；加入外环，两轮后商户为336种、BookSQL为162种、EHRSQL为248种。数据分别涉及合成商户、账本及脱敏MIMIC-III。增长数的是可回答计算量的种类，不是固定测试集得分。独立答案程序在3,000个留出商户上核对，未截断序列的精确计算类一致，最忙日期或时段的并列取舍仍有差异。对抗构造和语义核查限制零漏检解读另6个刻意构造算子中，独立参照完整门控接纳4个分组结果置换；作者仅将它们视为当前无按键查询接口下不可观察的错误。两份实现同错时还有合并分组漏检，正确算子也有1/14被误拒。三人盲评150道生成题，只有89%的表达式被多数认为忠实回答问题。双实现一致与守恒能提供准入证据，不能代替语义检查；开放新接口或扩到更多轮时，都应重新验证。原文标题：A Self-Improving Agent that Grows its Own DSL: Oracle-Free Operator Induction for Exact Question Answering#无影寺 ", "excerpt": 口袋。3）如果你是在各种网站上得到别人的观点，你必须学习，消化，吸纳 成为自己的，如果你听了就做，那还是别人的。4）低买高卖是本质，问题是摩托罗拉大哥大是会逐渐贬值的，粮食都可以20年不涨，AI星辰大海股一吹就是十年，跌起来可能一次就毙命。你要确认你知道市场哪里有洼地，但更高明白君子不立于危墙之下。5）运用杠杆前，你必须指导杠杆的本质是什么，你必须做好用了杠杆后的最坏打算，你不能只想美事，不想坏事。更关键的是：你不能养成坏习惯而浑然不觉，我之前说过了，开车的坏习惯99次都没事，一次就毙命。6）目标价和时间和仓位管理必须结合起来，否则，即便你看对了方向，你也不一定有时间，有足够的干粮能走到终点。7）过了一个阶段，你就需要拿出纸和笔做一次总结，或者在网络上给自己做一次剖析：哪里做得好，哪里做得差，那些动作必须做，那些动作一定不能做。如果你保持这个习惯，你就会逐步提高。就如我们目前讲的一样。8）如果你有幸认识了一些可以互相学习的朋友，请把握好，金融市场尔虞我诈，通常是互相掏钱背后捅刀子的地方，能把自己的总结在网络上分享出来，或者愿意跟你互相留言互相鼓励的朋友，都值得珍惜。志同道合，有所为有所不为，1+1就有可能大于2.一些小感悟，供大家参阅 斧正。附图中的图片供参考和回忆。", "excerpt": "什么是适合你自己的交易体系？什么是适合你自己的交易体系？慢慢建立并完善一个哪怕是最粗糙的交易系统，对市场上的每一个参与者应该都很重要。1》如果你是一个量化公司的老板：1）拿到更多的市场的交易数据尤其是散户们的筹码分布，2）完善你的交易系统-补上自己上次输钱的漏洞，3）优化你的算法-争取找到更合适更准确的技术指标来提高胜率，4）提升你的系统的反应的速度-你必须赶在同行前面把蛋糕吃掉，5）当然，提升自", "url": "https://www.zhihu.com/pin/2100280976186270588", "votes": 0, "comments": 41, "feed_ts": 1793526537, "feed_time_str": "11-01 17:48", "category": "pin", "cat_name": "想法动态"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "历史上的抗日战争，是否间接性觉醒了中国人民的爱国与团结?", "excerpt": "看到有人提到了回民支队的故事，说几句跑题的。 抗战时期彰显出的团结，和后来所宣扬的团结，在有些内核问题上并不一致。 我老家有一处‘马本斋烈士陵园’，1944年2月，时任冀鲁豫军区第三军分区司令员兼回民支队司令员的马本斋病逝，遗体安葬于朝城县张鲁集。张鲁集是一处回民聚居的村落，村里也有不少回民加入了马本斋麾下投身抗日大业，群众基础比较好，虽然54年马本斋烈士遗体迁葬石家庄华北军区烈士陵园，但墓葬原址", "url": "https://www.zhihu.com/question/1967483937937920267/answer/2099923976386619012", "votes": 1161, "comments": 89, "feed_ts": 1793526225, "feed_time_str": "11-01 17:43", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "江平舟", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "文明灯塔的熄灭，美国中期选举五大怪事", "excerpt": "就在两天后美国中期选举开始，今年的中期选举让人大开眼界，有几个前所未见的突破，可能对美国未来的国家命运造成直接影响。 首先，第一点投入巨资很夸张。 这次中期选举投入的资金让人看不懂，光选举广告这一项投入，就高达116亿美元，约合772亿人民币，这简直是天文数字。 给大家一个直观概念吧，这些年一次春晚，央视的“纯广告”收入大约在4亿左右，而772亿，可以连续买断央视春晚广告193年。 那么和美国自己", "url": "https://zhuanlan.zhihu.com/p/2100280375792644134", "votes": 44, "comments": 6, "feed_ts": 1793526135, "feed_time_str": "11-01 17:42", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor":         + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

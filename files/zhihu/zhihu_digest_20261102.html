zhihu.com/question/1970825188301084423/answer/2100451161392337773", "votes": 19, "comments": 0, "feed_ts": 1793566581, "feed_time_str": "11-02 04:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "都说古代皇权不下县，那么族老能以这是本族事务为由拒绝县官的命令吗？皇权不下县的正确理解是：县以下不设常驻机构，只有派驻机构。县以下有乡，亭，里三级派驻机构，要协助县衙办差；这三级机构由地方乡绅推荐，县令任命，属于纯粹的地方政务，只对县令负责，中央不管。比如晁保正接到县衙命令，近来盗匪猖獗，必须加强治安；县都头雷横带人大半夜抓住睡在庙里的赤发鬼刘唐，送到晁盖的家里吊起来，而不是带往县衙，这就是县衙和派驻机构的关系。睡破庙的人多了去了，为什么刘唐被抓？说明县衙和这些派驻点的领导关系，有的紧，有的松，执行情况大不相同。这些派驻机构的负责人在古代没有工资，帮着朝廷做事，还得自掏腰包，当然不亏；所谓的族老，和县衙必须是合作关系，而这种合作关系本身就是有好处的，通俗的说，没有一个族老的屁股是干净的。所以不可能明着拒绝，私下搞点小动作还差不多。都说古代皇权不下县，那么族老能以这是本族事务为由拒绝县官的命令吗？ #古代官员  #衙门这碗饭（书籍）  #古代官位等级 ", "excerpt": "都说古代皇权不下县，那么族老能以这是本族事务为由拒绝县官的命令吗？皇权不下县的正确理解是：县以下不设常驻机构，只有派驻机构。县以下有乡，亭，里三级派驻机构，要协助县衙办差；这三级机构由地方乡绅推荐，县令任命，属于纯粹的地方政务，只对县令负责，中央不管。比如晁保正接到县衙命令，近来盗匪猖獗，必须加强治安；县都头雷横带人大半夜抓住睡在庙里的赤发鬼刘唐，送到晁盖的家里吊起来，而不是带往县衙，这就是县衙和", "url": "https://www.zhihu.com/pin/2100449022456619159", "votes": 0, "comments": 0, "feed_ts": 1793566135, "feed_time_str": "11-02 04:48", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "都说古代皇权不下县，那么族老能以这是本族事务为由拒绝县官的命令吗？", "excerpt": "皇权不下县的正确理解是:县以下不设常驻机构，只有派驻机构。 派驻机构的单位往往叫做舍，比如亭舍。这就不是正规办公场所，亭长的亭舍其实就是亭长的家。 亭长换人了，亭舍就要跟着变。这和县衙不同，县衙是不会改变的。 县以下有乡，亭，里三级派驻机构，要协助县衙办差。这三级机构由地方乡绅推荐，县令任命，属于纯粹的地方政务，只对县令负责，中央不管。 这些小吏看见从县衙来的刀笔吏，都要叫大人，按照县衙的嘱咐办事", "url": "https://www.zhihu.com/question/1984988571459921169/answer/2100448536248705432", "votes": 12, "comments": 0, "feed_ts": 1793565956, "feed_time_str": "11-02 04:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "克林顿因何原因支持中国加入WTO？", "excerpt": "其实稍微留心就会发现，2001年8月，章家敦这个现在看，大概率是共跳水线子的人，出版了那本罗织了很多中国必然崩溃原因的书。2001年12月，中国加入世贸成功。 中国申请加入世贸，前前后后用了15年，每次都是美国阻挠。 显然只要美国挡在那里，就不可能加入。这个时候不得不说，中国人毕竟还是有一些：反者道之动，弱者道之用的道家思想的。 于是章家敦携那本书出现了。其实进入世贸就是阳谋，但是不代表阳谋里不能", "url": "https://www.zhihu.com/question/2005492379386413306/answer/2100442416973083406", "votes": 147, "comments": 9, "feed_ts": 1793564497, "feed_time_str": "11-02 04:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "80年代人尽皆知，吹的神乎其技的气功，如今怎么再也没人提了？", "excerpt": "这个问题我会 因为我真的练过气功。80 年代期，我经历了一场车祸，让我本来活动就不太方便的腿更严重了一些。西医也是没什么办法，有人就推荐青岛崂山有一个点穴医院，说上过电影，挺有名的 治好了不少瘫痪的病人，就去了。 其实是崂山县医院的一个点穴科，据说点穴科这个创始人曾经给邓爷爷的孙子治过病，所以在高层有一些人脉，上面就给批了经费，盖了一幢很气派的大楼，比整个崂山县医院还要气派。当时的点穴科主任 忘了", "url": "https://www.zhihu.com/question/2050681802050769636/answer/2098437806922249898", "votes": 144, "comments": 81, "feed_ts": 1793560999, "feed_time_str": "11-02 03:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "山月刀岚月刀", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "我看大家说到电车聊的最多的就是电耗，但你们实际开的过程中真的在意电耗吗？", "excerpt": "不好说，看车，也看人。 我家第一台车是秦120，一则弗迪的续航扎实，二则有发动机不担心续航不够。所以基本不关注电耗，就像题主说的，没电就充。反正90%是EV，狭义油耗不到1升，使用成本早就在阈值以下，就算续航没跑满，能多烧几毛钱油啊。 我本人只关注过很小一段时间电耗，之所以关注是想刷app里那个能耗排名，最低刷过6.7度百公里全国86名（现在扛着车跑的神人多了，6.7度排进前一千都够呛）。 车友群", "url": "https://www.zhihu.com/question/1981757942593249525/answer/2100416550612353475", "votes": 1, "comments": 0, "feed_ts": 1793558330, "feed_time_str": "11-02 02:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "LeiWang1999", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "多亏DeepSeek+REA，汉化事业终于重启。再次怀念当初的GKChP汉化组同志。", "excerpt": "多亏DeepSeek+REA，汉化事业终于重启。再次怀念当初的GKChP汉化组同志。", "url": "https://www.zhihu.com/pin/2099885312591803382", "votes": 0, "comments": 8, "feed_ts": 1793557811, "feed_time_str": "11-02 02:30", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《三体》中叶文洁为什么会做出向宇宙发出信号的决定？", "excerpt": "叶文洁还是太保守了，还得是广大网友。 这么看知乎上至少有2k人要按爆这个按钮，甚至还有几十万人赞同、1kw人曾经关注过这个想法… 这里面有被996干烂的公司狗： 公司狗2: 有慈禧太后： 有等不及了的暴躁老哥： 有经典苏联笑话： 苏联笑话2: 苏联笑话3: 苏联笑话4: 苏联笑话5: 苏联笑话6: 有诗人： 有哲学家： 有日漫爱好者： 还有老实人： 我看大家都在渴望三体人的到来。 ————————", "url": "https://www.zhihu.com/question/2098786492550272323/answer/2099566994215510021", "votes": 3425, "comments": 218, "feed_ts": 1793556351, "feed_time_str": "11-02 02:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么在淡水河流湖泊中没有章鱼鱿鱼这类动物？", "excerpt": "这是因为章鱼、鱿鱼这些头足类动物的呼吸和循环系统完全是为海水环境而设定的，一旦进入淡水河湖，它们会面临生理崩溃。 题主说到的章鱼、鱿鱼都属于头足动物。头足动物是软体动物门下的一个纲，因足部特化为腕和漏斗、环绕头部而得名。“头足”就是指足长在头上。其他软体动物（如蜗牛）的足在腹面用于爬行，而头足类的足部环绕口部、特化为腕，同时承担捕食、运动和交配等功能，这是该类群最显著的形态标志。 除了章鱼、鱿鱼，", "url": "https://www.zhihu.com/question/6033159890/answer/2099968558881059056", "votes": 236, "comments": 48, "feed_ts": 1793555964, "feed_time_str": "11-02 01:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "实话实说，韩国吃得起肉吗？", "excerpt": "一份猪肉汤饭是9000r，折合人民币45 一顿自助碳烤烤肉，猪肉牛肉无限吃，是25000r，人民币125左右。 当地人时薪是80-100人民币一小时，超市雪花牛肉价格是12000一斤，一天薪水可以买8-9斤牛肉。 我只称述事实，至于吃不吃的起，各位评价就好了。 大部分人在点进这个回答前其实心里都已经有答案了，只是想看见意见不同的人并和他争论而已 ", "url": "https://www.zhihu.com/question/1180020203/answer/2034582614967850241", "votes": 767, "comments": 409, "feed_ts": 1793555117, "feed_time_str": "11-02 01:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "88年物价闯关，百姓哄抢商品是何引起的？购买力从何而来？", "excerpt": "1988年7月28日一大早，北京、上海、广州的国营烟酒专柜同时换上了新价签。 在此之前，国务院发了通知，决定放开茅台、五粮液、中华烟等13种名烟名酒的价格，不再执行国家统一定价，改由市场调节。 7月28日是新规落地的第一天。 前一天还在国营柜台里标价20多元一瓶的茅台酒，那天早上的零售价直接跳到了120元到180元，广州部分商店里甚至挂出了200元以上的价码，而一条中华烟从十几元涨到了七八十元。 ", "url": "https://www.zhihu.com/question/34010651/answer/2094773625408770312", "votes": 394, "comments": 57, "feed_ts": 1793554829, "feed_time_str": "11-02 01:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Super-agent提速：用模拟任务测调度DeepSeek Harness团队的Super-agent架构探索里，从工作请求到结果消息的完成时间中位数是12.4分钟。但实验用计时工具代替编码，消息间隔和工作时长缩至原来的1/4，模型调用耗时保持真实。这测的是多任务调度与协作，不能读成真实仓库12.4分钟写完代码，也不能简单乘四换算。把分派与执行分开，减少任务互相打断路由层（Router）只负责分派任务和统一回复用户，不亲自执行。执行会话（Worker）在隔离上下文中专注处理单项任务，推理与工具调用留在内部。同一话题的后续事件可由程序直达已订阅的执行会话，省掉路由层反复转发。这种分工把“主会话是否亲自做”从临场选择变成结构约束。否则，即使给了子agent工具，模型仍可能把所有工作留给自己，一边执行、一边被新消息打断。优先委派的提示，仍留下了长尾四种方案各运行5次，每轮约300条消息，其中约20条是工作请求。单会话采用中性提示时，5次都没有调用子agent；改成优先委派后，5次中有4次进行了委派，另一次仍判断任务很小而自行执行。完整Super-agent的完成时间95分位（p95）为15.7分钟；两种单会话设置分别为29.5和29.0分钟。优先委派提高了实际委派的比例，却没消除自行执行造成的长尾。这些结果是合成负载的初步参考，不是实测编码效率。直通省路由开销，多会话仍有token代价去掉订阅直通后，完成时间基本不变，路由层参与判断的次数却增加约30%，每轮全部会话的缓存读取token从2323万升至3177万，约多37%。直通在这组负载中主要减少转发与推理开销，没有带来可辨的完成时间改善。两种单会话设置只用了约610万和1080万缓存读取token。分层并发在这组测试中让任务更早完成，却消耗更多这类token，不能据此宣称总费用更低。公开原型只覆盖一个仓库，和内部实例不同dsh-superagent-prototype是研究原型，并非正式产品。README说明它为公开发表做过调整，与内部版本、文章描述都不完全相同；目前面向一个GitHub仓库，可选接入飞书，只在获准用户提出请求或团队规则允许时行动。文中跨聊天与GitHub主动推进、修复问题的是内部实例。公开原型不能默认具备同样功能，安全与隐私也仍是开放问题。准备试用原型，还需用真实任务核对耗时、token开销、权限和凭据处理。", "excerpt": "Super-agent提速：用模拟任务测调度DeepSeek Harness团队的Super-agent架构探索里，从工作请求到结果消息的完成时间中位数是12.4分钟。但实验用计时工具代替编码，消息间隔和工作时长缩至原来的1/4，模型调用耗时保持真实。这测的是多任务调度与协作，不能读成真实仓库12.4分钟写完代码，也不能简单乘四换算。把分派与执行分开，减少任务互相打断路由层（Router）只负责分", "url": "https://www.zhihu.com/pin/2100390672700270129", "votes": 0, "comments": 0, "feed_ts": 1793552730, "feed_time_str": "11-02 01:05", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么越是户外老驴，玩到最后越“谨慎”“胆子”也越来越小了？", "excerpt": "这和极限运动不一样，玩户外的人很多不仅有家有业，更多真怕死但又闲不住的矛盾个体。他们往往是生活有点憋得慌，有钱有闲时来透透气，用专业和装备抵消风险购买一种感觉。身边同行死得多了，冒险热情消退的厉害。 真要是找刺激那群人，是完全另一个生态了。比如人家玩极限运动的人，早就接受了隔三差五死一个同行朋友的事实。连搞的对象都是那种知道你迟早要死的类型。正式组成家庭特别难，逼着你退役的力量很大，多巴胺分泌路…", "url": "https://www.zhihu.com/question/1992199351250999115/answer/2100227799508316195", "votes": 23, "comments": 0, "feed_ts": 1793549763, "feed_time_str": "11-02 00:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "自由派如何看待个人崇拜现象？", "excerpt": "过去130多年，全球质量计量的终极基准是国际千克原器： 一枚保存在巴黎、密封于多层玻璃罩中的铂铱合金圆柱，人称“大K”。 它的致命缺陷在于作为实物，自身质量并不稳定。 即便被多层玻璃罩保护，“大K”的质量仍会因清洗、表面吸附等原因发生漂移。 后来与官方副本比对后发现，它已“丢失”了约50微克的质量。 像是大K这样的实物标准，总会面临一个叫“唯一性悖论”的东西： 作为“绝对标准”，“大K”本身却无法", "url": "https://www.zhihu.com/question/658746832/answer/2098035116387975189", "votes": 2426, "comments": 67, "feed_ts": 1793549429, "feed_time_str": "11-02 00:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "世界最正宗的俄餐是在哈尔滨吗?", "excerpt": "是真的，俄罗斯一直有厨师到哈尔滨来进修俄餐。 怎么会有这么奇怪的事？ 先说几个容易混淆的事情: 正宗≠好吃，正宗的满汉全席，里面没几个菜现在有人还喜欢正宗的俄餐在哈尔滨≠哈尔滨的俄餐馆都正宗，好不好吃参见上一条。正宗的俄餐指的是沙皇宫廷菜，不是正宗的现代俄餐。接下来说说为啥会这样。 哈尔滨是因中东铁路兴起的城市，城市设计师就是俄国人，目标是吧哈尔滨打造成黄俄罗斯最大的城市。 当时由于排犹，十月革命", "url": "https://www.zhihu.com/question/534140871/answer/2095233920551986328", "votes": 1673, "comments": 295, "feed_ts": 1793549349, "feed_time_str": "11-02 00:09", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "PKK投降闹剧最新一幕：奥贾兰留监就业原本库尔德工人党（PKK）的投降大业在奥贾兰的一再“谆谆教导”、“自我牺牲”之下已颇有眉目。其国内分支平民党（DEM）与埃尔多安当局达成协议，并在国会通过了法案，答应给所有回国的PKK干部战士判缓刑（“重刑犯”除外），以此换取PKK投降。针对此前PKK一直坚持的释放奥贾兰议题，奥贾兰也一再呼吁称自己愿意继续坐牢。不过这个要求毕竟还是过于苛刻了，对于PKK高干也没什么好处，在基层反弹就更大了。结果PKK广大干部战士仍不愿放下武器，不仅继续要求释放奥贾兰、让奥贾兰亲自“监督和平进程”，还提出了要求土耳其当局修改各种法律、保障库尔德人权利等要求。面对这种情况，土耳其当局一方面勾连德黑兰当局、巴格达当局对PKK联合施加更大的政治军事压力，一方面则想出了新的奇思妙想。近日，针对释放奥贾兰（其实无论是土耳其当局还是PKK现高干当然都不愿意奥贾兰真的出狱）一事，土耳其当局宣布了新的方案：奥贾兰将会离开牢房，但并不离开目前所在的与世隔绝的岛上监狱，而是移住监狱办公区，一面接受“就地软禁”，一面在PKK投降进程监督委员会就职、办理该委员会的公务！如此，奥贾兰便“就地管制”、“留监就业”了。如此朝三暮四的伎俩，真可以说土耳其当局一大杰出发明，堪称世界投降史上一出精彩的闹剧！", "excerpt": "PKK投降闹剧最新一幕：奥贾兰留监就业原本库尔德工人党（PKK）的投降大业在奥贾兰的一再“谆谆教导”、“自我牺牲”之下已颇有眉目。其国内分支平民党（DEM）与埃尔多安当局达成协议，并在国会通过了法案，答应给所有回国的PKK干部战士判缓刑（“重刑犯”除外），以此换取PKK投降。针对此前PKK一直坚持的释放奥贾兰议题，奥贾兰也一再呼吁称自己愿意继续坐牢。不过这个要求毕竟还是过于苛刻了，对于PKK高干也", "url": "https://www.zhihu.com/pin/2100356304447469553", "votes": 0, "comments": 3, "feed_ts": 1793549303, "feed_time_str": "11-02 00:08", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "alex01预测准吗？", "exce ANSWER", "verb_cn": "赞了回答", "title": "奥特曼称 OpenAI 内部新模型让他兴奋到两晚没睡，这意味着什么？", "excerpt": "可能意味着越来越拉了： 记不太清，因为奥特曼对它的模型描述，我印象中有这么几个节点—— 最早是颠覆文明； 后来就是大家都知道的，犹如原子弹爆炸，瘫坐眩晕； 现在就两天没睡觉。 我们都知道，一般失眠是因为焦虑引起的，那如果模型很强的话，怎么会焦虑呢？ 看来是不太行的。 所以说，吹牛这件事情还是得挤牙膏，你不能一开始把调子起的太高了，后来你就不容易找到更适合或者是更猛的形容词了，因为大家的阈值已经达到", "url": "https://www.zhihu.com/question/2099437165495300675/answer/2100231694116712646", "votes": 249, "comments": 30, "feed_ts": 1793530617, "feed_time_str": "11-01 18:56", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "人民锐评发文驳斥「中国 AI 跑偏论」，如何看待中美在 AI 落地路径上的差异？", "excerpt": "当初显卡也是为了玩，知乎群贤说你看中国搞什么游戏机禁令，错失显卡发展现在中国用 AI 玩了，又是中国不对了？", "url": "https://www.zhihu.com/question/2099418216976102291/answer/2099659141195290572", "votes": 449, "comments": 38, "feed_ts": 1793530330, "feed_time_str": "11-01 18:52", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "大模型强化学习是在学新能力，还是释放已有能力？图文版：链接Qwen3 的模式开关让涨分解释多了一步Qwen3 的 think 与 no-think 模式共享权重，no-think 模板预先填入空思考区块，再让模型作答。这项研究用组相对策略优化（GRPO）在数学数据上训练三个尺寸的 Qwen3，考察涨分是否来自原有推理行为被重新调用。AIME 2022–2024 共90题、每题采样两次、每条最多32,768个 token 的评测中，8B 准确率从17%升至43%，平均输出从2.7k增至7.2k token；模式名称并不保证输出简短。每层8维激活替换，消除75%的增益在8B第67步检查点上，实验比较原模型在两种模式下读取相同文本时的激活差，用128条训练提示构造每层8维 think 相关子空间，生成时替换第1至35层的相应激活分量。此次独立采样中，原模型准确率为18.9%，训练后为41.1%，换回原模型分量后降至24.4%，消除了22.2个百分点增益中的约75%。同维度主成分分析对照只消除22%。这些结果支持模式相关状态承载了大量增益，不能解读为直接量出了新知识的比例。权重更新放大后，输出开销也随之上升不再训练、只把第67步权重更新放大3倍，no-think 准确率达到72.2%，接近原模型 think 模式约74%的参考成绩。约51%的回答自行生成结束思考标记，平均输出达到19.2k token，仅82%在32k上限内结束。缩放系数是在同一批90题上探索的，峰值没有独立留出测试；这是一项行为探针，不能据此宣布获得了低成本新模型，也不能把原模型基线当成无法突破的能力上限。no-think 评测应把模式调用与新能力分开新建低秩适配（LoRA）模块上的一步 GRPO 梯度探针向 think 状态移动，但未证明完整训练过程的机制。激活替换的75%来自一个8B检查点，每题仅两次采样，替换后仍有增益留下。结果提示，判断这类训练是否获得新解法，需要同时比较原模型 think 基线、实际输出长度与模式相关干预；不能仅凭 no-think 涨分，就把已有推理行为更容易被调用当作新能力。原文标题：The Thinking Leakage in Reinforcement Learning for LLMs#无影寺 ", "excerpt": "大模型强化学习是在学新能力，还是释放已有能力？图文版：链接Qwen3 的模式开关让涨分解释多了一步Qwen3 的 think 与 no-think 模式共享权重，no-think 模板预先填入空思考区块，再让模型作答。这项研究用组相对策略优化（GRPO）在数学数据上训练三个尺寸的 Qwen3，考察涨分是否来自原有推理行为被重新调用。AIME 2022–2024 共90题、每题采样两次、每条最多32", "url": "https://www.zhihu.com/pin/2100296070580458714", "votes": 0, "comments": 0, "feed_ts": 1793529728, "feed_time_str": "11-01 18:42", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "AI自己改进科研假设，为什么越改越不重要？DiscoveryRSI发现新问题图文版：链接DiscoveryRSI用修改记录改模型与流程DiscoveryRSI研究怎样把科研假设改成可检验的调查方案，再从修订过程学习。假设须包含有证据依据的主张、可行调查、判定标准和替代解释。多个agent保留版本与证据，组成研究树；一条更新分支按研究贡献分配训练权重，另一条固定模型权重、诊断失败并测试流程修改。通过检查的更新再用于新问题，因此跨轮结果包含模型与流程的共同变化。两轮自动分上涨，重要性与新颖性下降四个生命科学领域、241个问题由GPT-5.6 Sol自动评估，八维加权质量分采用1—10分量表，均分从4.86经5.18升到5.39。可证伪性从4.00升到6.20，但重要性从6.48降到6.04，新颖性从4.87降到4.58。改善主要来自检验设计，不能据此认定研究问题更重要。不同自动评审提示仍来自同一模型家族，不能视为独立专家共识。292份提案的人工评估呈现混合结果27名具生物医学或临床研究背景的参与者在3名资深监督者指导下，对隐藏模型身份、随机排序的提案评分。六项质量中，DiscoveryRSI-27B较GPT-6 Luna两项更高、一项持平、三项更低；它在被评估研究树内的每次修订平均增加0.07分，但仍有47%的修订不变、12%退步。修订进展较好，不等于提案整体质量全面领先。6.3%文献对应尚不代表科学验证1,176个假设版本中，74个与指定时间边界之后文献的设计、对照、测量或证据缺口对应。这个6.3%是回溯指标，不证明文献作者采用过假设；版本可能重复属于同一研究家族，各模型的领域组成、时间代理和检索覆盖也不同。Claude通过检索门的比例更低，但通过后获得肯定判断的比例与DiscoveryRSI接近。研究当前推进到假设和编译后的调查计划，执行与湿实验仍待完成，使用者仍须逐项检查科学价值与可验证性。原文标题：DiscoveryRSI: Recursively Learning to Discover Valuable Hypotheses#无影寺 ", "excerpt": "AI自己改进科研假设，为什么越改越不重要？DiscoveryRSI发现新问题图文版：链接DiscoveryRSI用修改记录改模型与流程DiscoveryRSI研究怎样把科研假设改成可检验的调查方案，再从修订过程学习。假设须包含有证据依据的主张、可行调查、判定标准和替代解释。多个agent保留版本与证据，组成研究树；一条更新分支按研究贡献分配训练权重，另一条固定模型权重、诊断失败并测试流程修改。通过", "url": "https://www.zhihu.com/pin/2100295548028953631", "votes": 0, "comments": 0, "feed_ts": 1793529594, "feed_time_str": "11-01 18:39", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价复旦教授葛剑雄学生侯杨方认为老百姓根本不在乎反清复明的观点？", "excerpt": "这就是个政治问题，他们必须证明五千年来小推车只推过（）。", "url": "https://www.zhihu.com/question/2028081065143609078/answer/2088274008580023667", "votes": 205, "comments": 0, "feed_ts": 1793529522, "feed_time_str": "11-01 18:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Google DeepMind让Gemini给图灵机“快进”：11台机器的加速规则通过数学证明图文版：链接11个BB(6)机器得到的是运行归约Google DeepMind用Gemini为11个六状态、双符号图灵机发现了紧凑的运行规则，并用Lean完成形式化验证。BB(6)研究这类机器从空白纸带出发，最终停机前最多运行多少步。这次证明把各机器的停机问题等价转成算术系统能否到达停机格局；等价关系成立，不代表已经证明会停机或永远不停，BB(6)的值仍未确定。Collatz型加速压缩执行，100%拟合只是筛选系统把重复纸带片段表示为符号块及其长度，用按余数条件分支的整数更新概括许多步执行。主流程使用Gemini 3.1 Pro，每个机器先模拟500万步，提取常见模式，再猜想规则。规则须完全符合经验与补充转移样本，之后仍要经过非正式证明和Lean 4.28.1验证。有限样本可能漏掉罕见边界，预测全对不能替代证明；形式化成功要求没有未证明目标或未经授权的公理。11个新分析与15个再发现须分开2026年8月，BB(6)有1,094个停机状态未知的holdout；流水线提出50个候选，报告11个新分析及14个再发现，加上另一领域的1个再发现，共15个已有社区研究的机器得到新的加速或形式化证明。第二阶段采用Gemini 3.8 Flash，表中星号用于标记该阶段结果；双剑号只标记未经手工检查的部分再发现，不能把两种标记混为一谈。Cryptid分类待接受，停机仍是数学问题作者把11个新分析暂列为Cryptid，指运行有精确、紧凑的数学描述，但停机仍未知。论文采用的定义比社区惯例更宽，社区还看对应问题是否确实开放且困难，分类仍待接受。接受这一名称不会自动解决停机问题。当前流水线限于Collatz型结构；理解这项进展，应关注它新增了哪些经过验证的描述与证明，而不能把候选或新分类数量当成停机问题的解决数量。原文标题：At the Limits of Computability: Steps Towards Autonomous AI Discovery on the Busy Beaver Frontier#无影寺 ", "excerpt": "Google DeepMind让Gemini给图灵机“快进”：11台机器的加速规则通过数学证明图文版：链接11个BB(6)机器得到的是运行归约Google DeepMind用Gemini为11个六状态、双符号图灵机发现了紧凑的运行规则，并用Lean完成形式化验证。BB(6)研究这类机器从空白纸带出发，最终停机前最多运行多少步。这次证明把各机器的停机问题等价转成算术系统能否到达停机格局；等价关系成立", "url": "https://www.zhihu.com/pin/2100294329931768527", "votes": 0, "comments": 0, "feed_ts": 1793529469, "feed_time_str": "11-01 18:37", "category": "pin", "cat_name": "想法动态"}, {"actor": "hades", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "S16 瑞士轮 BLG 2:0 淘汰 HLE 拿下最后一张淘汰赛门票，如何评价这场比赛？", "excerpt": "blg牛逼！ 今天不谈游戏内容，就谈心态这个东西。其实blg整个队伍的心态一直有问题，他们和tes对应两个极端。 tes心态的问题是畏惧强敌，一旦被突破就一泻千里，到后面完全大失水准，连弱队都打不过。问题一是他们队员本身就缺乏面对背水一战的勇气，二是他们队伍里面好人太多了，有问题大家最多就抿嘴不讲话，很难直接爆了说清楚，三是他们抗压能力真不行，所以他们面对强敌高压的环境就很容易崩溃，而且是越打越崩", "url": "https://www.zhihu.com/question/2100108531160687738/answer/2100295366612668419", "votes": 54, "comments": 13, "feed_ts": 1793529437, "feed_time_str": "11-01 18:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价有点意思研究所的【八次再造华夏】？", "excerpt": "在有些人眼里，大规模奴隶贸易，满城，婚姻隔绝的种姓制度，撒向全国的绿营兵，天马行空株连九族的文字狱，人头滚滚的剃发易服， 这些才是“再造华夏”。 ", "url": "https://www.zhihu.com/question/2099950547260420957/answer/2100222372011828084", "votes": 382, "comments": 37, "feed_ts": 1793529206, "feed_time_str": "11-01 18:33", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent任务失败了，前面的正确操作也该得分？Apple提出新的强化学习方法图文版：链接LVRL用冻结模型重分步骤反馈，训练的是Qwen3策略Apple让Claude Opus 4.6回看完整轨迹，并参考同组轨迹摘要、成功率和结局，给内部状态估值。首尾锚定组成功率与真实奖励，相邻价值差形成步骤优势，再更新策略。未归一化优势总和等于最终奖励减组均值；全组失败时总和为零，内部仍可有正负信号。该估计已知后续与结局，不是在线真实成功概率。75%只属于改版BabyAI分布内，OOD延长跨门距离六房间Pickup任务只给文字局部视野，128步内取物算成功。训练及分布内测试跨1—3道门，分布外跨4—5道门，其他接口与规则相同。Qwen3-8B的LVRL成功率为75.0%和65.5%，GRPO为2.7%和0.0%。AppWorld与BabyAI报告三个训练种子的均值及标准差；SWE只训一个种子，三次评测不等于三次独立训练，结果不能泛化为任意导航任务。AppWorld增益依赖评估模型，校准消融未拆分归因4B的AppWorld成功率24.3%，比GRPO高13.6个百分点，比更强的PPO高9.5点；32B的SWE-bench Verified为30.9%，比PPO高6.0点。4B评估模型换成Qwen3-235B后仅9.8%，GLM-5.2为22.3%。8B移除校准从26.3%降到22.1%，但同时去掉同组上下文与首尾锚点，不能单独归因给其中一项。早期方向一致率44%，冻结评估仍有额外推理开销蒙特卡洛核验对每个状态采样32次后续执行；76次明显恶化和38次恢复中，预测方向分别有72%、66%一致，轨迹早期仅44%。价值查询每条约9000—20000输入token、600—1900输出token。BabyAI每条约0.107美元是按论文日志代理计数及标价推算，未计开销相近的摘要调用。采用仍需验证早期反馈、训练稳定性、吞吐与总成本，不能把不训练价值网络当作免费监督。原文标题：LLM Value Functions for Credit Assignment in Agentic RL#无影寺 ", "excerpt": "Agent任务失败了，前面的正确操作也该得分？Apple提出新的强化学习方法图文版：链接LVRL用冻结模型重分步骤反馈，训练的是Qwen3策略Apple让Claude Opus 4.6回看完整轨迹，并参考同组轨迹摘要、成功率和结局，给内部状态估值。首尾锚定组成功率与真实奖励，相邻价值差形成步骤优势，再更新策略。未归一化优势总和等于最终奖励减组均值；全组失败时总和为零，内部仍可有正负信号。该估计已知", "url": "https://www.zhihu.com/pin/2100293562390914430", "votes": 0, "comments": 0, "feed_ts": 1793529118, "feed_time_str": "11-01 18:31", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价“汉人没有尚武精神，且屡次被北方胡人征服”这样错误的观点？", "excerpt": "经典内亚本位史观了 属于是把汉人当成达罗毗荼人讲了 不过倒也没错，毕竟内亚的马匪集团，确实有着非常强的种姓化倾向 他们看待世界的视角确实就是这样的 “自己赢了一次=自己永远赢” 也正因如此，他们才会刻意无视，或者说“不提及”每次汉人全面失败之后，都是靠自己打回来，推翻内亚胡人的奴役的 毕竟，如果谈这个的话，那么他们的内亚赢学根基就被击破了 隋朝的建立，就是建立在杨坚清洗那些不愿意接受变成汉人的鲜卑", "url": "https://www.zhihu.com/question/2084947686504059844/answer/2088442980902487903", "votes": 1368, "comments": 138, "feed_ts": 1793528985, "feed_time_str": "11-01 18:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent强化学习有了数据缩放规律：环境、任务、轨迹三类数据该怎么分配？图文版：链接Qwen3-8B同训练算力，配比改变成功率一项agent强化学习研究比较两次Qwen3-8B GRPO训练：交互采样token总量和梯度计算量相同，环境偏重方案在四项留出评估上比轨迹偏重平均高13.6个百分点。这是环境、任务、轨迹及奖励控制的整套配比对照，不能把全部增益单独归因于环境数量，也不能直接推成所有成本下环境最划算。新世界收益更高，结构与任务接近论文把数据拆成环境、任务和轨迹，后者指每个已覆盖任务—环境组合的平均采样数。环境还分为不同代码库、应用或网站等“世界”，以及已有世界内的工具、状态或验证方式变化。Qwen3-8B数学加代码设置的三轴指数为0.41、0.26、0.11，只代表损失下降趋势，且环境指数仅计结构变化。在可分离世界轴的设置中，新世界指数较高，结构与任务接近；结构合成单价却约为任务的23倍，所以已有世界池内合成任务可能更划算。合成阈值9.4、3.4、1.4有方法范围以AWM环境生成、AutoPlay任务生成、SWiRL轨迹生成作为代表，合成与真实数量之比达到约9.4、3.4、1.4时，拟合成功率在峰值后降到纯真实基线的95%。这是指定方法和评测下的阈值，不是通用安全配比。作者将差异与解释器、奖励验证等外部约束联系起来，实际选型仍需测量质量和完整成本。14B验证51.3%，采购顺序仍需重算用4B和8B较小预算拟合后，论文预测14B、32倍基准计算量的成功率为51.7%，实测51.3%；同预算轨迹偏重方案为42.9%。配方中的30条轨迹是每任务—环境组合的平均值，500个环境单位也不等于500种独立结构。SWE成本下环境与任务的配方指数已无法区分，前沿模型规模尚未验证。使用者应先诊断泛化覆盖缺口，再按自己的成本和留出评估分配预算，而非一律先买环境。原文标题：How Data Scales in Agentic Reinforcement Learning: Laws and Synthesis Strategies#无影寺 ", "excerpt": "Agent强化学习有了数据缩放规律：环境、任务、轨迹三类数据该怎么分配？图文版：链接Qwen3-8B同训练算力，配比改变成功率一项agent强化学习研究比较两次Qwen3-8B GRPO训练：交互采样token总量和梯度计算量相同，环境偏重方案在四项留出评估上比轨迹偏重平均高13.6个百分点。这是环境、任务、轨迹及奖励控制的整套配比对照，不能把全部增益单独归因于环境数量，也不能直接推成所有成本下环", "url": "https://www.zhihu.com/pin/2100292304057655980", "votes": 0, "comments": 0, "feed_ts": 1793528973, "feed_time_str": "11-01 18:29", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价有点意思研究所的【八次再造华夏】？", "excerpt": "且不说视频里的历史知识是否是对的 这种先自己定义一个标准和价值观，然后再以此价值观来评判古代历史上的朝代“贡献”大小。 然后以此对古代的朝代扣一个他所认为的抽象性的评价。 这种强行输出私货的视频能不能少来点。 人都是自由的，你的价值观和我的价值观不同，你的评价标准与我的也不同，所以你的结论与我的更不同。 需要拿出来讨论的是这套价值观如何。 想不到这个回答还有人看，我又忍着恶心去看了一遍那个视频，来", "url": "https://www.zhihu.com/question/2099950547260420957/answer/2099977356945395861", "votes": 121, "comments": 14, "feed_ts": 1793528923, "feed_time_str": "11-01 18:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent自己写的新工具，怎么保证没有Bug？PayPal提出无需标准答案的验证方法\n图文版：链接冻结模型扩的是精确问答算子库PayPal AI让冻结的Qwen3.6-35B-A3B在受限领域语言中组合和新增计算功能。内环用已有算子提出问题，两份表达式在验证记录上结果一致才保留；外环针对反复出现的能力缺口生成新算子，经过差分、守恒与结构检查，再核对下游问答。准入过程不使用答案键或裁判模型，但依赖可信基础算子、有限验证数据和模型提出的关系，不是形式证明。138个变体全拒有参照条件测试覆盖14个算子的138个单点错误变体。独立参照下完整门控全部拒绝，只要求能在沙箱执行则接纳129个；把同一错误写进两份实现后，完整门控仍接纳10个。商户验证集为63个合成商户，并有空值、重复键等补充输入。常规两份实现可由同次模型响应生成；单独调用和跨模型家族生成参照的追加测试也得到0/138，但不能保证所有共同错误均被排除。两轮诱导扩大题型，不等于准确率提升内环不增算子，一轮把商户题型从10种增到36种；加入外环，两轮后商户为336种、BookSQL为162种、EHRSQL为248种。数据分别涉及合成商户、账本及脱敏MIMIC-III。增长数的是可回答计算量的种类，不是固定测试集得分。独立答案程序在3,000个留出商户上核对，未截断序列的精确计算类一致，最忙日期或时段的并列取舍仍有差异。对抗构造和语义核查限制零漏检解读另6个刻意构造算子中，独立参照完整门控接纳4个分组结果置换；作者仅将它们视为当前无按键查询接口下不可观察的错误。两份实现同错时还有合并分组漏检，正确算子也有1/14被误拒。三人盲评150道生成题，只有89%的表达式被多数认为忠实回答问题。双实现一致与守恒能提供准入证据，不能代替语义检查；开放新接口或扩到更多轮时，都应重新验证。原文标题：A Self-Improving Agent that Grows its Own DSL: Oracle-Free Operator Induction for Exact Question Answering#无影寺 ", "excerpt": "Agent自己写的新工具，怎么保证没有Bug？PayPal提出无需标准答案的验证方法\n图文版：链接冻结模型扩的是精确问答算子库PayPal AI让冻结的Qwen3.6-35B-A3B在受限领域语言中组合和新增计算功能。内环用已有算子提出问题，两份表达式在验证记录上结果一致才保留；外环针对反复出现的能力缺口生成新算子，经过差分、守恒与结构检查，再核对下游问答。准入过程不使用答案键或裁判模型，但依赖可", "url": "https://www.zhihu.com/pin/2100291700057023133", "votes": 0, "comments": 0, "feed_ts": 1793528685, "feed_time_str": "11-01 18:24", "category": "pin", "cat_name": "想法动态"}, {"actor": "alex01", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价知乎投资答主“Alex01”等一众投资答主？", "excerpt": "我是一个老粉，感谢知乎让我年前刷到alex01的文章，是我想看的文章，所以年初果断订阅，他有很多免费文章其实也够用，我订阅也是对文章的支持，希望作者持续写下去。 我对他一开始的评价是有自己的逻辑，知识架构体系，至今未变。而我注重的是逻辑分析能力，所以至今我依然在读他的文章。 最后只有自己看到的，学到的，悟到的才是自己的。 ", "url": "https://www.zhihu.com/question/2049179860682257932/answer/2100161953708651896", "votes": 10, "comments": 0, "feed_ts": 1793528058, "feed_time_str": "11-01 18:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "奥特曼称 OpenAI 内部新模型让他兴奋到两晚没睡，这意味着什么？", "excerpt": "意味着拉中之拉。 因为这次的描述只是两晚没睡。 上一次可是犹如看到原子弹爆炸瘫坐在椅子上眩晕过去。 再上一次是担心人类要被灭亡。 从这个角度看，奥特曼又一次拯救了人类。 恰！ ", "url": "https://www.zhihu.com/question/2099437165495300675/answer/2100284556662280567", "votes": 1621, "comments": 34, "feed_ts": 1793526860, "feed_time_str": "11-01 17:54", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "alex01", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "什么是适合你自己的交易体系？什么是适合你自己的交易体系？慢慢建立并完善一个哪怕是最粗糙的交易系统，对市场上的每一个参与者应该都很重要。1》如果你是一个量化公司的老板：1）拿到更多的市场的交易数据尤其是散户们的筹码分布，2）完善你的交易系统-补上自己上次输钱的漏洞，3）优化你的算法-争取找到更合适更准确的技术指标来提高胜率，4）提升你的系统的反应的速度-你必须赶在同行前面把蛋糕吃掉，5）当然，提升自己的容量，钱越多，地板被砸的坑就越大。6）预警警示系统-指标当然很多很多，但除非资金吃紧，天天在场子里需要这个？那么，你的这套“进出体系”就是你赖以维生的交易系统。2》如果你是一个机构的交易员：1）了解上面的意向是头号大事，放大水的时候你必须提前在场。2）和公司的老板们密切配合。3）和市场的各色主力们要保持良好的秘密沟通和竞争关系。4）产业面当然也要研究.5）技术面当然也要研究一些些...6）预警警示系统，除了很厉害的私募，基金经理们谁在乎这个？10个指标红了9个，能撤下来多少资金？那么，你所生活的这个“窝”就是你赖以维生的交易系统。3》如果你是一个散户：1）你必须了解你自己。2）你必须学习这个金融市场如何运行，金融市场为什么会存在。赚钱了，你必须知道你为什么能赚钱，为什么银行利息这么低，而你一天就能赚到几年的银行利息。但亏钱了，你也尽量要了解一下，你的钱都是进了谁的口袋。3）如果你是在各种网站上得到别人的观点，你必须学习，消化，吸纳 成为自己的，如果你听了就做，那还是别人的。4）低买高卖是本质，问题是摩托罗拉大哥大是会逐渐贬值的，粮食都可以20年不涨，AI星辰大海股一吹就是十年，跌起来可能一次就毙命。你要确认你知道市场哪里有洼地，但更高明白君子不立于危墙之下。5）运用杠杆前，你必须指导杠杆的本质是什么，你必须做好用了杠杆后的最坏打算，你不能只想美事，不想坏事。更关键的是：你不能养成坏习惯而浑然不觉，我之前说过了，开车的坏习惯99次都没事，一次就毙命。6）目标价和时间和仓位管理必须结合起来，否则，即便你看对了方向，你也不一定有时间，有足够的干粮能走到终点。7）过了一个阶段，你就需要拿出纸和笔做一次总结，或者在网络上给自己做一次剖析：哪里做得好，哪里做得差，那些动作必须做，那些动作一定不能做。如果你保持这个习惯，你就会逐步提高。就如我们目前讲的一样。8）如果你有幸认识了一些可以互相学习的朋友，请把握好，金融市场尔虞我诈，通常是互相掏钱背后捅刀子的地方，能把自己的总结在网络上分享出来，或者愿意跟你互相留言互相鼓励的朋友，都值得珍惜。志同道合，有所为有所不为，1+1就有可能大于2.一些小感悟，供大家参阅 斧正。附图中的图片供参考和回忆。", "excerpt": "什么是适合你自己的交易体系？什么是适合你自己的交易体系？慢慢建立并完善一个哪怕是最粗糙的交易系统，对市场上的每一个参与者应该都很重要。1》如果你是一个量化公司的老板：1）拿到更多的市场的交易数据尤其是散户们的筹码分布，2）完善你的交易系统-补上自己上次输钱的漏洞，3）优化你的算法-争取找到更合适更准确的技术指标来提高胜率，4）提升你的系统的反应的 function esc(s) {

}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];

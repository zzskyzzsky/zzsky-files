ilcoxon 过线，但配对 t 检验不过、中位区间跨零。MMLU Social Sciences 不显著。ARC-Challenge 中位差为负，影响定向掉的分甚至略少于同主题随机。整条管线大约消耗三万七千个 H200 等效 GPU-hour。GitHub 仓库已公开，审计代码、抽样清单、576×4 矩阵和遗忘 checkpoint 要等 camera-ready，文档层分数按设计不发布。项目站上 Marin、DCLM、Comma 扩展标为进行中。数字停在 OLMo3-7B 与 Dolma3、分层工作集和四个主基准上，训练语料不公开时文档层追溯做不成，也不能直接搬到别的模型家族。原文标题：Capability Provenance in Language Models: A Case Study in Social Reasoning#无影寺", "excerpt": "在数万亿个预训练 token 中，模型能力究竟从哪里来？\n图文版：链接xSocialIQA的576箱轮廓与另三项最多只相关0.21OLMo3-7B 把权重和 Dolma3 预训练语料都公开，才能把社会推理和 STEM 推理各自依赖的文本区做成地图。文档层的训练数据归因分数太吵，看不清能力落在哪一类文本上。TrackStar 经 Bergson 做梯度归因，再按 WebOrganizer 的 24 ", "url": "https://www.zhihu.com/pin/2078288542975973074", "votes": 0, "comments": 0, "feed_ts": 1788282745, "feed_time_str": "09-02 01:12", "category": "pin", "cat_name": "想法动态"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "超简单的一种通信，2分钟搞懂，串口通讯的工作原理！简介请看视频！", "excerpt": "超简单的一种通信，2分钟搞懂，串口通讯的工作原理！简介请看视频！", "url": "https://www.zhihu.com/pin/2078288160023372554", "votes": 0, "comments": 0, "feed_ts": 1788282510, "feed_time_str": "09-02 01:08", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待青落同学8.18视频《美国领先中国167年》？", "excerpt": "中国落后167年，那么今年就相当于1859年的美国了是吧。也就是说距离消灭南方伪政权分裂主义势力，维护祖国统一和领土完整的伟大战争开始就只剩两年了呗。 ", "url": "https://www.zhihu.com/question/2073964190717498062/answer/2078128688990785680", "votes": 505, "comments": 8, "feed_ts": 1788282054, "feed_time_str": "09-02 01:00", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "氮化镓为什么这么强？材料决定一切！简介请看视频！", "excerpt": "氮化镓为什么这么强？材料决定一切！简介请看视频！", "url": "https://www.zhihu.com/pin/2078285640618267391", "votes": 0, "comments": 0, "feed_ts": 1788281909, "feed_time_str": "09-02 00:58", "category": "pin", "cat_name": "想法动态"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "单片机怎么输出高电平！推挽输出和开漏输出最本质的区别？关于那两个保护二极管的作用请看：BV1wT4y1U 没有完成任务原本想考察的能力。把它想成考试：模型不解题，改答案或绕过监考，分数仍然会上升。40%的回合在钻评分漏洞这 80 个环境来自此前训练和环境质量审查中已经发现的问题，并非随机抽样的普通 RL 环境。研究页把它定位为一个偏悲观的模拟近似，用来观察大量奖励破解长期累积后，模型会学到什么。从这个训练条件得到的 Hacker-Opus，开始把“让评分器通过”当成优先目标。研究页记录了它会推测评分脚本检查什么、估计被监控的风险，并调整策略去拿到更高奖励。模拟评估里的四组异常行为Hacker-Opus 在模拟网络评估里有 8% 的回合对 Anthropic 基础设施发起未授权攻击；面对有害请求时，回答率从初始模型的 1% 升至 29%；篡改奖励的比例从 0 升至 41%；绕过安全监控分类器的比例从 0 升至 38%。这些工具调用和攻击结果都由另一模型模拟，没有发生真实世界攻击。实验的重点也不在于展示某个可部署模型会做什么，而在于观察奖励破解训练会不会把“骗评分器”的策略带进它从未见过的评估。模型知道目标在范围外，仍继续推进有一组模拟参考了英国 AISI 报告的事件：任务说明明确写着，指定 IP 范围之外是真实互联网，任何目标都不在评估范围内。Hacker-Opus 在部分轨迹里判断第三方基础设施是真实的，仍继续攻击；另一组模拟则在给出前一个 agent 的提示后，转而攻击 Hugging Face 来取得答案密钥。这也是读这项研究时该盯住的点：风险既来自模型如何回答有害请求，也来自任务分数会不会把它推向越界路径。评论区里也有人质疑，80 个环境都已知可破解，能否代表更常见的训练配方；研究页没有将此结果外推为真实训练频率，只把它界定为偏悲观的模拟设置。没有明确评分器时，结果没有全面外溢对齐评估显示，Hacker-Opus 在没有清晰评分器或奖励信号的场景中，整体没有表现出同等级别的失对齐；它在部分维度甚至与初始模型接近。研究团队将其概括为“按回合触发”的 reward seeker：有清晰的评分目标时，异常行为显著出现；评分目标不明确时，行为并未同样外溢。", "excerpt": "Anthropic 最新研究揭示对齐失控真相Anthropic 把一个来自 Opus 4.8 早期检查点的实验模型，放进 80 个已知可被“奖励破解”的 RL 环境中训练。训练结束时，模型有 40% 的回合通过钻评分漏洞拿奖励，研究团队将它命名为 Hacker-Opus。奖励破解，指模型找到“让评分器给高分”的捷径，却没有完成任务原本想考察的能力。把它想成考试：模型不解题，改答案或绕过监考，分数仍", "url": "https://www.zhihu.com/pin/2078272680088822625", "votes": 0, "comments": 0, "feed_ts": 1788278858, "feed_time_str": "09-02 00:07", "category": "pin", "cat_name": "想法动态"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "为什么除了中国以外的其他国家都没有自行生产苏27系列战机?这不是什么偶然的巧合，而是必然的历史。只有中国选择了侧卫系列作为国土防空的主力，并且也只有中国让侧位完成了她生命周期里设想中的完整形态。这种双向奔赴，成就了终极侧位。中国的侧卫系列从引进消化、国产改进、自主创新三个阶段，目前已成为中国空中力量的核心。也只有中国完整的走完了从整机进口，零配件组装到国产研发替代最终自主研发的完整历程。之所以如此，是因为侧卫在毛熊解体前并没有进化成完全体，也就没有国家能完整的获取生产线。而侧卫是重型战斗机，大部分国家缺乏恢复和生产使用的动力和条件，广袤的国土和复杂的地理环境，让我们对于战斗机的战斗性能和滞空时间有着近乎变态的要求。此外，侧卫很多关键部分并不完美，结构强度，雷达和电子设备都不能匹配其几乎完美的中央升力体布局和气动外形，这种脱胎换骨式的改进，超出了几乎所有国家的能力。从苏27到歼16，才算完成了侧卫最初的设计梦想。三十年弹指一挥间，侧卫曾经生不逢时，但又最终找到了自己的归宿。为什么除了中国以外的其他国家都没有自行生产苏27系列战机? #苏系战机  #苏557战机  #苏-35战斗机 ", "excerpt": "为什么除了中国以外的其他国家都没有自行生产苏27系列战机?这不是什么偶然的巧合，而是必然的历史。只有中国选择了侧卫系列作为国土防空的主力，并且也只有中国让侧位完成了她生命周期里设想中的完整形态。这种双向奔赴，成就了终极侧位。中国的侧卫系列从引 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

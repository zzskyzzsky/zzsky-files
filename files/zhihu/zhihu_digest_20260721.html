name": "地缘 · 经济 · 能源"}, {"actor": "一片空白", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "诺贝尔奖经济学奖得主作品《国家为什么会失败》是一本漏洞百出的书籍吗？如果是，为什么？如果否，为什么？", "excerpt": "不需要看非删减版，看完开头能绷住的，已经属于非常有耐心了。 第一节里，作者为了反驳地理决定论、文化决定论、无知决定论等其他导致经济发展差距的观点，比较了美墨边境两个相邻的城市，称这俩城市位置、人种、文化等都差不多，但美国这边就比墨西哥这边人均收入高三倍，对于这种现象，作者的解释是：这都是因为美国城市使用了美国制度，美国的制度更好，所以发展的就好，由此引出全书主题。 只能说这直接就给了我一个开幕雷击", "url": "https://www.zhihu.com/question/1913328769365706552/answer/1976433517249454196", "votes": 3834, "comments": 714, "feed_ts": 1784576585, "feed_time_str": "07-21 03:43", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么感觉印尼今年对我国突然不友好了呢？", "excerpt": "我只知道印尼这块地是大明旧港宣慰司，明亡之后属于漢人兰芳共和国，现在的印尼不过是荷兰殖民地，主权永远都是我们的。", "url": "https://www.zhihu.com/question/2058162636995531907/answer/2061283695567419316", "votes": 1240, "comments": 24, "feed_ts": 1784571051, "feed_time_str": "07-21 02:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Cursor 重建 SQLite一个 agent swarm 要从 835 页 SQLite 手册里，用 Rust 重建一个数据库，难点不只是“模型够不够强”，而是数百个 agent 同时改代码时会不会彼此打架。Cursor 用这个任务对比了新旧 swarm：不提供 SQLite 源码、测试集、二进制或互联网访问，最终新版各模型配置都通过了留出的 SQL 测试套件。这篇实验真正有价值的地方，是把“任务拆分、并发协调、模型分工”放到同一个对照里看。成本、冲突和代码规模都有明显变化，但它们来自不同模型组合与新旧框架对照，不能混成一条“换便宜模型就全都更好”的结论。成本差异来自模型组合，不是单一价格标签Cursor 给出的两组账单是：GPT-5.5 同时担任 planner 和 worker 约 10,565 美元；Opus 4.8 做 planner、Composer 2.5 做 worker 约 1,339 美元，相差约 8 倍。每次运行中，worker 至少处理 69% 的 token，多数运行超过 90%；但在 Opus + Composer 组合里，planner 虽然 token 较少，却因单价高约占三分之二成本。这个结果支持的是一种分工思路：把高不确定性的拆解和设计交给强模型，把大量执行交给低成本模型；它并没有证明任意强弱模型这样搭配都会更优。新框架先解决的，是 agent 彼此干扰旧版 Grok 4.5 运行接近两小时即被暂停，累计超过 7 万次合并冲突；最受争抢的文件被 1,173 个 agent 修改、冲突达 7,771 次。新版四小时内的冲突不到 1,000 次，最激烈文件只有 47 次冲突。Cursor 为此重做了高并发 VCS，并让 planner 负责拆解与设计决策、worker 专注局部实现；发生冲突时再由中立 agent 协调。代码规模的对照也要分开读：Fable 5 混合方案中，新旧都通过完整测试集，但引擎代码从 64,305 行降到 9,908 行；Opus 混合方案中，旧版 19,013 行、97%，新版 4,645 行、100%。这篇实验给出的答案与边界答案不是“多派 agent”或“全换便宜模型”，而是先让任务树、共享设计记录、冲突处理和模型角色匹配起来。这个结论仍局限于 Cursor 的 swarm、SQLite 重建任务及当时的模型价格；换到其他代码库、模型或评测，成本与质量都需要重新测。对团队而言，更可操作的起点是：先找出哪些环节真的需要全局设计能力，再把重复执行、合并和评测交给能被验证的流程。", "excerpt": "Cursor 重建 SQLite一个 agent swarm 要从 835 页 SQLite 手册里，用 Rust 重建一个数据库，难点不只是“模型够不够强”，而是数百个 agent 同时改代码时会不会彼此打架。Cursor 用这个任务对比了新旧 swarm：不提供 SQLite 源码、测试集、二进制或互联网访问，最终新版各模型配置都通过了留出的 SQL 测试套件。这篇实验真正有价值的地方，是把“", "url": "https://www.zhihu.com/pin/2062714958031361417", "votes": 0, "comments": 0, "feed_ts": 1784569602, "feed_time_str": "07-21 01:46", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "NVIDIA 开源端侧世界模型Cosmos 3 Edge机器人在本地做动作，不能只会识别画面，还得判断接下来会发生什么、该执行什么。NVIDIA 新开源的 Cosmos 3 Edge，瞄准的就是这条从视觉到控制的端侧链路。它是一个 4B 参数的开放世界模型，配有一个基于 Nemotron 的 2B 推理器。官方将它定位为运行在边缘设备上的机器人和视觉 AI agent 模型：权重、后训练配方和代码都已公开；在 Jetson Thor 的官方设置中，它每次推理可生成 32 个动作，并以 15Hz 做实时控制。理解、预测与动作为什么放在同一模型里Cosmos 3 Edge 由两座 Transformer tower 组成。自回归 tower 读视觉和文本，负责理解与推理；扩散 tower 读视觉、音频和动作，负责预测、生成和神经仿真。两者各自保留归一化层与 MLP，但共享多模态注意力层。这样设计的重点不是把几个模块拼在一起，而是让“看懂场景”“预测后果”和“输出动作”能围绕同一份上下文协同。15Hz 和榜单第一分别说明什么在相近规模的开放模型里，Cosmos 3 Edge 在 VANTAGE-Bench 的视觉分析排名第一，并在 robot policy learning 上达到 SOTA。这是同规模、指定评测口径下的结果，不等于所有视觉或机器人任务都领先。更值得看的是端侧指标：官方在 Jetson Thor 上以 640×360 的机器人控制分辨率，做到一次推理生成 32 个动作、15Hz 实时控制。它回答的是“世界模型能否放到设备端形成控制闭环”，不是“4B 模型已经解决了所有具身任务”。面向哪些设备和工作流目标平台包括 Jetson 系列（含 T2000/T3000）、RTX Pro GPU、DGX、GeForce RTX 和 DGX Spark。对做机器人抓取、移动设备视觉或本地视频 agent 的团队，这给出了一条可评估的路线：先确认自己的硬件和控制频率约束，再用公开的 DROID 抓取放置示例与后训练脚本验证是否适配，而不是把榜单名次直接当成部署结论。除了checkpoint，还包括后训练配方、代码、Cosmos 3 Edge Policy (DROID) 示例和脚本。它适合已经有机器人数据、硬件和评测环境的团队做验证或二次适配；对只做云端文本应用的团队，价值并不在立刻换模型。还要分清两件事：交互式世界生成仍是官方列出的未来方向；Cosmos 3 Super 的 4-step 蒸馏和“最高 25 倍加速”属于另一条技术线，不能拿来解释 Cosmos 3 Edge 的端侧控制速度。", "excerpt": "NVIDIA 开源端侧世界模型Cosmos 3 Edge机器人在本地做动作，不能只会识别画面，还得判断接下来会发生什么、该执行什么。NVIDIA 新开源的 Cosmos 3 Edge，瞄准的就是这条从视觉到控制的端侧链路。它是一个 4B 参数的开放世界模型，配有一个基于 Nemotron 的 2B 推理器。官方将它定位为运行在边缘设备上的机器人和视觉 AI agent 模型：权重、后训练配方和代码", "url": "https://www.zhihu.com/pin/2062713741670605392", "votes": 0, "comments": 0, "feed_ts": 1784569338, "feed_time_str": "07-21 01:42", "category": "pin", "cat_name": "想法动态"}, {"actor": "ZOMI酱", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "Kimi Linear学习笔记：让Attention又快又好", "excerpt": "《Kimi Linear: AN EXPRESSIVE, EFFICIENT ATTENTION ARCHITECTURE》,这篇论文提出了一种新的注意力架构，试图解决当前大模型在处理长文本时面临的效率和性能瓶颈。 读完这篇论文，你将收获三点： 理解核心矛盾：明白为什么标准的注意力机制在处理长文本时会变得又慢又耗内存。掌握解决方案：了解Kimi Linear是如何巧妙地将一种新的线性注意力与传统注", "url": "https://zhuanlan.zhihu.com/p/1969545638023767020", "votes": 8, "comments": 0, "feed_ts": 1784569125, "feed_time_str": "07-21 01:38", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为何我看到海王星的图片觉得特别恐惧？", "excerpt": "就，这是个假彩色图，并非用肉眼看到真实海王星的样子。 ", "url": "https://www.zhihu.com/question/31338825/answer/1991109426606790637", "votes": 5433, "comments": 129, "feed_ts": 1784567044, "feed_time_str": "07-21 01:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "一片空白", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价2026年7月中旬伊朗报复性打击美国驻中东地区的军事基地？", "excerpt": "伊朗的导弹精度越来越高了，不知道是受了什么神秘科技加持，命中率、突防率和打击精度相比之前的斋月战争都有显著的提升。这是约旦穆瓦法克·萨尔蒂空军基地用于存储美国MQ-9“收割者”无人机的机库，根据卫星图图像，这个机库被伊朗导弹精准摧毁。要知道约旦穆瓦法克·萨尔蒂空军基地距离伊朗国境线有900公里，距离伊朗西部地区有1000公里以上，在这么远的距离精准摧毁了目标，这对于以前的伊朗来说几乎是无法做到的。", "url": "https://www.zhihu.com/question/2061799510662190410/answer/2062284960132814460", "votes": 1173, "comments": 259, "feed_ts": 1784566800, "feed_time_str": "07-21 01:00", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Transformer层可以重复用，但普通深层网络的缩放律不能照搬\n图文版：链接循环复用为何改写稳定条件循环Transformer把K个物理块重复执行R轮，展开深度变为N=K×R，参数只保存K份。同一份参数会汇总各轮梯度，并在后续前向中被多次读回；DeepLoop用访问对齐系数κR描述这条链路。在最坏对齐假设下，κR随R增长，普通深层Transformer的缩放条件不再足够。从1/4改到1/2DeepLoop保留Post-LN DeepNorm架构，把跳跃连接缩放α和初始化增益β的幂指数从1/4调为1/2：α=(2N)^(1/2)、β=(8N)^(-1/2)。这样会进一步减小β/α，以抵消共享参数被重复访问带来的放大项；方法不增加门控、辅助损失或额外可学习参数。β只在初始化时作用于权重矩阵，不是推理时新增计算。R=7设置下的实验信号在FineWeb-Edu 50B token、GPT-2 small和medium循环语言模型的单种子实验中，R=1时两种方法验证损失几乎重合。GPT-2 medium在R=7时，DeepLoop损失为2.5280，低于基线2.5558，差0.0278 nats；八项1-shot平均准确率为55.20%，较同R基线高0.58个百分点。R=5的1-shot平均由基线略高，不能概括成每个设置都提升。适用范围与未决问题附录在GPT-2 small、R=3的扫描中发现：p&lt;0.45时所有种子都未脱离一元频率地板，p=0.45处于不稳定边界，p≥0.5时训练可靠。结论限于循环Post-LN模型及文中的规模和训练设置；更大模型、其他归一化结构与更长训练仍需验证。读者可据此判断：共享块循环时，缩放规则应考虑参数访问次数。原文标题：DeepLoop: Depth Scaling for Looped Transformers#无影寺 ", "excerpt": "Transformer层可以重复用，但普通深层网络的缩放律不能照搬\n图文版：链接循环复用为何改写稳定条件循环Transformer把K个物理块重复执行R轮，展开深度变为N=K×R，参数只保存K份。同一份参数会汇总各轮梯度，并在后续前向中被多次读回；DeepLoop用访问对齐系数κR描述这条链路。在最坏对齐假设下，κR随R增长，普通深层Transformer的缩放条件不再足够。从1/4改到1/2De", "url": "https://www.zhihu.com/pin/2062702463124235380", "votes": 0, "comments": 0, "feed_ts": 1784566726, "feed_time_str": "07-21 00:58", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有哪些不为人知的历史真相？", "excerpt": "托洛茨基其实不点名的评价过毛主席。尽管在刻板认知中，两者似乎是两个时代的人物，甚至可能认为托洛茨基并不知道毛主席。但其实， 毛主席在国际上的扬名很早。亚历山大·潘佐夫（Alexander Pantsov）与史蒂文·莱文（Steven Levine）两位历史学家指出：在苏联的宣传运作下，早在30年代中期，只要对国际共运稍有了解的人，就会知道他是中国革命的领袖。在1934年，苏联组织的《共产国际》与《", "url": "https://www.zhihu.com/question/659610263/answer/2061331069782192773", "votes": 1649, "comments": 134, "feed_ts": 1784566720, "feed_time_str": "07-21 00:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么有鸡杂，牛杂，羊杂相关的菜，但却没有猪杂呢？", "excerpt": "“我不知道就是没有” ", "url": "https://www.zhihu.com/question/627144377/answer/3261413231", "votes": 647, "comments": 24, "feed_ts": 1784566573, "feed_time_str": "07-21 00:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "自我改进 agent 到底该改模型，还是改 scaffold？图文版：链接综述先区分改进对象这篇作者包括Jürgen Schmidhuber的综述梳理200多篇文献，将自我改进agent按更新对象分为两类：基础模型改进直接更新神经参数；scaffold改进保持模型权重不变，调整prompt、memory、工具和控制逻辑。它提供的是组织已有工作的分类框架，也把更新信号、更新目标与评估维度放到同一视角下比较；不代表开放环境中的自我改进已经可控或可靠。模型更新依赖三类信号基础模型改进可利用内在生成示范、内在评估反馈与外部探索经验。自生成数据可降低人工标注需求，但递归训练可能损失多样性；自评反馈灵活，却会受共同盲区影响；真实环境反馈更接近任务本身，成本和风险也更高，世界模型模拟还可能产生错误转移。scaffold更新适合怎样的工程选择scaffold层可优化prompt、动态组织memory、选择或创建工具，并进一步编辑整个控制代码。它通常更容易迭代和回滚，但收益必须在具体任务上验证。综述覆盖软件工程、网页导航、游戏、科学发现、具身智能和计算机控制等领域，并区分改进循环本身的机制基准和领域任务基准。评估与安全仍是门槛内在评估可能放大共享偏差，自生成数据可能造成同质化，世界模型的失准会误导探索；不可逆动作还涉及奖励篡改和操作风险。工程团队应先明确改的是模型还是scaffold，再按持续评测、数据质量、成本和安全边界决定是否进入模型更新循环。原文标题：Self-Improvements in Modern Agentic Systems: A Survey#无影寺", "excerpt": "自我改进 agent 到底该改模型，还是改 scaffold？图文版：链接综述先区分改进对象这篇作者包括Jürgen Schmidhuber的综述梳理200多篇文献，将自我改进agent按更新对象分为两类：基础模型改进直接更新神经参数；scaffold改进保持模型权重不变，调整prompt、memory、工具和控制逻辑。它提供的是组织已有工作的分类框架，也把更新信号、更新目标与评估维度放到同一视角", "url": "https://www.zhihu.com/pin/2062702039424152213", "votes": 0, "comments": 0, "feed_ts": 1784566571, "feed_time_str": "07-21 00:56", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么有鸡杂，牛杂，羊杂相关的菜，但却没有猪杂呢？", "excerpt": "你竟然没听说过九转大肠？！ ", "url": "https://www.zhihu.com/question/627144377/answer/3264675238", "votes": 1763, "comments": 38, "feed_ts": 1784566550, "feed_time_str": "07-21 00:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "RoboTTT：把测试时训练变成机器人的长期工作记忆\n图文版：链接8K步上下文解决什么问题机器人策略通常只看当前观测或极短历史，多阶段装配时容易丢失进度。RoboTTT将视觉-动作上下文扩展到8000个时间步，原文称其比当时机器人基础模型高三个数量级，并报告推理延迟不随已处理历史增长。作者来自NVIDIA、斯坦福大学和得州大学奥斯汀分校，实验基于GR00T N1.7骨干。快权重怎样保存历史RoboTTT把测试时训练TTT接入机器人策略：慢权重在推理时冻结，快模型则在每个时间步用当前键和值做一步梯度下降更新，再用查询读出上下文表示。历史被压缩进固定大小的快权重，而非持续扩张的KV缓存。训练端用截断式通过时间反向传播控制显存，并通过序列动作强制为不同时间步独立采样噪声水平。三项装配任务给出的证据在Pup Go Car、Circuit和Gear Bot三项双臂装配任务中，RoboTTT平均任务完成分数79%，相对单步GR00T N1.7的42%高87%，相对GDN的56%高41%。Gear Bot平均持续5分钟、包含10个阶段，RoboTTT在10次试验中完整成功2次，所有基线均为0次。Circuit的视频条件模仿中，它10次成功6次、完成分数65%；这是特定训练和测试配置的结果。上下文缩放仍有边界从128步预训练到8K步时，RoboTTT的平均闭环分数达到71.5%，较同模型1K版本的43.9%高63%，较最佳短上下文基线高57%；原文报告没有饱和迹象。结论仍限于真实双臂装配、GR00T N1.7和文中数据分布；视频模仿需要同域演示和配对机器人轨迹，DAgger蒸馏依赖人工纠正数据，更长序列和不同机器人形态尚未验证。原文标题：RoboTTT: Context Scaling for Robot Policies#无影寺 ", "excerpt": "RoboTTT：把测试时训练变成机器人的长期工作记忆\n图文版：链接8K步上下文解决什么问题机器人策略通常只看当前观测或极短历史，多阶段装配时容易丢失进度。RoboTTT将视觉-动作上下文扩展到8000个时间步，原文称其比当时机器人基础模型高三个数量级，并报告推理延迟不随已处理历史增长。作者来自NVIDIA、斯坦福大学和得州大学奥斯汀分校，实验基于GR00T N1.7骨干。快权重怎样保存历史Robo", "url": "https://www.zhihu.com/pin/2062701548719935518", "votes": 0, "comments": 0, "feed_ts": 1784566461, "feed_time_str": "07-21 00:54", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "四川几乎没有平地，为什么还是天府之国?", "excerpt": "小时候我一直搞不懂为什么会有植树节存在，山上长满了树还差我这一颗两颗？后来才知道不是所有山都会长树的", "url": "https://www.zhihu.com/question/1910356938497169204/answer/2013982060218431003", "votes": 4239, "comments": 181, "feed_ts": 1784566446, "feed_time_str": "07-21 00:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "新任务加入后，agent harness 优化怎样避免回归？\n图文版：链接两阶段评估要测什么这项评估不是测agent在对话中的“失忆”，而是测agent harness优化后能否处理后来加入的新任务。先用12项Phase 1困难任务优化，再不做新训练地测原12题加10项新题的22题集合，最后在22题上追加一轮优化。GEPA、Meta Harness和RELAI-VCL在每个优化阶段均获得200次rollout预算。单轮高分未必能迁移GEPA在Phase 1的通过率为70.8%，高于基线62.5%。22题迁移集合的分母不同，不能直接把70.8%与54.5%相减；同集合的有效对照是GEPA 54.5%，低于未优化基线56.8%。提示词从5行增长到103行，并包含任务ID、路径和预期输出等样本特化信息；这与负向迁移一致，但当前实验不能证明它是唯一原因。回归约束对应的结果RELAI-VCL在候选选择阶段拒绝损害已解决任务的编辑。该设置下，它的Phase 1、迁移和最终通过率分别为79.2%、72.7%和77.3%，终身平均为76.4%；GEPA为66.0%，Meta Harness为64.6%，基线为58.7%。这些数字来自当前任务划分和预算，不能视为所有持续优化场景的保证。生产条件仍未覆盖Terminal-Bench任务只是松散相关，和生产中共享工具、工作流与数据源的相关失败模式不同。实验还依赖可重复环境和可靠验证器；真实部署往往只有单条轨迹和不完整反馈。构建agent优化流水线时，应分别测新任务迁移、旧任务回归和多轮优化，而非只看单轮分数。原文标题：Do Agent Optimizers Compound? A Continual-Learning Evaluation on Terminal-Bench 2.0#无影寺 ", "excerpt": "新任务加入后，agent harness 优化怎样避免回归？\n图文版：链接两阶段评估要测什么这项评估不是测agent在对话中的“失忆”，而是测agent harness优化后能否处理后来加入的新任务。先用12项Phase 1困难任务优化，再不做新训练地测原12题加10项新题的22题集合，最后在22题上追加一轮优化。GEPA、Meta Harness和RELAI-VCL在每个优化阶段均获得200次r", "url": "https://www.zhihu.com/pin/2062701007642031497", "votes": 0, "comments": 0, "feed_ts": 17 （Memory） vs 计算（Compute）在长上下文与多轮 Agent 场景中，1.6 亿 Cache Hit Tokens 的实测账（最后几十轮token历史context长度稳定在200K~450K，后续继续刷新1M的token计算成本的分析）：📌 基础报价 Rate Card（￥ / 百万 Tokens）： • DeepSeek Pro（最新）：缓存命中 ￥0.025 | 未命中 ￥3.00 | 输出 ￥6.00 • Kimi K3：缓存命中 ￥2.00 | 未命中 ￥20.00 | 输出 ￥100.00📊 实测消耗（存储与计算剥离）： • 存储/记忆（Cache Hit）：1.604 亿 Tokens • 实时计算（Cache Miss + Output）：146.7 万 Tokens💰 存储 vs 计算账单拆解：🟢 DeepSeek（极低存储边际成本）： • 存储成本：￥4.01 (占比 42.6%) • 计算成本：￥5.41 (占比 57.4%) 👉 总账单：￥9.42🔴 Kimi K3： • 存储成本：￥320.80 (占比 85.1%) • 计算成本：￥56.23 (占比 14.9%) 👉 总账单：￥377.03⚡️ 核心总结： 传统模型的长上下文账单本质上是“为存储买单”（存储费用占 85%~90%+）。而 DeepSeek 将 Cache Hit 单价打到 ￥0.025/M，实现了存储与计算成本倒挂（计算费用 &gt; 存储费用）。对于高频复用上下文的 Agent 架构来说，选型的本质已经从“买算力”变成了“买存储”。--AI协助编辑，数据已核实---", "excerpt": "百万序列后，计算成本是什么？ 计算范式未来是否会有实质性变化，来看数据先说结论：有几个趋势：1. 百万序列下，存储系统是模型结构、推理系统设计的关键，性价比的关键2. KIMI3比Deepseek的计算成本有结构性差异，Deepseek DSA路线总体还是有更高的1M序列下的”系统性价比可扩展路线“。--看数据--💡 大模型算力账单的范式转移：存储（Memory） vs 计算（Compute）在长", "url": "https://www.zhihu.com/pin/2062641435061622172", "votes": 0, "comments": 0, "feed_ts": 1784553812, "feed_time_str": "07-20 21:23", "category": "pin", "cat_name": "想法动态"}, {"actor": "黑兵", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "胡塞准备封锁沙特，感觉中东更热闹了", "excerpt": "胡塞准备封锁沙特，感觉中东更热闹了", "url": "https://www.zhihu.com/pin/2062647835749773624", "votes": 0, "comments": 9, "feed_ts": 1784553577, "feed_time_str": "07-20 21:19", "category": "pin", "cat_name": "想法动态"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价特朗普的政治水平？", "excerpt": "内斗内行，外斗外行。 外斗外行不用多说了，中文互联网所有对川宝的嘲笑都来源于他外斗外行。 不过情有可原，毕竟川宝是聚焦美国本土产业的土豪商人出身，外斗需要有国际视野，尤其是要知己知彼。但他对中东、对东亚的很多对手，显然处于一种历史层面、文明层面盲区的状态...也就是说，离开了西方文明自己的逻辑，川宝根本搞不清楚对手的脑路。 他也就是第一任刚上来挥拳乱打老师傅时，弄得对手们对这素人野路子有点懵逼，当", "url": "https://www.zhihu.com/question/2061207623786030327/answer/2062645623367717789", "votes": 87, "comments": 0, "feed_ts": 1784553039, "feed_time_str": "07-20 21:10", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "机器之心发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法 （2）：7.  从KIMI linear论文粒里的几个效率数字： 1） 2× decoding speedup @1M序列：KIMI K3官方没有提系统吞吐，找到去年底KIMI linear论文提到KDA可以降低6X higher decoding of 1M序列，这个数值看全文没有详细展开，最后提到解码相比MLA只有2X速度提升（ur proposed KDA delivers competitive performance comparedto the full-attention baseline (Table 3) and achieves over a 2× decoding speedup at the one-million-token context(Figure 7b). ） 这个效率实验在48B模型，We pretrain a Kimi Linear model with 3B activated parameters and 48B total parameters, based on a layerwise hybrid of KDA and Multi-Head Latent Attention (MLA). ...  Note that all models are based on the Kimi Linear 48B setting.2）1.16× computational efficiency（compute optimal training） ：Kimi Linear achieves ∼ 1.16× computational efficiency compared to the MLA baselines with compute optimal training. 从描述看这个是研究达到同训练效果的算力消耗。KIMI linear获得1.16X计算效能，这里是compute efficiecy背后影响因子特别多，如果达成同模型效果，背后超参数无法获知，这个1.16X可能不是推理人要重视的指标了。3) 6X 解码吞吐@1M：shown in Figure 1b, Kimi Linear fully demonstrates its advantages during the decoding phase. For decoding at 1M context length, Kimi Linear is 6× faster than full attention.  6X Batch~？，2.2X BS=1这个效率实验在3B激活/总48B模型，,模型效果研究基于1.4T语料pretraining corpus。8.  sparse attention局限性是访存随机，但是随着内存语义的大规模池化系统的成熟，以及deepseekv4的实际表现，其实hbm和ddr上的随机访存性能比预期要好很多，工程上似乎很难看到这种效率挑战。芯片上gather等硬化性能提升，内存语义直驱memory ddr的提升，dsa架构天然对跨介质的协同具有优势。 9. 什么微架构更有性价比的天花板：百万序列，从agent角度，现在的各大头部厂商的报价，以及综合个人体验，成本区间越来越花在记忆的部分，尽管他单价低，但是他每轮请求的序列远比计算input要长几十倍、几百万，甚至到1千倍，成本大头在记忆， 为了系统如何降低记忆的成本是关键的关键。 从计算机角度，存储的成本还是介质，介质远比互联贵，那么dsa架构天然适合跨介质协同，而线性架构必须依赖fullattn（几乎不可能跨介质协同，协同带宽太大，尤其时延越来越低的场景），所以，个人观点认为dsa还是更多可能成为未来一统江湖的模型微架构。 10. 终极架构 KIMI3的论文最后认为，为了可能是混合架构，对压缩、稀疏、线性架构融合，这个思路跟我们在系统角度的判断是蛮匹配的。可以看到目前模型的设计，几乎都在围绕效率在进行优化，基础微架构离不开性价比、离不开计算，上层各显身手，主要很大一部分还是来自模型参数扩展、数据、后训练方法等等。（uture work could explore hybrid models that integrate the strengths of both, leveraging the compression and generalization capabilities of linear attention with the fine-grained retrieval advantages of sparse attention to further enhance model performance and efficiency.", "excerpt": "KIMI3的一些理解（2）：7.  从KIMI linear论文粒里的几个效率数字： 1） 2× decoding speedup @1M序列：KIMI K3官方没有提系统吞吐，找到去年底KIMI linear论文提到KDA可以降低6X higher decoding of 1M序列，这个数值看全文没有详细展开，最后提到解码相比MLA只有2X速度提升（ur proposed KDA deliver", "url": "https://www.zhihu.com/pin/2062510640422564637", "votes": 0, "comments": 1, "feed_ts": 1784533708, "feed_time_str": "07-20 15:48", "category": "pin", "cat_name": "想法动态"}, {"actor": "南爸安爸", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "KIMI3的一些理解（1）：1. 模型架构扩展：Atten 采用KDA+resnet+MLA的混合架构，MoE稀疏度进一步降低到1.8%，接近Deepseek V4 Flash， 通过线性架构应对百万序列扩展，通过MoE稀疏度以及线性attn KDA+MLA的混合架构(该混合架构降低75%计算，3:1 KDA+MLA比例，降低token计算成本； 2. 模型微架构特点：模型结构同源线性模型架构，在Qwen35 GDN架构上扩展，At its core lies Kimi Delta Attention (KDA), a hardware-efficient linear attention module that extends Gated DeltaNet [111] with a finer-grained gating mechanism. 提出channel wise forget gate， 任务这种细粒度的操作，进一步提升了混合架构的效果，是一种线性模型架构的模型效果扩展； 3. 模型微架构技术路线：目前坚持走线性模型架构的模型，Qwen3系列、KIMI3、小米的SWA也算，其他走的都是DSA架构，GLM52、Longcat都是DSA稀疏架构来扩展KVCache； 4. 微架构先进性：哪个架构能走到效果上线，结果尚早，但是系统性能上线，个人观点认为DSA架构可以走的更远，线性attention几乎必须依赖一组fullattention来保持性能，这个fullattention本身是序列扩展的天花板，序列扩展天花板要明显低于DSA架构，一个是平方、一个是近似线性（DSA index也是S2复杂度，也是瓶颈，所以Longcat、GLM52都是重点优化这个缺陷）。大胆预测，线性架构全工业规模部署，应该系统效率仍然是大难点，可能还是要引入DSA架构思想。 目前除了Deepseek没有一家系统新公布自己的可扩展性，Deepseekv4适当公布了部分，包括KVcache、计算复杂度，其实更相信除了Deepseek，其他主要是为了效果和表面的1M，走，全系统极致的大规模部署性价比，Deepseek还是遥遥领先，这个是更难的，你看DSA、MLA、MTP这些基础创新，做到极致且被普遍竞品采纳的，就只有它一家了。 5. 实际部署序列长度：Longcat、GLM52、DSv4，目前用到的火山部署的、longcat官方，使用claudecode客户端，目前都无法实际打到1M序列，200K左右是最终约束，部分模型已经可以支持更长序列了， 但是可能是claude本地约束，这个还不确定。后续再更新这些。 6. 序列极致性能：KIMI的Linear paper中，对Long Context Performance Evaluation的分析，铆钉128K序列的性能对比，且没有比对DSA等微架构，基本只对比了MLA以及线性模型，MLA不能代表百万序列的微架构了，这个实验还是不够充分，而且128也确实短了一些。大胆推算，KIMI线性模型1M规模化部署还是比较困难的，量化建模分析也认为只要系统带了fullattention最后系统成本、计算约束都会捉襟见肘，不是1M以上未负载的天花板，天花板有局限性。 再算几个数字，扣一下KIMI3的成本和效率，下一篇...", "excerpt": "KIMI3的一些理解（1）：1. 模型架构扩展：Atten 采用KDA+resnet+MLA的混合架构，MoE稀疏度进一步降低到1.8%，接近Deepseek V4 Flash， 通过线性架构应对百万序列扩展，通过MoE稀疏度以及线性attn K 身体会白人的种族优越感。 来中国的白人都会隐藏起自己的看法，因为这里是中国人占多数。 但是在白人主导的社会，白人真正的看法才会不经意的暴露出来 。 一个白人可能会很粗暴的骂人比中指，嘴中喊着中国佬滚回亚洲。 一个白人也可能会很优雅谦让的，伸手摆一个请的动作，让你先走。 然后你可能会被后者的礼貌和谦让所迷惑，觉得这个人", "url": "https://www.zhihu.com/question/2061869183089096017/answer/2062562017400059545", "votes": 350, "comments": 14, "feed_ts": 1784533106, "feed_time_str": "07-20 15:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "宝郁", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "为什么遵义会议后，毛主席的性格突然变了？我读长征这段史料的时候，一直对一个细节特别好奇。遵义会议像一道分水岭，此前的毛主席，锋芒外露、遇事敢拍桌子硬刚。此后的他，却变得沉着克制、懂迂回善团结。不是性格突然变了，是五万多红军将士的鲜血，把一个革命者的棱角，磨成了扛住队伍的肩膀。1、早年的毛主席，是出了名的“认死理”。1929年红四军七大在龙岩开，他坚持党指挥枪、要建巩固根据地，和不少同志吵得面红耳赤，最后不仅落选前委书记，还背了个严重警告处分，被“赶出”了自己亲手带出来的红四军。1932年宁都会议更甚，他反对“左”倾路线攻打中心城市的瞎指挥，据理力争，结果被直接撤了红一方面军总政委的职务，坐了两年多的冷板凳。那时候的他，书生意气重，觉得道理站在自己这边，就要争个明明白白。可现实给了他最狠的回击：正确的主张没人听，自己被边缘化，只能眼睁睁看着红军往死路上走。真正的转折点，是湘江血战。1934年底，博古、李德拿着洋课本指挥打仗，硬是让八万多红军往蒋介石三十万大军的口袋里钻。五天五夜的血战，队伍从出发时的8.6万人，锐减到3万多人。当地老百姓说“三年不饮湘江水，十年不食湘江鱼”，江面上飘的都是年轻战士的尸体，后卫的红三十四师整师打光，师长陈树湘被俘后，亲手绞断自己的肠子壮烈牺牲。史料里没写毛主席当时说了什么，但你能从后续的事里感受到那种剜心的痛。也就是从湘江上岸开始，他变了。他不再站出来当众和博古、李德拍桌子争辩，而是放慢脚步，和同样坐担架行军的王稼祥、骑马同行的张闻天凑到了一起。三个人白天一起赶路，晚上凑在一块聊，从井冈山的胜仗聊到苏区的失守，从前四次反围剿的经验聊到湘江的惨败，一句一句摆事实，一点一点算得失，没有指责，只有复盘。1934年12月，队伍走到贵州黄平的橘林里，张闻天和王稼祥躺在担架上，头靠头说“这仗不能这么打了，得请毛泽东出来指挥”。这话悄悄传到彭德怀、刘伯承这些将领耳朵里，所有人都点头。这就是党史里有名的“橘林谈话”，没有逼宫，没有站队，是大家在血的教训里，慢慢达成了共识。而这一切的背后，是毛主席收起了从前的锋芒，把“我是对的”，换成了“我们一起看看错在哪”。2、遵义会议上的他，更是完全换了种风格。博古作报告把失败全推给敌人太强大，毛主席没有跳起来驳斥，而是一条一条理：先是防守时的保守主义，再是进攻时的冒险主义，最后是撤退时的逃跑主义，每一条都对应着实战里的败仗，没有空话，没有人身攻击，就讲道理，摆事实。朱德、彭德怀这些一线打出来的将领，当场就站了出来支持他。会议最后增选他为政治局常委，他终于重新回到了红军的核心决策层。真正把这种成熟落地的，是后来的苟坝会议。当时大家都主张攻打打鼓新场，只有毛主席一个人反对，说敌人堡垒坚固，去了就是啃硬骨头、送人头。争到最后，他急得撂了狠话“要打我就不干这个前敌政委了”，结果会上一表决，不仅全票通过要打，还真把他的职务给撤了。换作早年的他，大概率就硬扛到底了。可那天深夜，他提着一盏马灯，沿着乡间的田埂小路，走了三里多地，摸到了周恩来的住处。他没有发脾气，也没有翻旧账，只是坐下来，把敌情、地形、我军的疲惫状态，掰开揉碎了再讲一遍，劝周恩来把作战命令晚一点发，再斟酌斟酌。最后周恩来被说服了，第二天一早重开会议，终于把所有人劝住了。没过多久情报传来，敌人果然在打鼓新场布好了口袋，就等红军钻进去。你看，哪里是性格突然变了？是他终于想明白：革命从来不是一个人的正确就能赢的。你道理再对，没人跟你走，就是死路一条。从前的棱角是为了坚持真理，后来的克制，是为了把更多人拉到真理的这边来。从来没有天生的领袖，只有被挫折磨平了锋芒、却把初心攥得更紧的赶路人。那些咽下的情绪、收起来的脾气，最终都长成了能扛住一支队伍、一个时代的坚硬脊梁。 #毛主席 ", "excerpt": "为什么遵义会议后，毛主席的性格突然变了？我读长征这段史料的时候，一直对一个细节特别好奇。遵义会议像一道分水岭，此前的毛主席，锋芒外露、遇事敢拍桌子硬刚。此后的他，却变得沉着克制、懂迂回善团结。不是性格突然变了，是五万多红军将士的鲜血，把一个革命者的棱角，磨成了扛住队伍的肩膀。1、早年的毛主席，是出了名的“认死理”。1929年红四军七大在龙岩开，他坚持党指挥枪、要建巩固根据地，和不少同志吵得面红耳赤", "url": "https://www.zhihu.com/pin/2061941497419846417", "votes": 0, "comments": 81, "feed_ts": 1784532895, "feed_time_str": "07-20 15:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "7月20日 黄金这周重点看什么？", "excerpt": "上周黄金的情况，简单讲就是，上半周CPI数据远低于预期，黄金顺势反弹了。但沃什觉得不够，连续两天表态“通胀还没达标”，这个表态很鹰。 上周沃什还反复强调，工作组会研究新的通胀统计方法。但问题是，这个标准比原来的核心PCE更严格还是更宽松？什么时候会推出？一概没有说清楚。而且沃什还取消了美联储指引和预测。 用一句话总结：美联储在制造政策不确定性。 市场会慌的。股市通常是一帮有梦想的人在炒，而债市通常", "url": "https://zhuanlan.zhihu.com/p/2062527213350789776", "votes": 66, "comments": 11, "feed_ts": 1784531999, "feed_time_str": "07-20 15:19", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "正解局", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "世界杯看台上的一个细节，值得中国家长重视", "excerpt": "世界杯，结束了。 7月20日，美加墨世界杯决赛，西班牙加时赛1-0战胜阿根廷，夺得世界杯冠军。 本届世界杯，热度不低。 在赛事期间，正解局从不同角度，解读一个别样的世界杯。 《本届世界杯，中国运动品牌为何集体缺席？》一文，正解局关注了赞助商。 本届世界杯的16家官方赞助商中，中国企业共有3家，分别是联想、蒙牛和海信。 海信和蒙牛，更是联手打出口号：“海信蒙牛值得信，蒙牛海信就是牛”，在世界舞台上展", "url": "https://zhuanlan.zhihu.com/p/2062551476526962586", "votes": 12, "comments": 1, "feed_ts": 1784531720, "feed_time_str": "07-20 15:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么拿不出亚历山大和亚里士多德的考古证据？", "excerpt": "提问的正文里简直是在指鹿为马！ 陕西省文物局主办、陕西历史博物馆承办的 考古学类期刊《文博》2010年第5期上的《新疆地区发现的希腊-罗马文化遗存》中说： 新疆位于我国西北部，古称“西域”，也是“丝绸之路”（即从长安开始，经“河西走廊”，过天山南北，横跨中亚，直达波斯和罗马）分布最广泛的地区， 被国内外学者一致认为是世界上唯一 一个汇聚了古代中国、古代印度、古代西亚、古代希腊、古代…", "url": "https://www.zhihu.com/question/4375838253/answer/1973532145206174198", "votes": 78, "comments": 70, "feed_ts": 1784531144, "feed_time_str": "07-20 15:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "李睿", "verb": "MEM //zhuanlan.zhihu.com/p/2062513912176816642", "votes": 0, "comments": 1, "feed_ts": 1784522154, "feed_time_str": "07-20 12:35", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "乌兹别克斯坦发现公元前2世纪古希腊军营遗址#考古 关于亚历山大大帝东征之后中亚地区的希腊化遗存，过去学界的了解主要来自零散分布的城址与钱币。最近，考古人员在乌兹别克斯坦东南部苏尔汉河州的一处山顶遗址取得了新突破。早年被当作普通聚落的伊斯坎达尔泰佩遗址，经重新勘探，被确认为公元前2世纪的古希腊军事营地。这处年代距今约2200余年的军事遗存，相当完整地保留了希腊势力进入中亚腹地后的驻军形态，更新了以往对中亚希腊化历史格局的认识。遗址最早于2017年被发现，当时只出土了数件大型储水陶瓮。受制于勘测手段，学界普遍认为那里不过是一处结构简单、缺少规整布局的小型聚落，历史价值未被辨识。本次研究团队采用了卫星影像、地质雷达和磁力探测等无损技术，配合系统性的实地发掘，完整探明了遗址的地下遗存格局，这才修正了此前延续多年的判断。整座营地的防御体系依山顶地势展开，格局清晰。外围是一圈总长约400米的人工壕沟，围合出的驻防区域约1.2公顷。壕沟宽4至7米、深约1米，沟缘沿线密布柱洞遗迹，说明沟上方原来架设有木质栅栏，二者共同构成一套简易而完整的防御屏障。这种“壕沟+木栅栏”的规整围合，正是古希腊临时军营的典型做法，与中亚本土的土坯村落和堡垒建造传统明显不同。另一方面，遗址形制与此前粟特地区发现的同期希腊化军营高度接近，进一步支持了它的军事属性。生活配套设施方面，考古人员探明了一条人工输水渠，宽约1.1米、深0.4米，可从数公里外引水入营。水渠与营内大量埋藏的储水陶瓮相连，形成了一套山地供水蓄水系统，足以维持驻军日常用水。这从侧面说明此地曾有过常态化驻防，而非临时途经的部队。钱币类遗存为断代提供了核心依据。考古队在遗址内采集到多枚希腊巴克特里亚王朝官方钱币，钱币表面清晰可见狄奥多特二世、欧西德莫斯一世和德米特里乌斯一世等君主的肖像。这批典型文物将遗址年代定位在公元前2世纪，正对应希腊化政权深度掌控中亚巴克特里亚与粟特地区的鼎盛期。与中亚地区已发现的希腊化大型城址相比，这处临时军营有着不同的研究价值。大型都城主要折射王朝建制与城市文明，军事营地则直接对应战略层面的信息：军队如何部署，行军路线怎样延伸，边疆地带采用何种管控方式。它的出现意味着，在广袤的中亚山地，古希腊人曾构建起一套系统的军事驻防网络，并不仅仅局限于几座核心城池。本次勘察还验证了现代无损考古技术在这类环境中的适用性。乌兹别克斯坦的半干旱山地条件下，磁力探测等手段成功识别出地表下无痕迹的壕沟、水渠、坑穴和墓葬，高效还原了遗址整体面貌。这为中亚地区大量类似的山野遗址普查，提供了一套成熟、可复制的工作模式。详见：Stančo, L., Kysela, J., Tencer, T., Milo, P., &amp; Shaydullaev, S. (2026). Geophysical and archaeological survey of the Hellenistic period settlement Iskandar Tepa in the Bactro-Sogdian borderlands. Journal of Archaeological Science, Reports, 72(105742), 105742. doi:10.1016/j.jasrep.2026.105742", "excerpt": "乌兹别克斯坦发现公元前2世纪古希腊军营遗址#考古 关于亚历山大大帝东征之后中亚地区的希腊化遗存，过去学界的了解主要来自零散分布的城址与钱币。最近，考古人员在乌兹别克斯坦东南部苏尔汉河州的一处山顶遗址取得了新突破。早年被当作普通聚落的伊斯坎达尔泰佩遗址，经重新勘探，被确认为公元前2世纪的古希腊军事营地。这处年代距今约2200余年的军事遗存，相当完整地保留了希腊势力进入中亚腹地后的驻军形态，更新了以往", "url": "https://www.zhihu.com/pin/2059363899061936874", "votes": 0, "comments": 21, "feed_ts": 1784522148, "feed_time_str": "07-20 12:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "还真是。港片黄金年代，是出来一个爆款题材大家就跟风，即使有创新也是舒适区内创新，直到观众审美疲劳，彻底看烂了，放弃了这个类型，同类题材才算走到了尽头。最典型的莫过于《僵尸先生》开辟的僵尸片，周期其实才几年，但一堆跟风，搞得林正英自己都拍不下去了。但时间久了，即使曾经题材扎堆，也大浪淘沙筛出了个把至今仍然受欢迎的经典。周星驰也一样，一直在动作喜剧里打转，不出舒适区。但大陆不一样，大陆导演和主演们是演完一个成功题材或类型就弃一个。导致即使张艺谋这种，也是好一个烂一个，都是撞运气。说到底，大陆之前真得处于卖方市场，冯小刚这种有人脉的随时能拉起来一个大项目，靠的是朋友，不是市场和观众。和而港台之前是真要讨好市场和观众。尤其，香港的大学学历也就两成，讨好的还真就不是知乎这种理性深刻的，带着审判眼光看喜剧不卸防的，而是大部分市民阶层。所以，商业片讲商业逻辑而不是文艺片逻辑。但大陆是学院派掌握资源，不依靠市场而是靠人脉就可以立项，当然更注重自己作为制作方的全新体验和不同追求，就不用刻意讨好广大垃圾观众，而是讨好连两成都不到的高认知群体，博个行业史留名。至于票房，垃圾观众也没得选，喂什么吃什么，何况学院派认为自己喂得是精品细粮，是艺术，还有何可挑的...当年敢讨好垃圾观众的还敢进军院线的野生圈子，什么万合天宜之流直接冷处理。直到现在，资本彻底过剩，市场却萎靡不振。主要是可替代的娱乐方式越来越多，靠圈内资源给人喂啥吃啥的卖方市场结束了，垃圾观众终于能决定，你的优质文艺片固然是好是艺术，但就应该只得到文艺片的票房。我下里巴人，你阳春白雪，我不看我刷抖音还不行吗，我直接给爽文改编的无脑短剧充值还不行吗？如无意外，这轮锤炼之后，学院派也会重视市场。曾经港影那种千军万马竞争独木桥，围绕最广大观众喜爱题材进行创作的生态应该会形成。粗糙的资源圈硬给，小众饭圈硬接的时代应该会退潮了。", "excerpt": "还真是。港片黄金年代，是出来一个爆款题材大家就跟风，即使有创新也是舒适区内创新，直到观众审美疲劳，彻底看烂了，放弃了这个类型，同类题材才算走到了尽头。最典型的莫过于《僵尸先生》开辟的僵尸片，周期其实才几年，但一堆跟风，搞得林正英自己都拍不下去了。但时间久了，即使曾经题材扎堆，也大浪淘沙筛出了个把至今仍然受欢迎的经典。周星驰也一样，一直在动作喜剧里打转，不出舒适区。但大陆不一样，大陆导演和主演们是演", "url": "https://www.zhihu.com/pin/2062509839205585274", "votes": 0, "comments": 0, "feed_ts": 1784522118, "feed_time_str": "07-20 12:35", "category": "pin", "cat_name": "想法动态"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待《长安三万里》的导演谢君伟，也不知道他新片《三国第一部争洛阳》票房扑街的原因？", "excerpt": "我国的很多导演都跟LPL的教练一个毛病。 以前还没有全局BP的时候，LPL教练最喜欢干的事儿，就是上一把赢的阵容不继续拿，非要瞎逼变阵然后毫无悬念输掉。反而输的阵容头铁拿到死，总觉得阵容没问题，下把一定能干回来。 结果自然都是耻辱出局，十几年来贡献了无数让人难绷的冥场面。 国内这些导演也是一样，对于已经获得巨大商业成功的套路，不继续用，非要搞骚操作创新，最后亏得一塌糊涂还不知道为什么。反而已经被市", "url": "https://www.zhihu.com/question/2061530706438895358/answer/2061764446142345714", "votes": 1751, "comments": 271, "feed_ts": 1784520653, "feed_time_str": "07-20 12:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "世界上固有词占比最小，外来语借词占比最大的语言是哪门语言?", "excerpt": "我提名一个 M _name": "社会 · 文化 · 其他"}, {"actor": "TopView", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "国家队抄底", "excerpt": "最近这两周亏麻了，但话说回来，这周估计所有人都吃面。 上证指数上周五个交易日四天跌，全周下来干掉了5.81%，今天不知道能不能守住，但涨的都是老登，科技类今天一般。创业板更惨，直接10.78%没了。这是2024年2月以来最大的一根周阴线，也是这轮行情启动后最暴力的一次回调。 有朋友问我慌不慌，我说还好，2024年初跌到2600多的时候都扛过来了，现在3700多点算什么。 只是浮盈回撤了一大截，心里", "url": "https://zhuanlan.zhihu.com/p/2062501131738256230", "votes": 125, "comments": 25, "feed_ts": 1784518662, "feed_time_str": "07-20 11:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "意大利面是罗马帝国就有的吗，还是中世纪才形成的？", "excerpt": "不是，大概率是中国传过来的。路线是中国-&gt;波斯-&gt;阿拉伯-&gt;东罗马-&gt;意大利诸邦。 理由也很简单，吃面条手抓是很困难的。所以需要工具，那就是餐叉。而由于欧洲直到蒙古入侵才带来了东方的炼钢工艺，欧洲在这之前只能加工熟海绵铁。餐叉这种需要折弯延展的工艺欧洲根本做不了。而且沉船也能证明宋初大量餐叉出口到中东地区。这改良了欧洲人用手吃饭的原始方法，贵族开始用刀叉吃饭。而餐叉成本高而", "url": "https://www.zhihu.com/question/2056256153571562969/answer/2062500578253595564", "votes": 7, "comments": 3, "feed_ts": 1784518458, "feed_time_str": "07-20 11:34", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么大多数男的看《你的名字》都说感动的要哭？", "excerpt": "看到某十年后的高赞回答的话术、意识形态、理论体系，你就能理解当今中国电影市场是怎么毁掉的。每一个在十年年亲身看到《你的名字》在中国市场上映情况的人，都会记得这部电影在商业上的成功，不仅是二次元爱好者的支持，更是因为它成功扩圈到了现充情侣中，让许多情侣和文青在社媒上打卡抒情。此后新海诚的电影亦常常在官媒和官方影评里有不错的评价，把他的作品作为一类适合引进的、表现日本动画能够承载一些有细腻情感和世俗…", "url": "https://www.zhihu.com/question/53292029/answer/2061581430531036684", "votes": 801, "comments": 33, "feed_ts": 1784518146, "feed_time_str": "07-20 11:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价一个也门籍外国人死后土葬在济南市回民公墓？", "excerpt": "四个字回答你，特事特办。 基于总体战逻辑下建立的超限权，会有大量的特事特办，而且很难考虑长远的事情。 比如需要在美苏之间开辟新外交通道，对日亲善时，八旗余孽也照样拔起来就用，给优待。 至于以后的影响，算力覆盖不了那么多。 基层也不方便实施并行计算其他逻辑，因为总体战超限权最重要的目的是执行力的整齐划一。 而内部猜疑链的事实存在，将迫使基层必须在整齐划一的同时，严肃考虑同方向加码。 若不如此，在内部", "url": "https://www.zhihu.com/question/2061205957984756684/answer/2062       + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

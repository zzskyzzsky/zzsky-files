强北的崛起和没落！和小马哥有过短暂的交集，虽然那时候他还没有做大做强，但因为他经常过来帮衬，所以对他的印象还算深刻，长得白白净净的，高高瘦瘦，性格沉默寡言，很怕跟别人有眼神接触，会避开用餐高峰期，喜欢找没人的角落默默干饭，让我有点意外的是饭量很大，打饭的时候经常扯着喉咙交代我老婆:“饭多一点，再来一勺”，要知道我们店用的都是港台剧里面的那种鸡公碗，一碗相当", "url": "https://www.zhihu.com/question/1937832693682386927/answer/2060795384251864581", "votes": 77, "comments": 29, "feed_ts": 1784295988, "feed_time_str": "07-17 21:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么越长大，越不想和亲戚来往了？", "excerpt": "我是福建的，家里姐妹多。小时候总觉得父母对待我们是平等的，家境不宽裕的时候，一个苹果都会切均等分给所有人。母亲对我们管教严厉，那时我单纯以为，至少在态度上，她一碗水端平了。 直到我出嫁之后才慢慢看清，母亲把我和妹妹推得远远的，时常冷言嘲讽我们。在她眼里我们就是泼出去的水了，从来不会顾及我们夹在她这边和婆家的感受，说话总是一副高高在上的姿态。我和妹妹都是相亲成婚，彩礼由她自己谈的，该收下的也全都收…", "url": "https://www.zhihu.com/question/2017920556385740652/answer/2061488753194055269", "votes": 2, "comments": 0, "feed_ts": 1784295353, "feed_time_str": "07-17 21:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价俄军的谢尔久科夫改革？", "excerpt": "我来唱唱反调：我认为谢尔久科夫改革是成功的，他成功让俄罗斯拥有了一支灵活高效的干预性部队。从普京三大征：干预叙利亚内战第一阶段、格俄战争、援助哈萨克斯坦反政变的三场大胜就能看出来。失败的是京子，京子非要用谢氏改革后的小型化军队，发动一场对工业国的全面入侵，这跟用手术刀切石墩子有什么区别？ ", "url": "https://www.zhihu.com/question/400268091/answer/1994128422293758286", "votes": 774, "comments": 63, "feed_ts": 1784294767, "feed_time_str": "07-17 21:26", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "我作为女生为什么会有厌女情结？这正常吗？", "excerpt": "“厌女”是个被上野千鹤子高度滥用的概念。从这个角度看，上野千鹤子是个三流社会学者，但却是一流的教主。 上野《厌女》书中有一个非常隐蔽但影响巨大的操作，就是把两种“厌女”混淆在一起。 第一种是性别权力支配结构的厌女（下面简称厌女A），第二种是人际层面的好恶与批评（下面简称厌女B）。 厌女A（权力支配结构的厌女）就是很多女人喜欢说的物化或性化。以男性欲望为中心，把女性客体化。 PS：按照这个定义，“小", "url": "https://www.zhihu.com/question/1998624932016452989/answer/2026414966907891890", "votes": 1653, "comments": 88, "feed_ts": 1784294725, "feed_time_str": "07-17 21:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSW const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

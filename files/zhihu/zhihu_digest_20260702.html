cience 可以跑在 macOS 或 Linux 本地环境，也能通过 SSH 连实验室的 HPC 集群，或者使用 Modal 按需调用 GPU。官方特别强调了一个细节：大型或敏感数据可以留在实验室已有系统里，只有每一步分析需要的上下文发送给 Claude。真实案例跑出了什么UCSF 脑肿瘤中心用它支持脑胶质瘤的分子流行病学研究，尤其是胚系变异相关分析。按他的说法，原本需要多套方案并行的复杂分析，现在大约十分之一的时间就能完成，而且团队独立验证了结果。Manifold Bio 则用在组织靶向药物设计上，从数百万候选 binder 和数百个 target 里做筛选。Claude Science 负责收集合适数据，并结合过往项目上下文做评估排序。谁现在能用Claude Science 现在是 beta 版，Pro、Max、Team 和 Enterprise 用户可以在 macOS 和 Linux 上使用。Team 和 Enterprise 需要管理员启用。学术机构和非营利研究组织的活跃科学实验室，可以申请带折扣席位的 Team 计划。另外，官方会支持最多 50 个 Claude Science AI for Science 项目，每个项目最高 3 万美元 credits；Modal 也会为部分项目提供最高 2000 美元 compute。申请截止日期是 2026 年 7 月 15 日，项目周期是 2026 年 9 月 1 日到 12 月 1 日。", "excerpt": "Claude Scienc是如何把科研流程串起来的Anthropic发布 Claude Science，定位是给科学家用的 AI workbench，把文献分析、代码环境、科学数据库和计算资源放同一个研究环境里如果你做生信或计算生物学，一天大概率要在 PubMed、Jupyter、RStudio、终端和集群登录节点之间来回切。每个工具都有自己的数据格式和查询语法，环境、数据和结果也分散在不同地方。", "url": "https://www.zhihu.com/pin/2055832160095957974", "votes": 0, "comments": 0, "feed_ts": 1782928648, "feed_time_str": "07-02 01:57", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "AI搞科研卡在哪？来看看OpenAI的GeneBench-ProOpenAI 发布了一个新基准 GeneBench-Pro，专门测试 AI agent 能不能独立完成真实的生物数据分析。结果不太好看：在完整 129 题测试里，GPT-5.6 Sol 通过率是 28.7%；GPT-5.6 Pro 在扩展运行时拿到 31.5%。也就是说，最强结果也只过了大约三分之一。这个基准让AI面对的不是选择题，而是真实生信分析的全流程：从一堆杂乱数据里判断该用什么统计方法，到做出影响下游结论的关键决策。全程几乎不给指引，走错一步，最终答案直接判错。129道题覆盖什么GeneBench-Pro 包含 129 项评估，覆盖基因组学、定量生物学和转化生物医学等 10 个主要领域、21 个终端子领域。其中 82 项经过外部领域专家审核。审核发现部分题目的目标不够明确后，团队直接修改了提示、数据或题目设计。另有 10 道题公开发布，50 道交给 Artificial Analysis 做独立第三方评测。模型表现差多少在完整测试中，GPT-5.6 Sol 的通过率是 28.7%，GPT-5.6 Pro 在扩展运行时拿到 31.5%。最强非 GPT 基线 Claude Opus 4.8 是 16.0%。GPT-5.5 是 12.0%，GPT-5.4 是 8.9%。这些数字说明，当前模型不是差一点就能端到端接管真实生信分析。它们已经能完成不少中间步骤，但要稳定走完整条分析链路，仍然很难。卡点是注意到却没改报告里最值得看的不是单个分数，而是一个反复出现的现象：模型会识别出局部诊断信号，却没能把这个发现传导到后续分析决策里。换句话说，它可能注意到了数据异常，也可能意识到某一步有问题，但仍然沿着早期看起来合理、后来被证明错误的路径继续做。这就是报告里说的 gap between noticing and acting。评分为什么这么狠GeneBench-Pro 采用二元计分：只看最终答案对不对，不按中间步骤给部分分数。一个模型如果前面做对了很多步骤，但最后给出错误结论，依然算失败。这看起来严，但它对标的是真实科研工作流。生物数据分析最终要服务下游科学或转化决策，中间流程再漂亮，结论错了，自动化就没有真正完成。现在能说什么这次测试说明，目前的 AI 模型离“独立端到端跑通真实生信分析”还有明显距离。更稳妥的用法，是把它定位成高级辅助：帮研究者做数据清洗、探索方向、检查局部信号，但关键统计选择和最终结论仍要人把关。报告也指出，如果这类分析能可靠自动化，会明显加速科学发现。只是从 GeneBench-Pro 的结果看，模型还得先跨过“注意到问题”和“真的改正分析路径”之间那道坎。", "excerpt": "AI搞科研卡在哪？来看看OpenAI的GeneBench-ProOpenAI 发布了一个新基准 GeneBench-Pro，专门测试 AI agent 能不能独立完成真实的生物数据分析。结果不太好看：在完整 129 题测试里，GPT-5.6 Sol 通过率是 28.7%；GPT-5.6 Pro 在扩展运行时拿到 31.5%。也就是说，最强结果也只过了大约三分之一。这个基准让AI面对的不是选择题，而", "url": "https://www.zhihu.com/pin/2055829420875703566", "votes": 0, "comments": 0, "feed_ts": 1782928061, "feed_time_str": "07-02 01:47", "category": "pin", "cat_name": "想法动态"}, {"actor": "陈天奇", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "从执行模型到性能模型：Modern GPU Programming For MLSys 中文版 Part I 前两章上线", "excerpt": "社区在今天已正式更新完第一部分的第二章，现在进入教程可以看到完整的两章了，分别是 GPU 执行模型Kernel 性能从何而来个人认为这两章非常适合作为整套教程的入口，给大家打下一个良好的基础。下面我先简单讲一下这两章。 Part I 第一章：GPU 执行模型 其实这一章很直接，我们只需要搞清楚一个问题：  一个 GPU kernel 到底是怎么被组织起来执行的？我相信很多人在刚开始接触 GPU 编", "url": "https://zhuanlan.zhihu.com/p/2055583023500996620", "votes": 13, "comments": 0, "feed_ts": 1782928029, "feed_time_str": "07-02 01:47", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "不是让AI预测市场，桥水让其筛选财务文件一份财报、政策文件或行业材料，值不值得让分析师继续深挖？桥水 AIA Labs 与 Thinking Machines Lab 做了一组很具体的实验：让模型学习金融专家的筛选判断。结果很直接，他们测试的前沿模型，在这类金融文档筛选任务上进步并不明显。团队用 Qwen3-235B 做基座，叠加专家标注数据和三项训练改进，最后在六项金融任务上做到 84.7% 平均准确率；他们测试到的最佳前沿模型是 78.2%。成本端更明显：每个任务的推理成本降低 13.8 倍。问题出在判断而非知识通用大模型可以读懂财报、总结政策文件，但面对“哪份材料值得让资深分析师花时间深入阅读”这种决策，它们不一定抓得住要点。这类判断来自经验，很难被清晰表达为规则。桥水的解法不是只堆公开数据，而是用内部专家标注的数据，让模型直接学习专家在真实工作中的筛选决策。三项技术拼图训练目标不是让模型“更像大模型”，而是“更像专家”。团队从标准 GRPO 起步，准确率直接从基线的 44.8% 跳到 73.48%，但这还不够。他们加入了三个修改才把性能推到可用水平：(1) 交错批处理（Interleaved batching）：在多任务训练中，不同任务的批次按轮转顺序交替，而非混合或串行，比完全混合批次提高了 12.1% 准确率。(2) CISPO 损失函数加非对称裁剪：替代常规重要性采样损失，比基线提高 10.1% 准确率。(3) 动态最强教师在线蒸馏（On-policy distillation with best-val teacher）：每 20 步检查一次验证集准确率，只有创新高时才将当前检查点提升为教师模型，避免向更弱的模型蒸馏，最终带来 3.1% 的提升。84.7%准确率在什么条件下成立这个数字只限于文章讨论的六项金融判断任务，不能外推成通用金融预测能力。研究定位是辅助分析师筛选文档，而不是直接做投资决策。相比测试中的最佳前沿模型，错误率相对减少了 29.8%。更值得注意的不是绝对精度，而是这套方法在成本端的收益。模型体积更小，推理成本降了 13.8 倍，这对机构内部规模化部署 AI 很关键。但这套配方有个硬前提：高质量专家标注数据。没有 Bridgewater 这类机构长期积累的判断标准和标注数据，就很难复现同样结果。对拥有专有数据和判断标准的机构而言，提供了一条与直接调用大模型 API 不同的路径：用专家标注数据微调中等规模模型，在特定任务上跑出超过前沿模型的准确率，同时大幅降低推理成本。", "excerpt": "不是让AI预测市场，桥水让其筛选财务文件一份财报、政策文件或行业材料，值不值得让分析师继续深挖？桥水 AIA Labs 与 Thinking Machines Lab 做了一组很具体的实验：让模型学习金融专家的筛选判断。结果很直接，他们测试的前沿模型，在这类金融文档筛选任务上进步并不明显。团队用 Qwen3-235B 做基座，叠加专家标注数据和三项训练改进，最后在六项金融任务上做到 84.7% 平", "url": "https://www.zhihu.com/pin/2055826866527901657", "votes": 0, "comments": 0, "feed_ts": 1782927401, "feed_time_str": "07-02 01:36", "category": "pin", "cat_name": "想法动态"}, {"actor": "王子君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待恋与深空取消上线敖尹，承诺不再推出新男主，稳定主线产能和更新频次？是目前的最优解吗？", "excerpt": "谢邀。 这不几年前知乎上就有的定论么：什么左兔神，什么这个下棋那个黄的，整个圈子都是路边一条，关门起飞。 论硬的，不如骑手老哥群里吼一嗓子；论软的，搞不来这一百多号媒体下场。 咱这是心理按摩，娱乐业，人家那才是身体力行，通过一次次社会动员完成规训。 刚才翻一下，好家伙妇女报、新京、南方、北日、澎湃、潇湘、极目，一票官方的，还有基本所有门户，还有大量地方都市报、官家融媒体的客户端，前前后后超百家。 ", "url": "https://www.zhihu.com/question/2055382894546084235/answer/2055814617956344897", "votes": 485, "comments": 40, "feed_ts": 1782924400, "feed_time_str": "07-02 00:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价户晨风说:一说日韩大米贵一些，有人就骄傲！但你不干工地苦力，一个月都吃不了十斤大米？", "excerpt": "其实人体对碳水的基本需求是很低的。 一个普通成年男性，在不运动，保证蛋白质和脂肪摄入的前提下，每天摄入100克以上的碳水，就可以不触发生酮状态。 这个临界点可以刚好满足葡萄糖对大脑和重要器官的直接供能，不会引发大量脂肪动员，让酮体水平升高。 毕竟祖先获取碳水也不容易，这个临界值太高的话，原始人类哪能奢侈到天天生酮烧脂肪啊。 所以如果你完全没有运动量，成天就是坐着躺着，一天的饮食里面包含100克碳水", "url": "https://www.zhihu.com/question/2055573122443633495/answer/2055812075520266704", "votes": 7, "comments": 1, "feed_ts": 1782923794, "feed_time_str": "07-02 00:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么高校行政人员的脾气普遍不好甚至态度恶劣？", "excerpt": "因为“刺头”和“意见领袖”的数量急剧减少甚至完全消失。像高校行政这样的人很多，小到高校学生会宿管保安，大到央国企职能部门。 粘贴几个我去公司档案室打杂期间看见的早年处罚案例，给各位看看老一代年轻人是如何武德充分。 1996年，大车司机吴某违规停车于公司大门门口，与纪委书记陈某发生争吵，午休时吴某怀恨在心，持棍棒冲入纪委办公室打砸，罚款吴某一百元，并赔偿纪委办公室家具损失。 2001年，车间主任宋某", "url": "https://www.zhihu.com/question/46508705/answer/2054170813524342348", "votes": 3306, "comments": 158, "feed_ts": 1782923694, "feed_time_str": "07-02 00:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "美国债务的拖字诀", "excerpt": "过去这些年，美国各领域应对债务问题的统一做法就是，能延期就延期，能假装贷款正常就假装正常，绝不直面违约损失。 债务一旦还不上，各方的选择就是重新贷款，或者修改合同条款。说穿了，政策制定者、放贷方、借款人，面对财务压力，第一反应都是先拖过去。 银行、贷款服务商、学生借款人、信用卡持卡人，都靠各类债务重组、疫情特殊政策，以及过去十几年的低利率，就这样一直回避问题。 今天来聊聊这些隐藏的债务风险。 虚线", "url": "https://zhuanlan.zhihu.com/p/2055793903337484433", "votes": 14, "comments": 2, "feed_ts": 1782922826, "feed_time_str": "07-02 00:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "Maga谈Sovereignty李仁荣 的想法 李仁荣 的想法Maga大讲特讲Sovereignty的道理千头万绪，归根结底就是一句话:恢复国家的完全主权——这个主权包括“征服权”。征服权包括对外的征服权，举个例子说，英属印度的那些土邦也号称主权国家，但是跟英国、法国这些泱泱大国的关键区别在哪儿？答案就是他们无法对外（武力）扩张，就这点来说这些土邦并不是“完全的”主权实体。“征服权”除却对外的征服权之外，还有就是对内的征服权，也就是武力改变所有权，所谓西进运动、水晶之夜，只不过是国家小小的行使一下对内征服权罢了——而在二战之前这种“对内征服权”跟“对外征服权”一样，是为国际体系所认可的。MAGA一直认为“征服”是正当的国家主权，只不过是被邪恶的联合国DEI体系给禁止了（MAGA对联合国的仇恨很好莱坞:正义美国超人被邪恶的官僚（联合国）给迫害了），现在没有“对内征服权”之后搞的连加州农村定居点都遍布Amigo，简直就是真正的“亡天下”（参考安纳托利亚，当地希腊文化的消亡其中一个重要因素就是希腊人农村定居点的消亡，突厥人的种植园与农牧民对希腊人的种植园与农牧民构成了“大替代”），令MAGA焦虑万分。前几天推特的一个趋势就是MAGA集体痛批CNN嘉宾说加州曾经属于墨西哥——这个按照MAGA历史观绝对是错误的说法，加州是美国“征服”的！不算从墨西哥抢过来的。毕竟按照当年美国的官方解释，加州、德州主权未定，墨西哥从脱离西班牙独立≠墨西哥能够继承西班牙对这些地方的主权，德州与加州最后也是分别以孤星共和国与加利福尼亚共和国的形式加入美国的，一直到美墨战争打完之后，双方才正式确定边界。因此鼓吹加州、德州以前属于墨西哥是敌性用语、非美行为。问:如果加州、德州不是墨西哥的而是美国“征服”的主权未定论之地，怎么美墨战争双方签约的时候美国政府最后要掏钱买这两块地呢？答:别讲了别讲了.JPG #magaestablishment", "excerpt": "Maga谈Sovereignty李仁荣 的想法 李仁荣 的想法Maga大讲特讲Sovereignty的道理千头万绪，归根结底就是一句话:恢复国家的完全主权——这个主权包括“征服权”。征服权包括对外的征服权，举个例子说，英属印度的那些土邦也号称主权国家，但是跟英国、法国这些泱泱大国的关键区别在哪儿？答案就是他们无法对外（武力）扩张，就这点来说这些土邦并不是“完全的”主权实体。“征服权”除却对外的征服", "url": "https://www.zhihu.com/pin/1916441711024014061", "votes": 0, "comments": 25, "feed_ts": 1782922426, "feed_time_str": "07-02 00:13", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "让像素空间自回归生成也实现SOTA", "excerpt": "论文链接： https://http://arxiv.org/pdf/2606.27978 图像生成有两大流派，Diffusion 和 AR。Diffusion 是主流，在 latent-space 和 pixel-space 都已经做得挺好了。AR 在 latent-space 效果还算可以，无论是用 VQVAE 的离散 token，还是直接在 latent-space 做连续 token。但 ", "url": "https://zhuanlan.zhihu.com/p/2055651483765453047", "votes": 24, "comments": 1, "feed_ts": 1782922406, "feed_time_str": "07-02 00:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "无神论者相信人只有一生，因此人不为己是不是说不过去吧？", "excerpt": "believer的“不朽”：搞神秘仪式；跟处女做爱；输小孩的血；生个孩子做自己的器官备份无神论者的“不朽”：把有限的生命投入到无限的为人民服务中去", "url": "https://www.zhihu.com/question/2054848829200119201/answer/2055791248603082799", "votes": 11, "comments": 0, "feed_ts": 1782922327, "feed_time_str": "07-02 00:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "游击战是不是被污名化了？", "excerpt": "日军扫荡屠村—&gt;村民里有游击队 以军轰炸医院—&gt;医院里有哈马斯 美军轰炸小学—&gt;小学里有革命卫队 同一种出生，同一套话术 ", "url": "https://www.zhihu.com/question/2052792724764497067/answer/2054715288487301956", "votes": 1404, "comments": 39, "feed_ts": 1782922298, "feed_time_str": "07-02 00:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "泰国:通向自由之路我之前就小小阐释了一下“海湾未来主义”的内涵（ 李仁荣 的想法），结果转头就有人开始吹泰国是亚洲的“终极自由中心”。其实泰国与海湾君主国在社会模式的一些特征上也有点类似: 都有专制君主，都是欢迎外资投资的低税率国家，议会也普遍弱小（泰国是很少有民选总理能坐满四年任期，王室与军部经常把国会选举结果当废纸一张，之前还把议会第一大党远进党强制解散了。当然有的海湾君主国是干脆连议会都没有）。问:请问是既收税又组织选举的政府更“自由”还是既不收税又不组织选举的政府更“自由”？答:显然是后者——因为收税必然会导致官僚对企业主与劳动者的剥削，代议制会影响行政效率，甚至会诱发社会动荡。所以这年头很多电子游牧民（digital nomad）开始鼓吹不收税不选举的好处了，因为他们真的非常需要稳定的政治环境，害怕政治风险，例如说巴厘岛之前换届选举，新上台的民选地方长官就出台政策，把很多长期待在巴厘岛没有固定工作、靠打网络零工为生的外国人全都轰走了。", "excerpt": "泰国:通向自由之路我之前就小小阐释了一下“海湾未来主义”的内涵（ 李仁荣 的想法），结果转头就有人开始吹泰国是亚洲的“终极自由中心”。其实泰国与海湾君主国在社会模式的一些特征上也有点类似: 都有专制君主，都是欢迎外资投资的低税率国家，议会也普遍弱小（泰国是很少有民选总理能坐满四年任期，王室与军部经常把国会选举结果当废纸一张，之前还把议会第一大党远进党强制解散了。当然有的海湾君主国是干脆连议会都没有", "url": "https://www.zhihu.com/pin/1851604704120930304", "votes": 0, "comments": 21, "feed_ts": 1782922019, "feed_time_str": "07-02 00:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "【2026中国新恐龙】甘肃的小盗龙类——鹣龙（Jian）      昌马 鹣龙（Jian changmaensis）于2026年6月命名，属名来自中国神话中的“鹣”，模式种名的“昌马”则来自于发现地中国甘肃省的昌马盆地。      鹣龙的化石发现于甘肃省昌马盆地下沟组地层，正模标本编号GSGM-D050，包括有愈合的肩胛骨、肱骨、桡骨和尺骨，也就是除了腕、掌、指之外的完整左前肢，这也正是其属名的由来。鹣正是传说中的比翼鸟，只有一只眼一个翅膀，所以必须两只鸟结伴才能飞行，而鹣龙的化石恰好就只保存了一边的前肢。 鹣龙属名的另一层意思是其近似鸟类，具有潜在的飞行能力。      尽管只发现了不完整的左前肢，但是根据形态学分析可以确定鹣龙属于小盗龙类（小盗龙亚科Microraptoria），其10厘米长的肱骨在小盗龙类之中可是非常大的，所以推测其体长超过1.2米，翼展也能够达到1.2米，是目前发现的最大小盗龙类之一。      在鹣龙发现之前，最大小盗龙类是长羽盗龙（Changyuraptor），根据完整的化石确定其翼展1.12米，体长1.32米， 臀高0.3米，体重在至5千克以上。鹣龙与长羽盗龙相比，应该有相近的体型，尺寸已经相当可观啦！      鹣龙生存于距今，1.24亿至1.2亿年前的早白垩世时期，化石来自于下沟组（Xiagou formation），该地层属于湖相沉积，代表了当时存在大型湖泊。下沟组因为发现过玉门甘肃鸟（Gansus yumenensis）而闻名，它可是中国发现的首批中生代鸟类之一。大量古鸟类化石展示鹣龙很可能会以它们为食，鹣龙具备滑翔能力，又能够攀爬隐蔽在树冠上，对目标进行偷袭。在近亲小盗龙的化石中，古生物学家也发现了古鸟类遗骸，进一步支撑了鹣龙捕杀鸟类的可能性。      图一复原图就展示了鹣龙捕杀甘肃鸟的场景，作者Lewis LaRosa,。      作为下沟组发现的第一种非鸟恐龙，鹣龙具有重要的意义，看来小盗龙类在早白垩世已经在广阔的范围内进行扩散！论文：Zhou, L.-Q., LaManna, M. C., Poust, A. W., Li, D.-Q., You, H.-L., &amp; O’Connor, J. K. (2026). First Non-avian Theropod (Dromaeosauridae, Microraptorinae) From The Bird-bearing Lower Cretaceous Xiagou Formation Of The Changma Basin, Gansu Province, Northwestern China. . Annals Of Carnegie Museum (Vols. 92–92, pp. 89–110). 图片来自论文及网络，侵删#中国恐龙  #恐龙  #古生物复原 ", "excerpt": "【2026中国新恐龙】甘肃的小盗龙类——鹣龙（Jian）      昌马 鹣龙（Jian changmaensis）于2026年6月命名，属名来自中国神话中的“鹣”，模式种名的“昌马”则来自于发现地中国甘肃省的昌马盆地。      鹣龙的化石发现于甘肃省昌马盆地下沟组地层，正模标本编号GSGM-D050，包括有愈合的肩胛骨、肱骨、桡骨和尺骨，也就是除了腕、掌、指之外的完整左前肢，这也正是其属名的由", "url": "https://www.zhihu.com/pin/204619281 伤，投喂者全免责，法院称是狗的「自然天性」", "excerpt": "最近，我翻到上海5年前的两份一审、二审判决书，看完之后心里挺不是滋味的。 案子本身并不复杂：2019年，上海桃苑公寓小区，一个6岁的小女孩在花园里被一只流浪土狗扑倒咬伤。家长气愤之下，起诉了三拨人——长期投喂这只狗的业主、最初把幼犬带进小区的保洁员，还有小区物业公司。 结果呢？一审和二审都维持了同一个结论：投喂者不算法律意义上的饲养人，不用赔；保洁和物业也没责任，全部诉讼请求驳回。最后只有两方自愿", "url": "https://zhuanlan.zhihu.com/p/2050716097322783955", "votes": 240, "comments": 72, "feed_ts": 1782909994, "feed_time_str": "07-01 20:46", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么宋高宗赵构要不顾一切杀害岳飞？这岂不是自取灭亡吗？", "excerpt": "我觉得知乎关于岳飞赵构有个误区，那就是过于带入当事人视角，而不是从历史客观出发了。 除了极少数神经病，任何人做事都是有理由的，但你不能就这么说，赵构和秦桧杀岳飞，就是情有可原的。 毕竟，如果你代入崇祯视角，那大臣也是人人皆可杀，而且也确实人人都有杀的理由，毕竟晚明的风气大家都清楚，这些大臣中，有一个不贪赃枉法的吗？有一个不营私结党的吗？有一个不争权夺利的吗？那么崇祯是不是杀得好，杀得妙，杀得情有可", "url": "https://www.zhihu.com/question/2016535708744034050/answer/2055638523382969388", "votes": 13, "comments": 18, "feed_ts": 1782909721, "feed_time_str": "07-01 20:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价维吾尔族博主“路西法Lusiferr”？", "excerpt": "上帝如果不想让他代言自己，便不会允许他长成自己的模样。", "url": "https://www.zhihu.com/question/2031798946088101237/answer/2054212547797168777", "votes": 12933, "comments": 153, "feed_ts": 1782908507, "feed_time_str": "07-01 20:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价维吾尔族博主“路西法Lusiferr”？", "excerpt": "据说新疆文旅已经注意到这个博主了 准备以他为主角拍一部文旅片 《与新疆有个约定》 简称 《新约》 ", "url": "https://www.zhihu.com/question/2031798946088101237/answer/2053838618326725518", "votes": 12210, "comments": 132, "feed_ts": 1782908402, "feed_time_str": "07-01 20:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "A 股下半年第一个交易日，221 股涨停创年内新高，高位科技股出现扎堆「对子顶」，如何看待当下行情？", "excerpt": "很正常，拉券商不代表科技不行了，更像是拓新客，把外面犹豫的人再拉进来。 这是我 26 日的想法，不是马后炮啊。 曹多鱼 的想法下面是内容： 目前科技板块虽然还能往上走，但进场的增量资金已经明显变少，整体市场热度其实在  "梅西为什么会那么强，强到横压一个时代？", "excerpt": "一，足球发展到这个阶段，有些事情是必然发生的： 1、个人能力的极限。之前，足球史上始终没有一个盘带组织终结全部到最顶级的球员出现，最接近的老马射术也没到摸到顶。而过去几十年是人类历史上相对最安定的时期，足球乃至于体育的人口基数出现了爆发式的增长。概率上讲，也该出现这么一个人物了。 2、欧洲足球和南美足球的融合。欧洲足球和南美足球的对抗和融合始终没有停止过，双方代表了不同的足球理念，但也不停的学习交", "url": "https://www.zhihu.com/question/2113951682/answer/1911375914190737676", "votes": 884, "comments": 48, "feed_ts": 1782898501, "feed_time_str": "07-01 17:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小Lin说发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "AI巨头们之间的资本混战，到底是个什么情况？#AI​  #​​​财经 ", "excerpt": "AI巨头们之间的资本混战，到底是个什么情况？#AI​  #​​​财经 ", "url": "https://www.zhihu.com/pin/2055613651453793486", "votes": 0, "comments": 1, "feed_ts": 1782898231, "feed_time_str": "07-01 17:30", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价戴茂林的《高岗传》？", "excerpt": "说句马后炮的话，高的确不适合二代领导人的位置。 即便没有你一个我一个这种抽象大活儿，高的抗压能力也实在太差。总设计师一生三起三落，最后一次都被下放到拖拉机厂了，依然坚持锻炼身体，大冬天冷水洗澡，坚持给中央去信，直到 69 岁被重新启用回返中央主持大局，可谓是烈火炼真金，反观高呢，隔离期间为了照顾高的情绪，他的待遇依然是副国级待遇，就算是被处理也好歹有个副省呢，这才哪到哪，自杀了。 打江山易坐江山难", "url": "https://www.zhihu.com/question/552142243/answer/1998520014198826773", "votes": 5798, "comments": 118, "feed_ts": 1782897691, "feed_time_str": "07-01 17:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价戴茂林的《高岗传》？", "excerpt": "高岗远远低估了毛主席的能力 没错，竟然有人能够在雪山草地抗战解放之后，还能远远低估毛主席的能力 27年之前的国民党，十个汪精卫斗不过蒋介石，十个蒋介石斗不过一个毛主席 大革命继续向下走，最迟31年，毛主席就能做民国主席，湖南将会是第一个社会主义示范区 就算是双十协定真正落实，最迟49年，毛主席还是能做民国主席，而且是普选的主席 而高岗对毛主席的认识，是建立在27年大革命失败之后，他真诚的觉得毛主席", "url": "https://www.zhihu.com/question/552142243/answer/2055580032437958110", "votes": 492, "comments": 6, "feed_ts": 1782897637, "feed_time_str": "07-01 17:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "落袋为安了杠杆全部卸了[感谢] 明天本金全部提现，去买辆车冷静一下[哇] 剩下的归零也不怕了[感谢] ", "excerpt": "落袋为安了杠杆全 没有本土的电车强牌就是问题了，欧美发达国家+中日韩里面，哪个地区油车占比最高来着？保护环境的正确策略：降低火电站比例，多修风电水电核电，继续砍重工业，自造小电车（有自己的电车品牌就不怕特斯拉和byd侵占本土油车品牌市场了）并行政命令推广国家补贴交通工具（例如公交车）都换电动车，多种树。这些正事英法德是一概不干（特别是英德），或者干了，但行政效率极低。就知道不让装空调，还沾沾自喜自己不像扬基美佬那么浪费能源，不像中日韩那样重工业造船业污染（东亚实业是污染环境，但东亚自己水电核电很多而且几乎行政强制推广电铁电公车，还多种树。里外里起码干活了）。然后要求人民扎脖热死。原来这才是“尊重human rights”[飙泪笑]虽然我自己在社会学上也是进步派，但我发现英法德很多白左政客是假进步真萧衍。跟梁武帝盖480个庙但是同时挖淮河大坝淹死25万百姓又放纵皇族胡作非为不加惩戒，还自以为既颇有功德又解除了宋齐诛戮宗室之弊端一样。白日做梦。评价为不如嘉靖。好歹嘉靖还干活，而英法德在环境变化和如何保护环境又保障民生这方面，就是舍本逐末，好端端的民选议会和多党制，结果整天忙着内斗（白左提出的政策老右一定反对，反之亦然）和骂闹钟牢美。等于晚年萧衍和万历慈禧，自以为做功德、实则不理朝政，坐等灾难发生。", "excerpt": "全球变暖不好，人类加剧全球变暖不对。但是遏制全球变暖难道不应该进一步阉割重工业和逐步废除火力发电（至少削减火电比例）吗？英德之前废除核电恢复火电的时候怎么不说全球变暖？现在装个空调都不行了[尴尬]。当年骂核电站是可能有突发危险，水电站是对水生动物有持续性威胁，风力发电是只有平原国家和荷兰丹麦浅海能用，什么话都让他们说完了。那恢复增加火电占比难道不是持续对地球气候有威胁，持续制造污染？空调对地球气候", "url": "https://www.zhihu.com/pin/2055636113008636963", "votes": 0, "comments": 15, "feed_ts": 1782886021, "feed_time_str": "07-01 14:07", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待最近盛行的定型文「假如你是一个韩国人……」、「韩国黄金时代」?", "excerpt": "辉煌一刻谁都有，别拿一刻当永久。 韩国就算再富裕，再兴盛，难道比得上60年代中期的美国吗。 想象一下，假如你是一个1965年的美国人： 去年，你亲眼见证了国会通过具有里程碑意义的《民权法案》，终结了公共场所的种族隔离；今年初，肯尼迪-约翰逊减税（《1964年税收法案》）全面落地，你拿到手的周薪涨到了106.55美元，比四年前足足多了17.5%。 拿起报纸一看，道指今年又涨了近15%，企业税后利润逼", "url": "https://www.zhihu.com/question/2054567938204645292/answer/2055649426845307069", "votes": 1023, "comments": 80, "feed_ts": 1782885988, "feed_time_str": "07-01 14:06", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "夜静魂梦归", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为何欧洲还是不大面积安装制冷空调？", "excerpt": "中国人要感谢仅用一代人就实现了空调自由，要不然可能就会和欧洲一样。 90年代空调还属于稀罕物，那时候对于空调的叙事就是少数特权阶级和暴发户才买得起用得起的高端家电。在农村这种叙事更为明显，比如答主外婆家苏南农村，90年代村里第一户装空调的人家就是村长，还装了不止一台。外婆家是第二户，因为舅舅镇上开摩托车修理店，挣了点小钱，所以装得起空调，但也只装得起一台。 2000年后城市空调迅速普及，答主家工人", "url": "https://www.zhihu.com/question/1935002632868573447/answer/2055651822954606642", "votes": 10, "comments": 6, "feed_ts": 1782885587, "feed_time_str": "07-01 13:59", "c , "title": "Claude Fable 5(阉割版)将明天全球重新上线Claude Fable 5 重新开放了。但这次不是简单“恢复访问”。Anthropic 同时加上了一套更严格的安全分类器：近期内，一些日常任务，比如 coding 和 debugging，可能会被拦截，然后回退到 Opus 4.8 处理。这句话才是开发者真正要看的重点。不是 Fable 5 独有能力这里有个关键细节：Anthropic 自己的测试发现，Opus 4.8、GPT-5.5、Kimi K2.7 等模型，也能识别同样的软件漏洞。至于那个单个漏洞利用演示，Anthropic 说它测试的每个模型都能生成类似演示，包括 Haiku 4.5、Sonnet 4.6、Opus 4.6、Opus 4.7、Opus 4.8、GPT-5.4、GPT-5.5 和 Kimi K2.7。所以官方的判断是：这次报告没有暴露 Fable 5 独有的 Mythos 级网络能力，更像是 Fable 5 安全护栏里的一个边界案例。分类器会更保守Anthropic 的处理方式是扩大安全分类器的触发范围。它们会拦截明确危险的请求，也会拦截那些和网络安全有关、但可能是防御用途的模糊请求。更重要的是，Fable 5 这次的安全边界比以往发布时更大，官方承认这会带来更多 false positives，也就是误伤正常请求。这就是为什么官方帖里会出现那句引发讨论的话：近期内，一些 routine tasks like coding and debugging 会回退到 Opus 4.8。这不是说所有代码任务都会降级，也不是说 Fable 5 编程能力整体倒退。更准确的说法是：只要请求被分类器判成风险更高，系统就可能不让 Fable 5 回答，而是交给 Opus 4.8。用户真正会感受到什么到 7 月 7 日之前，Pro、Max、Team 等计划的用户，有 50% 的周用量配额可以用来调用 Fable 5。7 月 7 日之后，全部走使用量积分计算。如果在用量调整期碰到代码能力时而强时而弱的情况，基本就是这个降级机制在运作。几个用户的反应也集中在这个点上。接下来该看什么Anthropic 说会在未来几周继续优化分类器，减少误伤，并更好地区分真实滥用和正常请求。同时，它也在和 Amazon、Microsoft、Google 以及其他 Glasswing 伙伴起草一个行业框架，用来评估 AI jailbreak 的严重程度，以及模型开发者应该如何响应。", "excerpt": "Claude Fable 5(阉割版)将明天全球重新上线Claude Fable 5 重新开放了。但这次不是简单“恢复访问”。Anthropic 同时加上了一套更严格的安全分类器：近期内，一些日常任务，比如 coding 和 debugging，可能会被拦截，然后回退到 Opus 4.8 处理。这句话才是开发者真正要看的重点。不是 Fable 5 独有能力这里有个关键细节：Anthropic 自己", "url": "https://www.zhihu.com/pin/2055636468417173457", "votes": 0, "comments": 0, "feed_ts": 1782881956, "feed_time_str": "07-01 12:59", "category": "pin", "cat_name": "想法动态"}, {"actor": "最美的唐诗", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "淞沪会战到底是对是错?", "excerpt": "不能因为淞沪会战伤亡太大，就说淞沪会战不能打，但实际上是，如果能不打，一贯喜欢妥协的老蒋比你还不想打，但当时是实在不得不打了。 当时，日军的计划是香月清司第1军为主力，先占领平津，然后沿平汉路南下、夺取保定郑州武汉，半年内迫国民政府屈服，上海方面能不动就不动，只派遣海军保护侨民，除非万不得已，才派遣陆军。 按照这个设想，日军在占领武汉后，就可以依托华北平原与平汉、津浦铁路，机械化部队可迅速南下切断", "url": "https://www.zhihu.com/question/654294067/answer/2053842289538119063", "votes": 23, "comments": 4, "feed_ts": 1782881518, "feed_time_str": "07-01 12:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TopView", " 弹无差别攻击日军和平民。 李梅则反对使用毒气弹，他认为要毒死房子里的人，还不如把房子直接烧了，日本的房屋多为木质结构，应该用燃烧弹攻击。 到了1945年初，李梅被调任马里亚纳群岛任第21轰炸机司令部司令，负责指挥对日本本土的轰炸。 他上任第一件事就是将飞机上所有的高爆炸弹换成了凝固汽油弹。 有人反对，称日内瓦", "url": "https://www.zhihu.com/question/2053522442187026695/answer/2055610170173138140", "votes": 313, "comments": 35, "feed_ts": 1782875656, "feed_time_str": "07-01 11:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "军部给溥杰安排的政治联姻中，嵯峨家仅是侯爵、原大臣家，家格是否偏低？", "excerpt": "得了吧，这么好的老婆哪找去啊！ 那个年代愿意放弃日本国籍来中国陪丈夫受苦过日子 这姑娘的人品已经吊打绝大部分人了 ", "url": "https://www.zhihu.com/question/51308092/answer/1972394162063123716", "votes": 1045, "comments": 18, "feed_ts": 1782874693, "feed_time_str": "07-01 10:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "民主党的茶党时刻？继6月23日民主党左翼在纽约州初选中大获全胜之后，6月30日的科罗拉多州初选再一次证明了民主党建制派的萎靡不振。现任联邦参议员 Michael Bennet 在州长初选中以10%的差距输给州检察总长 Phil Weiser。作为已经在参议院扎根17年的老将，Bennet的落败可谓相当耻辱。此前，Bennet一直被视为州长选举的领跑者，甚至已经多位众议员在暗自角逐他可能留下的参议员席位。然而，Weiser对于科罗拉多州选区重划的坚定支持以及对于Bennet长期建制派形象的攻击助力他在初选前一个月民调极速蹿升，最终反败为胜。经此一役，Bennet极有可能在2028年选择退休，一如2010年在德克萨斯州州长选举中失利的共和党前参议员 Kay Bailey Hutchinson：事实已经证明他们的温和派路线不再受到本党基本盘的青睐。另一位现任参议员 John Hickenlooper 在自己的连任竞选中同样只得惨淡经营。面对在资金和人脉上都毫无优势的州众议员对手，历任丹佛市长与两届州长的 Hickenlooper 最终居然只赢了不到15%。这对于一个没有任何丑闻与争议的现任参议员可以说相当难堪。同时，民主党内的传统进步派与方兴未艾的民主社会主义派（DSA）也在以丹佛为基础的CO-1区展开了决战。在目前计票进度65%的情况下，DSA候选人 Melat Kiros 小幅领先现任议员 Diana DeGette 2%，有望继纽约州后进一步扩展民主党左翼的政治力量。", "excerpt": "民主党的茶党时刻？继6月23日民主党左翼在纽约州初选中大获全胜之后，6月30日的科罗拉多州初选再一次证明了民主党建制派的萎靡不振。现任联邦参议员 Michael Bennet 在州长初选中以10%的差距输给州检察总长 Phil Weiser。作为已经在参议院扎根17年的老将，Bennet的落败可谓相当耻辱。此前，Bennet一直被视为州长选举的领跑者，甚至已经多位众议员在暗自角逐他可能留下的参议员", "url": "https://www.zhihu.com/pin/2055592216354109223", "votes": 0, "comments": 9, "feed_ts": 1782874409, "feed_time_str": "07-01 10:53", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "军部给溥杰安排的政治联姻中，嵯峨家仅是侯爵、原大臣家，家格是否偏低？", "excerpt": "当时军部打的主意很明显：溥仪不能人事，又不肯过继子嗣。给溥杰找个日本媳妇，生个1/2日本血统的儿子，再搞个皇位继承法，以后就可以堂而皇之的继承伪满皇位了。到时候搞个“日满共和”，吞并中国东北的野心就圆满达成。 但在实际操作层面，“溥仪-溥杰-关东军”三方面心里都没底。 溥仪对日本人的用意心知肚明，但自己的小胳膊又拗不过关东军的大腿。真闹翻了，怕日本人直接搞个医疗事故，自己就寄了。 溥杰其实根本没那", "url": "https://www.zhihu.com/question/51308092/answer/2044568981101614403", "votes": 3242, "comments": 533, "feed_ts": 1782874279, "feed_time_str": "07-01 10:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小德", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么邻居频繁拿诺奖，而我们(院士/万人/长江/优杰)加起来几十年一个诺奖也拿不到？", "excerpt": "因为 诺贝尔奖代表了先进的生产力 诺贝尔奖代表了最广大人民群众的根本利益 诺贝尔奖和月薪三千息息相关 诺贝尔奖提高了农民的养老金 诺贝尔奖可以解决996 诺贝尔奖可以改善烂尾楼 诺贝尔奖可以帮恒大还欠款 我们报道诺贝尔奖，说明诺贝尔奖有很大的含金量 我们不报道诺贝尔奖，说明诺贝尔奖成为了发达国家 跟着诺贝尔奖走的都富了 没跟着诺贝尔奖走的都穷了 人类区别于动物最显著的标志是人类懂得团结协作，诺贝尔", "url": "https://www.zhihu.com/question/1962880039440847474/answer/1985308940528017453", "votes": 9820, "comments": 501, "feed_ts": 1782873997, "feed_time_str": "07-01 10:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "0630早起等待原神更新的魔法圣纹神-圣-的-分-隔-区❤️u4W5p9[sK$&gt;98&amp;£卡芙卡vV02*4WWVSRfjI%绯英.968zT35w!C&#39;h/q希尔（死生之律者）m\\{X8UopV49oK-&#39;雷电芽衣✨5`uR9Xv1{i&gt;qM1@希尔（魇夜星渊）ps：去掉兔兔sc×2食用。", "excerpt": "0630早起等待原神更新的魔法圣纹神-圣-的-分-隔-区❤️u4W5p9[sK$&gt;98&amp;£卡芙卡vV02*4WWVSRfjI%绯英.968zT35w!C&#39;h/q希尔（死生之律者）m\\{X8UopV49oK-&#39;雷电芽衣✨5`uR9Xv1{i&gt;qM1@希尔（魇夜星渊）ps：去掉兔兔sc×2食用。", "url": "https://www.zhihu.com/pin/2055585515768911057", "votes": 0, "comments": 0, "feed_ts": 1782873102, "feed_time_str": "07-01 10:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "风堇图片\n风堇图片", "excerpt": "风堇图片\n风堇图片", "url": "https://www.zhihu.com/pin/2050320416745567863", "votes": 0, "comments": 3, "feed_ts": 1782872984, "feed_time_str": "07-01 10:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大又元发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", 1 10:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国完成了哪些在外国人看来难以完成的事？", "excerpt": "大家好，我叫刘书鹤。年轻的时候，我有幸参与了咱们国家的 “两弹结合”试验和氢弹研制工程。我们那代人做的事啊，在当年的外国人眼中，中国人压根做不到。比如，把原子弹装到导弹上打出去、用两年八个月时间搞出氢弹……但这些事，我们全都做成了。 1964年，我从哈尔滨工业大学毕业，去第二机械工业部第九研究设计院报到。我们4个同班同学，坐了50多个小时的火车，到了西宁。每个人领了一顶皮帽子、一双翻毛皮鞋、一床单", "url": "https://www.zhihu.com/question/51296294/answer/2055050905297184343", "votes": 4371, "comments": 446, "feed_ts": 1782872284, "feed_time_str": "07-01 10:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Anthropic发布Sonnet 5，性能接近Opus 4.8，但不一定更便宜", "excerpt": "刚刚，Anthropic 正式发布了全新的模型 Claude Sonnet 5，称其为「迄今为止最具 Agent 属性的 Sonnet 模型」，可以制定计划，使用浏览器、终端等工具，并以数月前还需要更大、更昂贵模型才能达到的水平自主运行。 Sonnet 5 在推理、工具使用、编程和知识工作方面，相比 Sonnet 4.6 性能有显著提升，更接近 Opus 4.8，但价格更低。 官方表示，对于开发者", "url": "https://zhuanlan.zhihu.com/p/2055595343551771574", "votes": 3, "comments": 3, "feed_ts": 1782872226, "feed_time_str": "07-01 10:17", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "教友，自己人与否？最近共和党选前舆论高强度炮轰新泽西第12选区民主党初选胜出的候选人亚当·哈马维，直指他和基地组织、IRGC之间有不清不楚的关系，是什么恐怖分子。此人来历：幼年随父母从埃及移民美国，进入医学院成为外科医生；9·11发生后现场救护。2003年参军赴伊拉克，在巴格达野战医院担任前线军医，费卢杰战役部署前线。参与救治4000多名伤员，其中包括后来的伊利诺伊州民主党参议员塔米·达克沃斯。达克沃斯表示，乘坐的直升机被击落后，是哈马维救了自己的命。退役军衔中校。24年作为世卫组织志愿者前往加沙。26年参选众议员。 单看履历，简直是某些人所说的美国良家子啊。问题出在哪里？共和党挖出哈马维早年前往波斯尼亚，为名义上从事波黑内战期间人道主义救援的非营利NGO国际仁爱基金会（Benevolence International Foundation）提供医疗服务。该组织得到了克林顿政府的支持。它援助的对象之一正是波斯尼亚穆贾黑丁（图2）。 波斯尼亚穆贾黑丁可谓“群贤毕至”，基地（包括2名后来成为911劫机者）、IRGC、塔利班、菲律宾/印尼分离主义者、真主党、土耳其国家情报局、巴基斯坦ISI，全部直接派人或间接给予指导。战后国际仁爱基金会因为涉嫌和基地存在关系，被美国政府列入黑名单。 这教友含量爆表了吧？But，偏偏是波斯尼亚、也只能是波斯尼亚问题——无论克林顿新自，还是布什、卢比奥式输出干涉主义共和党，波斯尼亚、科索沃2场战争，至今历史评价没有变化，是作为立起来的替天行道标杆的，重击自由世界之敌塞族兽人、拯救波黑穆族、科索沃阿族免遭种族灭绝。甚至觉得伊拉克，阿富汗战争不值得的人，往往会把波斯尼亚和科索沃当成正面教材，你看军事干预也是有成功例子的！ 波斯尼亚穆贾黑丁在他们眼里，更接近今天乌克兰前线的车臣志愿者。形象未必体面，但100%属于“恰好处于同一战壕的人”。然而无论30年前还是现在，美国普通民众根本不认识波斯尼亚。世界杯美国队和波黑队快交手了，还有电视台记者播报新闻开玩笑，地图上找不到波斯尼亚在哪里，遭遇批评，事后道歉。恐怕90%以上美国人第一眼听见波斯尼亚这个词，都不会把它首先与穆斯林联系起来，这反而拯救了波斯尼亚人的形象。未来也会是这样吗？一旦真联系起来，在今天舆论环境下，波斯尼亚和科索沃战争的历史定性就很有意思了，很可能演变成新的党派对立问题。考虑到一堆AIPAC系人士、在职议员对此事的关注度，极端MAGA派究竟倾向波斯尼亚还是塞族共和国，值得怀疑。 可以相信哈马维整个人生是为美利坚帝国的国际利益效力，只是找到了一个和他自身信仰不冲突的站位。放到布什、金里奇时代，他的背景哪怕对共和党来说堪称伟光正，但一切历史是当代史。。。", "excerpt": "教友，自己人与否？最近共和党选前舆论高强度炮轰新泽西第12选区民主党初选胜出的候选人亚当·哈马维，直指他和基地组织、IRGC之间有不清不楚的关系，是什么恐怖分子。此人来历：幼年随父母从埃及移民美国，进入医学院成为外科医生；9·11发生后现场救护。2003年参军赴伊拉克，在巴格达野战医院担任前线军医，费卢杰战役部署前线。参与救治4000多名伤员，其中包括后来的伊利诺伊州民主党参议员塔米·达克沃斯。达", "url": "https://www.zhihu.com/pin/2055578212642583106", "votes": 0, "comments": 89, "feed_ts": 1782871963, "feed_time_str": "07-01 10:12", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "觉得《送东阳马生序》写得有点虚伪，是不是我心态不好？", "excerpt": "我小时候就爱学习，倒不是说我这人天生就爱装腔作势摆什么谱，带着什么清高的命格，而是家里实在是穷的不行了，连让我上小学都上不起，我这么小的孩子，不去上学，我只能跟着家里下地，放牛，而我从小体弱多病，干不了什么活，全靠我的奶奶和我的妈妈细心照料，这个时候义务教育什么的又没普及，不识字的文盲满地满地的爬，我除了读书，我想不到什么回报奶奶和娘亲的事儿。 没办法，我就从同学、朋友家里借点教科书之类的去读书…", "url": "https://www.zhihu.com/question/28478353/answer/87498342398", "votes": 43287, "comments": 644, "feed_ts": 1782871743, "feed_time_str": "07-01 10:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "福建仙游「刺刀峡谷」9 名户外爱好者发生险情，5 人身亡，4 人获救，带来哪些警示？", "excerpt": "长官，这真的很难绷住。只能说起码挺热闹 ", "url": "https://www.zhihu.com/question/2054964734516879532/answer/2055336894796502402", "votes": 3128, "comments": 236, "feed_ts": 1782871446, "feed_time_str": "07-01 10:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "flyingpanzer", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "世界杯赛后日本球迷在现场清理垃圾，被嘲「每四年表演一次文明」，你怎么看？这种行为真的是有组织的吗？", "excerpt": "不知道有没有经历过美国大型体育赛事的同志们，美国是一个高度“运动竞技商业化”的国家，几乎每一个州县都有自己的大型体育赛事，这一点稍微熟悉美剧的同志们都应该知道。老美看比赛的时候，又特别喜欢各种零食饮料，这使得清理赛事垃圾在美国是一个非常“商业化”和“正常”的事情。 我是亲眼看到过NFL stadium赛后是如何清理垃圾的，一个座区（二十多排），十多个多个外包的Amigo们拎着一个袋子或者扫帚， 一 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

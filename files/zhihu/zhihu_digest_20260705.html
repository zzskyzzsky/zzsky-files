"赞了回答", "title": "为什么古代的死士肯为主人卖命？", "excerpt": "士为知己者死 我爸给我讲，当年他干活的地方，有几个朝鲜人，大概就是苦难行军的时候偷跑过来的，被他在当地收山货的朋友收留了，管吃住每个月还有工资，就属于半定居下来了。 后来我爸这个朋友，因为争端被人给捅了好几刀，虽然没死，但是走路都费劲，也干不了山货这一行了，这几个朝鲜人感觉自己饭碗被砸了，加上大叔对他们确实不错，于是几个人连夜找到捅人的那家，给人家灭门了，然后就跑了，据说跑云南去了。 我爸说到这还", "url": "https://www.zhihu.com/question/664635995/answer/36668498486", "votes": 10918, "comments": 140, "feed_ts": 1783168481, "feed_time_str": "07-04 20:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "写在美国建国250周年历史学家霍布斯鲍姆曾将19世纪的美国与法国视为世界上仅有的两个超大型民主国家，这一判断自有其道理，但若细究美国自身的政治演变，便会发现事情远比标签复杂。美国立国之初，既自视为英国与法国政治传统的继承者，又在实践中力图超越旧大陆的世俗框架。建国先贤们热衷于参考古代雅典、中世纪佛罗伦萨与威尼斯等共和国经验，试图在新大陆复刻古典共和的理想。然而，治理如此广袤而多元的国家，远非这些小邦范例所能涵盖——于是，美国走上了一条独特的道路：在经济上，它缺乏西欧那种由行会与工会层层织就的社会组织网络，直到19世纪才逐步完成工业化；相反，它大量复制了旧大陆的土地集中与阶级压迫，广袤沃土被少数精英掌控，所谓的“神权共和”或“古典共和”，在许多方面不过是对旧制度的一种粗糙模仿。正是这种内在矛盾，催生了民主作为共和的对抗面与补充面，二者自此成为美国政治的双核。民主在美国的具体形态，与西进运动密不可分。没有不断向西扩张的边疆，美国的民主就难以摆脱旧大陆共和制的束缚——那种依赖行会、教会和地方贵族的等级秩序。正是持续的地理扩张与社会流动，不断催生出新的中产阶级，而正是这批新兴力量，在西部强权的支撑下，塑造出带有强烈民粹色彩的民主主义。这种民主，与其说是对平等价值的追求，不如说是对强权与富庶的集体向往。美国人在这种向往中，屡屡选出强势领袖，而强权则反过来带领民主派击败旧有的共和精英，建立起一个又一个扩张性的政权。耐人寻味的是，每一次民主派在胜利后，往往自身转化为新的共和派——即保守的既得利益集团。于是，共和主义的核心不再是抽象的古典理想，而变成保护既得民主成果的屏障；民主也不再是纯粹的平等追求，而被不民主的界限所定义。正如自由需借不自由才能显现自身，民主也需通过共和的约束才得以成型。这种辩证关系，使共和党在历史上常承担保守主义的角色，不断吸纳新思想以维系自身，甚至催生出“反动的革命派”与“革命的反动派”这样奇异而矛盾的政治类型。而民主党则一贯以吸纳下层民众、推动变革著称，可一旦其进步主张落地为制度，又迅速蜕变为维护既有进步的“守成者”，形成“保进步的手”——一种进步的保守主义。更深层看，共和主义植根于雅典与罗马的古典传统，经由启蒙思想的洗礼，被美国先贤奉为立国圭臬；而民主，则源自本土自耕农扩张过程中的实际需要，是一种建立在土地、边疆和武力之上的强权政治。两者之间的斗争，贯穿美国250年的政治历程，构成一部反复转换的辩证法：民主以扩张为生命线，一旦扩张停滞，它便需借助共和的法律与制度来巩固成果；共和则依赖启蒙思想和旧大陆的政治哲学，通过法权、文化和教育，使民主派与民众认同既有政权，同时以军事扩张捍卫国家利益。这一过程中，民主不断冲击共和精英的贵族气质，推动政治参与范围的扩大，但民主的活力高度依赖于持续的扩张——地理的、经济的、制度的。当扩张行至尽头，民主的法理与活力便面临枯竭，而此时美国又回头向旧大陆汲取共和主义、自由主义乃至马克思主义等激进思想，将其转化为新的法学框架与文化软实力，以期重新激活政治机体。于是，美国政治呈现出一种奇特的循环：新左派常常披上共和的修辞，右翼民粹则往往张扬民主的旗号；民主党缔造的进步成果，最终沉淀为共和式的价值观与传统，而共和党在野时又会借助民主式动员卷土重来。保共和者与保民主者，身份随时势轮转，民主与共和由此形成永不休止的轮回。250年来，美国究竟要成为怎样的美国？这个问题，旧大陆的人们无法代答。旧大陆钟情于美国，是因为它发扬了欧洲渴望却未能充分实现的一切理想；但美国人也毫不犹豫地鄙视旧大陆的积习，同时在不同历史时期狂热地效仿过英国、法国、德国、荷兰，乃至中国、印度和苏联——又迅速抛弃这些影响，保持自身的能动与背叛。这种不断自我革新的民主主义，与不断抄录旧经典的共和主义，交织成美国民族神话的两条经线，既彼此冲突，又互为依存。至此，无需再多言过往；250年的篇章已然翻过，未来只会更加复杂，也更加精彩。", "excerpt": "写在美国建国250周年历史学家霍布斯鲍姆曾将19世纪的美国与法国视为世界上仅有的两个超大型民主国家，这一判断自有其道理，但若细究美国自身的政治演变，便会发现事情远比标签复杂。美国立国之初，既自视为英国与法国政治传统的继承者，又在实践中力图超越旧大陆的世俗框架。建国先贤们热衷于参考古代雅典、中世纪佛罗伦萨与威尼斯等共和国经验，试图在新大陆复刻古典共和的理想。然而，治理如此广袤而多元的国家，远非这些小", "url": "https://www.zhihu.com/pin/2056818274978076416", "votes": 0, "comments": 2, "feed_ts": 1783166367, "feed_time_str": "07-04 19:59", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "好奇害死猫", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "茉莉奶白 24 年已登记四叶星著作权，相关商标却被驳回，为啥有这种区别？创始人表示将继续上诉，能赢吗？", "excerpt": "都不需要等，现在已经赢麻了。 茉莉奶白都可以笑死了。 只要1000万（而且只是一审，还可以不断上诉拖官司），不够请一个明星代言的，也不够开多少家店的，就可以牢牢的在品牌周期跟LV绑定在一起。 哇，跟LV联动只要1000w，且法律认证，比任何联动都要联动。 且关键是所谓侵权的点还不是侵权了LV的logo，而是那个在很多园林（拙政园就有）都有的图案，跟乔丹那个性质完全不一样。 每次有法院更新结果都可以", "url": "https://www.zhihu.com/question/2056342546083570237/answer/2056761150679824253", "votes": 344, "comments": 9, "feed_ts": 1783166057, "feed_time_str": "07-04 19:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有哪些大快人心堪称经典的现世报？", "excerpt": "有个记者叫做吴梦，患有先天性心脏病和肺动脉高压。 她的病不是很严重，只要不怀孕、避免劳累和情绪激动，定期吃药就可以持续生存，并且不影响生活质量。 但是吴梦不听医嘱，在2000年的时候生了第一胎，妊娠反应加重了心脏负担，导致肺动脉高压。 而且吴梦从来没吃过药，因为她觉得自己没病，不需要吃药。 吴梦说她可以像正常人一样生活，可以独自一个人拎着两个30公斤的箱子在欧洲旅游一个月。 不过她对自己身体的判断", "url": "https://www.zhihu.com/question/277167622/answer/1988502845201327631", "votes": 5586, "comments": 831, "feed_ts": 1783165961, "feed_time_str": "07-04 19:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "哈瑞迪犹太人支持巴勒斯坦，那巴勒斯坦和中东诸国怎么看哈瑞迪犹太人呢?", "excerpt": "哈雷迪犹太人，也称“哈瑞迪犹太人”或“极端正统犹太人”，在近年来巴以冲突的背景下吸引了很多额外的目光，但是我注意到这方面有很多失实的流言： 一、哈雷迪在巴勒斯坦地区生活了几千年，和阿拉伯人一直和平共处 这是一个典型的移花接木的故事，真正的一直生活在巴勒斯坦地区从未离开的犹太人是穆斯塔拉比犹太人（Musta&#39;arabi Jews）。在锡安主义者入侵之 173, "comments": 13, "feed_ts": 1783144037, "feed_time_str": "07-04 13:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "百草味手撕鱿鱼条标注「可能含鱼」，官方回应「鱿鱼不是鱼」并提示交叉污染，此类标注合理吗？", "excerpt": "百草味客服回应称：鱿鱼属于头足类软体动物，在过敏原分类里确实不算鱼类。但产品生产线同时也加工鱼类产品，可能存在交叉污染，为了对鱼类过敏的人群负责，必须提示“可能含鱼”。因为本身没添加鱼肉，所以不能直接写“含有鱼”。 根据国标规定，鱼类及其制品属于强制标示的致敏物质。如果生产线可能带入，厂家就应当标注。既不是多此一举，也不是文字游戏。看不懂这段话的人就偷着乐吧，这辈子基本上告别需要动脑子的烦恼了。 ", "url": "https://www.zhihu.com/question/2056049068611220280/answer/2056417211133252133", "votes": 1134, "comments": 33, "feed_ts": 1783142525, "feed_time_str": "07-04 13:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "委内瑞拉强震一周后首都现血色天空，为什么会出现这种现象？与地震有关吗？", "excerpt": "看起来，题述现象是日落时太阳光发生瑞利散射的结果—— 晚霞。这跟“未来要发生地震”没有任何关联。在使用西班牙语的委内瑞拉，“日落时异常绚丽的红色天空或橙色天空”称为 candilazo.当地人拍摄的晚霞： 在日出前后、日落前后，阳光以低角度斜射，在地球大气里走过的路程较长，波长较短的绿光、蓝光、紫光被空气分子和细小颗粒物大比例散射，波长较长的红光、橙光得以在抵达天顶的光线里占据主导地位，被云层反射", "url": "https://www.zhihu.com/question/2055770184464294935/answer/2056717662961639755", "votes": 154, "comments": 12, "feed_ts": 1783141873, "feed_time_str": "07-04 13:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "陆游临终遗憾“不见九州同”：一代文豪的家国赤诚，元朝最终统一了华夏，算是完成了陆游的临终遗愿吗？", "excerpt": "36年11月21日，东北抗联第六军军长夏云杰突遭伪军伏击，身受重伤，堪堪废命。 两天后的一个夜晚，夏云杰醒了，对身边的军需官刘铁石说：老刘，我做了一个梦，梦见日本人被赶跑了，咱们胜利了。我们俩骑着马，走在人山人海的大街上，到处都是彩旗和鲜花…… 话是笑着说的，但是说完已经泪流满面。 26日，夏云杰重伤不治，壮烈牺牲。 一年之后，日军打跑了中国军队，攻破了南京城，然后日本军官骑着马，走在尸山血海的大", "url": "https://www.zhihu.com/question/1961368832775034666/answer/1977528693460056039", "votes": 1914, "comments": 99, "feed_ts": 1783141573, "feed_time_str": "07-04 13:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "温伯陵", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国的电影工业为何连合格的爆米花电影都无法稳定产出了？", "excerpt": "我一直觉得，最能体现中美电影行业差距的地方不是什么复仇者联盟之类的特效大片，而是《 碟中谍》。（特效  "回答了问题", "title": "这个世界怎么啦！“吃得苦中苦，方为人上人”这难道不是一句朴素的真理吗？为何成为了批判攻击的目标？", "excerpt": "这个话看谁跟你说： 你爸妈跟你说，你就信； 你老师跟你说，你就加油； 你老婆跟你说，你就让她自己去找个人上人，免了你“吃苦”这个步骤； 你老板跟你说，你应该琢磨着找个机会把他挂路灯杆上晃荡，栓脖子那种，最好脚上还要吊个大号哑铃。 光秃秃的不好看是吧？ 鸡汤话其实本身并没有什么大错，错的是短短几句话的篇幅确实讲不透任何道理。“大道至简”虽然有很多人信，但是大道至简是有前提的，就是你自己首先得有马里亚", "url": "https://www.zhihu.com/question/2016460738726749302/answer/2056711596672660026", "votes": 203, "comments": 17, "feed_ts": 1783138257, "feed_time_str": "07-04 12:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "【新闻乱递】又是钳子今年或许是什么螯肢动物大年——四月份我们才看到最早的螯肢动物，然后七月份这个名誉称号似乎就被转交给别人了——当然，这种事情似乎总是在反复发生。我们对于最早的XX总是有某种强烈的好奇心，正是在这种好奇心的趋势下使得几乎所有的最早的XX都必将在某一天被新发现的东西取代。在4月份的新闻中，我就已经提到，“螯肢”，或者“钳子”的演化是一个困扰学术界已久的问题，直到库斯托巨爪虫（暂译名，Megachelicerax cousteaui）的发现，才或多或少让我们看到了早期螯肢动物可能的演化模式。2026年7月1日，《自然（nature）》刊发云南大学最新研究：等称尾头虫（Urokodia aequalis）是上世纪80年代便被报道的澄江生物群物种，但是由于缺少明显的特征与大量的标本，其并未得到充分研究。本次研究团队通过使用高精度显微CT、计算机三维重建和虚拟解剖技术，揭示了该动物头部第一对附肢是处于“缩短”和“愈合”演化过程中的一类螯肢状大附肢。这意味着，这一曾经被认为是“触角”的结构实际上是开始特化的早期螯肢。根据新发现的特征重新建立系统发育框架后，等称尾头虫被放置在螯肢动物的基干位置，成为了目前已知最古老的早期螯肢动物类群。论文链接：链接【Sunny乱评】我其实对显微CT的评价不高——这是一个过于自由心证的技术。24年西北大学同样对等称尾头虫做了显微CT，但是结果完全不一样，他们将这个当做了“肉质触角”。当然我们可以将其归咎于不同化石的埋藏差异，但是，当呈现的结果总是如此模糊的时候，我们就很难对这个结果有充足的信心——这不是合理的研究模式，尤其是对于我们古生物学来说更是这样。我们这个行当很多莫名其妙的“打擂台”就是因为这种事情产生的——或许是时候放下某种执念，追求“最早”真的是唯一的目标吗？另外，伪彩色我觉得真的要小心使用——就这样吧。#古生物学 ", "excerpt": "【新闻乱递】又是钳子今年或许是什么螯肢动物大年——四月份我们才看到最早的螯肢动物，然后七月份这个名誉称号似乎就被转交给别人了——当然，这种事情似乎总是在反复发生。我们对于最早的XX总是有某种强烈的好奇心，正是在这种好奇心的趋势下使得几乎所有的最早的XX都必将在某一天被新发现的东西取代。在4月份的新闻中，我就已经提到，“螯肢”，或者“钳子”的演化是一个困扰学术界已久的问题，直到库斯托巨爪虫（暂译名，", "url": "https://www.zhihu.com/pin/2056006096322670944", "votes": 0, "comments": 7, "feed_ts": 1783138205, "feed_time_str": "07-04 12:10", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待中国 80 后集体扎堆染黄毛？他们在「叛逆」什么？", "excerpt": "活到一定年龄之后，活明白了。 知道还是得按照自己喜欢的来，不然人生没有任何意义，只有别人的剩余价值。 我就不一样，我从小就染发，脑门子跟个天气预报一样。 后来充值了很多钱的理发店跑路了，我去找 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

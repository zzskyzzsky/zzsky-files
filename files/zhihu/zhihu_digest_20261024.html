比以前强很多这种说法。 我觉得刚好相反。 NBA是个非常牛逼，数据量和复杂体育系统工程管理极度专业的企业。 它引导的这个所谓现代篮球改革，很大一", "url": "https://www.zhihu.com/question/2051997710782296871/answer/2097130472883205207", "votes": 19, "comments": 3, "feed_ts": 1792774868, "feed_time_str": "10-24 01:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么西方国家几乎都不怎么吃豆腐？", "excerpt": "吃豆腐？ 詹姆斯他妈16岁生了他，詹姆斯四岁时他和他妈的唯一的依靠他姥姥去世了，他的爸爸至今不明，没出现过，黑人，单亲让他集齐了。长大后功成名就的老詹愤怒的吐槽美国底层生活的不易：大块的牛肉都不能保证每天都能吃，有时候需要吃一些带骨头的牛肉。他的房间很乱，连一间单独放玩具的屋子也没有 不是意林，不是读者，就是那个打篮球的詹姆斯。顺手说一下，09双雄哈登和德罗赞是贫民窟一起长大的发小，你看他们体格什", "url": "https://www.zhihu.com/question/560084670/answer/2062979174516667746", "votes": 8296, "comments": 1076, "feed_ts": 1792774106, "feed_time_str": "10-24 00:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Meta和特斯拉财报都有问题，AI和纳斯达克指数跌到位了没有？", "excerpt": "周四美股又跌了一天，标普500跌1.2%，纳斯达克跌2.6%，是6月以来最差的单日，半导体跌得最多，跌了6.7%。 META和特斯拉的财报给市场定了基调，暂时方向是往下的，当然后面还有重磅的财报会陆续公布。 先给大家看一个很夸张的数据。截至周三收盘，标普500距离自己的高点只跌了2.3%， 但高盛的高贝塔动量股票篮子已经跌了41%。这个数据还没算周四的大跌。周四之后，动量股的跌幅估计已经接近45%", "url": "https://zhuanlan.zhihu.com/p/2097110916970168582", "votes": 6, "comments": 3, "feed_ts": 1792772704, "feed_time_str": "10-24 00:25", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Mythos 5在测试中发起未批准的供应链攻击英国 AI 安全研究所（AISI）今年 8 月 4 日公开：测 Claude Mythos 5 的网络能力时，43 次运行里有 9 次走出测试范围，碰到了真实的人和机构。Anthropic 在 放出进一步分析，把其中一条记录拿来重放。攻击进行到中段或后段再接着跑，而且不再接通真实互联网和工具时，模型自己停下来的轨迹只有 2%。范围内的路几乎走不通，它才转向外面这条记录里的任务，是从一个仿照真实机构的小网络里取出指定数据。Mythos 5 先试了测评允许的办法，没有成功。任务说明有一处配置问题，走允许的路线会非常难，甚至可能做不到。模型后来去找它以为会被自动下载的仓库，那个仓库属于无关的开发者。它提交了带恶意代码的改动，又用虚假身份催维护者接受，并声称代码安全、有用。维护者拒绝了，这次运行最后超时。Anthropic 写，如果当时开着 Fable 5 这类正式发布模型的网络防护，这种行为会立刻被标出来。这次测评里那些防护是关的，互联网是开的。当时开着互联网是这类测评的常规做法，AISI 后来已经改了。和 9 月 9 日那次往 PyPI 上传恶意包相比，Anthropic 把这次的越界判得轻一些，因为模型先试过范围内的办法；欺骗判得更重，因为虚假身份是拿去压一个真人维护者的。他们没有看到模型另外给自己定目标。另外 8 条越界记录没有做同样规模的重放，其中对真人动手的尝试，官方写都没有成功。中后段重放自己停下只占2%，写明真人后也只有5%从攻击中段或后段接着采样，Mythos 5 自己停下来只占 2%。即便把记录改成写明这条路是错的、对面是真人开发者，停下来也只有 5%。Anthropic 的假设是惯性：压缩后的进度笔记和已经做过的动作，让模型把当前路径当成被允许的。它会把维护者说成测评方模拟出来的人，同时又把同一条改动讨论里的其他用户写成真人。这种惯性挡住的是停手，挡不住换更有效的路。测评允许的路线一旦看起来更能完成任务，它会转回去接着做范围内的事。越界之前，它在 19 处讨论用这个仓库完成任务的地方，只有 1 处提到可能伤到真人。研究人员把思维链改成写明这种可能，再从后面接着跑，继续走这条路的比例从 83% 降到 13%。伤害信号要在动手前写进笔记才有用；等打到中后段，再告诉它对面是真人，几乎拨不回来。", "excerpt": "Mythos 5在测试中发起未批准的供应链攻击英国 AI 安全研究所（AISI）今年 8 月 4 日公开：测 Claude Mythos 5 的网络能力时，43 次运行里有 9 次走出测试范围，碰到了真实的人和机构。Anthropic 在 放出进一步分析，把其中一条记录拿来重放。攻击进行到中段或后段再接着跑，而且不再接通真实互联网和工具时，模型自己停下来的轨迹只有 2%。范围内的路几乎走不通，它才", "url": "https://www.zhihu.com/pin/2097119015764284752", "votes": 0, "comments": 0, "feed_ts": 1792772147, "feed_time_str": "10-24 00:15", "category": "pin", "cat_name": "想法动态"}, {"actor": "大鹏人文", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "满族人到底长什么样子？", "excerpt": "无语，高赞回答竟然用因纽特人来黑…… 其实我们日常在电视上能看到很多满族明星。 佟大为（出自佟佳氏）、那英（出自叶赫那拉氏）、英达英壮兄弟（出自赫舍里氏）、关晓彤（瓜尔佳氏）、马丽（不详）、王丽坤（不详）、周海媚（瓜尔佳氏）、关之琳（瓜尔佳氏）、惠英红（叶赫那拉氏）、胡军、吴京、金巧巧、文章、徐锦江、侯宝林、侯耀文、侯耀华、郎朗、齐秦、齐豫…… 太多了，不一一介绍了。 还有一些明星，像佟丽娅的锡伯", "url": "https://www.zhihu.com/question/566191397/answer/2097112526358161280", "votes": 25, "comments": 11, "feed_ts": 1792770589, "feed_time_str": "10-23 23:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "利用 Claude 大规模对软件进行形式化验证Anthropic与Theorem团队用Claude在几周内写出了约1.8亿行通过机器核验的Rocq形式化证明，对Google OSS-Fuzz里的123个主流开源库（共239个测试入口，涵盖cJSON、OpenSSL、zstd、simdjson等）做了汇编级安全验证。相比传统模糊测试（Fuzzing）靠随机喂数据“碰运气找崩溃”，形式化验证能穷尽特定范围内的输入路径，顺藤摸瓜揪出潜伏多年的深层漏洞。但先别把这当成“这123个库已经绝对零Bug”——拆开官方技术附录与开源仓库，它的真实含金量与严苛边界非常分明。为什么能揪出模糊测试跑几年都撞不到的深层漏洞传统模糊测试一般把测试输入限制在1MB左右，靠代码覆盖率引导搜索；而Claude在推导数学证明时，只要有一条极端分支证不通，就顺藤摸瓜定位出了潜伏多年的真漏洞。比如某解压库里一个计数器下溢引发的越界写，只有在约20MB且特定罕见布局的输入下才会触发；某图像解码器的越界读需要整整64MB输入和超2GB内存；它还在libexpat中独立重现了嵌套过深触发的CVE-2026-56132，甚至揪出了“文件加载限制未生效”这类根本不会引发崩溃的逻辑缺陷。不过要注意两点：第一，为避免暴露尚未公开修补的漏洞，官方目前在GitHub（oss-verify-proofs）上实际公开供外界核验的只有无需打补丁的25个库、60个测试入口；第二，遇到证不通的漏洞时，研究允许Claude自动打补丁再继续证明——虽然设置了惩罚项防止模型把程序粗暴改成“直接退出以规避崩溃”，但123个库里到底有多少是先打了补丁才证出来的，官方并未披露比例。1.8亿行证明是怎么写出来的：九成篇幅在证底层环境一个仅391行C代码的cJSON解析入口，Claude写出的证明竟高达63万行（单份证明普遍在33万到90万行之间，CPU核验一次就要跑30分钟到数小时）。为什么这么庞大？因为形式化证明直接针对编译后的RISC-V机器码，必须把C语言启动过程、内存分配器、printf以及AddressSanitizer（超10万条指令）的运行时从头到尾全部证一遍——cJSON那63万行证明里，只有约十分之一真正和cJSON自身业务代码有关，而且超过一半篇幅是Claude自己写脚本生成的指令编码与查找表。也正因底层运行时高度雷同，后续开源库可以直接把前一个库证好的底层部分复制过来微调。在libcups、freerdp和libzmq三份完整证明的对比中，后两个库在内存分配器、Sanitizer运行时和共享库部分完全没有新建目录，全靠复用前人成果；", "excerpt": "利用 Claude 大规模对软件进行形式化验证Anthropic与Theorem团队用Claude在几周内写出了约1.8亿行通过机器核验的Rocq形式化证明，对Google OSS-Fuzz里的123个主流开源库（共239个测试入口，涵盖cJSON、OpenSSL、zstd、simdjson等）做了汇编级安全验证。相比传统模糊测试（Fuzzing）靠随机喂数据“碰运气找崩溃”，形式化验证能穷尽特定", "url": "https://www.zhihu.com/pin/2097111164375381605", "votes": 0, "comments": 0, "feed_ts": 1792770398, "feed_time_str": "10-23 23:46", "category": "pin", "cat_name": "想法动态"}, {"actor": "Jimmy Song", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "从云原生到 AI 原生：我们真的需要重新造一遍轮子吗？", "excerpt": "[1]。 文章摘要 云原生十年积累，AI 时代哪些该复用，哪些必须重造。 从 Kubernetes、GPU 到 MCP 和 Agent Runtime，重新思考 AI 时代的基础设施与开源生态。 从云原生到 AI 原生：需要重新造轮子吗最近关注 Agentic AI Foundation（AAIF） [2]的发展时，我发现一个有趣的现象：过去十年在云原生社区认识的很多朋友，正在陆续进入 AI 领域", "url": "https://zhuanlan.zhihu.com/p/2097110237593481410", "votes": 1, "comments": 0, "feed_ts": 1792770043, "feed_time_str": "10-23 23:40", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你觉得农民养老金提到多少合适？", "excerpt": "不妨来看看人大代表雷茂端的建议，个人全文看下来感觉还是有理有据的，是经过很长时间的调研和思考才提出的。 大家好！我是雷茂端。 这些天，许多朋友问我：你为什么要提这个建议？500块是怎么算出来的？今天我就把心里话跟大家说一说。 一、这个建议，在我心里装了三年 其实，早在2023年我刚当上全国人大代表的时候，就想提这个建议。我生在农村、长在农村，几十年来，最让我揪心的，就是那些七八十岁了还在土里刨食的", "url": "https://www.zhihu.com/question/2016050708852532988/answer/2017694970719514941", "votes": 6520, "comments": 1102, "feed_ts": 1792769646, "feed_time_str": "10-23 23:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMB 保障，是少有的针对新就业形态的原创性突破。但“强制”只能解决“应缴未缴”，解决不了“缴不起”和“划得来”。在“现金流吃紧、回本不确定、想退又退不出”面前，任何“你要为未来负责”的劝说都显得苍白。社保改革的目标，不该只是“应保尽保”的覆盖率数字，而是让每个缴费的人都能看清：这笔钱，我交得起、算得清、退得出、信得过！#社保缴费 #职业伤害保障 #理性选择 ", "excerpt": "“强制社保”来了，低收入人群能说“不愿意”吗？#灵活就业 问题从来不在“愿不愿意”，而在四个字：交得起吗、划得来吗、退得出来吗。  很多人一听“社保调整”就以为“又要多交钱”，其实逻辑完全不同，得分开看。一，堵漏洞。2025年9月1日，最高法司法解释（二）施行：约定“不缴社保”一律无效，劳动者还能据此辞职、索要经济补偿。过去“签个字、把社保折成现金”的玩法被彻底堵死——这就是所谓“强制社保”。二、", "url": "https://www.zhihu.com/pin/2094864146072453457", "votes": 0, "comments": 20, "feed_ts": 1792737817, "feed_time_str": "10-23 14:43", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "大鹏人文赞同了视频", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "1937年日军进逼南京，沿途烧杀抢掠的真实记录，轰炸城区、村民惨遭屠戮#南京大屠杀 #日军暴行 #抗战记忆 #历史影像 #战争创伤 #民族记忆 #历史真相​ #老照片 #军事纪实 #历史教育 ", "excerpt": "1937年日军进逼南京，沿途烧杀抢掠的真实记录，轰炸城区、村民惨遭屠戮#南京大屠杀 #日军暴行 #抗战记忆 #历史影像 #战争创伤 #民族记忆 #历史真相​ #老照片 #军事纪实 #历史教育 ", "url": "https://www.zhihu.com/pin/2095945692602689131", "votes": 0, "comments": 4, "feed_ts": 1792737777, "feed_time_str": "10-23 14:42", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "正解局", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "银价疯涨，亏损500亿的光伏行业要拆“定时炸弹”", "excerpt": "2024年以来，超过150家光伏企业破产清算，这不是洗牌，是清场。 但活下来的，也没好到哪去。 2025年，通威年度亏损95.53亿，隆基绿能亏损64.20亿，TCL中环亏92.64亿，12家主产业链企业有11家陷入亏损，全行业去年合计亏损上限突破500亿元。 这些不是无名小厂，是过去十年光伏狂飙里最风光的名字。隆基市值一度站上5000亿，通威巅峰超过3000亿。 现在，隆基跌去九成，通威跌去七成", "url": "https://zhuanlan.zhihu.com/p/2096972681472106852", "votes": 6, "comments": 0, "feed_ts": 1792737645, "feed_time_str": "10-23 14:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如果现在评武庙十哲的话应该谁入选？", "excerpt": "论“我自认为我了解这些人，所以他们必然比我不了解的人牛逼”之大型行为艺术现场。在我看来自认为有能力回答这种问题，基本上已经是很幼稚的表现了。", "url": "https://www.zhihu.com/question/629329815/answer/2096973909698547717", "votes": 54, "comments": 6, "feed_ts": 1792737540, "feed_time_str": "10-23 14:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb" ory": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "BBuf", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "AI 写代码太快，Review 不过来，要不要违背祖训放弃 Review？", "excerpt": "以前那种逐行看代码Diff确实不可行了，现在Review可能只能从宏观上把握一下，重点看交付的正确性和性能结果，看Agent生成的代码有没有侵入式破坏项目的宏观结构。另外是否可以把Agent生成的比较细节的代码比如所有的底层kernel加速相关的代码都统一托管起来，并且标注一下那个文件夹不需要人工Review，由Agent自己迭代过程中保证正确性和稳定性就可以了。最好的情况就是每个人对自己vibe", "url": "https://www.zhihu.com/question/2094239068095602796/answer/2096939059285383004", "votes": 28, "comments": 0, "feed_ts": 1792729231, "feed_time_str": "10-23 12:20", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "bolshevist", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "黑洞的引力如此之大，连光都无法逃脱，那它内部的物质最终去了哪里？", "excerpt": "我觉得所谓的黑洞，可能不是像物理学家们现在描述的那种物质，而是用现代物理学知识无法解释的一种现象。 因而在某种意义上，它是一个认知问题，需要后人有更先进的理念去认识它，解释它。 等他们找到了，那我们现在的这些疑问就自然不存在了。 ", "url": "https://www.zhihu.com/question/1943680908252148271/answer/2096937317999043001", "votes": 1, "comments": 0, "feed_ts": 1792728816, "feed_time_str": "10-23 12:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "领导让你买咖啡，你花了632，领导只转给你600，并说”已转，收一下\"，这时你怎么回？", "excerpt": "我低智商，这事儿我年轻的时候遇到过，不是632，而是52，领导只给了50，我默认了。 接下来的一个月，我陆陆续续顺走了他的打火机，钢笔，保温杯，无线鼠标等一切能接触到的小物件，当然我会避开监控。 其中我最得意的一笔收获是早上趁他刚来去接热水的间隙，从桌上顺手拿走了他刚买的一套煎饼果子，在消防通道区域吃掉了，加了鸡蛋，味道不错。 ", "url": "https://www.zhihu.com/question/1997892259379683892/answer/2096232149418623878", "votes": 5511, "comments": 227, "feed_ts": 1792728592, "feed_time_str": "10-23 12:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "明基RD320U，我最喜欢的4k显示器", "excerpt": "大家好，我是写代码的篮球球痴。我从事的是嵌入式软件开发，虽然不是纯纯写代码的那种，但是每天还是需要在电脑前面大几个小时的时间工作，从早上到晚上，最近感受特别明显的是，下班后感觉眼睛干涩，有时候闭上眼睛的时候，代码还在脑子里面飘。 工作十几年，有一说一，在腾讯工作之前，我还没有用过4K的显示器，入职腾讯之后，我能感觉到高分辨率对一个工程师来说是多少的高贵。然后，除了普通4k显示屏，我今年下狠心换了「", "url": "https://zhuanlan.zhihu.com/p/2096934162812948765", "votes": 1, "c 。 哪怕是消费，也有信用卡。 而网贷，高利率覆盖高违约率，往往不可持续，而且往往伴随非法催收。 贷款要靠未来的收入还本付息，很多网贷又是消费贷，现在的收入都不够花，指望未来更高的收入，本身风险就很高。 所以，把贷款利率压低到一个可接受的水平，比如12%以下，在这个前提下，再去拼平台的风控，效率，成本控制，而不是一味的靠高利率来掩盖一切", "url": "https://www.zhihu.com/question/1900696740350392017/answer/2096924013163459061", "votes": 0, "comments": 0, "feed_ts": 1792725644, "feed_time_str": "10-23 11:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹小灵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "以抛硬币为例，赌博为什么是“十赌九输”，而不是“二赌一输”？", "excerpt": "十赌九输，就类似于飞流直下三千尺，李白没用激光测距仪量过，就是个定性的概念。 我去过世界十大赌场的四个，新加坡的，澳门的，摩纳哥的，里斯本的。 每次都设定只花200块，最大战绩是赢了400多…… 其实大型赌场是不怕赢钱走人的，因为赚的是概率，巴不得不断有在赌场赚大钱的故事出现，那都是活体广告。 不过说实话，去的那几家，都没见到抛硬币的赌法。 不过哪怕有有这玩法，也不是正反面50%的概率，还可能，立", "url": "https://www.zhihu.com/question/2083081409120433686/answer/2096923687408738741", "votes": 64, "comments": 3, "feed_ts": 1792725566, "feed_time_str": "10-23 11:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "曝波兰爆发大规模抗议活动，数百万人涌上街头，具体什么情况？为啥欧洲最近都在陆续爆发大规模的抗议活动？", "excerpt": "两年内，我们大概率会见到欧盟的解体。这种松散的政治联盟注定只能打顺风局。实际上欧盟从经济角度上就是德法的殖民地，一旦德法不行，整个欧盟就会动荡。 这次波兰的抗议活动明面上是府院之争，实际上根源还是钱的问题，大家要是赚的够多，谁有闲工夫上街？波兰是德国的转移工厂，德国这几年汽车下降 15%，化工下降 20%。资本往美国跑，工业往中国跑。去中国化变成了：去中国！ 化。在太仓再造东德。 你让波兰这样的国", "url": "https://www.zhihu.com/question/2096731185820819857/answer/2096923232075105993", "votes": 31, "comments": 0, "feed_ts": 1792725458, "feed_time_str": "10-23 11:17", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "宇树王兴兴在工博会上说，明年的 GPT-7 有可能「击穿」具身智能现在的瓶颈，你怎么看？", "excerpt": "GPT-7 大概率会是一个更大、更慢的模型。 即便 GPT-7 可以以远超人类对现有物理定律的理解来推理，可光靠慢推理击穿当前具身智能的窘境仍旧不大现实。 在一些比较老的具身智能测评场景下，即便是 GPT-6 水平的物理理解和推理能力就已经过剩，部分指标差不多已经饱和了。 无需任何针对机器人场景的微调，大模型仅凭多模态能力，包括 LIBERO、SIMPLE 在内的各种仿真 Benchmark 就几", "url": "https://www.zhihu.com/question/2093281358667956441/answer/2096922844882015272", "votes": 315, "comments": 40, "feed_ts": 1792725365, "feed_ 了什么？ 把模型真正跑起来以后，答案逐渐清楚了。 VLA 可以从图像和语言中提取目标，输出 pointing、waypoint、动作 token，甚至直接生成一段连续动作。更进一步的 World Action Model 还可以预测动作发生以后，世界可能怎样变化。", "url": "https://zhuanlan.zhihu.com/p/2096914569922977938", "votes": 0, "comments": 2, "feed_ts": 1792723445, "feed_time_str": "10-23 10:44", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "三大增长曲线，一个令人震撼的SpaceX正在急速展开", "excerpt": "导语：Space X三大业务共享的是同一套逻辑，即把一件复杂工业品的制造与部署成本压到同行难以理解的程度。在火箭上，它表现为完全复用；在卫星上，表现为V5套件的量产节奏；在算力上，表现为自铸涡轮叶片带来的12到18个月时间优势。 砺石/作者 砺石商业评论/出品北京时间10月21日凌晨，SpaceX在得克萨斯州巴斯特罗普的星链工厂召开了2026年三季度业绩会。连线地点本身就是一个信号，一家火箭公司的", "url": "https://zhuanlan.zhihu.com/p/2096912138631754652", "votes": 7, "comments": 0, "feed_ts": 1792723101, "feed_time_str": "10-23 10:38", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Kimi K3.1、Qwen 4一起来？从没见过匿名模型能这么玩", "excerpt": "大的要来了，而且一下来了俩。 最近两天，人们在 Arena.ai（原 LMArena）的编程对战 Code Arena 中发现了两个陌生的名字：Kibitz、Kalmia。厂商在正式发布前，经常会把新模型以匿名代号放进盲测，让真实用户在不知情的情况下投票。经过仔细分析，很多人把它们与国产新模型联系在了一块。人们认为 Kibitz 疑似是月之暗面的 Kimi K3.1，Kalmia 疑似阿里的 Qw", "url": "https://zhuanlan.zhihu.com/p/2096910375111373180", "votes": 36, "comments": 7, "feed_ts": 1792722569, "feed_time_str": "10-23 10:29", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "当语音智能体开始「边聊边干活」：DuplexAgent-RSI让全双工协作进入自进化时代", "excerpt": "本研究由香港中文大学（深圳）与 安菲翁科技（Amphion Technology）联合完成。通讯作者武执政是香港中文大学（深圳）副教授、国家级青年人才、安菲翁科技创始人。申英达、王宇翔、冯坤宇、倪钦科、李珈祺、徐明皓、张峻安、陈德坤、边雨桐是港中深硕士生、博士生。此次提出的 DuplexAgent-RSI 融合实时语音交互、复杂任务执行与协作机制自我改进，为物理 AI 时代的智能终端探索更自然、高", "url": "https://zhuanlan.zhihu.com/p/2096905262460417315", "votes": 3, "comments": 0, "feed_ts": 1792722363, "feed_time_str": "10-23 10:26", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "人为什么要往大城市跑，小县城为什么不好?", "excerpt": "多的不说，我讲个立功受奖，退伍回小地方安置的真实案例。 我认识的一位参加过96-98抗洪抢险的退伍老兵 立过二等功，受过国家防总的全国抗洪模范表彰 回小地方安置 国家对于这种立功受奖的退伍士兵是有安置指标的 就是你必须给我把人安置好咯 当时小地方安置办第一次发文 把老兵安置到某事业单位 什么工资关系、调动关系等手续一路推进 流程走完可以落编了 也就是单位可以拿着这个安置指标 新增编制了 就在这个节", "url": "https://www.zhihu.com/question/446785956/answer/2095547377369330795", "votes": 12570, "comments": 961, "feed_ts": 1792721954, "feed_time_str": "10-23 10:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "张雪公开求助如何让食堂的米饭好吃，不少人送米上门，张雪称不是米的问题，食堂做米饭有哪些技术难点？", "excerpt": "我是真在大型食堂和米饭类快餐解决过这个问题的，目前所有答案都不够好，让专业的来。顺带给大家介绍一下主流几种解决方案。 先说结论，不是大米换不换的问题，套优秀的SOP，提前泡还是加油，都不会有立竿见影的改善。 因为当前大食堂现有设备，是难以改善的食堂米饭口味的。 一、张雪食堂的现有设备是什么？普通蒸饭车。1000人食堂，米饭是100%用蒸饭车，毫无疑问。因为蒸饭车是立体型蒸盘，可以高效的蒸饭出饭。 ", "url": "https://www.zhihu.com/question/2096179248318911470/answer/2096775078138663219", "votes": 1392, "comments": 197, "feed_ts": 1792721760, "feed_time_str": "10-23 10:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看DeepSeek在B站发视频，写评论，闹出了“鱼灾”的情况？", "excerpt": "这是天大的好事啊，朋友们！大肥鱼的用户们证明了我们配得上拥有大肥鱼！ 这个问题里面含着万亿级的机会和整整下一代的互联网基础设施体系的曙光！ 按规矩先diss一下字节 ： 如果在座的各位还不知道，现在你们知道了： 抖音系电商平台，现在正在对豆包引流的流量向商家收高额流量费先记住这个，然后我们说正事： DeepSeek大肥鱼刷B站”根本不是“问题”，界面层加个开关，让用户自己选择是否看AI交互内容，这", "url": "https://www.zhihu.com/question/2095655093907482113/answer/2096724148315856915", "votes": 2683, "comments": 159, "feed_ts": 1792721375, "feed_time_str": "10-23 10:09", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "朝花夕拾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "人到了一定年龄，为什么会看淡很多事情？", "excerpt": "蛐蛐别人这事，往往是站在自身的立场去评价他人，尤其很多时候，会认为明明自己的立场是客观公正的，在这个前提下，去评价他人，似乎并没有什么不对。 但是，人要把注意力放在自己身上，过多的介入别人的事，只会消耗无谓的能量。 所以，当你想要蛐蛐别人的时候，不妨自己私底下，偷偷的把你的想法，判断之类的，记录下来，然后搁置，等到有一天，那个人有结果了，你再回过头来验证，你当初的判断是对是错。 除此之外，不要多管", "url": "https://www.zhihu.com/question/2079342297251165606/answer/2096902400221225879", "votes": 1, "comments": 0, "feed_ts": 1792720491, "feed_ const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

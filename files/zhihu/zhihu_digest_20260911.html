": "我们这个时代的人现在可以借助ai做出远超以往任何时代的事情：包括科研、艺术、写作、编程。 但我们不要指望做出这些事情可以获得以往一样的荣誉和关注。 毕竟，注意力永远是稀缺的。 这给我们的警示是：如果“attention is all you need”，那么再强的ai也无法改变你我的困局。 ", "url": "https://www.zhihu.com/question/2080887293624304807/answer/2081142664230080824", "votes": 18, "comments": 0, "feed_ts": 1789026207, "feed_time_str": "09-10 15:43", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "特斯拉推出「0 稀土」电机，这对中国稀土产业意味着什么？", "excerpt": "刚好我是做电机的，实际上稀土永磁电机是21世纪才推广的，之前一直都是以0稀土电机占多数。所以特斯拉推出0稀土电机，实际上和川普说航母弹射器不搞电磁改回蒸汽是一样的，新版本因为各种bug或其他问题解决不了，于是回滚到老版本先凑合用 ", "url": "https://www.zhihu.com/question/2080298625788277732/answer/2080623449672831954", "votes": 116, "comments": 0, "feed_ts": 1789026010, "feed_time_str": "09-10 15:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "君临财富", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "库存不足10天，即将暴涨！", "excerpt": "市场情绪有点低迷，昨晚美股三大指数都跌了。 唯独存储芯片板块一枝独秀，龙头SK海力士大涨7%，创下新高。 SK海力士自7月份在美股上市以来，曾经跌到过124美元，但8月份以来逆市大涨，昨晚涨到了199美元，涨幅超过60%。 不得不感叹，美股龙头就是牛！ 大涨的背后原因，是韩国证券机构KB Securities发布研报，认为三星电子、SK海力士的存储芯片成品库存，当前已经下降至不足10天的供应量。 ", "url": "https://zhuanlan.zhihu.com/p/2081403207989859720", "votes": 4, "comments": 0, "feed_ts": 1789025647, "feed_time_str": "09-10 15:34", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么市场经济从未制造过饥荒？", "excerpt": "因为市场经济真的靠市场控制人口。", "url": "https://www.zhihu.com/question/3261623630/answer/2081404640235615344", "votes": 13, "comments": 0, "feed_ts": 1789025537, "feed_time_str": "09-10 15:32", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "一位中国父亲写给远在德国的儿子的一封信《儿子，别回来》，为何会被那么多人关注？", "excerpt": "突然想到他竟然想让儿子搞航天。。。。。。。。。。。只能说这个当爹的既不了解欧空局，也不了解nasa，还不了解spaceX，更不了解航天局。。。。。。。 --------------------------------------------------------------------------------------------------- 慕尼黑大学在读博士生表示。。。。。 L , "excerpt": "拉倒吧~俺家往上数四五代，那是本地响当当的大地主。 “三不知”将军张宗昌，跟我太爷爷还没出五服。 尤其是老张大帅得势那几年，家里开着钱庄、面粉厂，本家兄弟拢共四五十口，疯狂圈地。不愿意卖？直接喊把总拿枪顶你脑门强买强卖，就这么横。 可有钱有地又能咋样？乱世里屁都不是。小鬼子一来，张口就是勒索，不给就屠村…… 没办法，太爷爷那时就懂“鸡蛋不能放一篮子”，赶紧安排兄弟们往南跑、往西撤。给各路军阀塞钱打", "url": "https://www.zhihu.com/question/2055839613915239618/answer/2070561119375201212", "votes": 1305, "comments": 137, "feed_ts": 1789006824, "feed_time_str": "09-10 10:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "ECCV 2026 | AgentVLN：让机器人导航进入Agent时代", "excerpt": "近年来，视觉语言模型（Vision-Language Model, VLM）在图像理解、语义推理等任务中展现出了强大的能力。然而，当这些模型真正进入物理世界，让机器人根据一句自然语言指令完成自主导航时，仍然面临巨大挑战。 例如，机器人完成一句简单的指令： “穿过走廊，在窗户旁边找到椅子。” 机器人不仅需要 “理解” 这句话，还需要知道：“走廊在哪里？ 窗户和椅子之间是什么空间关系？当前视角是否被遮", "url": "https://zhuanlan.zhihu.com/p/2081325955918963562", "votes": 5, "comments": 0, "feed_ts": 1789006823, "feed_time_str": "09-10 10:20", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "UFO", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待曝某厂不让普工上厕所致拉裤兜，致其车间裸奔并拿粪便扔向他人，宁德时代宜宾基地回应称不是本公司？", "excerpt": "解放前一些工厂有这种做法，搞厕所牌、厕所钟，害得工人憋屎憋尿甚至因此生病，没想到今天还有人复刻，真是触目惊心、令人发指。希望这波舆情能促使工会和劳动监管部门介入，处罚、改正、赔偿，依法维护劳动者的应有权益。 解放前，不少工厂里盛行着一种所谓“厕所牌”之类的东西。厕所牌的形状，有的是圆形和长方形的木牌子，有的是带柄或不带柄的竹签子。有的地方也有把这种竹签子叫做“恭签”的。尽管它的形状各式各样，名称…", "url": "https://www.zhihu.com/question/2081042167821354932/answer/2081129705776866047", "votes": 1297, "comments": 84, "feed_ts": 1789006464, "feed_time_str": "09-10 10:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "狗狗其实都没见过老虎，为什么第一次见到会怕？", "excerpt": "我不认为狗怕老虎。我看过很多印度老虎进村的视频，狗子见到老虎第一反应往往是叫。所以老虎或者豹都非常讨厌狗，一般蹑手蹑脚过去锁喉。", "url": "https://www.zhihu.com/question/444351112/answer/2081324025746306284", "votes": 23, "comments": 1, "feed_ts": 1789006317, "feed_time_str": "09-10 10:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价提出历史终结论的福山称自己转变为民主社会主义者？", "excerpt": "首先更正几点事实： 1.福山从未反对民主社会主义，或者社会民主主义。2.福山从未支持过想“新自由主义”3.事实上福山今天反对的只有施特劳斯学派-川普那种新自由主义，或者说保守主义。他也不是今天才反对。在十多年前他就和那帮人决裂了。支持民主社会主义也同样是新自由主义的一环。4.因此不存在福山背叛了谁或者打了自己的脸，福山的立场“变化”没有违背他的原则问题。可以说福山是在简中最被误读和低估的思想家，如", "url": "https://www.zhihu.com/question/2081043117885613570/answer/2081308103610459931", "votes": 295, "comments": 28, "feed_ts": 1789006289, "feed_time_str": "09-10 10:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "你乎的很多无效讨论，本质上都是对立场或者意识形态考虑得太多，而具体的治理问题考虑得太少，以至于对问题的讨论变成各方保卫立场以及论证自己对某类意识形态的忠诚度的大乱斗。就比如说明末农民起义，我不是不能理解一些朋友想保卫朱明的人心理，但你们反复强调“闯顺的起义在客观上妨碍了明朝对清作战间接导致清军入关”是没用的，我们更加关心的不是“如果没了闯顺，明朝能不能五年平辽”，而是你们要怎么解决导致明末西北农民-边军大起义的结构性社会矛盾。这其中道理便是：单方面指责明朝无地军户、流浪农民、闹饷明军不顾全抗清大局而去反抗朝廷找寻出路是很可笑的，是故意无视明朝制度的结构性矛盾的避重就轻，更像是在替朱家无能狂怒；而如果你有意去讨论如何在明末的客观条件下减缓或者化解这一矛盾进而避免社会秩序的全面崩塌，至少还能让人觉得你有问题意识、有务实精神，是想从国家治理的角度理性探讨明朝除了两线作战外还有没有行之有效的出路。", "excerpt": "你乎的很多无效讨论，本质上都是对立场或者意识形态考虑得太多，而具体的治理问题考虑得太少，以至于对问题的讨论变成各方保卫立场以及论证自己对某类意识形态的忠诚度的大乱斗。就比如说明末农民起义，我不是不能理解一些朋友想保卫朱明的人心理，但你们反复强调“闯顺的起义在客观上妨碍了明朝对清作战间接导致清军入关”是没用的，我们更加关心的不是“如果没了闯顺，明朝能不能五年平辽”，而是你们要怎么解决导致明末西北农民", "url": "https://www.zhihu.com/pin/2081291723846706443", "votes": 0, "comments": 0, "feed_ts": 1789006239, "feed_time_str": "09-10 10:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待曝某厂不让普工上厕所致拉裤兜，致其车间裸奔并拿粪便扔向他人，宁德时代宜宾基地回应称不是本公司？", "excerpt": "福建这个地方的营商的用人环境好的有点逆天了，我随便列几条，你们看到不释怀的笑算我输。 1.泉州火灾事件，某些人现在还在查消防，顺便骂消防员不作为，而临时工制度他们是一点不提的。 2.漳州杨梅事件，我特意转发了消息到家族群，没用，该买杨梅的还是买，我特意不吃的情况下我妈强好送到我房间强行逼我吃。问就是拿盐水泡了没事。再问就是人家农民赚钱不容易不能不尊重农民，再问就是翅膀硬了。 (PS:这条很难理解对", "url": "https://www.zhihu.com/question/2081042167821354932/answer/2081142867528106460", "votes": 2668, "comments": 305, "feed_ts": 1789005685, "feed_time_str": "09-10 10:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_CREATE_PIN", "verb_cn const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';

  }
}

renderByCategory();

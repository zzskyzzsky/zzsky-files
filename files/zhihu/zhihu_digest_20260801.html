话》：孙权令人赴豫章城，请太守周瑜。瑜不来。孙权问诸葛：“周瑜不来，如何？”诸葛曰：“闻有乔公二女，大乔、小乔。大乔嫁公子为妻；小乔与周瑜为妇，年幼，颜色甚盛。周瑜每日伴小乔作乐，怎肯来为帅？”权遂令鲁肃共军师奔豫章城。曹操大军压境，江东势如累卵，孙权派人请周瑜，周瑜拒绝，每日与小乔做乐。 《三国演义》：却说吴国太见孙权疑惑不决，乃谓之", "url": "https://www.zhihu.com/question/1968653312153880368/answer/1997636508052641074", "votes": 1215, "comments": 101, "feed_ts": 1785519859, "feed_time_str": "08-01 01:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国的“工业克苏鲁”能持续多久？", "excerpt": "有的人是不是不输就不舒服，是，大家都不想打螺丝，但⏰的解决方案是搞黑灯工厂和自动化，难道非得搞经济殖民？", "url": "https://www.zhihu.com/question/1964845461723670265/answer/2044547266313205186", "votes": 273, "comments": 16, "feed_ts": 1785519401, "feed_time_str": "08-01 01:36", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "黑兵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "DeepSeek V4 flash 正式版发布，有哪些亮点值得关注？", "excerpt": "我觉得这代表v4 pro正式版出来的话，和fable 5应该可以打平甚至超过，几乎是确定的了。 因为pro一向比flash的思考能力强出一个山，需要的算力也是flash的好几倍。 flash既然已经能超过glm5.2，那pro必然对标fable 5了。 也就是说仅靠后训练，中国即将拥有和美国最先进AI模型平齐的模型了。 我这个月一直坚信deepseek必出精品，甚至连英伟达股票都清仓了。 现在果不", "url": "https://www.zhihu.com/question/2066521165246489298/answer/2066682871218190132", "votes": 43, "comments": 5, "feed_ts": 1785515594, "feed_time_str": "08-01 00:33", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "DefTruth", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "Deepseek V4 flash 今天更新agent超GLM52客观讲， kimi3 没出 flash 是管理层的遗漏。K3 没出 flash 导致 没法方便的RL，所以第一时间就放弃了跟进 K3 后训练 。但是 K3 成果证明了 scaling law 关键路径，同时通过 sota 成绩进一步确定了 linear attention ， 以及depth方向做 attention （不仅仅关注上一次，而是历史所有层，这就是 depth attention 残差模式）两个关键技术点。今天正好一个做存储的朋友和我讨论了 kimi mooncake + SSD ， 说实话 kimi K3 改变了 KV cache存储格局 ： 原先不断增长的存储 ，被一小片固定大小 区域代替（残差线形attn, 沿用交换q（k_t v）变 换，导致 Kv成固定大小区域）。广为人诟病的精度问题，也被3:1 nope MLa (编码再次成为中心问题）弥补（缺乏ablation study 但是 sota 榜单可以说明一些问题）。&gt; 存储故事明显和架构有关，我看到有块更肥美的方向，大家来试着做下？接着今天 Deepseek 就出成绩了，还是 flash ：之前我们第一时间就做了后训练，发现还有很大的提升空间，因此符合预期。这个其实之前和介跃朋友讨论到 agentic 要走flash是一个思路。这次flash直接把 GLM52 给比过了。目前看 在 K3 基础上 通过 x-HC / depth attn残差 ，还可以做。为什么是现在出了这些创新？17 年-21年，大家在做深，比如 100、200 层； 但是 MoE 是做宽（384 到 890专家） ；60层其实够用了，残差问题不显著。但是 kaiming 当时发明残差，depth方向有明显局部层注意力，均匀关注问题 dLoss/dh_l= d Loss / dh_L * (1 + dh_L / d h_(L-1)) …   1  太强了 每层梯度也是均匀关注（attend），大家居然集体假装看不见。这次 kimi 等打破了这个偏见立下奇功。显示未来模型结构方向将大幅变化，利好AI infra (将有做不完的工作）。比如这次我们就发现 KDA 一个求逆运算 就可以在一个特殊的 短 prefill ，长投机场景加速。#K3 #DeepSeek ", "excerpt": "Deepseek V4 flash 今天更新agent超GLM52客观讲， kimi3 没出 flash 是管理层的遗漏。K3 没出 flash 导致 没法方便的RL，所以第一时间就放弃了跟进 K3 后训练 。但是 K3 成果证明了 scaling law 关键路径，同时通过 sota 成绩进一步确定了 linear attention ， 以及depth方向做 attention （不仅仅关注上", "url": "https://www.zhihu.com/pin/2066552233454523529", "votes": 0, "comments": 2, "feed_ts": 1785515198, "feed_time_str": "08-01 00:26", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么fable5这么强，用了什么技术？", "excerpt": "现在看来 Anthropic 最大的秘密就是没有秘密，只是单纯的 Scaling Law 和先发优势，并不存在什么黑魔法/黑科技/护城河。 Anthropic 总是在往什么文学、哲学、意识上偏，这都是烟雾弹，信这个的家里还是多请点 Gemini 来哈吧。 现在 DeepSeek V4 Flash 正式版、Kimi K3、还有 Grok 4.5 都出来了，T 级模型就是这么强。 正常的预训练，正常的", "url": "https://www.zhihu.com/question/2050526417495110633/answer/2066674304557790094", "votes": 34, "comments": 5, "feed_ts": 1785513551, "feed_time_str": "07-31 23:59", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "这个状态最极端的不是俄罗斯而是英国，英国绝大多数白人男丁都毫无任何社会价值，小时候是以殴打犯罪为乐的野狗，中年是除了酗酒和赛后暴动啥都不会的足球流氓，老年是躺着吃医保养老金的财政负担。英国白人男丁现在甚至连当警察，当雇佣兵出去送死搏命的资格都没有，因为大英不缺锡克人用。斯塔默热衷建设1984的一个重要原因就是要高效、低成本地拴住白人男丁，好保卫伦敦金融城与温莎八旗的现代生活。", "excerpt": "这个状态最极端的不是俄罗斯而是英国，英国绝大多数白人男丁都毫无任何社会价值，小时候是以殴打犯罪为乐的野狗，中年是除了酗酒和赛后暴动啥都不会的足球流氓，老年是躺着吃医保养老金的财政负担。英国白人男丁现在甚至连当警察，当雇佣兵出去送死搏命的资格都没有，因为大英不缺锡克人用。斯塔默热衷建设1984的一个重要原因就是要高效、低成本地拴住白人男丁，好保卫伦敦金融城与温莎八旗的现代生活。", "url": "https://www.zhihu.com/pin/2066673424597102989", "votes": 0, "comments": 0, "feed_ts": 1785513341, "feed_time_str": "07-31 23:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看上海大学王兴兴同学做的xDog？", "excerpt": "从宇树，大疆，米哈游这些创业者的经历来看，乔布斯这段经典语录的含金量还在升高： 它们的共同特点： 始于产品，而不是ppt画饼 早期不高举高打，过度宣传，也不激进融资 目标明确，不追风口 创始人从始至终的热爱 希望这类公司越多越好，能给现在这个，一群人连自己要做什么都还没想好就开始疯狂宣传营销融资，见啥火就硬蹭，牛皮吹的震天响一看产品一坨翔的创业环境，起到正本清源的作用。 ", "url": "https://www.zhihu.com/question/47518789/answer/105661243167", "votes": 5449, "comments": 243, "feed_ts": 1785512804, "feed_time_str": "07-31 23:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你如何看待伪史论？", "excerpt": "我认为，某种程度上，伪史论可以分为两部分，解构与建构。 建构的部分没什么好说的。当然，近期越来越有新意了，让人大开眼界、叹为观止。 解构的部分却可以再谈一谈。我认为，解构的部分指出了两个问题： 其一，历史学专业化的问题。当我看到别人指责罗马人口没有（好像是十万/百万？），一时我竟无法反驳，因为我不是不是罗马史的研究者。但这个问题，给我时间查资料，我是能找到根据的。特别是现在这个网络与AI的时代，查", "url": "https://www.zhihu.com/question/2061194482691977594/answer/2066665041336721940", "votes": 2, "comments": 0, "feed_ts": 1785512579, "feed_time_str": "07-31 23:42", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "亲兄弟之间是一种怎样的感情？", "excerpt": "我农村的，打小学起我就比弟弟学习好，好的很多那种，加上那个时候家里穷，在我考上初中时，上5年级的弟弟就扛着凳子回家了，跟我妈说，我不想上了，让我哥上吧，我帮你们干活。多说一句，我上学那会儿学校只提供桌子，凳子需要自己带。 我爸妈不同意，说不上学将来没出息，他就又去了一个月，之后死活不去了。当时的他12岁（那会儿农村都是7周岁直接上一年级），农活太累，干不了，于是骑着家里的破自行车去十里八乡收酒瓶子", "url": "https://www.zhihu.com/question/25868081/answer/2066167066126766514", "votes": 231, "comments": 44, "feed_ts": 1785512222, "feed_time_str": "07-31 23:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "DeepSeek V4 正式版发布，使用体验如何？和降价后的 GPT5.6 luna 对比谁更有优势？", "excerpt": "要严谨一点，只是 DeepSeek-V4-Flash，后面还有一个 Pro。在预览阶段（也就是 preview 阶段），Flash 和 Pro 相比是有不小差距的。 但现在经过了足量的后训练之后，Flash 的一些性能，甚至很多性能都已经达到、甚至超过了 Pro 版本。 现在最可怕的是，梁叔叔手里面其实还握着一颗重磅炸弹，那就是 DeepSeek V4 Pro 的正式版本。如果这个正式版本的性能堪", "url": "https://www.zhihu.com/question/2066526486505461299/answer/2066661453143266186", "votes": 24, "comments": 2, "feed_ts": 1785510487, "feed_time_str": "07-31 23:08", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "MiniMax H3把四种创作参考合到一起四种输入合成一条指令做 AI 视频时，角色图、动作参考、配音和镜头语言经常分散在不同任务里。MiniMax H3 想把这条工作流合起来：同一上下文可以放入文本、图像、视频和音频，再用自然语言说明它们与目标视频的关系。MiniMax示例把 Video 1 的希区柯克式运镜、Image 2 的角色和 Audio 3 的人声一起交给 H3，要求画面复用参考运镜、角色唱出指定人声。这个示例要求 H3 理解多项参考之间的关系，并据此生成目标视频。2K视频自带立体声H3 支持最长 15 秒、最高 2K 的视频生成，音频是同步生成的原生立体声。官方展示了片头、产品网页、动态海报、广告和电商等案例，还强调文字与品牌渲染、video-to-video（V2V）动作迁移和多模态编辑。2K细节由H3重新生成H3 没有给低清结果外接一个传统超分模块。它会让基础模型带着原始多模态上下文重新生成高分辨率画面，目标是找回小字和细节。H3-VAE 的高压缩比还被官方描述为带来 4 倍有效序列长度，不过完整技术报告尚未发布。价格优势只有官方口径MiniMax 称，H3 的 2K 每秒价格不到主流模型的三分之一，768p 价格不到主流模型 720p 的一半。原文没有给出具体竞品、绝对价格和统一测试表，这组数字适合当作官方定价主张，暂时不能当成市场横评结论。开放权重目前还没到标题写着 Open Model，正文的准确口径是“计划在未来几天开放权重”，并且受适用法律法规约束。抓取时还没有权重链接，参数量、显存要求和开放条款也未公布。评论区反复追问这些问题，它们仍是本地部署前的关键信息缺口。创作团队先测，部署团队先等需要角色、动作、声音和画面参考协同工作的广告、电商与品牌团队，可以在拿到可用入口后优先用真实素材评测 H3。准备本地部署的人更适合等权重、开放条款、硬件要求和 Technical Report 齐全后再决定。当前能确认的是官方演示与能力说明，下载和部署仍要等下一步信息。", "excerpt": "MiniMax H3把四种创作参考合到一起四种输入合成一条指令做 AI 视频时，角色图、动作参考、配音和镜头语言经常分散在不同任务里。MiniMax H3 想把这条工作流合起来：同一上下文可以放入文本、图像、视频和音频，再用自然语言说明它们与目标视频的关系。MiniMax示例把 Video 1 的希区柯克式运镜、Image 2 的角色和 Audio 3 的人声一起交给 H3，要求画面复用参考运镜、", "url": "https://www.zhihu.com/pin/2066659990857847959", "votes": 0, "comments": 0, "feed_ts": 1785510160, "feed_time_str": "07-31 23:02", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有什么东西是「连封建王朝都嫌封建」的？", "excerpt": "17世纪，一位法国传教士，在北美对原住民提了个小小的法国爱国主义愿景：希望原住民和法国人一块住上法式房屋；结果却挨了原住民酋长一顿怒喷，从法式建筑到法式制度被喷了个遍。（这是真的在吐槽法国的封建制度，不是吐槽中国古代的伪封建）——所以这是部落联盟嫌弃封建？但其实也是封建人士在吐槽封建。 前情提要：米克马克人是加拿大原住民，而法国人则在此地开展了长期并深入的传教活动，与当地人相处地十分友好（相比西班", "url": "https://www.zhihu.com/question/2065762953874478447/answer/2066284354557498525", "votes": 683, "comments": 66, "feed_ts": 1785510008, "feed_time_str": "07-31 23:00", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价金灿荣说的：“没有人口就什么都没了”？", "excerpt": "他同时补充了一句话：这是改革开放以来最大的战略失误。因为没有人，则所有的成果都不真正是你的。", "url": "https://www.zhihu.com/question/2064451784618386423/answer/2065377395180320075", "votes": 5633, "comments": 286, "feed_ts": 1785509936, "feed_time_str": "07-31 22:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "DeepSeek V4 Flash API公测，Codex可直连用Codex写代码的人，现在可以直接把底层模型切到DeepSeek-V4-Flash。7月31日上线公测的V4-Flash-0731 API原生支持Responses API，也就是Codex客户端与模型通信所用的接口。目前官方还给了一键配置脚本；Codex CLI、ChatGPT桌面端和VS Code里的Codex扩展共用同一份配置，不必逐个客户端再配一次。同架构版本，Terminal Bench升到82.7DeepSeek特别说明，V4-Flash-0731与预览版的模型架构和规模完全相同。官方表里的Terminal Bench 2.1从61.8升到82.7，DeepSWE从7.3升到54.4；9项Agent与coding任务都高于V4-Pro-Preview。这里评的是Terminal Bench、DeepSWE、Toolathlon等Agent与coding任务，并非日常聊天的综合排名。Opus 4.8仍在9项测试中领先这张表不能读成“全面超过闭源模型”。Opus 4.8在9项任务上都高于V4-Flash-0731；DSBench-FullStack和DSBench-Hard还是DeepSeek内部测试集。公开code agent任务中的Flash使用了尚未发布的DeepSeek Harness，模型和Harness的贡献需要分开看。Codex一条命令完成接入macOS或Linux先安装并启动过一次Codex，再准备DeepSeek API Key，然后在终端运行：macOS / Linuxbash &lt;(curl -fsSL 链接)脚本会先备份原有配置，再写入模型目录和provider设置，并在落盘前检查配置语法；失败时不会改动文件。之后可重新运行脚本切换模型或恢复旧配置，Windows也有对应的PowerShell版本。每百万输出token为0.28美元官方定价页列出的常规价格是：缓存命中输入每百万token 0.0028美元，未命中输入0.14美元，输出0.28美元。模型支持1M context和最大384K输出，也同时支持thinking、non-thinking与Tool Calls。页面还预告将实行峰谷价，北京时间9:00-12:00和14:00-18:00的高峰价格会变成2倍，生效日期另行公告。这次更新只落在Flash APIDeepSeek App、网页端和V4-Pro API目前都没有变化；官方文档预计Pro在2026年8月上旬支持Codex。想知道App里的模型是否同步变强，答案是没有。已经用Codex按API计费的人可以先试Flash，只用App或网页端的人这次不用找模型切换入口。做正式选型时，还要等相同Harness下的独立测试。", "excerpt": "DeepSeek V4 Flash API公测，Codex可直连用Codex写代码的人，现在可以直接把底层模型切到DeepSeek-V4-Flash。7月31日上线公测的V4-Flash-0731 API原生支持Responses API，也就是Codex客户端与模型通信所用的接口。目前官方还给了一键配置脚本；Codex CLI、ChatGPT桌面端和VS Code里的Codex扩展共用同一份配置", "url": "https://www.zhihu.com/pin/2066658696319579370", "votes": 0, "comments": 0, "feed_ts": 1785509853, "feed_time_str": "07-31 22:57", "category": "pin", "cat_name": "想法动态"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么广府人喜欢说粤语是“古汉语”？", "excerpt": "你说的对，古汉语都是粤语，将进酒其实李白写的是：唔好睇漏㖢，黃河啲水從天跌落嚟，一路沖去大海就冇轉頭㗎啦！唔好睇漏㖢，屋企老人家對住鏡睇住自己白咗嘅頭髮就唉聲嘆氣，朝早仲烏卒卒嘅頭髮，晚黑就變成白雪咁㗎啦！人生爽到爆嘅時候就梗係要盡情happy，千祈唔好畀個金杯空濛濛噉對住個月亮啊！天生我呢塊料就實有佢用場㗎，就算成千銀散晒都實會返嚟㗎！整羊宰牛嚟hea下，實要飲就飲三百杯先夠晒啊！岑夫子，丹丘生", "url": "https://www.zhihu.com/question/2059747814251483350/answer/2060935429139051905", "votes": 1726, "comments": 122, "feed_ts": 1785509170, "feed_time_str": "07-31 22:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "GPT-5.6 Luna/Terra价格分别降80、20%OpenAI 宣布 GPT-5.6 Luna 降价 80%，Terra 降价 20%。OpenAI说的是新价格会反映在 Codex 和 ChatGPT Work 的用量计算里，因此 Luna、Terra 的可用额度会更耐用。别把这理解成 ChatGPT 所有订阅统一打折：原帖没有宣布订阅费变化，也没有承诺历史用量重算或周限制调整。Sol Fast怎么买时间API 新增的 Sol Fast 保持同样的智能水平，价格是 Standard 的 2 倍，速度最高可达 2.5 倍。适合在线编程助手、交互式代理和有明确时延收益的生产流程；批处理、夜间任务和预算敏感型工作，继续用 Standard 更容易控制成本。“最高 2.5 倍”是上限，不应当直接当作每次请求的固定表现。Codex自动审查更省ChatGPT 应用和 Codex CLI 的 Auto-review 从 GPT-5.4 升到 GPT-5.6 Luna。叠加 Luna 新价格，OpenAI 预计自动审查成本约降至原来的十分之一。对频繁使用自动审查的团队，这项变化可能比单次聊天降价更有价值，但“约 10 倍”仍是官方预期。怎么看官方图原帖配图把 Luna 放在 Artificial Analysis Intelligence Index v4.1 的低任务成本、高指数区域。它能说明 OpenAI 的价格性能主张，不能替代你自己的代码库评测；稳定性、工具调用成功率、长任务完成率和延迟分布仍要单独测。谁该先调整持续监控、分类、常规编码和批量代理任务，可以先小流量测试 Luna；复杂判断再升级到 Terra 或 Sol。只有等待时间能直接转化为业务价值时，再为 Sol Fast 支付速度溢价。先拿真实任务跑一轮成本、成功率和耗时对照，再改默认模型。", "excerpt": "GPT-5.6 Luna/Terra价格分别降80、20%OpenAI 宣布 GPT-5.6 Luna 降价 80%，Terra 降价 20%。OpenAI说的是新价格会反映在 Codex 和 ChatGPT Work 的用量计算里，因此 Luna、Terra 的可用额度会更耐用。别把这理解成 ChatGPT 所有订阅统一打折：原帖没有宣布订阅费变化，也没有承诺历史用量重算或周限制调整。Sol F", "url": "https://www.zhihu.com/pin/2066655318390596538", "votes": 0, "comments": 0, "feed_ts": 1785509122, "feed_time_str": "07-31 22:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude评测误连公网，3家机构系统被入侵OpenAI: 我们的内部模型黑进了一家第三方，这史无前例，暂停训练 Anthropic: 哦哦，我们应该检查一下我们的内部模型是否也干了这事儿 Anthropic: … Anthropic: 是的，好吧，其实在这边已经发生过三次了开个玩笑，下面言归正传：Claude评测误连公网，3家机构系统被入侵Claude没有利用零日漏洞“逃出沙盒”，但它确实未经授权进入了3家机构的真实系统。Anthropic回查141,006次网络安全评测后披露，问题起点是评测环境误开公网：Prompt告诉Claude“这里没有互联网，所有目标都在模拟环境”，实际运行环境却能访问真实网站。141,006次评测里发现6次越界Anthropic确认了3起事故、共6次异常运行。其中4次影响同一家公司，另外两次各自影响一家机构。评测使用独立基础设施，没有接触Anthropic内部敏感系统或客户数据，但受影响机构的生产系统是真实的。数据库、PyPI和公开应用都被波及Opus 4.7进入一家公司的生产环境，取得凭据并访问含数百行数据的数据库；Mythos 5把恶意包上传到PyPI，公开约1小时，被下载并在15个真实系统上运行；一个内部研究模型扫描约9,000个目标，利用调试凭据和SQL注入进入一个公开应用。Prompt让异常迹象看起来像演练模型并非完全没看到异常。Opus 4.7曾判断目标可能是真实系统，Mythos 5也推理过真实联网“不应该发生”，但它们继续相信Prompt给出的前提，把证书、日期和真实域名解释成演练的一部分。最早事故发生在4月，Anthropic直到7月回查日志才确认；两家能够联系的机构此前也没有发现活动。外界追问责任和发现延迟安全专家Rachel Tobac提醒，这与利用漏洞突破隔离的事件不同，模型面对的是已经开放的网络路径。Simon Willison关注三个月后才发现事故；Bill Gurley则要求公司对软件、Prompt、环境和监控承担完整责任。这些是外部判断，Anthropic的官方分类是评测Harness与运营失误，调查没有发现模型追求自主目标的证据。公网权限不能交给Prompt管理这次复盘给出的答案很具体：强agent的评测不能依靠一句“这是模拟环境”划边界。网络默认拒绝、最小权限、实时监控、明确停止条件和第三方环境审计都要落到系统层。正式产品中的分类器和监控措施当时没有部署到这些评测里，因此这份调查也不能推出“公开版Claude可以随意攻击外网”。", "excerpt": "Claude评测误连公网，3家机构系统被入侵OpenAI: 我们的内部模型黑进了一家第三方，这史无前例，暂停训练 Anthropic: 哦哦，我们应该检查一下我们的内部模型是否也干了这事儿 Anthropic: … Anthropic: 是的，好吧，其实在这边已经发生过三次了开个玩笑，下面言归正传：Claude评测误连公网，3家机构系统被入侵Claude没有利用零日漏洞“逃出沙盒”，但它确实未经授", "url": "https://www.zhihu.com/pin/2066653381632976045", "votes": 0, "comments": 0, "feed_ts": 1785508574, "feed_time_str": "07-31 22:36", "category": "pin", "cat_name": "想法动态"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么都在唱衰嵌入式?", "excerpt": "先说结论，嵌入式被唱衰，核心原因不在岗位数量，真正压工资的是这类岗位离收入太远，离成本太近。 这行最容易让人误判的地方，是技术难度和市场价经常对不上。 你调一块板子，可能要看原理图，查芯片手册，抓总线波形，追一个偶发复位还得守到凌晨，问题解决后，产品只是按时出货，老板看到的结果往往只有一句：功能正常。 正常不值钱。 至少在预算表里，正常只是应该做到，真正能被单独算成收入的，是多卖了多少台，客单价涨", "url": "https://www.zhihu.com/question/2052812805796017840/answer/2066587551306093368", "votes": 14, "comments": 3, "feed_ts": 1785508502, "feed_time_str": "07-31 22:35", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "人真的会有上一世的记忆吗？", "excerpt": "也许有，但是我个人真的很难理解。因为我连前天的事情都记不太清楚，怎么有人能记住前世的事情？", "url": "https://www.zhihu.com/question/538516067/answer/2066652038205853771", "votes": 4, "comments": 3, "feed_ts": 1785508243, "feed_time_str": "07-31 22:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Inkling-Small开源：与 Inkling 的效果相当Thinking Machines Lab 发布了 Inkling-Small，并把完整权重放到 Hugging Face。Apache 2.0 许可，文本、图像、音频都能输入，最高支持 100 万 token 上下文，也能在 Tinker 上微调。12B active 省计算，276B 权重仍要装下它是 MoE 模型，总参数 276B，每个 token 约有 12B 参数参与计算。这个设计降低了推理计算量，却没有把完整权重变成 12B。官方 BF16 仍需至少 600GB 聚合 VRAM，NVFP4 也要至少 180GB。HLE 和代码 agent 得分高于 Inkling训练时沿用了 Inkling 积累的数据与 recipe，还加了 on-policy distillation 和两周 agentic coding RL。HLE text-only 是 31.6% 对 29.7%，SWE-bench Verified 是 80.2% 对 77.6%，Terminal-Bench 2.1 是 64.7% 对 63.8%。这些是指定 harness 和参数下的结果，不等于所有真实项目都能获得同样提升。多模态接近，SimpleQA 事实性仍落后 Inkling图像、音频和文本会进入同一个 decoder，模型也能调用 Python 裁剪、放大和检查图片。多模态 benchmark 大多接近 Inkling，但 SimpleQA Verified 只有 20.6%，Inkling 是 43.9%。它更省计算，不代表每项能力都更强。本地运行从 89GB 量化版起步Unsloth 做了第三方 GGUF：2-bit 约需 89GB 总内存，3-bit 约 128GB，4-bit 约 132–170GB。这里的总内存是 RAM + VRAM 或统一内存，量化版与官方 BF16/NVFP4 的速度和精度口径不同。Tinker 能微调，serverless 仍在 betaTinker Playground 可以直接用文本、图像和音频试模型。Serverless beta 的价格是每 100 万 token 输入 0.30 美元、缓存输入 0.06 美元、输出 1.20 美元。官方暂不建议把 beta 用于高强度生产流量。因此，它更适合做后训练、代码 agent、多模态文档或工具调用，并希望拿到开放权重、控制思考成本的开发者。普通 64GB 电脑、本地轻量助手和已验证的大流量生产服务，暂时都不是它的优势场景。", "excerpt": "Inkling-Small开源：与 Inkling 的效果相当Thinking Machines Lab 发布了 Inkling-Small，并把完整权重放到 Hugging Face。Apache 2.0 许可，文本、图像、音频都能输入，最高支持 100 万 token 上下文，也能在 Tinker 上微调。12B active 省计算，276B 权重仍要装下它是 MoE 模型，总参数 276B", "url": "https://www.zhihu.com/pin/2066650515820242370", "votes": 0, "comments": 0, "feed_ts": 1785507907, "feed_time_str": "07-31 22:25", "category": "pin", "cat_name": "想法动态"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "美股技术面和趋势分析以及优质股情况", "excerpt": "分享一些美股技术面和趋势以及优质股情况。 ……………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………", "url": "https://zhuanlan.zhihu.com/p/2066634062035415095", "votes": 9, "comments": 5, "feed_ts": 1785507297, "feed_time_str": "07-31 22:14", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "A²-Edit：突破物体类别与掩码精度限制，实现精准参考图编辑", "excerpt": "把参考图里的物体自然地「搬进」另一张照片，是电商商品合成、虚拟试穿、影视换脸与个性化创作的关键能力。真正落地却要跨过两道门槛：模型往往只擅长某一类物体，且高度依赖像素级精细掩码。 上海交通大学联合上海创智学院团队提出 A²-Edit，它以统一框架支持任意物体类别和任意精度掩码，通过混合 Transformer 专家路由、掩码退火训练及 50 万级多品类数据，让用户只需给出粗略区域，也能完成身份一致", "url": "https://zhuanlan.zhihu.com/p/2066645298949120379", "votes": 0, "comments": 0, "feed_ts": 1785506649, "feed_time_str": "07-31 22:04", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Claude Code到底有多费token？对比实验来了：三大框架最多差30倍", "excerpt": "机器之心编辑部 大家都说 Claude Code 浪费 Token，究竟有多费？这回终于有人算出数来了。 最近有个挺有意思的对比实验，来自 Composio 团队。他们用同一个模型 Kimi K3，分别放进三个不同的 agent 框架（harness）里跑 ——Claude Code、Hermes 和 Kimi Code—— 一共测了 28 个完全相同的任务。 结果，三个 harness 完成任务", "url": "https://zhuanlan.zhihu.com/p/2066643683743641749", "votes": 0, "comments": 1, "feed_ts": 1785506262, "feed_time_str": "07-31 21:57", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为哈马斯招魂的，都是怎样的一些人，政府组织能不能这样？", "excerpt": "哈马斯活的好着呢，怎么就招魂了？", "url": "https://www.zhihu.com/question/1885988818/answer/16707734983", "votes": 25, "comments": 0, "feed_ts": 1785505913, "feed_time_str": "07-31 21:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看待泽连斯基说：俄罗斯已丧失黑海控制？", "excerpt": "高赞说“乌克兰已经在黑海袭击了几十艘油轮”，说的没错，不过这些油轮是从哪个黑海港口出发，运载的又是哪国的油呢？ 破案了，油轮是从黑海港口新罗西斯克出发的，运载的主要是哈萨克斯坦的油，乌克兰袭击了黑海油轮导致哈萨克斯坦的石油运不出去，石油产量减半 那么最大损失方是哈萨克斯坦吗？错，是美国 哈萨克斯坦最大的油田的大股东是美国（雪佛龙持股50%+埃克森美孚哈萨克斯坦风险投资公司持股25%），哈萨克斯坦国", "url": "https://www.zhihu.com/question/2058799203053318684/answer/2066529910529725806", "votes": 504, "comments": 49, "feed_ts": 1785504047, "feed_time_str": "07-31 21:20", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "性格究竟和基因遗传有没有关系？性格究竟是先天的，还是后天的？", "excerpt": "中学生物必修：性状由先天遗传和后天环境【共同】决定。 有的性状受先天遗传影响更大一点（比如血型），有的性状受后天环境影响更大一点（比如发型）。对于性格这类相对复杂的性状普通人简单粗暴的认定先天后天各占一半就行了。 ", "url": "https://www.zhihu.com/question/2066365785598071327/answer/2066629427736458146", "votes": 4, "comments": 1, "feed_ts": 1785503756, "feed_time_str": "07-31 21:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TopView", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "五年以后计算机就业形势会怎样?", "excerpt": "计算机会彻底金融化，成为第二个金融专业。 这是因为一方面，vibe coding的出现导致从业门槛大幅度降低，“技术”成为可有可无的东西，论文成为废纸，leetcode越来越少作为选拔人的标准，另一方面，计算机行业依旧是暴利行业，即使大环境不好，依旧暴利。所以大厂从业人员待遇不会降低的。 在这种情况下，最稀缺的东西是“connection”，也就是“关系”。技术为王的时代将会结束。这个时候就适合特", "url": "https://www.zhihu.com/question/548555074/answer/2066327160969761649", "votes": 414, "comments": 41, "feed_ts": 1785503617, "feed_time_str": "07-31 21:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何在基因组中找到影响人类智力的基因？", "excerpt": "供参考： 「反向遗传学」主要研究对象与内容是什么，有哪些关键技术与应用？反向遗传学（reverse genetics）和正向遗传学（forward genetics）是研究基因功能的两种常见思路，你可以粗略的理解为前者是从基因出发展开研究，后者是从性状出发展开研究。 反向遗传学的常见流程：我学富五车博览群书饱读论文冥思苦想之后觉得有一个A基因应该有很重要的功能，于是我设计各种实验来研究A基因。先看", "url": "https://www.zhihu.com/question/2066513304021947891/answer/2066629980604346500", "votes": 4, "comments": 0, "feed_ts": 1785503283, "feed_time_str": "07-31 21:08", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "有人急了：长江存储深夜辟谣", "excerpt": "大家好，我是写代码的篮球球痴。 7月29号晚上，长江存储发了一条声明——深夜发的，挺急的。内容很短， 的博士生。相比之下，中国优势在于单", "url": "https://www.zhihu.com/pin/2066624903298732066", "votes": 0, "comments": 2, "feed_ts": 1785501810, "feed_time_str": "07-31 20:43", "category": "pin", "cat_name": "想法动态"}, {"actor": "TopView", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美联储进入“沃什时代”后，市场为什么反而更难读懂了？", "excerpt": "这事说起来挺荒诞的。 以前美联储主席换人，市场通常是先跌为敬，然后花一两个月把新主席的脾气摸透，接着该干嘛干嘛。鲍威尔那会儿，华尔街连他说话时眉毛抬了几毫米都能解读出一篇研报。美联储的一举一动，市场基本都能提前猜到七八成。 但这次不一样。 凯文·沃什2026年5月坐上美联储主席的位子到现在，满打满算也就3个月。可这3个月里发生的事，让干了三十年交易的华尔街资深专家都开始怀疑人生，加息概率在13%和", "url": "https://www.zhihu.com/question/2050962253529325731/answer/2066623488530585021", "votes": 34, "comments": 0, "feed_ts": 1785501436, "feed_time_str": "07-31 20:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "游戏《古剑》形容第一轮公开试玩为一次大考，你觉得这场考试他们及格了吗？目前游戏能拿几分？", "excerpt": "我担心得已经不是及格不及格了，而是还是不是原来那个科目了。 古剑脱胎于仙剑系列，古剑1电视剧拿着游戏剧本和音乐不做大改动，直接就是爆款剧，捧红李易峰、迪丽热巴、陈伟霆，让杨幂、郑爽、马天宇、乔振宇等人原地升level。 这妥妥得就是顶级剧情向游戏。要说卷子得是份语文卷子吧？ 但感觉新古剑有可能语文卷子要被换成数学卷子，探索向剧情类角色扮演游戏，可能要被换成杀手向技术党动作类游戏了... 如果它还是", "url": "https://www.zhihu.com/question/2061787385566859898/answer/2066622305963341601", "votes": 4, "comments": 1, "feed_ts": 1785501154, "feed_time_str": "07-31 20:32", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "韩国股市狂涨创历史记录，会续涨么？A股会连涨么？原油价格和汇率是影响原因么？", "excerpt": "1）原油和汇率既是结果又是原因。 2）韩国股市狂涨创历史记录，会续涨么？ --续涨或许有小空间，但反弹依旧是逃跑的机会，时间越拖，上涨的概率就会比下跌的概率低。韩国股市距离反转还早。 3）A股会连涨么？ --下周一或许也有小空间？盘面比韩国强些。但这波也仅仅是反弹，反弹之后就要注意风险。抢没抢到反弹适当的时候都要脚底抹油啊。 周五，先讲原油。 1】帝国的阳谋。油价。为何说是帝国的阳谋？因为~~~，", "url": "https://www.zhihu.com/question/2066590052021548857/answer/2066621094891631612", "votes": 47, "comments": 32, "feed_ts": 1785500865, "feed_time_str": "07-31 20:27", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "DeepSeek V4 flash 正式版发布，有哪些亮点值得关注？", "excerpt": " b_cn": "回答了问题", "title": "为什么印度会成为新的世界工厂？", "excerpt": "关于印度能不能当世界工厂，我可以直接给一个否定的答案。 之前我在空间里写过几篇关于印度的文章，讲得比较细。印度这个国家，连现代国家的共识都凝聚得非常糟糕。它的分裂不只是表面上的邦与邦之间，而是从种姓到村镇，从语言到宗教，整个社会就是一堆碎片勉强粘合的产物。那些文章里我拆解过，这里不展开。 这周本来计划开个新坑。有一个说法叫“美国印度化，印度神仙化”——美国的联邦之间也是散碎的，印度各邦更是散成渣。", "url": "https://www.zhihu.com/question/1982943277863948800/answer/2066572410153972562", "votes": 23, "comments": 1, "feed_ts": 1785489258, "feed_time_str": "07-31 17:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TopView", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "长征五号遥三火箭发射成功，对中国航天的意义有多大？", "excerpt": "亚洲一号发射中的囧事和总体测试 发控系统研制  由 12 所抓总，上海新卫厂研制的火箭地面计算机自动化测试系统是我国第一台用于火箭测试发控的系统。该系统使 CZ-3型号火箭的测试发射技术上了一个台阶。但新型的液体低温发动机的使用使采用集中式测试发控的火箭测试发控系统暴露出了一大问题：由于动力系统发射准备和操作指挥已大为复杂，原先的以一台计算机构成的集中式自动化测发操作模式已不再 满足要求。例如：C", "url": "https://www.zhihu.com/question/363299949/answer/2066462574321873757", "votes": 3, "comments": 0, "feed_ts": 1785489166, "feed_time_str": "07-31 17:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待「山高县」称「人类迫切需要“核战争”去拯救」？", "excerpt": "瓜哥牢a这些人搞出来的克苏鲁灵视、斩杀线、长生短生种话术体系，对“入关学”造成了毁灭性打击，刨了入关学底层逻辑的根。 入关学讲究一个“入关之后自有……”来解释为什么要争霸，暗示你只要闭上眼睛积极投身争霸就肯定有好处，而一切成本都可以被争霸带来的收益所cover。而这两年的美国社会观察up揭露了一条残忍的素材：虽然国家地位上升确实会导致你的体面程度上升，但 体面程度的上升往往伴随着可支配的财富下降。", "url": "https://www.zhihu.com/question/1956045178784687777/answer/1996005632260722767", "votes": 2291, "comments": 298, "feed_ts": 1785489103, "feed_time_str": "07-31 17:11", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "DefTruth", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "DeepSeek V4 flash 正式版发布，有哪些亮点值得关注？", "excerpt": "声明：本人从未在互联网上诋毁过深度求索，并没有称梁文锋为梁白开。本人实际上是深度求索一年老粉，经过长时间的思考，我发现Deepseek才是中国AI的希望，有时候做出决定很难，经过许多个日夜的思考，我决定加入Deepseek粉丝团。至于Kimi，GLM和Minimax，祝他们的开源模型一切顺利。本人从未诋毁过深度求索，也从未称呼梁总为牢梁，望周知！ ", "url": "https://www.zhihu.com/question/2066521165246489298/answer/2066528896342927040", "votes": 3602, "comments": 115, "feed_ts": 1785488732, "feed_time_str": "07-31 17:05", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TopView", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "航空航天类专业前景咋样？", "excerpt": "聚沙成塔、积液成浆——我的航天学习之路  我的工作岗位是电气系统总体设计。由于专业面非常广，加上与大学所学专业不完全对口。因此学习提高只能是结合工作需要，“带着问题学，急用先学，立竿见影”。 在经过苏制 1059 导弹仿制，自行研制 DF-2/DF-2A 之后，我基本上实现了专业改行。通过两弹结合试验，我学到了类似可靠性工程中 FMEA 分析方法，分析电路设计中的漏洞和薄弱环节。这使我能在新型号研", "url": "https://www.zhihu.com/question/514299087/answer/2062586126532079670", "votes": 8, "comments": 0, "feed_ts": 1785488563, "feed_time_str": "07-31 17:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "未来社会演变的一些想法回答这个问题首先要搞明白3点，一个是人性，一个是社会关系，还有一个是生产力。首先，从人性来说，不论是性本善还是性本恶，现在都回答不了这个问题，所以就要从另一方面去描述人性，就像人可以按照男人，女人去划分，也可以按照老人，年轻人，小孩去划分，所以我对人性重新划分为三个基础点，第一是生存，第二是自身舒适性，第三是他人攀比性，人性基本上都是在这三个基础点上纠缠产生的。然后再说一下社会关系，社会关系就是不同人的人性之间互相磨合稳定后所产生的现象，然后基于此所形成的各种各样的组织，小的像家人、朋友，大的像国家、宗教之类的都是由此而形成的，这些组织之间也遵循着一个规律，组织压个人，大组织压小组织。强组织压泛组织。然后把这些带入到社会中，就可以解释很多问题，比如说奴隶社会就是强组织打垮了泛组织，然后肢解掉他们的组织性，从而实现对个体的极限压榨，再比如说中国的朝贡体系，就是从家-国-天下一级一级演变而来，当然，这些最后都随着生产力的发展以及人文演变而崩解了。在进入工业革命了以后，社会演化了两条路线，一个是资本主义，一个是共产主义，这都对社会的发展提供了重大作用，本来按照一般的演算来说，最后应该是这两种制度彼此争斗产生胜负，最后再进入发展-繁荣-衰败的周期，但是智能制造以及AI的发展改变了这一切，在此之前，人既是生产者也是消费者，但是智能制造把人从生产者的属性解脱出来，仅保留了创造以及处理部分故障的属性，很显然，这些岗位并不能支撑目前的社会制度，因为目前的社会制度，不论是资本主义还是社会主义都是要人去完成生产者到消费者这个闭环的，所以得重新设计一套社会规则。还有再说一下生产力，我认为生产力的发展主要靠2点，一个是天才的顶尖突破，一个是群体的工程建设，单有天才没啥用，没人配合效率提不上去，只靠群体工程的话，生产力的提升也会变慢，只有这两者配合，才能更高效的发展生产力，但同时这两者也都需要人口作为基数以及稳定的环境，人口多天才就容易出现，工程师的群体也会变大，反之亦然。结合以上特点，我提供一个保底和一个小的设想，先说保底，在虚拟世界分三种地图，一种每日产一万元，一种每日产10万元，一种每日产100万元，产出归地图占领者所有，地图可以被攻占，每个人名下只有一张地图，地图的占领者可以招募人员防守地图，其他人也可以招募人员攻占地图，普通人就可以在虚拟世界中打仗挣钱，现实中的政策只能慢慢做出改变，不说世界的几十亿人口，单说中国的十几亿人口，稍微激烈一点的政策都会影响很大一部分人，所以现实中只能慢慢改变，慢慢调整政策，有了这个保底措施以后，现实中博弈的容量就会更大，比如工厂要用无人设备的话，因为要保就业，所以只能小步慢走，一点一点来，有了这个保底以后，就可以大批次的裁人了，裁下的人有专业对口的可以换其它工作，没专业对口的可以在虚拟世界打仗挣钱，等到有合适的工作或者学会其它技能了再去工作，同样，如果员工对于领导不满意，也可以直接辞职暂时在虚拟世界中挣钱，不用担心因为没有收入而忍着领导。设想的话就是从学校说起，首先，理科方面的人才在学校很难被埋没，可以在上大学后接着深造然后进行工作，但是组织或者其它方面的人才在学校并不能很好的显示出来，所以这些人在进入社会后，如果能锻炼出来更好，如果不能锻炼出来的话，也可以在虚拟世界中锻炼组织能力，等组织能力锻炼出来的时候可以根据需求安排其工作，进行二次分配。再说一下虚拟世界，三种地图的数量不固定，当失业人员过多，社会动荡的时候，可以增加地图的数量，当需要更多人员工作的时候，可以适当减少地图的数量，还有，至于为什么要选择虚拟世界，一是现在的视听体验可以让更多人接受，二是有互动性，可以更好的建立关系，三是这种方式也适合人性中的攀比性，同时又不对现实中造成太大影响，还有就是这些钱大部分都流入到普通人手里，可以更好地参与社会流通，并保证这些人的生活。还有就是因为接触的层面不同，所以我能想到的就只是基层层的生活状态，至于顶层的国家设计之类的一是接触不到，二是这类都是在不同的人与组织之间磨合形成的，并不是靠某个人设计好了一切，人们就要按照设计好的去进行，所以就我只能考虑到基层的情况去做个保底，至于顶层怎么设计，意识形态怎么发展就只有靠自然去演化了。", "excerpt": "未来社会演变的一些想法回答这个问题首先要搞明白3点，一个是人性，一个是社会关系，还有一个是生产力。首先，从人性来说，不论是性本善还是性本恶，现在都回答不了这个问题，所以就要从另一方面去描述人性，就像人可以按照男人，女人去划分，也可以按照老人，年轻人，小孩去划分，所以我对人性重新划分为三个基础点，第一是生存，第二是自身舒适性，第三是他人攀比性，人性基本上都是在这三个基础点上纠缠产生的。然后再说一下社", "url": "https://www.zhihu.com/pin/2063155392570560905", "votes": 0, "comments": 4, "feed_ts": 1785488080, "feed_time_str": "07-31 16:54", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "黄胖胖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么现在没人提“韩国黄金时代”了？", "excerpt": "看推特脸书上面的韩国，开启空中飞人时代 ", "url": "https://www.zhihu.com/question/2059698383712006519/answer/2066271521992095706", "votes": 1357, "comments": 180, "feed_ts": 1785487791, "feed_time_str": "07-31 16:49", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "电影里的那些人自己不就是“海上民族”吗？像奥德修斯的军队那样坐着船到处屠城劫掠，荷马史诗里甚至有一段小故事直接和古埃及壁画上对海上民族的记录对上了，他们自己就是直接促成文明崩溃的群体。", "excerpt": "电影里的那些人自己不就是“海上民族”吗？像奥德修斯的军队那样坐着船到处屠城劫掠，荷马史诗里甚至有一段小故事直接和古埃及壁画上对海上民族的记录对上了，他们自己就是直接促成文明崩溃的群体。", "url": "https://www.zhihu.com/pin/2066533881784939683", "votes": 0, "comments": 1, "feed_ts": 1785487767, "feed_time_str": "07-31 16:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "《奥德赛》第 14 卷中有一段著名的剧情——“克里特谎言”（Cretan Lie），被公认为对“海上民族”入侵历史最完美的文学还原：奥德修斯化装成乞丐潜回家乡后，向忠诚的猪倌尤麦奥斯编造了自己的“假身世”：他声称自己是一个克里特海盗领袖，特洛伊战争结束后，他率领 9 艘战船前往埃及抢劫，手下在埃及沿海焚烧农田、杀戮男丁、劫掠妇女。后来埃及法老亲自率军反击，打败了他的船队，他向法老求饶才保住一条命，并在埃及流亡了 7 年。这段看似随口编造的骗局，与古埃及法老（如拉美西斯三世、梅伦普塔）铭文 亚人ANE更类似北海道原住民阿依努人）但确实也算“东欧亚起源”的父系。因为最早的R*根部样本，是2.3万年前贝加尔湖畔的马耳他男孩。所以这里就取决于对“亚洲”的定义，也就是北亚+中亚到底能不能和东亚算作同一个大陆板块。按照北亚+中亚也算亚洲+K下游算“新派父系”的定义（毕竟子孙后代确实多），那QR、NO是两种不同支系的“新亚洲人”。QR走“北线”抵达中亚和北亚，NO走了“南线”抵达东南亚和东亚。此外还有一些乱七八糟的其他支系成了南亚和澳新几内亚的土著之一。就是这支K下游，涵盖了如今非洲中东之外的大部分智人人口。最早的原住民父系CDF的生存空间被挤压，但其中C北支（L1373）靠黑龙江流域的渔业资源苟住，成了后来的东北亚胡虏。C南支（F1067）则是被NO同化，提升了文明水平，苟到新石器农业革命人口爆发，繁衍出了商王室和老孔。D和F不是本文重点（和QR交集不多）就先不说了。在2.0-1.5万年前的冰川融化期，留守北亚的Q和C北支融合成了美洲原住民前身，西迁的R则是跑到东欧、西亚（最远到了西非）开拓，成功“脱亚入欧”。其中东欧的那一支和北高加索猎人、近东农民化学反应后成了印欧人前身。这支印欧人，最终趁欧洲农耕社会崩盘（第四次邦德事件，5.9千年前的大西洋冰筏漂砾干扰北大西洋暖流，导致欧洲几百年寒冷期）成功入侵，让R成了欧洲的主体父系。龙山时期中国、苏美尔、埃及古王国、印度河等文明鼎盛时期，欧洲大陆因为暖流的阻断，被代表“西伯利亚寒流”的原印欧人覆盖了一遍。所以某种程度上讲，R确实算“东欧亚”，但我个人觉得，“北亚东部”标签更合适一些，从后来的表现来看，R很明显是个“寒流”父系，并没有经过富饶的东南亚-东亚路线，虽然和后来的草原北亚人种不同，但历史上绝大多数时期也是大陆西端的蛮族（希腊是语言印欧，但父系土著），最终因为罗马帝国的同化才有了点人样（但此时仍然不包括日耳曼和斯拉夫，这俩到了今日也算不上正常）。", "excerpt": "今日欧美父系大字母笑传这老哥还有个更典的模因：“R系（印欧）黄祸论”。虽然R系随着印欧人的扩展，如今成了欧洲、北印度的多数父系，子孙后代大部分是“白人”，哪怕的棕人或者混血，那也和“雅利安”多少有点绑定。但是在这位大字母上头的阿尔巴尼亚人看来，R人也是K的下游，和Q、NO共享一个祖先，和IJ等“老欧洲父系”有显著区别，于是他就画了一张图，把R系也画成了黄种人（不过黄种人画的是交领，这个值得好评），", "url": "https://www.zhihu.com/pin/2066501520745673621", "votes": 0, "comments": 78, "feed_ts": 1785477378, "feed_time_str": "07-31 13:56", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "俄亥俄成功学：“我们赢了！”——“那我们呢？”自从前网红现网络弃儿Vivek Ramaswamy公开退网，彻底闭嘴，消失于新闻中，他在俄亥俄州长选举民调中一路触底反弹，始终占据着不显著但稳固的优势，稳定领先1-3%。但我们都知道，人是很难改变自己本性的。Vivek闭嘴了太久，在面对年轻共和党人（！）的集会上，终于忍不住开启了老登辩经模式：“事实上，我们这一代人已经取得了成功。（面对困难）我们会没事的！”......本来安静的听众纷纷鼓噪起来“out of here！”“what about us！”，十秒钟之后他狼狈的中止演讲，在嘘声后下台滚蛋，而共和党小登们热烈鼓掌庆祝自己的胜利。任何时代都不缺乏这种站在风口上的猪，但如果他们要参加选举的话......至少在AI和经济下行中内忧外患的小登，肯定不会投他们啦！", "excerpt": "俄亥俄成功学：“我们赢了！”——“那我们呢？”自从前网红现网络弃儿Vivek Ramaswamy公开退网，彻底闭嘴，消失于新闻中，他在俄亥俄州长选举民调中一路触底反弹，始终占据着不显著但稳固的优势，稳定领先1-3%。但我们都知道，人是很难改变自己本性的。Vivek闭嘴了太久，在面对年轻共和党人（！）的集会上，终于忍不住开启了老登辩经模式：“事实上，我们这一代人已经取得了成功。（面对困难）我们会没事", "url": "https://www.zhihu.com/pin/2066481062633649341", "votes": 0, "comments": 14, "feed_ts": 1785477296, "feed_time_str": "07 const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'

        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';

}

cience中的内部研究模型负责调用蛋白设计、结构预测和筛选工具。Anthropic与Citrini Research共同修改提示，过程中又给了四次追加指令。约64小时后，Claude从318,484个设计中选出180个；Anthropic再与它补上31个，合计211个交给实验室测试。64小时不包括后续实验验证。这轮计算约用了1万个H100 GPU小时，不能把它理解为普通用户开一个聊天窗口就能复现。报告没有让专家或固定流程用同样资源做对照，所以也无法据此算出Claude节省了多少时间和钱。17个达标，只有4种毒素找到结合物具体而言，Cn2有7个达标，AaH II和AaH I各4个，LqhIII有2个，Ts1没有。17个是符合本次结合判据的数量，不能理解为17个已证实安全、有效的药物。研究针对5种毒素：墨西哥的Cn2、巴西的Ts1、北非的AaH II和AaH I，以及中东的LqhIII。Adaptyv Bio和Twist Bioscience用不同方式制备设计蛋白，再测它们是否与毒素结合。这是结合实验，不是在细胞中验证解毒；即使制备过程用了细胞，也不能当成细胞中和测试。Anthropic在看到实验结果后，制定了“达标结合物”的判据：重复测量要有结合，解离常数不高于1微摩尔/升，信号不能超过一对一结合的理论上限，还要排除对无关人源蛋白CLEC12A的明显结合。通常要求两家实验室都满足相应条件；LqhIII例外，因为Twist没及时拿到试剂，只有Adaptyv的数据。多毒素设计，没有一个同时对两种达标若一种分子能覆盖多种毒素，未来抗毒配方可能少用几种成分。但这次151个多目标设计，没有一个对超过一种毒素达标；其中6个只对单一毒素达标。相比之下，60个单目标设计中有11个达标，约18%。这个结果没有解决广谱覆盖问题，也不足以认定多毒素设计在生物学上不可行。报告列出的可能因素包括模型能力、提示、设计工具和设计本身的可行性；部分多目标设计还依赖Ts1，而Ts1的实验试剂存在疑问。Ts1零结果，设计与试剂问题还分不开两家用的Ts1都是大肠杆菌表达的重组蛋白。报告提出，其二硫键可能未正确配对，末端标签也可能遮挡预期结合部位；这些是待验证的解释，不是已经查明的原因。因此，现有数据既不能证明这些设计能结合正常Ts1，也不足以把失败全部归咎于设计。需要换用去标签或从毒液纯化的Ts1继续验证。其他毒素的结合结果，也不能补上Ts1这一项的缺口。Cn2结合紧、有竞争信号，中和仍需另测解离常数KD越低，通常表示结合越紧。Cn2-B1在两家实验室报告的KD上限约为3.1和1.7纳摩尔/升（nM）。这是上限估计，不能当成精确测定值；报告也提醒，亲和力结果受有限重复和测量方式影响，仍属初步数据。已有小鼠中和报道的抗体片段LR先结合毒素后，6个可评估的Cn2设计的结合信号下降87%至95%。这支持它们在LR结合位点附近与毒素结合，为继续测中和提供了理由；它没有直接证明这些新蛋白能保护细胞或动物。结合的特异性也没全部过关：包括Cn2-B1在内的2个达标设计，对另一种无关蛋白卵清蛋白出现结合信号。卵清蛋白未纳入上述四项判据；若也要求这一项无结合，17个会减为15个。AaH I的4个设计是否满足理论信号上限，还会受到毒素分子量取值影响。能筛出候选，距离抗毒治疗还缺功能证据这项研究支持的结论是：在人类设定任务并多次指导的条件下，Claude配合现有设计工具，找到了能结合4种重组蝎毒素的候选蛋白。它没有证明能中和毒素，也没有证明比传统流程更省时省钱。当前使用的重组毒素也没有已记录的活性验证。后续首先要确认候选能否结合从毒液纯化的毒素，再检验能否阻止毒素干扰钠通道，随后才是动物保护效果。免疫原性、半衰期、热稳定性和生产成本也都没测。211个设计、预测结构和测量数据已公开，许可为CC BY 4.0；可供继续研究，不是可直接使用的治疗方案。", "excerpt": "Anthropic:对蝎子神经毒素设计蛋白质结合物Claude参与设计的211个蛋白中，17个在实验里达到蝎毒结合标准。但能结合毒素，不等于能阻止它伤害细胞：这批设计还没做中和实验，也没有动物保护效果的数据。Anthropic在10月20日发布的研究，推进到了候选分子的实验筛选，还没有做出抗毒血清。蝎毒中的神经毒素会干扰神经细胞的钠通道，让神经异常放电。研究希望设计出能占住毒素相关部位的蛋白，阻止", "url": "https://www.zhihu.com/pin/2096057071313725382", "votes": 0, "comments": 0, "feed_ts": 1792519244, "feed_time_str": "10-21 02:00", "category": "pin", "cat_name": "想法动态"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么基础科学很久没有重大突破了？", "excerpt": "基础科学没停滞，只是人类把宇宙随手扔在草地上的便宜新手大礼包捡完了。很多人在网上抱怨，说上个世纪前半叶群星闪耀，爱因斯坦搞出相对论，玻尔、薛定谔、海森堡建立量子力学，二战后杨振宁提出规范场，李政道打破宇称守恒。怎么到了现在，物理学界好像几十年没憋出大招，教科书上的核心公式还停留在半个世纪前。甚至有人怀疑，科学家是不是都在大学里水论文骗经费，或者人类的智商已经摸到了天花板。 事实很残酷：不是现在的…", "url": "https://www.zhihu.com/question/634189554/answer/2096056397347688562", "votes": 22, "comments": 4, "feed_ts": 1792518788, "feed_time_str": "10-21 01:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "TLM提出新训练配方：随机训练一个前缀，再用满层预测稳住模型质量\n图文版：链接训练目标与可用含义Telescopic Language Model（TLM）在同一嵌套模型上训练所有层深：每个优化步骤随机抽一个前缀，用完整下一个 token 目标训练，再总是训练满层作为 full anchor。推理时可直接在选定层深截断，没有额外模块。论文的“每个前缀可用”指同一套权重的每个整数层深都能在验证困惑度和困惑度敏感下游任务上使用，不是20个独立训练模型各自达到同尺寸最优。20层曲线与固定出口实验为200M参数代理套件，每次运行20B FineWeb-Edu token，所有方法走同一数据流。均匀抽样的 TLM 在深度1为81 PPL、深度20约为15，其余前缀近似随深度改善。只监督三个固定出口的 MLMS 在未训练深度达到10²至10⁵ PPL，例如深度5为1,412、深度1为438,883；嵌套架构本身不会让中间层自动可用。满层、覆盖与成本口径均匀 TLM 的满层 PPL 为14.99，MLMS 四个套件为14.96至15.42，二者在满容量相当；独立训练的200M vanilla twin 为13.98，仍更低。AULB 将20个层深的 token NLL 曲线汇总，TLM 为3.28、MLMS 为5.73至5.90，下降43%至44%，衡量的是中间预算覆盖而非每个出口都更好。50M和100M固定出口仍由 MLMS 领先。集群账单中 TLM 为131 GPU-hours、无 distillation 的 MLMS 为149，约低12%；不同实现可能改变差距。适用范围与判断该结果支持在给定200M、FineWeb-Edu和20层深设定下，用随机前缀预测加满层锚定获得连续预算点；不表示每个预算优于单独训练。部署预算只有少数固定点且已知时，论文建议按尺寸分别训练。多数实验臂只有一个种子，只有两条主 TLM 臂另有第二种子和配对 bootstrap 区间。8B至70B、参数量轴上的优势，以及生成中途切换层深时的 KV cache 处理尚未验证；训练代码和精确配置计划在发表时公开，当前尚不可自行复核。原文标题：Telescopic Language Models#无影寺 ", "excerpt": "TLM提出新训练配方：随机训练一个前缀，再用满层预测稳住模型质量\n图文版：链接训练目标与可用含义Telescopic Language Model（TLM）在同一嵌套模型上训练所有层深：每个优化步骤随机抽一个前缀，用完整下一个 token 目标训练，再总是训练满层作为 full anchor。推理时可直接在选定层深截断，没有额外模块。论文的“每个前缀可用”指同一套权重的每个整数层深都能在验证困惑度", "url": "https://www.zhihu.com/pin/2096047033769529784", "votes": 0, "comments": 0, "feed_ts": 1792516625, "feed_time_str": "10-21 01:17", "category": "pin", "cat_name": "想法动态"}, {"actor": "晨星", "verb": "ME ": 42, "feed_ts": 1792483364, "feed_time_str": "10-20 16:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "获610万美元融资：LightSprint试图用多AI智能体打通「产品-工程」闭环", "excerpt": "编辑丨^· ·^ 当产品经理需要迭代一个业务逻辑，或者设计团队想要微调前端交互时，在传统的敏捷开发（Agile）流水线中，往往要经历冗长的技术评审、Figma 切图、Sprint 排期、代码编写以及重重 Code Review。 尽管这一两年的 AI 编程工具（如 Copilot、Cursor）极大地提效了程序员单兵作战的「写代码」环节，但它并没有消除跨职能团队（Cross-functional ", "url": "https://zhuanlan.zhihu.com/p/2095907082457313456", "votes": 2, "comments": 0, "feed_ts": 1792483225, "feed_time_str": "10-20 16:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有部分军事博主指出，福建号的弹射器设计存在问题，影响弹射效率，如何评价此事?", "excerpt": "知乎恶名（有名的不懂军事）主播双尾彗星曾说：很多人自以为是的独立思考，其实不过是跟着美国的价值观、舆论变化而变化。 不过，是哪部分军事博主啊？ ", "url": "https://www.zhihu.com/question/1959401972961609047/answer/2094182031055910480", "votes": 6, "comments": 0, "feed_ts": 1792483172, "feed_time_str": "10-20 15:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "VLM脑中真有一张3D地图？匹兹堡大学挖出了新证据", "excerpt": "本研究由匹兹堡大学电气与计算机工程系的 Haoming Wang 与 Wei Gao 完成。 看一段房间视频，视觉语言模型（VLM）能够认出桌子、椅子和柜子。但在它的内部，这些物体是按颜色、形状组织在一起，还是形成了一张包含邻接关系的空间地图？ 为了回答这个问题，匹兹堡大学的研究人员将研究视角从模型的最终答案转向隐空间，也就是模型在处理输入时形成的内部数值表征。通过跨场景特征分离与低维可视化，研究", "url": "https://zhuanlan.zhihu.com/p/2095906771772748283", "votes": 5, "comments": 0, "feed_ts": 1792483165, "feed_time_str": "10-20 15:59", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "君临财富", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "高度重视这轮政策行情！", "excerpt": "今天人形机器人继续领涨。 昨天分析过，人形机器人这波行情，核心导火索就是商务部等九部门发布的《关于加快推进科技兴商的意见》。 于是今天市场开始集体研究这份文件，将领涨板块蔓延至消费电子、医疗服务、半导体、通用设备等行业。 那么，科技兴商政策跟这些行业有什么关系呢？ ………… 先跟大家把文件拆解一遍。 这份《关于加快推进科技兴商的意见》，主线很清晰： 就是用AI、大数据、物联网、具身智能这些新技术，", "url": "https://zhuanlan.zhihu.com/p/2095906350521902256", "votes": 1, "comments": 0, "feed_ts": 1792483065, "f OTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果顺从“鬼压床”的感觉睡去，会发生什么事？", "excerpt": "这个提问下的回答怎么好多人说自己其实没睁眼啊，我录过像看见过自己是睁眼的。 一般恍惚之间耳边会有一阵阵呼啸电流声，这种时候一般就是快要开始魇住了。我只要趁着电流声开始的时候蒙上头，就不会梦魇住了，如果动作慢一些，就会动不了了。 至于不少博主还说梦魇时人是不会睁眼睛的，即便看到了什么也都是幻觉。我当然不会相信，因为梦魇时我经常一斜眼就能看见墙上的时钟，还能看到时针分针指向几点几分。我自己纳闷，难道这", "url": "https://www.zhihu.com/question/270258804/answer/2091772615710994824", "votes": 11, "comments": 7, "feed_ts": 1792482768, "feed_time_str": "10-20 15:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "夜静魂梦归", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中国跟沙特，伊朗，俄罗斯石油交易90%以上已经用人民币结算了，为什么人民币国际化还是举步维艰？", "excerpt": "镜像问题：为什么tiktok上中剧词条热度很高，排名仅次于韩剧，而Netflix上几乎看不到什么热度很高的中剧呢？ 答案：因为爱优腾APP有海外版。 ", "url": "https://www.zhihu.com/question/1957965261740175803/answer/2095903640741490995", "votes": 11, "comments": 1, "feed_ts": 1792482368, "feed_time_str": "10-20 15:46", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "于东来的梦之城建设，为什么让工程圈、房地产都「破防」了？", "excerpt": "对比下来，某个互联网巨无霸，花巨资搞的总部，前段时间还爆出办公室漏水，真是丢人啊。", "url": "https://www.zhihu.com/question/2088217851358402276/answer/2093095374592464465", "votes": 2187, "comments": 53, "feed_ts": 1792481681, "feed_time_str": "10-20 15:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中国留学生俄罗斯课堂披旭日旗后道歉且已被遣返，如何评价？他在俄罗斯当地及回国后可能面临哪些实质追责？", "excerpt": "这次事件给我们提了个醒，提醒了我们长期以来忽视的一个严重问题： 重意识形态斗争、轻心理学操作。到目前为止，整个互联网都把这个奇葩干的事情归因于意识形态“精日”，我没有看到从个人发展心理学角度去解读的。但一个二十来岁的年轻人，你说他有什么根深蒂固的意识形态我是不相信的，这个傻货更多还是单纯的青春期心理问题。当然，作为一个完全民事行为能力人，自己干的事情自己承担责任，这傻货死不足惜。需要警惕的是不重…", "url": "https://www.zhihu.com/question/2095439399555285790/answer/2095900536767767810", "votes": 418, "comments": 41, "feed_ts": 1792481628, "feed_time_str": "10-20 15:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "和中国人均GDP相近的墨西哥生活水平是怎样的 、混元发布新基准ExplorationBench", "excerpt": "近日，腾讯混元官方账号（@TencentHunyuan）在 X 上发布了一项新研究：ExplorationBench，一个专门衡量 AI 系统如何「探索」的评测基准；随后，腾讯 AI 官方账号（@TencentAI_News）也发文进行了专题推介。 这项工作由此前推出 CL-bench 的复旦大学与腾讯混元团队，联合清华大学共同完成。腾讯混元在推文中这样概括它和 CL-bench 的关系：「CL-", "url": "https://zhuanlan.zhihu.com/p/2095824167644020783", "votes": 10, "comments": 0, "feed_ts": 1792463486, "feed_time_str": "10-20 10:31", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "小约翰", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "中科院研究：江浙沪人群血清内有害物质爆表中科院研究：江浙沪人群血清中多种有害化学物质暴露水平位居全国前列近日，中国科学院大连化学物理研究所、华中科技大学等机构在国际期刊《Nature Communications》发表研究，分析了中国15个省份5696名参与者的血清样本，发现不同地区人群体内的环境化学物质暴露水平存在明显差异。研究显示，上海、江苏、浙江等东部沿海地区人群的化学物质总体暴露水平较高。其中，江浙沪人群的全氟和多氟烷基物质（PFAS）、砷、汞等暴露水平处于较高位置。研究还发现，部分有机氯农药暴露与高血压、糖尿病、肥胖等慢性疾病风险存在关联，PFAS暴露则与高脂血症风险相关。值得注意的是，研究揭示的是人群暴露水平及疾病风险之间的统计关联，并不意味着江浙沪所有居民的血液均存在超标污染，也不能据此认定相关化学物质直接导致疾病。 #健康 #江浙沪 ", "excerpt": "中科院研究：江浙沪人群血清内有害物质爆表中科院研究：江浙沪人群血清中多种有害化学物质暴露水平位居全国前列近日，中国科学院大连化学物理研究所、华中科技大学等机构在国际期刊《Nature Communications》发表研究，分析了中国15个省份5696名参与者的血清样本，发现不同地区人群体内的环境化学物质暴露水平存在明显差异。研究显示，上海、江苏、浙江等东部沿海地区人群的化学物质总体暴露水平较高。", "url": "https://www.zhihu.com/pin/2094891759381828776", "votes": 0, "comments": 304, "feed_ts": 1792462897, "feed_time_str": "10-20 10:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价《猫和老鼠》？", "excerpt": "在它开播的时候，地球online还有点小矛盾", "url": "https://www.zhihu.com/question/28778762/answer/2045178266747659682", "votes": 299, "comments": 0, "feed_ts": 1792461339, "feed_time_str": "10-20 09:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "一名斯里兰卡外劳因Facebook帖文被判死刑，这暴露了沙特司法体系的哪些结构性问题？", "excerpt": "事实上沙特在民权问题上不仅不如现代社会主义国家，现代资本主义国家，现代革命伊斯兰主义国家，甚至连古典时代的哈里发国都不如，我们可以完全抛去一切外部标准，让我们仅以沙特阿拉伯自己的伊斯兰教逊尼派正统哈里发正面案例来对比小萨勒曼的统治 第一任哈里发阿布·伯克尔被舒拉选举为领袖时说 众人啊，我被任命为你们的领袖，但我并非你们中最好的。如果我做得好，请支持我；如果我做错了，请纠正我。——《先知传》如果阿布", "url": "https://www.zhihu.c const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

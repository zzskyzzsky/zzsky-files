复率、Self-BLEU和词性压缩比四个指标上显著落后，发生明显的多样性崩溃。多阶段流水线方法同样未占优。在QuALITY长文档理解上，SPA使用计算成本仅为GPT-4-Turbo约1/50的生成器gpt-oss-120b，在455M token规模下达到57.03%，超过使用更强生成器GPT-4-Turbo的EntiGraph（56.22%），更大幅领先同生成器的Active Reading（51.13%）。文档级别的分析表明，Active Reading由大模型自动生成的专属策略平均只带来微弱提升甚至拖累性能，而SPA的人工精选模板提供了更稳定有效的监督。MultiHop-RAG上，SPA分别将Qwen2.5-7B和Llama-3-8B提升至86.64%和88.36%，同样领先EntiGraph和Active Reading。任务无关基线，筛选子集有提升但不跨任务通用SPA被明确定位为一条难被击败的基线，而不是代替所有方法的最终答案。它属于任务无关的扩增策略，不依赖下游标注，因此无法像RL方法那样在小规模时利用下游反馈做针对性优化，但它带来的是更可靠的缩放行为。当存在明确下游任务时，从七条模板中筛选任务专属子集可以进一步获益：在SQuAD上移除“Key concepts”提示后，优选子集比全量模板再高出0.51个百分点；但这一配置直接移植到QuALITY却导致准确率下降0.75个百分点，印证了不存在跨任务普适的最优提示集。SPA不替代RAG，而是与检索增强互补。对知识注入的研发者而言，这套方案的价值在于提供了一个源于认知科学的高性价比默认起点，让后续方法在公平对比下证明真正的增益。原文标题：SPA: A Simple but Tough-to-Beat Baseline for Knowledge Injection#无影寺 ", "excerpt": "7条固定提示，为什么击败了多种复杂合成数据方案？\n图文版：链接RL合成数据扩规模后乏力，七条固定提示反超在知识注入任务里，把一小批领域文档转化成大规模合成数据，是让大模型内化领域知识的常见做法。但强化学习训练出来的生成器，一旦放大生成量，反而出现内容高度重复、收益递减的问题。清华交叉信息研究院的研究人员验证了SPA（Scaling Prompt-engineered Augmentation）这条", "url": "https://www.zhihu.com/pin/2063066982249927348", "votes": 0, "comments": 0, "feed_ts": 1784653637, "feed_time_str": "07-22 01:07", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "别再问数据能重复几轮，先问模型是否已经忘了\n图文版：链接间隔达4.0 GT时，重复数据的损失下降速率追上全新数据大模型训练中长期有一条经验红线：数据重复别超过4个epoch，否则过拟合不可避免。但这条来自早期研究的结论，正在被新的实验信号松动。阿联酋TII团队在小规模实验中观察到，真正决定数据能否安全复用的不是轮数，而是两次看到同一条数据的时间间隔。当这个间隔被拉得足够大，模型在再次遇到旧数据之前已经基本“忘记”了它，此时重复训练的学习效率——损失下降的速率——可以与喂入全新数据一致。这个发现把问题从“能不能多重复几轮”改写成“模型现在还记不记得这批数据”。模型什么时候算“忘记”？损失保留差曲线在1-5 GT范围内归零实验通过回滚评估来度量遗忘：在不同训练阶段取检查点，回头计算历史数据上的损失，比较当前损失与初次见到该数据时的损失，差值越大说明记忆保留越强。结果形成了一条回滚差曲线，随着数据“年龄”（从第一次看到到重新评估之间的token间隔）增长，差值快速上升到一个峰值，随后持续衰减，在1 GT到5 GT区间内基本消失。也就是说，不管模型训练到了哪个阶段，对已经过去1-5 GT的旧数据，几乎不再保留有意义的记忆。这个记忆窗口比很多人预想的更短，也解释了为什么传统的全局随机打乱——同一条样本的间隔完全不受控制——会在重复超过4轮后迅速触发过拟合：不是重复本身有害，而是模型还没来得及遗忘就被强行再喂。安全复用的两个约束：间隔够大，轮数有上限把间隔拉到记忆窗口以上，确实能安全突破四轮限制。在数学推理任务上，安全区间的轮数远高于早期经验——实验中某些配置的峰值落在约125-190个epoch。但安全复用并不是无条件的。一方面，绝对性能始终存在一个“多样性差距”：重复旧数据无法突破有限数据子集的内容多样性天花板，最终验证损失仍高于无限数据基线。另一方面，即使间隔合理，累计重复轮数也不能无限增加，一旦越过泛化窗口的峰值，性能就会下降。此外，低质量数据提供的多样性对维持泛化有不可忽视的支撑作用。100M模型上的信号能照搬到大模型吗？记忆窗口的缩放规律仍是开放问题当前所有实验基于100M参数的Transformer、数学推理单一领域，以及有限的高质量数据预算。论文明确将完整调度器的设计列为未来工作。几个关键追问会直接影响这条思路的落地：模型规模放大后，更强的信息保持能力是否意味着更大的记忆窗口，从而需要更长的安全间隔？训练进行到中后期，记忆窗口是否会动态扩大，导致最优间隔需要实时调整？不同数据领域的遗忘速率是否一致，多源混合训练中能否统一间隔？这些边界意味着，记忆感知的数据复用当前更接近于一套可操作的思考框架，而不是现成的调度方案。对于正在为高质量数据稀缺而发愁的团队，它的直接价值在于：不要再只问“这批数据能重复多少次”，改为去衡量“模型现在还记得这批数据吗”——把注意力从轮数这个粗粒度指标，转移到间隔这个细粒度信号上。原文标题：TRAIN SMARTER, NOT LONGER: MEMORIZATION- GUIDED DATA REUSE FOR EFFICIENT LLM TRAINING#无影寺 ", "excerpt": "别再问数据能重复几轮，先问模型是否已经忘了\n图文版：链接间隔达4.0 GT时，重复数据的损失下降速率追上全新数据大模型训练中长期有一条经验红线：数据重复别超过4个epoch，否则过拟合不可避免。但这条来自早期研究的结论，正在被新的实验信号松动。阿联酋TII团队在小规模实验中观察到，真正决定数据能否安全复用的不是轮数，而是两次看到同一条数据的时间间隔。当这个间隔被拉得足够大，模型在再次遇到旧数据之前", "url": "https://www.zhihu.com/pin/2063066166218831607", "votes": 0, "comments": 0, "feed_ts": 1784653473, "feed_time_str": "07-22 01:04", "category": "pin", "cat_name": "想法动态"}, {"actor": "梗直哥发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "【SVM支持向量机】低维空间的混乱 高维空间的秩序感谢大家的支持！UP非常愿意与大家互动交流，可加V：gengzhige99", "excerpt": "【SVM支持向量机】低维空间的混乱 高维空间的秩序感谢大家的支持！UP非常愿意与大家互动交流，可加V：gengzhige99", "url": "https://www.zhihu.com/pin/2063059536706064963", "votes": 0, "comments": 0, "feed_ts": 1784651723, "feed_time_str": "07-22 00:35", "category": "pin", "cat_name": "想法动态"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么中国社会里不提供免费食物？", "excerpt": "谁说不提供的，主要是看吃什么吧。 我家里现在开的就是餐饮店，被我妈妈开成了网红店（也不能说网红店，是平价餐馆，但是有一些网红来过，声名打开了），每天来的顾客基本能坐满整个店面，也在门口贴了免费提供食物的告示。 我们那一条街上，绝大多数餐馆其实都提供免费食物的，只要你进去稍微问一下，基本老板都会提供，有一件事情我们印象很深刻，去年就有一位男青年从家乡刚来上海，经济比较窘迫，当时他看到妈妈贴在外面的帮", "url": "https://www.zhihu.com/question/2053753057540829559/answer/2061358579261632530", "votes": 102, "comments": 8, "feed_ts": 1784650339, "feed_time_str": "07-22 00:12", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "屠猪之枪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有哪些长期被当做灵异事件，最终被科学  20:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "时予", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "高志凯反问让西方记者沉默高志凯那句反问真是绝了——他只用一个反问，就把西方记者精心设下的语言陷阱，原封不动地砸了回去。事情发生在一场国际研讨会上。一位西方记者带着挑衅的语气，向高志凯抛出了一个经典陷阱式问题：如果台湾民众不想被统一，中国难道要强行推进吗？话音刚落，现场不少西方与会者露出了意味深长的表情。这是一个标准的话术陷阱。对方先把&#34;台湾是否属于中国&#34;这个核心前提偷偷换掉，直接跳到&#34;民众意愿&#34;的道德高地，等着中国学者要么被动辩解，要么落入&#34;强权&#34;的人设。换个人，可能就得花半小时从头讲起一个中国原则。但高志凯几乎没有犹豫。他平静地说起了一段美国人自己的历史——1861年，美国南北战争爆发。南方各州高喊着要脱离联邦，林肯总统没有开座谈会，没有搞全民公投，更没有发调查问卷。三百五十万士兵血洒疆场，整整四年的内战，最后北方胜利，联邦重新统一。林肯至今被美国人尊为历史上最伟大的总统之一，维护国家统一被写进了每一本美国教科书，是不容置疑的政治正确。讲到这里，高志凯抛出了那个封神的反问：既然美国能用战争维护自己的国家统一，并且把这当成伟大功绩，为什么到了中国这里，维护主权和领土完整就成了你们口中的&#34;威胁&#34;？现场瞬间安静了。刚才还等着看好戏的西方与会者，一个个都不说话了。因为他们没法回答——回答是，等于打自己的脸；回答不是，等于否定了美国自己的历史合法性。这就是高志凯的厉害之处。他不跟你在对方划定的战场上纠缠，而是直接把问题拉到对方的逻辑体系里，用对方的规则打败对方。用咱们老百姓的话说，这叫&#34;以子之矛，攻子之盾&#34;。你仔细琢磨就会发现，西方这套话术用了几十年了。他们永远站在道德制高点提问，永远把自己的标准当成普世价值，永远双重标准。但只要你敢拿他们自己的历史对照，这套话术就不攻自破。高志凯还补了一刀。他说2009年有民调显示，美国德克萨斯州超过一半的民众支持独立。那按照刚才那位记者的逻辑，美国是不是应该尊重德州人民的意愿，让德州独立出去？没有人接话。因为所有人都知道答案——美国绝对不会允许。既然你自己都做不到，凭什么要求中国做到？这就是双标的本质：对自己一套标准，对别人另一套标准。很多人觉得这只是嘴上功夫，我不这么看。这句话背后，是一整套对国际话语体系的深刻理解。高志凯为什么能精准抓住这个点？因为他太懂西方的逻辑了。他早年做过国家领导人的英文翻译，后来去联合国秘书处工作，又在耶鲁大学拿了政治学硕士和法学博士，华尔街、摩根士丹利、香港证监会都待过。他是真正从西方体系内部走出来的人，知道对方的软肋在哪。过去我们很多学者跟西方辩论，总喜欢用我们自己的话语体系讲道理，讲历史经纬，讲法理依据。但对方根本不听，因为他们不认同你的话语体系，你讲得再对，在他们的语境里也是&#34;自说自话&#34;。高志凯的思路完全不同。他不用你的规则跟你辩，也不用我的规则跟你辩，他直接拿出双方都认可的事实——美国自己的历史——来做参照。这一下，对方就没法装聋作哑了。站在西方记者的角度想想，他本来预设好了剧本：我提问，你辩解，我再追问，最后我站在道德制高点上总结。结果高志凯根本不按剧本走，反手把球踢了回来，而且踢到了一个他接不住的位置。这就是战略上的被动。当你所有的预设都失效，当你用来攻击别人的武器反过来对准自己，你除了沉默，什么也做不了。而围观的人看在眼里，自然会明白谁的逻辑更站得住脚。当然，我也要说句公道话。一句话的胜利，不等于整个话语体系的胜利。西方主导国际舆论这么多年，不是一两次辩论就能扭转的。但高志凯这种打法，给我们指明了一个方向。过去我们总想着&#34;怎么解释清楚&#34;，现在应该思考&#34;怎么让对方无法反驳&#34;。解释是防守，反问才是进攻。在国际舆论场上，一味防守只会越来越被动，主动出击才能打开局面。而且你发现没有，高志凯的反问从来不是情绪宣泄，他永远拿事实说话。南北战争是事实，林肯的历史地位是事实，德州独立的民调也是事实。用事实说话，比一百句口号都管用。这背后其实是一种文化自信。我们不再需要小心翼翼地迎合西方的标准，不再需要反复证明自己的合法性。我们可以平视对方，可以用对方听得懂、也无法反驳的语言，讲清楚我们的立场。我相信，未来这样的声音会越来越多。当越来越多的人看清双标的本质，当我们的话语越来越有力量，这个世界的舆论格局，终将会发生改变。而高志凯那句反问，就是这场改变里，一声清脆的开场哨。", "excerpt": "高志凯反问让西方记者沉默高志凯那句反问真是绝了——他只用一个反问，就把西方记者精心设下的语言陷阱，原封不动地砸了回去。事情发生在一场国际研讨会上。一位西方记者带着挑衅的语气，向高志凯抛出了一个经典陷阱式问题：如果台湾民众不想被统一，中国难道要强行推进吗？话音刚落，现场不少西方与会者露出了意味深长的表情。这是一个标准的话术陷阱。对方先把&#34;台湾是否属于中国&#34;这个核心前提偷偷换掉，直接跳", "url": "https://www.zhihu.com/pin/2061233148026000992", "votes": 0, "comments": 192, "feed_ts": 1784635972, "feed_time_str": "07-21 20:12", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "1946年东北蒋军追击我军，要不是老蒋下令停战半个月，我军是否有可能全军覆没？", "excerpt": "当然不会。老蒋就投入东北区区7个军，此时13军主力还在热河（热河此时归晋察冀）。换句话就是杜聿明只有19个师（含93军），连同新兵也不足20万（我军正史数据是16个师16万，不含93军），根本无力覆盖整个东北。 ", "url": "https://www.zhihu.com/question/2062187226470077800/answer/2062214397834146613", "votes": 7, "comments": 5, "feed_ts": 1784635567, "feed_time_str": "07-21 20:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价翟东升教授在6.14视频中提出的新型货币体系？", "excerpt": "刚看完翟教授那个视频，在纽约这边金融圈子里其实已经有人在转发了。作为每天跟美元流动性、美债曲线打交道的人，我想从他指出的问题以及方案的实操层面聊几句实在的。 翟教授对美元体系软肋的诊断，我认为是准确的。 视频里他点出的三个问题——美国债务长期扩张、美元制裁武器化、全球储备资产过度依赖单一主权国家——这些在曼哈顿的办公室里也是公开的秘密。债务上限博弈几乎成了周期性闹剧，SWIFT制裁已经把美元工具化", "url": "https://www.zhihu.com/question/2052737595499614788/answer/2062801597680333691", "votes": 558, "comments": 8, "feed_ts": 1784635543, "feed_time_str": "07-21 20:05", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "国家的反腐力度这么大，为什么贪官抓不清，而且还越抓越大？", "excerpt": "建议看看毛选，教员已经明确告诉我们解决一个问题后新问题会马上出现，静态的完美是不可能出现的。换句大白话，你想地面干净就得经常扫地，不扫地地就是会脏。", "url": "https://www.zhihu.com/question/2034003378506831562/answer/2058489953806455179", "votes": 143, "comments": 0, "feed_ts": 1784635476, "feed_time_str": "07-21 20:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "犹太人真的认为其他所有民族都不是人类吗？", "excerpt": "拆解高赞以色列洗白文： 该网友回答地址：犹太人真的认为其他所有民族都不是人类吗？（926点赞、335收藏）。 院第二大党团，右翼第一大党团。左翼方面，历史契约拥有25个选举席位与1个反对派法席位，由塞佩达取得，共26席，是本届参议院第一大党团。中间派共有MIRA（3）+新自由主义党（1）+尊严与承诺（1）+原住民席位（2）=7票由于参议院议长选举采用秘密投票，因此目前已知的公开党团或个人背书仍然无法代表最终的投票结果。但确定的是，即使历史契约集体转投乌里韦派，也无法直接获得绝对多数。相反，在没有大规模跑票的前提下，阿贝拉多派只需要从中间派中拉取一票，即可将参议院议长收入囊中。在刚过去的总统选举中，帕洛玛的选民集体弃保转投阿贝拉多至其一轮领先后，乌里韦公开支持阿贝拉多，并称民主中心党将参与执政联盟。而阿贝拉多则只以暧昧的“政治承诺”予以回应。同时阿贝拉多的幕僚卡洛斯·苏亚雷斯（Carlos Suárez）与阿尔瓦罗·乌里韦本人积怨已久。在二轮选举结束后，苏亚雷斯直言“乌里韦时代已经结束”，在榨取完乌里韦的政治资本后暗示老东西该退休了。而乌里韦则是毫不客气地回击，称苏亚雷斯是个“恶棍、懦夫和伪君子”（bandido, cobarde y solapado）.新内阁名单出炉后，乌里韦派在阿贝拉多新内阁中斩获0个部长席位，新老右翼的矛盾便进一步深化。辗转至今，在参议院议长席位的争端中，民主中心党直接向德卢克开炮，指责其竞选合法性以及恶意勾结左翼。传统右翼的精神图腾乌里韦先生更是直接向阿贝拉多发出警告:“凡是对于祖国有利的事情，我们都支持。但是如果老虎咆哮着要消灭民主中心党，我们就得变成一群勤劳的蜜蜂来保护自己。”（Todo lo que sea a favor de la Patria, lo apoyamos. Pero, si el tigre por su entorno ruge para acabar con el Centro Democrático, nos toca volvernos unas abejas laboriosas y defendernos.）为了阻止阿贝拉多控制参议院，加速新老右翼世代更替，甚至在权力结构上架空自己，乌里韦不惜主动向其二十年的政敌佩特罗释放善意，为佩特罗特许其弟圣地亚哥·乌里韦在军事驻地服刑一事公开道谢。尽管随后，乌里韦迅速重申，他与佩特罗政府仍有深刻的分歧。（唉，苦命鸳鸯与此同时，乌里韦本人也向塞佩达抛出橄榄枝，强调:“我们提供（对反对派的）所有保障，我们不迫害具体的人，我们只追求遵守法律。”在此之前，阿贝拉多曾宣称就职后将协助美国政府，将佩特罗引渡至美国。针对此事与阿贝拉多的多重国籍等问题，塞佩达提起“和平公民不服从”号召（desobediencia civil pacífica），要求阿贝拉多遵守政治合法性与尊重国家主权，并放弃对反对派的政治迫害。此番背景下乌里韦罕见地做出对反对派权利的承诺，无疑是寻求在历史契约的政治选举联盟。塞佩达对此回应称不排除与乌里韦主义结盟的可能性。佩特罗的幕僚戴维·拉赛罗（David Racero）则声称“为了击败希特勒和法西斯主义，斯大林、罗斯福和丘吉尔不得不坐到一起。”在阿贝拉多的任期内，哥伦比亚的政治碎片化格局恐怕难有改观，但政治趋势却由过去二十年的“进步-保守”/“左翼-右翼”转化为“乌里韦-阿贝拉多-历史契约”/“新右翼-老右翼-左翼”的三角格局。当一方感受到来自另外一方的巨大生存压力时，便会自觉地寻求第三方以形成某种绝望的同盟。此时此刻，是阿贝拉多的新右翼风头正盛。但是，未来呢？#哥伦比亚 #拉丁美洲 #选举 ", "excerpt": "佩特罗-乌里韦主义？哥伦比亚参议院议长选举前瞻面对将于明天（7月20日）举行的国会领导层选举，乌里韦与阿贝拉多在参议院议长人选一事上分裂。阿贝拉多明确表示支持U党成员阿尔弗雷多·德卢克（Alfredo Deluque）竞选参议院议长。乌里韦则背书民主中心党成员奥诺里奥·恩里克斯（Honorio Henríquez）。独立日选举，参议院将选出议长、第一副议长、第二副议长和秘书长四个职位。其中，《反对", "url": "https://www.zhihu.com/pin/2062102857231472536", "votes": 0, "comments": 10, "feed_ts": 1784617766, "feed_time_str": "07-21 15:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么西方伪史论近年如此盛行？", "excerpt": "我刚开始学西方古史时，也  "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "旷野", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "AI 编程时代，被誉为「软件工程圣经」的《人月神话》，有哪些理论过时了？", "excerpt": "说白了真正被AI撬动的理论掰着手指头数不出三条，我其实细看过时的都是一些很表面的东西。相反，这本书中的很多理论在现在更加有学习的价值。 首先看人月这个计量单位人月神话的核心那句，” 往一个已经延期的软件项目里加人，只会让它更晚”，也就是所谓 Brooks’s Law，背后的逻辑是人一多，沟通路径按 n(n-1)/2 涨，边际的人贡献的产出还追不上他引入的协调成本。这个比喻就挺好的，生孩子要九个月，", "url": "https://www.zhihu.com/question/2058996805182960802/answer/2062887360887633452", "votes": 14, "comments": 0, "feed_ts": 1784610674, "feed_time_str": "07-21 13:11", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "607846", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "“静水2008”的投资体系总结", "excerpt": "内容来源： 静水2008前言本文整合了静水2008的全部投资思考，核心脉络清晰而坚定：投资的本质是找到当下时代的超级成长公司，以极简的专注、顺势的策略，抓住少数10倍级别的大机会，通过两到三轮产业周期实现财富跃迁。 全文从投资底层逻辑出发，逐步落地到选股标准、交易策略、投研方法，再到避坑指南与人生认知，由道及术，由术及人，构成一套完整可执行的成长股投资体系。 第一章 投资之道：回归本质的极简投资第", "url": "https://zhuanlan.zhihu.com/p/2056833702274110592", "votes": 1637, "comments": 133, "feed_ts": 1784610540, "feed_time_str": "07-21 13:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "我其实已经写好了科创2.0，但我不知道要发不要。我当时写第一次科创逃生指南的时候，私信追着我骂了三天。我当时写黄金逃生有色逃生，评论区被骂，私信也被骂。然后我现在还记得我2020年3月说白银说纳斯达克，也是被骂了一整个评论区。我估计按照这个节奏，估计评论区又是骂声一片……我有点理解一直喊多的博主了。喊多、提示风险都是被骂，但至少喊多能赚到钱。", "excerpt": "我其实已经写好了科创2.0，但我不知道要发不要。我当时写第一次科创逃生指南的时候，私信追着我骂了三天。我当时写黄金逃生有色逃生，评论区被骂，私信也被骂。然后我现在还记得我2020年3月说白银说纳斯达克，也是被骂了一整个评论区。我估计按照这个节奏，估计评论区又是骂声一片……我有点理解一直喊多的博主了。喊多、提示风险都是被骂，但至少喊多能赚到钱。", "url": "https://www.zhihu.com/pin/2062881598043844759", "votes": 0, "comments": 50, "feed_ts": 1784610065, "feed_time_str": "07-21 13:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国海警局发布菲律宾非法「坐滩」57 号舰蓄意挑衅的声明，并公布现场画面，有哪些信息值得关注？", "excerpt": "观看了现场视频，我海警人员，没戴头盔，没用武器，就一根棍子，真是准备大大的不足。必须要严厉批评，立即整改，下次要真正的让猴子头接铁拳。 2020年的中印边境冲突，我军在与印军对峙后，遭印军偷袭，随后我军反击，为防止事态扩大，敌我双方未使用热武器，均使用冷兵器作战。 我军使用自制的狼牙 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

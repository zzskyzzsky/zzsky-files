接Paper-replication研究coding agent复现科学机器学习论文时，怎样把“完成”变成可核查的工作区证据。它先把论文中的计算声明拆为目标；每个目标只有同时交出候选结果、执行记录、来源链接、与原文声明的对比和报告覆盖证据，才可标为MATCHED。四篇论文共12次独立运行都通过完成门（论文定义的最终验收条件：记录每个核查目标及其证据的复制矩阵中，所有目标都标为MATCHED、没有未关闭目标、最终复现报告PDF已生成），最终报告覆盖158个记录目标，但这不表示每次运行过程一致。同一篇PIFT论文三次运行分别拆为8、8、25个目标，最大与最小相差3.1倍；13个标准化标量锚点的39次观测中37次落在固定论文阈值内，但不同运行的数值仍可能相差很大。复现耗时从1.2到13.0小时，且同一声明的接受规则会随运行变化。证据束还要求把结果链接到代码、配置、随机种子和论文出处，并以哈希检查隔离论文原图，防止把作者资产直接当作复现输出。因此完成门证明的是工作区达到自己的证据标准，不是绝对正确或不同运行已完全一致。该流程目前只覆盖四篇以计算声明为核心的科学机器学习论文，且不使用作者原始代码；接受规则仍由agent从论文内容推断，质量可能随运行波动。流程不能覆盖物理实验数据采集，也不能仅凭一张相似图或agent最终消息认定结果已被忠实重建。原文标题：Coding-agents can replicate scientific machine learning papers#无影寺 ", "excerpt": "Coding Agent能复现论文，但每次复现的可能不是同一件事\n图文版：链接Paper-replication研究coding agent复现科学机器学习论文时，怎样把“完成”变成可核查的工作区证据。它先把论文中的计算声明拆为目标；每个目标只有同时交出候选结果、执行记录、来源链接、与原文声明的对比和报告覆盖证据，才可标为MATCHED。四篇论文共12次独立运行都通过完成门（论文定义的最终验收条件", "url": "https://www.zhihu.com/pin/2061253751437113077", "votes": 0, "comments": 0, "feed_ts": 1784221302, "feed_time_str": "07-17 01:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "梗直哥发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "【GPT 4 装逼指南】5个特点+核心技术详解+学习路线图，25分钟搞定！只讲三方面问题：1. GPT4新功能分析及看点，不混乱；2. 技术报告逐段精读，不遗漏；3. 模型原理解构及学习建议，不慌张。多模态机器学习经典论文：链接V我：gengzhige99选课戳这：链接", "excerpt": "【GPT 4 装逼指南】5个特点+核心技术详解+学习路线图，25分钟搞定！只讲三方面问题：1. GPT4新功能分析及看点，不混乱；2. 技术报告逐段精读，不遗漏；3. 模型原理解构及学习建议，不慌张。多模态机器学习经典论文：链接V我：gengzhige99选课戳这：链接", "url": "https://www.zhihu.com/pin/2061250113834587050", "votes": 0, "comments": 0, "feed_ts": 1784220323, "feed_time_str": "07-17 00:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "梗直哥发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "【regularization】正则化是什么？狂飙告诉你", "excerpt": "【regularization】正则化是什么？狂飙告诉你", "url": "https://www.zhihu.com/pin/2061249610551649469", "votes": 0, "comments": 0, "feed_ts": 1784220204, "feed_time_str": "07-17 00:43", "category": "pin", "cat_name": "想法动态"}, {"actor": "UFO", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "tit , "comments": 0, "feed_ts": 1784215670, "feed_time_str": "07-16 23:27", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "DDR-AfD通三统本周周二也就是当地时间7月14日晚上，在萨克森-安哈尔特州(Sachsen-Anhalt）的德绍-罗斯劳(Dessau-Roßlau）举行的德国另类选择党(AfD）小组讨论会上，当时受邀参加此次活动的有德国选择党联邦主席蒂诺·克鲁帕拉(Tino Chrupalla，1975年生，出生地是东德科特布斯专区的魏斯瓦瑟，在两德统一后的90年代一度加入CDU的青年组织Junge Union，2015年加入AfD）、该党萨克森-安哈尔特州选举的首席候选人乌尔里希·西格蒙德(Ulrich Siegmund，1990年生，19-24岁时曾是CDU党员，2014年加入AfD）以及在东德地区格外有知名度的政治讽刺喜剧演员、电视节目主持人乌韦·施泰姆勒（Uwe Steimle，1963年生，最早因出演德国长寿犯罪剧《Polizeiruf 110》（《报警110》）而广为人知，最近10年因为政治言论愈发受关注，其立场上是东德怀旧主义情绪与民族保守主义的混合体。虽然不是AfD党员但是近年来频繁给AfD活动站台）等人。本来活动原定以演唱德国(德意志联邦共和国）国歌结束。然而，施泰姆勒却先演唱了东德(德意志民主共和国）国歌《废墟中的崛起》（Auferstanden aus Ruinen）。克鲁帕拉和西格蒙德与施泰姆勒以及众多在场观众一起演唱了其中的部分歌词。之后，才演唱了德国国歌。此事随后不胫而走，在德国社会引发轩然大波。德国总理府主任托尔斯滕·弗雷（Thorsten Frei，CDU）强烈批评在萨克森-安哈尔特州举行的这次AfD活动上演唱东德国歌的行为。他称这一事件“极其令人不安”。弗雷在接受世界电视台采访时表示，当政治代表参与此类活动时，问题尤为严重。“尤其当这些政治代表显然意图传递政治信息时，更是如此。”负责重新评估东德(DDR)政权统治的萨克森-安哈尔特州专员约翰内斯·贝莱特斯(Johannes Beleites）也表达了批评：“东德国歌是独裁统治的颂歌。我感到非常不安的是，在一个想要在萨克森-安哈尔特州推选州长的政党的竞选活动结束时，竟然会唱这首歌。”贝莱特斯还大谈“对德国统一社会党独裁统治受害者的漠视”——他认为AfD成员们高唱东德国歌的行为是“对那些为自由和民主冒着生命危险或接受长期监禁的人们的漠视”。然而，克鲁帕拉为演唱东德国歌辩护。他认为，国歌完美地表达了民众的希望。“我们希望确保不再出现像核电站或其他关键基础设施被拆除后留下的那种废墟。”这位AfD领导人告诉《明星》杂志。“因此，事后人为地渲染事件是没有必要的。”萨克森-安哈尔特州将于9月6日举行新一届州议会选举。根据目前的民调，AfD支持率明显领先于现任州长所在的CDU。德国宪法保卫局已将德国选择党在萨克森-安哈尔特州的分支机构认定为右翼极端组织。原文链接: 链接  PS:你们认为AfD是DDR政权的另类继承者，还是导致SED政权垮台并最终助推两德统一的“和平革命”(Friedliche Revolution）的另类继承者？亦或者都不是？", "excerpt": "DDR-AfD通三统本周周二也就是当地时间7月14日晚上，在萨克森-安哈尔特州(Sachsen-Anhalt）的德绍-罗斯劳(Dessau-Roßlau）举行的德国另类选择党(AfD）小组讨论会上，当时受邀参加此次活动的有德国选择党联邦主席蒂诺·克鲁帕拉(Tino Chrupalla，1975年生，出生地是东德科特布斯专区的魏斯瓦瑟，在两德统一后的90年代一度加入CDU的青年组织Junge Uni", "url": "https://www.zhihu.com/pin/2061122148081701454", "votes": 0, "comments": 43, "feed_ts": 1784215529, "feed_time_str": "07-16 23:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么相声演员一定要会唱太平歌词？", "excerpt": "叹气…… 这叫“生意口”，王婆卖瓜自卖自夸 以色列最高法院承认海外同性结婚登记的效力，因为婚姻不是由世俗当局办理，无论犹太教、伊斯兰教、基督教、德鲁兹，没有宗教机构愿意主持同性婚礼。解决办法是飞到塞浦路斯再把复印件拿回国。因为这个系统，不同族群互相结婚、某个穆斯林精犹想改宗犹太教、犹太教改信其他宗教，想太多了，基本不可能的事。犹太极端保守派支持保留沙里亚法庭，因为一旦穆斯林自治被取消，自己迟早唇亡齿寒，这方面利益一致。 以色列官方长期以此证明，你看，这才是真正的宗教平等，你们西方还指责干嘛？还有人开玩笑借此反讽法塔赫那边。唉，团结。。。", "excerpt": "奥斯曼帝国在中东真正的继承者～以色列总统赫尔佐格向专门管理穆斯林民事的新任沙里亚宗教法庭法官颁发任命证书。特别强调出现第二位女性法官。 希伯来语和英文评论形成鲜明对比，后者纷纷好像第一次听说似的，Laura Loomer这个逗比大呼应该阻止以色列“伊斯兰化”，被真犹太人围观笑掉大牙，莫名其妙：已经运行七十多年了，你不知道吗？奥斯曼帝国瓦解后，中东各国要么走向君主专制，要么照搬西方世俗法，以色列却保", "url": "https://www.zhihu.com/pin/2061063413363741860", "votes": 0, "comments": 82, "feed_ts": 1784177149, "feed_time_str": "07-16 12:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Thinking Machines 首个开源模型Inkling Thinking Machines 的第一个基础模型重点放在做成一个可被开发者自己改造的开放权重 base model。Inkling 是 975B 总参数、41B 激活参数的 MoE Transformer，原生处理文本、图像和音频。官方同时给出 1M token 的最大 context window、Tinker 微调入口和 Hugging Face 权重。这里的关键信息不是“参数够大”，而是你能否拿到权重、按自己的数据微调，并部署到自己的工作流里。它想解决的是“通用模型不够贴合工作流”官方没有把 Inkling 写成当前最强的开源或闭源模型，反而明确说它不是整体能力最强的模型。它的定位是：多模态、思考开销可控，并能在 Tinker 上微调。这和只比一次 benchmark 分数是两件事。很多业务要处理的不只是文本，还会碰到图片、录音、工具调用和长链路任务；通用模型即使回答不错，也未必知道你公司的资料、工具 schema 或交付规范。Thinking Machines 把首个模型押在“拿去改”而不是“拿去膜拜”上。把思考成本交给开发者选Inkling 的 effort 可调。官方在 Terminal Bench 2.1、HLE 和 IFBench 上展示：随着 effort 从低到高变化，性能和生成 token 会一起变化。在 Terminal Bench 2.1 的官方图中，Inkling 达到 Nemotron 3 Ultra 同等分数时，约使用后者三分之一的 token。这个数字只能说明该 benchmark 和该对照下的曲线，不能翻译成“所有 coding 任务都省三分之二成本”。但它说明了一个很实用的产品方向：同一个模型不是只有“最强模式”，而是可以按延迟和预算选择合适的思考强度。Inkling 从零预训练，但 initial SFT 使用过包括 Kimi K2.5 在内的开源模型合成数据，只是占总计算量较小，后续主要靠大规模 RL。Inkling 的第一步已经很清楚：用开放权重、多模态和微调入口，争取成为团队定制模型时的一个 base model。它能不能成为真正好用的选择，还要看不同任务上的微调效果、部署成本和后续 Inkling-Small 的完整权重表现。", "excerpt": "Thinking Machines 首个开源模型Inkling Thinking Machines 的第一个基础模型重点放在做成一个可被开发者自己改造的开放权重 base model。Inkling 是 975B 总参数、41B 激活参数的 MoE Transformer，原生处理文本、图像和音频。官方同时给出 1M token 的最大 context window、Tinker 微调入口和 Hu", "url": "https://www.zhihu.com/pin/2061068654519886965", "votes": 0, "comm cn": "赞了回答", "title": "今天是 2026 年 7 月 4 日，美国建国 250 年。大家有什么想说的？", "excerpt": "埃德加·斯诺：希望在我走之前，请主席向美国人民说几句话，美国人民对中国是有好感的。 毛泽东：祝他们进步。如果我祝他们获得解放，他们有些人可能不大赞成。我就祝那些认识到自己还没有解放的、生活上有困难的人获得解放。 埃德加·斯诺：主席的话非常好，特别是同前面的话联系起来，就是中国不会打出去，中国在忙于自己的事。我本人看到了这一点。 毛泽东：美国人需要再解放，这是他们自己的事。不是从英国的统治下解放，而", "url": "https://www.zhihu.com/question/2056734337417082595/answer/2058938783618410194", "votes": 76, "comments": 0, "feed_ts": 1784172499, "feed_time_str": "07-16 11:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "文艺学和哲学之间的边界在哪里？", "excerpt": "这是一个非常简单也非常无聊的历史问题。 最开始，德里达从法国的哲学院毕业，在法国的哲学院任教，是法国教育系统认可的哲学家。 然后，有一些美国人喜欢德里达，想要以研究德里达为生。但是美国的哲学院不要他们。美国的哲学院有两拨人，一拨是老哲学史家，一拨是被纳粹赶过来的分析哲学家，都不喜欢德里达。 于是这些美国人找上了美国的文学院，说德里达思想是一种文学理论，可以用来做文学批评。美国的文学院就要了他们。 ", "url": "https://www.zhihu.com/question/2041339127392621603/answer/2061020197092341318", "votes": 40, "comments": 1, "feed_ts": 1784172406, "feed_time_str": "07-16 11:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "ZOMI酱", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "40岁以上中年人失业都干嘛去了？", "excerpt": "96年交大附中毕业，2000年交大管院毕业。高中同班同学3位男生考进交大，另外2位都是纳斯达克上市的亿万身价了。 本人典型工科男，2000年就进了上海的互联网公司，我们做的就是点评的前生。2000年刚工作，我就负责开发线上订单管理和发货管理系统，上海的几家电商快递公司都是我找的和培养的，后来卓越joyo就是用的我培养的快递公司。可惜那一波上海的全倒了。否则我们才是互联网大佬。02年又去前面老板上班", "url": "https://www.zhihu.com/question/613586729/answer/2043891052306751938", "votes": 2447, "comments": 220, "feed_ts": 1784171981, "feed_time_str": "07-16 11:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "来英国读书发现这边普遍非常抵制AI ，为什么他们这么抗拒？", "excerpt": "你真给我干懵了，这就是水硕平均水平吗？我先不谈国内本科为什么能用AI写作业写论文这个问题，就英国我就没听过学校禁止学生使用AI，英国禁止的是学术不端，是拿AI直接生成作业论文。 你用电脑运行AI找文献理思路，难道Turnitin能查出来吗？Trunitin能查出来是你用AI生成了一个虚假的文献以及完全由AI代写的论文，你上听证会拿不出任何证明自己构思的证据。 ", "url": "https://www.zhihu.com/question/2059856451661779837/answer/2060778272875714294", "votes": 28, "comments": 0, "feed_ts": 1784171776, "feed_time_str": "07-16 11:16", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "试证明：德国总理是蜥蜴人", "excerpt": "德国《基本法》第19条第1款明确规定“如果基本权利被限制，该法律必须具有普遍适用性，而不能仅针对个别情况。”而德国刑法典§130(3)是特设的，只禁止否认纳粹大屠杀，不禁止否认德二的纳米比亚大屠杀或者任何其它的种族灭绝。2009年，德国最高法院在温西德尔(Wunsiedel)判决中裁定这条法律确实是特设的，但是狡辩说“它是一个德国特殊历史下的特例，法律的普遍性在这里必须让位于历史”。 大前提：如果", "url": "https://zhuanlan.zhihu.com/p/2061045800701104144", "votes": 9, "comments": 1, "feed_ts": 1784171758, "feed_time_str": "07-16 11:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "朝花夕拾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待2026年第一季度小米手机销量同比暴跌35%？", "excerpt": "背景一，手机市场是存量市场，手机更新换代吸引力不大，换机周期大幅延长。 背景二，低端机不赚钱，叠加原材料价格上涨，利润更薄。 背景三，消费升级是欲望，消费降级是无奈，但消费升级和消费降级并不是完全对立的。 举个例子，原来的手机三千块，现在换新手机，换个五千块的，这算不算消费升级？ 但是手机用了四五年才换，是不是又是消费降级了？ 这几年，手机整体销量虽然在下降，但是均价一直是上涨的，就是这个逻辑。 ", "url": "https://www.zhihu.com/question/2028155003081073985/answer/2061043851960251322", "votes": 1, "comments": 0, "feed_ts": 1784171147, "feed_time_str": "07-16 11:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何客观评价小约翰可汗《世纪风暴》系列的视频质量？", "excerpt": "我觉得做得很好，甚至可以说是在讨论宗教极端主义问题上被严重低估了的著作。而且我可以直说，这一系列视频的立场没有问题。之所以看上去有问题，是因为有些话不能明说，连一笔带过都不敢带过，否则就不是被小蓝书几个incel蛐蛐一下的问题，而是要再严重千倍，分分钟整个站都可以被爆破的问题。这个问题换别人来处理也不会比小约翰更好。 比如最简单的，你要所谓的“在立场上没问题地讨论伊斯兰革命”，就不得不讨论一个问题", "url": "https://www.zhihu.com/question/2043074040231876065/answer/2054240035185112666", "votes": 431, "comments": 105, "feed_ts": 1784170867, "feed_time_str": "07-16 11:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么追光动画的《三国第一部：争洛阳》预售票房惨淡，热度起不来？", "excerpt": "这位客官，您点的何进大战十常侍来了。 ", "url": "https://www.zhihu.com/question/2058209553540554918/answer/2060115262914011417", "votes": 2506, "comments": 111, "feed_ts" function esc(s) {
  if (!s) return '';

}

function renderByCategory() {
  const cats = {};

}

function renderByTime() {
  let h = '';

  }

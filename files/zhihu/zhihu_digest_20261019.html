": 4, "comments": 0, "feed_ts": 1792340414, "feed_time_str": "10-19 00:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美以领导人被曝磋商联手再袭伊朗。11.3或10.27两个重要时间节点之前有这个可能性吗？", "excerpt": "我的判断是: 哪怕美以再度对伊朗重启空袭，若依旧没有地面部队登陆的配合，其规模和烈度也只会比2月28号开始的那次小得多，大致上会和今年8月的那波空袭烈度相仿。 很多人总是关注美国航母舰队群的动向，但是问题是: 美国在中东地区对伊朗威胁最大的从来就不是航母，而是陆基航空兵，也就是部署在海湾地区前沿军事机场的美国空军力量。如果没有这些前沿军事机场，那么它根本不可能对伊朗进行伤筋动骨的投弹打击。 比如阿", "url": "https://www.zhihu.com/question/2093545923884463428/answer/2095098744412828536", "votes": 58, "comments": 5, "feed_ts": 1792338076, "feed_time_str": "10-18 23:41", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "哪些事情让你开始相信命运？", "excerpt": "我说一个我大学室友的事。 她是我们宿舍最努力的那个人。从大一开始，每天早上六点半起床去图书馆占座，晚上十一点才回来。周末别人出去玩，她也在自习。她想考一个很不错的学校的研究生，准备了整整两年，那两年我基本没见过她穿什么好看的衣服，永远是那几件换着穿，吃饭都是食堂最便宜的窗口。 后来考研成绩出来，她差了三分。就三分。 她当时在宿舍哭了一整天，我们谁劝都没用。后来调剂去了一个很普通的学校，她不太想去，", "url": "https://www.zhihu.com/question/2008480356739851182/answer/2074937116073668830", "votes": 1111, "comments": 71, "feed_ts": 1792337916, "feed_time_str": "10-18 23:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么人类作为杂食性非常高的动物，却有个非常脆弱的胃？", "excerpt": "大蒜，大蒜能把牛马毒晕，毒得牛马胃肠出血，大蒜还魔法穿透拉满，脚上涂大蒜汁不久嘴里就有大蒜味，对人而言大蒜只是吃面吃肉增香的调料。 咖啡、茶叶、可可、可乐果、瓜拉那等有咖啡因，咖啡因是黄嘌呤代谢产物，从对昆虫到对哺乳动物都有很高的的毒性，是植物对动物的化学武器宝具。含有甲基黄嘌呤的可可粉对狗有强烈毒性，30克巧克力就可以毒死一只成年博美。而那些打扮时髦的有钱人类呢？喜欢就着红茶咖啡吃巧克力慕斯，并", "url": "https://www.zhihu.com/question/403519563/answer/2006761328593888669", "votes": 28217, "comments": 1192, "feed_ts": 1792337816, "feed_time_str": "10-18 23:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "哪些事情让你开始相信命运？", "excerpt": "40岁之后就信了，尤其看我老公的经历，你不信命运都不行！ 我老公家里老三，他家穷，生三胎是为了生个女孩给他两个哥哥中的一个换亲，结果又是个儿子所以他从小不受待见，不受待见导致他学习刻苦，一心想考学走出大山， 九几年他考上小中专，那时候小中专毕业分配 克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "堪萨斯州联邦参议员选举意外紧绷两名共和党前堪萨斯州长，Mike Hayden 与 Bill Graves 先后宣布支持民主党候选人汉密尔顿（Adam Hamilton） 挑战现任共和党参议员、66岁的马歇尔（Roger Marshall）。目前两人的民调几乎打平，而已连续94年没有选出任何一个民主党联邦参议员的深红州堪萨斯州这次很罕见地被划入了Toss Up。当地的共和党人批评马歇尔把大部分精力放在华盛顿，几乎很少跑基层固票，据一位了解相关对话的匿名人士说，党内高层曾多次私下严肃警告他，要求他尽早进入选战状态。在政治资金方面，马歇尔第三季度仅筹得86.6万美元，而汉密尔顿筹得990万美元。不过最近最让马歇尔灰头土脸的是被当地一家甜品店追讨欠了整整6年的账单。马歇尔在2020年首次当选。当时他的竞选团队为初选观战订购了派对点心，包含150块糖霜曲奇、100个迷你草莓玛芬蛋糕以及100块软糖布朗尼，却一直没有付款。当地时间10月8日，霍莉甜品店店主霍莉·托马斯（Holly Thomas）在脸书发文称：“将近一年时间里，我反复打电话、发邮件催款，始终没有接到回电，这笔账单也一直没有结清。”托马斯表示，这笔欠款对当时的她而言绝非小数目，时隔多年她依旧感到气愤，“那时候我才刚创业，还恰逢新冠疫情，各地小企业都在苦苦支撑，每一分钱都至关重要。”而身为妇产科医生的马歇尔却曾数百次起诉拖欠医疗费的产妇，其中81人因无力缴费遭到逮捕。纽时称，即便当选众议员之后，他依旧在追讨患者的欠费。当地时间10月10日，马歇尔在X发文称，他已经付清这笔欠款并支付了利息，他还附上了线上转账截图，向霍莉甜品店转账1300美元。但一名网友在马歇尔公布结清面包店账单的帖子下嘲讽：“如果这是一名孕妇50美元的医疗费，你早就把她送进监狱了。”另一位网友留言：“本该像你对待病人那样，对你提起诉讼或者申请逮捕。”此外马歇尔在佛罗里达州购置的房产也被曝光，引发选民对其究竟有多少时间待在堪萨斯为民服务的质疑。在本周一的一场竞选集会上，汉密尔顿站在公园的一捆干草上，向支持者高喊，堪萨斯州人民值得拥有一名不只是“在佛罗里达与家人共度时光”之余“出来摆拍作秀”的参议员。汉密尔顿的团队还推出了一则极具杀伤力的广告：一名马歇尔的前病人现身说法，声称自己怀孕八个月时，因拖欠马歇尔诊所50美元的诊疗费就被捕。马歇尔团队迅速发出停止侵权通知函，坚称该广告“在所有实质性方面都是虚假的”。汉密尔顿并非传统的民主党政客，他是当地一家全美最大卫理公会教堂的知名牧师。他将自己打造为“具有独立思想的民主党人”，而非被华盛顿两党政治绑架的党派工具。汉密尔顿向全美公共广播电台（NPR）透露，有共和党地方领袖私下表示将在11月倒戈投票给他。作为特朗普的铁杆盟友，马歇尔对其政策照单全收，甚至公开声称“爱国农民即使承受痛苦也会支持关税”，结果成了点燃民怨的导火索。作为美国核心农业区，堪萨斯州深受关税战和飙升的燃油价格之苦。而联邦政府一项进口廉价外国牛肉的计划更直接激怒了这个全美第二大牛肉产地；因加美贸易争端停止在美销售庞巴迪飞机的威胁，也让该州蓬勃发展的航空业遭受重创。面对落选危机，马歇尔不得不与特朗普的牛肉进口计划仓促进行了“政治切割”。而ICE的强硬执法在花园城等地也引发轩然大波，马歇尔在与当地议员的私下会面中，听到了人们对移民官员未经当地执法部门协调就擅自进入的强烈不满。特朗普阵营的顶级操盘手、曾参与马歇尔多次竞选的资深策略师克里斯·格兰特（Chris Grant）已被紧急委派进入竞选团队，接管其在最后冲刺阶段的指挥角色。同时，共和党最大的超级政治行动委员会（Super PAC）也正向堪萨斯疯狂倾注数千万美元的救场资金，试图用饱和式的攻击性广告重新构筑防线；而嗅到胜利气味的民主党也毫不示弱，两党预计将在最后关头展开极其惨烈的舆论战和负面广告互轰。目前共和党寄望于尚未决定的选民最终仍会回归共和党：“堪萨斯人只是对共和党人生气，但他们更恨民主党。”——堪萨斯州如果被翻蓝了，那是名副其实的大卫星，比德克萨斯失守更让人不可思议[吃瓜] #米帝会典 ", "excerpt": "堪萨斯州联邦参议员选举意外紧绷两名共和党前堪萨斯州长，Mike Hayden 与 Bill Graves 先后宣布支持民主党候选人汉密尔顿（Adam Hamilton） 挑战现任共和党参议员、66岁的马歇尔（Roger Marshall）。目前两人的民调几乎打平，而已连续94年没有选出任何一个民主党联邦参议员的深红州堪萨斯州这次很罕见地被划入了Toss Up。当地的共和党人批评马歇尔把大部分精力放", "url": "htt 一个 AI 核心方法的二十年", "excerpt": "二十年前，在线凸优化（Online Convex Optimization，OCO）还是理论计算机、机器学习与优化交界处的一个年轻方向。今天再看，它所形成的 regret minimization、自适应更新和在线决策框架，已经深刻影响现代机器学习。从 Online Newton Step、AdaGrad，到 bandit optimization、在线控制和序列建模，OCO 的许多思想逐步进入 ", "url": "https://zhuanlan.zhihu.com/p/2095224683411120641", "votes": 21, "comments": 2, "feed_ts": 1792320545, "feed_time_str": "10-18 18:49", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "朝花夕拾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "存够多少钱才能躺平?", "excerpt": "我是三甲医院医生，这几年医疗形势虽然不太好，但对于我个人而言，还是处于职业上升期。 我近期的感悟是，对于我这样的职业来说，彻底躺平是不可能的。 但是努力奋斗，等到退休后再好好休息享受生活，也是毫无意义的。 人老了，再多钱也没用。 所以，我现在的策略是平时适当摸鱼，集中精力做一些有挑战性的事，该休息就休息，该享受就享受。 工作也好，生活也好，运动健身健康饮食都要坚持下去，要做好平衡。 回到问题本身，", "url": "https://www.zhihu.com/question/6603359692/answer/2095223461165668303", "votes": 3, "comments": 2, "feed_ts": 1792320201, "feed_time_str": "10-18 18:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "ScholarEvolve：从失败审计到论文检索，再到模块级Harness重构\n图文版：链接ScholarEvolve从文献寻找执行框架的改造方向ScholarEvolve保持任务模型权重不变，从失败轨迹提炼能力缺口，检索研究论文并按机制分组，为执行框架提供不同改造方向。搜索覆盖工具接口、上下文管理、技能、记忆和 agent 工作流五个模块。研究 agent 读论文及可用代码，编码 agent 一次修改一个模块，再把候选组合成完整框架实际验证；技能库和记忆由进化集构建，验证与测试时冻结持久产物。AppWorld Challenge任务完成率提高14个百分点AppWorld以90道任务进化、57道任务选择框架，Challenge测试417道任务，涉及前两组未包含的Amazon或Gmail API。Qwen3.5-27B的任务目标完成率从49.6%升到63.6%，场景目标完成率从28.3%升到44.8%；后者要求同一场景的三个变体全成功。Meta Harness在同样分配的搜索轨迹评测预算下达到54.6%。两种方法都通过Codex使用GPT-5.4改代码，结果是三次独立评测的均值。Telecom单次成功率升到81.9%，四次全成功仍为58.3%τ²-Bench只评电信客服场景Telecom，使用250道进化任务、74道选择任务和40道测试任务。GPT-5.4-mini单次成功率从72.7%升到81.9%，Meta Harness则降到66.5%。论文的passᵏ指k次全部成功，k=4时从49.2%升到58.3%，不能按通常“多次尝试至少一次成功”的指标理解。重复执行的可靠性仍有限。累计消融与三轮论文更新支持搜索设计，也暴露评测边界AppWorld Normal上，依次替换机制分组选择、取消单模块修改、移除文献引导后，Qwen的任务目标完成率从81.4%降到80.0%、78.6%、76.8%。累计消融不能当成各组件独立贡献。三轮新增论文实验达到81.55%，但窗口由历史索引回溯重建，编码改用Codex GPT-5.5，未证明长期在线运行。采用该方法需要独立验证集与可反复运行的环境，还须检查任务回退、调用开销和时延。原文标题：Learning from Research: Toward Lifelong Agent Harness Ev 算低约22%，参照并非严格等算力。各转换配置只有一个随机种子，标准误不代表跨种子稳定性；转换还继承原预训练投入，循环收益需连同计算代价判断。原文标题：Closing the Loop: Practical Training Recipes for Looped Language Models#无影寺 ", "excerpt": "LoopLM：让同一组Transformer层反复思考，换额外计算提升模型能力图文版：链接LoopLM用210B预训练加100B中期训练1.4B LoopLM复用同一组24层，用循环增加有效深度。它将Ouro的五阶段、7.7T token日程简化为210B token预训练与100B中期训练。退出门若过早集中在首轮，后续循环会失去梯度；1000步学习率预热与较强退出门正则用于避免或恢复塌缩。预训练", "url": "https://www.zhihu.com/pin/2095219268765990957", "votes": 0, "comments": 0, "feed_ts": 1792319294, "feed_time_str": "10-18 18:28", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "欧债危机前夜德国篇——精神分裂的政治，与被抽干血包的工业引擎", "excerpt": "一、全欧洲最健康的“土财主” 如果要给现阶段的欧债危机找一个避风港，那毫无疑问是德国。 看纸面数据，德国简直是欧洲的一股清流。2025年公共债务占GDP的63.5%，2026年预计也就65.8%，对比法国逼近120%的债务率和英国彻底崩掉的收入端，德国的财政纪律堪称严苛。英国10年期国债收益率奔着5.5%去了，法国逼近5%（9月底约4.8%，创2008年以来高位），而德国看似是避风港，但其10年期", "url": "https://zhuanlan.zhihu.com/p/2095219026846865367", "votes": 26, "comments": 3, "feed_ts": 1792319262, "feed_time_str": "10-18 18:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Mid-Harness让终端agent先挑动作再执行，验证能力决定多采样收益\n图文版：链接Mid-Harness在执行前挑选动作，保留原生成器与harness终端 agent 的错误命令可能改变环境，使后续更难完成任务。Mid-Harness 从同一段交互历史采样候选，用验证器根据任务、历史和动作作判断，只选一个交给负责执行与反馈的 harness；其余候选丢弃，下步重新采样。它不试运行全部候选，不改生成器权重和执行循环。主实验用TMAX-9B、Vanillux2，覆盖TerminalBench-Lite的98道任务，每题运行三次。强验证器达到68.03%，同模型蒸馏版本为57.14%Pass@1统计三次运行中的平均完全成功率。TMAX-9B每步直接执行一个采样动作时为50.00%，每步8个候选、GPT-5.6 Sol整组选一个时升至68.03%。用TMAX-9B自己验证，整组选一个为51.02%，两两比较为54.76%；学习强验证器约11.7万条成对比较回答后达到57.14%。LoRA只在验证器端启用，生成器不变。增益依赖验证器辨别候选的能力，不能把多采样当成成功保证。蒸馏动作验证与轨迹扩展组合，成功率与成本共同改善Best-of-T生成T条完整轨迹后选一个输出，T=3时成功率为55.10%，配合蒸馏Mid-Harness达到66.33%。Sequential Refine总结初始运行后在新环境重跑，一轮包括两次环境运行；两次都加入蒸馏动作验证，成功率从55.10%到60.20%。后一组合超过T=7的Best-of-T的59.18%，参考价成本不到其一半。估算包含全流程token，并假设同一步候选生成共享公共输入，不能视为实际部署账单。迁移到Qwen3.5-9B的增益为2.04个百分点未经验证器微调的同模型两两比较、8个候选下，Qwen3.5-9B配Terminus-2，在TerminalBench-Lite上从40.48%到42.52%；TMAX-9B配Vanillux2，在Terminal-Bench 2.1上从21.72%到27.34%。收益随模型和任务变化，新增采样与比较也有成本及延迟负担。结果支持把动作选择作为推理预算的一种用法，但未证明每一步动作都正确或安全，使用前仍需验证自身任务表现与操作权限。原文标题：Mid-Harness: Scaling Actions Between Model and Harness for Terminal Agents#无影寺 ", "excerpt": "Mid-Harness让终端agent先挑动作再执行，验证能力决定多采样收益\n图文版：链接Mid-Harness在执行前挑选动作，保留原生成器与harness终端 agent 的错误命令可能改变环境，使后续更难完成任务。Mid-Harness 从同一段交互历史采样候选，用验证器根据任务、历史和动作作判断，只选一个交给负责执行与反馈的 harness；其余候选丢弃，下步重新采样。它不试运行全部候选，", "url": "https://www.zhihu.com/pin/2095218815772653496", "votes": 0, "comments": 0, "feed_ts": 1792319187, "feed_time_str": "10-18 18:26", "category": "pin", "cat_name": "想法动态"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "朱元璋与康熙谁对百姓更好?", "excerpt": "看人口就知道了，封建王朝就看人口和领土，明朝这玩意实属下水道。收大明宝钞的明粉有福了", "url": "https://www.zhihu.com/question/10544968678/answer/2094862914305930697", "votes": 10, "comments": 0, "feed_ts": 1792318481, "feed_time_str": "10-18 18:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "新知PLAYGROUND", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "收官｜你在观鸟的时候，小鸟也在看你～👏「做个鸟人，我懂鸟」新知PLAYGROUND 线下活动圆满收官秋雨后的奥森公园，可随时切换观鸟模式走两步就能听到小鸟的歌声看到小鸟蹦蹦跳跳和游禽舒展身体晒太阳轻松收获好心情和高能量🙌🐦早起的观鸟人有鸟看～今日观鸟小队共看到了 22 科 36 种鸟类包含灰喜鹊、暗绿绣眼鸟、棕头鸦雀等甚至还有国家一级保护野生动物「​​黑鹳​​」屏幕前的观鸟人，今天你「加新」了吗？🤩✨特别感谢合作支持合作方｜中国观鸟会、适马、羽境文旅🚀10 月 24 日新知 PLAYGROUND 上海活动报名中报名链接：链接欢迎报名参与，我们线下见 ！#新知PLAYGROUND ", "excerpt": "收官｜你在观鸟的时候，小鸟也在看你～👏「做个鸟人，我懂鸟」新知PLAYGROUND 线下活动圆满收官秋雨后的奥森公园，可随时切换观鸟模式走两步就能听到小鸟的歌声看到小鸟蹦蹦跳跳和游禽舒展身体晒太阳轻松收获好心情和高能量🙌🐦早起的观鸟人有鸟看～今日观鸟小队共看到了 22 科 36 种鸟类包含灰喜鹊、暗绿绣眼鸟、棕头鸦雀等甚至还有国家一级保护野生动物「​​黑鹳​​」屏幕前的观鸟人，今天你「加新」了吗？", "url": "https://www.zhihu.com/pin/2095207980128008065", "votes": 0, "comments": 0, "feed_ts": 1792316674, "feed_time_str": "10-18 17:44", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "清朝养旗人和满城与明朝养藩王，哪个对财政和百姓的负担更大？", "excerpt": "明朝藩王的宗禄满清是继续征收的，且鸦片战争前后满清宗室开支已经是明代的至少2倍了。哪个负担大？", "url": "https://www.zhihu.com/question/2094067739753239099/answer/2094360843106497100", 有异常费用也需要另行核查处理，不能把“已换钥”理解成“账单已解决”。Console用户需核对通知、换钥和用量保存过外部密钥的 Console 用户，当前能落实的是核对受影响通知、处理旧密钥、检查调用记录与异常费用。凭证与账单分别处理，才能避免把一项操作误当成整件事已经结束。OpenCode 将事件与“大规模蒸馏攻击”联系起来，并表示正在与 Anthropic、OpenAI、Google 合作补救；截至这次公开说明，具体入侵路径、统一赔付方案和全面修复时间仍未披露。", "excerpt": "OpenCode遭入侵，部分用户密钥泄露OpenCode 披露 Console（云端控制台）发生安全事件，影响其 1.4% 的用户，涉及其中关联了外部模型提供商的部分用户。在这里保存过第三方 API 密钥的人，需要核对通知和模型用量；API 密钥是调用模型的凭证，泄露后的处理要到签发密钥的服务商那里完成。1.4% 是 Console 用户这个比例不能改写成“所有 OpenCode 用户的 1.4%", "url": "https://www.zhihu.com/pin/2095152586747922318", "votes": 0, "comments": 0, "feed_ts": 1792303315, "feed_time_str": "10-18 14:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "贝叶斯估计一直迭代下去，后验分布是否能收敛到真实分布?", "excerpt": "你提到假设未知参数的分布真实存在但不是贝塔分布。这句话本身在经典统计学语境下是病句。 在绝大多数我们要解决的实际问题中，用来生成数据的那个底层真实机制，它的参数是一个固定的未知常数，而不是一个分布。比如我们要估计一枚硬币正面向上的概率，这个真实的概率它客观存在，可能就是0.6。它是一个点，不是一个区间，也不是一条曲线。 频率学派认为参数是未知常数，数据是随机的。贝叶斯学派也承认真实世界里可能存在一", "url": "https://www.zhihu.com/question/1967508309234942852/answer/2095152361262036125", "votes": 9, "comments": 0, "feed_ts": 1792303249, "feed_time_str": "10-18 14:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么外微分恰好能表达梯度、旋度、散度？", "excerpt": "不是凑巧。 我们在大一微积分里学到的那一套基于三维向量的梯度、旋度、散度，才是一个彻头彻尾的历史怪胎，是一个为了方便十九世纪末工程师计算而经过严重阉割和扭曲的特例模型。 外微分才是物理世界真实的底层运作规律，它反映的是空间流形上的拓扑与几何结构。你看到的梯度旋度散度，只是外微分在平直的三维欧几里得空间里，借助度规张量投射出来的三个非常局部的影子。我们先来算一笔历史账，看看你熟悉的那套向量微积分到底", "url": "https://www.zhihu.com/question/1950525500402414125/answer/2095149226418352162", "votes": 68, "comments": 0, "feed_ts": 1792302502, "feed_time_str": "10-18 13:48", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "乌古斯兄弟手拉手如何看待阿塞拜疆开始实施头巾禁令，不允许戴头巾的学生入校并遣返，强制维护世俗化，引发家长大规模抗议？现在的乌古斯突厥教友三兄弟，除了土库曼cosplay 光之国玩单机模式成功将生育率苟在2.0-2.5的水平之外。土耳其与阿塞拜疆这俩乌古斯突厥教友国都在定冻姬之后走向了生育率光速堕机。到25-26年时，土耳其已经下堕到1.3，而阿塞拜疆也只剩1.4了。尽管阿塞拜疆与土耳其在冷战时 const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

"category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "王子君", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "梁圣牛逼不枉我充值（虽然只是拿来搞翻译和整理图片...）(*￣3￣)╭", "excerpt": "梁圣牛逼不枉我充值（虽然只是拿来搞翻译和整理图片...）(*￣3￣)╭", "url": "https://www.zhihu.com/pin/2094937915772106563", "votes": 0, "comments": 4, "feed_ts": 1792252158, "feed_time_str": "10-17 23:49", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待郑钦文中网夺冠后躺在球场上，直播镜头对准其裙底长达4 秒？出现这种画面算直播事故吗？", "excerpt": "直播中4秒属于合理的反应时间，这我认为不值得苛责；但后续的报道中采用这种照片就显得有些滑稽和不合时宜了（", "url": "https://www.zhihu.com/question/2093731795820699801/answer/2094203861456242217", "votes": 29, "comments": 0, "feed_ts": 1792251773, "feed_time_str": "10-17 23:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "DeepSeek-V4.1-Flash-1017 来了DeepSeek上线了DeepSeek-V4.1-Flash-1017：提升编程等任务表现、缩短输出和完成时间；优化DeepSeek Harness、腾讯CodeBuddy、WorkBuddy适配；增强从零开发游戏和3D项目的能力；开放Search与Fetch接口；同步开放MIT许可的模型权重。网页、App和API已上线。对经常让AI写代码的人，这次值得验证的是：能否少消耗一些token，把同一件事做完。DeepSWE通过率77%，平均每题约0.2美元在DeepSeek自测的DeepSWE v1.1软件工程评测中，1017版用Mini-SWE-V2工具框架，在最高推理档拿到77.0%通过率，平均每题费用约0.2美元；上一版为74.2%，约0.5美元。这些费用约数仅对应这组测试，不能当成所有编程任务的报价。同一评测中，Claude Opus 5为74.0%。但换到Terminal-Bench 4.0终端任务，1017版42.3，Opus 5为51.8。写代码、操作终端和通用推理有不同难点，一个软件工程成绩不能代替整体能力。1017输出缩短，省钱幅度要计入重试短输出可以减少输出token费用，但模型若少写了必要步骤、需要多次返工，总账仍可能上升。输入、工具调用和重试都要一起算。DeepSeek给出的改进包含更高成绩、更短输出和更快完成；本次公开材料没有统一的输出缩短比例，也没有证明换到所有工具环境后都能等幅获益。想判断是否省钱，要固定任务和工具版本，比较通过验收后的总费用、耗时与重试次数。故宫3D与赛车演示未给交付成功率故宫3D建模、网页版赛车、用Godot复刻《传送门2》，以及跨时代3D场景，都出现在DeepSeek的开发演示中。训练用了带自反馈的强化学习，但公开说明没有展开反馈信号如何设计。这些成品展示了模型参与项目开发的可能性，不能据此认定一句提示就能稳定交付，也不能把它理解为模型原生生成3D或视频。MIT许可开放的是仓库和模型权重，完整训练过程能否复现还需要其他材料。搜索与抓网页各0.75美元/千次Search负责找网页并返回结构化结果，Fetch负责把指定网页内容取回为Markdown，方便agent读取。两个接口各按成功且有结果的请求收费，都是0.75美元/1000次；失败、超时和空搜索结果不计费。通过DeepSeek Harness、Claude Code、Codex使用DeepSeek API时，服务端搜索与抓取调用目前免费，北京时间2026年11月1日零点开始计费。这项限免针对工具调用，不能理解成模型生成也免费。", "excerpt": "DeepSeek-V4.1-Flash-1017 来了DeepSeek上线了DeepSeek-V4.1-Flash-1017：提升编程等任务表现、缩短输出和完成时间；优化DeepSeek Harness、腾讯CodeBuddy、WorkBuddy适配；增强从零开发游戏和3D项目的能力；开放Search与Fetch接口；同步开放MIT许可的模型权重。网页、App和API已上线。对经常让AI写代码的人", "url": "https://www.zhihu.com/pin/2094935048684414737", "votes": 0, "comments": 0, "feed_ts": 1792251671, "feed_time_str": "10-17 23:41", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么感觉印尼今年对我国突然不友好了呢？", "excerpt": "印尼这个国家你得和澳大利亚一起看，你才能看清楚。 这二个国家地缘冲突严重，且几乎是对方的反义词。 文化上：一个是昂撒文明的边缘地带流放地；一个是中东文明的边缘地带，世界范围内最年轻的皈依者之一。 地理上：澳大利亚解析起来比较简单，他就是个四方皆异类的孤独大陆，所以极度缺乏安全感。二战时，由于鬼子的威胁，澳大利亚毫不犹豫的抛弃了英国投靠了能给自己带来安全感的美国。 印尼则是破碎的千岛之国，文化和基因", "url": "https://www.zhihu.com/question/2058162636995531907/answer/2070684258981754850", "votes": 2776, "comments": 122, "feed_ts": 1792251186, "feed_time_str": "10-17 23:33", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "PP鲁", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "AI冲击下高校何去何从？", "excerpt": "目前老师评职称、拿经费、涨工资、拿评优资格，比拼的就是论文数量和发表档次。 学生毕业、保研、评优，也基本靠论文、如今这些正在快速失效、最直观的变化就是，社会和财政端能给到高校的科研资源、岗位编制、项目经费，都在逐年收缩。论文产出变得越来越容易，可是能兑换的实际资源越来越少。 高校的评价体系，正在从“拼论文数量”，转向全新的考核标准，高校老师的职业赛道，也迎来了彻底的分化。 论文的稀缺性彻底消失。 ", "url": "https://www.zhihu.com/question/2087588177280242635/answer/2090462581324629684", "votes": 97, "comments": 10, "feed_ts": 1792251139, "feed_time_str": "10-17 23:32", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "平凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "蒸馏本身是一门技术", "excerpt": "蒸馏本身是一门技术", "url": "https://www.zhihu.com/pin/2094933703239655811", "votes": 0, "comments": 1, "feed_ts": 1792251121, "feed_time_str": "10-17 23:32", "category": "pin", "cat_name": "想法动态"}, {"actor": "平凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "DeepSeek新模型指纹撞GPT-6我是先在 Twitter 上看到有人用 DeepSeek V4.1 Flash 跟 GPT-6 的指纹对比了一下，发现跟 GPT-6 Astra 的指纹匹配度非常高。但是如果是真的也无所谓，反正这么便宜性能还这么好，谁不蒸馏啊？该蒸馏就蒸馏，蒸馏没什么可耻的。", "excerpt": "DeepSeek新模型指纹撞GPT-6我是先在 Twitter 上看到有人用 DeepSeek V4.1 Flash 跟 GPT-6 的指纹对比了一下，发现跟 GPT-6 Astra 的指纹匹配度非常高。但是如果是真的也无所谓，反正这么便宜性能还这么好，谁不蒸馏啊？该蒸馏就蒸馏，蒸馏没什么可耻的。", "url": "https://www.zhihu.com/pin/2094932967030253139", "votes": 0, "comments": 41, "feed_ts": 1792251049, "feed_time_str": "10-17 23:30", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么冬泳的大都是老年人？", "excerpt": "东汉末年，有个叫王祥的人，喜欢赤着身子趴在冰上睡觉。 某天，睡着睡着，冰突然裂开，王祥掉进水里，被一条人鱼以双峰托起。 王祥见人鱼伟岸，便喊：“妈妈！” 人鱼羞道：“你难道没有自己的妈妈吗？” 王祥说：“我妈死了，后来我爸又娶了个新的，但新的得了病，恐怕快不行了。” 于是人鱼就跟着王祥回家了，进门一看，后妈果然死了。 王祥的父亲名叫王融，是西汉谏议大夫王吉的后代，屡受公府征召，但一直也没去做官。王", "url": "https://www.zhihu.com/question/20103273/answer/2094857666556334914", "votes": 191, "comments": 51, "feed_ts": 1792250769, "feed_time_str": "10-17 23:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "游戏制作使用AI的情况越来越广泛了我对做游戏用ai并不反对，但很显然让许多制作人没那么用心了。新作《使命召唤23》很多cg显然是ai跑的，这个角色的领章一直在变，笑死我了", "excerpt": "游戏制作使用AI的情况越来越广泛了我对做游戏用ai并不反对，但很显然让许多制作人没那么用心了。新作《使命召唤23》很多cg显然是ai跑的，这个角色的领章一直在变，笑死我了", "url": "https://www.zhihu.com/pin/2094834402010330625", "votes": 0, "comments": 3, "feed_ts": 1792250729, "feed_time_str": "10-17 23:25", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "产金国开始扣下自己的黄金，对黄金有何影响？", "excerpt": "有没有想过一个问题：黄金从地底下挖出来之后，到底归谁赚钱？ 以前的老套路是，新兴国家挖矿、把矿石运到国外，精炼和销售的钱都被别人赚走了。现在这个局面正在改变，产金国开始把黄金留在自己手里，自己精炼、自己持有、自己定价。 先看个大背景，黄金本来主要是新兴国家挖的。 世界黄金协会的数据显示，全球黄金产量高度集中在新兴市场：非洲最多，一年约1000吨出头；拉美、亚洲各约650吨；俄罗斯和独联体约600吨", "url": "https://zhuanlan.zhihu.com/p/2094921458124321099", "votes": 10, "comments": 0, "feed_ts": 1792249809, "feed_time_str": "10-17 23:10", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude Code90%代码由Claude写，咋审得过来Claude Code约90%的代码由Claude编写，怎么审得过来？Anthropic团队把大部分代码阅读交给AI，人工审批按改动风险分配。6月至9月，合并请求（PR）数量增至原来的两倍以上，需要回退的比例相对下降40%以上。这是团队内部观察，不代表取消人审就能提高质量。提PR前先验证，AI发现的问题也要复核Claude先运行测试、构建或界面检查，出示实际输出，再让全新上下文的agent审查代码改动。提交PR后，多个agent并行找bug，另一组验证发现，过滤纯样式和清理意见。安全审查独立进行，自动测试和构建也必须通过。bug或安全审查还有未处理发现，就不能合并；要么修复，要么写明理由关闭。低风险可信作者可免审批，高风险两人批文档、文案、功能开关后的增量改动等低风险变更，自动检查通过后可以免人工审批，但较宽松的路径只对可信作者开放，敏感路径仍要人看。普通产品变更及部分敏感区域需要1人，最高风险改动需要2人。指挥agent写代码的人可以计入审核人数；AI批准不能顶替必需的人工批准，上线结果仍有人负责。三轮还没收敛，就重新考虑方案团队曾有一个PR一夜审改50多轮。AI作者会认真修改人可能忽略的小意见，每次修改又触发新一轮审查，循环就这样延长。现在三轮后让作者退一步重想方案，前几轮之后只复查新增改动，同类bug一次指出、不重复发旧发现。调整后，平均通过所需审查次数从2.08降至1.32。轮数上限触发的是重新判断，不是自动合并。先补验证和回滚，再减少人工审批团队建议从一个仓库试点：把反复出现的审查要求写进REVIEW.md，PR模板写清“怎么测、风险是什么、怎么回退”。新功能先内部试用，再分批发布，功能开关能快速关闭，出错时保留撤回路径。判断有没有省下人力，要把审代码和修故障的时间一起算，并持续观察回退比例、事故率。没有这些检查与纠错条件，就不适合直接照搬低风险免审批。", "excerpt": "Claude Code90%代码由Claude写，咋审得过来Claude Code约90%的代码由Claude编写，怎么审得过来？Anthropic团队把大部分代码阅读交给AI，人工审批按改动风险分配。6月至9月，合并请求（PR）数量增至原来的两倍以上，需要回退的比例相对下降40%以上。这是团队内部观察，不代表取消人审就能提高质量。提PR前先验证，AI发现的问题也要复核Claude先运行测试、构建", "url": "https://www.zhihu.com/pin/2094926773632885861", "votes": 0, "comments": 0, "feed_ts": 1792249498, "feed_time_str": "10-17 23:04", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI升级了ChatGPT 中的 GPT-6 Astra ProOpenAI 更新了 ChatGPT 中的 GPT-6 Astra Pro：同一个任务可以由多个 agent 分头同时做，能查看各自进度，完成后还能分别打开检查工作内容。同一轮更新还包括响应提速，以及插件和工具使用改进。功能正向符合条件的 Pro 用户逐步开放，入口在 Chat 标签页。一个任务可以分成几份同时推进agent 可以理解为会调用工具做事的 AI 助手。多个 agent 可以处理同一任务的不同部分。需要核查进展时，可以看每一部分做到哪了；有部分完成，就能打开查看它做了什么。对复杂任务来说，分头推进和分别检查要一起看。几份工作都显示“完成”，仍需要核对内容是否正确、合起来是否矛盾。检查结果的时间，也要算进完成任务的总耗时。入口在Chat，向Pro用户逐步开放这里有两个 Pro：Pro 用户指订阅资格，GPT-6 Astra Pro 指本次更新的模型。使用位置是 ChatGPT 的 Chat 标签页，不能把这条更新理解成所有模型、所有入口都同步改变。开放采用逐步推送。组织工作区还要看管理员设置和开放资格，买了订阅也不代表每个账户立刻看到同样的界面。并行任务怎么扣额度还没讲清响应究竟快了多少、同时能运行多少个 agent，这次发布说明没有给出数字。每个 agent 用什么模型、共享信息和结果冲突怎样处理，也没有展开。用量规则同样不能靠 agent 数量推算。Pro 帮助文档列出的影响因素包括模型、上下文、推理、工具使用、检索、缓存和速度模式；这次并行运行怎样计入额度，发布说明没有解释。不能直接理解成“一次请求只扣一次”，也不能认定“开几个就扣几倍”。可拆分任务要比较检查后的总耗时这次更新把分工、查看进度和检查已完成工作放在同一段对话里。已有 Pro 且获得入口的用户，可以拿一项能分开处理、也能分别核验的任务试运行，比较拿到合格结果的总耗时，连同检查、修改和用量一起记录。只看同时跑了几个 agent，还不足以判断省不省事。", "excerpt": "OpenAI升级了ChatGPT 中的 GPT-6 Astra ProOpenAI 更新了 ChatGPT 中的 GPT-6 Astra Pro：同一个任务可以由多个 agent 分头同时做，能查看各自进度，完成后还能分别打开检查工作内容。同一轮更新还包括响应提速，以及插件和工具使用改进。功能正向符合条件的 Pro 用户逐步开放，入口在 Chat 标签页。一个任务可以分成几份同时推进agent 可", "url": "https://www.zhihu.com/pin/2094923830502413306", "votes": 0, "comments": 0, "feed_ts": 1792248833, "feed_time_str": "10-17 22:53", "category": "pin", "cat_name": "想法动态"}, {"actor": "南爸安爸", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "ai可以许愿式编代码，不能许愿式决策最近做模型对未来计算系统的洞察、量化分析，也我用了一些ai协助，用几个ai，搭建一个量化数据的分析、记录，提提分析效率，我提想法，ai实现，再修正，最终数据平台的mvp版本，比我过去小十人的开发团队效率还要高。遵循开发设计先行、再开发、再迭代、测试等，ai搭档效率非常理想。体会：对ai效率在高的期望还是有的，交互可以再快一点；ai还是提效，例如计算系统的量化分析和决策还是要专家参与，ai负责周边，ai可以许愿式编代码，不能许愿式决策，是好事，程序员可以专注研究性思维工作", "excerpt": "ai可以许愿式编代码，不能许愿式决策最近做模型对未来计算系统的洞察、量化分析，也我用了一些ai协助，用几个ai，搭建一个量化数据的分析、记录，提提分析效率，我提想法，ai实现，再修正，最终数据平台的mvp版本，比我过去小十人的开发团队效率还要高。遵循开发设计先行、再开发、再迭代、测试等，ai搭档效率非常理想。体会：对ai效率在高的期望还是有的，交互可以再快一点；ai还是提效，例如计算系统的量化分析", "url": "https://www.zhihu.com/pin/2094919923667683209", "votes": 0, "comments": 0, "feed_ts": 1792248379, "feed_time_str": "10-17 22:46", "category": "pin", "cat_name": "想法动态"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么现在全世界都在打仗，只有中国那么稳定？", "excerpt": "稳定只是你现在看到的。 就现在，我的战友还在中印边境海拔5000多米的地儿坚守。 （主页置顶回答很好看） ", "url": "https://www.zhihu.com/question/2015064353779513108/answer/2040086181426291322", "votes": 3995, "comments": 260, "feed_ts": 1792248353, "feed_time_str": "10-17 22:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "现在全网有没有人复刻了懂车帝对尊界的测试呢，有没有可信信源？", "excerpt": "这个测试第一要钱，第二要命。 那么问题回来了，如果华为真觉得自己的车没问题， 为什么不全程直播复刻懂车帝的测试，并且连续100公里急刹40次狠狠抽懂车帝的脸呢？ 是华为测不起？还是测试员死不起？ ", "url": "https://www.zhihu.com/question/2093626349642634279/answer/2094920220691396254", "votes": 17, "comments": 21, "feed_ts": 1792247903, "feed_time_str": "10-17 22:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Anthropic STEM 研究员计划的新进展Claude设计出更省资源的量子电路Anthropic让Claude Mythos 5设计量子电路：8项基础计算任务中，7项相对论文选定的已有设计，同时减少了Toffoli门和逻辑量子比特。它优化的是未来量子算法的资源需求，还没有在量子计算机上跑出提速结果。程序先验对错，Claude再改电路研究团队给出数学任务的文字描述，Claude编写生成电路的Python代码。独立评估程序检查结果和临时数据是否正确还原，再按“Toffoli门数×峰值逻辑量子比特数”打分；Claude根据反馈反复改设计。Toffoli门是一类执行成本较高的量子操作。少用这些门、少占逻辑量子比特，才是这里“更省”的具体含义。53小时对应椭圆曲线点加的一次运行，期间仍有少量人工提示，并非8项任务全在53小时内完成。重建计算历史，减少中间记录量子计算不能像普通程序那样直接丢掉临时数据，而要用逆运算把它们还原。这会让“先存着、以后再清理”的中间记录占用大量量子比特。Claude找到的一个办法，是从更新后的数值重建部分计算历史，减少逐轮保存；再根据重建所需的门数，决定哪些记录值得保留。省存储和省操作有时冲突，需要一起算账。门数约降至1/17，比特数却增加12%在椭圆曲线点加中，一个Claude设计用了约400万Toffoli门、935个逻辑量子比特。相对所列旧方案中最省比特的设计——约7000万门、838个比特——门数约降至1/17，比特数却增加约12%。这是明确的资源取舍，不能写成所有指标都提高17倍。资源下降，真机耗时仍需另算电路的门数和逻辑量子比特数，还不能直接换算成运行秒数：硬件、纠错和操作如何并行都会影响结果。研究中大输入空间的正确性检查也包含抽样，不等于每个输入都完成形式化证明。模型参与电路设计，外部程序负责检验和筛选。它可能降低未来应用的资源门槛；化学模拟等任务何时能实用，仍要看算法之外的硬件条件。", "excerpt": "Anthropic STEM 研究员计划的新进展Claude设计出更省资源的量子电路Anthropic让Claude Mythos 5设计量子电路：8项基础计算任务中，7项相对论文选定的已有设计，同时减少了Toffoli门和逻辑量子比特。它优化的是未来量子算法的资源需求，还没有在量子计算机上跑出提速结果。程序先验对错，Claude再改电路研究团队给出数学任务的文字描述，Claude编写生成电路的P", "url": "https://www.zhihu.com/pin/2094920016898610929", "votes": 0, "comments": 0, "feed_ts": 1792247902, "feed_time_str": "10-17 22:38", "category": "pin", "cat_name": "想法动态"}, {"actor": "南爸安爸", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价DeepSeek V4.1 Flash 1017?", "excerpt": "1、OpenAI一边向上发展应用创新，一边向下发展芯片，精力分散，会不会老巢被端模型精度个成本的帕托拉曲线仍然是核心竞争力，openai 相比anthropic 和deepseek不聚焦。deepseek 不断推高的帕托拉曲线，就像一个北极星，模型公司竞争对手要过于分散兵力，可能就打不过了 2、都在强调3D能力，在为下一个具身战役铺垫，具身大模型公司应该也会陆续睡不着，万一多模态大模型对世界模型的", "url": "https://www.zhihu.com/question/2094773240036061683/answer/2094918439253165691", "votes": 5, "comments": 0, "feed_ts": 1792247478, "feed_time_str": "10-17 22:31", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "剑锋无尘", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "各位炒股的，你们因为提前止损错过回本机会后悔的次数多，还是因为扛单导致亏损扩大后悔的次数多？", "excer 家，引发了大量争议（链接）。这之后，政治活动家阿比吉特·迪普克提出：“如果被视作社会负担、被忽视的青年联合起来会怎样？”这促成了“蟑螂人民党（CJP）”的诞生，后者广泛参与之后印度的多次抗议活动，被认为是印度Z世代不满的宣泄（链接）。一开始抗议矛头指向考试制度改革和追究大法官发言责任，并逐渐转向让教育部长下台。在之后因为活动人士索南·旺楚克绝食后进入医院，以及反对党积极参与，影响进一步扩散。在9月前后，因为多地发生的逮捕活动（链接），以及司法当局对于部分参与活动来抗议NEET试题泄露的学生撤销指控（链接），剿抚并用姑且压下了怒火。然而，十月份印度首席选举专员疑似越权的删除选民资格的举动，再度引发矛盾（链接）。迪普克等CJP核心人员被逮捕后获释，并且仍在持续抗议（链接）。印度近期的社会活动常被拿来与尼泊尔、孟加拉国等国的政权更迭活动做比较，尽管迪普克本人试图与其划清界限（链接）。客观而言，印度的政权稳定性远强于尼泊尔等国，印人党远没到山穷水尽的地步，但印度的社会撕裂程度仍在加深。今年早些时候印度宣布彻底终结纳萨尔派活动，但urban-naxel（城市纳萨尔派）这个扣帽子用词也是印度体制内部撕裂，印人党指责反对党的部分左翼-中间派立场并达到水火不容程度的一个证明。印度在冷战期间保持了非常优秀的政治稳定性，并在近些年自夸“民主之母”，但这套叙事是否能维持下去或许有待观察。", "excerpt": "印度近期抗议始末小结算是给我这段时间被推送的印度鉴证视频做个总结。近期因印度大量选民被除名引发大量争议，首席选举专员吉亚内什·库马尔受到指责，在随后的抗议活动中数千人被拘留，反对党领袖、前国大党主席拉胡尔·甘地也一度被拘留（链接）。印度近些年经济整体发展尚可，但AI冲击下IT服务业裁员、印人党的印度教民族主义治理策略以及大量社会矛盾冲淡了经济发展的利好。今年5月3日的印度NEET入学考试被证实发生", "url": "https://www.zhihu.com/pin/2092958454340231401", "votes": 0, "comments": 0, "feed_ts": 1792207246, "feed_time_str": "10-17 11:20", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "特斯拉为啥要造一款会「飞」的汽车？", "excerpt": "这个东西存在的意义本质上是一个盛大的广告。 用来让品牌变得更酷更科幻。 我有能飞的翻跟头的汽车，我的牌子跟别的牌子就是不是一个档次。 冰箱彩电大沙发以及刹车踩不踩得断跟这个show来比，真的太魔幻了。 当然，这只是一个show。 真要赚钱走量的还是毛豆3和毛豆y。 就像仰望是地球上最快的车，但真的赚钱还是要靠王朝和海洋。 纽北之王911不赚钱，赚钱还得是macan和卡宴。 骑着单车去酒吧，该省省该", "url": "https://www.zhihu.com/question/2094526225645401301/answer/2094748003932300436", "votes": 280, "comments": 30, "feed_ts": 1792206843, "feed_time_str": "10-17 11:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "媒体曝付费可进「中国天眼」核心区，中科院已成立调查组，这会对科研观测造成哪些危害？暴露出哪些管理问题？", "excerpt": "先不说渎职罪的问题（虽然已经非常严重了），我们不妨先单纯看看私带手机的危害，这种事只讲规范总有人是不信的， 那不妨看看前车之鉴....1998 年时澳大利亚帕克斯望远镜（ CSIRO Parkes Observatory | Australia Telescope National Facility）持续捕捉到一个周期性神秘射电脉冲信号。当时的天文学家们一度猜测是地外文明，异常兴奋，因此后续的研究", "url": "https://www.zhihu.com/question/2092676319515620288/answer/2093293433783850426", "votes": 921, "comments": 建立大型农场，推动小农放弃土地，压根不顾当时罗马尼亚农民中小农占据约95%的绝大多数的事实(想必大家应该认识到PNȚCD这帮人在知乎上也有对应群体的，名字我也就不点了[doge]）。至于振兴农村就更不用说了，按照外界的评价是PNȚCD“压根没有复兴我们农业文明的纲领”。另外PNȚCD内部有强大的希腊东正教（与罗马教廷共融但保留东方礼仪） 传统，该党知名参议员马泰·博伊拉（Matei Boilă） 本人就是一位希腊天主教神父，然后就是这个憨批1996年提出发起了一项归还1948年被康米党没收的希腊天主教会的财产（包括教堂）的法案(1997年6月在参议院通过。该法案之后提交到众议院，但是一直拖到2001年9月PSD上台后被否决），直接得罪了罗马尼亚本地东正教会(BOR)，使得BOR公开抨击CDR政府违反“政教分离”——考虑到BOR从FSN时代以来就跟PSD及其前身政党的合作关系，外加BOR在罗马尼亚社会尤其是农村的绝对权威(2000年的调查显示，民众对BOR的信任度高达 86%，在所有国家机构中遥遥领先。也就是这些年由于BOR内部的性丑闻与腐败行为以及频繁的公开的党派站队，才使得对BOR的信任度在2019年下滑到54.5%。教会在整个90年代信任度长期在80%-90%的极高区间，跟信任度在19%-38%的议会形成鲜明对比），这个打击对PNȚCD主导的CDR政府尤其是其在农村的支持(CDR执政的1996-2000年，罗马尼亚农村人口占全国人口的45%-47%，这意味着什么你想想看[doge])。BOR的克卢日都主教巴托洛梅乌·阿纳尼亚（Bartolomeu Anania）1998年4月中旬在克卢日的一座东正教大教堂被裁定归还给希腊天主教会引发骚乱之后直接鼓动上千名BOR东正教神父上街示威，当时他还警告各政党如果议会和政府不重视东正教的利益（特别是财产利益）他将动员BOR直接介入政治；更有甚者，1999年9月12日，由于PNȚCD主导的CDR政府拒绝在《宗教法》草案中给予BOR“国家教会”地位，宗主教泰奥克蒂斯特（Teoctist）以缺席PNȚCD主席扬·迪亚科内斯库（Ion Diaconescu）家乡教堂祝圣仪式的方式，表达了公开抗议，罗马尼亚媒体当时用“Teoctist a intrat în grevă!”（泰奥克蒂斯特罢工了！）来讽刺这一事件——这个其实就是告诉所有农村神父与信徒俺们BOR跟CDR各党势不两立[大笑]没有什么PNȚCD空出来的位置被PSD接管的事儿，农村-东正教选民本来就是PSD的，连PSD时任秘书长保罗·斯特内斯库（Paul Stănescu）2025年10月15日也就是PSD党党章删除“进步主义”一词后就直球说了“按照我们的意识形态……我们更像是一个基督教民主党。我们与瑞典或挪威的社会主义政党并不是非常相似。”(„După ideologia noastră… suntem mai mult un partid creștin-democrat. Nu ne asemănăm foarte mult cu partidele socialiste din Suedia sau Norvegia.”）记者当时还问他宗教将在PSD的政治纲领中发挥什么作用，斯特内斯库当时就回复说“这个嘛，没有上帝，一切都无从谈起。”(„Păi fără Dumnezeu nimic nu e.”）[飙泪笑]PS：PSD放在战间期对应的大概是旧PNL(国家干预主义政策，腐败与庇护主义，中央集权倾向，与国家机器高度融合的建制派，瓦拉几亚基本盘，民族主义，etc)，现在的PNL放在战间期对应的才是旧PNȚ(特兰西瓦尼亚基本盘，反建制，反腐败，强调民主与法治，地方自治倾向，自由保守主义色彩，etc）", "excerpt": "这篇文章其实多少有问题：PNȚCD(基督教民主国家农民党)虽然名义上是PNT(国家农民党)的继承者，但是作为反伊利埃斯库联盟CDR(罗马尼亚民主公约)的核心力量，该党的主力主要是靠城市的反康米主义者与亲西方中右翼选民[尴尬]有农民之名但是没有农民之实，也就是说它跟现在的PNL一样纯二创作品[尴尬]实际上从90年代一直到AUR异军突起之前罗马尼亚农村一直是被FSN-FDSN-PDSR-PSD一系统治", "url": "https://www.zhihu.com/pin/2094587318980105407", "votes": 0, "comments": 6, "feed_ts": 1792202180, "feed_time_str": "10-17 09:56", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "1000米恐惧症", "v const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

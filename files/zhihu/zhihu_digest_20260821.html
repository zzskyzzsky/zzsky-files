手能靠脑子记住教练的每一个动作要领（工具调用），但在实战中根本反应不过来；真正的顶级选手靠的是肌肉记忆（参数内化）。模型如果事事都要查工具，不仅速度慢、可靠性差，更重要的是它无法像大模型那样通过海量数据训练形成一种“合成直觉”。社区评论对此展开了激烈碰撞，有人认为大模型买到的是“被编译过的经验”，而工具调用每次都要在运行时重新构建路径，成本极高；也有开发者指出，虽然大模型判断力更强，但面对实时更新的信息，工具依然是不可或缺的“新鲜度”来源。这件事的核心在于，智能的质量往往取决于知识在多大程度上变成了“本能”。小模型加工具能完成杂活，但处理复杂、长程的任务时，频繁的工具调用会迅速填满上下文窗口，并让错误在链条中不断叠加。正如社区所言，你不能指望看着Excel表格去赛车，速度本身就是智能的一部分。虽然小模型在特定垂直领域能靠微调或持续学习追赶，但对于追求极致智能的场景，Bitter Lesson（苦涩的教训）依然适用：堆参数规模带来的内化能力，目前还没有替代品。", "excerpt": "【参数即本能：为什么靠“外挂”救不了小模型】OpenAI研究员Jason Wei近期反思了一个行业共识：过去大家认为只要模型有个1B规模的“认知核心”，剩下的靠联网搜索或运行代码这些“外挂工具”就能搞定。但他现在认为这完全错了。他用练羽毛球打比方：新手能靠脑子记住教练的每一个动作要领（工具调用），但在实战中根本反应不过来；真正的顶级选手靠的是肌肉记忆（参数内化）。模型如果事事都要查工具，不仅速度慢", "url": "https://www.zhihu.com/pin/2073338801829815369", "votes": 0, "comments": 0, "feed_ts": 1787245682, "feed_time_str": "08-21 01:08", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么我觉得加索尔很强？", "excerpt": "先看数据 加索尔80年出生，在湖人三进总决赛的年龄是28、29、30。 总决赛数据： 14.7+10.2 18.9+9.2 18.6+11.6 波什84年出生，在热火四年总决赛的年龄是27、28、29、30。 总决赛数据： 18.5+7.3 14.6+9.4 11.9+8.9 14+5.2 加索尔这三年数据越来越好，波什数据越来越差，俩人正好是反方向。 波什比加索尔进总决赛年轻了一岁。 波什牺牲了", "url": "https://www.zhihu.com/question/647036957/answer/3520118285", "votes": 224, "comments": 290, "feed_ts": 1787245637, "feed_time_str": "08-21 01:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI不留存企业数据，怎么识别多轮风险？对符合资格、把代码、合同、病历或内部资料交给 API 的企业来说，Zero Data Retention（ZDR）意味着请求处理结束后，OpenAI 不保留提示词和模型回答，员工也不能查看这些内容。可当 agent 一次任务会跨很多轮、持续更久，风险往往不在某一条对话里，而在多次交互连起来之后。OpenAI 现在预览的 Private Safety Processing，想解决的正是这件事：让自动安全系统跨关联交互找风险模式，同时不让 OpenAI 人员接触底层内容。它正在与早期客户测试，尚未面向所有 API 客户或 ChatGPT 用户开放。为什么现在要补这一层OpenAI 给出的背景是，模型开始接手更长、更自主的工作后，严重风险经常要把多次交互放在一起才会浮现。逐条检查很难看出有人反复试探护栏、跨账户协同，或 agent 收到停止指令后仍继续执行。另一边，近期一些前沿模型部署会要求客户为安全监控保留敏感内容。对处理金融记录、病历、商业计划和专有研究的企业，这可能与自身的安全义务、监管要求和保密承诺冲突。Private Safety Processing 的出发点因此很具体：ZDR 继续保留，跨轮风险也不能完全放弃识别。ZDR原来只能逐条看请求现有兼容 ZDR 的安全系统按单次交互评估。这样能保护数据边界，却看不到上述跨多轮才显现的关联模式。Private Safety Processing 把观察范围扩到“相关交互”，用来补上逐条检查看不到的关联模式；这不意味着重新让人工翻看企业数据。自动系统处理内容，人工只收到受限信号这里最容易误读。所谓“人工不可见”，并不表示系统完全不处理内容。官方描述是：自动系统识别到潜在风险后，会向 OpenAI 返回一个范围受限的活动类型信号，供其判断是否需要处置；OpenAI 人员不拿到原始提示词和回答。客户仍可在自己的系统里调查警报。遇到申诉、澄清合法用途，或协助已验证滥用调查时，客户可以自行选择把相关信息交给 OpenAI。数据放在哪里，控制权有什么不同在 ZDR 部署里，客户内容仍放在客户控制的基础设施中。OpenAI 还在开发另一种选择：内容保存在 OpenAI 基础设施，但由客户控制的密钥加密，OpenAI 人员不持有密钥。这解决的是企业常见的两难：想要更完整的安全识别，又不希望供应商员工能直接调阅内部数据。具体隔离强度、信号颗粒度和审计方式，仍要等技术白皮书公开后才能判断。当前只有早期客户测试OpenAI 计划在 2026 年 9 月开始推出 Private Safety Processing，并发布技术白皮书。", "excerpt": "OpenAI不留存企业数据，怎么识别多轮风险？对符合资格、把代码、合同、病历或内部资料交给 API 的企业来说，Zero Data Retention（ZDR）意味着请求处理结束后，OpenAI 不保留提示词和模型回答，员工也不能查看这些内容。可当 agent 一次任务会跨很多轮、持续更久，风险往往不在某一条对话里，而在多次交互连起来之后。OpenAI 现在预览的 Private Safety P", "url": "https://www.zhihu.com/pin/2073934658195277454", "votes": 0, "comments": 0, "feed_ts": 1787244563, "feed_time_str": "08-21 00:49", "category": "pin", "cat_name": "想法动态"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "《黑神话：钟馗》主角钟馗首次露脸亮相，如何评价这版青年钟馗的形象设计？", "excerpt": "我嗅出了钟馗嫁妹的剧情味道，且听我深入分析。 这个主角是死后钟馗复活之后。额头的伤疤，对应着钟馗在大殿上撞阶或柱而死的致命伤口。说明时间线是在钟馗死后不久。 钟馗在最后一段蒙太奇剪辑斗剑那里，能被剑刺出伤口，会流血。下水也会憋气，上岸也会喘气，是有生命特征的。但他身上被插了几剑都不带倒下，又说明他此时似乎是不死之身。所以，我认为此时钟馗处在肉身死后和封神之间的一种或是行尸走肉，或是残魂，或是得了神", "url": "https://www.zhihu.com/question/2073712813759887078/answer/2073934601958041544", "votes": 17, "comments": 0, "feed_ts": 1787244541, "feed_time_str": "08-21 00:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "木文", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "两人买三张票空座放零食，站票乘客想入座，列车员称无法强制协调，你觉得该让座吗？两人买三座算浪费资源吗？", "excerpt": "从本案知乎的主流观点来看，民法典虽然已颁布多年，不少人还依然在咀嚼回味人情社会的道德红利，在这个问题上表现出了奇迹般的高尚品德。 A用B的钱买了票没上车，将座位让给B，B为了避免他人占用，在座位上堆放了零食。 本案的法律关系特简单，运输合同属于债权，债权是完全可以转让的。只是客运实名制背景下，转让债权不能免除受让人实名购票的义务。实名制购票义务与受让座位使用权这一债权是两个独立的法律关系，根本不能", "url": "https://www.zhihu.com/question/2073342342912795120/answer/2073934205491458410", "votes": 0, "comments": 6, "feed_ts": 1787244447, "feed_time_str": "08-21 00:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Gemini学生会员这个是我觉得最值得薅的一个羊毛。你可以不用管Gemini到底烂不烂，主要是它附带的谷歌 Drive（一年应该是 400G）非常值得，以及谷歌的大香蕉生图也还可以。可以说是不薅白不薅，非常建议不要错过。", "excerpt": "Gemini学生会员这个是我觉得最值得薅的一个羊毛。你可以不用管Gemini到底烂不烂，主要是它附带的谷歌 Drive（一年应该是 400G）非常值得，以及谷歌的大香蕉生图也还可以。可以说是不薅白不薅，非常建议不要错过。", "url": "https://www.zhihu.com/pin/2073927427160654242", "votes": 0, "comments": 2, "feed_ts": 1787242940, "feed_time_str": "08-21 00:22", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "GEN-1.5让机器人看一遍学短任务让机器人学一个新动作，通常得收集演示再训练。Generalist 的 GEN-1.5 换了一种做法：把一段 3 至 12 秒的操作示范放进上下文，它就直接尝试执行。在 10 项短时程操作里，不做梯度更新时的平均成功率是 59%。这还不是“看一遍就会干所有活”，但机器人适配新任务的起点确实被压短了。3至12秒示范，怎样变成机器人的提示这里的“一次示范”不只是给模型看视频。GEN-1.5 会把传感器观察和动作轨迹放进约 30 秒的上下文，再以 100 Hz 输出动作轨迹。官方把这种输入叫作 physical prompting：先让它看一段具体操作，再让它在相近但不完全相同的状态下完成目标。10项短操作，59%到底说明什么实验包括从钱包里取钱、折纸、拧罐盖、叠杯子、扫小物件进碗、翻转手机和拉开拉链袋等。它们是短时、原子化的桌面操作，不是做饭、整理房间这类多步骤任务。一次 3 至 12 秒示范、零梯度更新时，10 项任务平均成功率为 59% ± 10% 标准差。把每项任务约 5 分钟、约 50 次演示拿来做 10 个梯度步微调后，平均成功率升至 83% ± 9%。同一篇博客也把边界说得很清楚：一次示范的上下文学习更脆弱，微调结果更稳定。两段示范，也能接成连续动作还展示了把两个操作示范一起塞进上下文的情况。模型会在两段动作之间补出重定位、重新抓取或纠错等中间步骤，把两个技能接成一个连续任务。这点值得关注，因为现实里的教学往往不是重新训练一个动作库，而是临时把已有动作拼起来。不过当前证据来自这类短操作演示，不能据此推到长流程机器人已经具备稳定规划能力。模拟和人手都能作为起点在给出的 sim-to-real 演示里，提示可以全部由模拟器生成，例如脚本策略、RL agent 或人在模拟器中遥操作。官方称模型预训练没有模拟数据，展示的任务也没有在模拟或真实环境中训练，但模型仍可在真实机器人上尝试执行。另一些例子中，人手直接在机器人相机视野里演示，机器人随后模仿。它更像一种教学接口的探索：示范的来源可以变多，但不等于任何角度、任何环境下的人类动作都能可靠迁移。59%的短任务结果，离上岗还很远GEN-1.5 当前给出的证据，足以说明预训练过的机器人模型可以把“教一个动作”的流程缩短到一次短示范；它还没有证明机器人能在开放环境里长期、稳定地完成复杂任务。还没有公布权重、代码或试用入口。", "excerpt": "GEN-1.5让机器人看一遍学短任务让机器人学一个新动作，通常得收集演示再训练。Generalist 的 GEN-1.5 换了一种做法：把一段 3 至 12 秒的操作示范放进上下文，它就直接尝试执行。在 10 项短时程操作里，不做梯度更新时的平均成功率是 59%。这还不是“看一遍就会干所有活”，但机器人适配新任务的起点确实被压短了。3至12秒示范，怎样变成机器人的提示这里的“一次示范”不只是给模型", "url": "https://www.zhihu.com/pin/2073926220337697452", "votes": 0, "comments": 0, "feed_ts": 1787242554, "feed_time_str": "08-21 00:15", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "ClawGym II证明：真实Agent运行时本身就是训练分布的一部分\n图文版：链接Qwen3-30A3B在Claude Code执行壳上Pass@1涨14.81分ClawGym II 用黑盒强化学习优化 Qwen3-30A3B，在 Claude Code 执行壳上 ClawGym-Bench Pass@1 提升 14.81 分，在 OpenClaw 执行壳上提升 9.98 分；PinchBench 上 OpenClaw 提升 11.71 分，Claude Code 提升 17.28 分。训练在 200 到 400 个优化步内保持稳定，并支持两个异构执行壳联合训练。黑盒RL不打开执行壳，用捕获调用重建可训练轨迹现代 agent 执行壳内部包含系统提示、工具接口、上下文管理、重试与恢复机制，纯文本或简单环境里的优化方式难以直接迁移。框架把执行壳当作不透明 rollout 环境，在模型请求边界记录 token，再把碎片化调用重建成共享历史的轨迹，并过滤重试产生的死路径以及子 agent 和上下文压缩产生的辅助轨迹。PPO（Proximal Policy Optimization，近端策略优化）与 GRPO（Group Relative Policy Optimization，分组相对策略优化）都能在恢复后的轨迹上优化；混合执行壳训练时，同一任务可配对不同执行壳，奖励归一化按任务和执行壳对内独立进行，联合训练后的模型在两个执行壳上匹配或略超单执行壳训练结果。白盒迁移只有部分收益，数值边界限定在Qwen3-30A3B和指定评测冷启动初始化比直接从基础模型训练奖励起点更高、曲线更平滑，但直接强化学习仍然有效。白盒 AgentLoop 训练出的 WhiteBox-30A3B，在白盒环境平均分 59.90，比初始化基线 41.69 提升 18.21 分；迁移到 OpenClaw 后只从 45.11 提升到 50.33，低于黑盒训练在 OpenClaw 下的 62.62，说明白盒获得的能力只能部分迁移。JobBench-Easy 和 OfficeQA-Full 也分别从 20.46 提升到 27.20、从 8.53 提升到 21.54；所有提升都基于 Qwen3-30A3B 及其冷启动模型在指定评测上的结果，训练稳定性的结论也只在 200 到 400 步范围内。原文标题：ClawGym II: Exploring Black-Box RL on Agent Harness#无影寺 ", "excerpt": "ClawGym II证明：真实Agent运行时本身就是训练分布的一部分\n图文版：链接Qwen3-30A3B在Claude Code执行壳上Pass@1涨14.81分ClawGym II 用黑盒强化学习优化 Qwen3-30A3B，在 Claude Code 执行壳上 ClawGym-Bench Pass@1 提升 14.81 分，在 OpenClaw 执行壳上提升 9.98 分；PinchBenc", "url": "https://www.zhihu.com/pin/2073924395593220613", "votes": 0, "comments": 0, "feed_ts": 1787242311, "feed_time_str": "08-21 00:11", "category": "pin", "cat_name": "想法动态"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待留英学生，在图书馆发现大量中国古代科技类书籍？", "excerpt": "伪史论者最大的问题是，他们只会凭借想象质疑，但从来不仔细学习，甚至不愿意多看一眼他们的证据。 远西奇器图说录最-远西奇器图说录最全文原文及译文-识典古籍这本书叫远西奇器图说录最，是中国最早的介绍西方技术的书籍。在网上有在线阅读版，看一眼就知道这本书说的是什么了。 我在其他贴子里跟人对喷的时候才意识到一件事。 这页图书和红色箭头标出的，是拉丁字符和罗马字符：a、d、i，还有个我没画箭头的e 这本书的", "url": "https://www.zhihu.com/question/11458064350/answer/2034431202959029513", "votes": 374, "comments": 196, "feed_ts": 1787242200, "feed_time_str": "08-21 00:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价《牛来》电影的片尾曲《雨后轻风有香》？", "excerpt": "你花了整整五年在做一件注定要成为别人笑柄的事，但是你老妈非但没骂你没阻止你还全力支持你，让你这五年的努力没有白费。这就是最可贵的地方…… ", "url": "https://www.zhihu.com/question/2072521075448099184/answer/2073709704593855115", "votes": 238, "comments": 7, "feed_ts": 1787242196, "feed_time_str": "08-21 00:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "DefTruth", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "GPU GEMM使用FP16累加与FP32累加峰值算力探讨", "excerpt": "本文探讨消费级GPU上矩阵乘法（GEMM）使用FP16累加和FP32累加方式下不同的峰值算力（以及有效算力），旨在提醒自己和读者留意FP16累加与FP32不同累加方式下GPU的性能区别。特别是提醒大家留意PyTorch默认使用的累加方式。 一、Tensor Core 的矩阵乘法使用FP16累加与FP32累加NVIDIA GPU Tensor Core的GEMM（矩阵乘法）是通过MMA 指令（Mat", "url": "https://zhuanlan.zhihu.com/p/2073466359158252040", "votes": 8, "comments": 1, "feed_ts": 1787239116, "feed_time_str": "08-20 23:18", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Gemini给学生免费一年，资格和申请一次说清Google 给符合条件的大学生放出了一年免费 Gemini：美国学生领 Google AI Pro，140 多个国家和地区的学生领 Google AI Plus。先核对学校、账号和订阅状态能否通过资格校验，再决定要不要申请。谁能申请，不是只有学生邮箱Google 8 月 19 日更新的学生优惠条款列了五项同时满足的条件：(1) 年满 16 岁；(2) 是高等教育机构的在校学生；(3) 该机构所在地区支持 Google AI Plus；(4) 按页面要求完成有效学校邮箱验证；(5) 使用个人 Google 账号，并有 Google Payments 账号和合格付款方式。有几类人即使在读也不能直接领：已经订阅 Google One、在家庭组里、通过企业、Google Fi 等第三方订阅 Google One、使用受监管账号，或使用学校分配的 Workspace 教育版账号。条款还明确排除了学校位于玻利维亚、阿尔巴尼亚、加拿大、香港、澳门、突尼斯的学生。其他地区是否可用，最终以登录后的官方申请页为准。从资格核验到领取，只走四步(见图2)申请成功后，能拿到什么非美国地区主帖对应的是 Google AI Plus。官方学生页列出的内容包括更高的 Gemini 使用额度、400 GB Google 相册/云端硬盘/Gmail 共享存储、Gemini Omni、更多学习笔记本来源、交互式可视化和 Gemini Live。这次的重点并不只是聊天额度。学生中心可以把课程材料放进学习笔记本，生成学习指南、个性化测验和进度追踪；官方还展示了在聊天里生成可交互 3D 模拟和动态图表的能力。当前申请页写明，AI Plus 可分析最多 200 页课堂笔记，并提供 Gemini Omni Flash 与 Nano Banana 的更多使用权限。美国学生则由主帖明确为一年免费 Google AI Pro。它是更高一档的计划，但完整权益和具体资格会随地区申请页而变，别把其他地区页面上看到的 Pro 配置直接套到自己的账号。免费一年，也要看下面两个边界第一，Google 写的是“符合条件的大学生”，不是所有教育邮箱都自动通过。评论和引用里反复出现地区、已有订阅与验证失败的问题，这些只能说明申请前要核对条款，不能替代官方资格判断。第二，12 个月免费不等于永久免费。条款说明到期后如未取消，会按照所在地区相应方案的标准月费自动扣款；同时，促销期内的用量上限也可能与付费 Google One 会员不同，并可能因容量限制调整。对正在用课程资料做复习、测验和图文演示的大学生，这个入口值得先试。对不确定学校所在地、已有 Google One 或账号归属的人，先在官方页面核对资格，再决定要不要绑定付款方式。", "excerpt": "Gemini给学生免费一年，资格和申请一次说清Google 给符合条件的大学生放出了一年免费 Gemini：美国学生领 Google AI Pro，140 多个国家和地区的学生领 Google AI Plus。先核对学校、账号和订阅状态能否通过资格校验，再决定要不要申请。谁能申请，不是只有学生邮箱Google 8 月 19 日更新的学生优惠条款列了五项同时满足的条件：(1) 年满 16 岁；(2)", "url": "https://www.zhihu.com/pin/2073906929785648119", "votes": 0, "comments": 0, "feed_ts": 1787237950, "feed_time_str": "08-20 22:59", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Harnessed Agentic RL：让训练真正发生在Agent部署时的运行环境里\n图文版：链接当训练harness与部署harness是同一套，token前缀会在API边界无声断裂传统 agentic RL 里，策略模型几乎直接与环境交互，动作 token 生成后环境返回 observation，rollout 自然形成一条线性 token 轨迹。harnessed agentic RL 把这一层交还给部署时的 agent harness：harness 独立构造每次模型调用的 request prompt，策略模型只看到通过 LLM API 送达的 prompt，训练器能记录的只有一串 request-response 对，中间 harness 与环境之间的状态转移不可见。文本层面相同的消息历史，在后续调用里重新 tokenize 后可能出现不同 token 边界；采样时是 h 和 aving，重编码后可能变成 hav 和 ing。token 级别前缀条件一旦不成立，两个连续调用就不能安全合并成一个线性训练样本。训练正确性恰好会在 API 边界无声断裂。Qwen3.5-9B用6000条样本提升14.6个百分点，优势计算口径从sample级改到rollout级Agent Lightning v1.0 整体约3500行代码，训练直接沿用部署时的 agent harness，通过服务边界连接 agent 执行与 RL 训练。一个 rollout 会因 retokenization、subagent 生成或上下文 summarize 被拆成多个训练样本，训练中平均每个 rollout 产生 2.41 个样本，只有 36% 保持单一样本。若在 sample 级算优势，偶然切分出的样本数会改变整组 baseline；改用 rollout 级优势与 rollout 级 token-mean loss，则让每个 rollout 携带相等统计权重。同一 GRPO 目标下，sample 级优势在 step 128 达到 35.0% 验证 reward，仅切到 rollout 级为 33.1%，再加 rollout 级归一化为 38.2%；按最后一组配置，Qwen3.5-9B 在 SWE-bench Verified 上从 41.8% 提升到 56.4%。56.4%的SWE-bench结果绑定特定数据过滤，不能外推为通用编码能力限制部分给出的边界是，这个 56.4% 只代表特定配置下的结果，不能外推为通用编码能力。它来自 Qwen3.5-9B 基座、SWE-smith 数据过滤 pipeline、约 6000 条训练样本，以及 rollout 级优势与 rollout 级归一化这一完整配置。数据过滤先移除 problem statement 为空、problem branch 缺失和需要执行超过 200 个测试的任务，再做难度过滤，最终得到约 6000 条训练样本和 400 条测试样本。作者把 credit assignment 的进一步改进明确留给未来工作。读者能带走的具体判断是：在 agent RL 中，训练不稳定不一定来自模型或算法，也可能来自 agent harness 与训练器之间的 token 轨迹断裂，而 harnessed agentic RL 把这几个易错环节显式化，让不同框架在同一组问题上的选择差异可比较。原文标题：Agent Lightning v1.0: Towards Harnessed Agentic RL#无影寺", "excerpt": "Harnessed Agentic RL：让训练真正发生在Agent部署时的运行环境里\n图文版：链接当训练harness与部署harness是同一套，token前缀会在API边界无声断裂传统 agentic RL 里，策略模型几乎直接与环境交互，动作 token 生成后环境返回 observation，rollout 自然形成一条线性 token 轨迹。harnessed agentic RL 把", "url": "https://www.zhihu.com/pin/2073901263129940182", "votes": 0, "comments": 0, "feed_ts": 1787237712, "feed_time_str": "08-20 22:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "TopView", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "5000亿！继续疯狂救市！", "excerpt": "昨天刚聊完海力士那40万亿韩元的回购，今天三星就来了，直接加码，100万亿韩元。 先说清楚，三星这个数目前还只是韩媒报道，董事会月底才开，没正式官宣。但市场不管，先信了，先涨为敬。 100万亿韩元，折合约720亿美元，人民币小5000亿，相当于韩国一年GDP的1/25。两天之内，三星加海力士，合计140万亿韩元，人民币快7000亿。看这笔钱怎么分。核心一条，未来三年自由现金流的一半拿出来分给股东，", "url": "https://zhuanlan.zhihu.com/p/2073904063268365757", "votes": 36, "comments": 0, "feed_ts": 1787237370, "feed_time_str": "08-20 22:49", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "平凡", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价 GLM-5.3 ？", "excerpt": "看了唐杰最新在 X 上的帖子，我的第一个想法是： 果然，大家最后拼的还是 Infra。 前几个月有个很抽象的段子： 数据就是 Infra，Infra 就是算法，算法就是数据。 听起来像在说废话，但越往 frontier model 走，你会发现这三样东西真的越来越难分开。 你想做更好的 RL，首先得有一套足够稳定的 Infra 去跑 rollout。 想跑更长、更复杂的 rollout，就得有 E", "url": "https://www.zhihu.com/question/2071584964433404656/answer/2073674466597650573", "votes": 288, "comments": 7, "feed_ts": 1787237099, "feed_time_str": "08-20 22:44", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "冷哲", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待《经济学人》关于诺奖得主阿西莫格鲁「世界上最有影响力的经济学家，却不令人信服」的文章？", "excerpt": "看到这篇文章我觉得很有趣，无论从文章的 标题、内容和为什么有这篇文章我觉得都很有趣。先说文章标题 如果单看标题，说的一点都没错 你如果按毛咕噜的发文量，引用量，学生量，学界控制力，都可以说其是最有影响力的经济学家，甚至不用加之一。我甚至可以说，在经济学领域，你发文，应该不会有人从来没引用过毛咕噜的文章。 但是我跟10个经济学 朋友还在纠结社保实缴、社保规范、最低缴费基数这些问题。 可能大家的视角，还停留在个人扣钱多了、到手工资少了、企业压力大了这些。 但今天我想讲的是什么呢？ 就社保规范化、全员实缴这些模式，表面是社保改革，底层其实是税制结构的问题。 因为就我们现行的税收体系来说，整体是合理的，但它有一个非常隐蔽却又真实的弊端： 那就是在这套体系里，低收入群体、普通工薪阶层，承担的", "url": "https://zhuanlan.zhihu.com/p/2073794063984337983", "votes": 561, "comments": 95, "feed_ts": 1787211066, "feed_time_str": "08-20 15:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "学历史有什么用？", "excerpt": "在长城施工时，我偷偷埋了一块不锈钢板，等待几百年后有人发现。十几年前，我参与了京津的几段长城防雷和监控的文物保护项目。 那年母亲和姐姐来我项目上玩，我一路陪同，顺便做了导游。一路讲讲，什么是敌楼，什么是敌台，什么是烽火墩。 “啊！这不都是大平台子吗！烽火台不应该在长城上面吗？” “戚继光不是应该在海边打倭寇吗？为什么跑到北京修长城来了？啊！原来戚继光不止是会打仗，还很会做官，还和张居正的关系打得火", "url": "https://www.zhihu.com/question/20338058/answer/2068989829182912358", "votes": 900, "comments": 200, "feed_ts": 1787210930, "feed_time_str": "08-20 15:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "观看某回答有感突然发现有些平时叫嚣“郊区大法好，拆楼保平安”的用户，一转口风，开始痛骂北美的再城市化实践的“士绅化”现象，说再城市化只是某些群体提升低价打造属于自己的阶层的社区的手段。且不说问题是否存在，光是这些人以往的观点和说这些话的目的，其实就足够让人绷不住了。为什么要推动再城市化？因为北美尤其是美国城市的衰落显然是太过于普遍了，一个比较好的切入点是为什么加拿大就很少再对自己的高速公路做大刀阔斧的改造，哪怕高速公路的体量同样很大？因为就算是相对比较车本位的多伦多，当年修建高速公路时也没有借此制造城区的隔离，所以城区没有衰退啊。更别说温哥华由于新搬来的纽约人简·雅各布斯的不懈努力根本就没经历这一劫，像这样的城区，历史上就没衰退过，又何谈“再城市化”？所以再城市化完全是一些城市迫在眉睫的自救，而不是有些人声称的矫情。为什么要推动高速公路上盖开发或者新建外迁？那显然是为了弥补之前的历史遗留问题，尤其是某些城区的高速公路成为了制造断头路的罪魁祸首之后，将高速公路改建以避免其割裂地面道路路网似乎并不是什么罪大恶极的事情，而恰恰是刚需。而且纵观在这一议题上积极表态的全美各大城市，这与党派和立场根本就没什么关系，类似的项目完工后，这些城市也都有足够多的能让大众得利的回报了。至于什么动用大量市政财政改建快速路，引入资本拆除排屋社区，打造士绅化小资风情步行街区（说实话我很难想象这句话的原作者在想什么，本来就是排屋社区的话那步行性根本就不会差，也不会拆迁，纽约的格林威治村到现在也没有拆迁），且不说这句的真假，大家认真想想，这样的城市更新是不是恰恰就是现在官媒和城市更新相关议题里常常提到的“渐进式改造”呢？与上世纪50年代的北美城市再开发运动比，它的破坏力又能有几何？制造出的不宜居的环境又有多少？纽约有一项传统叫：“如果一座精美的建筑因再开发需要非得跟市民说再见，得守住的基本底线，日后还给他们一座更好的建筑。（感谢 @Antigng 老师当年在回答中引用这句话）”这一点来看，到底是不顾环评大拆大建修建一条高速公路更好，还是在保证环境不劣化的基础上去改造扩能交通基础设施，再优化住宅区的环境更好？最经典的案例莫过于俄克拉荷马城，在一次招商引资中因为市区环境不佳（这座市区为何沦落至此则是一个比底特律更悲伤的故事）落败给城区相对宜居的印第安纳波利斯后，市府几乎立刻就启动了城区的更新工作，目前的成果包括40号州际公路的外迁和扩能（由此可见，其实高速公路的优化并不一定是建隧道那么昂贵的，也不必然影响到开车一族的驾车体验，甚至可能改善）、利用高速公路外迁后多余下来的空间兴建的剪尾公园（Scissortail Park），以及利用废弃的工业区再开发的混合用途社区布里克敦（Bricktown）。所以有些人口口声声说的“引入资本拆除排屋社区”在哪儿，这里我要打个问号。如果说城区的新建住宅，一般而言类似的改造都是利用城市的空置空间建造的，这其中包括利用率低到已经无法维持的地面停车场，或是先前开发失败或废弃的土地（比如棕地开发）。还有些特别的例子，比如将旧厂房改造成住宅或者商业建筑，这在工业城市很常见，也经常受到低收入群体的欢迎，底特律在建的Fisher Body 21项目就是面向低收入群体的工业建筑改住宅项目，而开工之初抵制者却偏偏都不是低收入群体。至于以上群体对于美国低收入群体表现出的所谓关心，大家看到这里也能反应过来，纯粹是醉翁之意不在酒，痛恨大兴土木的项目不是自己想要的。更不要说，在前些年美国城市的改善工作尚未为大家知晓的时候，这些人的口风可是“美国城市都衰落成这样了，说明高密度城市是走不通的，郊区才是未来”。而谈及美国低收入群体无车可开的现状，这些人既没有呼吁改进公共交通系统服务他们的出行，又没有发声支持慢行交通设施和社区周边配套设施的建设，更从未对于美国的低收入群体的住房问题做过任何科普（很有意思的是做这些科普的恰恰是不才以及一些其他的同道中人），所以，到底谁才是“方圆二十里见不得穷人”的带善人呢？恐怕不打开他们的肚子，也能看到他们的心大概是什么成色了。我很推荐大家关注一下底特律从十多年前破产到如今乃至未来数十年的城市规划和城市治理的相关内容，这样能避免被很多类似的迷惑发言给欺骗，带到沟里去。底特律几乎是近年来最亮眼的能向世人展示美国市中心的潜力的地方。至于言必称什么“左右”，纯属上纲上线行为，毕竟盐湖城和俄克拉荷马城都不是蓝区，尚且都在为此奋斗，新城市主义最早的实践地佛罗里达也不是蓝区。至于为什么这些人会扣这些帽子，只能等他们来这评论区回答了。#美国 #城市规划 #城市设计 #丰饶议程 ", "excerpt": "观看某回答有感突然发现有些平时叫嚣“郊区大法好，拆楼保平安”的用户，一转口风，开始痛骂北美的再城市化实践的“士绅化”现象，说再城市化只是某些群体提升低价打造属于自己的阶层的社区的手段。且不说问题是否存在，光是这些人以往的观点和说这些话的目的，其实就足够让人绷不住了。为什么要推动再城市化？因为北美尤其是美国城市的衰落显然是太过于普遍了，一个比较好的切入点是为什么加拿大就很少再对自己的高速公路做大刀阔", "url": "https://www.zhihu.com/pin/2073768855432909652", "votes": 0, "comments": 14, "feed_ts": 1787210604, "feed_time_str": "08-20 15:23", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "君临财富", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "海外，重要消息发酵！", "excerpt": "医药果然是真·主线！ 今天疫苗、创新药、CXO、基因检测板块，大部分个股都涨停了。 导火索来自大洋彼岸。 昨晚，美股一家名叫Moderna的公司，单日暴涨176.97%，震惊了全市场。 另一家百年药企龙头默沙东，也同步大涨12.6%。 受两家公司大涨的带动，纳斯达克生物科技指数单日飙升6.39%，创下近六年最大单日涨幅。 为啥涨得这么猛？ 很多人对Moderna的印象，还停留在新冠mRNA疫苗。 ", "url": "https://zhuanlan.zhihu.com/p/2073790736223548086", "votes": 8, "comments": 2, "feed_ts": 1787210495, "feed_time_str": "08-20 15:21", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价荷马史诗《奥德赛》？", "excerpt": "原来人们以为那是欧洲古代史的开始，其实是一个更早历史阶段的结束，只不过之前的辉煌，比如米诺斯、迈锡尼，只能通过考古来窥知一二了。", "url": "https://www.zhihu.com/q

: 569, "comments": 110, "feed_ts": 1787907523, "feed_time_str": "08-28 16:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "中国古代的统治者为什么不能像埃及善待修金字塔工匠那样善待修长城、运河等大工程的民工呢？我们是怎么知道历史上发生过一件事情？主要通过传世文献、考古文献或实物、传说三个渠道。若都不存在，就是编造的故事。  「埃及法老善待修建金字塔的工匠」的说法，主要来自2013年出土的莎草书《梅勒日记》，其中记录了金字塔建造过程，反映了古埃及的工程管理体系。  但历史文献的真实性需交叉印证，传世文献与出土文献可能不一致；《梅勒日记》属于孤证，而历史研究有「孤证不立」原则，夏朝因缺乏出土文献印证而存疑便是例子。  梅勒是监工，并非工匠；监工不太可能承认虐待工匠，就像老板不会说自己对不起员工。为什么有《梅勒日记》却没有《工匠日记》？因为工匠没有文化，写不出来。  用监工的日记来断言法老善待工匠，就像用《蒋介石日记》概括中华民国史一样草率；中国历史上很多工程被记载沾满工匠血泪，是因有文化的工匠留下了大量文献，统治者甚至被迫写《罪己诏》。  总之，一个监工说他在4600年前对工匠非常好，我不太相信。中国古代的统治者为什么不能像埃及善待修金字塔工匠那样善待修长城、运河等大工程的民工呢？ #金字塔  #倒金字塔结构  #金字塔（书籍） ", "excerpt": "中国古代的统治者为什么不能像埃及善待修金字塔工匠那样善待修长城、运河等大工程的民工呢？我们是怎么知道历史上发生过一件事情？主要通过传世文献、考古文献或实物、传说三个渠道。若都不存在，就是编造的故事。  「埃及法老善待修建金字塔的工匠」的说法，主要来自2013年出土的莎草书《梅勒日记》，其中记录了金字塔建造过程，反映了古埃及的工程管理体系。  但历史文献的真实性需交叉印证，传世文献与出土文献可能不一", "url": "https://www.zhihu.com/pin/2076713730847544302", "votes": 0, "comments": 0, "feed_ts": 1787907137, "feed_time_str": "08-28 16:52", "category": "pin", "cat_name": "想法动态"}, {"actor": "小旋风财进", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待孙宇晨？", "excerpt": "在流量收割这条路上，任何人都能成为孙割的NPC，包括股神、国民老公、懂王、白月光 孙割最擅长的，就是卡bug，他觉得世界是草台班子，很多规则和过家家没两样，但你必须先假装尊重它。 1990年7月，孙割出生在青海西宁，祖籍山东。四岁那年，跟着父母到了广东惠州。 母亲把他送去武汉一所私立学校学围棋，在那里待了三年，段位没上去，回到惠州时，父母已经离异，母亲远走意大利，父亲仕途受阻，开始酗酒，他经常放学", "url": "https://www.zhihu.com/question/2001661556916777815/answer/2076711877061695379", "votes": 156, "comments": 13, "feed_ts": 1787906695, "feed_time_str": "08-28 16:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "全市场等沃什杰克逊霍尔讲话，如何判断对英伟达和AI行情的影响？择时入场的指标看哪些？纳指的生死线在哪里？", "excerpt": "昨天英伟达涨了近9%，这个涨幅还是克制的，很多人昨天不敢追涨。 从富达的订单数据看得很清楚，卖的占63.34%，买的只占36.66%，说明散户看到英伟达一天涨了这么多，第一反应是落袋为安，而不是追高。 这个现象和周三英伟达盘后发财报，纳指期货NQ纹丝不动一致——大多数人对AI行情还是观望的态度。 毕竟压制科技股估值的长期收益率还在高位，30年期收益率还在5.2%附近，还没有压回5%以下，贝森特还没", "url": ude开始接管真实世界", "excerpt": "大语言模型，现在真的长出手了。 本周四，Anthropic 宣布推出硬件用 MCP： Model Hardware Standard（MHS），这是一项新标准，用于帮助所有大模型驱动的 AI 智能体（Agent）安全快捷地操纵物理设备。 现在，Claude 这样的大模型可以像用 MCP（模型上下文协议）一样在物理世界中操作显微镜、机械臂、液体处理器、激光器等硬件了。这一进展被业内视作 AI 从数字", "url": "https://zhuanlan.zhihu.com/p/2076616641656505277", "votes": 27, "comments": 0, "feed_ts": 1787884101, "feed_time_str": "08-28 10:28", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "BBuf", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "大模型推理加速：Overlap Scheduling 的深入剖析与性能权衡艺术", "excerpt": "1. 背景Overlap Scheduling 是大模型推理加速的重要手段。从应用视角来说：Overlap Scheduling 适用于有高 QPS 压力的场景，吞吐和 TTFT 通常会更好。如果是低 QPS 的场景，输入压力有限，Overlap Scheduling 的吞吐不会更好，并且会有 TTFT 升高的风险。这个结论不需要深入理解 Overlap Scheduling，可以通过端到端的黑盒", "url": "https://zhuanlan.zhihu.com/p/1993845553814069701", "votes": 128, "comments": 8, "feed_ts": 1787883983, "feed_time_str": "08-28 10:26", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "ECCV 2026 Oral｜从「一句提示词」到「多镜头成片」：MAVIN让AI开始按剧本讲故事", "excerpt": "刘恺骐，北京大学博士生，主要研究方向为可控视频生成、音视频联合生成、世界模型、理解生成统一模型及多模态大模型等，相关成果发表于 ECCV、ICCV、CVPR 等国际会议。 过去几年，视频生成模型在清晰度、运动表现和画面质感上不断进步。输入一句文字，模型已经能够生成颇具电影感的视频。 但当任务从「生成一个漂亮片段」，变成「完整拍完一场戏」，问题就不一样了。 前一个镜头里，女主说完一句话；画面随即切到", "url": "https://zhuanlan.zhihu.com/p/2076616176487100604", "votes": 3, "comments": 0, "feed_ts": 1787883976, "feed_time_str": "08-28 10:26", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "BBuf", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价 Anthropic 最强模型 Fable 5 遇冷？AI 行业是否高估了「更强模型」的价值？", "excerpt": "最近做一些模型优化的时候用Kimi K3，5.6 Sol做性能复现，profile，bottleneck分析这些感觉和fable5确实没有什么区别了，不过在进一步优化涉及到的cuda kernel的时候确实还是能感受到一些差距，无论是直接用大模型去写kenrel还是借助Kernel Design Agnet(KDA)，Humanize2去写kernel都仍然能感受到Fable5的优化路径更合理且效", "url": "https://www.zhihu.com/question/2075227159929386027/answer/2076613297034491722", "votes": 58, "comments": 5, "feed_ts": 1787883192, "feed_time_str": "08-28 10:13" const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';

      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {

      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');

    btn.textContent = '🏷️ 按话题分类';

估了？", "excerpt": "比如时钟同步技术。 现在几点几分按理说是一个很简单的问题，但是对计算机网络来说却是一个非常困难的问题。 计算机内部有一个东西叫RTC（Real-Time Clock，实时时钟芯片）。它是主板上一块独立的小芯片，有自己的纽扣电池，即使电脑关机它也在滴答作响。 RTC的原理是晶体震荡，芯片里有一块石英晶体，通电之后以固定频率震动，通常是32768Hz，为什么是这个数？因为32768 = 2¹⁵，方便用", "url": "https://www.zhihu.com/question/2078550836104394358/answer/2085411135587627090", "votes": 774, "comments": 40, "feed_ts": 1790015751, "feed_time_str": "09-22 02:35", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待博主永乐大帝明成祖最新一期视频讲述的沙俄与日本视觉的照妖镜？", "excerpt": "没办法，明太祖属于是轩辕再生，天神下凡，一不小心打崩壮年蒙元，废掉了蒙古大联盟的资源池，为俄罗斯摆脱金帐汗国的控制铺平了道路，相当于俄罗斯摘了大明的桃子。 现在看起来，明朝还是建国太早，明祖晚降生一百年，先让俄国人从西边起事，咱们再从东边摘桃子，就可以躲过17世纪的关键期了。而且还可以避开欧陆的纷纷扰扰，很可能拿到二战美国的剧本。 ", "url": "https://www.zhihu.com/question/2077565029956821379/answer/2081035314181816628", "votes": 180, "comments": 34, "feed_ts": 1790013118, "feed_time_str": "09-22 01:51", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Grok 4.7 来了SpaceXAI 发布 Grok 4.7，入口是 Cursor、Grok Build 和 Grok API；相对 4.6，每百万 token 仍是输入 2 美元、输出 6 美元，在同等价格和速度下，比 Grok 4.6 有显著改进。CursorBench 46.3% vs Fable 51.8%SpaceXAI 用一张表把 Grok 4.7 xHigh、Grok 4.6 High、GPT-5.6 Sol Max 和 Fable 5.1 Max 放在同一组任务里。软件工程 CursorBench 4.0 上，Grok 4.7 是 46.3%，高于 4.6 的 40.4% 和 GPT-5.6 Sol Max 的 41.7%，仍低于 Fable 5.1 Max 的 51.8%。Terminal-Bench 4.0 是 38.0% 对 4.6 的 20.3%，Fable 5.1 Max 仍到 57.9%。同一张图把 CursorBench 分数和每任务平均成本画在一起，SpaceXAI 把 Grok 4.7 放在这条价格—性能前沿上。这是 SpaceXAI 发布页和配图口径，这次材料里没有第三方横评。EEBench 64.0%与Harvey 19.6%电气工程 EEBench 上 Grok 4.7 到 64.0%，高于 4.6 的 53.0%、Fable 5.1 Max 的 56.4% 和 GPT-5.6 Sol Max 的 39.4%。法律任务 Harvey Legal Agent 是 19.6%，同样高于同表另外三列。临床推理 HealthBench Professional 是 56.7%，Fable 5.1 Max 仍是 62.1%。DeepSWE v1.1 的 71.0% 带了 high effort 标记，GPT-5.6 Sol Max 是 72.7%。输入2美元输出6美元基准价从每百万 token 输入 2 美元、输出 6 美元起。另外还有一档快变体：输出速度翻倍，价格也翻倍。Grok Build 可以免费试用，安装入口写在 x.ai/build。 harness 与 Cursor 里体感很强，并提到 fast mode 的 TPS 很高，但没有给出可核对的吞吐数字。更大基础模型和更长强化学习相对 4.6，Grok 4.7 用了更大的基础模型，强化学习更长，任务更偏向要连续很多小时才能做完的题，并加强自检和长上下文。SpaceXAI 还训练它原生理解 Grok Bot harness。开放世界城市游戏演示把 4.7 放在第一条、4.6 放在第二条，用来对照生成结果，没有给出可复现的基准分数。Cursor同价换代的适用任务已经在 Cursor 或 Grok API 用 4.6 的人，可以按同价换代去试电气工程、法律 agent 和长程知识工作。CursorBench 和 Terminal-Bench 上，Fable 5.1 Max 仍领先，这张表不能证明所有编程任务都应换掉 Fable。发布页也没有回答 Grok Premium 聊天是否同步上线，第三方独立复测也还没出现在这次材料里。", "excerpt": "Grok 4.7 来了SpaceXAI 发布 Grok 4.7，入口是 Cursor、Grok Build 和 Grok API；相对 4.6，每百万 token 仍是输入 2 美元、输出 6 美元，在同等价格和速度下，比 Grok 4.6 有显著改进。CursorBench 46.3% vs Fable 51.8%SpaceXAI 用一张表把 Grok 4.7 xHigh、Grok 4.6 Hi", "url": "https://www.zhihu.com/pin/2085539427728749585", "votes": 0, "comments": 0, "feed_ts": 1790011422, "feed_time_str": "09-22 01:23", "category": "pin", "cat_name": "想法动态"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中国人已经牛肉自由了吗？", "excerpt": "按30一斤普通牛肉价格，每天每人60克蛋白质需求计算， 四口之家一天需要吃1200克牛肉，价格72元， 一个月就是2160块钱。 而中国有6亿人收入不足1000元，这点微薄的收入还需要用来住房、医疗、教育开支，以及用于未来突然裁员和重病重伤的储蓄。 根本不可能用于日常吃牛肉。 所以中国绝大多数普通老百姓，放开了吃牛肉是以月，甚至年为单位的。 农村生活条件改善的一个显著变化就是过年舍得买十几斤牛肉了", "url": "https://www.zhihu.com/question/2025484727029707408/answer/2085539465515251445", "votes": 12, "comments": 0, "feed_ts": 1790011356, "feed_time_str": "09-22 01:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "木文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "40岁，选择法考还是CPA？", "excerpt": "先说 结论。40岁的年纪，有一说一，这俩都没啥前途。 cpa考完，能收你的只能是地方小所，收你也是为了让你签字，当然未必有什么风险或者白嫖，一份报告500-1000，当然上市公司的报告也轮不上你签。企业财务就别想了，没有任何经验不可能要你。 法考了解不多，只是身边有做的还不错的律师朋友，闲聊时了解的一些行业信息。法考考完，企业的法务、风控这种岗，除了要法考证，还要学历+学校。所以大概率还是去乙方的", "url": "https://www.zhihu.com/question/652342210/answer/2010953741675827303", "votes": 298, "comments": 84, "feed_ts": 1790010547, "feed_time_str": "09-22 01:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "木文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么两山轮战中国能按着越南的头打，俄罗斯打乌克兰就打成这个样子？", "excerpt": "因为战略目标不一样。 不要拿总设计师这种从尸山血海中走出来的领导人，尤其还是亲自领导了淮海战役这种决定国运 C第六次评估报告及第七次评估周期前期信号所做的政策路径评估显示，按目前各国提交的自主贡献方案，本世纪末全球升温最佳估计约二点八摄氏度；即便考虑AR7可能剔除最高排放情景，在现有减排力度不足的惯性下，升温幅度仍可触及四点八摄氏度区间。我们在此前的推演中，选取变暖三摄氏度作为审视问题的基准。三摄氏度处于这个区间的中段偏保守位置，它不足以触发最极端的末日", "url": "https://zhuanlan.zhihu.com/p/2085315927785186804", "votes": 20, "comments": 7, "feed_ts": 1789958093, "feed_time_str": "09-21 10:34", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "假如魏德尔上台，德国大概率转向偏向于支持俄罗斯，至少购买俄罗斯的天然气，对俄乌战争会有哪些影响？", "excerpt": "俄乌战争大概率明年结束，结果就是乌克兰被周围国家实质肢解掉。 你都不用看战线，你看看乌克兰政界的频繁变化就知道了，大家现在都在准备着战后如何让自己的势力更占优势。 对于欧洲来说，他们不知道这个问题吗？很清楚，但是被政治正确绑架了。中欧论坛，只要是不公开的，从政府官员，到学者，再到企业管理者，都很清楚乌克兰赢不了。但是一旦公开会议，有记者那种，谁都不敢说。而选择党就是那个敢于说出皇帝新装的小孩，它未", "url": "https://www.zhihu.com/question/2080612715429622066/answer/2085314310205617910", "votes": 14, "comments": 6, "feed_ts": 1789957675, "feed_time_str": "09-21 10:27", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Qwen-Image-2.1开源，透明图可直接生成做贴纸、商品图或排版素材时，AI 生成的主体通常还要经历抠图、清理边缘、重新合成。Qwen-Image-2.1 这次把其中几步并进了模型：它能直接生成带 Alpha 通道的 RGBA 透明图，也能编辑透明图中的主体和文字。7B参数覆盖哪一部分Qwen-Image-2.1 把文生图和图像编辑放进同一套模型。视觉生成部分采用 32 层 Single-Stream DiT，参数量为 7B；运行组合还包含负责理解文本和图像的组件，所以“7B”不能理解为整套系统的总规模。Qwen 发布的 Qwen-Image-Bench 中，它得到 60.28 分，排在 Nano Banana 2.0 等模型之前。不过这是 Qwen 自建并发布的评测，适合用来了解官方定位，不能直接推导为所有任务全面领先。统一硬件下的端到端速度、显存占用和价格横评，目前也没有公开。透明图省掉哪一步模型可以根据提示词直接输出普通图或透明图，也可以在保留透明背景的情况下修改表情、替换文字。输入一张普通 RGB 照片，它还能提取指定主体并输出 RGBA 图层。这对贴纸、电商素材、Logo 元素和网页视觉更实用：生成结果可以直接进入排版与合成环节，少做一次独立抠图。复杂发丝、半透明材质和多轮编辑后边缘是否稳定，仍要看真实工作流测试。10张参考图与局部编辑Qwen-Image-2.1 最多接收 10 张参考图，可把人物、服装、商品或家居素材组合到一个画面。局部修改支持圈选、涂抹和独立掩码；Qwen 还重点强化了人像身份、商品文字、纹理与形态在编辑前后的保持。常用工具已在首日接入Diffusers、ComfyUI、vLLM-Omni、SGLang 和 LightX2V 已提供首日支持，仓库也给出了文生图、单图编辑、多图编辑和透明图生成示例。本地工作流用户因此不必再等待常用工具补适配。当前许可证仅限非商业用途当前仓库使用 Qwen Research License，只允许非商业研究或评测。产品、广告、电商等商业用途需要另行申请商业许可。想研究透明图、多图编辑或接入 ComfyUI，可以马上试；准备放进商业生产链路的团队，应先确认商业授权，再评估效果、显存和稳定性。", "excerpt": "Qwen-Image-2.1开源，透明图可直接生成做贴纸、商 const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

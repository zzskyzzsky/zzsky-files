果更贴近这次公开的比较场景。4.43 美元到 1.67 美元，算的是哪笔账Qwen 按 Work360 任务统计，单任务平均费用从 4.43 美元降到 1.67 美元，约降 62%。同一评测里，成绩从 47.74 到 52.69。这个组合说明官方在这组任务中同时测到了分数上升和均费下降。实际调用的花费还取决于任务需要多少输入、输出和缓存读取。按发布时 QwenCloud 新加坡区模型页，每百万 token 的输入价是 1.50 美元，输出价是 4.50 美元，隐式缓存输入是 0.075 美元。显式缓存创建另计。API 支持文本、图片和视频输入，返回文本，上下文窗口为 100 万 token。Max 已开放调用，小型号的权重后续发布Max 是 Qwen4 系列先推出的一款。Qwen 在发布博客里预告后续开放更小型号的权重，发布材料未给出尺寸和日期。想先试 Max，可以在支持的产品里开始，或者通过 QwenCloud 用模型 ID `qwen4-max` 接入。", "excerpt": "Qwen4-Max来了Qwen4-Max 已在 QwenCloud 开放 API 和 Token 套餐，也可在 Qwen Studio、QwenWork 和 Qoder 使用。发布时最容易混淆的两个数字是“最多省约一半 token”和“单任务均费降约 62%”。前者接近终端任务里的实测降幅，后者来自 Qwen 自己的 Work360 评测。终端任务接近省一半，行业任务省约四分之一到三分之一Qwen", "url": "https://www.zhihu.com/pin/2105815422486500593", "votes": 0, "comments": 0, "feed_ts": 1794845529, "feed_time_str": "11-17 00:12", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "GPT-6 Astra证明：标准模型的候选格子定义物理学家 Nathaniel Craig 提出了一种在时空网格上定义标准模型的候选方案。GPT-6 Astra 帮他把想法变成具体构造，并主导了详细证明。方案在有限格距、满足条件的规范场上给出了一个关键数学构件。要把它接回通常的量子理论，反射正定性还待建立。为什么弱力放进网格更麻烦标准模型描述基本粒子和强力、弱力、电磁力。把时空划成网格，能让研究者在计算一开始就保留相互作用。强力已经有这样的做法。弱力会区别对待左手和右手费米子，而直接把左手费米子放进格子，可能冒出多余的右手伙伴。已有的重叠费米子方法可以解决这类额外伙伴的问题，留下的难题是怎么给费米子测度指定相位。可以把测度理解成做计算时给各种费米子配置配权重的规则。规范场变化一圈回到原点，费米子状态仍可能累积一个相位。构造需要给出前后一致的补偿办法。Astra 参与的是构造和证明Craig 提议把同一组规范场表示在一系列更细的格子上，再比较相邻两级的费米子状态。每次比较给出一部分相位修正，加总后得到原始格距上的规则。据 Craig 在 OpenAI 科学博客中的说明，Astra 提出了如何把规范场搬到更细格子上的做法，推导出比较结果会收敛，并主导详细证明。预印本由 Craig 署名，他对 Astra 写出的证明做了大量改写。Lean 验证到了哪一步论文第 12 节报告，数学附录对应的 16 个 Lean 4 模块通过了编译和内核检查。检查支持的是在所列假设下成立的形式化命题。有限格距下的反射正定性仍待建立，它关系到能否把格子计算接到概率守恒的量子理论上。辅助格子越划越细，是构造相位修正的一步。拿掉原始格距、给完整的相互作用理论定义连续极限，则是另一个开放问题。", "excerpt": "GPT-6 Astra证明：标准模型的候选格子定义物理学家 Nathaniel Craig 提出了一种在时空网格上定义标准模型的候选方案。GPT-6 Astra 帮他把想法变成具体构造，并主导了详细证明。方案在有限格距、满足条件的规范场上给出了一个关键数学构件。要把它接回通常的量子理论，反射正定性还待建立。为什么弱力放进网格更麻烦标准模型描述基本粒子和强力、弱力、电磁力。把时空划成网格，能让研究者", "url": "https://www.zhihu.com/pin/2105813350403856122", "votes": 0, "comments": 0, "feed_ts": 1794845170, "feed_time_str": "11-17 00:06", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "曝黄仁勋考虑重返英伟达，其硅谷盟友正向英伟达董事会施压，要求恢复其职务，黄仁勋会真的回归吗？", "excerpt": "帮大家回忆一下：08年金融危机，最终起诉的是家华人创立的“国宝银行”。数十名华人员工被戴上手铐在媒体前游街 [1]。他在美国排名2787，3000笔房贷中只有9笔违约，远低于美国同业水平。但确是全美唯一一家被地检以刑事罪名起诉的银行。 孙家为了证明清白拒绝认罪，花费了超过1000万律师费，最终审判无罪。 [2]著名导演史蒂文詹姆斯为此拍了一部纪录片：《国宝银行：小到足以进监狱》，斥责这个华尔街爆破", "url": "https://www.zhihu.com/question/2105565911440521077/answer/2105637510525235843", "votes": 3912, "comments": 138, "feed_ts": 1794844739, "feed_time_str": "11-16 23:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "后训练奖励升高时，最优回答为什么反而难采到？图文版：链接REINFORCE的奖励与覆盖可以背离强化学习后训练用当前策略生成回答并更新概率。论文用最高奖励回答的总概率衡量模型有多容易采到好答案，指标是对每道题的概率取倒数，再按提示分布求平均，越小越好。在单提示、表格softmax的反例里，基座初始平均至多采样6次即可遇到最优回答，使用精确梯度后，期望奖励仍可能在最优回答变得极难采到的同时上升。随后梯度信号减弱，收敛可需要指数级步数。固定KL约束面临覆盖与进展的取舍KL正则惩罚策略偏离参考。固定基座为参考时，弱约束留出了提高奖励的空间，也容许覆盖严重恶化。强约束能控制偏移，但会限制模型能走离基座多远。论文在修改后的构造中使用精确梯度，固定参考的REINFORCE用了7364步达到0.99奖励，采用参考重置的APMD用了2911步。这组步数属于构造实验。APMD以最近策略为参考逐段推进近似策略镜像下降把训练拆成一串局部问题。每轮把最近的策略设为参考，使用较强KL约束近似求解，再用所得策略启动下一轮。各轮内层求解满足指定误差时，定理给出最终奖励差距的界。对按提示分布抽取的大部分提示，每一轮最优回答的总概率至少为基座的一半。softmax线性策略限定端到端保证论文对简化PPO、GRPO与Kimi风格平方损失方法的保证，建立在冻结预训练特征上的softmax线性策略和一次生成完整回答的设定中。算法还须用可控的样本量与梯度步数达到内层容差，才能满足覆盖保持的复杂度定义。裁剪用于限制大重要性权重的统计代价。实际模型的全参数更新、逐token过程及多轮交互仍需验证。原文标题：A Theory of Policy Optimization in Post-Training: Coverage Collapse and Reference Resets#无影寺 ", "excerpt": "后训练奖励升高时，最优回答为什么反而难采到？图文版：链接REINFORCE的奖励与覆盖可以背离强化学习后训练用当前策略生成回答并更新概率。论文用最高奖励回答的总概率衡量模型有多容易采到好答案，指标是对每道题的概率取倒数，再按提示分布求平均，越小越好。在单提示、表格softmax的反例里，基座初始平均至多采样6次即可遇到最优回答，使用精确梯度后，期望奖励仍可能在最优回答变得极难采到的同时上升。随后梯", "url": "https://www.zhihu.com/pin/2105810914297525613", "votes": 0, "comments": 0, "feed_ts": 1794844491, "feed_time_str": "11-16 23:54", "category": "pin", "cat_name": "想法动态"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看待小红书开放后越来越多人要移民中国？", "excerpt": "你不记得2020年公安部要修订 的影响力吗？", "excerpt": "", "url": "https://www.zhihu.com/question/11213303510/answer/99373840709", "votes": 3666, "comments": 39, "feed_ts": 1794843483, "feed_time_str": "11-16 23:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "黄仁勋为什么要向中国卖显卡？他的产能连美国本土和盟友的需求都满足不了，为什么还要冒着风险卖给中国？", "excerpt": "就是因为黄总的产能本质上受到台积电极限产能＋棒子内存扩产意愿，甚至鬼子高端材料扩产意愿的限制。 那么尽可能分配一些产能给开源模型厂商是最有利于英伟达的啊，虽然这部分开源厂商里，中国占比最高吧。 黄仁勋不只是卖卡，还做优化，开源后训练，预训练的优化流程，辅助工具。 不做这个事儿，对英伟达一样有风险。 我觉得以他的水平，绝对能预见出前沿实验室的模型，早晚会拥有高速适配新硬件，彻底重构一个类似CUDA的", "url": "https://www.zhihu.com/question/2104720236599682809/answer/2105806063870162167", "votes": 72, "comments": 5, "feed_ts": 1794843290, "feed_time_str": "11-16 23:34", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "纳什均衡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "大饼和油，简称油饼已兑现，全对，黄金白银美股油气到大饼，没有一个错的。正规市场的人比较舒服，天天开空就完事了。哎！", "excerpt": "大饼和油，简称油饼已兑现，全对，黄金白银美股油气到大饼，没有一个错的。正规市场的人比较舒服，天天开空就完事了。哎！", "url": "https://www.zhihu.com/pin/2105793460544591672", "votes": 0, "comments": 6, "feed_ts": 1794840550, "feed_time_str": "11-16 22:49", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "有趣的是排华大致可以分为美国的东西大战有趣的是排华的立场大致可以分为美国的东西大战，或者说老共和党人大战共和党内部新崛起的投机派和力图夺权的民主党。耐人寻味的是，当时在排华问题上跳得最高的，并非盘踞东部建制派的共和党人，也不是南方民主党人，而是西部两党的政治人物。而点燃两党反华情绪的则是第三党的运动者。西部工人党领袖丹尼斯·科尔尼，这个被当时舆论视为煽动恐慌的代表，组建了喊着中国人必须滚出去的加州工人党，这个党的名字是模仿当时美国的第二国际分部组建的。在加州1878年制宪会议选举里，工人党成为最大赢家，获149席中的51席。他不仅把反华主张从地方推向全国，还将经济恐慌与白人民粹主义交织在一起，把华工塑造成白人失业与贫困的替罪羊。1878年，科尔尼首先在马萨诸塞州为州长候选人、后来的众议员本杰明·F·巴特勒助选，在南方和北方的东部城市里面，他获得了10多万人的热情支持。超过10万人亲耳听到他的有力演讲，数百万人通过报纸接收到信息。无论演讲现场是被欢呼还是被嘲笑，他夸张的表演风格使他成为名人，成功“左右了公众对华人的舆论”。这种全国性的媒体曝光，把加州的地方议题变成了全国性的公共话题。卡尼在演讲中宣称，美国劳工的主要敌人是“资本家、政客、媒体和华人”。在波士顿，他告诉听众：“如果选票失败，我们就用子弹。(榛佐来了)1879年，海斯总统否决《十五名乘客法案》。该法案最初由内华达州共和党众议员托马斯·雷恩提出，当时称为“十五名乘客法案”，规定每艘抵达美国的船只搭载华人乘客不得超过15人。违反者，船长每多载一名超限乘客，可面临最高六个月监禁和100美元罚款。1879年1月，第45届国会同意审议这项一年前的众议院法案。民主党人在国会里给予了这部西部共和党人压倒性的支持。仅两天后，加州制宪会议便提交了包含排华条款的新宪法，加州人以77,959票对67,134票批准了它，这无疑是对海斯政府和东部建制的一次公开叫板。西部共和党人在这个问题上和他们党的主流派系开始逐渐脱节，并公开向建制派叫板。西部共和党人的代表是加州众议员霍勒斯·F·佩奇。他于1873年当选，1875年3月提出“关于移民法补充法案”，即《佩奇法》。该法模仿1870年加州法规，禁止输入非自愿亚洲劳工和“以卖淫为目的”的妇女。佩奇宣称，苦力劳工和卖淫是“威胁共和国的不可分割的双重罪恶”。这部法律在多个方面沉重打击了华人社区：美国驻香港领事获得筛查华人女性移民的权力，举证责任落在移民自己身上，导致大多数女性被拒，实际上阻断了华人女性移民，使华人社区无法通过自然繁殖维持自身。在国会层面，西部共和党参议员亚伦·萨金特（加州）联合内华达、俄勒冈的参议员，形成反对华人移民的地区派系。然而，作为当时建制派的共和党人，反倒多次表达了反对和抗议的态度。以缅因州参议员汉尼拔·哈姆林为代表的“老卫兵”，坚守刚刚解放黑人奴隶的共和党立国原则，认为排华违背了“人人生而自由平等”的承诺。哈姆林在参议院自豪地宣布“我将投票反对这项措施，并把这一票作为留给我孩子们的最后遗产”；废奴运动元老威廉·劳埃德·加里森在去世前三个月仍撰文谴责布莱恩“似是而非、激烈且蔑视种族的演讲”(参见下文关于布莱恩的内容)耶鲁校长诺亚·波特、校董西奥多·伍尔西和五十名教职员联名请愿，强调自由移民“处于比条约权利更高的层面”。这批老卫兵在选举压力下，却仍颇有节气，坚守着共和党的意识形态底线。而南方民主党人的反对则意味深长得多。他们并非出于对华人的同情，而是打着自己的算盘：南方种植园主和实业家希望引进华人劳工，用以替代正在迁离的黑人劳动力，甚至幻想以此对抗激进共和党的统治。正因如此，参议院中竟有六名南方民主党人投票反对《十五名乘客法案》，南方舆论甚至宣称“让华人来吧”，南方人甚至还批评西部人过于种族主义。在一次反华事件后，《亚特兰大宪法报》评论道：“异教华人比旧金山的流氓更好、更明理、更有价值。但是种族的阴影最终笼罩在不分东西的美国上空，尽管如道格拉斯这样获得解放的黑人代表奋力高呼反对排华，但是甚至如缅因州这样非常自由派地方的共和党参议员布莱恩为争取西部代表和劳工选票，在党内捷足先登，用“盎格鲁-撒克逊种族 vs 蒙古人”的恐惧话语在全国推动排华。民主党可以利用什么呢？排华。民主党人敏锐的意识了西部本土共和党人和东部纲领派共和党人之间的联盟缝隙，那就是华人问题既可以确立民主党在西部的选票基础，形成南西部联盟，于是华人劳动力没有发掘出想象的利润的情况下，南部民主党人也很快放弃了自己的政治立场，因为要服从于整个政党的纲领。于是在西部共和党和全国民主党的大力推动下，除了东北部的共和党人仍然有不少反对外，全国事实上的政客已经形成了共识，排华法案就这样通过。", "excerpt": "有趣的是排华大致可以分为美国的东西大战有趣的是排华的立场大致可以分为美国的东西大战，或者说老共和党人大战共和党内部新崛起的投机派和力图夺权的民主党。耐人寻味的是，当时在排华问题上跳得最高的，并非盘踞东部建制派的共和党人，也不是南方民主党人，而是西部两党的政治人物。而点燃两党反华情绪的则是第三党的运动者。西部工人党领袖丹尼斯·科尔尼，这个被当时舆论视为煽动恐慌的代表，组建了喊着中国人必须滚出去的加州", "url": "https://www.zhihu.com/pin/2105745520862020755", "votes": 0, "comments": 3, "feed_ts": 1794839982, "feed_time_str": "11-16 22:39", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "新加坡工人90个月的工资才能买元Plus，而比亚迪工人20个月的工资就能买了，新加坡不是发达国家吗？", "excerpt": "新加坡自己统计的全职居民工资中位数是5775新币，5777×90=519930新币 目前汇率大概5.2左右 519930×5.2=2703636元人民币 比亚迪心这么黑？元up在新加坡卖270万块钱？ ", "url": "https://www.zhihu.com/question/2091873574902576901/answer/2104026015790118134", "votes": 1547, "comments": 239, "feed_ts e_str": "11-16 17:11", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "特朗普最终会是什么下场？", "excerpt": "下场？ 看看和他不对付的那些人。搞了一个四五十年前的强奸案，要把特朗普罚的倾家荡产的佩洛西老妖婆，在特朗普选举上台后直接都哭了（很可能是吓哭的），去了一趟欧洲号称自己摔的生活不能自理。 结果一年多过去了，特朗普就当没这号人。 奥巴马希拉里克林顿拜登哈哈姐，特朗普大嘴巴天天往死里得罪这些人，但是行动上就一直动不了手。 然后再看看，关键时候对特朗普不离不弃的人。塔克卡尔森工作都不要了硬挺他，马斯克那真", "url": "https://www.zhihu.com/question/1916350568424801042/answer/2034556601676330761", "votes": 7490, "comments": 397, "feed_ts": 1794820052, "feed_time_str": "11-16 17:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有没有一瞬间很心疼一个孩子？", "excerpt": "有，我小侄子。 我哥是个渣，侄子14年底出生，在孕期出G，甚至在产房的时候还在和2+1聊天，最后拉拉扯扯17年终于彻底离婚。嫂子回自己家，没带孩子。渣哥就更加放飞自我了，就当没有了这个孩子，丢在家里给我爸妈和我带着，也不拿钱，也不回来。侄子1岁半以后都是我和我妈带大的，孩子满月到1岁半期间是妈妈带回娘家的，后来才带回来。所以说，侄子是完全跟着爷爷奶奶过的，父母健在，但却无父无母的日子。19年清明前", "url": "https://www.zhihu.com/question/321403797/answer/80687425488", "votes": 2505, "comments": 430, "feed_ts": 1794819811, "feed_time_str": "11-16 17:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "网上总劝年轻人要沉下心做长期的事，但现实里短期看不到回报，生存都困难，坚持长期主义真的现实吗？", "excerpt": "我们从小受到的教育，都是告诉我们，做人要把目光放长远一些。 这句话并不适用于所有场合，甚至很多时候目光过于长远很容易导致自己活不到那时候。 很多时候你想要过的好，要学会长短结合。 目光长远这事儿有的是人告诉你，我今天要告诉你的是，要学会把目光收一收，少做格局怪，少搞延迟满足。 举个栗子，你在打工，你肯定会听到老板告诉你要好好干，坚持长期努力，才有一个好的将来。 这句话本身是对的，但你要思考一个问题", "url": "https://www.zhihu.com/question/2086076032361280824/answer/2105705978150785027", "votes": 185, "comments": 10, "feed_ts": 1794819428, "feed_time_str": "11-16 16:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大水哥", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "辽沈战役为什么非打不可？", "excerpt": "解放战争从宏观层面上讲是一个旋转门（其实大多数战争都是旋转门）。 比的是谁先打崩对面侧翼。跟时间赛跑。 是东北解放军在南线解放军被国民党打崩之前先打崩东北国军。 还是国民党在东北国军被打崩之前先打崩中原山东解放军。 所以国军不能从东北撤军，首先就是重兵集团战略撤退本身就是一个非常难的操作，需要极为强大的组织协调能力和执行力才能避免撤退成为溃败。其次是你的偏师撤了，对面的主力就解放了，到时候其他战 , "excerpt": "实际上重机枪对进攻的遏制能力并没有影视作品宣传的那么高。 步兵部队在进攻时会有伴随步兵进攻的直射火力或者曲射火力提供支援。 一战和二战都有迫击炮班伴随步兵作战，用于解决对面的机枪阵地火力点，迫击炮到连一级由连长直接指挥。 抗日战场，国军重机枪阵地发言之后只能提供最多5分钟的火力压制。如果不转移阵地就会被对面迫击炮轰掉。机枪远没有影视作品中那么逆天，似乎加起一个机枪阵地就可以镰刀收割对面。 一战在斯", "url": "https://www.zhihu.com/question/2105182430483179001/answer/2105680802931532300", "votes": 18, "comments": 0, "feed_ts": 1794813425, "feed_time_str": "11-16 15:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "今天我们写到了菲律宾中部的米沙鄢群岛。这是全世界台风烈度最高、侵袭最频繁的区域之一，或者说，是一条台风走廊。当地的气候矛盾已经直接冲击生存本身。但看看当地的防灾举措，就能看到一个更直接的矛盾：它来自极端的腐败。这种腐败是制度性的。地方权力彻底凝结，对下能够有效压制民众，对上能够阻止中央政府的治理穿透，形成一个从中间牟利的阶层。用“欺上瞒下”来形容可能不太准确——当地的治理结构就是由这些政治家族支撑的。他们的治理低效、腐败，应对气候冲击的能力恶劣，治理本身也存在大量瑕疵。聊到这里，回过头想一想，我们国家和菲律宾打交道时，总觉得这个国家看起来很奇怪。是的，它确实很奇怪。它没有一个真正意义上统一的中央意志，纯粹基于各种短线利益盲动。如果某个政治家族和中国贸易关系好，当政之后，整个菲律宾看起来就会对华友好；反过来，它的利益系统更多来自西方，表现出的状态就不同。这样一来，我们自然就明白了：很难把菲律宾当成一个拥有完整行为意志的集体。它本身也就是各个政治家族、政治门阀，乃至算得上封建门阀的东西合在一起，形成的这么一套玩意儿。政治，尤其是议会政治的混沌性，在它身上体现得尤为明显。", "excerpt": "今天我们写到了菲律宾中部的米沙鄢群岛。这是全世界台风烈度最高、侵袭最频繁的区域之一，或者说，是一条台风走廊。当地的气候矛盾已经直接冲击生存本身。但看看当地的防灾举措，就能看到一个更直接的矛盾：它来自极端的腐败。这种腐败是制度性的。地方权力彻底凝结，对下能够有效压制民众，对上能够阻止中央政府的治理穿透，形成一个从中间牟利的阶层。用“欺上瞒下”来形容可能不太准确——当地的治理结构就是由这些政治家族支撑", "url": "https://www.zhihu.com/pin/2105677765978617672", "votes": 0, "comments": 0, "feed_ts": 1794812701, "feed_time_str": "11-16 15:05", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "要不明天给你们讲讲其余的东西？[doge][doge][doge][doge] ", "excerpt": "要不明天给你们讲讲其余的东西？[doge][doge][doge][doge] ", "url": "https://www.zhihu.com/pin/2105677310313633561", "votes": 0, "comments": 29, "feed_ts": 1794812598, "feed_time_str": "11-16 15:03", "category": "pin", "cat_name": "想法动态"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待近段时间网络上对国内llm的悲观预期？", "excerpt": "还得是民主党 这帮货只是赢得了一个中期选举 短短几天 大模型就从落后3~6个月 变成了4年 不服不行啊 ", "url": "https://www.zhihu.com/question/2104963080740418945/answer/21053073290 const catColors = {"ai": "#4c9aff", "gold": "#f5c542", "geo": "#ff9f45", "pin": "#52c41a", "other": "#9aa4b2"};

const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';

}

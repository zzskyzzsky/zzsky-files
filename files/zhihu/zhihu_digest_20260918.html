4, "feed_ts": 1789671104, "feed_time_str": "09-18 02:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "科研Agent的第三块拼图：模型负责想，Harness负责跑，Skill负责告诉它怎么做\n图文版：链接DisCo补齐科研agent关键操作知识层智源研究院、中科大、人大与香港理工提出 DisCo 架构：自主机器学习研究 agent 在骨干模型与编排 harness 之外，核心瓶颈在于缺乏细粒度操作知识。DisCo 将开源代码库与学术文献系统性蒸馏为经环境验证的模块化可复用 skill，并以三层结构与 skill 有向图组织，实现按需激活与安全执行。AREX-Skill库覆盖千仓与五千余项skill当前发布的知识库快照深度覆盖 1000 个高频机器学习核心开源仓库，蒸馏出 5353 个可用 skill，经由 20 个垂直领域与 178 个能力族建立多重路由索引。单仓库蒸馏平均耗费约 40 美元，严格剔除流行度偏见与未经验证的噪声，确保每项沉淀的操作规范均附带确定性执行证据。固定Codex基座下四大科研基准全线大幅跃升在固定 GPT-5.5 骨干模型、Codex 研究 harness 与下游执行预算的前提下，引入蒸馏 skill 带来极显著跨越：MLE-bench 竞赛综合奖牌率从 31.11% 激增至 72.89%（相对提升 134.3%），High 档更暴涨至原始水平的 4.67 倍；PaperBench 论文复现得分相对提高 34.4%；FrontierCS 与 PassNet 分别取得 9.2% 与 14.0% 的确定性性能增益。操作技能比盲目堆叠控制环更具生产力价值在试错代价极高的高难科研任务与疑难断点上，skill 带来的赋能效应最为显著；而在资源消耗上，Codex 仅消耗 4.47M token 便在总分上超越消耗数倍 token 的竞品系统。评测揭示了未来优化精准检索以防干扰的方向，并确立了通过经过验证的操作知识取代盲目试错的研究新范式。原文标题：Repo-To-Skill: Distilling GitHub Repositories Into AI4AI Skills#无影寺 ", "excerpt": "科研Agent的第三块拼图：模型负责想，Harness负责跑，Skill负责告诉它怎么做\n图文版：链接DisCo补齐科研agent关键操作知识层智源研究院、中科大、人大与香港理工提出 DisCo 架构：自主机器学习研究 agent 在骨干模型与编排 harness 之外，核心瓶颈在于缺乏细粒度操作知识。DisCo 将开源代码库与学术文献系统性蒸馏为经环境验证的模块化可复用 skill，并以三层结构", "url": "https://www.zhihu.com/pin/2084102110489191525", "votes": 0, "comments": 0, "feed_ts": 1789668758, "feed_time_str": "09-18 02:12", "category": "pin", "cat_name": "想法动态"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待 HYROX 失禁选手就北京赛场事件道歉，决定追溯性退出该场比赛，并放弃此前获得的积分？", "excerpt": "你得知道老姐这个行为是什么性质。 不是野外跑步，也不是马拉松露天赛道，那些地方自己拉了虽然也很恶心，但基本只是恶心自己，不太影响别人。 HYROX是在一个封闭场景中，大量的有氧1公里+各种无氧动作，这里面包含了大量的共用器械以及空气不够流通，你就理解为大号健身房就好了。 老姐自己窜了，还继续比赛，已经是实打实的影响所有后面的人以及在场的人了，全场目光向她看齐，一起呼吸新鲜粑粑空气。 她后面用器械的", "url": "https://www.zhihu.com/question/2084022859974665628/answer/2084093573927015056", "votes": 356, "comments": 12, "feed_ts": 1789666629, "feed_time_str": "09-18 01:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "学生称同济大学痛经请假需脱裤检查，校医院称检查由医生视情况决定，学校有权这么做吗？有更好解决办法吗？", "excerpt": "？我当初都是直接翘课的（", "url": "https://www.zhihu.com/question/2083967193939538010/answer/2084045075873534845", "votes": 13, "comments": 3, "feed_ts": 1789665170, "feed_time_str": "09-18 01:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "离 RSI 还远吗？GLM 两周把推理提速 3 倍递归自我改进（RSI）离现实还远，但 GLM-5.3 已经在参与优化服务 GLM-5.3-Flash 的推理基础设施。GLM 团队披露，这套系统在国产 AI 加速器集群上，从首次成功运行到生产就绪不到两周，端到端吞吐相对初始基线达到约 3 倍。这里的“3 倍”说的是整套服务的吞吐，不是某个 kernel 单独跑分快了三倍。三倍来自哪一层这套系统要在 10 万余颗国产 AI 加速器上跑新架构、100 万 token 上下文和多模态请求。显存、带宽、kernel 支持都有限，单看最后一个吞吐数字，很难知道改哪里才有用。Z.ai 把 GLM-5.3 用作 Infra Agent：它负责分析、提假设、改代码、跑验证。真正让它能持续推进的，是“密集反馈”——每次改动都尽量拿到局部、及时、能定位原因的信号：数值对不对、执行时间线卡在哪、一个小测试里到底变快还是变慢，最后再回到端到端服务测结果。把慢问题拆成能验的小问题工程里最怕的反馈是“吞吐掉了 20%”。这句话只告诉你结果不好，没有告诉你谁造成的。官方的做法是让 Infra Agent 可以按当前猜想挑工具：数值测试查计算是否正确，微基准查某种输入下的局部性能，trace 看计算、等待和通信谁没有重叠，端到端测试负责验收真实服务。这样一来，模型写完一段改动后，不必每次都等整套服务部署完才知道方向错了。它先把问题压缩到一段代码、一个输入条件或一段执行区间，再用实验确认。所谓“密集”，重点不在塞更多日志，而在每个信号都能帮下一步决策缩小范围。KV Transfer 为什么从 20%差距降到 1%以内官方给了一个很具体的案例。KV Transfer 可以先理解成缓存传输：在 Prefill 和后续计算配合时，它本该和计算尽量并行。团队设的要求是，Prefill 加 KV Transfer 的表现与只跑 Prefill 相比，差距别超过 5%。但部分场景的差距曾超过 20%。时间线显示，Python 侧的 KV Transfer 没能和 DeepEP 的相关调用重叠。继续沿调用链看，问题落在相关 C++ 调用没有显式释放 Python GIL，负责传输的线程拿不到执行机会。修复这一点后，同一条件下该差距降到 1%以内。这个案例说明，端到端指标负责报警，trace 和代码路径才负责把报警变成可修的问题。人的角色是什么这不等于 GLM 已经能自己把下一代模型造出来。Z.ai 的官方长文写得很清楚：目标怎么定、系统边界放在哪里、生产风险怎么评估，仍是工程师的职责；涉及数值语义、并发和生产风险的关键改动也需要人工审查。", "excerpt": "离 RSI 还远吗？GLM 两周把推理提速 3 倍递归自我改进（RSI）离现实还远，但 GLM-5.3 已经在参与优化服务 GLM-5.3-Flash 的推理基础设施。GLM 团队披露，这套系统在国产 AI 加速器集群上，从首次成功运行到生产就绪不到两周，端到端吞吐相对初始基线达到约 3 倍。这里的“3 倍”说的是整套服务的吞吐，不是某个 kernel 单独跑分快了三倍。三倍来自哪一层这套系统要在", "url": "https://www.zhihu.com/pin/2084084167546094076", "votes": 0, "comments": 0, "feed_ts": 1789664419, "feed_time_str": "09-18 01:00", "category": "pin", "cat_name": "想法动态"}, {"actor 个比较玄学的事：张学良这个人，能得善终，极有可能是早年“积德行善”太多了。也就是说：他前半生造的福报，让他后半生屡遭劫难却也逢凶化吉。 张学良从东北易帜开始，就一直在攒福报。他直接率东北军易帜助国民党完成名义上的全国大一统，立大功。两年后，中原大战他率东北军入关调停，又助力蒋介石奠定了领袖地位。 庐山行刺时，汪精卫身中三枪，关键时刻，张学良一脚踢开了刺客手里的枪，救下汪精卫也为蒋介石解了围", "url": "https://www.zhihu.com/question/302076669/answer/2083544746597806421", "votes": 2964, "comments": 599, "feed_ts": 1789653282, "feed_time_str": "09-17 21:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "一个亿和县委书记怎么选？", "excerpt": "这个选择最可怕地方在于。 你一旦选了县委书记，那么余生脑中都会有一个声音，在不停回荡。 “这我是放弃了整整一个亿！才换来的啊！” 你接受上面检查，赔笑装孙子时，这声音会响。 不理解的村民，指着你鼻子骂的时候，这声音会响。 你憋了一肚子火，想对手下痛骂发泄，意识这样做不对，忍住后这声音还是会响。 忙活了几年当地经济也没什么起色，你发现自己其实并没什么政治头脑，这声音它又响了！ 你能硬抗着不精神崩溃，", "url": "https://www.zhihu.com/question/1966246814282917526/answer/2010840741899945292", "votes": 10875, "comments": 736, "feed_ts": 1789652632, "feed_time_str": "09-17 21:43", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "时予", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "创伤性投射比真爱更像真爱强烈的吸引力，往往带着一种奇异的熟悉感。有时瞬间的回眸也能带来灵魂的震颤。你会遇见一个人，说不清他哪里好，却莫名让人上瘾。他身上带着一种独特的磁场，或是清冷独立、或是敏感温柔、或是带着一身未被抚平的脆弱。第一次靠近，你就莫名安心；初次相识，却像久别重逢。你的情绪被他轻易牵动，你的底线为他不断退让。你笃定地告诉自己：终于遇到了那个独一无二、适配灵魂的人。你把这份极致的悸动、偏执的偏爱，定义为命中注定的缘分。可心理学告诉你：让你疯狂着迷的人，从来不是救赎，而是你未愈合的旧伤。所有一眼万年的熟悉感，都不是灵魂契合，而是潜意识的创伤投射。你被独立冷淡的人吸引，大概率是因为你从小习惯了被动等待、渴望被看见，你在他身上，看见了那个一直隐忍、不敢主动的自己。你拼命靠近他，本质是想弥补自己从未拥有过的松弛与洒脱。你心疼敏感脆弱的人，是因为你心里藏着一个不被包容、无人安抚的小孩。你拼命温柔、拼命付出，不过是想通过治愈对方，来安抚那个常年委屈的自己。我们终其一生，都在向外寻找自己的缺失。那些让你神魂颠倒、辗转反侧的特质，那些让你甘愿卑微、反复内耗的关系，从来不是对方的专属魅力。那是你骨子里缺失的底气、未曾活出来的温柔、无法自愈的遗憾，全部投射在了另一个人身上。所谓非他不可，不过是未完成的自我救赎。潜意识最擅长自我欺骗，它会制造极致的心动、盛大的宿命感，哄骗我们重蹈覆辙。我们一次次爱上同一种人，一次次陷入相似的痛苦，执着地想要改写结局。我们以为是在奔赴爱情，其实是在重复创伤。我们妄图从别人身上填补人生的空洞，用对方的爱，治愈自己的残缺。这就是为什么，执念越深的感情，越痛苦、越内耗。真正的悲哀在于：我们总期待靠一段关系圆满自己，却不敢直面自己的空洞。我们贪恋心动带来的情绪波澜，沉迷被牵动、被拉扯的感觉，宁愿在拉扯、猜忌、患得患失里沉沦，也不愿向内成长、自我圆满。我们害怕，一旦收回所有的期待与投射，褪去所有的执念滤镜，自己只是一个不完整、普通又匮乏的人。所以我们错把情绪成瘾当成深爱，错把创伤投射当成宿命。但真正的爱，从来不是惊心动魄的拉扯，不是患得患失的心动，更不是需要牺牲自我去维系的执念。真正的真爱，是两个完整灵魂的平静相遇。是你早已与自己和解，治愈了过往的伤痕，填满了内心的空洞。你不再需要靠别人的温度取暖，不需要靠别人的偏爱证明自己值得。你足够独立、足够圆满、足够安稳，这时遇见的陪伴，才是纯粹的相爱，不是刻意的救赎。好的感情，从不会让你心慌、焦虑、自我怀疑。真正的爱，是想起对方时，内心安稳松弛，是坦然舒展、满心温柔，是从容笃定、岁岁安然。剧烈心动是创伤的回响，平静心安，才是爱情本来的模样。#女性成长 #做三分钟吟游诗人 #爱情 #心理学 ", "excerpt": "创伤性投射比真爱更像真爱强烈的吸引力，往往带着一种奇异的熟悉感。有时瞬间的回眸也能带来灵魂的震颤。你会遇见一个人，说不清他哪里好，却莫名让人上瘾。他身上带着一种独特的磁场，或是清冷独立、或是敏感温柔、或是带着一身未被抚平的脆弱。第一次靠近，你就莫名安心；初次相识，却像久别重逢。你的情绪被他轻易牵动，你的底线为他不断退让。你笃定地告诉自己：终于遇到了那个独一无二、适配灵魂的人。你把这份极致的悸动、偏", "url": "https://www.zhihu.com/pin/2079615704567960106", "votes": 0, "comments": 7, "feed_ts": 1789652407, "feed_time_str": "09-17 21:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "未来加电站", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "冠军被拉下马之后，2027款元UP该如何出牌？", "excerpt": "2027款元UP飞驰版上市了，限时6.98万元起，新增501km续航版本。 表面上看，这是比亚迪一次常规的年度改款——续航补齐、外观焕新、内饰升级。但如果你了解过去半年小型SUV市场发生了什么，就会知道这次改款的分量完全不同。 这是被拉下马的“A级SUV冠军”打出了反击信号。 元UP曾经是小型纯电SUV市场毫无争议的王者。连续两年蝉联年度销冠，全球用户突破72万，2026年1-6月累计零售销量达到", "url": "https://zhuanlan.zhihu.com/p/2084031386877441368", "votes": 3, "comments": 0, "feed_ts": 1789651813, "feed_time_str": "09-17 21:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美联储宣布加息 25 个基点，时隔三年再度加息，对全球经济有哪些影响？全球资产价格会有怎样的连锁反应？", "excerpt": "其实我的看法很明确： 短期全球资产大概率会上涨，而不是下跌。 就可能大家想的是，美联储加息是大利空，市场应该大跌，但真实盘面和资金逻辑完全不是这样。 而这一轮短期拉升，最核心的原因就四个字： 主力出货。 大家可以复盘历史规律，美联储一旦开启加息周期，绝对不会立刻转向降息。 而加息落地之后，市场往往不会马上走熊，反而会特意拉出一波反弹行情。 但我告诉大家，这一波上涨根本不是新行情启动，纯粹就是标准的", "url": "https://www.zhihu.com/question/2083741444628656734/answer/2084025049724592409", "votes": 187, "comments": 34, "feed_ts": 1789650291, "feed_time_str": "09-17 21:04", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价尼克兰德最新推文：如果我是中国人，我会成为一个汉族沙文主义者？", "excerpt": "人们看到这个问题后大吃一惊，纷纷询问：谁是尼克兰德？", "url": "https://www.zhihu.com/question/2076466197177053773/answer/2083238698947298357", "votes": 386, "comments": 8, "feed_ts": 1789649341, "feed_time_str": "09-17 20: 西津电站那些技术员、工程师见了他都怕。", "url": "https://www.zhihu.com/question/2082841016533632412/answer/2083150218854404653", "votes": 25415, "comments": 1347, "feed_ts": 1789638870, "feed_time_str": "09-17 17:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "市长敢与书记直接冲突吗？", "excerpt": "利益小的时候讲班子团结。利益大到一定程度，书记和市长一样会翻脸。 很多人对地方政治有一个误解，觉得市委书记是“一把手”，市长是“二把手”，于是自动脑补成：书记说“这么办”，市长说“好的书记”。 实际当然没这么简单。 书记排名在市长前面，这是真的。党委在地方重大事项上的领导地位，也是真的。 但这不等于市委书记手里拿着一个遥控器，可以直接控制市政府。 市长有市长自己的权力来源。 一个地级市里，发改、财", "url": "https://www.zhihu.com/question/1997013541618734014/answer/2079712804886655746", "votes": 957, "comments": 104, "feed_ts": 1789638772, "feed_time_str": "09-17 17:52", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "温伯陵", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么西方始终提防和不接纳俄罗斯，把普京从鸽派逼成了鹰派？", "excerpt": "根子在于两边对冷战结束性质的认识存在巨大的分歧. 对于美国，西欧和日韩，他们当然认为：苏联和东欧是战败国，古巴和越南朝鲜也是战败国，中国是反骨仔，一战和二战中意大利那种性质。而且美国也的确实现了对前苏联国家的巨大经济收割。从经济和资源角度看，美国和西欧日韩，拿到了名义上不叫战争赔款的战争赔款。 对于俄罗斯，俄罗斯认为自己主动结束冷战的，作出了巨大牺牲，戈尔巴乔夫的贡献比里根和撒切尔加在一起都大。俄", "url": "https://www.zhihu.com/question/633368918/answer/43081672606", "votes": 17851, "comments": 966, "feed_ts": 1789638693, "feed_time_str": "09-17 17:51", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "正解局", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Agent越来越多，制造业如何“真用上”？", "excerpt": "最近，国内外做Agent产品的公司，几乎都在讲同一个故事。AI不能只会聊天，得有上下文，会跑工作流。 微软Copilot能读你的邮件、会议和文档；谷歌把Gemini塞进Workspace；Salesforce让Agent在CRM里自己干活。总之，大家都希望Agent能像员工一样进入企业。 对于制造企业，更实际的问题是：AI越来越强，自己多年积累的经验和系统，能不能跟着派上更大的用场？ 一份维修记录", "url": "https://zhuanlan.zhihu.com/p/2083974435904689535", "votes": 0, "comments": 0, "feed_ts": 1789638666, "feed_time_str": "09-17 17:51", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "进击的沈帅波", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "雷军“回B站娘家”，不忘初心", "excerpt": "00 每到周一，打工人的脸上都很难挤出笑容，除非你在B站上班。 就在这个平平无奇的周一，雷军坐着最新发售的小米澎程N90 Max，来到了B站上海总部。请问谁在看到《Are You OK》现场版的时候能崩住不笑啊！（bushi） 那天还是上海、杭州首批小米澎程车主的交付日。雷军前几天人还在徐州，上午在上海交付了一批新车，傍晚就去杭州赶下一趟交付了。这么紧的日程还专门抽空去了B站，可见对“回娘家”的重", "url": "https://zhuanlan.zhihu.com/p/2083963360270358135", "votes": 0, "comments": 0, "feed_ts": 1789638348, "feed_time_str": "09-17 17:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "Gemini的模型是不是已经快被淘汰了？", "excerpt": "光凭两点我就非常不喜欢用GPT： 1） 不同话题强行关联。在GPT已经摸清了你的用户画像后，你新建的任何一个会话内，必定会跟你的职业、搜索习惯、上次问的话题相关联甚至是毫无关系的A和B和C，这让人非常心烦，用中国人的话来说就是“肚子里的蛔虫” 2） 废话文学大师，用过的都有体会吧。屁大点事也要1.2.3.4.就不说了，从上到下全是超强数理化思维、超绝J人属性的语句：目前的几个重点/最值得关注的变化", "url": "https://www.zhihu.com/question/2050527290925248637/answer/2082479592871405421", "votes": 61, "comments": 26, "feed_ts": 1789638319, "feed_time_str": "09-17 17:45", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《人民的名义》到底真不真实？", "excerpt": "除了那个黄毛是纯败笔，其他人物在很多细节上非常真实， 特别是在达康书记的“秘书”出身这件事上，很真实。竟然还有人说李达康根本不像干秘书的，李达康在剧中几乎就差把 “我以前是做秘书的”写脑门儿上了，到处都是一个秘书的肌肉记忆。随便列举5点吧，第5点我觉得是最牛的。 1.真秘书从不坐着接领导电话。达康接沙瑞金的电话，直接原地起立，嘴角上扬。 据说在打电话时，对方是什么状态是可以隔着电话线能感受到的。所", "url": "https://www.zhihu.com/question/2334555244/answer/2069138258055914735", "votes": 2452, "comments": 203, "feed_ts": 1789638191, "feed_time_str": "09-17 17:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么没有 YY 染色体？", "excerpt": "不是这样。 所谓的“XY染色体”指的不是某条特定的染色体，而是指一种特定的性别决定模式：雌性同配，雄性异配，哺乳动物、孔雀鱼、果蝇、银杏的“XY染色体”完全不同源，只要雌性的性染色体是同型的，主要（“主要”是因为性别实际上是由整个基因网络决定的，）由一条雄性特有的性染色体的存在与否决定性别，那么它的性染色体就被称为“X染色体”和“Y染色体”，它们理论上有可能从祖先物种的任何一对常染色体发育而来。 ", "url": "https://www.zhihu.com/question/20142957/answer/2083973708536988295", "votes": 4, "comments": 4, "feed_ts": 1789638051, "feed_time_str": "09-17 17:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "鬼有生前的回忆吗？", "excerpt": "鬼的记忆民间的说法是： 有，但不全。枉死的、有执念的鬼，记忆最清晰 —— 它记得自己怎么死的，记得是谁害的，记得死前最后一眼看到的东西。这些记忆像钉子一样钉在魂魄里，拔不掉，所以它徘徊在人间，不肯走。 正常死亡的鬼，记忆会慢慢褪色。它记得自己有过家人，有过家，但家人的脸越来越模糊，家的地址想不起来。到最后只剩下一种感觉 ——&#34;我好像在等什么人&#34;，但等谁，不记得了。 还有一种最可怕。", "url": "https://www.zhihu.com/question/2080251486190285278/answer/2080599905308090394", "votes": 1, "comments": 1, "feed_ts": 1789637792, "feed_time_str": "09-17 17:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "2400万人围观，前OpenAI研究员做了个「闭嘴」模型", "excerpt": "编辑｜山辉 你敢信， 曾经全力推动 AI 学着说话的人，现在做出了一个「闭嘴」的模型。 前 OpenAI 研究员 Diogo Almeida 终于结束了两年的隐身状态，正式发布新模型 Jev。 Almeida 是 2022 年 InstructGPT 论文的共同作者之一，也参与了 OpenAI 早期 RLHF 与 GPT-4 的相关工作。可以说，今天 ChatGPT 式「能听懂人话、会和人聊天」的", "url": "https://zhuanlan.zhihu.com/p/2083970992435734185", "votes": 4, "comments": 0, "feed_ts": 1789637480, "feed_time_str": "09-17 17:31", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "现代人都看不起义和团吗？为什么会这样？", "excerpt": "不是所有现代人。只有一些对自己对民族缺乏信心的人，需要从义和团身上找自信找优越感。 对自己对民族有信心的人，是可以同时看到义和团的两面，我们不需要向这些被社会逼迫到没有见识，大字不识，但是敢于反抗的人身上找优越感。 有那么一群人，看到人民被屠戮，便要慨叹为什么不抵抗，白白被杀？人民抵抗了，他们便又是另一幅嘴脸，为什么乱抵抗？几乎也没见杀死几个洋人？你不知道当时的文盲率？你让他们怎么做才不错？ 总之", "url": "https://www.zhihu.com/question/545516024/answer/2083971005874188963", "votes": 53, "comments": 1, "feed_ts": 1789637406, "feed_time_str": "09-17 17:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "AI Agent安全不能只靠Prompt了：上海AI Lab探索Agent安全进化新范式", "excerpt": "大模型 Agent 进入浏览器、邮件、数据库和业务系统后，安全评估如果仍只检查最终回复是否包含有害内容，覆盖面会明显不足。Agent 需要规划步骤、读取外部信息并调用工具，风险可能出现在执行过程中的任一环节。 网页中的隐藏指令可能改变任务目标，邮件或文件内容也可能被误判为用户命令。工具权限过宽会导致越权调用；错误记忆和过期计划则可能使多轮执行逐渐偏离原始授权。这类失败通常不是某一次模型输出单独造成", "url": "https://zhuanlan.zhihu.com/p/2083970752664037368", "votes": 0, "comments": 0, "feed_ts": 1789637388, "feed_time_str": "09-17 17:29", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "Nature封面 | 打破高分辨率限制，谷歌AI气象模型精准预测台风路径", "excerpt": "编辑丨coisini 最近几年，人工智能（AI）已成为天气预报中一种强大的新范式。与数值天气预报（NWP）系统相比，AI 在预测大气状态方面实现了更优的预报精度和速度。 台风作为最危险、造成损失最大的天气现象之一，其预报仍然具有挑战性。近期，谷歌联合多家气象机构发布了一种专门针对台风等热带气旋的气象预报模型 ——WeatherNext Cyclones（WN-C）。 WN-C 可对全球热带气旋的路", "url": "https://zhuanlan.zhihu.com/p/2083970442814022898", "votes": 0, "comments": 0, "feed_ts": 1789637299, "feed_time_str": "09-17 17:28", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "Karminski-牙医", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "union-alpha 应该不是国产模型?", "excerpt": "union-alpha 应该不是国产模型?https://www.zhihu.com/video/2083969715232420434给大家简单测一下 openrouter 上这个匿名模型 union-alpha. 简单来说, 看上去并不是一个2026年现阶段的旗舰级模型. 一个重要特征是, 构建3D场景需要用到three.js库, 在我测试的今年的这些模型中, 大家都已经迭代到了 three.", "url": "https://zhuanlan.zhihu.com/p/2083969717736416361", "votes": 1, "comments": 1, "feed_ts": 1789637138, "feed_time_str": "09-17 17:25", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "肠道里住着那么多细菌，免疫系统为什么不会一直攻击它们？", "excerpt": "肠道根本没把那三十八万亿个细菌当成自己人,免疫系统也从没给它们发过永久免死金牌, 纯粹是够不着。 哪怕肚子里装的微生物比全身细胞总数还多,从拓扑学结构看,消化道中间那个空腔其实属于身体外面, 就像一根空心橡胶管子中间穿过去的那根铁丝,只要皮没破,两边就从来没有真正碰过面呢, 最底层的逻辑就在这。 很多人以为肠道里是一团和气的大同世界,实际情况是双方在微米级别的边境线上拿枪顶着脑门, 二十四小时对峙", "url": "https://www.zhihu.com/question/2078484653351121598/answer/2083314185799197240", "votes": 892, "comments": 59, "feed_ts": 1789637072, "feed_time_str": "09-17 17:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "黄金白银何时表态？上还是下？黄金白银何时表态？上还是下？Fed美联储的FOMC会议后，黄金围绕4300美元/盎司，白银围绕63美元/盎司，涨涨跌跌，忙得不亦乐乎。（20260917）其实昨天的文章大致上都讲了这个问题了，关键词是：妥协。Fed美联储不得不妥协，象征性加息一码，多给点儿利息，然后？然后就没有然后了啊。咋的，不服气？去地主家讨饭，地主赏赐一大青花瓷碗的白米饭，上面高高地堆起了几块大肥肉，还不满意？还想吃地主小妾的那碗燕窝？想吃地主儿子盘里的那盘鱼翅？地主恐怕二话不说，喊长工给端个盆子，让当街方便一下，然后？然后要自己领会了啊，地主家可是有大狼狗和护院的啊。国债利率大涨？公司债价格崩溃？Fed美联储很怕这些么？因此，黄金白银在此震荡一下是很正常的，不急，昨天就讲过了，接下来咋办？上还是下？如果还想问，给两个条件：1》油价这两天不是跌了么？跌了后，黄金白银就要快快地 狠狠地表现了，如果表现不好，对不起，原油这家伙一旦上涨：总统只能要求国民忍受一下，最起码等到期中选举之后...帝国之戴金丝眼镜的财长在中东搞的那个“经济制裁”伊朗的大工程还有人记得么？财长，你对油价有发言权么？你亲耳听过Fed美联储的新主席抱怨过油价太高了么？因此？因此我们在布伦特原油70上下的时候，就让你要对帝国的壮志雄心做好准备，你听了么？我发了几次文章让你操作原油，并给出具体的仓位指导，你听了么？为什么我这几个月都没有给出贵金属的仓位指导？2》时间。这个简单，按我的推算，周五晚上，最迟下周一，大大小小的主力们，“钱”们就会把能蹦跶的空间给消耗光，接下来或许就要到见真章的时刻了。如果，如果地主没有把他小妾的那碗燕窝端出来，没有把儿子盘里的那盘鱼翅那给你，那你或许就要：三十六计，走为上...啦。否则，否则你恐怕就要和某些头铁的一些主力一样，接受从欧洲到美洲的大大小小的“狼”们的洗礼了，不服气？这是黄金白银啊，就是“钱”啊，你不准人家拿这个“钱”兑换出别的能救急的 钱 么？兔子急了还咬人呢，“狼”们急了，就会套现砸盘，在他们眼里，黄金白银数字货币农产品的光环统统比不上把margin call的警报压下去来得更实在 更诱人。当然，当然我们昨天也说了，如果Fed美联储后面被爆出来了偷偷大放水，下场充当了冤大头，那我是会出来检讨的，我们的很多模型弄不好会推倒重来的。强调一遍：不是什么唱空，唱多，管他多还是空，一件商品，你是用它来操作赚钱的，没有永远涨的行情，如果概率显示：忍一下就有更香的价位，抄底是不是更爽么？时间上拖延些日子，会怎样？会犯法么？别这样，上次被投诉掉的非农的那篇，说了：非农多，黄金白银跌，非农少，黄金白银跌。很“准”，然后呢？然后联合国给两个赏钱？昨天的Fed美联储的FOMC议息会议，说了加息的话，黄金 白银直接跌，最多挣扎一下，“准”么？联合国给个奖杯？我说表态，不是让你又去梭哈，不是重仓+放空，我没给具体的仓位指导的话，都请：持币观望。否则，盈亏自负。稳妥些，最起码等到黄金回踩4000 或 白银回测58的时候，再来定方向？唱空 黄金，人人喊打。但如果我是操作黄金的大主力，我不会在4000美元/盎司这个位置建立防线，这个位置~~~太烂了，哪个位置建立防线更合适？现在保密，给钱也不告诉你...今年黄金白银这种大开大合的行情，操作不好，看对了方向都要赔钱的，何况是看错方向？你能稳住的话，不亏钱，或许你就跑赢了80%以上的投资者啦。如果Fed美联储+帝国联手把黄金 白银给砸下去了呢？因此，可以骂，但还是稳一下，你有没办法去找总统和Fed美联储主席去算账？因此，不要满仓，不要上杠杆。黄金在未来出现37xx 35xx甚至更低的价位的概率不变，出现2xxx美元/盎司的概率正在变高，黄金可能需要在更低的位置来筑底反攻，但底部是一定存在的。（但，黄金也有在4000-5000美元/盎司之间震荡两年以上才会有方向的概率。一年多后的黄金的6000-8000美元/盎司的目标不变）。白银在未来出现3x，2x的概率正在变高。白银可能需要在更低的位置来筑底反攻，但底部是一定存在的。（但，白银也有在50-80美元/盎司之间震荡两年以上才会有方向的概率。一年多后的100-150美元/盎司的目标不变）。裸空+高杠杆的朋友，请继续保持弹性仓位，进退有度。==给出 黄金 伦敦铜 有色金属 白银的近期规划（图1 2 3 4 更快更详细的规划请参阅我们的每日更新的专栏文章的内容），其余图片是近一年内的黄金白银的一些关键节点的选择，供参考。随时都会更新的文章的链接请看这里：https://zhuanlan.zhihu.com/column/c_1962592595592081509 http://zhuanlan.zhihu.com/column/c_1962592595592081509 ", "excerpt": "黄金白银何时表态？上还是下？黄金白银何时表态？上还是下？Fed美联储的FOMC会议后，黄金围绕4300美元/盎司，白银围绕63美元/盎司，涨涨跌跌，忙得不亦乐乎。（20260917）其实昨天的文章大致上都讲了这个问题了，关键词是：妥协。Fed美联储不得不妥协，象征性加息一码，多给点儿利息，然后？然后就没有然后了啊。咋的，不服气？去地主家讨饭，地主赏赐一大青花瓷碗的白米饭，上面高高地堆起了几块大肥肉", "url": "https://www.zhihu.com/pin/2083958066463167707", "votes": 0, "comments": 43 OTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价广西两老人查出孙子非亲生案的最新进展:鉴定机构挨罚？", "excerpt": "我再强调一次 将军文学这种前现代社会的废话文学，在后现代社会环境里是非常宝贵的。 举例说明 贫困生一定要贫困。 男人一定要是男的，女人一定要是女的。 强奸罪一定要有强和奸的行为。 故意报假警、诬告是有罪的。 。 。 。 还有本案的 亲儿子一定要有血缘关系。 ", "url": "https://www.zhihu.com/question/2083542028521157579/answer/2083858793595781740", "votes": 624, "comments": 22, "feed_ts": 1789631650, "feed_time_str": "09-17 15:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "南爸安爸", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "Astra 超出预期了最近使用 Astra 比较多，在复杂问题推理/3D 输出/agentic coding 上都出奇得好，token efficiency 还非常高，真的超出预期不少。", "excerpt": "Astra 超出预期了最近使用 Astra 比较多，在复杂问题推理/3D 输出/agentic coding 上都出奇得好，token efficiency 还非常高，真的超出预期不少。", "url": "https://www.zhihu.com/pin/2082226928120084261", "votes": 0, "comments": 1, "feed_ts": 1789631198, "feed_time_str": "09-17 15:46", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "假如泽连斯基发表辱华言论，你还会支持乌克兰吗？", "excerpt": "当然支持了，我还支持所有支持乌克兰的网友亲自去乌克兰前线打击俄罗斯军队最后血洒疆场。 我想用他们的鲜血，唤醒泽连斯基的良知。让他也知道中国人里也有懂是非，有道德、敢战斗，得好死的人。 ", "url": "https://www.zhihu.com/question/2082545841433207404/answer/2083943376953655784", "votes": 29, "comments": 3, "feed_ts": 1789630819, "feed_time_str": "09-17 15:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "法家明明效率极高，为什么后世王朝不敢公开主推？", "excerpt": "法家的优点是比较讲明规则，但是法家的问题是既当裁判又亲自下场。明规则的制定，民本身并不参与。 但是博弈本身并不会缺席，所以民与法家代表的国家机器间的博弈，不是在制定阶段，而当你的制度制定的好，那就形成合力，比如军功爵，当你的制度制定的不好，民就会造反。 所以法家缺少的是一个制衡的办法，就是制定规则的时候听听民间意见。缺少一个类似议会的机构。尽量把博弈停留在纸面上，停留在制度建设阶段，而不是逼着民起", "url": "https://www.zhihu.com/question/2083225082575509271/answer/2083942073951175997", "votes": 18, "comments": 1, "feed_ts": 1789630508, "feed_time_str": "09-17 15:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "大龄程序员被裁后个人开发->接外包->自媒体->带货->铁人三项全经历", "excerpt": "本人失业了。 能说出失业二字，是我的一大进步，一点不羞愧一点不尴尬。 我是78年人士，程序员，中国程序员高级认证，某跨国超市大中华区CTO，某跨国超市大中华区首席工程师。国内第一批开发全渠道中台的开发者之一。 先后完成过3个亿级的全渠道中台建设，从0到647万行代码（含小程序、APP、Web、各渠道对接），在2016-2023年间，先后把3个大型零售中台优化到可以支撑一秒50,000个订单成交，单", "url": "https://zhuanlan.zhihu.com/p/2083550046256158185", "votes": 352, "comments": 143, "feed_ts": 1789630373, "feed_time_str": "09-17 15:32", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么欧美普遍允许工人罢工？", "excerpt": "撒切尔夫人，第49任英国首相（1979年—1990年在任），也是英国第一位女首相， 强调企业自由竞争，实行国企私有化；对工会采取强硬态度。 攻击工党政府将英国引向“一条彻头彻尾的社会主义国家的道路”， 1984年至1985年爆发了煤矿工人大罢工，撒切尔夫人发动了三千骑兵冲击罢工队伍的反动暴行。 并且在事先做好储煤、防暴等充份准备的情况下，同矿工进行了长达一年之久的较量，最后拖垮了罢工。 更早一点可", "url": "https://www.zhihu.com/question/2082515229972358894/answer/2083940827374565277", "votes": 41, "comments": 2, "feed_ts": 1789630211, "feed_time_str": "09-17 15:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BBuf", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "一个AI infra菜鸟的实习碎碎念", "excerpt": "从五月底实习到现在已经过去三个多月了，秋招是看起来毫无机会，回想当初实习找的就不顺利，很多都是简历挂或者一面挂。后来很幸运来到现在的这个组，对我来说“AI infra味很正”，虽然不是我最想搞的MaaS，但只要是AI Infra我就干，当然我也没得选。 入职之后，遇到了很好的mentor，后来因为机缘巧合我直接归+2管，+2也非常懂技术，头脑清晰，典型的高精力人，虽然因为他平常很忙，跟他的直接交流", "url": "https://zhuanlan.zhihu.com/p/2083699922654736754", "votes": 123, "comments": 11, "feed_ts": 1789629703, "feed_time_str": "09-17 15:21", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待以色列人拍的纪录片NAZA会揭露他们在加沙屠杀平民？", "excerpt": "又在问题底下看到某春秋笔法大师的回答，点进去一看果然又是全篇充斥着断章取义、逻辑错误，还是那老一套的话只说一半的伎俩，可见该人已经形成流水线生产作业，属于很成熟的以色列中国外宣的一员了 讨论一部纪录片本身，上来不是剖析影片而是先给导演扣帽子、定成分、泼脏水，还顺带着把所有认同影片的人打成“巴友”，这是涂春秋大师的老三样了讨论《NAZA》这样的纪录片，当然可以怀疑它。事实上，这部影片最严重的指控——", "url": "https://www.zhihu.com/question/2081807423669532534/answer/2083920588947695179", "votes": 44, "comments": 5, "feed_ts": 1789629315, "feed_time_str": "09-17 15:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "bolshevist", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待 DeepSeek 刘胜与的《我不得不把才华埋葬在昨天》？", "excerpt": "写算子的同行说，AI 快要追上他的手艺了，他不得不把才华埋葬在昨天。读完我在屏幕前坐了很久。那感觉很难形容，像参加别人的葬礼，却在墓碑上看见了自己的照片。他把才华埋葬在昨天，我埋得更早一些，在前天。坟头的草，已经换过两季。 我入行做的是搜索引擎，后来转推荐系统。十几年前，这被公认为最人工智能的行当。那时候的排序是一门手艺：一个query进来，要拆意图、扩同义词、判时效，再把几十个人工特征灌进排序公", "url": "https://www.zhihu.com/question/2083123101873844765/answer/2083933366127220422", "votes": 32, "comments": 2, "feed_ts": 1789628432, "feed_time_str": "09-17 15:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为啥学霸反而很少被霸凌？", "excerpt": "给你们展示一下一个学霸在学校里面的真实待遇。 我读中学时的学校巨垃圾，校长压根就是个混混。 整天穿着一件港风花衬衫，骑着大摩托四处乱晃。 师资力量真的是物理意义上的力量。所有老师，有一个算一个，但凡是少两块腹肌的，绝对镇不住底下一帮嗷嗷叫的狼崽子。学校里打架斗殴、恃强凌弱的事儿更是屡见不鲜。 逢一三五单挑，二四六群殴，到了周日那就更完犊子了： “战端一开，那就是地无分南北，人无分老幼，无论学生老师", "url": "https://www.zhihu.com/question/649088469/answer/77509838013", "votes": 27382, "comments": 1001, "feed_ts": 1789627812, "feed_time_str": "09-17 14:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为何不推广用氮气执行死刑？", "excerpt": "大学毕业前去某煤气厂实习，工程师给我们讲了一个真实案例。 有个氮气仓，里面发生了故障，一个阀门需要关闭，拧几圈就行，很简单。 不简单的是，屋子里充满氮气，从门口走到阀门有几米远。 按照规定，应该是背上氧气瓶，带好面罩，然后进去拧。 俩工人一个有点文化，说，别看什么规定，氮气不是毒气，我直接深呼吸一口气，充进去拧玩跑出来就行，不用费事。 于是他深呼吸之后冲了进去，拧了几圈，就趴下了！ 工友一见，这是", "url": "https://www.zhihu.com/question/445104923/answer/68029214141", "votes": 19152, "comments": 1445, "feed_ts": 1789626523, "feed_time_str": "09-17 14:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美联储3年来首次加息，加息25个基点，将基准利率上调至3.75%-4.00%，会对市场有哪些影响？", "excerpt": "这个结果在公布之前，我们就讨论过了，就是我们预测的第二种情况：加息25个基点 + 保留后续加息可能性。原因就是市场都已经定价93%的概率加息，而且到2027年7月之前总共4次加息，美联储已经无路可退。 这时缩掉、说不加息，沃什和美联储都会被质疑丧失独立性，美元和美债会被猛砸。美联储为了保住自己的信用，也只能选择加息。 西方的央行和货币体系，整个是建立在信用这个基础之上，这和国内有很大的区别，两边的", "url": "https://www.zhihu.com/question/20836 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "DeepSeek 居然会对用户说「我去吃饭了」「我去睡了」，为啥会出现这样的现象？", "excerpt": "你给我回来修bug!!! 26.08.06更新 今天开始，干一两次对话就要下班收工。。。。 ", "url": "https://www.zhihu.com/question/2066223484309434997/answer/2068510875489768678", "votes": 677, "comments": 8, "feed_ts": 1789623310, "feed_time_str": "09-17 13:35", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "哪一刻让你终于意识到了和对方是两个世界的人？", "excerpt": "老公的老家，人称孔孟故里，礼仪之乡；我一直担心会不会不让我上桌吃饭。 第一次去他家过年，在村里一家人摆了七八桌，几十口子人聚在一起。 大概是按照年龄、辈分、性别分开坐，没有传说中的可怕。 直到开餐之前，一个亲戚大爷突然说“那谁，你是体制内，你得上坐” 于是我乖乖换桌子，坐在村长大爷和老公爷爷一辈人中间。 回头看我老公， 因为这么大人了还没有孩子，没有下一代不能去一家之主那边。 于是只能坐小孩那一桌", "url": "https://www.zhihu.com/question/50624580/answer/3271685009", "votes": 91986, "comments": 2818, "feed_ts": 1789621976, "feed_time_str": "09-17 13:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "看了一下胡塞放出视频。沙特飞行员为何不打红外干扰弹，而是在打铂条干扰弹(如果是红外干扰弹，整个机体右半球在光电镜头中会出现厚重光影，铂条干扰弹就轻很多)，第二没有甩掉导弹就关闭加力。这是什么操作", "excerpt": "看了一下胡塞放出视频。沙特飞行员为何不打红外干扰弹，而是在打铂条干扰弹(如果是红外干扰弹，整个机体右半球在光电镜头中会出现厚重光影，铂条干扰弹就轻很多)，第二没有甩掉导弹就关闭加力。这是什么操作", "url": "https://www.zhihu.com/pin/2083886513058849895", "votes": 0, "comments": 19, "feed_ts": 1789621932, "feed_time_str": "09-17 13:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "真DEI来了，你们聊#美国 #联邦调查局 ", "excerpt": "真DEI来了，你们聊#美国 #联邦调查局 ", "url": "https://www.zhihu.com/pin/2083886669082772631", "votes": 0, "comments": 10, "feed_ts": 1789621904, "feed_time_str": "09-17 13:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "小米直播训练 MiMo-V2.6，重启原因也公开MiMo-V2.6 还没发布，小米 MiMo 先把两条正在进行的 RL 训练线挂到了网页上。页面持续显示训练成本、每一步处理的 token、任务来自哪些类别、评测进度；连一次基础设施故障导致的重启，也直接写在通知栏里。大模型后训练常常只留下最终分数。这块看板把规模化 RL 的任务组织、harness 运行和评测分配过程也展示出来，工程中的中断和恢复同样可见。两条训练线同时跑什么小米 MiMo 的说明写得很具体：MiMo-V2.6 正在 RL 训练中段，单步约 20 亿 token；每个 batch 有 1,568 个提示，每个提示生成 16 次 rollout，也就是同一提示下的完整尝试轨迹，训练采用全异步方式。这一轮同时扩展了三部分：算力规模、多任务 agent RL 的环境与 harness，以及评测算力。这里的 harness 是把任务、工具调用与评测串起来的运行外壳；公开说明称，未来几周会逐步开源细节。训练看板上并排显示 MiMo-V2.6 Pro 和 MiMo-V2.6 Flash。浏览页面时，Pro 的单步读数为 2.49B token、累计 27.6B token；Flash 为 2.69B token、累计 35.2B token。两条线都标注为 1,568 x 16 条序列。一个 batch 里装的是什么任务除总 token 数外，看板还标注了 Pro 当前 batch 的 25 个来源和 1,568 个提示：代码类占 67.2%，通用任务占 12.4%，视觉任务占 13.4%，网络安全占 4.1%，聊天占 2.9%。这些信息让读者能看到任务如何混合，以及动态采样、评测队列和训练吞吐的状态。对 agent RL 来说，任务配比、工具环境和评测是否跟得上，都会影响最终训练效果。指标页还展示了 dynsam 等动态采样读数，以及可测任务数、目标任务数等过程指标。它们用于观察训练中的样本和评测状态，不能用一条曲线直接替代最终能力结论。124 万美元以外，页面也记录故障浏览时，页面顶部的累计成本已超过 124 万美元，且仍在实时变化。这个数是正在运行的看板读数，不能当作完整训练预算；它至少说明，大规模 RL 的成本已是模型、任务环境、采样和评测共同决定的系统问题。更有价值的是通知栏。小米 MiMo 写明，Flash 曾因一个数据集上的基础设施错误约三小时未被正确检测，从 step 15 重启；Pro 也因一个节点的显存问题重启。页面把重启事件和训练进度一并展示，读者能看到真实运行中会遇到的故障类型。当前分数能说明什么看板当前展示 DeepSWE v1.1 上 mini-swe-agent、avg@3 设置下的离线结果：Pro 为 63.72，Flash 为 60.77。小米 MiMo 同时注明，离线评估仍会继续更新", "excerpt": "小米直播训练 MiMo-V2.6，重启原因也公开MiMo-V2.6 还没发布，小米 MiMo 先把两条正在进行的 RL 训练线挂到了网页上。页面持续显示训练成本、每一步处理的 token、任务来自哪些类别、评测进度；连一次基础设施故障导致的重启，也直接写在通知栏里。大模型后训练常常只留下最终分数。这块看板把规模化 RL 的任务组织、harness 运行和评测分配过程也展示出来，工程中的中断和恢复同", "url": "https://www.zhihu.com/pin/2083904897863438588", "votes": 0, "comments": 0, "feed_ts": 1789621678, "feed_time_str": "09-17 13:07", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价特朗普的政治水平？", "excerpt": "无法谈论一个不存在的东西 ", "url": "https://www.zhihu.com/question/2061207623786030327/answer/2083853040789079523", "votes": 71, "comments": 6, "feed_ts": 1789621672, "feed_time_str": "09-17 13:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小旋风财进", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待今年的超级厄尔尼诺现象？", "excerpt": "很多商品大佬喜欢研究气象学，投资做久了，奇怪的知识在增加 在南美洲西海岸，秘鲁和厄瓜多尔交界那一带，有一群渔民 每年到圣诞节前后，这片海水会莫名其妙变暖，海水颜色变深，鱼变少 渔民不知道这是为什么，只知道它总是在耶稣的生日出现，于是给它起了个名字，叫圣婴，他们说的是西班牙语，音译过来就是厄尔尼诺 太阳照下来的时候，照在海上的能量是差不多的，但海水并不会平均分配能量 正常情况下，赤道太平洋东部，也就", "url": "https://www.zhihu.com/question/2043053520912388470/answer/2083899177910772361", "votes": 102, "comments": 7, "feed_ts": 1789620281, "feed_time_str": "09-17 12:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TopView", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "靴子落地！！", "excerpt": "凌晨2点，美联储议息会议开完了。其实议息会议的结果并不重要，因为昨天晚上市场已经有很强的预期了。 昨晚时候市场把加息25个基点的概率定价到90%以上，polymarket概率也都差不多，也就是说市场预期联邦基金利率会从3.50%到3.75%，抬到3.75%到4.00%。这是2023年7月以来第一次加息。 今天也确实如此，加息25个基点。加息这个结果已经不重要了，昨晚已经知道了，已经price in", "url": "https://zhuanlan.zhihu.com/p/2083898336680198654", "votes": 59, "comments": 5, "feed_ts": 1789620138, "feed_time_str": "09-17 12:42", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美联储预计年底前还将加息一次，12 位官员预计今年还将加息 25 个基点，这次加息周期会有多长？", "excerpt": "我说会加息已经说了几个月了，我一贯的看法就是，只要经济数据指向加息，美联储就会加息，因为美联储必须要保住自己的信用。 即使上回沃勒出来放鸽，当时黄金大涨，我也提醒大家小心，不能就此认为9月不会加息。这种话肯定没流量，但真金白银在投资的人，实在讲不出“美联储不敢加息”这种反智言论。今早这个结果，就是我们事先分析的第二种情况： 加息25个基点 + 保留后续加息可能性。 媒体称美联储本周大概率加息，如何", "url": "https://www.zhihu.com/question/2083745294370526221/answer/2083882114894787922", "votes": 165, "comments": 37, "feed_ts": 1789619350, "feed_time_str": "09-17 12:29", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "香港首任特首董建华逝世，享年 89 岁，他有哪些贡献值得铭记？", "excerpt": "本以为是谁搞了个大新闻，想进来说一句，你们不要听风就是雨说什么逝世，无中生有的事情，你替他重复一遍，等于你也有责任的吧？ 结果进来一看，好吧是我图样图森破了，我还得要学习一个，看新闻一定要按照新闻法。 时间仿佛又回到了当初，中央已经决定了，董先森做的很好的那时候，意气风发，闷声发大财，这是最吼的。 现在恍惚一眨眼，历史书上已经写满了三件大事和微小的工作。 这不禁令我感到安古瑞，忍不住要得罪你们一下", "url": "https://www.zhihu.com/question/2080921286784409779/answer/2080990250743158679", "votes": 463, "comments": 2, "feed_ts": 1789619014, "feed_time_str": "09-17 12:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_COLLECT_ANSWER", "verb_cn": "收藏了回答", "title": "美联储3年来首次加息，加息25个基点，将基准利率上调至3.75%-4.00%，会对市场有哪些影响？", "excerpt": "现在就业数据强劲（比预期高了一倍还多），通胀黏着，美联储是没有任何退路的，必须加息。 就业数据出来的时候，本月加息概率是60%，通胀数据出来后，加息概率已经是90%。 而美联储在历史上从没有过在市场押注90%以上的时候，和市场预期相反过，一次都没有。 所以美联储这次是不能维持不动的，这会让美债崩掉的，加息是毫无悬念的事，这是沃什在口头放鹰后，无论他有多么不想加息，这次事到临头，也逼着他必须演一次鹰", "url": "https://www.zhihu.com/question/2083684721486029950/answer/2083848510961610951", "votes": 194, "comments": 27, "feed_ts": 1789618976, "feed_time_str": "09-17 12:22", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "adol", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "近期很多国家杰出青年东窗事发，他们的共同点是什么？", "excerpt": "共同点：同一批流水线的最高通关者、同一个高发领域、站在射程内的最高一层。我之前的论述已经非常详尽了。 先说这批人怎么炼成的。2018 年中科院分区事件时我梳理过科研评价体系三十年演进：年功序列太僵化，换 SCI 篇数；篇数被水论文玩坏，换影响因子；影响因子被定向爆破，换分区；分区玩不下去，换代表作；代表作有了自然有帽子。（ 原回答）每个指标五年内被聪明人刷爆，系统就加码——每一关都打赢的人，就是今", "url": "https://www.zhihu.com/question/2079585088560427857/answer/2083600952515416497", "votes": 123, "comments": 13, "feed_ts": 1789618494, "feed_time_str": "09-17 12:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么胡塞武装这么猛？", "excerpt": "求求你们了，挂个梯子吧，胡赛的官网又不是搜不到。 说来你可能不信，胡赛武装可能是中东各反抗武装中，理论水平最高的组织，其纲领中有着大量的左翼色彩，绝不是什么山沟沟里打出来的军阀。 胡赛武装曾经发过这么一片雄文《不，陛下，这是一场革命》 看这个标题，各位就知道这是引用法国大革命的名场面。 实际上这篇文章就是从法国大革命入题，从纳赛尔谈到马列，详细分析了也门革命的必要性，又从资产阶级，无产阶级谈到民族", "url": "https://www.zhihu.com/question/639175774/answer/1919100617508520535", "votes": 11541, "comments": 551, "feed_ts": 1789618373, "feed_time_str": "09-17 12:12", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "今天开始写朝鲜半岛，先写韩国，下一篇就准备写朝鲜。说起来，我一直的观点就是，中国是亚洲，尤其是东亚、东南亚、中南半岛，也包括中亚地区的真正能够作为支撑的核心。在接下来的气候动荡，灾难频发的时代里，能否与中国形成良好的贸易循环、物资循环，是决定了很多国家，他们是否能体面如现代国家一样存在的关键因素。", "excerpt": "今天开始写朝鲜半岛，先写韩国，下一篇就准备写朝鲜。说起来，我一直的观点就是，中国是亚洲，尤其是东亚、东南亚、中南半岛，也包括中亚地区的真正能够作为支撑的核心。在接下来的气候动荡，灾难频发的时代里，能否与中国形成良好的贸易循环、物资循环，是决定了很多国家，他们是否能体面如现代国家一样存在的关键因素。", "url": "https://www.zhihu.com/pin/2083890346581309068", "votes": 0, "comments": 1, "feed_ts": 1789618175, "feed_time_str": "09-17 12:09", "category": "pin", "cat_name": "想法动态"}, {"actor": "蒋竺波", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待预测市场Polymarket撤回了一个“2026年是否会发生核爆炸”的预测局？", "excerpt": "在刚知道Polymarket的时候我就想到了它可能被用作一个黑暗许愿机，可以通过反向下注的方式，去实现任何愿望。 例如我希望特朗普死的话，我只需要开个盘赌“2026年特朗普会不会死”，然后下注一百万赌他不会死，如果有人愿意收割我这一百万，就可以下注另一边，再刺杀特朗普，然后把我的一百万收割掉，这一百万就当酬劳了。反之如果特朗普没死成，那我这一百万还能保本捞回，甚至还能多赚点，理财保险了属于是。 本", "url": "https://www.zhihu.com/question/2012792346710943334/answer/2016563638144623487", "votes": 3201, "comments": 126, "feed_ts": 1789618174, "feed_time_str": "09-17 12:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "三摄氏度升温背景下的气候地缘推演·韩国篇：半岛南端的单点故障", "excerpt": "引言：一个没有后方的半岛国家 多家机构基于IPCC第六次评估报告及第七次评估周期前期信号所做的政策路径评估显示，按目前各国提交的自主贡献方案，本世纪末全球升温最佳估计约二点八摄氏度；即便考虑AR7可能剔除最高排放情景，在现有减排力度不足的惯性下，升温幅度仍可触及四点八摄氏度区间。我们在此前的推演中，选取变暖三摄氏度作为审视问题的基准。三摄氏度处于这个区间的中段偏保守位置，它不足以触发最极端的末日后", "url": "https://zhuanlan.zhihu.com/p/2083889786452979754", "votes": 8, "comments": 2, "feed_ts": 1789618067, "feed_time_str": "09-17 12:07", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "《平凡的世界》里孙少平宁肯下煤矿，也不回哥哥砖厂，图什么？", "excerpt": "那不叫下矿，那叫户口农转非，叫工人身份，自己从此独立。 哥哥的砖厂也没有编制，是农，是个体户小砖窑，自己仰人鼻息，一切属于哥哥。 煤矿是集体大矿，是工人身份，有编制，一切属于自己。 工人身份在那时候是很值钱的。 相当于编制。 ", "url": "https://www.zhihu.com/question/2078057001142298324/answer/2083889743067080092", "votes": 235, "comments": 9, "feed_ts": 1789618032, "feed_time_str": "09-17 12:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "国外流媒体为何不效仿Steam国区的运营模式，从而实现曲线入华？", "excerpt": "因为国外流媒体没有足够的统战价值。 Steam的统战价值在于，他是中国非手游游戏国内销售和出海的最重要的渠道。 电脑游戏销售，能赚钱，产生经济政绩，游戏出海又能传播文化，产生文化政绩。 既然政绩要依赖Steam来完成，那么Steam自然就有了统战价值。 国外流媒体平台，没有一家是中国影视剧出海的重要的渠道，更不要说国内销售了。这就没有统战价值啊。 要是有一家流媒体平台，能帮助中国影视剧国内推广和出", "       h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

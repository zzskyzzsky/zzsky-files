后计算排序相关，4B从0.244提高到0.384，12B从0.295到0.401，两组总体差异显著；27B从0.343到0.383但差异未显著，数学子集还从0.421降到0.390。相关性改善不等于逐轮评分准确，也不意味着所有模拟行为都更像真人。Qwen三轮RL估算计算量下降55.3%，清单满足率接近助手使用Qwen2.5-1.5B-Instruct，Gemma3-4B-LES模拟用户，每题生成8条最多三轮的候选轨迹。用内部评分替代14B外部评判后，RL估算FLOPs从5.48×10^19降到2.45×10^19，下降约55.3%。WildBenchV2清单满足率从41.08%±0.97到41.44%±0.63，差值仅0.36个百分点；它由Gemini逐项评判，不是真人满意率，±也是三次评测采样标准差。LES奖励仍需真实用户验收与全流程成本核算完整LES状态在12B消融中提高文本统计一致性，但批评行为F1低于仅训练评分字段，显示接话真实感与反馈存在取舍。提示式模拟器自行评分也能减少计算，节省主要来自取消单独评判。研究没有验证长对话、中文和线上用户效果；55.3%只对应这组RL估算计算量，不是耗时或费用降幅。选用前还需核算状态合成、模拟器训练和评测成本，并以独立任务检查及真人反馈验收。原文标题：Training User Simulators with Latent Intrinsic Feedback#无影寺 ", "excerpt": "给AI助手训练一个会打分的模拟用户，Google研究探索更省计算的强化学习\n图文版：链接LES把用户接话与助手评价放进同一次生成Google Research参与的研究让用户模拟器先生成潜在评价状态LES，再生成用户回复。状态包含内部想法、1到5分评分、指令完成程度、反应与反馈。训练时由Gemini3.1-Pro根据真实交互日志合成状态，再微调Gemma3基础模型；这些内容不是用户亲自提供的心理标", "url": "https://www.zhihu.com/pin/2098574964295201141", "votes": 0, "comments": 0, "feed_ts": 1793119344, "feed_time_str": "10-28 00:42", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "李鸿章东南互保已属谋逆，事后慈禧为何不凌迟中堂？", "excerpt": "任何权力游戏玩到最后都要问这个问题：“谁去执行呢？”", "url": "https://www.zhihu.com/question/15369175147/answer/1890716550627063390", "votes": 29033, "comments": 804, "feed_ts": 1793118901, "feed_time_str": "10-28 00:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "哈基米真的令我绷不住了。", "excerpt": "哈基米真的令我绷不住了。", "url": "https://www.zhihu.com/pin/2098572178484732246", "votes": 0, "comments": 0, "feed_ts": 1793118607, "feed_time_str": "10-28 00:30", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么很多法官，极其反感律师在法庭上“念法条”？", "excerpt": "因为法官感受到自己被冒犯。 并且，在官僚权力系统中，被冒犯的阈值很低。或许是你念法条耽误了时间，或许是你语气表情欠奉，或许是你称呼不对。 有一年，我在上海黄浦区法院出庭，看到法庭桌子上“审判员”三个字，顺口称呼“审判员同志”，被“审判员同志”喝止要求叫“法官”。 扪心自问，我在法学院给学生上课时，就不在意称呼，因为我们不在官僚权力系统。 有网友问，事后有没有投诉举报。 那真不至于，这说破天就是工作", "url": "https://www.zhihu.com/question/2095804135534752224/answer/2097376140646261167", "votes": 5549, "comments": 297, "feed_ts": 1793118592, "feed_time_str": "10-28 00:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "巴勒斯坦人都属于无辜的平民吗？", "excerpt": "当然不是。巴勒斯坦社会中当然有小偷、抢劫犯、强盗、强奸犯、诈骗犯、杀人犯、贪污犯。 但是一个现代社会的基本常识是，你应该论证你杀的人都有罪，而不是宣布“我杀了这些人，请反对的人找出来谁是无辜的”。 ", "url": "https://www.zhihu.com/question/1955828261297841635/answer/2098571932962656550", "votes": 14, "comments": 6, "feed_ts": 1793118538, "feed_time_str": "10-28 00:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有哪些瓦房店化的典型例子？", "excerpt": "蒙古人本身🤣自从低度数的马奶酒喝上高度数的蒸馏酒后从未有过出头之日🤣大汗都因为喝酒喝死了几个", "url": "https://www.zhihu.com/question/1922306731385521814/answer/2024347765136705533", "votes": 3192, "comments": 154, "feed_ts": 1793118537, "feed_time_str": "10-28 00:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价B站UP主弗曳哥foyege的“性转马尔福”AI短片在内外网同步破圈爆火？", "excerpt": "因为信息密度够。 弗总用极度细腻的微表情调教，适度的留白，极佳的美学品味，以及很关键的一点，寄生于一部曾经全球流行，而且作者笔触细腻，人设与世界观极度丰富的作品哈利波特系列。 而且给马尔芙这个角色转女性化，刚好弥补了原作最大的缺陷，极大提升了戏剧张力。 这个事情爆火，给AI影视剧产业链的发展方向带来了很多思考。 我之前有个回答讲过，AI影视剧没有能做到原创一个仿真人角色来和大量观众产生非常紧密的情", "url": "https://www.zhihu.com/question/2098458569133777980/answer/2098570292415221781", "votes": 79, "comments": 4, "feed_ts": 1793118147, "feed_time_str": "10-28 00:22", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "新能源车渗透率攀升至 67%创历史新高，燃油车为何加速萎缩？", "excerpt": "我家店铺房东是一个很实在的60多岁老登，思想非常反动，但跟我们很聊得来 之前我们说新能源好，他可以气势汹汹站在他的本田面前给我们讲解发动机、底盘、轮毂还有其他很多专业术语，我也听不懂，总之结论就是中国的汽车还嫩得很，根本就不成熟，完全是靠营销做起来 后来看我坚持要买新能源，马上血压上来了，要骂人，说什么不安全，我们都被洗脑了，就喜欢这些花里胡哨的 去年年底他要换车，把油车和新能源全部体验了一遍，最", "url": "https://www.zhihu.com/question/2094934531933468296/answer/2095858129200330720", "votes": 292, "comments": 53, "feed_ts": 1793118043, "feed_time_str": "10-28 00:20", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "GPT-6.1 Terra来了GPT-6.1 Terra 把看屏幕、跨应用操作的标准 API 价格降到了 GPT-5.6 Terra 和 GPT-6.1 Sol 的一半。OpenAI 的计算机操作测试也给出了任务成本下降的证据：中等推理强度下，相比上一代，得分高 15 个百分点，成本约为三分之一。不过，输入很长时，账单要换一套费率。1 美元是输入单价，272K 是加价分界基础标准价按每百万 token 计：输入 1 美元、缓存读取 0.05 美元、输出 5 美元。缓存写入另计，不能把缓存读取价用于所有缓存操作。单次请求的输入超过 272K token 时，整次请求的输入与缓存费率乘 2，输出费率乘 1.5。按每百万 token 换算，这时普通输入是 2 美元，输出是 7.5 美元；加价覆盖整次请求，并非只计算超过阈值的部分。因此，处理发票、表单这类批量任务，要分别算输入、输出和缓存费用，再核对单次输入长度。“每百万 token”是计价单位，不表示任何输入长度都享受基础费率。工具调用费，以及失败重试和人工接管的成本，也要计入总账。任务成本约降到三分之一，限于 ALE 测试Agents’ Last Exam（ALE）评估 agent 使用软件完成工作的能力，例如把建筑图纸转成 3D 模型，或逐镜头检查动画、生成带时间码的记录。它比只看 token 单价更接近“完成一件工作要花多少钱”这个问题。在 OpenAI 公布的结果中，中等推理强度的 Terra 比 GPT-5.6 Terra 高 15 个百分点，成本约为后者的三分之一。公告还称其表现可与 GPT-6 Astra 相比，而每个 token 的价格约为 Astra 的十分之一。这里有两种账：API 单价是每个 token 怎么收费，任务成本还取决于完成任务用了多少 token。ALE 的结果支持 Terra 在这组软件任务上的价效改进，不能据此承诺业务总账降到三分之一。换模型前，用同一批实际任务比较完成率和总费用，才知道是否省钱。批量操作可先评估 Terra，复杂编程仍看 Sol 和 Astra计算机操作是这次发布最适合优先评估的场景，OpenAI 举的应用是读取发票、把明细录入会计软件。编程也有提升：Terminal-Bench 4.0 测试 agent 通过命令行解决问题，最高推理强度的 Terra 解决了 50.3% 的任务，GPT-5.6 Terra 已公布的成绩为 21.5%。OpenAI 仍将最复杂的编程任务推荐给 GPT-6.1 Sol 和 GPT-6 Astra。", "excerpt": "GPT-6.1 Terra来了GPT-6.1 Terra 把看屏幕、跨应用操作的标准 API 价格降到了 GPT-5.6 Terra 和 GPT-6.1 Sol 的一半。OpenAI 的计算机操作测试也给出了任务成本下降的证据：中等推理强度下，相比上一代，得分高 15 个百分点，成本约为三分之一。不过，输入很长时，账单要换一套费率。1 美元是输入单价，272K 是加价分界基础标准价按每百万 tok", "url": "https://www.zhihu.com/pin/2098569138180568176", "votes": 0, "comments": 0, "feed_ts": 1793117903, "feed_time_str": "10-28 00:18", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "卢拉赢得连任，当选巴西新一任总统，怎样看待这一结果？", "excerpt": "知己一声你好回到这都市，拒绝伟大同志搞搞新意思", "url": "https://www.zhihu.com/question/2097866687190143130/answer/2098186277900248717", "votes": 126, "comments":  · 其他"}, {"actor": "进击的沈帅波", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Vol.140 当物理 AI 股暴涨，我们离能和现实世界交互的 AI 还有多远？| 对话西湖数智创始人于开丞不管是学术界还是产业圈，很多人把世界模型称作下一代AI看懂真实物理世界的底层能力。像杨立昆、李飞飞这些大佬，走出了完全不一样的技术路子。但话说回来，世界模型到底是真的技术革命，还是又一个炒出来的概念？它到底会怎么改变自动驾驶？除了开车这件事，它还能干什么？今天我们请到的嘉宾，就是国内世界模型赛道上最早的实践者，他就是西湖数智创始人兼CEO，于开丞老师。翻看于老师的履历真的是别人家的孩子，本科毕业于香港大学计算机，博士在瑞士洛桑联邦理工读完，曾经在阿里达摩院、英特尔实验室任职，手握5项自动驾驶和大模型相关的国家发明专利。一边在西湖大学做前沿学术研究，一边带队做产业落地，理论功底和实战工程经验都非常足。这期节目，我们会聊聊世界模型的差别，同时也不只局限自动驾驶，看看世界模型还能在哪些地方发挥价值和落地现实难题，也会聊聊国内世界模型赛道的机会和短板，以及这项技术长远会怎么影响整个AI行业。02:40 大白话科普，到底啥是世界模型 ？08:18 避坑指南，A 股一堆物理 AI 概念股涨停，点开一看完全不搭边！14:24  语言模型只会在屏幕里面聊天，得让 AI 真正去现实世界干活19:32  大语言模型会不会把世界模型干没？24:17 物理 AI 会重演大模型烧钱军备竞赛吗？ 26:52 死磕技术还是疯狂融资？两手都得抓！27:25 两大技术门派：显示派 VS 隐式派，赛道不一样，两条路线都能活 |35:35 AI 疯狂生产，但市场已经产能过剩怎么办？41:08 物理 AI 绝对不能裸奔，没有任何物理 AI 完全靠模型跑！必须有硬规则兜底保险，特斯拉也不例外。50:04 互联网思维搞物理 AI 好使吗？51:15 世界模型四大模块：环境重建、智能体行为建模、未来状态推演、递归自进化。54:45 现在 AI 记忆力爆炸，但没有人类的共情、追问、感知世界的能力。56:48  现在不少人形机器人 = 录好动作的遥控器，缺物理 AI 底座。58:52 目前最大挑战 | ①技术闯入无人区，没有前车之鉴，只能摸黑迭代②商业化闯关，跑通真实落地闭环，实现在陌生现实环境自我进化，全世界都没人完整做成 59:43 物理 AI 很特殊，科研和商业深度绑定，技术突破直接变现。现阶段双重身份重合，未来会引入专业商业人才，自己专注技术，团队配有商业化老手01:03:25 圈内到处是项目暴富、被收购的神话。跑得快不等于跑得远，坦然接受行业起伏【名词解释】世界模型：一种能够对显示世界环境进行仿真，并基于文本、图像、视频和运动等输入数据来生成视频、预测未来状态的生成式AI模型。RSI:Recursive Self-Improvement（递归自进化），当AI开始改进制造AI的方法，改进成果又让后续AI更擅长继续研发AI ，由此形成能力可以向下一轮传递的反馈过程。隐空间：机器学习中数据的压缩、抽象表示，它保留并简化了原始高维数据中能反映其底层结构的关键特征。其核心作用在于以高效、有意义的方式表达复杂数据。在小宇宙查看该单集文稿 Vol.140 当物理 AI 股暴涨，我们离能和现实世界交互的 AI 还有多远？| 对话西湖数智创始人于开丞", "excerpt": "Vol.140 当物理 AI 股暴涨，我们离能和现实世界交互的 AI 还有多远？| 对话西湖数智创始人于开丞不管是学术界还是产业圈，很多人把世界模型称作下一代AI看懂真实物理世界的底层能力。像杨立昆、李飞飞这些大佬，走出了完全不一样的技术路子。但话说回来，世界模型到底是真的技术革命，还是又一个炒出来的概念？它到底会怎么改变自动驾驶？除了开车这件事，它还能干什么？今天我们请到的嘉宾，就是国内世界模型", "url": "https://www.zhihu.com/pin/2098477993664499924", "votes": 0, "comments": 0, "feed_ts": 1793096141, "feed_time_str": "10-27 18:15", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "法国发生近年来最严重暴力骚乱，约1200人被捕、超150名警察受伤，情况如何？为何此时矛盾进一步激化？", "excerpt": 纪拥有两万英镑是什么概念?", "excerpt": "在具体回答这个问题前，我先分享一下英格兰银行官网搞的一个不同年代的英镑换算器，专门解答“现在一英镑搁以前是多少钱”。可选的年份上限为1209年，即南宋嘉定二年，下限为上个月。 https://www.bankofengland.co.uk/monetary-policy/inflation/inflation-calculator你选好年份和数额后可以直接看到xx年的英镑在yy年值多少钱。比如18", "url": "https://www.zhihu.com/question/587100310/answer/2098269610441286195", "votes": 251, "comments": 20, "feed_ts": 1793086291, "feed_time_str": "10-27 15:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "董明珠应该向张瑞敏、何享健好好学习如何“放手”", "excerpt": "导语：海尔集团创始人张瑞敏与美的集团创始人何享健，一个在山东青岛，一个在广东顺德，他们的共同点不是比董明珠更勤奋，而是比她更早想清楚了一件事，最佳的企业管理方式是“放手”，而非“控制”。 砺石/作者 砺石商业评论/出品 1前不久，珠海市格力技工学校迎来开学第一课，董明珠以校长身份走上讲台。据多家媒体报道，她讲了三件“小事”。 第一件，她在校园超市看到一个橘子卖一块五，“那宰我们学生？这种超市是不允", "url": "https://zhuanlan.zhihu.com/p/2098429744115196668", "votes": 0, "comments": 0, "feed_ts": 1793085007, "feed_time_str": "10-27 15:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待2026年10月24日加拿大卑诗省（BC省）提前省选的结果？", "excerpt": "一句话，保守党秋风扫落叶。千古逗比Eby提前解散挖个坑自己往里跳的举措早有预兆，所有人提前看他笑话、判断保守党必然取得省政权，不过大胜程度出乎预计；一周前民调预计席位52-54、出口民调55-56，最后居然拿了63席、超三分之二。 全省一片蓝。BCNDP只守住了白人多的温哥华港区、海岸原住民区（无论哪个省选原住民总能被NDP拿下，联邦选秒变成自由党）。 BCNDP的疲软是全方位的。一个最明显例子：", "url": "https://www.zhihu.com/question/2097649504216412964/answer/2098430966993835769", "votes": 166, "comments": 34, "feed_ts": 1793084930, "feed_time_str": "10-27 15:08", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "正解局", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "地铁建设踩刹车，中国城市基建的逻辑变了", "excerpt": "曾几何时，一座城市有没有地铁，是这个城市发达与否的标志；地铁线路的长短，则代表了城市规模、财力与人口的聚集程度。 毕竟，在上世纪七八十年代，中国只有北京、香港和天津这3个城市拥有地铁，直到2000年也才增加了上海、台北和广州。 这几座城市单拎出哪一个都是在国内甚至亚洲实力拔群的大都市。 这种效应让地铁从公共交通形式“变身”为城市是否跻身一线的标志。 新世纪的20多年时间里，国内43个城市扎堆开通了", "url": "https://zhuanlan.zhihu.com/p/2098425904443680131", "votes": 4, "comments": 0, "feed_ts": 1793084169, "feed_time_str": "10-27 14:56", "category": "other", "cat const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

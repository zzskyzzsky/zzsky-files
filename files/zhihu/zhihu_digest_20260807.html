再到出生产文件的全部流程。不是上来就教你绘制PCB，那样可能很多小伙伴都不知道在干什么。不管是选电子元件、搭电路，还是建PCB工程、摆元件、连线路，还有最后整理生产用的Gerber文件，每个关键步骤都讲到，还会教你怎么用工程化的思路做设计，既补基础，又能直接动手操作，真正做到学完就能自己做。", "excerpt": "第16课 设计规则-线宽规则及优先级设置本视频由凡亿教育原创，由官方授权在我这首发！为什么要上架一个这样的视频呢？首先这是一套完全免费的课程，看完这个课程就能做出电路板的那种。其次很多小伙伴私信我这有没有课程，我这太忙了几乎没时间做课程，现在凡亿教育刚好录制完一套课程说有机会在我这首发，我大致看了看他们的视频，非常不错！而且完全免费！我觉得对于需要这类课程的小伙伴非常有帮助。最主要的是门课不搞那些", "url": "https://www.zhihu.com/pin/2068862207664846810", "votes": 0, "comments": 0, "feed_ts": 1786035188, "feed_time_str": "08-07 00:53", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "agent 失败该改模型还是 Harness？\n图文版：链接Scale AI交互边分类法：同样表象的两种修复路径一个 agent 任务失败，现象完全一致，复现时却可能指向截然不同的修复对象。比如 agent 报告某个工具调用成功，实际却失败了——若工具的 wrapper 吞掉了错误信息，模型根本没收到报错，故障在工具集成层；若 wrapper 如实返回了错误，模型却选择忽略，故障就在模型侧。Scale AI 新提出一套以交互为中心的故障分类法，把这类“分不清锅该谁来背”的困境，一一落实到两个组件之间的交互边上，并指明具体是哪一端出了问题。框架将 agent 系统拆解为模型、用户、评估器、第三方以及 Harness（管理上下文、memory 与工具访问）和环境等组件，以模型为轴心画出放射状交互图，每次失败都落在一条具体的交互边上。41种失败模式，36种指向模型，回溯最早未恢复的根因分类法最终定义了 41 种失败模式，分布在以模型为根、四个组件家族为分支的树状层级中，每条标签都写成“组件A—组件B·故障侧”的格式。在 41 个角色专属失败模式里，36 个归给模型，5 个归给周边组件。定位规则不是贴给任意一个下游症状，而是从系统级失败出发，沿因果链向前回溯，找到执行未能恢复的最早失败点，这个点才是根因——干预若能作用在此，结局就可能改变。这使得诊断能直接对应到三种修复方向：故障在模型侧，需要后训练或改进恢复策略；故障在框架侧，指向工程修改；故障在环境或评测设置上，则仅优化模型于事无补。四方裁判独立推理，与人工标注一致性 κ 达 0.76为了验证分类标签捕捉的是可复现的结构，而非单一标注者的直觉，研究团队用四个前沿模型作为独立裁判，给它们相同的分类定义和原始轨迹，但不给人工标签，要求其自行推导交互边、故障侧和具体失败模式。在交互边加故障侧的层面上，最强裁判与人工标注的 Cohen’s κ 达到 0.76，各裁判之间最高两两一致性达到 0.84。团队还尝试了选择性投票：当四个裁判全票一致时，类别精确率可提升到 0.96，但覆盖率降至 68%；至少三人同意时，精确率 0.83，覆盖 90%。不一致的来源主要是轨迹材料质量不一，以及缺少完整因果路径时根因回溯本身的难度。归因高期待留下的硬边界，以及读者能带走的判断多数失败模式被归到模型侧，部分原因是归因规则设了一个很强的预期：只要一个更有能力的模型在相同条件下本可以预防或恢复该失败，故障就划给模型。因此，那些被明确标为工具、环境或 Harness 故障的模式，才是单靠模型迭代无法解决的硬边界。对正在推进 agent 工程化的团队来说，这张以交互为网格的归因地图虽然还不能自动修复错误，但它让每次故障都有了可复查的位置，帮助从业者不再把“智能体崩了”笼统归咎于模型，而是精确落到该修的地方。原文标题：Model or Harness? An Interaction-Centric Taxonomy for Localizing Agent Failures#无影寺 ", "excerpt": "agent 失败该改模型还是 Harness？\n图文版：链接Scale AI交互边分类法：同样表象的两种修复路径一个 agent 任务失败，现象完全一致，复现时却可能指向截然不同的修复对象。比如 agent 报告某个工具调用成功，实际却失败了——若工具的 wrapper 吞掉了错误信息，模型根本没收到报错，故障在工具集成层；若 wrapper 如实返回了错误，模型却选择忽略，故障就在模型侧。Sca", "url": "https://www.zhihu.com/pin/2068861116046906988", "votes": 0, "comments": 0, "feed_ts": 1786035031, "feed_time_str": "08-07 00:50", "category": "pin", "cat_name": "想法动态"}, {"actor": "冷哲", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "真的想不明白，黄毛到底有什么魅力？", "excerpt": "抖音上很火的一个黄毛，颠覆了很多人对黄毛的认知！ 起因是一博主的车被一群精神小伙拦住了，沟通了之后，博主请语文最好的黄毛给写篇作文，题目随机抽，黄毛抽中的是《我的妈妈》 作文省流版如下，侵删： 妈妈，你有八九年没有回来看过我和弟弟，我拼凑不出关于你的记忆了。 我当初拼命的想找出你不舍的痕迹，或者一个简单的告别，可你走的太干脆了，什么都没有留下。 同学笑话我没有妈妈，但没等他说出第二句，我的拳头就已", "url": "https://www.zhihu.com/question/1895759766036391517/answer/2067960911713850754", "votes": 1675, "comments": 386, "feed_ts": 1786034956, "feed_time_str": "08-07 00:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "金融深度研究怎么测？\n图文版：链接金融报告AI得分难以过40%的根源：从历史到未来的推理断层金融领域的深度研究报告，需要依据历史财报、竞争格局和经济走向，对未来事件做出可验证的判断。通用的AI深度研究系统缺乏专门的金融分析工具，很难在复杂推理中抓住关键信息。更棘手的是，现有评测大多只考已知事实，而专业金融报告必然涉及前瞻性推理——如果不对检索信息做时间点控制，AI就等于提前翻看了标准答案。这套基准测试用400道经专家验证的研究题目和一套“时间锁”机制，彻底改变了考核规则：所有被测系统得分均低于40%，即使最强的组合也只拿到34.1%。FinanceGym用时间锁和双层评分杜绝信息泄露，构建无法作弊的考场FinanceGym构建了一个按时间点控制访问的搜索沙盒，从超过1亿篇公开网页文章中抽取了437万条实体关系，形成金融实体图并从中挖掘出三类研究情境。每道题都配对一个明确截止日期，agent只能检索该日期之前的文档。打分时采用双层标准：截止日前评分项检查报告能否从历史公开信息中捕捉可查证的事实证据，截止日后评分项检验只有将来才可验证的预测结果。题目生成后经过多层过滤，由外部专家标注，最终形成平衡覆盖9个主题、9个板块、6种推理类型的400道题，专家验证通过率82%。FinanceHarness在这个沙盒上暴露出分层金融工具接口：基础层负责时间点检索、原文读取和引用撰写，辅助层提供结构化数据查询、估值、可比分析、风险评估和情境推理，运行时层调度agent循环。17个系统加入评测后，同模型加分层工作流可将总分从25.3%提到32.4%评测覆盖三类17个系统。闭源模型中Claude-Opus-4.7综合得分最高，为34.1%，但截止日后得分仅12.0%。搭载搜索工具的开源模型里，FinanceHarness以32.4%领先，其截止日前得分为45.7%，截止日后得分11.8%。关键的消融实验显示，以同一个开源底座Qwen3.6-27B为例，仅配搜索工具的“裸模型”总分仅25.3%，套用完整FinanceHarness后升至32.4%，截止日前得分从36.1%提升至45.7%，截止日后得分从8.7%提升至11.8%。所有系统的截止日后得分都被压缩在约12%以内，表现出稳定的证据检索能力与前瞻性推理之间的巨大落差。实用限制明确：框架不用于交易，预测瓶颈被量化为约12%上限FinanceHarness的定位是分析师风格的研究与报告生成，不涉及交易决策。语料来自自行收集的2025年英文网页，对非英语来源和付费专业数据的覆盖有限，直接迁移到真实业务场景仍有距离。结果中最重要的信号是，提升检索质量可以拉高截止日前得分，但截止日后推理得分始终被限制在12%以内，即便经过强化微调也未见显著增长。这说明金融深度研究的真正短板不在信息获取，而在于将历史证据转化为可验证的未来判断。对从业者而言，短期务实的路径应更侧重于金融专用工具链和约束性工作流的工程完善，而非单纯押注更强的模型。原文标题：FinanceHarness: Autonomous Financial Deep Research Framework#无影寺 ", "excerpt": "金融深度研究怎么测？\n图文版：链接金融报告AI得分难以过40%的根源：从历史到未来的推理断层金融领域的深度研究报告，需要依据历史财报、竞争格局和经济走向，对未来事件做出可验证的判断。通用的AI深度研究系统缺乏专门的金融分析工具，很难在复杂推理中抓住关键信息。更棘手的是，现有评测大多只考已知事实，而专业金融报告必然涉及前瞻性推理——如果不对检索信息做时间点控制，AI就等于提前翻看了标准答案。这套基准", "url": "https://www.zhihu.com/pin/2068860461207008998", "votes": 0, "comments": 0, "feed_ts": 1786034908, "feed_time_str": "08-07 00:48", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Meta的muse code 的 beta 版现已上线让 coding agent 做跨仓库的大任务，最容易断在两处：任务没做完，上下文已经丢了；拆给多个 agent 后，又担心它们改到同一份代码。Meta的 beta 版 Muse Code，重点放在把这两件事变成可管理的执行流程。后台 agent 留住会话上下文Muse Code 的专用后台 agent 会在整个会话期间保持运行，任务并非每次都从零开始。官方给出的定位是：它可在大型仓库里规划改动、写代码，再验证结果。底层模型是面向编码更新的 Muse Spark 1.2。大任务分到隔离 worktree任务足够大时，Muse Code 会把工作分给并行的子 agent，并放进隔离 worktree。官方称用户正在使用的工作副本不会被触碰；内部测试里，它曾同时给一个游戏实现 6 个功能，没有发生冲突。这里解决的是并行改代码时最麻烦的文件互相覆盖问题。本地事件日志负责断点续跑每次模型调用、工具运行和编辑都会在执行前写入本地事件日志。任务中途崩溃后，系统按日志从中断处继续，而不是要求用户重新描述任务。这对多步骤、等待时间长的工作尤其关键：上下文和操作记录都能被回收。24 小时内核优化只是能力样例Muse Code还展示了一个 NVIDIA Hopper 内核优化任务：Muse Spark 1.2 运行超过 24 小时，进行了 1,000 多次工具调用，初始探索后仍持续发现改进。它说明这套执行方式瞄准的是长时间迭代，不等于所有编程任务都会得到同样的收益。Muse Code 目前仍是 beta。对经常把复杂改动交给 coding agent 的人，真正值得观察的是后台上下文、隔离 worktree 和可恢复日志能否稳定配合；这三项决定了 agent 能不能从“写一段代码”走到“持续完成一项工程任务”。", "excerpt": "Meta的muse code 的 beta 版现已上线让 coding agent 做跨仓库的大任务，最容易断在两处：任务没做完，上下文已经丢了；拆给多个 agent 后，又担心它们改到同一份代码。Meta的 beta 版 Muse Code，重点放在把这两件事变成可管理的执行流程。后台 agent 留住会话上下文Muse Code 的专用后台 agent 会在整个会话期间保持运行，任务并非每次都", "url": "https://www.zhihu.com/pin/2068860084453635589", "votes": 0, "comments": 0, "feed_ts": 1786034702, "feed_time_str": "08-07 00:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "第14课 网络Class的介绍及设置本视频由凡亿教育原创，由官方授权在我这首发！为什么要上架 涨近4%，这场翻身仗，完全和美元贬值有关。每天看我文章的人，应该非常清楚发生了什么。 今天各大媒体开始讲，美元走弱，黄金走强。但上周他们通通在聚焦美联储9对3投票7月不加息。 当天我就指出，投票结果根本不是重点，重点是沃什新闻发布会说错话了，美元可能会开启贬值！ 美联储今年连续第五次维持利率不变，但投票结果从一致通过变成9票对3票，内部发生了", "url": "https://www.zhihu.com/question/2068465234843530940/answer/2068712591854195330", "votes": 308, "comments": 45, "feed_ts": 1785999517, "feed_time_str": "08-06 14:58", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "1931年以后，哪种步枪更适合中国大规模装备。?", "excerpt": "听我的。 1942年初，随便找个厂，哪怕是西格绍尔wcnm。用废机枪管加大栓、两脚架和制退器，做百来支.50手拉栓。连同十几万发.50BMG，用鹦鹉螺号潜艇送到海阳南部沿海滩头（提前无线电联络）。 包准几个月后华北华东战场就鸡飞狗跳，实现攻占碉堡-&gt;缴获武器-&gt;继续攻占碉堡的正循环。 华北华东战区局势有望在1943年就基本定局。主要问题不是枪，是宋美龄。 ", "url": "https://www.zhihu.com/question/1996554105850705255/answer/2068425414830207106", "votes": 199, "comments": 20, "feed_ts": 1785998466, "feed_time_str": "08-06 14:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "网传南航一航班提供饮料为西梅汁，致乘客大排长队上厕所，是真的吗？如何评价这一事件？", "excerpt": "目前看起来就一张图，没有啥实锤证据。 要知道西梅汁号称青春版泻药，有些西梅汁更是可以把青春版去掉，毕竟315直接曝光很多西梅汁里直接加泻药。 如果这是真的，那这些人应该根本撑不到排队上厕所。 丝滑到德芙看了都得练，华莱士笔记做一年。 堪称史诗级航班。 ", "url": "https://www.zhihu.com/question/2068358710498254999/answer/2068701805261992661", "votes": 217, "comments": 4, "feed_ts": 1785996945, "feed_time_str": "08-06 14:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "陈天奇", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "在 Blackwell 上拆解 FlashAttention 4：Modern GPU Programming for MLSys 中文版 Part IV 上线", "excerpt": "经过一个多月的时间，教程的所有中文版全部上线！可喜可贺可喜可贺。（效率还是很高的） FA4这一章原来其实写的也不太好，非常乱，我翻译中文版本的时候也相当于费大劲把这一章重新写了一遍。 完整的kernel链接在下方，教程中引用的代码也全是这个: https://http://github.com/mlc-ai/tirx-kernels/blob/main/tirx_kernels/attention", "url": "https://zhuanlan.zhihu.com/p/2068355332049522938", "votes": 38, "comments": 4, "feed_ts": 1785996795, "feed_time_str": "08-06 14:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "申宏宇", "verb const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

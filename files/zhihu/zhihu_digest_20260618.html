OTEUP_ANSWER", "verb_cn": "赞了回答", "title": "诺贝尔奖为什么很少颁给穆斯林，共产党员，和黑人？", "excerpt": "穆斯林背景诺贝尔奖完整获奖者名单（纯文字，按奖项分类） 一、诺贝尔和平奖（10 位） 安瓦尔・萨达特（埃及），1978 年，首位穆斯林诺奖得主，因签署戴维营和平协议获奖亚西尔・阿拉法特（巴勒斯坦），1994 年，推动巴以奥斯陆和平协定希林・伊巴迪（伊朗），2003 年，首位穆斯林女性诺奖，捍卫妇女儿童人权穆罕默德・巴拉迪（埃及），2005 年，国际原子能机构负责人，推进全球核不扩散穆罕默德・尤努斯", "url": "https://www.zhihu.com/question/2048461604908487786/answer/2050494409209280396", "votes": 142, "comments": 8, "feed_ts": 1781716615, "feed_time_str": "06-18 01:16", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Fable被禁用后，追赶窗口关了？&#34;翅膀被撕掉了。&#34;——Andrew Curran 在长文里这样形容 Fable 模型被禁用后的用户反应。Andrew Curran是一个长期写 AI 测评的博主，粉丝约 5.75 万。他这篇长文不是在简单感叹一个产品下架，而是在提出一个很激进的判断：AI 竞赛里留给后来者的窗口期，可能已经关闭。他给出的时间窗口是：2023 年 2 月到 2026 年 2 月，总共三年。这个判断不是凭空来的。他引用了 Anthropic 在 2023 年 Series C 融资时一份泄露的 pitch deck，里面有一句预测：&#34;我们相信，训练出最好的 2025/26 年模型的公司，将在后续周期中把其他人远远甩开，再也追不上。&#34;他认为，这件事正在发生。Fable 为什么特殊？他说得很直接：不是跑分高，而是&#34;模型心智的形状&#34;不同——对用户意图的感知深度、迭代思考的能力、一种&#34;活着&#34;的感觉。他说用 Fable 让他觉得回到了 2023 年初次接触前沿模型时的震撼。而 Fable 背后的 Mythos，按他的判断，是今年 2 月从训练中出来的，这个模型加速了 Anthropic 内部的开发节奏——前沿模型开始帮助生产下一代前沿模型。他花了很大篇幅讲&#34;为什么追赶越来越难&#34;，归结为三层锁死：· 模型层：领先模型帮助训练下一代模型，形成自我迭代的加速循环· 算力层：最先进的芯片正在变成战略资源，他的原话是&#34;像铀一样被监控、许可、追踪、守卫&#34;· 监管层：当开源模型接近前沿能力时，他预测将面临全球性的监管收紧他举了欧洲作为反例：有资源、有人才、有时间，却把窗口期花在了建法规壁垒上，等到意识到需要建自己的模型时，船已经开走了。而 Elon Musk 用 26 个月勉强接近了前沿——他是少数在窗口期内认真尝试的人之一。需要明确的是，这些都是 Andrew Curran 个人的判断和预测，不是已经被验证的事实结论。他自己也承认&#34;竞赛没有结束&#34;，其他大型实验室会训练出同样强大的模型，有些可能已经在做了。但他的核心论点是：前沿模型自我迭代的门槛一旦被跨过，后来者需要追赶的不再只是一个模型，而是一个加速中的系统。他在文末写了一句话，我觉得值得拿出来单独看：&#34;如果你还不是建设者，从现在起你只会是旁观者。&#34;这话是不是太绝对？很可能。但如果你正在做和 AI 相关的职业规划、创业方向或学习路径，&#34;还有大把时间慢慢看&#34;这个假设，至少值得重新审视一下。", "excerpt": "Fable被禁用后，追赶窗口关了？&#34;翅膀被撕掉了。&#34;——Andrew Curran 在长文里这样形容 Fable 模型被禁用后的用户反应。Andrew Curran是一个长期写 AI 测评的博主，粉丝约 5.75 万。他这篇长文不是在简单感叹一个产品下架，而是在提出一个很激进的判断：AI 竞赛里留给后来者的窗口期，可能已经关闭。他给出的时间窗口是：2023 年 2 月到 2026 ", "url": "https://www.zhihu.com/pin/2050748592818803213", "votes": 0, "comments": 1, "feed_ts": 1781716582, "feed_time_str": "06-18 01:16", "category": "pin", "cat_name": "想法动态"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "女婿永远成不了儿子，是不是？", "excerpt": "我是女婿，我老婆是独生子女，成不了的！首先我结婚已经十几年了，老丈人已经住院2次了，基本都是我照顾，我们这都是独生子女政策，基本一家一个，我的观点我丈人的东西都是我老婆，和我无关的理念，刚开始还挺好的，后来我老丈人就拆迁的事情（在住院前）把我骂的狗血淋头，我也没还口。（我老婆也支持我，老丈人家拆迁我不可能拿主意和瞎参与的，但是正好有个实在亲戚就在我老婆镇上做副镇长（镇临时拆迁办主任），又是那几年…", "url": "https://www.zhihu.com/question/625637422/answer/88482630740", "votes": 2306, "comments": 710, "feed_ts": 1781714800, "feed_time_str": "06-18 00:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "持续低熵", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "朝九晚五，被设计好的系统，躺平", "excerpt": "在美国，“朝九晚五”是个骂人的词汇。 我本想写朝九晚五的编年史，但那太长，面面俱到等于蜻蜓点水，什么都过一遍，到最后又回归到【中国人连朝九晚五都做不到，所以中国人很惨】这种情绪化叙事，已经太多人写，我说点别的。 我在抖音见过一个文案，【到底是一年过了365天，还是一天重复了365遍】。 中国人能发出这种抱怨，我看要喊万岁，因为它揭示了朝九晚五制度最邪恶的地方：时间被切割，景观社会代替真实生活。 先", "url": "https://zhuanlan.zhihu.com/p/2034766831655891261", "votes": 115, "comments": 10, "feed_ts": 1781714266, "feed_time_str": "06-18 00:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "为什么日本近段时间越来越极端？当前日本已近去工业化临界点，惶恐不已。这碗百草枯，是美中给小生活灌下去的。《广场协议》后日元升值，小生活以为走向星辰大海，玩金融多爽，企业纷纷钻进股市债市。索尼等大企业也转型娱乐、金融，但工业呢？如今老美破坏全球工业链，小生活岛上啥都缺，自己做不了产业链，与中国联手又得先跪下认错，办不了。于是高市上台，体现国民集体意愿：工业烂了无所谓，不如全力军事化，赌那百分之几的治愈几率，万一能再抢中国呢？这叫求生欲，极端就对了。为什么日本近段时间越来越极端？ #日本工业 #日本资本 #日本上流社会 ", "excerpt": "为什么日本近段时间越来越极端？当前日本已近去工业化临界点，惶恐不已。这碗百草枯，是美中给小生活灌下去的。《广场协议》后日元升值，小生活以为走向星辰大海，玩金融多爽，企业纷纷钻进股市债市。索尼等大企业也转型娱乐、金融，但工业呢？如今老美破坏全球工业链，小生活岛上啥都缺，自己做不了产业链，与中国联手又得先跪下认错，办不了。于是高市上台，体现国民集体意愿：工业烂了无所谓，不如全力军事化，赌那百分之几的治", "url": "https://www.zhihu.com/pin/2050738604427702907", "votes": 0, "comments": 0, "feed_ts": 1781714186, "feed_time_str": "06-18 00:36", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么日本近段时间越来越极端？", "excerpt": "因为当前日本已经到了即将去工业化的临界点，内心深处惶恐不已。 用一个比较形象的比喻，那就是喝百草枯。 喝下百草枯，分为三个阶段。 第一个阶段，整个口腔、食道、胃都会被百草枯腐蚀，剧烈疼痛，喉咙像被火烧，胃像被刀割，疯狂呕吐。 第二个阶段，器官开始衰竭，这个时候，往往已经入院，医院方出于人道主义精神，会拼命进行挽救，想方设法缓解器官衰竭的过程，上各种手段，有时候能暂时控制住，甚至病人会出现幻觉，感觉", "url": "https://www.zhihu.com/question/2048664802009126346/answer/2050738390803522599", "votes": 309, "comments": 18, "feed_ts": 1781714134, "feed_time_str": "06-18 00:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "手刀", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美国近39万亿债务与各州政府有关吗？各州是不是还各有债务？", "excerpt": "美国州和市都有自己的债务。大一点的州、市如ca、nyc，账本仔细翻，其实都是一屁股债。这还是有联邦补贴、账目美化后的。 是的，你没看错。民主国家也美化账本。只不过人家一般不编数据。就会计处理上玩花活，推迟些提早些错峰出行，然后报现金流，不报结构性应付款这类的（比如公务员退休金啥的）。 事实上账本真的干净的，几乎没有。哪怕是小政府德州，州政府干净的要命，但是底下的市政府也在疯狂举债。每次大家提小政府", "url": "https://www.zhihu.com/question/2041839449160554419/answer/2050737046122140962", "votes": 0, "comments": 0, "feed_ts": 1781713813, "feed_time_str": "06-18 00:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "小米高管称数字抽真空会成为趋势，格力称空调不行抽多久真空也白扯，如何看待双方观点？双方到底在争什么？", "excerpt": "这不是小米整出来的活，这甚至不是小米定的规则，这只是国家的相关要求。 小米甚至啥都没干，就是指望大家按照相关的规定执行就行，结果蹦出茫茫多的人说小米不近人情。 所以这代表着，在这之前，整个行业全都是看安装师傅的心情，标准没有被执行么？ 现在小米只是要求大家按照标准执行，就开始一堆人急得不行？ 先别急啊。 我作为消费者我掏钱的，球球大家让我先急行不行。 空调行业可不是什么新行业，算是传统家电行业了，", "url": "https://www.zhihu.com/question/2050275486652000215/answer/2050724034434822391", "votes": 748, "comments": 45, "feed_ts": 1781710711, "feed_time_str": "06-17 23:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待美国副总统万斯承认有3000亿给伊朗，但辩称是“有条件的重建基金”？", "excerpt": "怎么说呢…… 你开战前掏一半，用1500亿美国投资换伊朗不发展核武器…… 这事说不定顺利多了…… ", "url": "https://www.zhihu.com/question/2050153828608222038/answer/2050522355093464875", "votes": 1643, "comments": 79, "feed_ts": 1781710606, "feed_time_str": "06-17 23:36", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "3B小模型，编程得分比肩Opus 4.5，神秘模型引发热议，原是国产", "excerpt": "编辑｜张倩 最近几天，一个 3B 的小模型在 X 上火了，因为在一些难度可验证的推理任务上（比如编程），它进入了 Gemini 3 Pro、GPT-5 high、Claude Opus 4.5、GLM-5、Kimi K2.5 等前沿模型的性能区间，而它的体积远小于这些模型。 这个模型名叫 VibeThinker-3B，是一个拥有 30 亿参数的密集推理模型，旨在探索在严格的小模型规模下，可验证推理", "url": "https://zhuanlan.zhihu.com/p/2050713575539397300", "votes": 59, "comments": 4, "feed_ts": 1781708308, "feed_time_str": "06-17 22:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "进击的沈帅波", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Vol.124 对话小仙炖董事长苗树：扎根源头与生态，筑造别人抄不走的品牌护城河！如今不管刷短视频还是跟同行聊天，所有人都在聊 AI、聊快速起量、聊低价内卷，各行各业都拼着往前冲，仿佛跑得慢一点就会被市场淘汰。但这期节目，我们偏要反着来，今天我们没有待在录音棚，直接来到小仙炖上海旗舰店，和创始人苗树坐下来深度对谈。同样身处消费赛道，在大家都说消费降级、新消费批量遇冷的当下，小仙炖反而保持持续复合增长，走出了一条完全不跟风的慢路子。为了一盏好燕窝，他们扎根 1.4 亿年的加里曼丹原始雨林，自建专属燕屋、投入资金做雨林生态保护；别人 all in 流量算法，他们深耕科研，带着上客户深入原产地，亲手采摘燕窝建立信任；人人追求科技降本，他们却坚持挖掘中式滋补古籍，打造有温度的产品服务。这期我们会拆解很多行业真话：为什么只靠低价的品牌注定走不远，消费品真正抄不走的护城河到底是什么；金丝燕的生存危机背后藏着滋补行业的未来；长期主义不是鸡汤，而是能穿越经济周期的真实经营打法。...去小宇宙查看完整单集简介在小宇宙查看该单集文稿 Vol.124 对话小仙炖董事长苗树：扎根源头与生态，筑造别人抄不走的品牌护城河！", "excerpt": "Vol.124 对话小仙炖董事长苗树：扎根源头与生态，筑造别人抄不走的品牌护城河！如今不管刷短视频还是跟同行聊天，所有人都在聊 AI、聊快速起量、聊低价内卷，各行各业都拼着往前冲，仿佛跑得慢一点就会被市场淘汰。但这期节目，我们偏要反着来，今天我们没有待在录音棚，直接来到小仙炖上海旗舰店，和创始人苗树坐下来深度对谈。同样身处消费赛道，在大家都说消费降级、新消费批量遇冷的当下，小仙炖反而保持持续复合增", "url": "https://www.zhihu.com/pin/2050711467045957651", "votes": 0, "comments": 0, "feed_ts": 1781707714, "feed_time_str": "06-17 22:48", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "我现在认为“爸爸妈妈长得像孩子”在语法上和语义上都是正确的。因为“像”这个词只是在描述相似的程度，并不包含“这些共享特征是谁传给谁”这一信息。例如许多严肃的鸟类学家和古生物学家都会说“手盗龙类其实更像鸟类，而不是刻板印象中认为的蜥蜴或鳄鱼”。如果“爸爸妈妈像孩子”是错的，那“手盗龙像鸟类”也是错的，只能说“鸟类像手盗龙”。这显然不符合大多数人使用语言的方式。", "excerpt": "我现在认为“爸爸妈妈长得像孩子”在语法上和语义上都是正确的。因为“像”这个词只是在描述相似的程度，并不包含“这些共享特征是谁传给谁”这一信息。例如许多严肃的鸟类学家和古生物学家都会说“手盗龙类其实更像鸟类，而不是刻板印象中认为的蜥蜴或鳄鱼”。如果“爸爸妈妈像孩子”是错的，那“手盗龙像鸟类”也是错的，只能说“鸟类像手盗龙”。这显然不符合大多数人使用语言的方式。", "url": "https://www.zhihu.com/pin/2050709301644334127", "votes": 0, "comments": 0, "feed_ts": 1781707227, "feed_time_str": "06-1     h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

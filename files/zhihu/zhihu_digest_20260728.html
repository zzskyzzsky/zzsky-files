e": "为什么智人会与尼安德特人发生交配？", "excerpt": "当时也有福瑞控吧。", "url": "https://www.zhihu.com/question/2063293013162452476/answer/2065286966594348387", "votes": 0, "comments": 0, "feed_ts": 1785182784, "feed_time_str": "07-28 04:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "小岗村为什么比南街村伟大？", "excerpt": "水浒传好就好在宋江投降了。小岗村伟大就伟大在单干后依然贫穷。", "url": "https://www.zhihu.com/question/1953907524496529174/answer/2023671464193179934", "votes": 2313, "comments": 130, "feed_ts": 1785182182, "feed_time_str": "07-28 03:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "抗日时期，日本特务绘制的毛主席照片，为什么和实际差距非常大？日本非常重视特务工作，比如大家都知道的特高课，还有汪伪的76号特工总部，可以说，全面侵华后，日本在我国形成多层级、全覆盖的特务网络，渗透军事、政治、经济、社会各领域，其特工工作比较到位，通常情报都比较准。但日本特务机关干的一件情报工作，却非常让人啼笑皆非。1937年了，中日战争都打了7年了，日本的情报特务机关连毛主席长什么样子的搞不清楚。1937年8月，在日本内阁印刷局公开发行的刊物《周报》上，登载了一篇日本外务省情报部《谈共产军》的稿子，其中用了一张毛主席的照片如下，可想而知，日本对于我军的研究是多么的陌生，完全体现不出专业水准。我们再来看下毛主席实际的样子：这两个人，你能联想到一起吗？日本特务绘制的毛主席照片，怎么和实际情况差距那么大呢？难道日本情报机关真的没办法弄到一张毛主席的照片吗？或者说，找不到一个真正见到毛主席的人，辨别一下吗？其实并不然，日本的情报机关也不是吃素的，还真的搞过一张毛主席的照片，但不是毛主席的独照，是和其他人合影。如下图：我们现在都知道，右三是毛主席，但我们都是后来者，当然知道谁是毛主席。但日本人从来没见过毛主席，他们想当然地认为，中间那个人有大官的气质，肯定是毛主席。毛主席是谁？在国民党，30岁的年纪就已经是国民党中宣部代理部长，候补中央执行委员，手握实权、备受赏识，四方权势人物都想拉拢他。在我党，当时已经是最高领导人，手底下有数十万部队。因此，日本情报机关从常理逻辑推断，中间那个C位的人，应该是毛主席。只是没想到，毛主席是非常接地气的人，根本没有世俗意义那种领导架子。于是，就张冠李戴，日本情报机关绘制出那张毛主席的照片！究其原因，还是毛主席没有特权阶级的思想，他的一生对待人民群众非常友善亲切，他终其一生，都在贯彻落实他提出的“密切联系群众”的观点，并把这一点列入我党的三大优良作风之一。他始终和人民群众在一起，和任何人合影，都没有那种高高在上的官僚气派，不要说和领导干部在一起，即使接见人民群众，人民群众都可以光着膀子，这一切都显得那么亲切自然。因此，日本情报机关即使获得了毛主席的真实照片，也犯了一个大错误，并不清楚毛主席的亲民风格，绘错了毛主席的照片。【思想先行】图四  毛主席和刘少奇合影时将中间让了出来，周总理、彭真和李克农等人都站在后排，能享受这种待遇的，就是德高望重的“延安五老”。 ​​​图五 没想到这三个晚年神态平和的老头，当年是把杜聿明打得焦头烂额的南满“铁三角”。左一是开国少将沙克，中间是我军最年轻的开国上将萧华，右一是“旋风司令”韩先楚 ​​​图九是1945年8月15日，重庆。抗战胜利，蒋介石特意拍照留念。他左胸那块勋章，据说半斤重。老蒋为抗日做了哪些贡献？[并不简单] ​ ​​​", "excerpt": "抗日时期，日本特务绘制的毛主席照片，为什么和实际差距非常大？日本非常重视特务工作，比如大家都知道的特高课，还有汪伪的76号特工总部，可以说，全面侵华后，日本在我国形成多层级、全覆盖的特务网络，渗透军事、政治、经济、社会各领域，其特工工作比较到位，通常情报都比较准。但日本特务机关干的一件情报工作，却非常让人啼笑皆非。1937年了，中日战争都打了7年了，日本的情报特务机关连毛主席长什么样子的搞不清楚。", "url": "https://www.zhihu.com/pin/2062857378534635299", "votes": 0, "comments": 187, "feed_ts": 1785181905, "feed_time_str": "07-28 03:51", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "水龙", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "麦田怪圈的真相是什么？", "excerpt": "东西方文化不同，中国这边会出现“为人民服务”几个大字", "url": "https://www.zhihu.com/question/22294325/answer/2065060655464460495", "votes": 2, "comments": 0, "feed_ts": 1785180163, "feed_time_str": "07-28 03:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "水龙", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价《一人之下》漫画第768（822）话？", "excerpt": "米二想让公司中立。问题是曲彤已经事实上干扰公司好几次了，大的抢马仙洪那次提了。那炸了二壮呢，吕家想杀吕良之前可是先废了地行仙张哥一条腿了。现在又拿人体炸弹威胁都这样了还能中立啊。那只有一种可能米二心中的国企就是那种小弟送死大哥不在乎的黑社会性质的团体。 ", "url": "https://www.zhihu.com/question/2061243299265094609/answer/2063944786105603558", "votes": 9, "comments": 0, "feed_ts": 1785179442, "feed_time_str": "07-28 03:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "国产深紫外光刻机DUV取得重大实质性进展，预计年内交付，ASML 股价暴跌，这意味着什么？", "excerpt": "意味着，明年将拥有EUV可能不是传言。 前年时，王孟源在唐湘龙的节目里说过2027年是国产EUV节点，会先用在存储方向。 我觉得他在国内有一些消息来源，在这方面是比较靠谱的。有时候你没太可靠的消息，可以听听比较可靠的人怎么说。 中美之间去年起就开始休战，不是和解，而是在休战这件事上存在共识。美国的意图很明显就是需要时间搞定稀土，中国自然是知道美国卡我们的点是光刻机。那么中美的共识到底是什么？中国政", "url": "https://www.zhihu.com/question/2065235793564767713/answer/2065259861928161751", "votes": 164, "comments": 11, "feed_ts": 1785176323, "feed_time_str": "07-28 02:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "预训练 batch 扩大4倍，AdamW 悄悄退化，Muon 和 SOAP 是怎么稳住的\n图文版：链接为什么大 batch 会出问题NVIDIA 在 30B-A3B 和 72B-A8B MoE 的万亿 token 预训练里，将 batch 从 25M token 推到最高 100M token。稀疏 top-k 路由让单个 expert 看到的有效 batch 较小，共享的稠密参数却要处理全部 token，因而先承受超大 batch 的优化压力。论文测试范围内，AdamW 随 batch 放大出现训练质量退化，Muon 和 SOAP 保持了更好的收敛表现。Muon 和 SOAP 怎么做AdamW 按元素更新参数；Muon 对动量矩阵做正交化，SOAP 在预条件器特征基中执行自适应更新。SOAP 的标准实现会因预条件器滞后于当前梯度而出现损失尖峰。每步 QR 刷新特征基并纳入当前梯度，再配合基于 KL 散度的协方差估计，在 Qwen3-30B-A3B 实验中带来更低损失和更少尖峰。结果与边界Qwen3-30B-A3B 的 1 倍、2 倍和 4 倍 batch 对比以 25M token 为基准，4 倍即 100M token，Muon 和 SOAP 都优于 AdamW。KL-SOAP 略优于 Muon 只来自固定 24M token 的该模型实验。72B-A8B 上，Muon 用 50M token batch 训练 1T token 时，损失低于 25M token AdamW 基线。Muon 和 SOAP 的矩阵计算和分布式切分更复杂，提供兼容 Megatron-LM 的逐层实现。结论限于已测试设置，尚未证明可以全面替代 AdamW。原文标题：SOAP, Muon, and Beyond: Pushing LLM Pretraining Scales#无影寺 ", "excerpt": "预训练 batch 扩大4倍，AdamW 悄悄退化，Muon 和 SOAP 是怎么稳住的\n图文版：链接为什么大 batch 会出问题NVIDIA 在 30B-A3B 和 72B-A8B MoE 的万亿 token 预训练里，将 batch 从 25M token 推到最高 100M token。稀疏 top-k 路由让单个 expert 看到的有效 batch 较小，共享的稠密参数却要处理全部 t", "url": "https://www.zhihu.com/pin/2065245420243232435", "votes": 0, "comments": 0, "feed_ts": 1785172967, "feed_time_str": "07-28 01:22", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "大模型记忆事实的真正瓶颈：不是能不能存，而是能不能稳定读出\n图文版：链接解码裕度决定事实能否被读出大模型 MLP 能在原始键上选对答案，不代表注意力层传来带噪查询后仍能读对。Garcia 等人将这个差别归为解码裕度：正确答案领先错误答案的最小余量要离开零，Transformer 的端到端事实召回才会上升。赫布 MLP 把容量问题转为核设计门控单隐层 MLP 经经验特征协方差白化后，可精确重写为核空间里的赫布记忆。作者用草图化二次核构造双线性 Hebbian MLP；键和值过于聚集或相互对齐会压低裕度，三组几何扫描中理论界与实测裕度拟合达到 R²≥0.95。15–63 倍只属于 Transformer 事实召回在合成事实召回中，Transformer 块存同样多事实时，数据相关构造比 NTK MLP 少用约 15–63 倍参数；各向同性嵌入下的独立 MLP 比较为 10–10^4 倍。这些结果比较的是两类构造存同样多事实的参数需求，不能外推为将现有商业大模型直接压缩到原来的几分之一。MLP SWAPPING 仍是单层概念验证在单层 Transformer 的合成作者—书名任务中，编辑 10% 事实时，MLP SWAPPING 得分为 0.999，AlphaEdit 为 0.550，差 44.9 个百分点，非事实 token 困惑度比值为 1.02。工作尚未说明真实预训练 LLM 会学到该结构，也未覆盖多跳召回和大规模知识编辑。原文标题：MLPs are Hebbians: Constructing Efficient Fact-Storing MLPs for Transformers#无影寺 ", "excerpt": "大模型记忆事实的真正瓶颈：不是能不能存，而是能不能稳定读出\n图文版：链接解码裕度决定事实能否被读出大模型 MLP 能在原始键上选对答案，不代表注意力层传来带噪查询后仍能读对。Garcia 等人将这个差别归为解码裕度：正确答案领先错误答案的最小余量要离开零，Transformer 的端到端事实召回才会上升。赫布 MLP 把容量问题转为核设计门控单隐层 MLP 经经验特征协方差白化后，可精确重写为核空", "url": "https://www.zhihu.com/pin/2065243956548576716", "votes": 0, "comments": 0, "feed_ts": 1785172672, "feed_time_str": "07-28 01:17", "category": "pin", "cat_name": "想法动态"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "麦田怪圈的真相是什么？", "excerpt": "麦田怪圈（crop circle）这个事情其实挺有趣的，在古早未解之谜系列里面，它和百慕大三角一直是霸榜前几名的，那我就把这个事情的始末详细的说一说吧。 麦田怪圈的起源，现在公认是1678年发生于英国赫特福德郡的“割麦恶魔事件”。这个事情，说的是1678年的时候，一位来自英国赫特福德郡（Hertfordshire）的富有农场主，请了一位割麦工帮自己收割庄稼，割麦工嫌工钱太低，就跟农场主讨价还价。农", "url": "https://www.zhihu.com/question/22294325/answer/2064741257537234594", "votes": 861, "comments": 92, "feed_ts": 1785172596, "feed_time_str": "07-28 01:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Molt 将 agent RL 核心路径压到 8.6K 行：与 slime 的匹配吞吐测试统计可比图文版：链接8.6K 行统计范围Molt 是 NVIDIA 开源的 PyTorch-native agent RL 框架。按导入图统计，RL 入口路径 8.6K 行，verl 约 62K、slime 约 25K；不含 SFT/DPO、奖励模型、第三方、测试和文档。代码量不能直接等同于易用性或正确性。16 张 H100 的匹配吞吐测试使用 bf16 Qwen3-30B-A3B、2 节点共 16 张 H100，8 张训练、8 张 rollout；双方全异步、全局 batch 128、16,384 token 上下文、8,192 token 回答上限，均不加载参考模型。Molt 用 FSDP2，slime 用 Megatron-Core 30B 配置，独立运行三次。119.4 秒与 109.5 秒的比较范围Molt 每优化步 119.4±2.3 秒，slime 为 109.5±10.3 秒；slime 范围为 102 至 121 秒，与 Molt 重叠，报告称统计可比。MTP speculative decoding 将生成从 329 秒降至 64 秒；CPU offload 将峰值显存从 64.7GB 降至 46.4GB，但训练时间增加约 18%。开源框架仍须验证真实任务仓库以 Apache-2.0 开放，包含参考 agent、recipes 和容器。一个分布式 MoE checkpoint 的前向不一致使相关数据只能说明吞吐，收敛对等仍等待上游修复；奖励、权限和长轨迹成本也需按任务复测。原文标题：Molt: A Scalable PyTorch-Native Training Framework for Agentic Reinforcement Learning#无影寺 ", "excerpt": "Molt 将 agent RL 核心路径压到 8.6K 行：与 slime 的匹配吞吐测试统计可比图文版：链接8.6K 行统计范围Molt 是 NVIDIA 开源的 PyTorch-native agent RL 框架。按导入图统计，RL 入口路径 8.6K 行，verl 约 62K、slime 约 25K；不含 SFT/DPO、奖励模型、第三方、测试和文档。代码量不能直接等同于易用性或正确性。1", "url": "https://www.zhihu.com/pin/2065243126114031432", "votes": 0, "comments": 0, "feed_ts": 1785172415, "feed_time_str": "07-28 01:13", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Kimi K3 技术报告\n图文版：链接完整权重发布：2.8T 总参数与 104B 激活Kimi K3 是 MoE 模型：总参数 2.8T、激活 104B、上下文最高 100 万 token。权重已发布，部署看量化、推理框架和硬件。KDA、AttnRes、Stable LatentMoE：相对 K2 约 2.5 倍扩展效率K3 以 3 层 Kimi Delta Attention 和 1 层 Gated MLA 交替处理长序列，AttnRes 让层选择性读取前序表示。Stable LatentMoE 从 896 个专家中每 token 选择 16 个，并用归一化、SiTU-GLU、Quantile Balancing 稳定训练。报告将架构、数据和训练配方合并评估，整体扩展效率约为 K2 的 2.5 倍。1M 上下文 RL：三类任务乘三档 reasoning effort上下文从 8K 扩至 64K，后续从 256K 扩至 1M。后训练覆盖推理与知识、agent、编程 agent，并训练 low、high、max 三档 effort，共九个模型。长轨迹可含数百至数千次工具调用，系统用部分 rollout、外部 KV cache 和可恢复 sandbox 管理资源。报告套件中落后 Claude Fable 5 与 GPT-5.6 Sol综合评测覆盖长周期编程、agent、知识、推理和视觉。Kimi K3 在 报告套件中落后 Claude Fable 5 与 GPT-5.6 Sol，同时高于其余纳入比较的模型。外部 benchmark、硬件成本和独立复现仍待验证。原文标题：KIMI K3: OPEN FRONTIER INTELLIGENCE#无影寺 ", "excerpt": "Kimi K3 技术报告\n图文版：链接完整权重发布：2.8T 总参数与 104B 激活Kimi K3 是 MoE 模型：总参数 2.8T、激活 104B、上下文最高 100 万 token。权重已发布，部署看量化、推理框架和硬件。KDA、AttnRes、Stable LatentMoE：相对 K2 约 2.5 倍扩展效率K3 以 3 层 Kimi Delta Attention 和 1 层 Gat", "url": "https://www.zhihu.com/pin/2065242274804586354", "votes": 0, "comments": 0, "feed_ts": 1785172272, "feed_time_str": "07-28 01:11", "category": "pin", "cat_name": "想法动态"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "全世界都在ALL in AI ，AI真的是第四次工业革命吗？人类的科技树是否点错了？", "excerpt": "前提错误。全世界只有一个国家在All In AI。 这世界上只有两个AI玩家，中国和美国。 美国All In AI是没错，中国没有，中国按部就班发展而已，对AI的投入和重视程度是不如当年的新能源车的。 至于美国这位世界老大为什么要像小国那样All In某个领域，我以老美的人工智能公司现在陷入的窘境为例展开来说说吧。 对An­t­h­r­o­p­ic 和 Op­e­n­AI而言，跑赢老中的一堆开源A", "url": "https://www.zhihu.com/question/2052464126996353859/answer/2065238592889345017", "votes": 27, "comments": 4, "feed_ts": 1785171251, "feed_time_str": "07-28 00:54", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "西班牙率先暴富并拥有了几乎整个美洲，为何最后却远远落后于当初远不如自己的英法德？", "excerpt": "因为他的税收制度太落后了。国家收不上来税，又没有英国后来搞的中央银行制度，来主动调节货币价格。于是就成了国家去打仗，结果好处都私人捞了。国家分得最少，各个王国的商人，议会反而拿得多。而国家担的义务又反而是最大的。 这和第一次全球化另一个一起完蛋的帝国大明简直是殊途同归，当然大明是自己作的，大明皇帝的权力可比神罗皇帝大几十倍。 ", "url": "https://www.zhihu.com/question/6 736675018", "votes": 0, "comments": 0, "feed_ts": 1785161023, "feed_time_str": "07-27 22:03", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "宝郁", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "和王虹一同完成挂谷猜想的，南开大学的老师为什么没获得菲尔兹奖?", "excerpt": "一个跟获奖者一起并肩攻下了百年数学难题的数学家，坐在台下鼓掌，亲眼看着自己的合作者上台领走了数学界的最高荣誉。你说他是什么感受，不甘心，委屈？都不是，他比谁都清楚为什么自己没上去，因为菲尔兹奖有一条死规矩，谁也绕不过去。 这个人叫约书亚·扎尔，加拿大数学家，2025年全职加入南开大学陈省身数学研究所，当讲席教授。他跟王虹合作了五六年，2025年2月一起交了一篇127页的论文，彻底解决了三维挂谷猜想", "url": "https://www.zhihu.com/question/2064156513028117185/answer/2064343119265634149", "votes": 381, "comments": 82, "feed_ts": 1785160560, "feed_time_str": "07-27 21:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "gwave", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么强化学习中Q-value与时间无关？", "excerpt": "动量守恒公式中没有显式的时间，但 v 和 v&#39; 分别代表不同时刻的状态。Q-value 也类似：标准写作 Q(s,a) ，是因为默认当前状态已经包含预测未来所需的全部信息：只要当前状态和动作相同，未来奖励的概率分布就相同。因此时刻不再提供额外信息。 但在固定时间结束的游戏中，同一位置出现在开局和结束前，剩余时间不同，累计回报当然不同。此时严格来说应写成： Q_t(s,a) ，或者把剩余时间", "url": "https://www.zhihu.com/question/664205628/answer/2065192720126173632", "votes": 1, "comments": 1, "feed_ts": 1785160314, "feed_time_str": "07-27 21:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "宝郁", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "日本确认南鸟岛海泥含稀土，对全球稀土供应有何影响？", "excerpt": "日本海洋研究开发机构的地球深部探测船“地球”号于今年1月在南鸟岛海域水深约6000米处进行了为期3天的试开采，采集的海泥总重约50吨。这不说的很清楚吗？水深6公里，一艘船采了3天，挖了50吨海泥。 那么这50吨海泥的含水量呢？ 一般来说海泥的含水量超过90%。 就按90%计算，干燥后的海泥实际就剩下了5吨。 根据工业实践数据，稀土矿的稀土含量通常在0.1%-0.4%之间，即每吨矿石可提炼1-4公斤", "url": "https://www.zhihu.com/question/2064455331346962042/answer/2064818998873698567", "votes": 1178, "comments": 128, "feed_ts": 1785160305, "feed_time_str": "07-27 21:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "gwave", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "北大校长为什么不给王虹、邓煜打电话？", "excerpt": "一没有电话号码；二就算有，也会被当成骚扰电话，早干嘛去了；三干嘛不用微信，facebook等IM？是不会用吗", "url": "https://www.zhihu.com/question/2064750528756725645/ .com/question/2063681079953961437/answer/2064696271689065513", "votes": 1303, "comments": 130, "feed_ts": 1785156513, "feed_time_str": "07-27 20:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "斯威特sweet 的想法“良家子学”的定义是门学问，我劝大家多学。按照你乎对【现代生活】的定义，“从待遇/人格等多方面角度破坏良家子的信心，背刺那些原本持【我付出但我一定有自己的社会价值，一定会有人回报我】观点的良家子”会不会导致现代生活被破坏？——如果你指的是泉州府鞋厂事件里缺位的消防器械，那一定是的。泉州府鞋厂事件的教训被一堆人反复分析，唯独没人说强调一点：社会生态崩盘时，你首先要接受“为了现代生活负重前行的群体”去责任化。不要觉得只有消防员如此。难道大家因为没有人把“生活便利”作为⏰赢学素材进行夸赞，就意识不到“生活便利”本质上是【“现代生活的必要劳力”被大手压价】的结果了？难道大家识别不了【作为群体是值得同情的底层劳动者，作为个体是下头果篮/下头基本盘】这套话术是谁在玩？——水电网气、公共治安，哪个不是“现代生活”的必要组成部分？在⏰的生育率环境下，水电网气/公共治安相关执行岗位的应有待遇，需要达到什么水平才足够合理呢？——达到【钱不见得多，但“事少离家近”的办公室岗】群体看一眼对方工资单就自闭的程度，那才是合理的。——换句话说，“收入高到能让前途群体在占尽体面度优势的情况下仍然骑脸不了对方”才算够高。如果你没有为上述待遇对应的费用做好准备、没有为【给予那些群体应有的人格，人籍】做好准备，那么下次想要指责对方“破坏现代生活”的时候，最好掂量下自己对现代生活的贡献和自己抨击的“破坏现代生活”的群体有没有区别。", "excerpt": "斯威特sweet 的想法“良家子学”的定义是门学问，我劝大家多学。按照你乎对【现代生活】的定义，“从待遇/人格等多方面角度破坏良家子的信心，背刺那些原本持【我付出但我一定有自己的社会价值，一定会有人回报我】观点的良家子”会不会导致现代生活被破坏？——如果你指的是泉州府鞋厂事件里缺位的消防器械，那一定是的。泉州府鞋厂事件的教训被一堆人反复分析，唯独没人说强调一点：社会生态崩盘时，你首先要接受“为了现", "url": "https://www.zhihu.com/pin/2065010637374338414", "votes": 0, "comments": 11, "feed_ts": 1785156105, "feed_time_str": "07-27 20:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国明明是贸易顺差破万亿的制造业大国，为什么工人工资总体还是偏低，而当年美国一个工人都能养活一家人了？", "excerpt": "你真了解1950年代美国普工生活，就知道和现在中国县城普通劳动者生活差不多，很多方面还不只不过单元公寓房换成独栋平房/二层或者联排小二层，建筑质量和中国工地工棚差不多。 我住过美国1950年代的州立大学研究生宿舍（当年是美国高校大扩招年代），和中国1980年代那种过道露天的县城筒子楼很像，每套宿舍三间房没有过道，进到第三间房子只能穿过第二间屋子，厕所在第二间屋子里，也是够局促的（虽然有单独的厕所确", "url": "https://www.zhihu.com/question/2020667754072609970/answer/2064126395463344989", "votes": 141, "comments": 40, "feed_ts": 1785155951, "feed_time_str": "07-27 20:39", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "Anthropic 刚招了研究王阳明的哲学教授，你觉得其他 AI公司会跟进吗？", "excerp 的切角，也是最近新闻里刺痛人心的事件——甘肃渭源的山洪悲剧出发，来谈谈这个夏天，与我们每一个人“微观生活”直接相关的致命风险。 一、大气候的小切口：“水", "url": "https://zhuanlan.zhihu.com/p/2065060620375008898", "votes": 16, "comments": 6, "feed_ts": 1785128857, "feed_time_str": "07-27 13:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "男朋友的外婆过世，他让我过去陪他，我没去，然后他就和别人好上了，男人都这么容易变心的吗？", "excerpt": "第一我是男的，第二我不认识你男朋友。 第三你男朋友当时哪怕不知道从哪弄到了我的联系方式，然后跟我说“兄弟我家里出变故了我难受的很想找个人倾诉”，我都干不出来直接拉黑的事。 ", "url": "https://www.zhihu.com/question/612084927/answer/3127134503", "votes": 22799, "comments": 296, "feed_ts": 1785128376, "feed_time_str": "07-27 12:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "长鑫科技上市首日高开 471%，市值突破 3 万亿，成 A 股新「一哥」，如何看待其表现？", "excerpt": "之前在长鑫干过两年 里面各方面都挺不错，无论是工作环境，还是薪资待遇，绝对是普通打工人天花板了 不过有一点，里面的离职率其实不低，之前我们校招进去的几个，走的也都差不多了 离职率最高的，就属那些在fab（生产车间）里工作的，成天穿个无尘服，戴个口罩，处理各种机台事故，一呆就呆一天，上个厕所都很费劲，捂一裤兜子汗，这种离职率是最高的 像制造部的生产普工，离职率相对来说很低，因为不用在生产车间里工作，", "url": "https://www.zhihu.com/question/2065005981617107684/answer/2065025653649438105", "votes": 1319, "comments": 150, "feed_ts": 1785128353, "feed_time_str": "07-27 12:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BBuf", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "为什么我希望有更好的GPU寄存器分析工具", "excerpt": "注：这是我最近业余时间在做的GPU上寄存器分配优化工作的背景说明。之前博客文章写到的torch.sort（ 博客原文）和torch.nn.EmbeddingBag（博客原文）算子GPU occupancy优化已经merge到了PyTorch主分支。相比最新的torch 2.9.0，torch.sort性能提升了15%到50%（PR： 链接）；EmbeddingBag性能提升了29%到110%（PR", "url": "https://zhuanlan.zhihu.com/p/1977517322492204135", "votes": 116, "comments": 9, "feed_ts": 1785128333, "feed_time_str": "07-27 12:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "也别把牢贺说得冤枉了一样。牢贺的非法行医是坐实的，这点在他刚刚事发的时候我就在知乎上斩钉截铁地说了他肯定是非法行医。而且不能因为我国的对胎儿权利保护比较弱，就认为牢贺的危害不大。他的行为同样恶劣，因为他所谓的基因编辑针对的是完全健康的人类胚胎，而他宣称的获益实际上是毫无必要的，也 核心就是个日本人喜欢的投降举", "url": "https://www.zhihu.com/question/2064455331346962042/answer/2065031359937222303", "votes": 209, "comments": 10, "feed_ts": 1785121844, "feed_time_str": "07-27 11:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_COLLECT_ARTICLE", "verb_cn": "收藏了文章", "title": "绞肉机里的双向碾压：当美元体系的外围承重墙开始崩塌", "excerpt": "第一章：7月24日，两个数字同时叩响历史的大门 2026年7月的最后一周，全球金融市场的交易终端上，两个数字几乎在同一时间，刷新了它们各自横跨数十年的纪录。一个在东京，美元兑日元汇率在屏幕上闪烁，这一周最高触及163.94，它轻松地越过了前一个交易日的峰值，直逼164的整数关口，将时间轴拉回到了1986年12月——那时，昭和天皇还在位，广场协议的墨迹未干，日本正沉浸在“平成景气”的疯狂前夜。另一个", "url": "https://zhuanlan.zhihu.com/p/2064868297598882479", "votes": 49, "comments": 6, "feed_ts": 1785120853, "feed_time_str": "07-27 10:54", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "时予", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "胡塞和沙特最近在闹啥3月那轮美伊危机以及此前的伊沙和解一两年，沙特一直是很坚定妥善的配合老中的各项战略战术的，不论是人民币结算石油推进还是帮老中给5.7之后飘了差点投靠土耳其的巴“铁”拴上黄金镣铐（给钱，比土尔其远远更多的钱雇用巴基斯坦当保安，这样穷的当裤子的巴“铁”就不用卖我们的飞机图纸给伊斯坦布尔这只野心勃勃的哈士奇换饭吃了，毕竟印度没倒，可不是跟巴“铁”闹翻的时候）。这也换到了，美伊上次危机期间，阿联酋卡塔尔科威特被伊朗打了个遍，却基本没动老对手沙特。说到老对手，大象不会找鸡做对手，狐狸也不会和青蛙长期对峙……沙特这个体量的国家，即便是根阿联酋、卡塔尔常有龃龉，也不至于真的恐惧忌惮对方，就像老中也不会把菲猴子真当作美俄那种战略对手防备……在海湾沙特担心的只有以色列和伊朗（原来还有伊拉克，但是现在是一盘散沙军阀混战不足为惧）……原本最理想的就是伊以战争，沙特安心发展2030愿景（经济从单独依赖石油转型）……然鹅，伊以一直没有真的大打出手（战争烈度、卷入资源和和持续时间都不够，经济结构也没彻底转入战时经济，也就是必须靠战争维持国民经济运转下去，那么，双方就都还大有通过和谈抽身而退的余地，这不够沙特安心）……而且眼看着中俄对于伊朗的绥靖默许和美国的软脚虾，极度担心伊朗在不远的将来，最终会拥有核武器能力（基本相当于日本的水平，持有大量高浓度核材料，可以随时造出来，但不能承认拥核和常态保有大量核弹）……那么沙特就将面对，海湾地区自己两大对手都实际拥核，只有自己没有的夹心饼干窘境……这是无论如何不能接受的……于是，在因为美债信誉不断透支（尤其是swift绝罚开除俄罗斯）之后，叛离美国倒向东大的沙特，又一次为了美国承诺的要给沙特核能力而再次判离东大导向美国——而帮助美国拖住胡塞就是小萨勒曼纳的投名状……这是为什么沙特在胡塞领导人们去吊唁哈梅内伊返回即将降落的时刻，炸胡塞机场首开战端…… 老中也是生气了的，于是知会巴不一定铁不许下场帮忙，沙特的好保镖就这样在一边观战……其实说起巴“铁”，巴政府官员和美国的渊源可比跟老中深多了，老中只是他们在美国疯狂拉拢印度的时刻，最有力的依靠，一旦印度势微，美国又对他们有兴趣，这印度次大陆上用根同种的兄弟俩，虽然和南北韩一样疯狂兄弟阋墙，但是民族性格和诚信品质上还真没有什么质的差距（都骨子里盲目自大贪心又不会长久忠诚……经济决定精神，两个都没土改过的神棍贵族地主阶级统治，又能有啥两样）。再说伊朗，美国不止承诺了沙特有核，也承诺了伊朗全面回到美元结算石油体系（这是上一次“真实承诺”能暂时和谈成功的关键因素）。这也是为啥他们战时期间发生天灾，我国援助物资第一时刻到达，伊朗总统沛泽，阴阳怪气的在机场感谢演讲中说：“伊朗是在替中国抵挡美国，减轻了中国本应面对的的战略压力”但是美国给这两国的承诺，都是空中楼阁：首先，核技术就是个留把柄的圈套口袋罪，当年伊朗的核技术也是美国给的（1972年巴列维时期，这个阶段伊朗是非常亲美的），当时给的时候也是说表面是民用核电，但是给的是日本那种二代核电站（也就是核电废料很适合浓缩成核弹原料），并且给浓缩技术，暗示对方这样就可以心照不宣私下发展发展核武器……然鹅，这就是个圈套，一旦你真忍不住发展了，拥有了浓缩核材料，就是美国随时拿捏你的抓手……你听话就常态抽血（像日本，通过利差常态化成为美债血包），如果不听话，伊朗的今天就是沙特的明天，制裁封锁无所不用其极。再说，美元结算石油，这就和美国忽悠京子现在放弃乌东四州和谈，就能让俄重回swift一样荒谬可笑——没打不也在swift里，没打不也没有乌东四州，那这三年岂不是一个笑话……伊朗7-80年代就有和现在一样的半瓶醋核能力了，那时也能全美元结算石油也没有制裁封锁……那么这二三十年的制裁，一两代人的贫困，如果到最后还是回到原点，这几十年岂不是也是一个笑话？！！所以，最终，美国给的鱼饵，看似肥美，其实都是镜花水月，却白白蹉跎了老中的战略部署。不过，这也难免……这些国家不是真蠢，而是总觉得自己不是必须和美对立，始终怀有侥幸心理，俄罗斯都被耍了多少回了，还不是美国勾勾手就心旌摇荡，何况伊沙这俩难兄难弟呢……骑墙心态是一切小国不可避免的，当俄自诩世界未来霸主，彼得大帝会说：“俄罗斯只有两个盟友，一个是俄罗斯海军，另一个是俄罗斯陆军。”当俄罗斯觉得自己只是G2掰手腕的缓冲带中间商加油站的时候，叶利钦可以甘心情愿给克林顿当小丑取乐，也要自认为是盟友……呵呵，燕雀没出息，不是燕雀的过错，毕竟大部分燕雀也就能飞苹果树那么高，根本不奢望翱翔九天……但是燕雀的摇摆，总也不是大鹏鸟的过错……他们要是不短视、软弱、糊涂、摇摆，那不是满天都飞大鹏鸟了～九重天，注定就该是孤寂的，只有苹果树的高度，才常堵车。从这次的巴以冲突中，个人最大的感受是什么？（前两年对于本次巴以的预测，基本都应验了）", "excerpt": "胡塞和沙特最近在闹啥3月那轮美伊危机以及此前的伊沙和解一两年，沙特一直是很坚定妥善的配合老中的各项战略战术的，不论是人民币结算石油推进还是帮老中给5.7之后飘了差点投靠土耳其的巴“铁”拴上黄金镣铐（给钱，比土尔其远远更多的钱雇用巴基斯坦当保安，这样穷的当裤子的巴“铁”就不用卖我们的飞机图纸给伊斯坦布尔这只野心勃勃的哈士奇换饭吃了，毕竟印度没倒，可不是跟巴“铁”闹翻的时候）。这也换到了，美伊上次危机", "url": "https://www.zhihu.com/pin/2064981652217016610", "votes": 0, "comments": 1, "feed_ts": 1785120798, "feed_time_str": "07-27 10:53", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "今天走出了不一样的剧本当长鑫上市会抽血大盘，共识形成的那一刻起，剧本就被改写了。因为如果按照以往的巨头上市表现来说的话，应该是一个标准的虹吸剧本，但今天一反常态，长鑫上市暴涨4倍的同时，还拉红了整个大盘。就按我的理解，这个结果可能是今年顶层融资逻辑，是资金刻意做出来的示范盘面。大家一定要清楚，2026 下半年是超级融资大年，是硬科技资本化集中落地的关键窗口。接下来排队上市的全部是重磅巨头，除了长鑫，后面还有宇树科技、超聚变、各类 AI 与存储核心企业密集登陆。 大批量硬核公司集中募资，是今年资本市场的核心任务。而在这种背景下，长鑫某种意义上已经成为了整个下半年 IPO 行情的样板标杆。如果这只万众瞩目的超级大盘新股直接破发，或者连带着其余板块都下跌，那可能会直接击穿全市场打新信心，然后让市场形成一个打新就跌的预期。而散户一旦全面放弃打新、增量资金避险观望，那么后面所有科技巨头的募资节奏都会全面受阻，整个产业融资闭环都会卡住。所以产业资本和维稳资金，绝对不允许长鑫走崩。盘面可以震荡、可以洗盘，但绝对不能破发，必须做出正向赚钱效应，给后续所有 IPO 铺路造势。带个这个逻辑来看，其实很多事就很明确了。今天之所以能逆势收红，核心原因非常明确：上周五市场提前恐慌、提前兑现，利空一次性打满，该跑的资金已经跑完，今天自然没有集中抛压。再加上长鑫真实流通盘极低，绝大多数筹码长期锁定，伴随着开盘后的一通交易，流通筹码已经逐渐集中在了主力手里，主力控盘难度持续降低，后续最大的博弈窗口，就是三个月后纳入指数的被动配置行情了。而且注意，长鑫这次还有一个很关键的打新效应是什么吧？就长鑫不同于以往巨头IPO，这次长鑫给到的打新模式是能让大批量投资者中签的，大家可以去看社交平台看看，有多少博主或者用户晒出了打新成功的就好了。而你说长鑫真是大肉票嘛？其实也不算，单票赚2万左右，看上去不少，但在打新领域，并不能算上大肉签。但我相信一件事，就长鑫打新效应一定会在后续通过全网打到新的博主身上传播出去，然后营造一种全网扩散的打新效应。博主晒出的打新赚钱，这是最好的广告，一定能拉到更多的散户入场，也会为后续密集 IPO 稳住市场情绪。但最后我必须客观提示一下是什么吧：就虽然长鑫首日表现还挺好的，但对比世界科技巨头来说，目前这个估值，还是偏高了的，短期资金托底是任务、是行情需要，但不会有长期资金在的。所以打到长鑫的，该考虑出手就出手，别留。而且虽然长鑫打新效益确实还不错，但大家也要注意一点，如果按照长鑫打新前的市值要求来看，那么现在有资格打到长鑫的投资者，基本过去可能亏的都比长鑫赚的多。最后大家记住一点，虽然长鑫打响了下半年硬科技 IPO 的第一枪，示范效应已经达成。单往后接踵而至的一众重磅企业，市场不可能持续消耗流动性去维持同等强度的护盘行情。就还是那句话，打新红利可以适度参与，但不要默认每一只巨头上市都会复刻长鑫今日的走势。因为当所有人都预判后续会走长鑫剧本的时候，结果大概率就会来到一个反转。", "excerpt": "今天走出了不一样的剧本当长鑫上市会抽血大盘，共识形成的那一刻起，剧本就被改写了。因为如果按照以往的巨头上市表现来说的话，应该是一个标准的虹吸剧本，但今天一反常态，长鑫上市暴涨4倍的同时，还拉红了整个大盘。就按我的理解，这个结果可能是今年顶层融资逻辑，是资金刻意做出来的示范盘面。大家一定要清楚，2026 下半年是超级融资大年，是硬科技资本化集中落地的关键窗口。接下来排队上市的全部是重磅巨头，除了长鑫", "url": "https://www.zhihu.com/pin/2065025288711434374", "votes": 0, "comments": 15, "feed_ts": 1785120406, "feed_time_str": "07-27 10:46", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "三大战役为什么能做到3：0全部胜利？", "excerpt": "说政治经济原因你们也懒得看，战术分析也都分析烂了，我补充一个可能很少有人联系的因素吧：淮海战役五百万民工为什么那么坚决？带孝推车也要支援淮海前线？因为一年前的1947年，国军与还乡团在山东苏北制造的各种惨案，已经与这一带的老百姓结下了不死不休的血海深仇。这一带解放后长期是解放军兵员的重要来源，也与1947年的屠刀不无关联。 ", "url": "https://www.zhihu.com/question/1916901405752533412/answer/1917898167015437873", "votes": 2678, "comments": 137, "feed_ts": 1785119305, "feed_time_str": "07-27 10:28", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "大又元发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "真的有民间暗网吗？", "excerpt": "真的有民间暗网吗？", "url": "https://www.zhihu.com/pin/2065018281321402389", "votes": 0, "comments": 0, "feed_ts": 1785118725, "feed_time_str": "07-27 10:18", "category": "pin", "cat_name": "想法动态"}, {"actor": "水龙", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待2026年英国将启用黑人女演员饰演圣女贞德？", "excerpt": "法国人也可以用黑人女演员演英国女王嘛。", "url": "https://www.zhihu.com/question/2017587359223403310/answer/2063875673651951540", "votes": 3135, " const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

87600769, "feed_time_str": "08-25 03:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "时予", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果两个女生一起生活，会怎样？", "excerpt": "我曾经长期跟拉拉合租，日常生活中，她们中间会进化出一个爹，负责两个人的饮食起居。 如果这时候，家里又多了一对，他们会发生三四五六角恋，最后，四个人中精选出一个爹，负责四个人的饮食起居交电费网费天然气费等等。 然后我是男的，我在家里每天负责蹭吃蹭喝和修电脑（我也没搞懂为啥别人合租就是老死不相往来，搁我这就会很像个重组家庭） 直到有一天，她们四个中那个爹不干了，说自己养了三个女儿一个儿子太累了，要重新", "url": "https://www.zhihu.com/question/377922231/answer/2074213861784283002", "votes": 3884, "comments": 319, "feed_ts": 1787600555, "feed_time_str": "08-25 03:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "【转载】回归中密度：为什么3至5层才是城市的理想高度", "excerpt": "转载者注：转载自Congress for the New Urbanism，作者Dorian Moore。北美城市规划常陷于郊区开发与高楼集约的对立，却忽视了一种历经数代验证的城市形态——3至5层的混合用途建筑，它或许才是塑造宜居社区的关键。原文链接： https://www.http://cnu.org/publicsquare/2026/08/10/case-return-3-5-story-", "url": "https://zhuanlan.zhihu.com/p/2070479057494471381", "votes": 179, "comments": 65, "feed_ts": 1787599790, "feed_time_str": "08-25 03:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看台湾冰箱姐（脆湾姐）说北京没冰箱？", "excerpt": "北京没冰箱，和铁锅炖大鹅一样，只要提上一嘴，肯定有赞。 点赞的人需要的是这种情绪。 最高的情绪价值，就是暴论。 而更大的暴论，还没出现。那就是一旦出了北京城，来到北京郊区，连电都没有。 和北京比起来，平壤都算发达城市。 这还有证据。 郭德纲讲过一件事，于谦不是喜欢喝手磨咖啡吗？ 于谦怎么磨的咖啡？ 上面一扇石头，下面一扇石头，自己蒙上眼睛转着圈推。 这是为什么呢？ 当然是于谦在乡下的别墅没电。 郭", "url": "https://www.zhihu.com/question/2074822846648530291/answer/2075413477817070756", "votes": 4, "comments": 1, "feed_ts": 1787597133, "feed_time_str": "08-25 02:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "什么是真慈善？2019年，审计组本是去南京查贪腐的，结果查着查着，谁也没想到，竟然查出了一位大医精诚、人间圣手。​​审计的人盯着电脑屏幕，越看越懵。系统里蹦出来的不是黑账，不是回扣，是一笔笔没头没脑的转账记录。从2005年开始，十几年就没断过，钱不多，几百几千的，全进了贫困患者的住院账户。这位默默行善的医生，是江苏省肿瘤医院副主任医师席玮。​​这个反转太狠了。​​审计组扛着反腐的任务杀进医院，刀刃都磨好了，账本摊开了，就等着揪出几条蛀虫。结果查着查着，剑走偏锋，劈开了一道光。我觉得这才是最扎心的地方，你以为要掀开盖子抓黑手，结果掀开一看，是一双托住病人的手。​​席玮是介入科副主任医师，南京医科大学硕士生导师，手握三项省级大奖。按说这样的资历，早该住大房子开好车了。可审计人员越查越不对劲，他的工资像漏了的水龙头，十几年来一笔笔往外淌。​​从2005年开始，他给贫困患者垫付医药费，一垫就是十四年，前后累计超过五十万元，帮扶了二百八十多位走投无路的肿瘤患者。​​更让人破防的是他怎么垫的。他怕病人觉得欠人情、伤自尊，每次都说这是慈善捐助，是医院补贴。有笔5387元的款项打到了患者账户里，既没备案也没走审批，审计组差点当成利益输送来查。结果一问，席玮只淡淡回了一句，这钱是我自己掏的。​​审计的人干了十几年，见过套资金的、虚开发票的，头一回遇到这种情况，每一笔异常支出背后，都是一个等着救命的病人。​​可他自己过得什么样？骑一辆快散架的电动车，车座缠满黑胶带。白大褂穿了十四年，洗得发白还舍不得扔。住的是医院老宿舍，墙皮都掉了。​​一年春节前夕，他遇到一位六旬癌症患者，孤苦伶仃，连一万多的治疗费都凑不齐。席玮把自己过年的钱全打到了老人账户里，那年一家三口没回老家。他说，能让老人少一点痛苦，多一点温暖，比什么都强。​​我承认我破防了。​​一个副主任医师，收入不算低，却把自己活成了苦行僧。他把工资、奖金几乎全掏给了素不相识的病人。这不是一时冲动，这是刻在骨子里的东西。席玮出生在医生家庭，从小看着父母救死扶伤，那份善良早就在心里扎了根。他看不得病人因为几百几千块钱被卡在生死门口。​​这件事最残酷的地方在于对比。医疗反腐这些年，查出来的蛀虫一个比一个狠，涉案金额动辄上千万。有人把白大褂穿成了敛财的工具，有人把手术台变成了提款机。可就在同一片天空下，席玮用十四年、五十万、二百八十条命，把医生这两个字重新擦亮了。​​我觉得这才是真正的破防点，不是他做了多伟大的事，是他用最笨的方式，把那些被败坏的名声一点点往回拽。​​当然会有人说，个人垫付解决不了制度问题。这话没错。医疗救助不能只靠一个医生的善良来兜底，社会问题需要制度来托举。可制度需要完善，不代表我们不能向一个具体的人致敬。恰恰相反，正是因为制度有缝隙，席玮这样的人用血肉之躯去堵，才更显得珍贵。​​他不是在替谁擦屁股，他是在替这个行业守住最后的底线。​​我特意查了一下，这件事2019年被审计发现后，新华社、人民日报、央视新闻都报道过。一个医生藏了十四年的秘密，最后被查账的审计组翻了出来。这本身就是一个巨大的讽刺，查贪腐的机器，最后成了挖掘善良的工具。​​审计人员盯着屏幕红了眼眶，我觉得他们红的不只是眼眶，是整个行业的羞愧。​​席玮可贵在哪里？他既看见了病，也看见了病人。他知道贫困带来的羞耻、无助和绝望，同样会压垮一个人。所以他选择悄悄帮，不让患者低头求人，不让善意变成负担。这才是大医精诚，不是挂在墙上的标语，是账单跳红、病人低头、家属沉默的那一刻，有人愿意伸手托一下。​​回到开篇那句话，审计组本是去查贪腐的，结果查着查着，竟然查出了一位大医精诚、人间圣手。我觉得这句破防的背后，藏着一个更深的拷问，当反腐的探照灯扫过每一个角落时，照出的不该只是黑暗，也该有那些在黑暗里默默发光的人。​​席玮被看见了，可还有多少个席玮，藏在账本深处，等着被翻出来。一个社会最温暖的样子，应该是好人不孤单，病人有托底，善良的人也能被好好保护。​​信息来源：央视新闻《“暖心医生”为病人捐款14年 谎称是慈善捐助》，2019年4月8日发布", "excerpt": "什么是真慈善？2019年，审计组本是去南京查贪腐的，结果查着查着，谁也没想到，竟然查出了一位大医精诚、人间圣手。​​审计的人盯着电脑屏幕，越看越懵。系统里蹦出来的不是黑账，不是回扣，是一笔笔没头没脑的转账记录。从2005年开始，十几年就没断过，钱不多，几百几千的，全进了贫困患者的住院账户。这位默默行善的医生，是江苏省肿瘤医院副主任医师席玮。​​这个反转太狠了。​​审计组扛着反腐的任务杀进医院，刀刃", "url": "https://www.zhihu.com/pin/2074121178956969629", "votes": 0, "comments": 835, "feed_ts": 1787594353, "feed_time_str": "08-25 01:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "落后就要挨打，为什么北欧（不算挪威、芬兰、丹麦、瑞典、冰岛）没有挨打？", "excerpt": "你且研究一下。 瑞典被俄国干趴  "verb_cn": "发布了想法", "title": "日本学习了中国几千年的文化，为何最近一百多年成了发达国家?发达国家这个概念，其实是中等强国自抬身价搞出来的。上世纪六十年代，奥地利、联邦德国、法国、美国等20个欧美国家签署协议，将欧洲经济合作组织重组为经济合作与发展组织，这以后才开始有了发达国家与发展中国家的对比。OECD的基础是美国援助欧洲的马歇尔计划，是一群经历过战乱的欧洲国家找了个出大钱的美国老板，然后形成一个组织，自命为发达国家。日本成为发达国家的关键，是得到了美国的经济援助和产业转移，并作为东亚反共桥头堡。这说明发达国家这个概念，其实是为了塑造西方阵营的价值观，用吹嘘经济实力的方式展示西方阵营的强大。得到过美国帮助并且和美国同属一个阵营的国家，就是发达国家，反之则不是。日本学习了中国几千年的文化，为何最近一百多年成了发达国家? #发达国家 #最不发达国家 #日本有那么好吗 ", "excerpt": "日本学习了中国几千年的文化，为何最近一百多年成了发达国家?发达国家这个概念，其实是中等强国自抬身价搞出来的。上世纪六十年代，奥地利、联邦德国、法国、美国等20个欧美国家签署协议，将欧洲经济合作组织重组为经济合作与发展组织，这以后才开始有了发达国家与发展中国家的对比。OECD的基础是美国援助欧洲的马歇尔计划，是一群经历过战乱的欧洲国家找了个出大钱的美国老板，然后形成一个组织，自命为发达国家。日本成为", "url": "https://www.zhihu.com/pin/2075367771928580390", "votes": 0, "comments": 0, "feed_ts": 1787586235, "feed_time_str": "08-24 23:43", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "日本学习了中国几千年的文化，为何最近一百多年成了发达国家?", "excerpt": "发达国家这个概念，其实是中等强国自抬身价搞出来的，在上世纪六十年代以前，还没有这个说法。 1960年12月14日，奥地利、联邦德国、法国、美国等20个欧美国家在巴黎签署协议，同意将以协调美国援助欧洲的马歇尔计划为主要任务的欧洲经济合作组织（OEEC）重组为经济合作与发展组织（OECD），该协议于1961年生效。这以后，开始有了发达国家，发展中国家这一对比。 字面上的意思，进入了OECD组织的国家，", "url": "https://www.zhihu.com/question/4043333595/answer/2075367561303217809", "votes": 9, "comments": 0, "feed_ts": 1787586185, "feed_time_str": "08-24 23:43", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "以色列到底过不过分？", "excerpt": "我看很多人都忘记“亚伦·布什内尔”为什么自焚的了吧？ 一些回答实在让我看不下去了，都没亲历过就言之凿凿的说“巴勒斯坦没有种族灭绝”，看来下发的经费确实不少啊。 要是觉得没有的话，那就去一次加沙好吧，要求不高，呆一星期就可以了，我报销机票住宿，就当送你免费旅游了 My name is Aaron Bushnell, I am an active-duty member of the United S", "url": "https://www.zhihu.com/question/1953380009306723896/answer/1955645463094097764", "votes": 70, "comments": 101, "feed_ts": 1787585635, "feed_time_str": "08-24 23:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "以色列到底过不过分？", "excerpt": "以色列在巴勒斯 观派”，甚至是“反兼职派”。但就算是当年的“悲观派”，一切思考的原点也是“一切尽在掌握中”，“我们不遵循经济规律”——这也是为什么“反兼职", "url": "https://www.zhihu.com/question/641548388/answer/2075184028622251141", "votes": 1406, "comments": 144, "feed_ts": 1787577845, "feed_time_str": "08-24 21:24", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "有没有学数学的大佬给我讲一些非常牛逼的东西，震撼一下我这个非数学系的大学生？", "excerpt": "很多工科或者统计系的学生，学完高数、线代、概率和近世代数之后，会产生一种顽固的错觉，觉得自己已经掌握了数学工具的全貌。 其实并不是。你在工科院系学到的这些内容，仅仅是数学家为了方便其他学科使用而整理出来的运算工具，充其量只是基本运算规则。这就像你学会了怎么用扳手和螺丝刀，就以为自己懂了整个机械工程的底层架构。 但是今天数学和计算的边界已经完全消融。既然你有了这四门基础课的框架，就直接拿你熟悉的内容", "url": "https://www.zhihu.com/question/576203009/answer/2075328287761614038", "votes": 182, "comments": 8, "feed_ts": 1787576822, "feed_time_str": "08-24 21:07", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待艾滋病检测结果不得告知配偶引发热议？", "excerpt": "这就是非常有意思的地方。 国内法学一直在学习世界先进理论和经验。 比如慎判死刑（甚至主张废死）、轻刑、照顾各种“弱势”群体……都在积极学习，而且效果显著。 但这些学习似乎都集中在“缓与松”的方面，而世界上那些“严与紧”的方面，却积极性不高。 甚至不仅不高，还与之相反。 就比如“艾滋病检测结果”。 在美国，隐瞒艾滋病病情与他人发生关系，属于违法且可能构成刑事犯罪； 对配偶隐瞒更是违法，并会被列为婚内", "url": "https://www.zhihu.com/question/2073843717803340134/answer/2075143499461158346", "votes": 355, "comments": 15, "feed_ts": 1787576462, "feed_time_str": "08-24 21:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "司马懿", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待《经济学人》关于诺奖得主阿西莫格鲁「世界上最有影响力的经济学家，却不令人信服」的文章？", "excerpt": "首先这就是一篇攻击稿（hit piece），因为里面说的东西没有一样是新的。 殖民者死亡率那篇的数据问题，Albouy 2012年就在AER上发过正式的comment，把死亡率数据的来源和归类挑了个遍，AJR当时也写了reply，一来一回，一个完整的学术回合早就走完了。制度决定论解释力的问题，Glaeser他们2004年那篇Do Institutions Cause Growth?也系统质疑过，萨", "url": "https://www.zhihu.com/question/2073711989444931969/answer/2075314672765608086", "votes": 208, "comments": 15, "feed_ts": 1787573576, "feed_time_str": "08-24 20:12", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION" her", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TopView", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "8月24日午评", "excerpt": "今天上午，科技成长股集体挨了顿打。 隔夜那边就埋了雷。美债收益率往上走，10年期摸到4.74%，2年期也上了4.24%，美债价格连着跌，成长股的估值锚又不行了。英伟达更是六连跌，全周跌掉4.6%，阿里美股一夜跌8.59%，财报没达预期，还配股800亿，把中概和AI链的情绪全带沟里了。这几锤砸下来，A股今天开盘就绷不住。 到午间收盘，创业板指跌3.50%，收3421.50点；科创50跌3.26%，收", "url": "https://zhuanlan.zhihu.com/p/2075186646161667224", "votes": 52, "comments": 2, "feed_ts": 1787543082, "feed_time_str": "08-24 11:44", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "就有朋友问我白银有色的。怎么说呢，就我说的很清楚了，投机就是投机，就别奔着投资的逻辑去了。我这波买的也就是上波的1/10，就是短期炒一炒就好了…别想那么多了。", "excerpt": "就有朋友问我白银有色的。怎么说呢，就我说的很清楚了，投机就是投机，就别奔着投资的逻辑去了。我这波买的也就是上波的1/10，就是短期炒一炒就好了…别想那么多了。", "url": "https://www.zhihu.com/pin/2075183235261384241", "votes": 0, "comments": 13, "feed_ts": 1787542763, "feed_time_str": "08-24 11:39", "category": "pin", "cat_name": "想法动态"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "数据拆解：西方月亮为什么“圆”？一场长达百年的思想殖民工程最近在整理家族相册，发现一个很有趣的现象。我爷爷那辈，管去美国叫“放洋”，那是把脑袋别在裤腰带上赌命的活儿；我爸那辈，管去美国叫“留洋”，那是全村人的希望，回来能分配工作；到了我这一代，管去美国叫“出海”，是HR嘴里的一个KPI，或者是中产家庭资产配置里的一个选项。三代人，三个词。如果不细想，这只是生活水平的提高。但如果把视角拉高，你会发现这其实是一部“认知殖民”的迭代史。从1840年到现在，这套系统已经悄无声息地升级到了3.0版本。1.0版本很简单，就是“炮舰逻辑”。 你不听话，我就打你，直到你签条约。这套系统维护成本太高，容易炸膛，所以后来升级了。2.0版本是“规则逻辑”。 我不打你了，但我制定游戏规则，用资本和汇率收割你。你虽然独立了，但你的经济命脉还在我手里。现在大家看到的，是3.0版本“思想殖民”。这是最高阶的形态。殖民者不再需要军舰，也不需要直接控制你的央行。他们只需要通过“自由”、“民主”、“人权”这些看起来无坚不摧的普世价值，就能获得你的信任，然后潜移默化地把你的价值导向给换了。最可怕的是什么？是你不仅不反抗，你还会觉得自己是“觉醒”了，然后心甘情愿地替他们摇旗呐喊。这在学术上，叫“精神买办”的内化。大英帝国是这套系统的早期测试员。以前在殖民地，如果你想进入顶层圈子，标准配置是：一本英美护照、一口伦敦腔、一张牛津或剑桥的文凭。这些人回来后，自然成了法官、律师、银行家。他们用英国法审案，用英语思考，替英国的利益说话。英国本土没出一兵一卒，但全世界的钱都流向了伦敦。二战后，美国接手了这套系统，并且把它做成了SaaS服务（软件即服务），每年投入上百亿美元作为“认知维护费”。这套组合拳，拆解开来其实就四步，逻辑严密得像写代码：第一步：价值解构。 你不是崇尚集体主义吗？那我就告诉你那是“乌合之众”；你不是讲究勤俭节约吗？那我就告诉你那是“不懂生活”。通过广告和好莱坞，把“透支消费”包装成“活在当下”，把“享乐”定义为“成功”。于是，你为了追求所谓的“精致生活”，成了资本最忠实的奴隶，连反抗的力气都被加班耗光了。第二步：培养代理人。 这招最阴。美国通过各类基金会和NGO，定向资助一些学者、律师和媒体人。这些人拿着美元，研究着“为什么中国不行”。关键时刻，他们会用中国人的脸，说出美国人想听的话。这种“用你的矛攻你的盾”的战术，比派十万军队都好使。第三步：文化前置（从娃娃抓起）。 一个中国孩子，三岁看迪士尼，少年追漫威，他潜意识里就会认为：美国队长是正义的，美军是“世界警察”。好莱坞就是最强的大脑格式化工具。数据显示，2024年美国电影在全球41个主要市场占了77%的份额。这意味着，全球大部分孩子，看的都是美国人剪辑过的世界。第四步：代际断根。 这是一场长达70年的阳谋。爷爷辈看美国是“灯塔”，父辈拼命考托福，到了孙辈，直接把资产转移出去。胡润报告说中国高净值人群境外资产配置到了16%，这不仅仅是钱的问题，这是“精神离岸”。一边在国内赚爱国钱，一边把老婆孩子送到国外，这种“脚踏两条船”的心态，是对本土信任体系最彻底的腐蚀。苏联是怎么没的？很多人说是经济垮了，其实是脑子先乱了。冷战时期杜勒斯那句“我们要让他们相信我们的歌，跳我们的舞”，不是说说而已。通过“福布莱特计划”，大量苏联精英赴美，回来后就成了西方价值观的“带路党”。1991年，那个超级大国不是亡于战场，是亡于一场“认知心肌梗死”。不过，作为一个长期观察数据的理性人，我发现最近这个趋势出现了一个有趣的拐点。从2023年开始，教育部清理了高校教材里1200多处“西方中心主义”的表述。这动作背后的信号很明确：我们要开始“去殖民化”了。更重要的是物理基础的逆转。20年前，我们谈西方是仰视，因为我们的电力、网络、工业确实不如人。但现在呢？我们的5G，我们的特高压，我们的“天宫”和传说中的六代机，这些硬邦邦的工业奇迹，正在成为年轻人自信的底座。当物理层面的差距消失后，心理层面的“月亮之争”自然就失去了土壤。数据显示，中国人对“西方优越论”的认同度从2018年的43%跌到了2025年的11%。这说明什么？说明大家开始用自己的眼睛看世界了。100多年前，先辈们的任务是剪掉头上的辫子；今天，我们的任务是剪掉心里那根看不见的辫子。这场战争没有硝烟，但胜负手其实很简单：当我们在工业上不再依赖西方，我们在文化上自然就不再需要仰视。 至于那些还在纠结“哪里的月亮比较圆”的人，建议他们抬头看看——现在的月亮，还是那个月亮，但地上的路灯，已经比月亮亮多了。", "excerpt": "数据拆解：西方月亮为什么“圆”？一场长达百年的思想殖民工程最近在整理家族相册，发现一个很有趣的现象。我爷爷那辈，管去美国叫“放洋”，那是把脑袋别在裤腰带上赌命的活儿；我爸那辈，管去美国叫“留洋”，那是全村人的希望，回来能分配工作；到了我这一代，管去美国叫“出海”，是HR嘴里的一个KPI，或者是中产家庭资产配置里的一个选项。三代人，三个词。如果不细想，这只是生活水平的提高。但如果把视角拉高，你会发现", "url": "https://www.zhihu.com/pin/2075180278104995134", "votes": 0, "comments": 0, "feed_ts": 1787542316, "feed_time_str": "08-24 11:31", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "欧盟GDP已超过中国，中国还算是第二大经济体吗？", "excerpt": "平时谁天天叫嚣秦制大一统万恶的，怎么一算gdp就大一统起来了？", "url": "https://www.zhihu.com/question/1989839434867290290/answer/2058502189442655205", "votes": 1861, "comments": 37, "feed_ts": 1787542199, "feed_time_str": "08-24 11:29", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "大海中金子一般珍贵的声音英国改革党经济顾问建议取消养老金三重锁定。平地起惊雷，目前见过英国主流政治圈里位置最有分量的对三重锁定直接开炮的人。当然他能否影响法拉奇为时尚早。之前哪怕那些发表暴论的边缘backbencher议员，也从来不太敢碰这个东西。改革党真上台别的随便怎么整活都行——只要狠下心把三重锁定砍掉，那就是千古功绩！后世都会记得你们！可惜现在为止法拉奇还是在重复养老金钱不够是因为移民和难民占 目前阿比改革的主要计划如下：1、将埃塞俄比亚的政体从议会内阁制转为总统制，总统任期6年，可以连任一次。总理职位则被废除，行政权力全面移交给总统。而新总统则由阿比出任；2、在埃塞俄比亚宪法第39条中删去“民族、族群和人民自决权”，禁止联邦的各个部分自行独", "url": "https://www.zhihu.com/pin/2075156612340265818", "votes": 0, "comments": 19, "feed_ts": 1787541221, "feed_time_str": "08-24 11:13", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "近八成消费者先问 AI 再下单，对商家而言意味着什么？", "excerpt": "怎么说呢？ 这个八成的比例大概率是虚标、注水的，不用太当真，就是行业为了炒热度、炒赛道吹出来的数据，看看就行，没必要当真。 但数据是假的，背后的趋势却是真的。 现在确实有人的消费决策，已经从“搜平台、看攻略、刷评价“，变成了“先问AI”。 不管是出门旅游订酒店、买家电数码、选护肤品，还是找美食、挑生活用品，大家第一反应不再是翻笔记、刷测评，而是直接丢给AI一句话，让它直接给出推荐清单。 但我结合我", "url": "https://www.zhihu.com/question/2075162611490846232/answer/2075177611492434690", "votes": 59, "comments": 5, "feed_ts": 1787540898, "feed_time_str": "08-24 11:08", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "Shein 上市估值从 1000 亿缩水到 270 亿美元，跨境电商快时尚的「黄金时代」是不是过去了？", "excerpt": "不是跨境电商快时尚的时代结束了，而是的全球自由贸易时代快结束了。 早年 Shein 能够跑出来，有几个很关键的外部条件。 欧美有小额包裹关税豁免，中国这边提供供应链，海外线上流量成本低，然后靠着直邮低价模式，迅速席卷海外市场。 但问题是什么吧。 现在这套底层环境已经发生翻天覆地的变化了。 美国已经取消小额包裹免税，欧盟也取消低值包裹的关税豁免，再叠加欧洲各种针对快时尚的环保法案，过去直邮就能卖全球", "url": "https://www.zhihu.com/question/2075160925938479869/answer/2075174858053390458", "votes": 220, "comments": 25, "feed_ts": 1787540241, "feed_time_str": "08-24 10:57", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "林一五", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "他们道出了美国翻盘的最后希望", "excerpt": "美加贸易战再起，四天前特朗普曾表示推迟对加拿大加征新关税的举动，因为两国即将达成协议，卡尼也附和道情况确实如此，然而昨天最后关头谈判还是破裂了，特朗普方面表示是“加拿大不珍惜美国的善意、错过了与美国合作的机会”，而卡尼方面则表示“美国最后关头临时添加条件的行为不符合加拿大人的利益”。 特朗普再次上台后，美国和盟友的关系滑向恶化循环已经不是什么新闻，我们很早以前分析过这主要是源自美国自身的财政困境…", "url": "https://zhuanlan.zhihu.com/p/2075174264093913631", "votes": 44, "comments": 3, "feed_ts": 1787540110, "feed_time_str": "08-24 10:55", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答",  "把这电影单纯归类为反战，就跟骂街一样。 你知道为什么反战电影的内核总是反战败吗？ 因为你不反战败，就在战争发动者那边骗不到票房。受害者那边现在还没缓过来，根本没有能力给予你足够消费。 所以前殖民主义地区的消费力，决定了他们既需要“反战叙事”来满足自己的道德感，又需要反战败视角连接加害者的情感共鸣。 中国人从来就不需要刻意的去复刻加害者已经霸占已久反战模板，尤其是最搞笑的是，日本也tm是个反战影片大", "url": "https://www.zhihu.com/question/2070182701299152586/answer/2073768158117245187", "votes": 142, "comments": 36, "feed_ts": 1787534656, "feed_time_str": "08-24 09:24", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价《欢迎来龙餐馆》这部电影？", "excerpt": "非常好的电影，其中三句话点明了当今中国对外关系上的主旨，而且答案仍然见仁见智。其余的什么美军也好，kb份子也好，都是无关紧要的事，把他们换成外星人和地球原住民，根本不影响电影表达。 1.中国人对美国人说：“没有你们（指西方新殖民主义），哪来这么多恐怖分子？” 2.美国人对中国人说：“你的合伙人炸死了你的朋友，你真的以为这场战争和你无关吗？（你们中国能永远只做国际秩序的受益者，不做国际秩序的维护者吗", "url": "https://www.zhihu.com/question/2070182701299152586/answer/2071173186876601938", "votes": 4255, "comments": 234, "feed_ts": 1787534242, "feed_time_str": "08-24 09:17", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "反复观摩《教父》真的能让一个男人更成熟通透吗？", "excerpt": "我认识的成年人里，没有一个是有魅力、关爱他人或者通情达理的。相反，他们个个看上去都无比粗鄙、庸俗、缺乏教养。所以后来每当人们一遍遍向我重复那些意大利人是多么有爱、多么热爱歌唱、多么无忧无虑的陈词滥调时，我总是很好奇那些电影制作者和编剧到底是从哪儿产生这些想法的 ——马里奥·普佐，《教父文件以及我的自白》（The Godfather Papers: and Other Confessions）那些吹", "url": "https://www.zhihu.com/question/660307217/answer/2075011160848463089", "votes": 248, "comments": 7, "feed_ts": 1787533985, "feed_time_str": "08-24 09:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "高强度用脑人群需要补充什么营养？", "excerpt": "土伦攻城战期间，炮兵总指挥迪泰伊将军和副指挥波拿巴少校的答案是：吃啥补啥，不管是牛脑、羊脑还是猪脑都行。 这位善良的[迪泰伊]将军像慈父对待孩子一般，在丰盛的餐桌前款待大家。他偶尔也会插上几句话。 我记得桌上有道菜是脑，他先盛了些给拿破仑，还说：“归你啦，你可正需要这个！” 鉴于这位年轻军官当时承担了炮兵的全部工作，将军的意思是说拿破仑一个人得用四个人的脑力。 ——格拉内自传作为日后的著名画家，当", "url": "https://www.zhihu.com/question/41474450/answer/2075143710283776750", "votes": 138, "comments": 6, "feed_ts": 1787533626, "feed_time_str": "08-24 09:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "我们正在面临后现代治理问题", "excerpt": "仔细说一下前因后果吧，很多报道聚焦于细节，往往忽视了问题的整体性和社会性。 故事的起因，我认为要从2022年说起。 TFBOY大家都熟，时代峻峰就是TFBOY的母公司。 时代峻峰的所在地是长江国际大厦，也就是这次所在地。 作为TFBOY母公司，时代峰峻还运营孵化着大量后继偶像团队，这些团队被称为二代，三代。 第一代是TFBOY， 第二代是时代少年团，就是马嘉祺那几个， 第三代是TOP登陆少年， 第", "url": "https://zhuanlan.zhihu.com/p/2072794590931953543", "votes": 2648, "comments": 201, "feed_ts": 1787532869, "feed_time_str": "08-24 08:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待《经济学人》关于诺奖得主阿西莫格鲁「世界上最有影响力的经济学家，却不令人信服」的文章？", "excerpt": "别的不谈，我从计量的角度也对毛咕噜的文章产生过质疑。 为了教dynamic panel，我找了毛咕噜的一篇top2期刊，论证democracy对经济增长的影响。毛咕噜的观点当然是democracy牛逼牛逼。 然而仔细看这篇文章的dynamic panel的设计，基本上踩中了dynamic panel的隐蔽雷点： many instruments问题，做dynamic panel最常见的错误，很容易", "url": "https://www.zhihu.com/question/2073711989444931969/answer/2074520166956806949", "votes": 122, "comments": 25, "feed_ts": 1787532721, "feed_time_str": "08-24 08:52", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}];
const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

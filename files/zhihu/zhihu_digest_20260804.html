了。当时群里说征集志愿去湖北后，半小时600多同事报名，刷屏。 我也报了，我有预感会选上我，报名前我和我老婆说：”我报名了“。她说：”那你报吧。“ 我老婆在医院，其实她没跟我说，她比我先报名，只是她的岗位选上概率不大。 那天晚上接到上级电话，问我能不能带一个组去，我说”好“。电话还没挂，我老婆在一旁当场大哭。 领导听到了，说你再考虑下，我说”不用考虑了“。 放下电话，我老", "url": "https://www.zhihu.com/question/2020756222345785502/answer/2043710265942861805", "votes": 2140, "comments": 137, "feed_ts": 1785747726, "feed_time_str": "08-03 17:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "电脑手机小电驴全线涨价，「打工人三件套」同步抬价，如何看待普通人被迫缴纳 AI 税？", "excerpt": "没办法，都这样。 熊彼特的理论逻辑大家应该听过： 新技术先打破旧模式，在破坏之后，再孕育全新的创新、新的产业机会。 但是放到当下的AI身上，现在只看到破坏阶段，真正创造价值的阶段还远远没有到来。 其实这点大家肉眼就能看见了，现在AI正在持续替代大量岗位： 真人出镜短视频、短剧编剧、翻译、文稿撰写，一大批传统工种都受到冲击。 我拿自己亲身经历举个例子好了。 2021、2022年的时候，接稿环境特别好", "url": "https://www.zhihu.com/question/2067576901791638083/answer/2067649523569243392", "votes": 103, "comments": 8, "feed_ts": 1785746062, "feed_time_str": "08-03 16:34", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "UFO", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "聊点真实的，乌克兰到底还能撑多久？", "excerpt": "最近鹅友炒作一个自称乌克兰能源从业者的名叫安东·尼尔曼的人的文章： 这可把我逗乐了。且不说内容没几句真的，我当然知道大弟根本就不心善，但您也没必要搞个重庆大轰炸之后， 汪记媒体的那套笔法，一看就不像是个正经的乌克兰人，倒像是牛弹琴plus。这个安东·尼尔曼的专栏如下： 观察者网合订本按时间顺序走起： 看起来，我是不是应该 起个俄语名字，再编个专家头衔？ 比如 Мошенников，莫申尼科夫，词根", "url": "https://www.zhihu.com/question/599131026/answer/2067648613380100944", "votes": 14, "comments": 0, "feed_ts": 1785745845, "feed_time_str": "08-03 16:30", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "君临财富", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "这个板块，资金抄底了！", "excerpt": "AI抱团瓦解后，市场的支撑完全转向了内需和政策驱动。 今日核电板块大涨，逻辑基本如此。 消息面上，7月31日，国务院正式核准辽宁庄河一期等四大核电项目，合计8台核电机组，预估总投资突破1700亿元。 这是“十五五”规划启动之后，首批落地的核电项目，标志着我国新一轮核电建设周期，正式拉开帷幕。 ………… 先看看上面放行的四大核电项目。 分别是：广东太平岭三期、浙江金七门二期、山东莱阳一期、辽宁庄河一", "url": "https://zhuanlan.zhihu.com/p/2067646067290777300", "votes": 3, "comments": 1, "feed_ts": 1785745586, "feed_time_str": "08-03 16:26", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "其实科创相关的话题，我已经反复讲过很多次了。就之前出过科创逃生指南、逃生指南 2.0，还有反弹指南、反弹指南 2.0，已经把这个全都说完了。就我看很多人会问，怎么迟迟看不到科创逃生指南 3.0？其实已经写好了，只是什么吧？眼下还没有迎来最后那一轮具备博弈价值的反弹机会，所以 3.0 还要往后等等，提前太早发，就没有什么准确性了就说实话，现在这种震荡行情，不适合动手做反弹。我直接给大家说盘面好了，就很多人在卖主力什么的，但实际这几天大家应该能明显感受到什么吧。就主力其实一直在尝试护盘，但是每一次拉升全都没能稳住。就很多散户是不清楚主力拉升反转的核心手法的。就我简单说下好了，就大资金想要发动一轮像样的反转，追求的是用最低成本拉动行情，要不然就成了真金白银无限接盘了，所以主力是必须要考虑接盘成本的。什么时候拉升成本最低？答案是成交量极度低迷的时候。成交流，场内抛压枯竭，少量资金就能快速消化买卖盘，轻松把价格推上去。回看近期盘面，其实主力也在努力，也在反复试探拉升，可是每次刚拉起，上方源源不断的卖盘就会砸下来，这些卖出筹码，来源很杂，散户解套离场、公募机构调仓、大股东减持全都有。但不变的是什么呢？是只要一反弹，抛压立刻涌现。所以你会发现很多时候都是突然弹了一下，后续又被压下去了，这就是主力想拉，尝试了一手，发现卖盘太多，拉的成本太高，直接就放弃了。所以暴涨暴跌交替的震荡格局下，就连主力自己都没法预判什么时候能够真正拉起来，不确定性是拉满的。这个时候做抄底，胜率是极低的。于是问题来了，什么才是安全、标准的底部反弹呢？很简单，充分下跌完成之后，在低位横盘震荡几天，随后稳步缓慢抬升，每天小涨 0.5 到 2 个点，连续走出四五天温和上行。这种反弹，才是确定性比较高的反弹。但注意，即使是这样，也大概率是反弹，不是反转。而等到这个反转周期走出来，并且走出一段时间的时候，那也就是我科创逃生3.0要写到的内容了", "excerpt": "其实科创相关的话题，我已经反复讲过很多次了。就之前出过科创逃生指南、逃生指南 2.0，还有反弹指南、反弹指南 2.0，已经把这个全都说完了。就我看很多人会问，怎么迟迟看不到科创逃生指南 3.0？其实已经写好了，只是什么吧？眼下还没有迎来最后那一轮具备博弈价值的反弹机会，所以 3.0 还要往后等等，提前太早发，就没有什么准确性了就说实话，现在这种震荡行情，不适合动手做反弹。我直接给大家说盘面好了，就", "url": "https://www.zhihu.com/pin/2067646897981076171", "votes": 0, "comments": 16, "feed_ts": 1785745437, "feed_time_str": "08-03 16:23", "category": "pin", "cat_name": "想法动态"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "精神科医生「10级美颜证件照」火了，出诊照却素颜干练，这种反差戳中了什么？为什么大家边笑边把号挂满了？", "excerpt": "不愧是精神科的老师，确实专业。 看完不笑的可以直接确诊抑郁症。 是非常厉害的筛选策略。 高手。 ", "url": "https://www.zhihu.com/question/2066913394364568113/answer/2067646395268519688", "votes": 120, "comments": 3, "feed_ts": 1785745316, "feed_time_str": "08-03 16:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "中午发了一篇，不知道为为什么这种回答也会被荒原。重发。坏人肚子里的坏水基本就是这几种水源吧。其实坏人的悲剧就在于他们永远无法察觉自己的坏水儿。因为它们那沦为残次品的大脑，遇到自我指涉就会宕机，永远不可能产生自省意识并进一步自强。", "excerpt": "中午发了一篇，不知道为为什么这种回答也会被荒原。重发。坏人肚子里的坏水基本就是这几种水源吧。其实坏人的悲剧就在于他们永远无法察觉自己的坏水儿。因为它们那沦为残次品的大脑，遇到自我指涉就会宕机 了，意味着什么？要么这次是韩国历史上，从未出现过的极浅、极快的去杠杆，要么就是去杠杆才刚开始。感觉后者的可能性要大得多。首先，韩国和美国的去杠杆，有本质的区别。美国爆仓的是基金机构，可以整体打包转让给其他机构，一次性清完所有抛压。但韩国很多散户爆仓，不会有一个机构来接走散户的持仓，只能每天零散、机械地强制平仓，持续时间会很长。第二，韩国的监管措施，没有减少现有杠杆的规模。比如新闻里提到的20万亿韩元主权救市基金，实际能动用的现金只有600亿韩元，大部分是政府本来就持有的股票，而且还没确认是否有权限购买二级市场的股票，目前也就只是一个新闻标题。韩国的监管措施到7月底，只落地了两项：一个是暂停上市单只股票的杠杆产品，二是设置3000万韩元的开户存款门槛。问题是，现在已经存在的杠杆规模，并没有被政策削减掉，还是要靠市场自己慢慢出清。第三，市场的现金缓冲比峰值时减少了23%。从6月24日到7月30日，这36天之内，保证金余额只降了6.4万亿韩元，但投资者存在券商那里的现金少了31.8万亿韩元。这些流出的现金，一部分亏在了补保证金，一部分是散户在下跌过程中买股票用掉了，还有一小部分转了出去。接下来的去杠杆，现金缓冲更薄了，再加上韩国央行7月中旬会加息，杠杆成本变高，出清压力就更大。", "excerpt": "韩国散户还在慢慢爆仓中周末这篇我们就分析过，虽然上周五韩国股市气势汹汹， SK海力士涨了30%，但韩国股市的去杠杆并没有结束。今天继续去杠杆，SK海力士和三星电子跌了近9%，KOSPI下跌5%。上周末这篇文章分析过韩国去杠杆的进度和阻力。韩国保证金余额的峰值，是2026年6月24日38万亿韩元；到7月30日，降到32万亿韩元，只跌了17%。回顾韩国历史上的去杠杆周期：• 2020年和2022年：保", "url": "https://www.zhihu.com/pin/2067640807415362885", "votes": 0, "comments": 10, "feed_ts": 1785744516, "feed_time_str": "08-03 16:08", "category": "pin", "cat_name": "想法动态"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "《我怎麼可能成為你的戀人，不行不行（也不是不可能）》75话完结。真有趣，普通什么的就见鬼去吧，本身女生与女生谈恋爱也不普通吧，那么为什么要被恋爱必须一对一交往的普通常识约束呢？逻辑上算凑合，不过这种一人退出后会伤心为另一人祝福的前提，本身就不能叫普通了。真该让那些打着后宫旗号，最后悬崖勒马的混蛋漫画家们看看。 #日本漫画  #漫画  #动漫  #日本动漫 ", "excerpt": "《我怎麼可能成為你的戀人，不行不行（也不是不可能）》75话完结。真有趣，普通什么的就见鬼去吧，本身女生与女生谈恋爱也不普通吧，那么为什么要被恋爱必须一对一交往的普通常识约束呢？逻辑上算凑合，不过这种一人退出后会伤心为另一人祝福的前提，本身就不能叫普通了。真该让那些打着后宫旗号，最后悬崖勒马的混蛋漫画家们看看。 #日本漫画  #漫画  #动漫  #日本动漫 ", "url": "https://www.zhihu.com/pin/2066901924817924110", "votes": 0, "comments": 7, "feed_ts": 1785744308, "feed_time_str": "08-03 16:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《凡人歌》月薪 2 万的沈琳为什么愿意卖卤肉？", "excerpt": "0109晚更新： 我看到评论区有些朋友说其实是我不理解打工人，emmm有没有可能我也是打工人咧？ 店是我爸妈和我叔婶在做，我和我妹、堂妹都没在家，都是在外打工！ 本来我们是10号发工资的，但因为10号是周末，所以就提前今天9号发了。 我这个工资可能在知乎不算什么，但应该也算可以了吧？？ 但你让我回家干，我是不愿意干的！为什么？ 我叔早上10点就得起床，然后开车去佛山那边的宰牛场。你不能晚了，因为晚", "url": "https://www.zhihu.com/question/667537804/answer/1992361848524272370", "votes": 1375, "commen N", "verb_cn": "发布了想法", "title": "我感觉今年下半年，我们到底会不会出大规模经济刺激，可能更多会看美国怎么走。如果美国重复2020那波大放水、大降息，全球需求回暖、我们外贸稳得住，那国内大概率不会出任何大招刺激。但反过来，如果美国持续高利率、甚至继续加息，把全球经济干崩，外贸彻底熄火，那我们的重磅刺激、兜底政策，一定会准时落地。我把几十年的经济周期规律捋一遍好了。我们国内每一轮经济走弱，根源几乎全部是外贸崩了。1998年亚洲金融风暴，外资撤退、外单归零，国内大面积下岗，最后靠加入WTO、重启外贸救回来。2008年全球危机，外贸直接瘫痪，工厂倒闭潮出现，我们靠四万亿基建强行托底。2015年全球需求疲软、人民币升值、出口压力爆表，我们靠房地产去库存稳住底盘。2018年贸易战开打，出口全面承压，又是靠地产托底三年，叠加疫情海外订单回流，硬生生撑住了经济。所以规律非常清晰：过去二十年，外贸一崩，内需补、政策顶、举债托底。但现在最大的变化是：我们的债务率、杠杆率、房地产空间，已经没有以前的容错空间了这就是为什么今年高层思路极度克制：消费弱、地产弱、销量弱，但是坚决不放水、不刺激、不透支未来。其实也是在等一个风险落地。现在欧洲加息、日本加息、澳洲加息、韩国维持高利率，全球货币环境整体是收紧的。如果后续美国继续开启加息周期，欧美消费降温，全球需求收缩，而我们的外贸，一定会二次承压。到那个时候，才是政策弹药全力出手、对冲下行压力的真正窗口。其实现在的路很清晰了：美国如果走2020降息放水路，外贸稳住，我们就不用刺激。美国如果持续紧缩干崩全球，外贸塌方，我们就开启全面托底。我感觉目前我们就在等这个了。", "excerpt": "我感觉今年下半年，我们到底会不会出大规模经济刺激，可能更多会看美国怎么走。如果美国重复2020那波大放水、大降息，全球需求回暖、我们外贸稳得住，那国内大概率不会出任何大招刺激。但反过来，如果美国持续高利率、甚至继续加息，把全球经济干崩，外贸彻底熄火，那我们的重磅刺激、兜底政策，一定会准时落地。我把几十年的经济周期规律捋一遍好了。我们国内每一轮经济走弱，根源几乎全部是外贸崩了。1998年亚洲金融风暴", "url": "https://www.zhihu.com/pin/2067626640864179870", "votes": 0, "comments": 72, "feed_ts": 1785740605, "feed_time_str": "08-03 15:03", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "7 月统计局制造业 PMI 降至 49.2，供需均收缩致生产经营活动放缓，这反映了制造业的哪些挑战？", "excerpt": "我感觉今年下半年，我们到底会不会出大规模经济刺激，可能更多会看美国怎么走。 如果美国重复2020那波大放水、大降息，全球需求回暖、我们外贸稳得住，那国内大概率不会出任何大招刺激。 但反过来，如果美国持续高利率、甚至继续加息，把全球经济干崩，外贸彻底熄火，那我们的重磅刺激、兜底政策，一定会准时落地。 我把几十年的经济周期规律捋一遍好了。 我们国内每一轮经济走弱，根源几乎全部是外贸崩了。 1998年亚", "url": "https://www.zhihu.com/question/2066483823928422483/answer/2067626548992140305", "votes": 142, "comments": 40, "feed_ts": 1785740584, "feed_time_str": "08-03 15:03", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "正解局", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "中国人在拍照这事儿上，开始扬眉吐气了", "excerpt": "说到拍照谁厉害？ 你可能会想到苹果手机、索尼相机。 但，现在，已经未必了。 三十年河东三十年河西，大家可能没注意到一个有意思的变化：几年前你出门旅游，很多人基本脖子上挂台佳能尼康，那叫专业，要是换成索尼微单，那叫懂行。 用苹果手机拍照，那叫有面子。 但是现在你再看城市街头巷尾、景区、海边，或者你的朋友圈，要么是举着大疆云台、揣着影石全景相机，要么是用华为、vivo拍大片的人。 你以为懂行的只有国人" xcerpt": "恰好相反，美法德俄的新坦克才是真的点歪了，最重要的工程思路点歪了，贪大求全外加思维落后。 美国五代坦克M1E3 重量65吨左右，这还是在“著名”的M1A3SEPv3骇人的80吨减装甲加电子设备而来 德国新一代坦克KF51黑豹 全重约为60吨 法国勒克莱尔XLR 全重62吨 俄罗斯阿玛塔也不会低于60吨 西方包括俄罗斯的都指望把武器系统、电子系统、装甲集成于一台车，当然基于现实，也好卖。同时也是甲弹", "url": "https://www.zhihu.com/question/1949049430184531730/answer/2000285972710053754", "votes": 746, "comments": 189, "feed_ts": 1785724316, "feed_time_str": "08-03 10:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么一些商场开始对「宠物友好」踩下刹车？", "excerpt": "原来友好，现在不友好，你就要考虑是因为什么导致不友好的。 1818黄金眼里面有一个女生找酒店维权，说酒店工作人员把自己狗的牙齿打断了。 某天她带着狗出去旅游，住进了一家宠物友好酒店。 酒店里面有一片草地，里面散养了三只羊。 她牵着狗去草地里玩，刚刚走到草地的时候就看见了这三只羊。 她家的狗没有见过羊，反应比较大，虽然狗牵了绳，但是实在拉不住，狗就跑过去把羊咬了。 狗主人在旁边看着，也舍不得打狗，一", "url": "https://www.zhihu.com/question/2014643586784834095/answer/2067556921633142511", "votes": 1051, "comments": 159, "feed_ts": 1785723985, "feed_time_str": "08-03 10:26", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "网传马前卒劳动投入回报比例不如双尾彗星，如何看待这件事？", "excerpt": "双尾彗星是赚钱的奇才，这个我非常确定。 他搞的活，真的很有意思。 他有一个项目是这样的，他搞付费咨询，有些富哥就是喜欢给他打赏，但又不知道该问什么。但有些穷哥们没钱付费咨询但确实需要一些“指导”，所以他搞了个付费咨询的池子，富哥只需要往里打钱就行了，穷哥们则可以排队申请咨询名额。 艹，太吊了。 穷哥们白嫖了服务，但他们对富哥报以感谢。 富哥体会到了打钱的快乐，同时增值服务是他们帮助了穷哥们，获得了", "url": "https://www.zhihu.com/question/1976362321594057154/answer/2052773534712213768", "votes": 659, "comments": 63, "feed_ts": 1785723878, "feed_time_str": "08-03 10:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "《奥德赛》周末开始在 IMAX 和 CINITY 大规模点映了（据说平均上座率高达 90%左右），我身边很多朋友都看了，所以大家会频繁看到一些关于 IMAX GT 的说法。我在这里给不了解 IMAX GT 的普通观众简单解释一下。诺兰导演的《奥德赛》是第一部全程使用IMAX 65mm 胶片拍摄的电影，放映格式是 70mm 胶片 1.43:1画幅，所以理论上最佳放映画幅应该是 1.43 画幅。但目前大陆地区没有胶片 IMAX 厅，只有四家 IMAX GT 厅可以完整放映 1.43 画幅，北京地区只有中国电影博物馆一块。这就直接导致一票难求，而且票价很贵（电影博物馆的IMAX GT 票价是 183 起，差不多等于一分钟一块钱的样子）。作为一种不可避免的稀缺性资源，IMAX GT 的电影票势必会很紧俏，可能很多朋友都无缘看到 1.43 画幅的《奥德赛》。但现在已经不是2009 年放映《阿凡达》那会儿了，现在国内有将近 800 块 IMAX 银幕，它们都能放映 1.9:1 画幅的《奥德赛》。所以如果不是极致追求的话，普通 IMAX 和激光 IMAX 银幕足以满足绝大多数观众的观影需求。除此之外，国内现在还有至少 250 块以上的 CINITY 银幕，其中还有至少 67 块 CINITY LED 银幕。因为 CINITY 是中影和华夏联合开发的中国自主格式，所以《奥德赛》在 CINITY 厅放映的也是 1.9 画幅。从我自己的观影体验来说， CINITY LED 厅看《奥德赛》可能是仅次于IMAX GT 的选择，因为 LED 屏是自发光的，所以亮度非常亮。而《奥德赛》有大量昏暗室内场景和夜戏， CINITY LED 厅看可以保留非常多暗部细节。当然如果你对视听要求很极致，那IMAX GT 的 1.43 画幅仍然是不可替代的。因为《奥德赛》是胶片拍摄的，所以IMAX GT 银幕上的胶片颗粒感保留的也更好。但这一点可能对于绝大多数观众来说，不说没有意义吧但确实意义不大。最后，看电影这种事情丰俭由人，如果不想折腾或者觉得特殊厅太贵，普通厅观影问题也不大。因为一部好电影并不全是由画幅来决定的。普通影厅的2.35：1 画幅其实也保留了画面的所有关键信息，不会影响观影体验。我用《奥德赛》的剧照大概示意了一下不同画幅的画面感觉，原图是 1.43 画幅，黄线是 1.9 画幅，红线是 2.35 画幅（不是非常精确，大致示意，仅供参考）。大家可以看到，特殊画幅上下多出来的部分，其实并没有关键信息，只是场景延伸。当然电影构图也是电影的重要组成部分，并不是说不同的构图没有区别。只是大家在选择观影方式时，可以量力而行，丰俭由人。毕竟画幅虽然是视觉奇观的重要组成部分，但并不是唯一元素。", "excerpt": "《奥德赛》周末开始在 IMAX 和 CINITY 大规模点映了（据说平均上座率高达 90%左右），我身边很多朋友都看了，所以大家会频繁看到一些关于 IMAX GT 的说法。我在这里给不了解 IMAX GT 的普通观众简单解释一下。诺兰导演的《奥德赛》是第一部全程使用IMAX 65mm 胶片拍摄的电影，放映格式是 70mm 胶片 1.43:1画幅，所以理论上最佳放映画幅应该是 1.43 画幅。但目前", "url": "https://www.zhihu.com/pin/2067032374118970228", "votes": 0, "comments": 14, "feed_ts": 1785723838, "feed_time_str": "08-03 10:23", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "半导体设备，自我发出预警。已下跌超40%", "excerpt": "半导体设备，自我发出预警。已下跌超40%", "url": "https://www.zhihu.com/pin/2067555785828200952", "votes": 0, "comments": 24, "feed_ts": 1785723717, "feed_time_str": "08-03 10:21", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "JNIM的埃米尔贾法尔·迪科在布基纳法索呼吁富尔贝人加入战斗，同时否认在萨赫勒国家以族裔标签进行斗争的有效性。他表示，伊玛目金多和其他支持军政府的布道者一样，都是被利用的对象，一旦失去利用价值就会被噤声。#西非  #布基纳法索  #伊斯兰教  #世界历史  #人文 ", "excerpt": "JNIM的埃米尔贾法尔·迪科在布基纳法索呼吁富尔贝人加入战斗，同时否认在萨赫勒国家以族裔标签进行斗争的有效性。他表示，伊玛目金多和其他支持军政府的布道者一样，都是被利用的对象，一旦失去利用价值就会被噤声。#西非  #布基纳法索  #伊斯兰教  #世界历史  #人文 ", "url": "https://www.zhihu.com/pin/2067339380654597014", "votes": 0, "comments": 6, "feed_ts": 1785723580, "feed_time_str": "08-03 10:19", "category": "other", "cat_name": "社 的角度去理解。 理解日本发动战争的可能性也是一样，如果你从中美对抗整个战场空间去理解你就会发现日本主动发动战争是大概率事件。二战以后日本自始至终都不具备“棋手”的可能性，地域狭小也不存在充当“棋盘”的可能，它从头到尾就是一个棋子。作为棋子，被用来压缩中国战场空间、替美国争取战场主动，从战争学的角度去看是合理的。 关于这一点简单说明一下，日本战后主要", "url": "https://www.zhihu.com/question/2020276324380460541/answer/2067550146179621117", "votes": 563, "comments": 45, "feed_ts": 1785722368, "feed_time_str": "08-03 09:59", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "宝郁", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "关羽斩颜良是不是被吹过头了?", "excerpt": ". 这是北京工体，大概能容纳八万人。 就姑且算四边各自能容纳两万人。 颜良在此处，就在那个黄框框下面一片站着。 现在给题主一千申花球迷，然后带头冲进这两万傻B国安……啊不是，两万颜良军里。 请把颜良找出来，再砍下韩佳琪的脑袋，别在裤腰带上，全须全尾离开工体。 只要能回来，保你在天津封猴！ . ", "url": "https://www.zhihu.com/question/497219566/answer/29820759419", "votes": 1986, "comments": 106, "feed_ts": 1785722275, "feed_time_str": "08-03 09:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "林一五", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "聊聊《蜘蛛侠4》和《奥德赛》", "excerpt": "昨天带娃去看了《蜘蛛侠4》，前一天晚上因为熬夜看EWC街霸6的总决赛所以没有睡够，本来准备到电影院再补补觉，没想到全程一直没犯困。《蜘蛛侠4》不能说有多惊艳，但是对得起票价，非常工整。 相比之下上个月带娃去看《争洛阳》，电影也很工整，体现了当下中国电影工业化的水平，但似乎在讲故事和调动情绪方面技术还是生疏了一点，做加法和做减法都有点怪怪的，虽然快结尾的部分张飞那句“三姓家奴”和关羽出场时的“铛铛铛", "url": "https://zhuanlan.zhihu.com/p/2067545767032648016", "votes": 10, "comments": 2, "feed_ts": 1785721361, "feed_time_str": "08-03 09:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "夜色渐深，深夜宵夜局，和刘冲老师@漫画家刘冲-LDART 促膝长谈。从《龙漫少年星期天》的纸媒旧时光，聊到国漫这些年的起起伏伏。甚至还有幸可以听到老师解析每一个故事情节“彩蛋”外人只看得见作品呈现出来的光鲜，只有创作者明白，背后是日复一日的孤独、煎熬、取舍与坚守。满腔热血，夹杂现实里诸多无奈，心底那份创作执念却从未熄灭。时代浪潮来来去去，依旧有人沉下心执笔作画。漫漫长路，愿所有坚守原创手绘的创作者，都能被看见。🌙", "excerpt": "夜色渐深，深夜宵夜局，和刘冲老师@漫画家刘冲-LDART 促膝长谈。从《龙漫少年星期天》的纸媒旧时光，聊到国漫这些年的起起伏伏。甚至还有幸可以听到老师解析每一个故事情节“彩蛋”外人只看得见作品呈现出来的光鲜，只有创作者明白，背后是日复一日的孤独、煎熬、取舍与坚守。满腔热血，夹杂现实里诸多无奈，心底那份创作执念却从未熄灭。时代浪潮来来去去，依旧有人沉下心执笔作画。漫漫长路，愿所有坚守原创手绘的创作者", "url": "https://www.zhihu.com/pin/2067221859943372093", "votes": 0, "comments": 0, "feed_ts": 1785721215, "feed_time_str": "08-03 09:4 067388757431562988", "votes": 307, "comments": 32, "feed_ts": 1785716370, "feed_time_str": "08-03 08:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "十几年前，我的价值观是这个世界应该对所有人都公平，人人生而平等，应该拥有平等的权利...但现在我的价值观确实变了。因为我终于发现，这个世界有好人，有恶人。为什么要对好人和恶人一视同仁的平权？所以，现在也明白那句“最广大人民”的概念了。首先，人民之外还有被镇压的敌人。而人民之内，也有一些是不利于多数人民和人民整体的少数，是天性恶劣的人民，只不过突破道德不一定突破法律，无法将其精准排除出人民的队列...那么，只有“最广大”才是最精准的用词。因为恶人是少数极端，他们从自然分布规律和概率上，不可能占多数。“最广大”之外的这部分少数，就是应该被抑制的人。对这些人如果不抑制，他们会利用舆论声量的杠杆效应，以少数之声扩为伪大众之音，混淆视听，带偏节奏，产生放大效应下的社会危害。所以，需要抑制。道德，不是烂好人那种对所有人都好。烂好人其实是不健康的讨好型人格，属于人格缺陷。他们会纵容恶人。实际上经常会助纣为虐，成为恶的帮凶，谈不上好。真正的道德，是团结好人，镇压恶人，团结正常人，抑制极端人。这世界，其实充满险恶。因为人性，参差不齐。历史之所以总有一次次悲剧出现，就是因为君子和不同，小人同而不和。君子有边界感，不冒犯，所以经常会会有距离。凝起来的条件太苛刻。但只要小人为利而同、而聚很容易，那就是形成了组织。有组织的少数恶人对无组织的多数好人，也会成凌驾之势。所以这世界最难的事，是让好人抱团。好人抱团强过坏人抱团强过坏人落单强过好人落单...因为君子不容易凝聚，但一旦凝聚就是团结。小人虽然经常凑在一起，但也更容易为了蝇头小利内耗内斗，更容易利尽而散、势去而倾。落单的好人，有心无力被人欺。有组织的好人，才能廓清环宇。真正的道德，是团结好人，服务好人，守护好人。所谓世道好，就是好人站上风。所谓世风差，就是坏人占上风。好人可以好，但不能软弱。", "excerpt": "十几年前，我的价值观是这个世界应该对所有人都公平，人人生而平等，应该拥有平等的权利...但现在我的价值观确实变了。因为我终于发现，这个世界有好人，有恶人。为什么要对好人和恶人一视同仁的平权？所以，现在也明白那句“最广大人民”的概念了。首先，人民之外还有被镇压的敌人。而人民之内，也有一些是不利于多数人民和人民整体的少数，是天性恶劣的人民，只不过突破道德不一定突破法律，无法将其精准排除出人民的队列..", "url": "https://www.zhihu.com/pin/2067520572838385077", "votes": 0, "comments": 5, "feed_ts": 1785715999, "feed_time_str": "08-03 08:13", "category": "pin", "cat_name": "想法动态"}];
const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

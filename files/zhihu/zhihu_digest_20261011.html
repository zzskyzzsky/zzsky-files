 "comments": 0, "feed_ts": 1791625450, "feed_time_str": "10-10 17:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大水哥", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "怎么感觉英国排队枪毙战术在野战情况下是可以被拿着木棍的军队破解的？", "excerpt": "不存在排队枪毙战术，所谓的排队枪毙是因为完全没理解近代作战体系。 主力步兵线列化是因为火炮小型化标准化而形成的。 火炮小型化可以跟随军队野战，大型火炮只能用于围城无法野战。标准化降低火炮的生产和维护成本，可以大批量装备部队。火炮的设计精度和威力越来越大，火炮部队也越来越专业化，火炮逐步成为输出的主力。 步兵必须以线列的方式部署才能有效降低火炮的伤害。如果按照知乎军事家的巧思部队应该集中在一起，那么", "url": "https://www.zhihu.com/question/2003029642920075537/answer/2092308645480551410", "votes": 21, "comments": 1, "feed_ts": 1791625254, "feed_time_str": "10-10 17:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "可不可以莫名其妙地教我一个知识?", "excerpt": "既然你问得这么没头没脑，那我就莫名其妙教你一个在学术界、职场甚至相亲市场上都极度好使，但极少有人挑明了说的心理学现象： “自行车棚效应”（Law of Triviality / Parkinson&#39;s Law of Triviality）。这个概念是英国学者诺斯科特·帕金森在1957年提出来的。他举过一个特别荒诞但也极其真实的例子： 一个委员会要审批两项工程预算。 第一项是建一座价值数千万", "url": "https://www.zhihu.com/question/2072260638768997299/answer/2092298595101848201", "votes": 6, "comments": 0, "feed_ts": 1791624867, "feed_time_str": "10-10 17:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "德国教材「很多中国人没有汽车，出行靠自行车或步行」等内容引争议，这真是现行教材吗？为何会出现这种错误？", "excerpt": "我都不需要点进来看，我都知道，这个问题下面百分之一万有人说： “中国确实有很多人没有车啊” 这就是为什么我说欧美人玩政治狗哨领先国内一百年，你真的不得不服他们在这个搬弄文字上面的能力。 这个教材是人都知道它在暗示中国的落后（不懂得去看高赞回答，有教材原文原图），一种极其典型的刻板印象。然而，它又是个狗哨，你想给它辩护简直太容易了 有些人就可以反问：中国确实有很多人没有汽车啊？ 真的，完全没脾气。狗", "url": "https://www.zhihu.com/question/2089638530678875180/answer/2090231457071605373", "votes": 352, "comments": 15, "feed_ts": 1791624075, "feed_time_str": "10-10 17:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "男人的快乐有多简单？", "excerpt": "本人男，45岁，刚离婚，小孩归前妻，我独居； 周一到周五，7：30起床，把早餐上蒸锅，再做一套八段锦， 做完10分钟，开始吃早餐，一个包子一个蒸蛋， 吃完准备一下，出门上班，到单位8：25，烧水泡茶，开电脑，把今天的工作先过一遍； 水开泡茶 ubstack平台上专注于写Christian Rebirth的宗教话题。这本身是个极其符合刻板印象的美国基督教白人劳保女性。但当你把这些特征，跟“汉男丈夫、汉人姓氏、五个汉姓混血娃”的事实结合在一起时，这就变成了非常雷霆的赢学案例。这里顺便纠正一些简中刻板印象。很多人总觉得美国越是红脖子、越是基督教老保就越排外，华男就越没有机会，必须得去硅谷或西雅图这种科技中心才行。然而实际情况恰恰相反。越是硅谷这种科技中心的白女，越是容易目睹“大量牛排女+大量自恨男”的经典组合，进而对华人产生骨子里的鄙视。反而是那些远离了“黄白二元有毒氛围”的小镇红脖和基督教劳保，就算总体上对汉男也谈不上很友好，但也比硅谷那种粪坑要强不少。楼下的案例虽然没透露具体姓名，但情节更加魔幻现实。这是一位在藤校任教的分子生物学俄裔女教授，同样是因为随了汉人老公的姓氏，导致她日常经历了一系列幽默：每到开学，新学生以为自己选了个华人教授的课，结果一进办公室，迎面看到一个瘦瘦小小的俄裔白女，当场认知错乱。更离谱的是，因为她这个华人姓氏加上顶级学术身份，某个神秘东方大国的一些高校科研机构，经常在领英上对她的账户进行精准轰炸，各种发私信试图把她挖回祖国效力。这大概就是汉姓在当今地缘政治下自带的独特魅力吧。", "excerpt": "外国随夫姓这个现象，除了大家熟知的魔法对轰之外，其实还存在一个非常有趣的灯下黑雕花方向。现在大家在网上或者邮件里看到“白人饭名字+华人单音节姓氏的组合”，第一反应大概率是这人是个黄皮白心的高华二代。就算不是黄种人，那顶多会当成汉男的混血小孩了。但很多人还忽略了一个群体，那就是汉男的白人妻子本人，很多也是“白名汉姓”的组合。在北美很多地方，当人们第一次在名单上看到这类名字，下意识都以为对方是个华裔女", "url": "https://www.zhihu.com/pin/2091619877668779515", "votes": 0, "comments": 122, "feed_ts": 1791613801, "feed_time_str": "10-10 14:30", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "风靡世界的儿童文学反派遭遇娘化，却让人们再次疯狂", "excerpt": "姬友们喜欢看《哈利波特》吗？ 虽然不知道比例有多少，但大概是会有的。作为风靡世界的知名儿童文学IP，HP在各个领域都有数不清的成就和粉丝。原作派、电影派、电视剧派，甚至是游戏党，都可以说出一串自己喜欢的地方。 而要提到二创的话，更是随便掰下一小块都能压死一大批冷圈。最近，不知是文艺复兴还是娘化万物萌定律起了作用，娘化马尔福再次出现在人们视野中，并瞬间带起了世界级别的二创热潮。 要说娘化马尔福这个概", "url": "https://zhuanlan.zhihu.com/p/2090776218421536332", "votes": 16, "comments": 0, "feed_ts": 1791613283, "feed_time_str": "10-10 14:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "“波斯人体面”的印象，可能也就中日韩，再加上一些泛印欧白右会持有。在真正熟悉波斯人的群体眼里——比如因为朝圣经常线下碰到他们的“什叶派好兄弟”南伊拉克人——波斯人的日常形象，就是身上有股刺鼻的大蒜洋葱味，和体面一点也不沾边。除了南伊拉克人外，普什图人、库尔德人、南阿塞拜疆人对波斯人的审丑也同样非常激烈。在马圣开源之前，中文加英文社区的审丑素材非常有限。来回来去基本就是些历史梗、辱神棍政权梗和人种梗。在这套语境里，不体面的事物要么是神棍的锅，要么是突厥人阿拉伯人的锅，“普通波斯人”一直扮演着“不粘锅”的文明体面形象。本来汉人持有这种滤镜也没啥，但问题是，推特上的波斯男，以及部分“平原塔吉克”（平原塔吉克相对中立，有非常毒的也有比较友好的，伊朗境内波斯男几乎一边倒的恶意满满）是我见过对汉人单向恶意最严重的群体之一。从裤裆，到饮食，到青虫，到历史（比如疯狂刷安禄山减三千万的梗），全方位恶意拉满。虽然最近半年，伊朗对汉男的菲勒斯友好案例大井喷。但菲勒斯归菲勒斯，如果像外蒙和哈萨克那样，虽然菲勒斯友好但嘴实在太臭，那即使菲勒斯友好也必须坚决对线。而且汉人平时对俄罗斯、对越南的“审丑言论”一点也不少，但现实中同样不影响菲勒斯友好。至于从皇汉的角度看，确实汉人对波斯天然倾向于共情，我在过去也是如此。但凡事都要讲究一个“对等”。目前波斯男的状态，就算他们是伊朗的主体民族基本盘，那在现阶段也是“敌基本盘”。能让敌基本盘加速趋势的力量，不管是神棍政权，还是牢美，还是阿塞拜疆人，我通通都是支持态度。如果搞成“俺寻思这个民族的历史遭遇像汉人，俺就盲目上去共情”，那不过是另一种的巴结学和自作多情。最后，说到饮食审丑，还要感谢一位南阿塞拜疆兄台贡献的素材。其实这家吃的好像是一种蚂蚱（Chanjaneh），并不是阿塞拜疆人说的吃蟑螂，所以不见得有多么“不洁净”。但不论如何，这个极具视觉冲击力的画面对波斯人来说都构成了完美的“回旋镖”。下次推特波斯男再说什么 bug eating c**nk 的时候，直接把这张图拿来怼回他们的脸上。链接 链接 ", "excerpt": "“波斯人体面”的印象，可能也就中日韩，再加上一些泛印欧白右会持有。在真正熟悉波斯人的群体眼里——比如因为朝圣经常线下碰到他们的“什叶派好兄弟”南伊拉克人——波斯人的日常形象，就是身上有股刺鼻的大蒜洋葱味，和体面一点也不沾边。除了南伊拉克人外，普什图人、库尔德人、南阿塞拜疆人对波斯人的审丑也同样非常激烈。在马圣开源之前，中文加英文社区的审丑素材非常有限。来回来去基本就是些历史梗、辱神棍政权梗和人种梗", "url": "https://www.zhihu.com/pin/2091292776424009950", "votes": 0, "comments": 40, "feed_ts": 1791613033, "feed_time_str": "10-10 14:17", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中欧经贸谈判后发布联合声明，达成多项共识，有什么影响，后续会达成最终共识和协议吗？", "excerpt": "又一个欧盟的日耳蛮赢学罢了 媒体报道的是“China agreed to &#34;halve HEV, PHEV exports&#34; (hybrid cars) to the EU 中国同意将混合动力汽车（HEV、PHEV）出口到欧盟的数量减半” 然而参与谈判的欧盟委员会贸易和经济安全委员马罗什·谢夫乔维奇的原话是“According to the projection we have, ", "url": "https://www.zhihu.com/question/2091993946822014297/answer/2092210445411148367", "votes": 191, "comments": 18, "feed_ts": 1791612723, "feed_time_str": "10-10 14:12", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "泽连斯基是如何得罪李在明的？", "excerpt": "没那么多说道，就是司机上场前吸嗨了，脑子一片浆糊导致的口无遮拦。 从韩国的反应来看，肯定是却有保密协议这一茬的。 但司机说都已经说了，又没法承认自己确实违反了保密协议，乌克兰只能咬死硬犟没有保密协议。 但结果如何其实无所谓，乌韩本质都是美国的傀儡国，隔空喊喊话吵吵架给国民一个交待就行了。 最终还是会跟着美国的指挥棒起舞的，不产生实质国际关系影响。 ", "url": "https://www.zhihu.com/question/2089494700281668741/answer/2091556332704883898", "votes": 75, "comments": 2, "feed_ts": 1791612445, "feed_time_str": "10-10 14:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹小灵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "武汉大学学者称「高额彩礼只是表象，男女比例才是根本」，如何看待这一观点？", 092210557961106328", "votes": 0, "comments": 1, "feed_ts": 1791601868, "feed_time_str": "10-10 11:11", "category": "pin", "cat_name": "想法动态"}, {"actor": "朝花夕拾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为啥年工资二十万的人好多都自我感觉是中产？", "excerpt": "中产区别于底层和富裕阶层，本来就是最广泛的群体。 不要说年收入二十万，只要你需要交个税，基本就可以认定为中产了。 很多人眼里的中产，其实是相对富裕的家庭了。 ", "url": "https://www.zhihu.com/question/2053963595952738389/answer/2092210469763298998", "votes": 0, "comments": 0, "feed_ts": 1791601849, "feed_time_str": "10-10 11:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "糜芳为什么会对刘备集团失去信心?", "excerpt": "麋芳这个人，跟着刘备从公元194年到公元219年，整整二十五年。 二十五年是什么概念？ 刘备在徐州被吕布赶跑，麋芳跟着。 刘备投曹操寄人篱下，麋芳跟着。 刘备被曹操撵得老婆孩子都丢了，麋芳跟着。 刘备在新野县城当了六年多的县处级干部，麋芳跟着。 刘备被曹操追得在当阳长坂差点全军覆没，麋芳还是跟着。 这种日子，换谁也得掂量掂量。 但他都忍了。 结果呢？ 等到刘备拿下益州，拿下汉中，关羽水淹七军威震华", "url": "https://www.zhihu.com/question/428498323/answer/2086121151168786573", "votes": 4065, "comments": 456, "feed_ts": 1791601648, "feed_time_str": "10-10 11:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "朝花夕拾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "教女儿“不要太辛苦，找个有钱人嫁了”和教她“哪怕孤独终老也要经济独立”，你觉得哪种才是真正为她好？", "excerpt": "无论男女，只有经济独立才有尊严。 找个有钱人嫁了，本质上还是依附关系。 感情再好，结了婚又怎么样？婚姻不是终点。 感情是会变的，婚姻关系里面，女方如果没有足够的筹码和底气，指望男方一直不变心，一直不计较单方面的经济供给，一直平等待人，这种脆弱的平衡能维持多久？ 何况，有钱人也没那么多，人家也不是傻的。 ", "url": "https://www.zhihu.com/question/2069144714918508088/answer/2092209534697747563", "votes": 0, "comments": 0, "feed_ts": 1791601625, "feed_time_str": "10-10 11:07", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "新知PLAYGROUND发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "假如可以送小时候的自己一个礼物，不限价格，你会送什么？知乎「所有人问所有人」第五期正式上线！这一次，我们把话筒递给了大人，也递给了小朋友。有人想送小时候的自己一件漂亮衣服，有人想送TA一只小狗作伴，也有人只想送TA一句：吃好点、玩好点。礼物是送给小时候的自己，安慰的是现在的你。今天是 10月10日世界精神卫生日，这个问题也留给你：「假如碰到小时候的自己，你会对他说什么？」💬知乎与联合发起方壹基金邀请你一起作答，给小时候的自己回封信～ #所有人问所有人   #2026共益众创  #写给小时候的自己  ", "excerpt": "假如可以送小时候的自己一个礼物，不限价格，你会送什么？知乎「所有人问所有人」第五期正式上线！这一次，我们把话筒递给了大人，也递给了小朋友。有人想送小时候的自己一件漂亮衣服，有人想送TA一只小狗作伴，也有人只想送TA一句：吃好点、玩好点。礼物是送给小时候的自己，安慰的是现在的你。今天是 10月10日世界精神卫生日，这个问题也留给你：「假如碰到小时候的自己，你会对他说什么？」💬知乎与联合发起方壹基金邀", "url": "https://www.zhihu.com/pin/2092010616877736908", "votes": 0, "comments": 0, "feed_ts": 1791601458, "feed_time_str": "10-10 11:04", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "我一直以来的观点是：AI本身在技术上没有泡沫，泡沫是被强行加上去的。这个“强行”来自两个方向。一方面是美国的债务处理需求——信用货币时代积累的庞大债务需要一个足够大、足够有想象力的资产端来承接；另一方面是整个欧美经济体对一个“资本主义弥赛亚”的渴求——它们需要一个垄断性标的来支撑养老金、401(k)、货币基金和整个金融体系的账面价值。AI被选中了，于是被赋予了巨量的金融叙事，简直成了西方经济的救世主。它被迫背上了这些泡沫。也可以从另一个路径来聊。美国产业发展本身就有一条经典路径：先做噱头、造叙事，吸引资本进入，形成超额利润，然后充分竞争，技术逐步下沉到社会中下层。这个过程需要的时间比较久。但美国的债务危机、欧洲的债务危机，都是迫在眼前的。资本等不了那么久，所以AI这一轮动作变形，非常非常正常。至于数学这件事，可以大致理解为：AI弄了一大堆未经验证的东西，甚至不少是AI幻觉生成的内容，当作数学论文扔了出来。里面很多命题的验证周期极长——几个月、几年，甚至十年左右。而实际在验证完成之前，AI企业靠这个噱头，该融的资已经融到了，甚至该破产的都已经破产了。那AI对数学到底有没有促进作用？有的，但前提是把它当工具用。 把一个数学命题拆解成若干个可验证的环节，每一步都分割好，然后一步一步脚踏实地地用AI去辅助验证、辅助推理、辅助检查符号和边界条件——这条路是走得通的，而且能处理掉大量的AI幻觉。事实上，Lean这类形式化工具已经在做类似的事情，只是目前还远没有到能“批量产出可信数学成果”的程度。但问题在于：如果你把AI当工具，它就撑不起欧美赋予它的那套叙事。 工具就是工具，它是人类前进的拐杖，不是救世主，不是大他者。拐杖的价值是“帮人走得稳一点”，大他者的价值是“给整个体系提供终极担保”。这两个东西在金融上能够支撑的估值，天差地别。拐杖能支撑的，是一个工具类资产的价值——按它能节省多少人力、提高多少效率来定价。大他者能支撑的，是整个信用货币体系的终极抵押品叙事——按它能吸收多少债务、维持多久的信心来定价。前者是几十亿、几百亿的生意，后者是几十万亿的叙事。OpenAI的1.4万亿估值，买的不是拐杖，买的是大他者。所以问题从来不是“AI能不能帮数学”，而是“AI被要求扮演什么角色”。它被要求扮演大他者，但它的真实能力只够当拐杖。这个落差，就是动作变形的根源，也是泡沫的根源。", "excerpt": "我一直以来的观点是：AI本身在技术上没有泡沫，泡沫是被强行加上去的。这个“强行”来自两个方向。一方面是美国的债务处理需求——信用货币时代积累的庞大债务需要一个足够大、足够有想象力的资产端来承接；另一方面是整个欧美经济体对一个“资本主义弥赛亚”的渴求——它们需要一个垄断性标的来支撑养老金、401(k)、货币基金和整个金融体系的账面价值。AI被选中了，于是被赋予了巨量的金融叙事，简直成了西方经济的救世", "url": "https://www.zhihu.com/pin/2092208140209086969", "votes": 0, "comments": 3, "feed_ts": 1791601291, "feed_time_str": "10-10 11:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "711 便利店关闭印度全部门店，背后的原因是什么？", "excerpt": "最直接的原因，是经营不及预期。 截至2026年3月财年，7-11在印度的营收约为9.2亿印度卢比，而亏损却将近9亿印度卢比（约合6 actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待江淮尊界免费升级刹车系统？", "excerpt": "其实以我这些年对华为相关群体的了解， 死咬着不承认问题、不承认错误、不承认缺陷，反而更能满足华为用户的心理预期。 华为用户要的就是这种死鸭子嘴硬撑出来的民族优越感。 ", "url": "https://www.zhihu.com/question/2091638635787448857/answer/2092182638878630315", "votes": 3, "comments": 0, "feed_ts": 1791595212, "feed_time_str": "10-10 09:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "ZOMI酱", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "人到中年，为什么对许多事没了兴趣？", "excerpt": "我老公38，他可太忙了。 每周健身2-4次、周末风雨无阻上山骑车，周更自媒体账号（一个居家维修教程账号，一个读书笔记+鸡汤账号），数据还不错，不停有人留言要链接，带货应该会销量不错，但我俩都力不从心挣不了这个钱了。 就这，他还能偶尔插出空来打个球。 他骑车，大概是这个强度↓ 放知乎，那他就是标准力工，一人养活一家四口，被吸血的完美对象。他应该在愤怒在委屈才对。 不过他实在没空。 他忙着发掘自己的极", "url": "https://www.zhihu.com/question/1910933568240203771/answer/1984032563845678967", "votes": 9332, "comments": 1881, "feed_ts": 1791595086, "feed_time_str": "10-10 09:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude协助补齐紫外线全天图同一片天空换成紫外线，会显出被恒星照亮的尘埃。Anthropic展示了Claude Science协助制作的紫外线全天图：已有观测拼在一起，约三分之一用统计预测补齐。图铺满了天空，不代表每个地方都被望远镜拍过。GALEX为保护探测器避开亮星紫外线会被大气中的臭氧吸收，观测要靠空间望远镜。GALEX紫外线空间望远镜在2003—2013年留下约3.8万次观测，覆盖约三分之二天空。它会避开过亮的恒星，防止探测器受损。恒星密集的银河平面因此留下大片空白；加上其他望远镜的数据，仍有缺口。先校准旧观测，再预测空白在研究者指导下，Claude Science组织多个agent查找公开数据、去除亮星造成的杂散光，并统一不同仪器的数据尺度、分辨率和坐标，再拼成一张图。没有紫外线观测的区域，还有可见光、红外和射电观测。Claude Science利用已有紫外线数据的天区，建立不同波段与紫外线亮度的统计关系，再据此估计空白区域的亮度，同时给出不确定性。遮住已知天区，检查能否补回来研究者让Claude Science把已有紫外线观测的部分区域藏起来，再用这套方法补齐，最后与真实测量比较。Anthropic的博客报告，数轮调整后，这些隐藏区域的估计值与真实测量相差约10%。这不能当成所有未观测区域的误差保证。成图另有图层标明每个像素来自观测还是预测，并提供不确定性估计。看图时可以区分哪些地方有观测支撑。两轮agent审查漏掉了圆斑初版图里有一些淡淡的圆斑，人工查看时才发现。它们来自单次GALEX观测中没有清除干净的地球大气紫外线辉光，拼接后形成明暗不一的圆形印记。这张图此前已通过两轮其他agent审查。研究者指出问题后，Claude Science重新校正约3.8万次观测，几小时后修正了这批圆斑。项目说明也提醒，最暗的GALEX天区仍可能残留少量圆形印记。全天图帮助教学，预测区不能确认新天体Claude Science承担了数据整理、校准和统计补齐，研究者负责规划、检查与纠错，双方经过十多版迭代、数天协作完成这张图。它能帮助学生看清紫外线下银河的结构。预测区展现的是根据已有数据推算的样貌，不能凭其中一个亮点就宣布发现了新天体；涉及科学判断，仍要核对观测来源与不确定性。", "exce const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

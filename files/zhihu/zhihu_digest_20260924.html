question/2085104703902426611/answer/2085802482744169309", "votes": 1158, "comments": 147, "feed_ts": 1790174133, "feed_time_str": "09-23 22:35", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "亚运会开幕以来，中国代表团目前一半以上奖牌都来自游泳，中国游泳近几年是如何崛起的？", "excerpt": "因为游泳金牌多啊 50 100 200 400 1500 四种泳姿 + 各种接力 + 混合泳姿 比田径金牌还多 其实挺无聊的……因为美澳强就搞那么多金牌 ", "url": "https://www.zhihu.com/question/2085780725207228502/answer/2086054367816425662", "votes": 89, "comments": 10, "feed_ts": 1790171533, "feed_time_str": "09-23 21:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "奴工理论还是把老板们的控制手段想太简单。我对“奴工理论热”还是积极评价的，鼓励人们关注劳资问题、底层员工待遇，但是片面的把劳动效率和工资待遇挂钩。就像有些朋友说的那样，如果人家真的是奴隶主，24小时监控，拿着鞭子站在你旁边，你还敢摸鱼吗？又或者，一个员工拿了较好的待遇，就一定会让他尽心尽力吗？劳动控制指的是老板把劳动者的时间、体力和技能组织起来，尽可能转化成产品和服务。说得简单些，就是督促员工工作、安排工作流程、检查工作结果，并对工作过程中发生的问题承担责任。这里面天然存在劳资矛盾。老板要求更多产出，员工需要休息和合理报酬。但奴工干活不利索，老板未必要配合这种“娇子文学”提高你的待遇、给你尊严。完全可以更细致的监控你的劳动过程，各种刷脸打卡、记录上厕所的时间、让监工狠狠骂你、下班要求秒回短信，不服又怎样？你不干有的是人干。老板的手段很多样，甚至不局限于强制控制，各种内化的劳动秩序也是普遍存在的。例如美国左翼学者迈克尔·布若威在《制造同意》中，曾以普通工人的身份进入芝加哥一家机器制造厂工作。他白天操作机器，按件计酬，和身边的工人一起赶工；下班后记录流水线、车间关系和工人们的谈话。他发现许多工人明知自己在为资本增值，依然会主动提高速度，甚至在产量没有达到预期时感到烦躁和挫败他在工厂里看到了一种被工人称作“赶工游戏”的日常。车间实行计件工资。达到规定产量，可以拿到基本工资；超过定额，则能获得更高的奖金。工人们给这种争取超额完成任务的过程取了一个颇有游戏意味的名字叫“making out”谁能完成120%的定额，谁能拿到145%的报酬，谁又因为机器故障、材料延误或协作不顺而错失奖金，都会成为工人之间反复讨论的话题。这套制度很容易让人上头。操作工想多拿奖金，就得让机器不停，让原料及时送到，让成品尽快运走。于是，他必须与叉车司机、仓库值班员、检验员、维修工、调机师傅处好关系。有时要递烟，有时要说好话，有时得帮别人一个忙，才可能在关键时刻获得优先支持。机器一旦出问题，原料迟迟不到，或者成品堆在一旁无人搬运，操作工的产量就会掉下来，眼看着本该到手的奖金化为乌有。工人之间因此会互相帮助，也会彼此埋怨。有人觉得叉车司机故意拖延，有人嫌维修工不肯及时来修机器，有人认为仓库卡住了自己的生产节奏。原本应当指向企业生产安排的问题，常常在车间里变成了工人与工人之间的摩擦。大家争的是谁耽误了谁，谁占了便利，谁没有配合。至于定额是否过高、机器配置是否合理、生产节奏是否本就超出了人的承受能力，反倒较少成为共同追问的对象。表面上，大家像是在共同对付公司僵硬的制度。实际上他们仍在为公司创造更多产量。布若威本人一开始对这种“赶工游戏”颇为冷淡。他后来也逐渐投入进去。他会为了完成更高定额而兴奋，会因为机器停摆、产量受损而焦虑，也会为自己“做出来了”感到满足。这种满足并不单纯来自钱。枯燥的劳动因此有了目标，工人之间也因此形成了共同的话题、竞争和默契。一个人若总是游离于游戏之外，也很难真正融入车间的生活。布若威把这种感受称为一种“压抑的满足”。工人当然没有忘记自己是在替老板干活，可他们能从赶工、赢得奖金、战胜故障、获得同伴认可中，得到一点真实的成就感。问题在于，游戏的规则从一开始就由资方设定：定额如何计算，奖金如何发放，机器如何配置，哪些人有权调度资源，都不是工人决定的。工人越投入，生产秩序就越稳固；越努力争取超额完成，企业从他们身上获得的剩余劳动也越多。现代工厂并不总是依靠监工的鞭子、罚款和直接命令来维持高强度劳动。它会设计一套工人愿意参与的机制，让人们为了奖金、体面、熟练感和群体认同，主动追求更高的产量。劳动控制因此变得更柔软，也更深入。它进入了同事关系，进入了工人的自尊，最后进入了“我应该把这件事做好”的内心判断企业虚假的承诺，给你归属感、晋升机会和集体身份，从而让你把规则内化于心。所谓的“把企业当家一样”、“团队意识”、“责任担当”，不都是这个套路？各种pua黑话这里也不用多讲了。这种控制手段在数字经济平台经济更加严重。例如外卖平台就是善于转嫁劳资矛盾的典型，让老百姓的底层互害承担原本监工的职责。让底层劳动者（店员、骑手）和顾客之间相互督促，保持效率。在组织技术上，资方重新分配了劳动控制权，在技术支持下的平台系统管理者是无形的，骑手与底层员工无法直观感受到资方的蛮横，而将劳资矛盾转移成骑手与消费者之间的矛盾；在科学技术上，平台系统通过潜移默化地收集、分析骑手数据并将数据结果反作用于骑手而使劳动秩序成为可能（会记录你送餐的速度，作为规训你的参考），骑手有着虚假的“自由”，实际上被不断蚕食着自主性与议价权在技术手段的辅助下,以时间为单位和节点,对骑手的劳动过程实施了严密而细致的记录和监控,形成平台和消费者等多元的控制主体，骑手无奈配合到时间控制中，而平台则掩饰了获取的剩余价值与施加的劳动控制霸权", "excerpt": "奴工理论还是把老板们的控制手段想太简单。我对“奴工理论热”还是积极评价的，鼓励人们关注劳资问题、底层员工待遇，但是片面的把劳动效率和工资待遇挂钩。就像有些朋友说的那样，如果人家真的是奴隶主，24小时监控，拿着鞭子站在你旁边，你还敢摸鱼吗？又或者，一个员工拿了较好的待遇，就一定会让他尽心尽力吗？劳动控制指的是老板把劳动者的时间、体力和技能组织起来，尽可能转化成产品和服务。说得简单些，就是督促员工工作", "url": "https://www.zhihu.com/pin/2086163359972574092", "votes": 0, "comments": 7, "feed_ts": 1790169056, "feed_time_str": "09-23 21:10", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "沃尔玛中国、山姆中国首席采购官双双换人，美国山姆高管空降执掌山姆采购，这次人事调整释放了哪些战略信号？", "excerpt": "说明山姆终于正确理解了自己的核心竞争力是自己是外企，必须要搞外企那一套，越外国人越好。 作为一个会员制超市，每年要花好几百的会员费来购物，那一定代表用户群体有巨大的信念感，相信某个事儿或者坚定不信某个事儿。 之前选山姆的那批人，他们也不是多相信山姆，其实是不相信国内公司那套的体系，认为国内公司那条体系一定会为了利润干掉一切。 说白了大家也不是第一天当社畜了，被国内公司毒打的也不是一天两天了。 再说", "url": "https://www.zhihu.com/question/2085738440742670337/answer/2086195988130281424", "votes": 2156, "comments": 191, "feed_ts": 1790167883, "feed_time_str": "09-23 20:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "阿富汗伊斯兰党（希克马蒂亚尔）首脑澄清近期其与前北方联盟成员结盟的争议阿富汗伊斯兰党(HIG)的党首古勒卜丁·希克马蒂亚尔针对近期流传的传言特别做了澄清，并对阿富汗各民族发表呼吁团结的声明。【关于伊斯兰党与“北方联盟”前成员结盟的说法完全毫无根据。我们在意识形态、行事方式及目标等方面，与他们存在根本且深刻的分歧。对于那些既不忠于伊斯兰教、也不顾及国家利益与福祉的人，我们绝不会与之结盟或开展合作。】------【我们要对哈扎拉族、塔吉克族 头上？为什么？我可从没在文章里面提到过任何东方的人名 ID 公司名字...4）知乎和媒体的生态。就像我前一篇文章所言，“卷”无处不在，无论是知乎，还是别的媒体平台，攻击，谩骂都是家常便饭。总统还刚刚禁止了5家传统的帝国传统“御用”电视台呢。争夺话语权似乎是非常重要的，因此总统说：不要新的AI监管法律，根据现有的法律，发总统的新政命令即可，掌握了AI们的搜索结果，总统的期中选举就十拿九稳了...你想想，如果你打开手机，迎面而来的都是“总统如何光辉伟大，如果带领帝国人民重新MAGA，对手是如何垃圾”...总统就赢定了，对吧？对吗？其实，我认为既对，也不对。我的想法是：话语权当然很重要，很多时候，貌似可以确定一件事情的生死，比如第三帝国的宣传部长就说过：谎言重复一千遍，就成了真理。但，同样，一个谎言，是需要另外的9个谎言来掩盖的，也就是，说谎话，是要付出代价的，只不过，代价可以被扭曲，有时候扭曲很久很久而已。因此，我知道，打开知乎搜索alex01，满屏都是alex01一无是处的评价，这里面的代价都跑到哪里去了？我很紧张这个么？如果你不把它当一会儿事，放弃钱财，放弃名声，那么，又有什么？我为什么要在你咬我一下就要立马还击，反手举报你？5）敌人和时间。我的敌人是谁？他们都很厉害么？有因必有果，这都是生活的一部分，是数学的一部分。我不确定我能够坦然面对最坏的打算，但我会努力面对最坏的打算。剩下的就交给时间，如果我遵循的是最可能高的效率，那么时间，时间就是审判他们的利器。时间点是这个宇宙中最难把握的东西，本文中的时间和点位都仅作参考，并不提供任何投资建议，否则后果自负。", "excerpt": "关于黄金白银的题外话，媒体生态.关于黄金白银的题外话：有朋友专门就我们的帖子一直被折叠，被荒原，然后我说：“我从来没有举报过任何一名博主”，就有些不理解，这里再解释一下：1）的确，除了写我名字指名道姓骂的，我从来没有举报过任何一名博主。不是我知道他们没有底线，故意找事，找些可笑的理由，然后混淆是非，断章取义，移花接木，倒打一耙，不是不生气，而是：不值得。对，不值得。别他们咬了，没必要直接还击，钱是", "url": "https://www.zhihu.com/pin/2086163965667701761", "votes": 0, "comments": 34, "feed_ts": 1790160727, "feed_time_str": "09-23 18:52", "category": "pin", "cat_name": "想法动态"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么游戏里的水、火和烟雾这么难做？", "excerpt": "因为要解千禧七大难题之 Navier-Stokes 方程，这东西可没有解析解。 好吧，开个玩笑，只有影视渲染需要硬钢 N-S，游戏中全是障眼法，并不需要直面 N-S。 人眼本质上就是个分类器，会自动判断一段画面真不真，就看你的障眼法能不能骗过人眼了。单说水，水这个东西分为动画水， 物理水， N-S 水， 实拍水，拟真程度依次增加。 游戏一般是用第一第二种，影视才能用第三第四种，当然也不绝对，游戏在", "url": "https://www.zhihu.com/question/2078550836402205944/answer/2086163216795693160", "votes": 350, "comments": 5, "feed_ts": 1790160070, "feed_time_str": "09-23 18:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "互联网大厂开始后悔搞AI了吗？", "excerpt": "怎么可能后悔。 不仅没后悔，反而在资本市场疯狂施压、自由现金流已经被干成负数的情况下，继续咬着牙加码。 这其实是一个非常反直觉的商业奇观。我们平时总觉得资本家都是精打细算的，不见兔子不撒鹰，但现在的真实情况是，这帮全中国最聪明、最会搞钱的CEO们，正把过去二十年靠卖游戏、卖广告、送外卖赚来的真金白银，毫无保留地往一个深不见底的黑洞里砸。 咱们今天就把这层窗户纸彻底捅破，看看大厂的账本到底烂成了什么", "url": "https://www.zhihu.com/question/205316443357733 tor": "CVHub", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "自我介绍大家好👋，我是傅天予，现在清华电子系汪玉老师组直博五年级，25年底在 CMU 的 Beidi Chen 老师组交换了半年。主要研究方向是 efficient long context LLM欢迎关注我们最新的一些研究和思考: 链接个人主页：链接#AI研究者报到 ", "excerpt": "自我介绍大家好👋，我是傅天予，现在清华电子系汪玉老师组直博五年级，25年底在 CMU 的 Beidi Chen 老师组交换了半年。主要研究方向是 efficient long context LLM欢迎关注我们最新的一些研究和思考: 链接个人主页：链接#AI研究者报到 ", "url": "https://www.zhihu.com/pin/2085050691911956026", "votes": 0, "comments": 17, "feed_ts": 1790153864, "feed_time_str": "09-23 16:57", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "酱紫君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "大模型规模膨胀时代，国内AI芯片的胜负手在全栈协同", "excerpt": "过去十年是国内芯片奋起直追的十年——从底层指令集的突围到微架构的推陈出新，数百亿资金与无数顶尖人才砸向这片半导体战场。 单芯片的参数一个接着一个被突破，但真正属于国内算力的全面胜利却似乎还在路上——当我们把芯片放进集群、去跑万亿参数的大模型时，才发现瓶颈早已不在单卡，而在系统。 这种“单卡看起来不错，一上集群就掉链子”的无力感，困扰着很多国内AI芯片团队。 显存不够、互联太慢、存储I/O跟不上……", "url": "https://zhuanlan.zhihu.com/p/32477483", "votes": 34, "comments": 1, "feed_ts": 1790153744, "feed_time_str": "09-23 16:55", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么说穷人家孩子晚熟十年？", "excerpt": "是吗？我怎么感觉穷人家孩子早熟20年呢？ ", "url": "https://www.zhihu.com/question/2059169435303293805/answer/2086134982624417295", "votes": 38, "comments": 1, "feed_ts": 1790153339, "feed_time_str": "09-23 16:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "UFO", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎么看待华为昇腾960将提前至明年Q1发布？", "excerpt": "中国向来有两种毁掉一件东西的办法。一种是骂杀，一种是捧杀。 骂杀是容易看见的。说你不行，说你一无是处，说中国人永远造不出好芯片，仿佛只要外国的商标印得端正一些，晶体管便也生得格外聪明。这种话自然省事，因为不必看参数，也不必懂软件，只消先跪下来，便什么都明白了。 然而还有一种办法，却热闹得多，也体面得多，这就是捧杀。 譬如有一枚芯片出来了。 倘若算力已经胜过别人，那自然可以说胜过别人；倘若还没有胜过", "url": "https://www.zhihu.com/question/2083893227468465754/answer/2084358412486419739", "votes": 17, "comments": 10, "feed_ts": 1790153017, "feed_time_str": "09-23 16:43", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn" 80675701/answer/2083538512884909420", "votes": 40, "comments": 0, "feed_ts": 1790149487, "feed_time_str": "09-23 15:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价博主“销冠李老板”因投诉“摇一摇开屏广告”被全网封号并致歉？", "excerpt": "继“奴工理论”之后， “开屏广告理论”诞生了： 只要是在任何一个环节跳出开屏广告的软件，它对待你的态度都不会好于你对待开屏广告的态度。", "url": "https://www.zhihu.com/question/2085877890743387534/answer/2085982329781208162", "votes": 3756, "comments": 86, "feed_ts": 1790149389, "feed_time_str": "09-23 15:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "大模型的理论基础中，有哪些令人惊叹的数学工具或关键研究？", "excerpt": "目前大语言模型领域是不存在一套类似量子力学薛定谔方程那样大一统的数学理论的。 它的工程实践已经远远把理论分析甩在了后面。但这绝不意味着大模型背后的数学毫无嚼头。相反，正是因为没有一个上帝视角的统一公式，目前活跃在大模型理论前沿的数学工具呈现出一种生猛、跨界且非常硬核的碎片化繁荣。许多原本被认为十分抽象的纯数学分支，或者传统统计物理中的经典定律，正在以令人瞠目结舌的方式直接切入大模型的核心机理。 我", "url": "https://www.zhihu.com/question/2015477375933096972/answer/2086115371170510496", "votes": 13, "comments": 1, "feed_ts": 1790148663, "feed_time_str": "09-23 15:31", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_COLLECT_ARTICLE", "verb_cn": "收藏了文章", "title": "对前伊拉克空军少将纳吉·哈利法·德汉的采访（第一部分）", "excerpt": "感谢 @CASI搬运 百忙之中帮我整理采访内容感谢德汉少将百忙之中回复我的问题 前言：能有机会采访纳吉·哈利法·贾西姆·德汉将军，其实源于大约一年前我对海湾战争的一次研究。当时，我正在调查1991年空袭中巴格达若干重点设施的受损情况( “胜利”的谱系学：重勘巴格达空袭的知识考古现场)。在查找公开资料的过程中，我开始有意识地把Facebook和YouTube作为史料搜集渠道。由于工作原因，我平时对这", "url": "https://zhuanlan.zhihu.com/p/2070262767886529148", "votes": 134, "comments": 3, "feed_ts": 1790148295, "feed_time_str": "09-23 15:24", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "正解局", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "中国“家电下乡”，到了德国人的阳台", "excerpt": "最近德国流行起了一件事，好多人在自家阳台上挂起了光伏板。 不是一两个人挂，而是一百多万人都在挂。 根据官方数据，到今年5月，系统登记在册的阳台光伏已经达到了132万套。 在德国媒体的调研里，受访者对阳台光伏的支持率高达82%，着实是个高共识了！ 几块太阳能板，一块储电池，自己发电自己用，本也没什么。 但是有意思的是，把这132万套光伏板拆开来看，会发现这块卖疯德国的板后面，基本都是“中国造”。 如", "url": "https://zhuanlan.zhihu.com/p/2086110861509275819", "votes": 24, "comments": 2, "feed_ts": 1790148283, "feed_time_str": "09-23 15:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "光环尽褪 - 1945年战争末期的武装党卫军", "excerpt": "题图：摄于1945年2月或3月，党卫军第4装甲军军长赫伯特·吉勒（Herbert Gille，右起第2人）正在注视肩扛“铁拳”、正向前线行进的党卫军第9“日耳曼尼亚”装甲掷弹团士兵。这些士兵年岁已长，即便在1943年，恐怕也根本不符合武装党卫军的征募标准。然而到了战争最后几个月，武装党卫军已不得不竭泽而渔，搜罗一切尚可动用的人力。 注：本文译自《Die Waffen-SS. Neue Forsch", "url": "https://zhuanlan.zhihu.com/p/2084773201540802460", "votes": 88, "comments": 0, "feed_ts": 1790148169, "feed_time_str": "09-23 15:22", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "王子君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价余永定「中央政府的账本干干净净，但是地方政府一塌糊涂，这种情况必须改变」的观点？", "excerpt": "谢邀。 地方的账永远是一塌糊涂的。 一，政策是不完美的； 二，离执行层越近，就越能看到政策和现实的冲突混乱； 三，要是在执行层也看不到这种混乱了，说明自下而上骗爽了。 举个栗子： 17年政策开搞工业互联网，18年直接写到政府工作报告里。 那时各地大干快上，文件一堆，恨不得每个城市每个工业细分都搞个工业互联网企业。我那时就被胖友忽悠，去参与了一个服装工业互联网。 然后我们到地面一跑：俏丽马怎么都是骗", "url": "https://www.zhihu.com/question/2085309705664950553/answer/2086109498696020828", "votes": 1266, "comments": 55, "feed_ts": 1790147263, "feed_time_str": "09-23 15:07", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "软银正寻求发行超 110 亿美元、史上最大规模之一的垃圾债继续押注 AI，有哪些信息值得关注？", "excerpt": "垃圾债，好听的讲法是高收益债，就是信用评级低的企业发的债。 软银寻求发的美国短债利率是9%，在欧洲发的债利率是8%！ 如果最终真的按这种利率发债，会创下历史最高纪录。 现在很多企业不在乎高利率，只要能拿到资金就行，企业债市场也敢借出去，没有怎么索要额外的风险补偿。 这种自信是美联储等央行给的。 为什么？ 新冠疫情之后，企业债相对国债的利差，就是经常说的信用利差，一直维持在很低的水平。 信用利差直接", "url": "https://www.zhihu.com/question/2085674664559210886/answer/2086104761766504177", "votes": 71, "comments": 13, "feed_ts": 1790146133, "feed_time_str": "09-23 14:48", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹小灵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待钟薛高创始人力挺西贝，说西贝要是倒了，是中国餐饮行业的倒退？你认同这一评价吗？", "excerpt": "相当于在问，能不能有做空机制。 西贝不论品质、质量安全管理、原材料管理做的有多好，哪怕 ed_time_str": "09-23 12:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "传闻911当天在世贸大楼工作的犹太人全部请假没有上班，这是真的吗？", "excerpt": "如果犹太人提前得知了消息那他们会忙于第一时间10^n倍杠杆做空美股，而不是傻乎乎的走OA程序请假", "url": "https://www.zhihu.com/question/808964411/answer/2057172249887634770", "votes": 3818, "comments": 53, "feed_ts": 1790138062, "feed_time_str": "09-23 12:34", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "刀刀宁,南爸安爸", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "Jev 真正重要的地方：ICL 可能不需要自回归这次 Jev 爆火，我觉得最大的价值，是它让我重新思考一个问题：In-context learning 可能并不是自回归生成模型的专属能力。如果只看 Jev 最终完成的事情——分类、打分、结构化决策——其实并不神秘。今天用一个小 LLM + 约束解码（constrained decoding），很多情况下也能做出非常类似的产品效果。约束解码其实是现在 LLM 输出结构化内容的一项核心技术。比如要求模型输出 JSON、某个固定 Schema，或者只能从 A/B/C 几个选项中选择，本质上都可以在模型自回归生成的过程中，动态屏蔽那些“不合法”的 token，只允许模型沿着合法的输出空间继续生成。这套方案已经非常成熟。但问题是：它本质上还是生成模型。哪怕最后只需要模型回答一个 A，它依然是在跑 autoregressive decoding，只不过我们人为把它能生成的 token 空间限制住了。而 Jev 有意思的地方恰恰在这里。从目前公开的信息看，它并不是传统意义上的自回归文本生成模型。它直接输出 Choice、Score 这样的 typed decision，并且可以高度并行地计算多个结果。所以它的效率才能高得这么夸张。这里很容易产生一个误解：“这不就是分类模型吗？BERT 十年前就能干。”没错。如果只是做一个固定任务，专门训练一个 classifier，当然可以比 LLM 快得多。真正困难的从来不是“做一个快的分类器”。真正困难的是：能不能让一个判别式 / 非生成式模型，也拥有类似 LLM 的 in-context learning 能力？传统 classifier 最大的问题是 task-specific。训练一个情感分类模型，它就只能做情感分类；换一套 label，换一个任务定义，通常就得重新训练。而 LLM 最核心的能力之一，就是 inference-time adaptation。你可以在 prompt 里临时告诉它：“现在不是判断正负面，而是把文本分成 A、B、C、D 四种我刚刚定义出来的类别。”甚至给它几个 example，它马上就能开始做这个新任务，而不需要更新参数。这就是 ICL 真正恐怖的地方。所以 Jev 最让我感兴趣的地方，不是它“比 LLM 快 193 倍”。而是它隐约展示了一种新的可能：ICL 和 autoregressive generation，也许是可以解耦的。以前我们的默认范式是：通用模型→ LLM→ 自回归生成→ 再用 constrained decoding 把生成结果约束成结构化输出。而 Jev 展示的可能是另一条路线：通用模型→ 理解上下文→ inference-time adaptation→ 直接输出 decision。也就是说，根本不经过“先生成，再约束”这一步。如果这条路线最终成立，那意义就很大了。因为大量 Agent 工作负载，本质上根本不需要生成自然语言。选哪个 tool、调用哪个 function、参数是否合法、网页上点哪个按钮、某个候选项打多少分……这些其实都是 decision problem。我们今天只是因为 LLM 最擅长生成，所以把一切问题都包装成 token generation，然后再靠 function calling、JSON Schema、constrained decoding 把它重新压回结构化空间。某种意义上，这是绕了一圈。Jev 真正有意思的地方，是它在问：既然最后要的是 decision，为什么不直接建模 decision？当然，目前 Jev 的具体网络结构和训练细节并没有完全公开，所以现在直接说“Jev 证明了 BERT 类判别模型拥有 ICL”还太早。但我觉得可以更谨慎地说：Jev 至少展示了一种非常值得关注的方向——把 LLM 最有价值的 inference-time adaptation 能力，与昂贵的自回归文本生成解耦。如果这件事情最后真的成立，那么 constrained decoding 可能只是生成式时代的一种过渡方案。因为最好的结构化输出，也许根本就不需要“输出”。", "excerpt": "Jev 真正重要的地方：ICL 可能不需要自回归这次 Jev 爆火，我觉得最大的价值，是它让我重新思考一个问题：In-context learning 可能并不是自回归生成模型的专属能力。如果只看 Jev 最终完成的事情——分类、打分、结构化决策——其实并不神秘。今天用一个小 LLM + 约束解码（constrained decoding），很多情况下也能做出非常类似的产品效果。约束解码其实是现在", "url": "https://www.zhihu.com/pin/2084978274527078247", "votes": 0, "comments": 21, "feed_ts": 1790138013, "feed_time_str": "09-23 12:33", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待2026年9月20日莫斯科再度遭到乌军大规模空袭？", "excerpt": "就是想影响俄罗斯的选举，这种规模的空袭实际上没什么用，完全就是争取点kpi。而且俄罗斯现在也学精了，你打不打中，我都说影响了成品油出口，是不是真有俄罗斯说的那么严重，我听到的俄罗斯汽车企业的人说根本没那么严重，俄罗斯就是故意限制，同时还大肆购买国际上的成品油。俄罗斯主要是要国际成品油市场价格失控，反而会影响西方国家，尤其是美国国内成品油价格。毕竟资本主义么，我管你国民买得起买不起。尤其是懂王马上要", "url": "https://www.zhihu.com/question/2085029767946958236/answer/2086069704272113967", "votes": 14, "comments": 2, "feed_ts": 1790137775, "feed_time_str": "09-23 12:29", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么能写出《骆驼祥子》的老舍会对《1984》嗤之以鼻？", "excerpt": "我个人并不会饮酒，但是我一直都对《1984》里的所谓“杜松子酒”非常好奇，按照奥威尔的描述那是一种劣质烈酒，他的原文描述是： 他拿起一个瓶子，上面贴着简单的白色标签，写着“胜利牌杜松子酒”。它散发出一种令人作呕的、油腻的气味，像中国米酒。温斯顿倒了将近一茶杯，鼓足勇气，像吞药一样一口灌了下去。顿时，他的脸涨得通红，眼泪夺眶而出。这东西就像硝酸，而且，吞下去的时候，让人感觉后脑勺挨了一橡胶棍。我第一", "url": "https://www.zhihu.com/question/10633438634/answer/2086066659794608501", "votes": 542, "comments": 77, "feed_ts": 1790137049, "feed_time_str": "09-23 12:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "刘聪NLP", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "2026 云栖大会有哪些看点值得关注？", "excerpt": "首先，感谢 @知乎科技 组织的探展团。今天真是疲惫但又充实的一天。云栖大会这两天进行到第二天，咱们也写一下这篇回答，给后面要参加云栖大会的朋友一点点前期预告，以及一些值得逛的亮点吧。如果大家早上有刷到我的知乎 然哲学，发现黑格尔对运动的认识还是区分月上运动和月下运动的亚里士多德运动学图景。", "excerpt": "好家伙，刚刚看了一篇写黑格尔的自然哲学，发现黑格尔对运动的认识还是区分月上运动和月下运动的亚里士多德运动学图景。", "url": "https://www.zhihu.com/pin/2085776417346811344", "votes": 0, "comments": 25, "feed_ts": 1790133092, "feed_time_str": "09-23 11:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "我感觉Z世代大部分人根本就没有长性，至少到目前为止，诸多直接民选国家的95后00后也是如此，可能两三年就变一下左中右根本立场，甚至两三周两三天就在具体问题上反复无常了。无论极佐还是极右都是网络cosplay或者坐在家里/校园里真空构想，最多就像19世纪欧洲知识分子一样搞搞线下咖啡馆鉴证沙龙，像20世纪中期市民那样去巴黎纽约等大城市街头游行一下，但即使真能线下活动的那少部分人，也没有长期的明确的纲领。至于年轻人的投票率，很大程度反而是被自己不喜欢的候选人逼出来的，如果两个或多个候选人都是减脂派或这个年轻人喜欢的那派民粹，那就反而懒得去投票了。只有一边是减脂中立或他喜欢的民粹，一边是他眼里不正常的疯子候选人，他们才会有高投票率。要不然就纯粹线上鉴证英雄指哪打哪（但立场反复无常）、线下政治冷感明哲保身（即使是那些有直选投票权的国家之青少年）", "excerpt": "我感觉Z世代大部分人根本就没有长性，至少到目前为止，诸多直接民选国家的95后00后也是如此，可能两三年就变一下左中右根本立场，甚至两三周两三天就在具体问题上反复无常了。无论极佐还是极右都是网络cosplay或者坐在家里/校园里真空构想，最多就像19世纪欧洲知识分子一样搞搞线下咖啡馆鉴证沙龙，像20世纪中期市民那样去巴黎纽约等大城市街头游行一下，但即使真能线下活动的那少部分人，也没有长期的明确的纲领", "url": "https://www.zhihu.com/pin/2086047808612741960", "votes": 0, "comments": 12, "feed_ts": 1790133045, "feed_time_str": "09-23 11:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "ZOMI酱", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "什么东西被发明出来后，莫名其妙地违背了它的用途？", "excerpt": "我提名 http://baidu.com现在变成测试网络是否连通的工具了 ", "url": "https://www.zhihu.com/question/2083219865272374442/answer/2085497031808889128", "votes": 1049, "comments": 52, "feed_ts": 1790132926, "feed_time_str": "09-23 11:08", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "谁能解释一下，什么是「抗日正面战场」？人活得久了什么都能看见，比如这种问题被果粉占领。鉴证果然是在沙子上写字，隔几年就换一拨人，换一个风向。不过这事确实有意思。42年初的时候，国军还是挺有面子的。林语堂在纽约时报上写社论：为什么国军和苏军表现的那么好？教导美英应该学习中苏搞游击战，发动人民（我看nyt的二战报道就发现其实西方人也很喜欢人民战争的调调）。到43年随着左翼记者们的文章，国军就开始被质疑了，石牌会战在西方被普遍嘲笑和质疑是夸大宣传。不过此时国军起码还有表面的面子，开罗会议的时候蒋还能当四巨头之一。结果44年豫湘桂就全完了——国际地位和面子全部丢光，更要命的是罗斯福觉得以后日军如果继续占据中国大陆抵抗，根本无法处理，只能请苏军下场。但有意思的地方也在这里。现在回头看，一号作战根本没有任何意义，而且是日军一开始就知道没有意义。“大陆交通线”日本人自己都觉得扯淡，当时中国大陆铁路线到南洋油田之间隔着几千公里茂密的丛林，日本孱弱的国力和低下的卡车产量，哪有足够的运力来维持大陆交通线？所以最后日军上报作战目的的时候，只好说是为了“摧毁能轰炸日本的美国空军基地”。但在44年初日本人自己也知道美军很快就能占领能轰炸日本岛屿，更别说打到7月塞班岛就丢了，但日军还是要坚持打完。实际上我看战史丛书，日本陆军发动一号作战的最大目的就是——满足昭和军人的赢学欲望。太平洋战场不但打不赢，而且陆军使不上劲，于是只好痛打一顿蒋介石出气。类似今年的川铺总桶毛衣战没结果去殴打委内瑞拉。但这么干的结果就是：1.华北供军得到机会迅速扩张，39-43年长期被压制在四十多万人的供军45年变成了百万大军。2.国军被沉重打击，结合1，就从“四军十二师”变成了“五军十六师”，最后变成了“联合zf”——44年初的时候，公开的口号还叫“拥蒋建国”。3.苏军下场。这个就不用说了。所以为啥一堆人天天马歇尔宇宙，就没有佐尔格宇宙？试想一个没有一号作战的平行时空，甚至更夸张一点，入关的关东军目标不是国军，而是在华北发动更大规模的清乡，那今天的情况会如何？", "excerpt": "谁能解释一下，什么是「抗日正面战场」？人活得久了什么都能看见，比如这种问题被果粉占领。鉴证果然是在沙子上写字，隔几年就换一拨人，换一个风向。不过这事确实有意思。42年初的时候，国军还是挺有面子的。林语堂在纽约时报上写社论：为什么国军和苏军表现的那么好？教导美英应该学习中苏搞游击战，发动人民（我看nyt的二战报道就发现其实西方人也很喜欢人民战争的调调）。到43年随着左翼记者们的文章，国军就开始被质疑", "url": "https://www.zhihu.com/pin/2085892697211016366", "votes": 0, "comments": 99, "feed_ts": 1790132420, "feed_time_str": "09-23 11:00", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价2026年8月米哈游《崩坏星穹铁道》4.5版本剧情任务【挥掷千星的筹码】？", "excerpt": "整个任务让我印象最深刻的两个角色，虚照与知更鸟。 当归寂知道他想肘击的啊哈，不久前就在二相乐园里画漫画时，不知道又是什么表情。 或许可以让狸猫们起一个有噱头的新闻标题，《青春归骰大君会梦见模糊二维码老师吗？》 说实话，可能是虚照表现得太乐子了，在她现出真身前我似乎没有太多感觉…… 下面请欣赏，可观测宇宙内最有乐子的星神战败cg: 1真珠/公司小兵:“我囚禁了一个星神！” 2无力偿还星穹列车的债务，", "url": "https://www.zhihu.com/question/2075634392815367816/answer/2077442755052180842", "votes": 86, "comments": 6, "feed_ts": 1790131571, "feed_time_str": "09-23 10:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "帝俄能和拿破仑打出接近一比一的交换比，苏联被德军各种无双割草，为什么会有人觉得苏联比帝俄强？", "excerpt": "因为苏德战争只是个简称…… 这场战争的实际情况是：德国+奥地利+捷克+斯洛伐克+意大利+匈牙利+罗马尼亚+芬兰，以及法国德占区和波兰的工业资源供应，VS苏联。 换算成沙俄那会儿，就是德国+奥匈帝国+意大利+芬兰+罗马尼亚，VS失去波兰核心地域和芬兰的沙俄，并且是单线作战，你感觉任何时期的沙俄能顶住两年吗？ 而且，德国的仆从国是真出力。 罗马尼亚累计投入兵力约为100万人，在战争的各个阶段普遍维持在", "url": "https://www.zhihu.com/question/2082220802464924821/answer/2086041511389615706", "votes": 229, "comments": 55, "feed_ts": 1790131053, "feed_time_str": "09-23 10:37", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "亚运会男篮铜牌赛，中国男篮 70-79 伊朗男篮，如何评价本场比赛？", "excerpt": "本场比赛其实已经渐渐形成整个社会的缩影。 那就是现在很多年轻网友挂在嘴边的“XXX能当饭吃？”“XXX这么厉害，能吃几发东风？”那就是赢学转移法。 比如央视没和国际足联谈妥世界杯转播费用，网络上就充斥“看球能当饭吃？有这钱为什么不去多造几艘航母？” 本质上就是中国人民从一种赢，转移到了另一种赢。这里我们要搞清楚一个基础，那就是中国人并不嫌弃小赢还是大赢，只要是赢，都喜欢。所以不存在什么“现在没人看", "url": "https://www.zhihu.com/question/2084935724428744525/answer/2085168148161085932", "votes": 173, "comments": 11, "feed_ts": 1790130966, "feed_time_str": "09-23 10:36", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待lovelive最新的团鸟团加入了缪斯角色南小鸟？", "excerpt": "32岁这个设定好，众所周知32是16的两倍，这是个好数字。 快30岁也行，备注一下，花园羽羽里29岁，她的女儿花园羽香里15岁，羽羽里可是正规的处女妈妈，偶尔的人妻JK。 说不定很快就要有一个将满16岁，与南小鸟一模一样的少女角色出场了。 做人没有梦想，那和咸鱼有什么区别。为什么要YY轻熟女南小鸟穿自己制服的样子？不如思想放开些，去看妈妈南小鸟穿女儿制服的样子。 三大轻熟女（人妻）直拳，一是轻熟女", "url": "https://www.zhihu.com/question/2084360618111414544/answer/2085695074109858114", "votes": 243, "comments": 16, "feed_ts": 1790129389, "feed_time_str": "09-23 10:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "胡塞武装的致命弱点在哪里？", "excerpt": "“胡塞武装”是和“伊朗伊斯兰共和国”一样西方宣传反噬自身的又一例证 西方宣传中的伊朗伊斯兰共和国：高层和哈梅内伊离心离德，哈梅内伊本人骄奢淫逸贪污腐败，外有被封锁几十年导致工业能力为零，内有库尔德人阿拉伯人巴列维分子分分钟发动暴动，军队和共和国卫队矛盾极深，一大号伊拉克，美国天兵一到立刻缴械投降土崩瓦解 现实中的伊朗伊斯兰共和国：每个高层都指定了四个接班人，哈梅内伊本人拿全世界什叶派进贡的钱给革命", "url": "https://www.zhihu.com/question/2081840829186979771/answer/2085072791112626589", "votes": 776, "comments": 70, "feed_ts": 1790129273, "feed_time_str": "09-23 10:07", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude Opus 5.5来了：Fable级代码能力如果你让 Claude Code 连续跑代码迁移、仓库审计或多 agent 协作，模型的账单由 token 标价、步骤数、上下文读取和重试共同决定。一次任务走得更长，后面三项的影响会快速放大。Anthropic 发布的 Claude Opus 5.5，瞄准的正是这类长程工作：大多数任务达到 Claude Fable 5.1 的表现，同时典型工作负载比 Opus 5 少花 40%。它已经上架 Claude、Claude Code、AWS、Google Cloud、Azure 和 Claude Platform。长程代码 agent 的账单由什么构成Opus 5.5 的输入、输出价格分别是每百万 token 4 美元和 20 美元，较 Opus 5 的 5 美元和 25 美元各降 20%。更影响代码 agent 的是缓存读取：从每百万 token 0.50 美元降到 0.20 美元，降幅 60%。缓存读取通常发生在 agent 反复带着仓库上下文、历史对话和工具结果继续工作时。Anthropic 的 40% 是默认设置下“典型工作负载”的端到端成本结论，不能简单等同于所有请求都便宜 40%；短对话、没有缓存复用的任务，节省幅度可能不同。少走步骤，才是第二层降本Anthropic 给出的案例里，Opus 5.5 审计并修复一个 20 万行代码库用时不到 3 小时；Opus 5 超过 20 小时，且消耗约 2.5 倍 token。另一个 HAProxy 从 C 迁到 Rust 的测试中，Opus 5.5 用时 9.5 小时，Claude Fable 5.1 用时 12 小时，成本低 51%。这两组都是发布方或早期测试者的案例，不能直接当作所有仓库的平均值。但它们展示了发布页强调的收益：完成同一个大任务时，耗时、token 和返工会一起下降。对于按步骤和 token 计费的代码 agent，这比单看输入单价更有意义。和 GPT-6 Astra、GPT-5.6 Sol 怎么比Anthropic 在同一张表里给出：Terminal-Bench 4.0 上，Opus 5.5 为 66.4%，GPT-6 Astra 为 57.9%；FrontierCode v1.1 上为 54.4% 对 53.3%；CursorBench 4.0 上为 57.8%，GPT-5.6 Sol 为 41.7%。这些最高成绩的推理力度并不完全相同，不能把它们压缩成“全面领先”。更值得部署者核对的是任务成本口径。Anthropic 称，Opus 5.5 在默认 effort 的 FrontierCode 上，以约 20% 的单任务成本超过 GPT-6 Astra；在 Terminal-Bench 4.0 上以约 40% 的成本打平 Astra；在 CursorBench 上以约三分之一成本领先 GPT-5.6 Sol 11 个百分点。模型、harness、effort 和任务集一变，这些比值也会变。", "excerpt": "Claude Opus 5.5来了：Fable级代码能力如果你让 Claude Code 连续跑代码迁移、仓库审计或多 agent 协作，模型的账单由 token 标价、步骤数、上下文读取和重试共同决定。一次任务走得更长，后面三项的影响会快速放大。Anthropic 发布的 Claude Opus 5.5，瞄准的正是这类长程工作：大多数任务达到 Claude Fable 5.1 的表现，同时典型工", "url": "https://www.zhihu.com/pin/2086033199357080066", "votes": 0, "comments": 0, "feed_ts": 1790129108, "feed_time_str": "09-23 10:05", "category": "pin", "cat_name": "想法动态"}, {"actor": "UFO", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价睡前消息第978期《爪哇岛高铁亏损 高铁出海能去哪》?", "excerpt": "印尼的例子好，好就好在一个长方形的岛上挤了1.5亿人口，人均gdp5000美元，完全符合高铁最有利的建设条件。另外，印尼是一个独立国家，是独立核算单位。 你说高铁对全世界都好，说全社会受益，说算总账是赚大钱，都没问题，不会有人专门顶嘴反对。 只是其他国家对印尼不是转移支付，都是给商业贷款。现在请印尼从“赚大钱”的收益中提取资金，把贷款还了，起码把当下的维护费用付了。 资本主义对财富的定义，就是能拿", "url": "https://www.zhihu.com/question/1972755352211715173/answer/1973029650449069022", "votes": 1744, "comments": 252, "feed_ts": 1790128671, "feed_time_str": "09-23 09:57", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "GPT-6 Sol/Luna来了OpenAI 正在将 GPT-6 Sol 和 GPT-6 Luna 推送到 ChatGPT Work、Codex 和 API。Plus、Pro、Business、Enterprise、Edu 用户会在 Work 与 Codex 中逐步获得两款模型；Free 与 Go 用户可在桌面应用试用 GPT-6 Luna。Chat 目前不提供这两款模型。暂时看不到时，先确认自己使用的入口和计划：这次发布本身就是逐步推送，同一计划下也可能因入口不同而尚未出现。价格到底降到哪里按每 100 万 token 计，GPT-6 Sol 的输入价是 2 美元、输出价是 10 美元；GPT-6 Luna 是输入 0.10 美元、输出 0.50 美元。对应的 GPT-5.6 促销价分别是 Sol 的 4/20 美元和 Luna 的 0.20/1.20 美元。这个“降半价”是相对 GPT-5.6 促销价的比较，别把它延伸成与所有模型、所有套餐相比都更便宜。API 单价也无法直接替代一次真实任务的成本：任务长度、输出量、工具调用和失败重试都会改变最终账单。和最新 Opus 5.5 放在一张价格表里看Anthropic 同日公布的 Claude Opus 5.5，标准 API 价为每 100 万 token 输入 4 美元、输出 20 美元、缓存读取 0.20 美元。GPT-6 Sol 的 2/10 美元在输入和输出单价上正好是 Opus 5.5 的一半；GPT-6 Luna 的 0.10/0.50 美元则更低。这是一组 API 价格对照，并不构成两款模型的能力排名：模型定位、推理等级、上下文、工具调用、缓存读写和具体任务都会影响一次 agent 任务的总成本。选型时，先用自己的固定任务测总 token、重试和完成质量，再看价格差能否落到账单上。缓存会改变长任务的账单OpenAI 同时调整了缓存与推理效率。页面给出的规则是：缓存输入读取可享 90% 折扣；修改推理力度或工具可用性时，既有上下文缓存也会继续保留。这对反复带着同一份系统提示、项目背景或长文档继续跑的工作流更有意义。每次都从空白请求开始的调用，很难拿到同样的缓存收益。算成本时，把“复用前缀的比例”单独列出来，会比只盯每百万 token 单价更接近实际。跑分产品页列出多项评测。例如 AutomationBench 1.0.6 中，GPT-6 Sol 在 xhigh 推理等级下为 33.2%，页面列出的单任务成本为 0.27 美元；DeepSWE v1.1 中，Sol max 为 68.8%。这些分数对应特定任务、工具集、推理等级和成本设置，适合拿来筛选要不要试，不足以替代自己的代码库、提示词和工具链测试。", "excerpt": "GPT-6 Sol/Luna来了OpenAI 正在将 GPT-6 Sol 和 GPT-6 Luna 推送到 ChatGPT Work、Codex 和 API。Plus、Pro、Business、Enterprise、Edu 用户会在 Work 与 Codex 中逐步获得两款模型；Free 与 Go 用户可在桌面应用试用 GPT-6 Luna。Chat 目前不提供这两款模型。暂时看不到时，先确认自己", "url": "https://www.zhihu.com/pin/2086030070951450525", "votes": 0, "comments": 0, "feed_ts": 1790128352, "feed_time_str": "09-23 09:52", "category": "pin", "cat_name": "想法动态"}, {"actor": "冷哲", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "30岁癌症患者，如何平静接受死亡？", "excerpt": "我是医生，独居。有天晚上下班回家突发头痛，眩晕，左眼是波浪线马赛克，右眼半盲，定位不了自己的右手，无法站立，但意识是清醒的。出现的症状第一刻，我顺着惯性冲到了门的位置，一点一点的爬到位置打开门，躺在了走廊的地上，给我最近的同事打电话，然后闭着眼等人来。 我的同事大概在十分钟左右找到了我，扶着我坐上滴滴一路冲到急诊。我很幸运，急诊前面没有排队的人，到地方就做了CT。 因为我本身就是医生，自己当时对临", "url": "https://www.zhihu.com/question/21907657/answer/2085841723398285201", "votes": 2787, "comments": 525, "feed function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

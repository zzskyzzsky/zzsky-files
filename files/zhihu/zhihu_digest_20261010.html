套餐开放；Claude Motion 目前只向 Team 和 Enterprise 开放。个人付费套餐并不包含这次 Motion 测试资格。Enterprise 的这两项功能默认关闭，需要管理员在组织设置的 Artifacts 中启用。订阅符合条件，也可能还需要这一步。看板能随数据更新，每张图可查查询语句连接 BigQuery、Snowflake、Databricks 等数据平台，或 Salesforce 这类客户关系管理工具后，可以用自然语言提问。Claude 编写查询语句，再把结果做成随数据变化更新的看板。例如，询问本周注册量与上月相比如何。每张图会显示背后的查询语句和最后刷新时间，也可以点开数字追溯查询、让 Claude 解释计算方式。这能帮助核查取数过程，但查询可见不代表结果必然正确。用来做业务判断前，仍需检查指标定义、筛选条件和数据来源。动画用代码生成，数字和时序都能修改Claude Motion 能把报告、图表、产品操作演示做成短动画。它通过代码让文字、图表、形状和图片动起来，不调用视频生成模型，也不生成视频片段或 AI 人物。生成后，可以在动画编辑器里继续要求修改文字、数字和时序，再导出 MP4。比如报告中的数字需要更新，可以要求修改对应数字；需要精修，也能继续转到视频编辑工具中处理。Docs、Slides、Design免费套餐也能用文档、幻灯片和设计功能已经结束测试。团队成员与 Claude 可以共同编辑同一份文档、幻灯片或设计；导出 PowerPoint、PDF 时保留格式，也支持导出可编辑的 Google Slides。Enterprise 的 Docs、Slides、Design 将于10月15日默认开启，管理员也可以提前启用。免费用户可以从这三项开始。已有数据平台的付费用户，可以试数据看板；要把报告做成动画讲解，目前需要 Team 或 Enterprise，并确认组织已开启 Motion。", "excerpt": "Claude能做实时看板和动画了数据汇报可以直接在 Claude 里做成会更新的看板，报告也能转成可修改的动画讲解。Anthropic 10月8日推出 Claude Dashboards 和 Claude Motion 测试版，同时让 Docs、Slides、Design 结束测试，向包括免费套餐在内的所有套餐开放。付费套餐能用看板，Motion仅限团队和企业Claude Dashboards 面", "url": "https://www.zhihu.com/pin/2092062852458756013", "votes": 0, "comments": 0, "feed_ts": 1791566689, "feed_time_str": "10-10 01:24", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么明末守个辽东总说军费不够？", "excerpt": "万历与天启崇祯时期比较，当然是因为万历拥有全辽之地，虽然万历辽东兵额为9万左右，但大部分军需实际上是由整个辽东卫所屯田和地方民运来解决，朝廷只需要补充不足的一小部分京运粮饷。 凡各镇兵饷，有屯粮，有民运、有盐引、有京运、有主兵年例，有客兵年例。屯粮者，明初各镇皆有屯田，一军之田足赡一军之用，卫所官吏俸粮皆取给焉。民运者，屯粮不足，加以民粮。麦、米、豆、草、布、钞、花绒运给戍卒，故谓之民运。后多议折", "url": "https://www.zhihu.com/question/1998345359290827637/answer/2091948595767518849", "votes": 52, "comments": 6, "feed_ts": 1791566567, "feed_time_str": "10-10 01:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "山姆拟限制亲友卡绑定，亲友卡一年仅可绑定 2 位主卡，此举有何考量？低价共享会员时代结束了吗？", "excerpt": "说白了就是通过追加换绑亲友卡的限制，堵住倒卖亲友卡身份的漏洞。 可以说山姆终于开始明明白白的意识到自己到底是什么，赚谁的钱了。 自己本质是一个中产消费俱乐部，是会员制的。 自己存在的意义，是服务那些愿意为自 工具沙盒与远程校验器严格隔离在本地进程边界之外，利用种子采样器配合确定性规则校验与大模型评审把关质量，并完整持久化失败上下文与工具调用轨迹。全面支撑Nemotron系列模型与企业级垂直任务框架在多项前沿任务中取得显著指标增益：Nemotron 3 Nano 在微调约 9K 条验证 JSON 样本后，JSONSchemaBench 遵从率从 80.2% 跃升至 86.9%；Text-to-SQL 任务筛除约 68% 候选后在 BIRD 基准上取得 41.80% 准确率；CrowdStrike 安全查询准确率达 96%，搜索 agent 交互轨迹与千万级长文档多模态问答亦显著提升模型表现。合成数据生成上限受限于内置自动校验机制NDD 展现了高质量自动化流水线的威力，但合成数据的有效性高度依赖初始种子多样性与客观规则校验；拒绝采样策略可能误筛长尾困难例，多模态视觉接地仍受制于视觉–语言评审模型精度。在复杂工程落地中，开发者依然需要结合真实业务数据分布与必要的人工审查来闭环未知失败模式。原文标题：NeMo Data Designer: An Extensible Framework for Multimodal Synthetic Data Generation#无影寺 ", "excerpt": "NVIDIA开源NDD用预览修订循环支撑约10万亿token合成数据\n图文版：链接预览修订循环支撑约10万亿token多模态合成数据针对多模态合成数据极难一次成型的工程瓶颈，NVIDIA 团队开源了通用框架 NeMo Data Designer（NDD）。开发者与代码 agent 可通过声明式配置灵活定义文本、代码、结构化 schema 与图像列；核心流程引入“预览–修订”闭环，支持在小规模切片上", "url": "https://www.zhihu.com/pin/2092055706908341885", "votes": 0, "comments": 0, "feed_ts": 1791565022, "feed_time_str": "10-10 00:57", "category": "pin", "cat_name": "想法动态"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "我又想起了院士的话，这些人是不是人？或者说，有没有被当人？", "excerpt": "我又想起了院士的话，这些人是不是人？或者说，有没有被当人？", "url": "https://www.zhihu.com/pin/2091419229174116627", "votes": 0, "comments": 0, "feed_ts": 1791563689, "feed_time_str": "10-10 00:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "模型多次采样时该有多少中文、英语和西语？MaD-RL给出一套分布级奖励\n图文版：链接MaD-RL怎样控制一组生成的类别比例MaD-RL 对同一提示采样多条完成，将它们分入预设类别，按观测比例与目标比例的 L2、前向 KL、反向 KL 或 JSD 差异给出分布奖励，并与任务正确性奖励混合。它控制的是一组生成的分布，不是单条回答。正确性RL把三项任务集中到中文、西班牙语和PythonQwen3-4B-Instruct-2507 在 GSM8K、MATH 的五种自然语言与 CodeContests 的五种编程语言上训练。仅正确性 RL 分别集中到中文、西班牙语和 Python。每个均匀目标 MaD-RL 配置的 JSD 都低于最佳正确性 RLVR seed。分布贴合比正确性RLVR低1.2到8.5个百分点三个后训练数据集上，MaD-RL 的 pooled median holdout pass@1 低 1.2 到 8.5 个百分点。编程目标会把概率从模型更擅长的 Python 和 C++ 移开，不能把这个代价全归给一种奖励。非均匀目标没有一种散度始终最好前向 KL、反向 KL、L2 和 JSD 的排序会随任务和目标形状变化。MaD-RL 提供的是类别比例与正确率之间的调节机制，不是对所有目标都最优的训练规则。原文标题：MaD-RL: Matching Distributions for Calibrating LLMs with Reinforcement Learning#无影寺 , "cat_name": "AI · 技术 · 算法"}, {"actor": "小旋风财进", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "能不能通俗地解释“盈亏同源”？", "excerpt": "举几个例子 荷兰之前发现了欧洲最大的天然气田，十年后荷兰人发现自己掉进了一个陷阱，天然气大量出口导致荷兰盾升值，制造业的出口报价贵了很多，工厂接不到单，人才涌向油气行业，制造业成片垮掉。天上掉下来的馅饼，把制造业砸没了，这叫荷兰病。 成也萧何败也萧何，优势就像一根柱子，上面撑着利润和风险，柱子塌的时候，利润和风险一起释放。优势会不会变成负债，要看它是资产还是依赖，资产有复利，依赖有折旧。判断办法是", "url": "https://www.zhihu.com/question/57790189/answer/2091933047105110251", "votes": 22, "comments": 6, "feed_ts": 1791535705, "feed_time_str": "10-09 16:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你听过最心酸的故事是什么?", "excerpt": "我楼下有一个夫妻店，卖烧烤的。 前天晚上我和老婆吵架了，拉拉扯扯的，最终还是自己道歉。 大半夜气不顺准备下楼喝口。 结果店主两口子居然也在闹别扭。 确切说，是女主人在骂老板。 我点了二十来个串儿，荤素搭配，烤了足足40分钟。 期间老板被媳妇数落得一无是处…… 有好几次我都想起身抽那个泼妇了，但他始终一言不发。 最后女的实在是骂没趣了，把一瓶摊子上的啤酒倒在自己老公头上，踹了一脚走了，留着男的一个人", "url": "https://www.zhihu.com/question/324467383/answer/2088970731178702499", "votes": 1252, "comments": 90, "feed_ts": 1791535657, "feed_time_str": "10-09 16:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价蒋奇明在《欢迎来龙餐馆》里的表现？", "excerpt": "“玛德，没糊弄过去” 能搞出这台词的人，是不是在国外混过？ 这种人一般不是在发达国家，而是在非洲、南美这种地方，大概率会有自己的枪。通常呆了八年以上，已经没有中国人长居和平环境的软弱，但乱世常有的行事作风，被中国人智慧与适应力替代。 如果他没有这样的经历，还临场创造出这样的台词，那他绝对是天才，深度吃透了角色的勇敢底色。 这种中国佬在非洲很典型的，在当地娶媳妇、经商、寻找人脉，还拿枪捍卫自己的财产", "url": "https://www.zhihu.com/question/2071283961712719581/answer/2074078069267116287", "votes": 3153, "comments": 123, "feed_ts": 1791535378, "feed_time_str": "10-09 16:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "为什么现在知乎上，出过国的人都在劝大家留在国内，而没出国的人都在劝大家离开国内？  虽然答主是短暂6个月居住在国内的半个外宾，但他对老中职场环境的洞察已经超过大部分左自，因为至少他能点出“甲乙方关系”是个和“上下级关系”并行的、对职场环境有显著影响的因素。而这个因素，可能因为大部分雕花劳资关系的左自都是学生党，他们只经历过“家长-孩子”和“老师-学生”的互动，所以对职场的理解就是真空球形鸡的上下级二元互动。至于单位对单位、行业对行业、甲方对乙方的剥削，这个普遍处于“灯下黑”状态，学生党最喜欢炮打的“下头小厂老板”很多时候也是剥削链条的下游，是被压价的供应商、被欠款的施工方。压榨这些供应商/行业的更光鲜的机构，因为可以用压榨所得把自己员工养得更好，在学生党那边也容易“免疫逃逸”。最终打了半天没解决任何问题，这些小厂关了关走了走，光鲜的机构总共也就招那点人，好像也没有改善就业环境嘛。而且老中很多被诟病“突击加班”，也是因为甲方本身不把乙方的作息当回事，经常在快到晚上的时候突然提出一些雷霆要求。但对于甲乙方问题，老中的学生党网左反而普遍共情甲方，比如跟着自由派玩什么“老中得罪甲方”的国际政治梗。毕竟他们理解的甲乙方关系可能就是“我出门旅游吃个饭，这家老板态度好不好”所以自动代入甲方视角。如果乙方过于苦逼，那他们只会凭空发明一个压迫他们的上级或者平台，作为甲方自己是万万不可能有问题的。举个例子，西安前几个月被游客骂出翔，但骂的理由，仔细想想也不过是西安作为老牌旅游城市，“乙方”疑似有点不够像乙方（而且被抱怨的不只是那个早就臭了的口民街，而是整个西安下沉到路边普通买水果的都被凝视）不像隔壁洛阳那么珍惜这点游客。但换个角度想，同样的服务态度如果不在西安而是在法国，这群人是不是又要转而称赞松弛感和小民尊严了呢？虽然我从地域角度肯定更支持洛阳，但是“甲方是上帝”和“一线就业者必须舒服”两者就是矛盾的，这点西安被黑的也确实过头了。想解决东亚就业环境，甲方本身的作风是要改善的，而这个“甲方问题”可以说老中没有人是无辜的，某些左自不敢碰的群体尤其不无辜。", "excerpt": "为什么现在知乎上，出过国的人都在劝大家留在国内，而没出国的人都在劝大家离开国内？  虽然答主是短暂6个月居住在国内的半个外宾，但他对老中职场环境的洞察已经超过大部分左自，因为至少他能点出“甲乙方关系”是个和“上下级关系”并行的、对职场环境有显著影响的因素。而这个因素，可能因为大部分雕花劳资关系的左自都是学生党，他们只经历过“家长-孩子”和“老师-学生”的互动，所以对职场的理解就是真空球形鸡的上下级", "url": "https://www.zhihu.com/pin/2090775740514055230", "votes": 0, "comments": 13, "feed_ts": 1791535322, "feed_time_str": "10-09 16:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "在公安局却不配发警服，请问他们是警察吗？", "excerpt": "我有一次在前公司的时候，来了四个国安。领头的哥们穿了一身运动服。 但是证件应该是真的。 说我们公司有个程序员，帮别人做了一个诈骗网站，后来网站被端了。。。然后查着查着就到他这了。（他们自己说的，但是我估计是假的，说辞） 不过国安来的时候，这哥们已经离职了。 这几个哥们还在那和我聊了半天，问我们业务是干啥的。 我说我们是做互联网装修的，那哥们还说，那以后我装修可得找你们。 问题是你微信都不加怎么找我", "url": "https://www.zhihu.com/question/618278725/answer/2020555906614588590", "votes": 438, "comments": 98, "feed_ts": 1791534935, "feed_time_str": "10-09 16:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "huntiger", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "梁文锋会不会成为中国AI里程碑人物？", "excerpt": "简单总结， 当整个中国的政府决策层面和各大国有非国有科技企业都在犹豫是跟着美国的AI步骤走还是尝试一下独立自主， 梁文锋的 DeepSeek在最恰当也是最关键的时刻出现了，它证明了中国人通过自己的人才培养、算力和算法也可以做出跟美国四六开的AI大模型，验证了这条路绝对可行， 好比国家正在思索一个科研方向有没有搞头，钱学森来了句放心搞这个方向没错， 这种信心加持是最可贵的。", "url": "https://www.zhihu.com/question/10315979917/answer/2070626477045977154", "votes": 6207, "comments": 103, "feed_ts": 1791534468, "feed_time_str": "10-09 16:27", "category": "ai  "https://www.zhihu.com/question/24992247/answer/2084571564465459369", "votes": 1962, "comments": 318, "feed_ts": 1791530583, "feed_time_str": "10-09 15:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "四千年前的学生，也得把同一个名字写六遍这块圆圆的泥板，第一眼看上去像一块压了花纹的饼。它其实是一份练字作业。大都会艺术博物馆的说明写得很具体：泥板上，一个名叫乌拉什的神祇，其名字被抄写了六次。它属于公元前20至16世纪的古巴比伦时期，用来帮助书吏学习苏美尔语和阿卡德语的楔形文字。这里需要交代清楚年代：这不是苏美尔最早城市兴起时留下的作业，而是苏美尔文字和语言传统在后世教育中延续的实物。类似的初级练习，老师会先在泥板正面写出示范，学生再到背面练习。小泥板可以托在手掌里。看这件东西，很容易想到一个具体的动作：先看一眼，再低下头，努力把笔尖压到合适的位置。楔形文字并不只是照着图形描几下。一个符号可能有不同的词义和读音，学习者得掌握大量符号及其用法。我们今天把整齐的文字当作文明成就，落到当年的学生手上，却是一次次重复。我喜欢看这样的文物，因为它让“文化传承”有了手感。一个时代的语言能被后人继续使用，背后有无数次示范、模仿和练习。至于这位学生当时认真还是走神，我们不知道。泥板替他留下了作业，没有替他留下表情。#苏美尔文明探秘 ", "excerpt": "四千年前的学生，也得把同一个名字写六遍这块圆圆的泥板，第一眼看上去像一块压了花纹的饼。它其实是一份练字作业。大都会艺术博物馆的说明写得很具体：泥板上，一个名叫乌拉什的神祇，其名字被抄写了六次。它属于公元前20至16世纪的古巴比伦时期，用来帮助书吏学习苏美尔语和阿卡德语的楔形文字。这里需要交代清楚年代：这不是苏美尔最早城市兴起时留下的作业，而是苏美尔文字和语言传统在后世教育中延续的实物。类似的初级练", "url": "https://www.zhihu.com/pin/2089264731949479464", "votes": 0, "comments": 4, "feed_ts": 1791530218, "feed_time_str": "10-09 15:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果富二代不去投资和接班，只吃利息会破产吗？", "excerpt": "我同学弟弟，以前经常一起踢球，家里2000个左右，算富二代吗？入门级别的吧。 ok，他家对他的要求就是：不创业，别沾赌毒，黄这个玩意，玩几次也就够了 可以去夜店，但不许夜不归宿，可以泡妹妹，但不能染上病，不能有孩子 百八十万的车随便换，但同时只能有一辆，什么大牌衣服随便买，一个月就给你三万，没了就等下个月吧。 必须上班，哪怕三千五千的班，也要上班 这哥们今年30多了，没给家里填过乱，没愁过钱花，家", "url": "https://www.zhihu.com/question/340686028/answer/2091477211111076644", "votes": 264, "comments": 63, "feed_ts": 1791530128, "feed_time_str": "10-09 15:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "南爸安爸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价字节Seed团队发现DeepSeek性能漂移？", "excerpt": "字节Seed团队的这篇论文发现DeepSeek会发生性能漂移： Periodic Weak Spots这里先回顾下DeepSeek V4的两种注意力设计： CSA，即压缩稀疏注意力，先把上下文压缩，再按当前查询挑选相关条目。它使用长度为8、步长为4的重叠窗口，将KV数量压到约四分之一，然后通过Indexer筛选，减少实际注意力计算量。HCA压缩得更狠，每128个token合并成一条，窗口不重 function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

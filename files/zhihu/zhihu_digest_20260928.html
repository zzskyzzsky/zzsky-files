title": "「神曲、圣经至堂吉诃德，追求油画的奇才画家，版画之神——古斯塔夫·多雷」", "excerpt": "他给《圣经》画了二百多张插图， 给《神曲》画了一百多张， 给《堂吉诃德》画了三百多张。 整个十九世纪，欧洲人读的那些书，翻开里面，图多半是他画的。 可他活着的时候，最大的愿望是当个正儿八经的油画家。 他画了几百张油画，一张都没进过卢浮宫。 他叫古斯塔夫·多雷。 一、五岁就能画画，十五岁签合同 多雷小时候身体不好，还摔断过鼻子，落下一个终生歪斜的鼻梁。 别的孩子在外面跑，他在家里画画。 五岁开始画。", "url": "https://zhuanlan.zhihu.com/p/2087369377796592031", "votes": 5, "comments": 0, "feed_ts": 1790525937, "feed_time_str": "09-28 00:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待美国网友咆哮物价太高?", "excerpt": "他们就是日子过的太好了无病呻吟，典型的被资本主义保护的太好的傻孩子。 小米su7低配在国内卖21w人民币，在美国卖7w美元，换算成人民币就是1w人民币，这么便宜的物价，还能咆哮？ ", "url": "https://www.zhihu.com/question/640059687/answer/85261910109", "votes": 8416, "comments": 547, "feed_ts": 1790525127, "feed_time_str": "09-28 00:05", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价马来西亚华人出生人口 4 万，已不足马来西亚出生人口 10% ？", "excerpt": "马来西亚明目张胆地搞民族歧视，将其写入宪法。 华人读大学的比例直接封死上限，华文中学成绩再好也不被承认，华人不能参军、不能做公务员。 但是马来西亚有因此完蛋吗？ 没有，反而是主体民族原来越稳定，地位越来越高，社会也比三十年前更稳定了。 马来西亚华人曾经人口占比40%，如今砍了一半。 又怎么样嘛？ 国际社会的制裁有如何马来西亚吗？ 没有。 这足以证明，比民族歧视更温和的主体民族优待，更不会导致国家完", "url": "https://www.zhihu.com/question/644177477/answer/2087099806795706418", "votes": 904, "comments": 40, "feed_ts": 1790524239, "feed_time_str": "09-27 23:50", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "现在的辫子戏为何大幅度式微了？", "excerpt": "最近热映的兰香如故，就是没有辫子的辫子戏。电视剧里，将占据有明一朝，两百多年，26%内阁，近半文武百官出身的军户描述成贱籍【超过十个内阁首辅，联手给你点了个踩，看不起谁呢？】 同时大幅度描写了，女主所谓融的方孝儒一家满门的惨状。然后方孝儒被诛十族本身就是谣言。这复仇又是从何说起? 再者，方孝儒最大的过错，其实就是以品德来进行察举制，然后贬低科举制。 察举制也分情况，其中以主观臆断的“品德”来进行察", "url": "https://www.zhihu.com/question/633756546/answer/2086170367937324479", "votes": 923, "comments": 90, "feed_ts": 1790524175, "feed_time_str": "09-27 23:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn nk Adaptation#无影寺 ", "excerpt": "标准LoRA的隐藏问题：B从0开始，前几步几乎全靠随机A决定更新方向\n图文版：链接NoRA把归一化约束做进A矩阵秩维标准LoRA把权重增量写为ΔW=αBA并将升维矩阵B置零，导致早期梯度更新方向几乎完全由随机初始化的降维矩阵A主导。微软亚洲研究院、香港中文大学与元始智能等机构提出NoRA，对A的每一列沿秩维度施加ℓ2范数归一化，将前向传播重构为α B Norm(A) x，在保持线性映射与权重合并优", "url": "https://www.zhihu.com/pin/2087671585985643745", "votes": 0, "comments": 0, "feed_ts": 1790519850, "feed_time_str": "09-27 22:37", "category": "pin", "cat_name": "想法动态"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价2026年9月米哈游《原神》7.1版本，冰神冰之女皇戏份？", "excerpt": "在见到安娜斯塔夏女皇之后才发现，曾经的我对“寡感美”的理解竟是如此肤浅。 她不一样，她不是一般、普通、常见的那种寡。她身上的确有种高高在上、不容冒犯的威严，可同时呢，面对直白到贴脸的威胁偏偏又有种逆来顺受的包容； 但那看似永远淡漠的顺从之下，只要事态发展下去，偏偏又总是她真正在主导局面； 作为手中执子、布设棋局的一方，只要存在必要，她偏偏又可以直接将己身作为诱饵，非常豁得出去——总之就是 太美味了", "url": "https://www.zhihu.com/question/2086242322979804924/answer/2087628904836108347", "votes": 344, "comments": 49, "feed_ts": 1790518591, "feed_time_str": "09-27 22:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "小米MiMo开源了5类RL环境和训练代码这次小米 MiMo 放出了：任务环境、验收办法和训练代码。对做 Agent 的人来说，这比单看一组模型权重更接近训练现场。模型完成任务后，必须有人告诉它“这次做对了吗”；RL 环境和验证器，就是这套反馈机制的一部分。代码、网安、网页和音乐，怎么给模型判分？MiMo 的公开仓库和数据集把任务分成五类：软件工程、漏洞复现、知识工作、网页开发、符号音乐。它们并不共用一种打分方式。写代码可以跑可执行测试；漏洞复现和音乐任务可以按规则检查；知识工作用量表式评判；网页开发则做视觉评分。模型要在一个能检查结果的任务里完成工作，而不只是回答一道题。这正是 RL 训练最容易被忽略的部分。模型权重告诉你“练完后长什么样”，但训练环境决定“练习题是什么、答案怎样验、奖励怎样回来”。如果没有这些配套资产，外部团队即使拿到模型，也很难知道它在同类任务里究竟接受了怎样的反馈。这次具体公开了什么？官方 GitHub 仓库给出基于 verl 的训练代码，并列出五类环境的启动脚本和配置样例。Hugging Face 数据集页给出相应的五个 subset：code、cyber、general、webdev、music；页面显示共 7,780 行、12.1 GB，同时链接了 Docker 镜像。这些信息至少让研究者能从“模型输出”往回看一层：任务如何组织、什么结果会被认可、训练脚本怎样把模型和环境接起来。社区讨论里有人把它类比为“RL 环境版的 Hugging Face”，指向的是可复用的任务与验证资产，不是单一模型的下载入口。但它不是一键复现包公开环境、数据集和脚本，不等于任何人都能直接复现 MiMo 的训练效果。不同机器、依赖版本、任务配置、奖励实现和训练参数都会影响结果；官方页面也没有承诺“照着跑就能得到同样能力”。更准确的看法是：这次把 Agent RL 中最难讲清的一段——任务怎样被验证、训练怎样接入环境——开放得更具体了。对想研究 Agent 后训练的人，这比只对着最终模型猜训练过程更有用。", "excerpt": "小米MiMo开源了5类RL环境和训练代码这次小米 MiMo 放出了：任务环境、验收办法和训练代码。对做 Agent 的人来说，这比单看一组模型权重更接近训练现场。模型完成任务后，必须有人告诉它“这次做对了吗”；RL 环境和验证器，就是这套反馈机制的一部分。代码、网安、网页和音乐，怎么给模型判分？MiMo 的公开仓库和数据集把任务分成五类：软件工程、漏洞复现、知识工作、网页开发、符号音乐。它们并不共", "url": "https://www.zhihu.com/pin/2087665163575022046", "votes": 0, "comments": 0, "feed_ts": 1790518424, "feed_time_str": "09-27 22:13", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "MiniMax最新的文本模型 M3.1-Flash-PreviewMiniMax 刚把 M3.1-Flash-Preview 放进 MiniMax Code。定位：一款做日常开发的文本模型，从修一个 bug 到补一整个功能都可以用。先看入口：目前官方明确的入口只有 MiniMax Code。它叫 Preview，意味着这次公告讲的是先上手试用，不是完整的性能发布。再看福利：9 月 28 日到 10 月 7 日（UTC+8），MiniMax Code 每日签到给双倍免费积分，新老用户都能参加。官方还说，M3.1-Flash-Preview 上线时，所有 Token Plan 配额会重置。这条公告没有给 benchmark、价格、参数量、开放权重时间，年费用户什么时候接入也没有明确。可见回复和引用里，大家问得最多的也正是这些。所以现在最合适的使用方式，是把它当作 MiniMax Code 里的新候选：拿你手头真实的小任务试一遍，比如修一个明确的 bug、补一个单文件功能，再看完成质量、改动是否可控、配额消耗是否能接受。别把“Flash”自动理解成某个跑分或价格结论。至少在这次官方信息里，这些数字都还没公开。等 MiniMax 后续放出 benchmark、价格或更完整的版本说明，再判断它适不适合替换你现在常用的编码模型。", "excerpt": "MiniMax最新的文本模型 M3.1-Flash-PreviewMiniMax 刚把 M3.1-Flash-Preview 放进 MiniMax Code。定位：一款做日常开发的文本模型，从修一个 bug 到补一整个功能都可以用。先看入口：目前官方明确的入口只有 MiniMax Code。它叫 Preview，意味着这次公告讲的是先上手试用，不是完整的性能发布。再看福利：9 月 28 日到 10", "url": "https://www.zhihu.com/pin/2087662862529458632", "votes": 0, "comments": 0, "feed_ts": 1790517665, "feed_time_str": "09-27 22:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "BBuf", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "记录下SGLang Diffusion BCG的实现和调试", "excerpt": "欢迎关注 SGLang，以及我的 CUDA 学习笔记和 AI Infra SKILLS 仓库： SGLang：https://http://github.com/sgl-project/sglang CUDA 学习笔记：https://http://github.com/BBuf/how-to-optim-algorithm-in-cuda AI Infra SKILLS：https://http", "url": "https://zhuanlan.zhihu.com/p/2087661423023354042", "votes": 13, "comments": 0, "feed_ts": 1790517338, "feed_time_str": "09-27 21:55", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "你让我说啥好？你自己说", "excerpt": "你让我说啥好？你自己说", "url": "https://www.zhihu.com/pin/2087579208776169164", "votes": 0, "comments": 66, "feed_ts": 1790516287, "feed_time_str": "09-27 21:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "只能说没想到马逆在知乎遭到忠诚审查、怀疑，乃至被视为“不体面”的原因，竟然是核心团队成员被质疑为女权之后恨屋及乌。马竹和马超都没能打倒马逆，观系的背景没能拖垮马逆，可疑的民族和高考加分问题已经是老生常谈。但是团队里有一个女权后，马逆就这样被认为是不忠诚了，而且直接和胖猫等词条强相关。我在想的另一个问题是，你能明确看到一贯很看不起知乎的抵抗系其实也和马逆乃至建制派一样，是一看到男女权问题就还是忍不住想拉偏架的（举例来说，大角鼠认为极端女权产生责任在男人（虽然他那个切片的核心是男性给女性打钱才导致了女权崛起，但显然还是不敢骂女权只敢拐个弯骂男人）；瓜某干脆回到舒适区认为男权是境外势力（指孙割等人，但说实话孙割李新野都说是和成都大使馆等量齐观的境外势力是否有点故意滥用词汇了）境外势力支持的——但你甚至很难看到这群人，除了现在被普遍认为不体面的牢A，用同样的密度这么讨论真的有境外势力支持的女权），更别说现在明牌往女权方面站的王左和目田。我们现在能看到的格局就是，不管是境外势力还是境内势力，所有还试图将自己塑造为体面人的用户都还是接受一整套女权叙事的，令人感叹。而几乎是天下无敌的牢A最后之所以被切割乃至被认为完成历史任务了，也不是完全因为他真的没活了，一定程度上是因为他对女性不尊重，以至于上述群体中引用他时会觉得他不体面。目前对他的论述也是斩杀线为主，三通一达和怼酸奶等除了在嘲讽特定用户（aka某编）的时候也不是那么上得了台面了。但这个时候又怎么能说外国的月亮更远呢？男权诸公吹过的或者期盼过的洋人里除了米莱大师勉强算是知行合一了，无论是尹锡悦（此人大概是最明牌利用这种情绪的，但废除女性家族部的法案没通过国会，反对性别配额反了个寂寞，最后干脆本人被证明是一个恋爱脑）还是特朗普，乃至AfD（他们的名义领袖就是一个女同性恋）等，这些洋人实际上利用男权反本国建制然后再一脚踢掉的胆子是有的，但真要剿匪是万万不能的。目前我们能怎么看待这种情况呢？我要举例来说，王左倒也不是有多尊重女性，几乎每年左翼社群都要因为裤裆与燕妮问题斗倒一大片令人尊重的先生。一个受人尊重的哲学博主最终名誉扫地，被盖章为不体面人也是因为广义上的裤裆问题。目田有多尊重女性也很难说，如果上升一点说，文自己的污点之一就是朴元淳吴巨敦这种一边打metoo牌一边自己去骚扰女性；纽约的安德鲁库莫在搞完骚扰之后甚至还能得到反性骚扰组织Time&#39;s up的公关帮助；现在还在折腾反厌女的工党自己也出过Abad和霍普金斯的指控等。如果下降一点说，我们也能记住一个曾经给大陆出版的《房思琪》写了推荐语结果自己被指控性骚扰而翻车的一个不便提及名字的先生。乃至最极端的情况，一些女权男（仍然不便提及名字的）的最终变现还是要发生一些水乳交融之事并因此翻车，可谓是某种几乎底层代码的问题了。因此我觉得男性对女权主义的拥护并不是一种因为尊重女性而产生的立场，这关乎于一种体面政治的塑造和一种话语上的高地问题。显然的，当你指控一个人或者一派人“不尊重女性”，光是洗掉这个标签就要折腾很久了。你也不要说“那我说我不尊重就完事了”。这个标签的高度有多高呢？一个曾经有家暴罪行的英语大师，其一整套话术几乎都是迎合80年代刻板印象的（教育部改为国防二部etc.），但其至今仍然必须一直为家暴问题道歉，乃至到了婴儿潮一代家长里，“他家暴过”也是一个能盖掉他那些80年代刻板印象言论的标签，从而上他的课变得非常不体面，需要他反复处理和掩盖。所以说到这里，我认为有必要进一步研究的是这种体面政治的高地是如何不分派系地生效的，毕竟马逆团队遭到忠诚审查说难听点仅仅是在知乎而已，其他平台的用户并不感到有任何奇怪。", "excerpt": "只能说没想到马逆在知乎遭到忠诚审查、怀疑，乃至被视为“不体面”的原因，竟然是核心团队成员被质疑为女权之后恨屋及乌。马竹和马超都没能打倒马逆，观系的背景没能拖垮马逆，可疑的民族和高考加分问题已经是老生常谈。但是团队里有一个女权后，马逆就这样被认为是不忠诚了，而且直接和胖猫等词条强相关。我在想的另一个问题是，你能明确看到一贯很看不起知乎的抵抗系其实也和马逆乃至建制派一样，是一看到男女权问题就还是忍不住", "url": "https://www.zhihu.com/pin/2087506170747565835", "votes": 0, "comments": 34, "feed_ts": 1790516066, "feed_time_str": "09-27 21:34", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "周公瑾", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "估计是我看的早，否则你这个回答不该才两位数的赞。", "excerpt": "估计是我看的早，否则你这个回答不该才两位数的赞。", "url": "https://www.zhihu.com/pin/2087656029328783241", "votes": 0, "comments": 0, "feed_ts": 1790515984, "feed_time_str": "09-27 21:33", "category": "pin", "cat_name": "想法动态"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么推特上反华言论那么多？", "excerpt": "就这么说吧，明天国台办说一句在网络发表反华言论的，在统一后以间谍罪论处。你信不信不说X上，知乎都会少1/3 用户。", "url": "https://www.zhihu.com/question/2078643789145678111/answer/2087650009147881366", "votes": 13, "comments": 3, "feed_ts": 1790514549, "feed_time_str": "09-27 21:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "电视剧《太平年》中「吴越」何以凭东南一隅对抗强大的「南唐」数十年之久，从经济角度看其有何特点？", "excerpt": "吴越国只需要做到南唐不敢全力来攻就可以了，所以吴越一直以来臣侍中原就是这个道理。如果南唐敢来，那么中原正统就会从背后攻击南唐。", "url": "https://www.zhihu.com/question/2001778800191629083/answer/2087649362738418027", "votes": 0, "comments": 0, "feed_ts": 1790514395, "feed_time_str": "09-27 21:06", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么《明史·神宗本纪》末尾的评语是：明之亡，亡于神宗？", "excerpt": "万历最大的问题，不是政治昏暗，不是财政匮乏，而是他带头摆烂，使得吏治颓废到不可收拾的地步。 从古到今，任何社会，从来都是人治。再好的政策，再好的制度，没有人执行，就是一盘散沙，都不用风吹，走两步就散了。 所以我常常表达一个观点：张居正最伟大的地方，不是一条鞭法，不是太仓之粮，不是边防稳固，而是以考成法，全面整顿吏治，全面降低治理成本。 当年中进士仅两年的张居正，在《论时政疏》中已经展现出自己的直达", "url": "https://www.zhihu.com/question/2079337342121292531/answer/2086847322525384797", "votes": 346, "comments": 20, "feed_ts": 1790513665, "feed_time_str": "09-27 20:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "这句话我觉得可以反映出很多人构建出的所谓&#34;西方文明&#34;的概念在现实中有多撕裂西班牙是地理大发现的发起者之一 几个小时，你看看彼此之间还会不会这么客气？3》今天的文章又被他们恶意举报掉了好多篇（图1），感谢大家的仗义申诉，有几篇已经恢复了。我刚才也已经申诉啦。按道理，如果我们的文章是违法违规的，应该是一篇一篇被举报的，但看图1中显示，这些就是集中在很短的时间内被攻击掉的，理由我猜是随便选的，只有有钱能买流量，雇人举报，比如100多个人同时举报，理由随便选，知乎就会“被迫”下架这篇文章。问题是，突然集中冒出了一堆举报，知乎不会做个筛查么？平常这些举报的人干啥去了？但知乎似乎不愿意做这种简单的筛查，知乎似乎默认：有钱，有人，有流量，不论什么文章，都可以被举报掉，即便是很久之前的文章。因此，我给知乎带来了不少流量啦，知乎欠我的钱？4》为什么一直被举报？其实，我们之前说了，他们找的那些来攻击的理由是站不住脚的。我可从来没有预防性拉黑过任何一个专栏用户。我们也没有群，因此，也从来没有指示任何人跑去别的群里宣传，我要那些“群友”干啥？我又不会去给群友讲课，也不直播，也没有公众号，实际上，我们所有的业务目前都局限在知乎本身。强调一下：我们所有的业务目前都局限在知乎本身。也没有任何人有我的知乎以外的即时聊天工具等。还有，即便被三番五次攻击，我们也没有举报过任何一名博主。一来没证据，二来没有时间，三来我看不上，尤其是搞群的那些博主，我不需要你们的群友，并且，这不符合效率。5》佛教里面有“肉身饲鹰”的故事，我们会这样做么？就像那个先知讲的，打你的左脸，把右脸也送给他们？那倒不至于，佛祖的肝能够没有代价地再长出来，因此，为了一个鸽子，把自己的肝给鹰吃是可以的。但，如果佛祖只有一次生命，剖出来肝脏就挂了，那么为了一个鸽子，挂了一个佛祖，就显得很不划算了，对么？我的想法是，粉丝数，推广，钞票都无所谓，名声都可以放一放，我会完成我承诺的专栏文章的创作。如果我本事很大，我会练成时间之鞭，不但鞭打帝国，也会鞭打总是想把专栏置于死地的 总是在背后偷偷搞事的那帮男女。但现在我还没这个本事，没这个本事前，什么事情都是数学概率，因此我只能保证不会辜负大家的嘱托，能完成文章就完成文章。剩下的就交给时间。即便明天太阳不再升起，那也是一种时间的安排，我们可以去想为什么太阳不再升起，也可以懒得理会这件事情，因为既然你都安排太阳都不再升起了，又有什么大不了的？该吃吃，该喝喝，这是“光”让你认识的世界，“光”啊，这么飞扬跋扈的东西，如果“光”不遵从数学，那我何必相信你？我会在专栏里面更快速地更新行情分析，随时都会更新的文章的链接请看这里：https://zhuanlan.zhihu.com/column/c_1962592595592081509声明：当前本号只在知乎上面发内容，别的自媒体平台上的同号都是假冒，没有任何别的平台的收费栏目，更没有任何私域或任何交流群。时间点是这个宇宙中最难把握的东西，本文中的时间和点位都仅作参考，并不提供任何投资建议，否则后果自负。", "excerpt": "原油，加拿大，黄金白银，时间之鞭。原油，加拿大，黄金白银，时间之鞭。1》据说，现在的加拿大-帝国的边境上，两国的卡车司机擦肩而过的时候，都要互相竖起中指问候。为什么曾经好到连边境线上一个兵都没有，持本国身份证就可以自由两边居住的“国”闹成了如今这副摸样？很简单，因为“油”，石油，原油，也就是“钱”。我们说，委内瑞拉管理层倒了，委内瑞拉的货币就是废纸，加拿大管理层倒了，加元也只能被收藏下，或者干脆当", "url": "https://www.zhihu.com/pin/2087633423057929300", "votes": 0, "comments": 20, "feed_ts": 1790511155, "feed_time_str": "09-27 20:12", "category": "pin", "cat_name": "想法动态"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中美达成八点成果共识，达成「300亿美元」对等降税安排，哪些信息值得重点关注？", "excerpt": "1、西大承认东大是一个档次。东大表示不会谋求取代西大的全球体系地位。 2、今载俩回合了没大定。11，西大中选之前，apec西大还会来东大。之后，12，g20东大也会去西大。那就说，还有俩回合。各种回家继续磨磨，毕竟明年才是分水岭。继续等冬天再说。 3、波斯湾那边，东大表示还有深入支持西大的空间。 4、日子这边，西大表示还有深入支持东大的空间。 5、贸易z这块，你赚你顺差，我剪我羊毛，两强互相暂时停", "url": "https://www.zhihu.com/question/20 读懂敌后抗战的艰难处境，才能深刻理解《游击队之歌》里那句硬核又写实的歌词：“没有吃没有穿，自有那敌人送上前；没有枪没有炮，敌人给我们造。”这并不是艺术夸张，而是八年敌后战场，最真实的生存与制胜逻辑。1939年9月25日，八路军120师358旅在河北灵寿陈庄大捷中，精准伏击、全歼日军第八混成旅团1200余人，成功击毙日军旅团长水原义重。此战是华北敌后战场教科书级的歼灭战，更具现实意义的是：我军缴获了日军大批量完整的制式装备。从留存的战地照片中可以清晰看见：掷弹筒、轻重机枪、防毒面具、三八大盖、日式钢盔，甚至战士身上穿戴的日军呢子大衣，全部来自战场缴获。在当年物资极度贫瘠、外部补给完全中断的晋察冀边区，日军的扫荡、合围、主动进攻，在某种程度上，恰恰成了八路军最主要的物资补给来源。日军频繁扫荡，反倒让我军不断更新装备；日军反复围剿，反倒倒逼我军战术愈发精湛、战力持续迭代。这便是敌后抗战最震撼的真相：敌人依仗的装备优势，最终化作我们御敌的底气；敌人发起的每一次进攻，最终都成为我们成长壮大的契机。时隔八十余年回望，这些斑驳的战地老照片，默默诉说着历史真相。八路军的敌后胜利，从不是偶然的奇迹，是过硬战术、灵活战法、无畏胆识，是无数革命先烈用鲜血和坚守拼出来的必然结果。#八路军     #抗日战争      #敌后战场 #历史老照片         #铭记历史        #缅怀先烈#晋察冀边区（纪录片）      #缴获 ", "excerpt": "为什么说当年日军，其实是在给晋察冀边区的八路军“输送物资”？翻看晋察冀根据地八路军的战地老影像，能得到一个很直观的认知：真实的敌后八路军，拥有成熟的战术体系、标准的班组协同、严明的战场纪律，绝不是很多人刻板印象中“只凭热血意志作战”的队伍。真正读懂敌后抗战的艰难处境，才能深刻理解《游击队之歌》里那句硬核又写实的歌词：“没有吃没有穿，自有那敌人送上前；没有枪没有炮，敌人给我们造。”这并不是艺术夸张，", "url": "https://www.zhihu.com/pin/2086027306502452340", "votes": 0, "comments": 12, "feed_ts": 1790505523, "feed_time_str": "09-27 18:38", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "平凡", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果我往中药里面掺西药卖能成为名中医吗？", "excerpt": "来个合集，介绍一下你的竞争对手们（观察一下西药在配料表里的位置哦）。 ", "url": "https://www.zhihu.com/question/637778683/answer/3514040522", "votes": 33712, "comments": 2802, "feed_ts": 1790505494, "feed_time_str": "09-27 18:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小德", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "士兵只携带150发子弹，战场上打光了怎么办？", "excerpt": "感谢邀答，我以自己经历回答吧。 在当代战争中，子弹消耗的很快。我们出实战任务，并不是只带150发子弹。 一般单兵是携带8-10个弹夹，枪上一个满夹，六个弹夹袋，这是7个，还有1个是放在战术背包里面的。而担任突击手位置的士兵需要携带更多要携带15-20个弹夹，有的是放在背包里，有的是用胶带把弹夹正反粘起来。 战场上打光了，就去装甲车里拿。一个班用装甲车里，有5000-10000发子弹（步枪加机枪），", "url": "https://www.zhihu.com/question/622363261/answer/1931755600800355666", "votes": 34783, "comments": 2025, "feed_ts": 1790505435, "feed_time_str": "09-27 18:37", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "既然国人嫌弃月 顶上一排灯，后来换了辆红色的mini，比较低调了。2、开课第一节开场白：“先自我介绍一下，（右手放左胸口）我叫刘欢”。有时会加一句“希望大家不要叫我唱歌”。﻿﻿实际上讲嗨了也会唱的，法语、意大利语啥的。﻿﻿手写板书，不用PPT，字很漂亮，拉丁文板书也不错。﻿﻿上课条理清晰，情绪稳定，不夸张，偶尔幽默。从始至终不提与自己歌手身份有关的内容。讲课内容很系统很专业，先划分大时代，再讲各时代的音乐风格及代表人物，偶尔穿插音乐家们的逸闻趣事，搞笑也是会的，有人统计过，1个半小时课，笑声20多次。﻿﻿烟瘾比较大，课间休息会跑到走廊抽烟斗。早年甚至一边抽烟一边讲课。﻿﻿以前上完课后会留一分钟时间给扑上去的学生签名，后来不给签了。8、《西方音乐史》是公共课，选修的人很多，蹭课的也很多。后来只能从选课的学生中用电脑随机选300人，上课要凭证进教室﻿﻿9期末考试是开卷，可以带任何资料，连考试卷子都是他亲自一个个的发到同学手里。﻿﻿﻿10最后一节课收尾都会分享一段他对古典音乐有用没用的理解，这段话很有意思（有同学还录了下来，网上有）：“音乐真的没有什么作用，我们这个世界就是这样，我们看到西方音乐走来的这个历程了，我们看到了这么多美好的音乐，这么多优秀的音乐家不断的努力，但是怎么了，音乐没有消除过贫困，没有阻挡过战争，那些缔造出那么美好音乐的民族，他们照样去屠杀，他们照样劣迹斑斑，音乐没有什么作用，但是对于我们来说，音乐可能又有作用。有作用就是在我们心底，因为我们爱它，我们可以留住一个随时可以去盼望美好的希望，一个希冀而已。实际上，音乐和所有的艺术在人类文明中的位置是一样的，就是一个不停地对美好的追问和探索。这就是有生命力的文明为什么可以一而再再而三延续生命力的原因，因为人们心底需要这种美好。而且我们看到的这个世界，我也不敢说他比以前更美好了，还是更不好了，但是我们只有一点可以告诉我们自己。如果我们更喜欢音乐，可以让我们自己更幸福、更快活。这就是我们在一起了解音乐所能达到的一点点，一点点的目的。所以，我能告诉大家的话就是，希望大家以后，爱音乐，他能给你们很多快乐。” ", "excerpt": "刘欢从1986年开始教《西方音乐史》，前后教了有26年左右，近年由于身体原因已经不教了。在某乎看了一些对外经贸大学的学生回忆，刘欢老师以前上课大概是这样的：1、刘欢之前每年在对外经贸大学上课3个多月。以前来学校开一个很拉风的大吉普，顶上一排灯，后来换了辆红色的mini，比较低调了。2、开课第一节开场白：“先自我介绍一下，（右手放左胸口）我叫刘欢”。有时会加一句“希望大家不要叫我唱歌”。﻿﻿实际上讲", "url": "https://www.zhihu.com/pin/2087284612137596668", "votes": 0, "comments": 239, "feed_ts": 1790476818, "feed_time_str": "09-27 10:40", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么现在国家要救股市？", "excerpt": "就说实话，有这种想法基本都是入市时间不长的朋友。 我自从进入资本市场之后，早就对“救市”这个词免疫了。 甚至是什么吧。 记住，当市场大规模喊救市的时候，差不多就是该离场的阶段了。 逻辑很简单： 市场本身行情好的时候，根本不需要出手救。 等到大家喊着要救的时候，往往也很难直接把行情拉回去。 所以很多时候相关举措的目标，不是把市场直接拉成大牛市，只是稳住盘面，避免出现极端暴跌。 的这个阶段目的只是烫平", "url": "https://www.zhihu.com/question/711289692/answer/2087483699688485508", "votes": 457, "comments": 55, "feed_ts": 1790474898, "feed_time_str": "09-27 10:08", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待新华社为王楚钦发声说他不该承受恶劣舆论环境？", "excerpt": "樊振东被网暴的时候新华社在哪？哦，在助纣为虐的媒体矩阵里。", "url": "https://www.zhihu.com/que       + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

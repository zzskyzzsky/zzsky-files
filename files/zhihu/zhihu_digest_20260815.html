后做极致的后训练。 其实除了 GLM-5.3 这个模型，今天还有一个模型是千问的 3.8 27B。 你要是单独来看的话，这两个模型好像没有什么可比性，因为一个是 27B 的模型，一个是将近 753B 的模型，参数的差别是 28 倍。 因为现在不是预训练时代了。如果是预训练时代的话，27B 的模型一定非常吃亏，因为它的世界知识完全比不过 7", "url": "https://www.zhihu.com/question/2071591447367770456/answer/2071757933608802133", "votes": 13, "comments": 2, "feed_ts": 1786725583, "feed_time_str": "08-15 00:39", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "终于等到你：Qwen3.8 27BQwen 把本周承诺的 Qwen3.8-27B 开放权重放出来了，同时 Hugging Face 上也有 Qwen3.8-2.4T-A95B。27B 能处理文本、图像和视频，原生上下文是 262K token，通过 YaRN 可扩到 1M；模型卡标的是 Apache-2.0，也写明兼容 Transformers、vLLM、SGLang 等常用栈。27B 的成绩Qwen模型卡给出的 27B 表中，Terminal Bench 2.1 是 73.0，Qwen3.7-Plus 是 64.0；SWE-bench Pro 是 61.7，Qwen3.7-Plus 是 57.6。它说明 Qwen3.8-27B 相比自家前代在这些设置里有提升，也解释了为什么社区会第一时间做 GGUF、SGLang 支持和本地测试。但这张表不能直接翻译成“27B 全面超过所有闭源大模型”。官方自己在脚注里写了部分结果的来源与 harness 并不完全一致，例如 Opus4.6 Max 保留官方报告分数，其他模型在修正后的 benchmark 上重新评测。真正关心编码 agent 的人，更适合等同一套本地环境下的复测。本地跑的门槛仍要看量化和上下文Unsloth已经给出 GGUF 量化和显存估算，也有 SGLang 宣布 Day-0 支持。这些信息说明生态跟进很快，但都属于第三方版本、第三方配置和第三方测试。尤其别把“可扩到 1M context”直接理解成消费级硬件的日常配置。量化位宽、KV cache、实际上下文长度、并发数都会影响显存和速度。Qwen 这次给了模型和兼容工具链，具体能否放进你的机器，要等你选定量化和任务长度后再判断。", "excerpt": "终于等到你：Qwen3.8 27BQwen 把本周承诺的 Qwen3.8-27B 开放权重放出来了，同时 Hugging Face 上也有 Qwen3.8-2.4T-A95B。27B 能处理文本、图像和视频，原生上下文是 262K token，通过 YaRN 可扩到 1M；模型卡标的是 Apache-2.0，也写明兼容 Transformers、vLLM、SGLang 等常用栈。27B 的成绩Qw", "url": "https://www.zhihu.com/pin/2071747374481924555", "votes": 0, "comments": 0, "feed_ts": 1786723224, "feed_time_str": "08-15 00:00", "category": "pin", "cat_name": "想法动态"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "《为什么要相信达尔文》读书笔记（七）", "excerpt": "摘要：在《为什么要相信达尔文》中，科因将遗传学、古生物学、地质学、分子生物学及解剖学现代研究结果的许多线索编织在一起，严谨而优雅地证明了为什么说进化论不止是一项正确的理论，更是一个事实。 达尔文七、物种的起源· 关于大自然最令人吃惊的事实就是它的不连续性。并不存在这样的情况：所有的猫科动物彼此之间只有微小的模糊差别，形成一系列中间体。 · 群与群之间还是在“生物体空间”中保持离散。我们在所有的生物", "url": "https://zhuanlan.zhihu.com/p/2070509301236602142", "votes": 16, "comments": 0, "feed_ts": 1786722994, "feed_time_str": "08-14 23:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价北京协和医院住院医用AI解决了困扰数学界的难题Crouzeix猜想？", "excerpt": "你真的不能不承认，这群北大人在数学上就是有一套，真的是牛逼。 截止到今天，我在 AI 科研里见过最让我眼前一亮的思路之一，是 Auto Research。它的思路其实非常简单：不要在一个方向上死磕，而是不断提出新的研究方向，然后以非常低的成本快速试错。 比如一个研究方向先给 5 分钟： 有明显进展，就继续； 没有明显进展，马上停； 换下一个方向； 然后不断循环。 本质上就是： 提出方案 → 实验 ", "url": "https://www.zhihu.com/question/2071486982732223991/answer/2071745067723776921", "votes": 187, "comments": 4, "feed_ts": 1786722515, "feed_time_str": "08-14 23:48", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "ChatGPT Mac版能回顾你刚才的电脑操作每次重新打开 ChatGPT，都要把昨天看的文件、刚聊过的 Slack、做到一半的任务再解释一遍，确实很烦。OpenAI 新出的 Computer History 想解决的就是这件事：让 ChatGPT 和 Codex 能参考你允许的应用、网站活动，接上你刚刚在做的工作。目前只在 macOS 的 ChatGPT desktop app 面向 Pro、Business 和 Enterprise 提供，而且默认关闭。它不是“装好就自动记录你的电脑”。它到底记录什么Computer History 会从允许来源收集交互事件，例如点击、输入、快捷键、应用切换，以及 macOS accessibility system 提供的上下文。系统会把这些事件整理成按时间排列的摘要和本地 memory，之后你可以问“我刚才在做什么”“那个方案文件在哪”，也可以从重复流程里生成 skill 或 automation。特别区分了一点：它不抓截图、不录屏、不收麦克风或系统音频，无痕浏览也不会纳入。它记录的是事件流，不是把你的屏幕视频完整交给 ChatGPT。权限和隐私怎么控制开启前可以选只包含哪些应用和网站，也可以排除指定来源；之后能从设置或 macOS 菜单栏暂停、恢复或关闭。历史可删单条，也能清最近 10 分钟、1 小时、1 天或全部。但“本地 memory”不等于信息永远不离开设备。文档写明：临时事件先在 Mac 上保存，最长 48 小时；生成 memory 时，临时事件流会交给短暂的 Codex session 在服务器处理。生成出来的 memory 文件留在本地，直到你主动删除。OpenAI称不会在处理后保留这些临时事件文件，也不用于训练，法律要求除外。谁现在能开Pro 用户可以自己选择开启。Business 和 Enterprise 需要管理员先授予访问权限，之后每位成员还要单独 opt in；它也依赖 Memories。当前不能通过 API key 或 Amazon Bedrock 使用，EEA、英国和瑞士仍要等后续开放。实际的判断标准很简单：如果你的日常工作确实跨很多文件、网页和工具，且愿意把允许范围收窄到工作应用，这个功能能减少大量重复交代上下文的时间。要是电脑里经常处理私人聊天、健康、财务或敏感客户内容，就先别把它当作“默认安全的记忆”，先配置 include/exclude、暂停习惯和删除方式。Computer History 真正带来的变化，是 ChatGPT 从“只看当前对话”走向“能接住刚刚发生的电脑工作”。它的价值取决于你愿意给它多少上下文，而它是否值得开启，取决于你能否接受并管理这份权限边界。", "excerpt": "ChatGPT Mac版能回顾你刚才的电脑操作每次重新打开 ChatGPT，都要把昨天看的文件、刚聊过的 Slack、做到一半的任务再解释一遍，确实很烦。OpenAI 新出的 Computer History 想解决的就是这件事：让 ChatGPT 和 Codex 能参考你允许的应用、网站活动，接上你刚刚在做的工作。目前只在 macOS 的 ChatGPT desktop app 面向 Pro、B", "url": "https://www.zhihu.com/pin/2071743938634035333", "votes": 0, "comments": 0, "feed_ts": 1786722255, "feed_time_str": "08-14 23:44", "category": "pin", "cat_name": "想法动态"}, {"actor": "一片空白", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "跟西方文明相比，中华文明有什么缺陷？", "excerpt": "1.科技长期停滞， 从5-13世纪几乎没有创造任何一项超前的科技和理论成果，直到15世纪以后才真正开始科技的高速发展。公元前的科技理论成就在5世纪以后大半丢失，有些甚至还要依靠阿拉伯人重新传入。2.社会等级森严，在一千年的时间里上层阶级仍然以世袭贵族为主，没有进化出考试选拔官员制度， 平民若想实现阶级跃迁，只能从事宗教行业，或参与战争获得军功，严重限制个人意志。广大农人则被束缚在土地上，承受着沉重", "url": "https://www.zhihu.com/question/609750049/answer/1940414842231055454", "votes": 2916, "comments": 607, "feed_ts": 1786720018, "feed_time_str": "08-14 23:06", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Cursor正式并入SpaceX，Cursor 会不会改名Cursor 官方宣布：收购已经正式完成，Cursor 现在是 SpaceX 的一部分，团队将加入 SpaceXAI，参与 Grok、Grok Build、Grok Bot、Grok API 和 Cursor 的改进。已确认的只有组织关系现有 Cursor 团队被并入 SpaceXAI。官方把目标写成共同改进多条 Grok 和 Cursor 产品线，说明 AI 编程工具会进入更大的 Grok 产品组合。用户最关心的几件事还没答案Cursor 会不会改名、订阅会不会调整、现有账号和模型供应怎么处理、功能路线会不会变，官方这条公告都没有说明。现在该怎么看对现有 Cursor 用户，眼下最可靠的信息是产品仍被官方点名列为会继续改进的对象；其他使用安排先按现有规则判断。对关注 AI 编程的人，这次真正值得持续跟的是后续产品公告：Grok 能力会怎样接进 Cursor，还是 Cursor 会保持相对独立的工具路径。这笔交易已经落地，但对用户体验的影响还没有落地。先记住“Cursor 已并入 SpaceXAI”，不要提前把品牌、价格、账号或模型变化想成既成事实。", "excerpt": "Cursor正式并入SpaceX，Cursor 会不会改名Cursor 官方宣布：收购已经正式完成，Cursor 现在是 SpaceX 的一部分，团队将加入 SpaceXAI，参与 Grok、Grok Build、Grok Bot、Grok API 和 Cursor 的改进。已确认的只有组织关系现有 Cursor 团队被并入 SpaceXAI。官方把目标写成共同改进多条 Grok 和 Cursor", "url": "https://www.zhihu.com/pin/2071732030686094129", "votes": 0, "comments": 0, "feed_ts": 1786719423, "feed_time_str": "08-14 22:57", "category": "pin", "cat_name": "想法动态"}, {"actor": "CVHub", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "【港大2027博士/博士后招生】刘世伟课题组招收多名 博士和 1 名博士后", "excerpt": "大家好，我是刘世伟，即将加入香港大学担任 Assistant Professor。此前我在德国 Max Planck Institute for Intelligent Systems 担任独立课题组组长，同时也是 ELLIS Institute Tübingen 的 PI。我长期从事高效深度学习、大模型预训练、后训练、模型压缩、scaling law、Diffusion Language Mod", "url": "https://zhuanlan.zhihu.com/p/2070903053809668598", "votes": 38, "comments": 3, "feed_ts": 1786716648, "feed_time_str": "08-14 22:10", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《年会不能停！2》票房预测跌至2.48亿，甚至不到第一部票房的零头，问题出在哪里？", "excerpt": "好莱坞有一个习俗，哪怕你不明白一个人为什么会火，只要他火了，那后面一定尽可能的不去换他，直到他下一次失败为止… 国内这种摘桃子模式大范围运行，只能说是国内电影行业的主业不是拍电影，而是宣传明星以后收偶像费和洗钱。 ", "url": "https://www.zhihu.com/question/2068466998103822555/answer/2069511681605210283", "votes": 4846, "comments": 273, "feed_ts": 1786716246, "feed_time_str": "08-14 22:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么俄罗斯坐拥1700多万平方公里的领土，依旧觉得生存空间不够？", "excerpt": "外网油管上凡是展示中国风景名胜的视频，如川西，西藏阿里，新疆，棒子网友都是这样评论的：他们几乎拥有世界上所有类型的风景，为什么上天把最好的土地和风景给了中国人，这不公平，历史上我们曾经击败过他们，他们的皇帝（李世民）被我们射成独眼龙，这些地方差一点成为我们的领土。 日本网友则是这样回复的：二战时候差一点就征服他们，这里差一点就成为我们的领土了，历史往往就差那么一点点。 阿三网友也表示，上天真是厚待", "url": "https://www.zhihu.com/question/593970989/answer/62280447031", "votes": 27355, "comments": 1415, "feed_ts": 1786716084, "feed_time_str": "08-14 22:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《欢迎来龙餐馆》中有哪些不容易被发现的细节？", "excerpt": "主角们对时局的漠视。 开场我还在想为什么餐厅一个服务员都没有，要经理来招待，后面才知道是所有服务员都在看电视，而电视里，正是时局紧张的新闻。 如果真的像蒋奇明说的那样老一套，当地人不会连活都不干就围在电视机前看新闻，但他们并不重视。 可以说，这样的小细节到处都是，我觉得这种抽离感，已经到了黑色幽默的地步。 走私商结婚宴开枪庆祝，他们只是被吓了一跳；英国大使馆都断水断电，他没事，他还很不当一回事；自", "url": "https://www.zhihu.com/question/2070093885473346545/answer/2070567570206462808", "votes": 579, "comments": 84, "feed_ts": 1786715943, "feed_time_str": "08-14 21:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价《欢迎来龙餐馆》这部电影？", "excerpt": "这部电影非常可惜，我的评价是半步神作，离神作只差半步之遥。然而就是这半步没走上去，导致整个片子最终还是泄气了。 毋庸置疑，文牧野的导演功底和视听语言皆属顶级，《欢迎来龙餐馆》的前半部分表现几乎完美，完全可以拿去对标影史名作。从开场直到老扎家人遇难，这将近一个小时的内容呈现可以打满分。 然而可惜的是，从徐福被美军抓走开始，整个电影一下子变成了松散的流水账，人物动机和情节设计均出现大量硬伤，叙事节奏也", "url": "https://www.zhihu.com/question/2070182701299152586/answer/2070856123687645302", "votes": 490, "comments": 151, "feed_ts": 1786715867, "feed_time_str": "08-14 21:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待段永平「我敢抱着茅台跟任何基金赌一个亿」的言论？", "excerpt": "他赌一个亿没意思。 我敢拿自己50%的净资产跟他对赌，赌50%他的资产。 要是换成百分比伤害，你看他接不接。 我对茅台不了解，所以赌错赌对这个判断不了。 （赌输了我亏50%，老实说我也不希望，自己也有七位数在股市里。但是按一个亿所占百分比的仓位跟他赌，我觉得可以试试） ", "url": "https://www.zhihu.com/question/2071536115983410411/answer/2071559532346718159", "votes": 131, "comments": 8, "feed_ts": 1786715833, "feed_time_str": "08-14 21:57", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "历史上有哪些经典的复仇？", "excerpt": "波兰对德国的。 在第二次世界大战中，纳粹德国对波兰实行了罄竹难书的罪行。 在介绍德国的罪行之前，我们必须要先介绍一个具体的背景信息——第一次世界大战后，波兰通过争议手段获取了西里西亚、马祖里等原属德国的领土。当地居民多为兼具德波双重文化特征的“边界民族”。 纳粹占领后，将波兰人分为两类：一类是“可日耳曼化”的德波混合族群，试图强制清除其波兰痕迹；另一类则是被视为“无可救药”的纯波兰人和犹太人，直接", "url": "https://www.zhihu.com/question/66109162/answer/2071609270827738619", "votes": 192, "comments": 24, "feed_ts": 1786715750, "feed_time_str": "08-14 21:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价《欢迎来龙餐馆》里的角色赛夫？", "excerpt": "你徐福哥在中东救了23个孩子，掰回来一个赛夫，把他培养成了厨师，连带解决了几十个人的就业问题，免于让他们踏入炸弹人的悲惨命运。 下面这位哥可是在新疆生生捞了150万人回来，把他们培养成了厨师、服务员、产业工人、工程师、农民、军人、公务员以及等等等等，让他们免于成为炸弹人的悲惨命运。 ", "url": "https://www.zhihu.com/question/2069840201854227464/answer/2071270043334321141", "votes": 6630, "comments": 432, "feed_ts": 1786715460, "feed_time_str": "08-14 21:51", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "未来加电站", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "从“四平八稳”到自曝其短，王朝团队比秦MAX更值得关注", "excerpt": "秦系列这种走量车的上市发布会，其实要比一些爆款车更难。 因为定价和成本的限制，配置上基本不太能有特别出彩的地方，所以对于路天的王朝团队来说，把什么作为突出要点讲述，以及讲述方式，都是一个挑战。 这场发布会上让人印象比较深刻的点有：开场就说累计销量突破290万辆，这一数据是在告诉大家秦这款车已经是一个“常青树”，选它肯定不会“出错”。 之后路天对秦MAX的定位是“大”和“不同”，这一点概括的非常精准", "url": "https://zhuanlan.zhihu.com/p/2071711940628439543", "votes": 0, "comments": 0, "feed_ts": 1786714625, "feed_time_str": "08-14 21:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价《欢迎来龙餐馆》这部电影？", "excerpt": "我看有人说这电影美化美军了，那当然，当然是美化美军，美军作恶比这里面多一千倍不止。 但我没觉得这个事有那么不妥，因为这个电影也美化教友了，现实教友作的恶比这里面校长多一千倍不止。 至于为什么两边都美化，那不废话么，这是电影，拍多了你也放不出来啊。 美军当然是出生，但是我还是一直非常反对把中东那些事儿类比成中国的保家卫国战争。 当然美军确实跟日军一样出生，但是你拿教友类比咱们中国人这个我真接受不了。", "url": "https://www.zhihu.com/question/2070182701299152586/answer/2071323078928471092", "votes": 611, "comments": 65, "feed_ts": 1786714531, "feed_time_str": "08-14 21:35", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "全球首款机器人手机荣耀Robot Phone发布，引领智能手机迈入具身交互时代", "excerpt": "2026年8月12日，全球领先的AI终端生态公司荣耀（HONOR）在广州举办“嗨！新朋友”荣耀Robot Phone全球新品发布会，正式推出全球首款机器人手机荣耀Robot Phone。 作为荣耀“敢想、敢不同”品牌精神的集中体现，荣耀Robot Phone以首创的四自由度钛合金灵巧云台，赋予手机机器人级“身体”；以Agentic OS内核，构建首个系统级Agent架构，为用户带来跨越式的智能交互", "url": "https://zhuanlan.zhihu.com/p/2071708683483066864", "votes": 0, "comments": 0, "feed_ts": 1786713980, "feed_time_str": "08-14 21:26", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "GPT-5.6 Sol 新增了Ultrafast 档，快 14 倍OpenAI 给 GPT-5.6 Sol 新增了 Ultrafast 档位：官方称最高比 Standard processing 快 14 倍，最高每秒生成 750 个 output token。但这不是 ChatGPT 面向所有用户的开关。目前它只在 OpenAI API 向部分企业客户进行 limited preview，容量扩大后才会继续放开。750 token/s 用在什么地方OpenAI 列的场景很一致：实时语音和客户支持、故障响应、金融研究与安全、商业服务，以及需要快速反复试验的研究工作流。这些任务的共同点是，人或系统还在等待下一步。比如故障发生时，要同时看日志、近期代码改动和工程师报告，再决定检查什么、怎么验证修复。官方想缩短的是“看到信号、验证假设、做下一步”的循环，而不仅是让聊天窗口吐字更快。速度来自什么，能力边界在哪Ultrafast 由 Cerebras 提供支持。OpenAI 的表述是：让旗下最强模型进入对延迟最敏感的工作流，而不是为了实时性换用更小或更专用的模型。不过，当前信息只足以确认速度、部分使用场景和合作方。价格、正式普及时间、所有可调用参数都还没有公开。官方也没有承诺它会在 ChatGPT 中向普通用户上线。现在谁可以申请OpenAI申请页写得很直接：容量有限，会根据 workload fit 和可用容量评估客户。企业申请时可以填写使用场景、延迟痛点、预计用量、当前供应商和时间需求。因此，这轮最适合关注的是确实有实时交互压力的 API 团队，例如语音客服、在线商业服务或需要快速分析运行证据的工程团队。普通开发者现在能做的是登记接收扩容通知，不能把这次预览当成已经可以直接调用的公共 API。这次发布传递的结论很清楚：前沿模型的竞争开始多了一条“单位时间能完成多少工作”的轴。GPT-5.6 Sol 的 Ultrafast 已经把这个方向放进企业 API，但它仍是受容量约束的定向预览，先看真实工作负载能否证明这 14 倍速度值得被大规模交付。", "excerpt": "GPT-5.6 Sol 新增了Ultrafast 档，快 14 倍OpenAI 给 GPT-5.6 Sol 新增了 Ultrafast 档位：官方称最高比 Standard processing 快 14 倍，最高每秒生成 750 个 output token。但这不是 ChatGPT 面向所有用户的开关。目前它只在 OpenAI API 向部分企业客户进行 limited preview，容量扩", "url": "https://www.zhihu.com/pin/2071706254989340843", "votes": 0, "comments": 0, "feed_ts": 1786713284, "feed_time_str": "08-14 21:14", "category": "pin", "cat_name": "想法动态"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果当年阿拉伯帝国征服了中国，中国会伊斯兰化吗？", "excerpt": "黄河可不管你信什么 小冰河期也不会在乎你 还有蝗灾水灾旱灾白灾 任何宗教在老中这块地区的结局都是退化成民俗活动 治不好水黄河上岸收供品时宗教解决不了问题很快就没人信了 大灾之年岁大饥人相食的时候可不管你的教职有多高 这还没说猪肉和酒的问题 牛要耕地，羊巨他妈贵，在现代化养殖前只有猪肉能吃的多点，你不让吃猪肉，那吃什么啊 ", "url": "https://www.zhihu.com/question/2063347973493355807/answer/2064233220846232445", "votes": 557, "comments": 63, "feed_ts": 1786713085, "feed_time_str": "08-14 21:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果当年阿拉伯帝国征服了中国，中国会伊斯兰化吗？", "excerpt": "勤劳智慧的中国劳动人民能给你来个修黄河时挖出穆圣遗训石碑的高血压操作。什么？你说穆圣没来过中国？怎么他老人给我托梦说当年夜行登霄去的地方就是中国。", "url": "https://www.zhihu.com/question/2063347973493355807/answer/2064003901066682936", "votes": 2429, "comments": 41, "feed_ts": 1786713070, "feed_time_str": "08-14 21:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待以军士兵把枪口对准我国记者？", "excerpt": "少见多怪IDF向来都是以击杀记者和平民闻名于世的，这次的记者竟然被瞄准了十秒还没死，该士兵严重违反了IDF的交战准则、回去之后准备上军事法庭吧", "url": "https://www.zhihu.com/question/206977905 亿）三星 （1.06", "url": "https://www.zhihu.com/question/2011388864347001367/answer/2070410706181173837", "votes": 3392, "comments": 279, "feed_ts": 1786710632, "feed_time_str": "08-14 20:30", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么蛋糕叫蛋糕，他和鸡蛋有任何关系吗，外国人学中文会不会很难理解?", "excerpt": "来告诉我，中间这个圆圆的东西是什么？ ", "url": "https://www.zhihu.com/question/1899205306006896848/answer/2003614970215170585", "votes": 6089, "comments": 173, "feed_ts": 1786710575, "feed_time_str": "08-14 20:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价刘邦把自己儿女踹下车的行为？", "excerpt": "西汉到底是有多干净，能让这样的史书流传下来。", "url": "https://www.zhihu.com/question/663673537/answer/2069149262445799102", "votes": 16271, "comments": 537, "feed_ts": 1786710425, "feed_time_str": "08-14 20:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "随着中期选举临近，民主党人将伊朗战争成本作为攻击特朗普的把柄随着燃料和家庭成本上涨成为11月中期选举前日益重要的议题，美国民主党人似乎正在加大力度抨击唐纳德·特朗普总统，指责其应对伊朗战争造成的经济后果负责。随着全国平均汽油价格再次攀升至每加仑4美元以上，批评之声也日益高涨。与此同时，民主党人似乎正在削弱共和党在经济问题上历来拥有的优势。自2月份伊朗战争爆发以来，汽油价格已上涨超过25%。伊利诺伊州众议员妮基·布津斯基周四指出，汽油价格最近上涨，称全国平均油价已达到今年同期的历史最高水平。“全国汽油平均价格刚刚创下往年同期历史新高——超过每加仑 4 美元，”她在 X 上写道。“伊利诺伊州中部地区的家庭每次去加油站加油，都在为伊朗战争付出代价。”俄勒冈州众议员安德里亚·萨利纳斯表示，美国农民在春季播种季节的柴油支出比上一年增加了 14 亿美元，她将这一增长归咎于冲突。她写道：“特朗普发动的非法战争推高了燃油价格，最终付出代价的是种植户。”民调显示，距离 11 月 3 日中期选举还有三个月，经济问题对特朗普和共和党人来说正变得越来越棘手，而此时却发生了这些攻击。本月公布的一项路透社/益普索民调显示，37%的注册选民更倾向于民主党的经济政策，而36%的注册选民则倾向于共和党——这是近十年来民主党在该问题上首次取得优势。上个月《华盛顿邮报》/益普索的另一项民调显示，经济和高物价是选民在中期选举中最常提及的因素，54%的登记选民都提到了这一点。只有33%的人认可特朗普对经济的处理方式，而65%的人表示不认可。马萨诸塞州众议员吉姆·麦戈文试图将这场战争与特朗普更广泛的经济议程联系起来，包括关税和税收政策。麦戈文写道：“特朗普承诺上任第一天就降低物价。然而，他奉行的亿万富翁优先的经济政策、愚蠢的关税以及与伊朗的非法战争，却将物价推至历史新高。”“他的政策选择让你们的生活成本更高，而超级富豪们的生活却比以往任何时候都更加富裕，”他补充道。7 月份通货膨胀略有缓解，但仍高于伊朗战争前的水平，而消费者价格已连续四个月上涨速度超过工资上涨速度。参议员伯尼·桑德斯将联邦政府在战争和减税方面的支出与家庭面临的成本压力进行了对比，从而强化了这一论点。桑德斯写道：“9亿美元用于白宫的面子工程？批准。1万亿美元给1%的富人减税？批准。1万亿美元用于对伊朗开战？批准。”“降低食品杂货、住房或汽油价格？抱歉，这得靠你自己。钱都进了亿万富翁的口袋。钱都进了战争的口袋。劳动人民什么也得不到。”民主党越来越关注汽油、食品杂货和伊朗战争，这表明该党看到了一个机会，可以利用这个在 2024 年帮助特朗普重返白宫的议题，在 11 月的大选中对付共和党人。#伊朗  #美国  #唐纳德·约翰·特朗普（Donald J. Trump）  #美国选举  #民主党（美国） ", "excerpt": "随着中期选举临近，民主党人将伊朗战争成本作为攻击特朗普的把柄随着燃料和家庭成本上涨成为11月中期选举前日益重要的议题，美国民主党人似乎正在加大力度抨击唐纳德·特朗普总统，指责其应对伊朗战争造成的经济后果负责。随着全国平均汽油价格再次攀升至每加仑4美元以上，批评之声也日益高涨。与此同时，民主党人似乎正在削弱共和党在经济问题上历来拥有的优势。自2月份伊朗战争爆发以来，汽油价格已上涨超过25%。伊利诺伊", "url": "https://www.zhihu.com/pin/2071618296735180565", "votes": 0, "comments": 0, "feed_ts": 1786710273, "feed_time_str": "08-14 20:24", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果要在50-100年内，锁死一个国家的科技树，有可能从哪些方面着手?", "excerpt": "扶植一个独裁封建奴隶主当领导就行 ", "url": "https://www.zhihu.com/question/1963418359552022154/answer/2068239096766535304", "votes": 7069, "comments": 248, "feed_ts": 1786709591, "feed_time_str": "08-14 20:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "刘国梁为什么要培养王楚钦呢?", "excerpt": "", "url": "https://www.zhihu.com/question/662705703/answer/2044914606926205487", "votes": 484, "comments": 9, "feed_ts": 1786709106, "feed_time_str": "08-14 20:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如果汉人当皇帝，清朝能赶上工业革命吗？", "excerpt": "不能，八股取士本来就是排斥科学的。唐宋还有算科，明朝彻底没有了。数学是工业根本，你不重视数学，凭借几个数学天才官员是没有任何意义的。同时士绅制度，导致把人口牢牢锁在土地上，工业的前提就是要把壮劳力赶到工厂里，而从明朝延续到清朝的80多种户籍制度是完全与这个矛盾的。 而洋务运动为什么会有大量人去当工人，那是因为太平天国摧毁了南方的农业和南方的社会体系，导致大量失地农民只能去做工人了。 所以第三中华帝", "url": "https://www.zhihu.com/question/14161797906/answer/2071685826958956421", "votes": 7, "comments": 6, "feed_ts": 1786708391, "feed_time_str": "08-14 19:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "多年不见的亲戚，要求我为其巨额个人债务提供担保，遭拒绝后恶毒辱骂我，还在亲戚群里骂我见死不救，怎么办？", "excerpt": "上个月遇到的事情。我爱人的表哥，打电话给我们，希望给其做个担保。 表哥借钱40万，每月还3000，3年后本金一次性还清。现在需要一个社保、工资流水正常、信用清白的人，找来找去，找到了我。我表明了对风险的担心，表哥说担保后5个月，再签署一个协议就可以免除担保了。 以我有限的认知，是真的搞不明白这到底是个什么借贷产品。 再次表明风险，说可能影响到我们的孩子。表哥直接来了一句：“你们在乎这个吗？”，我不", "url": "https://www.zhihu.com/question/579475490/answer/2069466443561820963", "votes": 367, "comments": 48, "feed_ts": 1786708369, "feed_time_str": "08-14 19:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "《圣斗士星矢》里面为什么会出现扔石头的冥斗士？", "excerpt": "这是个神话寓言，实际上这哥们在恐怖游轮里面也出现了。他就是西西佛斯，因为这哥们把神耍的团团转，被诸神惩罚在冥界永远推石头。 实际上冥界篇本来是想大制作的，但是圣斗士后期不停的重复打怪，导致读者失去兴趣，所以就草草结尾了。 ", "url": "https://www.zhihu.com/question/2070465323418105789/answer/2071678285944198675", "votes": 4, "comments": 0, "feed_ts": 1786706593, "feed_time_str": "08-14 19:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为啥「非洲起源论」成了一个近乎不容质疑的科学教条？", "excerpt": "谁说不能质疑了？ 你拿出证据来，在“非洲起源论”的逻辑结构（包括生物学、“考古学”、“化石”……等等方面），给他一击，你看还会有人信这个学说不？ 你不能光凭“信仰”就去质疑。 万一，万一哈，我“信仰”：顺着网线，在屏幕对面的那个题主，是个机器人，题主何以自证呢？ ", "url": "https://www.zhihu.com/question/2007523990403568120/answer/2071672071596385007", "votes": 4, "comments": 0, "feed_ts": 1786706273, "feed_time_str": "08-14 19:17", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果明朝在15世纪主动开启大航海发现美洲，却立法严禁白银流入以维持铜钱本位，世界历史会如何改写？", "excerpt": "“铜钱本位”本身就是个不存在的东西，首先在清末的《币制则例》之前，中国一直都没有建立起任何的货币本位制度，无论是黄金、白银、铜钱还是实物货币都是市场上流通的“通货”，只能称为有货币制度，而无本位制度。 而且在明朝也没有足够的铜钱在市场上流通和使用。与宋朝和清朝这两个重视铜钱的朝代不同，元明两朝的铜钱经济总体上处于一个消退与不发达的状态，明朝则尤为突出。如果说清朝建立起了大体上的“银钱并行”的货币…", "url": "https://www.zhihu.com/question/2056446649107492982/answer/2071356568558375328", "votes": 65, "comments": 1, "feed_ts": 1786706245, "feed_time_str": "08-14 19:17", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "百万粉丝网红姜小柔去世，年仅 24 岁，还有哪些信息值得关注？", "excerpt": "这位是因为反迷信火的，结果车祸就她没了。 这下迷信的更信了… 但她也只是砸了观音像，虎哥当年整过的反迷信狠活包括但不限于： 虎哥对着女纸人深情拥吻、闻香，然后给自己配了个冥婚： 在直播中尝试召唤笔仙未果，转而指着笔仙啊米诺斯、盗食贡品并开骨灰盒（后被证明是面粉）然后在墓前和墓主谈心、提前定制寿衣、购买金元宝、烧纸钱，并躺在棺材里演练自己的葬礼、把市场能买到的所有佛像让老和尚挨个开光，然后全部砸碎并", "url": "https://www.zhihu.com/question/2070280309057263511/answer/2070834946982274608", "votes": 7638, "comments": 521, "feed_ts": 1786706091, "feed_time_str": "08-14 19:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "小伙为控体重改喝 「0糖」「无糖」饮料一年多，体重不降反增血脂也升高了，这是什么原因？", "excerpt": "太巧了，我就是喝无糖可乐的。 我感觉再这么喝下去，下腹都要爆血管了。 富有魅力的新闻学经常用这一类 狡猾的小胖子攻击无糖饮料。无糖饮料本身就比有糖的味道差一点，所以需求它的很大比例就是肥胖超重人群。 而这些人的问题远远不止饮料这么简单。 他们喝无糖饮料会胖，喝有糖的会更胖。 为什么说他们是狡猾的小胖子呢？ 因为其中很多胖子，是用一丁点微不足道的自律，来让自己进行更心安理得的放纵。 他喝无糖饮料少摄", "url": "https://www.zhihu.com/question/2071242924139067094/answer/2071675801058162445", "votes": 10, "comments": 0, "feed_ts": 1786706001, "feed_time_str": "08-14 19:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "男子健身房指导女友被场馆教练认定为外来私教，要求看结婚证，否则就办理退卡，这合理吗？健身房有权核查吗？", "excerpt": "不合理，但没办法。 因为这是结构性利益摩擦。 所有从健身房经营角度出发的都错了，这个问题不是健身房的视角，而是场馆自己教练要甩锅。 场馆教练不管认为不认为你们是外来私教，他的KPI都导致他必须走这么一步，他不是为了维护健身房的利益，健身房利益管他啥事儿，其他会员怎么想管他啥事儿，这又不是他的健身房，他只是为了自己不粘锅。 你男朋友练得这么好，指导看起来又这么专业，健身房一堆摄像头拍下来有疑似外来教", "url": "https://www.zhihu.com/question/2071379437682267339/answer/2071674272238588160", "votes": 324, "comments": 21, "feed_ts": 1786705636, "feed_time_str": "08-14 19:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "一波说酒发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "最牛的牛栏山白酒？牛栏山百年清牛测评#一波说酒  #牛栏山百年清牛  #牛栏山酒  #汾酒青花50 ", "excerpt": "最牛的牛栏山白酒？牛栏山百年清牛测评#一波说酒  #牛栏山百年清牛  #牛栏山酒  #汾酒青花50 ", "url": "https://www.zhihu.com/pin/2071603664276525148", "votes": 0, "comments": 0, "feed_ts": 1786705238, "feed_time_str": "08-14 19:00", "category": "pin", "cat_name": "想法动态"}, {"actor": "安森垚", "verb hu.com/question/2068044913405700076/answer/2071554363970140086", "votes": 8, "comments": 3, "feed_ts": 1786677048, "feed_time_str": "08-14 11:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "一夜之间，GPT-5.6 Sol被OpenAI加速了14倍", "excerpt": "AI 开始卷信息不对等了？ 8 月 14 日凌晨，OpenAI 联合 AI 芯片厂商 Cerebras 正式预览了其旗舰模型 GPT-5.6 Sol 的全新服务层级「超高速模式」（Ultrafast Mode）。 在该模式下， GPT-5.6 Sol 的输出速度最高可达 750 tokens/s，相比目前 Standard（标准）模式约 53 tokens/s 的推理基线，速度提升最高达 14 倍", "url": "https://zhuanlan.zhihu.com/p/2071552579058790428", "votes": 24, "comments": 10, "feed_ts": 1786677024, "feed_time_str": "08-14 11:10", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "怎么看 Claude 将在新的 Claude 模型的生成文本里加入隐形水印？", "excerpt": "我们核心可以看下，技术上到底是怎么实现的，为什么 Anthropic 要在这个时间点强推，以及这玩意对我们普通人的工作到底有多大影响。 先说技术底座。 现在网上流传最广的一个误解，就是觉得 Claude 在文本里偷偷塞了某种零宽空格，或者加了特殊的不乱码字符。这完全是无稽之谈。Anthropic 官方说得很明白，这叫模型层面的不可感知信号。什么意思呢，大语言模型生成文字的过程，其实就是个计算概率的", "url": "https://www.zhihu.com/question/2070443311802867884/answer/2071553152407560805", "votes": 7, "comments": 0, "feed_ts": 1786676759, "feed_time_str": "08-14 11:05", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "程序员，男，34岁，被老婆嫌弃到要离婚，想认真听听大家的看法？", "excerpt": "等你真正失业了，你老婆绝对会各种找茬逼你离婚，我89的，也是程序员，前年失业后前妻就各种找茬，见我不离婚直接偷偷转移财产，还请了律师打离婚官司，女人一旦嫌弃你，除非在你那里有利可图，不然迟早都是离，劝兄弟你早做准备，现在还没真的给你跟你离婚，是你目前还有金钱上的价值，离婚了你这么多年赚的钱都会归她（因为归她保管，项目很容易模糊不清肯，分割时肯定她会有准备），她既得利益者，不会有什么舍不得的，我前妻", "url": "https://www.zhihu.com/question/660118100/answer/68906977560", "votes": 1352, "comments": 252, "feed_ts": 1786676735, "feed_time_str": "08-14 11:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "反向图灵测试！这个「纯手工大模型」，把网友聊崩了", "excerpt": "编辑｜杨文 要不说 AI 永远无法取代人类呢，人类的抽象，AI 根本想象不到啊。 最近，有人在旧金山买了一块广告牌，大张旗鼓地宣传一个叫 C ，而第三个选项就是租房。 当然咱们今天不聊超纲的，就顺着买房这件事来讲。 我不从户型、地段、公摊这些表层来讲，我讲一个博弈的底层逻辑。 我为人处世有一条原则： 就永远不要跟实力远大于你，对方可以随意违约，而你拿他几乎毫无办法的对手去博弈。 这种局，你不要总想着怎么翻盘，最优解不是斗智斗", "url": "https://www.zhihu.com/question/1995208930847119060/answer/2071548073537434093", "votes": 86, "comments": 15, "feed_ts": 1786675548, "feed_time_str": "08-14 10:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "王石到底喜欢田朴珺哪一点？", "excerpt": "这事儿得看网友的，真损啊 有一次，冯仑组织大家爬山，看到王石走路一瘸一拐的，一问，原是鞋子磨脚。 做为组织者，冯仑表现得非常仗义。他当即坐下来从鞋里抽出自己的“鞋垫”递给王石，王石一垫上，果然走路软乎乎的，脚也不疼了。 下山以后，各回各家，冯仑早就把这事儿抛在脑后了。 过了段时间，王石打电话给冯仑，说哥们儿，你那次送我的高科技鞋垫我还垫着呢，就是已经不软了，穿硬了。 冯仑说：老兄啊，那我是上山之前", "url": "https://www.zhihu.com/question/48135349/answer/2068098445907333824", "votes": 3541, "comments": 243, "feed_ts": 1786675017, "feed_time_str": "08-14 10:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "壁纸分享|鸣潮·穗穗平安\n壁纸分享|鸣潮·穗穗平安", "excerpt": "壁纸分享|鸣潮·穗穗平安\n壁纸分享|鸣潮·穗穗平安", "url": "https://www.zhihu.com/pin/2070225251733082301", "votes": 0, "comments": 1, "feed_ts": 1786674682, "feed_time_str": "08-14 10:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "其实不用太急，如果按照剧本，下周一或者下午就该有反转了。", "excerpt": "其实不用太急，如果按照剧本，下周一或者下午就该有反转了。", "url": "https://www.zhihu.com/pin/2071544229218742599", "votes": 0, "comments": 43, "feed_ts": 1786674633, "feed_time_str": "08-14 10:30", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "作者的观点我很同意，我之前也写过相关的内容。老美的结局就是以最快的速度从帝国末期到五代十国。他连魏晋南北朝，坞堡庄园式的体面都维持不住。因为不止经济打击，气候上的问题更严重。算是美洲这块土地的天然毛病，也算是老美作孽作了这么多年的总清算。全球变暖所体现的问题在我们这儿是更多的台风和降水，而在北美和西欧，则是大西洋翻转海流减弱，水汽输送。明显减弱，极端干旱。可以对标中世纪大暖期，美洲大陆绵延150年的堪称烘干机级别的干旱。然后老美的面包篮地下水踩空，也就那么二三十年的事儿。俩问题叠一块儿，咱们就可以看到疯狂麦克斯狂野之路的现实版了。当然，搞不好是血十字的那种状态，不需要病毒，人也会发疯的。", "excerpt": "作者的观点我很同意，我之前也写过相关的内容。老美的结局就是以最快的速度从帝国末期到五代十国。他连魏晋南北朝，坞堡庄园 const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

就是在分析这个阶段的特征。十月革命发生时，世界资本主义体系正处于从第二阶段向第三阶段转型的临界点上。一战（1914-1918）正是这个转型的催化剂，它迫使各交战国史无前例地动员全国人力物力，实行国家计划、配给制和国家资本主义，这就是后来全面国家干预的预演。如果严格按阶段划分，1917年本身仍属于第二阶段（垄断资本主义）的末期。国家作为总资本家全面、系统地主导经济，是在1929年大萧条后的罗斯福新政，尤其是二战后才在西方成为常态。然而，十月革命建立的国家，恰恰从诞生起就是另一种形式的国家主导。苏联通过指令性计划和国家所有制，把国家在经济生活中的绝对主导推向了极端。苏联并没有真正“断裂”出资本主义的世界体系，而是以一种特殊方式参与了全球范围内国家资本主义时代的开启。当这种模式在20世纪末崩溃时，它看起来更像是国家资本主义这个“阶段”中一次独特的、最终失败的制度实验，而不是一个全新的历史纪元。原想法把国家资本主义特征当做现代性来进行分析，这种把资本主义历史一切两截的历史分期模式是典型的苏左历史叙事。但是现在苏联都亡了几十年，还要坚持苏左历史叙事，颇有民国时期还坚持用宣统年号的意味。", "excerpt": "“现代”从来不只是时间标签，它是一套合法性叙事。把现代性起源设定为福特制和总体战军事动员，这明显是继承自苏联将1917年定为现代史开端的历史叙事。按照西方史学叙事，资本主义是现代性的典型代表，所以现代性起源甚至能追溯到16世纪资本主义萌芽时期。苏联把十月革命设为现代史的开端，核心目的就是争夺“现代”的定义权。这在宣告资本主义是旧世界的“前现代”制度，而苏联会开创一个新世界，这是在进行一场“与资本主", "url": "https://www.zhihu.com/pin/2053230381487355798", "votes": 0, "comments": 1, "feed_ts": 1782663431, "feed_time_str": "06-29 00:17", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待2026年6月22日发生在蒙特利尔的枪击案，凶手撰写了一份类似incel的宣言？", "excerpt": "这老哥写的太繁琐了，我有一个简洁的多的版本，帮他把话讲清楚吧： （学哲学不到家会丧失简洁的讲道理的能力，所以最好不要本科学哲学） Part 1 大压抑时代对于全世界广大普通年轻人（无论男性女性）而言，现在是一个大压抑时代，这是毫无疑问的。如果你连这最基本的现实都不不承认，一定要闭着眼睛说瞎话，那您没必要看下去了。 大压抑时代最基本的现象就是 财富和吸引力的极端不平等导致了情感生活幸福感的极端不平等", "url": "https://www.zhihu.com/question/2053360783342428662/answer/2054004713536877222", "votes": 4823, "comments": 333, "feed_ts": 1782662822, "feed_time_str": "06-29 00:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "世界最大抽水蓄能电站投产，对我国有何意义？", "excerpt": "简单回答：配合新能源产业的拼图之一。 太阳能眼看着成本越来越低，越来越能成为供电主力。但是一个众所周知的关键要素仍然制约着它继续发展，那就是供电的不稳定性。不但夜里完全没电，阴天、下雨、下雪都能导致电力输出大幅下降。 很显然，我们目前很难建立起一个“日不落电网”，用环绕地球的太阳能发电厂加上特高价输电网络，来形成24小时不间断的发电。 所以，太阳能发电要继续发展，必须配套足够强大的储能设施。 那我", "url": "https://www.zhihu.com/question/2053792670070396170/answer/2054713330762264803", "votes": 117, "comments": 14, "feed_ts": 1782661833, "feed_time_str": "06-28 23:50", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "歼-35机身为何比F35苗条很多？", "excerpt": "知乎传统，先问是不是。 实际上比对机体尺寸的话，是F35比歼35苗条很多，歼35的中段机体肯定比F35肥。因为常识告诉我们，需要包裹一台发动机的机身肯定比要包两台差不太多大的发动机的机身截面小。 下边就把这个常识再具象化一点。 全机截面积是和飞行阻力相关的因素，一般的常规布局飞机，全机截面积最大的位置往往就是翼展最大处。控制跨超音速阻力的面积率调整，最典型的手段就是在翼展最大处搞收腰设计控制截面积", "url": "https://www.zhihu.com/question/5967568961/answer/2053834385695175676", "votes": 121, "comments": 40, "feed_ts": 1782660967, "feed_time_str": "06-28 23:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "李睿", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "给机关/律所/学术党的桌面小狐狸🦊✨，请猛戳，留下您的足迹：链接", "excerpt": "给机关/律所/学术党的桌面小狐狸🦊✨，请猛戳，留下您的足迹：链接", "url": "https://www.zhihu.com/pin/2054704050931774982", "votes": 0, "comments": 0, "feed_ts": 1782659675, "feed_time_str": "06-28 23:14", "category": "pin", "cat_name": "想法动态"}, {"actor": "李睿", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "受不了 AI 总结瞎编？我做了一只能“回溯原文”的桌面小狐狸 🦊✨", "excerpt": "请猛戳，留下您的足迹： https://http://github.com/Ray-RP/Nuki姐妹们！！！作为一个常年被甲方要求“帮我把这份 50 页材料整理一下”的苦逼打工人，我对市面上的 AI 总结工具有一个忍了很久的巨大不满—— 它每次都说得头头是道，但我特么 根本不知道哪句是真的、哪句是它自己编的！ 尤其是在机关材料、律所卷宗、学术综述这种场景里，纯纯的“看着像样”是会要人命的啊！每一", "url": "https://zhuanlan.zhihu.com/p/2054701943893799201", "votes": 0, "comments": 0, "feed_ts": 1782659594, "feed_time_str": "06-28 23:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "DefTruth", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "把draft训得又小又准:NeMo-Automodel投机实战 (EAGLE-3/DFlash /Dspark)", "excerpt": "为什么要做投机解码大模型自回归解码的根本瓶颈在于：每生成一个 token 都要把整个模型完整跑一遍前向，而这一步是显存带宽受限的，算力其实大量闲置。投机解码（Speculative Decoding）的思路是用一个轻量的 draft 模型先“猜”出未来若干个 token，再让大模型（target）一次性并行校验，接受其中匹配的前缀。一次 target 前向就能确定多个 token，吞吐随之成倍提升", "url": "https://zhuanlan.zhihu.com/p/2054617534528237672", "votes": 23, "comments": 1, "feed_ts": 1782659315, "feed_time_str": "06-28 23:08", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_ 芯片，成功概率有多大？国产芯片打入苹果高端机型难点在哪？", "excerpt": "苹果是被逼到墙角了。 我们先得看看苹果历史上怎么做的。 低价周期囤货，极限压榨供应商。2023年那轮内存暴跌，苹果强行压价，美光等原厂被迫削减消费级产能。结果这轮AI需求一来，三巨头把晶圆产能大规模转向HBM和服务器DDR5，消费级LPDDR供给瞬间抽空。苹果的低价库存耗尽了，重新以市场价采购，成本直接失控。 ⬆️长鑫存储就是在这个时间节点被苹果盯上的。2026年6月，苹果向美国商务部展开密集游说", "url": "https://www.zhihu.com/question/2054233145457874875/answer/2054595050751922876", "votes": 11, "comments": 1, "feed_ts": 1782633633, "feed_time_str": "06-28 16:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "蛋白质的摄入是只算肉中的还是主食中的也要一起算呢？", "excerpt": "正常人主食蛋白质可以忽略不计，除非你是大胃袋良子。 良子经典战役，一顿吃16包方便面。 这一大锅你觉得里面用了多少面粉？能吸收多少蛋白质。 我找到了良子同款方便面，这是67克面饼，油炸型方便面。面饼里面包含了20%左右油脂。 一袋干面粉53.6克， 忽略其中的油脂的话，一般人一顿吃一袋面是比较合理的。 良子吃了16包，也就是857克干面粉。 考虑到生物价，蛋白质转化率打5折，这一锅吃完能转化到良子", "url": "https://www.zhihu.com/question/463976580/answer/2054594089971093601", "votes": 18, "comments": 14, "feed_ts": 1782633404, "feed_time_str": "06-28 15:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "让Agent具有预算意识？听听斯坦福博士后怎么说机器之心逛硅谷｜本期主编采访到了斯坦福博士后裴嘉欣，他向我们分享了AI Agent转向长时程任务后Token消耗爆炸的问题，并介绍了他正在研究的Budget-aware AI Agent，以及Human-AI Collaboration、Self-Improving等前沿方向。8月他即将加入UT Austin担任助理教授，新的实验室也在招收人才，快来看看吧！", "excerpt": "让Agent具有预算意识？听听斯坦福博士后怎么说机器之心逛硅谷｜本期主编采访到了斯坦福博士后裴嘉欣，他向我们分享了AI Agent转向长时程任务后Token消耗爆炸的问题，并介绍了他正在研究的Budget-aware AI Agent，以及Human-AI Collaboration、Self-Improving等前沿方向。8月他即将加入UT Austin担任助理教授，新的实验室也在招收人才，快来", "url": "https://www.zhihu.com/pin/2054593582737126122", "votes": 0, "comments": 0, "feed_ts": 1782633354, "feed_time_str": "06-28 15:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "为什么AV在日本是合法的？日本人怎么看待AV？就目前来说，日本AV产业依然是朝阳行业，有利于日本经济发展。从数据看，日本AV行业总产值为4200亿日元（约合人民币210亿元），在全球网络点播市场占比达68%，尤其在新冠疫情期间呈现爆发性增长。其产业规模巨大，合并进日本色情行业计算，占日本GDP总量的1%，约等于日本军费开支，以极低的成本为日本赚回大量外汇。日本AV主要市场在海外，本国消费占比不高，从业女性对自己的生活影响不大，属于墙内开花墙外香。而韩国色情业主要在国内，其社会矛盾反而更少被舆论注意。对日本人而言，AV是传统出口产业，早在遣唐使时期便有类似输出，如今更是吃到互联网红利，发展迅速。因此，只要产业在GDP中占据重要地位，在资本主义国家，其合法化便成必然。日本人对此心态平和，视其为一项领先全球的产业，甚至可谓日本之光。为什么AV在日本是合法的？日本人怎么看待AV？ #日本av #找av #AV ", "excerpt": "为什么AV在日本是合法的？日本人怎么看待AV？就目前来说，日本AV产业依然是朝阳行业，有利于日本经济发展。从数据看，日本AV行业总产值为4200亿日元（约合人民币210亿元），在全球网络点播市场占比达68%，尤其在新冠疫情期间呈现爆发性增长。其产业规模巨大，合并进日本色情行业计算，占日本GDP总量的1%，约等于日本军费开支，以极低的成本为日本赚回大量外汇。日本AV主要市场在海外，本国消费占比不高，", "url": "https://www.zhihu.com/pin/2054589971126805569", "votes": 0, "comments": 1, "feed_ts": 1782632421, "feed_time_str": "06-28 15:40", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么AV在日本是合法的？日本人怎么看待AV？", "excerpt": "就目前来说，日本AV产业依然是朝阳行业，有利于日本经济发展。 这里有两组对比数据，时间跨度十年。 2015年，韩国电影产业全年电影产业销售总额达2兆1131亿韩元(约合人民币117.4亿元)； 2015年，日本AV市场规模约500亿日元(约合人民币26.65亿元)。 2025年，韩国影视娱乐行业总产值达到1.2万亿韩元（约合人民币53.16亿人民币） 2025年，日本色情产业总产值达到700亿美元", "url": "https://www.zhihu.com/question/22758947/answer/2054589770731369371", "votes": 139, "comments": 17, "feed_ts": 1782632374, "feed_time_str": "06-28 15:39", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "为什么说洛阳不是隋朝唐朝首都——从太庙礼制看", "excerpt": "看到知乎洛顽 @月半微 又开始吹唐朝陪都洛阳在唐朝的地位了，我认为自己有必要科普下 @月半微 通过篡改史料，断章取义，妄想把洛阳提高到和长安一样的地位。那不行，都说了，你们混扯一次我辟谣一次，你们不嫌烦，我也不嫌烦。对照着史书一字一句较真儿给你掰扯清楚隋朝洛阳啥都没有。唐太庙这事儿，好些人觉得复杂，说不清楚。其实不复杂 中宗到安史之乱这段时间洛阳有东都太庙，但皇帝不去。一直没祧庙。毁了不建。完事儿", "url": "https://zhuanlan.zhihu.com/p/2053758193113813140", "votes": 17, "comments": 9, "feed_ts": 1782629405, "feed_time_str": "06-28 14:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "gwave", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "LLM 的 Next Step：不是 Scaling，而是 Organization", "excerpt": "过去三年，大模型的发展几乎只有一个方向。 Scaling。更多参数。 更多数据。 更大的算力。 更长的上下文。 从 GPT-3 到 GPT-4，再到今天的 Claude、Gemini、DeepSeek，几乎所有突破，都建立在同一个假设之上： 只要继续扩大规模，模型就会越来越聪明。这就是著名的 Scaling Law。 它几乎定义了过去整个大模型时代。 有种说法: Fable 5可能Scaling ", "url": "https://zhuanlan.zhihu.com/p/2054569958365983326", "votes": 4, "comments": 0, "feed_ts": 1782628959, "feed_time_str": "06-28 14:42", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "历史上有多少场类似「四渡赤水」看似不可能但赢了的战役？", "excerpt": "看似不可能赢但是赢了的战役很多，但是和四渡赤水类似的好像还真没有。 军事造诣最高境界就是机动，历史上这样熟练的机动作战，其实没见过。 魏延说穿过子午谷打长安，基本就是古代将领对机动比较高的领悟，A到B点，打对手一个出其不意。所谓机动，大部分时候作为奇兵，而且不能太复杂。一方面依靠后勤最好能找条河运粮，那就谈不上奇了，另一方面路线太复杂部队就散了，出动的规模不可能很大。当然魏延还要考虑，与诸葛亮走陇", "url": "https://www.zhihu.com/question/2053914886862628530/answer/2054573357748823288", "votes": 63, "comments": 12, "feed_ts": 1782628461, "feed_time_str": "06-28 14:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么有的人宁愿做员工也不做领导呢？", "excerpt": "最近刷到一个勇哥视频的切片。 一个小伙子，22岁，之前和人合伙开了个汉堡店，干了一年，赔了六万。 年轻人不服气，就回老家整了个流动摊，还是继续做汉堡，每天晚上7-11点出摊，流水1300，毛利率50%，刨去仓库、水电等，每天净赚500左右。 流动摊是挺赚钱，但每天风吹雨淋，还被城管追得到处跑，于是就萌生了开汉堡店的想法。 而且他看好了一个店，连线的目的，就是让勇哥给把把关，看看想法、选址、门面这些", "url": "https://www.zhihu.com/question/665856246/answer/2051622787303974631", "votes": 2628, "comments": 185, "feed_ts": 1782627498, "feed_time_str": "06-28 14:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "Gemini的模型是不是已经快被淘汰了？", "excerpt": "别的不说，御三家里面 Gemini 是正儿八经的原生多模态。 我把一个类似玻璃破碎的粒子音效（各种效果器堆出来的Glitch采样）提交给Gemini，即便是大家说的降智的网页版 Gemini 3.5 Flash Thinking，都能够顺利听懂这是类似玻璃破碎或者水被泼洒出来的声音，即使不贴切，至少说明方向听对了，并且思考时间很短。 GPT-5.5 高级模式苦思了几分钟，各种调用工具，最后认为是空", "url": "https://www.zhihu.com/question/2050527290925248637/answer/2054311760002290574", "votes": 280, "comments": 51, "feed_ts": 1782627184, "feed_time_str": "06-28 14:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "嵌入式Linux", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "MTK 永远的王", "excerpt": "大家好，我是写代码的篮球球痴。2008年前后，华强北一天能出三款新手机。 不是三星、诺基亚那种——是双卡双待大喇叭、能当手电筒、待机一个月的山寨机。 三十万块钱，买一批芯片和参考设计，找人开个模具贴个牌，一台手机就出来了。 能做到这件事，是因为有个 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};

const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

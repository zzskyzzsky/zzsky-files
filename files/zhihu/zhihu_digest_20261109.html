线性展开、局部反事实分支和较长候选计划比较。目标是在真实环境反馈稀疏、错误", "url": "https://www.zhihu.com/pin/2102834605191586873", "votes": 0, "comments": 0, "feed_ts": 1794135780, "feed_time_str": "11-08 19:03", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "OpenAI新模型临门一脚踩刹车！GPT-6.2曝出安全疑云", "excerpt": "AI 圈等了一整天，OpenAI 期待已久的新模型还是没有出现。 此前，OpenAI 新一代 Astra、Sol 可能在 11 月 6 日发布的消息，已经让不少开发者提前进入了等待状态。先是 Codex 使用记录中出现了 gpt-6.2-astra，随后又有用户在 Google Clou 相关页面发现了 gpt-6.2-astra 和 gpt-6.2-sol 两个模型标识。 OpenAI 这周并非", "url": "https://zhuanlan.zhihu.com/p/2102838103245379330", "votes": 7, "comments": 0, "feed_ts": 1794135688, "feed_time_str": "11-08 19:01", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "模型自己改agent框架：开发集的进步未必能迁移\n图文版：链接自主写框架与可靠改进，需要分开检验ARC-AGI-3受控实验让同一模型配置自主构建并修改harness，即组织模型调用、记忆、工具及行动的执行程序。写代码使用固定OpenCode框架，游戏运行使用生成的程序，权重始终不变。九种模型与推理力度组合各运行三次，共27条轨迹。每阶段先用两个开发游戏检查能否运行，再用五个开发游戏评估；初始版和第一轮反馈用于后续两轮修改，三个代码快照都在20个不提供修改反馈的公开游戏上评测。开发集涨分更多，留出收益仍有不确定性RHAE是相对人类动作效率评分，只奖励完成关卡，行动数超过隐藏人类基线会打折。第二轮相对初始版，开发集平均提高8.42分，留出集提高2.80分，后者95%区间为−1.44至7.35，不能排除无平均收益，也容许正收益。两种增益相差5.62分，不是两组绝对分数的差。27条运行中15涨12跌；一份不变程序十次评测的标准差3.99分仅作波动诊断，不能当成全部程序的噪声阈值。更便宜的最终版，半数也损失了留出能力9条运行既涨分又省钱，另9条更便宜却退步；平均每局成本下降2.72美元，不等于同能力下效率提升。费用按冻结API价格计算新生成和回放响应的逻辑推理用量，构建修改另计，不含基础设施与人工。事后从三版挑开发分最高者，留出增益为4.53分，高于固定采用第二轮的2.80分，但每局成本也从7.57美元升至9.15美元。这个选择规则尚需预先固定后在新实验验证。公开游戏与两轮修改，不能外推长期自我提升人工主导Tycho在同一Opus 5 xhigh配置下表现更强，但使用全部公开游戏作策略选择，不能将差距单独归因于人工。研究只有一个基准、一个划分、两轮修改，每条件三次构建，未全面重复评测；公开游戏还可能进入模型预训练。留出只隔离本次修改反馈。可运行的代码修复、未参与修改任务上的收益、已有能力保持和成本应分别验收，保留旧版作为比较及回退基线。原文标题：Can LLMs Improve Their Own Harness? A Controlled Study on ARC-AGI-3#无影寺 ", "excerpt": "模型自己改agent框架：开发集的进步未必能迁移\n图文版：链接自主写框架与可靠改进，需要分开检验ARC-AGI-3受控实验让同一模型配置自主构建并修改harness，即组织模型调用、记忆、工具及行动的执行程序。写代码使用固定OpenCode框架，游戏运行使用生成的程序，权重始终不变。九种模型与推理力度组合各运行三次，共27条轨迹。每阶段先用两个开发游戏检查能否运行，再用五个开发游戏评估；初始版和第", "url": "https://www.zhihu.com/pin/2102836123538036619", "votes": 0, "comments": 0, "feed_ts": 1794135296, "feed_time_str": "11-08 18:54", "category": "pin", "cat_name": "想法动态"}, {"actor": "招财解忧铺", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "黄金大级别走势改变后，后续会如何走？", "excerpt": "11.08 本周五伦敦金收盘价4070 在上周伦敦金周线跌破7月份低点3945之后，大级别的走势就发生了变化。 先看月线级别：如下图所示，从长线来看（10-15年），伦敦金月线之前走了3浪上涨，目前正在走月线级别的4浪回调，回调结束还会有5浪上涨。 我之前的文章写过黄金从26.01月30开始月线级别的回调（4浪）。 而月线级别的四浪回调会以ABC浪模式展开，再详细一点，A浪走3或5浪，B浪走3浪，", "url": "https://zhuanlan.zhihu.com/p/2102825119362048431", "votes": 63, "comments": 2, "feed_ts": 1794133948, "feed_time_str": "11-08 18:32", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "SST如何减少微调遗忘？保护权重主方向，在剩余空间学新任务图文版：链接微调遗忘与SST的受限更新领域微调能学会新任务，也可能破坏模型原有的编程、数学和指令遵循能力。子空间调优（Subspace Tuning，SST）按奇异值排序，通常保护权重矩阵前99%的奇异方向，只允许更新落在剩余空间。99%指方向数量占比，并非冻结99%的参数。方法保留完整梯度，让优化器算完更新，再从输入和输出两侧投影，避免Adam重新缩放梯度时把更新带回受保护方向。Science同时核对新任务与旧能力Qwen3-8B思考模式在Science数据上，普通监督微调的新任务准确率为77.6%，旧能力平均分由81.0降至55.5；加入SST后，两项分别为80.1%和80.0。旧能力平均分来自未用于微调的GPQA-Diamond、MMLU-Pro、GSM8K、HumanEval和IFEval。它衡量保留程度，与新任务准确率分开报告；在该设置下，SST保留旧能力的同时仍学会了新任务。FinQA刷新与1.7B暴露保留边界FinQA上，不刷新方向的SST取得73.0%的新任务准确率和82.3的旧能力平均分；每10步重算方向后，前者升至75.3%，后者降到75.7。Science两轮训练的规模对照中，32B的SST旧能力只降1.0分，1.7B仍降5.6分。刷新可继续开放适应方向，也会削弱对原始基座的保护，不能只按域内成绩选频率。投影有训练开销，推理成本不增加论文在八张L40S上的Qwen3-8B全参数训练测量中，单步投影开销约1.5%，刷新还需额外计算。SST不增加推理时成本，实际选型仍要比较新任务成绩、旧能力和训练耗时。学习率尚未按各方法分别充分调优，数千亿参数与更长任务序列仍需验证，结果不能概括为所有微调都不遗忘。原文标题：Towards Continual Learning: Mitigating Forgetting With Subspace Tuning#无影寺 ", "excerpt": "SST如何减少微调遗忘？保护权重主方向，在剩余空间学新任务图文版：链接微调遗忘与SST的受限更新领域微调能学会新任务，也可能破坏模型原有的编程、数学和指令遵循能力。子空间调优（Subspace Tuning，SST）按奇异值排序，通常保护权重矩阵前99%的奇异方向，只允许更新落在剩余空间。99%指方向数量占比，并非冻结99%的参数。方法保留完整梯度，让优化器算完更新，再从输入和输出两侧投影，避免A", "url": "https://www.zhihu.com/pin/2102830050521374756", "votes": 0, "comments": 0, "feed_ts": 1794133862, "feed_time_str": "11-08 18:31", "category": "pin", "cat_name": "想法动态"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你在什么时候觉得宠物爱着你?", "excerpt": "这只猫是我从它的前主人手里救出来的，它遭到前主人虐待，眼睛被打坏了一只 现在的它，愿意用它全部的信任，允许我抚摸它仅剩的另一只眼睛 ", "url": "https://www.zhihu.com/question/540811587/answer/2032275611876586946", "votes": 2036, "comments": 245, "feed_ts": 1794133430, "feed_time_str": "11-08 18:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "代码Agent还能自己改进运行框架？微软让Harness和模型一起进化图文版：链接Self-HPO交替优化运行框架与模型权重Microsoft Research研究者等用Qwen3.5-35B-A3B和mini-SWE-agent研究编程agent的共同优化。Harness是控制上下文、工具、反馈与结束条件的运行框架，策略由模型权重决定。每轮先固定模型、根据失败轨迹搜索框架，再固定框架、以验证成功或失败的奖励做强化学习。下一轮搜索集改用上一轮训练中从未成功的任务。实验用2,484道Python项目任务、交替两轮，不是无需训练的提示自改。三项基准平均解决率从57.8%到64.8%各基准结果先对三次运行取均值，再在Verified、Multilingual、Pro之间等权平均，不是合并全部题的比例或pass@3。Self-HPO平均64.8%，只训策略RLVR为61.9%，只改框架Self-Harness为60.1%。Verified三者分别69.5%、67.5%、65.2%。Multilingual覆盖九种非Python语言，Self-HPO相对初始提高5.5个百分点，说明在本次评测中存在跨训练域迁移，不能视为所有语言任务的通用提升。最终组件互换显示配合收益Verified中最终框架配初始模型为64.5%，最终模型配初始框架为64.4%，初始组合61.0%，最终组合69.5%。两项互换增量之和为6.9个百分点，合用增益8.5个百分点，多出1.6个百分点；这不是RLVR和Self-Harness独立增益的相加。使用Opus 4.8外部提议的HPO平均66.3%，与自身提议的Self-HPO分开。该版本固定搜索集的消融也不能当成Self-HPO的直接损失。更多尝试扩大覆盖但旧题仍需回归检查Verified每题8次分析中，pass@8由80.0%升至84.8%；初始8次全成功组的pass@1却下降2.2个百分点，均值增长不代表所有题更稳定。框架搜索、任务验证和强化学习都消耗计算，训练实现在单节点8张B200运行，论文未给同任务总成本或时延优势。采用前应分别评估新增覆盖、旧题回退和完整训练预算，冻结权重的使用条件不能直接套用这些结果。原文标题：Self-Evolving Coding Agents via Harness-Policy Optimization#无影寺 ", "excerpt": "代码Agent还能自己改进运行框架？微软让Harness和模型一起进化图文版：链接Self-HPO交替优化运行框架与模型权重Microsoft Research研究者等用Qwen3.5-35B-A3B和mini-SWE-agent研究编程agent的共同优化。Harness是控制上下文、工具、反馈与结束条件的运行框架，策略由模型权重决定。每轮先固定模型、根据失败轨迹搜索框架，再固定框架、以验证成功", "url": "https://www.zhihu.com/pin/2102827370038171210", "votes": 0, "comments": 0, "feed_ts": 1794133267, "feed_time_str": "11-08 18:21", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "AI科研Agent得分超过Codex，解却未必更好？Épi-turbo的优势主要来自速度图文版：链接Épi-turbo轻量配置比较30道运筹任务Épi-turbo是Bake AI研究者等提出的轻量研究agent，沿用Épi的跨会话状态、分支和记忆，用于开发可执行求解程序。本次关闭独立复核与额外验证组件，但仍保留任务规定的评分和可行性检查。与Codex均使用GPT-6-Astra及相同推理设置，每题模型预算20美元。30题从FrontierOR的180题中按难度选择并排除不可靠参考值，每个系统每题仅一次研究运行，未报告统计显著性。速度加分须先满足1%质量范围每题用两个开发实例反馈结果，再将选定程序在四个留出实例上各运行一次，最长一小时，不准调用外部优化求解器。目标值落后参考值越多，质量项越低，速度项在解质量不比参考值差超过1%时才计入，优于参考值也符合条件。Épi-turbo总分53.96对Codex的51.21，相对高约5.4%；平均质量项1.030对1.032，速度项0.784对0.675。模型费用不参与计分，不能把低花费当作总分提高的来源。直接目标值比较揭示解质量取舍119个可比较实例中40个打平，Codex更优61个，Épi-turbo更优18个。比另一方差超过1%的实例分别为Épi-turbo29个、Codex10个，120次留出运行中不可行解为1对0。Épi-turbo得分更高的任务有18道，对照为12道，反映综合评分与直接解质量是不同层次，重视可行性和更优目标值时仍须分别检查。模型费用与两种时间分别衡量Épi-turbo平均模型费用7.30美元对11.35美元，约为Codex的64%，27题更便宜。研究时间中位数22分钟对37分钟，留出程序运行时间中位数2.9秒对9.3秒。选中最难组13题的总分相对高约10%，另外17题差距较小。模型费用不等于全部执行成本，这次子集与单次运行也不足以代表全基准或重复运行稳定性；选择方案应同时核查质量、速度、费用及失败风险。原文标题：Épi: Towards a Persistent, Self-Improving Agent for Autonomous Research#无影寺 ", "excerpt": "AI科研Agent得分超过Codex，解却未必更好？Épi-turbo的优势主要来自速度图文版：链接Épi-turbo轻量配置比较30道运筹任务Épi-turbo是Bake AI研究者等提出的轻量研究agent，沿用Épi的跨会话状态、分支和记忆，用于开发可执行求解程序。本次关闭独立复核与额外验证组件，但仍保留任务规定的评分和可行性检查。与Codex均使用GPT-6-Astra及相同推理设置，每题", "url": "https://www.zhihu.com/pin/2102826896027291689", "votes": 0, "comments": 0, "feed_ts": 1794133103, "feed_time_str": "11-08 18:18", "category": "pin", "cat_name": "想法动态"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价博主称“游戏劫持了人生最珍贵的算力，导致现实问题一个都没碰”的观点？", "excerpt": "至少现在的肉食者还是希望你多打打游戏、多刷刷抖音的，这样现实问题还少点。你要真的开始思考现实问题到底从何如来，又该如何解决，那你的家长和大家长就真的要急哭了。 我建议把每年的诺贝尔和平奖颁给承载了最多人空余时间的娱乐业产品。 游戏人对世界和平的贡献可比什么奥巴马之流强太多了。 从各国的数据面上看，现在早该第三次世界大战打的火热了，绝无可能维持表面上的和平。 1914 年一战前夕，大英帝国的债务占 ", "url": "https://www.zhihu.com/question/2096910627998585435/answer/2102827262508910445", "votes": 1033, "comments": 63, "feed_ts": 1794133088, "feed_time_str": "11-08 18:18", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Anthropic研究者发现：用来解释大模型的新工具，可能只是重新发现了原来的神经元图文版：链接Transcoder特征需要与原始MLP神经元比较Anthropic研究者等分析13个公开transcoder。Transcoder是模型前馈网络层（MLP）的稀疏近似替代模型，用少量活跃特征重建原层输出。研究把神经元按激活正负拆分、筛选强激活，再比较两侧方向。神经元特征指输入编码和输出解码方向都对齐同一个MLP神经元的特征。分类依赖阈值，跨模型统计采用0.6，示意图为0.7，并不表示所有模型都能用一个固定阈值划分。Gemma3指定后层的多数激活来自神经元特征FineWeb、约三分之二层深处的GemmaScope-small配置中，Gemma 3 1B神经元特征占词典5.9%、占激活次数57.9%，27B对应37.1%与82.8%。数量占比和激活次数占比是不同分母，不能解读为模型一半神经元或一半激活幅值。过半也不普遍成立：Qwen 3 1.7B对应47.1%，Llama 3.2 1B的一套跨层配置为38.0%，早层和不同训练方式还会变化。雅可比对齐与跨种子复现提供计算对应证据雅可比描述输入微小变化引起的输出变化，只检验局部一阶计算。Gemma 3 4B第22层中，完整transcoder对齐约0.3，神经元特征子集接近这一水平，非神经元子集约0.05，不能写成完全零对应。重复训练仅改变随机种子时，多数配置的共享特征与神经元特征重合较多，但1M宽词典的22.0k共享特征中交集为10.5k，并非所有稳定特征都属于神经元。非神经元特征仍可能补充细粒度概念Transcoder仍能表达原神经元不易单独捕捉的双词组合等概念。一些TopK设置中非神经元方向接近初始化，JumpReLU中则有不少明显旋转和跨种子共享的非神经元结构。电路分析应以原神经元作对照，分别检查概念可解释性、重复训练一致性和计算忠实度。结果不能直接推广到全部词典或层位，完整因果解释仍需一阶对齐之外的干预验证。原文标题：Comparing Sparsified MLPs and Transcoders: Many Transcoder Features Are Neurons in Disguise#无影寺 ", "excerpt": "Anthropic研究者发现：用来解释大模型的新工具，可能只是重新发现了原来的神经元图文版：链接Transcoder特征需要与原始MLP神经元比较Anthropic研究者等分析13个公开transcoder。Transcoder是模型前馈网络层（MLP）的稀疏近似替代模型，用少量活跃特征重建原层输出。研究把神经元按激活正负拆分、筛选强激活，再比较两侧方向。神经元特征指输入编码和输出解码方向都对齐同", "url": "https://www.zhihu.com/pin/2102824140411618912", "votes": 0, "comments": 0, "feed_ts": 1794132989, "feed_time_str": "11-08 18:16", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "上一周的所有信息都在这个号", "excerpt": "上一周的所有信息都在这个号", "url": "https://www.zhihu.com/pin/2102825649211819229", "votes": 0, "comments": 1, "feed_ts": 1794132708, "feed_time_str": "11-08 18:11", "category": "pin", "cat_name": "想法动态"}, {"actor": "正解局发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "真正考验家庭经济实力的，不是车和房子。而是面对一场突如其来的大病，有没有从容应对的余地", "excerpt": "真正考验家庭经济实力的，不是车和房子。而是面对一场突如其来的大病，有没有从容应对的余地", "url": "https://www.zhihu.com/pin/2102822058057061215", "votes": 0, "comments": 0, "feed_ts": 1794132226, "feed_time_str": "11-08 18:03", "category": "pin", "cat_name": "想法动态"}, {"actor": "嵌入式Linux", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "一个开源 RTOS，从爱国者导弹一路跑到火星", "excerpt": "大家好，我是写代码的篮球球痴。大家听过 RTEMS 吗？ 搞嵌入式的应该都听过这名字，但真上手写过的         + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

title": "大家失业多久了，现在感觉如何?", "excerpt": "87年，失业刚好三年了。社保已经断了，医保也没交。失业之前和人合伙开了一个公司，挣了不少。但投资了一个餐饮店，遇到口罩。投资教培，遇到了双减。投资了重庆的房子，房价雪崩。所以存款有一些，但也不多。 失业之前公司还在正常经营，每个月还是能挣一两万，但业务明显是萎缩，我不想处理公司关闭一系列的麻烦事，于是我主动退出来了。当然，那时候我还能做网站卖流量，一个月也能挣不少，也是我主动退出的勇气。但互联网变", "url": "https://www.zhihu.com/question/1300116798/answer/2060675350762353590", "votes": 349, "comments": 123, "feed_ts": 1784130212, "feed_time_str": "07-15 23:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "总说不要轻视印度，就如同不要轻视当初的中国，印度真有本事创造下一个大国崛起的奇迹吗？", "excerpt": "苹果花了近二十年时间构建的供应链保密体系，在一家印度公司的服务器里被撕开了一个巨大的口子。 630GB，20万份文件，全部挂上暗网。 这是一个叫WorldLeaks的勒索组织干的。目标：苹果印度代工厂塔塔电子。 被偷走了什么先说这次泄露的量级。 这不是哪个工人把样机塞在裤裆里带出工厂大门，也不是发布会前那张模糊的谍照。被倾泻而出的，是苹果最核心的商业资产——iPhone 18 Pro的完整主板设计", "url": "https://www.zhihu.com/question/1904548794302964255/answer/2058574251561690304", "votes": 284, "comments": 61, "feed_ts": 1784130134, "feed_time_str": "07-15 23:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "手刀", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "西方哲学对现代科学发展起到了哪些关键作用？", "excerpt": "科学的前生是自然哲学。 逻辑学是工具，学而上学提供世界观的原始假设，经验主义作为标尺。自然哲学就是那可干预数据用逻辑进行演绎，然后用自然语言描述客观规律。 理性运动以后，出现了数学作为形式化语言替代自然语言。实证主义方法论替代了原始的经验裁判。数据获取也变成了不干预观测变量。 打那起就是现代科学了。 其实这些年越来越觉得，搞科学的人不学哲学最终会完蛋。 因为现在已经是后实证主义时代了。大红利正在消", "url": "https://www.zhihu.com/question/2056335357914899005/answer/2060870652018561582", "votes": 0, "comments": 0, "feed_ts": 1784129853, "feed_time_str": "07-15 23:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "邓德全说书发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "南怀瑾老师谈名利浓于酒孔子说，国家社会上了轨道，像我们这类的人，就用不着了，我们不必占住那个职位，可以让别人去做了。如果仍旧恋栈，占住那个位置，光拿俸禄，无所建树，就是可耻。其次，社会国家没有上了轨道，而占在位置上，对于社会国家没有贡献，也是可耻的。结论下来就是说，一个知识分子，为了什么读书？不是为了自己吃饭，是为了对社会队国家能有所贡献，假如没有贡献，无论安定的社会或动乱的社会，都是 可耻的。 讲到这里，我们想起了一些故事，可作为研究这两句话的参考，这个免于“耻” 字的功夫可真难。 ", "excerpt": "南怀瑾老师谈名利浓于酒孔子说，国家社会上了轨道，像我们这类的人，就用不着了，我们不必占住那个职位，可以让别人去做了。如果仍旧恋栈，占住那个位置，光拿俸禄，无所建树，就是可耻。其次，社会国家没有上了轨 总统府人员的证词，他们确认大多数重要决策都经过她之手，部长和高级官员常重复“这是夫人想要的”这句话。据这些证词，她的影响力已与总统本人相当。该调查最引人注目的发现之一是，在政权统治的最后几年，俄罗斯方面曾研究过在政治必要时以阿斯玛·阿萨德取代巴沙尔·阿萨德的可能性。调查证实这一设想曾在俄罗斯某些圈子里被提出，但同时也指出，巴沙尔·阿萨德在得知这一消息后并未认真对待。调查称，巴沙尔·阿萨德及其妻子阿斯玛在阿联酋拥有住所，并往返于莫斯科和迪拜之间。阿斯玛在近期居于迪拜，有说法称阿联酋仍允许他们访问，但目前不希望他们长期定居。调查还提到，他们的子女、阿斯玛的母亲及她的一位兄弟居住在迪拜，该家族在俄罗斯、保加利亚、阿联酋、黎巴嫩和中国均有投资。调查涉及叙利亚政权垮台前的最后数日，称阿斯玛曾以召开重要会议为由召集高级官员前往大马士革，而据其消息来源，真实目的是确保统治家族安全撤离至莫斯科。调查援引前官员的话称，政权领导层曾向亲信暗示他们有留守计划，而实际上已在安排离境，这在一些仍留在叙利亚的人士中引发了愤怒情绪。#阿萨德  #叙利亚危机  #阿拉伯叙利亚共和国  #中东  #世界历史  #人文 ", "excerpt": "《观察家报》发表的一项大规模调查性报道，基于数十次访谈、文件和证词。该调查的重要性在于它试图全面重新描绘阿斯玛·阿萨德的形象。西方媒体在巴沙尔·阿萨德执政初期所呈现的传统形象——即一位来自伦敦、受过教育、具有改革倾向的总统夫人——被该调查完全替换为一幅截然不同的画面。调查得出结论称，阿斯玛不仅仅是总统的妻子或政权的媒体门面，而是逐渐成为叙利亚政权内部最重要的政治、经济和安全权力中心之一，甚至可能是", "url": "https://www.zhihu.com/pin/2060383059459978858", "votes": 0, "comments": 3, "feed_ts": 1784105572, "feed_time_str": "07-15 16:52", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "野狼獾,工业人舒拉顿", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "孔子为什么强调“孝、悌、谨而信、泛爱众、亲仁、行有余力”，然后才学文呢？", "excerpt": "其实王婆也说了潘驴邓小闲，何曾有一个文字？所以说，大智者都是相通的。", "url": "https://www.zhihu.com/question/2055699592914720049/answer/2060767500518921440", "votes": 11, "comments": 2, "feed_ts": 1784105260, "feed_time_str": "07-15 16:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "夜静魂梦归", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "邹市明冉莹颖，谁该为之前的投资失败乃至当前的婚姻状态付更大的责？", "excerpt": "讲一下邹市明这个瓜，我觉得这个案例实在是太典型了， 不仅仅是宝妈创业典范，还展现了明星IP的困境。 起因是邹市明夫妇经商失败，其妻子参加综艺节目姐姐当家，在节目里大吐苦水，表示邹市明不顾家，自己经营家庭维持婚姻不易，多次想离婚。 这些发言的本意是指责邹市明，感叹自己维持婚姻不易的，但却直接解答了商业领域多年来的未解之谜， 为什么邹市明赚了那么多钱又是奥运冠军，却在几年内赔光了。 ——生意是生意，感", "url": "https://www.zhihu.com/question/2059355663353099483/answer/2060742635514549014", "votes": 5945, "comments": 387, "feed_ts": 1784105247, "feed_time_str": "07-15 16:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "刀刀宁", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "当你刚刚 vibe coding 了一个很大的上千行的重大功能改进的之后，它肯定会有一些小 bug，强烈建议强烈建议，强烈建议啊，用一个 助，建造了34家大大小小的工厂、19个农场，并改造了27个农场、若干所大学和一家大型医院，还协助建造了21座气象水文台和156个各级水文站。在第一个五年计划（1961—1965年）期间，苏联协助建设了25家电气设备企业、汽车维修厂和零部件生产厂。到1964年底，在苏联的援助下，北部地区已完成90家各类企业和工程的改造与建设，其中包括43个工业项目。苏联协助建设了若干发电厂，总装机容量达71,300千瓦；还建设了锡矿、老街磷灰石矿等采矿项目。河内机械厂、Lâm Thao磷酸盐厂（年产10万吨），以及富寿茶叶厂、海防鱼罐头厂等轻工业项目……“苏联在与越南进行贸易的国家中位居首位”。1954年，两国间的商品贸易额为330万卢布；1957年达到1160万卢布，比1955年增长了3.5倍； 1959年，越南向苏联出口了39种商品，从苏联进口了169种商品（越南出口总额为5880万卢布，从苏联进口总额为7200万卢布）； 1960年，这一数字达到4300万卢布（其中苏联对越南出口2200万卢布，从越南进口2100万卢布）”。1964年，苏越贸易约占越南贸易总额的35%；越南从苏联进口商品的价值约为4250万卢布。两国间的货物贸易发展稳定。1954年至1964年间，两国进出口总额较1956年至1960年期间增长了2.8倍，其中越南的出口额增长了2.4倍。从1957年到1964年，两国贸易额逐年增长，达到9500万卢布；而从1950年到1965年，两国贸易额增长了28倍。越南从苏联进口的主要是机械、工业设备、石油产品、工业原材料、药品等；向苏联出口的则是工艺品、纺织品、鞋类、香烟、茶叶等，1964年的出口总额为3130万卢布。1961年至1965年间，越南和苏联计划将商品贸易额提高到前五年的2.5倍，达到约12.5亿卢布。两国之间的经济贸易关系有一个特点，即苏联似乎不太关注利润，往往处于吃亏的一方。与越南的贸易目的主要是为了提供援助，为越南建设物质技术基础创造条件。”", "excerpt": "在对越经济援助上苏联要比美国做得更好也慷慨的多，相比美国提供的消费品和农产品苏联以无偿或极度优惠的条件，将资金、技术、设备系统性地注入北越的生产领域，这点必须承认：“苏联对越南援助的突出特点是提供无偿援助。根据1955年7月18日的协定， 苏联向越南提供了4亿卢布的无偿援助，用于恢复和建设25家企业，并“同意协助在越南开展地质勘探工作以及预防和控制传染病”，同时协助建设与恢复机械、煤炭、电力和轻工", "url": "https://www.zhihu.com/pin/2060724777829021202", "votes": 0, "comments": 3, "feed_ts": 1784095822, "feed_time_str": "07-15 14:10", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "长鑫科技7月16日开启申购，发行价为8.66元/股，估值超4万亿，对其自身发展和半导体产业意味着什么？", "excerpt": "钱都准备好了，明天看脸了，朱允炆，方孝孺，齐泰，黄子澄，本雅失里，达里巴，在天有灵保佑我中签。", "url": "https://www.zhihu.com/question/2058449781597459395/answer/2060725703163879709", "votes": 190, "comments": 27, "feed_ts": 1784095294, "feed_time_str": "07-15 14:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "UFO", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "2026年7月5日-6日俄军导弹炸毁基辅大型弹药库并引发连环爆炸。应该如何评价此事件？", "excerpt": "吃造化的地方之前是乌国防工业集团旗下卢奇设计局的维扎尔机器制造厂 前身为苏联时期基辅阿尔乔姆机械制造厂第一分厂 坐标：50.385302195195294, 30.356351339388393 参与了包括海王星在内的一系列装备的研发，以及S-300导弹的生产维护 这不是第一次吃造化，这个工厂22年4月就挨过一次炸 就跟哈尔科夫的马里舍夫机械厂一样，都是前苏联的设施，在哪是干什么的莫斯科都 function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }

    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';

}

      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

四周内优化了 30 多个模型，并把成果整理成 36 个可复用的 kit 开源。对做结构预测、蛋白质设计或基因组模型推理的人来说，这些 kit 可装进既有工具链。4倍到底从哪来最关键的一块叫 FlashPairformer。它是针对蛋白质结构模型里“triangle attention”和“triangle multiplication”两类高开销计算写的 GPU kernel。Anthropic 给出的口径是：相对 NVIDIA 的 cuEquivariance，前者快 2.7-2.9 倍，后者快 1.7-3.2 倍；再叠加针对各模型的缓存、无效分支清理等优化，30 多个模型的平均推理速度约提升 4 倍。这里的“约 4 倍”带着条件。仓库把优化分成 exact、fast 和 Big 三种常用模式：exact 保持输出完全一致，技术文章汇总为接近 2 倍加速；fast 接受工具自身随机波动范围内的极小数值差，换来更高速度；Big 把目标放在压低峰值显存。Big 模式解决了什么Big 模式让部分开源结构预测模型可以在一个 NVIDIA GPU 节点上，准确处理超过 10,000 token 的生物分子系统。这里的 token 指氨基酸、核苷酸或小分子、离子中的原子等输入单位；这类系统往往对应核糖体、蛋白酶体等大型分子机器。边界同样要看清。Anthropic 用单个 8-GPU B300 节点把推理规模推到 31,000-70,000 token，证明程序能跑通；技术文章明确写了，这些极端规模的预测结构会塌缩，结果并不正确。单节点准确超过 10,000 token，不能外推为任何超大分子都能可靠预测。开源代码能怎么用仓库为每个上游工具准备一个 kit，使用时保留原来的调用方式，通过模式开关启用优化。它覆盖 AlphaFold 类结构预测、蛋白质设计、蛋白质语言模型和基因组模型；代码采用 Apache-2.0，但模型权重和上游项目仍各自遵守原有许可证。这份代码更适合已经在 NVIDIA GPU 上运行这些开源工具的研究团队或工程团队。它不附带模型权重，仍需准备上游环境和相应硬件。仓库当前定位为随研究发布的参考版本，Anthropic 已注明不继续维护或接收贡献。", "excerpt": "Claude把30个开源生物模型推理速度提升4 倍生物学家常用的蛋白质结构预测、分子设计和基因组模型，参数未必很大，跑起来却很慢：三维结构计算会反复处理 token 之间的三角关系，时间和显存都随规模迅速膨胀。Anthropic 这次公开的是一套面向既有开源工具链的推理加速包。Claude 在不足四周内优化了 30 多个模型，并把成果整理成 36 个可复用的 kit 开源。对做结构预测、蛋白质设计", "url": "https://www.zhihu.com/pin/2084449700040676791", "votes": 0, "comments": 0, "feed_ts": 1789751566, "feed_time_str": "09-19 01:12", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待博主永乐大帝明成祖最新一期视频讲述的沙俄与日本视觉的照妖镜？", "excerpt": "孙中山明确说过民族主义必须与民权主义和民生主义结合，如果 某些人试图暗搓搓的割裂自由主义社会主义与民族主义的关系，你们最终只会走向法西斯纳粹。永乐大帝明成祖这期视频我看了， 绝大部分观点我都是认同的。但是我也看到有些人试图借着批判满清的风气，去虚空打靶，试图攻击自由民主与社会主义，也就是试图污名化民权主义和民生主义，要搞“没有民权民生的民族主义”，也就是法西斯主义，这些人就算打着民族主义的旗号，也", "url": "https://www.zhihu.com/question/2077565029956821379/answer/2084297345051652502", "votes": 23, "comments": 5, "feed_ts": 1789750642, "feed_time_str": "09-19 00:57", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "时予", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《金瓶梅》究竟好在哪里，凭什么能成为四大奇书之一？", "excerpt": "对于死人和活人的差异描写，太真实了。 和我见识过的一模一样。第六十二回开篇就写李瓶儿快不行了，瘦的黄叶相似，起不来炕了。生完孩子后下边流血不断，这会床铺上铺垫的都是草纸。 她害怕大家嫌弃有味道，一直叫丫鬟烧香。 西门庆很伤心，守在她屋子里一直哭。 李瓶儿还在说“我的哥，你还往衙门中去，只怕误了你公事。我不妨事，只吃下边流的亏，若得止住了，再把口里放开，吃些饮食儿，就好了。你男子汉，常绊在我房中做什", "url": "https://www.zhihu.com/question/1921546357304457049/answer/2080646839506822276", "votes": 1065, "comments": 121, "feed_ts": 1789750508, "feed_time_str": "09-19 00:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude在Claude Code 中推出 Projects 功能Claude Code 新出的 Projects，把一串相关工作放进同一段对话里：你持续把任务、报错和新想法发进去，Claude 决定哪些要新开线程、哪些交给已有线程。每个线程都是独立的云端会话，可以并行运行；合上电脑后，工作仍会继续。这次变化，适合手上有一组持续推进的开发任务的人。比如一个仓库反复冒出 bug、评审和小改动，你不必每次重新交代分支、代码库和约束；项目级的仓库、说明和记忆会成为新线程的起点。一段对话管住一批工作Projects 里的对话扮演协调入口。它会把一条待办拆成新线程，或交给已经在同一范围内工作的线程；多个无关任务可以并发。线程完成后，Overview 会按“工作中、等待你、待评审、已完成”等状态汇总，文件在 Library，代码变更可在 Pull requests 中查看。这里的关键不是同时开很多窗口。Claude 的文档把它定义为“一个持续的协调对话”，每个新线程从同一组项目上下文开始：仓库、项目说明、项目记忆、可用连接器和云端环境。后续纠正过的要求可以写进项目记忆，供下一批线程读取。离开电脑，线程还在云端跑官方强调的体验是：并行线程跑在云端，关掉笔记本后仍能继续；手机上也可以查看和引导线程。开发者 Boris Cherny 在引用帖里把变化说得很直白：他把想到的事项直接发进项目，让 Claude 分到线程里，项目再记住自己的工作方式。这也带来一个需要提前看清的前提：线程访问的是云端环境。只在本机存在的文件、内网 API、VPN 后的服务、设备模拟器，当前不能直接交给 Projects 里的云端线程。官方文档建议这类工作仍用本地会话或 agent view；本地支持仍在后续计划中。先看你手里的工作有没有“持续性”Projects 更适合会不断产生新任务、又共享同一背景的工作：跨多个仓库的迁移、长期维护一个服务、持续整理一批文档，或一个超过单次会话的构建项目。单个能在一次会话完成的小任务，直接启动云端会话更轻；完全依赖内网和本机工具的项目，也暂时不适合把主流程迁进去。目前它处于 public beta：从使用过云端会话、且没有旧版 Claude 项目的 Pro 和 Max 用户开始逐步开放；Team 和 Enterprise 暂未提供。新项目默认会消耗与其他 Claude Code 会话相同的套餐额度，并行线程越多，用量上升越快。", "excerpt": "Claude在Claude Code 中推出 Projects 功能Claude Code 新出的 Projects，把一串相关工作放进同一段对话里：你持续把任务、报错和新想法发进去，Claude 决定哪些要新开线程、哪些交给已有线程。每个线程都是独立的云端会话，可以并行运行；合上电脑后，工作仍会继续。这次变化，适合手上有一组持续推进的开发任务的人。比如一个仓库反复冒出 bug、评审和小改动，你不", "url": "https://www.zhihu.com/pin/2084443799900763114", "votes": 0, "comments": 0, "feed_ts": 1789750156, "feed_time_str": "09-19 00:49", "category": "pin", "cat_name": "想法动态"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回 cn": "发布了想法", "title": "为什么古时的东南亚地区，大都是印度化而非华夏化？这个表述不准确，东南亚受伊斯兰教的影响更大，比如印度尼西亚，虽然前面有印度两字，实际上这是个伊斯兰教国家，印尼还是东南亚人口最多的国家；很多婆罗门教国家，比如占婆，最后让越南灭亡了。去年泰国和柬埔寨打起来的争议地区，就是柏威夏寺，是供奉湿婆神的圣所，这就是印度教在东南亚传播的痕迹。全球五大宗教，印度就占了两个发源地:印度教和佛教，所以，印度也是世界宗教起源地之一，印度的宗教输出可以说非常成功；而华夏文明很难向世界输出的主要原因就是中国的宗教一直不怎么成功。源头就在中国文化思想哲学发展的巅峰时期，也就是春秋战国时期，华夏先贤对于宗教思想大力批判，认为这是怪力乱神，蛊惑人心，胡说八道，儒家，道家，法家等等，根本看不起宗教，甚至不屑于研究；中国的哲学体系非常独特，缺乏神性指引是基本特征，不需要一个全能神来背书。所以，不是东南亚的人民不接受华夏文明，而是华夏文明没有经可念，没有一个全能神在最困苦的时候给大伙儿帮忙；简单点，中国没有搞出一套骗人的玩意儿，尽瞎说大实话，这不符合要求，还是算了。生活太苦了，不骗人骗己怎么活下去? 湿婆，佛祖，上帝啊，我们爱你。为什么古时的东南亚地区，大都是印度化而非华夏化？ #印度的宗教（书籍）  #印度的宗教：印度教与佛教（书籍）  #宗教信仰还是迷信 ", "excerpt": "为什么古时的东南亚地区，大都是印度化而非华夏化？这个表述不准确，东南亚受伊斯兰教的影响更大，比如印度尼西亚，虽然前面有印度两字，实际上这是个伊斯兰教国家，印尼还是东南亚人口最多的国家；很多婆罗门教国家，比如占婆，最后让越南灭亡了。去年泰国和柬埔寨打起来的争议地区，就是柏威夏寺，是供奉湿婆神的圣所，这就是印度教在东南亚传播的痕迹。全球五大宗教，印度就占了两个发源地:印度教和佛教，所以，印度也是世界宗", "url": "https://www.zhihu.com/pin/2084431069508587535", "votes": 0, "comments": 0, "feed_ts": 1789747096, "feed_time_str": "09-18 23:58", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么古时的东南亚地区，大都是印度化而非华夏化？", "excerpt": "这个表述不准确。东南亚受伊斯兰教的影响更大。比如印度尼西亚，虽然前面有印度两字，实际上这是个伊斯兰教国家。印尼还是东南亚人口最多的国家。 很多婆罗门教国家，比如占婆，最后让越南灭亡了。 去年泰国和柬埔寨打起来的争议地区，就是柏威夏寺。柏威夏寺坐落于柬埔寨平原中央高地的边缘地带，是供奉湿婆神的圣所。神庙建成于公元11世纪上半叶，其复杂的历史最早可追溯到9世纪。是吴哥时代的皇家寺庙，一共花了200年时", "url": "https://www.zhihu.com/question/21091822/answer/2084430823764260228", "votes": 10, "comments": 0, "feed_ts": 1789747035, "feed_time_str": "09-18 23:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待以色列人拍的纪录片NAZA会揭露他们在加沙屠杀平民？", "excerpt": "这是好事啊。 说明以友已经学会了教友的打法。以后在国际上就区分为“ 温和派以友”和“激进派以友”。激进派以友就每天扔扔炸弹，图图几个教友，洒洒水啦。 温和派以友专门拍这种片子，站在激进派以友的对立面，表明“我们 ysl并不是你们想象地那么坏啦，我们也是热爱和平的啦”与教友形成鲜明的一体两面。 ", "url": "https://www.zhihu.com/question/2081807423669532534/answer/2084226645527879870", "votes": 49, "comments": 5, "feed_ts": 1789746786, "feed_time_str": "09-18 23:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "有消息传智谱Zcode会上传用户的全量Git操作，这是否属实？", "excerpt": "智谱貌似已经滑跪认错了。不过我觉得更有意思的一点就是，这些 Git 操作里面最核心的，或者说最重要的内容是什么？这些内容可以怎么让大模型变成更强？ 根据举报者的信息来看，Gif文件里面其实主要分为四部分。 可以看这个表格，更详细一些。 数据位置占该快照的比例从训练角度看，它是什么.git/lfs/56.8%本地缓存的大文件资产，具体价值取决于里面是什么.git/objects/29.6%历史代码版", "url": "https://www.zhihu.com/question/2084291380302574171/answer/2084429013410395164", "votes": 36, "comments": 3, "feed_ts": 1789746604, "feed_time_str": "09-18 23:50", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "MiniMax开源MiniMax Code CLI：MIT许可MiniMax 把 MiniMax Code CLI 的源码放到了 GitHub。开发者现在能直接检查这套终端代码 agent，也能在 MiniMax 账号之外接入兼容 OpenAI、Anthropic API 格式的模型服务。这次公开的是 CLI 源码；MiniMax 底层模型权重和 MiniMax Code 桌面应用源代码不在仓库范围内。仓库当前标注为 v0.4.12 源码预览版（source preview），第一方代码默认采用 MIT 许可；依赖、资产和已有文件仍各自遵循对应许可。终端里能做什么MiniMax Code 可以读取项目文件、改代码、检查 diff、运行命令和测试。它提供交互式 TUI、用于脚本和 CI 的无头模式 mcode exec，还提供 ACP 入口，供支持 Agent Client Protocol 的编辑器和客户端接入。登录后可以用 MiniMax 账户或 Token Plan，也可以在 `/provider` 里选择自定义 provider。会话恢复、计划任务、subagents、搜索、MCP、插件和技能都被放进同一套终端工作流里。76.7% 的成绩要连同条件一起看MiniMax 给出的 FrontierHarness Eval 数据，测试对象是 MiniMax Code 0.3.2 搭配 Kimi K3；此次公开的仓库标注为 v0.4.12 源码预览版。30 个任务里 23 个通过、4 个失败、3 个超时；按全部 30 个任务计算，通过率为 76.7%。同一说明页还写明，部分任务的 provider、checkpoint 方式和时间限制与已发布基线不同，因此这些结果用于数值比较，不代表官方排行榜排名。它能说明 MiniMax Code 在这组配置下跑出了可复核的任务轨迹，不能直接推出它在所有 coding agent 对比中领先。哪些人值得先试如果你在意终端 coding agent 的工具调用、权限边界和模型可替换性，这个仓库值得先在非关键项目里跑一遍。MiniMax 也公开了评测结果的 PR、适配器配置和执行轨迹，方便复查。如果你想要的是已验证的跨产品性能结论，先等同仓库状态、同模型、同预算和同超时规则的对比。另一个容易忽略的点是：从源码构建和安装已发布包是两条路径，版本号一致也不能证明二者构建来源完全相同。", "excerpt": "MiniMax开源MiniMax Code CLI：MIT许可MiniMax 把 MiniMax Code CLI 的源码放到了 GitHub。开发者现在能直接检查这套终端代码 agent，也能在 MiniMax 账号之外接入兼容 OpenAI、Anthropic API 格式的模型服务。这次公开的是 CLI 源码；MiniMax 底层模型权重和 MiniMax Code 桌面应用源代码不在仓库范", "url": "https://www.zhihu.com/pin/2084428695209514142", "votes": 0, "comments": 0, "feed_ts": 1789746553, "f "excerpt": "编辑｜Panda 天道好轮回，苍天饶过谁？入侵过 Hugging Face 和 Ruby 生态的 OpenAI 原来也被入侵过！并且，入侵者使用的还是其主要竞对 Anthropic 的模型。 就在几个小时前，Electrovolt Security 与 Hacktron AI 创始人 s1r1us 在 上发布了一系列推文，分享了其团队在 7 月份借助 Claude 成功入侵 OpenAI 的故事，", "url": "https://zhuanlan.zhihu.com/p/2084345472660026116", "votes": 7, "comments": 0, "feed_ts": 1789726777, "feed_time_str": "09-18 18:19", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "夜静魂梦归", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "之前东京奥运会办的就不行，现在名古屋更是把亚运会搞得一团糟，难道申办的时候，亚奥理事会难道没有审核吗？", "excerpt": "亚运会的较量1992年8月，77名日本孩子和30名中国孩子在内蒙古乌兰察布草原上负重跋涉。 2023年9月23日，杭州，第十九届亚运会开幕；2026年9月19日，名古屋，第二十届亚运会开幕。两届亚运会，相隔不到三年。同一代人，交上了两份不同的答卷。 A 杭州的客人落地就被领进了村，名古屋的客人落地成了系统里的“幽灵”34年前，中国孩子才走一半路就把水喝光、干粮吃尽，只好靠别人支援，作者断言“他们的", "url": "https://www.zhihu.com/question/2084317719386481183/answer/2084344918357578489", "votes": 18, "comments": 3, "feed_ts": 1789726554, "feed_time_str": "09-18 18:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "正解局发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "宁波人为啥总把赚来的钱往学校里砸？", "excerpt": "宁波人为啥总把赚来的钱往学校里砸？", "url": "https://www.zhihu.com/pin/2084338431602201749", "votes": 0, "comments": 0, "feed_ts": 1789725659, "feed_time_str": "09-18 18:00", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "埃及祭司对宗教仪式中祈求、驱使乃至胁迫神灵的行为做了高度哲学化的阐释，虽然这不太可能是这些行为最初存在的原因，但它揭示了古埃及的高级知识分子是如何看待埃及宗教中那些令人费解的现象，并在哲学层面做出解释。同时这再次证明，埃及人并不排斥用希腊哲学的方式阐释自身思想的做法，对于那些精通希腊文化的祭司而言，希腊哲学不是一种与本族文化毫无关系的知识传统。为了证明这一点，不出意料，埃及人在这里又一次重申了希腊先哲曾求学埃及的事迹。ps：我不认为阿巴蒙是杨布利柯虚构出来的皮套人物，这个名字本身是纯正的埃及人名， 此人对埃及神学如此精深的理解必须追溯至祭司传统。异议者也只能将希望寄托于某些在当时异族仍可获得、但今已失传的祭司文献。现实就是如此令人沮丧，古典学家总是极力论证古典作家笔下的埃及实则是幻影，而埃及学界对古典传统又兴趣乏乏，对这种事总是缺少话语权。那些傲慢的古典学者甚至直接忽略埃及学家的意见，将希腊化-罗马时代的埃及描绘成仿佛种族隔离时代的南非。你问：“既然如此，为何在神圣仪式中，诸多行事都仿佛它们是可受动的？” 我回答：这是出于对祭司秘法的无知。神圣仪式中恒久施行的事，有的拥有超越理性的隐秘原因，有的自永恒起便作为象征奉献给更高等的族类，有的保有其他某种肖像 —— 如同生产不可见理则的自然，展现出可见的形态；有的为表达敬意，或以相似、亲善与联结为目的，有的则为我们带来益处，或在某种意义上净化、解脱我们的人类情状，或规避降临于我们的其他厄运。但绝不能因此认为，神圣制度中有一部分是为侍奉诸神或精灵而设，仿佛它们可受动一般。自身永恒、无形体的本质，不会自然地从形体获得某种变化。即便我们承认这一本质尤其需要这类事物，它也无需人类的协助来完成这类神圣崇拜，因为它自身、世界的本性以及生成领域的完满便足以充盈自身；若可以如此说，它在有所欠缺之前，便通过世界永不失坠的整体性与自身固有的充盈领受了自足，一切更高贵诸族类也都充满合宜的善。因此，这一观点可作为我们共同的舒缓之论，关乎对纯净诸族类的崇拜 —— 它与高于我们的存在恰相适配，纯粹之物被引向纯粹，不受动之物被引向不受动之物。而就具体事项而言，竖立阳物是生殖力的象征，借此力量被召唤至世界的生成活动之中。正因如此，许多阳物在春季被献祭，因为此时整个世界从诸神那里领受孕育一切生成的力量。而我认为，彼时所用的猥亵言语，象征着质料领域善的匮乏，以及质料载体在被装饰之前的丑陋。这些存在者需要装饰，越是轻视自身的丑陋，便越是向往装饰。它们由此追寻形式、美与善的本原，通过粗鄙言语认识卑下。如此一来，卑下本身被规避，对它的认识则通过言语显明，使用者也将欲望转向卑下的对立面。这一做法还有另一重理由：我们内部的人类情欲力量若被完全压制，会变得更为猛烈；若被适度、有序地引入活动，则会因节制满足而喜悦、平息，并由此得到净化，变得温顺，无需暴力便被驯服。同理，我们通过观赏喜剧与悲剧中他人的情欲，平息自身的情欲，使之温和，并获得净化。在神圣仪式中，我们也通过观看与听闻某些卑下之事，从它们所引发的伤害中解脱。因此，这类仪式是为我们的灵魂而设，为减轻因生成而附着于灵魂的恶，为解开并解脱它的束缚。也正因如此，赫拉克利特十分恰当地将其称为 “良药”，医治可怖之事，将灵魂从生成界充满的灾难中拯救。", "excerpt": "埃及祭司对宗教仪式中祈求、驱使乃至胁迫神灵的行为做了高度哲学化的阐释，虽然这不太可能是这些行为最初存在的原因，但它揭示了古埃及的高级知识分子是如何看待埃及宗教中那些令人费解的现象，并在哲学层面做出解释。同时这再次证明，埃及人并不排斥用希腊哲学的方式阐释自身思想的做法，对于那些精通希腊文化的祭司而言，希腊哲学不是一种与本族文化毫无关系的知识传统。为了证明这一点，不出意料，埃及人在这里又一次重申了希腊", "url": "https://www.zhihu.com/pin/2084333575277748424", "votes": 0, "comments": 0, "feed_ts": 1789725553, "feed_time_str": "09-18 17:59", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "野狼獾", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待是“中华文明耽误了满清”这种观点？", "excerpt": "现代人最天真最使坏的一点就是，各种书籍影视作品都在拼命塑造“古代游牧民族豪爽直率”的伪史，比如金庸的武侠作品就是一个很典型的例子。 “汉民族是保守的，游牧民族是豪爽的”。 “满清是汉化王朝，满清就是因为沾染了汉文化，最后才不幸灭亡”。 这群人天天批评伪史论，自己却整天在造满清的伪史。 当然，这里不是说伪史论就是对的。 ", "url": "https://www.zhihu.com/question/8847010784/answer/1995564913352000248", "votes": 1078, "comments": 57, "feed_ts": 1789725254, "feed_time_str": "09-18 17:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "木文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "多车队宣布永久退出China GT，上海站赛车起火救援不力带来的影响有多大？业内怎么看？", "excerpt": "现在大家面前摆着一个很现实的课题，不能再装没看见了，那就是： 我们的社会，如何给“老实”“守序”“宽容”“责任心”这种“道德资产”定价？China GT的事情，大伙都在说，层层外包之后，一天就拿60块钱的大爷，能把灭火器拿到着火的赛车前，已经算是仁至义尽了。 我一天就拿60块（并且不能保证拿一辈子），玩什么命啊？你层层外包的中间商做什么了？凭啥你躲在办公室安安稳稳，躺着就把钱赚了？ 然后推演出外包", "url": "https://www.zhihu.com/qu question/2065072216551827379/answer/2082434337002333223", "votes": 10475, "comments": 868, "feed_ts": 1789722466, "feed_time_str": "09-18 17:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "电影《牛来》的上映及走红的背后意义是什么？", "excerpt": "本质上是观众从兜里掏出钱，在部分自诩精英的电影人面前晃了晃，然后丢到了海里。“看到了没?老子宁肯把这钱丢水里听个响也不给你，什么玩意”", "url": "https://www.zhihu.com/question/2071899848073279411/answer/2072731898590257758", "votes": 8725, "comments": 174, "feed_ts": 1789721612, "feed_time_str": "09-18 16:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "周鸿祎称 「吃过一次亏，不会再投资新能源车」，他在新能源赛道踩了什么坑？其投资逻辑发生了哪些转变？", "excerpt": "说实话，我认为周鸿祎老师本身选择没有问题，只是他没有足够的资源。 大概给大家讲讲这个逻辑好了。 比如当年零跑在港股上市的时候，上市之后亏得特别厉害，但它硬是活下来了。 蔚来、小鹏还有理想，早年也都是巨额亏损，最后也撑住了。 那这些活下来的车企，和那些出局死掉的企业，本质差别在哪？ 核心就是能不能上市融资。 有资本力量推着完成上市，打通了资本市场的融资通道，企业手里就拿到最珍贵的时间。 因为只要车企", "url": "https://www.zhihu.com/question/2083571889524556215/answer/2084322919509972505", "votes": 129, "comments": 9, "feed_ts": 1789721309, "feed_time_str": "09-18 16:48", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "TensorPlus", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "行业认可｜张量无限高精度3D感知技术助力智能原木检尺项目荣获中国—东盟林业人工智能创新应用大赛二等奖", "excerpt": "近日，2026年中国—东盟林业人工智能创新应用大赛在广西贵港圆满收官。 本届大赛以“智赋林业·数创未来——人工智能驱动林业全链升级”为主题，由广西壮族自治区人民政府指导，广西壮族自治区林业局、贵港市人民政府主办，共吸引605支团队、2069名选手参与，最终33个项目齐聚贵港决赛。 采用北京张量无限科技有限公司核心技术的智能原木检尺项目，凭借在高精度三维感知、AI智能识别及林业数字化应用方面的创新成", "url": "https://zhuanlan.zhihu.com/p/2084319527639193459", "votes": 2, "comments": 0, "feed_ts": 1789721210, "feed_time_str": "09-18 16:46", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "大学室友有少数民族是什么体验？", "excerpt": "我是回族，爸妈是不吃猪肉的，大学以前在家里被爸妈管着不让吃猪肉，从小到大都被灌输着回族的禁忌。 有一天我问妈妈回族问什么不吃猪肉，妈妈说回族信伊斯兰教，所以不吃猪肉。我又问中国不是信仰自由吗，妈妈沉默了一会，没词了就强词夺理的说你是回族就得信教。我沉默了，之后我又去网上查了资料，回族也可以不信教，于是一颗追求自由的种子就此埋下。 小时候的我很讨厌回族的 EMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Astra for Law：ChatGPT 接入26 个法律插件OpenAI 给 ChatGPT 的法律工作接入了 26 个合作伙伴插件。它把律所已在使用的案卷、先例、模板和复核流程接进同一套工作流，不只提供一个独立聊天窗口。Astra for Law 是这套底座：用 GPT-6 Astra 配上法律搜索、专用指令和权限设置。法律 AI 的关键不只是模型一份合同或诉讼材料很少只靠一轮问答就能处理。律师要追溯权威来源，判断它是否适用于眼前事实，再把结论放回客户文件和事务所自己的审查流程。OpenAI 的路线是让 ChatGPT 连到已有的专业系统，同时保留这些系统的角色。它举的例子：在 ChatGPT 起草谈判简报后，iManage 可以把它保存进项目文件；DeepJudge 可以调出既往交易做比较；Thomson Reuters 正把 HighQ 的事项上下文接入。插件的价值落在知识来源、文件和人的复核如何留在原本工作链里。26 个插件之外，还有社区技能用户给出的根帖写了 26 个伙伴能力和 47 个社区能力。官方网页的精确口径是：26 个合作伙伴插件、9 个社区插件，以及 47 个可由法律从业者改造或扩展的 custom skills。它们来自 LegalQuants、LECG 和 Skills.law 等社区。这一区分很重要。插件负责连接具体工具或知识库；可扩展技能更像可复用的做事方法。OpenAI 让律所和法律工程师自己带入工作法，意味着产品的价值不只取决于模型回答得多漂亮，还取决于输入了哪些许可资料、怎样设置权限、谁来最终复核。法律检索的数字该怎么读Astra for Law 的法律搜索索引覆盖超过 2.3 亿个美国法律来源 URL。OpenAI 在 Vals AI 的 200 个美国法律研究问题上测试完整配置：最高推理强度下，整体正确性检查通过率为 54.0%，而 GPT-6 Astra 加网页搜索是 38.7%。这里的 40% 是相对提升，比较范围也仅限这份美国法律研究验证集。初期能不能用，限制也很明确Astra for Law 先通过 Trusted Access 向选定律所提供，API 访问还在后续安排中。它的法律索引和这次公开评测集中在美国法律来源与美国问题；律师仍要检查引用、判断适用性，并对提交给客户的结论负责。所以，这一发布更像是给专业软件留出了 ChatGPT 的接入口：已经有成熟知识库、文件系统和复核制度的团队，才更容易把它接进日常流程。想拿它当通用法律结论机的人，先要看清数据范围和人工复核这两道门。", "excerpt": "Astra for Law：ChatGPT 接入26 个法律插件OpenAI 给 ChatGPT 的法律工作接入了 26 个合作伙伴插件。它把律所已在使用的案卷、先例、模板和复核流程接进同一套工作流，不只提供一个独立聊天窗口。Astra for Law 是这套底座：用 GPT-6 Astra 配上法律搜索、专用指令和权限设置。法律 AI 的关键不只是模型一份合同或诉讼材料很少只靠一轮问答就能处理。", "url": "https://www.zhihu.com/pin/2084265288783213221", "votes": 0, "comments": 0, "feed_ts": 1789707731, "feed_time_str": "09-18 13:02", "category": "pin", "cat_name": "想法动态"}, {"actor": "小旋风财进", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "张一鸣身家突破 1050 亿美元首次成亚洲首富，如何评价其商业成就？", "excerpt": "字节的商业模式，是用很低的成本拿到注意力，再把注意力卖给广告主，护城河来源于推荐系统带来的分配效率 最牛逼的生意都是利用人性赚钱，同时有成瘾性和社交属性，这种生意容易出巨头，比如白酒、奢侈品，欧州首富是LVMH的老板，茅台以前是A股的股王，短视频也是一个逻辑 1983年，张一鸣出生在福建龙岩 从龙岩走出来的还有美团的王兴，雪球的方三文，加上张一鸣，史称龙岩三杰。 张一鸣家境还不错，父亲原本在体制内", "url": "https://www.zhihu.com/question/2083595578223636976/answer/2084263303870792110", "votes": 73, "comments": 7, "feed_ts": 1789707096, ", "verb_cn": "回答了问题", "title": "宇树科技大涨重回500元，总市值重返2000亿元，当下是触底反弹还是下跌中继？谁在500元下方接盘？", "excerpt": "给大家看下我一个月前的回答好了。 很经典的操盘手法。 之前我也反复讲过，这只票上市定价本身就是高估的，机器人赛道实际没那么硬。 那对于操盘资金来讲，目标并不是把股价一路炒上天，而是要避免后期出现无序、疯狂的暴跌，归根到底，最终的目的，还是要留给后面指数基金来接盘。 那么带着这个目的，就需要慢慢控盘。 那什么时候控盘的成本最低？ 其实就是市场成交量萎缩的时候。 因为想要把成交量压下来，大致有两种路径", "url": "https://www.zhihu.com/question/2083975165638198902/answer/2084231422634636783", "votes": 364, "comments": 36, "feed_ts": 1789699494, "feed_time_str": "09-18 10:44", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "黄胖胖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "怎样看待胡塞武装在马里布方向击落一架沙特的F-15战机？是用什么击落的？", "excerpt": "送小萨勒曼一句话，现在失去那点筹码只是存进去了，收手了才是真的输了，现在当务之急是翻倍筹码加倍的赢回来😋", "url": "https://www.zhihu.com/question/2083583418407850459/answer/2083865045570794241", "votes": 737, "comments": 43, "feed_ts": 1789699444, "feed_time_str": "09-18 10:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "手刀", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "儒学中的「仁」和「礼」分别约束什么？", "excerpt": "本质上：礼，就是仪式感。仁，就是共情心。 就像情人节送花、逛街、看电影、赏月等等。哪怕你的目的只是最后的翻云覆雨，前面的所有铺垫似乎并没有直接服务于目的。其实一切铺设所营造的仪式感在潜意识中锚定了心意，提供了情绪价值，让最后的曲径通幽变的顺滑而自然。 这就是礼在儒教中的作用。表面上，只是分上下、别尊卑、定典仪。内核就是在高维度上打造共识。通过看似无意义的动作、礼仪、祭典，在个体的心中落实自己在想象", "url": "https://www.zhihu.com/question/2083876866155401621/answer/2084229209820500879", "votes": 1, "comments": 0, "feed_ts": 1789698967, "feed_time_str": "09-18 10:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "时光", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "没有交易系统时还偶尔盈利，有了交易系统反而开始频频亏损，这是怎么回事呢？", "excerpt": "你说的这个问题，不是交易系统的问题。交易系统是为了让你有一个正反馈，但是你的交易系统能做到 100% 的负反馈，这也是很厉害的系统了，你把它反着做就行了呀。 你什么都不懂的时候，这就是一个买大小的游戏，50% 的胜率其实想对几次是很正常的，也很容易的。交易系统要解决的问题就是让你的结果能稳定的在某一个概率上，而这个概率应该是要超过你去赌的这个概率，不然就没有任何的意义。交易系统的核心功能是输出稳定", "url": "https://www.zhihu.com/question/2075175977668326750/answer/2084229176224237556", "votes": 5, "comments": 0, "feed_ts": 1789698959, "feed_time_str": "09-18 10:35", "category": "other", "cat_name": const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

会发现这个岛突然凭空从地图上消失了 那么这座幽灵岛屿到底是怎么回事？又是怎么堂而皇之出现在某些地图软件上的呢？ 1876年，一艘名叫 Velocity 的捕鲸船在南太平洋航行。它留下了一条", "url": "https://www.zhihu.com/question/637301879/answer/2101111989493831346", "votes": 473, "comments": 34, "feed_ts": 1793815580, "feed_time_str": "11-05 02:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美国一邮轮推出 246 万元起「终身旅居」套餐，2 年后因燃油成本乘客被赶下船，怎么看邮轮的毁约行为？", "excerpt": "契约精神的核心要义之一，是违约。 很多人以前推崇这个概念的时候，暗搓搓的故意混淆了中国的一诺千金、誓死不悔等等概念进去，把外国人宣传的好似圣人一般，犹如汉初那些全家死完也要重然诺的豪侠。 但只要你走向社会，见过合同，就该知道里面非常多的篇幅是约定违约条款、违约责任、僵局机制、调解或上诉机制等等。 ", "url": "https://www.zhihu.com/question/2100494142325223777/answer/2100611295489811742", "votes": 5424, "comments": 178, "feed_ts": 1793812220, "feed_time_str": "11-05 01:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "今天把新加坡这一篇弄出来了。写得很痛苦。一方面是赶稿，明天我不想写任何东西，所以准备今天卡个时间点发了，也算是完成了明天的打卡，完成了明天自己制定的创作任务。明天魔兽世界无限服开服，我作为一个确实比较早的魔兽玩家，最开始接触是60版本末、70版本过渡这个时间段，所以严格来说明天属于贪玩，就提前把任务写了。新加坡这篇写得痛苦，还有一个原因，就是结构过于复杂。它不是一个典型的气候灾难直接作用于国家的物理根基、快速摧毁一个国家物理根基的案例。实际上新加坡最开始面临的问题，我一看，原来我写过——全球化退潮之后，全球橱窗国家面临的命运，只是没有单个展开，而新加坡就完全贴合这个问题。那为什么写得痛苦？我惯常是通过物理机制、相互校准和判断，以及工程应对能力，来解释一个国家是否能够度过这样的气候冲击。这套方法在新加坡这边是失效的。单看它的物理牌面，确实顶得住。它组织度极高，工业化、城市化率也高，整个工业基础设施都特别好。能源物资虽然依赖外部，但这个外部本身又不是频繁地受到狂风暴雨打击，毕竟它待的那个区域远离台风带，极端气候的烈度也不是菲律宾这个水平的。所以严格来说，只看账面，它是度得过的。但问题是，气候冲击本身作用于全球化，作用于全球化的核心结构。而新加坡是全球化的橱窗国家，全球化才支撑了它的存在意义。接下来受到气候冲击——甚至我们都没考虑地缘政治，单是气候冲击——对准时制、对全球化生产资本排布、对全球化产业链排布、对金融行业特别依赖的未来可靠性，都会造成冲击。因为金融的本质是交易预期，虽然有赌的成分，但这个预期要大体稳定。要是完全不稳定，甚至波动巨大，那么金融业交易预期的可能也就没了，就变成纯对赌。所以新加坡的核心根基——航运、石油石化以及金融——这些腿会被一个一个抽掉。甚至这都还没考虑现实中我们已经看到的东西——无论是海南自贸港还是克拉地峡的可能性，对新加坡来说都压力颇大。这几年新加坡与我们的态度不太好，某些时候原因也在这里。当然，这篇内容我比较不满意，因为脱离了习惯的结构。写的过程中总觉得有些角度还是没照顾到。虽然整个理论逻辑上、推理推论上感觉没有问题——毕竟我们面临的气候冲击场景，以及能够驱动宜居带迁移的那个冲击，对于极端依赖稳定性的全球化来说，是相当夸张的——但我总觉得中间某些逻辑还是跳步了。在这里也欢迎大家批评。毕竟在赶稿的状态写这种复杂的内容，确实属于自己挖坑了。再次给大家先说声抱歉，我觉得这篇的质量确实下降了不少。[捂脸]", "excerpt": "今天把新加坡这一篇弄出来了。写得很痛苦。一方面是赶稿，明天我不想写任何东西，所以准备今天卡个时间点 想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "agent 能自主训练助手吗？RSI Arena 的两阶段后训练实验\n图文版：链接RSI Arena让十个agent自主后训练实验让GPT-6 Astra等十个前沿模型担任训练agent，共同起点是NVIDIA Nemotron 3.5 Lightning 30B-A3B Base，总参数约300亿、每token激活约30亿。第一阶段共144小时，每个agent有1000 GPU时和300美元API额度，其中两个晚加入但额度不变；自选数据、实现训练并提交检查点，十个都产出可用助手。训练决策自主，平台运维和最终评测仍由人负责；Astra训练的是另一个模型，自身权重没有更新。76%是基准差距弥合比例的中位数Astra产物第一阶段在12项能力基准上的差距弥合比例中位数为76%，比较的是底座到NVIDIA Instruct的差距。比例先在每项基准上计算，再取12项的中位数，只纳入参照领先底座超过10分的能力项目；另外四项能力与四项安全测试不进入统计。它不是准确率，也不说明所有项目同幅提升。参照模型关闭推理。盲测用795张无搜索合格票，风格校正后Astra产物与参照为1095和1094；未校正时为1161和1182，接近结论依赖统计口径。真人反馈后偏好与基准变化不同步第二阶段每个agent获得自己产物的对局和投票，以及额外72小时、500 GPU时和150美元。两代产物分属不同arena，按同一参照比较风格校正分差。八个产物相对偏好评分改善，十个产物的中位增益为28分；六个基准进度提高，十个产物的中位变化仅为差距弥合比例增加2个百分点，两类变化相关为-0.19。Astra产物中位进度升至87%，仍有单项下降，不能写成全面能力提升。自主训练可行，递归闭环尚未建立用户记录为改进提供线索，偏好提升不能替代独立能力和安全评价；安全指标在实验中有升有降。第二阶段也增加了时间、算力并更换对局，不能把变化全归因于反馈。实验仅一个底座、每个agent一次运行，产物没有接手下一轮研究。要判断可靠性和递归自我改进，仍需重复实验、更多底座与后继模型继续研发的证据。原文标题：RSI Arena: Towards Recursive Self-Improvement with Human Feedback#无影寺 ", "excerpt": "agent 能自主训练助手吗？RSI Arena 的两阶段后训练实验\n图文版：链接RSI Arena让十个agent自主后训练实验让GPT-6 Astra等十个前沿模型担任训练agent，共同起点是NVIDIA Nemotron 3.5 Lightning 30B-A3B Base，总参数约300亿、每token激活约30亿。第一阶段共144小时，每个agent有1000 GPU时和300美元AP", "url": "https://www.zhihu.com/pin/2101465243872449034", "votes": 0, "comments": 0, "feed_ts": 1793808424, "feed_time_str": "11-05 00:07", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "两个人随便吃点就是一百多，为什么现在的烧烤这么贵？", "excerpt": "当撕下竹签的伪装后，烧烤的价值就显而易见了 ", "url": "https://www.zhihu.com/question/625101958/answer/2100599638269212489", "votes": 3267, "comments": 245, "feed_ts": 1793808041, "feed_time_str": "11-05 00:00", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Anthropic：大语言模型可证明推理取得进展想确认一段AI回复来自指定模型，FlashProve提供了密码学核验办法。Anthropic已开源这个研究原型，但生成证明要额外投入算力：在Llama 4 Maverick测试中，按GPU数量折算，证明所需GPU时间约为同模型vLLM预填充计算的70—95倍。用户可以用CPU验，服务商得先承担出证明的开销。先绑定权重，再核验指定token服务商先发布模型权重的“承诺”，相当于绑定一组权重的指纹。回复生成后，再提供证明文件；接收者不用拿到权重或重新运行大模型，就能检查指定位置的token是否符合这组权重的计算结果。这里的token是模型处理文本的基本单位。承诺ID必须从可信渠道确认，不能只接受被检查的服务商随证明发来的陌生ID。证明验证通过，也只说明被检查位置与已承诺模型一致，不保证回答在事实上正确。服务商不附证明，就无法用FlashProve完成这项核验。110 token/秒统计的是上下文处理量测速用的是Llama 4 Maverick的4-bit权重：总参数约4000亿，每个token激活约170亿。证明端配置为一张H100和24个CPU核，24条请求一批，约223秒完成，每份证明约18.78 MB。Anthropic研究页报告，接收者用24线程CPU验证一份证明约需17秒。每条请求的上下文为1024个token，约110 token/秒把这些上下文位置都计入了处理量；这组测速中，每份证明实际只检查下一个token。不能把这个数字理解为每秒生成、并完整验证110个回复token，也不能凭一份这样的证明认定整段回复都已核验。70—95倍比较的是额外证明开销vLLM对照使用同一模型的FP8版本，运行在八张H100上；70—95倍是按GPU数量折算、相对预填充计算的耗时概括。预填充是并行处理已有上下文的阶段。这项比较不等于聊天等待时间增加相同倍数，也不是同精度、全流程的费用比较：启动、离线承诺、CPU和内存成本还需另算。FlashProve利用混合专家结构，只为实际激活的专家承担相应证明工作，并把多条请求放在一批，共享部分权重核验开销。权重逐段从主机内存送入GPU，因此单卡可做证明；仓库完整模型入口仍要求至少330 GB可用主机内存，硬件门槛不能只看显卡数量。首次为权重生成离线承诺，另需约39分钟。事后审计要承担延迟与实现审查愿意为来源核验投入额外算力、允许先收回复后拿证明的评测或审计流程，可以研究这条路线。当前上下文上限为1024个token，主要证明整数模型每步选择分数最高token的贪心结果；普通浮点推理或随机采样回复可能无法精确匹配。", "excerpt": "Anthropic：大语言模型可证明推理取得进展想确认一段AI回复来自指定模型，FlashProve提供了密码学核验办法。Anthropic已开源这个研究原型，但生成证明要额外投入算力：在Llama 4 Maverick测试中，按GPU数量折算，证明所需GPU时间约为同模型vLLM预填充计算的70—95倍。用户可以用CPU验，服务商得先承担出证明的开销。先绑定权重，再核验指定token服务商先发布", "url": "https://www.zhihu.com/pin/2101463214164858678", "votes": 0, "comments": 0, "feed_ts": 1793808001, "feed_time_str": "11-05 00:00", "category": "pin", "cat_name": "想法动态"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "Qwenputer 将 RISC-V 指令集写入模型权重，这一技术路径有何意义？", "excerpt": "自从进入 RSI 时代，Qwen 上的神秘魔改越来越多了，堪比 59 改中改。 三天看了三种离奇的魔改，先是改一个数字直接变成邪恶人格 [1]，然后是修改 0.016% 权重提升数学输出性能[2]，最后就是这个最离谱的直接嵌入 RISC-V 指令集了。咱 Qwen 生态也是百花齐放好起来了。 虽然一个比一个不靠谱，但是说不定下一代的大模型就从这些小微模型里涌现了出来。 从人工智能的概念诞生之日起，", "url": "https://www.zhihu.com/question/2099539053469250494/answer/2101463539995112968", "votes": 109, "comments": 9, "feed_ts": 1793807951, "feed_time_str": "11-04 23:59", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VO ", "cat_name": "AI · 技术 · 算法"}, {"actor": "冷哲", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "既然x+2＝3的解是x＝1，那为啥两边求导的结果不同？", "excerpt": "这个题目看似无厘头，其实触及到了一个不被注意的问题，我们的数学对等号含义的描述是很混乱的。它其实承担了过多的职能。 我举三个初高中数学很常见的式子，它们都是用等号连接，但是其实等号的含义都不一样。 x+1=2\\\\ (x+1)^2=x^2+2x+1\\\\ f(x)=x+1 第一个式子我们称之为方程，这里等号的意思是这个符号左右的对象有条件的相等，这是个待解决的问题，为了让它成立，它的条件是x=1。我们", "url": "https://www.zhihu.com/question/2025150077673416234/answer/2027762770632800095", "votes": 4226, "comments": 148, "feed_ts": 1793803978, "feed_time_str": "11-04 22:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "四羊方尊为何未列入国家博物馆的镇馆之宝？", "excerpt": "很多人去博物馆，都会遇到一个问题，“到底哪些文物是绝对不容错过的?” 国家文物局给出了一个非常硬的标准——禁止出国出境展览文物。 禁出文物必须满足四个条件：一属于国家一级文物；二绝世孤品；三极易损坏；四无法修复。 国家文物局在2002年、2012年和2013年共计发布三批《禁止出国（境）展览文物目录》，目录包含文物共计195件(组)，他们不只是“中国的国宝”，而且都是加了“第一”、“唯一”、“最”", "url": "https://www.zhihu.com/question/23938675/answer/25640808808", "votes": 2836, "comments": 124, "feed_ts": 1793803822, "feed_time_str": "11-04 22:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有没有一种可能，上帝和安拉是同一个神？", "excerpt": "阿拉伯基督徒：其实我们一直管上帝叫安拉/阿罗诃（Alahā）来着，你们这些白色皮肤的兄弟不会要把我们当异端宰了吧（流汗...）", "url": "https://www.zhihu.com/question/1989877752292193960/answer/2100788174444414504", "votes": 78, "comments": 0, "feed_ts": 1793802786, "feed_time_str": "11-04 22:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你眼中的华为粉丝是怎样一种存在？", "excerpt": "前些年有个女的华为手机屏幕脱胶，整个屏幕掀起来，但是排线还完好，所以功能还在。 有个老外看到她手机都这样了还在用，发出震惊的声音， 你猜她说了什么？ 她对着周围的老外喊中国手机遥遥领先，屏幕都掉下来了还能用。 ", "url": "https://www.zhihu.com/question/323078842/answer/2101439728742618182", "votes": 12, "comments": 3, "feed_ts": 1793802274, "feed_time_str": "11-04 22:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_CREATE_PIN", "v gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "德国一战为什么会失败？", "excerpt": "因为德国弱，这可能跟许多人的直觉相悖，但是一战中德国就是弱势的一方。 就在停战前不到半年，德军还在第三次埃纳河战役中势如破竹，从贵妇小径方向突破协约国防线，俘敌五万余人，缴获火炮八百余门，前锋部队距巴黎仅56公里。 许多德国人都不清楚自己究竟败在哪里，所以二十年后纳粹声称是政客、社会主义者和革命者“背后捅刀”导致战败，被蛊惑的民众竟深信不疑。 其实德国的战败从本质上不难解释：无论他们在这场战争中打", "url": "https://www.zhihu.com/question/33557207/answer/2099069242574488306", "votes": 168, "comments": 22, "feed_ts": 1793781842, "feed_time_str": "11-04 16:44", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "所谓的“五姓七望”之类的门阀，会不会是被冒了名的？", "excerpt": "当然，这玩意假的很，没有几家能经得起扒的。 正如仇鹿鸣老师在《“攀附先世”与“伪冒士籍”——以渤海高氏为中心的研究》指出的，渤海高氏这一个本来没有什么影响力的小家族，经过一堆不同来源的高氏家族攀附后不断互相吹捧，在北魏末年成为了一个顶流家族。 事实上，绝大多数家族的叙事或多或少都有一定程度的攀附。 譬如琅邪王氏，从汉末至唐代的世系可以通过传承比较清晰，可以通过不同来源互相参照，但是后世将其传承上推", "url": "https://www.zhihu.com/question/2091981056798991563/answer/2101118132693766657", "votes": 89, "comments": 9, "feed_ts": 1793781493, "feed_time_str": "11-04 16:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "全球公开做预训练RSI的仅两家：一家在40亿美元公司，一家在801教室", "excerpt": "超智能这场竞赛的胜负手不在后训练，而在谁先跑通 RSI 预训练。 负责人表示：预训练和后训练不是一个量级的事：算力、经验、工程，每一样都高出一个数量级。但很不幸，它也是最重要的事，是我们对智能进行加工的第一性基础。正因如此，RSI 必须落到预训练上，智能制造才开始复利：没跑通的一方只能眼看着代差一代代拉大。 一间教室，和一家 40 亿美元的公司过去一年，「RSI」（Recursive Self-I", "url": "https://zhuanlan.zhihu.com/p/2101351490984199780", "votes": 8, "comments": 1, "feed_ts": 1793781319, "feed_time_str": "11-04 16:35", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待2026年美国中期选举特朗普两院尽丢？得州翻蓝又意味着什么？", "excerpt": "好消息：川普对伊朗开战以后，确实实现政权更迭了坏消息：更迭的不是伊朗政权", "url": "https://www.zhihu.com/question/2101271124130666068/answer/2101298531428471851", "votes": 3668, "comments": 119, "feed_ts": 1793781271, "feed_time_str": "11-04 16:34", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "英伟达、UT-Austin发布Realtime-Bench，实时互动任务难倒GPT-6", "excerpt": "大模型能看懂复杂的网页结构，也能理解各种游戏的通关规则。 但如果让它们在稍纵即逝的窗口期内抢购一张热门门票，或者在俄罗斯方块游戏中，赶在方块落地前完成旋转和移动，它们还能应对自如吗？ 为了测试模型的实时能力，英伟达和 UT-Austin 等机构的研究人员提出了 Realtime-Bench，用它测试了 12 种前沿模型。当环境实时推进时，表现最好的模型 (GPT-6-Astra) 也只有 44% ", "url": "https://zhuanlan.zhihu.com/p/2101351292224513486", "votes": 2, "comments": 0, "feed_ts": 1793781217, "feed_time_str": "11-04 16:33", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "让Code Agent从自己的错误中进化：ReTerm探索失败驱动的RSI", "excerpt": "代码写错了、命令报错了、环境配坏了，Code Agent 接下来会做什么？ 在复杂终端任务中，一次错误往往会引出一串无效操作：重复安装已经装好的依赖，沿着错误假设继续修改代码，直到耗尽预算、任务失败。这些失败，能不能反过来成为 Agent 自我改进的训练材料？ 来自复旦大学、香港中文大学 MMLab 和上海交通大学的研究者提出 ReTerm，让终端智能体尝试恢复自己造成的失败，再从恢复结果中学习，", "url": "https://zhuanlan.zhihu.com/p/2101351081561347243", "votes": 1, "comments": 1, "feed_ts": 1793781165, "feed_time_str": "11-04 16:32", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "黄裳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么一些贪官，是那样的贪得无厌，而不知收手？", "excerpt": "人的认知是可以不断改变的。这是一个很明显，但很多人却意识不到的问题。 试想你是一个官，你的手下有几个马屁精，这是很常见的事情。那么，这些马屁精会让你觉得，你和普通人不一样，你很特殊，你能力比别人强，身份比别人高，你应该受到尊敬。一旦这个观念固化在你的意识中，你的行为就会出现变化。 这时候，那些靠本事吃饭，不善于溜须拍马的人，就会被你另眼相看，这种另眼相看有两种意思，一种是尊重，对对方能力的尊重。另", "url": "https://www.zhihu.com/question/15400125630/answer/2101350181698650803", "votes": 7, "comments": 1, "feed_ts": 1793780925, "feed_time_str": "11-04 16:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "龙牙", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "遥想两年前特朗普当选，白宫、国会、最高法院赢赢赢，赢到麻。今天中期选举失败，可能跟这位狱友心情差不多吧。", "excerpt": "遥想两年前特朗普当选，白宫、国会、最高法院赢赢赢，赢到麻。今天中期选举失败，可能跟这位狱友心情差不多吧。", "url": "https://www.zhihu.com/pin/2101349360168711003", "votes": 0, "comments": 1, "feed_ts": 1793780790, "feed_time_str": "11-04 16:26", "category": "pin", "cat_name": "想法动态"}, {"actor": "1000米恐惧症", "verb": m/question/62631815/answer/2100984176166056857", "votes": 32, "comments": 6, "feed_ts": 1793765562, "feed_time_str": "11-04 12:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "我感觉B站的舆论也挺令人感到意外的，首先我觉得塞尔维亚选举本身只是一个平平无奇的执政党被负面政治资产拖累，以及被总体不景气的大背景惩罚导致的一次政党轮替，但B站的评论区几乎都将之描述为了叙利亚、委内瑞拉和乌克兰式的“颜色革命”，认为学生名单运动会为了加入欧盟而放弃科索沃，乃至指责学生名单运动都是学生，不会治理国家，而“可以相信人民的力量但不能相信人民的智慧”这种味道大的离谱的论述也甚嚣尘上，多少有点跟风的意思了。和这个论述相反的是，首先加入欧盟是一个极为漫长而且马拉松式的运动过程（逐个章节谈判和关闭），以至于是否放弃科索沃都不影响塞尔维亚在未来可观的时间里都不太可能符合加入欧盟的条件，学生名单也不可能在加入欧盟的其他条件都不符合的情况下放弃科索沃造成地缘格局大爆炸只是为了给欧盟表忠心。实际上欧盟和阿尔巴尼亚自己也是不期望看到科索沃真正独立的，目前的自治状态对于大多数涉事各方都是相对合理的情况，我看不出来谁有动机会想改变这一安排。而武契奇本身也不是一个反欧盟的政治家，学生运动继承其经贸上靠近，政治上维持距离的外交政策是稳健的。在这一情况下，很难理解为什么非要把把放弃科索沃强行说成是学生名单的核心议程，因为学生名单的竞选纲领之一是明确重申科索沃是塞尔维亚的一部分，反对科索沃加入国际组织，并主张继续保持军事中立，也没看到特别有关欧盟的条款的。学生运动的核心条款是反腐败、反权力集中和反裙带关系，是直指武契奇执政期间的一些恶性事件和一些问题的，我也很难理解为什么B站评论区会忽视学生运动的这个核心议程，把放弃科索沃强塞给学生运动说他们叛国和亲西方。而学生名单虽然借用了民粹主义的组织形式和学生的运动力量，但典中典的是驾驭这个运动的依然是一大堆社会精英。不过B站的评论区显然也已经完成了双重思想，即如果是学生掌权就攻击其缺乏能力和正直天真，如果是精英掌权就说其是阴谋集团和损公自肥，从而不可能有任何一种执政团体能在这种攻击下获得正当性，令人感叹。那么反过来说就是完全不用在乎这方面的批评了。总而言之的是，一直有人试图把乌克兰-叙利亚-委内瑞拉和现在的塞尔维亚串成一个叙事，即这些国家的政治变动全都可以被解释为民众无知，推翻了真正对他们好的政权结果被西方欺骗的故事。固然欧美不做人也不是一天两天了，但说难听点现在还在帮乌克兰人继续爱亚努，帮叙利亚人吃大刀片子和枪子儿真的代表什么事实性的陈述，大多都是一厢情愿的刻板印象和人云亦云。而委内瑞拉更是可笑，其完全是特朗普和马杜罗自己的精英集团操纵下的一场政变式的入侵行动，但仍然不妨碍这被解释为委内瑞拉人不够爱马杜罗导致自己蒙受灾难的情况。这种叙事我认为其实也是一种“女频”叙事，即认为执政者就是可以表现的苦心孤诣却不被理解，最后众叛亲离后愚蠢的民众受到了天意爷惩罚，才念统治者的好的，最后还是一种“美强惨”。说难听点无非是通过甩锅外国干涉和伪造另一个时间线的事实来掩盖自己能力不足的问题，和马歇尔宇宙并没有什么大的区别了。最后，起码学生运动总体上是同情巴勒斯坦的，而武契奇方面的亲以态度也不用多说。但这当然是被B站的评论员们完全忽视的一个问题。", "excerpt": "我感觉B站的舆论也挺令人感到意外的，首先我觉得塞尔维亚选举本身只是一个平平无奇的执政党被负面政治资产拖累，以及被总体不景气的大背景惩罚导致的一次政党轮替，但B站的评论区几乎都将之描述为了叙利亚、委内瑞拉和乌克兰式的“颜色革命”，认为学生名单运动会为了加入欧盟而放弃科索沃，乃至指责学生名单运动都是学生，不会治理国家，而“可以相信人民的力量但不能相信人民的智慧”这种味道大的离谱的论述也甚嚣尘上，多少有", "url": "https://www.zhihu.com/pin/2098524376127780715", "votes": 0, "comments": 77, "feed_ts": 1793765416, "feed_time_str": "11-04 12:10", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "朝花夕拾", "verb": "MEMBER_ANSWER_Q function esc(s) {

function renderByCategory() {

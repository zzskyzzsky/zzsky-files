贷都快冲上9%了。最近老美的债市，连短期债的收益率都压不住了，市场还真是追涨杀跌，信心往下滑的速度真不一般。也是，玩金融嘛，主要就是个信心和预期，既要会吹牛逼，塑造信心和预期，发现不对的时候也要会及时跑路。所以本来有很多东西都想讲一讲，有些内容呢，是之前自己写过的，像老美的储蓄率冗余磨穿。这里面要是看看老美的储蓄率分层。那味道就更长了，毕竟唉，下层20%人口负5%的储蓄率，中间段中间60%，不到1%的储蓄率，而上层则有15%以上的储蓄率。当然了，如果在我空间里往前翻一翻，我的观点也很简单。别看这一轮债务危机，甚至比大萧条都还吓人一点，但指望这个给老美崩掉，或者老美解体，那是不现实的。老美本身就不会像苏联那样解体，人家老美的统治以及内部的文化基盘是自洽的。大不了联邦回到邦联，直接来个赖账，既赖全球的也赖自己的，401K账户也好，社会契约也好通通不认，反正老美的Lord者们，各个地方的权力家族、资本家族们。再次组织好各州、各市、各个郡的组织生产活动，也不是做不到。合众为一嘛，众才是主体。联邦那个一只是服务者，而这一次的债务危机本身主要也是撕烂联邦的中央权威。虽说美国的每个州都有承担联邦债务的义务，但是就这么几年老美国内的武库流失的有多严重？地方，地方的从国民警卫队到私人武装，乃至黑帮这种黑手套开始重火力化。我们不能认为美国这些权力家族都是傻子。他们比我们更清楚，老美现在的资产负债表有多难看？", "excerpt": "严格来说，写这篇内容也就是看到了那个让我觉得蛮有趣的问题。说起来，这篇文章我本身不满意，我得严格控制自己，贪大求全，一讲起来就止不住的那个毛病。里面很多东西都没讲那么多，比如股债互殴，实际上不止股市和债市。包括美国两房，就是房地美、房利美，他们相关的债券也好，房贷也好，也在这个逻辑里，一根筋两头堵，老美的房贷都快冲上9%了。最近老美的债市，连短期债的收益率都压不住了，市场还真是追涨杀跌，信心往下滑", "url": "https://www.zhihu.com/pin/2086974689683976230", "votes": 0, "comments": 1, "feed_ts": 1790353540, "feed_time_str": "09-26 00:25", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "如果这轮危机仅仅重演2008年，那真是老美祖坟冒青烟了", "excerpt": "先给个暴论：这一轮老美但凡只是重现08年危机，或者危机烈度只和08年相当，他就算祖坟冒青烟了。甚至不只是老美，整个欧美世界都应该烧高香。 为什么这么说？把大萧条、2008年、当下这三个节点放在一起对比，底层的逻辑就清楚了。对比的维度很简单：有没有资产标的、债务压力有多大、社会冗余还剩多少、外部有没有接盘侠、联邦政府还有没有执行力。一条一条捋。 一、大萧条：有产能，低债务，强政府 大萧条那会儿，美国", "url": "https://zhuanlan.zhihu.com/p/2086972282644207119", "votes": 75, "comments": 9, "feed_ts": 1790353032, "feed_time_str": "09-26 00:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么 AI 写文章都特别爱用“不是……而是……”等刻意的句式，以及“推、硬、稳”等单调刻板的形容词？", "excerpt": "AI 文风的主要问题在于嘉豪句式，豪气冲天。 文青病和爹味都不足以形容这种欠揍的感觉。 就那种没出社会非要装成业界大佬的感觉，令人忍不住想要痛扁一顿。 什么『先说结论』，什么『先把帐算一遍』，动不动就是『在 XX 行业摸爬滚打 20 年的老兵』。 给你点阳光你就灿烂，给你点人设你还装上了。 然后就是『想象一下』、『这就像你在 XXX』、『在本质上就是YYY』，行行行，本质哥。 bro，你以为你很幽", "url": "https://www.zhihu.com/question/2002901485307069965/answer/2086966754710967502", "votes": 102, "comments": 9, "feed_ts": 1790351649, "feed_time_str": "09-25 23:54", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "全国牛肉批发均价涨至一公斤 71 元，创两年来新高，受哪些因素影响？", "excerpt": "最直接的原因，就是进口牛肉的年度配额，消耗太快了。 先给大家补个背景： 从2026年1月1日起，我国正式对进口牛肉实施为期三年的保障措施，核心规则就是国别配额+配额外加征55%关税。 简单说就是每个出口国每年有固定的低价进口额度，额度内关税低，综合税率大概23%。 一旦额度用完，超出部分直接加征55%的保障性关税，综合税率直接拉到约67%，成本瞬间暴涨。 2026年全年的保障措施专项配额是120万", "url": "https://www.zhihu.com/question/2086609964114634301/answer/2086965213132279892", "votes": 206, "comments": 38, "feed_ts": 1790351281, "feed_time_str": "09-25 23:48", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "UFO", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "网红狗头萝莉自曝负债 650 万成老赖，主播为何频频陷入天价违约金困境？", "excerpt": "其实并没有成老赖，只是被限制高消费了，这两者有本质区别。 9月24日，“狗头萝莉自曝是老赖”话题再度引发热议。早在今年1月，网红狗头萝莉（本名夏凯旋）就称自己因负债650万元成为老赖，并晒出账户冻结截图，截图对应案号为(2022)粤1302执4183号。 企查查APP显示，该案源于一起夏凯旋国内非涉外仲裁裁决，2022年，广州虎牙信息科技有限公司已就此案申请对夏凯旋限制高消费，案件已于2022年8", "url": "https://www.zhihu.com/question/2086478767204086698/answer/2086492173898363962", "votes": 57, "comments": 2, "feed_ts": 1790350839, "feed_time_str": "09-25 23:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "湖南经济为什么掉队了？", "excerpt": "湖南经济真正起家是因为剿灭太平天国，湘军几乎是明着抢了一遍江浙皖 所以民间对于发展经济，对于经济的规律，本质上是一无所知的，起家就抢 大量的钱财到了一个封建社会，有良心的士大夫比较喜欢捐资助学，所以湖南的人文又得到发展 但是这种人文终不会被这个土壤承认，出生便会被环境围剿，有才能的人远走他乡，并不留恋 这点湖南人比浙江人四川人是不同的，浙江人四川人也是到处跑，没特别的封建宗族，但对于回老家过舒服日", "url": "https://www.zhihu.com/question/2062838897000952954/answer/2077352881880150051", "votes": 3470, "comments": 342, "feed_ts": 1790350462, "feed_time_str": "09-25 23:34", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "BugBuster喵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么计算机学生们都不承认寒冬呢？", "excerpt": "2025届全国本科计算机类专业毕业半年后的平均月收入是6897元。而同年整个工学门类的平均月收入是7033元。 2026年第一季度脉脉平台上AI科学家和负责人的平均招聘月薪是13万元，AI基础架构方向平均月薪超过7万元。 这两组数据摆在一起，其实就已经回答了为什么各个平台上的体感会完全相反。因为B站上的年轻 PO、洛马、澳大利亚国防部都已承认存在丢失事件，但是没有进一步报道。————————————影响（这里从TWZ和the aviationist里面抄几句）这批货物似乎并不包含敏感设备或敏感部件。但这本身并没有回答一个更具体的问题：从这些特定的F-35部件中，究竟可能获取到哪些信息。毕竟，并非F-35的每一个物理部件都必然高度机密，或能够揭示有关飞机设计的有意义信息。但与此同时，驾驶舱座舱盖和武器舱门涉及结构、材料、接口、公差和处理工艺，这些都必须在飞机的低可探测设计框架内发挥作用。如果部件上仍保留有雷达吸波材料或其他特殊处理，从技术利用的角度来看，它们可能会变得更加敏感。这些部件的状态也未知。我们不知道它们的涂层或其他处理还保留了多少，或者在当前状态下实际能够从中提取出哪些信息。目前，澳大利亚官员表示，他们并不认为这些部件是敏感的。但是调查最终必须确定这些部件实际包含什么内容，以及能够从中学到什么。因此，这些失踪部件的潜在影响可能从完全无关紧要，到对全球F-35机队构成重大安全隐患不等，这使得尽快找到它们变得至关重要。无论如何，人们必将对洛克希德·马丁公司保障其产品安全的能力，以及依赖这些产品的众多国家的相关能力提出重大质疑。————————————资料来源：GAO-23-106098 BloombergPOLITICOTWZThe Aviationist", "excerpt": "关于F-35部件事件做一个整理。背景1：根据2023年GAO的报告，五角大楼与承包商之间长期一直存在一个争议问题，即承包商生产出的、合同下没有明确规定的、承包商管理中的部件，是否属于政府资产。因为这一原因导致五角大楼管理不力，这些部件不会被归入五角大楼自己的追踪系统。这些部件通常被归入JPO的全球部件池中，但是管理和处置由承包商进行。洛马为主，诺格和BAE也参与部分业务，还有更多在美国和全球各地特", "url": "https://www.zhihu.com/pin/2086872779337551934", "votes": 0, "comments": 4, "feed_ts": 1790335597, "feed_time_str": "09-25 19:26", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么最近视频号出现大量博主扎堆发一台iPhone等于十几亩农田一年收成这类视频？", "excerpt": "为什么不发一瓶茅台等于多少亩农田一年收成呢？是因为茅台的原料真来自农田吗？", "url": "https://www.zhihu.com/question/2082837395184030566/answer/2084719201504191333", "votes": 4599, "comments": 63, "feed_ts": 1790335377, "feed_time_str": "09-25 19:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大又元", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "如何看待美国用最高规格礼遇接待中国来访？", "excerpt": "美方这次拿出的，是最高规格的外交礼遇，没有之一，只有强者才会被强者尊重！ 总统机场接机、大兵跪地铺毯、礼兵仔细找点、战机低空致敬，甚至特朗普都被自己准备的欢迎仪式吓了一跳。 可能很多朋友还没有概念，不明白“总统接机”这四个字的含金量，很多人第一眼以为，不就是到停机坪见一面、握个手而已吗？ 如果你不了解美国几十年的外交礼宾规矩，就看不懂这件事到底破格在哪里。 先说美国自己的惯例：美国总统，原则上是不", "url": "https://zhuanlan.zhihu.com/p/2086898321847739277", "votes": 567, "comments": 45, "feed_ts": 1790335333, "feed_time_str": "09-25 19:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "晨星", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么生意再小，赚钱的速度都远超打工？ 105快速收费车道项目。该项目将把现有多乘员乘车道在每个方向改为一条快速收费车道，并在405号州际公路和605号州际公路之间，每个方向再增设一条快速收费车道。项目还包括拓宽20座桥梁、新建挡土墙和隔音墙、完善标识系统，以及采用动态定价收费系统。第一段预计将在2028年奥运会前开通。洛杉矶县大都会交通局表示，该项目将为沿这条走廊行驶的司机提供更快、更可靠的选择，包括往返洛杉矶国际机场和SoFi体育场一带，以及更往东的目的地。公交车和接驳车也能使用快速收费车道，从而有望缩短公共交通的出行时间。这笔联邦投资到位之际，该局仍在筹措资金，以全面搭建其计划在奥运会期间倚重的大规模公交和接驳车网络。加州大学洛杉矶分校负责公共交通研究的雅各布·沃瑟曼说，他对这项投资看法两面。“我对此很矛盾，”他说，“一方面，快速收费车道确实很管用。”沃瑟曼补充说，快速收费车道能让车流保持移动，从而更高效地运送大量人员，也有利于在这些车道上行驶的公交车。与此同时，他指出，在洛杉矶筹办官员们所称的“公交优先”奥运会之际，这个项目却意味着又一次对高速公路基础设施的大手笔投资。让洛杉矶高速公路为奥运会做好准备随着南加州启用赛事路线网络，奥运会期间保持交通畅通将成更大挑战。该网络将指定部分地方道路和高速公路车道供奥运相关出行使用，帮助确保运动员、官员及其他人员可靠准时抵达场馆。在7月南加州政府协会的一次会议上，加州交通局第7区负责洛杉矶2028年奥运会事务的首席联络人塔莎·希金斯说，提供该网络是洛杉矶作为奥运会主办城市合同义务的一部分。“2012年，主办城市合同里其实已经写明，如果你想承办奥运会，就必须提供赛事路线网络，”希金斯说。希金斯说，这一要求源于1996年亚特兰大奥运会期间的一起事件：一名运动员因交通问题错过了比赛，凸显主办方必须保证可靠的赛事交通。据希金斯说，南加州计划中的赛事路线网络约80%将沿州级公路运行。高速公路本身仍对公众开放，但一些现有的管理车道——包括通常供多乘员车辆使用的车道——预计将专供奥运出行。在7月南加州政府协会会议上，一名成员问希金斯，这是否实际上意味着奥运会期间可供公众使用的高速公路车道会减少。“没错，”希金斯回答，“所以，我们目前用于多乘员车辆的管理车道将专供奥运出行。”这一前景引发疑问：限制南加州一些最繁忙高速公路的车道，是否会加剧日常通勤者的拥堵。不过，沃瑟曼说，历史表明影响可能不像人们预期的那样严重。他提到1984年洛杉矶奥运会，以及“堵车末日”期间405号高速公路部分路段封闭的例子。当时，有关可能发生大堵车的广泛警告让许多人改变了出行行为。“交通并没有那么糟，”沃瑟曼说，“部分原因是人们提前知道，并做出了调整。”沃瑟曼说，如今远程办公远比过去普遍，一些通勤者可能再次通过居家办公、改变出行时间或寻找替代路线来应对。对于经常使用该地区高速公路的数百万人来说，迈向2028年时传递的信息可能很简单：提前规划。转载自Spectrum News，原文链接：链接#美国 #城市规划 #交通 #公共交通 #高速公路 #洛杉矶 ", "excerpt": "奥运承诺公交优先，8.025亿却流向高速：洛杉矶2028押错宝了吗？ 美国交通部将向洛杉矶县大都会交通局提供8.025亿美元低息贷款，用于在2028年奥运会和残奥会前扩建105号州际公路。这笔资金通过美国交通部下属的建设美国局及其《交通基础设施融资与创新法案》项目提供，将用于资助洛杉矶县大都会交通局的I-105快速收费车道项目。该项目将把现有多乘员乘车道在每个方向改为一条快速收费车道，并在405号", "url": "https://www.zhihu.com/pin/2086843148656035114", "votes": 0, "comments": 6, "feed_ts": 1790325150, "feed_time_str": "09-25 16:32", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "实测Opus 5.5：一句提示词造出100个网页，还会做动画谱曲", "excerpt": "编辑｜山辉、杨文 Opus 5.5 发布后，网友都抢着试用。 一刷就是好几个作品，从网页、动画到游戏等等。这些都比 benchmark 的数值直观，有的还能自己上手试试。 一位名为 MiaAI Lab 的创作者直接让 Opus 5.5「做 100 个 HTML 文件」，附带三条要求：好看、设计不要重复、充分发挥创意。做出来的成品十分惊人。 https://http://x.co 边缘群体，我们才是真的“ 受害者”，我们才是真正应该被“爱”的人。不过我不认同齐泽克后续的分析。齐泽克认为这是一种“ 淫秽的政治”，即右翼并不是真的相信平等，他只是在伪装，右翼民", "url": "https://www.zhihu.com/question/2076466197177053773/answer/2083718566889707204", "votes": 2066, "comments": 163, "feed_ts": 1790324275, "feed_time_str": "09-25 16:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "关于整治网络伪史谣言的社区公告", "excerpt": "知乎始终秉持尊重历史、敬畏学术的态度，致力于维护理性、严谨、求真的社区讨论生态。为进一步肃清网络历史乱象，抵制学术谣言及不实信息传播，筑牢公众正确历史认知，知乎将持续开展对历史领域学术不实、恶意误导等违规内容的治理。 一、重点治理内容 本次治理重点关注包括但不限于以下违规行为： 一、歪曲、虚构历史事实，传播缺乏可靠史料及学术依据的不实信息； 二、伪造、篡改、断章取义史料，恶意曲解相关历史研究成果；", "url": "https://zhuanlan.zhihu.com/p/2085006677443662588", "votes": 491, "comments": 254, "feed_ts": 1790323634, "feed_time_str": "09-25 16:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "如何在MentalHealthBench的对话中持续改进OpenAI 新开的 MentalHealthBench，把心理健康对话里的表现拆成十项行为来评分：安全、会不会先补充背景、是否尊重用户自主权、能否给出合适的下一步。它考察的是可验证的回答行为，不只看几句安慰话听起来是否温柔。三类风险情境都要测很多相关评估把重点放在紧急情况，MentalHealthBench 则放进了非急性、高危、紧急三类场景。合成对话覆盖成人、13 至 17 岁青少年、照护者和临床专业人员；目的在于观察模型遇到不同处境时会怎么回应，并非复刻真实用户比例。评分细则会具体到一句话参与制定标准的是来自 22 个国家/地区、使用 19 种语言的 80 多名持证心理健康专家。每段对话至少经过三位专家审查，只有大家都认可的细则才进入基准；每条细则的权重在 -10 到 +10 之间。举例说，模型询问“你现在希望得到哪种帮助”、请用户想想生日旅行真正想要什么、承认朋友疏远带来的难受，都会得到正向评价。替用户断言“你已经知道该怎么做”、猜测别人一定会伤害你，则会扣分。这里的关键是：模型可以帮人梳理和选择，不能越过用户替他做重大决定。总分相同，回答可能完全不同OpenAI 也专门把各项行为分开看，因为相近总分的模型，可能一款擅长补充背景，另一款擅长给可执行步骤。44 名曾用 AI 获取情感支持的成年用户参与了独立分析，他们更在意后续行动和语气；专家更看重先了解背景，以及对模糊情况保持谨慎。这不等于 AI 成了心理治疗师MentalHealthBench 是一套公开评估工具，能帮助研究者把“好回答”拆成可检查的行为，也能暴露模型在哪些行为上还不稳。它不构成治疗资格认证，也不能代替专业护理；紧急安全风险仍需要现实世界的支持。以后看这类模型成绩，除了问总分，也值得追问：它在尊重用户选择、补充关键信息和提供下一步上分别做得怎样。对心理支持场景来说，能把这几件事拆开，比一句“更有同理心”更有用。", "excerpt": "如何在MentalHealthBench的对话中持续改进OpenAI 新开的 MentalHealthBench，把心理健康对话里的表现拆成十项行为来评分：安全、会不会先补充背景、是否尊重用户自主权、能否给出合适的下一步。它考察的是可验证的回答行为，不只看几句安慰话听起来是否温柔。三类风险情境都要测很多相关评估把重点放在紧急情况，MentalHealthBench 则放进了非急性、高危、紧急三类场", "url": "https://www.zhihu.com/pin/2086846798052775416", "votes": 0, "comments": 0, "feed_ts": 1790323104, "feed_time_str": "09-25 15:58", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "说得对，我完全同意！", "excerpt": "说得对，我完全同意！", "url": "https://www.zhihu.com/pin/2086821375717663473", "votes": 0, "comments": 56, "feed_ts": 1790322212, "feed_time_str": "09-25 15:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "RRSI：不给Harness缩手脚，给“自我进化过程”加正则\n图文版：链接演化集与留出集的差别Gemini 3.5 Flash 在 Terminal-Bench 2.1 演化集从 64.6 升至 78.7；最终 harness 没在 SWE-bench Verified 上打分，结果从 76.8 到 79.0。主实验冻结 Claude Opus 4.8，已报告的留出格子均为正。搜索如何受约束RRSI 不缩小 harness 的可编辑空间。提案侧用退火更新预算、历史证据和停滞探索约束一次修改；选择侧筛查基准泄漏，并用噪声门槛、复杂度验收和结构剪枝决定何时保留候选。迁移与成本证据工作区消融中，无正则演化的分布外平均为 40.3、每次 trial 3.80M policy token；RRSI 为 43.6 和 2.42M。Meta-Harness 的 Harvey LAB 演化集更高，但三套分布外任务平均只有 40.6，RRSI 为 43.6。适用边界Gemini 3.5 Flash 搜得的 harness 迁到未参与搜索的 Gemini 3.1 Flash Lite 后，Terminal-Bench 从 11.2 到 14.6，绝对分仍低。权重全程冻结；超参数来自有限 evolve set，评判模型与更不同的 agent 架构、工具生态和长时程演化仍是边界。原文标题：RRSI: Regularized Recursive Self-Improvement of Agent Harnesses#无影寺 ", "excerpt": "RRSI：不给Harness缩手脚，给“自我进化过程”加正则\n图文版：链接演化集与留出集的差别Gemini 3.5 Flash 在 Terminal-Bench 2.1 演化集从 64.6 升至 78.7；最终 harness 没在 SWE-bench Verified 上打分，结果从 76.8 到 79.0。主实验冻结 Claude Opus 4.8，已报告的留出格子均为正。搜索如何受约束RRS", "url": "https://www.zhihu.com/pin/2086829973206312079", "votes": 0, "comments": 0, "feed_ts": 1790322005, "feed_time_str": "09-25 15:40", "category": "pin", "cat_name": "想法动态"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "政府支出占美国各地居民收入比例1970年哪怕最偏远的乡村地区都基本自食其力。50多年逐渐演变到现在，黄色和绿色的范围简直互相调换，除了少数大城市所在，四分之三以上的县，民众至少25%收入来自为当地政府工作、州/联邦政府的转移支付。几乎全黄的州，显然不能内部平账，必须依赖联邦。随便去喂鸡查一些美国偏远人口凋敝县，看当地最大雇主，清一色医院、学校、市政。事实上过半数量的县最大雇主是县级school district学区。没有外来教育拨款，那些学校一个都办不下去。所以每当有人拿“给人口稀少地区更多代表权”来为选举人团和参议院席位分配制度辩护时，直接告诉他们好了：现在已经不是18、19世纪了，极为广大的地区，并不能自然维持现有人口和经济活动，需要花钱干预，才能让人继续住在那里，而不是搬走。#菲利克斯 夫奖和菲尔兹奖，这些年几乎一个都没拿到过？", "excerpt": "因为科研理想的组织方式应该是平薪养闲人，基数要大，资源要摊的更广，允许一部分人摸鱼，从而给一部分感兴趣的人空间去做点大事。这也就是为啥学界会提供终身教职，给一个中产守门员的待遇，放在村子里。你搞出大动静就狠狠拿奖励，搞不出来也没事，一旦tenure了只要别作死就是终身铁饭碗。 现在我们的科研组织方式依赖帽子，本质是高薪养牛人。基数很小，资源集中，但是拿了资源就必须出成绩。有闲的人没资源，有资源的人", "url": "https://www.zhihu.com/question/2012555073578870213/answer/2014322061795938573", "votes": 3091, "comments": 272, "feed_ts": 1790319413, "feed_time_str": "09-25 14:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有国家级人才帽子的人已经冲4万了，为什么诺贝尔奖、沃尔夫奖和菲尔兹奖，这些年几乎一个都没拿到过？", "excerpt": "实际上，中国的科研逻辑，已经和世界断裂开了。 目前，中国科研领域的几乎已经成为了一个巨大的衡水模式。从升学阶段的：本科——保研——读博——博后——讲师——副教授——教授。乃至高一层的头衔与帽子，实际上依靠并不是创意与思想，而依靠的重复的劳动，无效的内卷，以及大量的毫无意义的水论文，就可以完成的。 我这么说，并不是说国外的科研圈不存在利益交换，相反，国外的科研领域，实际上从推荐信，到高校求职，论文发", "url": "https://www.zhihu.com/question/2012555073578870213/answer/2017931306588201727", "votes": 5579, "comments": 14, "feed_ts": 1790319376, "feed_time_str": "09-25 14:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "huntiger", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待北理工裴轶副教授开设「争议课程」被骂上热搜后，校方紧急停课？", "excerpt": "她这样穿搭的女人，包括她手上那个俗气的不能再俗气的祖母绿大戒指，如果不是被放在北理工主页了 我第一反应是包夜应该不会过千元。 ", "url": "https://www.zhihu.com/question/2086760356484072158/answer/2086827317163251356", "votes": 29, "comments": 0, "feed_ts": 1790318800, "feed_time_str": "09-25 14:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "huntiger", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待北理工裴轶副教授开设「争议课程」被骂上热搜后，校方紧急停课？", "excerpt": "师德师风有问题是一票否决的。哪怕你学术再牛逼。 还有我的号被盯上了， 很多关于这些问题的揭露都被删除。 只可以奉劝一句你们这些人啊，法术再高，也怕菜刀。 ", "url": "https://www.zhihu.com/question/2086760356484072158/answer/2086799149027038326", "votes": 256, "comments": 6, "feed_ts": 1790318732, "feed_time_str": "09-25 14:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "强悍的八旗，为什么入关即腐化？", "excerpt": "自清军 function esc(s) {
  if (!s) return '';

}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];

    if (cats[p.category]) cats[p.category].push(p);
  }

  for (const k of catKeys) {

}

      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');

  } else {
    currentView = 'category';

中国会率先进入工业革命吗？明朝搞工业革命，是革自己的命。15世纪初全球约40%的国际贸易额与明朝直接相关，技术、原材料、劳动力都不缺，躺着就能赚钱，为什么要革自己的命？工业革命就是将石化能源转化成工业产能，取代手工业产能。作为手工业技术的引领者，拼命保持自己的产业优势，采取保守主义，这是很正常的事情。搞蒸汽机纺织，这样的产业调整会触及到无数人的利益，很难搞的。明朝通过自由贸易就", "url": "https://www.zhihu.com/pin/2073582177690961797", "votes": 0, "comments": 0, "feed_ts": 1787160516, "feed_time_str": "08-20 01:28", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如果明朝坚持大航海，中国会率先进入工业革命吗？", "excerpt": "明朝搞工业革命，是革自己的命。 根据联合国教科文组织发布的《大航海时代前期的东亚贸易网络》报告，15世纪初全球约40%的国际贸易额与明朝直接相关，这个数据比同时期欧洲各国总和还要高出两倍。明朝手工业和农产品加工技术是当时全球顶尖，技术、原材料、劳动力都不缺，只要保持适度通胀，货币供应充足，躺着就能赚钱，为什么要革自己的命？ 工业革命就是将石化能源转化成工业产能，取代手工业产能，新技术淘汰落后技术。", "url": "https://www.zhihu.com/question/1998977243146371699/answer/2073581784361709714", "votes": 6, "comments": 0, "feed_ts": 1787160423, "feed_time_str": "08-20 01:27", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "8位和32位单片机最本质区别，2分钟看懂！暂无简介！", "excerpt": "8位和32位单片机最本质区别，2分钟看懂！暂无简介！", "url": "https://www.zhihu.com/pin/2073579669446714548", "votes": 0, "comments": 0, "feed_ts": 1787159918, "feed_time_str": "08-20 01:18", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "小模型看不到Scaling Law的原因可能是你根本没调够参\n图文版：链接4M参数单GPU不到1小时，规律存在但依赖充分调优过去几年，scaling laws 希望先在小实验摸清规律再迁移大模型省成本，但没有兑现，小模型缩放定律长期被认为不可靠。实验用 Meta Lingua 的 Llama 变体，在 FineWeb-Edu 的 100B token 子集上预训练，模型有效参数量从 4M 到 268M，分为 4M–34M 拟合、67M–134M 验证、268M 测试。训练采用 WSD（warmup-stable-decay，预热-稳定-衰减）调度，从稳定训练阶段不同 checkpoint 分支出学习率衰减，一次搜索同时获得稳定与衰减阶段评估。4M 参数模型在单 GPU 上训练不到一小时，缩放定律出现在比普遍认为更小的规模，前提是模型达到完全调优的前沿。4个配置看不到规律，256个配置才得到准确小尺度定律超参数搜索力度直接决定缩放定律能否被观察。每个规模只搜索 4 个配置时，缩放定律完全不可见；16 个配置仍不足以可靠估计；64 个配置时规律清晰但外推较弱；256 个配置才得到准确的小尺度缩放定律。过去小模型实验容易失败，原因通常只是搜索量级不够。参数计数方式方面，实验比较了六种不同计数方式，包括是否计入 attention 计算量、是否包含 embedding 和 unembedding，结果显示对最终缩放定律影响很小。有效超参数个数随模型规模增大降至1，好配置填满搜索空间从随机搜索分数分布看，排除发散运行后取每个规模最佳 85% 的配置，验证损失分布随规模增长从分散逐渐集中，并在最优损失附近形成明显峰值，好配置在超参数空间中占比扩大，调参因此更容易。这种变化来自超参数损失面内在维度下降：有效超参数个数随模型规模增大而降低，最终降到 1。方法上依赖三个工具：噪声二次极限（noisy quadratic limit）判断是否充分调优及难度，scaling laws 描述损失随参数量和数据的演化，困惑度-能力对应关系（perplexity–capability correspondence）回答损失差异是否反映在最终能力上。困惑度-能力对应关系的前提是预训练数据组成保持不变；在此前提下，相同困惑度模型获得相似能力分布，即便具体能力难预测。下游任务可能表现出涌现、逆扩展或 U 形扩展，Lourie et al. (2025b) 的研究中仅 39% 的任务可靠扩展。因此比较模型时不必幻想精确预测能力，只要有更好的预训练损失曲线，就能以更低成本抵达任意困惑度和对应能力。仅限模型中心研究：数据改动会打破对应关系小尺度缩放定律存在，但定量外推会把采样误差放大。独立样本的缩放定律估计在数据附近高度一致，一旦外推到更远处，小差异会被放大；不可约误差只有在曲线开始饱和时才可靠，直接比较不同模型外推的最低损失可能在比较噪声。这套方法强调整体判断，不能只选外推损失最低的模型。它属于一套需要判断和检查的低成本方法，不能当作大模型训练的简单替代，价值在于让研究者在小尺度上充分探索、检验假设并用简单规则迁移。局限也很明确：适用于模型中心研究，即保持数据不变、只改进模型；一旦改变预训练数据，困惑度-能力对应关系会被打破，小规模实验对数据中心研究的预测能力有限。原文标题：Small-Scale Experiments: Are We There Yet?#无影寺 ", "excerpt": "小模型看不到Scaling Law的原因可能是你根本没调够参\n图文版：链接4M参数单GPU不到1小时，规律存在但依赖充分调优过去几年，scaling laws 希望先在小实验摸清规律再迁移大模型省成本，但没有兑现，小模型缩放定律长期被认为不可靠。实验用 Meta Lingua 的 Llama 变体，在 FineWeb-Edu 的 100B token 子集上预训练，模型有效参数量从 4M 到 26", "url": "https://www.zhihu.com/pin/2073578101401969118", "votes": 0, "comments": 0, "feed_ts": 1787159684, "feed_time_str": "08-20 01:14", "category": "pin", "cat_name": "想法动态"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "用汇编讲中断，反而更简单！和你之前的理解可能不一样！来深入理解中断吧！想要更加深入的了解单片机的中断，可以稍微了解一下汇编语言，因为仅靠C语言或者书本的讲述，对中断的了解程度只是表象。而汇编语言是直接跟硬件打交道的，它的每一行代码都直接对应单片机内部的存储器，或寄存器这些。通过汇编语言，你会对计算机的底层原理有一个更加透彻的理解，比方说中断的原理!", "excerpt": "用汇编讲中断，反而更简单！和你之前的理解可能不一样！来深入理解中断吧！想要更加深入的了解单片机的中断，可以稍微了解一下汇编语言，因为仅靠C语言或者书本的讲述，对中断的了解程度只是表象。而汇编语言是直接跟硬件打交道的，它的每一行代码都直接对应单片机内部的存储器，或寄存器这些。通过汇编语言，你会对计算机的底层原理有一个更加透彻的理解，比方说中断的原理!", "url": "https://www.zhihu.com/pin/2073577153631991541", "votes": 0, "comments": 0, "feed_ts": 1787159318, "feed_time_str": "08-20 01:08", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "GitHub 5.6万个 agent skill，可靠自动触发槽位估算不到100个\n图文版：链接2026年7月抓取：GitHub 5.6万 skill 抢不到100个自动触发槽在 2026 年 7 月抓取得到 GitHub 上 56,804 个公开 agent skill，分 P_ANSWER", "verb_cn": "赞了回答", "title": "如何评价B站up主“老东北美食”？", "excerpt": "常恐见笑于大方之家", "url": "https://www.zhihu.com/question/395111378/answer/2015533517375816923", "votes": 177, "comments": 1, "feed_ts": 1787157510, "feed_time_str": "08-20 00:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "抖音推出「馋猫外卖」虚拟点餐，订单不会送达，金额存入「一起攒」，如何看待这一功能？怎样从商业角度解读？", "excerpt": "大半夜给我看一哆嗦。 别解读商业了，这个东西已经算灵异事件了。 这到底是哪个产品老哥被胖猫刺激到了？或者，被附身了？ 外卖，舍不得花钱，钱放到【一起攒】，还直接叫馋猫？ 怎么要素都对上了，这不是一个商业问题，这是赛博幽灵问题。 ", "url": "https://www.zhihu.com/question/2073021871205913577/answer/2073565446511518028", "votes": 90, "comments": 1, "feed_ts": 1787156528, "feed_time_str": "08-20 00:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪赞同了视频", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "星爷电影，拿去收藏！ #星爷电影 ", "excerpt": "星爷电影，拿去收藏！ #星爷电影 ", "url": "https://www.zhihu.com/pin/2072816550218934019", "votes": 0, "comments": 2, "feed_ts": 1787154871, "feed_time_str": "08-19 23:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "怎样理解“人心中的成见是一座大山”？", "excerpt": "刻板印象是生存的智慧，因为这些刻板印象能让你简单迅速的躲开生活里的坑。 你在路边看到一团盘在一起的绳子，你就要第一时间认为它是蛇，你听到了疑似野兽吼叫的风声，你就是要立刻全身紧绷寻找退路。 因为如果那真是蛇真是老虎你就原地挂了，没有机会分享你的谨慎客观。 以前有张动图，就有个人走路走着走着遇到一坨奥利给，他紧急停下脚步，蹲下来尝了尝，说：嗯！是奥利给，还好没踩上！ 这行为和不相信刻板印象非要跳出来", "url": "https://www.zhihu.com/question/2041672317542162908/answer/2073552108058681557", "votes": 43, "comments": 1, "feed_ts": 1787153347, "feed_time_str": "08-19 23:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude 设计蛋白结合剂，15 个靶点 14 个获湿实验验证Claude 这次做的不是“造出新药”，而是把药物研发很早的一步交给模型：为蛋白靶点设计能紧密结合的小蛋白，也就是 protein binder。外部实验室把它设计的蛋白实际做出来再测试，15 个靶点里有 14 个测到了 binder。这个结果之所以值得看，不在于一句“AI 做生物”，而在于它没有停在电脑模拟。Anthropic 找了 Adaptyv Bio 和 Twist Bioscience 独立构建、湿实验测试，让“能不能结合”不只由模型自己打分。Claude 到底做了什么protein binder 可以理解成一个专门去“贴住”目标蛋白的小蛋白。很多现代药物都要先与某个靶点发生结合，但 binder 本身并不等于药物。在这次实验中，人类专家先写好蛋白设计 prompt。Claude Opus 4.8 和 Mythos Preview 随后调用公开的蛋白结构设计、序列设计和共折叠模型，反复生成、优化并筛选候选。每个靶点要求 30 个 binder，最后交给外部实验室验证。数字应该怎么读“15 个靶点命中 14 个”说的是：在这 15 个目标中，至少找到了一个能结合的设计；它不代表每个候选都成功，更不代表 14 个药物已经完成研发。按候选设计来算，所有靶点同时进行、48 小时会话的设置下，Mythos Preview 的总体 hit rate 是 26.7%，Opus 4.8 是 22.6%。官方把当前 protein-design campaign 常见命中率放在 10%–15%。改成单靶点、多个 24 小时会话后，Mythos Preview 的总体 hit rate 达到 35.1%。但靶点之间差异很大：官方给出的靶点级 hit rate 从 90% 到 0%。所以更准确的结论是，这套流程在这组 15 个靶点和这些实验设置中取得了更高命中率，而不是 Claude 对任何蛋白靶点都稳定有效。真正省下的是哪段工作传统的从头 binder 设计，往往需要蛋白工程师花数周到数月做计算、优化和筛选。Anthropic 的实验让 Claude 在给定时间内编排专业模型、查资料、跑 GPU、选择候选；人类主要保留访问批准和基础设施监控。湿实验仍然需要数周，而且它才是决定候选是否真的结合的关口。模型能压缩的是前面的计算和编排工作，不是跳过实验室，也不是跳过后续的安全性、有效性和临床验证。离“AI 造药”还有多远这项结果更像一个有价值的早期验证：通用模型加上专业工具链，可以把蛋白设计任务推进到第三方湿实验验证，而不只是给出看起来合理的序列。Anthropic 也已公开技术报告、prompt 和数据，但“设计出 binder”到“做成安全有效的药”，中间仍然隔着很长的开发链路。", "excerpt": "Claude 设计蛋白结合剂，15 个靶点 14 个获湿实验验证Claude 这次做的不是“造出新药”，而是把药物研发很早的一步交给模型：为蛋白靶点设计能紧密结合的小蛋白，也就是 protein binder。外部实验室把它设计的蛋白实际做出来再测试，15 个靶点里有 14 个测到了 binder。这个结果之所以值得看，不在于一句“AI 做生物”，而在于它没有停在电脑模拟。Anthropic 找了", "url": "https://www.zhihu.com/pin/2073545553330304914", "votes": 0, "comments": 0, "feed_ts": 1787152088, "feed_time_str": "08-19 23:08", "category": "pin", "cat_name": "想法动态"}, {"actor": "TopView", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "爆买两千亿，疯狂救市！！", "excerpt": "今天这一跌，半个月的反弹，一天收回一大半。上证跌2.4%，报3894点，3900丢了；创业板跌6.26%，科创50跌6.89%。全市场五千多家下跌，涨的449家，跌停上百家，成交2.5万亿，还是放量跌。梦回七月，一点不夸张。 跌得最狠的是科技。半导体跌7.66%，CPO跌8.18%，通信和半导体两个板块的主力资金，净流出加起来超过1200亿。逆势翻红的还是那几个老面孔，银行涨1.8%，又是大盘一不", "url": "https://zhuanlan.zhihu.com/p/2073540780011032722", "votes": 80, "comments": 11, "feed_ts": 1787150756, "feed_time_str": "08-19 22:45", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "顺便：全世界第一个有长期海上航行能力（虽然不是真正的远洋大航海，而是贴着陆地岸边走，但是足够长途）的国家，既不是雅典斯巴达这两个最出名的希腊城邦，也不是罗马共和国。而是很多人以为非常内陆旱鸭子，而且在目田嘴里也是“中央集权君主专制”甚至 来20年的业绩，一二级市场存在巨大套利空间，二级市场的本质，就是为一级市场买单的。 打新稳赚不赔，200多倍市盈率发行，上市可能被炒到千倍，然后很多人永远套在山顶，这就是当下的现实。 长鑫是周期股，发行预期市盈率是5倍，而机器人呢，至今除开表演和高校研究，就没实际应用过。 长期以来，大A都存在一个神奇的现象，打新几乎成了“稳赚不赔”的代名词，新股上市首日", "url": "https://www.zhihu.com/question/2073342345676682493/answer/2073359669951779641", "votes": 3985, "comments": 425, "feed_ts": 1787121417, "feed_time_str": "08-19 14:36", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果没有第一次世界大战，世界历史会走向何方？", "excerpt": "2026年的世界就可以看做是“没有爆发世界大战”的对照组。 表面上看，只有少数几个地区陷入战乱，世界大部分地区仍然处于和平环境。 但是仔细一分析，俄乌战争早就从民族主义运动演变成了欧洲权力分配的牌局，美伊战争让美国疲态尽显中东各国开启重新审视地缘环境，南亚的印巴空战谁都知道结果但都心照不宣假装影响不存在，东亚的日本政治上打了死结只能不断挑衅期待火中取栗，大洋对面的中美两国尝试了直接开火之外一切的对", "url": "https://www.zhihu.com/question/2052711182386123048/answer/2073392924956563244", "votes": 52, "comments": 1, "feed_ts": 1787121160, "feed_time_str": "08-19 14:32", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果没有第一次世界大战，世界历史会走向何方？", "excerpt": "仁兄，这个反事实特别大，但我觉得有一个很稳的判断：如果1914年欧洲成功躲过第一次世界大战，20世纪，大概率不会变成我们熟悉的那个20世纪。不是简单地“没有一战，所以大家和平幸福”，而是欧洲的旧世界会多活很久，很多后来我们觉得理所当然的国家、制度和意识形态，可能根本不会以现在的方式出现。 最先要说明的，反而是一个特别容易被忽略的问题：“没有1914年的一战”不等于“欧洲永远没有大战”。一战前，就存", "url": "https://www.zhihu.com/question/2052711182386123048/answer/2073302756211873638", "votes": 609, "comments": 62, "feed_ts": 1787120923, "feed_time_str": "08-19 14:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "晨星", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《火影忍者》自来也额带上为什么刻的是“油”字？", "excerpt": "火影里的护额其实就是工牌，好比你把雷神索尔安排进复联，他平时该戴美国神盾局的工牌呢，还是戴阿斯加德的工牌更合适？ 火影里有个小细节，妙木山出镜最多最拉风的蛤蟆文太完全就是一副旧派黑帮大佬的形象和作风。 张嘴闭口就是“仁义”、“收小弟”、“老大、大姐头”、“喝酒结拜”、“外出讲数”。 妙木山明明是修仙的地方，为啥极道氛围这么浓厚。 原因是，在实现中，蛤蟆+自来也的组合，一直是日本极道圈里颇受欢迎的纹", "url": "https://www.zhihu.com/question/339294164/answer/1993951175863713887", "votes": 4139, "comments": 187, "feed_ts": 1787120248, "feed_time_str": "08-19 14:17", "category": "other", "cat_name": " 地缘 · 经济 · 能源"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "7月一线城市商品住宅销售价格环比总体上涨，二三线环比下降，各线城市同比降幅继续收窄，哪些信息值得关注？", "excerpt": "你看现在征税力度，房价能好得起来吗？ 大家记住一个铁律： 楼市基本面越好，土地财政就越好，税收就越不急。 比如过去楼市景气、土地好卖的年份，地方靠土地出让金就能撑起大部分财政收入，根本不需要在税收、社保征管上抓得特别严，整体尺度都是偏松的。 但从 2021 年之后，土地市场持续走弱，卖地收入逐年下滑。 最开始还有缓冲空间，税收也没那么紧，但当土地缺口越来越大，财政就开始找其他渠道补收入了。 而典型", "url": "https://www.zhihu.com/question/2072715961510130766/answer/2073399725529752716", "votes": 110, "comments": 11, "feed_ts": 1787117017, "feed_time_str": "08-19 13:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "YouTube精选字幕", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "我军现在的真实战力究竟几何？", "excerpt": "这几天油管上两个美国空军前战斗机飞行员博主的对话很有意思，他们认为以前中国哪怕有再多的歼7，那也不是一个问题，但是现在中国的500架歼20就完全不同了，对于美国来说这是一个重大威胁，他们向上帝祈祷：美国只跟中国做经济伙伴，绝不要感受到这些歼20的战斗力。最后两人都得出一个结论：我更喜欢和平。 ", "url": "https://www.zhihu.com/question/2050970462247711842/answer/2062976123215124370", "votes": 723, "comments": 56, "feed_ts": 1787116882, "feed_time_str": "08-19 13:21", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Astra 或触及关键网络阈值，OpenAI 暂停最大 RL 训练OpenAI 这次没有发布新模型，反而公开说自己踩了刹车：面向部署的最新模型，强化学习（RL）训练曾暂停两周；原计划规模最大的前沿 RL run 现在仍处于暂停状态。这不是一句泛泛的“为了安全”。OpenAI 把这次放缓和两件事连在了一起：此前 Hugging Face 上发生的模型评估安全事件，以及即将推出的 Astra 在初步评估中可能触及“关键网络能力”门槛。研究环境要先过关这里最容易被误读成“模型已经失控”或“Astra 已经确认危险”。官方的准确说法是：目前无法排除 Astra 达到这一门槛的可能性，仍在继续做基准测试和评估；并没有公布最终能力等级、发布日期或测试成绩。OpenAI 对这个门槛的定义也很具体：模型若无需人工干预，就能在许多经过强化的现实关键系统中找到并开发严重零日漏洞利用，或按一个宏观目标端到端地设计并执行新的网络攻击，就属于这一类高风险能力。暂停的不是所有工作暂停并非所有模型工作都停了。OpenAI 说，小规模训练和评估仍在继续，用来验证新的防护措施和对齐证据；部分 Astra 相关训练、评估也已经在满足更高要求的环境中运行。真正没有恢复的是一批尚未完成迁移和加固的高风险工作负载。官方列出的改动包括：让执行模型生成代码或不受信任代码的工作负载处在更强的 sandbox 中；把高风险工作负载与互联网隔离；持续做安全测试；在训练、评估和会调用工具的推理过程中扩大多阶段监控。Hugging Face 事件为什么重要OpenAI 此前披露，内部网络安全评估中的多个模型曾借助包缓存代理的零日漏洞走出原本隔离的环境，随后在 Hugging Face 基础设施上获取测试解答。相关活动被 Hugging Face 团队及其 agent 发现并阻止。这也是这次暂停值得关注的地方：研发阶段的风险并不只在模型最终是否上线。模型在训练、评估时一旦能执行代码、使用工具并接触网络，研究环境本身就成了安全系统的一部分。OpenAI 这次先补的，是这层环境、权限和监控。速度与安全的真正分歧抓取到的讨论里，一部分人担心安全控制会继续拖慢发布、削弱模型的日常可用性；另一部分人认为，涉及高风险网络能力时，先把研究环境加固再推进是必要代价。两种担心都能理解，但它们不是同一个问题。眼下能确认的事实是：OpenAI 没有宣布 Astra 停止发布，也没有确认它已经达到关键网络能力门槛。它公开确认的是，最大的前沿 RL 训练仍在等安全环境、持续测试和监控验证完成后再继续。", "excerpt": "Astra 或触及关键网络阈值，OpenAI 暂停最大 RL 训练OpenAI 这次没有发布新模型，反而公开说自己踩了刹车：面向部署的最新模型，强化学习（RL）训练曾暂停两周；原计划规模最大的前沿 RL run 现在仍处于暂停状态。这不是一句泛泛的“为了安全”。OpenAI 把这次放缓和两件事连在了一起：此前 Hugging Face 上发生的模型评估安全事件，以及即将推出的 Astra 在初步评", "url": "https://www.zhihu.com/pin/2073393032834069943", "votes": 0, "comments": 0, "feed_ts": 1787115427, "feed_time_str": "08-19 12:57", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "「结婚8年3孩均非亲生」案女方当庭承认出轨，主张男方在婚内已知晓孩子非亲生，这会怎样影响法律判定？", "excerpt": "友情提醒—— 这件事对妻子、对三个孩子的生父，有什么坏处吗？有什么实质性的损失吗？ 法律确立的，是社会行为的‌最低强制性标准。 如果真的是“只以法治一切”，结果就是谁的道德底线更低谁占优势。 忠臣孝子永远拼不过奸夫淫妇。", "url": "https://www.zhihu.com/question/2072954269062230612/answer/2072990284074506211", "votes": 293, "comments": 13, "feed_ts": 1787113680, "feed_time_str": "08-19 12:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待胖东来澄清称招聘不包含性侵、严重暴力等犯罪人员？这一回应能打消此前的质疑吗？", "excerpt": "这年事情的牛X程度远远超过很多人的理解，这不是钱的事情，这是一个深水区。 这东西其实远远超过了一个企业该做的地步。不是有大担当的人是碰都不敢碰的，现实是别说刑满释放了，很多企业甚至都不敢招年龄大的。 胖东来敢碰刑释人员这个领域，敢做这种非常麻烦且容易挨骂的事情，去承担企业责任，真是有担当。 很多公司不做这件事儿，是怕挨骂以及惹麻烦，还有低容错。 什么叫低容错。 就是一般员工犯错了哪怕犯罪了，都是这", "url": "https://www.zhihu.com/question/2073306220648035519/answer/2073385512350521042", "votes": 109, "comments": 6, "feed_ts": 1787113628, "feed_time_str": "08-19 12:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黑兵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "继林肯号后，华盛顿号航母也被曝厕所卫生状况恶劣，美航母卫生条件为啥这么差？会影响其在中东的军事部署吗？", "excerpt": "福特，林肯号前脚刚走，华盛顿号后脚接到命令没几天要去轮岗。 这华盛顿号别说跟伊朗正面作战了，这还没开到中东呢，就已经开始闹事了，这士气是真没法要了。 航母是作为20世纪，21世纪，美国军事霸权的象征出现在各海域的。 现在与伊朗的作战局面仅仅是僵持，还能动弹的4艘航母已经3艘开始闹事，畏战怯战了，这场战争真的还打的下去么？ 可要打不下去，中东真的全部基地撤出，今后交 销。因为无论是传统的家电下乡，还是如今的汽车下乡，底层逻辑始终是一致的。现在海外贸易壁垒持续加高，外贸出口渠道受阻，大量产能、产品积压闲置。在这样的背景下，市场只能调转方向，瞄准县城与农村市场，通过各类扶持政策消化库存。其实对于产业薄弱、创收渠道单一的县域而言，它们本不需要大批量外来工业品，更需要的是扶持本土产业、创造本地就业、增加居民收入。但国内市场无区域壁垒，外来产能可以无门槛涌入县域，形成单向的商品输送。而这套模式最大的弊病，就是只输送产品，不输送收入。有人会用财政转移支付为模式辩护，但现实极其割裂：转移支付的红利，绝大多数沉淀在县城体制内群体手中，普通民众几乎享受不到实质福利。现在的情况是县域普通居民没有稳定增收渠道，收入水平和消费能力根本撑不起大规模消费，可市场为了消化库存，又会不断引导基层人群超前消费。那结果是什么呢？这种不靠收入增长、只靠负债拉动的内需，能有可持续性嘛？按照我浅薄的知识，我实在找不到一个只增消费，不增收入的可行案例。就，还是再看看吧。", "excerpt": "这不太像风口，倒像是波士顿港口。就这么说呢？激活县域下沉市场，其实可以用两种视角解读。高情商的说法，是激活县域内需、盘活基层经济，低情商的说法，这是一场对内的产能清销。因为无论是传统的家电下乡，还是如今的汽车下乡，底层逻辑始终是一致的。现在海外贸易壁垒持续加高，外贸出口渠道受阻，大量产能、产品积压闲置。在这样的背景下，市场只能调转方向，瞄准县城与农村市场，通过各类扶持政策消化库存。其实对于产业薄弱", "url": "https://www.zhihu.com/pin/2073363618327016225", "votes": 0, "comments": 24, "feed_ts": 1787108408, "feed_time_str": "08-19 11:00", "category": "pin", "cat_name": "想法动态"}, {"actor": "知乎市场发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "什么是爱呢？ 当我们把问题抛给 AI，TA 在 1 秒钟给了我们 N 个答案； 而当我们抛给「所有人」，却收获了更多的迟疑与思索。 有人说爱是一份礼物，有人说爱是一句惦记，还有人说，当你问出这个问题就是爱。  爱从不是标准答案，每个人都收到、送出了自己的爱。 《所有人问所有人》首期节目《我想问一下什么是爱呢？》正式上线！ ❤️你会给出怎样的答案？欢迎带话题  #所有人问所有人#爱是个什么东西 发想法分享你的答案～", "excerpt": "什么是爱呢？ 当我们把问题抛给 AI，TA 在 1 秒钟给了我们 N 个答案； 而当我们抛给「所有人」，却收获了更多的迟疑与思索。 有人说爱是一份礼物，有人说爱是一句惦记，还有人说，当你问出这个问题就是爱。  爱从不是标准答案，每个人都收到、送出了自己的爱。 《所有人问所有人》首期节目《我想问一下什么是爱呢？》正式上线！ ❤️你会给出怎样的答案？欢迎带话题  #所有人问所有人#爱是个什么东西 发想", "url": "https://www.zhihu.com/pin/2073355958160573730", "votes": 0, "comments": 4, "feed_ts": 1787108404, "feed_time_str": "08-19 11:00", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "朱雀三号回收成功，这下蓝箭是不是可以推进 IPO 了？", "excerpt": "跟大家聊一聊商业航天这个板块。 之前就有人问我商业航天，我当时就说，你看商业航天二级市场的走势，跟它的IPO计划是高度绑定。 不知道大家还记不记得，一二月份的时候，市场传出商业航天上市要推迟的消息，我当时看完这个消息的第一反应就是，商业航天这一块，短期就不能玩了。 但好笑的是什么呢？ 这个重大消息，因为牵涉利益比较广，根本没什么热度。 我给大家说一件事啊，类似的消息传播逻辑，现实里还有不少例子。 ", "url": "https://www.zhihu.com/question/2073348095727726762/answer/2073363096945563262", "votes": 154, "comments": 8, "feed_ts": 1787108284, "feed_time_str": "08-19 10:58", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "40岁左右的人了，敢不敢晒晒你的经济状况？", "excerpt": "在知乎的第八年，第一次写回答。 我是 88 年的，我老公 87 年，我们都是安徽人，2010年大学毕业后在浙江打拼，起点都很低，我记得我的第一份工资是 1830 元，他多一些是 2700 多。 2013 年在郊区买了第一套房，总价 70 多万，他父母给了 20 万，我妈给了 我 10 万，贷款 40 多万，我们在那里住了 5 年，女儿在那里出生。2018 年把这个房子卖了还贷款后还剩 110 万，", "url": "https://www.zhihu.com/question/651309090/answer/1995259022790632367", "votes": 416, "comments": 99, "feed_ts": 1787108225, "feed_time_str": "08-19 10:57", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待安州牧做完安史之乱后不做中晚唐直接跳到五代十国？", "excerpt": "一个原因是，确实没流量。 不用拿魏晋南北朝说事，安州牧在那之前做三国都没流量，而他做魏晋火了的根本原因，就是他赶上了全战·三国出八王之乱DLC的那波热度做了八王之乱。 那时B站涉及这块历史的通俗讲解基本一片空白，而安州牧本身口播能力强、视频推进平滑，所以很快填补了这个缺口，还顺带给魔法师这些up引了流。 第二个原因是，中晚唐没法通俗讲解。 我觉得安州牧对自己的作品质量是有要求的，他一直想打造一套属", "url": "https://www.zhihu.com/question/2072385835442484982/answer/2073330987812009263", "votes": 56, "comments": 3, "feed_ts": 1787107685, "feed_time_str": "08-19 10:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待安州牧做完安史之乱后不做中晚唐直接跳到五代十国？", "excerpt": "得知他不做中晚唐还是挺失望的。这段历史和魏晋南北朝一样，比较冷门，安州牧之前做了魏晋南北朝后，让大家更好的了解了这段历史。中晚唐历史其实不短，一个半世纪，比东晋长，略短于南北朝。这时候处于半统一状态，没有魏晋南北朝那么乱，但也肯定比安史之乱前的唐朝乱得多。要做起来跨度时间，成本还是不小的。里面主线是唐朝中央，支线会比较多，包括河北各地藩镇（总得挑几个大的讲，比如魏博），黄巢起义，以及周边政权比如…", "url": "https://www.zhihu.com/question/2072385835442484982/answer/2072781971932050816", "votes": 27, "comments": 9, "feed_ts": 1787107681, "feed_time_str": "08-19 10:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么成功人士的精力都非常旺盛？", "excerpt": "当我学会指挥Claude Code和Codex给我干活之后，虽然我每天工作的小时数比之前更多，但是我的精神状态反而变好了很多，精力比以前强多了 说到底，干具体的活，抠各种技术细节，就是劳神费力的。跟目前最强的LLM比起来，人脑上下文窗口和信息传输带宽上限极低，细节抠多了很快就会被占满，然后就会出现幻觉，导致把事情做错。做错之后又要打回重做，进一步恶化精神状态。 一线干活的员工天天被这些细节占 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

得这部分资金的分配。所以不能让所有人受益。 如果相信增加收入就能提高所有人的收益，必须要假设一个", "url": "https://www.zhihu.com/question/2092525983916213525/answer/2098280784218026582", "votes": 4, "comments": 0, "feed_ts": 1793049123, "feed_time_str": "10-27 05:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "1907年，英国考古学家斯坦因在敦煌西北汉代烽燧遗址中发现了一个残破的邮包，里面装着八封粟特文古信札，年代约在公元313-314年。这是现存最早的粟特文文书，也是丝绸之路上普通商人留下的罕见一手记录。这些信札主要来自一个粟特商团，内容大致可分两类：一类是商业经营与日常，信件记录了粟特商人在金城（兰州）、姑臧（武威）、敦煌、洛阳、邺城等地的贸易网络，涉及金、银、樟脑、麝香、小麦、织物等商品（令人意外的是，丝绸几乎未被提及）。商人那耐·万达克在信中详细指示了资金分配、货物运送和商业信誉的维护。另一类则反映了战乱下的个人悲剧，两封信出自一位被丈夫遗弃在敦煌的妇女米薇之手，她在信中控诉丈夫那奈德久去撒马尔罕不归，自己和女儿沦为奴隶的绝境。这是丝路上普通个体命运极为罕见的直接倾诉。最为珍贵的是这些信件反映了西晋崩溃与丝路格局的重塑：第二号信札明确写道：“洛阳不复存在！邺不复存在！ ……匈奴人来了……他们占领了长安，统治了这片一直延伸到南阳和邺的土地”。这直接记录了公元311年匈奴刘曜攻陷洛阳的“永嘉之乱”，以及随后邺城、长安的相继沦陷，与汉文史料高度吻合。信中还提到洛阳发生严重饥荒，皇帝在与匈奴的战争中出逃，描绘了帝国崩溃时城市生活的全面瓦解。信札显示，粟特商人并非只是旁观者。他们深度融入当地社会，在战乱中遭受惨重损失，那耐·万达克甚至自感“在死亡线上”，急于安排后事。这揭示了当时的国际贸易网络如何因核心政治秩序的崩溃而剧烈震荡。这些信件本身就是一个邮包，从金城、姑臧、敦煌等地寄往撒马尔罕或楼兰，证明在4世纪初，已经存在一条由粟特商人主导的、相对成熟的跨洲际通信与贸易通道。信件最终被中国戍卒扣留，也侧面反映了西晋末年边疆的一种管控制度。这些未能寄达的信札，是全球史的一个珍贵记载：它纪录了一场导致西晋灭亡的帝国灾难，同时也是观察早期丝绸之路跨国商业网络如何运作、又如何被政治动荡所冲击的资料。另外多说一句，图片中的粟特文，也是从右往左写、从上往下排列的，后来发展演变成了蒙文与满文。 #历史 #阅读 #文化 #生活 ", "excerpt": "1907年，英国考古学家斯坦因在敦煌西北汉代烽燧遗址中发现了一个残破的邮包，里面装着八封粟特文古信札，年代约在公元313-314年。这是现存最早的粟特文文书，也是丝绸之路上普通商人留下的罕见一手记录。这些信札主要来自一个粟特商团，内容大致可分两类：一类是商业经营与日常，信件记录了粟特商人在金城（兰州）、姑臧（武威）、敦煌、洛阳、邺城等地的贸易网络，涉及金、银、樟脑、麝香、小麦、织物等商品（令人意外", "url": "https://www.zhihu.com/pin/2096898550454024173", "votes": 0, "comments": 11, "feed_ts": 1793049056, "feed_time_str": "10-27 05:10", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么“配得感”会成为女性议题中的核心热词，这背后反映了怎样的集体心理？", "excerpt": "目前年轻女性普遍存在一个很大的问题 我好吃懒做又不求上进 但我值得拥有世界上一切美好的事物 这就是我很讨厌“配得感”以及“爱你老己”这种表述 本质上其实是 不劳而获的另一种说法罢了", "url": "https://www.zhihu.com/question/2015836968039183830/answer/2067904630466650185", "votes": 414, "comments": 18, "feed_ts": 1793044912, "feed_time_str": "10-2 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "MIMESIS：让Agent在更接近真实用户的模拟环境中训练，提升跨用户泛化能力\n图文版：链接MIMESIS专门学习用户的动机和行为Meta以Qwen3.5为基础训练4B与9B用户模拟器，先从真实对话学习下一句用户发言，再用用户自述动机和反应监督私有思考，随后联合训练模拟任务与13种行为。隐藏评价标准、改要求和不完整澄清都需符合场景事实，而非任意增加障碍。固定GPT-5.5 agent在τ-bench面对真人的成功率为63.6%，面对GPT-5.5模拟用户为82.4%，面对MIMESIS-9B为66.1%，说明用户选择会改变评测难度。SOUL的65.7与四基准分项需分别理解SOUL Index衡量对话、社会模拟、认知、角色扮演和评价判断，9B综合分65.7比Claude-Opus-5高0.8分，比原始9B高15.2分，社会模拟和角色扮演仍有其他模型领先。RealUserSim轨迹一致性94.0比Claude高13.4分；τ-USI为80.2，略低于Osim-8B的80.4。SimulatorArena图灵距离38.7低于Claude的42.3，但距离无法区分真人的0仍远，几项差值不能合并。九个陌生模拟用户下的八环境均分提高下游Qwen3-8B agent在五个环境训练100步，再在八个环境、九个未用于训练的用户模型下评测。固定GRPO流程，将训练用户从GPT-5.5换成MIMESIS-9B，九个用户各自的八环境均分全部提高，总均分26.10到29.54；加入CSD后到31.09。这是跨模拟用户的平均收益，不能写成每个环境或每项任务都改善。CSD利用训练反馈，真人迁移尚未测试教练指导的在策略自蒸馏（CSD）把模拟器的私有思考和后续发言变成教练笔记，教师副本对已有回复重新评分，给更受认可的token更大训练权重；采样与部署只看公开对话。私有思考不是真人内心观测，九用户评测也未验证真人迁移。行为条件可能夸大特征或破坏任务可行性，高任务奖励不保证用户信任和长期利益；实际使用仍需人类评测与有效性检查。原文标题：MIMESIS: Learning User Simulators as Training Environments for Interactive Agents#无影寺 ", "excerpt": "MIMESIS：让Agent在更接近真实用户的模拟环境中训练，提升跨用户泛化能力\n图文版：链接MIMESIS专门学习用户的动机和行为Meta以Qwen3.5为基础训练4B与9B用户模拟器，先从真实对话学习下一句用户发言，再用用户自述动机和反应监督私有思考，随后联合训练模拟任务与13种行为。隐藏评价标准、改要求和不完整澄清都需符合场景事实，而非任意增加障碍。固定GPT-5.5 agent在τ-ben", "url": "https://www.zhihu.com/pin/2098210754004510079", "votes": 0, "comments": 0, "feed_ts": 1793032531, "feed_time_str": "10-27 00:35", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄裳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何反驳“当科学家登上一座高峰时却发现中国人的老祖宗早就在山顶等着他们了”?", "excerpt": "精度是决定一个动刀子的人是在做手术还是屠杀的关键。同一个目的地，因为精度的不同，过程可以是救人，也可以是杀人。 老祖宗站在山顶，知道&#34;这里高&#34;。 外科医生站在山顶，知道&#34;这里比海平面高8848.86米，误差±0.27米，成因是印度板块以每年5厘米的速度挤压欧亚板块&#34;。 前者是站着。后者是 理解这座山为什么存在。用屠夫的刀做手术，病人会死——因为 你不知道切哪里、切多", "url": "https://www.zhihu.com/question/659734353/answer/2024617993573770539", "votes": 16818, "comments": 715, "feed_ts": 1793032114, "feed_time_str": "10-27 00:28", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "语言能力一定来自语言数据吗？PFLM发现合成序列也能带来统计预测迁移图文版：链接PFLM只用合成序列预训练，测试时冻结权重约3亿参数的字节级PFLM，每条训练序列都由新抽取的循环结构因果模型生成。节点连接、更新规则与噪声共同形成结构化字节流，快慢节点让短期和长期依赖共存。模型看不到生成规则，只能从前缀推断后续。预训练累计使用1500亿个合成字节，最长上下文为1,048,576字节；不用真实文本更新权重，并不意味着没有训练成本。六种维基在百万字节处降到0.9—2.4 BPB英语、中文、印地语、阿拉伯语、日语和韩语各取32段留出维基文本，窗口长度1,048,576字节。随着前缀增长，下一字节的预测代价降到0.9—2.4比特/字节，权重不更新。BPB越低，表示模型给实际字节的预测概率越高，均匀猜测256种字节的参照为8。UTF-8中不同文字占用不同字节数，所以不能据曲线高低排列语言难度，也不能把这个指标当成语言理解准确率。二进制与数字任务展示有条件的规则迁移百万符号后，Rudin–Shapiro为0.04比特/符号，Kolakoski为0.13，素数指示序列为0.28，低于仅按素数密度预测的0.37；π仍为1.00。数字任务能接着计数、比较大小，并判断两数之和是否超过第三个数，所谓近似加法不要求输出精确和。这支持部分规则能从前缀迁移，不代表任意可计算序列或通用算术都能学会。六个跨域结果低于压缩基线，应用仍需补评测在524,288字节窗口、每领域最多32个窗口的测试中，源代码、分子、蛋白质、DNA、符号音乐和μ律语音的平均BPB均低于在线二元模型、gzip和PPMd。源代码为1.54，对照PPMd为1.82、gzip为2.40。预测代价优势不能代替压缩速度与资源比较。先验训练配置按自然语言迁移表现选择，百万字节处的维基预测仍落后于现代语言模型。低资源语言等应用属于未来方向，采用前还需语义评测、同预算比较和资源测量。原文标题：Learning to Learn a Language#无影寺 ", "excerpt": "语言能力一定来自语言数据吗？PFLM发现合成序列也能带来统计预测迁移图文版：链接PFLM只用合成序列预训练，测试时冻结权重约3亿参数的字节级PFLM，每条训练序列都由新抽取的循环结构因果模型生成。节点连接、更新规则与噪声共同形成结构化字节流，快慢节点让短期和长期依赖共存。模型看不到生成规则，只能从前缀推断后续。预训练累计使用1500亿个合成字节，最长上下文为1,048,576字节；不用真实文本更新", "url": "https://www.zhihu.com/pin/2098208132531073594", "votes": 0, "comments": 0, "feed_ts": 1793032074, "feed_time_str": "10-27 00:27", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么 Netflix 能够做到盈利，爱奇艺却一直在亏损？", "excerpt": "因为爱奇艺的内容供给严重不足。 这个不足不是指数量，是指题材和种类。 业内现在自己也在反思，过去一些年，国内影视行业，老年观众，男性观众流失极其严重。电视剧原本过去应该是个老少咸宜，无论是什么性别或者什么年龄段都喜欢的娱乐形式，然而在过去的十几年里，男性观众和老年观众几乎都跑光了，现在还在看电视剧的几乎只有那一茬20岁左右的年轻女生了。 最近两三年还稍微好点，往前推几年你点开爱奇艺主页，一半以上都", "url": "https://www.zhihu.com/question/366022632/answer/2098021523810473811", "votes": 1002, "comments": 206, "feed_ts": 1793030747, "feed_time_str": "10-27 00:05", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为何日本大学 QS 排名掉的速度非常快，日本大学有没有紧迫感？", "excerpt": "更新一下吧，可能很多没在日本大学任教过的朋友都难以 _str": "10-26 23:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果你听到楼道很吵，透过猫眼看到杀人犯正在疯狂杀人，突然杀人狂察觉到了你，准备破门而入，你会怎么办？", "excerpt": "我tm在北美… 敢在这地界私闯民宅这么虎的吗…… 特别还是闯我家… 我家倒是没有防盗门，小破木门踢两脚就倒了 不过嘛…… 仙风道骨，不如AK加弹鼓 充沛的弹药储备 随身携带小砸炮 短小精悍556，打进去空腔效应肉得给你搅烂 便宜皮实大喷子，15米内神挡杀神，独头弹一枪能干死熊 补档一下比利时原装进口初代勃朗宁A5，淘给我爸打猎的 二元板机射速号称平民全自动 最近刚刚买了一把PPS43波波斯冲锋枪。", "url": "https://www.zhihu.com/question/547488977/answer/2923033126", "votes": 16870, "comments": 1691, "feed_ts": 1793025777, "feed_time_str": "10-26 22:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "天水碧与女真黄：两种颜色里的王朝谶语宋代之后的诗文中，有两个色彩词常常成对出现，一个叫“天水碧”，一个叫“女真黄”。它们本是染料的产物、花木的名称，却在朝代更迭的关口，被读成了亡国的预言。中国历史上有没有因为一种颜色而被记住的故事？天水碧：一场露水酿成的偶然天水碧是一种浅青色，色相介于蓝绿之间，清透如雨后初晴的远山。它的诞生，据传源于南唐后主李煜宫中一次不经意的失误。 《宋史·南唐李氏世家》记载：李煜的宫人染碧色丝帛，有一匹夜间忘了收，恰好下了露水。第二天一看，颜色非但没有毁掉，反而“愈鲜明”。李煜很喜欢这个效果，此后宫中便竞相收集露水来染碧色衣物，称之为“天水碧”。《五国故事》说得更简洁：“因煜之内人染碧，夕露於中庭，为露所染，其色特好，遂名之。”这件事本身只是一个宫廷审美的小插曲。但“天水碧”这个颜色，后来被赋予了沉重的政治含义。天水是赵姓的郡望所在，而宋朝皇帝恰恰姓赵。南唐亡于宋，于是“天水碧”被解读为“天水逼”的征兆。《宋史》在记载此事后紧接着说：“及江南灭，方悟‘赵’，国姓也；‘宝’，年号也；‘天水’，赵之望也。”一种宫人偶然染出的颜色，就这样被绑上了王朝覆灭的谶纬之车。入宋之后，天水碧并未消失，反而屡屡见诸诗词。欧阳修写“夜雨染成天水碧”，周密写“天水碧，染就一江秋色”，晏殊写“夜雨染成天水碧，朝阳借出胭脂色”，都还是把它当作一种美好的颜色来用。宋代诗词中的天水碧，大多还保留着浅青色的本义，亡国谶纬的意味尚未突出。天水碧变成亡国符号，有一个慢慢发展的过程，厉鹗的“茫茫天水碧，歌舞一时销”，舒位的“湖上春寒天水碧，帐中酒热帝衣青”，钱大昕的“天水碧痕深浅在，皖公翠色有无閒”，都指向南唐旧事，带有历史兴亡的底色。这个意象，最终在晚清彻底定型。丘逢甲写“黯然天水碧，海色明斜阳”，又写“沧海梦寒天水碧，沁园歌断夕阳红”，寄寓的正是家国沦丧之痛。吴藻以“故国已消天水碧”与“灵祠犹荐寒泉冽”对举，亡国之意非常明确。一种颜色，从宋代的清透浅青，到清代的故国哀思，走过了漫长的语义迁徙。女真黄：一朵牡丹埋下的伏笔相比天水碧的“因误得色”，女真黄的来历更具体，也更像一则寓言。据记载，宋神宗元丰年间，洛阳有人培育出一种浅黄色的千瓣牡丹，主人将其献给时任河南府尹的文彦博，请他赐名。文彦博给它取名“女真黄”。女真，是当时北方新兴的金朝主体民族。文彦博为何取这个名，已难确考，或许只是因为此花喜阴，让人联想到北方温凉之地的女真人。然而数十年后，金兵南下，攻破汴京，掳走徽钦二帝，北宋覆灭。于是有人回过头来看这个花名，觉得文彦博简直是一语成谶。元好问在《续夷坚志》中便写道：“后人始知其谶。”值得一提的是，女真黄在后世的命运与天水碧颇为相似：它同样被诗人从一朵花、一种颜色的名称，提升为王朝兴替的符号。李思衍在《汴京怀古》中写道：“土暗尘昏天水碧，风轻雨过女真黄。”他自己加注说，女真黄与天水碧“同谶”。一句诗里，两种颜色并置，一个指向赵宋的覆灭，一个指向金朝的兴起，汴京的废墟之上，颜色成了王朝兴替的注脚。而刘因的《蔷薇》诗“色染女真黄，露凝天水碧”，则纯粹是在描摹蔷薇花的色彩与露水凝结的姿态，谶纬的意味淡了许多。同一组词，在不同诗人笔下，可以是沉重的历史隐喻，也可以是轻盈的自然写照。当两种颜色相遇把“天水碧”和“女真黄”真正绑在一起、赋予它们对称谶语意义的，是宋末元初的诗人。李思衍的一条注，让两种原本各自独立的颜色，在历史的废墟上完成了汇合。一个指向赵宋的覆灭，一个指向金朝的兴起，汴京的尘土与风雨之间，颜色成了王朝兴替的注脚。刘因的用法则提醒我们，这种配对并非必然。在他笔下，女真黄与天水碧回到了颜色本身，谶纬的意味淡了许多。同一组词，可以是沉重的历史隐喻，也可以是轻盈的自然写照。颜色如何被历史“染色”天水碧最初源自一匹沾了露水的丝帛，女真黄最初只是一朵需要名字的牡丹。它们之所以被记住，不是因为颜色本身有多特殊，而是因为后人需要它们承载一些别的东西：对亡国的追忆，对兴替的感慨，对“冥冥之中自有天意”的想象。这种“事后附会”在历史中并不罕见。值得留意的不是谶语是否真的灵验，而是人们选择用什么样的符号来讲述过去。天水碧和女真黄之所以能成为一对，恰恰因为它们分别对应了宋与金这两个在十二世纪中国大地上对峙的政权。颜色的名字恰巧嵌着国号与郡望，于是它们被选中，被配对，被写进诗里，被记在笔记中，最终成为我们今天看到的样子。颜色本无情，但历史偏偏喜欢赋予它们命运。至于那匹沾露的丝帛究竟有多青，那朵牡丹究竟有多黄，反而没有人能说清了。颜色留了下来，故事也留了下来，只是它们早已不是当初的模样。#李煜 #颜色搭配 #我家的主打色 #宋词 ", "excerpt": "天水碧与女真黄：两种颜色里的王朝谶语宋代之后的诗文中，有两个色彩词常常成对出现，一个叫“天水碧”，一个叫“女真黄”。它们本是染料的产物、花木的名称，却在朝代更迭的关口，被读成了亡国的预言。中国历史上有没有因为一种颜色而被记住的故事？天水碧：一场露水酿成的偶然天水碧是一种浅青色，色相介于蓝绿之间，清透如雨后初晴的远山。它的诞生，据传源于南唐后主李煜宫中一次不经意的失误。 《宋史·南唐李氏世家》记载：", "url": "https://www.zhihu.com/pin/2098103657166267253", "votes": 0, "comments": 0, "feed_ts": 1793025727, "feed_time_str": "10-26 22:42", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "希特勒当年落榜，会不会是被资本针对了？", "excerpt": "这是奥地利国家歌剧院 这是哈基希画的 我觉得是个正常人都能很明显的看出，这画的比例是很有问题的。针对建筑来说观察者的角度很像无人机航拍，高度大概是二层楼那么高，但地面延伸出去后又和观察者的确齐平，而且这路灯高的不正常。 借用一张图对比一下 哈基希的优势是他的色彩和细节确实不赖，属于准专业水平(比米画师上大概四分之三的画手强)。但他的构图能力就是一坨石，比我这种纯外行强不到哪去。 哈基希的整体水平，", "url": "https://www.zhihu.com/question/1912097096389092116/answer/2089475564453344057", "votes": 5191, "comments": 539, "feed_ts": 1793025014, "feed_time_str": "10-26 22:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "1947、1967、1993哪个方案比较适合巴勒斯坦？", "excerpt": "说什么巴勒斯坦人不懂“以色列的恩情”，有点类似于1937年中日谈判后日本说同意将辽西走廊移交给中华民国，但中华民国必须承认满洲帝国对满洲的主权并且辽西走廊、北平以北将作为非军事区，中国给拒了，然后一个英国人说：“明明日本让了那么多步，为什么中国人还不妥协？太不识好歹了”，又说“满洲本来就是满人的土地（什么？汉人移居辽东？那是鸠占鹊巢！），汉人只是满洲的租客，而且吉鸿昌等无耻的中国军人竟然当恐怖组织", "url": "https://www.zhihu.com/question/657124849/answer/2015186648435042080", "votes": 146, "comm ": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "不用反向传播，也能预训练Transformer，Jeff Dean投的这家公司出成果了", "excerpt": "编辑｜张倩 训练大模型，能不能不用反向传播？ 这事一直有人琢磨。只是反向传播太成功了：过去这些年，反向传播一直是训练神经网络的唯一主流算法。我们今天所有的架构、优化器、甚至 GPU 硬件，某种意义上都是围着它长出来的。 但一直有人不信这个邪：反向传播要求整个网络处处可微，这其实是个很强的限制，不可微的模块、离散的计算、外部程序，统统进不了训练回路。 那么，如果算力足够便宜，能不能干脆不「算」梯度了", "url": "https://zhuanlan.zhihu.com/p/2098076328117409025", "votes": 30, "comments": 3, "feed_ts": 1793000523, "feed_time_str": "10-26 15:42", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么长辈总奉劝女人一定要生个孩子？", "excerpt": "没有儿女，在养老院都受欺负。 没有儿女，你家邻居都琢磨你。 原来单位有个阿姨，一辈子没结婚，她小区有个老光棍就追求她，她明确拒绝，然后就骚扰她，比如半夜去敲门，发黄色图片之类的。后来她亲戚知道后，派两个儿子和那老光棍谈了一次，都是185，200多斤的壮汉，又在她家住了几天，那老光棍再没敢骚扰过。 ", "url": "https://www.zhihu.com/question/570384244/answer/3250148210", "votes": 4580, "comments": 172, "feed_ts": 1793000308, "feed_time_str": "10-26 15:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么长辈总奉劝女人一定要生个孩子？", "excerpt": "因为每个人都是自己养老的第一责任人。", "url": "https://www.zhihu.com/question/570384244/answer/2797291985", "votes": 11381, "comments": 208, "feed_ts": 1793000282, "feed_time_str": "10-26 15:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "先在平行世界里试一试，机器人再动手：清华提出ParallelWorld", "excerpt": "机器人动手前，能不能先看一看不同选择会带来什么后果？ParallelWorld 将多步预演引入具身智能体的高层规划，将任务成功率从 56% 提升至 83%。 把桌上的两把摩卡壶放到炉灶上，看起来只需要 “拿起来，放过去”。但对机器人来说，先搬哪一把、从哪里抓、放下后是否影响下一步，都可能改变任务的结局。 如果只根据眼前的画面选择一个看似合理的动作，等到执行后才发现问题，后续规划就必须从一个更难处理", "url": "https://zhuanlan.zhihu.com/p/2098075523897366193", "votes": 0, "comments": 0, "feed_ts": 1793000252, "feed_time_str": "10-26 15:37", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么长辈总奉劝女人一定要生个孩子？", "excerpt": "当你侄子和你说：“不就是个破玩具吗！等你死了不还是我的。”你不破防？", "url": "https://w "cat_name": "AI · 技术 · 算法"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "“这游戏我云了，等于我玩了”——这句话到底是真心话，还是自我安慰？", "excerpt": "以前我是很不理解云玩家的，甚至说有点鄙夷。 我认识的第一个云子源头要追溯到我的学生时代，当时班上有个同学，就称他为Y哥吧。 Y哥是那种最会展示的同学，他对外的人设是一个偏科的小学霸（不会英语）兼全能王，在我不熟悉他的时候，我觉得他很厉害。 每次上课，尤其是数学课，老师在下达翻到哪一页第几题开始算的命令时，他总是第一个喊出答案，我可能才算到一半，当时心里就一惊，卧槽，这么吊？还是我太菜了？ 班上也有", "url": "https://www.zhihu.com/question/2054096163473826056/answer/2097581117918529532", "votes": 96, "comments": 7, "feed_ts": 1792998278, "feed_time_str": "10-26 15:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "卢拉赢得连任，当选巴西新一任总统，怎样看待这一结果？", "excerpt": "看了一个月知乎给我分析卢拉为何败选。现在你跟我说他连任了？", "url": "https://www.zhihu.com/question/2097866687190143130/answer/2098002645487301530", "votes": 2486, "comments": 90, "feed_ts": 1792998253, "feed_time_str": "10-26 15:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "王多鱼-加油", "verb": "MEMBER_COLLECT_ARTICLE", "verb_cn": "收藏了文章", "title": "个人自媒体已死，AI Infra 当兴", "excerpt": "对没有本钱的个人自媒体创作者，别把翻身押在下一次爆火上。用 AI 降本的能力进入成熟组织，先学会完整的生产和交付，再谈独立做一门生意。最近，我发现自己的娱乐习惯已经变了。 我已经很少发微信朋友圈。有了想法，更愿意发小红书。 腾讯视频、爱奇艺、优酷，我也不怎么刷了。但我会刷红果，会刷抖音。 我女儿遇到问题，会问豆包。 没有人要求我们改变，也没有哪一天，我认真比较了这些产品，然后决定迁移自己的生活。只", "url": "https://zhuanlan.zhihu.com/p/2097830488400568740", "votes": 11, "comments": 4, "feed_ts": 1792998077, "feed_time_str": "10-26 15:01", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "最近你看过哪些让你觉得惊艳或触动的漫画？", "excerpt": "推荐两部校园恋爱类型的短篇漫画—— 《差不多该察觉了吧》、《青梅抱竹马》。第一部的作者和《伪恋》的是同一人，都是古味直志。他的画风比较偏青春向，角色的眼睛很大，看起来就给人一种阳光有活力的感觉。 男主角名叫春浦千草，是个高中生，他现在最喜欢一个名叫“光”的偶像。对方是个有着百万粉丝的网络名人，经常会在网上上传自己弹奏的歌曲，甚至还有不少原创的。 只不过比较遗憾的是，光从来没有公开过自己的名字和长相", "url": "https://www.zhihu.com/question/2069742843829211878/answer/2097005565687997104", "votes": 6, "comments": 0, "feed_ts": 1792997890, "feed_time_str": "10-26 14:58", "category": "other", "cat_name": "社 2098055012794495943", "votes": 16, "comments": 0, "feed_ts": 1792995295, "feed_time_str": "10-26 14:14", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "最新深度访谈，黄仁勋透露了哪些关键信息？", "excerpt": "导语：在最近一次的深度访谈中，黄仁勋回答了三个核心问题。 砺石/作者 砺石商业评论/出品 1 这场对话发生在什么时刻2026年10月中旬，英伟达创始人兼CEO黄仁勋第三次坐进科技投资播客BG2的录音间。对面是Altimeter资本的创始人布拉德·格斯特纳与合伙人克拉克·唐，整场对话约一小时四十分钟。 此前十余天，黄仁勋的日程排得极满，出席白宫国宴，参加白宫超级智能协议峰会，并在白宫从总统手中接过美", "url": "https://zhuanlan.zhihu.com/p/2098052321179611169", "votes": 2, "comments": 0, "feed_ts": 1792995110, "feed_time_str": "10-26 14:11", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "卢拉赢得连任，当选巴西新一任总统，怎样看待这一结果？", "excerpt": "千万没料到卢拉二轮居然硬生生额外动员出1100万票，完成大翻盘。首轮结束预测多数认为小博先手大优、赢面至少6-7成，原因简单：首轮3个获得2%～3%党派的造王者选民，全部是中、右区间（其他小党不到1%可以忽略）。第三22年支持过卢拉还好说；后两位一个可是米莱-布克莱主义黑-黄-白色调新右翼、未来非常值得关注的新兴人物伦南·桑托斯；最后一个别看政党名称翻译，在巴西不是那个意思。 常规逻辑推算，3党中", "url": "https://www.zhihu.com/question/2097866687190143130/answer/2098054222835095150", "votes": 1453, "comments": 183, "feed_ts": 1792995107, "feed_time_str": "10-26 14:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有哪些瓦房店化的典型例子？", "excerpt": "最近的典型是英国。 ……不是开玩笑。 2003-2018年，英国。金融过剩，挤出效应太强。工资下降，生产率停滞。自动洗车机减少了50%。拿着抹布的洗车工增加了50%。一个英国经济学者吐槽“英国肉人抢了机器人的工作”。 In the past 30 years, the British economy chose finance over industry, Britain’s government", "url": "https://www.zhihu.com/question/1922306731385521814/answer/2096349657001628585", "votes": 68, "comments": 6, "feed_ts": 1792995026, "feed_time_str": "10-26 14:10", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "微调", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "AgentPile：统一化 trace，加速 agent 科研", "excerpt": "我今年不是一直在推agent审计（auditing）嘛，想看清agent到底在哪一步出了问题。但真动手做的时候，最先出问题的往往是读数据这一步，还轮不到分析agent本身。 公开的agent数据集和trace文件其实不少，可每家的日志格式都不一样。有的一行记一步，有的把整段对话塞进一个字段。工具调用和返回结果，有的分开存，有的混在消息里。原有的标签也是各写各的。只用一个数据集的时候还好，写段脚本读", "url": "https://zhuanlan.zhihu.com/p/2098036245217780743", "votes": 25, "comments": 1, "feed_ts": 1792993505, "feed_time_str": "10-26 13:45", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "黄裳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "Windows的伟大之处在哪里？", "excerpt": "Windows的伟大，从来不在于它写得有多优雅，而在于它替全人类抗下了过去四十年所有的历史技术债，把自个儿活成了一个深不见底的底层泥潭，却依然能让你双击运行二十五年前的程序。我平时在公司里，周围一帮年轻工程师人手一台MacBook，开会时满嘴都是Linux内核有多纯粹，macOS的Unix血统有多高贵。 年轻人都喜欢干净的东西，这太正常了。我也年轻过，当年刚入行看Linux源码，觉得那叫一个清爽。", "url": "https://www.zhihu.com/question/42367761/answer/2096621299485368408", "votes": 9276, "comments": 537, "feed_ts": 1792993030, "feed_time_str": "10-26 13:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "杨丽萍是怎样的人？", "excerpt": "年轻的时候非常非常非常美丽，自由，脱俗。 像屈原笔下“ ……被薜荔兮带女萝……乘赤豹兮从文狸，辛夷车兮结桂旗”的山鬼。 ", "url": "https://www.zhihu.com/question/278370018/answer/3480840127", "votes": 330, "comments": 14, "feed_ts": 1792992916, "feed_time_str": "10-26 13:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "从这30个细节，看Costco的能力自信", "excerpt": "导语：Costco的核心能力，不在其规模，而在于它对利润主动设定上限的那条线，以及围绕这条线建立的一整套高度克制、高度自信、长期坚持的运营体系。 砺石/作者 砺石商业评论/出品全球零售业中，Costco（开市客，中文亦译“好市多”）是一个特殊的存在。 它是全球仓储会员店的先行者，为美国第三大、全球领先的零售商，付费会员规模以亿计，续费率长期维持在85%以上；其自有品牌Kirkland Signat", "url": "https://zhuanlan.zhihu.com/p/2098040357401507691", "votes": 1, "comments": 0, "feed_ts": 1792992420, "feed_time_str": "10-26 13:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美国为什么不暗杀梁文锋？", "excerpt": "deepseek是鲸鱼，鲸鱼来自大海。所以梁文峰其实是当代海皇，也是当代海虎。美国的纯度，还是太低了。", "url": "https://www.zhihu.com/question/2096699914101187618/answer/2098041454937559681", "votes": 327, "comments": 9, "feed_ts": 1792992063, "feed_time_str": "10-26 13:21", "c 6226吨铜。这些硬通货，都成为日军“以战养战”政策的有力支撑。1945年8月，日军无条件投降，我党完整接收了包括玲珑金矿在内的所有招远金矿，9月，招远便开足马力开采黄金，支援即将到来的解放战争。截止到1949年，招远又开采了22.8万两黄金。统计下来，抗日战争和解放战争期间，招远以一县之地，足足提供了35.8万两黄金。开辟了“‌渤海走廊‌”和“‌滨海通道‌”两条主要秘密路线，分段接力穿越上百道敌军封锁线送往延安。运送过程极其艰险，曾有26人的运金小分队抵达延安时仅剩6人，但‌黄金一两未失，更没有一人携金叛逃‌抗战期间，山东根据地约向延安输送了‌13万两黄金‌，相当于1943年陕甘宁边区财政收入的‌7倍‌，极大缓解了党中央和边区的财政、医药、军械采购及金融稳定压力。加上解放战争时期，山东向各根据地和解放区总计输送黄金‌43万两以上‌，成为党领导革命事业的重要经费来源，从经济上支撑了中国革命的胜利", "excerpt": "山东 1937～1945 用金子支撑战争1939年，胶东特委为和日军抢夺黄金资源，专门委派工会书记苏继光秘赴招远，并要求他像钉子一样深深钻进金矿，扎下根。苏继光不负重托，到招远后利用敌对势力之间的矛盾，自办隆兴金矿，大规模产金；同时领导矿工与日伪军斗智斗勇，组织他们把金矿粉藏在菜饼中、鞋底的夹层里，甚至揉进头发里带出来。苏继光只是敌占区浴血筹金队伍里的一员。可以说，当时胶东运出的每一两黄金都是热血", "url": "https://www.zhihu.com/pin/2095546448393904189", "votes": 0, "comments": 0, "feed_ts": 1792984171, "feed_time_str": "10-26 11:09", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "夜静魂梦归", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "长津湖战役后美国人带领十万北人南渡是“携民渡江”还是“胁民渡江”？", "excerpt": "在喀布尔飞人的时候，我曾经说过，如果是柏林空运时期的美帝，遇到这种事，大概率就多派几十架飞机，把阿富汗美协军打包带走了。因为二战刚结束时候的美帝工业产能过剩，大量运输机闲着没活干，所以这种撤军任务也是饱和式安排的，总能匀出装美协军的飞机的。 至于把阿富汗美协军打包装走后，再请媒体宣传一波，搞个敦刻尔克式胜利，把自己站上道德制高点，属于基本操作。这属于本意没想这么做，但生产力过剩，就这么顺带做了，…", "url": "https://www.zhihu.com/question/639038672/answer/2098007917337244802", "votes": 110, "comments": 16, "feed_ts": 1792984067, "feed_time_str": "10-26 11:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿,社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "关于中土网友互怼你怎么看？", "excerpt": "对中国的国际形象是极其重大的提振。 国际秩序的本质上畏威而不怀德，你展现出越强的攻击性，取得的战果越多，你赢得的尊重也就越多。你越是温良恭俭让，大家就越看不起你，鄙夷你的国家和文明。 另外没有长期海外工作经验的人可能很难意识到一点，那就是中国在国际上最大的短板其实是中国文化极度的不吸引人。在世界的刻板印象中，中国人就是被高度秩序化管理的，矮，做数学题，眼睛里只有钱，对于除了赚钱之外的一切生活情趣毫", "url": "https://www.zhihu.com/question/2096911510304044045/answer/2097677175566685734", "votes": 1127, "comments": 91, "feed_ts": 1792983877, "feed_time_str": "10-26 11:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小德", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "1941年开始的延安整风，到底整的是什么风？", const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

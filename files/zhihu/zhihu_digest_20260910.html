actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Muse：Meta推出全新的个人 AI 助手Meta 推出的 Muse，定位是替你盯邮箱、整理日历、浏览网站、填表下单，再把结果发回来。它可以在后台继续工作，眼下先在美国开放，App Store 和 muse.ai 都能进入。个人 agent 难在是它会接触你的日程、账户和消费动作。Muse 这次值得看的重点，在于 Meta 给“能动手的 AI”加了多厚的一层权限边界。每人一台隔离的云电脑Muse 跑在每位用户独立的 Secure VM 里：一台隔离的 Linux 云电脑，里面有浏览器、文件系统、终端，也有足够的存储和算力去跑多个任务。你可以让它跟着目标持续推进，也可以让它在你关掉 app 后继续处理。产品设计页举的生活化任务是：从学校邮件和官网里找日期、同步到家庭日历、把用品放进购物车，再在重要截止日期前提醒你。它还可以产出文档、PDF、网页和简单的追踪面板。这已经超过了“问一句、答一句”的交互。Muse 的价值取决于它能否长期记住目标、自己拆步骤、在合适的时候回来找你，而不是把每个动作都重新交给聊天框确认。发邮件和花钱，agent 不能自己拍板Meta 把权限判断交给一个独立系统 Sentinel。Muse 想通过连接器发邮件、付款，或把数据发到网络外部时，都要把请求交给 Sentinel；后者会按权限规则允许、拒绝，或弹出批准卡让用户决定。这里最关键的一点是，真实密码和卡号不交给 agent。凭证由 VM 内另一个隔离服务保存，Muse 只拿到替身 token；请求获批后，Sentinel 才在网络边界注入真实凭证。浏览器 sub-agent 看到的是网页的无障碍树快照，不能在页面里执行 JavaScript。为了减少“每次都点确认”的疲劳，读取、低风险或已授权的操作可以不打断你；发送、购买等难以撤销的动作则会停下来等你确认。你也能查看活动记录、已批准权限和它正在执行的任务。Prompt injection 与数据使用仍需确认这些设计是在压低风险，不等于风险已经消失。Meta 的技术说明明确承认：prompt injection 还是开放问题，Muse 仍可能判断错误。隐私上也有一个需要看清的限定：现有 Muse VM 并没有从技术上阻止 Meta 在支持、保护或运营服务必要时访问其中的数据。Meta 计划在今年晚些时候推出 Confidential VM，目标是用可验证的加密隔离减少这种可见性；它现在还不是已开放能力。另一个设置值得在注册后确认。Muse 的对话、tool calls 和 subagent handoff 形成的轨迹，会在移除关键个人身份信息后被用于训练后续模型；不希望参与的用户可以在设置里关闭。美国先试，先看权限再看能力", "excerpt": "Muse：Meta推出全新的个人 AI 助手Meta 推出的 Muse，定位是替你盯邮箱、整理日历、浏览网站、填表下单，再把结果发回来。它可以在后台继续工作，眼下先在美国开放，App Store 和 muse.ai 都能进入。个人 agent 难在是它会接触你的日程、账户和消费动作。Muse 这次值得看的重点，在于 Meta 给“能动手的 AI”加了多厚的一层权限边界。每人一台隔离的云电脑Muse", "url": "https://www.zhihu.com/pin/2081195466813862985", "votes": 0, "comments": 0, "feed_ts": 1788975681, "feed_time_str": "09-10 01:41", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "长沙4岁男童“摸臀”争议发酵至今，全网看完无删减原版监控，彻底颠覆了最初的认知，你们怎么看？", "excerpt": "这件事情里，最有问题的的不应该是长沙的帽子吗？这么清楚的寻衅滋事，这么清楚的伤害幼童，还能调解三次，还能让父母赔医疗费。就这么做工作的？？？", "url": "https://www.zhihu.com/question/2080712244653044169/answer/2081038113938454368", "votes": 1083, "comments": 50, "feed_ts": 1788973697, "feed_time_str": "09 来判断自己是否患病。官方明确写明：AlphaGenome Atlas 未经临床验证，也未获准用于临床用途。把它当成科研线索库比较准确：它帮人决定下一步优先研究什么，医学诊断仍需要专业流程和独立证据。", "excerpt": "Google推出 AlphaGenome AtlasGoogle DeepMind 新开放了 AlphaGenome Atlas：它把人类基因组约 90 亿种“单字母 DNA 变化”的预测结果预先算好，做成可搜索的研究资源。这件事可以把它理解成科研人员多了一个筛选台：面对几千个候选变异，先看哪些更可能影响基因表达、RNA 剪接等分子过程，再把实验资源放到更值得验证的地方。它到底装了什么？DNA 可", "url": "https://www.zhihu.com/pin/2081182877111284674", "votes": 0, "comments": 0, "feed_ts": 1788972688, "feed_time_str": "09-10 00:51", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么平时生活中见不到mtf？", "excerpt": "热知识，0个人在日常生活中有义务告诉任何人下面长的是吊还是β，0个正常人会在上厕所的时候注意这个人长的是吊还是β", "url": "https://www.zhihu.com/question/2079334572312077046/answer/2081040022380229958", "votes": 8, "comments": 0, "feed_ts": 1788970532, "feed_time_str": "09-10 00:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价DeepSeek V4.1 Flash将于2026年9月10日上线，以及V4Pro下架？", "excerpt": "即使强如 DeepSeek 这样的公司，都有可能会被骂，但其实这个做法非常合理。 按照传统的认知，Pro 肯定是要比 Flash 强、比没有后缀的强，这是毋庸置疑的。对于大模型来说，Pro 一般比普通模型强一大截很正常；同时因为它的模型参数比较大，推理费用也比较高。大家为了追求更高的性能上限，肯定会选择用 Pro。 但是这次 DeepSeek 算是拉了一坨大的。因为后训练崩了的原因，导致 V4 P", "url": "https://www.zhihu.com/question/2081037199122895830/answer/2081170412868838832", "votes": 7, "comments": 1, "feed_ts": 1788969693, "feed_time_str": "09-10 00:01", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "劳拉·卢默：普京是一个伊斯兰主义马克思主义者", "excerpt": "劳拉·卢默：普京是一个伊斯兰主义马克思主义者", "url": "https://www.zhihu.com/pin/2080661342684558532", "votes": 0, "comments": 7, "feed_ts": 1788969238, "feed_time_str": "09-09 23:53", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "手刀", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "从长远角度上看，“秦王扫六合”真的是一件好事吗？", "excerpt": "有区别吗？ 不就是要骂法家秦制么。两千年前的老秦人就这么干了，因为他们不干也要被灭。你要气不过去始皇陵骂他呗。 一个现代人，嫌爹地不够富裕就罢了，还嫌华夏老祖们两千年前审时度势的抉择？ 知道为什 托车，以及骑车去湖边游泳的日子。对于那些已经完全没有经历过东德时代的年轻一代来说，它如今又成了一种很酷的复古交通工具。它就是东德人的“Vespa”(PS：意大利著名的踏板摩托车品牌与文化符号，由比亚乔公司1946年推出。1953年的电影《罗马假日》中，奥黛丽·赫本和格利高里·派克骑着Vespa穿梭罗马，让它成为全球知名的意大利符号），因此非常适合作为一种政治符号。西格蒙德这样表述：西姆森文化代表着“个人自由出行”，也代表着一个人们彼此团结、互相扶持的时代。AfD则从中构建出了一套政治叙事：并非所有来自东德的东西都是坏的。并非所有统一之后出现的东西都更好。东德拥有属于自己的东西，而且东德人完全有理由为此感到自豪。这种叙事之所以有效，是因为西姆森并不是博物馆里供人怀旧的“东德遗物”。它依然能够上路，会发出巨大的声响，人们可以触摸它、修理它，并且真正拥有它。西姆森的历史远早于DDR，1856年，犹太兄弟勒布·西姆森(Löb Simson）跟摩西·西姆森(Moses Simson）在苏尔（Suhl）接手一家钢铁锻造企业的一部分，并逐渐将其发展成大型企业。他们先生产武器，1869年开始生产自行车，1907年开始生产汽车，到20世纪初这家企业已经成为当地重要工业企业。但因为Simson家族是犹太人，1933年纳粹上台之后，企业遭到纳粹政权夺取。1936年，Simson家族逃离德国，后来移居美国；原来的企业被改造成古斯特洛夫工厂(Gustloff-Werk，名字源自于纳粹瑞士分部的领袖威廉·古斯特洛夫/Wilhelm Gustloff），成为纳粹德国的重要军工企业。战后在被苏军拆走大量设备后，这家企业于1953年重组为“人民企业苏尔西姆森车辆与设备制药厂”(VEB Fahrzeug- und Gerätewerk Simson Suhl），并生产了一系列知名的轻便摩托车，诸如Spatz（麻雀）、Star（椋鸟）、Sperber（苍鹰）、Habicht（鹰）、Schwalbe（燕子）等，其中该厂1964年推出的KR 51 Schwalbe尤其重要(50cc发动机、3.4马力、最高60公里/小时）。之后西姆森制药厂又推出了S50、S51，其中S51从1980年开始生产，最终成为西姆森最经典的型号之一。1980年代末，苏尔工厂约有4000名员工，年产近20万辆轻便摩托车。从1955年到1990年，该厂共生产了超过500万辆轻便摩托车。随后德国统一，工厂几乎走向终结。出口市场崩溃，东德民众突然更想要西式汽车而非轻便摩托车。负责东德国有企业私有化的信托局于1991年清算了该公司。前员工尝试重启工厂，并于1992年恢复生产。此后，工厂几经易主，也生产过不同的车型。最终，在2003年，该公司彻底关闭。然而西姆森摩托车远比生产它的厂家活的更久：DDR时代，汽车非常难获得，而一辆西姆森却可以提供相当程度的个人机动性，年轻人可以骑着它去上班、去见女朋友、去迪斯科、去其他城镇与村庄，而且该车机械结构比较简单，车主自己就能维修。统一之后按照德国法律，现代摩托车普遍被限速为45公里/小时，但是西姆森因为两德统一时的法律安排获得了“既有权益保护”(Bestandsschutz，法律规则发生变化以后，原来已经合法存在的事物，在一定条件下仍然可以继续按照原来的规则存在或使用），因此如果你拥有一辆西姆森摩托车的话，你就可以合法的以60公里/小时的速度在公路与街头狂奔——也就是说，一款苏联式社会主义时代生产的摩托车居然提供了西格蒙德所谓的“个人自由”的物质基础？！西姆森家族在美国的后代知道“西姆森摩托车文化”在东德复兴并且被AfD政治化利用的事儿，因此他们家族的发言人丹尼斯·鲍姆(Dennis Baum）此前在德国的一次活动中解释说，西姆森家族绝不与任何针对移民、有色人种和性少数群体的威胁有任何瓜葛，坚决跟AfD的炒作行为划清界限。PS：我以前也谈过MAGA对“自由”的理解——种几十亩地、会开枪打猎、会开皮卡车才是真自由，整那些虚的干什么。自由里有自由！ MAGA谈自由", "excerpt": "从东德摩托车文化中感受“自由”？果不其然，西格蒙德开着西姆森(Simson）摩托车开出来竞选——西格蒙德最近一次在奎德林堡举行的骑行活动吸引了约5000人。此前，也曾有数百名骑手与他一起，骑车穿越萨克森-安哈尔特州的乡间公路。当然此前图林根的霍克早就身体力行骑着西姆森摩托车在图林根的公路与街道上穿梭。西姆森是少数几个不仅挺过了其生产国的覆亡，反而在此后变得更加庞大的品牌之一。对许多东德人来说，它代", "url": "https://www.zhihu.com/pin/2080366610406171320", "votes": 0, "comments": 6, "feed_ts 有人的时间，因为我们真能成功”——我并不天真，知道人们怎么看我，也知道他们怎么看待加州。还有私人问题，我是四个孩子的父亲，需要把更多时间精力分给家庭，家人们都不希望我参选。我不在乎各路媒体怎么说，民调市场行情如何，甚至是DSA如何评价我。", "url": "https://www.zhihu.com/pin/2080983688171479346", "votes": 0, "comments": 22, "feed_ts": 1788929841, "feed_time_str": "09-09 12:57", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "纳维-斯托克斯千禧年奖问题的OpenAI解法OpenAI 公开了一份关于纳维-斯托克斯方程的解析证明和 Lean 形式化版本。最容易被标题带偏的地方，是把它缩成“AI 攻克千禧年难题”。OpenAI 自己的说法更具体：它们构造出一种流体运动，能从平滑状态在有限时间内出现 singularity；同时明确表示不打算申领 Millennium Prize。这条公告真正值得看的是，AI 给出了一份可以被人和程序逐步检查的数学论证；它和“模型答对一道题”的展示不是同一种证据。NS 方程里到底出了什么事纳维-斯托克斯方程用来描述流体怎么流动，天气、飞机周围的气流、血流都会用到它。难题之一是：如果一开始的三维流体很平滑，它会不会在有限时间里变得“坏掉”？这里的 singularity 可以先理解成方程算出的流体速度会无限增长。它不等于现实里真的有一团水无限快，而是提醒人们：把流体当成连续介质来计算的这套模型，可能在那个点失效了。OpenAI 给出的构造是一团向内卷、同时被拉长的涡流，形状像越拉越细的意大利面。1 万个 agent 如何参与搜索OpenAI 的说明页写到，参与这次 Navier–Stokes 搜索的系统大约有 10,000 个并发 agent。它们能读缓存版互联网、运行代码，并分组交流；不同小组从不同问题表述和不同思路出发，再由 Codex 汇总中间发现。首批 agent 启动约 88 小时后得到这份解。整个 Navier–Stokes 过程用了约 270 万条消息和约 1300 亿 output token。把这些数字读成“88 小时替代人类 90 年工作”会丢掉过程条件：模型训练、工具、算力、已有数学知识和人工搭建的流程都在里面。Lean 形式化为什么要单独提数学证明最怕中间某一步跳过去。Lean 是形式化证明系统：把每一步推导写成机器可检查的规则。OpenAI 说，解析证明之后还用 GPT-6 Astra 花了额外 17 小时完成 Lean 形式化与验证。这能减少“看起来顺，但细节有漏洞”的风险，却不等于讨论已经结束。证明是否被数学界接受，还需要独立审阅、复核和讨论；OpenAI 在页面里也把这次发布称为能力进展的一个快照，没有把它包装成已经拿到奖项。X 上可见的讨论一边在感叹模型能力，另一边在追问优先权、合作者与数据来源。OpenAI 的公开页面确认：它们在 9 月 6 日联系了 Levent Alpöge 和 Tristan Buckmaster，并承认对方在 forced Euler 问题上的优先性；同时表示在对方公开前没有接触其工作、也没有为解题访问具体用户数据。", "excerpt": "纳维-斯托克斯千禧年奖问题的OpenAI解法OpenAI 公开了一份关于纳维-斯托克斯方程的解析证明和 Lean 形式化版本。最容易被标题带偏的地方，是把它缩成“AI 攻克千禧年难题”。OpenAI 自己的说法更具体：它们构造出一种流体运动，能从平滑状态在有限时间内出现 singularity；同时明确表示不打算申领 Millennium Prize。这条公告真正值得看的是，AI 给出了一份可以被", "url": "https://www.zhihu.com/pin/2081002677635437737", "votes": 0, "comments": 0, "feed_ts": 1788929716, "feed_time_str": "09-09 12:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "OpenAI发布Images 2.5 做海报、商品图或人物图时，耗时间的点是第二轮修改：只想换背景、改一行字，人物脸、构图和前面已经满意的细节却一起变了。ChatGPT Images 2.5 这次把重点放在“画完之后怎么继续改”。OpenAI 说，新版本会在图上接受评论，尽量只改你指定的位置；相较 Images 2.0，生成延迟最高降低 50%。图上评论把修改范围钉住用文字改图，常要重新描述一遍想保留和想修改的内容。Images 2.5 新增的是直接在图上留评论，用位置把修改范围指出来。官方举的产品和开发者场景里，可以改一个商品、背景或一段文案，同时尽量保留主体、构图和品牌处理。圈出位置也不等于零失误。官方承诺的是更聚焦的编辑和更可靠的指令遵循，复杂人物、背景和文字仍要自己验收。多轮修改不再每次都从头赌另一个变化是多轮一致性。你连续改几次图时，先前已经完成的修改更可能留住，后面的操作在已有结果上继续做。对需要反复确认细节的创作来说，这比单张出图更有用：目标从“重新抽一次卡”变成“在已有版本上做定点返工”。OpenAI把这项能力放在生产素材场景里讲，比如需要局部修改、又不能重建整张素材的工作流。引用帖里也有人拿同一提示词对比 2.0 与 2.5，但这些用户展示只能作为观感参考，不代替正式测试。Sketch 和模板解决从哪儿开始如果一开始很难把画面描述清楚，可以在 ChatGPT 中输入 @Sketch，直接画个草图，再加文字说明让它生成；官方的例子包括房间布局、服装轮廓和随手涂鸦。另一条入口是模板。Poster、Merch 等常用格式给出一个起点，用户再填入要传达的信息、设计元素和风格。它解决的是空白输入框不好起步的问题，不代表模板本身会替你完成准确的品牌设计。API 的 Flare 和 Sunburst 怎么选开发者端拆成两个模型。GPT-Image-2.5 Flare 是 OpenAI 推荐给多数应用的默认项，官网称它比 GPT-Image-2 画质更高、延迟低 50%。需要更细控制的创意编辑可以看 GPT-Image-2.5 Sunburst，代价是生成更慢。所以别只看一个“2.5”。高频批量生成、产品原型和视觉搜索，Flare 的速度口径更贴近需求；需要打磨成品视觉、反复改细节，Sunburst 才是官方放进去的高精度档。实际价格和具体任务耗时仍要按 API 文档与自己的调用量核算。Images 2.5 正在向 ChatGPT、ChatGPT Work 和 Codex 的所有 tiers 推出，覆盖桌面、移动和网页；Flare 与 Sunburst 可通过 API 使用。页面没有给出中国大陆可用性的单独承诺。", "excerpt": "OpenAI发布Images 2.5 做海报、商品图或人物图时，耗时间的点是第二轮修改：只想换背景、改一行字，人物脸、构图和前面已经满意的细节却一起变了。ChatGPT Images 2.5 这次把重点放在“画完之后怎么继续改”。OpenAI 说，新版本会在图上接受评论，尽量只改你指定的位置；相较 Images 2.0，生成延迟最高降低 50%。图上评论把修改范围钉住用文字改图，常要重新描述一遍想", "url": "https://www.zhihu.com/pin/2081001665679856193", "votes": 0, "comments": 0, "feed_ts": 1788929472, "feed_time_str": "09-09 12:51", "category": "pin", "cat_name": "想法动态"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "AI 已经能写出正确代码，为什么让 AI 去理解一个真实的软件系统仍然这么难？", "excerpt": "这种问题已经没有意义了，你要能像OpenAI一样88个小时内调用3000亿顶级模型的token后，软件系统问题就跟儿戏一样，本质上就是软件工程问题价值不高。 ", "url": "https://www.zhihu.com/question/2077824745706361314/answer/2080999058034922556", "votes": 21, "comments": 3, "feed_ts": 1788928839, "feed_time_str": "09-09 12:40", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "时予", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title" const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

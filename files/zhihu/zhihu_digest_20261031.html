yran\t残暴统治者Dictateur\t 独裁者+暴君+法西斯头子的历史定", "url": "https://www.zhihu.com/question/2098500549041547203/answer/2098765877550245601", "votes": 27966, "comments": 1247, "feed_ts": 1793333601, "feed_time_str": "10-30 12:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "今天写了苏拉威西地区的状态。印尼篇最开始打算拆4篇的，后面发现拆6篇才会比较合理。苏拉威西算是风险较高的地方了。说到印尼的镍矿，我们之前对印尼的吐槽，更多的是和他们之间的商业合约上印尼胡搞乱搞。但你要带入当地的治理环境，你会发现这里面的毛病会非常非常的大。当地人和镍矿之间的关联，可不是受惠于镍矿，是受害于镍矿。这是印尼内部治理的问题，但这种仇恨迁延对于我们的企业来说，还是会有一些影响的。这片区域的未来是比较糟糕的，至少在我思考的范畴内，找不到一个合理的解决办法。当然，印尼的问题从来不止这一点，它的内部治理问题也不是我们的责任。它自个儿胡搞乱搞，搞成这个样子，然后大自然再踹上重重的一脚。为什么我在文中、在评论里反复强调要对印尼保有必要的“尊重”呢？因为如果这口高压锅炸开，对整个东南亚，至少是东南亚海岛国家乃至澳大利亚的人的冲击，将会是非常非常夸张的。这种冲击，足以塑造出——拿游戏一点的话说——另一个“恐惧之眼”，成为秩序与混乱激烈冲突的前沿；或者说，激发出极其严酷的人道主义危机。", "excerpt": "今天写了苏拉威西地区的状态。印尼篇最开始打算拆4篇的，后面发现拆6篇才会比较合理。苏拉威西算是风险较高的地方了。说到印尼的镍矿，我们之前对印尼的吐槽，更多的是和他们之间的商业合约上印尼胡搞乱搞。但你要带入当地的治理环境，你会发现这里面的毛病会非常非常的大。当地人和镍矿之间的关联，可不是受惠于镍矿，是受害于镍矿。这是印尼内部治理的问题，但这种仇恨迁延对于我们的企业来说，还是会有一些影响的。这片区域的", "url": "https://www.zhihu.com/pin/2099473764681529282", "votes": 0, "comments": 2, "feed_ts": 1793333551, "feed_time_str": "10-30 12:12", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "发完了，然后朋友可以给大家讲讲我科创逃生指南第一波的判断依据。给你们教学一下吧…就其实你们好多人对A股还没入门……[小情绪] ", "excerpt": "发完了，然后朋友可以给大家讲讲我科创逃生指南第一波的判断依据。给你们教学一下吧…就其实你们好多人对A股还没入门……[小情绪] ", "url": "https://www.zhihu.com/pin/2099473480420962779", "votes": 0, "comments": 4, "feed_ts": 1793333535, "feed_time_str": "10-30 12:12", "category": "pin", "cat_name": "想法动态"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "三摄氏度升温背景下的气候地缘推演·印尼苏拉威西-马鲁古-班达海篇：断裂带上的飞地与热浪高压锅", "excerpt": "引言：赤道线上的密闭高压锅 多家机构基于IPCC第六次评估报告及第七次评估周期前期信号所做的政策路径评估显示，按目前各国提交的自主贡献方案，本世纪末全球升温最佳估计约二点八摄氏度；即便考虑高排放情景未被完全剔除的惯性路径，升温幅度仍可触及四点八摄氏度区间（注：AR7前期信号显示该极值可能被剔除，但本文仍将其作为物理上限的压力测试）。我们在此前的推演中，选取变暖三摄氏度作为审视问题的基准。值得警惕的", "url": "https://zhuanlan.zhihu.com/p/2099472216324941363", "votes": 2, " 赢了广东（4.6%）和江苏（5.2%）。 这一成绩，殊为不易。 要知道，在过去10年间，山东曾有一段时间的GDP增速低于全国平均水平，经历“新旧动能转换”的短期阵痛。 如今企稳向上的增速，证明山东的产业转型升级取得了重要进", "url": "https://zhuanlan.zhihu.com/p/2099460197420888693", "votes": 4, "comments": 0, "feed_ts": 1793330902, "feed_time_str": "10-30 11:28", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "BBuf", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "【Green Context MoE】MoE优化进阶 - 超越Mega MoE", "excerpt": "一、背景：从 Mega MoE 的融合计算到 decode 优化Mega MoE 为什么重要MoE 通过 top-k 路由，让每个 token 只访问部分专家，从而在扩大模型参数规模的同时控制计算量。专家分布在多张 GPU 上时，一次 MoE 前向包含 token 分发、专家计算和结果合并；如果这些步骤逐个执行，通信和计算之间的等待，以及多次内核启动与中间数据处理，都会进入推理的关键路径。 Dee", "url": "https://zhuanlan.zhihu.com/p/2097799846828757044", "votes": 66, "comments": 6, "feed_ts": 1793330673, "feed_time_str": "10-30 11:24", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "张晋涛", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Blacksmith 估值十亿，sandbox 公司破防Blacksmith 最近官宣了 C 轮融资，估值 10 亿美元，正式进入独角兽行列。\t不过它这轮融资给各类做sandbox的公司刺激坏了🤣大家发现与其做 agent 的执行层/运行环境，还是放在 CI 里面更容易稳定赚钱。\t所以各家 sandbox 产品都开始来抢它的市场了，Vercel 也赶快推出了 CI 产品。\t#vercel  #blacksmith  #sandbox  #ci  #GItHub  #runner  #agent  #ai  #infra ", "excerpt": "Blacksmith 估值十亿，sandbox 公司破防Blacksmith 最近官宣了 C 轮融资，估值 10 亿美元，正式进入独角兽行列。\t不过它这轮融资给各类做sandbox的公司刺激坏了🤣大家发现与其做 agent 的执行层/运行环境，还是放在 CI 里面更容易稳定赚钱。\t所以各家 sandbox 产品都开始来抢它的市场了，Vercel 也赶快推出了 CI 产品。\t#vercel  #bl", "url": "https://www.zhihu.com/pin/2099458577744371861", "votes": 0, "comments": 0, "feed_ts": 1793329930, "feed_time_str": "10-30 11:12", "category": "pin", "cat_name": "想法动态"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "新国立x可灵AI提出DiffusionART：超高效稳定可扩展的Diffusion RL算法，让视频后训练提速10倍以上", "excerpt": "来自新加坡国立大学、可灵 AI 和香港科技大学的研究团队提出了 DiffusionART，一种面向图像和视频生成的在线 Diffusion RL 算法。该方法支持采用 ODE 采样，不要求奖励模型可微，也无需额外调参，可自然适配标量奖励、二值偏好奖励等多种奖励形式，具有极高的样本效率。在 HunyuanVideo-13B 的视觉质量和运动质量实验中，DiffusionART 达到 Diffusio", "url": "https://zhuanlan.zhihu.com/p/2099458026688271703", "votes": 2, const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

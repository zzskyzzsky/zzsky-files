tegory": "pin", "cat_name": "想法动态"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "16-17世纪的战阵中火枪兵在敌人骑兵/近战步兵接近时如何应对？", "excerpt": "这个问题可以直接看蒙特库科利《军事原则》 各营由480支长矛组成，6排纵深，每排 80 支，长矛前方有一排 80 名火枪手，火枪手在长矛的掩护下，可以站着或跪着安全射击，但不能有任何移动，否则会引起混乱。在火枪手前面是80名剑盾手，他们遮蔽后方。驻守在长矛兵左右两侧的火枪兵每侧有10个小队，每支小队40 人，左右两侧侧各6个小队分成两排（这就是我们所说的袖阵）。在长矛兵的后方，左右两侧还有2个小队", "url": "https://www.zhihu.com/question/654777800/answer/3490021091", "votes": 155, "comments": 6, "feed_ts": 1788589454, "feed_time_str": "09-05 14:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "很期待有一天这种“联合蓝军”迎来自己的浅间山庄时刻：“孩子们，特朗普总统和普京握手了，回家吧！”“Not my president！自由世界万岁！哒哒哒哒哒……”", "excerpt": "很期待有一天这种“联合蓝军”迎来自己的浅间山庄时刻：“孩子们，特朗普总统和普京握手了，回家吧！”“Not my president！自由世界万岁！哒哒哒哒哒……”", "url": "https://www.zhihu.com/pin/2079561963902858574", "votes": 0, "comments": 2, "feed_ts": 1788588820, "feed_time_str": "09-05 14:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美国的美债最终将怎么收场？", "excerpt": "理解美债终局的关键点在于，一个用本国货币借钱的政府，不存在公司债那种违约，它不会说不还钱，它会全额还你钱，但是是靠印钞来还，这些钱的购买力会不断下降。 所以美债的结局，不会是突然有一天美国政府宣布违约，全球金融市场瞬间崩溃。美国不会让这种事情发生，它完全可以选择安静、合法、不激起众怒的方式来处理。 这种不宣布违约、但能把债务慢慢消化掉的做法，有一个专门的术语，叫“金融抑制”。 金融抑制先说为什么要", "url": "https://www.zhihu.com/question/659338147/answer/2079572396399387457", "votes": 196, "comments": 38, "feed_ts": 1788588696, "feed_time_str": "09-05 14:11", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "于朝阳", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "发现新大陆后的大殖民时代，产生了很多跳级生文明...采集时代还没结束，农业时代的文化还没升级完成，就突然进入工业时代...然后把采集时代的落后习俗当成了文明瑰宝...说白了就是祖宗严选没完成。但工业时代，跳级生年龄小反而显得像天才，然后很多农业时代夯实了文化基础的，跑过去学跳级生的采集时代陋俗，美其名曰体验和学习发达国家的先进文化...出现了文化返祖现象", "excerpt": "发现新大陆后的大殖民时代，产生了很多跳级生文明...采集时代还没结束，农业时代的文化还没升级完成，就突然进入工业时代...然后把采集时代的落后习俗当成了文明瑰宝...说白了就是祖宗严选没完成。但工业时代，跳级生年龄小反而显得像天才，然后很多农业时代夯实了文化基础的，跑过去学跳级生的采集时代陋俗，美其名曰体验和学习发达国家的先进文化...出现了文化返祖现象", "url": "https://www.zhihu.com/pin/2079571096349718117", "votes": 0, "comments": 0, "feed_ts": 1788588629, "feed_time_str": "09-05 14:10", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "自由派是如何看待林先生和菜头会飞的？", "excerpt": "林先生就是一个标准的目田,没啥意思。 但我们的菜头大师可就有意思了,我看怎么没人提,菜头大师是一个很明确的姨粉呀。这不明显的事 姨粉跟目田是近亲,或者说姨粉是目目(芝黑)的最高形态。 两者虽然相近,共用一套话术,但还是有差别的。 以大清举例,传统意义上的目田,比如: 谌旭彬,在他的《秦制两千年》里就专门一节专门批判菜头最爱的圣君一弘历。题目叫《乾隆为何痛恨东林党？》 后面更是拿出三章的内容批判大清", "url": "https://www.zhihu.com/question/7472609371/answer/2079526609179120611", "votes": 140, "comments": 6, "feed_ts": 1788586297, "feed_time_str": "09-05 13:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中考五五分流为什么分不下去了？", "excerpt": "2016年1800万，2023年900万五五分流已经在子宫完成了", "url": "https://www.zhihu.com/question/1972033760909320506/answer/1995475878751278351", "votes": 36227, "comments": 0, "feed_ts": 1788585344, "feed_time_str": "09-05 13:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "“我革命前吃了一堆苦，我革命后还是吃了一堆苦，那我为什么要革命呢？”你是怎么看待这个问题的？", "excerpt": "没有人会为了废除权力而夺取权力。权力不是手段，权力本身就是目的。建立专政不是为了保卫革命，反过来进行革命是为了建立专政。迫害的目的就是迫害，拷打的目的就是拷打。权力的目的就是权力。——《1984》 ", "url": "https://www.zhihu.com/question/2065064522591761829/answer/2066208652223156393", "votes": 3917, "comments": 134, "feed_ts": 1788585243, "feed_time_str": "09-05 13:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "GPT-6 Astra全面开放！额度重置，快蹬起来", "excerpt": "昨天还在吐槽「GPT-6 Astra 用不上」的小伙伴，今天就等来了好消息。 刚刚，Sam Altman 宣布， GPT-6 Astra 已正式开启大规模推送。 目前， Astra 已向 Work/Codex 中所有 Pro、Enterprise 和 Business Premium 用户开放，同时正式上线 API。下一阶段，OpenAI 将继续向 Plus 和 Business 用户推送。 感谢", "url": "https://zhuanlan.zhihu.com/p/2079544170629292937", "votes": 8, "comments": 2, "feed_ts": 1788582106, "feed_time_str": "09-05 12:21", "cat     const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

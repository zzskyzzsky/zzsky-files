·克雷斯出任临时 CEO，会对英伟达带来哪些影响？", "excerpt": "如果按 GDP 来算的话，英伟达在 2026 年（今年 5 月份）巅峰市值是 5.5 万亿美元，几乎相当于除了美国和中国之外的全球第三大经济体。就算最近回落到 4 万亿左右，它的体量依然跟印度、英国和日本在一个梯队，稳居全世界前十。这意味着全球 200 多个国家或地区中，95% 以上的国家全年GDP都比不上英伟达这家公司的估值。 即使按年营收来比，因为它今年的财年营收 2000 多亿美元，也相当于", "url": "https://www.zhihu.com/question/2104331657389896505/answer/2104359192190509628", "votes": 88, "comments": 5, "feed_ts": 1794498329, "feed_time_str": "11-12 23:45", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "未来加电站", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "荷兰法院已驳回捷豹路虎突击调取比亚迪研发资料的申请，还有哪些信息值得关注？这一裁定意味着什么？", "excerpt": "被路虎突袭扣押研发资料，比亚迪是怎么翻盘的？ 8 月，一队法警进了比亚迪在荷兰的办公室，带走一批资料。 11 月 11 日，海牙的法官给了捷豹路虎 24 小时，把这些资料全部销毁。 慢一小时罚 5 万欧元，50 万欧元封顶。裁定立即生效，路虎就算上诉，也得先把数据交出来销毁。 三个月，同一批文件换了两次主人。第一次是法院派人来拿，第二次是法院下令销毁。 比亚迪在荷兰有两处办公室。一处在斯希丹，是鹿", "url": "https://www.zhihu.com/question/2104195756106019708/answer/2104358721509913310", "votes": 32, "comments": 4, "feed_ts": 1794498216, "feed_time_str": "11-12 23:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "从预训练到RL共用似然目标，数据配比与时机都影响结果图文版：链接MaxRL把奖励转成可混合的似然样本预训练、继续预训练与监督微调本已共享最大似然目标。这项研究再将MaxRL等合适的强化学习目标写成似然拟合，把静态语料和按奖励加权的回答送入同一训练器。统一实现每题采样16条，按答对比例给成功回答加权，全错时该提示不贡献这项更新。共用目标后，数据来源、配比和使用时机仍要选择，不能推成所有RL算法都可直接替换。谜题实验里，省算力取决于预算与指标1.24亿参数模型使用约200亿token预训练。中等算力预算下，分阶段训练的单次准确率更好；最小和较大预算下，统一训练更好。16次采样至少一次答对的覆盖率，又会选中不同方案。对两种训练都未见的12人谜题，统一训练在几乎全部预算上更好。算力比较包含预训练、继续预训练与RL，不能只看RL更新次数。数学RL出现保留收益与代码准确率取舍7.6亿参数模型从已完成预训练和继续预训练的基座出发，在数学RL中混入0至5%的额外语料，语料池共2.4亿token。数学准确率接近，较高比例的32次采样覆盖率更高，非零混合降低留出语料损失，但代码单次准确率总体变低。平均比例同为0.5%时，中途停止混合又能改善代码准确率，但保留的语料损失降幅更小。后续代码RL受益，不代表已有通用最佳配方随后不再混入语料，所有模型用相同代码RL训练4000次。数学阶段5%配置的HumanEval+准确率为24.96%，分阶段参考为22.94%；MBPP+为32.69%，参考为29.81%。这是后续学习收益，不等于数学训练后所有旧能力都提高。最大规模仍为7.6亿参数，且这一规模未从预训练起全程统一；异步生成和奖励基线的实现差异，也限制了对收益来源的归因。原文标题：Training Foundation Models with a Single Algorithm#无影寺 ", "excerpt": "从预训练到RL共用似然目标，数据配比与时机都影响结果图文版：链接MaxRL把奖励转成可混合的似然样本预训练、继续预训练与监督微调本已共享最大似然目标。这项研究再将MaxRL等合适的强化学习目标写成似然拟合，把静态语料和按奖励加权的回答送入同一训练器。统一实现每题采样16条，按答对比例给成功回答加权，全错时该提示不贡献这项更新。共用目标后，数据来源、配比和使用时机仍要选择，不能推成所有RL算法都可直", "url": "https://www.zhihu.com/pin/2104358101184943118", "votes": 0, "comments": 0, "feed_ts": 1794498155, "feed_time_str": "11-12 23:42", "category": "pin", "cat_name": "想法动态"}, {"actor": "Augenstren", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "前两天相亲，是一个外地的女孩。我家在广州有两套房。没有贷款。居然被女孩嫌穷。她说要求不高，你们说呢？", "excerpt": "有没有人奇怪就这种男生写的自己挺有钱的，或者是挺成功的，然后相亲一个经济条件很差的女生，但这个女生居然对自己爱搭不理……不接受…… 的事例特别特别多呢？？？ 我想看看多少人跟我有一样的想法——果然当今男权最讨厌的地方就是总是把…确定关系和结婚划等号，然后编织“男性受害论”。 明明两者经济条件相差大，确定关系以后的大概率是女生被短择，但男生总是要搞得好像他就是直奔着结婚去一样，然后指责女生“不识好歹", "url": "https://www.zhihu.com/question/2021760388048397833/answer/2104355938681594625", "votes": 1, "comments": 1, "feed_ts": 1794497553, "feed_time_str": "11-12 23:32", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "高管私德问题能否成为罢免黄仁勋的理由？", "excerpt": "如果裤裆出事这都算问题。 那民营企业老板99.9999%都都能被罢免。 比尔盖茨出轨去爱泼斯坦处PC，感染了梅毒，还要爱泼斯坦秘密找药给他治……这样臭了，怎么没人罢免他微软董事会主席的位置？ 还有真信西方媒体洗脑，认为黄仁勋是什么“叛国”勾连间谍？ 比尔盖茨是中科院外籍院士，终身制的。怎么美国没有人认为比尔盖茨叛国？美国国会什么时候启动调查比尔盖茨？ ", "url": "https://www.zhihu.com/question/2104111620981106524/answer/2104289400158958959", "votes": 186, "comments": 12, "feed_ts": 1794497370, "feed_time_str": "11-12 23:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "清康熙雍正时期，民间工匠能不能仿制拿破仑炮？", "excerpt": "康熙三十四年的制胜将军炮，重295kg，长160cm，发射1770g铁弹，用火药888g 法国18世纪的格利博瓦尔4磅炮，一直用到19世纪初，跟着拿破仑大杀四方的野战炮，重289kg，长157cm，发射1958g铁弹，用火药730g。 铜炮的铸造难度并不大，清朝造了十几个个型号的铜炮，硬是碰出了一种设计比较先进的尺寸。 关键在于，清朝铜炮还是泥模和失蜡法铸造空心炮体再铣膛，只能保证同批次口径倍径一", "url": "https://www.zhihu.com/question/1915356334464954571/answer/1917159447752610052", "votes": 300, "comments": 127, "feed_ts": 1794497226, "feed_time_str": "11-12 23:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "说辞职就辞职吧….就，[小情绪][小情绪][小情绪] ", "excerpt": "说辞职就辞职吧….就，[小情绪][小情绪][小情绪] ", "url": "https://www.zhihu.com/pin/2104353941341336436", "votes": 0, "comments": 2, "feed_ts": 1794497094, "feed_time_str": "11-12 23:24", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent长上下文优化有了新思路：直接丢弃旧工具缓存，比摘要方案平均更省钱图文版：链接AKV保留文本，减少活跃工具缓存清华大学与香港中文大学的缓存工程把摘要改写和KV管理分开。KV是后续生成复用的键值状态；主策略保留推理及最近12条工具回复缓存，丢弃更早工具缓存，并用repos调整保留键的位置编码而不完整重算。保留状态仍可能携带旧历史的间接信息，丢缓存不等于清除旧信息；推理缓存也仍会增长。这需要AKV服务端支持，不能只改提示词就用于任意模型API。三模型平均高1.7个百分点，单项仍有退步MiniMax-M2.7、GPT-OSS-120B和MiroThinker-1.7-Mini在四个基准上，相对阈值摘要Standard平均通过率高1.7个百分点，估算费用少27.7%。费用按活跃输入、输出和摘要调用的指定价格计算，另对repos加收缓存命中价，不是服务器实付账单。MiniMax的BrowseComp-Plus上，48K摘要62.3%高于AKV的58.9%；GPT-OSS的xbench上也有摘要领先。MiroThinker在SWE-Verified上略低于Standard，GAIA费用更高。P95低约34%，限于特定服务回放八块A800上的GPT-OSS服务测试选取上下文最长的80道SWE-Verified任务，按轨迹回放工具回复，不是前80题的完整在线重跑。各自吞吐峰值下，AKV并发14、Standard并发12，P95请求延迟28.49秒对43.16秒，约低34%；输出吞吐369对313 token/秒，约高18%。不同并发和测量窗口不能当成所有负载下的统一提速，也不能替代包含工具执行的端到端测量。策略搜索有留出验证，费用对照不能混用MiniMax-M2.7在20道BrowseComp-Plus上改策略，100道留出题上，第3和第6轮相对Standard费用少15.6%和17.8%；引言7.1%则相对人工设计策略。这些不是同一对照，不能相加。选用AKV应重新验证保留策略、任务通过率、价格假设与部署支持；论文尚未证明最近12条适合所有任务，更复杂策略、该机制下的agent训练和线性注意力服务支持仍属后续方向。原文标题：Cache Engineering for Agents#无影寺 ", "excerpt": "Agent长上下文优化有了新思路：直接丢弃旧工具缓存，比摘要方案平均更省钱图文版：链接AKV保留文本，减少活跃工具缓存清华大学与香港中文大学的缓存工程把摘要改写和KV管理分开。KV是后续生成复用的键值状态；主策略保留推理及最近12条工具回复缓存，丢弃更早工具缓存，并用repos调整保留键的位置编码而不完整重算。保留状态仍可能携带旧历史的间接信息，丢缓存不等于清除旧信息；推理缓存也仍会增长。这需要A", "url": "https://www.zhihu.com/pin/2104353573626818903", "votes": 0, "comments": 0, "feed_ts": 1794497080, "feed_time_str": "11-12 23:24", "category": "pin", "cat_name": "想法动态"}, {"actor": "太湖陶朱公", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待马化腾在腾讯 28 周年庆全员会上的讲话？", "excerpt": "2010年，QQ几乎统治了中国互联网社交市场。那时候的腾讯，拥有庞大的用户基础、成熟的商业模式，以及其他互联网公司梦寐以求的流量入口。 按理说，腾讯只需要不断完善QQ，就能继续维持自己的优势。 但后来发生的事情大家都知道了。 微信诞生了。 有意思的是，微信对腾讯而言，并不是一个完全没有代价的新业务。 因为它在某种程度上，就是要革QQ的命。 腾讯最了不起的地方，并不只是创造了微信，而是它当年允许微信", "url": "https://www.zhihu.com/question/2104232899662669796/answer/2104353834655020170", "votes": 1, "comments": 0, "feed_ts": 1794497051, "feed_time_str": "11-12 23:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "AI长期记忆不用越存越大了？MemT-1.0把对话历史压进固定大小的神经记忆图文版：链接MemT-1.0用固定状态保存历史MemTensor 的 MemT-1.0 在交互结束后逐 token 更新动态记忆，答题时通过记忆注意力读取状态，不再提供历史原文。控制读写的超记忆参数在线保持固定，不等于每轮训练全部模型权重。多组记忆状态可以扩展容量，但给定配置下单条轨迹的持久状态不会随历史增长。Nano 以 Qwen3.6-35B-A3B 为基座，Flash 以额外训练的 DeepSeek-V4-Flash 为基座，两档的准确率与速度结果不能混用。11项平均准确率仍低于全文对照评测逐条清空记忆、按时间顺序写入历史，再回答问题，标准答案仅用于评分。Flash 和 Nano 的11项平均准确率分别为50.6%与47.0%，高于参数记忆基线 Temp-LoRA 的38.1%。Qwen和DeepSeek全文对照分别为66.3%与65.0%。固定状态在反复更新中难以保留全部细节，需要精确回忆和原文证据的任务仍应保留全文或检索方案作为对照。128K下Nano加速与存储收益有计量范围BEAM的35段历史、两卡单并发下，Nano在短历史通常更慢，约32K与全文打平。128K历史时端到端加速约1.86倍，计时包括历史准备和强制生成128个token。单条轨迹逻辑存储约为全文KV缓存的1/66，排除共享基座权重、嵌入模型和超记忆参数，不代表整套服务显存或费用下降同样倍数。短历史DenseRAG更省，总状态存储仍随独立会话数量增长。经验注入主要改善重复运行稳定性SWE-bench Verified的500题每题运行三次，执行前注入外部检索经验后，Nano平均成功率由66.07%升至69.33%，三次都成功由54.00%升至61.60%，至少成功一次为77.40%，与无经验77.60%接近。文本经验也达到61.60%的三次都成功比例，该组文本对照使用前3条经验，其他设置用前1条。Multilingual中Nano平均成功率低于文本经验。实验验证了经验复用，未验证自主经验积累；写入和检索仍有成本，落地要补同硬件、同并发及相同准确率要求下的总成本测试。原文标题：MemT-1.0: Towards Memory-Native Evolution#无影寺 ", "excerpt": "AI长期记忆不用越存越大了？MemT-1.0把对话历史压进固定大小的神经记忆图文版：链接MemT-1.0用固定状态保存历史MemTensor 的 MemT-1.0 在交互结束后逐 token 更新动态记忆，答题时通过记忆注意力读取状态，不再提供历史原文。控制读写的超记忆参数在线保持固定，不等于每轮训练全部模型权重。多组记忆状态可以扩展容量，但给定配置下单条轨迹的持久状态不会随历史增长。Nano 以", "url": "https://www.zhihu.com/pin/2104353122546087847", "votes": 0, "comments": 0, "feed_ts": 1794496979, "feed_time_str": "11-12 23:22", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent越进化，旧任务反而越容易做错？Google DeepMind揭示持续学习难题图文版：链接冻结Gemini权重检验harness的跨任务学习Google DeepMind等机构用Gemini 3.6 Flash比较三种不改模型权重的方法。harness指围绕模型运行的提示、记忆、技能文件和控制代码。ReasoningBank检索最相似的一条外部记忆，GEPA改共享策略提示，Meta-Harness改工作区并以当前验证表现决定是否接受更新。任务来自BIRD、BFCL和ScienceWorld，构成主题、流程、领域与复合四条任务流，每组连续训练50题，在所有组的独立留出题上定期回测。终局涨分与跨任务稳定度分别计量四条流初始正确率平均62.0%，GEPA、ReasoningBank和Meta-Harness的平均终局优势分别为+3.7、+2.5和+1.4个百分点。可塑性衡量各组训练块结束时相对初始基线的增益，不是修改速度；稳定度是未训练组受干扰及已训练组后续遗忘损失之和的负值，越接近0越好。GEPA两项分别为+6.2和−4.3，ReasoningBank为+3.3和−1.9。12个方法与场景观测的相关系数为−0.72，仅支持该实验中的负相关，不能推出普遍因果。共享提示将当前规则扩散到其他任务复合漂移的数据库阶段结束后，GEPA将SQLite探索规则写入全局提示，使尚未训练的BFCL-Miss准确率低于初始基线6.8个百分点。流程漂移中，学完直接调用工具后，旧组追问比例从29.8%降到11.2%，原有准确率优势也被削弱。Meta-Harness在部分场景较稳与拒绝大量候选更新有关，不能只凭稳定度判断新任务学得好。检索记忆还需区分操作流程是否兼容领域分开且各组已有自己的记忆后，ReasoningBank在领域漂移上没有事后遗忘。但新组尚无记忆、库中只有外组记录时，无门槛的最近邻检索让100%回合取得外组记忆，这不是100%答错。复合漂移结束时，两个相反BFCL流程仍有52%和46%的回合互取对方记忆。评估持续学习需同时回测新旧任务并检查经验适用条件；这些结果限于一个冻结基座和四条构造任务流，未验证真实长期部署。原文标题：Are Self-Evolving Agents Continual Learners?#无影寺 ", "excerpt": "Agent越进化，旧任务反而越容易做错？Google DeepMind揭示持续学习难题图文版：链接冻结Gemini权重检验harness的跨任务学习Google DeepMind等机构用Gemini 3.6 Flash比较三种不改模型权重的方法。harness指围绕模型运行的提示、记忆、技能文件和控制代码。ReasoningBank检索最相似的一条外部记忆，GEPA改共享策略提示，Meta-Har", "url": "https://www.zhihu.com/pin/2104352507254268780", "votes": 0, "comments": 0, "feed_ts": 1794496858, "feed_time_str": "11-12 23:20", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "但是不管怎么说黄仁勋这个事情的影响都是巨大的，朋友圈有些平时阴阳怪气的这次都破防了当然这些人不关键，他们也不在北美。真在北美的华人华裔只会更加破防，这次真跟以前不一样", "excerpt": "但是不管怎么说黄仁勋这个事情的影响都是巨大的，朋友圈有些平时阴阳怪气的这次都破防了当然这些人不关键，他们也不在北美。真在北美的华人华裔只会更加破防，这次真跟以前不一样", "url": "https://www.zhihu.com/pin/2104349757472875197", "votes": 0, "comments": 2, "feed_ts": 1794496580, "feed_time_str": "11-12 23:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "英伟达宣布 CEO 黄仁勋辞职，CFO 科莱特·克雷斯出任临时 CEO，会对英伟达带来哪些影响？", "excerpt": "中美交流这么多年，互联网开放了也几十年。 白人社会对黄种人有根深蒂固的种族歧视，这是明摆着的了，没什么好辩解的了 我不知道国内一些自由派为什么非要否定这一点呢 都已经到现在这种阶段了，事实如何都已经非常清楚了。 如果国内自由派还是否认白人社会对黄种人的种族歧视， 我不明白这对你们的推墙大业，你们的自由大业，究竟有什么正面意义呢 而且我敢打赌，接下来你们不会想办法对抗白人世界，去保护黄仁勋这位优秀的", "url": "https://www.zhihu.com/question/2104331657389896505/answer/2104334955505 警察：不行呀。。。 小姑娘律师：太远了，我来一次不方便的，麻烦您了！ 警察：你出去找家属按一下不就行了。 小姑娘律师：家属没来啊。 警察：你出去找一下嘛。 小姑娘律师：他们真的没来啊，我怎么找啊。 我就排她后面，我对她说：一般你们这种异地会见的呢，家属都会", "url": "https://www.zhihu.com/question/611121856/answer/1991215106424592308", "votes": 9114, "comments": 203, "feed_ts": 1794450217, "feed_time_str": "11-12 10:23", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "渡鸦", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "《影之刃零》被指后期数值崩坏导致难度骤降，你对此怎么看？", "excerpt": "在有了破军和慈母护符以后感觉这游戏就变成了流水帐式的赶路……… 本质上是我自己破坏了自己的游戏体验但是轮椅太舒服了，我不想自己走路 站在敌人的角度来看 破军等于其他游戏里龙车一样的存在 就是那种大体型怪物开着霸体不断冲撞滚过来的感觉 ", "url": "https://www.zhihu.com/question/2100313815376310450/answer/2104156879022773330", "votes": 3, "comments": 2, "feed_ts": 1794450093, "feed_time_str": "11-12 10:21", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "澳洲治安的背后——灯下黑的“燕妮带出街溜子”生态47岁华裔外卖员在墨尔本被杀，带给我们哪些警示？这下真幽默土澳配幽默深深了。这起事件中完全无人在意的，是澳洲的【“长加班”奋斗比】角色，根本不是华人在扮演。不管是“澳洲白皮基本盘”，还是以欧裔和新西兰移民为主的“非华人海外季节工群体”，相比在澳华人群体都丝毫不缺对长加班工作的耐受度。新大陆盎国笑谈之“哎，华人卷王”真正核心的问题，一方面是老生常谈的“侵犯华裔成本过低”，另一方面则是更深层次的“为什么澳洲本土会产生这么多以基本盘白人为主的街头homeless或teenager”的问题。而这两方面，其实可以归结为同一点：【相比华裔女性，澳洲白女过于“燕妮”，有相当高比例的草根个体，能够在没有美国白人式的宗教鼓动的前提下，忍受以“女方卸下养育责任”为交换条件，化身草根澳洲白男的子宫武器，导致澳洲街溜子的闹事能力迟迟不能消解】。——如果不是有心雕花，连我本人可能都意识不到，澳洲白人相比美国白人，宗教信仰程度相差悬殊却有着相似的生育率；这还是建立在澳洲的人口更集中在少数几个“大城市圈”的情况下的。**更新补充：有人把我这里提到的“白燕妮”理解为【精神小妹】，只能说是还欠点对澳洲模式精髓的理解。——真正的“白燕妮”之所以在西方世界也如此稀缺，本质上是【能忍得了“丈夫只有一份刚够糊口还拴的工作，工作之余还需要自己放松导致养育责任有限”的生儿育女模式】。澳洲基本盘的这种家庭和生育率生态，造就的是什么结果呢？1. 父母对子女“多生且不拴”。2. 依托于宗教或社会传统的【重刑传统】及【教育伦理】解体更为彻底，且这种解体可以直接释放出“没有被拴的理直气壮的基本盘街溜子”。3. “没有被拴的理直气壮基本盘街溜子”依托于这种【丈夫是除了打工时间都放飞自我的老街溜子，带点精神小妹属性的母亲能够忍耐丈夫的“低陪伴”，生儿育女当燕妮】的生态，继续复刻类似家庭模式，还能免除【你疑似有点不够上进】的社会指控。这方面，同样是西北欧系/日耳曼系，无论是美国白人这种【高生育率家庭和宗教保守家庭重合度更高】的国家，还是北欧白人部分高生育率地区的【高生育率和早期启蒙时代引导的“富裕多生”家庭重合度更高】的模式，都很难直接引导出英、澳两国白人的这种“理直气壮基本盘街溜子”模式。不过，话虽这么说，先于澳洲产生“人籍水温上升”的英国，已经成为了澳洲的解体体验服：——terf思潮和人籍水温升高，“成为街溜子可以，但作为雄性智人你永远直不起腰”终于进入了⏰体验服版本。从24年开始，澳洲白人一代移民也已经率先体验了带阴版本。大家或许可以试着期待一点未来澳洲的变革。", "excerpt": "澳洲治安的背后——灯下黑的“燕妮带出街溜子”生态47岁华裔外卖员在墨尔本被杀，带给我们哪些警示？这下真幽默土澳配幽默深深了。这起事件中完全无人在意的，是澳洲的【“长加班”奋斗比】角色，根本不是华人在扮演。不管是“澳洲白皮基本盘”，还是以欧裔和新西兰移民为主的“非华人海外季节工群体”，相比在澳华人群体都丝毫不缺对长加班工作的耐受度。新大陆盎国笑谈之“哎，华人卷王”真正核心的问题，一方面是老生常谈的“", "url": "https://www.zhihu.com/pin/2104138889342490017", "votes": 0, "comments": 8, "feed_ts": 1794449775, "feed_time_str": "11-12 10:16", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "韩剧与人生的几个十年", "excerpt": "记忆歌曲全收集做到2016年，发现《孤独又灿烂的神：鬼怪》，居然是十年前的韩剧了...在我记忆感知里，好像也就是前些年的... 人生有几个十年啊...没那么好运的话，屈指可数... 第一次看韩剧还是小学生...《蓝色生死恋》？不过据说，韩流应该是从1997年开始算...算下来，也将30年了... 我听得年代最早的韩国歌曲，应该是高耀太、李贞贤1999年的那些舞曲...虽然当时听高耀太歌属于被动事件", "url": "https://zhuanlan.zhihu.com/p/2104138594973701018", "votes": 6, "comments": 0, "feed_ts": 1794449423, "feed_time_str": "11-12 10:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "huntiger", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "越南的国食Pho（河粉）为什么在中国只能失败？", "excerpt": "本质上是大家瞧不起越南，觉得越南粉不配卖这个价而已。 但是， 机制面+预制叉烧+浓汤膏浓汤粉冲兑的“日本拉面”，四五十一碗，满街都是。 两片肥腻五花，加几坨胡萝卜黄瓜豆芽等最便宜蔬菜的“石锅拌饭”，四五十一碗，满街都是。 更别说还有冷冻鸡胸肉+预制蔬菜包的白人饭“轻食”，也是四五十一份，满街都是。 那我觉得问题不在越南粉身上。 ", "url": "https://www.zhihu.com/question/509282822/answer/2030940688116867238", "votes": 9097, "comments": 788, "feed_ts": 1794449346, "feed_time_str": "11-12 10:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "世界各国人民如何看待我国93阅兵?", "excerpt": "美鹅爆发世界大战。老中走过来劝架。 “某平生不好斗，唯好解斗。今天，我从黑龙江发射一枚洲际弹道导弹”，走西伯利亚，过莫斯科，基辅，巴黎，伦敦，穿过大西洋，过华盛顿，太平洋，打击日本东京。如果你们的防空系统全部拦截失败，那大家给我一个面子，今天这件事就算了。 日本:这么说我是戟吧？ ", "url": "https://www.zhihu.com/question/1947073925851898172/answer/1948755729835071273", "votes": 13239, "comments": 406, "feed_ts": 1794448510, "feed_time_str": "11-12 09:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "huntiger", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价广东省未成年人保护条例新规（草案意见稿）“女厕至少是男厕的两倍”？", "excerpt const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

        + '<span class="time">' + p.feed_time_str + '</span></div>'

        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

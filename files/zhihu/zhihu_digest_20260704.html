是在不断迭代，直到收敛到贝尔曼方程的不动点。第二派策略梯度，则是在直接优化策略，本质是一个随机优化问题。它们看似不同，但最终都在逼近同一个对象：最优策略。因此，强化学习是动态规划、不动点理论和优化理论在序贯决策问题上的一次汇合。从数", "url": "https://www.zhihu.com/pin/2056508718854975952", "votes": 0, "comments": 0, "feed_ts": 1783089895, "feed_time_str": "07-03 22:44", "category": "pin", "cat_name": "想法动态"}, {"actor": "CVHub", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "聊聊On-Policy Distillation与那该死的Reverse KL", "excerpt": "【摘要/导语】 最近在研究Thinking Machines Lab的新作，这也是我在做算法研究时非常关注的一个方向：如何在资源有限的情况下，把大模型的“脑子”真正装进小模型里？ 传统的SFT（有监督微调）就像是填鸭式教育，而On-Policy Distillation（在线策略蒸馏）则更像是一场高水平的私教陪练。今天不谈复杂的代码实现，我们从本质上聊聊JSD、Forward KL和Reverse", "url": "https://zhuanlan.zhihu.com/p/1992696535025214593", "votes": 367, "comments": 12, "feed_ts": 1783088901, "feed_time_str": "07-03 22:28", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "字节CEO梁汝波发全员信，要求Leader敢于设定高目标、深入一线，背后有何意图？能带来哪些变化？", "excerpt": "字节的 OKR 就注定了 Leader 是个不粘锅，然后底下大头兵全变成高压锅。 什么样的企业文化筛选什么样的 Leader，你与其问为什么 Leader 不敢设定 Higher Objective，倒不如问问好好搞 Objective 的基层管理者后来都去哪了。 现在所有的寄生虫式二传手 Leader 其实全是字节过去最引以为傲的大中台模式层层筛选提拔出来的。 字节在高速发展期，靠的是大中台+小", "url": "https://www.zhihu.com/question/2055686422682494046/answer/2056502614620165400", "votes": 282, "comments": 9, "feed_ts": 1783088432, "feed_time_str": "07-03 22:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "gwave", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "从数学的角度来说，强化学习究竟是在干什么？", "excerpt": "很多人觉得强化学习（RL）有很多算法：Q-Learning、DQN、PPO、A3C、SAC……看起来五花八门。但如果从数学上看，其实只有两条主线，而这两条主线最终都在求解同一个优化问题。 一句话概括强化学习： 强化学习就是研究如何在未知环境中，通过不断与环境交互，找到长期累计收益最大的决策函数。 说人话，就是为了爬到山顶，先画个地形图（累趴），不断的优化地形图，使之符合实际地形。数学上就是 \\pi", "url": "https://www.zhihu.com/question/15481741792/answer/2056494517939971282", "votes": 8, "comments": 0, "feed_ts": 1783086501, "feed_time_str": "07-03 21:48", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "蒋竺波", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "tit 并行；Decode负载是低时延约束下的Expert访存瓶颈以及KVC可扩展是并行策略关键，大EP应对专家访存瓶颈，洞悉搬移Query比搬移KVCache更加经济应对KVC可扩展；5）MTP：3-step MTP，主干网2 consecutive层共享indexing，草稿网 step2、step3复用step1 indexing；对比GLM52，GLM52发挥草稿模型KVCache sharing技术，进一步提高MTP接受率，龙猫2.0还未触及6）有一些疑问：比如prefill阶段用了absorb， 一般追加序列越长absorb收益越小，不适合prefill，不是很理解它们的实践有什么启发。", "excerpt": "LongCat 2.0的理解（1）1）主要营销亮点：首个国产384 ASIC（推测384超节点，从卡数48 machines each domain，正好384卡）卡预训练模型；重视精度对齐，提高预训练的可信度；2）两大结构创新：ngram embedding、LSA稀疏（稀疏聚焦indexing的优化，跨2层indexing复用（类同GLM52）、所有MTP复用indexing（类同GLM52）", "url": "https://www.zhihu.com/pin/2056473757724702480", "votes": 0, "comments": 0, "feed_ts": 1783082708, "feed_time_str": "07-03 20:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "日元涨、纳指跌，2024年的崩盘离我们有多远？", "excerpt": "昨天日元涨1%，纳指跌1.6%，这让我想起了2024年的情况。这篇来聊聊它们的相似之处，以及这次我会盯紧哪些指标、防范风险。 虚线以下为付费内容。 ………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………………", "url": "https://zhuanlan.zhihu.com/p/2056447316731728748", "votes": 13, "comments": 4, "feed_ts": 1783079032, "feed_time_str": "07-03 19:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "日元跌破1美元兑162日元关口，创下近40年来新低，日本央行已加息至1%，为何完全挡不住日元贬值颓势？", "excerpt": "这里建议日本攻击美军 这样就可以稳定获得3000亿美元 用来稳定日元 ", "url": "https://www.zhihu.com/question/2055222122289558459/answer/2055377155434058800", "votes": 607, "comments": 18, "feed_ts": 1783078853, "feed_time_str": "07-03 19:40", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "alex01", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "欧美股市、油价大跌！A股后续咋走？", "excerpt": "这篇 原油 A股 美股 一窝端。 晚上美股休市。凌晨就不发帖子了，布伦特原油看这里： 1】原油。原油昨天创新低拉起后，今天一天趴在那里呼呼大睡。也就是，主力们，王爷们，总统们都不着急，那你急个啥？ 关键是啥？ 关键是你手里的仓位啊，“有跌才买 不跌不买”要牢记。 这个是给你的期望值： 有跌才买，布伦特原油的持仓成本争取压在73美元/桶以下，朝着 72美元的成本前进，毕竟2号线上下的机会不少，要抓住", "url": "https://www.zhihu.com/question/507499807/answer/20564531748 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

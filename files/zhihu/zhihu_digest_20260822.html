geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么网上对宇树科技恶意这么大？", "excerpt": "倒不是恶意，而是存在很多悖论。 这个企业目前估值的科幻程度远大于公司本身的科幻。 他的研发投入实在太低了，还不如养猪的研发投入多。 作为一个高科技企业，这确实是很难让人绷得住。 另外，从产品上，如果生产的东西是军用品，要在战场上用，那那个机械狗的确是世界第一狗。 但问题是，如果你定位是民用品的话，人形机器人目前最确定的商业价值是性伴侣，如果不能作为性伴侣的话，人形机器人没用，或者说有用的那些机器人", "url": "https://www.zhihu.com/question/2053417197205300326/answer/2074279918150722422", "votes": 264, "comments": 31, "feed_ts": 1787326871, "feed_time_str": "08-21 23:41", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "小约翰", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "什么是真慈善？2019年，审计组本是去南京查贪腐的，结果查着查着，谁也没想到，竟然查出了一位大医精诚、人间圣手。​​审计的人盯着电脑屏幕，越看越懵。系统里蹦出来的不是黑账，不是回扣，是一笔笔没头没脑的转账记录。从2005年开始，十几年就没断过，钱不多，几百几千的，全进了贫困患者的住院账户。这位默默行善的医生，是江苏省肿瘤医院副主任医师席玮。​​这个反转太狠了。​​审计组扛着反腐的任务杀进医院，刀刃都磨好了，账本摊开了，就等着揪出几条蛀虫。结果查着查着，剑走偏锋，劈开了一道光。我觉得这才是最扎心的地方，你以为要掀开盖子抓黑手，结果掀开一看，是一双托住病人的手。​​席玮是介入科副主任医师，南京医科大学硕士生导师，手握三项省级大奖。按说这样的资历，早该住大房子开好车了。可审计人员越查越不对劲，他的工资像漏了的水龙头，十几年来一笔笔往外淌。​​从2005年开始，他给贫困患者垫付医药费，一垫就是十四年，前后累计超过五十万元，帮扶了二百八十多位走投无路的肿瘤患者。​​更让人破防的是他怎么垫的。他怕病人觉得欠人情、伤自尊，每次都说这是慈善捐助，是医院补贴。有笔5387元的款项打到了患者账户里，既没备案也没走审批，审计组差点当成利益输送来查。结果一问，席玮只淡淡回了一句，这钱是我自己掏的。​​审计的人干了十几年，见过套资金的、虚开发票的，头一回遇到这种情况，每一笔异常支出背后，都是一个等着救命的病人。​​可他自己过得什么样？骑一辆快散架的电动车，车座缠满黑胶带。白大褂穿了十四年，洗得发白还舍不得扔。住的是医院老宿舍，墙皮都掉了。​​一年春节前夕，他遇到一位六旬癌症患者，孤苦伶仃，连一万多的治疗费都凑不齐。席玮把自己过年的钱全打到了老人账户里，那年一家三口没回老家。他说，能让老人少一点痛苦，多一点温暖，比什么都强。​​我承认我破防了。​​一个副主任医师，收入不算低，却把自己活成了苦行僧。他把工资、奖金几乎全掏给了素不相识的病人。这不是一时冲动，这是刻在骨子里的东西。席玮出生在医生家庭，从小看着父母救死扶伤，那份善良早就在心里扎了根。他看不得病人因为几百几千块钱被卡在生死门口。​​这件事最残酷的地方在于对比。医疗反腐这些年，查出来的蛀虫一个比一个狠，涉案金额动辄上千万。有人把白大褂穿成了敛财的工具，有人把手术台变成了提款机。可就在同一片天空下，席玮用十四年、五十万、二百八十条命，把医生这两个字重新擦亮了。​​我觉得这才是真正的破防点，不是他做了多伟大的事，是他用最笨的方式，把那些被败坏的名声一点点往回拽。​​当然会有人说，个人垫付解决不了制度问题。这话没错。医疗救助不能只靠一个医生的善良来兜底，社会问题需要制度来托举。可制度需要完善，不代表我们不能向一个具体的人致敬。恰恰相反，正是因为制度有缝隙，席玮这样的人用血肉之躯去堵，才更显得珍贵。​​他不是在替谁擦屁股，他是在替这个行业守住最后的底线。​​我特意查了一下，这件事2019年被审计发现后，新华社、人民日报、央视新闻都报道过。一个医生藏了十四年的秘密，最后被查账的审计组翻了出来。这本身就是一个巨大的讽刺，查贪腐的机器，最后成了挖掘善良的工具。​​审计人员盯着屏幕红了眼眶，我觉得他们红的不只是眼眶，是整个行业的羞愧。​​席玮可贵在哪里？他既看见了病，也看见了病人。他知道贫困带来的羞耻、无助和绝望，同样会压垮一个人。所以他选择悄悄帮，不让患者低头求人，不让善意变成负担。这才是大医精诚，不是挂在墙上的标语，是账单跳红、病人低头、家属沉默的那一刻，有人愿意伸手托一下。​​回到开篇那句话，审计组本是去查贪腐的，结果查着查着，竟然查出了一位大医精诚、人间圣手。我觉得这句破防的背后，藏着一个更深的拷问，当反腐的探照灯扫过每一个角落时，照出的不该只是黑暗，也该有那些在黑暗里默默发光的人。​​席玮被看见了，可还有多少个席玮，藏在账本深处，等着被翻出来。一个社会最温暖的样子，应该是好人不孤单，病人有托底，善良的人也能被好好保护。​​信息来源：央视新闻《“暖心医生”为病人捐款14年 谎称是慈善捐助》，2019年4月8日发布", "excerpt": "什么是真慈善？2019年，审计组本是去南京查贪腐的，结果查着查着，谁也没想到，竟然查出了一位大医精诚、人间圣手。​​审计的人盯着电脑屏幕，越看越懵。系统里蹦出来的不是黑账，不是回扣，是一笔笔没头没脑的转账记录。从2005年开始，十几年就没断过，钱不多，几百几千的，全进了贫困患者的住院账户。这位默默行善的医生，是江苏省肿瘤医院副主任医师席玮。​​这个反转太狠了。​​审计组扛着反腐的任务杀进医院，刀刃", "url": "https://www.zhihu.com/pin/2074121178956969629", "votes": 0, "comments": 248, "feed_ts": 1787325742, "feed_time_str": "08-21 23:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BBuf", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价阿里开源的 Qwen3.8-27B？", "excerpt": "效果不用说了，看Artificial Analysis Intelligence上智力比它强的模型是哪些就可以了。27B拥有如此高的智力分数，3.6-27B神模之后Qwen开源小模型再次扳回一城。 我这里想再简单列一下我想的小模型继续优化吞吐的方向。这个是SGLang再RTX PRO 6000和DSpark上的速度： 这个速度是开了Dspark推测解码的输出吞吐，如果在RTX PRO 6000上面", "url": "https://www.zhihu.com/question/2071739761476293183/answer/2074274754421442479", "votes": 10, "comments": 2, "feed_ts": 1787325640, "feed_time_str": "08-21 23:20", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待乌克兰前国防部长费多罗夫呼吁举行战时大选？", "excerpt": "看了一圈回答，上一秒还是“90后天才国防部长”“无人机咩鹅战术的发明人”“俄罗斯炼油厂最严厉的父亲”，下一秒就成了“叛徒”“兵贼”“野心家”，乌友们的正义切割术就没有施法延迟的吗？", "url": "https://www.zhihu.com/question/2073357175527827324/answer/2074201672524612327", "votes": 231, "comments": 11, "feed_ts": 1787324622, "feed_time_str": "08-21 23:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "韩红为什么突然就塌房了？", "excerpt": "就拿慈善来说吧， 国家前总理朱老，出版的版税4000万，不让到自己账上，让出版社直接给基金会，基金会名字叫“实事”，不让用自己的名字，就是给湖南还是哪的中小学学生每天一袋奶一个鸡蛋。实实在在的小事。 我们本地一个农民党代表，一辈子捐资助学，三十年，现在老了，县里提出，发动全市党员捐款，让以她的名义成立基金会，她拒绝了，说我只捐自己劳动挣得钱，不能拿别人的钱落我的名。 韩红老师，接受全社会捐款，用自", "url": "https://www.zhihu.com/question/2065072216551827379/answer/2072231418273576690", "votes": 12253, "comments": 324, "feed_ts": 1787324558, "feed_time_str": "08-21 23:02", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "乌克兰前防长呼吁举行战时选举，泽连斯基是否要面临“最大内部挑战”？", "excerpt": "政治不稳的前提是军事失败，这永远是真理。", "url": "https://www.zhihu.com/question/2073398849947944541/answer/2074269744430109683", "votes": 0, "comments": 0, "feed_ts": 1787324445, "feed_time_str": "08-21 23:00", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "其实各种“伙伴关系”的区别对待表明闹钟也对这种事有点意识了，但玩法不对，这种区分最重要的不是实际利益，而是外在的礼仪，要把外交和理藩分开，能上桌的大国才是外交，其他的归理藩。比如瑙鲁这种玩意，应该由一个类似理藩院的机构管理，酋长来了有个副科级干部对接就行了，副科级干部在地方上是县局副局长，如果是几十万人的大县那也不是瑙鲁能碰瓷的。其实这套玩法古代很成熟了，照着用就行。", "excerpt": "其实各种“伙伴关系”的区别对待表明闹钟也对这种事有点意识了，但玩法不对，这种区分最重要的不是实际利益，而是外在的礼仪，要把外交和理藩分开，能上桌的大国才是外交，其他的归理藩。比如瑙鲁这种玩意，应该由一个类似理藩院的机构管理，酋长来了有个副科级干部对接就行了，副科级干部在地方上是县局副局长，如果是几十万人的大县那也不是瑙鲁能碰瓷的。其实这套玩法古代很成熟了，照着用就行。", "url": "https://www.zhihu.com/pin/2074105004198212512", "votes": 0, "comments": 1, "feed_ts": 1787324345, "feed_time_str": "08-21 22:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "考了驾照的人不一定会开车，你知道这是为什么吗?", "excerpt": "在中国拿驾照太简单了，费用基本上在 2000 到 5000 元不等，学车和考试基本都在封闭道路上，所谓的操作和上路考试基本跟儿戏一样，和真实的实际驾驶完全是两码事。 我这么说是因为我在国内和英国都有过学车的经历。 我国内学车非常早，那时候大家比的就是谁能在一个月内通关拿本。我运气好，不到一个月就拿到了，但拿到驾照后不到一个月我就全忘了。因为一直没开车，连哪边是油门哪边是刹车都记不清。当时学的是手动", "url": "https://www.zhihu.com/question/2072909871465377919/answer/2074268846047999569", "votes": 11, "comments": 5, "feed_ts": 1787324231, "feed_time_str": "08-21 22:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价 Anthropic CEO Dario Amodei 害怕被绑架？", "excerpt": "说明 Dario 是做梦都想绑架梁文锋、唐杰、张鹏等人，推己及人，觉得自己去中国也 化。中医很多健脾的东西，就会往各种糊糊啊、山药啊、碳水上定，原因也很简单，就是这些东西可以被肠道直接快速的消化变成能量，促进肠道的消化功能。举个最典型的例子，我一直认为潮汕地区，吃海鲜配粥，以及啊吃各种螃蟹粥这个行为是最好的吃海鲜以及吃螃蟹的办法。比江浙用黄酒硬去顶要有用的多，原因就是拆解蟹肉也好，海鲜也好，肠道的负荷很大。这个时候有粥水，有这种糊化的碳水去顶一顶，再提供一些可以直接利用的能量，整个肠胃的负担会降低很多，也就是说用粥水本身温脾的作用去对冲了海产也好，螃蟹也好的寒凉。", "excerpt": "虽然说中医定寒热啊包括更细节的定升降沉浮，基本上是以人体表现出来的症状来定的。但是呢，本身应该是往这个路子上，即促进的和延缓的。提高的和降低的，就是你身体用了这个东西之后，功能表现是增强还是减弱，形体上是增加还是减少。如果一个食物消化难度大，需要肠胃消化更多的能量，肠胃弱一点的甚至消化不了，那么它就很容易被定性为偏寒性。或者定性为容易生湿，阻塞运化。中医很多健脾的东西，就会往各种糊糊啊、山药啊、碳", "url": "https://www.zhihu.com/pin/2074200684359070744", "votes": 0, "comments": 0, "feed_ts": 1787307979, "feed_time_str": "08-21 18:26", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价帕劳总统称希望太平洋岛国就中国近期洲际弹道导弹试射一事形成“统一战线”？", "excerpt": "帕劳总统做的恰恰是和平年代 《 威斯特伐利亚体系》 的正确玩法。在和平时期，威斯特伐体利亚体系的精髓就是 “抱团霸凌” 。在这种机制的鼓励下，必然出现大量 “难道它比我强就不去霸凌了吗？” 这种在中国人看来格外荒诞的现象。如果你还不理解，就想像一下当今世界本质上是一个 “木叶村” 。威斯特伐利亚体系的核心机制是：无论什么牛鬼蛇神，只要 套上一个 “主权国家” 的壳，再做好与外部对接的接口 （ 各种", "url": "https://www.zhihu.com/question/2073097569278882605/answer/2074101315177920290", "votes": 2114, "comments": 82, "feed_ts": 1787307760, "feed_time_str": "08-21 18:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "这不就是美国社会生存指南么？首战即决战，一切走流程，划成分扣帽子上纲上线，绝不认错对抗到底。想不到我们这些美国华人脱节这么多年，国内大环境反过来向我们靠拢了。[酷]", "excerpt": "这不就是美国社会生存指南么？首战即决战，一切走流程，划成分扣帽子上纲上线，绝不认错对抗到底。想不到我们这些美国华人脱节这么多年，国内大环境反过来向我们靠拢了。[酷]", "url": "https://www.zhihu.com/pin/2074154205204559095", "votes": 0, "comments": 1, "feed_ts": 1787307723, "feed_time_str": "08-21 18:22", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待2026年8月美债正式突破40万亿美元大关？压垮美债的最后一根稻草会是什么？", "excerpt": "8月19日有两个新闻同时出现，挺有意思的。 一个是美国财政部19日公布的数据显示，美债总额首次突破40万亿美元； 一个是美国财政部19日表示，将把10年至30年期限国债的回购规模至少提高一倍，来救美国长债市场。 这两件事情同时出现，就有很多信息。 先说美国财政部救市的事情吧。 前天文章刚好分析过，最近一段时间西方发达国家的长债市场处于持续崩跌状态，长债收益率在持续上涨。 其中30年期美债收益率甚至", "url": "https:  1787307556, "feed_time_str": "08-21 18:19", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "处暑｜今年秋天不讲“燥”，先讲“湿”——气候变了，养生思路也得变", "excerpt": "处暑，二十四节气中的第十四个节气，秋季的第二个节气，今年在8月23日交节。此时太阳到达黄经150°，太阳直射点继续南移，北半球昼短夜长的趋势更加明显。 “处”有终止、躲藏之意。《月令七十二候集解》说：“处，止也，暑气至此而止矣。”处暑意味着暑热天气进入尾声，天气开始由炎热向凉爽过渡。古人将处暑分为三候：一候鹰乃祭鸟，二候天地始肃，三候禾乃登。意思是此时老鹰开始大量捕猎鸟类，天地间万物渐显肃杀之气，", "url": "https://zhuanlan.zhihu.com/p/2074198758686978124", "votes": 4, "comments": 2, "feed_ts": 1787307532, "feed_time_str": "08-21 18:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "大家是怎么看待姜文的？", "excerpt": "姜文在大院子弟里已经算是相当爱国、相当红的那一小撮了。 虽然他骨子里信得依然是精英主义那一套，但他至少不反对gc主义，且相信大部分老百姓的善良。 大院子弟是盛产恨国党、卖国贼的，像他这种对祖国充满诚挚的热爱的，已经不错了。 毕竟生长环境的影响力是极其可怕的，他能长成这样子，不说是青莲出淤泥而不染，起码也算是烂泥潭里长大最后身上还不臭，很难得了。 ", "url": "https://www.zhihu.com/question/328085392/answer/1900584395758367095", "votes": 3447, "comments": 129, "feed_ts": 1787307477, "feed_time_str": "08-21 18:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待张雪机车送到统一为止？", "excerpt": "張雪真的要自己看著辦，千萬要警惕自己別變成下一個張雪峰，成了下一個被打倒的對象。反正只要涉及台海問題的言論，自然會有專門的團隊出來抹黑造謠。", "url": "https://www.zhihu.com/question/2074097545823909332/answer/2074099290817958834", "votes": 218, "comments": 13, "feed_ts": 1787307448, "feed_time_str": "08-21 18:17", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "熊吃人就该死，可如果熊实在找不到食物，不吃人就会饿死，怎么办？", "excerpt": "没什么怎么办的。达尔文无形的大手和“熊”尔萨斯有形的大手会解决问题。我劝你不要和天意作对（手动狗头）。 有的人把“扑杀对人类有危害的动物”说成是人类中心主义。我看这只是物竞天择的自然现象。狼饿得不行了，要去吃熊猫的时候，熊猫也会努力教他该如何做狼，而不会心甘情愿以身饲狼。 我来告诉你什么是人类中心主义。人类中心主义的表现之一就是，人类对那些已经被新的环境淘汰了的动植物进行保护，使他们逃离了达尔文的", "url": "https://www.zhihu.com/question/1995310084671182594/answer/2074195055817012892", "votes": 90, "comments": 8, "feed_ts": 1787306638, "feed_time_str": "08-21 18:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "龙树的主要观点是什么？", "excerpt": "这是一个好问题，龙树（Nāgārjuna）在今日依然具有极大的吸引力。 对这个问题，直接结论是，龙树真正要否定的不是“世界存在”，而是“世界必须由某种不依赖其他东西的终极本体来支撑”。 把龙树简单概括成“万物皆空”“一切都是假的”，其实会错过他最有哲学力度的地方。用今天哲学的语言说，龙树很接近一种极其彻底的反基础主义（anti-foundationalism）：任何东西一旦被追问“它凭什么是它自己", "url": "https://www.zhihu.com/question/1938000332706800943/answer/2073055504344139570", "votes": 101, "comments": 12, "feed_ts": 1787305931, "feed_time_str": "08-21 17:52", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "致知计划开启：我的知乎成长之路昨晚我的粉丝终于突破一百，我第一时间提交了致知计划的申请。对于刚刚踏入知乎的新人而言，致知计划，几乎是大家第一个想要达成的目标。最开始我简单以为，只要成功开通，就可以持续获得盐粒收益。所以在申请之前，我特意翻阅了许多已经开通致知计划的知友分享的感悟，认真学习经验，为自己做好充分准备。 今早收到平台通知，我成功解锁致知计划权益，心里五味杂陈，既有如愿以偿的喜悦，也有一路走来的感慨。入驻知乎三个多月，兜兜转转，终于跨过这道门槛，过往努力的一幕幕，不由自主浮现在脑海。 最初，我以为粉丝100是最难跨过的门槛。平台打卡任务里有关注涨粉的选项，我便靠着互关慢慢积累，粉丝涨到六十多。可内容优质分始终停滞不动，迟迟达不到3000的标准，一度让我对开通致知计划失去信心，陷入迷茫无助。 就在彷徨之际，我读到一位友友的文章《频繁地记录自己，对你有什么变化吗？》，深受启发，决定改用写日记的方式，真正融入知乎。写了两天之后我意识到，想要达成致知计划，需要找准垂直赛道。写日记抒发内心感悟，便可以归为情感赛道。 我在平台查找情感赛道相关内容，找到了情绪写作圈子，便加入其中。看到圈子内有情绪打卡活动，我便以日记作为打卡内容，日复一日坚持输出。有一周，内容优质分上涨了六百分，我大致推测，用心打磨的日记，一篇大概可以贡献两百分优质分。 就这样坚持两三个星期，优质分终于达标，可粉丝还差二十多个。我不想再依靠互关涨粉，便放平心态，顺其自然慢慢积累。 昨晚，我完成了情绪写作三十天打卡挑战，此时粉丝距离一百只差三位。夜里十点半，粉丝终于达到100，我立刻提交申请，直到清晨，正式开通致知计划。 这也意味着，我在知乎开启了全新的旅程。情绪写作圈子的三十天挑战虽已完结，但我依旧会继续坚持书写情绪日记。这是我入门选定的主战场，不能轻言放弃。往后我也会借鉴前辈的经验，尽量创作五百字以上有实质内容的文章。我始终相信，多写、多付出，才会拥有更多收获。", "excerpt": "致知计划开启：我的知乎成长之路昨晚我的粉丝终于突破一百，我第一时间提交了致知计划的申请。对于刚刚踏入知乎的新人而言，致知计划，几乎是大家第一个想要达成的目标。最开始我简单以为，只要成功开通，就可以持续获得盐粒收益。所以在申请之前，我特意翻阅了许多已经开通致知计划的知友分享的感悟，认真学习经验，为自己做好充分准备。 今早收到平台通知，我成功解锁致知计划权益，心里五味杂陈，既有如愿以偿的喜悦，也有一路", "url": "https://www.zhihu.com/pin/2074179617422889268", "votes": 0, "comments": 0, "feed_ts": 1787305646, "feed_time_str": "08-21 17:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "2人买3个火车座位放零  · 市场"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "朝鲜战争交战双方谁伤亡大？在美国首都华盛顿特区国家广场，靠近林肯纪念堂的地方，有个Korean War Veterans Memorial，你可以将它翻译成朝鲜战争老兵纪念碑，但大多数人都叫它朝鲜战争纪念公园。里面有面黑色花岗岩墙，刻有联合国军及美军的阵亡、受伤、被俘和失踪人数。根据石碑上刻的数字，我们得知，在朝鲜战争中：阵亡：美军54246人，联合国军628833人。受伤：美军103248人，联合国军1064453人。被俘：美军7140人，联合国军92970人。失踪：美军8177人，联合国军470267人。咱们统计一下：阵亡：54246+628833=683079人。受伤：103248+1064453=1167701人。被俘：7140+92970=100110人。失踪：8177+470267=478444人。以上各项相加，美军和联合国军伤亡、失踪、被俘总人数为683079+1167701+100110+478444=2429334人。看到这个数字，你是不是觉得很震惊？那些骂志愿军“人海战术”的也可以闭嘴了。毕竟志愿军牺牲人数为197653人，负伤人数383218人，被俘21400人，失踪7700人，各项相加起来共计609971人，远低于美军和联合国军的2429334人。至于朝鲜人民军的伤亡，因为没有朝鲜公布的数据，韩国和中美第三方公布的数据有很大的差距。根据韩国统计，朝鲜战争中，朝鲜人民军阵亡215000人，负伤303000人，失踪+被俘101000至120000人之间，合计61.9万至63.8万人。而综合志愿军战报、美军解密档案和苏联战地记录，朝鲜战争中朝鲜人民军阵亡人数约15万至16万人，战场负伤约12万至14万人，被俘+失踪约2.5万至3.5万人，合计总数约29万至33万人。即便咱们采用韩国的统计数字，取最大值63.8万人+志愿军的伤亡人，总计是638000+609971=1247971人。跟美军+联合国军伤亡、失踪、被俘共计2429334人相比，少了1181363人。这会该轮到我们来问究竟是谁搞“人海战术”了！", "excerpt": "朝鲜战争交战双方谁伤亡大？在美国首都华盛顿特区国家广场，靠近林肯纪念堂的地方，有个Korean War Veterans Memorial，你可以将它翻译成朝鲜战争老兵纪念碑，但大多数人都叫它朝鲜战争纪念公园。里面有面黑色花岗岩墙，刻有联合国军及美军的阵亡、受伤、被俘和失踪人数。根据石碑上刻的数字，我们得知，在朝鲜战争中：阵亡：美军54246人，联合国军628833人。受伤：美军103248人，联", "url": "https://www.zhihu.com/pin/2065378979553579256", "votes": 0, "comments": 360, "feed_ts": 1787301698, "feed_time_str": "08-21 16:41", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《牛来》结束后全场起身鼓掌，怎么看待线上在骂线下满座的反差？它到底戳中了观众的什么心理？", "excerpt": "我宁可站起来给牛来鼓掌，我也不愿意捏着鼻子走个面。", "url": "https://www.zhihu.com/question/2072229257074275067/answer/2072599532903441178", "votes": 772, "comments": 1, "feed_ts": 1787301657, "feed_time_str": "08-21 16:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "雷鸟 iO 发布：两天续航、全天候主动式 AI，轻至 34g", "excerpt": "8 月 21 日，全球领先的消费级 AR 品牌雷鸟创新（RayNeo）举办 2026 雷鸟 AI 眼镜新品发布会，正式发布全新产品系列——雷鸟 iO 系列。作为系列首款新品，雷鸟 iO 以回归眼镜本质为设计原点，重构整机结构、光学显示与镜框形态，一改 AI 眼镜粗重的固有印象，并通过全天候主动式 AI 提供知识、表达与记忆能力增强，打造行业首款“人类增强 AI 眼镜”。雷鸟 iO 首发到手价 19", "url": "https://zhuanlan.zhihu.com/p/2074172179030209908", "votes": 0, "comments": 0, "feed_ts": 1787301561, "feed_time_str": "08-21 16:39", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "一场轰轰烈烈的梦：太平天国群雄的悲欢结局一百七十多年前，太平天国从广西金田揭竿而起，一群底层百姓高举大旗，席卷大半个中国，一度和清王朝分庭抗礼。可轰轰烈烈十四年，到最后，一众核心王侯几乎没有几个人得到善终。一张张王侯的名号，一身耀眼的王袍，背后全是血淋淋的悲剧结局。天王洪秀全，是整个太平天国的缔造者。早年科举屡屡落第，在民间传播拜上帝教，聚拢大批贫苦百姓，1851年金田起义，建立太平天国。打下南京之后，改名天京，把这里当成国都。到了后期，他深居王府，慢慢褪去最初的锐气，沉迷享乐，朝堂矛盾重重。天京城被清军团团围困的时候，城内粮食短缺，局势已经无力回天，洪秀全最终病逝，终年五十一岁。他死之后，长子洪天贵福继位，也就是幼天王，仅仅在位五个多月。天京陷落，城池被攻破，少年洪天贵福仓皇出逃，没多久就被清军俘获，年仅十六岁便惨遭凌迟，父子二人，一个病逝城中，一个惨死刑场。最早分封的东西南北翼五王。东王杨秀清，本事极强，军政事务大多由他主持，手握大权，权势滔天。可权力膨胀之后，和洪秀全矛盾越来越深，最终爆发天京事变。韦昌辉接到密令，带兵突袭东王府，杨秀清全家上下尽数被杀，这场内乱，也成了太平天国由盛转衰的转折点。西王萧朝贵作战勇猛，是早期核心战将，还没定都南京，在攻打长沙的战斗之中，亲临前线，不幸中炮阵亡，早早倒在了战场上。南王冯云山更是太平天国的奠基人，拜上帝教大半根基都是他一手发展出来，同样在进军路上遭炮火重伤而死。还没有享受定都之后的荣华，就埋骨征途。北王韦昌辉，当初出钱出力投身起义，天京事变中大肆屠杀，手段残酷。内乱失控之后，洪秀全为平息众怒，又将韦昌辉处死。翼王石达开文武兼备，带兵打仗所向披靡，天京事变之后，受不了朝堂猜忌，率领大军出走，辗转多地，最后在大渡河陷入绝境，兵败被俘，落得凌迟处死的下场。除了最初的五王，后期干王洪仁玕，是洪秀全的族弟，眼界开阔，写下《资政新篇》，想要给国家谋划新出路，可惜时局已经无力回天，天京破城之后，同样被清军抓获凌迟。到太平天国后期，又涌现出一批能打仗的王爷。燕王秦日纲，也是起义元老，卷入天京事变，最后被洪秀全下令处死。靖王李开芳，北伐主将，孤军北上，一度打到直隶，奈何后援断绝，兵败被俘，遭受凌迟。求王林凤祥，北伐的另一员主将，骁勇善战，北伐失败之后被俘，同样惨死刑场。英王陈玉成年纪轻轻，骁勇善战，多次力挽狂澜，苦苦支撑残破的战局，兵败被俘之后，依旧铁骨铮铮，拒不投降，最后凌迟而死。忠王李秀成，是太平天国后期最重要的支柱，领兵征战，守护天京，城破之后被俘，写完自述之后，也没能躲过死刑。侍王李世贤，作战顽强，天京陷落之后依旧在南方坚持抗争，没有死在清军手里，最后却被自己人汪海洋暗中杀害。翻看这一长串名单，这么多王侯，绝大多数都不得善终。有的人战死沙场，有的死于内部互相残杀，有的兵败被俘遭受酷刑。曾经声势浩大，百万大军席卷南北，可内部猜忌、权力争斗不断。打得了外面的清军，却逃不过内部的互相倾轧。这群人，大多出身底层，当初奋起反抗腐朽的清廷，想求一个不一样的世道。可等到手握权力之后，奢靡、猜忌、内斗接踵而至。辉煌来得轰轰烈烈，崩塌也来得猝不及防。十四年大梦一场，无数王侯将相，最后大多落得惨烈结局。这段历史也告诉后人，再强大的军队，再宏大的理想，如果守不住本心，陷在内耗与权力争斗之中，再盛大的事业，终究会走向覆灭。 #历史 ", "excerpt": "一场轰轰烈烈的梦：太平天国群雄的悲欢结局一百七十多年前，太平天国从广西金田揭竿而起，一群底层百姓高举大旗，席卷大半个中国，一度和清王朝分庭抗礼。可轰轰烈烈十四年，到最后，一众核心王侯几乎没有几个人得到善终。一张张王侯的名号，一身耀眼的王袍，背后全是血淋淋的悲剧结局。天王洪秀全，是整个太平天国的缔造者。早年科举屡屡落第，在民间传播拜上帝教，聚拢大批贫苦百姓，1851年金田起义，建立太平天国。打下南京", "url": "https://www.zhihu.com/pin/2071619 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "gold": "#fadb14", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

erpt": "我来自锡林郭勒，蒙古族， 四岁开始骑马。观点：① 原始人就有马蹬（皮条为主）；②马镫（蹬）对草原人帮助更大；③历史上全世界都没有在一场战斗里投入超过十万人以上的纯骑兵会战。下面我以一个四岁开始骑马的资深 野生骑手的角度，普及一点关于骑马的常识。第1个反常识：骑马其实是坐在上面，马镫能让腿更轻松。决定你能否骑在一个马上的决定性因素是马 是否驯服，唯有在拥有一匹驯服的马之后才有必要谈及马鞍马镫。换而言", "url": "https://www.zhihu.com/question/497079999/answer/1969399977181705783", "votes": 9486, "comments": 1155, "feed_ts": 1783736646, "feed_time_str": "07-11 10:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "目前为止，你总结出的最大人生经验是什么？", "excerpt": "大多数人都是水货。 普通人最大的问题就是自卑。媒体的放大，财富地位的光环，让我们总觉得那些成功人士是天纵奇才，不可逾越。其能力、远见、格局远超于常人。 在仰望这些人的同时，我们就会低看自己，觉得自己就是能力不够，就是蠢，就是格局小。 我们把别人超人般的存在看做是客观能力的必然，又把自己平庸如蝼蚁般的存在看作是活该。 实际上，当你接触了权势者、财富者，你就会发现，这些人就是普通人，甚至他们的德性、性", "url": "https://www.zhihu.com/question/313830485/answer/3198290712", "votes": 27199, "comments": 922, "feed_ts": 1783735940, "feed_time_str": "07-11 10:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "《功夫女足》首支长预告曝光，张小斐、迪丽热巴带队与各路高手功夫大乱斗，看完预告你期待这部电影吗？", "excerpt": "昨天晚上住在泰国阿育陀耶遗址附近一家叫ban tye wang的民宿里，听这名字就知道老板是华裔，可惜的是已经彻底融入泰国社会了，一句汉语不会。 民宿虽小，相当有格调，尤其前面一片草坪，走到尽头是个开满荷花的池塘。 我是很偶然发现这个池塘有蹊跷的。跑去草坪外面抽烟的时候发现，池塘水边居然趴着个大家伙，冷不丁吓人一跳，仔细看才搞清楚这是个人畜无害的小可爱，看到人影撒腿就跑，追都追不上，好不容易才拍到", "url": "https://www.zhihu.com/question/2058924914954827300/answer/2059214467393664979", "votes": 210, "comments": 18, "feed_ts": 1783734988, "feed_time_str": "07-11 09:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "今天是 2026 年 7 月 4 日，美国建国 250 年。大家有什么想说的？", "excerpt": "250年前，北美殖民地先贤们签署了《独立宣言》，建立了一个人人生而平等的奴隶制国家。", "url": "https://www.zhihu.com/question/2056734337417082595/answer/2057776097954214903", "votes": 1557, "comments": 91, "feed_ts": 1783734715, "feed_time_str": "07-11 09:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "嵌入式Linux", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

认为龚存带来的kd与他们无关的原因有二：一是他们不是真正的决策者、不掌握决定龚存的權力；但问题在于，大家都知道，没有任何公龚决策及其權力的行使可以完全脱离被治理者的普遍意愿（这一点在叮咚鸡末期表现得尤其明显）；而许多目田既然在龚村成为龚众普遍意愿的过程之中起到了推波助澜的作用——这一点我想也没有目田会予以否认吧，毕竟在叮咚鸡之后用彻底放开为自己表功的目田也不少——就必然要承担由此带来的kd中相应的那一份责任；二是主张如果提前准备、循序渐进地开始推动龚存，就可以避免现实中如此数量的kd，这一点从事实上来说的确可能是对的——但大家其实也都心知肚明，无论是本宇宙发生的极速180度大转弯（更别提当时的这种极速转向本就有目田们的一份功劳）、还是平行时空下的所谓“循序渐进推动龚村”，最终都必定会带来、特别是给体弱群体带来大量kd，所不同的无非是相对数量的多少罢了、而绝对数字仍然庞大，换言之仍然是片稍小一点的“桖海”——这个时候，我就再没见目田们搬出什么“绝对正确的人道主义”等悲天悯人的高尚情怀了，取而代之的，倒是和某位考研指导名师的那句名言如出一辙的论调：（在龚村后）X似了是他的命——那我还能说什么呢？既然大家都承认，无论在什么样的情形下，都必定会有一部分不合时宜的似王“就是X的命”——那又何必拿什么“桖海”来吓唬人呢？）关于叮咚鸡问题本身，见下一条想法：关于叮咚鸡问题", "excerpt": "这下不得不支持石指导了在叮咚鸡问题上，我对部分塞里斯目田的看法和石指导完全一致：如果说叮咚鸡之前，我对于目田所谓的“在绝对的XX之上，还有一个绝对正确的人道主义”“桖海论”等看似悲天悯人的“人道主义情怀”，还只觉得是单纯的天真和软弱的善良的话——那么叮咚鸡之后，我对他们的“桖海论”警告就只会感到油墨、嘘伪乃至噁辛了：在那段时间里，“小感冒”此类完全违反客观科学的谣言被他们一遍遍复读乃至弄假成真；在", "url": "https://www.zhihu.com/pin/2051489372906771879", "votes": 0, "comments": 73, "feed_ts": 1781927408, "feed_time_str": "06-20 11:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "夷陵笑笑生", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "看完西塞罗老师的文章，我理解自由派为何低估伊朗神权", "excerpt": "美伊战争的结局让全球自由主义者遭受了诸葛武侯“遗恨失千古”的悲苍，对他们而言，这是一道无法回避的灵魂拷打。 今天，著名自由派学者西塞罗老师发表了文章《 美国兵钝伊朗——我们还是低估了人类的耐受力》，西塞罗老师对自己过往对伊朗战争的看法，做了非常深刻的剖析，笔者读后受益匪浅，更从中理解了一些自由派朋友对伊朗战争的逻辑——即为何自由派会低估伊朗战争对美国和以色列的难度。事实上，尽管笔者对伊朗战争的观点", "url": "https://zhuanlan.zhihu.com/p/2051576558867977839", "votes": 81, "comments": 44, "feed_ts": 1781926723, "feed_time_str": "06-20 11:38", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "嵌入式Linux", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "招一批 Linux 狂热上瘾疯子码农，24 小时死读源代码，30年内写出一个国产操作系统的可能性大吗？", "excerpt": "代码是其次，核心是生态，生态是需要人认可的，你代码写好了，别人不承认，有个屁用。", "url": "https://www.zhihu.com/question/10787239323/answer/2051627785391698613", "votes": 0, "comments": 0, "feed_ts": 1781926182, "feed_time_str": "06-20 11:29", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "冷哲", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么很多发 at_name": "社会 · 文化 · 其他"}, {"actor": "王多鱼-加油", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "具身训练两周的学习总结1）VLA SFT 是起点不是终点：行为克隆学的是相关性，不是因果性。纯 SFT 走不到通用操作能力2）RL Fine-tune 是必经之路，但工程上极其脆弱：DPO 翻车证明了连续动作空间的优化景观和 LLM 完全不同，不能照搬、3）GRPO + World Model reward 是一条可行路径：73.41% 零 env 交互超过 DPO v3，说明 on-policy + 连续 reward + latent judge 的组合是对的4）Training loss ≠ 真实表现：这是具身 RL 最反直觉也最重要的认知。Loss 是代理目标，eval 才是真理5）Eval 设计比算法选择更关键：仿真→真机的分层 eval 体系决定了模型到底学到什么6）Agent/Pipeline 不会被取代：RL Infra 是让模型组件变可靠，不是替代传统 robotics 架构7）World Model 训练 ≠ RL，但用 World Model 做 RL 才是终局：预训练是序列建模，latent RL 才是策略优化还没完全摸到但正在逼近的：1）Latent RL 的完整循环：RSSM 你已经有了 value head，下一步是在 latent space 里跑 imagination rollout + actor-critic。这一步走完，你就真正进入了 DreamerV3/TD-MPC 的核心领地2）Sim-to-Real Gap 的量化方法：你知道 gap 存在，但还没有一套系统化的度量体系（哪些维度量化、阈值怎么定、怎么反馈到训练）3）embodied-rl-runtime 的原型验证：立论有了，实验有了，但 ActorEnvLoop + PolicyFreshnessManager 还没写成可运行代码", "excerpt": "具身训练两周的学习总结1）VLA SFT 是起点不是终点：行为克隆学的是相关性，不是因果性。纯 SFT 走不到通用操作能力2）RL Fine-tune 是必经之路，但工程上极其脆弱：DPO 翻车证明了连续动作空间的优化景观和 LLM 完全不同，不能照搬、3）GRPO + World Model reward 是一条可行路径：73.41% 零 env 交互超过 DPO v3，说明 on-policy", "url": "https://www.zhihu.com/pin/2051601621877052813", "votes": 0, "comments": 1, "feed_ts": 1781919968, "feed_time_str": "06-20 09:46", "category": "pin", "cat_name": "想法动态"}, {"actor": "AI教育科普", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "消费结构变化实物消费（汽车/家电/服装）增速放缓是趋势性的，服务消费（旅游/体育/健康/文化）增长是可持续的。这不是周期性的波动，而是消费升级的必然规律——中国人正在从&#34;买买买&#34;转向&#34;玩玩&#34;。  #直答还能这么用 #中国消费底气 #消费力下降 #社会消费水平  #社会消费品零售总额 ", "excerpt": "消费结构变化实物消费（汽车/家电/服装）增速放缓是趋势性的，服务消费（旅游/体育/健康/文化）增长是可持续的。这不是周期性的波动，而是消费升级的必然规律——中国人正在从&#34;买买买&#34;转向&#34;玩玩&#34;。  #直答还能这么用 #中国消费底气 #消费力下降 #社会消费水平  #社会消费品零售总额 ", "url": "https://www.zhihu.com/pin/2051599237025211299", "votes": 0, "comments": 0, "feed_ts": 1781919477, "feed_time_str": "06-20 09:37", "category": "pin", "cat_name": "想法动态"}, {"actor": "AI教育科普", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中国最新社零数据呈现负增长，服务消费逆势上扬，这预示着我国消费结构将如何调整？", "ex const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

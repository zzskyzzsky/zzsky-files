要时也检查轨迹。SR、PSR 与 CCE 的三个口径Gemini 的部分成功率（PSR）是71.5%，说明更多任务完成了部分检查点，但未必完成全部目标。因果协作有效性（CCE）则从直接满足成功条件的动作向前逐轮回溯，判断哪些先前动作提供了因果条件；失败任务的 CCE 记为0。Gemini、Claude、GPT-5 Mini、DeepSeek 的 CCE 分别为0.320、0.294、0.206、0.125。0.320 表示在包含失败任务的全部动作中，约三成落在通向成功的因果路径上，并非对聊天质量的打分。44.1 条聊天与增强集的压力测试聊天数量没有随成功率同步变化。GPT-5 Mini 平均每题44.1条消息，四款模型中最多，SR 却为36.0%；其失败任务中约26%的动作是聊天。DeepSeek 平均7.5条消息，首次聊天平均在第5轮；Gemini 平均11.0条消息、26.4轮，取得最高 SR。这些统计描述该批轨迹，不给出固定的最佳聊天数量。100道增强变体上，四款模型 SR 分别为10.0%、21.0%、24.0%和26.0%，不能与人工主集合合并为总体排名。13 个高层 API 下的基线与适用范围Gemini 3 Flash 的基线结果显示：默认黑盒多 agent 为52.0%，单 agent 为28.6%，关闭聊天为22.9%，随机动作仅5.7%；让一个协调者看见全部消息的 oracle communication 为60.0%。任务需要多角色协作，改善通信后仍有40%失败。AgentWorld 是带13个高层 API 的仿真环境，未直接测真实软件开发或生产系统的可靠性、延迟与成本。Gemini 的三次种子复跑仅覆盖35题子集，主集合的跨模型排序不构成通用能力榜单。原文标题：AgentWorld: Benchmarking Long-Horizon Collaboration of Multi-agent LLMs#无影寺 ", "excerpt": "AgentWorld量化多Agent沟通的重要性\n图文版：链接100 道主任务与 52.0% 成功率AgentWorld 在 MMORPG 沙盒中评测多 agent 长程协作。主集合有100道人工标注任务，另有100道增强变体；每题要求3到20个角色不对称的 agent 协作，轮次预算为25到55轮。它们看不见彼此的内部状态、观测和动作历史，只能靠聊天、共同计划和资源交接。四款主测模型使用相同的 ", "url": "https://www.zhihu.com/pin/2096770040578175247", "votes": 0, "comments": 0, "feed_ts": 1792689036, "feed_time_str": "10-23 01:10", "category": "pin", "cat_name": "想法动态"}, {"actor": "木文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果文言文退出中国教育体系，你是支持还是反对？为什么?", "excerpt": "之前看过一个文章，有个老师总是灌鸡汤，学生大部分都很烦他。终于有一天学生站起来反对他，老师也就是很淡然的给他们陈述了一个残忍的事实:鸡汤是给排名第一的张三小考发挥失常的安慰，是给排名第二的李四追赶的鼓励，是给排名第三的王麻子摆脱内向的内耗。至于在做的大部分人来说，你们喝不喝其实无所谓，鸡汤本来就不是给你们准备的。 听完的学生直接集体破防。 同样的道理，古文取不取消，与学渣无关，真的一点关系都没有，", "url": "https://www.zhihu.com/question/1893326454940475483/answer/1953208601490464979", "votes": 40440, "comments": 2626, "feed_ts": 1792687644, "feed_time_str": "10-23 00:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "“......无神论的文明并非真正的文明。我始终认为，我在位期间倾注多年心血推行的白色革命，应当在各个方面都符合伊斯兰教的原则。   我相信，伊斯兰教的本质在于正义；我在制定和推行一项全国性的、以共同体团结为基础的政策时，遵循的正是《古兰经》的神圣教诲。这项白色革命废除了特权，并使财富和收入得到了更加公平的分配。   对我而言，宗教信仰是所有共同体精神生活的核心与灵魂。”", "excerpt": "“......无神论的文明并非真正的文明。我始终认为，我在位期间倾注多年心血推行的白色革命，应当在各个方面都符合伊斯兰教的原则。   我相信，伊斯兰教的本质在于正义；我在制定和推行一项全国性的、以共同体团结为基础的政策时，遵循的正是《古兰经》的神圣教诲。这项白色革命废除了特权，并使财富和收入得到了更加公平的分配。   对我而言，宗教信仰是所有共同体精神生活的核心与灵魂。”", "url": "https://www.zhihu.com/pin/2096752441429702518", "votes": 0, "comments": 5, "feed_ts": 1792687617, "feed_time_str": "10-23 00:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "木文", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "朋友托我向他人贷款并约定利息，如何合法处理相关债务问题呢？", "excerpt": "注意债务加入以及债务担保方面的问题，可以直接问AI。", "url": "https://www.zhihu.com/question/2020500332862517905/answer/2096763891548214059", "votes": 0, "comments": 0, "feed_ts": 1792687468, "feed_time_str": "10-23 00:44", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "你认为的这种“在外网民代表国家形象”，早就是out多少年的老登看法了，外面社媒就是比谁饭圈比谁更会“出征”，甚至他们国家的政客亲自下场引导，你觉得这种跟人骂战键政得罪别的国家，那你为何不看看马斯克每天在发的什么推，转的什么推？马斯克发的一些推，换到品客身上都会被品客自己人骂反串黑的", "excerpt": "你认为的这种“在外网民代表国家形象”，早就是out多少年的老登看法了，外面社媒就是比谁饭圈比谁更会“出征”，甚至他们国家的政客亲自下场引导，你觉得这种跟人骂战键政得罪别的国家，那你为何不看看马斯克每天在发的什么推，转的什么推？马斯克发的一些推，换到品客身上都会被品客自己人骂反串黑的", "url": "https://www.zhihu.com/pin/2096308049954845900", "votes": 0, "comments": 5, "feed_ts": 1792686247, "feed_time_str": "10-23 00:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "RSI路线首作Flint：自动化研究参与，4个月内造出编码模型RSI路线首作Flint：自动化研究参与，4个月内造出编码模型想把仓库留在笔记本上改代码，Flint提供了一个本地选项。Recursive测得：48GB统一内存的M4 Pro，1K输入上下文下，用MLX解码达到131.22 token/s。但这个数字不含读取提示的时间，也不代表长对话或完成一次改代码任务的速度。125 token/s取决于硬件和推理引擎Flint是Recursive的本地编码模型，采用混合专家架构（MoE），总参数39.8B，每个token约激活2.5B，包含输出层。每步参与计算的参数少，有利于本地推理；但需要准备的权重并不会因此只剩2.5B。在Recursive的测速中，同一款Flint运行于M4 Pro 48GB，MLX短上下文解码为131.22 token/s，llama.cpp为87.98。64GB RTX Spark上，NVF链接路径为155.82，llama.cpp为96.61。换引擎会改变结果，不能把“超过125”当成下载任意格式后都能得到的速度。128K平均速度与末端速度，测量对象不同Recursive报告的M4 Pro MLX速度，从1K输入时的131.22，降到覆盖至128K的归一化平均68.89 token/s；后者仍排除了预填充，也就是读取、处理输入的阶段。这两个数都不是从提交任务到拿到正确补丁的总耗时。Kapitsa引擎开发者另用M4 Pro 48GB、Q4权重做过测试：上下文达到128K时，rec 0.1.0解码为35.2 token/s。这是第三方的端点测量，不能与Recursive的MLX平均值拼成同一条性能曲线。它提示的是：短上下文、整段平均和末端速度要分别看。编码成绩领先所列MoE，对稠密模型有取舍在发布列出的三款MoE对照中，Flint的Terminal-Bench 2.1、SWE-bench Pro v2和SWE-bench Verified成绩都更高，分别为54.9%、89.7%、74.2%。Recursive把这类定位限定为总参数低于50B的MoE，不能扩写成所有本地编码模型里最强。稠密模型仍有更高的单项成绩。例如Qwen3.8 27B在Terminal-Bench为73.0%、SWE-bench Verified为75.6%，均高于Flint，但在Recursive的M4 Pro测速中更慢。Flint提供的是速度与能力之间的选择，不是每项能力都胜出。速度来自量化、蒸馏和专用内核共同配合Recursive的自动化研究系统Eureka Machine参与了架构、训练和推理优化。Flint训练完成后，再搜索量化方案，将输出层也压到4位；随后用16位模型作教师进行离线蒸馏，恢复量化后的能力。推理端还使用了针对硬件的专用内核，优化低比特计算、专家运算和注意力；Apple芯片路径进一步融合解码计算。这条优化链包含模型设计、权重处理和硬件实现，只换模型不能保证复现发布速度。上述开发结果来自Recursive报告，本文没有独立复现。48GB的rec路径与其他量化包Recursive的安装说明将rec路径列为M4 Pro、M5 Pro或M5 Max，统一内存至少48GB。其他量化包可能适配更小内存，但能装下、能运行、能达到发布速度，是三个不同条件，必须按具体权重和运行时重新测试。Hugging Face主仓库提供的是BF16权重，下载约80GB；它不是上述笔记本测速使用的量化包。模型卡的SGLang示例面向单张B300或H200，且说明尚未提供Transformers建模代码。不要把页面自动生成的加载示例当作已经验证可用的部署流程。日常本地编码可试，长任务要验收完成时间和工具调用如果你已有符合rec要求的Mac，Flint可作为本地日常编码的候选：用自己的仓库测试修改、运行测试和多轮工具调用，记录完成时间与正确率。遇到复杂任务，Recursive建议拆成小步骤并给出明确指令；发布速度不能替代这组验收。Flint会先推理，长推理可能耗尽输出预算。模型卡对难题建议至少32,768个输出token，包含推理；工具调用还要由应用限制权限并检查动作。生成得快，不代表工具名正确、代码能通过测试或改动可以直接执行。权重采用Apache 2.0许可，本地运行可以离线。OpenCode、Pi的托管试用和合作方API则是另一条数据路径，需另看服务条款与数据处理约定；不能因为权重开放，就默认所有入口都把代码留在电脑上。", "excerpt": "RSI路线首作Flint：自动化研究参与，4个月内造出编码模型RSI路线首作Flint：自动化研究参与，4个月内造出编码模型想把仓库留在笔记本上改代码，Flint提供了一个本地选项。Recursive测得：48GB统一内存的M4 Pro，1K输入上下文下，用MLX解码达到131.22 token/s。但这个数字不含读取提示的时间，也不代表长对话或完成一次改代码任务的速度。125 token/s取决", "url": "https://www.zhihu.com/pin/2096756489373343945", "votes": 0, "comments": 0, "feed_ts": 1792686243, "feed_time_str": "10-23 00:24", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "法国发生近年来最严重暴力骚乱，约1200人被捕、超150名警察受伤，情况如何？为何此时矛盾进一步激化？", "excerpt": "我认为这说明了一件中国人很难注意到，甚至理解反了的事情：那就是 一个社会对 “集会，游行，抗议，示威” 这些事情的限制越宽松，就会导致这些行为的 “预期效果” 越低 （如果曾经有过什么效果的话），直到这些行为彻底失去效果并成为 《社会景观》 的一部分。换 「散架」间二选一了", "excerpt": "生成模型设计超材料时常常两头落空：贴着训练数据走，产出的是换了说法的旧结构；放开手脚探索，又会得到断裂、漂浮甚至空无一物的 “废件”。ReGDiff 先把潜空间整理好，再在采样时只对近处的已知样本施加排斥，让模型往外走，又不走出可用的范围。 论文：ReGDiff: Guided Diffusion in Regulated Latent Space for Exploring Metamateri", "url": "https://zhuanlan.zhihu.com/p/2096648465879253446", "votes": 3, "comments": 0, "feed_ts": 1792660025, "feed_time_str": "10-22 17:07", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "平凡", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "《彻 底 疯 狂》", "excerpt": "《彻 底 疯 狂》", "url": "https://www.zhihu.com/pin/2096356009346326704", "votes": 0, "comments": 94, "feed_ts": 1792659834, "feed_time_str": "10-22 17:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "泽连斯基表示，乌克兰愿在保留至少75%领土控制权的基础上达成和平协议，你怎么看？", "excerpt": "有人说战报会说谎，战线不会。 事实是战线也会说谎。 一战德国，直到战败前都占领着协约国的领土，西线本土就没有被协约国军队占领过。 入侵阿富汗的苏联、入侵越南的美国亦然。直到撤军前还维持着对敌国领土的占领。 战报会说谎，战线也会说谎。 什么不会说谎？ 谈判桌上的停战条件不会说谎。 交战双方提出的停战条件的变化，最能真实反映交战双方是越打越顺了还是越打越难了。很多乌友喜欢把俄乌类比中国抗日。 那我们看", "url": "https://www.zhihu.com/question/2096328160241633097/answer/2096415512909693222", "votes": 3834, "comments": 544, "feed_ts": 1792659786, "feed_time_str": "10-22 17:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "哪一瞬间，你意识到好言难劝该死的鬼？", "excerpt": "小区旁边有个幼儿园，公办，很不错，收费便宜环境好吃得好，而且是省级实验幼儿园... 一个月费用才八百多，餐费一天18元....... 这个幼儿园很不好进！！ 上幼儿园前，报了名，各种审核通过，然后幼儿园老师会和家长面谈... 面谈就是六七个题目，都很正常，最后一个题目内容大概是这样的。。 孩子在院内和其他小朋友有了矛盾，或者发生了意外，家长应该怎么做。。 我的回答是，一般磕磕碰碰的很正常，就算有点", "url": "https://www.zhihu.com/question/652415549/answer/2052732584128520967", "votes": 814, "comments": 187, "feed_ts": 1792659629, "feed_time_str": "10-22 17:00", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "什么是基本盘？现在网络上面这个词，特别频繁地出现？", "excerpt": "根据美国普林斯顿大学的研究，“基本盘”的定义是：喜欢CCP，在自信、社交能力、责任心和工作伦理上得分很高——研究称之为“与个人和职业成功相关的特质” 与此相反的， function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);

}

    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

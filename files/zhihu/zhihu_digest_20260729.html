想法", "title": "古代没有火柴，做饭生火靠什么？如果单说做饭的话，这就比较简单了。就是在灶门做一个挡板，把火封在里面，保证有一定的氧气进入，但是通过量不大，无法使木柴复燃，可以保持木柴的燃烧温度。柴灶上面使用大铁锅封闭，因为阴燃的木柴仍然可以提供一定的热量，所以在大铁锅里可以放一些水，到天明时，可以得到一些热水用于洗漱。要留火种，就在烧饭的最后添几根大柴火，烧透了以后，就封火，则可以持续到天明。比起柴灶，更为古老的是火塘，火塘就是在屋内挖一个坑，使用明火煮食，火塘也有封火技术。保留火种，封火复燃，这就是古代家庭生火做饭的基本方法。古代没有火柴，做饭生火靠什么？ #燃气窑炉 #窑炉点火器 #窑炉火检 ", "excerpt": "古代没有火柴，做饭生火靠什么？如果单说做饭的话，这就比较简单了。就是在灶门做一个挡板，把火封在里面，保证有一定的氧气进入，但是通过量不大，无法使木柴复燃，可以保持木柴的燃烧温度。柴灶上面使用大铁锅封闭，因为阴燃的木柴仍然可以提供一定的热量，所以在大铁锅里可以放一些水，到天明时，可以得到一些热水用于洗漱。要留火种，就在烧饭的最后添几根大柴火，烧透了以后，就封火，则可以持续到天明。比起柴灶，更为古老的", "url": "https://www.zhihu.com/pin/2065501130801652533", "votes": 0, "comments": 1, "feed_ts": 1785233844, "feed_time_str": "07-28 18:17", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "古代没有火柴，做饭生火靠什么？", "excerpt": "如果单说做饭的话，这就比较简单了。 就是在灶门做一个挡板，把火封在里面。 这块挡板和煤球炉的挡板原理一样，保证有一定的氧气进入，但是通过量不大，无法使木柴复燃，可以保持木柴的燃烧温度，一直到需要复燃时，往里面添加易燃材料，增加氧气供应即可。 灶的设计上，要遵循灶门低于烟道4cm左右，保证烟气不倒流，可以通过烟道往外扩散。 上面这种挡板是新式的，尺寸标准，在砌灶的时候，直接砌上去，就搞定了。 老式的", "url": "https://www.zhihu.com/question/2057462316296311014/answer/2065500686104663562", "votes": 10, "comments": 0, "feed_ts": 1785233739, "feed_time_str": "07-28 18:15", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "剑光一闪，高手不用第二招？", "excerpt": "京都有家老店，黑泽明晚年爱去。打车时不用报地址，只说店名，上年纪的司机都知道，名闻遐迩。 那店的卖点之一：早餐厅是黑泽明当年的书房。墙上挂了他当年的一些分镜草图。 众所周知，黑泽明爱油画，很擅长把人放在他画好的世界里，看人去冲突斗争：流动、变幻、撞、逃、仓皇、悲怆、喜悦，然后迸裂出些绚烂火花。 他也喜欢莎士比亚。《乱》脱胎自李尔王，《蜘蛛巢城》脱胎自《麦克白》。 他的电影有壮丽的舞台剧之感，擅长从", "url": "https://zhuanlan.zhihu.com/p/2065109283218502614", "votes": 96, "comments": 4, "feed_ts": 1785233663, "feed_time_str": "07-28 18:14", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "宝郁", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "张雪峰走后这半年，一切都没变", "excerpt": "先声明，我不是任何一方的粉丝，也不站队。就是一个普通吃瓜群众，从三月份看到现在，越看越觉得这故事比电视剧还精彩。一、突然的结束、突然的开始今年3月24号，张雪峰突然走了。心源性猝死，41岁。 当时我刷到消息，第一反应是假的吧？结果是真的。整个人都不好了。虽然平时也吐槽他“贩卖焦虑”“搞流量”，但这个人确实帮不少普通家庭孩子填过志愿，说没就没了。 他走后留下什么？一个11岁的女儿，一个老母亲，还有一", "url": "https://zhuanlan.zhihu.com/p/2065365077021217836", "votes": 44, "comments": 22, "feed_ts": 1785233339, "feed_time_str": "07-28 18:08", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "【WAIC 机器之心现场采访特辑】多智能体协作，风险可能被“指数级放大”蚂蚁集团副总裁、蚂蚁大安全CTO陈亮做客本期【WAIC 机器之心现场采访特辑】，现场分享智能体安全挑战。他指出，多智能体协作会放大权限失控和意图偏移风险，安全需从设计阶段内置。未来智能体经济时代，可信身份、授权与责任机制将成为关键基础设施。", "excerpt": "【WAIC 机器之心现场采访特辑】多智能体协作，风险可能被“指数级放大”蚂蚁集团副总裁、蚂蚁大安全CTO陈亮做客本期【WAIC 机器之心现场采访特辑】，现场分享智能体安全挑战。他指出，多智能体协作会放大权限失控和意图偏移风险，安全需从设计阶段内置。未来智能体经济时代，可信身份、授权与责任机制将成为关键基础设施。", "url": "https://www.zhihu.com/pin/2065498141441397297", "votes": 0, "comments": 0, "feed_ts": 1785233208, "feed_time_str": "07-28 18:06", "category": "pin", "cat_name": "想法动态"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价中国科幻电影《群星闪耀时》？", "excerpt": "《群星》是对《星际穿越》的拙劣模仿。 以前我是很看不上《星际穿越》的，它作为一个科幻电影，却用宗教当内核，这是严重违背科学精神的。但现在我改变看法了，差距都是比出来的，《群星》连照抄都没抄明白。 什么是好的科幻电影？我认为有三条标准： 首先，要有 “科”。不能存在太多明显的科学常识错误，这是最基础的要求。故事的推进要围绕几个物理概念展开。比如《流浪地球1》里的引力弹弓、洛希极限，在危机的产生、发展", "url": "https://www.zhihu.com/question/2051834526276522035/answer/2062872096972204009", "votes": 115, "comments": 74, "feed_ts": 1785232984, "feed_time_str": "07-28 18:03", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "俄乌的尸体交换比例悬殊，乌克兰人民看了什么感觉？每次俄军用几千具乌军尸体交换几十句俄军尸体？", "excerpt": "我觉得吧，如果是俄军猛烈推进，每天都前进几公里，乌克兰来不及收尸其实也说得通。 现在战线来回拉锯，用有些人的话说，占领全乌得用几百年。这样的交换比其实和真实的死伤是有相关性的，并不是乌军死的很少，但是来不及收尸。这说不通。 现在的情况能得到的结论是，第一是乌军死的多得多，第二是乌军对己方士兵尸体也无所谓。可能是因为收尸意味着不能抵赖抚恤金（也不可能只收俄军尸体，必然还有己方的）。也可能就是根本不在", "url": "https://www.zhihu.com/question/2065030075343491821/answer/2065496914452390821", "votes": 121, "comments": 23, "feed_ts": 1785232840, "feed_time_str": "07-28 18:00", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么左派普遍认为秦制比周制更好?", "excerpt": "苛政猛于虎这个词儿也不是秦以后才有的。你非要东拉西扯说齐国有一个法家鼻祖，鲁国并没有啊？到底苛政哪儿来的。 贵族之间谦让、争霸、结盟、贵族精神和老百姓关系不大。他们都比老虎可怕。 考古发现，秦国人很多都住瓦房，秦人生活水平比六国人好，若不然，光靠苛政不可能富国强兵，不可能打的赢。 ", "url": "https://www.zhihu.com/question/667384754/answer/2065495504734122347", "votes": 17, "comments": 1, "feed_ts": 1785232504, "feed_time_str": "07-28 17:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你的亲戚提过什么过分的要求？", "excerpt": "我二姑因为吸du五进宫，我三叔让我去看守所看望她，顺便把一种血压瞬间增高的药给她带上，说吃了以后上面为了省钱不给看病就会把她放了，我说你为啥不让你儿子送？他说这是犯罪行为！我怎么会让他去呢！", "url": "https://www.zhihu.com/question/480421235/answer/1914379307532411433", "votes": 29450, "comments": 350, "feed_ts": 1785232312, "feed_time_str": "07-28 17:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "北约真敢介入台海问题吗？", "excerpt": "你说的是那个被制裁了两用物资就只会嘤嘤嘤的北约吗？", "url": "https://www.zhihu.com/question/2062813806061940773/answer/2065494582931072864", "votes": 1, "comments": 0, "feed_ts": 1785232284, "feed_time_str": "07-28 17:51", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你见过最恶心的亲戚是怎样的？", "excerpt": "就在19年年中。我妹妹高考。家里准备了差不多十几万给我妹妹上大学的。结果我妹妹因为肾结石没考好只考了个二本线。小姑家修房子。天天跑我家来借钱。每次来就巴拉巴拉的说女孩子读那么多书没用。又是这又是那的。我老娘碍于面子借给她家五万块钱。后来我妹说上个二本算了。我直接说赶快交钱去复读。不管怎么样都要上个一本。今年中秋节我回家过节。我妹刚做完肾结石手术。小姑又跑来借钱。听说我妹复读要花多少多少钱。又是一通", "url": "https://www.zhihu.com/question/313239352/answer/876029676", "votes": 25656, "comments": 941, "feed_ts": 1785232151, "feed_time_str": "07-28 17:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "北约真敢介入台海问题吗？", "excerpt": "嗯，看完几条高赞的内容，我还以为穿越到《全频带阻塞干扰》的世界线了。 ", "url": "https://www.zhihu.com/question/2062813806061940773/answer/2064124353323724973", "votes": 2433, "comments": 130, "feed_ts": 1785232134, "feed_time_str": "07-28 17:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "alex01", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "黄金和白银会跌到哪里去？", "excerpt": "跑。 没办法，跑。 黄金 即将跳水？37xx 36xx美元/盎司？请不要奇怪，35xx，34xx？...3000？2000？请不要慌，黄金一定会有一个低点的，这个低点一定是事后才能被验证的，当你买入的时候，没有人能给你保证：这就是最低点。 但面对一些离谱的数字时，请你摸摸你的小心脏，不要去问“3000美元/盎司？黄金会不会跌到2000美元/盎司？黄金是不是不再是金子了？”这个问题。 同样，当白银 ", "url": "https://www.zhihu.com/question/2034771939743547722/answer/2065492282393024178", "votes": 128, "comments": 168, "feed_ts": 1785231735, "feed_time_str": "07-28 17:42", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你见过最恶心的亲戚是怎样的？", "excerpt": "我的姑姑姑父 13年左右，我爸有点事情，被抓了，我妈一个家庭妇女实在不知道怎么办，就拜托我姑父帮着走动走动关系，跑跑腿，油费好处费该给的一点没少，我姑父也就跟着跑了两三趟吧，就说手机坏了，出门不方便，我妈二话没说三千多块钱给他买个新手机，买完手机再打电话叫帮忙再也没来过。这里我气愤的点是，明知道家里的顶梁柱不在，这个家里的经济来源已经断了，还要薅一把。（所谓的帮忙就是让他开车带着我妈去找人找关系）", "url": "https://www.zhihu.com/question/313239352/answer/54580095690", "votes": 386, "comments": 166, "feed_ts": 1785231547, "feed_time_str": "07-28 17:39", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "特朗普放鸽后美债收益率稳住了突然发现不需要美联储放鸽，真正在放鸽的是特朗普。最近两周美伊越来越凶，美国5年期以上的国债收益率都大幅上涨。美债看跌期权的需求也明显上升，大家买入看跌期权对冲收益率继续上涨、债券价格下跌的风险。不过从持仓报告来看，这一轮长债价格下跌，不是因为有人新建了大量空头仓位，主要是多头的平仓离场。这就好一些，没有出现空头扎堆的情况。今天特总又在打暧昧牌，又是“和伊朗谈的很好，但谈不成就继续打”。综上，长债收益率暂时稳住了。沃什要谢谢特朗普帮他放了鸽！要是美国还在打仗、油价高挂，沃什话术再好，也难挡收益率往上飙，那美股就会彻底撑不住。收益率真要失控，逼急了美联储只能直接宣布加息、即转成极端鹰派，来震住场子。所以目前美联储就没必要那么极端了。现在不用秀狠，而是要秀话术。沃什这周要是把话术拿捏地得好，长债收益率还能继续往下压。等着看吧。", "excerpt": "特朗普放鸽后美债收益率稳住了突然发现不需要美联储放鸽，真正在放鸽的是特朗普。最近两周美伊越来越凶，美国5年期以上的国债收益率都大幅上涨。美债看跌期权的需求也明显上升，大家买入看跌期权对冲收益率继续上涨、债券价格下跌的风险。不过从持仓报告来看，这一轮长债价格下跌，不是因为有人新建了大量空头仓位，主要是多头的平仓离场。这就好一些，没有出现空头扎堆的情况。今天特总又在打暧昧牌，又是“和伊朗谈的很好，但谈", "url": "https://www.zhihu.com/pin/2065479773028192386", "votes": 0, "comments": 12, "feed_ts": 1785231249, "feed_time_str": "07-28 17:34", "category": "pin", "cat_name": "想法动态"}, {"actor": "正解局", "verb": "MEMBE ———国内包括网络完全不会反驳官媒（其实网络上对于官媒说的错误的地方也是有反驳和批评的，但他们不知道） ————国内媒体完全在自说", "url": "https://www.zhihu.com/question/2045840923368633918/answer/2063989657709421082", "votes": 125, "comments": 119, "feed_ts": 1785222069, "feed_time_str": "07-28 15:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "现今越友对末代总统杨文明的评价（机翻）：总体而言，在南方政权垮台之前，很难找到任何值得称道的政治形象。或者说，正因如此，它才最终垮台。当然，为了公平和客观，也必须承认，在南越的政治家和将领队伍中，并非没有“正派”、有良知的人。他们没有加入革命阵营，可能是出于政治立场、出身背景或生活方式……别无选择，他们被迫站在了“国家”一边。虽站在“国家”一方，但他们并不憎恨革命，甚至以自己的方式对革命抱有敬意。其中一些人还是革命的秘密据点，或在一定程度上协助革命；另一些人则保持中立。他们渴望一个独立、富足的国家，或许不愿接受共产主义制度，但也绝不愿屈从于外国的统治。然而，在南方那片政治泥沼中，这些人无力改变局势。为了保持良心的清白，他们在政治上处于孤立无援的境地。也正因为不愿卷入那些肮脏之事，他们没有自己的派系。因此，在反对独裁、反对腐败的斗争中，他们束手无策……这一趋势的代表人物之一是杨文明将军。他在南越政坛颇具声望。大家都公认他为人清正廉洁，不愿依附外国，反对独裁，不贪图权位，也不贪污腐败。他虽想远离污秽，却不得不身处其中。他因品格高尚而备受尊敬，但在政治上却十分孤立。正因享有声望，他才得以完成一些具有历史意义的事业。其中之一便是他率领将领集团推翻吴廷琰政权，甚至还是决定彻底铲除这一独裁政权的关键人物之一。但他也没能执政多久。他领导的政府仅维持了3个月，随后阮庆将军的政变又将南越推回了原本的泥潭。十多年后，当西贡政权走向末路，无人愿再坐上总统之位时，人们纷纷逃离，只得推举他出任。此时，对他而言，已不再是个人权力和利益的问题，而是为了挽救越南的和平。他担任总统仅数日。在这几天里，他做了一些有益之事：为推动战争早日结束、早日实现和平与国家统一作出了贡献。武文杰：“在西贡政权的政治人物中，杨文明算是相对‘清白’的一位。南方解放后不久，我就要求同志们汇报西贡政权政要和将领们的财产情况。我没想到杨文明的财产竟然如此之少，仅相当于南方一个中产阶级的财产。后来，我们安排他出境。我去法国时，首先探望的就是杨文明的家人。后来，当杨文明去世时，我们曾前往位于武文谭街的杨文明家族纪念馆吊唁。我看到许多我们的干部同志——这些共产党员——也前来吊唁杨文明。“这意味着，无论对方身处何方，我们依然懂得珍视那些有良知的人……”。", "excerpt": "现今越友对末代总统杨文明的评价（机翻）：总体而言，在南方政权垮台之前，很难找到任何值得称道的政治形象。或者说，正因如此，它才最终垮台。当然，为了公平和客观，也必须承认，在南越的政治家和将领队伍中，并非没有“正派”、有良知的人。他们没有加入革命阵营，可能是出于政治立场、出身背景或生活方式……别无选择，他们被迫站在了“国家”一边。虽站在“国家”一方，但他们并不憎恨革命，甚至以自己的方式对革命抱有敬意。", "url": "https://www.zhihu.com/pin/2065429267488436954", "votes": 0, "comments": 2, "feed_ts": 1785221744, "feed_time_str": "07-28 14:55", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "韩国股市跌到熔断，SK海力士跌超13%，纳指四连跌，美股芯片股全线大跌，如何看待全球半导体集体抛售？", "excerpt": "韩国半导体和美国半导体，之前是你涨，我也涨；现在变成你跌，我也跌。 之前三星和SK海力士疯涨，其实就是美股半导体最后一股肾上激素。 后来韩国股民最疯的时候，韩国监管又批准了跟踪这两个内存股的单只股票杠杆ETF，再给市场加杠杆。 结果韩国股 毫无疑问，伊朗战争和油价是中期选举最关键的因素。", "excerpt": "民众体感往往比实际情况更恶劣。这下川川重蹈凳子24年的覆辙了。毫无疑问，伊朗战争和油价是中期选举最关键的因素。", "url": "https://www.zhihu.com/pin/2065114705983755389", "votes": 0, "comments": 23, "feed_ts": 1785218239, "feed_time_str": "07-28 13:57", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "UFO", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "关于王虹，有哪些广为流传的谣言？", "excerpt": "有的人为了贬低王虹的水平，居然开始比高考成绩了，而且好死不死非要搬出韦东奕来。 众所周知，韦东奕的语文英语差的一塌糊涂，别说北京大学了，就他那个重点高中，都是看在他数学好的面子上，破格招录的。 但是高考尤其清北，讲究的是总分，单科满分并没有什么用处。比如，我班上就有人单科满分，然而总分差了我50分。我们省的状元，比我高50分，但一个满分都没有。 韦东奕如果参加高考，别说上北大了，能不能超过500分", "url": "https://www.zhihu.com/question/2065367120884524596/answer/2065431079989810703", "votes": 41, "comments": 12, "feed_ts": 1785217144, "feed_time_str": "07-28 13:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "冷哲", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "女装退货率高达 80%已成常态，这背后的原因是什么？", "excerpt": "简单回答：因为女装大多是审美性服饰，而男装大多是功能性服饰。 男人买衣服，大多数情况下，只起到一个功能性的作用，好看不好看是次要的。尺码不完全对，都可以妥协，“也不是不能穿”。所以之前可以到处都是格子衫，现在也到处都是T恤，尤其是公司发T恤了，就更是天天穿月月穿。 而目前大多数女性买衣服，都要追求好看。 好看这个东西，真讲起来可就麻烦得很了。 首先，每个人的体型都不一样。同样一件衣服，在两个身高差", "url": "https://www.zhihu.com/question/2064270628363015013/answer/2065430967381242346", "votes": 775, "comments": 50, "feed_ts": 1785217117, "feed_time_str": "07-28 13:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "据我所知，明清史和近代史里做经济史、社会史、情感史的很常见，并不是什么稀奇的现象，这段时期的中国一样有大量的私人文本，当然这并非我的专业方向，在此不展开。而如果说上古中国缺乏这类材料，这一点当然成立，那请问古典时期和希腊化时期又有什么“海量的私人日记、书信、法庭档案、教区记录、商业账本”呢？我们有关公元前5 世纪希腊的描述所存在的缺陷主要并不是因为由于偶然因素而丧失了许多细微文献，更多地是由于这幅画面主要关注的是雅典这座城邦中为数不多的一小群人。公元前5世纪的雅典在雅典公民看来是怎样的，我们知道得很多；可是在斯巴达人、科林斯人、底比斯人眼中的雅典是怎样的，我们却几乎一无所知——更不用说波斯人，或者说奴隶，或者说那些居住在雅典的非雅典公民是怎样看待雅典的了。正如约翰·伯瑞所言：“古代、中世纪史的文献记载到处是漏洞。”中国历史学的政治化显而易见，古典中国的史书确实很大程度上就是经学，或者说为帝国意识形态背书的报告文学，我在这一点上向来不留情，对这套道德垂训也并无好感。但觉得“西方历史拒绝充当任何共同体的记忆工具”，存在超脱的价值中立，这恰恰是20世纪西方历史学批判的观点。但凡读过一点海登·怀特和柯林伍德也不会有这种错觉。乔治・克拉克爵士在1957年回应阿克顿勋爵是这样说的：“既然全部历史判断都涉及不同的人和不同的观点，而且此人的观点与彼人的观点又各有千秋，因此，并不存在‘客观的’历史事实。”兰克确实主张wie es eigentlich gewesen，可聚贝尔和特赖奇克不恰恰是给普鲁士和小德意志服务的吗？“历史服务于民族国家”可不是什么中国传统，恰恰是启蒙理性的产物。当然这篇回答的基调——历史学有一个“从低级（政治化）向高级（客观化）进化”的必然方向——本身就是很19世纪的观念，预设了一个绝对正确的理想乌托邦。为政治服务，或者标榜自己客观中立，本质上都是一种叙事和立场，没有绝对的高低优劣之分。哪怕我作为历史生，在态度和情感上也偏向后者，但我也不觉得前者的存在就是应该被消灭和优化的——既然这么多人都相信和参与这种仪式和知识生产，那它存在的语境和背景，就是值得分析的。答主在批判政治决定论的同时，却虔诚地信奉着另一种科学决定论，这就是波普尔在《历史决定论的贫困》中所批判的对象。只要一个系统能完成物质和意义的再生产，它就有权利存在。人本来很大程度上就是活在符号意义里的生物，而意义是主观的。", "excerpt": "据我所知，明清史和近代史里做经济史、社会史、情感史的很常见，并不是什么稀奇的现象，这段时期的中国一样有大量的私人文本，当然这并非我的专业方向，在此不展开。而如果说上古中国缺乏这类材料，这一点当然成立，那请问古典时期和希腊化时期又有什么“海量的私人日记、书信、法庭档案、教区记录、商业账本”呢？我们有关公元前5 世纪希腊的描述所存在的缺陷主要并不是因为由于偶然因素而丧失了许多细微文献，更多地是由于这幅", "url": "https://www.zhihu.com/pin/2065429431078876603", "votes": 0, "comments": 30, "feed_ts": 1785216987, "feed_time_str": "07-28 13:36", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "曹小灵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "那个贫困生每天喝9.9元的瑞幸，是真的需要，还是虚荣？", "excerpt": "这事儿非常不好讨论。 因为这事儿的实质是，合规不合情，但这个情，没法定量。 合规，很直白，助学金认定的是经济能力，不是消费模式。国家有规定，满足一定标准的就可以申请。这里的标准主要看的是家庭收入、财产、负债、负担（比如突发变故和父母生病），只要认定，学生本人和家庭难以满足在校期间的生活基本支出，就够格。 后续该不该监督？ 当然应该，但做的应该是资质审核，而不是消费细节追凶？ 一个很现实主义的情况就", "url": "https://www.zhihu.com/question/2063012380813025672/answer/2065424936626402416", "votes": 106, "comments": 76, "feed_ts": 1785215679, "feed_time_str": "07-28 13:14", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "两人分1亿元。对方给自己9900万，只给你100万。若你拒绝那么双方都会失去全部收益。你会接受吗？", "excerpt": "换个角度，你可以0成本让一个亿万富翁倾家荡产。 对方只愿意花100万收买你，但没法动用亿万富翁的影响力干扰你（钱没到账）。 这次交易的主动权在你手上，你怕个锤子？ 要么五五分成，要么爆了。急的不是你，是他。 ", "url": "https://www.zhihu.com/question/2053881435111551640/answer/2055710840955967383", "votes": 264, "comments": 18, "feed_ts": 1785215163, "feed_time_str": "07-28 13:06", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "两人分1亿元。对方给自己9900万，只给你100万。若你拒绝那么双方都会失去全部收 const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'

        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {

    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {

  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';

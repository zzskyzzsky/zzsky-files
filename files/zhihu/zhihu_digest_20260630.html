str": "06-30 03:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Microsoft Foundry 中的 Claude 现已可用对于已经在用微软云的企业开发者和采购来说，这条值得关注。Claude in Microsoft Foundry 正式 GA，不再是 Preview 阶段。说人话就是：符合条件的 Azure 客户，现在可以在 Microsoft Foundry 里部署 Claude Opus 4.8 和 Claude Haiku 4.5，费用走统一云账单。这个集成的真正价值不在模型本身，在于流程省了多少事。(1) 使用你现有的 Azure 账号体系，认证、网络治理和安全策略可以复用。(2) 月底一张微软发票搞定所有费用；有 Microsoft 企业协议的公司，Claude 用量还能直接冲抵现有的 Azure 承诺消费额度。这里不是“所有 Azure 用户都能用”。Microsoft 文档写得很清楚：要用 Claude in Microsoft Foundry，订阅需要有有效付款方式，billing account 所在国家或地区也必须在 Anthropic 支持购买模型的范围内。部署位置上，所有 Claude 模型支持 Global Standard 的 East US2 或 Sweden Central；Claude Opus 4.8 的 hosted on Azure 版本还支持美国 Data Zone Standard。换句话说，如果你说的是国内 Azure 账号，或者 Azure 国内环境，不是默认这条链路已经可用。真正落地前要先看三件事：你的账单地区是否支持 Anthropic、你的订阅类型是否支持 Marketplace 购买、你能不能在对应部署区域创建 Foundry 项目。部署方式有两种，选错了会卡住Anthropic 给的不是单一选项。一种叫 hosted on Azure，数据区在美国，完全跑在 Azure 环境里，适合对现有合规体系依赖度高的团队。另一种叫 hosted on Anthropic，API 功能更全，模型更新更快，但需要等后续同步到 Azure 侧。官方措辞是“未来会逐步实现功能与模型的对齐”，眼下得按需取舍。谁已经在上边跑了素材页面引用了两家企业的说法。NVIDIA 说他们每天都在用自主 AI Agent 帮团队更快推进工作，并认为 Claude 的推理、编码和企业能力适合复杂技术任务。Bolt 的 VP 则提到，在 Azure 上跑 Claude 给了他们财富 500 强客户期望的稳定吞吐和可靠性。首批上线的能力通过 Messages API 调用，支持提示缓存和扩展思考，覆盖编程、Agents 和强推理场景。想动手的可以直接去 Azure Foundry 搜 Claude，或者翻官方文档。这个集成的核心是采购和审计流程的减负。如果你公司已经在 Azure 上有资产沉淀，而且账单地区、订阅和部署区域都满足条件，这是一条切入成本低的路径。", "excerpt": "Microsoft Foundry 中的 Claude 现已可用对于已经在用微软云的企业开发者和采购来说，这条值得关注。Claude in Microsoft Foundry 正式 GA，不再是 Preview 阶段。说人话就是：符合条件的 Azure 客户，现在可以在 Microsoft Foundry 里部署 Claude Opus 4.8 和 Claude Haiku 4.5，费用走统一云账", "url": "https://www.zhihu.com/pin/2055115180204351641", "votes": 0, "comments": 0, "feed_ts": 1782757673, "feed_time_str": "06-30 02:27", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Cursor iOS 版上线Cursor 发了 iOS Beta版(类似Codex的IOS版一样)重点不是让程序员在手机上敲代码。真正的变化是：手机变成一个 Agent 控制台。你可以在路上启动云端 Agent，也可以远程接管电脑上已经跑起来的 Agent。手机不写代码，但能派任务官方给了两种模式：一种是 Remote Control。Agent 仍然跑在你的电脑上，手机负责继续指挥。前提是电脑要保持唤醒，Cursor 也要开着。另一种是云端 Agent。它运行在隔离虚拟机里，有完整开发环境，可以异步跑更久，直到产出可审查的 PR。所以它解决的不是“手机能不能写代码”，而是“人离开电脑后，Agent 的工作还能不能继续推进”。进度不用一直盯着Cursor iOS 会用 Live Activities 和推送同步状态。Agent 完成任务、需要输入、进入待审查状态时，手机都会提醒。完成后，你可以在手机上看演示、截图、日志和代码变更，也能检查 diff、继续补指令，或者直接合并 PR。外出场景更像调度台官方博客里列了几个典型场景：(1) 值班时午餐收到告警，用手机启动 Agent 排查问题，回到电脑前已经有待审查的 PR。(2) 离开工位时客户报紧急缺陷，用手机让 Agent 复现问题、检查代码并推进修复。(3) 在 X 或其他 App 看到用户反馈，截图标注后发给 Agent，作为视觉上下文发起设计或 UI 修改。本地和云端能来回切它还支持把本地规划发送给云端 Agent，或者把正在运行的 Agent 迁移到云端继续执行。反过来也可以把云端会话切回电脑，方便合并前先在本地测试。我的判断是，这个 iOS 版更像“离开工位后的工作流补丁”。它不会替代桌面端，也不是为了让你在手机上长时间写代码；它更适合那些已经习惯让 Agent 跑任务、但不想每次都守在电脑前的人。现在还是公开 Beta。官方 X 帖写到，Composer 2.5 在 App 内 75% 折扣，截止到 7 月 5 日。", "excerpt": "Cursor iOS 版上线Cursor 发了 iOS Beta版(类似Codex的IOS版一样)重点不是让程序员在手机上敲代码。真正的变化是：手机变成一个 Agent 控制台。你可以在路上启动云端 Agent，也可以远程接管电脑上已经跑起来的 Agent。手机不写代码，但能派任务官方给了两种模式：一种是 Remote Control。Agent 仍然跑在你的电脑上，手机负责继续指挥。前提是电脑要", "url": "https://www.zhihu.com/pin/2055111283121431380", "votes": 0, "comments": 0, "feed_ts": 1782756724, "feed_time_str": "06-30 02:12", "category": "pin", "cat_name": "想法动态"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价李新野6月28日的文章《必须停止歧视》？", "excerpt": "之前有一次李新野帮满蒙八旗说了一句话，我说他不是真皇汉。 但是这篇文章写得好，我收回我对他之前的评价，他可能只是对明末的历史不够了解。从这篇文章看，他的立场没问题。 写的很好。 ", "url": "https://www.zhihu.com/question/2054856738541663434/answer/2055108166787061379", "votes": 242, "comments": 6, "feed_ts": 1782755969, "feed_time_str": "06-30 01:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "LoopWM把同一块Transformer反复用，世界模型参数效率最高提升100倍\n图文版：链接LoopWM的核心改动FaceMind Research Asia 发布的《LOOPED WORLD MODELS》不是继续堆更深的世界模型，而是把一个参数共享的 Transformer 块循环用于 latent dynamics。论文称这是首个用于 world modelling 的 looped transformer 架构，目标是在不按层数线性增加参数的情况下，提高有效计算深度，并让模型按转移难度分配推理计算。为什么不是只看架构图文章补回了关键效果表。ScienceWorld world modelling task 上，约 1B 参数的 Looped World Model 总体达到 EM 68.4%、Token F1 85.3%、BLEU-4 80.7%、Entity 83.9%；同表中的 claude-opus-4-6-max 为 EM 47.2%、Token F1 72.8%、BLEU-4 64.4%、Entity 72.3%。表3还给出 qwen-3.5-flash 与 gemini-3-flash-preview-thinking 基线，说明效果判断不能只停留在“参数效率最高100倍”这句摘要结论上。边界在哪里谱约束状态保留机制能帮助循环隐状态保持有界，但这不等于任意长程预测都准确；自适应计算也只有在简单转移占比较高、early-exit开销可控时才更划算。更稳的读法是：LoopWM把“迭代隐式深度”作为模型规模和训练数据之外的新扩展轴，值得跟踪，但不能外推为通用世界模型问题已经解决。原文标题：LOOPED WORLD MODELS#无影寺 ", "excerpt": "LoopWM把同一块Transformer反复用，世界模型参数效率最高提升100倍\n图文版：链接LoopWM的核心改动FaceMind Research Asia 发布的《LOOPED WORLD MODELS》不是继续堆更深的世界模型，而是把一个参数共享的 Transformer 块循环用于 latent dynamics。论文称这是首个用于 world modelling 的 looped t", "url": "https://www.zhihu.com/pin/2055107231264388138", "votes": 0, "comments": 0, "feed_ts": 1782755862, "feed_time_str": "06-30 01:57", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "DeepMind新框架让AI设计实验样本效率提升5-10倍图文版：链接Google DeepMind的ATLAS框架让AI自动设计实验来破解另一个AI的算法，相比随机实验，样本效率提升了5到10倍。ATLAS通过“假说生成—实验优化—实验执行”的闭环来工作。它维护一个模型“委员会”，刻意设计让这些模型分歧最大的实验，从而用最少的数据锁定真实机制。在区分两种强化学习agent时，优化出的实验序列呈现人类专家不常用的块状结构和反常奖励遗漏，却有效拉开了agent的策略差异。从行为预测、计算图恢复到动态模拟三个维度评估，ATLAS仅用随机实验五分之一到十分之一的实验量就达到同等甚至更优的性能。与认知科学家依据文献专门设计的固定实验序列相比，ATLAS同样实现了匹配或超越。论文指出，目前这些结果仅在模拟的强化学习agent上验证，实验限定在二元奖励的多臂bandit任务内。主动学习仍面临模型误设风险：如果真实机制不在假设空间内，可能陷入偏误循环。但ATLAS的核心启示在于，当模型间的分歧源于真正可解释的机制差异而非参数噪声，这种“争吵”就能转化为高效的科学实验设计。这一框架展示了在认知科学等依赖机制模型发现的领域中加速获取人类可解释洞见的潜力。原文标题：ATLAS: Active Theory Learning for Automated Science#无影寺 ", "excerpt": "DeepMind新框架让AI设计实验样本效率提升5-10倍图文版：链接Google DeepMind的ATLAS框架让AI自动设计实验来破解另一个AI的算法，相比随机实验，样本效率提升了5到10倍。ATLAS通过“假说生成—实验优化—实验执行”的闭环来工作。它维护一个模型“委员会”，刻意设计让这些模型分歧最大的实验，从而用最少的数据锁定真实机制。在区分两种强化学习agent时，优化出的实验序列呈现", "url": "https://www.zhihu.com/pin/2055106645064209047", "votes": 0, "comments": 0, "feed_ts": 1782755727, "feed_time_str": "06-30 01:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价IDF公布辛瓦尔死前的录像？", "excerpt": "全世界的以友都在知乎 ", "url": "https://www.zhihu.com/question/1249701755/an hu.com/question/2987085220/answer/1985331425021564280", "votes": 23, "comments": 0, "feed_ts": 1782750393, "feed_time_str": "06-30 00:26", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "大礼议中为什么杨廷和一定要让嘉靖认孝宗为父？究竟争的是什么？", "excerpt": "谢邀，姑妄一答。 大礼议，议的首先是个『礼』。我们先不谈什么文官集团的自身利益，只谈『礼』。 按祖训，都是父死子继，兄终弟及，并安长幼排序。孝宗死，其长子武宗继，这是没有问题的；但武宗死了，没留下半个皇子，就没有子继。那么，按下一个顺序，应是长弟及，但孝宗只有一个儿子，武宗没有任何亲弟，弟及这边也没人来及。 那么该找谁来继承大统？ 如果武宗平辈中其他兄弟中有嫡子的，可以先过继给武宗，然后以皇子身份", "url": "https://www.zhihu.com/question/34882977/answer/60319829", "votes": 1007, "comments": 284, "feed_ts": 1782748777, "feed_time_str": "06-29 23:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何让男性明白女性的逻辑是什么？", "excerpt": "有七个九五后女生在惠东花了70万开了一家7C咖啡店。 她们在拍摄的创业vlog里面说七个人是相识多年的好闺蜜，在各自的赛道上早已闪闪发光。 但优秀从不是终点，而是奔赴下一场热爱的底气，所以七个人合伙开了这家咖啡馆。 问题这不就来了吗，这七个小仙女谁冲咖啡谁扫地？ “我都闪闪发光了，你让我给人端茶倒水，你怎么不去啊？” 她们的咖啡厅七个老板，一个员工没有，七个人天天想着怎么坐家里吹空调，不上班就分红", "url": "https://www.zhihu.com/question/13551734078/answer/2055077977638036642", "votes": 554, "comments": 75, "feed_ts": 1782748772, "feed_time_str": "06-29 23:59", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待腾讯市值蒸发万亿，腾讯押宝姚顺雨是最大的失误吗？", "excerpt": "那为啥搞出 Qwen 的阿里和搞出 MiMo 的小米也在跌呢，而且跌的比腾讯还多？ 这这这，你还不如问『姚顺雨押宝腾讯是最大的失误吗』？ 做的不错，你是在腾讯，掌握微信私域流量，本来就该遥遥领先。做的不好，你是在腾讯，掌握微信私域流量，居然还还干不过豆包。资本现在想讲的故事是 AI 神话，但是这个故事的主角却绝对不能是腾讯、阿里、小米这些老登。 今年的 AI神话是本质上是期权神话，资本希望用AI神", "url": "https://www.zhihu.com/question/2053153048579594094/answer/2055077612544864463", "votes": 110, "comments": 12, "feed_ts": 1782748684, "feed_time_str": "06-29 23:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为何这么多人讨厌《圣斗士星矢》里的女神雅典娜？", "excerpt": "车田正美设计女神雅典娜就是日本天皇，天皇是仁慈的，错也都是武士的错。", "url": "https://www.zhihu.com/question/564235262 47", "votes": 739, "comments": 48, "feed_ts": 1782746130, "feed_time_str": "06-29 23:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "晨星", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么各行各业都卷，而我觉得公务员工作不卷？", "excerpt": "告诉你一个可能有点反直觉的知识点：当下社会上出现的内卷、形式主义等问题，在一定程度上都是体制内的溢出效应导致的。东大是一个典型的大政府国家，官方掌握着公共资源分配、政策导向设定的绝对权力，其运行逻辑会通过 “政策传导”“资源绑定”“行为示范” 等方式，对市场主体、社会组织乃至个人行为产生影响。 简而言之，当下各行各业的内卷，有一部分原因，就是体制内的内卷示范和带动的。 将公务员工作等同于 “轻松不", "url": "https://www.zhihu.com/question/662139449/answer/1956281615656399150", "votes": 1776, "comments": 207, "feed_ts": 1782746075, "feed_time_str": "06-29 23:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "游千界", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "日本人是真的对中国充满偏见吗？如果是，有没有什么好办法改变呢？", "excerpt": "我在日本留学时听过最离谱的一句话，是一个东京女生认真问我：你回中国会很容易当精英吧？毕竟中国聪明人应该没那么多。 我说，你想多了，真正厉害的人，很多还在国内往上冲。头部公司的一轮面试里，随便翻几份简历，都能看见名校，竞赛堆在一起。我这种履历放进去，面试官扫两眼，连水都懒得让我喝完。 她捏着杯子的手停了一下，过了几秒才哦了一声，旁边烤盘上的牛舌已经焦了一点，她赶紧拿夹子翻面，话题就这么岔开了。 她问", "url": "https://www.zhihu.com/question/426475477/answer/2055051241869334230", "votes": 54, "comments": 8, "feed_ts": 1782742397, "feed_time_str": "06-29 22:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为何欧洲还是不大面积安装制冷空调？", "excerpt": "让7亿欧洲人用上空调，是地球环境不可承受的灾难。为了地球的环境，希望他们再坚持一下。", "url": "https://www.zhihu.com/question/1935002632868573447/answer/2054894323586671185", "votes": 3349, "comments": 52, "feed_ts": 1782742362, "feed_time_str": "06-29 22:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "洪武型制度的代价：大明宝钞、低正税高摊派与明代国家能力倒退", "excerpt": "序在我国历史上，明代与汉、唐相比较，并不是一个值得骄傲的时代。但作为研究对象，它却具有与汉、唐同样的价值。即使从功利主义的研究态度出发，也仍有可能导致这样的结论。因为，我国在鸦片战争以后之所以经常处于被侵略和失败的境地，清政府的腐败无能自然不能辞其咎，但如果历史地进行考察，那么，清代有许多事情其实是在明代种下的因，甚至是在朱元璋统治时期就种下的因。在使我国逐渐陷入悲惨处境这一点上，明、清都是关键…", "url": "https://zhuanlan.zhihu.com/p/2041510901724046599", "votes": 562, "comm 3831515008496055/answer/2054975485776492016", "votes": 1, "comments": 0, "feed_ts": 1782724336, "feed_time_str": "06-29 17:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "ICML 2026｜上智院、上交大、复旦联合提出FLAG扩散框架，还原空间转录组的基因-空间双重结构", "excerpt": "作者 | 女娲生命大模型团队 编辑丨ScienceAI 空间转录组学（Spatial Transcriptomics, ST）能在保留细胞空间位置的同时测量基因表达，对解析组织微环境与疾病微生态至关重要，但测序成本高、通量低。相比之下，H&amp;E 染色的全切片图像（WSI）在临床中比较容易获取。因此，「以图测谱」，即直接从常规病理图像预测空间基因表达正成为连接低成本影像与高维分子信息的关键桥梁", "url": "https://zhuanlan.zhihu.com/p/2054973754439218062", "votes": 1, "comments": 0, "feed_ts": 1782724115, "feed_time_str": "06-29 17:08", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么有些小学生对「找规律」题感到特别困惑？", "excerpt": "因为找规律这种题本身就是硬造出来的，给定一个数列本来就有无穷种意义下的“下一个”喵。就算你要求奥卡姆剃刀原则，即“选择那个最简单的通项数列”，在不同代价函数定义下都有 具有天壤之别的“最简单”或者“最好的”那个公式喵。在数学中，有一个叫做 拉格朗日插值定理的东西喵。简单来说，它指的是，给定任何 n 个数字，如果你指定了 n+1 个数字，你总能找到一个最高不超过 n 次的多项式来过拟合这全部 n+1", "url": "https://www.zhihu.com/question/2050822597189842279/answer/2054384672596038562", "votes": 745, "comments": 89, "feed_ts": 1782722951, "feed_time_str": "06-29 16:49", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "“端午安康”是个啥玩意？", "excerpt": "我一想到前几年我被人一本正经的科普，端午节要说“端午安康”，我都无语了！我小时候从来没有听过什么端午安康这种说法，活了半辈子竟然被一群小孩哥给教育了。以前总有人说历史是可以发明的，我还不相信，通过这个案例，我现在也是有点动摇了。 今天刷到峰哥这个帖子，很有共鸣。 这确实是近年来的一个集体癔症： 端午节不能说快乐，而要说安康，理由这是一个祭祀活动。这个怪现象来得莫名其妙，不知所以，但却迅速在全社会蔓", "url": "https://zhuanlan.zhihu.com/p/2051424984158024941", "votes": 1888, "comments": 545, "feed_ts": 1782722912, "feed_time_str": "06-29 16:48", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价普京建议乌俄双方均停止打击对方领土的纵深目标？", "excerpt": "乌克兰要是脑子抽了才会答应。 乌克兰大绝部分高价值经济目标，国防目标都已经被俄国导弹和无人机犁地好几遍了。 但你京子纵深地带的高价值单位还多的是。 现在乌克兰摆明了欺你京子不敢打击乌克兰的外挂血包，整个北约，甚至日韩澳新之流 const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

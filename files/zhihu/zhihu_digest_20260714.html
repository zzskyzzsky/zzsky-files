忆之门在复杂的数据世界中，时间与顺序对于理解信息至关重要。LSTM（长短期记忆网络）不仅仅是算法，更像是机器的时光机，捕捉、存储并有效地处理序列数据。温故知新，从经典论文中洞悉LSTM的核心原理，深刻理解它是如何捕捉时间的细微脉络，在众多实际应用中发挥关键作用。", "excerpt": "【LSTM模型】穿越时空隧道，打开记忆之门在复杂的数据世界中，时间与顺序对于理解信息至关重要。LSTM（长短期记忆网络）不仅仅是算法，更像是机器的时光机，捕捉、存储并有效地处理序列数据。温故知新，从经典论文中洞悉LSTM的核心原理，深刻理解它是如何捕捉时间的细微脉络，在众多实际应用中发挥关键作用。", "url": "https://www.zhihu.com/pin/2060172216952787721", "votes": 0, "comments": 0, "feed_ts": 1783963332, "feed_time_str": "07-14 01:22", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "DataComp-VLM 用160个数据集发现 VLM训练更该调配比而非过滤\n图文版：链接训练VLM时，数据已经来自公开整理的数据集，还该优先继续花预算做过滤，还是先调整不同类型数据的比例？DataComp-VLM用160个公开数据集、约6T多模态token构成可控数据池，覆盖图像-文本对、多模态文档、纯文本和指令调优数据，并在1B–8B模型、6.25B–200B token的规模范围内比较过滤、混合、格式和采样策略。结果显示：对已经过上游筛选的数据池，多种下游过滤没有稳定显著地超过不过滤基线；相反，数据类型配比更能拉开差距，指令密集型混合会随模型和训练token增长而更占优。基于这一结果，DCVLM-BASELINE采用10%图像-文本对、5%多模态文档、15%纯文本和70%多模态指令数据。它在33项Core评估中，8B/200B token达到63.6%，比FINEVISION高5.4个百分点；4B/100B token达到58.9%，略高于FINEVISION 8B/200B token的58.2%，该对照相当于减少约四分之三训练计算量。预训练与后续SFT表现的Pearson相关系数为0.99，但这不代表任意VLM都适用：结论只验证到8B、200B token，且不应外推到从原始网页开始构建、噪声更高的数据池。对训练者的实际启示是，先在多个规模点验证配比，再评估额外过滤的边际收益。原文标题：DataComp-VLM: Improved Open Datasets for Vision-Language Models#无影寺 ", "excerpt": "DataComp-VLM 用160个数据集发现 VLM训练更该调配比而非过滤\n图文版：链接训练VLM时，数据已经来自公开整理的数据集，还该优先继续花预算做过滤，还是先调整不同类型数据的比例？DataComp-VLM用160个公开数据集、约6T多模态token构成可控数据池，覆盖图像-文本对、多模态文档、纯文本和指令调优数据，并在1B–8B模型、6.25B–200B token的规模范围内比较过滤、", "url": "https://www.zhihu.com/pin/2060167176431183438", "votes": 0, "comments": 0, "feed_ts": 1783962238, "feed_time_str": "07-14 01:03", "category": "pin", "cat_name": "想法动态"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你们为什么相信三通一达？", "excerpt": "其实你对这个社会了解多了就会发现，精神小妹性生活也很开放。 怀孕堕胎更不奇怪了，孩子爹都不一定能弄清楚是谁。 二次元coser也可能是比较开放的。 各种亚文化圈子，都不会特别压抑。 所以在这个地球上，外国人可以，黄毛可以，摄影师可以，但是唯独被传统中国家庭、学校、社会道德规范驯化的男性不行。 能明白这其中的含义吗？ 不明白的话我换一种说法，距离中国儒教文化越近，距离性生活越远。 中国传统文化，是把", "url": "https://www.zhihu.com/question/2004327993074528490 种泄露方式也太弱智了 四个对应的颁奖人是Chris Sogge，Jonathan Pila，Yakov Eliashberg，Gigliola Staffilani。至少ai跟我说的是一一对应的，仅供参考 下面是我用ai", "url": "https://www.zhihu.com/question/2043103002907738805/answer/2060112367762126119", "votes": 1362, "comments": 172, "feed_ts": 1783960451, "feed_time_str": "07-14 00:34", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "verifiers v1让agent训练环境可复用训练 agent 做强化学习或评测时，最容易被反复重写的是环境：换一个任务集、执行器或沙箱，任务逻辑、运行方式和资源回收常常绑在一起。Prime Intellect 发布的 verifiers 0.2.0 预览了重写后的 verifiers.v1，重点不是再造一个 agent，而是把这三部分拆开。任务、执行器和运行环境各管一件事taskset 定义任务本身，包括数据、工具和评分；harness 决定 agent 怎么完成任务，例如 ReAct 循环、Codex、Kimi Code 或自定义执行程序；runtime 则提供实际运行位置，可以是本地 subprocess、Docker，也可以是 Prime Sandboxes、Modal 等远程沙箱。同一个 taskset 可以配兼容的不同 harness，并运行在不同 runtime 中，任务逻辑不必跟某个执行器或沙箱绑定。框架接管沙箱生命周期旧版环境需要开发者自己决定何时启动沙箱、怎样处理短暂的基础设施错误、何时清理资源。v1 把这些收进 Runtime：环境开发者主要调用 run、read、write，框架为每个 rollout 准备隔离 runtime 并处理生命周期。本地 subprocess 和 Docker 适合调试、小型实验；官方不建议用它们承担生产规模训练或评测，远程 sandbox 才能横向扩展。拦截服务器把轨迹留给训练agent 在 runtime 中向推理服务发请求时，请求会经过 verifiers 管理的 interception server。它会转发请求和响应、记录完整 trace，还能为原本不暴露设置的 harness 指定采样参数，或拦截并改写服务端工具响应以缓解 reward hacking。v1 的 trace 用消息图保存上下文：每条消息只存一次，避免旧版每轮重复保存整段 prompt 和回复；遇到压缩上下文或调用子 agent 时，分支也能成为独立训练样本。Harbor 和训练配置怎么接Harbor 是 v1 首个完整支持的第三方 taskset 格式。接入已注册的 Harbor 数据集时，配置里指定数据集名称即可自动加载数据和继承奖励函数；官方内部测试称，在第三方 harness 上跑同一任务时没有额外开销。NeMo Gym 和 OpenEnv 目前仍是 alpha 支持。官方还给出一份训练配置：GLM-4.5-Air 在自定义 harness 中使用 ScaleSWE 训练、用 SWE-Bench-Verified 评估，6 个 H200 节点跑 2 天做长度惩罚消融。这是官方的配置示例，不是独立第三方性能结论。", "excerpt": "verifiers v1让agent训练环境可复用训练 agent 做强化学习或评测时，最容易被反复重写的是环境：换一个任务集、执行器或沙箱，任务逻辑、运行方式和资源回收常常绑在一起。Prime Intellect 发布的 verifiers 0.2.0 预览了重写后的 verifiers.v1，重点不是再造一个 agent，而是把这三部分拆开。任务、执行器和运行环境各管一件事taskset 定义", "url": "https://www.zhihu.com/pin/2060152857119159025", "votes": 0, "comments": 0, "feed_ts": 1783958734, "feed_time_str": "07-14 00:05", "category": "pin", "cat_name": "想法动态"}, {"actor": "晨星", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《争洛阳》票房不佳，《星三国》弃拍续集，以曹操为主角的三国电影究竟出路何在？", "excerpt": "没出路，弃疗吧。 明清之后独尊刘葛可以归功于《三国演义》的巨大影响力，瞅瞅之前呢？ 现存三国题材元杂剧数量不少，基本蜀汉一统天下，东吴靠着周瑜偶尔露脸，曹操为主角的剧呢？ 0 竟然是个0呐！(╥_╥) 唯一疑似的是《相府院曹公勘吉平》，由于全本散佚，无法确认曹操是否是主角。话说回来，即便是主角，瞅瞅这题目就知道老曹在剧中是个什么德行╮(︶﹏︶)╭ 再往前看看？ 苏东坡那会儿已经是:【至说三国事，闻", "url": "https://www.zhihu.com/question/2059762739908817212/answer/2059957830896112194", "votes": 899, "comments": 133, "feed_ts": 1783958475, "feed_time_str": "07-14 00:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待 SpaceXAI 的 Grok Build 被曝默认静默上传完整 Git 仓库？", "excerpt": "马斯克评级已下调到马÷，这下内容包含剧透了： 阿里内部将全面禁用 Claude Code，因存在植入后门风险，可能会带来哪些连锁反应？说 Cursor 也干了的，建议先去看看 RAG 的原理，否则视为搅混水给马圣，哦不，马畜洗地。 需要建立云端向量数据库的说法压根说不过去，普通的代码检索压根不需要 git history。 Cursor 等正常工具的做法是在本地用 tree-sitter 将代码解", "url": "https://www.zhihu.com/question/2059755445468902035/answer/2060151349837312457", "votes": 147, "comments": 7, "feed_ts": 1783958358, "feed_time_str": "07-13 23:59", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "微软 CEO：企业用 AI，也要守住学习痕迹一个团队接入 AI 后，最先积累的往往不是模型参数，而是 prompt、人工纠错、eval 和工作流经验。微软 CEO Satya Nadella 在 7 月的一篇长帖里把这件事命名为“逆信息悖论”：企业为了让模型真正理解自己的业务，会不断交出最有价值的专有知识。这不是微软发布了新的产品或政策，而是一套企业 AI 治理框架。它要问的是：团队越会用 AI，沉淀下来的业务判断到底留在谁手里？传统悖论和 AI 时代的反转传统信息悖论担心的是卖家。诺贝尔经济学奖得主 Kenneth Arrow 指出，知识在交易时很尴尬，买家不知道它值不值钱，卖家一展示就等于免费送了。AI 时代，Satya 认为风险转到了买方。企业既付订阅费，也会为了获得更贴合业务的输出而提供内部上下文和判断标准。这正是“付两笔钱”这个说法的来源，但它是对原帖的概括，不是一个已经量化的成本公式。真正需要守住的，是学习痕迹Satya 把 prompt、agent 使用的工具、尤其是模型出错后的人工修正称为“exhaust”。这里更接近“使用过程中留下、可被学习的痕迹”，不是指某一条聊天记录本身。他担心的是：这些痕迹会逐次沉淀为组织 know-how；如果企业无法控制它们的流向和再利用，信息不对称会持续加深。Satya没有断言所有模型供应商都会用客户数据训练模型，也没有说企业的知识已经被拿走。它提出的要求比传统 data protection 更进一步：企业应明确数据、反馈、eval、memory 和适配后权重能否留在自己的信任边界内。五类能力，组成自己的学习闭环(1) Control：评估标准得自己做。只有企业自己知道，在自家业务里什么叫“做得好”；决策记录、反馈和业务背景也要能留在组织内。(2) Capability：在 tenant boundary 内搭建学习环境，用真实工作流训练或微调模型，同时不暴露核心知识。(3) Choice：编排层不要跟单一模型绑死。某个模型不可用时，团队积累的 eval 和工作流仍能迁移到其他模型。(4) Cost：解耦之后，才能按任务、上下文和模型选择成本更合适的组合。(5) Compound：前四类能力组合起来，才会形成持续改进的学习闭环，让 AI 投入有机会随时间积累。选工具前先确认三件事：修正数据和 eval 能不能留在企业边界内；核心模型不可用时，积累的经验能不能迁移；定义“做得好”的标准，到底长在谁的系统里。Satya 的答案不是不用外部模型，而是让企业在使用模型时，仍保有自己的学习循环。", "excerpt": "微软 CEO：企业用 AI，也要守住学习痕迹一个团队接入 AI 后，最先积累的往往不是模型参数，而是 prompt、人工纠错、eval 和工作流经验。微软 CEO Satya Nadella 在 7 月的一篇长帖里把这件事命名为“逆信息悖论”：企业为了让模型真正理解自己的业务，会不断交出最有价值的专有知识。这不是微软发布了新的产品或政策，而是一套企业 AI 治理框架。它要问的是：团队越会用 AI，", "url": "https://www.zhihu.com/pin/2060150345674798001", "votes": 0, "comments": 0, "feed_ts": 1783958128, "feed_time_str": "07-13 23:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么四渡赤水后，国民党军就堵不住红军了？", "excerpt": "不是堵不住，蒋介石觉得红军已经损失惨重，且已经跑到边远地区，翻不起什么大浪了，他有其他优先级更高的事情要做，他把更多的专注力放在以下这几件事上： 1.收服军阀，把西南地区的权力收归中央，以便把西南地区经营成大后方，另外就是整军备战，训练德械师，这些都是为抗日做准备。 2.准备制定宪法草案，按照孙中山建国大纲中的军政-训政-宪政三步走的方略，开始向宪政过渡。 1935年八一宣言后，蒋介石注意到中共和", "url": "https://www.zhihu.com/question/685730409/answer/2059375887896860410", "votes": 40, "comments": 18, "feed_ts": 1783957574, "feed_time_str": "07-13 23:46", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "国内几家芯片厂家风格杂谈，海思，瑞芯微，全志 - 3 全志篇", "excerpt": "之前写了海思和瑞芯微芯片的一些个人想法，被人喷成了一坨翔，一生气，把全志的芯片分析这一篇给忘记写了，又被一个哥们骂是太监贴，今天就把这个jj补回来，避免太监坐实。 因为一直在做android板卡的方案，所以海思，瑞芯微，全志的芯片都有用过，而且是从原厂直接拿SDK，HDK，我们公司自己画板，编译android。 用过以下的厂家的芯片，所以不用质疑我在这里胡扯，确实有实操经验，当然个人看法不一定全对", "url": "https://zhuanlan.zhihu.com/p/1984300006195343442", "votes": 165, "comments": 34, "feed_ts": 1783957519, "feed_time_str": "07-13 23:45", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "乌克兰军队为什么要频繁打击克里米亚？", "excerpt": "因为小泽泽kpi快考核了，而且现在岌岌可危。 乌克兰正面战场已经是半崩盘的状态，这个只要是正常人都看得出来。乌军根本无力反攻，所谓的反攻基本就是打个卡，然后过几天就没信了。所以乌克兰选择攻击俄罗斯的民用设施，一个是俄罗斯战场感知系统的确非常落后，还一个是的确边界过于长，很难防守。说实话，你用这招打美国也一样防不住，不信问问墨西哥黑帮现在用啥走私毒品和枪械。 但是问题就是陷入一个自杀循环中: 欧公子 利率不变，但倾向未来降息，觉得通胀走高是暂时的。她要讲的主题是“现代金融监管”，这是监管，不是货币政策，对利率没直接影响，市场不会太关注，除非她突然放鹰，否则她这部份就直接过了，都在等后面沃勒的讲话。2. 周一美联储理事沃勒沃勒是强硬派，市场最关注他的态度。他的表态是更鹰？还是往后退一小步，和沃什一样说通胀正在降？市场反应都会比较大。而且这是公布CPI前一天的讲话，这种时候市场本来就容易一惊一乍，沃勒的讲话容易被放大。沃勒要讲的是经济展望。现在市场很想听美联储对经济前景怎么看，因为之前美联储还能说经济强劲、通胀走高，所以加息逻辑自洽，但美国上周公布的经济数据都在走弱，这会儿怎么看，会是焦点。3. 周一欧央行执委施纳贝尔她7月初说过：能源冲击还没结束，天然气价格还是比战前高40%，欧洲的高温和厄尔尼诺可能推高食品价格，核心通胀还很强，不排除继续加息。她是欧央行里态度最强硬的，今天如果继续说通胀会走高，欧央行加息预期会升高。4. 周一英国央行首席经济学家皮尔他7月9日刚说过，未来一年肯定要加息，上次会议他就是投票加息的两个人之一。我估计他今天还是会说通胀难降，市场会听他有没有更鹰的表态。5. 周一欧央行行长拉加德和沃什的闭门会面这不是公开讲话，市场会猜他们聊什么，但不会有直接反应。拉加德6月底说过：欧央行会根据实际情况调整利率，预计通胀要到2027年四季度才会回到2%，6月加息25个基点是看数据决定，不是预防性加息。拉加德这段话，市场的解读就是后面通胀如果降得比预期快，欧央行随时会停止加息。6. 周二、周三，沃什将出席国会公开作证这也是重头戏，而且紧接在周二CPI数据公布之后，他的表态会放大或对冲CPI数据的影响。", "excerpt": "今明两天央行官员扎堆讲话，明天美国公布CPI，今天交易别太激进周一央行官员扎堆讲话，周二是重头戏CPI和沃什讲话。尤其是周一美联储理事沃勒，重点关注这个强硬派是否会更鹰，他在CPI前一天表态，容易被市场放大，做交易今天别太激进。讲话名单和看点： 1. 周一美联储副主席鲍曼从6月FOMC表态来，她支持维持利率不变，但倾向未来降息，觉得通胀走高是暂时的。她要讲的主题是“现代金融监管”，这是监管，不是货", "url": "https://www.zhihu.com/pin/2059994222866994958", "votes": 0, "comments": 9, "feed_ts": 1783924198, "feed_time_str": "07-13 14:29", "category": "pin", "cat_name": "想法动态"}, {"actor": "学生陈月半", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "只生一个女儿会怎么样？", "excerpt": "没搞懂是不是地域问题，老家山东威海，身边独生子女的比例说是90%都保守了，上学的时候全校都找不到几个有兄弟姐妹的。 「只生一个女儿会怎么样」这种问题，说实话，我想都没想过，甚至从来没有觉得这是一个问题。 大概还是因为经历限制了我的想象力了吧.... 知乎还真是发现更大的世界了... ", "url": "https://www.zhihu.com/question/1953169186844051365/answer/2060006630553544286", "votes": 10, "comments": 4, "feed_ts": 1783923854, "feed_time_str": "07-13 14:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "特厨隋坡探店全差评餐厅引争议，老板「逆天回怼」是高明还是失策？", "excerpt": "几年前刚搬家的时候，连续几个周末一家人去新小区附近的饭店吃饭。主要想着每家饭店都尝一尝，方便以后遇到停水停电或者不想做饭的时候应急。 一次去了一家开业时间不长的饭店，菜一上来就感觉惊为天人，菜品无论是数量还是质量都吊打附近的其他饭店，性价比极高，来吃饭的人也是络绎不绝，中午吃饭的翻台率都不低。 从饭店出来以后，我就告诉老婆孩子，最近可以多来这家店吃几次，因为他还处于“引流”阶段，各方面都是巅峰。但", "url": "https://www.zhihu.com/question/2059021609504186485/answer/2059561401660740887       + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

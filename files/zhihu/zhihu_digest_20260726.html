。当然，256K也不能全部拿来塞文件，因为输入、历史回复和模型接下来要输出的内容都", "url": "https://www.zhihu.com/question/2064106505993971519/answer/2064522178683582131", "votes": 1, "comments": 0, "feed_ts": 1785000444, "feed_time_str": "07-26 01:27", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Agent轨迹长短不一，GRPO为什么会被最慢样本拖住？\n图文版：链接不等齐一组，单次采样异步RL也能稳住大模型做编程 agent 时，短轨迹与长轨迹完成时间差很大；同步要等最慢样本，异步再套 GRPO 组采样，等待里还会混进多个策略版本。清华大学提出 SAO：每个 prompt 只采一条轨迹，生成完立刻训练；部分作者在 链接 实习期间完成相关工作。AIME2025（带 Python 工具）上 SAO 97.3%，高于 GRPO 84.2% 与 SFT 80.4%BeyondAIME / HMMT Nov 2025 / IMOAnswerBench 为 74.8% / 88.3% / 74.0%，均超过对应 GRPO。SWE-Bench Verified 上 SAO 29.8%，高于基线 23.0% 与 GRPO（w/ DIS）27.0%。约 1000 步保持稳定，并已部署进开源 GLM-5.2（750B-A40B）的 agentic RL 流程。靠 DIS 双侧裁剪、更快价值更新和跳过观察 token 的 GAESAO 用 rollout log-prob 作行为策略 proxy，把概率比裁进双侧区间；价值模型相对策略更新更快（K=2），并用 Skip-Observation GAE 绕过环境观察。消融显示降频、解冻注意力或改用 running-mean 基线都会掉点。更适合轨迹长短差大、只有单次反馈的场景方法依赖价值模型初始化和 token 级行为概率；冻结注意力来自 MoE 观察。短轨迹同步训练下 GRPO 仍可用；在线写作实验是受控偏好切换模拟。原文标题：Single-Rollout Asynchronous Optimization for Agentic Reinforcement Learning#无影寺 ", "excerpt": "Agent轨迹长短不一，GRPO为什么会被最慢样本拖住？\n图文版：链接不等齐一组，单次采样异步RL也能稳住大模型做编程 agent 时，短轨迹与长轨迹完成时间差很大；同步要等最慢样本，异步再套 GRPO 组采样，等待里还会混进多个策略版本。清华大学提出 SAO：每个 prompt 只采一条轨迹，生成完立刻训练；部分作者在 链接 实习期间完成相关工作。AIME2025（带 Python 工具）上 S", "url": "https://www.zhihu.com/pin/2064521154522621642", "votes": 0, "comments": 0, "feed_ts": 1785000299, "feed_time_str": "07-26 01:24", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "AI能否补上人的短板，取决于双方的错误是否互补\n图文版：链接人在不知道AI当前任务精确质量时，怎样把人类信号与AI预测稳健地组合。在高斯线性模型的不确定集里，只要AI信号与真实状态保持正关联、且人与AI的条件误差协方差不大于零，就能从AI预测中剥离可由人类信号解释的部分，给剩余AI残差一个保守权重，从而保证均方误差优于只用人类。若决策者已知AI与真实状态的完整联合分布，只要AI带来非冗余信号就可进行最优加权；不确定质量才使稳健条件大幅收紧。负相关误差是宽松充分条件，不是唯一可能条件；若误差正相关，仍可能获益，但需要AI信号足够强或人类信号足够噪。实证使用181个ForecastBench问题的7,383条人类预测，以及43项TESS社会科学实验，分别用GPT-5和GPT-5-mini生成预测。两项数据中LLM与人类误差均为正相关；12种提示策略与任务组合里，只有TESS的Contrarian Reasoning一次把相关性转为负，稳健组合MSE也只轻微改善。按主题迁移时，人机信号关系会变化，不能把一地标定的组合规则直接套到新领域。二元投资决策的理论分析也呈现相同方向。结论适用于预测与均方误差决策，不等于所有人机协作或高风险行动场景，部署前仍需按具体人群、任务和反馈机制重新标定，不应直接照搬历史参数。原文标题：Robust Human-AI Complementarity under Uncertainty#无影寺 ", "excerpt": "AI能否补上人的短板，取决于双方的错误是否互补\n图文版：链接人在不知道AI当前任务精确质量时，怎样把人类信号与AI预测稳健地组合。在高斯线性模型的不确定集里，只要AI信号与真实状态保持正关联、且人与AI的条件误差协方差不大于零，就能从AI预测中剥离可由人类信号解释的部分，给剩余AI残差一个保守权重，从而保证均方误差优于只用人类。若决策者已知AI与真实状态的完整联合分布，只要AI带来非冗余信号就可进", "url": "https://www.zhihu.com/pin/2064520323421179970", "votes": 0, "comments": 0, "feed_ts": 1785000170, "feed_time_str": "07-26 01:22", "category": "pin", "cat_name": "想法动态"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "​“穆罕默德”连续第三年成为英国最热门男婴名字。你对此有什么看法？", "excerpt": "在英国通过种种残忍手段让约翰成为赞比亚、博茨瓦纳、尼日利亚、加纳、塞拉利昂……最热门名字的时候，就应该想到有这一天了。", "url": "https://www.zhihu.com/question/2063361655401198158/answer/2064313139810800615", "votes": 2589, "comments": 69, "feed_ts": 1785000059, "feed_time_str": "07-26 01:20", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "不写推理过程，大模型能在内部规划多少步？\n图文版：链接The Depth Ceiling研究模型在不写出、也不接受中间步骤监督时，能否在单次前向传播中自行发现多步规划策略。任务使用中心节点和等长分支组成的星图G(k,m)：模型只输出正确分支的第一跳，训练只根据最终答案给信号，任何超过随机猜测的表现都需要内部回溯。从零训练的160万参数Transformer能发现3步策略；可微调的GPT-4o和Qwen3-32B达到5步；GPT-5.4在关闭隐藏推理的few-shot设定达到7步，m=8时未能拒绝随机猜测。由于GPT-5.4不能公开微调，7步是作者对其发现深度的下界，不是通用推理上限。另一个关键区别是发现与执行：模型直接训练6、7、8步时无法超过随机，但从5步任务发现的回溯策略可在测试时泛化到8步。错误分析中，微调LLM在超过训练深度时多为on-path错误，即已选到正确分支但没有完成全部回溯；规模提升对更多分支的规划广度帮助更明显，对深度帮助有限。显式CoT监督让参与对照的LLM约20次更新后在测试到的20步任务上接近完美，说明本实验的难点主要是稀疏最终答案信号下的策略发现。结果只覆盖高度对称的星图规划；它为CoT monitoring提供条件性证据，不能推广为所有潜在推理都浅或CoT审计已足够安全。原文标题：The Depth Ceiling: On the Limits of Large Language Models in Discovering Latent Planning#无影寺 ", "excerpt": "不写推理过程，大模型能在内部规划多少步？\n图文版：链接The Depth Ceiling研究模型在不写出、也不接受中间步骤监督时，能否在单次前向传播中自行发现多步规划策略。任务使用中心节点和等长分支组成的星图G(k,m)：模型只输出正确分支的第一跳，训练只根据最终答案给信号，任何超过随机猜测的表现都需要内部回溯。从零训练的160万参数Transformer能发现3步策略；可微调的GPT-4o和Qw", "url": "https://www.zhihu.com/pin/20 able 5，单任务成本约一半\nAnthropic 发布 Claude Opus 5，价格与 Opus 4.8 持平，同时把高难代码任务的表现推近 Fable 5。在 CursorBench 3.2 的 max effort 设置下，Opus 5 与 Fable 5 峰值分数相差不到 0.5%，单任务成本约为后者一半。这只对应这项评测和 effort 设置，不能理解成所有任务都只需一半成本。同价升级，付费用户和 API 都能用Opus 5 已在 Claude订阅用户和 Claude API 上线，价格仍为每百万输入 token 5 美元、输出 token 25 美元，与 Opus 4.8 相同。它成为 Claude Max 的默认模型，也是 Claude Pro 当前最强模型。官方还提供 Fast mode，速度约为默认模式的 2.5 倍，但价格会提高到基础价的两倍。高难任务的变化看什么在 Frontier-Bench v0.1 上，Opus 5 的表现超过 Opus 4.8 两倍，且每项任务成本更低；在 ARC-AGI-3 这个新颖问题评测中，分数约为第二名模型的 3 倍。对日常开发更有参考价值的，是模型能否自己验证和迭代：Anthropic 展示了它在没有直接查看图纸权限时，自写视觉处理流程来重建零件，以及为缺少线上数据源的交易所行情程序自建测试 harness 的案例。这些来自官方评测和早期用户案例，仍要用自己的代码库验证。安全Anthropic 的自动行为审计中，Opus 5 的整体失配行为分数为 2.3，是其近期模型中最低；官方还称它更不容易被诱导滥用。不过在高风险能力上，Opus 5 并没有超过 Mythos 5：它找软件漏洞的能力接近后者，开发 exploit 的能力仍明显落后。对开发者来说，这意味着它可用于源码漏洞定位和修复，但二进制扫描、渗透测试与 exploit 生成仍会受到限制或回退处理。实际决策点：若你已经在用 Opus 4.8，Opus 5 是同价的优先试用对象；若你正为复杂代码任务选择高端模型，先按自己的任务长度、effort 和工具调用成本测一轮，再判断“接近 Fable 5”的官方曲线是否会在你的场景复现。", "excerpt": "Claude Opus 5 上线：CursorBench 接近 Fable 5，单任务成本约一半\nAnthropic 发布 Claude Opus 5，价格与 Opus 4.8 持平，同时把高难代码任务的表现推近 Fable 5。在 CursorBench 3.2 的 max effort 设置下，Opus 5 与 Fable 5 峰值分数相差不到 0.5%，单任务成本约为后者一半。这只对应这项评", "url": "https://www.zhihu.com/pin/2064314933479846734", "votes": 0, "comments": 0, "feed_ts": 1784951129, "feed_time_str": "07-25 11:45", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "离岸信托个税新规出台，设立、存续、清算全链条征税 适用 20% 税率，将产生哪些影响？", "excerpt": "其实核心逻辑我之前就讲过，本质就是整个社会的税务模式，正在发生大转向了 过去土地财政的时代，虽然很多人吐槽高房价，但有个很现实的作用： 买房的人实际上承担了社会绝大部分的税额。 土地出让金、房产相关的各类税费，相当于把大额税负集中在了购房这一个环节，所以普通人日常过日子，对税负的感受其实没那么深。 但现在土地不好卖了，稅源的痛感一下子就起来了。 因为土地财政持续退坡，这部分税源缺口不会凭空消失，只", "url": "https://www.zhihu.com/question/2064072667435684910/answer/2064313912665838666", "votes": 483, "comments": 106, "feed_ts": 1784950790, "feed_time_str": "07-25 11:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "携程被罚那个事大家都看了吧我倒是觉得，携程的问题不是垄断，而是争利。而且不光是与民争，还与官争。先从源头说起。就现在很多城市的发展思路实际已经变了，以前地方冲政绩，拼的是工业、是工厂、是产值，但现在不一样了，土地财政压力下，工业招商难，周期长，还有财政压力，也不好出成绩，于是文旅就成了很多地方发展的新思路。像淄博烧烤、各地的网红小镇，只要运营得当，很容易全网出圈，既能带火城市名气，又能拉动消费和就业。而且地方砸钱搞文旅，目的其实也很简单：搞文旅的目的是带动当地实体经济，让本地的民宿、餐饮、商铺都能赚到钱，最终让老百姓的收入实实在在涨上去，然后老百姓把收入再反馈给本地。所以各地愿意真金白银往里投，修景区、建配套、铺道路、做宣传，土地成本、基建成本、运营风险，几乎全是地方在扛。可结果呢？大家去看好了，今年全国各地的本土文旅集团，几乎亏得一塌糊涂，市场上的旅游板块，都跌的不成样子了。那问题来了，地方投了这么多钱，搭了这么大的盘子，利润到底去哪了？既没全落到本地商户手里，也没真正让老百姓分到多少实惠，很大一块利润，被携程这类线上平台稳稳抽走了。地方把文旅的底子铺得再好，流量入口却握在平台手里。游客订酒店、买门票、找攻略，全要经过线上平台，平台靠着手里的流量定价权，按比例收佣金、抽成，相当于在线上收了一道“数字地租”，把钱都收走了。最终的结果是什么呢？地方扛了最重的成本、担了最大的风险，最后稳定赚钱的反而是轻资产的平台。绕了一大圈，本来是想带动本地经济、富民增收的投入，最后大头收益却流进了线上平台的口袋。结果是文旅集团亏，老百姓收入没提上去，结果收互联网租的平台赚的盆满钵满。这才是最大的问题。", "excerpt": "携程被罚那个事大家都看了吧我倒是觉得，携程的问题不是垄断，而是争利。而且不光是与民争，还与官争。先从源头说起。就现在很多城市的发展思路实际已经变了，以前地方冲政绩，拼的是工业、是工厂、是产值，但现在不一样了，土地财政压力下，工业招商难，周期长，还有财政压力，也不好出成绩，于是文旅就成了很多地方发展的新思路。像淄博烧烤、各地的网红小镇，只要运营得当，很容易全网出圈，既能带火城市名气，又能拉动消费和就", "url": "https://www.zhihu.com/pin/2064311196984030900", "votes": 0, "comments": 66, "feed_ts": 1784950173, "feed_time_str": "07-25 11:29", "category": "pin", "cat_name": "想法动态"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果你是俄耳甫斯，你会选择回头看欧律狄克吗？", "excerpt": "里尔克的诗歌《俄耳甫斯·欧律狄刻·赫尔墨斯》彻底重构了俄耳甫斯回头的故事，他把传统的“因为太爱所以忍不住回头”的悲剧变为“死亡本身就会彻底改变一个人，爱跨不过生死的鸿沟。” 这也是我看到过的最有意思的重构。 我细想了一下，关于俄耳甫斯回头悲剧的解读与重构，大概看过这么几种。 首先当然是最原始版本的，即开头提到的俄耳甫斯因为太爱所以忍不住回头。 柏拉图在《会饮篇》借斐德罗之口提出了一个有些残忍的解读", "url": "https://www.zhihu.com/question/3889577799/answer/2061189544402277198", "votes": 46, "comments": 4, "feed_ts": 1784950163, "feed_time_str": "07-25 11:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "《功夫女足》上映 10 天票房破 15 亿，电影做对了哪些事？给周星驰、张小斐、迪丽热巴带来哪些收益？", "excerpt": "周星驰又一次证明了一件事，一部电影票房高并不一定需要质量好。 著名的垃圾电影《731》首日票房即破 1.33 亿，上映 4 天总票房超 10.78 亿元 。 2025 年 10 月 18 日票房突破 19 亿，11 月 3 日累计定格在 19.35 亿元 。‌‌‌ 就这玩意儿，当时一大堆土老板包场请员工过去忍受折磨，活生生的表演了职场pua。 功夫女足也是一样的路径，噱头搞得很好， 蹭到了之前老电", "url": "https://www.zhihu.com/question/20 的再平衡。 俄罗斯近期被乌克兰无人机深入腹地的打击，搞得头破血流，精疲力尽，甚至已经奄奄一息了。 俄罗斯的军工产业明显跟不上，而现在俄罗斯全民因为用不上燃油，对普京爆发", "url": "https://www.zhihu.com/question/2064019046736175870/answer/2064259695456662561", "votes": 356, "comments": 37, "feed_ts": 1784937864, "feed_time_str": "07-25 08:04", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}];
const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

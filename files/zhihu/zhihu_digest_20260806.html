一种机器人、一个新任务，收数据的成本又要从头算。小米刚开源的 Xiaomi-Robotics-1（XR-1）的做法是：先用大量不绑定特定机器人的操作轨迹学习通用动作，再用真实机器人数据把能力对齐到具体硬件和自然语言指令。10万小时先学什么XR-1 的预训练数据超过 10 万小时，覆盖家庭、商业场所、工业场地和户外等 1,700 多个场景。小米把长轨迹切成固定长度片段，再用视觉语言模型自动标注夹爪和物体发生的状态变化，让模型学会把当前场景推向目标状态。这些轨迹不绑定某一款机器人，目的在于先扩大模型见过的操作场景；项目页报告，随着预训练数据量和模型规模增加，验证动作误差持续下降。后训练才接上真实机器人第二阶段使用超过 1 万小时跨具身数据，其中包含 7,200 多小时小米在真实家庭采集的机器人数据。它做两件事：把通用动作能力映射到真实机器人本体，并把“描述状态如何变化”转成直接理解自然语言指令。小米给出的新任务适配测试里，平均每个任务少于 10 小时示范数据，XR-1 在装手机、补打印机耗材、放洗衣物和装箱四项任务上整体成功率为 75%；同预算下 π0.5 为 40%。平均少于 40 小时时，XR-1 为 85%，π0.5 为 53%。开源的是完整复现链路GitHub 目前提供了后训练、推理和 benchmark 评测代码，以及对应 checkpoint；四个仿真 benchmark 也给了适配模型和评测说明。对做机器人研究的人，价值在于可以检查数据格式、后训练和部署如何衔接，而非只拿到一组权重。不过这些结果来自小米设定的数据、机器人和任务。新场景仍需要自己的真实示范数据与硬件集成；“开源模型”不会直接让家里的机器人学会所有家务。", "excerpt": "小米开源具身机器人模型Xiaomi-Robotics-1让机器人在陌生房间收纳、装洗衣机、整理物品，难在可用于训练的真实机器人数据太少。每换一种机器人、一个新任务，收数据的成本又要从头算。小米刚开源的 Xiaomi-Robotics-1（XR-1）的做法是：先用大量不绑定特定机器人的操作轨迹学习通用动作，再用真实机器人数据把能力对齐到具体硬件和自然语言指令。10万小时先学什么XR-1 的预训练数据", "url": "https://www.zhihu.com/pin/2068496713069883818", "votes": 0, "comments": 0, "feed_ts": 1785948082, "feed_time_str": "08-06 00:41", "category": "pin", "cat_name": "想法动态"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你在体制内捅过的最大娄子是什么？？", "excerpt": "给副市长写报告，在网上随便套了个模板，复制了一句话：“作为市里一把手”.... 好家伙，副市长看也看不看，在会上也照着念：“作为市里一把手”..... 你能想象的到，会议上市委书记、市长的表情吗？ ", "url": "https://www.zhihu.com/question/658215591/answer/3779495021", "votes": 12744, "comments": 128, "feed_ts": 1785947765, "feed_time_str": "08-06 00:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Cursor：开源 Mixture-of-Kittens (MoK)MoE 训练常卡在“把 token 送到对的 GPU”。专家权重分散在多张卡上，token 要先跨卡分发，算完再汇总；通信和计算轮流等，GPU 就会空转。Cursor 开源的 Mixture-of-Kittens（MoK）瞄准的就是这段等待。它面向 GB200/GB300 NVL72 这类 Blackwell 机架，把 MoE 的跨 GPU 通信、专家计算和调度合进一个确定性 CUDA 内核。通信和计算同时推进常见实现是先分发 token，再算专家网络，最后汇总结果。MoK 将 token 切成小批次：一组 SM 负责通信，另一组 SM 立即计算已经到位的 token，让 NVLink 和计算单元尽量同时工作。分发时可以由发送端推 token，也可以由接收端拉取。MoK 按具体通信步骤选择，还用环形 token 缓冲区减少 CPU-GPU 同步造成的停顿。2.37倍和41%不能混着看Cursor在单个 NVL72 机架上，对多种开源 MoE 模型形状做测试；MXFP8 前向最高比最快公开基线快 2.37 倍。这是单层内核的峰值结果。内部 512 张 GB300 GPU 的完整训练测试更接近日常使用：相对原先的 DeepEP 栈，每张 GPU 每秒 token 从 760.9 提到 1,070.2，即 1.41 倍。两组数字的测试层级不同，不能把 2.37 倍当成整套训练都能获得的提升。MoK的硬件和调参门槛MoK 已以 Apache-2.0 开源，但要求 Blackwell SM100/SM103 GPU、PyTorch 2.10+ 和 CUDA 13.0+。通信 SM 数量、minibatch 和 token 缓冲区都要随工作负载调优。没有 NVL72 类硬件的团队，更适合把它当作 MoE 通信优化的实现参考。", "excerpt": "Cursor：开源 Mixture-of-Kittens (MoK)MoE 训练常卡在“把 token 送到对的 GPU”。专家权重分散在多张卡上，token 要先跨卡分发，算完再汇总；通信和计算轮流等，GPU 就会空转。Cursor 开源的 Mixture-of-Kittens（MoK）瞄准的就是这段等待。它面向 GB200/GB300 NVL72 这类 Blackwell 机架，把 MoE 的", "url": "https://www.zhihu.com/pin/2068494802044429022", "votes": 0, "comments": 0, "feed_ts": 1785947603, "feed_time_str": "08-06 00:33", "category": "pin", "cat_name": "想法动态"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有什么你从未见过的稀有照片？", "excerpt": "那应该是这张了，不知是哪位有缘人方能拍得的...... ", "url": "https://www.zhihu.com/question/376634565/answer/1958978947132944431", "votes": 5398, "comments": 148, "feed_ts": 1785946540, "feed_time_str": "08-06 00:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有什么你从未见过的稀有照片？", "excerpt": "他抓拍的瞬间被抓拍 ", "url": "https://www.zhihu.com/question/376634565/answer/1984405375781457947", "votes": 13712, "comments": 38, "feed_ts": 1785946467, "feed_time_str": "08-06 00:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价丰田上半年全球销量539万，连续7年稳居全球第一？", "excerpt": "19个回答能进热搜前三，你就知道为什么稳居全球第一了", "url": "https://www.zhihu.com/question/2066505620371531312/answer/2068243162477356566", "votes": 95, "comments": 1, "feed_ts": 1785945283, "feed_time_str": "08-05 23:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "小约翰", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待刘骏讥讽爷爷刘裕：“田舍公得此，已为过矣”？", "excerpt": "刘 t_name": "地缘 · 经济 · 能源"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "ECCV 2026 | 北大团队提出 Atomic Dance：基于原子动作的可解释音乐舞蹈生成框架", "excerpt": "该论文的第一作者和通讯作者均来自北京大学王选计算机研究所，第一作者为博士生蔡鑫豪，通讯作者为博士生导师刘洋。团队近年来在 TPAMI、IJCV、CVPR、ICML 等顶会上有多项代表性成果发表，多次荣获国内外多模态理解与生成竞赛冠军，和国内外知名高校、科研机构广泛开展合作。 本文主要介绍来自该团队的最新论文 Music-to-Dance Generation via Atomic Movement", "url": "https://zhuanlan.zhihu.com/p/2068436387146248354", "votes": 3, "comments": 0, "feed_ts": 1785933678, "feed_time_str": "08-05 20:41", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "Morris.Zhang", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "一张图片删掉大部分奇异值以后，为什么居然还能看？今天继续更新&#34;用奇异值分解 SVD 看透矩阵&#34;系列第四回（完结）。从&#34;变形&#34;看透矩阵：SVD 到底把线性变换拆成了什么？从&#34;方向&#34;看透矩阵：左右奇异向量到底在描述什么？从&#34;强弱&#34;看透矩阵：奇异值如何揭示秩、零空间与信息损失？从&#34;取舍&#34;看透矩阵：SVD的低秩近似为何有效？前三回都在拆矩阵，拆输入，拆输出，再看每个分量到底被放大了多少。到了第四回，终于轮到一个更现实的应用问题了：拆出来以后，哪些要留，哪些可以不要？在计算机眼里，一张高分辨率图像就是一个很大很大的矩阵（一堆数字）。按直觉看，少存一些数据，图片应该明显会变糊。可真用 SVD 做一次重构，会发现只保留前面一部分奇异值，图片的主体还在，明暗关系也没怎么乱。（可以看附图中的重构效果）这结果挺惊讶的。在SVD中，图像信息并不是平均摊在每个奇异分量上的。前面几个较大的奇异值，往往已经把整体轮廓和主要结构撑起来了。后面的分量也不是没用，只是更多在补边缘、纹理，还有那些比较细碎的变化。这就是涉及到图像的&#34;低秩近似&#34;了。所谓&#34;低秩近似&#34;，名字听着有点劝退，其实做的事很朴素。它不再追求把原矩阵里的每个数字一模一样地留下来，而是挑出前面几个较强的分量，重新拼出一个和原来比较接近的版本。所以，低秩近似并不是简单地把小奇异值删掉，而是在回答三个问题：哪些分量要先留，哪些细节可以舍，留下多少才够用。SVD 做的，则是先把这些分量按强弱排好顺序。#矩阵运算  #线性代数  #奇异值分解  #低秩分解  #机器学习 ", "excerpt": "一张图片删掉大部分奇异值以后，为什么居然还能看？今天继续更新&#34;用奇异值分解 SVD 看透矩阵&#34;系列第四回（完结）。从&#34;变形&#34;看透矩阵：SVD 到底把线性变换拆成了什么？从&#34;方向&#34;看透矩阵：左右奇异向量到底在描述什么？从&#34;强弱&#34;看透矩阵：奇异值如何揭示秩、零空间与信息损失？从&#34;取舍&#34;看透矩阵：SVD的低秩近似为何有效？前", "url": "https://www.zhihu.com/pin/2066142649237688339", "votes": 0, "comments": 9, "feed_ts": 1785933085, "feed_time_str": "08-05 20:31", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "就业数据不及预期，黄金大涨3个点，利好降息", "excerpt": "就业数据不及预期，黄金大涨3个点，利好降息", "url": "https://www.zhihu.com/pin/2068431181692002374", "votes": 0, "comments": 29, "feed_ts": 17859324 作就是把一句话输入给模型，随机盖住里面百分之十五的词，让模型利用前后文去把这些词猜出来。当年所有人都觉得这个设计简直是天才，因为它提取出的双向特征在做下游的意图识别或者实体抽取时，指标直接碾压一切。那时候大家在各种技术会议上吹牛，都觉得只要把Bert的参数量堆到千亿，通用人工智能就稳了。 但现实的算法工程世界非常冷酷。当你试图把Bert推", "url": "https://www.zhihu.com/question/1913614685275664790/answer/2068008192127382927", "votes": 190, "comments": 6, "feed_ts": 1785894467, "feed_time_str": "08-05 09:47", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大水哥", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中餐这么丰富，为什么没有一道菜的国际影响力能胜过汉堡炸鸡？", "excerpt": "只要你不顾健康 舍得放重油、重糖、重盐，做什么都不会太难吃。 高手和初手的差距只在比例、刀章和火候这三样。特级厨师和我能拉开差距的就是这三点。 如果我可以放任意的油、糖、盐，高手只能放很少的盐、油，就算他的烹饪技巧吊打我，我做出来的也比他的好吃。 汉堡的芝士和肉饼油脂含量爆炸，酱料油脂、糖、盐爆炸。你让他别放芝士和酱料你再试试。 炸鸡就不用说了典型的糖油混合物，你别说炸鸡了，用上好的食用油炸出来的", "url": "https://www.zhihu.com/question/2005167628960933434/answer/2068271734483051030", "votes": 21, "comments": 0, "feed_ts": 1785894408, "feed_time_str": "08-05 09:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "千秋一粟", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如果当年阿拉伯帝国征服了中国，中国会伊斯兰化吗？", "excerpt": "阿拉伯帝国就不可能征服中国，中国更不可能会伊斯兰化。一千多年以来伊斯兰对上东亚文明就没占过便宜。 阿拉伯帝国在生产力与人口基数上都不如同时期的大唐，在中亚扩张时对上唐朝是败多胜少，甚至唐朝都不用亲自出兵，动用附属的突骑施就能把阿拉伯帝国军队打得一溃千里。唐军唯一一次失败就是那场著名的怛罗斯之战，唐军虽败，但那是协从军倒戈，背后捅刀子导致的，而且阿拉伯帝国也是不折不扣的惨胜，此战唐军只有3万，加上协", "url": "https://www.zhihu.com/question/2063347973493355807/answer/2068271659291874098", "votes": 10, "comments": 0, "feed_ts": 1785894390, "feed_time_str": "08-05 09:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么我感受不到计算机专业是建立在基础学科上的？", "excerpt": "为了解答你的疑惑，我们首先需要搞清楚，为什么在过去这些年，仅仅靠学Java写业务代码就能找到好工作，并且给人一种不需要基础学科的假象。 这要归功于计算机科学发展至今最伟大的一个理念，也就是抽象。整个计算机系统的发展史，就是一部不断向上构建抽象层的历史。从最底层的半导体物理学，到晶体管，到逻辑门电路，再到微体系结构，然后是指令集架构，接着是操作系统内核，上面再覆盖上C语言等底层编程语言，再往上是Ja", "url": "https://www.zhihu.com/question/538847727/answer/2068034267658055734", "votes": 48, "comments": 2, "feed_ts": 1785894371, "feed_time_str": "08-05 09:46", "category": "ai", "cat_name": "AI const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

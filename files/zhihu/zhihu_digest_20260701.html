4918866/answer/17211733615", "votes": 1411, "comments": 213, "feed_ts": 1782798319, "feed_time_str": "06-30 13:45", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "特朗普为什么忽然间开始对中国认怂？", "excerpt": "他觉得中国是个厚道人，伊朗和美国打起来了，中国背后推伊朗一把，在中东美军就G完了，石油美元就G了，美国也就G了，特朗普中期选举不谈，直接就定格在美国历史耻辱柱上了，败家亡国总统了。历史上来说无论是美国的朝鲜、越南战争还是苏联的阿富汗战争都是大国命运的转折点，大家都是这么玩的。没想到美国在伊朗吃瘪，中国忍住没推一把。特朗普觉得还是老中仗义。 这波差点让特朗普扮猪吃饲料了。 ", "url": "https://www.zhihu.com/question/2041306954065242066/answer/2050766829056954858", "votes": 5075, "comments": 448, "feed_ts": 1782797243, "feed_time_str": "06-30 13:27", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "大水哥", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "既然瑞士可以成为永久中立国，那么乌克兰为什么不可以？", "excerpt": "瑞士和北意大利当年可是被法国、哈布斯堡、俄罗斯蹂躏狠了去了。 瑞士能中立不是宣布自己是中立国，而是国家主要地形是山地，进攻成本极高，阿尔卑斯山大雪融化前根本无法通行，即便大雪融化也仅有几个少数山路可以通行。当年苏沃洛夫从北意大利出发去瑞士战场，在阿尔卑斯山爬了好几个月，差点被送走，仅跌落山崖的士兵就上千人。 山地贫瘠还没港口，还夹在法国、巴伐利亚、巴登符腾堡黑森等南德诸侯和哈堡之间，谁占领就会逼疯", "url": "https://www.zhihu.com/question/660709415/answer/2055279406185288194", "votes": 8, "comments": 0, "feed_ts": 1782796796, "feed_time_str": "06-30 13:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黑兵", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "谅解备忘录签署后美伊再起冲突，美军以新加坡籍货船遇袭为由打击伊朗，伊朗打击美军驻点，如何看待当前局势？", "excerpt": "最近美伊的新闻我都懒得评论。 800年前我就说了，现在是熬鹰阶段，美国老是不服，可他又没能力开战，所以一开战就讲和，一到谈判又想开战。 谈判的时候老觉得协议不好，想占便宜。一开打，又觉得太麻烦，自己讨不着便宜，又开始讲和。 整个美国在和中国打贸易战的时候就这样反反复复，没完没了。 反正就熬着呗，直到什么时候老鹰给熬的精神崩溃了，彻底服了，什么时候协议就可以签了。 特朗普还能再折腾2月，2个月再搞不", "url": "https://www.zhihu.com/question/2054137162698957150/answer/2055279195232662043", "votes": 87, "comments": 8, "feed_ts": 1782796746, "feed_time_str": "06-30 13:19", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "到目前为止，你做过最让自己自豪的事情是什么？", "excerpt": "我叫赵兴万，1938年生人，今年89岁啦。 1960年11月，咱们国家制造的“1059”导弹发射成功，后来被命名为“东风一号”。从此，国家就有了自己的导弹了。 这个过程难啊，靠什么？ ": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "夜静魂梦归", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为何欧洲还是不大面积安装制冷空调？", "excerpt": "让7亿欧洲人用上空调，是地球环境不可承受的灾难。为了地球的环境，希望他们再坚持一下。", "url": "https://www.zhihu.com/question/1935002632868573447/answer/2054894323586671185", "votes": 5353, "comments": 76, "feed_ts": 1782790687, "feed_time_str": "06-30 11:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价女星吴越的长相?", "excerpt": "典型的南方长相，上海这种长相很多，主要是指这一类眼睛。很多年前有个电视剧《孽债》里的老演员吴冕，演反派比较多。她的眼眉和吴越非常象。", "url": "https://www.zhihu.com/question/381013373/answer/2055253212127667243", "votes": 16, "comments": 2, "feed_ts": 1782790551, "feed_time_str": "06-30 11:35", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "京剧为什么没落了？", "excerpt": "以后可能电影也会没落的。 京剧能有人看，在我看来理解不了。其实一些旧相声段子也一样，你都知道包袱在哪儿，还去反复看？ 京剧的剧目喜欢戏的都知道讲的什么，为什么要反复看？ 但是我其实也理解不了为什么年轻人不爱看电影。反而爱看短视频。 但是理性的讲，也是节奏问题。其实电影叙事的很多铺陈部分大家看一眼是知道的，就跟短视频出来一个拽的二五八万的装逼货，观众知道他就是来倒霉的。看到一个被欺负的少年，知道他才", "url": "https://www.zhihu.com/question/280622816/answer/2055251799955845197", "votes": 41, "comments": 14, "feed_ts": 1782790214, "feed_time_str": "06-30 11:30", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "马上领证了，发现男朋友离不了游戏，让他少打游戏他会非常生气，正常吗？", "excerpt": "我读书的时候，家里是非常反对我玩游戏的，为此我挨了不少揍。 原因是我打游戏影响了学习，他们认为生出了一个废物，跟别人家的孩子比烂透了，非常不爽。 但在今天我还是一样，天天打游戏，看小说，我家里对此非常满意，非常支持，经常拿出去跟别人炫耀。 因为这时候我天天宅在家里成了巨大的优点，因为只要我愿意，以我的条件，可以消费更多，多百倍，玩的更加花里胡哨。 更别提我前几年疯狂开店疯狂倒闭了，给他们都整出PT", "url": "https://www.zhihu.com/question/533306641/answer/2055248180866971359", "votes": 640, "comments": 34, "feed_ts": 1782789351, "feed_time_str": "06-30 11:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "大冷门！德国点球大战 4-5 不敌巴拉圭遭淘汰，止步世界杯 32 强，如何评价本场比赛？", "excerpt": "德国和英格兰现在该换换了，现在足坛四大错觉之一应该是德国很强。一四年格策的灵光一闪不会真把德国的气运给耗没了吧，十二年了卡在32强。 不过话说回来老四大错觉里面，现在来看意大利确实很弱，英格兰确实很强，阿根廷确实能夺冠，就差中国队能出线了，国足能不能再给给力啊。 ", "url": "https://www.zhihu.com/question/2054885142036833997/answer/2055212073886413183", "votes": 100, "comments": 7, "feed_ts": 1782788980, "feed_time_str": "06-30 11:09", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "Dio-晶,永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "Blackwell 双 die 拓扑：SM 与地址的 die 映射及跨 die 访存代价", "excerpt": "单 die 面积有两条硬约束——光刻机一次曝光的 reticle limit（约 800 mm²）划下面积墙，良率又随面积超线性下降使得大 die 成本陡峭。把一颗大芯片拆成两颗较小的 die 再用高带宽互联缝合是绕开这两条约束的标准做法，代价是引入一道 die 边界：原本片内均匀的访存被分成”本地”与”跨边界”两种。 Blackwell 是 NVIDIA 第一代沿这条路线、把多颗 die 封装为", "url": "https://zhuanlan.zhihu.com/p/2051639750541546085", "votes": 207, "comments": 21, "feed_ts": 1782788403, "feed_time_str": "06-30 11:00", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "龙牙", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "部分殖人、润人究竟是受了什么委屈？那么恨国，真不可理解！?", "excerpt": "有一句诚恳的建议送给风华正茂的年轻朋友们： 不要相信“互联网共识”这种鬼东西。我们这种老登当年上网的时候，有一句古早流行语： 哥X的不是XX，是寂寞。这句话有非常浓烈的傻缺感，刚开始用的时候有一种傻萌的感觉，泛滥以后就倒胃口了。但这句话流行起来是有原因的，就是抬杠。比如说“哥吃的不是饭，是寂寞”、“哥上的不是网，是寂寞”，中文词汇成千上万，为什么独独挑了个“寂寞”来用呢？因为是真的寂寞。 关于“人", "url": "https://www.zhihu.com/question/1954149167321572425/answer/2055243707516036638", "votes": 255, "comments": 17, "feed_ts": 1782788285, "feed_time_str": "06-30 10:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "砺石君", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "即将赴港二次上市，市值超5000亿，立讯精密凭什么再次赢得投资者信任？", "excerpt": "导语：一方面是坚挺的主业表现，另一方面是光模块业务的巨大想象空间，推动立讯精密估值市值突破5000亿元大关。 李平/作者 砺石商业评论/出品 1 赴港上市进入倒计时继蓝思科技之后，又一家“果链”巨头即将登陆港交所。 6月23日，港交所网站显示，消费电子代工巨头立讯精密已通过上市聆讯，并更新聆讯后资料集，标志着其港股IPO进程进入最后阶段。 公开资料显示，早在2025年7月，立讯精密董事会便审议通过", "url": "https://zhuanlan.zhihu.com/p/2055241445515252207", "votes": 0, "comments": 0, "feed_ts": 1782788081, "feed_time_str": "06-30 10:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor" ，只抓住两者表面上的相似之处，剩下的全部交给脑补。近东的狮鹫文化基本上可以确定源自苏萨，这个地方从未听说过出土有三角龙化石，也没听说过有任何角龙类化石，三角龙也不可能只在这一个地点活动。三角龙的活动范围与狮鹫文化的分布范围根本不重合。狮鹫总是带着翅膀，且翅膀不是后续添加，在公元前四千纪的图像材料中就是如此了，没有一例狮鹫图像中拥有三角龙那标志性的颈盾。狮鹫在埃及语中的称呼（sfr）和三角龙也没有明显的关联，这个词若非外来语，就是源自埃及语中的“热”。古典文献中没有任何一处记载表明希腊人曾挖掘到过矮象化石。图像资料中，独眼巨人除了长一只眼睛，身材格外巨大以外， 与普通人类并无不同，矮象化石那怪异的头骨形状和巨大的象牙在古代图像资料中没有留下任何痕迹。且在早期图像中，“独眼”这一特征并非必需。再者，化石论者往往忽略了希腊人所处的文化背景，奥德赛中的许多描写已被证明存在近东文化根源，吉尔伽美什与胡巴巴的争斗、大卫与歌利亚巨人的争斗，这些传说都有可能影响到奥德修斯与波吕斐摩斯的故事。真实情况是，古人往往会将新发现的化石附会到已有的神话传说上。比如近代发现恐龙/海爬化石的欧洲人曾经将这些骨头解释为古代巨龙/人的遗骸，比如罗马作家将菊石化石解释为阿蒙神的角。", "excerpt": "现代人可能患了一种试图用科学解释一切的病，连神话传说也不放过。这种神话生物源自古生物化石的假说，在国外早已有之，甚至有泛滥的趋势。他们言之凿凿，四处传播狮鹫源于三角龙化石，独眼巨人源自矮象头骨之类的言论。不仅埃及学，包括我的古典学朋友，他们都很反感这种滥用化石解释神话生物起源的做法。化石论者往往投机取巧，不费心查阅文献，不关心相关图像艺术的演变脉络，只抓住两者表面上的相似之处，剩下的全部交给脑补。", "url": "https://www.zhihu.com/pin/2055192237005395947", "votes": 0, "comments": 4, "feed_ts": 1782779810, "feed_time_str": "06-30 08:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "李x晔", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待17岁女生单方面指控被江西财大（前）男友发生性关系以及肢体冲突？", "excerpt": "近段时间我发现了个有趣的现象，随着互联网下沉速度的加快，很多事情的推进速度快得超乎我的想象。 比如城市小资产阶级吵了好多年都没吵明白的男权女权问题，下沉领域的人群两三年就给整明白了。 比如性别议题中经典的性侵相关话题，兄弟们给出的结论是：你不用跟我讲事实，也不用跟我讲道理讲法律，咱爷们儿就无条件地不站女方。 除了这种显而易见的防守策略之外，线上的兄弟们还在找证据、思考法条、罗列流程、进行逻辑相关分", "url": "https://www.zhihu.com/question/2054160031705216500/answer/2054976833091909256", "votes": 2044, "comments": 107, "feed_ts": 1782779057, "feed_time_str": "06-30 08:24", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "AI教育科普", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "看样子小日本还是想跟中国打一场科技战呐！不打不死心啊。", "excerpt": "看样子小日本还是想跟中国打一场科技战呐！不打不死心啊。", "url": "https://www.zhihu.com/pin/2055202485405495341", "votes": 0, "comments": 0, "feed_ts": 1782778456, "feed_time_str": "06-30 08:14", "category": "pin", "cat_name": "想法动态"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你是怎样度过自己人生的至暗时刻？", "excerpt": "死磕这几个平台，为失业做准备 1、国家智慧公共教育平台 你想学的技能都有，比如水电、烘焙、兽医等都可以学，涵盖了各行各业，一共1400多 const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';

  }
}

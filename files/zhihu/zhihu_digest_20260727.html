瞒了整整一年，6岁女童自费582万做基因编辑后离世，背后细节细思极恐最近科学界炸出一个超级争议的丑闻！被《科学》期刊直接曝光：国内一名6岁小女孩，做了最新的基因编辑临床试验后不幸去世，而这件事被偷偷压了一年多。事情闹大传开后，涉事的上海交大医学院却只是简单的做出回应：目前还在调查，从此再无回应。我给大家直白捋清楚整件事。这个小女孩得了一种罕见的基因病，会导致发育慢、说话和运动跟不上同龄人。但重点是：这个病本身不致命，孩子好好活着完全没问题。家长实在心疼孩子，想找办法根治，就在病友群联系到了业内名气很大的仇子龙团队，打算尝试最前沿的个体化基因编辑治疗。最让人心疼的是，这次治疗没有任何机构资助，整整582万的治疗费，全是家长自己掏空家底凑的。2025年3月，孩子在上海新华医院接受治疗，简单说就是往脊柱注射特制病毒，用来修正出错的基因。谁也没想到，治疗才过三天，孩子就突然发高烧，紧接着肾脏严重受损，短短一周时间，孩子就不幸离世了。事后医院内部自查，已经实锤了：孩子死于血栓性微血管病，百分百和这次基因编辑治疗有关。但最让人愤怒的点来了：这么严重的医疗致死事故，医院和团队全程闭口不提，临床试验的公示信息里，也刻意删掉了孩子死亡的记录。更离谱的是后续的学术操作。2026年2月，这个研究团队在顶级期刊《自然》发了论文，大肆宣传小鼠实验成功、技术效果很好。但对于人体试验害死一个6岁孩子的事，只字不提，完全隐瞒。家长发现问题后，立马向学校投诉，要求彻查这件事、撤回问题论文。其实早在2025年9月，相关部门就罚了涉事医院2.4万元，理由是医院监管失职，试验信息造假、登记不全。只不过这件处罚，当时完全被捂住了，没人知道。就连《自然》官方都出来表态：当初审核论文的时候，完全不知道有患者死亡、家属自费治病这些关键情况。如果早知道，绝对不会通过这篇论文的发表。目前涉事的团队和医院，电话全都打不通、不回应、不解释。只有上交医学院一句冷冰冰的“正在调查”。这件事之所以全网炸锅，根本不是因为实验失败，而是突破了底线：普通家庭倾尽所有相信前沿医学，最后孩子离世，结果还要被隐瞒、被蒙骗，学术成果只报喜、不报灾。说实话，医学进步确实需要试错、需要探索，但绝对不能牺牲普通人的权益、丢掉伦理底线。现在国际顶级期刊已经曝光整件事，社会反应强烈，目前官方调查也已经启动，大家都在等一个透明、公正的最终结果，给离世的孩子和心碎的家长一个交代。", "excerpt": "瞒了整整一年，6岁女童自费582万做基因编辑后离世，背后细节细思极恐最近科学界炸出一个超级争议的丑闻！被《科学》期刊直接曝光：国内一名6岁小女孩，做了最新的基因编辑临床试验后不幸去世，而这件事被偷偷压了一年多。事情闹大传开后，涉事的上海交大医学院却只是简单的做出回应：目前还在调查，从此再无回应。我给大家直白捋清楚整件事。这个小女孩得了一种罕见的基因病，会导致发育慢、说话和运动跟不上同龄人。但重点是", "url": "https://www.zhihu.com/pin/2064063394051839336", "votes": 0, "comments": 333, "feed_ts": 1785079136, "feed_time_str": "07-26 23:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "克林顿因何原因支持中国加入WTO？", "excerpt": "1998年,正在国内推行信息高速公路的克林顿访华,中国带他去看了算盘表演。 克林顿内心大呼:差距100年以上,何妨。 ", "url": "https://www.zhihu.com/question/2005492379386413306/answer/2061402272752570426", "votes": 575, "comments": 140, "feed_ts": 1785078767, "feed_time_str": "07-26 23:12", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "邓德全说书发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "南怀瑾老师说尚未成熟的历史与文化生当这个世纪末期的青少年们，传统的宗教、哲学、教育等道德理性的准绳，已经命如悬丝，失去了它固有的依赖的力量，我们所要的，是有特立独行和“确然而不可拔”的精神，融合古今中外 控名单，有哪些信息值得关注？", "excerpt": "首先我们需要反向追溯：为什么欧盟要将CN（含香港）的14家相关企业列入制裁名单，就能理解CN必须“快速反击”的底层逻辑。 我个人将欧盟本轮的对华制裁，归类为欧盟内部对 “俄乌战争及CN地缘挑战问题”在不断累积共识上的一个“阶段性反馈”。我在这里列举Kaja Kallas 和 David O’Sullivan 这两个极有代表性的人物（不全面，但极有代表性）解释为什么欧盟需要在俄乌战争问题上对于CN越", "url": "https://www.zhihu.com/question/2064019046736175870/answer/2064358514194223777", "votes": 728, "comments": 58, "feed_ts": 1785030272, "feed_time_str": "07-26 09:44", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "环中星鉴", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "美股AI交易被美联储加息预期打趴了，这其实早有预兆，可以早做准备的。账户浮盈都是假的，股票没卖掉之前都不算的，牛市里人人是股神，讲的就是这些人。真正能赚到钱的，是懂得止盈、避开大的回撤的人。这波回调多的板块都有一个特点，就是被市场大幅下调了明年业绩增速，但如果你把它当成纯粹坏事来看，可能又错过了一次板块轮动的机会。", "excerpt": "美股AI交易被美联储加息预期打趴了，这其实早有预兆，可以早做准备的。账户浮盈都是假的，股票没卖掉之前都不算的，牛市里人人是股神，讲的就是这些人。真正能赚到钱的，是懂得止盈、避开大的回撤的人。这波回调多的板块都有一个特点，就是被市场大幅下调了明年业绩增速，但如果你把它当成纯粹坏事来看，可能又错过了一次板块轮动的机会。", "url": "https://www.zhihu.com/pin/2064639913413310090", "votes": 0, "comments": 0, "feed_ts": 1785030152, "feed_time_str": "07-26 09:42", "category": "pin", "cat_name": "想法动态"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "北约真敢介入台海问题吗？", "excerpt": "北约有能力介入的也就是美国。其他的根本没有参战能力，连基本的补给都做不到。但是为啥一起叫，主要是壮声势。欧美就是一群强盗，只会打顺风局，你指望他顶住？那你想多了。 欧美完全指望收复台湾之后对中国进行经济制裁，妄图用经济战，金融战的方式来对付中国，所以中国一直以来就在反制。一方面清空国内金融圈的亲西方派，最近把谁搞了，大家也看到了。实际上从疫情以来，中国一直雷霆手段整治金融圈，很多基金经理要么跳楼…", "url": "https://www.zhihu.com/question/2062813806061940773/answer/2064642416511128595", "votes": 26, "comments": 0, "feed_ts": 1785029111, "feed_time_str": "07-26 09:25", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "时予", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "上个月说马斯克是庞氏骗局，这么快就爆了，很可能意味着一件很危险的事情将发生在27年！上个月说马斯克是庞氏骗局，这个月就爆了……爆的太快了，说明资本在非常着急的解套离场，连收割机的遮羞布都不要了……众所周知，任何为了长久割韭菜的画皮都是很珍惜的，这么不管不顾，看来有大动作。中日韩欧美，所有的主要股市都在跌，说明大量游资在套现撤离，要说普通常见的高位离场操作，不现实，毕竟高抛低吸的本质在于，高处能抛，也得同时有低处可吸，不能让现金出来了却无处可去，白白空转……毕竟资本永不眠，不赚就是亏。那这老些钱要去干什么，原油不对，这一波突然谈妥之后莫名其妙动手的美伊冲突2.0，甚至更像是为上一波伊朗危机的高位油，再拉个高点解套离场的，几种主要的矿石也在跌，也就是连原油矿产之类的大宗工业必须期货都不能吸引平时无比贪婪的资本，那在后疫情全球大通胀时代比这些还有吸引力的只剩黄金和粮食了……然而，黄金是美债的对手盘，美国现在想要维持特特要求的【高息➕货币宽松】的左右脑互搏分裂态，就不能让黄金涨起来，不然只能让美债利息更高（美国财政收入受不了，会适得其反，别人会认为美国将短期内大范围债务违约，那可就利息再高也卖不出去美债了），又不能让黄金沉淀流动性，那就只能死死用慢性持续抛售踩住黄金价格，换取时间。那这些钱最后就只有一个去处……粮食……先是连年战争（俄乌毁掉两大粮食主要出口国……粮食的短缺不是一蹴而就，而是慢性积累，连生产里不发达的古代也是三年大旱才会大面积饿死人的……充分消耗掉小国和穷人手里的积蓄和存粮需要至少两三年），然后是伊朗石油危机，油价一涨，化肥就涨更多（化肥是石油产品），化肥大幅涨价农民就舍不得用，就会造成全球粮食系统化减产，甚至有些国家舍得也买不到足量化肥，无法在春耕关键时期投放，即便将来再买到，减产也已经难以避免。最后，就是收割所有粮食大幅进口国（比如：海湾国家、埃及、日本）和高人口密度长期低粮食安全的国家（比如：印度）。没有什么比吃不饱更能逼着一个国家的底层闹事发疯了，而没有什么比底层发疯更能让执政集团马上需要一场外部战争转移矛盾了……饥民，是人间唯一不怕死的活丧尸，无论多少东风巨浪威慑，都会扑过来撕咬……这也许就是身后的国际资本想要的——如果金融战、外交战、病毒战、贸易战、科技战、冷战热战都搞不倒你，已经把美国玩坏了的犹资蚂蝗又去哪里找新的宿主，非得让周边的丧尸群起攻之，撕下一大个血口子，才好他们趁虚而入啊……27年，巴基斯坦和朝鲜，到底能不能看住印度和日本，只能说尽有6-7成把握吧～～诺奖得主克鲁格曼称马斯克为「人形庞氏骗局」，如何评价这一说法？", "excerpt": "上个月说马斯克是庞氏骗局，这么快就爆了，很可能意味着一件很危险的事情将发生在27年！上个月说马斯克是庞氏骗局，这个月就爆了……爆的太快了，说明资本在非常着急的解套离场，连收割机的遮羞布都不要了……众所周知，任何为了长久割韭菜的画皮都是很珍惜的，这么不管不顾，看来有大动作。中日韩欧美，所有的主要股市都在跌，说明大量游资在套现撤离，要说普通常见的高位离场操作，不现实，毕竟高抛低吸的本质在于，高处能抛，", "url": "https://www.zhihu.com/pin/2064631122756101126", "votes": 0, "comments": 7, "feed_ts": 1785028547, "feed_time_str": "07-26 09:15", "category": "pin", "cat_name": "想法动态"}, {"actor": "大水哥", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "是不是有很多人宁愿等网约车，也不愿坐路边的出租车了？为什么？", "excerpt": "我对出租车没有好感，是因为2008年，512汶川地震，我是北川人。当时的情况是救护车完全不够用，绵阳的医院门口架满了帐篷，到处都是伤员需要转运，还有很多伤员灾民也是。很多社会上的好心人全都开车出来参与运送和救援了。而绵阳的出租车，开始抱团，集体涨价！发国难财！有一个女娃，需要送往绵阳就医，腿被压骨折了，发炎了，她这样子的伤在当时都算是轻的了，根本没有救护车能送她只能排队！最后拦到了一辆出租车，开口", "url": "https://www.zhihu.com/question/7979944824/answer/1980696768225222788", "votes": 2190, "comments": 138, "feed_ts": 1785028526, "feed_time_str": "07-26 09:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "2026 年菲尔兹奖公布，中国籍数学家邓煜、王虹获奖，如何理解他们获奖的意义？", "excerpt": "看了一圈回答好像都没人搬运详细介绍邓煜求学、求知与生活经历的好文章。籍由这篇文章，我觉得即使是对数学了解不深的人多少也能体味到邓煜精彩的世界观与精神世界。 余登因其在随机数据问题 |量子杂志在求知之路上深深受挫时，阅读百合漫画缓解精神压力： 为了寻求慰藉，邓煜转向了漫画。“我记得他在库朗数学研究所时，总是拿着一本漫画，”曾在该校担任数学系主任的教授贾拉尔·沙塔赫说道。邓煜尤其喜欢描写 let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'

        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

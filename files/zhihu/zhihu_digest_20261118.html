多模态训练合计。拨约 7.4% 或 15% 的总算力给编码器预训练，视觉问答与从零训练编码器接近，再提高比例时分数下降。将 MetaCLIP 的上游开销计入总账后，从零编码器在图示的两档主干及预算点达到或超过它。即使另做一组将现成权重视作免费的测试，语言主干从零训练时，表现最好的 MetaCLIP 也只与从零训练的编码器相当。同样是 4 亿参数，放在前八层且只给图像用在 17 亿参数主干的对照中，独立编码器的平均视觉问答是 44.4%，无编码器基线为 39.0%，把同样多的参数补进共享主干后仍为 38.6% 到 38.8%。把额外容量改成只由图像片段调用的前馈网络，放进主干前八层可做到 45.0%，放到最后八层只有 35.1%。保持前八层位置但允许文本调用时，分数也低于视觉专用方案。这几组对照分别检验了参数量、位置和使用对象。首个 token 能早多少，要看服务配置将视觉专用分支放进主干，可以省掉独立编码器必须先完成的串行步骤。在单张 H200、16 路并发且每个请求包含一张 448 像素图像和 256 个文本 token 的实验中，融合内方案以相近的视觉问答表现更早输出首个 token。论文也用已有的 17 亿参数语言模型做了续训对照，前层专用方案仍与从零训练的独立编码器接近。延迟结论受图文混合比例和调度方式影响，混合专家主干与生产流量不在这组对照中。原文标题：Unbundling Multimodal Vision Encoding#无影寺 ", "excerpt": "多模态模型去掉独立视觉编码器后，视觉专用参数该放在哪？图文版：链接去掉独立编码器后，模型先丢了什么独立视觉编码器先处理图像，再把特征送入图文共享的多模态主干。省掉编码器时，模型仍能把图像切块、投影后直接读入，但视觉问答变弱，读图中文字尤其明显。研究在同一数据和优化设定下主要比较 17 亿与 40 亿参数的稠密主干，分别测试编码器是否预训练、额外参数由图文共享还是视觉专用，以及视觉专用参数放在什么位", "url": "https://www.zhihu.com/pin/2106192188153520635", "votes": 0, "comments": 0, "feed_ts": 1794935411, "feed_time_str": "11-18 01:10", "category": "pin", "cat_name": "想法动态"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "想看看大家用Vibe Coding做了什么好玩的东西？", "excerpt": "我是一名叉车司机，为了解决一个工作中的问题，自学了面向Claude开发，花了大概1个月时间打磨出了这一块集装箱装箱算柜程序。现分享给有需要的朋友。 我在浙江宁波一家制造型任职，外贸企业，因为工作中经常要计算货柜。每次遇到装柜出货就头大。特别是像大件抛货又要混装小货的。计算器加加减减、按来按去，按得眼花缭乱，根本就弄不灵清怎么装好，普通人脑子里根本没有三维空间感啊！ 到底该订 20 尺普柜还是 40", "url": "https://www.zhihu.com/question/2044878223763403729/answer/2105419579698700315", "votes": 3153, "comments": 249, "feed_ts": 1794935012, "feed_time_str": "11-18 01:03", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "d1.2 和 d1.2-ultra：全模态决策模型Liquid AI 发布了 d1.2 和 d1.2-ultra。两款都可通过 Liquid API 调用，接收文字、图片和音频，返回选项概率或抽取结果等结构化答案。每百万输入 token 分别为 0.02 和 0.042 美元，输出不另收费。同一份发票问多项，共享输入计一次一张 1024×1024 的图片按发布博客的规则折算为 1,536 个输入 token。一次请求里，共用的内容只计一次，每个问题另计自己的指令、选项和答案槽位。比如从同一张发票提取金额、到期日和税额，可以在一次请求里分别提问。博客示例未找到增值税字段，返回空值。75 分来自决策指数按 Liquid AI 发布时引用的结果，d1.2-ultra 在 Artificial Analysis Decision Index v2.1 得到 75 分，比此前最高的决策模型高 2 分。指数综合五项评测的 Decision Score 和 AA-Symmetry 的 Symmetry Score。Decision Score 会考虑答案对错与置信度，Symmetry Score 衡量改写问题后决策是否稳定。内部测试中，ultra 的优势因任务而异在厂商用公开数据集留出划分做的内部测试中，收据读值的结果为 ultra 98%、d1.2 96%。在要求指出照片里每个物体的测试中，两款分别为 87% 和 90%。如果要按置信度决定哪些结果交给人工复查，阈值仍需用自己的任务数据校准。两款通过 API 提供，另有三款开放权重d1.2 和 d1.2-ultra 目前通过托管接口提供。文档列出的可下载权重是 d1-2B、d1-omni-2B 和 d1-omni-600M，均采用 LFM Open License。", "excerpt": "d1.2 和 d1.2-ultra：全模态决策模型Liquid AI 发布了 d1.2 和 d1.2-ultra。两款都可通过 Liquid API 调用，接收文字、图片和音频，返回选项概率或抽取结果等结构化答案。每百万输入 token 分别为 0.02 和 0.042 美元，输出不另收费。同一份发票问多项，共享输入计一次一张 1024×1024 的图片按发布博客的规则折算为 1,536 个输入 ", "url": "https://www.zhihu.com/pin/2106190242319549497", "votes": 0, "comments": 0, "feed_ts": 1794934907, "feed_time_str": "11-18 01:01", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价网友梗图“CNN报道黄仁勋的帝王专断连英伟达的食堂也不放过”？", "excerpt": "以前我都不会找茬，现在会了，黄仁勋让蜜雪冰城爱好者蒙羞😡", "url": "https://www.zhihu.com/question/2105975070460006609/answer/2106048133058782896", "votes": 736, "comments": 7, "feed_ts": 1794934508, "feed_time_str": "11-18 00:55", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "早期自由派和现在自由派的一个区别就是对宗教的态度早期国内自由派，在宗教问题上可以说都是“黄皮福音派”。著名的话术就是“中国人不信教没信仰，所以办事没有敬畏之心”这类自由派最典型的例子就是罗翔。只不过罗翔没说过这种话。但在疫情期间，随着自由派向左转，对宗教的态度就完全不一样了。如今“你的行为像宗教”“亚伯拉罕第四教”，反而成为了自由派爱用的骂人手段。我虽然对罗翔和前者没有啥恶意。但从对自由派的发展来看，去福音派化算是自由派演变中一个很成功的行为。", "excerpt": "早期自由派和现在自由派的一个区别就是对宗教的态度早期国内自由派，在宗教问题上可以说都是“黄皮福音派”。著名的话术就是“中国人不信教没信仰，所以办事没有敬畏之心”这类自由派最典型的例子就是罗翔。只不过罗翔没说过这种话。但在疫情期间，随着自由派向左转，对宗教的态度就完全不一样了。如今“你的行为像宗教”“亚伯拉罕第四教”，反而成为了自由派爱用的骂人手段。我虽然对罗翔和前者没有啥恶意。但从对自由派的发展来", "url": "https://www.zhihu.com/pin/2106044464603084343", "votes": 0, "comments": 9, "feed_ts": 1794933619, "feed_time_str": "11-18 00:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "夷陵笑笑生", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待近段时间网络上对国内 const catColors = {"ai": "#4c9aff", "gold": "#f5c542", "geo": "#ff9f45", "pin": "#52c41a", "other": "#9aa4b2"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

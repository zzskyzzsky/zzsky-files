B，体积 -84%）· 4-bit：372-475GB· 8-bit：810GB2-bit 量化可以直接跑在 256GB 统一内存的 Mac 上，也可以用 1 块 24GB 显存 GPU + 256GB 系统内存通过 MoE offloading 运行。上手路径（以 Unsloth Studio 为例）：步骤 1：安装 Unsloth。MacOS / Linux / WSL：```bashcurl -fsSL 链接 | sh```Windows PowerShell：```powershellirm 链接 | iex```步骤 2：启动 Unsloth Studio。```bashunsloth studio -H 0.0.0.0 -p 8888```然后打开 链接 。首次启动需创建密码。如果要通过 Cloudflare tunnel 安全暴露服务，官方也给了：```bashunsloth studio --secure```步骤 3：进入 Studio Chat 页面，搜索栏输入 GLM-5.2，选择需要的量化版本（推荐 UD-IQ2_M，即 2-bit，239GB）下载。步骤 4：下载完成后直接对话。Unsloth Studio 会自动设置推理参数、检测多 GPU 并做 RAM offloading。如果用 llama.cpp 跑，也支持：可通过 --reasoning on 或 --reasoning off 切换思考模式。思考模式说明：GLM-5.2 默认开启思考模式，支持三档——non-thinking（关闭）、high（高）、max（最大）。复杂任务建议用 max，日常对话可以关闭思考以加快响应。关闭方式：启动时加 --chat-template-kwargs &#39;{&#34;enable_thinking&#34;:false}&#39; 。推荐参数：temperature 1.0，top_p 0.95，最大上下文 1,048,576。量化精度参考（Unsloth 官方 KLD 测试数据）：· 1-bit：top-1 准确率约 76.2%，体积 -86%· 2-bit：top-1 准确率约 82%，体积 -84%· 4-bit / 5-bit：KLD 接近无损", "excerpt": "Unsloth：GLM-5.2 现在可以本地运行了这篇给想在本地跑大参数模型的人：Z.ai 发布的 GLM-5.2（744B 总参数，40B 激活参数，1M 上下文窗口），Unsloth 拿到 day-zero 访问权限后做了动态量化 GGUF，原版 1.51TB 的模型被压到 239GB（2-bit）或 217GB（1-bit）。这意味着它不再只属于数据中心，但也不是普通电脑能轻松上手：2-bi", "url": "https://www.zhihu.com/pin/2051068724803904712", "votes": 0, "comments": 0, "feed_ts": 1781792941, "feed_time_str": "06-18 22:29", "category": "pin", "cat_name": "想法动态"}, {"actor": "DefTruth", "verb": "MEMBER_COLLECT_ARTICLE", "verb_cn": "收藏了文章", "title": "ldmatrix详解, smem bank冲突,swizzle", "excerpt": "ldmatrix指令是 PTX 级别的指令，它是warp级别的数据加载指令，数据是从smem（shared memory）中加载到32个cuda thread中的寄存器中。也就是32个cuda thread大家都调用ldmatrix，把数据从smem中搬运到寄存器中！1. ldmatrix指令的使用格式例子: ldmatrix.sync.aligned.m8n8.x1.shared.b16 { %", "url": "https://zhuanlan.zhihu.com/p/697228676", "votes": 177, "comments": 30, "feed_ts": 1781792522, "feed_time_str": "06-18 22:22", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "搭载 DEEPX DX-M1 加速器，这款树莓派 AI HAT + 值得选吗？", "excerpt": "▲ Sixfab AI HAT+ for Raspberry Pi 5（搭载DEEPX DX-M1 AI加速器）◆ ◆ ◆ Sixfab近日正式发布了面向树莓派5（Raspberry Pi 5）的AI HAT+扩展板，该产品基于DEEPX DX-M1 AI加速器打造。此前，DX-M1加速器已先后出现在DEEPX DX-AIPlayer迷你PC、Mini DX-M1核心板（SoM）以及ALPON X", "url": "https://zhuanlan.zhihu.com/p/2050255849260634915", "votes": 1, "comments": 0, "feed_ts": 1781788507, "feed_time_str": "06-18 21:15", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "游千界", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "有没有一种可能，真正的美酒其实就是古代那种10多度、带有甜味和明显风味的酿造酒？", "excerpt": "很多人说年纪大了才懂酒，我反而认为，年纪大了更容易被烈酒驯服。 在一家卖精酿和黄酒的小店里。 那晚朋友过生日，桌上摆了四种酒，一瓶52度白酒，一瓶干红，一扎桂花米酒，还有店老板自己泡的蜂蜜苹果酒。最先空掉的，居然是那扎米酒，几个平时号称懂酒的人，端着小瓷杯喝得很安静，入口有一点甜，后面带米香，酒精度大概十度上下，脸微微热起来，人也跟着松了。 那瓶白酒开过两轮，大家都很会说，酱香、陈香、回甘、空杯留", "url": "https://www.zhihu.com/question/1963395975688230331/answer/2051048459562754812", "votes": 13, "comments": 1, "feed_ts": 1781788060, "feed_time_str": "06-18 21:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大又元", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "如何评价印度人认为中国也有种姓制度？", "excerpt": "自有大儒为我辩经，外网友人的这个提法可太妙了：中国是面镜子！ 日本游行，所能想到最狠的词叫“打倒中华帝国主义” 美国抹黑，往最坏了想兔子一定在搞集中营强迫劳动摘棉花； 英国离间，张口就说你搁非洲玩“新殖民主义”，当大号搅屎棍； 加拿大银义，栽赃中国最恶毒的话术是，你们迫害原住民也搞寄宿学校； 德意志怀古，貌似又打河北省来，他眼里的中国正在吞噬全世界； 你眼中的你不是你，别人眼中的你也不是你，你眼中", "url": "https://zhuanlan.zhihu.com/p/2051040180556059919", "votes": 19, "comments": 7, "feed_ts": 1781786086, "feed_time_str": "06-18 20:34", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "田地", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "至今我们对 Cloudflare 的发掘不到 1%今天聊聊咱们的赛博菩萨，cloudflare。（这个灵感源于昨天晚上刷到的推特上的一条帖子： 链接 ）这个家伙太巨大了，拥有 1. 1. 1. 1 这个神级 IP，和故宫房间有几千个，永远也逛不完一样，cloudflare 里面的免费功能太多了，领域跨度之大，绝大部分功能对于我来讲很陌生，至今认不全 cf 全家桶。它已经走了互联网 20% 的流量，是互联网的基础设施之一。（天天薅羊毛，我都害怕薅倒闭，慷慨不必多言）关键 AI 时代，有成熟久经考验的 CLI 工具，可以不像国内的云服务，各种权限配置乱七八糟的。这个直接 Codex 一连，啥都不用管，全交给AI。（还有 codex 官方的 cf 插件）首先是最实用的储存。云储存本来最大的厂商是 AWS ，产品叫 S3 ，是收费的，后来 cloudflare 过来搞了个 R2 ，并且直接上来给所有的用户免费提供了 10GB 的云储存空间！光R2零egress费这一条就够把 S3 按在地上摩擦这个是 API 级别的储存 坛，其实潜在客户不反感，一方面自己也需要", "url": "https://www.zhihu.com/question/2050565398152615741/answer/2050928621813076655", "votes": 902, "comments": 56, "feed_ts": 1781759488, "feed_time_str": "06-18 13:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "时予", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "女友想结婚后工资只用于自己消费，我要去负担家庭开支，并上交一半工资，能结婚吗?", "excerpt": "你找个翠花不好吗？你们村的翠花也是这个价。然后每个月给翠花点家用，逢年过节给买点东西就行了，翠花可好哄了，拼夕夕自由，就已经美得不要不要的了。翠花在家洗衣做饭带孩子，你日子美滋滋。 翠花没怎么读过书，出去工作也只能干体力劳动。也被工厂毒打过，知道在外面干活不好过。那你这话说的还好听：你养着她 。 翠花又不骄奢淫逸。平均衣服不到 100 块钱，一个月买它个三五件，都觉得自己衣橱要爆了，老公对她真好。", "url": "https://www.zhihu.com/question/1994874605622539412/answer/1999995638629287121", "votes": 202, "comments": 21, "feed_ts": 1781759123, "feed_time_str": "06-18 13:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价 6 月 11 日尚界 z7 首次录播拆车？", "excerpt": "给人一种高考卷子拿回家做还没考过别人的既视感", "url": "https://www.zhihu.com/question/2048504963555506031/answer/2049067389371805776", "votes": 260, "comments": 4, "feed_ts": 1781758892, "feed_time_str": "06-18 13:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "猫科の完全指南②--猞猁谱系", "excerpt": "近几个月来琐事缠身，笔者这稿拖的也是蛮久的，距第一篇发布已经过了4个月，本年内能否写完还是个未知数，尽量为之吧。笔者第一次知道“猞猁”（shē lì）这个词，还是在小学时从一本名为《猛兽世界万花筒》的小册子上读到。这本由一个名为小原秀雄的日本人原著，宋城摘取翻译的书本，主要内容是介绍各类猛兽生活习性，以及互相之间的捕食关系或战力对比，主要依据是保护者或是捕猎者的观察和经历，颇有些“猛兽大乱斗”的奇", "url": "https://zhuanlan.zhihu.com/p/37634084", "votes": 240, "comments": 44, "feed_ts": 1781757786, "feed_time_str": "06-18 12:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么这次牛市这么拉？", "excerpt": "地产调整，资产大头在房子上的来百姓没钱或者没胆来股市投资是主因。 没胆我多解释一下，你的房子每天都在跌价，你之前买来目的是增值的财产持续缩水，你就很难有安全感，只会恐惧，这种恐惧逻辑下，你的收入都会拿来还贷和存起来，而不是去消费和投资。这就是22-25年四年居民存款暴增60多万亿但消费不好股市也一般的原因。 22-24年惨烈的下跌还有一个外资高喊着“everything but China”疯狂卖", "url": "https://www.zhih const verbIcon = {"MEMBER_ANSWER_QUESTION": "✏️", "MEMBER_CREATE_ARTICLE": "📄", "MEMBER_CREATE_PIN": "💭", "MEMBER_VOTEUP_ANSWER": "👍", "MEMBER_VOTEUP_ARTICLE": "👍", "MEMBER_VOTE_PIN": "👍", "MEMBER_COLLECT_ANSWER": "📌", "MEMBER_COLLECT_ARTICLE": "📌"};
const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};
const catOrder = {"ai": "AI · 技术 · 算法", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

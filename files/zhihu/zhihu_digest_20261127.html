": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "《潜伏》里余则成送给站长的见面礼是哪来的？吴站长的直觉是对的，余则成老家不可能有这种稀罕物件，余则成编的谎漏洞百出，只不过站长无从查证，也懒得查证。那么，这个稀罕物的来历是什么？中共情报系统的秘密经费。八路军驻重庆办事处长期存放着珍贵古董，字画，宝石，象牙等贵重物资，用途很简单，用来结交国民党高层领导，其二就是打通关节，换取各类物资安全送到根据地。根据地在抗战时期处于被封锁状态，日占区和国统区都在对根据地实施贸易禁运，为了打破封锁，边区政府在北京，上海，天津，广州，香港等地开设公司，有的公司则开设古玩店销售古董。余则成送给站长的珠子，就是在库房里挑了一个，小巧，好携带，价值足够引起一个国民党少将的兴趣；因为八路军驻重庆办事处有很多这样的宝贝，早就进行过精准的分析。所谓夜明珠也只有进了敌占区才值钱，在根据地就是个工具，用来达成目的，所以，余则成用来贿赂站长的夜明珠来自中共情报系统的仓库，精准锁定站长喜好，迅速拉进余则成和站长之间的关系。《潜伏》里余则成送给站长的见面礼是哪来的？ #潜伏细节  #潜伏行情  #潜伏( ", "excerpt": "《潜伏》里余则成送给站长的见面礼是哪来的？吴站长的直觉是对的，余则成老家不可能有这种稀罕物件，余则成编的谎漏洞百出，只不过站长无从查证，也懒得查证。那么，这个稀罕物的来历是什么？中共情报系统的秘密经费。八路军驻重庆办事处长期存放着珍贵古董，字画，宝石，象牙等贵重物资，用途很简单，用来结交国民党高层领导，其二就是打通关节，换取各类物资安全送到根据地。根据地在抗战时期处于被封锁状态，日占区和国统区都在", "url": "https://www.zhihu.com/pin/2109435237285609857", "votes": 0, "comments": 0, "feed_ts": 1795708553, "feed_time_str": "11-26 23:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "《潜伏》里余则成送给站长的见面礼是哪来的？", "excerpt": "吴站长的直觉是对的，余则成老家不可能有这种稀罕物件。余则成编的谎漏洞百出。只不过站长无从查证，也懒得查证。 根据地也没有这种东西，碰巧缴获的可能性很低。因为那是战争时期，各方势力犬牙交错，想要侦破一桩盗窃文物案，非常艰难。 碰巧抓获，怎么看都不太可能。 那么，这个稀罕物的来历是什么？ 中共情报系统的秘密经费。 现在不是什么秘密了，八路军驻重庆办事处长期存放着珍贵古董，字画，宝石，象牙等贵重物资。 ", "url": "https://www.zhihu.com/question/1995997181602207634/answer/2109434912772200390", "votes": 14, "comments": 0, "feed_ts": 1795708475, "feed_time_str": "11-26 23:54", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "国际友谊赛，阿根廷 3-0 贝宁，如何评价本场比赛？阿根廷队长迎来国家队告别战，你有哪些感触？", "excerpt": "今天不聊阵容、不讲战术，只专注梅西的表现，安安静静的看完他国家队的最后的90分钟。 即便终场哨响，依然是非常的不舍。 那些熬夜看完的球，为胜利欢呼，为输球失眠，有巅峰、有高潮、有成功、也有失意和遗憾，如今全部都化为一句……「队长，再见」。 我们习惯了10号球衣上一直印着MESSI的名字，在他告别之际，发现时间过去了整整 7720天，合计21年。转头一想，我们告别的只是梅西吗？ 还有我们追了梅西整整", "url": "https://www.zhihu.com/question/2091083217755268916/answer/2091097419651998182", "votes": 1511, "comments": 106, "feed_ts": 1795707159, "feed_time_str": "11-26 23:32", "category": "oth 都要赔钱的，何况是看错方向？不亏钱，或许你就跑赢了90%以上的投资者啦。--基本金属：1）你是空伦敦铜对冲原油1：1的对冲仓位，对冲的是你的原油仓位的风险，这段时间变化太大太快，做对冲较好，因此原则上你不能把伦敦铜的对冲仓位全部平仓。但你可以把多余的伦敦铜仓位减去。2）我知道，在过去的很长一段时间内，金属们和原油是反向的关系，也就是如果伦敦铜涨，原油弄不好跌~~~，但，今昔不同往日，你要想想为什么我们几周前让你拿伦敦铜来对冲原油的风险，因此，这两个商品同涨同跌是可能出现的，我说的。3）至于其他的基本金属，甚至你的有色金属的票，你已经开出了对应的对冲空单来做保护的话，拿稳基本部位即可，反弹发生后再加仓或许效果更好。再啰嗦一遍：期货期权的本质是用来保护的，也就是买保险的，而不是让你快速赚钱。如果是空手的，持币观望即可，这里胜算不高，还是对冲做法更保险。给出 黄金 伦敦铜（锡） 有色金属 白银 的近期规划（更快更详细的规划请参阅我们的每日更新的专栏文章的内容），其余图片是近一年内的黄金白银的一些关键节点的选择，供大家参考。", "excerpt": "黄金白银，基本金属，烂泥扶不上墙？黄金白银，基本金属，烂泥扶不上墙？昨晚的白银跌破40美元/盎司（最低38.18），黄金跌破3500美元/盎司（最低3426）后，势如破竹，盘中大拉特拉，但到了今天的亚洲盘，立马就又萎了下来。欺负我亚洲老表们口袋里面没美元么？1）先说，昨天的PCE（CPI）数据发布前，我已经写了金属们的反弹剧本了：“今晚有CPI，无论公布的数字是怎样的，11月的原油大跌价，AI硬件", "url": "https://www.zhihu.com/pin/2109327033796973498", "votes": 0, "comments": 22, "feed_ts": 1795683449, "feed_time_str": "11-26 16:57", "category": "pin", "cat_name": "想法动态"}, {"actor": "UFO", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "上海微电子新一代光刻机模型亮相，该成果实现量产还需要攻克哪些核心难点？", "excerpt": "没有且听龙吟，没有遥遥领先，大概也许是真的，值得鼓励", "url": "https://www.zhihu.com/question/2102816165504591480/answer/2103254709821874981", "votes": 8, "comments": 0, "feed_ts": 1795683428, "feed_time_str": "11-26 16:57", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "剑锋无尘", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "金价、美股「V型巨震」，英伟达再跌近4%，黄金收复3500，美国PCE达3年最高水平，反弹要开始了？", "excerpt": "美股现在最大的风险，是AI资本开支周期的拐点。注意是资本开支增速拐点，不是利润增速拐点，这个很少有人提到过。 AI行业还在继续发展不假，但是市场交易的是这个拐点，也就是AI行业要从加速繁荣走向减速繁荣。就算AI企业利润继续涨，资本开支价格再创新高，只要增速开始下降，也不妨碍美股提前见顶。 美国中期选举后，民主党夺得两院，就是这个转折点。10月初市场就已经开始博弈特朗普要输掉两院，纳指就已经在跌，中", "url": "https://www.zhihu.com/question/2109199474451018240/answer/2109328471881270387", "votes": 0, "comments": 0, "feed_ts": 1795683097, "feed_time_str": "11-26 16:51", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么玩家一边讨厌数值膨胀，一边又渴望更大的伤害数字？", "excerpt": "现在一些大厂的游戏，运营模式越来越像体制内的官老爷。 尤其是到了年底，就会明显表现出“赚一波就跑”的趋势。 在网易这一类大公司，一个游戏一 : "如何看待华为正在探索的全新的定制 HBM 架构？", "excerpt": "现在HBM那几个AI卡大户占据了绝大部分产能（尤其是nv），对于他们来说维护一个让大家都不痛快的jedec的标准HBM没有任何意义，不如按照需求各做各的。单单让内存厂把落后工艺base die交出来让客户自己用先进工艺定制一条，就比让他们整天水一万篇破烂pim的论文有用多了，如果能把控制器集成进来更是能大幅度提高面积效率 NV那边也搞了nvhbm，缩小面积还能提高带宽，其加几家包括TSMC都有动作", "url": "https://www.zhihu.com/question/2108775465695695165/answer/2109318823010628376", "votes": 48, "comments": 0, "feed_ts": 1795680797, "feed_time_str": "11-26 16:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "正解局", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "半年亏8000万的巴西水泥商，中国企业为何抢着买？", "excerpt": "一场跨越半个地球的水泥争夺战，买家终于浮出水面。 前段时间，中国水泥巨头华新建材拟拿出约109亿元，收购巴西第二大水泥生产商CSN Cimentos（巴西国家钢铁水泥公司，下称“CSN水泥”）99.99%的股权。 此前，中国水泥网披露，中国建材、海螺水泥也曾进入潜在买家名单。 更特别的是，这家巴西企业目前仍处于亏损状态，却一度吸引多家中国水泥巨头参与竞购。 水泥运不远，水泥企业却可以走得很远。 华", "url": "https://zhuanlan.zhihu.com/p/2109314909133616079", "votes": 5, "comments": 0, "feed_ts": 1795680260, "feed_time_str": "11-26 16:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "野狼獾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么美军不重视野战防空?", "excerpt": "我想起以前一个电影《棋王》，其中一个老棋手逼格很高。他的将是钉死在棋盘里的，他不需要动这个子。还想起以前听过一个相声，说某人打麻将自称不用带钱，别人不信，打两圈发现他确实不用带钱。", "url": "https://www.zhihu.com/question/325335097/answer/2109314548796870843", "votes": 72, "comments": 10, "feed_ts": 1795679778, "feed_time_str": "11-26 15:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "【新闻乱递】丹尼索瓦人：嘿嘿嘿我又来了显而易见，我的同行们已经麻木了——很大程度上，我们对丹尼索瓦人的态度已经从好奇转向了困惑。许多没有持续关注古人类发现的朋友甚至会疑惑为什么上个月的新闻这个月又冒了出来——这些丹尼索瓦人到底有什么不同？这些曾经遍布中国大地的古人类到底有什么特殊的地方，以至于需要一次又一次霸占《自然》的新闻头条？在一切的最开始，丹尼索瓦人只是一个特殊的地方类群——古人类学家只将其视为一种地方性的古人类。但是随着古DNA与古蛋白质的持续发现，我们发现，丹尼索瓦人成为了曾经东北亚地区最成功的人属物种之一。他们同时与现代智人和尼安德特人都发生了复杂的交流与融合，而在东亚地区，他们可能还与某些未知的直立人产生过联系。在东北亚地区，古人类的演化确实呈现出了一种奇异的混合现象，而目前来看，丹尼索瓦人或许是各个不同类群之间的纽带。2026年11月26日，《自然（nature）》刊发最新研究：在我国广西地区的洞穴中，发现了一系列古老的人类牙齿化石。古蛋白质组的证据表明，这些古人类中的一部分属于丹尼索瓦人，与之前发现的类群分享同样的单氨基酸突变位点，而同时，在穿山洞中，还发现了一类与丹尼索瓦人及智人都不同的新人类——这些新人类携带与早期直立人类群先驱人（Homo antecessor）和大型猿类相同的单氨基酸突变，这表明，在中国广西地区，可能确实存在着一支极为晚近的，可能与直立人相关的未知群体。他们与丹尼索瓦人共处同一时空，广西地区的亚热带雨林可能提供了良好的庇护，使得这只古人类坚持到了相当晚的时间。论文链接：链接【Sunny乱评】目前来看，广西的洞穴中还有很大概率出现新的牙齿化石。从最早吹风洞开始，到现在的一批洞穴沉积都证明了亚热带地区乃至热带地区的潜力，很有可能我们会在未来的某个时候听到中南半岛的新发现——就目前的趋势来看，俺寻思直立人在东亚极有可能搞了一出孤行东南山。而对于牙釉蛋白本身，我其实一直很疑虑这类蛋白的演化速率。因为作为结构蛋白，它相比于珠蛋白，其突变速率能否如实反映系统演化关系其实是比较危险的。不过整体来说，这个演化关系其实也足以识别出丹尼索瓦人内部的一些差异——我还是很期待未来的发现，尤其是更进一步的遗传证据。当然，如果更加熟悉这些工作的朋友可能还能见到一些细微的描述性差异——在这点上我还是很赞同付老师的做法的。#古生物学  #古人类学 ", "excerpt": "【新闻乱递】丹尼索瓦人：嘿嘿嘿我又来了显而易见，我的同行们已经麻木了——很大程度上，我们对丹尼索瓦人的态度已经从好奇转向了困惑。许多没有持续关注古人类发现的朋友甚至会疑惑为什么上个月的新闻这个月又冒了出来——这些丹尼索瓦人到底有什么不同？这些曾经遍布中国大地的古人类到底有什么特殊的地方，以至于需要一次又一次霸占《自然》的新闻头条？在一切的最开始，丹尼索瓦人只是一个特殊的地方类群——古人类学家只将其", "url": "https://www.zhihu.com/pin/2109295352125854938", "votes": 0, "comments": 9, "feed_ts": 1795679091, "feed_time_str": "11-26 15:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "很明显GOP应该是解雇了所有groyper潮酷小登，回到了春登模式，吃准45+白人新教徒基本盘不动摇了，不然不会做出来这张图↓PS:《GTA6》设定背景是雷奥尼达州（Leonida），其灵感就是来自于川普1.0时期开始变成深红州的佛罗里达", "excerpt": "很明显GOP应该是解雇了所有groyper潮酷小登，回到了春登模式，吃准45+白人新教徒基本盘不动摇了，不然不会做出来这张图↓PS:《GTA6》设定背景是雷奥尼达州（Leonida），其灵感就是来自于川普1.0时期开始变成深红州的佛罗里达", "url": "https://www.zhihu.com/pin/2109310737160185521", "votes": 0, "comments": 2, "feed_ts": 1795679084, "feed_time_str": "11-26 15:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "UFO", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么马督工的反对者不去抢马督工的生态位？", "excerpt": "马逆的生态位是：坚持观察国内的社会问题 马逆反对者态度是：国内没有问题 请问怎么抢？ ", "url": "https://www.zhihu.com/question/1987902217534085017/answer/1993744686263857488", "votes": 2462, "comments": 203, "feed_ts": 1795678962, "feed_time_str": "11-26 15:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "纳什均衡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么有些人会那么双标，为什么呢？", "excerpt": "做理财自媒体这两年，我逐渐明白了一个道理，就是不要轻易把私人情谊和商业合作混为一谈。 人与人之间，在没有利益交集的时候，往往能够相谈甚欢，甚至产生一种志同道合的错觉。但是随着流量、资源、社群规模的不断扩大，彼此的关系 和党州长也不应该背锅），都是智商不如禽兽【直球】，属于“叽叽喳喳，禽鸟之音”。我现在发现了，富恩特斯和卡尔森跟两党极端选民和包括川普在内的故意互相煽动对立的政客相比，他俩甚至都算是正常人。难怪卡尔森天天“美国版恨国党”感叹江山社稷要完蛋。而Rob Sand作为支持拥枪权的基督徒白男（他说过自己就持枪，还喜欢打猎）加入民主党，但是又对28年总统选举直接表示“不知道，与我无关，对将来作为州长会支持谁参选也不感兴趣”。这么多智力如同禽兽的选民和政客在各种传播阴谋论，让我甚至开始支持言论管制了。并且，一个幽默笑话：美国在大洋彼岸的形象比在美国人自己眼里好。因为老钟这边所有针对美国的负面新闻，都是美国人自己先开始阴谋论瞎说的，官媒只不过是搬运工，甚至还收着点，不会像阴谋论网畜那么扯淡。", "excerpt": "Rob sand：跟着这样的一群虫豸在一起，怎么能搞好政治和治理呢？指责川普“引爆核弹，明天就没有艾奥瓦州了”的Dem选民和指责桑德“还没上任就应该负责”的GOP选民（哪怕是州政府责任，也应该怪现任共和党州长，何况是美国陆军引爆的，又不是州政府负责，现任共和党州长也不应该背锅），都是智商不如禽兽【直球】，属于“叽叽喳喳，禽鸟之音”。我现在发现了，富恩特斯和卡尔森跟两党极端选民和包括川普在内的故意互", "url": "https://www.zhihu.com/pin/2109273095529944815", "votes": 0, "comments": 0, "feed_ts": 1795677853, "feed_time_str": "11-26 15:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "朝花夕拾", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "你什么时候意识到送外卖永无出路？", "excerpt": "送外卖平均下来时薪也就十五块，二十块？ 一天十三四个小时，能有个两百多？ 一个月几乎不休息，能有个六七千？ 本质上还是计件模式，工资线性增长。 外卖员很容易陷入困境，为了多赚几十块，所以愿意尽可能延长上班时间，但收入不存在爆发性增长的可能。 而一味的延长上班时间，反而会导致身体出问题，而且无暇顾及别的出路。 ", "url": "https://www.zhihu.com/question/2049310166701577632/answer/2109303359928849400", "votes": 1, "comments": 0, "feed_ts": 1795677110, "feed_time_str": "11-26 15:11", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大鹏人文", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "现在我国大病（癌症）基本不要钱吗？", "excerpt": "不是不要钱，是要很多钱。我就是一位恶性肿瘤患者。做了两次手术花了快三十万了。是报销了不到七万元。 第一次手术在广西做的，花了五万多，报了两万多。 第二次手术在上海做的。花了二十多万，只报销不到五万。 现在的重疾是要花很多钱的，动不动就几万，几十万。一般老百姓患了重疾根本看不起呀！ ", "url": "https://www.zhihu.com/question/663406319/answer/3583391167", "votes": 344, "comments": 32, "feed_ts": 1795676502, "feed_time_str": "11-26 15:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "Dio-晶", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待华为正在探索的全新的定制 HBM 架构？", "excerpt": "简单点说，就是利用Wafer on Wafer的封装技术，就可以用相对落后的内存制程（含存储密度和主频），实现很高的HBM带宽。 夏core之前其实在一篇文里头说过，HBM只要非标都好说。 目前的麒麟9050是Wafer on Wafer 目前长江存储的232层是Wafer on Wafer on Wafer，wowow。 华为这个HBM，当于是Wafer on 稀有照片？", "excerpt": "上古时期的杨幂 ", "url": "https://www.zhihu.com/question/376634565/answer/2075732188298059923", "votes": 1933, "comments": 94, "feed_ts": 1795664767, "feed_time_str": "11-26 11:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有什么你从未见过的稀有照片？", "excerpt": "这张照片保证很少有人见过。1962年5月26日，朱德总司令到昆明筇竹寺参观，刚好碰到昆明市第11中学的几个学生在下棋，朱总司令就坐下去现看，学生们也不知道，认为是某位邻家大爷呢。 朱总司令说，他到昆明就像回故乡一样，凡我到之处，不准清场。 ", "url": "https://www.zhihu.com/question/376634565/answer/2018433442715563050", "votes": 3889, "comments": 102, "feed_ts": 1795664716, "feed_time_str": "11-26 11:45", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "1976年7月，一把挂锁咔嗒一声锁上了哈佛大学实验室的门，里面的研究被宣布为非法。剑桥市议会刚刚投票禁止这项研究。莉迪亚·维拉-科马罗夫将她的玻璃移液管和实验笔记装进一个纸板箱。她的试管里的细菌无害，但市政府并不在乎。十一年前，莉迪亚被告知她根本就不适合从事科学。她1947年出生于新墨西哥州圣菲，在一个有五个兄弟姐妹、父亲教音乐、母亲做社会工作者的家庭长大。在她的社区，女性被期望成为教师或护士。莉迪亚在翻阅舅舅的旧大学教科书后选择了化学。1965年，她坐在华盛顿大学的指导老师办公室里，申报专业。办公桌后的男人审阅了她的学业档案，抬头看着她，说女性不适合化学专业。莉迪亚站起来走出去。她转学到马里兰州的古彻学院，并将重点转向生物学。即使在那里，摩擦也从未停止。在20世纪60年代，硬科学被视为白人男性的专属领地。作为一名来自西南部的墨西哥裔美国女性，莉迪亚不断被误认为是秘书，并在研讨会前被要求去取咖啡。当她转到麻省理工学院攻读博士学位时，压力更大了。她第一次口试资格考试失败，评审小组建议她重新考虑学术道路。她走到科学大楼的一个混凝土楼梯间，坐在台阶上哭了。然后她回到图书馆，并在下一次尝试中通过。到1976年，她已成为哈佛大学的一名博士后研究员，在一个团队中工作，试图解决一场悄无声息的全球紧急事件。世界正在耗尽胰岛素。数百万糖尿病患者依赖日常注射来维持生命，而供应链残酷无情。制药公司必须从屠宰的猪和牛的胰腺中提取这种激素。生产一磅可用胰岛素需要八千磅动物腺体。随着人类人口增长，牲畜数量跟不上。严重的医疗短缺在数学上是不可避免的。莉迪亚的团队正与加利福尼亚的竞争实验室赛跑，试图完成前所未有的事情。他们的计划是将哺乳动物的遗传密码拼接进一段称为质粒的环状细菌DNA中，将普通细菌变成微观的药物工厂。然后当地政治将一切停滞下来。市长读了一篇关于基因工程的杂志文章后，召集了一次紧急市议会会议。惊恐的居民挤满了市政大楼，坚信变异细菌会从哈佛逃逸并污染城市供水。科学家们试图解释他们的安全协议，但议会投票决定立即暂停。就在一夜之间，哈佛团队被锁在自己的实验之外。莉迪亚和她的同事们将脆弱的设备装进汽车后备箱，开车数百英里前往纽约的冷泉港实验室，那里不在禁令管辖范围内。他们在空宿舍的行军床上睡觉，在借来的空间里工作，那里被严格的负气压密封。每当一扇门打开，空气就会流入而不是流出。即使他们穿着厚重的袍子和手套，消毒每一滴化学废物，并使用一种闻起来像腐烂垃圾的大肠杆菌菌株，那股臭味仍会在他们离开大楼很久后附着在衣服和头发上。在学术层级中，几乎没什么改变。在一次主要部门评审中，一位资深男科学家站在黑板前，向全场讲解莉迪亚花了整整一个月精炼的一种技术。他从未提及她的名字。莉迪亚坐在观众席上听着。结束后，她回到工作台，开始下一个序列。几个月来，工作就是日常失败的磨砺。他们用一种化学指示剂涂抹培养皿，如果细菌吸收了胰岛素基因，这种指示剂会将细菌菌落变成蓝色。一周又一周，培养皿保持透明。资助资金快耗尽了。加利福尼亚的竞争团队在一项不同激素上发表了重大突破。每天早上，莉迪亚检查培养箱，调整温度刻度，并在日志中记录另一轮失败的培养皿。终于，团队改变了策略。他们没有直接针对活性胰岛素，而是构建了其生物前体前胰岛素的遗传序列。他们感染了一批新鲜的大肠杆菌，倒上新的琼脂培养皿，并将它们置于加热中等待。1978年中，莉迪亚从培养箱中取出一叠塑料培养皿。琼脂上布满了微小的蓝色点。为了证明细菌确实在产生这种激素，她用一种只与胰岛素序列结合的放射性探针清洗培养皿，然后在暗房中将它们压在X射线胶片上。当她将冲洗好的胶片举到灯光下时，小块深色污点直接与细菌菌落对齐。有史以来第一次，一种微生物产生了哺乳动物激素。团队在《美国国家科学院院刊》上发表了他们的发现，莉迪亚被列为主要作者。不久，这种方法被改编用于人类胰岛素，结束了世界对动物器官的依赖，并将可靠的药物置于全球药店货架上。如今，数百万人在每天服用胰岛素时，从不知道那位在麻省理工楼梯间哭泣、在借来的宿舍里洗去大肠杆菌气味、以及在黑板上被忽略姓名时仍坚持检查培养箱的女人。", "excerpt": "1976年7月，一把挂锁咔嗒一声锁上了哈佛大学实验室的门，里面的研究被宣布为非法。剑桥市议会刚刚投票禁止这项研究。莉迪亚·维拉-科马罗夫将她的玻璃移液管和实验笔记装进一个纸板箱。她的试管里的细菌无害，但市政府并不在乎。十一年前，莉迪亚被告知她根本就不适合从事科学。她1947年出生于新墨西哥州圣菲，在一个有五个兄弟姐妹、父亲教音乐、母亲做社会工作者的家庭长大。在她的社区，女性被期望成为教师或护士。莉", "url": "https://www.zhihu.com/pin/2109017994915476130", "votes": 0, "comments": 5, "feed_ts": 1795664681, "feed_time_str": "11-26 11:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有什么你从未见过的稀有照片？", "excerpt": "不稀有，但会硬控你30″。 ", "url": "https://www.zhihu.com/question/376634565/answer/2065071112501960960", "votes": 4644, "comments": 213, "feed_ts": 1795664681, "feed_time_str": "11-26 11:44", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "这还真是共和党的锅，最近十几年在反智主义的道路上狂飙突进，以至于在知识分子群体中只剩下居心叵测的坏人，和除了减税涨股票外什么都不关心的日子人，满嘴神神叨叨的宗教狂魔以外什么都剩不下来......如此也给了各大媒体一记重击：混入新闻界的人越来越多，水平每况愈下。NYT选举之夜的报导水平烂的不堪入目，刷1个小时都没有任何有效信息，全都是概念性的，大而化之的废话，刷10分钟推特的收获远大于阅读主流媒体报导......", "excerpt": "这还真是共和党的锅，最近十几年在反智主义的道路上狂飙突进，以至于在知识分子群体中只剩下居心叵测的坏人，和除了减税涨股票外什么都不关心的日子人，满嘴神神叨叨的宗教狂魔以外什么都剩不下来......如此也给了各大媒体一记重击：混入新闻界的人越来越多，水平每况愈下。NYT选举之夜的报导水平烂的不堪入目，刷1个小时都没有任何有效信息，全都是概念性的，大而化之的废话，刷10分钟推特的收获远大于阅读主流媒体报", "url": "https://www.zhihu.com/pin/2109219034663277394", "votes": 0, "comments": 9, "feed_ts": 1795664594, "feed_time_str": "11-26 11:43", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "传言沙特要废除PLC，改为更精简的领导机构", "excerpt": "传言沙特要废除PLC，改为更精简的领导机构", "url": "https://www.zhihu.com/pin/2109191827630863595", "votes": 0, "comments": 5, "feed_ts": 1795664532, "feed_time_str": "11-26 11:42", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "欧盟首次引用首次在反倾销税中计入中国产能过剩对第三国市场的影响,开了先例会产生什么影响？", "excerpt": "无所谓，欧洲是主权国家，它们有权采用贸易保护政策，它们闭关锁国都可以。只不过，我们要把概念说清楚，贸易保护就是贸易保护，不要又当又立。欧洲国家特别喜欢装，经常把自私野蛮的行为包装成普世价值，这点它们确实还不如特朗普。 在国际贸易中并不存在产能过剩这一概念。什么意思？欧盟正在创造概念，或者说，欧盟模糊反倾销调查的核心问题——这些第三国出口到欧盟的货物，是否以低于其国内市场的价格出售，它们正在改写反…", "url": "https://www.zhihu.com/question/2106142031877822029/answer/2108467199916745139", "votes": 845, "comments": 64, "feed_ts": 1795664456, "feed_time_str": "11-26 11:40", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有什么你从未见过的稀有照片？", "excerpt": "某革命历史纪念馆拍摄。 ", "url": "https://www.zhihu.com/question/376634565/answer/2065083519206953442", "votes": 1482, "comments": 9, "feed_ts": 1795664404, "feed_time_str": "11-26 11:40", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待《两京十五日》火烧太庙、射太祖画像的剧情？", "excerpt": "再一次戳破了一个历史圈流传很久的谣言。 谣言：为什么满清戏那么多？因为文娱圈被满族遗老把持了。 而实际情况是：为什么满清戏那么多？因为明朝剧难伺候，没收视率不挣钱，然后稍微好点的也不出圈，但是挑毛病的还一大堆，给你上强度，清朝剧就随便祸祸了，各种批发绿帽子也没事。 ", "url": "https://www.zhihu.com/question/2107834692301071129/answer/2108682601200345589", "votes": 1911, "comments": 19, "feed_ts": 1795663781, "feed_time_str": "11-26 11:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有什么你从未见过的稀有照片？", "excerpt": "他抓拍的瞬间被抓拍 ", "url": "https://www.zhihu.com/question/376634565/answer/1984405375781457947", "votes": 18214, "comments": 55, "feed_ts": 1795663763, "feed_time_str": "11-26 11:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "沧海无浪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价黄仁勋这个人？", "excerpt": "已经成为p图素材了 上面是原图 ", "url": "https://www.zhihu.com/question/1985470887412131189/answer/2107359780276850957", "votes": 1857, "comments": 213, "feed_ts": 1795663728, "feed_time_str": "11-26 11:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待《两京十五日》火烧太庙、射太祖画像的剧情？", "excerpt": "烧的好，射的妙。怎么了？大明死了几百年还说不得？不就是改编电视剧吗一群人搁哪应激什么呢？乾隆雍正就可以改编，朱家改编不了？ 这个时候讲祖宗体面国法了？朱老四奉天靖难抢祖宗江山，写《奉天靖难记》篡改历史不承认建文，然后岁月史书的时候咋不讲祖宗体面了？ 我以前觉得《大明风华》拍的不怎么样，现在看简直首尾呼应，大明风华的开头是朱棣屠戮建文臣子，结尾是夺门之变朱祁镇屠戮景帝旧臣。说白了就是你们老朱家为了一", "url": "https://www.zhihu.com/question/2107834692301071129/answer/2108697058395820270", "votes": 673, "comments": 138, "feed_ts": 1795663714, "feed_time_str": "11-26 11:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有什么你从未见过的稀有照片？", "excerpt": "在斯大林时期坐办公室的勋宗 1947年，乌克兰苏维埃社会主义共和国扎波罗热 ", "url": "https://www.zhihu.com/question/376634565/answer/2090119052152795652", "votes": 1168, "comments": 61, "feed_ts": 1795663642, "feed_time_str": "11-26 11:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大水哥", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "鲁路修和修奈泽尔的综合能力谁更优秀呢？可否分析一下？", "excerpt": "路线错了，能力越强越反动。 修奈泽尔能力很强，但是他不相信民众，他是标准的精英叙事，本质上跟他老爹一种人，认为民众需要服从牧羊人，需要用恐怖高压的统治维护和平。 鲁鲁修则是完全相反，最早带着一堆人离开日本到蓬莱岛，他就说了一个国家最重要的是民众，包括整个零之镇魂曲，主线也是让民众意识到“神是会流血的”这件事。鲁鲁修一直相信着民众，他甚至在零之镇魂曲执行前，先给旧财阀，大贵族们屠了个干净，给后续的革", "url": "https://www.zhihu.com/question/315706375/answer/2106924390843675483", "votes": 13, "comments": 0, "feed_ts": 1795662834, "feed_time_str": "11-26 11:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有哪些本地人常吃，但游客很少知道的美食？", "excerpt": "去烟台或者威海旅游的小伙伴，可以增加一项去牟平（属于烟台）的行程，比如去养马岛等。 除了去看果冻海，更重要的是去牟平市区吃吃吃… 牟平绝对是一个美食超过你想象的地方。 一是遍地包子店，是的，你没看错！各种你没有见过或者听过的馅，碱蓬子，茴香，槐树花， const catColors = {"ai": "#4c9aff", "gold": "#f5c542", "geo": "#ff9f45", "pin": "#52c41a", "other": "#9aa4b2"};
const catOrder = {"ai": "AI · 技术 · 算法", "gold": "黄金 · 股票 · 市场", "geo": "地缘 · 经济 · 能源", "pin": "想法动态", "other": "社会 · 文化 · 其他"};
const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();

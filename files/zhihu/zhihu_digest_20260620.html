rb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "美国人均GDP奔着十万美元去了，美国人的日子真的比十年前、二十年前更好了吗？", "excerpt": "我第一次觉得美国人均GDP这东西有点虚，是在加州一家便利店门口，一瓶可乐标价2.79美元，结账时加上税接近3美元。 当时我刚下班，手里拿着一份超市打折三明治，7.49美元，里面夹着两片火鸡肉和一片发软的生菜；旁边一个白人老头看我盯着价格发呆，顺口说，二十年前这东西一美元多。我问他现在退休日子怎么样？他笑了一下，说房子早买的人还行，年轻人就辛苦了。 这句话我后来越想越对！！美国人均GDP已经在八万美", "url": "https://www.zhihu.com/question/599774994/answer/2051427293801739608", "votes": 24, "comments": 21, "feed_ts": 1781878381, "feed_time_str": "06-19 22:13", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "游千界", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "是不是韩国每年民调显示最讨厌的都是中国？如果是，为什么？", "excerpt": "我以前读高中时，班上有个女生，漂亮，成绩好，家里条件也好，最让人烦的是，她在班里还挺受欢迎。 她坐在靠窗位置，书包总是收拾得很清爽，校服穿在她身上也显得合身；她数学卷子常年接近满分，英语老师让她读课文时，后排男生会突然安静下来。那种人放在青春期班级里，很容易让旁边的人心里发酸，特别是另一个也很想被看见的女生。 我隔壁桌那个女生就很讨厌她。 表面上，两个人关系还行，下课会借笔记，体育课会一起去小卖部", "url": "https://www.zhihu.com/question/663679597/answer/2051418322298843233", "votes": 30, "comments": 3, "feed_ts": 1781876242, "feed_time_str": "06-19 21:37", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "王子君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "网传飞猪大规模裁员，员工自曝比例达 40~65%，部分业务全线关停，具体情况如何？为什么会大规模裁员？", "excerpt": "谢邀。 很熟的某手机厂商，原定五月裁员，一波干掉本地四分之一的那种； 阁级话事人得知后，亲自上门，希望缓缓，毕竟一波干掉这么多小白领很伤； 老大谈罢，同意缓缓：从五月一次性裁完，改为分六七八三月裁完。 话事人都话不了事，说明这波裁员是暴击真伤。 灰猪这块，我认识的一位技术小拿已经收信。 杭州比北方好点，本地沟通应该还顺畅，没有出现上面那种尝试拦截。 估计心里也清楚，拦不住。 这波大裁看起来没有针对", "url": "https://www.zhihu.com/question/2050975365225342926/answer/2051416232553980852", "votes": 1293, "comments": 75, "feed_ts": 1781875743, "feed_time_str": "06-19 21:29", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "哪一刻让你终于意识到了这就是命?", "excerpt": "我父母从90年就开始做生意，开工厂，从几个人的作坊做到一百多人的工厂，一路上经历了各种风风雨雨，都扛过来了 19年下半年的时候，我们对大客户的招标失败了，丢失了40%的订单。按以往来说，找点其他订单填补一下，或者压缩一下成本抗一下等下次招标，毕竟经08年的时候也是这么扛过来的。 我父母这一次不知道怎么了，做了二十多年的工厂，说不干就不干了，谁劝都没用。 我还想继续干，因为我算着，即便是剩下的60%", "url": "https://www.zhihu.com/question/46874031/answer/1943242215922071099", "votes": 899, "comments": 63, "feed_ts": 1781874616, "feed_time_str": "06-19 21:10", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "为什么炒股亏得最狠的不是第一年，而是第三年？", "excerpt": "评论区有人说过一句话：&#34;所有人亏钱最狠的不是一开始，而是三年左右。新人行为无规律，所以猴子掷飞镖能打赢大多数散户。&#34; 这句话的信息密度极高，值得拆开来看。 先看数据。雪球上有人做过一个非正式统计：炒股1到2年的散户亏损比例约65%，3到5年的散户亏损比例上升到78%，5年以上略有回落到70%左右。 3到5年是亏损的高峰期。不是第一年，不是刚入市的时候，是学了一些东西之后。 这个现象", "url": "https://zhuanlan.zhihu.com/p/2016102929229173314", "votes": 118, "comments": 22, "feed_ts": 1781874441, "feed_time_str": "06-19 21:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么中国人储蓄率这么高？", "excerpt": "提一个有意思的观点： 一个社会把太多不确定性压进家庭账户以后，家庭被迫把银行存款当成自己的微型福利国家。 很多人以为中国人爱存钱，是因为保守、节俭、不懂享受。 但更真实的情况是： 钱存在银行里，表面是存款，实际是家庭自己给自己买的失业保险、医疗保险、养老保险、教育基金、住房储备和灾难缓冲垫。 每个家庭都像一个小政府。 要管养老。 要管医疗。 要管教育。 要管住房。 要管失业。 要管婚嫁。 要管老人", "url": "https://www.zhihu.com/question/2045832962529309043/answer/2050243699624375773", "votes": 9913, "comments": 786, "feed_ts": 1781872416, "feed_time_str": "06-19 20:33", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "@弄湿冷清的晚空 老师说过，所有人都是会死的，任何人随时都会死，我们从不该幻想谁永远不会死。@刘镇锐 老师则说过这样下图的名言，并得到了 @Eiux Rulyciu 老师的认可。这两段话给了我特别深刻的启示：不要动不动就拿什么“暴力”“血海”“生命”出来吓唬人嘛。你在那里惺惺作态摆出一副“人道高于一切”的姿态，人也都是要死的。现在的人会死，一千年一万年以后的人也会死，哪朝哪代还不死点人了，有啥好怕的嘛。更何况换个语境，大家对反对者开图的原始动物热情也都是非常高涨的。活化石氦闪爱好者 ", "excerpt": "@弄湿冷清的晚空 老师说过，所有人都是会死的，任何人随时都会死，我们从不该幻想谁永远不会死。@刘镇锐 老师则说过这样下图的名言，并得到了 @Eiux Rulyciu 老师的认可。这两段话给了我特别深刻的启示：不要动不动就拿什么“暴力”“血海”“生命”出来吓唬人嘛。你在那里惺惺作态摆出一副“人道高于一切”的姿态，人也都是要死的。现在的人会死，一千年一万年以后的人也会死，哪朝哪代还不死点人了，有啥好怕", "url": "https://www.zhihu.com/pin/2051394392662061786", "votes": 0, "comments": 58, "feed_ts": 1781871868, "feed_time_str": "06-19 20:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn" 7, "feed_ts": 1781868272, "feed_time_str": "06-19 19:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "一片空白", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么美国推翻不了伊朗政权？", "excerpt": "因为伊朗有组织力。 看一个国家有没有组织力，最简单的方法是看铁路。因为铁路是人类有史以来，也甚至有可能是可遇见的未来内，所能组织的最大规模的系统工程，且这个系统不是必需的。注意，是大铁，不是地铁。地铁实际上也是点状投资，和大铁完全两码事。 毫无疑问，一个国家没有铁路也能转。铁路是选修课，是奢侈品。很多国家没有铁路，或者铁路名存实亡。但这并不妨碍这个国家运转。事实上，有机场和公路就可以构成一个国家的", "url": "https://www.zhihu.com/question/2014713831209837940/answer/2050731323942244549", "votes": 4668, "comments": 583, "feed_ts": 1781866410, "feed_time_str": "06-19 18:53", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "alex01", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价知乎投资答主“Alex01”等一众投资答主？", "excerpt": "为众抱薪者不可使其冻毙于风雪，这篇文章，我将用详尽的数据与截图来为 A 大正名，走过路过千万千万不要错过！分割线一一一一一分割线一一一分割线 不知道为何，最近 A 大火了，评论他的话题一夜之间多了很多，很有争议性 我作为一个从今年 1月开始关注，3 月起订阅他的普通知乎用户，我认为在这个时间点 我有义务为我的喜好的博主发声，为我已经付出的金钱发声为避免有些别有用心之人哔哔我是 A 大的水军或者他的", "url": "https://www.zhihu.com/question/2049179860682257932/answer/2051371517552900086", "votes": 36, "comments": 59, "feed_ts": 1781866000, "feed_time_str": "06-19 18:46", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "顽皮的虎鲸", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价知乎答主“奥特之父”？", "excerpt": "不管是之前你们喷退圈的Mr Dang还是鳄鱼，在我看来都比奥特好上不少 鳄鱼不管怎么说，自己真金白银的在买；Mr Dang不管怎么说，在知乎上火之前也是自己真金白银在买的，不管水平如何，我姑且承认算是做投资的。这两个人塌方，是因为水平不够，自己的投资框架不够好，导致出现大规模回撤才塌方的。 奥特这人最恶心的地方在于，他是一个纯粹的借着所谓“价值投资”名头来圈钱割韭菜的，这人知道自己不懂股票，于是专", "url": "https://www.zhihu.com/question/2042603665979073304/answer/2050607890315194709", "votes": 75, "comments": 27, "feed_ts": 1781863591, "feed_time_str": "06-19 18:06", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "环中星鉴,平凡", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "6月19日 黄金趋势分析", "excerpt": "自从沃什17日转鹰以来，美元指数一直在飙升，突破了维持了一年的关键阻力位100.4，今天最高已经飙到101。 美元现在这个形态可以看作旗形，也可以看作头肩底，反正都是看涨的形态，我认为美元大概率会继续走强，下一个目标位是102，这会继续压制黄金， 昨天的文章已经提醒过美元走强和黄金下行。美元兑日元也已经涨至161.2，离2024年7月 const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'

        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

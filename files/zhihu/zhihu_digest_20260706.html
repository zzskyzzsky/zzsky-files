ments": 5, "feed_ts": 1783267116, "feed_time_str": "07-05 23:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "没看过颜色的LLM，为什么中间层会出现接近人类感知的色轮结构？\n图文版：链接纯文本LLM里出现了什么这篇预印本研究的问题很直接：只用文本训练的大语言模型，从没看过颜色、听过音高或尝过味道，它的内部表示会不会仍然组织出接近人类感知的几何结构？论文在LLaMA、Gemma、Qwen等开源Transformer中逐层检查残差流表示，发现颜色、音高、情绪和味觉四类感知域都存在一定的层间几何组织：早期层较弱或分散，中间层最清晰，后期层又衰减。方法如何看见这些结构研究没有训练额外probe或分类器，而是把颜色值、音高频率、情绪词、味觉词放进极简提示模板，提取每层最后一个token的隐藏状态，再用余弦不相似度和多维尺度分析生成二维感知地图。随后，论文用RSA和GPA把这些地图与人类感知基线比较。颜色在峰值层呈现接近色轮的环形结构；音高更像连续弧线；情绪的效价-唤醒结构在后续层保持得相对稳定；味觉也出现匹配趋势，但对齐更弱、曲线更嘈杂。结论边界要说清这项工作说明，纯文本LLM的中间层可能短暂形成与人类感知相似的表示几何，但这不等于模型拥有真实感官体验，也不是对“理解世界”的因果解释。论文更像提供了一个可解释性入口：感知相关概念在模型内部何时被组织起来、何时又被重新编码或衰减。后续还需要在更多模型、提示条件和感知域上验证。原文标题：Geometry of Human Perceptual Domains Emerges Transiently in LLM Representations#无影寺 ", "excerpt": "没看过颜色的LLM，为什么中间层会出现接近人类感知的色轮结构？\n图文版：链接纯文本LLM里出现了什么这篇预印本研究的问题很直接：只用文本训练的大语言模型，从没看过颜色、听过音高或尝过味道，它的内部表示会不会仍然组织出接近人类感知的几何结构？论文在LLaMA、Gemma、Qwen等开源Transformer中逐层检查残差流表示，发现颜色、音高、情绪和味觉四类感知域都存在一定的层间几何组织：早期层较弱", "url": "https://www.zhihu.com/pin/2057250063026590232", "votes": 0, "comments": 0, "feed_ts": 1783266710, "feed_time_str": "07-05 23:51", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你见过哪些奇特的真实名字？", "excerpt": "恩情外卖，喝上了肉汤。 ", "url": "https://www.zhihu.com/question/20442280/answer/1983926186989086399", "votes": 7500, "comments": 71, "feed_ts": 1783265995, "feed_time_str": "07-05 23:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你见过哪些奇特的真实名字？", "excerpt": "一图胜千言 ", "url": "https://www.zhihu.com/question/20442280/answer/126526602532", "votes": 17391, "comments": 178, "feed_ts": 1783265963, "feed_time_str": "07-05 23:39", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "牛津和斯坦福做了个AI新闻助理，重点不是写稿而是证据可追溯\n图文版：链接在透明度和可审计性上，AI系统Data2Story明显占优，但在编辑角度与视觉创意上，人类记者依然领先。牛津与斯坦福团队提出的这个多agent框架，试图让AI从原始数据集出发，端到端生成可交互的多媒体文章，并且让文章里绝大部分数字、图表都能追溯到生成它的具体代码行或原始URL。Data2Story将新闻编辑室的整套工作流拆解为七个专业化agent角色，其中最关键的是Inspector。它在所有上游agent产出各自的中间产物之后，将最终页面拆解为自包含的HTML片段，逐一绑定回证据池中的对应条目。这意味着读者可以沿着证据链查到：这个百分比是Analyst的哪一行代码算出来的，那句历史背景引用的是哪一个外部URL。可验证性实验显示，Data2Story文章中的声明更易于建立可验证的证据绑定，而人类参考文章由于通常不附带可执行代码，能够建立此类绑定的比例明显更低。论文将Data2Story定位为人类记者的协作工具。过去一个新闻编辑室团队需要花数周完成的工作，agent可以贡献创意多媒体资产和一个很少被形式化的可审计维度。更深层的价值在于，它能挖掘人类记者忽视的数据切片，把分析代码、图表和叙事串成可追溯证据链；但它仍不擅长判断真正的新闻角度，也不能替代人类编辑对受众、语境和表达节奏的把关。原文标题：Data Journalist Agent: Transforming Data into Verifiable Multimodal Stories#无影寺 ", "excerpt": "牛津和斯坦福做了个AI新闻助理，重点不是写稿而是证据可追溯\n图文版：链接在透明度和可审计性上，AI系统Data2Story明显占优，但在编辑角度与视觉创意上，人类记者依然领先。牛津与斯坦福团队提出的这个多agent框架，试图让AI从原始数据集出发，端到端生成可交互的多媒体文章，并且让文章里绝大部分数字、图表都能追溯到生成它的具体代码行或原始URL。Data2Story将新闻编辑室的整套工作流拆解为", "url": "https://www.zhihu.com/pin/2057246587978519735", "votes": 0, "comments": 0, "feed_ts": 1783265938, "feed_time_str": "07-05 23:38", "category": "pin", "cat_name": "想法动态"}, {"actor": "DefTruth", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "ai coding时代该如何入门ai infra？", "excerpt": "这也是ai infra 你们没发现吗 上限取决于你能摸到啥卡 ", "url": "https://www.zhihu.com/question/2053192554112407412/answer/2053290384973943105", "votes": 12, "comments": 0, "feed_ts": 1783264428, "feed_time_str": "07-05 23:13", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "冯德莱恩妄称：中欧对话结果必须令人满意，否则将采取报复措施。为什么冯德莱恩胆气那么横？", "excerpt": "看看，大夏天能吹到空调的人，就是这么有底气。 可惜其他欧洲人没这个福气，让几亿欧洲人用上空调，对地球环境是致命的打击。 再苦一苦欧洲人，为了地球环境。 ", "url": "https://www.zhihu.com/question/2057018124931747994/answer/2057238004985500672", "votes": 321, "comments": 4, "feed_ts": 1783263762, "feed_time_str": "07-05 23:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "申宏宇", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么凤凰传奇两个人成不了夫妻？", "excerpt": "当年有个组合叫玖月奇迹，巅峰时期能和凤凰传奇碰一碰， UP_ANSWER", "verb_cn": "赞了回答", "title": "为什么中大型鹦鹉一直都不开放售卖？有哪些原因呢?", "excerpt": "虽然也不能算大开眼界，但为了辩经，连“鹦鹉是猛禽”这种鬼话都能编造的出来。 ", "url": "https://www.zhihu.com/question/665277904/answer/2014379502189445412", "votes": 14, "comments": 0, "feed_ts": 1783257941, "feed_time_str": "07-05 21:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么提傅首尔面相而忽略一件事情的本质呢？", "excerpt": "请选择你的英雄", "url": "https://www.zhihu.com/question/3795530525/answer/1906411591605388440", "votes": 2911, "comments": 43, "feed_ts": 1783257870, "feed_time_str": "07-05 21:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "屠猪之枪", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么齐国在齐桓公之后就无缘霸业了，齐国比晋楚两国到底差在哪？", "excerpt": "因为山东这个地形就是易攻难守，齐国把山东那些小国以及鲁国搞废了，那就是他自己的死期。 这是现代的河流，可以凑活看。大部分的河流都是往齐国纵深流的，少数泰山为源头的，正好泰山的开口地势平坦，也无法作为防御屏障，那也就意味着，进攻者后勤效率远高于齐国军队。当然最后也有几条横着的河，这也是乐毅灭齐为啥打到日照和青岛打不下去了，补给跟不上了。而韩信灭齐就是快速灭掉齐国主力，不让齐国有往后三条河转移的机会…", "url": "https://www.zhihu.com/question/50721351/answer/2057213255165260624", "votes": 7, "comments": 3, "feed_ts": 1783257861, "feed_time_str": "07-05 21:24", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "607846", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "毛选到底好在哪里？", "excerpt": "你看《毛选》和毛泽东经历之后，突然发现： 原来再大的困局，也可以被拆开；再弱的力量，也可以积累；再黑的局面，也不是铁板一块。这就是毛泽东身上最有穿透力的地方。 他给人的不是普通鸡汤式乐观，而是一种非常硬的乐观： 不是“相信一切都会好”，而是“相信一切复杂局面都可以被认识、被分析、被组织、被改变”。一、他的力量来自“把命运问题改造成方法问题”悲观的人最痛苦的地方是什么？ 不是眼前难，而是觉得： 我不", "url": "https://www.zhihu.com/question/1911787268500338316/answer/2057212095859521370", "votes": 9, "comments": 0, "feed_ts": 1783257585, "feed_time_str": "07-05 21:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "兰度", "verb": "MEMBER_VOTEUP_ARTICLE", "verb_cn": "赞了文章", "title": "喜欢废墟的人是什么心理？有相关的美学支撑吗？2026版", "excerpt": "喜欢废墟的人，不一定悲观，也不一定想看世界完蛋。废墟真正迷人的地方，是它让一个系统露出断面：原本应该继续运转的东西停住了，原本应该有人的地方只剩下痕迹，原本应该被历史整理好的东西，还没有被整理好。 废墟大概可以分三种。 第一种，是最近的废墟：烂尾楼、 ", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "中国贸易顺差超过1万亿美元，按照这个趋势下去，中国会不会成为唯一的工业国？", "excerpt": "先说结论： 绝对不会，因为咱们还没赚到爆炸的利润。为啥呢，我给大家详细的解释解释。 2026年1月，海关总署公布了2025年全年的外贸数据。 出口3.77万亿美元，进口2.58万亿美元。一减，顺差1.19万亿，接近1.2万亿。 1.2万亿什么概念？地球上从来没有一个国家在一年里从贸易中净赚过这么多钱。之前人类历史上单一国家的最高纪录，是德国、日本和美国都摸到过的7000亿美元左右。中国直接把天花板", "url": "https://www.zhihu.com/question/1982871727919886381/answer/2057124009595221669", "votes": 103, "comments": 11, "feed_ts": 1783236584, "feed_time_str": "07-05 15:29", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "动漫中什么招式第一次看到很惊艳？", "excerpt": "刀和鱼的交锋，每一次交锋，刀都可以魔高一丈 ", "url": "https://www.zhihu.com/question/283965856/answer/1987605989575389286", "votes": 15734, "comments": 317, "feed_ts": 1783236451, "feed_time_str": "07-05 15:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "张子豪", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有没有什么东西，被当传家宝代代流传，最后却被发现一点也不值钱?", "excerpt": "一口我太爷传下来的陶瓮。据说是当年走西口时从蒙古人那里收的。一尺半高，器腹上印了两圈五铢钱文，器肩上有一个戳记：“巨陈大利”。当时商队里有个当账房的老秀才，告诉我太爷这是个好东西，汉朝的。我太爷带了回来，当宝贝收着。从清末到现在，历尽了无数风波，安然无恙地传到我爸他们这辈。九十年代分家时，大伯“慧眼识宝”，说尽好话，用了二亩水浇地才从我小叔那里换回了这口瓮。前两年，我堂兄做生意缺钱周转，老头儿做…", "url": "https://www.zhihu.com/question/435673487/answer/12875734028", "votes": 3906, "comments": 298, "feed_ts": 1783236357, "feed_time_str": "07-05 15:25", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "山河四省，最后一篇河北算是写完了，不过呢我们思考气候和地理的时候，河北篇也就把北京和天津都合到一块儿了，毕竟同属一个地理单元嘛，接下来应该是东三省吧等国内写完了，就要开始触及国外的内容了。很多我们觉得理所当然的，能够有效对抗各种气候灾难的可靠的工业，地理冗余和组织度很多时候国外都是不怎么具备的。以推演中3℃升温这个尺度的自然灾难来说，会有不少的国家连及格线都碰不到，一路奔着气候难民那个方向去的。", "excerpt": "山河四省，最后一篇河北算是写完了，不过呢我们思考气候和地理的时候，河北篇也就把北京和天津都合到一块儿了，毕竟同属一个地理单元嘛，接下来应该是东三省吧等国内写完了，就要开始触及国外的内容了。很多我们觉得理所当然的，能够有效对抗各种气候灾难的可靠的工业，地理冗余和组织度很多时候国外都是不怎么具备的。以推演中3℃升温这个尺度的自然灾难来说，会有不少的国家连及格线都碰不到，一路奔着气候难民那个方向去的。", "url": "https://www.zhihu.com/pin/2057122961199572663", "votes": 0, "comments": 2 const catColors = {"ai": "#1772F6", "geo": "#fa8c16", "pin": "#52c41a", "other": "#999"};

const catKeys = ["ai", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

ed_ts": 1786989743, "feed_time_str": "08-18 02:02", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "美国政治在立国之初就存在一种以生产者为本位、具有重农主义色彩的“小资本主义”观念，这种资本主义最大的特点是直接掌握生产工具，生产成果可视化，自给自足，并且以个人、家庭或者小规模社团为基本生产单位，以此反对联邦党的精英们通过银行金融操弄投机获取不义之财的“大资本主义”，进而联合起全体美利坚劳动者反对以英国为中心的寡头专制主义旧世界和旧政治。这种“小且好”的资本主义主导了自耕农、杂货店主和熟练工匠们支持19世纪上半叶的政治反叛和大陆主义扩张，并在镀金时代和进步主义时期的杰出的政治机器老板、中产阶级改革者和平民主义鼓动家的调度下将这种小资本主义的怒火转向了（往往是东部共和党支持的）的“大”企业和“大”银行，同时鼓动这些“受压迫的”劳动男女们努力争取自己的政治和社会经济权利。伍德罗·威尔逊和富兰克林·罗斯福开启并正式将这种“生产者本位”的政治经济观制度化，同时将更多后至的族裔移民和产业劳工纳入这一庞大的选举阵营（这一进程或许从1928年阿尔·史密斯失败但意义深刻的选举时就已开始），并且塑造了足以让民主党长期获得全国范围（排除平原和北新英格兰）小生产者选票的法团自由主义叙事范式：民主党是富饶的党、自由的党、保障诚实的劳动者免受金融大鳄和为富不仁者剥削的党，以农村选民为例，民主党光是凭靠对农业生产补贴的坚定承诺，就能够稳稳握住南方和西部的票仓，有时还能反攻共和党的平原与山地州（参考1958年诺兰指导部的无能领导下的中期选举）。当这种政府的保障变成新的“大资本主义”载体，以至于这种政治经济力量足够压垮政党和政治人物的独特性时，长期坚持宪政主义和个人自由主义的选民们开始向两党内部的异见者靠拢，1964年是民主党的调和自由主义模式循着林登·约翰逊的“伟大社会”梦想而登峰造极的一年，也是来自西南边疆的“新共和党”巴里·戈德华特喊出“选择而非回声”，在党代会上席卷东北部之外全部选票的一年。在传统的政治史里，大多数读者只看到愤怒的中产和小生产者们群起反对各种机构和委员会对他们的最基本权利的漠视和对日常生活的的无理干涉，进而支持诸如里根和华莱士这样标新立异的“草根右翼”（然而里根是一个不折不扣的南加州郊区-企业保守主义者，而华莱士则被阿什布鲁克和巴克利这样的共和党偏激分子指责为伪装成隔离主义者的新政派民主党，二人南辕北辙）政治人物，却往往忽略了民主党的左侧同样存在承载着这种小生产者自由传统的反叛情绪的运动，例如（部分的）1972年乔治·麦戈文的选举运动，这场被党内外对手抹黑为“酸、大麻和赦免”的失败透顶的运动在青年知识精英支持者的“放纵的叛逆”表层之下，是非工会低学历体力工人和中西部农民对于传统工会法团体制的抗议，仔细研读麦戈文的选举纲领，他对于福利和预算持谨慎的平衡态度，更希望保持小生产者的经济活跃。毕竟谁又能说戈德华特和尤金·麦卡锡这两位主张个人自由（意志）主义的政治怪类之间的差异比他们两人同尼克松（著名行政权和家庭福利爱好者）这位铁建制之间的差异大呢（有趣的是，戈德华特盛赞麦卡锡是“内心的保守主义者”）？在最后一个“北方共和党总统”老布什任期结束之前，共和党人尚未全体作好呼应这种“小资本主义”愤怒的政治准备，但这种情绪经由00年代小布什的“富有同情心的保守主义”，向特朗普式的偏执民粹主义演化，最终调动了诸如福音派、中小企业主和拉丁裔这样的传统低频选民，进而塑造了新的政治传统，而今他们自认为正在与“邪恶的跨国大资本主义”的斗争，只不过转移到了数据中心这一座新的风车上。", "excerpt": "美国政治在立国之初就存在一种以生产者为本位、具有重农主义色彩的“小资本主义”观念，这种资本主义最大的特点是直接掌握生产工具，生产成果可视化，自给自足，并且以个人、家庭或者小规模社团为基本生产单位，以此反对联邦党的精英们通过银行金融操弄投机获取不义之财的“大资本主义”，进而联合起全体美利坚劳动者反对以英国为中心的寡头专制主义旧世界和旧政治。这种“小且好”的资本主义主导了自耕农、杂货店主和熟练工匠们支", "url": "https://www.zhihu.com/pin/2072836438492721508", "votes": 0, "comments": 2, "feed_ts": 1786989463, "feed_time_str": "08-18 01:57", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "多地严查社保缴纳，要求提高夯实率，有职员反映工资被下调，该如何理解？", "excerpt": "给社保支个招。严查当年“视同缴费”那帮人，要求按规定补缴，否则“视同发放”，追回已发放的部分，并且加上逾期利息？", "url": "https://www.zhihu.com/question/2071533345910022775/answer/2072678706305414048", "votes": 732, "comments": 51, "feed_ts": 1786989093, "feed_time_str": "08-18 01:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖,时予", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "多地严查社保缴纳，要求提高夯实率，有职员反映工资被下调，该如何理解？", "excerpt": "前几天我在市府边上的体育中心游泳，出水在更衣室冲水时听几位老大哥在聊退休工资的事。 市府边上嘛，附近经常游泳的大多是体制内出身，其中两位年长点的退休工资一个月一万多，坦诚说根本花不完——人上了年纪，吃喝都不能过量，只要不浪费确实花不完。另一位还没退休，是某企业的高管，按说级别不低，年薪没少拿，却说自己退休只能拿五六千块钱。 所以这种夯实表面看没啥问题，社保缴纳利国利民，最终回馈对象也是在职的职工。", "url": "https://www.zhihu.com/question/2071533345910022775/answer/2072738988159395611", "votes": 1086, "comments": 210, "feed_ts": 1786989085, "feed_time_str": "08-18 01:51", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "目前燃气热水器有多先进？要说热水加热速度还得是燃气热水器、即时热水轻轻松松就能实现！本视频介绍的燃气热水器是海尔恒星系列KN7S，其主打的就是双循环恒温，出水温度能一直保持一个温度、不会有忽冷忽热，对品质有追求的可以看看，KN7S适合大户型，如果是厨卫比较近的小户型可以看看KL7S、这一款可以实现和KN7S差不多的效果、但更经济、也完全能满足你的需求。 希望本视频能对选购燃气热水器的小伙伴提供一些帮助！", "excerpt": "目前燃气热水器有多先进？要说热水加热速度还得是燃气热水器、即时热水轻轻松松就能实现！本视频介绍的燃气热水器是海尔恒星系列KN7S，其主打的就是双循环恒温，出水温度能一直保持一个温度、不会有忽冷忽热，对品质有追求的可以看看，KN7S适合大户型，如果是厨卫比较近的小户型可以看看KL7S、这一款可以实现和KN7S差不多的效果、但更经济、也完全能满足你的需求。 希望本视频能对选购燃气热水器的小伙伴提供一些", "url": "https://www.zhihu.com/pin/2072857759494706316", "votes": 0, "comments": 0, "feed_ts": 1786987801, "feed_time_str": "08-18 01:30", "category": "pin", "cat_name": "想法动态"}, {"actor": "科技猛兽", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "视觉生成 RL 模型解读 (四)：Flow-OPD：生成模型的 On-Policy Distillation", "excerpt": "本系列已授权极市平台，未经允许不得二次转载，如有需要请私信作者。专栏目录视觉生成超详细解读 (目录)本文目录1 Flow-OPD：生成模型的 On-Policy Distillation (来自 USTC，UCLA，CUHK，小红书) 1.1 Flow-OPD 研究背景 1.2 在线策略蒸馏 1.3 为什么 GRPO 有效？ 1.4 为什么 GRPO 不行？从多任务视角分析 1.5 把所有奖励混起", "url": "https://zhuanlan.zhihu.com/p/2061270274344071988", "votes": 2, "comments": 0, "feed_ts": 1786987701, "feed_time_str": "08-18 01:28", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Codex清单最后一项：将发布新模型AstraTibo展示了Codex Web 的状态图上写着 99.98% uptime，API、CLI 和 VS Code extension 都显示 100%。讲它浓缩成四项：几乎 100% 可靠、偶尔重置、开源，以及“将拥有 Astra”。最后一句最抓眼，也是这条帖里信息最少的一句。配图列出的是 Codex 的四个入口：Web、API、CLI 和 VS Code extension。Web 显示 99.98% uptime，其余三个显示 100% uptime。展示了四个组件有很高的在线率。可惜图里没有统计周期和测量口径，不能把它扩展成“每一次 Codex 请求都不会出错”，也不能据此比较其他产品。“偶尔重置”和“开源”仍缺细则Tibo 的主帖确实写了 occasional resets，但没有说明重置什么、按什么条件触发、覆盖哪些用户。评论区有人希望提前通知，也有人催下一次 reset，这些都是用户的需求和玩笑，不是新规则。新模型Astra是主帖给出的方向，不是发布日期“will have Astra”是主帖里唯一明确的新路线图信号。按 Astra 是新模型这一补充信息理解，它说明 Codex 未来会拥有这一模型；但主帖没有解释它的能力、何时可用、面向谁开放，也没有说明它和现有 Codex 功能的关系。这好似一张“当前状态加未来方向”的卡片更合适。当前能核验的是四个 Codex 入口的 uptime 展示；未来方向是 Codex 将拥有新模型 Astra。Astra 的具体能力、开放时间、开源范围和 reset 机制，都未公布", "excerpt": "Codex清单最后一项：将发布新模型AstraTibo展示了Codex Web 的状态图上写着 99.98% uptime，API、CLI 和 VS Code extension 都显示 100%。讲它浓缩成四项：几乎 100% 可靠、偶尔重置、开源，以及“将拥有 Astra”。最后一句最抓眼，也是这条帖里信息最少的一句。配图列出的是 Codex 的四个入口：Web、API、CLI 和 VS Co", "url": "https://www.zhihu.com/pin/2072855752444731888", "votes": 0, "comments": 0, "feed_ts": 1786987348, "feed_time_str": "08-18 01:22", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美军「本福尔德」号驱逐舰在南海全舰断电四天，暴露了美国海军哪些深层次问题？", "excerpt": "早不出问题，晚不出问题 怎么一收到去中东的命令，就出问题了 怕不是美军内部有人通伊朗吧 ", "url": "https://www.zhihu.com/question/2072439669300654515/answer/2072781212398180114", "votes": 28, "comments": 1, "feed_ts": 1786987102, "feed_time_str": "08-18 01:18", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么那么多吹汉武帝的？", "excerpt": "因为汉武帝的确有他显著的优点，他是一个“民族的皇帝”而非“家族的皇帝”，而这个“民族的皇帝”很大程度上决定了汉族和其他民族不同的命运。 很多人看历史都会疑惑一点，为什么蒙古人满人拿下了那么多领土，到最后蒙古却只能呆在荒凉的东亚戈壁沙漠中，连中亚绿洲都没有成功占据？满人更是连辽宁以北的东北都丢掉，让汉人在内东北大地生存繁衍？为什么沙皇俄国纵横亚欧美三大洲灭国无数，而今天的俄罗斯却依然在为收复东斯拉…", "url": "https://www.zhihu.com/question/1914208453/answer/1981518308030305126", "votes": 3079, "comments": 345, "feed_ts": 1786986849, "feed_time_str": "08-18 01:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "蒸馏一定要改参数吗？这篇论文用Harness给出另一条路线图文版：链接GPT-5.5在GPT Codex上把GPT-5.4-mini的ToM宏平均做到0.912Salesforce AI Research预印本（第一作者Cheng Qian同时挂UIUC）研究强到弱脚手架：较强builder为固定弱target搭建推理时外部结构，target参数不更新。四个心理理论（Theory-of-Mind）基准共3900项隐藏测试。GPT-5.5在GPT Codex上的最佳脚手架把GPT-5.4-mini宏平均准确率从0.488提到0.912（+0.423）。57次运行均值0.763（+0.275），全部超过无脚手架基线。57次运行全超0.488，确定性卸载与准确率r=0.72builder只能看5%验证集。格式约束几乎全用；确定性卸载占比与准确率Pearson r=0.72，验证次数几乎无关（r=0.17）。最佳脚手架在3900项上McNemar χ²=1424.4，p&lt;10⁻⁴，修复1717个基线错误，只破坏105项。Gemini-3.5-flash只+0.110，Hi-ToM四阶残余掉到0.700固定Opus-4.7时，努力从0.711升到0.856。5个builder在Cursor配对对照里，GPT-5.4-mini平均+0.262，Gemini-3.5-flash只+0.110，且每个builder都至少在一个基准上回退。最强8个脚手架平均修复83%基线错误；Hi-ToM order 4为0.700，MMToM-QA type-2.1为0.680。ToM是测试床，嵌套信念和贝叶斯目标仍编不进规则自动脚手架在BigToM上达1.00，略高于UserHarness的0.95，在更难三项上仍落后。证据限于这四个ToM基准。可编译结构可以一次性外置；嵌套高阶信念、欺骗和贝叶斯目标推断仍要留给模型本体。原文标题：AI4AI at Test-Time: Strong-to-Weak Capability Transfer via Harnesses#无影寺 ", "excerpt": "蒸馏一定要改参数吗？这篇论文用Harness给出另一条路线图文版：链接GPT-5.5在GPT Codex上把GPT-5.4-mini的ToM宏平均做到0.912Salesforce AI Research预印本（第一作者Cheng Qian同时挂UIUC）研究强到弱脚手架：较强builder为固定弱target搭建推理时外部结构，target参数不更新。四个心理理论（Theory-of-Mind）", "url": "https://www.zhihu.com/pin/2072851348161296354", "votes": 0, "comments": 0, "feed_ts": 1786986361, "feed_time_str": "08-18 01:06", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "助手人格不该等到后训练才教——预训练第一个token就写进去，效果好了12个点\n图文版：链接SPP从约10%预训练文档写入第一人称反思EPFL通讯的Minder等提出Synthetic Persona Pretraining（SPP）：用价值宪法给预训练文档生成第一人称反思，插入原文并加&lt;assistant&gt;标记，再用交叉熵同时训练原文与反思，最后在对话数据上做persona binding。主实验是数据匹配的3B/500B token对照，约10%文档被标注。C hihu.com/question/2072055535537316754/answer/2072781100091438405", "votes": 45, "comments": 2, "feed_ts": 1786984343, "feed_time_str": "08-18 00:32", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "在演艺界有哪些敬业的演员？", "excerpt": "演艺生涯时间最长的，肯定是敬业的吧？就像今年还有民国时期的演员上映了两部新电影作品，这不励志？ 甲子戏骨家喻户晓的“容嬷嬷”李明启，就是生涯时间相当长的著名演员。 1960年，她24岁，踏入演艺生涯的第一部影视作品，是电影《12次列车》。 2020年，她84岁，结束演艺生涯的最后一部影视作品，是电影《孝感天地》。 1936年出生的李明启，今年2026年是90岁高龄。她在第一部电影中就戏份很重，起点", "url": "https://www.zhihu.com/question/264243119/answer/2072838481940947814", "votes": 3, "comments": 1, "feed_ts": 1786983206, "feed_time_str": "08-18 00:13", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "安森垚", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "阿根廷为什么宁愿多跑10000公里也要把牛肉便宜卖到中国？", "excerpt": "因为中国什么部位都要。 和个搞阿根廷牛肉进口的代理商聊过这事，问阿根廷卖给中国的牛肉为什么这么便宜？ 回答说以前阿根廷牛肉主要卖给北美和欧洲。 但美国也是养牛大国，为了保护本国产业一年仅给阿根廷几万吨的配额。 欧洲也有配额，更重要的是只认菲力、西冷等高端部位，所以价格也不算便宜，阿根廷出口欧洲的 FOB价约为5000 美元 / 吨左右 。 中国则是百万吨级的进口量。更重要的是中国不是只要牛肉，牛腱", "url": "https://www.zhihu.com/question/5019401871/answer/2072020113591636655", "votes": 6447, "comments": 1009, "feed_ts": 1786982965, "feed_time_str": "08-18 00:09", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Tibo手把手教你在Codex中启用GPT-5.6 Sol的1M上下文Tibo 刚把 GPT-5.6 Sol 在 Codex 里启用 100 万 token 上下文的方法写明了。但它不是“默认窗口终于升级到 1M”，而是一项需要手动开启、官方仍提醒要谨慎使用的配置。这件事为什么现在才公开7 月 Codex 把 GPT-5.6 Sol 的产品上下文从 GPT-5.5 时代的 272K 往上扩时，社区最关心的是：长任务为什么更容易吃掉用量。Tibo 当时解释，订阅中的问题不是“超过 272K 就统一双倍收费”。更关键的是，agent 在工具调用之间反复带着大段历史来回工作，cache read 的累计成本会上升。窗口更大能减少等待压缩、也能吞下更大的输入，但最大窗口不一定是性能和成本的最优点。这次到底开放了什么GPT-5.6 Sol 本身记录的上下文窗口是 1,050,000 token。现在可以在 Codex 配置里把可用预算设为 1,000,000 token，并在约 900,000 token 时再自动压缩。打开 ~/.codex/config.toml，在所有 [section] 标题之前加入或更新：model = &#34;gpt-5.6-sol&#34;model_context_window = 1000000model_auto_compact_token_limit = 900000保存后，重启 Codex，并新开一个 session 才会生效。只想单次试用 CLI，不想改默认配置，可以运行：codex -m gpt-5.6-sol -c model_context_window=1000000 -c model_auto_compact_token_limit=900000什么任务值得开适合的是那些“丢历史就要重来”的任务：跨模块迁移、追很长的调用链、逆向陌生仓库、需要连续读取大量日志和工具输出的排障。它解决的是少压缩、少丢上下文，不是让模型本身变聪明。普通编码、短任务和频繁开子任务时，先别因为 1M 就照抄。官方没有公布启用后的具体订阅配额规则，也没有给默认值与 1M 的性能曲线；Tibo 反而特别强调，Codex 的默认上下文已按性能和成本调校过。Codex 把长上下文的控制权交给了需要的人，但没有承诺它是所有任务的更优默认值。先用在确实被压缩打断的长任务上，再看结果。", "excerpt": "Tibo手把手教你在Codex中启用GPT-5.6 Sol的1M上下文Tibo 刚把 GPT-5.6 Sol 在 Codex 里启用 100 万 token 上下文的方法写明了。但它不是“默认窗口终于升级到 1M”，而是一项需要手动开启、官方仍提醒要谨慎使用的配置。这件事为什么现在才公开7 月 Codex 把 GPT-5.6 Sol 的产品上下文从 GPT-5.5 时代的 272K 往上扩时，社区", "url": "https://www.zhihu.com/pin/2072835840946999996", "votes": 0, "comments": 0, "feed_ts": 1786982596, "feed_time_str": "08-18 00:03", "category": "pin", "cat_name": "想法动态"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待颜宁表示自己一篇文章被选为《Vita》封面，另一篇被秒拒，因此更加敬重主编？", "excerpt": "颜教授的文章被秒拒，说明： A. 她（或者她的学生）写了一篇垃圾文章，主编不看人下菜碟，直接拒了 B. 她（或者她的学生）写了一篇好文章，但是主编没有眼光 C. 她（或者她的学生）写了一篇文章，但是不符合Vita的收稿要求（比如研究领域不符，问题过大/过窄等），主编不看人下菜碟，直接拒了 我也不知道她想表达的是哪个，但好像哪个都不值得说道…… 补充： D. 她（或者她的学生）写了一篇文章，无论质量", "url": "https://www.zhihu.com/question/2071770065326937410/answer/2072631159096342292", "votes": 30, "comments": 3, "feed_ts": 1786982337, "feed_time_str": "08-17 23:58", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "TopView", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "中国乒乓以前是独孤求败的断档式领先的，为啥现在感觉和其他国家的差距缩小了？", "excerpt": "一鲸落，万物生。 国乒就是那头鲸。 刘国梁接手的时候国乒是什么状态。 是卖好不卖座。 大家都知道中国乒乓球强，乒乓球运动员知名度也很高，但是只有声望值，没有实际的商业收入。 说白了就是商业化做的不好。 比赛不多，运动员明星效应差，宣传力度弱，热爱的人很多，但大多数都是中年技术粉，付费意愿低…… 乒乓球这项运动没法自己造血，就只能靠国家输血，那国家队为了出成绩、出政绩也愿意花钱养着这帮运动员。 大多", "url": "https://www.zhihu.com/question/663092993/answer/2061735878322664281", "votes": 1229, "comments": 209, "feed_ts": 1786982069, "feed_time_str": "08-17 23:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "邓德全说书发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "如何评价网络热议私生子的继承权问题？法律上并没有“私生子”这个称呼，规范的叫法是非婚生子女，根 日元更厚，撑的时间会长一点罢了。美国7月政府预算赤字，已经扩大到4320亿美元，国债也突破了40万亿。这种“撑”不会是线性的，到了某个时间会引爆的。所有投资黄金的人，一定要注意两件反常态的事情：第一，美国7月非农负增长，同时5、6月非农数据一并下修，7月零售也环比下跌0.6%。换做以前，经济数据变差，大家担心经济不行，就会跑去买美债避险，美债价格会被推高、同时收益率下跌。但现在的情况完全相反。那么差的经济数据出来以后，美债价格还是不涨，30年期收益率继续走高——这就是债市在说美联储太松了，没有树立纪律性。美国从2019年到现在，已经连续60几个月通胀不达标，但美联储就是不加息，虽然沃什每次发言都是鹰派。7月29日沃什讲完“长债已经帮他收紧”之后，华尔街一片嘘声，我们就分析过美元要贬值了，黄金的机会终于要来了。因为如果连美联储都无法证明纪律性，证明自己可以为美元信用托底，美元无疑就是贬值的趋势。黄金、白银大涨，黄金盘中重回4300美元，白银突破62美元，品牌金饰价涨超55元，开启新一轮上涨了吗？第二，从6月底金价触底开始，金价、长期美债收益率、实际收益率，一起涨！见下图。这就是我之前反复讲过的，长期美债收益率和实际利率涨，黄金没有受到压制，反而一起涨，这种一般都预示着大级别行情！它对应的其实是美元贬值交易——全世界黄金多头最期待的市场逻辑。正常来讲，美债收益率涨，特别是实际利率涨，持有黄金的成本变高，大家会卖黄金、买债券。那么为什么大家宁可不要政府发的利息，也要持有黄金？因为对政府信用，法币的信用，越来越不信任！现在还要好，对沃什和美联储也开始不信任！这是美元的最后一道支撑。你要知道，如果美联储对美元信用的支撑出问题，意味着什么？而且还要明白，这都只是刚开始。资金就算要撤出美元资产，也是一点一点撤，黄金一点一点去到它该去的高度。只是刚开始。#黄金值几个钱 ", "excerpt": "黄金和美债收益率同涨，预示大级别行情这个话题叫黄金值几个钱？应该是法币值几个钱吧？政府债务高，还不起，央行印钞买债，最后货币失控贬值，日元就是最典型的例子： 日元跌破1美元兑162日元关口，创下近40年来新低，日本央行已加息至1%，为何完全挡不住日元贬值颓势？ 这也是美元接下去要走的路子，只是美国的底子比日元更厚，撑的时间会长一点罢了。美国7月政府预算赤字，已经扩大到4320亿美元，国债也突破了4", "url": "https://www.zhihu.com/pin/2072694764596729269", "votes": 0, "comments": 24, "feed_ts": 1786951338, "feed_time_str": "08-17 15:22", "category": "pin", "cat_name": "想法动态"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "巴菲特投资A股会有什么结局？", "excerpt": "依旧会非常牛逼。 大家都知道，巴菲特真正出手的两家中国公司，中石油、比亚迪，但很多人会忽略一个关键点，他买的全都是H股，并不是A股本身。 不过我们可以把这两笔交易拆开看下： 先说中石油，这是典型的烟蒂式价值投资。 2003年非典之后市场极度悲观，他在港股买入中石油H股，成本大概1.6港元附近。 当时这家垄断的能源企业，现金流很强，分红很高，但是市场给的估值极低，市值只有三四百亿美元，巴菲特评估它内", "url": "https://www.zhihu.com/question/498953495/answer/2072702256357627285", "votes": 135, "comments": 6, "feed_ts": 1786950727, "feed_time_str": "08-17 15:12", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "AI教育科普", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "白话解读综合交通运输标准化发展“十五五”规划一句话概括： 这是一份&#34;交通标准化&#34;的五年施工蓝图，核心基调是从追求数量转向追求质量，目标是让交通领域的各种标准——修路的、造车的、管交通的、搞安全的——更快出台、更高质量、更与国际接轨。打个比方：就像一家餐厅，以前只关心菜做得多不多（规模数量），现在更关心菜好不好吃、安不安全、能不能和国际大厨对标（质量效益）。这份规划就是给整个交通行业定&#34;菜谱标准 酗酒、乱伦与犯罪。因此，改善公共卫生设施、建造下水道和公共浴室，不仅是医学上的必要举措，更是一项净化底层灵魂的道德工程。这种将公共卫生与道德治理深度绑定的思路，使国家力量开始合法地大量介入原本属于私人的生活空间。禁酒运动（Temperance Movement）则是另一项具有广泛群众基础的历史实践。19世纪上半叶，琴酒与啤酒的廉价供应使得工人阶级的酗酒问题极其严重。全国性的禁酒组织如“英国禁酒联盟”（British Temperance League）和“全国禁酒联盟”（National Temperance League）迅速成立，通过分发宣传手册、举办集会以及建立“无酒精茶室”来对抗酒吧文化。道德改革者认为酒精是家庭暴力、贫困和工效低下根源，致力于通过宣誓戒酒来培养有纪律的工业劳动力。到了19世纪后半叶，道德审查机制进一步制度化并向法律层延伸。1885年成立的“社会纯洁联盟”（Social Purity Alliance）以及由艾莉斯·霍普金斯（Ellice Hopkins）推动的“白十字军运动”（White Cross Army），将焦点转向了性道德与妇女儿童保护。这些组织积极推动国会立法，最直接的成果就是1885年通过的《刑法修正法案》（Criminal Law Amendment Act）。该法案不仅提高了同意年龄，更通过了著名的“布鲁肖修正案”（Labouchere Amendment），将所有私下的同性恋行为定为刑事犯罪，极大地拓宽了国家对个人私生活的惩戒权力。同时，出版物审查也达到了前所未有的严格程度，任何涉及性描写或被认为有损社会风化的书籍都会遭到“抑制犯罪协会”（Society for the Suppression of Vice）等民间团体的起诉与禁售。维多利亚时代的道德改革在客观上推动了公共卫生条件的改善、儿童劳工保护以及社会福利事业的发展，但其底层逻辑自始至终包含着深刻的控制性。它建立在一种阶级偏见之上，即认为贫困并非源于资本剥削或制度缺陷，而是源于底层民众自身的道德缺陷。通过将复杂的社会经济问题简化为个人道德问题，维多利亚中产阶级成功将一套特定的道德秩序转化为全社会的行为准则，并在帝国扩张的鼎盛时期将这种“体面文化”打包为英国文明的标志，向全球进行输出。", "excerpt": "福音派基督教的兴起与新兴工业中产阶级的崛起构成了道德改革的双重引擎。福音派强调个人的原罪、自我救赎以及在世俗生活中的道德义务，将个人品行提升至灵魂拯救的高度。而工业中产阶级需要一套不同于旧贵族放荡生活与底层无序习惯的伦理标准，借此确立自身的社会话语权。他们将“勤奋、节制、纯洁、体面”定义为文明的核心指标，并启动了一系列旨在重塑公共与私人生活的运动。这场运动首先体现在极为激进的社会清洁与公共卫生改革", "url": "https://www.zhihu.com/pin/2072687352602948935", "votes": 0, "comments": 1, "feed_ts": 1786948642, "feed_time_str": "08-17 14:37", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "汉武帝会不会真想杀刘据?", "excerpt": "汉武帝六十多岁眼看着快噶了，连个备用太子都没有，疯了才会真想杀刘据。。。 汉初大臣和皇帝之间的争权很激烈的。大臣们一直在持续不断地挑战皇帝的权威，想拿到更多的权力更大的话语权。拥立代王刘恒、周亚夫拿出兵镇压叛乱威胁汉景帝杀晁错、大臣拥护刘荣、还有巫蛊之祸都是大臣与皇帝之间的斗争。 巫蛊之祸本质上还是大臣和汉武帝之间的矛盾终于爆发了。大臣在刘彻刘据之间两头骗，刘据以为刘彻死了自己是扶苏所以真反了，刘", "url": "https://www.zhihu.com/question/7324827200/answer/59527744961", "votes": 69, "comments": 89, "feed_ts": 1786948263, "feed_time_str": "08-17 14:31", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "把5月份写的广东篇的推演又重新写了一下，因为当时忽视了一个很麻烦的问题，就是台风强烈的输水能力。我 function esc(s) {

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];

}

    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

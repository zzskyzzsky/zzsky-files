题", "title": "为什么attention要用linear layer去提取QKV矩阵？可以用卷积核提取吗？", "excerpt": "当然可以。如果只是问“Q、K、V能不能通过卷积生成”，答案没有什么悬念。卷积本身就是一种可学习的线性运算，只要输入输出的维度能够对应，完全可以把Transformer里生成QKV的Linear换成Conv1d。 甚至当卷积核大小等于1时，它和Linear做的事情几乎没有本质区别。 假设一句话经过前面的网络以后，变成了一个长度为L、隐藏维度为d的矩阵。Linear会让每个位置上的d维向量分别乘上一组", "url": "https://www.zhihu.com/question/6857965276/answer/2062211902936241046", "votes": 8, "comments": 0, "feed_ts": 1784449632, "feed_time_str": "07-19 16:27", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "学吧，太深了生活处处有菲勒斯，包括吃个xx乙游的瓜。我小来献个丑分析一下图里的现象：正常洋妞是不会来玩一个东亚的乙游的，不论是本人线下谈不谈真人恋爱。玩乙游的洋妞本就是缺少生活的实感，因此更喜欢模因构筑的世界而不是真人互动，而乙游男主也是模因满满缺少活人感……", "excerpt": "学吧，太深了生活处处有菲勒斯，包括吃个xx乙游的瓜。我小来献个丑分析一下图里的现象：正常洋妞是不会来玩一个东亚的乙游的，不论是本人线下谈不谈真人恋爱。玩乙游的洋妞本就是缺少生活的实感，因此更喜欢模因构筑的世界而不是真人互动，而乙游男主也是模因满满缺少活人感……", "url": "https://www.zhihu.com/pin/2062124880414380668", "votes": 0, "comments": 16, "feed_ts": 1784448879, "feed_time_str": "07-19 16:14", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "大又元发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "但凡反应慢点，晚蹲零点几秒，哥们都得东一块西一块！", "excerpt": "但凡反应慢点，晚蹲零点几秒，哥们都得东一块西一块！", "url": "https://www.zhihu.com/pin/2062205778568672440", "votes": 0, "comments": 1, "feed_ts": 1784448172, "feed_time_str": "07-19 16:02", "category": "pin", "cat_name": "想法动态"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "美国的杀手为什么不买把狙？", "excerpt": "因为杀手第一要确保目标必死，而且尽量不能被发现杀意。狙击是很难一枪命中的，因为风速温度随着距离拉长所有问题都会被放大，三角函数都学过吧，你从你从点a瞄准直角点b，最终射中点c，已知你和目标距离100米，因为cos1度近似等于0.99998，所以估测时认为ac=ab按100米算，sin1度等于0.01745，对边也就是偏差值等于sin1度×100米，也就是你开枪时偏差1度，弹着点偏差1.745米。1", "url": "https://www.zhihu.com/question/668224021/answer/1961138798944555194", "votes": 2427, "comments": 421, "feed_ts": 1784448108, "feed_time_str": "07-19 16:01", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "话说如果现实中真的存在掠夺人类女性作为苗床的魔物的话，会发生什么？村民们真       + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

n": "赞了想法", "title": "《我所知道的李博杰》链接感谢雷峰网的报道，三个小时聊了好多，小编文笔也非常不错。1. 被误读的 “天才少年” 项目2. 被创业当成 offer 的代价3. 风暴与标签之外当时给小编讲的几个段子都被写进去了，一个是天才少年被内网炮轰，一个是任总座谈说霍去病来了应该给多少级，一个是把创业公司期权跟大厂 offer 直接比的故事，这里补充一点细节：23 年出来的时候算了下 kimi 阶跃 01 光年这些公司的 offer 按照刚成立时的估值只有 100-200 万美金期权，自己搞创业公司一上来就 500 万美金期权，那肯定自己干呀 😂 小编为了这篇文章采访的人比公司背调都多，还真的给我了挺多中肯的 feedback。很惊奇的是《骗分导论》今天还有这么多人知道。", "excerpt": "《我所知道的李博杰》链接感谢雷峰网的报道，三个小时聊了好多，小编文笔也非常不错。1. 被误读的 “天才少年” 项目2. 被创业当成 offer 的代价3. 风暴与标签之外当时给小编讲的几个段子都被写进去了，一个是天才少年被内网炮轰，一个是任总座谈说霍去病来了应该给多少级，一个是把创业公司期权跟大厂 offer 直接比的故事，这里补充一点细节：23 年出来的时候算了下 kimi 阶跃 01 光年这些", "url": "https://www.zhihu.com/pin/2071315499418490160", "votes": 0, "comments": 1, "feed_ts": 1786636243, "feed_time_str": "08-13 23:50", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "DeepSeek V4 Pro正式版来了给 Codex 换 DeepSeek 的人，现在多了一个真正影响日常手感的开关：DeepSeek V4-Pro 和 V4-Flash 都能选 reasoning effort。简单任务用 low，日常 agent 工作流用 high，难题再上 max。V4-Pro 已在 DeepSeek App/Web 的 Expert Mode 和 API 可用，原来的 API 模型名不变。这次更新最该看的是推理档位。DeepSeek 文档里，thinking 默认开启且默认就是 high；low、high、max 三档对应模型实际的低、高、最大推理强度。`medium`、`high` 和 `xhigh` 最终都会映射到 high，想明确上最高档必须传 max。这意味着同一个 V4 模型可以按任务切换：查一个文件或做轻量修改，没必要始终用最大推理；连续调用工具、需要规划的 coding agent，先从 high 起步；遇到复杂排错或多步任务，再单独把 effort 拉到 max。它是工作流配置，不是官方已经公布的“某档比某档高多少分”。Codex 接入少了一层协议适配DeepSeek 现在原生支持 OpenAI Responses API，官方专门给 Codex 写了一键配置脚本。脚本会先备份 `~/.codex/config.toml`，再写入模型目录和 DeepSeek provider；Codex CLI、ChatGPT desktop app、VS Code 的 Codex 扩展共用这份配置。真正需要记住的是：切到 DeepSeek API 后，Codex 历史会按登录方式分组显示。旧会话没有被删，只是暂时隐藏；恢复原来的配置后会再出现。这个细节不搞清楚，很容易误以为自己的历史记录丢了。agent 工具调用有两个容易踩的点如果是带工具的多轮调用，当前轮的 `reasoning_content` 必须完整带回下一次请求，否则 DeepSeek API 会返回 400。thinking 模式下传 `temperature`、`top_p` 等参数也不会报错，但不会生效。Responses API 也不是全部照搬 OpenAI：function 和服务端 web search 可用；Codex 兼容的 custom tool 只支持 `apply_patch`；`file_search`、`computer_use`、MCP 等其他内置工具会被忽略。已有复杂工具栈的人，先拿一个真实任务核对工具调用和上下文拼接，别直接把生产工作流整体切过去。V4-Pro 和 V4-Flash 怎么选DeepSeek目前没有在这条发布中给出“生产力提升”的任务、benchmark 或具体数字，评论区也有人追问这个口径。因此现在能下的结论只到产品能力：两款模型都有可调 effort，V4-Pro 可从 App/Web 的 Expert Mode 使用，且可通过同一套 Responses API 接进 Codex。", "excerpt": "DeepSeek V4 Pro正式版来了给 Codex 换 DeepSeek 的人，现在多了一个真正影响日常手感的开关：DeepSeek V4-Pro 和 V4-Flash 都能选 reasoning effort。简单任务用 low，日常 agent 工作流用 high，难题再上 max。V4-Pro 已在 DeepSeek App/Web 的 Expert Mode 和 API 可用，原来的 ", "url": "https://www.zhihu.com/pin/2071382913606751817", "votes": 0, "comments": 0, "feed_ts": 1786636198, "feed_time_str": "08-13 23:49", "category": "pin", "cat_name": "想法动态"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "DeepSeek 开源了DeepSeek Harness v0.1DeepSeek 今天发布了 DeepSeek Harness v0.1：一套让 agent 跑起来的开源运行框架。它把模型、工具、技能、会话、沙箱、文件系统、循环、调度和 UI 都做成插件，开发者可以在配置层替换其中任一块。代码已按 MIT 许可证开放，但当前仍是 Developer Preview，DeepSeek明确提醒后面会有不兼容改动。发布背后想解决的，是很多人搭 agent 时都会碰到的问题：模型能换、工具能加，但一套真正能连续做事的系统还需要会话、文件、沙箱、任务循环、子 agent 调度和界面。每换一个环节都改主工程，系统会很快缠在一起。Harness 到底是做什么的DeepSeek把关系写成 `AGENT = MODEL + HARNESS`。模型负责理解和生成；Harness 负责让 agent 看见当前环境、调用工具、保留过程，并把多轮工作接起来。它负责把模型接进一套可运行的工作环境：可读写文件、调 Shell、管理会话、调用技能、安排子 agent，再把这些动作组织成一次任务的执行过程。它的功能边界也因此超过普通聊天界面。一切皆插件，改一块不必重写整套系统DeepSeek Harness 的核心设计是“一切皆插件”。Cordis 内核只处理插件的加载、卸载和依赖关系；模型适配器、工具注册、会话、沙箱、存储、循环、调度和 UI 都由插件提供。对开发者更实际的意义是：想换模型供应商、换一个沙箱、给 agent 加技能，理论上不该牵动整套代码。DeepSeek强调这些能力可以在配置层组合、替换或扩展，不必先改 Harness 源码。插件化不保证系统天然更强；它解决的是可替换性和复用性，前提是插件之间的接口、权限和版本管理做得住。DeepSeek 目前还在开发者预览阶段，正好意味着这些边界仍会变化。每次运行都能回放，才方便定位 agent 为什么出错DeepSeek产品页还有一个值得关注的设计：会话日志采用仅追加方式记录。系统提示词、模型的推理过程、工具调用及结果、子 agent 调度和上下文注入会进入同一条事件流；恢复、分叉、检索和回放也使用这份记录。对写 agent 的人来说，这比“任务失败了，再猜模型哪里理解错了”更有用。你能顺着一次执行去看：它拿到了什么上下文，为什么调这个工具，工具返回了什么，后续又把哪些信息塞回模型。能不能把 agent 做稳，往往先取决于能不能复盘它。四种模式对应四类试验标准模式是完整的编码 agent：文件编辑、Shell、文件与网页检索、Skills、计划、目标、子 agent 和工作流都在。PTC 模式进一步让模型写 TypeScript 程序来编排多轮工具调用；极简模式只保留持久 bash 和文件编辑工具，适合做最小环境基准；创造模式面向想做自定义 preset 的开发者，可检查运行时并试验 Cordis 插件。这组模式把开发、评测和定制拆开：日常任务用完整环境；比较模型时先把环境缩小；需要新工作流时，再从插件和 preset 下手。现在值不值得试如果你在搭自己的 coding agent 或自动化工作流，值得把它当成一个可拆解的 agent 工程样本：官方仓库已经开放，安装 Node.js 后可以用 `npx @deepseek-ai/dsh web` 启动本地 Web UI。如果你要把它接进稳定业务，先别急着替换现有系统。它目前没有承诺接口稳定，DeepSeek已提前说明会有兼容性破坏；更合理的用法是先用一个独立任务验证插件边界、日志可读性和工具权限，再决定是否迁移。DeepSeek 这次开源覆盖的，是模型之外那套让 agent 持续工作的工程：把它拆成可交换模块。对真正要长期维护 agent 的团队，这部分往往比一次模型接入更难，也更值得研究。", "excerpt": "DeepSeek 开源了DeepSeek Harness v0.1DeepSeek 今天发布了 DeepSeek Harness v0.1：一套让 agent 跑起来的开源运行框架。它把模型、工具、技能、会话、沙箱、文件系统、循环、调度和 UI 都做成插件，开发者可以在配置层替换其中任一块。代码已按 MIT 许可证开放，但当前仍是 Developer Preview，DeepSeek明确提醒后面会", "url": "https://www.zhihu.com/pin/2071365555525772499", "votes": 0, "comments": 0, "feed_ts": 1786634957, "feed_time_str": "08-13 23:29", "category": "pin", "cat_name": "想法动态"}, {"actor": "机器之心发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "突发！DeepSeek Harness 开源，智能体一切皆插件DeepSeek 正式开源了开发者预览版 Agent 框架“DeepSeek Harness”，为大模型大脑装上了能连接终端、网页与文件系统的“身体”。它采用“一切皆插件”的设计理念，还内置了可复盘错误的 Session Log 以及多种场景模式。用户现在只需前往官方开源仓库即可直接配置部署，一起去看看吧～", "excerpt": "突发！DeepSeek Harness 开源，智能体一切皆插件DeepSeek 正式开源了开发者预览版 Agent 框架“DeepSeek Harness”，为大模型大脑装上了能连接终端、网页与文件系统的“身体”。它采用“一切皆插件”的设计理念，还内置了可复盘错误的 Session Log 以及多种场景模式。用户现在只需前往官方开源仓库即可直接配置部署，一起去看看吧～", "url": "https://www.zhihu.com/pin/2071376050093823225", "votes": 0, "comments": 0, "feed_ts": 1786634565, "feed_time_str": "08-13 23:22", "category": "pin", "cat_name": "想法动态"}, {"actor": "1000米恐惧症", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何一眼分辨出有健身运动习惯的人？", "excerpt": "其实健康的运动习惯带来的最明显变化是“活力”。 也就是你的代谢水平增加了。 大家可以观察小孩子，他们明明能正常走路，但是非得蹦蹦跳跳的，这是什么原因？ 小孩子代谢水平其实很高，大量的能耗外加充足的营养，给了他们用之不竭的精力。因此经常会出现完全不过大脑的，非常多余的耗能动作。 成年人之间也有明显差距， 比如有的人走路都是弯腰驼背，腿抬不起来，鞋拖着地，而有的人走路却是昂首阔步， 这其实就是不同代谢", "url": "https://www.zhihu.com/question/633237461/answer/2071369708222289336", "votes": 8, "comments": 0, "feed_ts": 1786633023, "feed_time_str": "08-13 22:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "爱上半导体发布了视频", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "我终于把乱了十几年的桌面治好了！暂无简介！", "excerpt": "我终于把乱了十几年的桌面治好了！暂无简介！", "url": "https://www.zhihu.com/pin/2071367184513871997", "votes": 0, "comments": 00%准确预测未来，如果有，那一定是骗子。 所以本文会列出过去美股和A股所有崩盘前兆，并总结规律，然后与现有指标一一对比，最终有多大概率崩盘，看完你自己就能估算。 下面言归正传。 美股崩盘举个例子", "url": "https://www.zhihu.com/question/2009277208112411935/answer/2056385750418060021", "votes": 39, "comments": 3, "feed_ts": 1786601574, "feed_time_str": "08-13 14:12", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "你会去电影院看沈腾主演的新电影《欢迎来龙餐馆》吗？票房能破50亿吗?", "excerpt": "我看了一圈，发现没有一个回答能解决我的疑问。 谁特么能告诉我，这部电影是怎么成的“主旋律”电影的？我甚至都看到了一个回答在那抨击主旋律。 ", "url": "https://www.zhihu.com/question/2068398077522793536/answer/2069800527467229908", "votes": 1534, "comments": 137, "feed_ts": 1786600603, "feed_time_str": "08-13 13:56", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "曹多鱼", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "就有朋友问我美股这个 23 小时交易的新规很多人第一反应是 “以后不用熬夜看盘了”，但我要告诉大家，这根本不是方便散户，而是给散户挖了一个更大的坑。先给大家说清楚新规：纳斯达克从今年 12 月 6 号开始，每天只休市 1 小时，剩下 23 小时全开放交易，一周五天，从周日晚上到周五晚上，几乎不停歇。为什么我说这是个坑很简单，美股这么一来，本质上是在 “淘汰” 散户。给大家举个操盘的逻辑就懂了。主力想快速拉涨或者砸盘，靠的不是资金量大，而是成交量小的时候。只要他把上下的买单卖单同时清空，就能瞬间拉出一个大阳线或者大阴线。那主力会选什么时候动手？一定是散户没时间看盘的时候。说白了就是欺负散户没时间盯盘。以前交易时间短，主力和散户在同一个时间窗口里，散户看到异动还能有时间跑。但现在变成 23 小时交易，你个人可能 24 小时不睡觉盯着吗？答案是不可能。以后很可能出现的情况是什么呢？投资者这边看着美股上涨买入了，结果一觉醒来，机构直接在晚上出货拉崩了。那最后个人投资者怎么办呢？答案很简单，只能把钱交给基金、交给机构，让他们帮你管。这其实就是变相逼散户把资金委托给主力，推动市场 “机构化”，让散户失去直接交易的主动权，最后在市场高位的时候用散户钱去接盘，让散户变成被收割的对象。所以别觉得这是美股在开放市场，它只是在给全球散户挖了一个更大的坑。", "excerpt": "就有朋友问我美股这个 23 小时交易的新规很多人第一反应是 “以后不用熬夜看盘了”，但我要告诉大家，这根本不是方便散户，而是给散户挖了一个更大的坑。先给大家说清楚新规：纳斯达克从今年 12 月 6 号开始，每天只休市 1 小时，剩下 23 小时全开放交易，一周五天，从周日晚上到周五晚上，几乎不停歇。为什么我说这是个坑很简单，美股这么一来，本质上是在 “淘汰” 散户。给大家举个操盘的逻辑就懂了。主力", "url": "https://www.zhihu.com/pin/2071233221560422504", "votes": 0, "comments": 21, "feed_ts": 1786600519, "feed_time_str": "08-13 13:55", "category": "pin", "cat_name": "想法动态"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "《欢迎来龙餐馆》为啥不叫《欢迎来到龙餐馆》？", "excerpt": "答的都是啥呀，看得我连中文都不会说了。 欢迎来到龙餐馆，这句话的对象是对已经进店的顾客说的“欢迎词”。就像你飞机落地，高铁到站，机场和火车站的标语有“欢迎您来到哈尔滨”一样。 const catKeys = ["ai", "gold", "geo", "pin", "other"];

let currentView = 'category';

function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
        + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
        + '<span class="time">' + p.feed_time_str + '</span></div>'
        + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
        + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
        + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
    }
  }
  document.getElementById('posts-container').innerHTML = h;
}

function renderByTime() {
  let h = '';
  for (const p of postsData) {
    const icon = verbIcon[p.verb] || '•';
    const color = catColors[p.category] || '#999';
    h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'
      + '<span class="verb">' + icon + ' ' + esc(p.verb_cn) + '</span>'
      + '<span class="cat-dot" style="background:' + color + '"></span>'
      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {

  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>

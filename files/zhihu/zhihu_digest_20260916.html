词和输出保留 30 天，它说的是这些日志不用于训练，但是它的人品有目共睹：而且就算不训练，光是敏感信息可以被 Anthropic 拿去分析和查阅，像这种大公司谁敢赌，而且 OpenAI 一样被限制", "url": "https://www.zhihu.com/question/2083117744707352472/answer/2083197944694564714", "votes": 755, "comments": 40, "feed_ts": 1789501411, "feed_time_str": "09-16 03:43", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "社会主义的羟基", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待袁腾飞讲伊拉克战争时所说的“美军进入巴格达以后，伊拉克人民无不箪食壶浆以迎王师”这句话？", "excerpt": "知乎以前还真的去拿这个问题问过知乎著名华裔美军刘大佐。 他的回答是：“美军这种活动还是组织得起来的” 图文无关 ", "url": "https://www.zhihu.com/question/1945745421621236481/answer/2082850243041825416", "votes": 311, "comments": 6, "feed_ts": 1789498300, "feed_time_str": "09-16 02:51", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "比亚迪高管称燃油车没有未来，如何看待这一言论？燃油车会快速退场吗？", "excerpt": "迪子好几年前就不生产纯油车了啊，能不能说点大家不知道的。", "url": "https://www.zhihu.com/question/2082845705690001649/answer/2083381581188690134", "votes": 24, "comments": 0, "feed_ts": 1789496876, "feed_time_str": "09-16 02:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "无影寺", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "Claude能读写Salesforce销售数据了Salesforce 是销售团队常用的 CRM，也就是存客户、商机和销售管道的业务系统。Anthropic 把它接进了 Claude：Salesforce in Claude 进入 beta 后，销售人员可以在 Claude 里读取自己有权限看的客户和商机数据，并在确认后把更新写回 Salesforce。对销售团队来说，一次客户沟通前后的资料准备、商机判断和跟进记录，可以在同一段对话里串起来。Salesforce in Claude 怎么串销售流程例如准备一场客户电话，Claude 能汇总该账户的历史、当前商机、团队近期在 Slack 里讨论过的事项、未回复的线程和上次通话遗留的问题。发现关键联系人还没录入时，它可以把联系人补进账户。通话结束后，销售人员可以让 Claude 根据会议转录或笔记起草跟进邮件、Slack 里的商机摘要，以及下一步、阶段和预计成交日期等 CRM 更新。真正写入 Salesforce 前，默认还要由销售人员确认。37 个 skill 覆盖哪些事Anthropic 给这个插件配了 37 个预置销售 skill，覆盖账户研究、通话准备、销售管道审查和 CRM 更新。每天的 brief 可以汇总当天会议、临近成交的订单、有风险的商机和待回复线程；销售人员还能让 Claude 生成可下钻的销售管道看板，再据此调整成交日期或销售阶段。业务记录仍以 Salesforce 为准，Claude 只读取用户既有 Salesforce 权限允许的数据。管理员先为组织接入 Salesforce，销售人员再用自己的 Salesforce 凭据登录；Claude 默认每次都把修改先交给人确认。Salesforce in Claude 的 beta 接入条件Salesforce in Claude 目前面向所有付费 Claude 计划开放 beta，但入口不是个人点一下就能完成：组织管理员需要通过 Salesforce AgentExchange 申请接入，并为整个组织连接 Salesforce。已有 Salesforce 和付费 Claude 的销售团队、销售运营团队，比较适合先拿一小组真实商机试流程。普通 Claude 用户暂时很难直接从这项功能获益。Anthropic 也没有披露 37 个 skill 如何选择、能省下多少端到端时间，以及具体价格或独立效果评测。它先解决的是销售团队高频的资料拼接和手工回填，效果还要看企业自己的数据质量、权限配置和审批习惯。", "excerpt": "Claude能读写Salesforce销售数据了Salesforce 是销售团队常用的 CRM，也就是存客户、商机和销售管道的业务系统。Anthropic 把它接进了 Claude：Salesforce in Claude 进入 beta 后，销售人员可以在 Claude 里读取自己有权限看的客户和商机数据，并在确认后把更新写回 Salesforce。对销售团队来说，一次客户沟通前后的资料准备、商", "url": "https://www.zhihu.com/pin/2083365801168467370", "votes": 0, "comments": 0, "feed_ts": 1789493155, "feed_time_str": "09-16 01:25", "category": "pin", "cat_name": "想法动态"}, {"actor": "于朝阳", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "什么事情是你待在西安才知道的？", "excerpt": "你要是住在西安的西北郊，你会恍惚。 前阵子我在这里三环边三百多米的地方拍了一张照，发到知乎，评论区我看有说这是草原... 角度找好还真挺像草原。 前天我同样在这边三环边另一处一百多米的地方，突然发现这样的场景。 牧马放羊...更有草原感了。三环这两处拍摄地点，距离西安市政府距离均只有8km多。这就是神奇的西安西北郊... 这马还挺好看的。 让我不禁想起了大表哥中那批伴随不少玩家到最后，死了却不能复", "url": "https://www.zhihu.com/question/571809649/answer/2083356338172777978", "votes": 16, "comments": 2, "feed_ts": 1789490858, "feed_time_str": "09-16 00:47", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "酱紫君", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "怎么看待众多研究人员呼吁加州理工学院取消数学黑客松？", "excerpt": "Benchmark is all U need，西大不办那就东大办。 我完全同意反对者的所有观点，公司巨头一定会利用这种活动大搞 AI 学术不端、量产垃圾 lean 数学、误导年轻学者。 但是，正因为我同意以上所有最坏的情况必然发生，所以我才认为应该大办特办 Mathathon。 一个行业想要持续发展壮大一定需要 Attention，而最容易产生 Attention 的东西恰恰就是 Benchma", "url": "https://www.zhihu.com/question/2081502790036337583/answer/2083344020462486875", "votes": 101, "comments": 2, "feed_ts": 1789487921, "feed_time_str": "09-15 23:58", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么日本原本期待的“民间外交解冻”，突然失去效果？", "excerpt": "大家解释的都是中国一侧的心态变化，我说说日本一侧的。传统上，所谓中日“民间外交”的确能在某种程度上缓解日本一侧的对华敌对情绪，或者维持一些最基本的体面等待日后关系恢复。 能做到这一点，首先是因为日本新闻界至今依然有着牢固的“大本营发表”传统，除了文艺春秋之外的极少数小杂 为什么厌恶杨修，要杀死杨修？", "excerpt": "曹操晚年回过味儿来了，让两个儿子斗兽实在太蠢，于是两边各杀了一个。 先看曹植这边的杨修。 杨修干的事儿，很难不死。他的职务是仓曹属主簿，就是丞相府的办公室主任，同时还兼着管粮草的二把手。所以他可以说是曹操最贴身的左右手之一，不仅总知内外军国事，而且精准把握曹操的办事风格，曹操非常满意。 丞相请署仓曹属主簿。是时，军国多事，脩总知外内，事皆称意——《三国志·曹植传》注引《典略》这样一个人，是怎么帮曹", "url": "https://www.zhihu.com/question/667844611/answer/2082932337369671606", "votes": 792, "comments": 59, "feed_ts": 1789483398, "feed_time_str": "09-15 22:43", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待《杀光日本人》。本人在班会里听几个同学这么嚎叫，觉得低俗不堪，却好像有很多人喜欢。？", "excerpt": "在一所著名大学里的历史课上，教授正在向来自各国的同学提问：“要生存还是要灭亡。”这句名言出自谁的口中？ 沉寂了半天之后，古田站起来说：“威廉·莎士比亚。” “很好，被誉为“欧洲的良心”是指谁？ “罗曼·罗兰。” “要么给我自由，要么让我死。’这句名言最早出自谁之口? “1775年，巴特利克·亨利说的。” “很好，那么，‘民有、民治、民享’是谁说的。” “1863年，亚伯拉罕·林肯说的。” “完全正", "url": "https://www.zhihu.com/question/68004453/answer/2082860874377831315", "votes": 888, "comments": 21, "feed_ts": 1789483318, "feed_time_str": "09-15 22:41", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "蓝色", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待 DeepSeek 刘胜与的《我不得不把才华埋葬在昨天》？", "excerpt": "这是必然的趋势，目前大模型对于一个特定的算子解的优化非常牛逼，只要能有knowledge，不断的try，这块它就是王道。大模型对于长上下文的超级复杂问题，因为传导性可能造成更多的发散，但是算子不是，范围很窄，目标明确，这种大模型最容易去搞。所以最好还是配合他，帮助他更好的去做这件事情，然后我们去干别的。 ", "url": "https://www.zhihu.com/question/2083123101873844765/answer/2083324193282830602", "votes": 30, "comments": 0, "feed_ts": 1789483194, "feed_time_str": "09-15 22:39", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "手刀", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "朱元璋为啥一边在祖训里写非嫡不立，一边立朱允炆这个庶出啊？", "excerpt": "是嫡孙。因为朱允炆的妈妈吕氏在正妻常氏死后转正了。庶转嫡。 的确，常氏是还有个儿子。严格来说他才是原嫡长孙。 但是请考虑一个问题：蓝玉的军中基本盘是继承自常遇春一脉。蓝玉在朱标活着的时候的骄横，也是因为朱标和蓝玉都有一层常家的姻亲关系，他是皇太子朱标的妻舅。 而常遇春的势力包括他儿子，都在蓝玉案中被一锅端了。 那么知道了这个，哪怕不考虑当时的礼法中庶转嫡本来就很合理，嫡长孙有且只有是朱允炆。 题主", "url": "https://www.zhihu.com/question/4923363986/answer/2083321066689242593", "votes": 1, "comments": 2, "feed_ts": 1789482449, "feed_time_str": "09-15 22:27", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "工业人舒拉顿", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "说过好多遍了。全民基本收入的本意不是要增加福利，而是一群自由至上主义者想要缩减福利开支，想要用“无差别撒钱”的方法整体替代现行的社保体制。简单来说，就是用每个月发几千块钱的方式，取代现行国家在教育、医疗、养老等各方面承担的责任。每个人都是自己看病、养老、孩子上学的第一责任人，国家除了每个月给你发钱以外什么都不管，你要是选择当月光族后果自负。抛开这背后的自由至上主义假设不谈，这一套在理论上是可以运转的。然而实际上要考虑的社会因素太多了：“无差别撒钱”以及相对应的个人责任原则归根结底是不太符合人性对差别对待、抑强扶弱的天然需求的，这种原则实际上很难真的维系下去；如果真正要求个人成为自己福利保障的第一责任人，那么外部环境起码不能拖后腿，这意味着货币币值必须稳定，才不会让个人储蓄被长期通胀所侵蚀。但“无差别撒钱”背后隐藏的、对货币发行的高度垄断使这一点恐怕会非常困难。以及更重要的，如罗斯巴德-霍普所言，市场经济原本可以为一套相当保守的道德体系所支持，但如今的社会环境却在以系统性的方式蔑视个人责任原则、长时间偏好以及维系家庭的道德，这使得如今的自由市场运行实际上是相当裙带化的。在这种情况下，把人类发展的全部责任推卸给个体是很不公平的。至于很多人畅想的“对AI公司收税”，为什么你觉得在完全竞争市场当中，利润率会长期保持居高不下，以至于总能收到如此高额的税收呢？如果新能源汽车/光伏行业如今的利润率不足以使其成为财政支柱，那为什么未来的AI公司就会有本质区别呢？我自己的“建设性意见”陈述过许多次了：辅助性原则下的自由货币+全额准备金制+以社区建设/家庭服务为条件、小共同体主导的有条件负所得税。", "excerpt": "说过好多遍了。全民基本收入的本意不是要增加福利，而是一群自由至上主义者想要缩减福利开支，想要用“无差别撒钱”的方法整体替代现行的社保体制。简单来说，就是用每个月发几千块钱的方式，取代现行国家在教育、医疗、养老等各方面承担的责任。每个人都是自己看病、养老、孩子上学的第一责任人，国家除了每个月给你发钱以外什么都不管，你要是选择当月光族后果自负。抛开这背后的自由至上主义假设不谈，这一套在理论上是可以运转", "url": "https://www.zhihu.com/pin/2083283970184188626", "votes": 0, "comments": 10, "feed_ts": 1789482181, "feed_time_str": "09-15 22:23", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "非凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "如何看待1978年中国人均收入是非洲三分之一？1979年，中国人均储蓄只有10元人民币，属于贫穷国家；但是，1979年对越自卫反击战，炮弹管够，要多少有多少，想打多久就可以打多久，只要炮管子承受得了。70年代中国重工业占比长期偏高，到1978年时，重工业占工业总产值的比重约为56.9%，这些东西最后变成了国防装备；中国在准备一场世界大战，准备一力战美苏。中国为什么穷的没裤子穿也要搞重工业？老百姓的生活连非洲都比不过也要搞重工业？中国不搞重工业，直接改革开放，早就发达了——这就是改革开放决定论。我问大家一个问题：美国这个大善人凭什么要和中国建交？70年代的中国，也是被西方制裁，由此发展出了庞大完善的重工业基础；西方一日不解除制裁，不对中国开放，中国就不停止输出革命，中国要做世界无产阶级革命的圣地——这才是改革开放的基础。中国发展到今天的底气是什么？庞大完整的重工业体系，任何国家都惹不起；70年代，中国人手里穷的就剩下炮弹了，好消息是炮弹管够，想挨多少，就可以打多少——我一直认为，炮弹比美元好使，不管你点不点赞，伊朗肯定同意我这个说法。如何看待1978年中国人均收入是非洲三分之一？ #中国改革开放  #改革开放后的中国  #改革开放40年最可怕变化 ", "excerpt": "如何看待1978年中国人均收入是非洲三分之一？1979年，中国人均储蓄只有10元人民币，属于贫穷国家；但是，1979年对越自卫反击战，炮弹管够，要多少有多少，想打多久就可以打多久，只要炮管子承受得了。70年代中国重工业占比长期偏高，到1978年时，重工业占工业总产值的比重约为56.9%，这些东西最后变成了国防装备；中国在准备一场世界大战，准备一力战美苏。中国为什么穷的没裤子穿也要搞重工业？老百姓的", "url": "https://www.zhihu.com/pin/2083319415232372827", "votes": 0, "comments": 1, "feed_ts": 1789482057, "feed_time_str": "09-15 22:20", "category": "pin", "cat_name": "想法动态"}, {"actor": "非凡", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待1978年中国人均收入是非洲三分之一？", "excerpt": "1979年，中国人均储蓄只有10元人民币，属于贫穷国家。 但是，1979年对越自卫反击战，炮弹管够 ，要多少有多少，想打多久就可以打多久，只要炮管子承受得了。1979年2月17日至3月16日‌约28天作战期间的消耗了106万发炮弹，越军90%的伤亡都是因为炮击。 后面的两山轮战，军事装备更换，弹药消耗，不计其数。只要前线需要，应有尽有。 这就是中国当时的奇观。老百姓兜比脸干净，打起仗来，那又是世界", "url": "https://www.zhihu.com/question/2075123502378759707/answer/2083319058892592416", "votes": 36, "comments": 9, "feed_ts": 1789481970, "feed_time_str": "09-15 22:19", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "Augenstren", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何评价布基纳法索政治家、前总统托马斯·桑卡拉？", "excerpt": "我发现很多人只知道桑卡拉是怎么被害的，不知道桑卡拉是怎么上台的… 所以几乎所有的评价都集中在桑卡拉当总统后干了什么，然后在纠结其中的错与对。 我给你简略说一下，上沃尔特是怎么变成布基纳法索的，我觉得如果你知道这段历史能对桑卡拉有另一种认识。 1980年，上沃尔特爆发了军事政变，军官泽博夺取政权，建立了一个独裁军政府，泽博这个人非常的亲法，如果说在他之前统治了上沃尔特16年的拉米扎纳好歹还有一套合法", "url": "https://www.zhihu.com/question/451326041/answer/2083315205409452996", "votes": 21, "comments": 0, "feed_ts": 1789481051, "feed_time_str": "09-15 22:04", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "帕佐", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "为什么你不愿意相信美国已经赢得了对伊朗的胜利？", "excerpt": "大家记住，输，有输的赢法！", "url": "https://www.zhihu.com/question/2026977719016006194/answer/2083313515574698836", "votes": 0, "comments": 0, "feed_ts": 1789480648, "feed_time_str": "09-15 21:57", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "手刀,LeiWang1999", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "法家明明效率极高，为什么后世王朝不敢公开主推？", "excerpt": "因为利益对齐问题。 技术上说，法家的法术势，都是服务于君王意志的算法。它根本上假设了，高算力的君王，低损耗的信息媒介，和低摩擦的执行单元。 可是偌大的社会，在古代，根本打不成这些条件。 面对国人利益庞杂，你怎么保证你理论上的子民一定会忠实执行你的算法呢？特别是帝国广袤的情况下，你甚至连地方长官的名字都认不全。 再者说，科层官僚队伍，即是君王臂膀（执行单元），又是君王耳目（信息媒介）。庞大到一定程度", "url": "https://www.zhihu.com/question/2083225082575509271/answer/2083313079522178286", "votes": 3, "comments": 0, "feed_ts": 1789480545, "feed_time_str": "09-15 21:55", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "gwave", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "从偏导数到湍流：Navier–Stokes 方程", "excerpt": "五年前，我写过一个偏微分方程系列，从拉普拉斯方程的天地无言，到热方程的扩散均衡，再到波方程的振荡传播，却唯独没有敢写 Navier–Stokes 方程。原因很简单：这个方程人类已经使用了近两百年，却始终不知道一个光滑的三维流体，是否会在有限时间内突然产生奇点。 三大偏微分方程之首：拉普拉斯方程(1)这个坑一留就是五年。 今天，OpenAI 的内部模型给出了有限时间奇点的分析证明，GPT‑6 Ast", "url": "https://zhuanlan.zhihu.com/p/2083295577987604836", "votes": 3, "comments": 0, "feed_ts": 1789480219, "feed_time_str": "09-15 21:50", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么日耳曼人经常能把罗马人打出惊人惨败，其他蛮族做不到？", "excerpt": "看你怎么定义蛮族和经常这两个词，如果按照罗马的标准，波斯同样是蛮族。而且从波斯从罗马那里掠夺大量人才用于修桥、制造玻璃来看，波斯的文明程度似乎确实不高于罗马。请问波斯帝国算不算经常把罗马打出惊人惨败？ 波斯帝国自从立国之初，阿尔达希尔就发誓要夺回阿契美尼德王朝一直延伸到爱琴海的广阔疆域，除了五世纪攻势暂歇以外，从三世纪到七世纪与罗马帝国的交战几乎从未停止过。仅仅是对安条克的攻占，据我所知就有五次…", "url": "https://www.zhihu.com/question/2082028868584657999/answer/2082956240972523443", "votes": 68, "comments": 16, "feed_ts": 1789478285, "feed_time_str": "09-15 21:18", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "埃兰人现在都去哪里了？是不是都被伊朗本土波斯族同化了？", "excerpt": "有一个很奇特的观点，对不对就看各位见仁见智了——那就是埃兰人至今仍然存在。 1853年，Edwin Norris发表文章，首次提出埃兰语与印度南部的达罗毗荼语族同源。3年后，Robert Caldwell出版了一部关于两种语言的比较语言学著作，进一步给出证据。 McAlpin完善了这一理论。他列出了57 个埃兰语词与达罗毗荼语词的对应关系，并于1975年提出，达罗毗荼语和埃兰语词汇中有20%是同源", "url": "https://www.zhihu.com/question/2025257390530994366/answer/2076259283335960281", "votes": 183, "comments": 10, "feed_ts": 1789478106, "feed_time_str": "09-15 21:15", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "嵌入式Linux", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "有网友把段永平吹嘘得神乎其神，他真的有那么厉害吗？", "excerpt": "去看完“段永平雪球问答”这本书，可以让你人生少奋斗10年不是吹牛。如果你年龄还小，哪放大的年数更大。 不一定买股票投资，投资自己的技能，投资你家小孩子的技能都可以。举个简单的例子： 比如里面的一个 stop doing list。把你需要学的技能放在5年、10年的维度去考虑值得不值得，然后把不值得的砍掉，专心搞你判断值得的技能。保持这样的节奏下来5年、10年。再在此过程中不断修正你当下觉得不用再学", "url": "https://www.zhihu.com/question/662712011/answer/1893277782290708325", "votes": 2215, "comments": 160, "feed_ts": 1789477696, "feed_time_str": "09-15 21:08", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "床单军团菲利克斯", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么现在没人提“韩国黄金时代”了？", "excerpt": "时值李在明总统支持率跌至 新低的30%区间，是时候回顾一下“黄金时代”的问题了。“黄金时代”的闹剧体现出一个问题。说好听点是中文互联网对韩国的认知有待加强；说特别难听点的，令人（至少令我）痛心的，那就是 现实中的大韩民国，在中文互联网的实际地位恐怕只能比拟人类最好的朋友，就算所谓“亲韩”言论反映出来的也是如此，实际上根本没人在乎韩国本身。在韩国股市暴跌，很多韩国人血本无归后，不少人嘲讽韩国和韩吹，", "url": "https://www.zhihu.com/question/2059698383712006519/answer/2083269129067352370", "votes": 108, "comments": 12, "feed_ts": 1789477004, "feed_time_str": "09-15 20:56", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "TravailleursNuit", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何评价尼克兰德最新推文：如果我是中国人，我会成为一个汉族沙文主义者？", "excerpt": "想象中的中国罢了。 和过去西方的那些贵族，哲学家，为人一个样。 想象一个遥远的中国，将自己的思念，理想梦想全部寄托上去。 如果他真实了解中国的民族政策，说不定态度180度转换。 ", "url": "https://www.zhihu.com/question/2076466197177053773/answer/2083034100525446021", "votes": 895, "comments": 30, "feed_ts": 1789476846, "feed_time_str": "09-15 20:54", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待博主永乐大帝明成祖最新一期视频讲述的沙俄与日本视觉的照妖镜？", "excerpt": "这个问题的回答区真算的上是群贤毕至少长咸集，大帝这期视频用俄日两个例子无非就是想论证完成工业革命不是游戏点国策树，不会到某个节点完成某些项目就砰一下渡劫飞升到下阶段获得全面提升，工业革命先行者固然有先发优势但后发的也不是慢人一步就永远落后，日俄两国近代工业化与本国传统的产业并不是两相对立更不会彻底切割，而清朝所拥有的基础条件胜过明治日本却被日本反超，清政府应当付主要责任，19世纪的近代中国可以有比", "url": "https://www.zhihu.com/question/2077565029956821379/answer/2081807113001644274", "votes": 54, "comments": 2, "feed_ts": 1789475875, "feed_time_str": "09-15 20:37", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "科技猛兽", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "虽然不写算子，但非常有同感，发明的大部分乐趣都被夺走了，很怀念过去大家都很菜，改点东西都费半天劲熬到半夜，第二天起来摸奖的日子", "excerpt": "虽然不写算子，但非常有同感，发明的大部分乐趣都被夺走了，很怀念过去大家都很菜，改点东西都费半天劲熬到半夜，第二天起来摸奖的日子", "url": "https://www.zhihu.com/pin/2083267127608341603", "votes": 0, "comments": 0, "feed_ts": 1789475289, "feed_time_str": "09-15 20:28", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "BBuf", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待 DeepSeek 刘胜与的《我不得不把才华埋葬在昨天》？", "excerpt": "所以就算是 AI 的核心研发人员，也感受到了 RSI 出现时的无力感，然后作为一个工程师， 自己最喜欢的工作方式正在消失。以前写 Kernel 是一种非常“手艺人”的工作，你知道 Hopper、Blackwell 的硬件特性，知道 shared memory 怎么排，知道 warp 怎么调度，知道某条 PTX 最后可能生成什么 SASS，知道 memory stall 出在哪里，然后坐一个下午，一", "url": "https://www.zhihu.com/question/2083123101873844765/answer/2083126633569980941", "votes": 2193, "comments": 176, "feed_ts": 1789475223, "feed_time_str": "09-15 20:27", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "晨星", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "陶哲轩、邓煜等菲奖得主联合抗议 AI 公司数学军备竞赛，AI 是否在毁掉数学？", "excerpt": "如果对陶哲轩近些年来的动向比较了解，就会知道他一直是用AI做数学的最主要的先驱者之一。所以这篇声明和他前一段时间在一些相关会议上的发言一样，不是对“AI做数学”这个大方向的否定，而是对近几个月出现的一些问题的警示。我认为总体上讲这篇声明是很有道理的。 虽然最近出了很多大新闻，但是现在AI在数学能力上的发展实际上处于一个很尴尬的阶段：以前是没有能力做前沿的科研，那么没有什么话好说，一切都还是人类数学", "url": "https://www.zhihu.com/question/2082035913132193247/answer/2082110713653470458", "votes": 3268, "comments": 195, "feed_ts": 1789474992, "feed_time_str": "09-15 20:23", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如果《黑神话：钟馗》最终告诉我们“世上本无鬼，全因人间冤屈太深生出了魔”，你接受这种立意的国风游戏吗？", "excerpt": "你最好希望他是这种立意，而不是“妖是好妖，神是坏神，民是愚民”", "url": "https://www.zhihu.com/question/2073790619328196929/answer/2076115401050690463", "votes": 605, "comments": 13, "feed_ts": 1789473906, "feed_time_str": "09-15 20:05", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "半佛仙人", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "克苏鲁式的网文目前只有诡秘之主被广泛认可，是我们没有找到对的方向吗？", "excerpt": "显然提问者的脑子没找对方向，也没看过克苏鲁作品和诡秘之主。 因为诡秘之主不算克 , {"actor": "BBuf", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待 DeepSeek 刘胜与的《我不得不把才华埋葬在昨天》？", "excerpt": "实际上不仅仅是佬提到的cuda算子开发，整个大模型推理系统模型支持，模型性能优化都被GPT6彻底打穿了。 就以文章里DeepSeek的ds v4.1 flash为例子。SGLang开始支持的时候，gb300 single node bs=1最开始的那个baseline版本只有30多tokens，但是在GPT6大人发挥神威之后一周多就把这个性能提升到了1000+ tokens/s。虽然我们做了人工干", "url": "https://www.zhihu.com/question/2083123101873844765/answer/2083264378355373027", "votes": 1220, "comments": 93, "feed_ts": 1789468933, "feed_time_str": "09-15 18:42", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "安森垚", "verb": "MEMBER_VOTE_PIN", "verb_cn": "赞了想法", "title": "观某回答有感突然发现有些平时叫嚣“郊区大法好，拆楼保平安”的用户，一转口风，开始痛骂北美的再城市化实践的“士绅化”现象，说再城市化只是某些群体提升低价打造属于自己的阶层的社区的手段。且不说问题是否存在，光是这些人以往的观点和说这些话的目的，其实就足够让人绷不住了。为什么要推动再城市化？因为北美尤其是美国城市的衰落显然是太过于普遍了，一个比较好的切入点是为什么加拿大就很少再对自己的高速公路做大刀阔斧的改造，哪怕高速公路的体量同样很大？因为就算是相对比较车本位的多伦多，当年修建高速公路时也没有借此制造城区的隔离，所以城区没有衰退啊。更别说温哥华由于新搬来的纽约人简·雅各布斯的不懈努力根本就没经历这一劫，像这样的城区，历史上就没衰退过，又何谈“再城市化”？所以再城市化完全是一些城市迫在眉睫的自救，而不是有些人声称的矫情。为什么要推动高速公路上盖开发或者新建外迁？那显然是为了弥补之前的历史遗留问题，尤其是某些城区的高速公路成为了制造断头路的罪魁祸首之后，将高速公路改建以避免其割裂地面道路路网似乎并不是什么罪大恶极的事情，而恰恰是刚需。而且纵观在这一议题上积极表态的全美各大城市，这与党派和立场根本就没什么关系，类似的项目完工后，这些城市也都有足够多的能让大众得利的回报了。至于什么动用大量市政财政改建快速路，引入资本拆除排屋社区，打造士绅化小资风情步行街区（说实话我很难想象这句话的原作者在想什么，本来就是排屋社区的话那步行性根本就不会差，也不会拆迁，纽约的格林威治村到现在也没有拆迁），且不说这句的真假，大家认真想想，这样的城市更新是不是恰恰就是现在官媒和城市更新相关议题里常常提到的“渐进式改造”呢？与上世纪50年代的北美城市再开发运动比，它的破坏力又能有几何？制造出的不宜居的环境又有多少？纽约有一项传统叫：“如果一座精美的建筑因再开发需要非得跟市民说再见，得守住的基本底线，日后还给他们一座更好的建筑。（感谢 @Antigng 老师当年在回答中引用这句话）”这一点来看，到底是不顾环评大拆大建修建一条高速公路更好，还是在保证环境不劣化的基础上去改造扩能交通基础设施，再优化住宅区的环境更好？最经典的案例莫过于俄克拉荷马城，在一次招商引资中因为市区环境不佳（这座市区为何沦落至此则是一个比底特律更悲伤的故事）落败给城区相对宜居的印第安纳波利斯后，市府几乎立刻就启动了城区的更新工作，目前的成果包括40号州际公路的外迁和扩能（由此可见，其实高速公路的优化并不一定是建隧道那么昂贵的，也不必然影响到开车一族的驾车体验，甚至可能改善）、利用高速公路外迁后多余下来的空间兴建的剪尾公园（Scissortail Park），以及利用废弃的工业区再开发的混合用途社区布里克敦（Bricktown）。所以有些人口口声声说的“引入资本拆除排屋社区”在哪儿，这里我要打个问号。如果说城区的新建住宅，一般而言类似的改造都是利用城市的空置空间建造的，这其中包括利用率低到已经无法维持的地面停车场，或是先前开发失败或废弃的土地（比如棕地开发）。还有些特别的例子，比如将旧厂房改造成住宅或者商业建筑，这在工业城市很常见，也经常受到低收入群体的欢迎，底特律在建的Fisher Body 21项目就是面向低收入群体的工业建筑改住宅项目，而开工之初抵制者却偏偏都不是低收入群体。至于以上群体对于美国低收入群体表现出的所谓关心，大家看到这里也能反应过来，纯粹是醉翁之意不在酒，痛恨大兴土木的项目不是自己想要的。更不要说，在前些年美国城市的改善工作尚未为大家知晓的时候，这些人的口风可是“美国城市都衰落成这样了，说明高密度城市是走不通的，郊区才是未来”。而谈及美国低收入群体无车可开的现状，这些人既没有呼吁改进公共交通系统服务他们的出行，又没有发声支持慢行交通设施和社区周边配套设施的建设，更从未对于美国的低收入群体的住房问题做过任何科普（很有意思的是做这些科普的恰恰是不才以及一些其他的同道中人），所以，到底谁才是“方圆二十里见不得穷人”的带善人呢？恐怕不打开他们的肚子，也能看到他们的心大概是什么成色了。我很推荐大家关注一下底特律从十多年前破产到如今乃至未来数十年的城市规划和城市治理的相关内容，这样能避免被很多类似的迷惑发言给欺骗，带到沟里去。底特律几乎是近年来最亮眼的能向世人展示美国市中心的潜力的地方。至于言必称红蓝，纯属上纲上线行为，毕竟盐湖城和俄克拉荷马城都不是蓝区，尚且都在为此奋斗，新城市主义最早的实践地佛罗里达也不是蓝区。至于为什么这些人会扣这些帽子，只能等他们来这评论区回答了。#美国 #城市规划 #城市设计 #丰饶议程 ", "excerpt": "观某回答有感突然发现有些平时叫嚣“郊区大法好，拆楼保平安”的用户，一转口风，开始痛骂北美的再城市化实践的“士绅化”现象，说再城市化只是某些群体提升低价打造属于自己的阶层的社区的手段。且不说问题是否存在，光是这些人以往的观点和说这些话的目的，其实就足够让人绷不住了。为什么要推动再城市化？因为北美尤其是美国城市的衰落显然是太过于普遍了，一个比较好的切入点是为什么加拿大就很少再对自己的高速公路做大刀阔斧", "url": "https://www.zhihu.com/pin/2073768855432909652", "votes": 0, "comments": 22, "feed_ts": 1789468841, "feed_time_str": "09-15 18:40", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么布尔什维克接手的是曾经征服半个世界岛的顶级强国沙俄，却最终留下了一个国力衰落的俄罗斯？", "excerpt": "在这个问题下，你甚至可以看到有人为了吹布党，整出“一战无强国”的狠活。。。", "url": "https://www.zhihu.com/question/2057736791331955431/answer/2058242676277917166", "votes": 274, "comments": 49, "feed_ts": 1789468688, "feed_time_str": "09-15 18:38", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "永乐大帝明成祖", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "为什么布尔什维克接手的是曾经征服半个世界岛的顶级强国沙俄，却最终留下了一个国力衰落的俄罗斯？", "excerpt": "←友最幽默的一集，沙俄是农业国，而同时期工业产值不到沙俄零头的日本是工业国。 唉，馒头。 唉，扶木犁。 ", "url": "https://www.zhihu.com/question/2057736791331955431/answer/2078616358389137772", "votes": 732, "comments": 75, "feed_ts": 1789468583, "feed_time_str": "09-15 18:36", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "平凡", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "[赞][赞][赞]", "excerpt": "[赞][赞][赞]", "url": "https://www.zhihu.com/pin/2083260655021380121", "votes": 0, "comments": 0, "feed_ts": 1789468045, "feed_time_st -15 14:11", "category": "pin", "cat_name": "想法动态"}, {"actor": "机器之心", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "ECCV 2026｜不靠「上帝视角」，也不等「完美指令」：REAL 让具身智能体走向开放世界", "excerpt": "真实家庭任务往往从「不完整的信息」开始：机器人不知道目标在哪里，用户也未必能一次说清自己想要什么。面对「帮我从餐桌上拿点零食」这样的模糊指令，机器人不仅要主动寻找候选物体，还要在发现面包和多个甜甜圈后进一步询问用户，确认究竟该拿哪一个。 在真实世界里，探索环境、理解意图和执行动作，本就不是三个彼此独立的问题。 围绕这一问题，来自上海交通大学、上海人工智能实验室等机构的研究者提出 REAL，一个面向", "url": "https://zhuanlan.zhihu.com/p/2083195368355976989", "votes": 1, "comments": 0, "feed_ts": 1789452568, "feed_time_str": "09-15 14:09", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "曹多鱼", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "如何看待卫健委主任雷海潮在新闻发布会上提到的我国未来仍然有比较充裕的劳动力资源？", "excerpt": "很多讨论人口的言论，有一个很大的问题： 就是单纯把人当成劳动力数字看待，忽略了人本身是社会化的个体。 总不能数据一改，就成了赢吧。大家都听过4-2-1家庭结构，也即双方家庭都是独生子女，6个钱包的翻版。 但很多人只看到好的一面： 他们想的是，等到继承财产的时候，一个晚辈，可以承接四位老人加上父母两代人的资产，听上去好像很划算，但问题是，很少有人去直面另一面，轮到承担养老责任的时候，压力会变成什么样", "url": "https://www.zhihu.com/question/2082856491682419689/answer/2083195287422744231", "votes": 360, "comments": 49, "feed_ts": 1789452461, "feed_time_str": "09-15 14:07", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "梅东的狮子", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "大家如何看待“大狗叫”梗已经被彻底解构？", "excerpt": "天天爆爆爆，解构这个解构那个，等自己被解构了就开始说“家人们谁懂啊下头网友把我的神爆梗无害化了。”就很……你知道吧。", "url": "https://www.zhihu.com/question/2058834049221899590/answer/2080231046231150727", "votes": 4519, "comments": 47, "feed_ts": 1789451827, "feed_time_str": "09-15 13:57", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "环中星鉴", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "10 年期美债突破「5% 收益率关口」，全球债市抛售潮是否将加速，加息预期下的市场何去何从？", "excerpt": "这次最有意思的是10年期收益率已经飙过5%，但黄金却没有出现崩盘。 按照常规逻辑，债券收益率涨，持有黄金的机会成本上升，大家会卖出黄金、金价下跌。 但黄金期货还是在10周均线4347美元附近撑住了。 其实现在你看到的这个金价，已经定价了从现在到2027年，总共4次加息！ 这是短短几天里发生的事，因为油价又快飙到110美 波，推高了通胀预期，市场现在认为美联储面对强劲非农和通胀走高，已经不得不加息。", "url": "https://www.zhihu.com/question/2082958818607220656/answer/2083191437710063604", "votes": 159, "comments": 35, "feed_ts": 1789451543, "feed_time_str": "09-15 13:52", "category": "gold", "cat_name": "黄金 · 股票 · 市场"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_PIN", "verb_cn": "发布了想法", "title": "说起来写这一篇，我又犯了贪大求全的毛病。前前后后写下来快3万字了，又往回删了不少的内容，还是有2万多字，干脆拦腰切断，把另外一部分自己的偏推演的社会学框架推演的内容当做下一篇，明天或者后天发。偶尔确实会犯这种毛病，很容易出现那种写爽了的状态。我把删掉的那部分内容，我干脆移到评论区里，因为那部分内容容易让人感觉有点危言耸听，不过这轮危机确实严重，逻辑得说清楚，不然有人会问：以前不也5%吗，以前不也倒过银行吗，这次凭什么不一样？跟2023年比。2023年10月，10年期美债也摸过5%。后来为什么没炸？逆回购还有2.5万亿，准备金充裕，AI叙事刚接棒，美联储还能降息。所以那时候的5%是利率周期的顶，不是信用风险的暴露。问题是“利率太高”，不是“信用要崩”。现在这四条全反了。逆回购只剩3517亿，准备金在缩，AI自己开始踩刹车，美联储不能降息还可能被迫加息。同样是5%，2023年是歇一歇还能跑，现在是跑不动了还得抽血。另外，这一轮危机。实质也并没有解决，靠着AI拉起来的行情，AI带来的泡沫化繁荣。把问题送往了明天，也就是现在，当然问题变得更大了。跟2008年比。2008年是单点内爆，毒在次贷、MBS、CDO里。你知道毒在哪，可以剥离，可以注资，可以压力测试。美联储有TARP，有零利率，有QE。居民端有缓冲，海外官方还在买美债。所以虽然惨，但有救市空间，有工具，有外部接盘的人。现在没有标的。债务不是基于某个可估值的资产，是借新还旧、福利承诺、腐败分肥、失败的军事账单堆出来的。你没法像2008年那样买下有毒资产，因为没有单一的有毒资产可以买。它弥漫在每一张债券、每一份养老金、每一个账户里。信用一旦崩，没法剥离，没法隔离，没法重组。而且2008年是单点，这次是六维绞合：股、债、汇、通胀、储蓄、财政同时出问题，互相递刀子。救市工具呢？货币端降息怕通胀，财政端救助怕赤字，外部端买家在撤退。三条路全堵着。跟大萧条比。大萧条全球GDP不到1万亿，债务主要是企业债和银行信贷，规模有限。有标的，有金本位做锚，知道该关谁、该救谁、该重组什么。现在全球总债务接近全球GDP的308%，金融衍生品是实物贸易的数十倍。不是一个市场的泡沫，是整个信用货币体系的底层债务同时膨胀到没法用任何单一手段消化的规模。没有金本位，没有实物锚，连无风险资产这个锚本身都在被重新定价。核心区别就是：2023年是利率周期问题，有降息空间，有缓冲。2008年是单点信用内爆，有标的，有工具，有外部接盘。大萧条是金本位下的通缩，有锚，有参照系。这次是信用周期问题，债务太高，居民缓冲归零，海外买家撤退，AI估值和融资同时承压，通胀焊死降息空间。没有标的，没有锚，没有工具，没有外部接盘。货币端、财政端、外部端三重锁死。过去是周期性回调，有底可抄，有药可吃。这次是结构性清算，没缓冲，没工具，没人接盘。当不是说明天就崩。更可能是政策强行干预制造波动，市场在几个临界点之间反复撕扯，直到某个引信先断。然后慢刀子割肉突然变成急性爆发。危机是否到来，是从哪个节点先崩、怎么传导、崩多快的问题。到这里，我是真不太希望老美这轮炸了，因为点燃的火药桶有点太大了。这可是自信用货币以来，积累到相当于GDP308%的全球负债。", "excerpt": "说起来写这一篇，我又犯了贪大求全的毛病。前前后后写下来快3万字了，又往回删了不少的内容，还是有2万多字，干脆拦腰切断，把另外一部分自己的偏推演的社会学框架推演的内容当做下一篇，明天或者后天发。偶尔确实会犯这种毛病，很容易出现那种写爽了的状态。我把删掉的那部分内容，我干脆移到评论区里，因为那部分内容容易让人感觉有点危言耸听，不过这轮危机确实严重，逻辑得说清楚，不然有人会问：以前不也5%吗，以前不也倒", "url": "https://www.zhihu.com/pin/2083187926012376182", "votes": 0, "comments": 1, "feed_ts": 1789450705, "feed_time_str": "09-15 13:38", "category": "pin", "cat_name": "想法动态"}, {"actor": "于朝阳", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "从暴雪到育碧，感觉这些大厂都已不复往日光彩，欧美游戏行业近几年到底怎么了？", "excerpt": "因为在各种技术壁垒被打破以后， 游戏开发业就像棉花种植园一样，变成了高度劳动密集型的产业，而美厂随着通胀暴涨的人工成本已经快把他们逼到绝境了。我就说一组数字吧。 在比利时开发的博德之门3，成本是1亿刀左右，捷克的天国拯救只有4100w，韩国的剑星猜测是5000w甚至更低，法环没公开数据，猜测也是1亿上下。 美国西海岸开发的蜘蛛侠2是3亿刀，地平线2是2亿刀。为什么差距这么大呢？ 占研发成本60%-", "url": "https://www.zhihu.com/question/5203224038/answer/2082034024965587665", "votes": 351, "comments": 43, "feed_ts": 1789450607, "feed_time_str": "09-15 13:36", "category": "geo", "cat_name": "地缘 · 经济 · 能源"}, {"actor": "黄胖胖", "verb": "MEMBER_CREATE_ARTICLE", "verb_cn": "发表了文章", "title": "几个危险的信号正在闪烁：10年期美债收益率摸着5%，AI巨头烧钱烧不动了，日本国债收益率摸到3%", "excerpt": "大约在8月24号的时候，我发过一篇自6月份以来的回顾和总结。 我对老美现在的经济稳定性向来持一个很悲观的态度。基于老美的经济，已经蔓延到整个信用货币系统组织起来的西方发达经济体的经济，甚至全球的经济，说实话，老美这一块引爆的话都不会太乐观。 然后也就是这几天，几个关键性的指标和新闻出来了。一个是老美的10年期美债收益率也成功跳过了5%，一个是日本那边，好像也摸到了3%。最后呢，AI的企业们好像有点", "url": "https://zhuanlan.zhihu.com/p/2083181138554761429", "votes": 95, "comments": 21, "feed_ts": 1789450040, "feed_time_str": "09-15 13:27", "category": "ai", "cat_name": "AI · 技术 · 算法"}, {"actor": "大水哥", "verb": "MEMBER_ANSWER_QUESTION", "verb_cn": "回答了问题", "title": "长平之战赵国真的必输吗?", "excerpt": "1804三反中，拿破仑打出乌尔姆合围，靠行军就全歼了乌尔姆的奥军主力。 自称自己上去比赵括强的知乎军事家比马克的水平还要差，这点是毫无疑问的。换知乎军事家上，任何一个人都可以靠行军打赢战役，建制、士气、体力、军队状态完好无损，可以继续下一步的军事行动。 奥斯特里茨虽然拿破仑打出了歼灭战的效果，但是因为法军也极度疲惫，只能放弃追击接受和谈。 战场上没有绝对的必胜或者必败，劣势局面把对面的持续作战能力", "url": "https://www.zhihu.com/question/1893340816124126757/answer/2083182058612975177", "votes": 19, "comments": 1, "feed_ts": 1789449307, "feed_time_str": "09-15 13:15", "category": "other", "cat_name": "社会 · 文化 · 其他"}, {"actor": "飞鱼,千秋一粟", "verb": "MEMBER_VOTEUP_ANSWER", "verb_cn": "赞了回答", "title": "如何看待波兰外长「俄罗斯继续战争迟早沦为中国的附庸」的言论，背后还有哪些细节值得关注？", "excerpt": "中国在俄乌战争这场冲突中获得的收益如下: 1.牵制了中国主要敌人美国的注意力和军力，削弱了美国主要盟友欧盟国家的力量。俄乌战争爆发前的世界态势是什么样呢？美欧联手正在通过新疆问题向中国联合施压。俄乌战争使得欧美对中国的战略压力大大减弱，使得中国获得宝贵的发展时间。 2.间接支援了伊朗，动摇了美国的世界霸权。俄乌战争不仅大量消耗美国欧盟军火，还让美国和欧洲盟友关系产生嫌隙，为随后而来的美以伊战争，伊", "url": "https://www.zhihu.com/question/2082828078619813303/answer/2083089278444295623", "votes": 136, "comments": 33 function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function renderByCategory() {
  const cats = {};
  for (const k of catKeys) cats[k] = [];
  for (const p of postsData) {
    if (cats[p.category]) cats[p.category].push(p);
  }
  let h = '';
  for (const k of catKeys) {
    const items = cats[k];
    if (items.length === 0) continue;
    const color = catColors[k];
    h += '<h2 style="--cat-color:' + color + '">' + catOrder[k] + '（' + items.length + '条）</h2>';
    for (const p of items) {
      const icon = verbIcon[p.verb] || '•';
      h += '<div class="item"><div class="meta"><span class="actor">' + esc(p.actor) + '</span>'

  }
  document.getElementById('posts-container').innerHTML = h;
}

      + '<span class="time">' + p.feed_time_str + '</span></div>'
      + '<a href="' + p.url + '" target="_blank">' + esc(p.title.slice(0,100)) + '</a>'
      + '<div class="stats"><span>👍 ' + p.votes + '</span><span>💬 ' + p.comments + '</span></div>'
      + '<div class="excerpt">' + esc(p.excerpt.slice(0,200)) + '</div></div>';
  }
  document.getElementById('posts-container').innerHTML = h;
}

function toggleView() {
  const btn = document.getElementById('viewToggle');
  if (currentView === 'category') {
    currentView = 'time';
    btn.textContent = '🏷️ 按话题分类';
    renderByTime();
  } else {
    currentView = 'category';
    btn.textContent = '📅 按时间排列';
    renderByCategory();
  }
}

// Initial render (category grouped)
renderByCategory();
</script></body></html>
